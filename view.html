<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品查看 · 太阳系模型对比</title>
<link rel="stylesheet" href="assets/site.css">
<script src="assets/i18n.js"></script>
</head>
<body>
<div class="viewer">
  <div class="vbar">
    <a class="back" href="index.html">← 返回</a>
    <h1 id="ttl">—</h1>
    <span class="grp" id="grp">—</span>
    <span id="tags" style="display:flex;gap:6px"></span>
    <span class="sp"></span>
    <div class="lang-switch" role="group" aria-label="语言 / Language">
      <button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button>
    </div>
    <button class="btn" id="reload">重新加载</button>
    <a class="btn" id="raw" target="_blank" rel="noopener">新标签页打开</a>
    <a class="btn" id="dl" download>下载源码</a>
  </div>
  <div class="stage" id="stage"></div>
</div>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
  const S=window.SITE, $=S.$;
  const id=new URLSearchParams(location.search).get('w');
  const w=S.byId(id);
  const stage=$('#stage');

  if(!w){
    stage.innerHTML='<div class="gate"><div class="box"><h2>找不到这个作品</h2>'+
      '<p>链接可能不完整。</p><a class="go" href="index.html">回到首页</a></div></div>';
    throw 0;
  }

  document.title=w.model+' · '+(w.group==='A'?'一句话':'详细文档');
  $('#ttl').textContent=w.model;
  const g=$('#grp'); g.textContent=w.group==='A'?'一句话提示':'详细文档';
  g.className='grp '+(w.group==='A'?'a':'b');
  $('#raw').href=w.file; $('#dl').href=w.file;
  $('#dl').setAttribute('download', w.id+'.html');

  S.detect();
  const risk=S.workRisk(w);
  $('#tags').innerHTML=S.chips(w,risk).replace('<div class="chips">','').replace('</div>','');

  const bars=[];
  if(w.net&&w.net.length) bars.push(['net',
    '这件作品运行时会从 '+S.esc(w.net.join('、'))+' 拉取资源，断网或内网环境下将无法正常显示。']);
  if(w.issue) bars.push(['bad','已知问题 · '+S.esc(w.issue)+
    ' — 这是该作品自身的渲染结果，已在真实浏览器中复核。']);
  if(w.note) bars.push(['note','· '+S.esc(w.note)]);
  bars.forEach(([kind,html])=>{
    const bar=document.createElement('div');
    const c = kind==='bad' ? 'background:rgba(255,107,107,.08);color:#ffb4b4'
            : kind==='net' ? 'background:rgba(255,201,120,.07);color:var(--gold)'
            : 'background:rgba(140,160,210,.06);color:var(--dim)';
    bar.style.cssText='padding:10px 18px;font-size:12.5px;border-bottom:1px solid var(--line);'+c;
    bar.innerHTML=(kind==='net'?'⚠ 需联网 · ':kind==='bad'?'⚠ ':'')+html;
    stage.parentNode.insertBefore(bar,stage);
  });

  let frame=null;
  function load(){
    unload();
    stage.insertAdjacentHTML('beforeend',
      '<div class="gate" id="ld"><div class="box"><div class="spin"></div>'+
      '<p>正在加载 '+S.esc(w.model)+'（'+S.kb(w.bytes)+'）…</p></div></div>');
    frame=document.createElement('iframe');
    frame.setAttribute('title',w.model+' 的太阳系模型');
    frame.onload=()=>{ const l=$('#ld'); if(l) l.remove(); };
    frame.src=w.file;
    stage.appendChild(frame);
  }
  // 置空 src 才会真正释放 WebGL 上下文；直接 remove 在部分浏览器上回收不及时
  function unload(){
    if(frame){ try{frame.src='about:blank';}catch(e){} frame.remove(); frame=null; }
    const l=$('#ld'); if(l) l.remove();
  }

  function gate(msg,sub){
    stage.innerHTML='<div class="gate"><div class="box"><h2>'+msg+'</h2><p>'+sub+'</p>'+
      '<p style="font-size:12px;color:var(--dim2);margin-top:10px">体积 '+S.kb(w.bytes)+
      ' · '+(w.tech==='WebGL2'?'原生 WebGL2':S.esc(w.tech))+
      ' · '+(w.weight==='heavy'?'重量级':w.weight==='medium'?'中等':'轻量')+'</p>'+
      '<button class="go" id="goBtn">仍然运行</button></div></div>';
    $('#goBtn').onclick=load;
  }

  // 仅在设备确有兼容性风险时提示；作品重量不再触发确认步骤
  if(risk&&risk.lv==='bad'){
    gate('你的设备可能无法正常运行这件作品',
      risk.code==='noFloat'
        ? '这件作品依赖 EXT_color_buffer_float 浮点帧缓冲，而你的浏览器不支持——它很可能直接白屏。'
        : '实测你的 GPU 负载能力偏低，这件作品预计会非常卡。');
  } else if(risk&&risk.lv==='warn'){
    gate('这件作品可能运行不流畅','实测当前设备运行它时可能掉帧，确认后再运行。');
  } else {
    load();
  }

  $('#reload').onclick=load;
  addEventListener('pagehide',unload);
  addEventListener('beforeunload',unload);
})();
</script>
</body>
</html>
