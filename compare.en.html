<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Side-by-Side Comparison · Solar System Model Comparison</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="viewer">
  <div class="vbar">
    <a class="back" href="index.en.html#pairs">← Back</a>
    <h1 id="ttl">—</h1>
    <span style="font-size:12px;color:var(--dim);white-space:nowrap">Same model · Two requirement formats</span>
    <span class="sp"></span>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button class="btn" id="mode">Single-side mode: Off</button>
    <button class="btn" id="reload">Reload</button>
  </div>
  <div class="split" id="split">
    <div><span class="lbl a">One-line prompt</span><div class="gate" id="gA"></div></div>
    <div><span class="lbl b">Detailed specification</span><div class="gate" id="gB"></div></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
  const S=window.SITE,$=S.$;
  const pid=new URLSearchParams(location.search).get('p');
  const pair=S.pairs().find(p=>p.a.pair===pid);
  const split=$('#split');

  if(!pair){
    split.innerHTML='<div class="gate"><div class="box"><h2>Comparison not found</h2>'+
      '<a class="go" href="index.en.html">Back to home</a></div></div>';
    throw 0;
  }

  document.title=pair.a.model+' · Side-by-Side Comparison';
  $('#ttl').textContent=pair.a.model;
  $('#ttl').title=S.workText(pair.a,'title')+' / '+S.workText(pair.b,'title');
  S.detect();

  const cells=[...split.children];
  const st=[{w:pair.a,cell:cells[0],frame:null},{w:pair.b,cell:cells[1],frame:null}];

  function unload(s){
    if(s.frame){try{s.frame.src='about:blank';}catch(e){}s.frame.remove();s.frame=null;}
  }

  function load(s){
    if(s.frame)return;
    const g=$('.gate',s.cell);if(g)g.remove();
    const f=document.createElement('iframe');
    f.setAttribute('title',s.w.model+' ('+(s.w.group==='A'?'one-line prompt':'detailed specification')+')');
    f.src=s.w.file;s.frame=f;s.cell.appendChild(f);
  }

  function gate(s){
    unload(s);
    let g=$('.gate',s.cell);
    if(!g){g=document.createElement('div');g.className='gate';s.cell.appendChild(g);}
    const risk=S.workRisk(s.w);
    const title=S.workText(s.w,'title');
    g.innerHTML='<div class="box"><h2 style="font-size:15px">'+S.esc(s.w.model)+'</h2>'+
      (title?'<p style="font-size:12px;color:var(--dim)">'+S.esc(title)+'</p>':'')+
      '<p style="font-size:12.5px">'+(s.w.tech==='WebGL2'?'Native WebGL2':S.esc(s.w.tech))+
      ' · '+S.kb(s.w.bytes)+' · '+s.w.lines+' lines'+
      (risk?' · <span style="color:var(--gold)">'+S.esc(risk.t)+'</span>':'')+'</p>'+
      '<button class="go">Run this side</button></div>';
    $('button',g).onclick=()=>load(s);
  }

  let single=false;
  function apply(){
    if(single){st.forEach(gate);}
    else{st.forEach(s=>{const r=S.workRisk(s.w);(r&&r.lv==='bad')?gate(s):load(s);});}
  }

  st.forEach(s=>{
    s.cell.addEventListener('mouseenter',()=>{
      if(!single)return;
      st.forEach(o=>{if(o!==s){unload(o);gate(o);}});
      load(s);
    });
  });

  $('#mode').onclick=()=>{
    single=!single;
    $('#mode').textContent='Single-side mode: '+(single?'On':'Off');
    apply();
  };
  $('#reload').onclick=()=>{st.forEach(unload);apply();};

  apply();
  addEventListener('pagehide',()=>st.forEach(unload));
})();
</script>
</body>
</html>
