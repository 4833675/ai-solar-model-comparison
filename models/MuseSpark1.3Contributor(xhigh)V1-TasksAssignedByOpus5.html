<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>太阳系实时运动模型</title>
<style>
:root{
  --glass:rgba(10,14,22,.62); --glass2:rgba(14,20,32,.55);
  --line:rgba(150,180,220,.16); --line2:rgba(150,180,220,.28);
  --txt:#dfe8f5; --dim:#8fa0b8; --faint:#5c6b84;
  --acc:#7fd4ff; --acc2:#ffd27f; --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);
  font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c:active{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
#labels span{position:absolute;transform:translate(-50%,-140%);font-size:11px;letter-spacing:.18em;
  color:#cfe2f7;text-shadow:0 0 6px rgba(0,0,0,.9),0 1px 2px #000;white-space:nowrap}
#labels span.moon{font-size:10px;letter-spacing:.1em;color:#a9bcd4}
.panel{position:fixed;z-index:5;background:var(--glass);border:1px solid var(--line);border-radius:12px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 32px rgba(0,0,0,.45)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* 左侧列表 */
#left{left:12px;top:12px;bottom:86px;width:172px;padding:10px 8px;overflow-y:auto;scrollbar-width:thin}
#left h4{font-size:10px;letter-spacing:.3em;color:var(--faint);font-weight:600;padding:8px 8px 4px}
#left button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--txt);
  font-size:12.5px;letter-spacing:.08em;padding:5px 10px;border-radius:7px;cursor:pointer}
#left button:hover{background:rgba(127,212,255,.12)}
#left button.on{background:rgba(127,212,255,.18);color:#fff}
#left button.moon{padding-left:24px;color:var(--dim);font-size:12px}
#left button.dwarf{color:var(--acc2)}
/* 右侧信息卡 */
#right{right:12px;top:12px;width:288px;max-height:calc(100% - 178px);overflow-y:auto;padding:14px 15px;scrollbar-width:thin}
#right h2{font-size:17px;letter-spacing:.12em;font-weight:650}
#right .sub{font-size:11px;color:var(--dim);letter-spacing:.2em;margin:2px 0 10px}
#right h5{font-size:10px;letter-spacing:.3em;color:var(--faint);font-weight:600;margin:12px 0 5px;
  border-top:1px solid var(--line);padding-top:10px}
#right table{width:100%;border-collapse:collapse;font-size:12px}
#right td{padding:2.5px 0;vertical-align:top}
#right td.k{color:var(--dim);white-space:nowrap;padding-right:8px}
#right td.v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:#eaf2fd}
#right .blurb{font-size:12px;color:#c3cfdf;line-height:1.7}
#right .warn{display:none;margin-top:10px;font-size:11.5px;color:#ffb4b4;background:rgba(255,90,90,.1);
  border:1px solid rgba(255,120,120,.35);border-radius:8px;padding:6px 9px;letter-spacing:.04em}
/* 底部时间条 */
#bottom{left:50%;transform:translateX(-50%);bottom:12px;display:flex;align-items:center;gap:10px;
  padding:9px 16px;white-space:nowrap}
#bottom button{background:rgba(127,212,255,.1);border:1px solid var(--line2);color:var(--txt);
  border-radius:8px;min-width:34px;height:30px;font-size:14px;cursor:pointer;padding:0 9px}
#bottom button:hover{background:rgba(127,212,255,.22)}
#date{font-size:13px;letter-spacing:.06em;min-width:176px;text-align:center}
#speedv{min-width:96px;text-align:right;font-size:12px;color:var(--acc)}
input[type=range]{-webkit-appearance:none;width:190px;height:4px;border-radius:2px;background:rgba(150,180,220,.3);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--acc);box-shadow:0 0 8px rgba(127,212,255,.8);cursor:pointer}
/* 右下开关 */
#toggles{right:12px;bottom:12px;padding:9px 10px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
#toggles label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer;
  padding:3px 6px;border-radius:6px;letter-spacing:.06em}
#toggles label:hover{background:rgba(127,212,255,.08);color:var(--txt)}
#toggles input{accent-color:var(--acc)}
/* 顶部提示 */
#note{left:50%;transform:translateX(-50%);top:12px;padding:6px 16px;font-size:11.5px;letter-spacing:.08em;
  color:var(--dim);display:flex;gap:14px;align-items:center;max-width:70vw}
#note b{color:var(--acc2);font-weight:600}
#extrap{left:50%;transform:translateX(-50%);top:52px;padding:5px 14px;font-size:11.5px;letter-spacing:.1em;
  color:#ffc9c9;border-color:rgba(255,120,120,.4);display:none}
#fps{position:fixed;left:14px;bottom:14px;z-index:5;font-size:10.5px;color:var(--faint);letter-spacing:.08em}
#err{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:9;display:none;max-width:80vw;
  background:rgba(80,10,10,.85);border:1px solid #f66;color:#ffd;border-radius:8px;padding:8px 14px;font-size:12px}
body.hideui .panel,body.hideui #labels,body.hideui #fps{display:none}
@media (max-width:900px){ #right{display:none} #left{width:132px} #note{display:none} }
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(150,180,220,.25);border-radius:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="left" class="panel"></div>
<div id="right" class="panel"></div>
<div id="note" class="panel"><span>距离经幂律压缩 <b>r′=34·r<sup>0.62</sup></b> · 角位置 / 相位 / 周期精确</span><span id="cmph">压缩 0.62</span></div>
<div id="extrap" class="panel">已超出根数有效区间 1800–2050（外推）</div>
<div id="bottom" class="panel">
  <button id="play" title="播放/暂停（空格）">⏸</button>
  <span id="date" class="num">—</span>
  <input id="spd" type="range" min="-100" max="100" step="1" value="65" title="时间速度（←/→）">
  <span id="speedv" class="num">—</span>
  <button id="now" title="跳回此刻">此刻</button>
</div>
<div id="toggles" class="panel"></div>
<div id="fps" class="num"></div>
<div id="err"></div>

neptune:{n:"海王星",r:24622,m:"1.024×10²⁶",p:"164.8 年",mo:"16",t:"−201 ℃",atmo:"氢 80% · 氦 19% · 甲烷 1%",
  b:"先由勒维耶笔算预言、后被望远镜找到的行星。拥有太阳系最强的风暴风（可达 2100 km/h）。海卫一是唯一逆行的大卫星，可能是一颗被捕获的柯伊伯带天体。"},
pluto:{n:"冥王星",r:1188.3,m:"1.303×10²²",p:"247.9 年",mo:"5",t:"−233 ~ −223 ℃",atmo:"氮 · 甲烷 · 一氧化碳（稀薄）",
  b:"心形冰原斯普特尼克平原是它的标志，那里是氮冰川在对流翻滚。冥卫一质量达到它的一成，两者围绕共同质心起舞，更像一对双矮行星。"}};
/* ---------------- 2.4 卫星 [母行星,半径km,轨道半径km,周期天(负=逆行),倾角°,参考面] ---------------- */
const MOONS=[
 ["moon","earth","月球",1737.4,384400,27.32166,5.145,"ecl"],
 ["io","jupiter","木卫一 · 伊俄",1821.6,421700,1.769138,0.05,"eq"],
 ["europa","jupiter","木卫二 · 欧罗巴",1560.8,671034,3.551181,0.47,"eq"],
 ["ganymede","jupiter","木卫三 · 加尼美德",2634.1,1070412,7.154553,0.20,"eq"],
 ["callisto","jupiter","木卫四 · 卡利斯托",2410.3,1882709,16.6890,0.19,"eq"],
 ["titan","saturn","土卫六 · 泰坦",2574.7,1221870,15.945,0.35,"eq"],
 ["triton","neptune","海卫一 · 特里同",1353.4,354759,-5.876854,156.9,"eq"],
 ["charon","pluto","冥卫一 · 卡戎",606,19591,6.3872,0.08,"eq"]];
/* 哈雷彗星 1P/Halley */
const HALLEY={a:17.834,e:0.96714,I:162.26,w:111.33,Om:58.42,Tp:2446470.96,P:27512.6};
/* 天体类型(片元着色分支):0岩质 1月球 2地球 3金星 4火星 5气巨 6冰巨 7欧罗巴 8伊俄 9加尼美德 10泰坦 11冥王 12灰卫 */
const BODIES=[
 {k:"sun",t:-1},
 {k:"mercury",t:0},{k:"venus",t:3},{k:"earth",t:2},{k:"mars",t:4},
 {k:"jupiter",t:5},{k:"saturn",t:5},{k:"uranus",t:6},{k:"neptune",t:6},{k:"pluto",t:11},
 {k:"moon",t:1},{k:"io",t:8},{k:"europa",t:7},{k:"ganymede",t:9},{k:"callisto",t:12},
 {k:"titan",t:10},{k:"triton",t:12},{k:"charon",t:12}];
const MNAME={sun:"太阳",mercury:"水星",venus:"金星",earth:"地球",mars:"火星",jupiter:"木星",
 saturn:"土星",uranus:"天王星",neptune:"海王星",pluto:"冥王星",moon:"月球",io:"木卫一",europa:"木卫二",
 ganymede:"木卫三",callisto:"木卫四",titan:"土卫六",triton:"海卫一",charon:"冥卫一",halley:"哈雷彗星"};
/* ================= 3.1–3.5 轨道力学 ================= */
function jdFromMs(ms){ return ms/DAY + 2440587.5; }
function normPi(a){ a%=TAU; if(a>Math.PI)a-=TAU; if(a<-Math.PI)a+=TAU; return a; }
function keplerE(M,e){
  M=normPi(M);
  let E=M+e*Math.sin(M)*(1+e*Math.cos(M));
  for(let i=0;i<10;i++){ const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E)); E-=d; if(Math.abs(d)<1e-13)break; }
  return E;
}
/* 六根数→黄道直角坐标(AU)。返回 {x,y,z,r,lon,lat,a,e} */
function elemPos(el,jd){
  const T=(jd-J2000)/36525;
  const a=el[0]+el[6]*T, e=el[1]+el[7]*T;
  const I=(el[2]+el[8]*T)*D2R, L=(el[3]+el[9]*T)*D2R;
  const lp=(el[4]+el[10]*T)*D2R, Om=(el[5]+el[11]*T)*D2R;
  const w=lp-Om, M=normPi(L-lp), E=keplerE(M,e);
  const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(Math.max(0,1-e*e))*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I),sI=Math.sin(I);
  const x=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp;
  const y=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp;
  const z=(sw*sI)*xp+(cw*sI)*yp;
  const r=Math.hypot(x,y,z);
  return {x,y,z,r,a,e,lon:((Math.atan2(y,x)*R2D)%360+360)%360,lat:Math.asin(clamp(z/r,-1,1))*R2D};
}
function halleyPos(jd){
  const M=TAU*(jd-HALLEY.Tp)/HALLEY.P;
  const E=keplerE(M,HALLEY.e);
  const xp=HALLEY.a*(Math.cos(E)-HALLEY.e), yp=HALLEY.a*Math.sqrt(1-HALLEY.e*HALLEY.e)*Math.sin(E);
  const w=HALLEY.w*D2R, Om=HALLEY.Om*D2R, I=HALLEY.I*D2R;
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I),sI=Math.sin(I);
  const x=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp;
  const y=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp;
  const z=(sw*sI)*xp+(cw*sI)*yp;
  const r=Math.hypot(x,y,z);
  return {x,y,z,r,a:HALLEY.a,e:HALLEY.e,lon:((Math.atan2(y,x)*R2D)%360+360)%360,lat:Math.asin(clamp(z/r,-1,1))*R2D};
}
/* 黄道→世界 (x_ecl, z_ecl, −y_ecl)，保持右手性 */
function ecl2world(x,y,z){ return [x,z,-y]; }
/* 显示压缩：方向不变，只压缩径向 */
const SCALE=34;
let COMP=0.62, COMP_T=0.62, compAnimT=1;
function compressPos(ecl,out){
  const r=Math.hypot(ecl[0],ecl[1],ecl[2])||1e-9;
  const rd=SCALE*Math.pow(r,COMP);
  const w=ecl2world(ecl[0]/r,ecl[1]/r,ecl[2]/r);
  out[0]=w[0]*rd; out[1]=w[1]*rd; out[2]=w[2]*rd;
  return rd;

function updateRibbon(rb,pts,n,bodyS,kTrail,closed){
  const P=rb.P,T=rb.T,S=rb.S;
  for(let i=0;i<n;i++){

    let tx=pts[inx]-pts[ip],ty=pts[inx+1]-pts[ip+1],tz=pts[inx+2]-pts[ip+2];

/* 环网格(局部 XZ 平面,半径以母行星半径为单位;密度片元解析,径向2段足够) */
function buildRingMesh(rIn,rOut){
  const NA=256, pos=[], idx=[];
  for(let ir=0;ir<=2;ir++){ const r=rIn+(rOut-rIn)*ir/2;
    for(let i=0;i<=NA;i++){ const t=i/NA*TAU; pos.push(r*Math.cos(t),0,r*Math.sin(t)); } }
  for(let ir=0;ir<2;ir++)for(let i=0;i<NA;i++){
    const a=ir*(NA+1)+i,b=a+NA+1; idx.push(a,b,a+1, b,b+1,a+1); }
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  const eb=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,eb);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return {vao,count:idx.length};
}

const _e=[0,0,0], _w=[0,0,0];
function updateBodies(jd,dtDays){
  for(const k of PLANET_KEYS){
    const B=SIM.bodies[k], p=elemPos(ELEM[k],jd);
    B.r=p.r;B.lon=p.lon;B.lat=p.lat;B.a=p.a;B.e=p.e;
    _e[0]=p.x;_e[1]=p.y;_e[2]=p.z;
    compressPos(_e,B.world);
    B.ecl=[p.x,p.y,p.z];
    /* 自转:每帧增量 clamp ±0.22 (7.11) */
    const perD=SPIN[k].rotH/24;
    B.phase+=clamp(TAU*dtDays/perD,-0.22,0.22);
    B.sunI=sunIntensity(p.r);
  }
  SIM.sunWorld=[0,0,0];
  const Sb=SIM.bodies.sun; Sb.world=[0,0,0];
  /* 哈雷 */
  const h=halleyPos(jd);
  compressPos([h.x,h.y,h.z],_w);
  SIM.halley={r:h.r,lon:h.lon,lat:h.lat,a:h.a,e:h.e,ecl:[h.x,h.y,h.z],world:[_w[0],_w[1],_w[2]]};
  /* 卫星显示距离(3.7):按母行星分组 */
  const byP={};
  for(const k in SIM.moons){ const m=SIM.moons[k]; (byP[m.pk]=byP[m.pk]||[]).push(k); }
  for(const pk in byP){
    const P=SIM.bodies[pk], ks=byP[pk];
    let a0=Infinity; for(const k of ks) a0=Math.min(a0,SIM.moons[k].ar);
    const ring=RINGS[pk]; const ringOut=ring?ring.out:0;
    let innerR=Infinity; for(const k of ks) innerR=Math.min(innerR,SIM.moons[k].R);
    const base=Math.max(2.35, ringOut + innerR/P.R + 0.55);
    for(const k of ks){ const m=SIM.moons[k];
      m.d=P.R*base*Math.pow(m.ar/a0,0.55);
      /* 方向:周期符号×倾角>90翻转(海卫一保持逆行) */
      const sgn=Math.sign(m.per)*(m.inc>90?-1:1)||1;
      const th=m.th0+sgn*TAU*(jd-J2000)/Math.abs(m.per);
      let lx=Math.cos(th)*m.d, ly=0, lz=Math.sin(th)*m.d;
      const ic=m.inc*D2R, ci=Math.cos(ic), si=Math.sin(ic);
      const y2=ly*ci-lz*si, z2=ly*si+lz*ci; ly=y2;lz=z2;
      if(m.ref==="ecl"){ m.world=[P.world[0]+lx,P.world[1]+ly,P.world[2]+lz]; }
      else { const B=P.basis;
        m.world=[P.world[0]+B.X[0]*lx+B.Y[0]*ly+B.Z[0]*lz,
                 P.world[1]+B.X[1]*lx+B.Y[1]*ly+B.Z[1]*lz,
                 P.world[2]+B.X[2]*lx+B.Y[2]*ly+B.Z[2]*lz];
      }
      m.lon=((Math.atan2(lz,lx)*R2D)%360+360)%360;
    }
  }
}

function rebuildOrbits(jd){

    const p0=elemPos(el,jd);
    /* 当前偏近点角→bodyS */
    const T=(jd-J2000)/36525;
    const a=el[0]+el[6]*T, e=el[1]+el[7]*T;
    const I=(el[2]+el[8]*T)*D2R, L=(el[3]+el[9]*T)*D2R;
    const lp=(el[4]+el[10]*T)*D2R, Om=(el[5]+el[11]*T)*D2R;
    const w=lp-Om, M=normPi(L-lp), E=keplerE(M,e);
    const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I),sI=Math.sin(I);
    for(let i=0;i<n;i++){

      const x=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp;
      const y=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp;
      const z=(sw*sI)*xp+(cw*sI)*yp;
      compressPos([x,y,z],_w);

    }
    updateRibbon(rb,_pts,n,((E%TAU)+TAU)%TAU/TAU,4.0,true);

  /* 哈雷:按 E 均匀采样(避开高偏心 V 角) */
  { const rb=ribbons.halley,n=400;
    const w=HALLEY.w*D2R,Om=HALLEY.Om*D2R,I=HALLEY.I*D2R;
    const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I),sI=Math.sin(I);
    const M=TAU*(jd-HALLEY.Tp)/HALLEY.P, E=keplerE(M,HALLEY.e);

      const x=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp;
      const y=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp;
      const z=(sw*sI)*xp+(cw*sI)*yp;
      compressPos([x,y,z],_w);
      _ptsH[i*3]=_w[0];_ptsH[i*3+1]=_w[1];_ptsH[i*3+2]=_w[2];
    }
    updateRibbon(rb,_ptsH,n,((E%TAU)+TAU)%TAU/TAU,2.5,true);
  }
  /* 卫星圈 */
  for(const k in SIM.moons){
    const m=SIM.moons[k],P=SIM.bodies[m.pk],rb=moonRibbons[k],n=128;
    const ic=m.inc*D2R,ci=Math.cos(ic),si=Math.sin(ic);
    for(let i=0;i<n;i++){ const t=i/n*TAU;
      let lx=Math.cos(t)*m.d,ly=0,lz=Math.sin(t)*m.d;
      const y2=ly*ci-lz*si,z2=ly*si+lz*ci;ly=y2;lz=z2;
      if(m.ref==="ecl"){ _ptsM[i*3]=P.world[0]+lx;_ptsM[i*3+1]=P.world[1]+ly;_ptsM[i*3+2]=P.world[2]+lz; }
      else { const B=P.basis;
        _ptsM[i*3]=P.world[0]+B.X[0]*lx+B.Y[0]*ly+B.Z[0]*lz;
        _ptsM[i*3+1]=P.world[1]+B.X[1]*lx+B.Y[1]*ly+B.Z[1]*lz;
        _ptsM[i*3+2]=P.world[2]+B.X[2]*lx+B.Y[2]*ly+B.Z[2]*lz; }
    }
    const sgn=Math.sign(m.per)*(m.inc>90?-1:1)||1;
    const th=(m.th0+sgn*TAU*(jd-J2000)/Math.abs(m.per));

function rebuildTails(){

  const hw=h.world, hl=Math.hypot(hw[0],hw[1],hw[2])||1;

  const h2=halleyPos(SIM.jd+0.5); compressPos([h2.x,h2.y,h2.z],_w);
  let vx=_w[0]-hw[0],vy=_w[1]-hw[1],vz=_w[2]-hw[2];
  const vl=Math.hypot(vx,vy,vz)||1; vx/=vl;vy/=vl;vz/=vl;

  const L=clamp(10*inten,2,26);

  const N=40;
  for(let i=0;i<N;i++){ const t=i/(N-1);
    _tailP[i*3]=hw[0]+anti[0]*L*t; _tailP[i*3+1]=hw[1]+anti[1]*L*t; _tailP[i*3+2]=hw[2]+anti[2]*L*t;

function postpass(P,dst,src1,src2){
  gl.bindFramebuffer(gl.FRAMEBUFFER,dst);
  gl.viewport(0,0,dst?viewW(dst):VW,dst?viewH(dst):VH);
  gl.useProgram(P);
  setTexUnits();
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src1);
  gl.uniform1i(P.U.uTex,0);
  if(src2&&P.U.uScene!==undefined){
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src2);
    /* P_COMP 用 uScene/uBloom,单独处理 */
  }
  gl.bindVertexArray(FSQ); gl.drawArrays(gl.TRIANGLES,0,3);
  setTexUnits();
}
const _fbSize=new Map();
function viewW(){ return VW; } function viewH(){ return VH; }
function postprocess(){
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  gl.depthMask(false);
  gl.disable(gl.BLEND);
  /* 阈值提取 scene->bloom[0] */
  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFBO[0]);
  gl.viewport(0,0,Math.max(8,VW>>1),Math.max(8,VH>>1));
  gl.useProgram(P_TH); setTexUnits();
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneTex);
  gl.uniform1i(P_TH.U.uTex,0);
  gl.bindVertexArray(FSQ); gl.drawArrays(gl.TRIANGLES,0,3);
  /* 降采样 13tap?此版用FS_DOWN 13采样 */
  for(let i=1;i<NBLOOM;i++){
    const w=Math.max(8,VW>>(i+1)),h=Math.max(8,VH>>(i+1));
    gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFBO[i]);
    gl.viewport(0,0,w,h);
    gl.useProgram(P_DOWN);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,bloomTex[i-1]);
    gl.uniform1i(P_DOWN.U.uTex,0);
    gl.bindVertexArray(FSQ); gl.drawArrays(gl.TRIANGLES,0,3);
  }
  /* 升采样:加法累加到 bloom[0](7.3:只读源,blend累加) */
  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFBO[0]);
  gl.viewport(0,0,Math.max(8,VW>>1),Math.max(8,VH>>1));
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.blendEquation(gl.FUNC_ADD);
  gl.useProgram(P_UP);
  for(let i=NBLOOM-1;i>=1;i--){
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,bloomTex[i]);
    gl.uniform1i(P_UP.U.uTex,0);
    gl.bindVertexArray(FSQ); gl.drawArrays(gl.TRIANGLES,0,3);
  }
  gl.disable(gl.BLEND);
  setTexUnits();
  /* 合成到默认帧缓冲 */
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,VW,VH);
  gl.useProgram(P_COMP); setTexUnits();
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,bloomTex[0]);
  gl.uniform1i(P_COMP.U.uScene,0); gl.uniform1i(P_COMP.U.uBloom,1);
  /* 太阳屏幕坐标+可见度(CPU遮挡判定,4.3) */
  const ss=sunScreen();
  gl.uniform3f(P_COMP.U.uSunS,ss[0],ss[1],ss[2]);
  gl.uniform1f(P_COMP.U.uTime,simT);
  gl.uniform2f(P_COMP.U.uRes,VW,VH);
  gl.uniform1f(P_COMP.U.uBloomOn,SIM.show.bloom?1:0);
  gl.bindVertexArray(FSQ); gl.drawArrays(gl.TRIANGLES,0,3);
  setTexUnits();
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
}
/* 太阳屏幕坐标与可见度:NDC→uv;行星遮挡比对屏幕距离与视半径+深度 */
function sunScreen(){
  camEye(EYE);
  /* 太阳在相机前方? */
  let fx=TGT[0]-EYE[0],fy=TGT[1]-EYE[1],fz=TGT[2]-EYE[2];
  const V=mLook(EYE,[CAM.tx,CAM.ty,CAM.tz],[0,1,0]);
  const VP2=mMul(mPersp(50*D2R,VW/VH,0.1,9000),V);
  function proj(p){
    const x=VP2[0]*p[0]+VP2[4]*p[1]+VP2[8]*p[2]+VP2[12];
    const y=VP2[1]*p[0]+VP2[5]*p[1]+VP2[9]*p[2]+VP2[13];
    const z=VP2[2]*p[0]+VP2[6]*p[1]+VP2[10]*p[2]+VP2[14];
    const w=VP2[3]*p[0]+VP2[7]*p[1]+VP2[11]*p[2]+VP2[15];
    return [x/w,y/w,z/w,w];
  }
  const s=proj([0,0,0]);
  if(s[3]<0) return [0.5,0.5,0];
  let vis=1;
  const su=s[0]*0.5+0.5, sv=s[1]*0.5+0.5;
  for(const k of PLANET_KEYS){ const B=SIM.bodies[k];
    const p=proj(B.world);
    if(p[3]<0||p[2]>s[2]) continue;
    const dx=(p[0]-s[0])*VW/VH, dy=p[1]-s[1];
    const sd=Math.hypot(dx,dy);
    const angR=B.R/Math.hypot(B.world[0]-EYE[0],B.world[1]-EYE[1],B.world[2]-EYE[2]);
    const angS=SIM.bodies.sun.R/Math.hypot(EYE[0],EYE[1],EYE[2]);
    if(sd<angR*2.2+angS) { vis*=0.15; }
  }
  const off=Math.hypot(su-0.5,sv-0.5);
  vis*=clamp(1.4-off*1.1,0,1);
  return [su,sv,vis];
}
/* ================= 相机交互 ================= */
function focusDist(k){
  const R=k==="sun"?SIM.bodies.sun.R:k==="halley"?1.2:(SIM.bodies[k]?SIM.bodies[k].R:SIM.moons[k].R);
  let extra=R*4;
  if(RINGS[k]) extra=Math.max(extra,SIM.bodies[k].R*RINGS[k].out*3.2);
  return Math.max(extra,R*4);
}
function flyTo(k){
  targetWorld(k,TGT);
  const d=focusDist(k);
  SIM.camTransition={t:0,dur:1.0,
    from:{tx:CAM.tx,ty:CAM.ty,tz:CAM.tz,dist:CAM.dist},
    to:{tx:TGT[0],ty:TGT[1],tz:TGT[2],dist:d}};
  SIM.focus=k; SIM.prevFocus=k;
}
function stepCamera(dtMs){
  const tr=SIM.camTransition; if(!tr) return;
  tr.t+=dtMs/1000;
  const t=sstep(0,1,Math.min(1,tr.t/tr.dur));
  CAM.tx=lerp(tr.from.tx,tr.to.tx,t); CAM.ty=lerp(tr.from.ty,tr.to.ty,t); CAM.tz=lerp(tr.from.tz,tr.to.tz,t);
  CAM.dist=lerp(tr.from.dist,tr.to.dist,t);
  /* 目标在运动:持续跟随 */
  targetWorld(SIM.focus,TGT);
  tr.to.tx=TGT[0];tr.to.ty=TGT[1];tr.to.tz=TGT[2];
  if(tr.t>=tr.dur){ CAM.tx=TGT[0];CAM.ty=TGT[1];CAM.tz=TGT[2]; SIM.camTransition=null; }
  else { CAM.tx=lerp(CAM.tx,TGT[0],0.0); }
}
(function bindInput(){
  let drag=false,lx=0,ly=0,pinch=0;
  cv.addEventListener("pointerdown",e=>{ drag=true;lx=e.clientX;ly=e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove",e=>{
    if(!drag) return;
    CAM.yaw-=(e.clientX-lx)*0.005; CAM.pitch=clamp(CAM.pitch+(e.clientY-ly)*0.005,-1.45,1.45);
    lx=e.clientX;ly=e.clientY; SIM.camTransition=null;
  });
  cv.addEventListener("pointerup",e=>{ drag=false; });
  cv.addEventListener("wheel",e=>{ e.preventDefault();
    CAM.dist=clamp(CAM.dist*Math.exp(e.deltaY*0.0011),0.5,3000); SIM.camTransition=null;
  },{passive:false});
  cv.addEventListener("touchmove",e=>{
    if(e.touches.length===2){ e.preventDefault();
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(pinch>0) CAM.dist=clamp(CAM.dist*pinch/d,0.5,3000);
      pinch=d; SIM.camTransition=null;
    } },{passive:false});
  cv.addEventListener("touchend",()=>pinch=0);
  /* 点击拾取:投影比对 */
  let downX=0,downY=0;
  cv.addEventListener("pointerdown",e=>{ downX=e.clientX;downY=e.clientY; });
  cv.addEventListener("pointerup",e=>{
    if(Math.hypot(e.clientX-downX,e.clientY-downY)>6) return;
    pick(e.clientX,e.clientY);
  });
  window.addEventListener("keydown",e=>{
    if(e.code==="Space"){ e.preventDefault(); togglePlay(); }
    else if(e.key==="ArrowRight"){ setSpd(SIM.spdV+5); }
    else if(e.key==="ArrowLeft"){ setSpd(SIM.spdV-5); }
    else if(e.key==="h"||e.key==="H"){ document.body.classList.toggle("hideui"); }
  });
})();
function pick(px,py){
  camEye(EYE);
  const V=mLook(EYE,[CAM.tx,CAM.ty,CAM.tz],[0,1,0]);
  const VP2=mMul(mPersp(50*D2R,VW/VH,0.1,9000),V);
  const r=cv.getBoundingClientRect();
  const nx=(px-r.left)/r.width*2-1, ny=1-(py-r.top)/r.height*2;
  let best=null,bd=1e9;
  const keys=["sun",...PLANET_KEYS,...Object.keys(SIM.moons),"halley"];
  for(const k of keys){
    if((SIM.moons[k])&&!SIM.show.moon) continue;
    if(k==="halley"&&(!SIM.show.comet||!SIM.halley||SIM.halley.r>6.5)) continue;
    targetWorld(k,TGT);
    const x=VP2[0]*TGT[0]+VP2[4]*TGT[1]+VP2[8]*TGT[2]+VP2[12];
    const y=VP2[1]*TGT[0]+VP2[5]*TGT[1]+VP2[9]*TGT[2]+VP2[13];
    const w=VP2[3]*TGT[0]+VP2[7]*TGT[1]+VP2[11]*TGT[2]+VP2[15];
    if(w<0) continue;
    const sx=x/w, sy=y/w;
    const R=k==="sun"?SIM.bodies.sun.R:(SIM.bodies[k]?SIM.bodies[k].R:(k==="halley"?1.2:SIM.moons[k].R));
    const dist=Math.hypot(TGT[0]-EYE[0],TGT[1]-EYE[1],TGT[2]-EYE[2]);
    const angR=Math.atan(R/dist);
    const angPx=angR/(50*D2R/2)*(r.height/2);
    const dx=(sx-nx)*r.width/2, dy=(sy-ny)*r.height/2;
    const dd=Math.hypot(dx,dy);
    const thr=Math.max(18,angPx*1.4);
    if(dd<thr&&dd<bd){ bd=dd;best=k; }
  }
  if(best){ selectBody(best); }
}

  if(k!=="earth"){ const e2=eph.ecl||[0,0,0];
    dE=Math.hypot(e2[0]-E.ecl[0],e2[1]-E.ecl[1],e2[2]-E.ecl[2]); }
  const lt=dE*8.31675; /* 光分 */
  const ltS=lt<90?lt.toFixed(1)+" 光分":(lt/60).toFixed(2)+" 光时";
  let rows="";
  if(k==="sun"){
    rows=[["视星等","−26.74"],["直径","1,392,700 km"],["自转周期","约 27 天"],["光谱型","G2V"]].map(r=>"<tr><td class=k>"+r[0]+"</td><td class=v>"+r[1]+"</td></tr>").join("");
  } else if(SIM.moons[k]){
    const m=SIM.moons[k];
    rows=[["母行星",MNAME[m.pk]],["半径",m.mr.toLocaleString()+" km"],
      ["轨道半径",m.ar.toLocaleString()+" km"],["公转周期",Math.abs(m.per)+" 天"+(m.per<0?"（逆行）":"")],
      ["轨道倾角",m.inc+"°（"+(m.ref==="ecl"?"对黄道":"对母行星赤道")+"）"]].map(r=>"<tr><td class=k>"+r[0]+"</td><td class=v>"+r[1]+"</td></tr>").join("");
  } else if(k==="halley"){
    rows=[["半长轴","17.834 AU"],["偏心率","0.967"],["轨道倾角","162.26°（逆行）"],
      ["周期","75.32 年"],["下次过近日点","2061-07-28 左右"]].map(r=>"<tr><td class=k>"+r[0]+"</td><td class=v>"+r[1]+"</td></tr>").join("");
  } else {
    const P=PHYS[k],B=SIM.bodies[k];
    rows=[["半径",P.r.toLocaleString()+" km"],["质量",P.m+" kg"],["公转周期",P.p],
      ["卫星数",P.mo],["表面/云顶温度",P.t],["偏心率",B?B.e.toFixed(5):"—"],
      ["轨道倾角",ELEM[k][2].toFixed(3)+"°"],["转轴倾角",SPIN[k].tbook],["自转周期",Math.abs(SPIN[k].rotH).toFixed(2)+" 小时"+(SPIN[k].rotH<0?"（逆行）":"")],
      ["大气",P.atmo]].map(r=>"<tr><td class=k>"+r[0]+"</td><td class=v>"+r[1]+"</td></tr>").join("");
  }
  const live=(k==="sun")?"":("<tr><td class=k>日心距离</td><td class=v>"+eph.r.toFixed(4)+" AU</td></tr>"
    +"<tr><td class=k>日心黄经</td><td class=v>"+eph.lon.toFixed(2)+"°</td></tr>"
    +"<tr><td class=k>日心黄纬</td><td class=v>"+eph.lat.toFixed(2)+"°</td></tr>"
    +(k==="earth"?"":("<tr><td class=k>与地球距离</td><td class=v>"+dE.toFixed(4)+" AU</td></tr>"
    +"<tr><td class=k>光行时</td><td class=v>"+ltS+"</td></tr>"))
    +(eph.a?("<tr><td class=k>轨道速度</td><td class=v>"+orbVel(eph.r,eph.a).toFixed(2)+" km/s</td></tr>"):""));
  const blurb=k==="halley"?"哈雷彗星是第一颗被确认的周期彗星，公转一圈约 75 年。接近近日点时冰物质升华出数千万公里长的彗尾，离子尾永远笔直地背向太阳。":(PHYS[k]?PHYS[k].b:(k==="moon"?"月球是地球唯一的天然卫星，自转与公转同步所以永远以同一面朝向我们。它的潮汐锁定了地球自转，也稳定了地轴倾角。":""));
  const sub=k==="sun"?"G型主序星":k==="halley"?"1P/Halley · 周期彗星":(ORDER.find(o=>o[0]===k)[2]===1?"天然卫星":(k==="pluto"?"矮行星":"行星"));
  R.innerHTML="<h2>"+MNAME[k]+"</h2><div class=sub>"+sub+"</div>"
    +"<h5>实时数据</h5><table>"+live+"</table>"
    +"<h5>参数</h5><table>"+rows+"</table>"
    +"<h5>简介</h5><div class=blurb>"+blurb+"</div>"
    +"<div class=warn id=exw>已超出根数有效区间 1800–2050（外推）</div>";
}
/* ================= 标签 / 主循环 / 启动 ================= */
const labelBox=$("labels");
const labelEls={};
for(const [k] of ORDER){ const s=document.createElement("span"); s.textContent=MNAME[k];
  if(ORDER.find(o=>o[0]===k)[2]===1) s.classList.add("moon");
  labelBox.appendChild(s); labelEls[k]=s; }
const _pv=new Float32Array(4);
function updateLabels(){
  const r=cv.getBoundingClientRect();
  camEye(EYE);
  const V=mLook(EYE,[CAM.tx,CAM.ty,CAM.tz],[0,1,0]);
  const VP2=mMul(mPersp(50*D2R,VW/VH,0.1,9000),V);
  for(const [k] of ORDER){
    const el=labelEls[k];
    if(!SIM.show.label){ el.style.display="none"; continue; }
    if(SIM.moons[k]&&!SIM.show.moon){ el.style.display="none"; continue; }
    if(k==="halley"&&!SIM.show.comet){ el.style.display="none"; continue; }
    targetWorld(k,TGT);
    const x=VP2[0]*TGT[0]+VP2[4]*TGT[1]+VP2[8]*TGT[2]+VP2[12];
    const y=VP2[1]*TGT[0]+VP2[5]*TGT[1]+VP2[9]*TGT[2]+VP2[13];
    const w=VP2[3]*TGT[0]+VP2[7]*TGT[1]+VP2[11]*TGT[2]+VP2[15];
    if(w<0){ el.style.display="none"; continue; }
    const sx=(x/w*0.5+0.5)*r.width, sy=(1-(y/w*0.5+0.5))*r.height;
    if(sx<-50||sy<-20||sx>r.width+50||sy>r.height+20){ el.style.display="none"; continue; }
    const R=k==="sun"?SIM.bodies.sun.R:(SIM.bodies[k]?SIM.bodies[k].R:(k==="halley"?1.0:SIM.moons[k].R));
    const dist=Math.hypot(TGT[0]-EYE[0],TGT[1]-EYE[1],TGT[2]-EYE[2]);
    const angPx=Math.atan(R/dist)/(50*D2R/2)*(r.height/2);
    el.style.display="block";
    el.style.left=sx+"px"; el.style.top=(sy-angPx-6)+"px";
    el.style.opacity=clamp(angPx/7,0.06,0.95).toFixed(2);
  }
}
function tick(tms){
  requestAnimationFrame(tick);
  const dt=Math.min(100,tms-(tick._l||tms)); tick._l=tms;
  simT+=dt/1000;
  if(!SIM.paused) SIM.jd+=SIM.djd*dt/1000;
  COMP+=(COMP_T-COMP)*Math.min(1,dt/400*2.2);
  render(dt);
  updateLabels();
  $("date").textContent=fmtDate(SIM.jd);
  const ms=(SIM.jd-2440587.5)*DAY, d=new Date(ms);
  const yr=d.getUTCFullYear();
  const bad=yr<1800||yr>2050;
  $("extrap").style.display=bad?"block":"none";
  const exw=$("exw"); if(exw) exw.style.display=bad?"block":"none";
  ck("tick");
}
window.__solar={get err(){return GLERR;},SIM,CAM,
  get fps(){ return 0; },
  selfCheck(jd){
    const o={};
    for(const k of PLANET_KEYS){ const p=elemPos(ELEM[k],jd); o[k]={r:+p.r.toFixed(4),lon:+p.lon.toFixed(2),v:+orbVel(p.r,p.a).toFixed(2)}; }
    return o;
  }};
/* headless 诊断探针: ?debug=1 → 3.5s 后把自检写入 title */
(function(){
  const h=location.hash||"";
  if(h.indexOf("debug=1")<0) return;
  setTimeout(()=>{
    try{
      const c=window.__solar.selfCheck(2461259.5).earth;
      document.title="SS_OK[r="+c.r+",lon="+c.lon+",v="+c.v+",errs="+(window.__errLog||[]).length+"+"+GLERR+"]";
    }catch(e){ document.title="SS_FAIL["+String(e).slice(0,120)+"]"; }
  },3500);
})();
window.addEventListener("error",e=>{ (window.__errLog=window.__errLog||[]).push(String(e.message||e.error).slice(0,80)); });
buildUI();
selectBody("earth");
CAM.yaw=0.7;CAM.pitch=0.42;CAM.dist=170;
/* 深链: #focus= / snap / jd / speed / true */
(function hash(){
  const h=location.hash||"";
  const q={}; h.replace(/^#/,"").split("&").forEach(s=>{ const [k2,v]=s.split("="); if(k2)q[k2]=decodeURIComponent(v||""); });
  const nm={sun:"sun",太阳:"sun",水星:"mercury",金星:"venus",地球:"earth",月球:"moon",火星:"mars",木星:"jupiter",土星:"saturn",天王星:"uranus",海王星:"neptune",冥王星:"pluto",哈雷:"halley"};
  if(q.jd) SIM.jd=parseFloat(q.jd);
  if(q.speed) setSpd(parseFloat(q.speed));
  if(q.true==="1"){ SIM.show.trueD=true; setCompress(1.0); }
  if(q.focus){ const k=nm[q.focus]||q.focus;
    if(MNAME[k]){ updateBodies(SIM.jd,0); selectBody(k);
      if(q.snap==="1"){ targetWorld(k,TGT); CAM.tx=TGT[0];CAM.ty=TGT[1];CAM.tz=TGT[2]; CAM.dist=focusDist(k); SIM.camTransition=null; }
    } }
})();
updateSpeed();
requestAnimationFrame(tick);
