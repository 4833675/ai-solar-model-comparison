<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>太阳系 · 实时开普勒轨道模型 | Solar System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');
:root{--glass:rgba(10,14,26,.50);--line:rgba(150,185,255,.14);--txt:#e2eaff;--dim:#8e9bb9;--acc:#7fb4ff;--acc2:#ffcf7a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:"Rajdhani","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;outline:none}
#labels{position:fixed;left:0;top:0;pointer-events:none}
.panel{background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .6s}
#hud.hide{opacity:0}
#hud.hide *{pointer-events:none!important}
#hud .panel,#hud button,#hud input,#hud select{pointer-events:auto}
button,select,input{font-family:inherit;color:var(--txt)}
button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer;transition:all .2s}
button:hover{background:rgba(127,180,255,.18);border-color:rgba(127,180,255,.45)}
button.on{background:rgba(127,180,255,.25);border-color:rgba(127,180,255,.7);box-shadow:0 0 14px rgba(127,180,255,.35)}
kbd{font-family:inherit;font-size:10px;padding:0 4px;border:1px solid rgba(255,255,255,.25);border-radius:4px;color:var(--dim);margin-left:4px}
#tl{position:absolute;left:18px;top:18px;padding:14px 18px 12px;min-width:300px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#fff8dc 0,#ffd27a 30%,#ff8c1a 62%,rgba(255,90,0,0) 72%);box-shadow:0 0 22px rgba(255,150,40,.8);flex:none}
.t1{font-size:19px;letter-spacing:5px;font-weight:700}
.t2{font-size:12px;color:var(--dim);letter-spacing:1px}
#dateMain{font-size:27px;font-weight:600;letter-spacing:1px;font-variant-numeric:tabular-nums}
#dateSub{font-size:12px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.5}
#scaleInfo{margin-top:8px;font-size:12.5px;color:var(--acc2)}
#warn{margin-top:4px;font-size:11.5px;color:#ff9a7a;display:none}
#rcol{position:absolute;right:18px;top:18px;bottom:128px;width:290px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#tr{width:100%;padding:12px 14px;flex:none}
.ph{font-size:13px;letter-spacing:2px;color:var(--dim);cursor:pointer;display:flex;justify-content:space-between}
#settings{margin-top:10px;display:flex;flex-direction:column;gap:9px}
#settings.collapsed{display:none}
.wide{width:100%;padding:9px;font-size:14px;font-weight:600;letter-spacing:1px}
#btnReal{background:linear-gradient(90deg,rgba(255,180,80,.18),rgba(127,180,255,.18))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tg{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;padding:3px 2px;color:#c9d5f0}
.tg .sw{width:26px;height:14px;border-radius:8px;background:rgba(255,255,255,.15);position:relative;transition:.2s;flex:none}
.tg .sw:after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#aab;transition:.2s}
.tg.on .sw{background:rgba(127,180,255,.55)}
.tg.on .sw:after{left:14px;background:#fff}
.sl{display:flex;align-items:center;gap:8px;font-size:13px;color:#c9d5f0}
.sl span{width:34px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.15);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#cfe0ff;box-shadow:0 0 8px rgba(127,180,255,.9);cursor:pointer}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#cfe0ff;border:none}
select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:7px;font-size:13px;outline:none}
select option{background:#101624}
.row{display:flex;gap:6px}.row>*{flex:1}
#info{width:100%;padding:16px 18px;transition:opacity .4s,transform .4s;overflow-y:auto;min-height:0;flex:0 1 auto}
#info.hidden{opacity:0;pointer-events:none!important;transform:translateX(30px)}
#info::-webkit-scrollbar{width:4px}#info::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.ih{display:flex;align-items:center;gap:12px}
.ih .ball{width:38px;height:38px;border-radius:50%;flex:none}
.iname{font-size:24px;font-weight:700;letter-spacing:2px}
.ien{font-size:13px;color:var(--dim);letter-spacing:2px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid rgba(255,207,122,.5);color:var(--acc2);margin-top:3px}
.sec{font-size:11px;letter-spacing:3px;color:var(--dim);margin:12px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv b{font-weight:500;color:#9fb0d0}.kv i{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:#eef3ff}
.live i{color:#a8ffd8}
.fact{font-size:13px;line-height:1.65;color:#cbd6ee;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{font-size:12px;padding:3px 8px}
#bottom{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:max-content;max-width:96vw}
#timebar{display:flex;align-items:center;gap:8px;padding:9px 12px}
#timebar button{font-size:15px;min-width:38px}
#speedBox{display:flex;flex-direction:column;align-items:center;width:210px;gap:3px}
#speedBox input{width:100%}
#speedLbl{font-size:13px;color:var(--acc);letter-spacing:1px;font-variant-numeric:tabular-nums}
input[type=datetime-local]{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:5px 7px;font-size:13px;color-scheme:dark;outline:none}
#bodybar{display:flex;gap:4px;padding:7px 9px;flex-wrap:wrap;justify-content:center}
#bodybar button{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 9px;background:transparent;border-color:transparent}
#bodybar button:hover{background:rgba(255,255,255,.08)}
#bodybar button.on{background:rgba(127,180,255,.18);border-color:rgba(127,180,255,.5)}
#bodybar .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
#bodybar .sep{width:1px;background:var(--line);margin:3px 4px}
#hint{position:absolute;left:18px;bottom:16px;font-size:11.5px;color:rgba(200,215,245,.55);line-height:1.7;max-width:250px}
.lbl{width:0;height:0;overflow:visible;pointer-events:none}
.lbl .in{position:absolute;left:7px;top:-10px;white-space:nowrap;display:flex;align-items:center;gap:5px;font-size:12.5px;letter-spacing:1px;color:#dbe6ff;text-shadow:0 0 6px #000,0 0 3px #000;pointer-events:auto;cursor:pointer;transition:opacity .25s;padding:1px 4px;border-radius:5px}
.lbl .in:hover{background:rgba(127,180,255,.25)}
.lbl .in i{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
.lbl.moon .in{font-size:11px;color:#b8c6e4}
.lbl.comet .in{color:#a9e6ff}
.lbl.star .in{font-size:13.5px;color:#ffe2a8}
.slbl{width:0;height:0;pointer-events:none}
.slbl div{position:absolute;left:6px;top:-8px;white-space:nowrap;font-size:11px;color:rgba(190,210,255,.6);letter-spacing:1px}
.slbl.con div{font-size:13px;color:rgba(150,190,255,.55);letter-spacing:4px}
.glbl div{position:absolute;left:4px;top:-14px;white-space:nowrap;font-size:10.5px;color:rgba(255,210,140,.6)}
#loader{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0b1020 0,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity 1.2s}
#loader.done{opacity:0;pointer-events:none}
.orb{width:120px;height:120px;position:relative}
.orb:before{content:"";position:absolute;inset:44px;border-radius:50%;background:radial-gradient(circle,#fff6d0,#ffae42 55%,#ff6a00);box-shadow:0 0 30px #ff9a3c}
.orb span{position:absolute;inset:0;border:1px solid rgba(150,190,255,.35);border-radius:50%;animation:spin 2.2s linear infinite}
.orb span:after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:#7fb4ff;box-shadow:0 0 10px #7fb4ff}
.orb span:nth-child(2){inset:16px;animation-duration:1.3s}
@keyframes spin{to{transform:rotate(360deg)}}
#ltxt{margin-top:26px;letter-spacing:4px;color:#aab8d8;font-size:14px}
#toast{position:absolute;left:50%;top:22px;transform:translateX(-50%);padding:8px 18px;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none!important}
#toast.show{opacity:1}
@media (max-width:900px){#hint{display:none}#rcol{width:250px}#tl{min-width:0}}
@media (max-height:760px){#rcol{bottom:118px}.fact{font-size:12px}}
</style>
</head>

  </div>
  <div id="toast" class="panel"></div>

      <button id="bNow" title="回到当前真实时间">此刻</button>
      <input type="datetime-local" id="dtInput" step="1">
      <button id="bGo">跳转</button>
    </div>
    <div id="bodybar" class="panel"></div>
  </div>

  <div id="hint">拖动旋转 · 滚轮缩放 · 点击名称/双击天体聚焦<br>空格 暂停 · ←/→ 调速 · 0–9 选择天体<br>R 真实比例 · T 漫游 · O 轨道 · L 标签 · H 隐藏界面</div>
</div>

  const mp = markGeo.attributes.position, ma = markGeo.attributes.aAlpha;
  const fDir = focus.group.position.clone().sub(camera.position); const fDist = fDir.length(); fDir.divideScalar(fDist);
  const fAng = Math.asin(clamp(focus.rvis * (focus.ring && focus.id === 'saturn' ? 1.3 : 1.05) / fDist, 0, 1));
  markBodies.forEach((b, i) => {
    mp.setXYZ(i, b.group.position.x, b.group.position.y, b.group.position.z);
    const dist = camera.position.distanceTo(b.group.position); const rpx = b.rvis / dist * K;
    let a = clamp((5 - rpx) / 3, 0, 1);
    if (b.kind === 'moon') a *= b.nearVis * (S.moons ? 1 : 0);
    if (b.kind === 'comet') a *= S.comets ? 1 : 0;
    ma.setX(i, a);
    if (b.labelIn) {
      let la = S.labels ? 1 : 0;
      if (b.kind === 'moon') la *= b.nearVis * (S.moons ? 1 : 0);
      if (b.kind === 'comet') la *= S.comets ? 1 : 0;
      if (rpx > 60) la *= 0;
      if (b !== focus && dist > fDist) { const ang = Math.acos(clamp(_v1.copy(b.group.position).sub(camera.position).normalize().dot(fDir), -1, 1)); if (ang < fAng) la = 0; }
      b.labelIn.style.opacity = la; b.labelIn.style.pointerEvents = la > 0.3 ? 'auto' : 'none';
    }
  });
  mp.needsUpdate = ma.needsUpdate = true;
  sun.labelIn.style.opacity = S.labels && sunPx < 60 ? 1 : 0;

  // 太阳可见度（遮挡）→ 光晕
  const toS = _v1.copy(sun.group.position).sub(camera.position); const ds = toS.length(); toS.divideScalar(ds);
  const rs = Math.asin(clamp(sun.rvis / ds, 0, 1)); let vis = 1;
  for (const b of bodies) {

    const tb = _v2.copy(b.group.position).sub(camera.position); const db = tb.length(); if (db > ds) continue; tb.divideScalar(db);
    const c = toS.dot(tb); if (c <= 0) continue;
    const th = Math.atan2(_v3.crossVectors(toS, tb).length(), c); const ro = Math.asin(clamp(b.rvis / db, 0, 1));

  const onScr = sp.z < 1 ? 1 - sstep(0.85, 1.3, Math.max(Math.abs(sp.x), Math.abs(sp.y))) : 0;
  const fTarget = S.flare ? vis * onScr * (1 - sstep(0.04, 0.35, rs)) : 0;
  flare += (fTarget - flare) * Math.min(1, dt * 10);
  finalPass.uniforms.uFlare.value = flare; finalPass.uniforms.uSun.value.set(sp.x * 0.5 + 0.5, sp.y * 0.5 + 0.5); finalPass.uniforms.uTime.value = now;
  glareMat.uniforms.uInt.value = 0.35 * vis * (1 - 0.85 * nearSun); coronaMat.uniforms.uInt.value = lerp(1.0, 0.55, nearSun);

  composer.render();
  labelRenderer.render(scene, camera);

  if (now - lastUI > 0.2) { lastUI = now; updateUI(jd); }
}
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
function updateUI(jd) {
  const dt = new Date(simMs); const y = dt.getFullYear();
  $('#dateMain').textContent = `${y < 0 ? '-' : ''}${pad(y, 4)}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}  ${pad(dt.getHours())}:${pad(dt.getMinutes())}:${pad(dt.getSeconds())}`;
  const off = -dt.getTimezoneOffset() / 60;
  $('#dateSub').innerHTML = `星期${WEEK[dt.getDay()]} · 本地时间 UTC${off >= 0 ? '+' : ''}${off}<br>UTC ${dt.toISOString().slice(0, 19).replace('T', ' ')} · JD ${jd.toFixed(5)}`;
  const t = sstep(0, 1, realLin);
  $('#scaleInfo').textContent = t < 0.01 ? '◐ 视觉比例 · 距离 r^0.55 压缩 · 天体放大 180×（太阳 28×）' : t > 0.99 ? '● 真实比例 1 : 1 · 距离与大小均为真实值' : `◑ 比例过渡中 … ${fmt(t * 100)}%`;
  $('#warn').style.display = (y < 1800 || y > 2050) ? 'block' : 'none';
  if (document.activeElement !== $('#dtInput')) $('#dtInput').value = toLocalInput(simMs);
  updateLive();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight); finalPass.uniforms.uAspect.value = innerWidth / innerHeight;
});

applyToggles(); setSpeed(12);
setScales(0); for (const b of bodies) b.rvis = rvisFor(b);
updateAll(simMs / 86400000 + 2440587.5); updateComets();
camera.position.set(0, 0.42, 1).normalize().multiplyScalar(overviewDist() * 4.5);
fly = { t: 0, dur: 4.5, from: sun, fromExtra: new THREE.Vector3(), d0: camera.position.length(), d1: overviewDist(), bump: 0, dir0: camera.position.clone().normalize(), dir1: new THREE.Vector3(0.25, 0.5, 1).normalize() };
renderInfo(sun); updateBodyBar();
frame();
