<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>太阳系实时运动模型</title>
<style>
:root {
  --bg: #04060a;
  --panel: rgba(10,14,22,0.62);
  --panel-strong: rgba(8,12,20,0.82);
  --text: #e8ecf2;
  --text-dim: #8b94a3;
  --text-faint: #5b6470;
  --accent: #6fb3ff;
  --accent-warm: #ffb066;
  --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.18);
  --shadow: 0 8px 28px rgba(0,0,0,0.45);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: var(--bg); color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  overflow: hidden; user-select: none;
  -webkit-font-smoothing: antialiased;
}
canvas#gl {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  background: #000;
  touch-action: none;
}
.panel {
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: var(--shadow);
  pointer-events: auto;
}
.panel h3 {
  margin: 0 0 8px;
  font-size: 11px;
  letter-spacing: 0.18em;
  font-weight: 500;
  color: var(--text-dim);
  text-transform: uppercase;
}
#ui-left {
  position: fixed; left: 14px; top: 14px; width: 220px;
  max-height: calc(100vh - 28px);
  overflow-y: auto;
  z-index: 10;
}
#ui-left .group {
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  margin: 8px 4px 4px;
  text-transform: uppercase;
}
#ui-left .body-item {
  display: flex; align-items: center;
  padding: 4px 6px; margin: 1px 0;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.12s;
}
#ui-left .body-item:hover { background: rgba(255,255,255,0.05); }
#ui-left .body-item.selected { background: rgba(111,179,255,0.16); color: var(--accent); }
#ui-left .body-item .dot {
  width: 7px; height: 7px; border-radius: 50%;
  margin-right: 8px; flex-shrink: 0;
}
#ui-left .body-item.indent { padding-left: 22px; font-size: 11px; color: var(--text-dim); }

#ui-right {
  position: fixed; right: 14px; top: 14px; width: 300px;
  max-height: calc(100vh - 28px);
  overflow-y: auto;
  z-index: 10;
}
#ui-right .name {
  font-size: 18px; font-weight: 500;
  margin: 0 0 2px;
  letter-spacing: 0.02em;
}
#ui-right .name-en {
  font-size: 11px; color: var(--text-faint);
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}
#ui-right .desc {
  font-size: 12px; color: var(--text-dim);
  line-height: 1.55; margin: 8px 0 12px;
}
.kv {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 8px;
  font-size: 11.5px;
  margin-bottom: 8px;
}
.kv .k { color: var(--text-dim); }
.kv .v { color: var(--text); text-align: right; }
.num {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}

#ui-bottom {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: 14px;
  z-index: 10;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
}
#ui-bottom .utc {
  font-size: 14px; min-width: 200px; text-align: center;
}
#ui-bottom .speed {
  font-size: 12px; color: var(--text-dim); min-width: 100px; text-align: center;
}
#ui-bottom button {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border-strong);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.12s;
}
#ui-bottom button:hover { background: rgba(255,255,255,0.12); }
#ui-bottom button.active { background: rgba(111,179,255,0.2); border-color: var(--accent); }
#ui-bottom input[type="range"] {
  width: 180px; accent-color: var(--accent);
}
#ui-bottom .now-btn { margin-left: 4px; }

#ui-toggles {
  position: fixed; right: 14px; bottom: 14px;
  z-index: 10;
  display: flex; flex-direction: column; gap: 4px;
  padding: 10px;
  max-width: 180px;
}
#ui-toggles button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 5px;
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
  text-align: left;
  letter-spacing: 0.04em;
  transition: all 0.12s;
}
#ui-toggles button:hover { background: rgba(255,255,255,0.05); color: var(--text); }
#ui-toggles button.active {
  background: rgba(111,179,255,0.16);
  border-color: rgba(111,179,255,0.4);
  color: var(--accent);
}

#labels {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
}
#labels .label {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: rgba(232,236,242,0.85);
  text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
  white-space: nowrap;
  pointer-events: none;
  will-change: transform, opacity;
}

#warn {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  z-index: 11;
  padding: 6px 14px;
  background: rgba(255,170,60,0.18);
  border: 1px solid rgba(255,170,60,0.4);
  color: #ffcb88;
  border-radius: 6px;
  font-size: 11px;
  letter-spacing: 0.05em;
  display: none;
}
#warn.show { display: block; }

#compress-note {
  position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%);
  z-index: 9;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

#fps {
  position: fixed; left: 14px; bottom: 14px;
  z-index: 10;
  padding: 5px 10px;
  font-size: 11px;
  color: var(--text-dim);
}

.hidden-ui #ui-left, .hidden-ui #ui-right, .hidden-ui #ui-bottom,
.hidden-ui #ui-toggles, .hidden-ui #labels, .hidden-ui #fps, .hidden-ui #compress-note {
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}

#fallback {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  z-index: 100;
  text-align: center;
  padding: 20px;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

@media (max-width: 700px) {
  #ui-left { width: 160px; }
  #ui-right { width: 220px; }
  #ui-bottom { width: calc(100vw - 28px); }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="warn">已超出根数有效区间（外推，1800–2050）</div>
<div id="compress-note">距离比例已压缩 · 角位置精确</div>
<div id="fps">— fps</div>
<div id="ui-left" class="panel"></div>
<div id="ui-right" class="panel"></div>
<div id="ui-bottom" class="panel">
  <button id="btn-play" class="active">⏸ 暂停</button>
  <div class="utc num" id="utc">—</div>
  <div class="speed num" id="speed">实时</div>
  <input type="range" id="speed-slider" min="0" max="100" value="50" step="0.5">
  <button id="btn-now" class="now-btn">现在</button>
</div>
<div id="ui-toggles" class="panel"></div>
<div id="fallback" style="display:none">无法初始化 WebGL2，请使用支持 WebGL2 的现代浏览器。</div>

<script>
"use strict";
/* ============================================================================
 *  太阳系实时运动模型 — 单文件实现
 *  规格书: 太阳系模型-任务说明.md
 * ========================================================================= */

const ctx = {
  canvas: null, gl: null,
  dpr: 1, width: 0, height: 0,
  camera: { yaw: 0.6, pitch: 0.0, distance: 120, target: [0,0,0], targetSmooth: [0,0,0], distanceSmooth: 120 },
  time: { jd: 0, speed: 0, paused: false },
  compress: 0.62,
  compressTarget: 0.62,
  compressAnim: null,
  toggles: { orbits: true, labels: true, moons: true, belts: true, comet: true, realDist: false, glow: true },
  postFxEnabled: true,
  selected: 'sun',
  bodies: [],
  belts: [],
  meshes: {},
  fbos: {},
  programs: {},
  starBuffer: null, starCount: 0,
  asteroidBuffers: {},
  ringMesh: null,
  atmosphereMesh: null,
  coronaMesh: null,
  frame: 0, t0: performance.now(),
  lastResize: 0,
  fpsAccum: 0, fpsFrames: 0, fpsLast: performance.now(),
};

const DEG = Math.PI / 180;
const J2000 = 2451545.0;
const JD_UNIX_OFFSET = 2440587.5;
const SCALE_DISPLAY = 34;

/* ---------- math ---------- */
const math = (() => {
  function v3(x,y,z){return{x,y,z};}
  function vAdd(a,b){return{x:a.x+b.x,y:a.y+b.y,z:a.z+b.z};}
  function vSub(a,b){return{x:a.x-b.x,y:a.y-b.y,z:a.z-b.z};}
  function vScale(a,s){return{x:a.x*s,y:a.y*s,z:a.z*s};}
  function vDot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z;}
  function vCross(a,b){return{x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x};}
  function vLen(a){return Math.hypot(a.x,a.y,a.z);}
  function vNorm(a){const l=vLen(a)||1;return{x:a.x/l,y:a.y/l,z:a.z/l};}
  function vLerp(a,b,t){return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:a.z+(b.z-a.z)*t};}
  function mIdent(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;}
  function mMult(a,b){
    const o=new Float32Array(16);
    for(let i=0;i<4;i++) for(let j=0;j<4;j++){
      let s=0; for(let k=0;k<4;k++) s+=a[k*4+j]*b[i*4+k]; o[i*4+j]=s;
    }
    return o;
  }
  function mTranslate(m,x,y,z){
    const o=new Float32Array(m);
    o[12]+=m[0]*x+m[4]*y+m[8]*z;
    o[13]+=m[1]*x+m[5]*y+m[9]*z;
    o[14]+=m[2]*x+m[6]*y+m[10]*z;
    o[15]+=m[3]*x+m[7]*y+m[11]*z;
    return o;
  }
  function mScale(m,sx,sy,sz){
    const o=new Float32Array(16);
    for(let i=0;i<16;i++) o[i]=m[i];
    o[0]*=sx; o[1]*=sx; o[2]*=sx; o[3]*=sx;
    o[4]*=sy; o[5]*=sy; o[6]*=sy; o[7]*=sy;
    o[8]*=sz; o[9]*=sz; o[10]*=sz; o[11]*=sz;
    return o;
  }
  function mPerspective(fovy,aspect,near,far){
    const f=1/Math.tan(fovy/2),nf=1/(near-far);
    const m=new Float32Array(16);
    m[0]=f/aspect; m[5]=f;
    m[10]=(far+near)*nf; m[11]=-1;
    m[14]=2*far*near*nf;
    return m;
  }
  function mLookAt(eye,target,up){
    // Accept either {x,y,z} objects or [x,y,z] arrays (normalize to objects)
    const e = {x: eye[0], y: eye[1], z: eye[2]};
    const t = {x: target[0], y: target[1], z: target[2]};
    const u = {x: up[0], y: up[1], z: up[2]};
    const z=vNorm(vSub(e,t));            // z = forward (eye - target).norm
    const x=vNorm(vCross(u,z));          // x = right
    const y=vCross(z,x);                  // y = up
    // Column-major: col 0 = right, col 1 = up, col 2 = forward, col 3 = translation
    const m=new Float32Array(16);
    m[0]=x.x;  m[1]=x.y;  m[2]=x.z;  m[3]=0;
    m[4]=y.x;  m[5]=y.y;  m[6]=y.z;  m[7]=0;
    m[8]=z.x;  m[9]=z.y;  m[10]=z.z; m[11]=0;
    m[12]=-vDot(x,e);m[13]=-vDot(y,e);m[14]=-vDot(z,e);m[15]=1;
    return m;
  }
  function mInvert(m){
    const a=m, inv=new Float32Array(16);
    inv[0]= a[5]*a[10]*a[15]-a[5]*a[11]*a[14]-a[9]*a[6]*a[15]+a[9]*a[7]*a[14]+a[13]*a[6]*a[11]-a[13]*a[7]*a[10];
    inv[4]=-a[4]*a[10]*a[15]+a[4]*a[11]*a[14]+a[8]*a[6]*a[15]-a[8]*a[7]*a[14]-a[12]*a[6]*a[11]+a[12]*a[7]*a[10];
    inv[8]= a[4]*a[9]*a[15]-a[4]*a[11]*a[13]-a[8]*a[5]*a[15]+a[8]*a[7]*a[13]+a[12]*a[5]*a[11]-a[12]*a[7]*a[9];
    inv[12]=-a[4]*a[9]*a[14]+a[4]*a[10]*a[13]+a[8]*a[5]*a[14]-a[8]*a[6]*a[13]-a[12]*a[5]*a[10]+a[12]*a[6]*a[9];
    inv[1]=-a[1]*a[10]*a[15]+a[1]*a[11]*a[14]+a[9]*a[2]*a[15]-a[9]*a[3]*a[14]-a[13]*a[2]*a[11]+a[13]*a[3]*a[10];
    inv[5]= a[0]*a[10]*a[15]-a[0]*a[11]*a[14]-a[8]*a[2]*a[15]+a[8]*a[3]*a[14]+a[12]*a[2]*a[11]-a[12]*a[3]*a[10];
    inv[9]=-a[0]*a[9]*a[15]+a[0]*a[11]*a[13]+a[8]*a[1]*a[15]-a[8]*a[3]*a[13]-a[12]*a[1]*a[11]+a[12]*a[3]*a[9];
    inv[13]= a[0]*a[9]*a[14]-a[0]*a[10]*a[13]-a[8]*a[1]*a[14]+a[8]*a[2]*a[13]+a[12]*a[1]*a[10]-a[12]*a[2]*a[9];
    inv[2]= a[1]*a[6]*a[15]-a[1]*a[7]*a[14]-a[5]*a[2]*a[15]+a[5]*a[3]*a[14]+a[13]*a[2]*a[7]-a[13]*a[3]*a[6];
    inv[6]=-a[0]*a[6]*a[15]+a[0]*a[7]*a[14]+a[4]*a[2]*a[15]-a[4]*a[3]*a[14]-a[12]*a[2]*a[7]+a[12]*a[3]*a[6];
    inv[10]= a[0]*a[5]*a[15]-a[0]*a[7]*a[13]-a[4]*a[1]*a[15]+a[4]*a[3]*a[13]+a[12]*a[1]*a[7]-a[12]*a[3]*a[5];
    inv[14]=-a[0]*a[5]*a[14]+a[0]*a[6]*a[13]+a[4]*a[1]*a[14]-a[4]*a[2]*a[13]-a[12]*a[1]*a[6]+a[12]*a[2]*a[5];
    inv[3]=-a[1]*a[6]*a[11]+a[1]*a[7]*a[10]+a[5]*a[2]*a[11]-a[5]*a[3]*a[10]-a[9]*a[2]*a[7]+a[9]*a[3]*a[6];
    inv[7]= a[0]*a[6]*a[11]-a[0]*a[7]*a[10]-a[4]*a[2]*a[11]+a[4]*a[3]*a[10]+a[8]*a[2]*a[7]-a[8]*a[3]*a[6];
    inv[11]=-a[0]*a[5]*a[11]+a[0]*a[7]*a[9]+a[4]*a[1]*a[11]-a[4]*a[3]*a[9]-a[8]*a[1]*a[7]+a[8]*a[3]*a[5];
    inv[15]= a[0]*a[5]*a[10]-a[0]*a[6]*a[9]-a[4]*a[1]*a[10]+a[4]*a[2]*a[9]+a[8]*a[1]*a[6]-a[8]*a[2]*a[5];
    let det = a[0]*inv[0]+a[1]*inv[4]+a[2]*inv[8]+a[3]*inv[12];
    if(Math.abs(det)<1e-12) return mIdent();
    det = 1/det;
    for(let i=0;i<16;i++) inv[i]*=det;
    return inv;
  }
  function mTranspose(m){
    const o=new Float32Array(16);
    for(let i=0;i<4;i++) for(let j=0;j<4;j++) o[i*4+j]=m[j*4+i];
    return o;
  }
  function orthoBasis(axis){
    const y = vNorm(axis);
    let ref = Math.abs(y.y) < 0.9 ? v3(0,1,0) : v3(1,0,0);
    const x = vNorm(vCross(ref, y));
    const z = vCross(y, x);
    return [x, y, z];
  }
  // Build rotation matrix from orthonormal basis (columns = X,Y,Z)
  function basisToMat(x, y, z){
    const m = new Float32Array(16);
    m[0]=x.x; m[1]=x.y; m[2]=x.z; m[3]=0;
    m[4]=y.x; m[5]=y.y; m[6]=y.z; m[7]=0;
    m[8]=z.x; m[9]=z.y; m[10]=z.z; m[11]=0;
    m[12]=0; m[13]=0; m[14]=0; m[15]=1;
    return m;
  }
  function rotY(angle){
    const c=Math.cos(angle), s=Math.sin(angle);
    const m=new Float32Array(16);
    m[0]=c; m[2]=-s; m[5]=1; m[8]=s; m[10]=c; m[15]=1;
    return m;
  }
  return {v3,vAdd,vSub,vScale,vDot,vCross,vLen,vNorm,vLerp,
          mIdent,mMult,mTranslate,mScale,mPerspective,mLookAt,mInvert,mTranspose,orthoBasis,basisToMat,rotY};
})();

/* ---------- noise GLSL prelude ---------- */
const noiseGLSL = `
float sstep(float a, float b, float x) {
  float t = clamp((x - a) / (b - a), 0.0, 1.0);
  return t * t * (3.0 - 2.0 * t);
}
float hash11(float p){ p = fract(p*0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
vec3 hash33(vec3 p){
  p = vec3(dot(p,vec3(127.1,311.7,74.7)),
           dot(p,vec3(269.5,183.3,246.1)),
           dot(p,vec3(113.5,271.9,124.6)));
  return -1.0 + 2.0*fract(sin(p)*43758.5453123);
}
float hash13(vec3 p){
  return fract(sin(dot(p, vec3(12.9898,78.233,37.719))) * 43758.5453);
}
float valueNoise3(vec3 p){
  vec3 i = floor(p), f = fract(p);
  vec3 u = f*f*(3.0-2.0*f);
  float n000=hash13(i+vec3(0,0,0));
  float n100=hash13(i+vec3(1,0,0));
  float n010=hash13(i+vec3(0,1,0));
  float n110=hash13(i+vec3(1,1,0));
  float n001=hash13(i+vec3(0,0,1));
  float n101=hash13(i+vec3(1,0,1));
  float n011=hash13(i+vec3(0,1,1));
  float n111=hash13(i+vec3(1,1,1));
  return mix(mix(mix(n000,n100,u.x),mix(n010,n110,u.x),u.y),
             mix(mix(n001,n101,u.x),mix(n011,n111,u.x),u.y),u.z);
}
const mat3 ROT = mat3(0.00, 0.80, 0.60, -0.80, 0.36,-0.48, -0.60,-0.48, 0.64);
float fbm3(vec3 p){
  float a = 0.5, s = 0.0, freq = 1.0;
  for(int i=0;i<5;i++){
    s += a * valueNoise3(p*freq);
    p = ROT * p;
    freq *= 2.07;
    a *= 0.5;
  }
  return s;
}
float worley(vec3 p){
  vec3 ip=floor(p), fp=fract(p);
  float d=1.0;
  for(int z=-1;z<=1;z++)
  for(int y=-1;y<=1;y++)
  for(int x=-1;x<=1;x++){
    vec3 g=vec3(float(x),float(y),float(z));
    vec3 o=hash33(ip+g)*0.5+0.5;
    vec3 r=g+o-fp;
    d=min(d,dot(r,r));
  }
  return sqrt(d);
}
vec2 worley2(vec3 p){
  vec3 ip=floor(p), fp=fract(p);
  float d1=1.0, d2=1.0;
  for(int z=-1;z<=1;z++)
  for(int y=-1;y<=1;y++)
  for(int x=-1;x<=1;x++){
    vec3 g=vec3(float(x),float(y),float(z));
    vec3 o=hash33(ip+g)*0.5+0.5;
    vec3 r=g+o-fp;
    float d=dot(r,r);
    if(d<d1){ d2=d1; d1=d; }
    else if(d<d2){ d2=d; }
  }
  return vec2(sqrt(d1), sqrt(d2)-sqrt(d1));
}
vec3 perturbNormal(vec3 N, vec3 worldPos, float h, float strength){
  // Bump-mapping stub: dFdx/dFdy unavailable on this driver.
  // Return N unchanged — height field still affects albedo via callers,
  // and we get a clean lit sphere.

  t = clamp(t, 0.0, 1.0);

  if(t<0.50) return mix(c1,c2,(t-0.25)*4.0);

    if(a < 60/86400) return `${sign}${(dps*86400).toFixed(2)} 秒/秒`;

    if(a < 86400/86400) return `${sign}${(dps*86400).toFixed(2)} 小时/秒`;

/* ---------- webgl helpers ---------- */
const glx = (() => {
  const gl = ctx.gl;
  function compile(type, src){
    const sh = ctx.gl.createShader(type);
    ctx.gl.shaderSource(sh, src);
    ctx.gl.compileShader(sh);
    if(!ctx.gl.getShaderParameter(sh, ctx.gl.COMPILE_STATUS)){
      const log = ctx.gl.getShaderInfoLog(sh);
      console.error('Shader compile error:', log);
      console.error('--- source ---\n' + src);
      throw new Error(log);
    }
    return sh;
  }
  function make(vsSrc, fsSrc, attribBindings){
    const vs = compile(ctx.gl.VERTEX_SHADER, vsSrc);
    const fs = compile(ctx.gl.FRAGMENT_SHADER, fsSrc);
    const p = ctx.gl.createProgram();
    ctx.gl.attachShader(p, vs); ctx.gl.attachShader(p, fs);
    if(attribBindings){
      for(const [name, loc] of Object.entries(attribBindings)){
        ctx.gl.bindAttribLocation(p, loc, name);
      }
    }
    ctx.gl.linkProgram(p);
    if(!ctx.gl.getProgramParameter(p, ctx.gl.LINK_STATUS)){
      const log = ctx.gl.getProgramInfoLog(p);
      console.error('Program link error:', log);
      throw new Error(log);
    }
    p._uniforms = {};
    const n = ctx.gl.getProgramParameter(p, ctx.gl.ACTIVE_UNIFORMS);
    for(let i=0;i<n;i++){
      const info = ctx.gl.getActiveUniform(p, i);
      p._uniforms[info.name] = ctx.gl.getUniformLocation(p, info.name);
    }
    return p;
  }
  function buffer(target, data, usage){
    const b = ctx.gl.createBuffer();
    ctx.gl.bindBuffer(target, b);
    ctx.gl.bufferData(target, data, usage || ctx.gl.STATIC_DRAW);
    return b;
  }
  function vao(){ return ctx.gl.createVertexArray(); }
  return { compile, make, buffer, vao };
})();

/* ---------- UV sphere / disk / quad ---------- */
const mesh = (() => {
  const W = 64, H = 32;
  function buildSphere(){
    const pos = [], norm = [], idx = [];
    for(let y=0;y<=H;y++){
      const v = y/H;
      const phi = v * Math.PI;
      for(let x=0;x<=W;x++){
        const u = x/W;
        const theta = u * 2 * Math.PI;
        const px = Math.sin(phi) * Math.cos(theta);
        const py = Math.cos(phi);
        const pz = Math.sin(phi) * Math.sin(theta);
        pos.push(px, py, pz);
        norm.push(px, py, pz);
      }
    }
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const a = y*(W+1)+x;
        const b = a + 1;
        const c = a + (W+1);
        const d = c + 1;
        idx.push(a,c,b, b,c,d);
      }
    }
    return { positions: new Float32Array(pos), normals: new Float32Array(norm),
             indices: new Uint32Array(idx), vcount: (H+1)*(W+1), icount: idx.length };
  }
  function buildDisk(RR=96, RT=128){
    const pos = [], norm = [], uv = [], idx = [];
    for(let r=0;r<=RR;r++){
      const rad = r / RR;
      for(let t=0;t<=RT;t++){
        const theta = t / RT * 2 * Math.PI;
        const x = rad * Math.cos(theta);
        const z = rad * Math.sin(theta);
        pos.push(x, 0, z);
        norm.push(0, 1, 0);
        uv.push(rad, theta / (2 * Math.PI));
      }
    }
    for(let r=0;r<RR;r++){
      for(let t=0;t<RT;t++){
        const a = r*(RT+1)+t;
        const b = a + 1;
        const c = a + (RT+1);
        const d = c + 1;
        idx.push(a,b,c, b,d,c);
      }
    }
    return { positions: new Float32Array(pos), normals: new Float32Array(norm),
             uvs: new Float32Array(uv), indices: new Uint32Array(idx),
             vcount: (RR+1)*(RT+1), icount: idx.length };
  }
  const sphere = buildSphere();
  const disk = buildDisk();
  const quad = { positions: new Float32Array([-1,-1, 1,-1, 1,1, -1,1]),
                 indices: new Uint16Array([0,1,2, 0,2,3]), vcount: 4, icount: 6 };
  return { sphere, disk, quad };
})();

/* ---------- belts ---------- */
const belts = (() => {
  function rand(){ return Math.random(); }
  function randn(){
    let u=0,v=0; while(u===0)u=rand(); while(v===0)v=rand();
    return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
  }
  function genMainBelt(n){
    const gaps = [
      { pos: 2.502, sigma: 0.022, k: 0.93 },
      { pos: 2.825, sigma: 0.016, k: 0.85 },
      { pos: 2.958, sigma: 0.012, k: 0.70 },
      { pos: 3.279, sigma: 0.020, k: 0.90 },
      { pos: 2.065, sigma: 0.010, k: 0.60 },
    ];
    const data = [];
    let kept = 0, attempts = 0;
    while(kept < n && attempts < n * 8){
      attempts++;
      const a = 2.06 + rand() * (3.28 - 2.06);
      let prod = 1;
      for(const g of gaps) prod *= (1 - g.k * Math.exp(-Math.pow((a-g.pos)/g.sigma, 2)));
      const env = Math.exp(-Math.pow((a-2.72)/0.55, 2));
      if(rand() > prod * env) continue;
      const e = Math.min(0.34, Math.abs(randn() * 0.07 + 0.10));
      const I = Math.abs(randn() * 5 + 5) * DEG;
      const Omega = rand() * 2 * Math.PI;
      const wbar = rand() * 2 * Math.PI;
      const M0 = rand() * 2 * Math.PI;
      const P = Math.pow(a, 1.5) * 365.25;
      const n_mean = 2 * Math.PI / P;
      const size = 0.4 + rand() * 0.6;
      data.push(a, e, I, Omega, wbar, M0, n_mean, size);
      kept++;
    }
    return new Float32Array(data);
  }
  function genHilda(n){
    const data = [];
    for(let i=0;i<n;i++){
      const a = 3.90 + (rand()-0.5) * 0.18;
      const e = 0.10 + rand() * 0.20;
      const I = Math.abs(randn() * 3 + 5) * DEG;
      const Omega = rand() * 2 * Math.PI;
      const wbar = rand() * 2 * Math.PI;
      const M0 = rand() * 2 * Math.PI;
      const P = Math.pow(a, 1.5) * 365.25;
      const n_mean = 2 * Math.PI / P;
      data.push(a, e, I, Omega, wbar, M0, n_mean, 0.5 + rand() * 0.6);
    }
    return new Float32Array(data);
  }
  function genTrojan(n){
    const data = [];
    const LJ = 34.396 * DEG;
    for(let i=0;i<n;i++){
      const sign = i & 1 ? 1 : -1;
      const M0 = LJ + sign * (60 + randn() * 26) * DEG;
      let e = Math.abs(randn() * 0.05 + 0.06);
      e = Math.min(0.20, e);
      const I = Math.abs(randn() * 4) * DEG;
      const Omega = rand() * 2 * Math.PI;
      const wbar = rand() * 2 * Math.PI;
      const a = 5.202 + (rand()-0.5) * 0.4;
      const P = Math.pow(a, 1.5) * 365.25;
      const n_mean = 2 * Math.PI / P;
      data.push(a, e, I, Omega, wbar, M0, n_mean, 0.6 + rand() * 0.5);
    }
    return new Float32Array(data);
  }
  function genKuiper(n){
    const data = [];
    for(let i=0;i<n;i++){
      const r = rand();
      let a, e, I;
      if(r < 0.22){
        a = 39.45 + (rand()-0.5) * 1.1;
        e = rand() * 0.25;
        I = Math.abs(randn() * 3 + 5) * DEG;
      } else if(r < 0.86){
        a = 42.5 + rand() * (47.7 - 42.5);
        e = rand() * 0.11;
        I = Math.abs(randn() * 4 + 7) * DEG;
      } else {
        a = 48 + rand() * 32;
        e = 0.15 + rand() * 0.35;
        I = Math.abs(randn() * 10 + 22) * DEG;
      }
      const Omega = rand() * 2 * Math.PI;
      const wbar = rand() * 2 * Math.PI;
      const M0 = rand() * 2 * Math.PI;
      const P = Math.pow(a, 1.5) * 365.25;
      const n_mean = 2 * Math.PI / P;
      data.push(a, e, I, Omega, wbar, M0, n_mean, 0.5 + rand() * 0.7);
    }
    return new Float32Array(data);
  }
  return { genMainBelt, genHilda, genTrojan, genKuiper };
})();

/* ---------- FBO pipeline ---------- */
const pipeline = (() => {
  let msaa = 0; // disabled — swiftshader + some drivers break after MSAA bind. Force single-sample.
  let colorExt = true;
  let sceneFBO, sceneColorRB, sceneDepthRB;
  let resolveFBO, resolveTex;
  let postFBO, postTex;
  let bloomDownFBOs = [], bloomDownTex = [];
  let bloomUpFBOs = [], bloomUpTex = [];

  function colorInternalFmt(){ return colorExt ? ctx.gl.RGBA16F : ctx.gl.RGBA8; }
  function colorType(){ return colorExt ? ctx.gl.HALF_FLOAT : ctx.gl.UNSIGNED_BYTE; }
  function gl(){ return ctx.gl; }

  function initFBOs(w, h){
    // probe HDR
    const probe = ctx.gl.createTexture();
    ctx.gl.bindTexture(ctx.gl.TEXTURE_2D, probe);
    ctx.gl.texImage2D(ctx.gl.TEXTURE_2D, 0, ctx.gl.RGBA16F, 4, 4, 0, ctx.gl.RGBA, ctx.gl.HALF_FLOAT, null);
    ctx.gl.texParameteri(ctx.gl.TEXTURE_2D, ctx.gl.TEXTURE_MIN_FILTER, ctx.gl.LINEAR);
    const fb = ctx.gl.createFramebuffer();
    ctx.gl.bindFramebuffer(ctx.gl.FRAMEBUFFER, fb);
    ctx.gl.framebufferTexture2D(ctx.gl.FRAMEBUFFER, ctx.gl.COLOR_ATTACHMENT0, ctx.gl.TEXTURE_2D, probe, 0);
    if(ctx.gl.checkFramebufferStatus(ctx.gl.FRAMEBUFFER) !== ctx.gl.FRAMEBUFFER_COMPLETE) colorExt = false;
    ctx.gl.deleteFramebuffer(fb); ctx.gl.deleteTexture(probe);
    ctx.gl.bindFramebuffer(ctx.gl.FRAMEBUFFER, null);

    if(sceneFBO){ ctx.gl.deleteFramebuffer(sceneFBO); ctx.gl.deleteRenderbuffer(sceneColorRB); ctx.gl.deleteRenderbuffer(sceneDepthRB); }
    if(resolveFBO){ ctx.gl.deleteFramebuffer(resolveFBO); ctx.gl.deleteTexture(resolveTex); }
    if(postFBO){ ctx.gl.deleteFramebuffer(postFBO); ctx.gl.deleteTexture(postTex); }

    function tryMSAA(samples){
      sceneColorRB = ctx.gl.createRenderbuffer();
      ctx.gl.bindRenderbuffer(ctx.gl.RENDERBUFFER, sceneColorRB);
      ctx.gl.renderbufferStorageMultisample(ctx.gl.RENDERBUFFER, samples, colorInternalFmt(), w, h);
      sceneDepthRB = ctx.gl.createRenderbuffer();
      ctx.gl.bindRenderbuffer(ctx.gl.RENDERBUFFER, sceneDepthRB);
      ctx.gl.renderbufferStorageMultisample(ctx.gl.RENDERBUFFER, samples, ctx.gl.DEPTH_COMPONENT24, w, h);
      sceneFBO = ctx.gl.createFramebuffer();
      ctx.gl.bindFramebuffer(ctx.gl.FRAMEBUFFER, sceneFBO);
      ctx.gl.framebufferRenderbuffer(ctx.gl.FRAMEBUFFER, ctx.gl.COLOR_ATTACHMENT0, ctx.gl.RENDERBUFFER, sceneColorRB);
      ctx.gl.framebufferRenderbuffer(ctx.gl.FRAMEBUFFER, ctx.gl.DEPTH_ATTACHMENT, ctx.gl.RENDERBUFFER, sceneDepthRB);
      const st = ctx.gl.checkFramebufferStatus(ctx.gl.FRAMEBUFFER);
      ctx.gl.bindFramebuffer(ctx.gl.FRAMEBUFFER, null);
      if(st !== ctx.gl.FRAMEBUFFER_COMPLETE){
        ctx.gl.deleteFramebuffer(sceneFBO); ctx.gl.deleteRenderbuffer(sceneColorRB); ctx.gl.deleteRenderbuffer(sceneDepthRB);
        return false;
      }
      return true;
    }
    let ms = msaa;
    while(ms >= 1){ if(tryMSAA(ms)){ msaa = ms; break; } ms >>= 1; }
    if(ms < 1){ tryMSAA(0); msaa = 0; }

    resolveTex = ctx.gl.createTexture();
    ctx.gl.bindTexture(ctx.gl.TEXTURE_2D, resolveTex);
    ctx.gl.texImage2D(ctx.gl.TEXTURE_2D, 0, colorInternalFmt(), w, h, 0, ctx.gl.RGBA, colorType(), null);
    ctx.gl.texParameteri(ctx.gl.TEXTURE_2D, ctx.gl.TEXTURE_MIN_FILTER, ctx.gl.LINEAR);
    ctx.gl.texParameteri(ctx.gl.TEXTURE_2D, ctx.gl.TEXTURE_MAG_FILTER, ctx.gl.LINEAR);
    ctx.gl.texParameteri(ctx.gl.TEXTURE_2D, ctx.gl.TEXTURE_WRAP_S, ctx.gl.CLAMP_TO_EDGE);
    ctx.gl.texParameteri(ctx.gl.TEXTURE_2D, ctx.gl.TEXTURE_WRAP_T, ctx.gl.CLAMP_TO_EDGE);
    resolveFBO = ctx.gl.createFramebuffer();
    ctx.gl.bindFramebuffer(ctx.gl.FRAMEBUFFER, resolveFBO);
    ctx.gl.framebufferTexture2D(ctx.gl.FRAMEBUFFER, ctx.gl.COLOR_ATTACHMENT0, ctx.gl.TEXTURE_2D, resolveTex, 0);

    postTex = ctx.gl.createTexture();
    ctx.gl.bindTexture(ctx.gl.TEXTURE_2D, postTex);
    ctx.gl.texImage2D(ctx.gl.TEXTURE_2D, 0, ctx.gl.RGBA8, w, h, 0, ctx.gl.RGBA, ctx.gl.UNSIGNED_BYTE, null);
    ctx.gl.texParameteri(ctx.gl.TEXTURE_2D, ctx.gl.TEXTURE_MIN_FILTER, ctx.gl.LINEAR);
    ctx.gl.texParameteri(ctx.gl.TEXTURE_2D, ctx.gl.TEXTURE_MAG_FILTER, ctx.gl.LINEAR);
    postFBO = ctx.gl.createFramebuffer();
    ctx.gl.bindFramebuffer(ctx.gl.FRAMEBUFFER, postFBO);
    ctx.gl.framebufferTexture2D(ctx.gl.FRAMEBUFFER, ctx.gl.COLOR_ATTACHMENT0, ctx.gl.TEXTURE_2D, postTex, 0);

    bloomDownFBOs.forEach(f=>ctx.gl.deleteFramebuffer(f)); bloomDownTex.forEach(t=>ctx.gl.deleteTexture(t));
    bloomUpFBOs.forEach(f=>ctx.gl.deleteFramebuffer(f)); bloomUpTex.forEach(t=>ctx.gl.deleteTexture(t));
    bloomDownFBOs = []; bloomDownTex = [];
    bloomUpFBOs = []; bloomUpTex = [];
    const N = 6;
    let dw = Math.max(w>>1, 4), dh = Math.max(h>>1, 4);
    for(let i=0;i<N;i++){
      const t = ctx.gl.createTexture();
      ctx.gl.bindTexture(ctx.gl.TEXTURE_2D, t);
      ctx.gl.texImage2D(ctx.gl.TEXTURE_2D, 0, ctx.gl.RGBA8, dw, dh, 0, ctx.gl.RGBA, ctx.gl.UNSIGNED_BYTE, null);
      ctx.gl.texParameteri(ctx.gl.TEXTURE_2D, ctx.gl.TEXTURE_MIN_FILTER, ctx.gl.LINEAR);
      ctx.gl.texParameteri(ctx.gl.TEXTURE_2D, ctx.gl.TEXTURE_MAG_FILTER, ctx.gl.LINEAR);
      const f = ctx.gl.createFramebuffer();
      ctx.gl.bindFramebuffer(ctx.gl.FRAMEBUFFER, f);
      ctx.gl.framebufferTexture2D(ctx.gl.FRAMEBUFFER, ctx.gl.COLOR_ATTACHMENT0, ctx.gl.TEXTURE_2D, t, 0);
      bloomDownFBOs.push(f); bloomDownTex.push(t);
      const tu = ctx.gl.createTexture();
      ctx.gl.bindTexture(ctx.gl.TEXTURE_2D, tu);
      ctx.gl.texImage2D(ctx.gl.TEXTURE_2D, 0, ctx.gl.RGBA8, dw, dh, 0, ctx.gl.RGBA, ctx.gl.UNSIGNED_BYTE, null);
      ctx.gl.texParameteri(ctx.gl.TEXTURE_2D, ctx.gl.TEXTURE_MIN_FILTER, ctx.gl.LINEAR);
      const fu = ctx.gl.createFramebuffer();
      ctx.gl.bindFramebuffer(ctx.gl.FRAMEBUFFER, fu);
      ctx.gl.framebufferTexture2D(ctx.gl.FRAMEBUFFER, ctx.gl.COLOR_ATTACHMENT0, ctx.gl.TEXTURE_2D, tu, 0);
      bloomUpFBOs.push(fu); bloomUpTex.push(tu);
      dw = Math.max(dw>>1, 2); dh = Math.max(dh>>1, 2);
    }
    ctx.gl.bindFramebuffer(ctx.gl.FRAMEBUFFER, null);
  }
  function scene(){ return sceneFBO; }
  function sceneColor(){ return sceneColorRB; }
  function sceneDepth(){ return sceneDepthRB; }
  function resolve(){ return resolveFBO; }
  function resolveTexGet(){ return resolveTex; }
  function post(){ return postFBO; }
  function postTexGet(){ return postTex; }
  function bloomDown(level){ return { fb: bloomDownFBOs[level], tex: bloomDownTex[level] }; }
  function bloomUp(level){ return { fb: bloomUpFBOs[level], tex: bloomUpTex[level] }; }
  function bloomLevels(){ return bloomDownFBOs.length; }
  function msaaSamples(){ return msaa; }
  function hdr(){ return colorExt; }
  return { initFBOs, scene, sceneColor, sceneDepth, resolve, resolveTexGet,
           post, postTexGet, bloomDown, bloomUp, bloomLevels, msaaSamples, hdr };
})();

/* ---------- progs manager ---------- */
const progs = (() => {
  const gl = ctx.gl;
  const cache = {};
  function make(name, vs, fs){ if(!cache[name]) cache[name] = glx.make(vs, fs); return cache[name]; }
  function get(name){ return cache[name]; }
  function use(name){ const p = cache[name]; if(!p) throw new Error('Program not found: '+name); ctx.gl.useProgram(p); return p; }
  function u(p, name, ...args){
    const loc = p._uniforms[name];
    if(loc === undefined || loc === null) return;
    if(args.length === 1 && typeof args[0] === 'number') ctx.gl.uniform1f(loc, args[0]);
    else if(args.length === 1 && args[0] instanceof Float32Array){
      const a = args[0];
      switch(a.length){
        case 2: ctx.gl.uniform2fv(loc, a); break;
        case 3: ctx.gl.uniform3fv(loc, a); break;
        case 4: ctx.gl.uniform4fv(loc, a); break;
        default: ctx.gl.uniformMatrix4fv(loc, false, a); break;
      }
    } else if(args.length === 3) ctx.gl.uniform3f(loc, args[0], args[1], args[2]);
    else if(args.length === 2) ctx.gl.uniform2f(loc, args[0], args[1]);
  }
  function ui(p, name, v){ ctx.gl.uniform1i(p._uniforms[name], v|0); }
  return { make, get, use, u, ui };
})();

/* ---------- Body sphere VS / FS ---------- */
const BODY_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNorm;
uniform mat4 uMVP;
uniform mat4 uModel;
uniform mat3 uNormalMat;
out vec3 vLocalPos;
out vec3 vWorldPos;
out vec3 vLocalNorm;
out vec3 vWorldNorm;
void main(){
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorldPos = wp.xyz;
  vLocalPos = aPos;
  vLocalNorm = aNorm;
  vWorldNorm = normalize(uNormalMat * aNorm);
  gl_Position = uMVP * vec4(aPos, 1.0);
}
`;

/* Generic lit body shader builder.
 * fragMain returns vec3 (linear color) given (localPos, localNorm, worldNorm, sunDirLocal).
 * Receives world-space lighting in vWorldNorm.
 */
function bodyFS(fragMain){
  return `#version 300 es
precision highp float;
in vec3 vLocalPos;
in vec3 vWorldPos;
in vec3 vLocalNorm;
in vec3 vWorldNorm;
uniform vec3 uSunDir;        // world-space, from body to sun (already at distance r)
uniform vec3 uBodyCenter;    // world-space
uniform vec3 uBodyRadius;    // scalar as vec3
uniform float uSunIntensity;
uniform float uAmbient;      // small ambient term
uniform vec3 uAttenuateBy;   // rgb sun color tint
uniform vec3 uSunColor;
uniform float uTime;         // seconds, for animation
uniform float uHasRing;      // 1 if ring shadow should be applied
uniform vec3 uRingNormal;    // local up of ring (object-space)
uniform float uRingInner;
uniform float uRingOuter;
uniform vec3 uPlanetCenter;  // local-space center of mother planet (origin in local)
uniform float uPlanetRadius;
uniform float uPlanetRingInner;
uniform float uPlanetRingOuter;
uniform float uIsMoon;       // 1 if this body is a moon
uniform float uShadowStrength;
out vec4 fragColor;
${noiseGLSL}
${fragMain}
`;
}

/* Sun: self-emissive. */
const SUN_FS_BODY = `
void main(){
  vec3 p = normalize(vLocalPos);
  // sun's effective sun-direction in local space = its own axis (we set uSunDir = local Y)
  vec3 n = vLocalNorm;
  // granulation: F2 - F1 (cell borders), two frequencies
  float g1 = worley2(p * 76.0).y;
  float g2 = worley2(p * 31.0 + vec3(7.0)).y;
  float gran = smoothstep(0.0, 0.18, g1) * 0.55 + smoothstep(0.0, 0.22, g2) * 0.30;
  // supergranulation (large brightness variation)
  float sg = fbm3(p * 6.5) - 0.5;
  // sunspots: low-freq fbm threshold high to get rare dark patches
  float spotField = fbm3(p * 4.5 + vec3(0.0, 0.0, (uTime*60.0)*0.0));
  float spotMask = smoothstep(0.55, 0.78, spotField);
  // depth via small noise (per-cell variation)
  vec2 w = worley2(p * 22.0);
  float id = hash13(floor(p * 22.0));
  // umbra + penumbra from id-based jitter
  float presence = step(id, 0.06) * step(0.05, w.y);
  float umbra = presence * smoothstep(0.0, 0.3, w.x);
  // surface flow
  vec3 pf = p + vec3(0.0, 0.0, (uTime*60.0)*0.0);
  float flow = fbm3(pf * 3.5);
  // limb darkening
  float NdotV = max(dot(normalize(vWorldNorm), normalize(uBodyCenter - vWorldPos)), 0.0);
  float limb = 0.24 + 0.76 * pow(NdotV, 0.38);
  // build base brightness
  float bright = (0.85 + 0.35*sg - 0.35*gran + 0.06*flow);
  // sunspot dimming (umbra deep dark, penumbra lighter)
  bright -= umbra * 0.55;
  bright -= spotMask * 0.18 * (0.5 + 0.5*hash13(p*9.0));
  bright = max(bright, 0.15) * limb;
  // color: 5-stop ramp from red to white, with limb bias to redder
  vec3 c0 = vec3(0.45, 0.10, 0.02);
  vec3 c1 = vec3(1.0, 0.45, 0.05);
  vec3 c2 = vec3(1.0, 0.85, 0.45);
  vec3 c3 = vec3(1.0, 0.98, 0.85);
  vec3 c4 = vec3(1.05, 1.02, 0.98);
  float t = clamp(bright * 1.1 - 0.15, 0.0, 1.0);
  // darker areas cooler/redder, brighter hotter/whiter
  vec3 col = ramp5(t, c0, c1, c2, c3, c4);
  // limb darkening also cools (redder at edge)
  col = mix(col * vec3(1.0, 0.55, 0.30), col, limb);
  // sunspots: explicit darken + redden
  col = mix(col, col * vec3(0.25, 0.10, 0.05), umbra);
  // overall scale to HDR ~2.0
  col *= 2.0;
  fragColor = vec4(col, 1.0);
}
`;

/* Generic rocky (Mercury, Moon, etc.) with crater function */
const ROCKY_FS_BODY = `
float crater(vec3 p){
  // 4 octaves of worley2 with per-cell radius
  float h = 0.0;
  // oct 1
  vec2 w1 = worley2(p * 5.0);
  float id1 = hash13(floor(p*5.0));
  float rad1 = 0.13 + 0.22 * fract(id1 * 7.31);
  float t1 = w1.x / rad1;
  float bowl1 = (t1 < 1.0) ? -(1.0 - t1*t1) : 0.0;
  float rim1 = exp(-pow((t1-1.0)/0.26, 2.0));
  float pres1 = step(id1, 0.74) * smoothstep(0.60, 0.40, w1.x);
  h += (bowl1*0.90 + rim1*0.50) * 1.00 * pres1;
  // oct 2
  vec2 w2 = worley2(p * 12.0 + vec3(3.7));
  float id2 = hash13(floor(p*12.0 + vec3(3.7)));
  float rad2 = 0.13 + 0.22 * fract(id2 * 7.31);
  float t2 = w2.x / rad2;
  float bowl2 = (t2 < 1.0) ? -(1.0 - t1*t1) : 0.0;
  bowl2 = (t2 < 1.0) ? -(1.0 - t2*t2) : 0.0;
  float rim2 = exp(-pow((t2-1.0)/0.26, 2.0));
  float pres2 = step(id2, 0.74) * smoothstep(0.60, 0.40, w2.x);
  h += (bowl2*0.90 + rim2*0.50) * 0.52 * pres2;
  // oct 3
  vec2 w3 = worley2(p * 28.0 + vec3(11.0));
  float id3 = hash13(floor(p*28.0 + vec3(11.0)));
  float rad3 = 0.13 + 0.22 * fract(id3 * 7.31);
  float t3 = w3.x / rad3;
  float bowl3 = (t3 < 1.0) ? -(1.0 - t3*t3) : 0.0;
  float rim3 = exp(-pow((t3-1.0)/0.26, 2.0));
  float pres3 = step(id3, 0.74) * smoothstep(0.60, 0.40, w3.x);
  h += (bowl3*0.90 + rim3*0.50) * 0.26 * pres3;
  // oct 4
  vec2 w4 = worley2(p * 62.0 + vec3(31.0));
  float id4 = hash13(floor(p*62.0 + vec3(31.0)));
  float rad4 = 0.13 + 0.22 * fract(id4 * 7.31);
  float t4 = w4.x / rad4;
  float bowl4 = (t4 < 1.0) ? -(1.0 - t4*t4) : 0.0;
  float rim4 = exp(-pow((t4-1.0)/0.26, 2.0));
  float pres4 = step(id4, 0.74) * smoothstep(0.60, 0.40, w4.x);
  h += (bowl4*0.90 + rim4*0.50) * 0.13 * pres4;
  // base undulation
  h += (fbm3(p * 3.0) - 0.5) * 0.20;
  return h;
}
void main(){
  vec3 p = normalize(vLocalPos);
  float h = crater(p);
  // perturb normal via screen-space derivatives (§5)
  vec3 nLocal = perturbNormal(vLocalNorm, vWorldPos, h, 0.6);
  // albedo — driven by user uniform color
  vec3 baseCol = uAttenuateBy;
  // crater modulation (bowl darker, rim brighter)
  vec3 albedo = baseCol * (1.0 - h*0.35);
  // procedural color variation
  albedo *= (0.85 + 0.30 * fbm3(p * 8.0));
  // sun lighting (world-space normal)
  vec3 N = vWorldNorm;
  float NdotL = max(dot(N, uSunDir), 0.0);
  float shadow = 1.0;
  if (uHasRing > 0.5){
    // ring-on-planet: cast a ray from current local point toward sun direction (object-space),
    // intersect with local y=0 plane (ring plane), check if r is within ring range, attenuate
    vec3 sunLocalObj = uRingNormal * (1.0/uRingNormal.y); // wrong shape; we use uSunDir after model rotation
    // simpler: use uSunDir in world, transform to local via inverse model — pass via uniform
    // We will pre-transform in JS: pass uSunLocal as uniform.
  }
  // placeholder: ring shadow handled elsewhere (use uShadowStrength)
  vec3 lit = albedo * (uAmbient + (1.0 - uAmbient) * NdotL * uShadowStrength) * uSunIntensity;
  // sun color tint
  lit *= uSunColor;
  fragColor = vec4(lit, 1.0);
}
`;

/* Earth — sea, land, clouds, lights */
const EARTH_FS_BODY = `
float landMask(vec3 p){
  float h = fbm3(p * 7.0);
  // threshold 0.552 -> 71% ocean
  return smoothstep(0.552, 0.554, h);
}
float landHeight(vec3 p){
  return fbm3(p * 14.0);
}
void main(){
  vec3 p = normalize(vLocalPos);
  float sea = 1.0 - landMask(p);
  float land = landMask(p);
  vec3 deepOcean = vec3(0.02, 0.06, 0.16);
  vec3 shallow = vec3(0.10, 0.32, 0.42);
  // coastal shallow gradient
  float coastal = smoothstep(0.55, 0.60, fbm3(p*7.0)) * (1.0 - smoothstep(0.66, 0.78, fbm3(p*7.0)));
  vec3 oceanCol = mix(deepOcean, shallow, coastal * 0.55);
  // land colors
  float lh = landHeight(p);
  vec3 grassland = vec3(0.18, 0.30, 0.10);
  vec3 desert = vec3(0.50, 0.42, 0.25);
  vec3 tundra = vec3(0.55, 0.58, 0.55);
  vec3 rock = vec3(0.42, 0.36, 0.30);
  // latitude-based climate
  float lat = abs(p.z);
  vec3 landCol = mix(grassland, desert, smoothstep(0.30, 0.55, fbm3(p*5.0 + vec3(1.0))) * (1.0 - smoothstep(0.10, 0.40, lat)));
  landCol = mix(landCol, tundra, smoothstep(0.55, 0.85, lat));
  landCol = mix(landCol, rock, smoothstep(0.45, 0.85, lh));
  // ice caps
  float ice = smoothstep(0.78, 0.92, lat);
  landCol = mix(landCol, vec3(0.92, 0.94, 0.98), ice);
  vec3 albedo = mix(oceanCol, landCol, land);
  // terrain height-based bump (land only)
  float bump = land * (lh - 0.5) * 0.8;
  vec3 N = perturbNormal(vWorldNorm, vWorldPos, bump, 0.8);
  // clouds (separate time-modulated fbm layer)
  float cloudTime = uTime*60.0 * 0.0008;
  vec3 cp = p * 3.0;
  cp.x += cloudTime;
  cp.z += cloudTime * 0.5;
  // latitude band: more clouds near equator and mid-lat, less in subtropics
  float cloudBase = fbm3(cp + vec3(cloudTime, 0.0, 0.0));
  float latBand = 1.0 - 0.6 * abs(2.0 * lat - 0.7);
  float clouds = smoothstep(0.55, 0.75, cloudBase) * latBand;
  // specular (Blinn-Phong) on ocean — only if dot(N,L) > 0 and not cloudy
  vec3 viewDir = normalize(uBodyCenter - vWorldPos);
  vec3 H = normalize(uSunDir + viewDir);
  float spec = pow(max(dot(N, H), 0.0), 420.0) * (1.0 - clouds) * sea * 0.9;
  // lighting
  float NdotL = max(dot(N, uSunDir), 0.0);
  vec3 lit = albedo * (uAmbient + (1.0 - uAmbient) * NdotL) * uSunIntensity;
  // mix clouds (white)
  lit = mix(lit, vec3(1.0), clouds * 0.85);
  // specular added
  lit += spec * uSunIntensity * 2.0;
  // city lights: night side, on land, no clouds
  float night = 1.0 - smoothstep(-0.05, 0.05, dot(N, uSunDir));
  float cityNoise = pow(fbm3(p * 60.0), 4.0);
  float cities = night * land * (1.0 - clouds) * cityNoise;
  lit += cities * vec3(1.0, 0.85, 0.5) * 0.7;
  lit *= uSunColor;
  fragColor = vec4(lit, 1.0);
}
`;

/* Venus — clouds only */
const VENUS_FS_BODY = `
void main(){
  vec3 p = normalize(vLocalPos);
  float t = uTime*60.0 * 0.001;
  vec3 q = p * 4.0;
  q.x += t;
  // swirl bands: high-frequency fbm distorted by latitude
  float lat = p.z;
  float swirl = fbm3(q + vec3(0.0, lat*5.0, 0.0));
  float band = sin(p.z * 18.0 + swirl*4.0) * 0.5 + 0.5;
  vec3 c1 = vec3(0.95, 0.85, 0.65);
  vec3 c2 = vec3(0.85, 0.70, 0.45);

  vec3 albedo = mix(c2, c1, band) * mix(0.9, 1.05, swirl);
  albedo = mix(albedo, c3, smoothstep(0.65, 0.85, fbm3(p*8.0 + t)));
  vec3 N = perturbNormal(vWorldNorm, vWorldPos, (swirl-0.5)*0.5, 0.4);
  float NdotL = max(dot(N, uSunDir), 0.0);
  // 0.75 albedo
  vec3 lit = albedo * 0.75 * (uAmbient + (1.0 - uAmbient) * NdotL) * uSunIntensity;
  lit *= uSunColor;
  fragColor = vec4(lit, 1.0);
}
`;

/* Mars — rust red, hemispheric dichotomy */
const MARS_FS_BODY = `
float craterDamped(vec3 p){
  // same as rocky but half depth
  float h = 0.0;
  vec2 w1 = worley2(p * 5.0);
  float id1 = hash13(floor(p*5.0));
  float rad1 = 0.13 + 0.22 * fract(id1*7.31);
  float t1 = w1.x / rad1;
  float bowl = (t1 < 1.0) ? -(1.0 - t1*t1) : 0.0;
  float rim = exp(-pow((t1-1.0)/0.26, 2.0));
  float pres = step(id1, 0.74) * smoothstep(0.60, 0.40, w1.x);
  h += (bowl*0.45 + rim*0.25) * 0.6 * pres;
  return h + (fbm3(p*3.0)-0.5)*0.15;
}
void main(){
  vec3 p = normalize(vLocalPos);
  float h = craterDamped(p);
  // hemispheric dichotomy: southern (p.z<0) older highlands, more craters; northern fewer
  float ns = step(0.0, p.z);
  // attenuate crater height in north
  h *= mix(1.0, 0.22, ns);
  vec3 N = perturbNormal(vWorldNorm, vWorldPos, h, 0.5);
  // rust red — channels ratio 1 : 0.37 : 0.16 (linear)
  vec3 rust = vec3(0.50, 0.185, 0.080);
  vec3 albedo = rust * (0.85 + 0.35 * fbm3(p * 6.0));
  // dark plains (northern)
  albedo *= mix(0.95, 0.75, ns);
  // polar caps
  float lat = abs(p.z);
  albedo = mix(albedo, vec3(0.85, 0.82, 0.78), smoothstep(0.78, 0.92, lat) * (0.7 + 0.3*fbm3(p*8.0)));
  // Valles Marineris: long thin dark gash near equator
  float vm = exp(-pow((p.z - 0.25) / 0.04, 2.0)) * smoothstep(0.7, 0.4, abs(p.x));
  albedo *= mix(1.0, 0.55, vm * 0.6);
  float NdotL = max(dot(N, uSunDir), 0.0);
  vec3 lit = albedo * (uAmbient + (1.0 - uAmbient) * NdotL) * uSunIntensity * 0.55;
  lit *= uSunColor;
  fragColor = vec4(lit, 1.0);
}
`;

/* Gas giant — latitudinal bands + GRS option + hexagon */
function gasGiantFS(hasHexagon, hasGRS){
  // Build with conditional inclusion via simple string concat (avoid template-literal issues)
  let grsCode = '';
  if(hasGRS){
    grsCode = `
  // GRS: location ~ (lat=-0.32, lon=0)
  float grsLon = atan(p.y, p.x);
  vec2 grsC = vec2(grsLon + 0.6, lat + 0.32);
  float grs = exp(-((grsC.x*grsC.x)/0.18 + (grsC.y*grsC.y)/0.04));
  float grsT = fbm3(p * 22.0 + vec3((uTime*60.0)*0.0008, 0.0, 0.0));
  vec3 grsCol = vec3(0.85, 0.45, 0.25);
  vec3 grsEdge = vec3(1.0, 0.85, 0.65);
  albedo = mix(albedo, grsCol, grs * 0.8);
  albedo = mix(albedo, grsEdge, grs * smoothstep(0.30, 0.45, grs) * 0.4);`;
  }
  let hexCode = '';
  if(hasHexagon){
    hexCode = `
  // Hexagon at north pole (lat > 0.78)
  if (p.z > 0.78){
    float hexLon = atan(p.y, p.x);
    float hexH = mod(hexLon + 3.14159, 1.0472) - 0.5236;
    float hexEdge = 0.115 / max(cos(hexH), 0.4);
    float hexRing = exp(-pow((p.z - 0.82) * 12.0, 2.0)) * exp(-pow((abs(hexH) - hexEdge) * 18.0, 2.0));
    albedo = mix(albedo, albedo * 0.5, hexRing);
  }`;
  }
  return `
void main(){
  vec3 p = normalize(vLocalPos);
  float lat = p.z;
  float dist1 = fbm3(p * 4.0) * 0.06;
  float latD = lat + dist1;
  float bands = sin(latD * 30.0 + sin(latD*60.0)*0.5) * 0.5 + 0.5;
  float b1 = sin(latD * 12.0) * 0.5 + 0.5;
  float b2 = sin(latD * 22.0 + 1.7) * 0.5 + 0.5;
  float b3 = sin(latD * 50.0 + 3.4) * 0.5 + 0.5;
  float bmix = bands * 0.45 + b1 * 0.25 + b2 * 0.20 + b3 * 0.10;
  float turb = fbm3(p * 9.0);
  bmix = mix(bmix, bmix + (turb-0.5)*0.3, 0.6);
  float polarFade = sstep(0.78, 0.96, abs(lat));
  bmix = mix(bmix, 0.5, polarFade * 0.94);
  vec3 dark = vec3(0.30, 0.20, 0.12);
  vec3 light = vec3(0.85, 0.72, 0.55);
  vec3 albedo = mix(dark, light, bmix);
  albedo *= 0.85 + 0.30 * turb;${grsCode}${hexCode}
  vec3 N = perturbNormal(vWorldNorm, vWorldPos, (turb-0.5)*0.3, 0.25);
  float NdotL = max(dot(N, uSunDir), 0.0);
  float limb = 0.5 + 0.5 * pow(max(dot(N, normalize(uBodyCenter - vWorldPos)), 0.0), 0.5);
  vec3 lit = albedo * (uAmbient + (1.0 - uAmbient) * NdotL) * uSunIntensity * limb;
  lit *= uSunColor;
  fragColor = vec4(lit, 1.0);
}
`;
}

/* Ring shaders */
const RING_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNorm;
layout(location=2) in vec2 aUV;
uniform mat4 uMVP;
uniform mat4 uModel;
out vec2 vUV;
out vec3 vLocal;
void main(){
  vUV = aUV;
  vLocal = aPos;
  gl_Position = uMVP * vec4(aPos, 1.0);
}
`;

const RING_FS = `#version 300 es
precision highp float;
in vec2 vUV;
in vec3 vLocal;
uniform vec3 uRingNormal;        // local ring up
uniform vec3 uSunDir;            // world-space direction from ring point to sun
uniform vec3 uViewDir;           // world-space direction from ring point to camera
uniform float uRingInner;
uniform float uRingOuter;
uniform float uTime;
uniform int uPlanet;             // 0 saturn, 1 uranus, 2 jupiter
uniform float uPlanetRadius;
uniform vec3 uPlanetCenterWorld;
uniform float uPlanetShadow;     // 1 if enabled
uniform mat4 uModel;             // world transform of the ring disk
out vec4 fragColor;
${noiseGLSL}

float saturnDensity(float r){
  // piecewise from spec §2.7
  float d = 0.0;
  if (r >= 1.235 && r <= 1.53) d = max(d, 0.11);
  if (r >= 1.525 && r <= 1.95) d = max(d, 1.20);
  // Cassini gap 1.95-2.03: knock 87%
  if (r >= 1.95 && r <= 2.03) d = max(d, 0.58 * 0.13);
  if (r >= 2.025 && r <= 2.27) d = max(d, 0.58);
  // Encke 2.214 σ=0.0045 -92%
  float encke = 0.92 * exp(-pow((r - 2.214)/0.0045, 2.0));
  if (r >= 2.025 && r <= 2.27) d *= (1.0 - encke);
  // Keeler 2.265 σ=0.0018 -80%
  float keeler = 0.80 * exp(-pow((r - 2.265)/0.0018, 2.0));
  if (r >= 2.025 && r <= 2.27) d *= (1.0 - keeler);
  // F ring 2.324 σ=0.0055 +0.30
  d += 0.30 * exp(-pow((r - 2.324)/0.0055, 2.0));
  // high-freq noise
  float n = 0.70 + 0.60 * fbm3(vec3(r*230.0, 0.0, 0.0));
  return d * n;
}

float uranusDensity(float r){
  // narrow gaussians per §2.7
  float d = 0.0;
  d += 0.55 * exp(-pow((r - 1.951)/0.0055, 2.0));
  d += 0.20 * exp(-pow((r - 1.909)/0.0020, 2.0));
  d += 0.18 * exp(-pow((r - 1.863)/0.0020, 2.0));
  d += 0.15 * exp(-pow((r - 1.823)/0.0022, 2.0));
  d += 0.10 * exp(-pow((r - 1.786)/0.0024, 2.0));
  d += 0.08 * exp(-pow((r - 1.751)/0.0022, 2.0));
  d += 0.07 * exp(-pow((r - 1.690)/0.0025, 2.0));
  return d;
}

float jupiterDensity(float r){
  // uniform thin, slightly stronger inside
  float d = 0.016;
  if (r < 1.45 || r > 1.78) d *= 0.4;
  return d;
}

float planetShadow(vec3 worldPos){
  // analytic sphere intersection: occluder = planetCenterWorld, radius = uPlanetRadius
  vec3 oc = worldPos - uPlanetCenterWorld;
  float bb = dot(oc, uSunDir);
  if (bb > 0.0) return 1.0;
  float dmin2 = dot(oc,oc) - bb*bb;
  float dmin = sqrt(max(dmin2, 0.0));
  return sstep(uPlanetRadius*0.97, uPlanetRadius*1.09, dmin);
}

void main(){
  // r in planet radii (local.xz length, since ring is in xz plane in local)
  float r = length(vLocal.xz);
  // density
  float d = 0.0;
  if (uPlanet == 0) d = saturnDensity(r);
  else if (uPlanet == 1) d = uranusDensity(r);
  else d = jupiterDensity(r);
  if (r < uRingInner || r > uRingOuter || d < 1e-4) discard;
  // optical thickness
  float muView = max(abs(dot(uRingNormal, uViewDir)), 0.10);
  float muSun = max(abs(dot(uRingNormal, uSunDir)), 0.10);
  float tauView = d * 1.45 / muView;
  float tauSun = d * 1.45 / muSun;
  float alpha = 1.0 - exp(-tauView);
  // front/back light
  vec3 col;
  float frontlit = sign(dot(uSunDir, uViewDir));
  if (frontlit > 0.0){
    col = vec3(1.0 - exp(-tauSun)) * vec3(0.85, 0.78, 0.70) * 0.85;
  } else {
    col = exp(-tauSun*0.42) * 1.15 * (1.0 - exp(-tauSun*0.75)) * vec3(0.95, 0.85, 0.75);
  }
  // planet shadow on ring
  if (uPlanetShadow > 0.5){
    vec3 worldPos = (uModel * vec4(vLocal, 1.0)).xyz;
    float sh = planetShadow(worldPos);
    col *= mix(0.05, 1.0, sh);
  }
  fragColor = vec4(col * alpha, alpha);
}
`;

/* Atmosphere shader */
const ATMO_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
uniform mat4 uMVP;
uniform mat4 uModel;
out vec3 vWorld;
out vec3 vLocal;
void main(){
  vLocal = aPos;
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorld = wp.xyz;
  gl_Position = uMVP * vec4(aPos, 1.0);
}
`;
const ATMO_FS = `#version 300 es
precision highp float;
in vec3 vWorld;
in vec3 vLocal;
uniform vec3 uPlanetCenter;
uniform float uPlanetRadius;
uniform float uScaleH;       // shell thickness in planet radii (e.g. 0.03)
uniform vec3 uSunDir;        // world
uniform vec3 uColor;
uniform float uIntensity;
out vec4 fragColor;
${noiseGLSL}
void main(){
  vec3 rd = normalize(vWorld - uPlanetCenter); // outward, since shell is back-side
  // Use surface normal as approximation for back side
  vec3 n = normalize(vLocal);
  vec3 viewDir = normalize(vWorld - uPlanetCenter);
  // Density is highest at the silhouette edge (Fresnel-like)
  float fres = 1.0 - max(dot(-viewDir, n), 0.0);
  float dens = pow(fres, 2.5);
  // Lighting (only lit side: n is outward, uSunDir is from planet to sun)
  float NdotL = max(dot(-n, uSunDir), 0.0);
  float lit = pow(NdotL, 0.7);
  vec3 col = uColor * dens * lit * uIntensity;
  fragColor = vec4(col, dens * 0.9);
}
`;

/* Background nebula */
const BG_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
out vec2 vUV;
void main(){

const BG_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform vec2 uResolution;
uniform mat4 uInvVP;
uniform vec3 uCamPos;
uniform float uTime;
out vec4 fragColor;
${noiseGLSL}
// Galactic north in ecliptic frame, then map to world: (x_ecl, z_ecl, -y_ecl) → (-0.8678, 0.0003, -0.4972)
// We approximate as a unit vector that biases the fbm toward it.
const vec3 GAL_NORTH = vec3(-0.8678, -0.4972, 0.0003);

vec3 reconstructRay(vec2 uv){
  vec4 clip = vec4(uv * 2.0 - 1.0, -1.0, 1.0);
  vec4 view = uInvVP * clip;
  view /= view.w;
  return normalize(view.xyz - uCamPos);
}

void main(){
  vec2 uv = gl_FragCoord.xy / uResolution;
  vec3 rd = reconstructRay(uv);
  float gband = exp(-pow(dot(rd, GAL_NORTH), 2.0) * 24.0);
  // 3D fbm nebula
  vec3 q = rd * 5.0 + vec3(uTime * 0.002);
  float n = fbm3(q);
  float n2 = fbm3(q * 2.5 + 17.0);
  // base deep space color (linear ~0.002)
  vec3 col = vec3(0.0015, 0.0018, 0.0025);
  // milky way band
  col += vec3(0.030, 0.025, 0.018) * gband * (0.6 + 0.5*n);
  col += vec3(0.012, 0.008, 0.005) * n * gband * 1.4;
  // subtle dust darker band (clouds)
  col -= smoothstep(0.55, 0.75, n2) * vec3(0.005) * gband;
  fragColor = vec4(max(col, vec3(0.001)), 1.0);
}
`;

/* Asteroid VS — Kepler solver on GPU */
const AST_VS = `#version 300 es
precision highp float;
layout(location=0) in float aA;
layout(location=1) in float aE;
layout(location=2) in float aI;
layout(location=3) in float aOmega;
layout(location=4) in float aWbar;
layout(location=5) in float aM0;
layout(location=6) in float aN;
layout(location=7) in float aSize;
uniform float uTimeDays;   // JD - J2000 in days
uniform mat4 uVP;
uniform vec3 uCamPos;
uniform float uPxScale;
uniform float uCompress;
out vec3 vCol;
out float vBright;

${noiseGLSL}
float sstepF(float a, float b, float x) {
  float t = clamp((x - a) / (b - a), 0.0, 1.0);
  return t * t * (3.0 - 2.0 * t);
}

void main(){
  float M = aM0 + aN * uTimeDays;
  // wrap
  M = mod(M + 3.14159265, 6.28318530) - 3.14159265;
  float E = M + aE * sin(M) * (1.0 + aE * cos(M));
  for (int i = 0; i < 6; i++){
    float dE = (E - aE * sin(E) - M) / max(1.0 - aE * cos(E), 1e-4);
    E -= dE;
    if (abs(dE) < 1e-6) break;
  }
  float xPrime = aA * (cos(E) - aE);
  float yPrime = aA * sqrt(max(0.0, 1.0 - aE*aE)) * sin(E);
  float cw = cos(aWbar - aOmega), sw = sin(aWbar - aOmega);
  float cO = cos(aOmega), sO = sin(aOmega);
  float cI = cos(aI), sI = sin(aI);
  float x_ecl = (cw*cO - sw*sO*cI) * xPrime + (-sw*cO - cw*sO*cI) * yPrime;
  float y_ecl = (cw*sO + sw*cO*cI) * xPrime + (-sw*sO + cw*cO*cI) * yPrime;
  float z_ecl = (sw*sI) * xPrime + (cw*sI) * yPrime;
  // ecliptic -> world
  vec3 wp = vec3(x_ecl, z_ecl, -y_ecl);
  // compress radial distance (§3.5)
  float r_AU = length(vec3(x_ecl, y_ecl, z_ecl));
  float rDisp = 34.0 * pow(max(r_AU, 0.001), uCompress);
  wp = normalize(wp) * rDisp;
  gl_Position = uVP * vec4(wp, 1.0);
  // distance-based attenuation
  float dist = length(wp - uCamPos);
  vBright = clamp(20.0 / max(dist, 0.5), 0.05, 1.0);
  // size attenuation
  gl_PointSize = clamp(aSize * uPxScale * 35.0 / max(dist, 0.5), 0.75, 4.5);
  // color: slight variation by id
  float h = hash11(aA * 13.7 + aOmega * 7.3);
  vCol = mix(vec3(0.85, 0.85, 0.88), vec3(1.0, 0.95, 0.85), h);
}
`;
const AST_FS = `#version 300 es
precision highp float;
in vec3 vCol;
in float vBright;
out vec4 fragColor;
void main(){
  vec2 d = gl_PointCoord - 0.5;
  float r = length(d);
  if (r > 0.5) discard;
  float a = (1.0 - smoothstep(0.20, 0.50, r)) * vBright;
  fragColor = vec4(vCol * a, a);
}
`;

/* Orbit ribbon shader */
const ORBIT_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in float aSide;
layout(location=2) in float aS;     // parametric [0..1]
layout(location=3) in vec3 aTangent; // for ribbon direction
uniform mat4 uMVP;
uniform float uHalfWidthPx;
uniform vec2 uViewportHalfPx;
uniform vec3 uBodyPos;
out float vS;
out float vSide;
void main(){
  vec4 clip = uMVP * vec4(aPos, 1.0);
  // tangent projected to screen
  vec4 clipT = uMVP * vec4(aTangent, 1.0);
  vec3 ndc = clip.xyz / clip.w;
  vec3 ndcT = clipT.xyz / clipT.w;
  vec2 dir = normalize(ndcT.xy - ndc.xy);
  vec2 norm2 = vec2(-dir.y, dir.x);
  // half-width in NDC: halfWidthPx / viewportHalfPx (§7.2)
  vec2 offset = norm2 * (uHalfWidthPx / uViewportHalfPx);
  clip.xy += offset * aSide * clip.w;
  vS = aS;
  vSide = aSide;
  gl_Position = clip;
}
`;
const ORBIT_FS = `#version 300 es
precision highp float;
in float vS;
in float vSide;
uniform vec3 uBodyPos;
uniform float uArcPhase; // [0..1] parametric position of body
uniform vec3 uColor;
out vec4 fragColor;
${noiseGLSL}
void main(){
  // distance in arc parameter between this fragment and current body
  float d = abs(vS - uArcPhase);
  if (d > 0.5) d = 1.0 - d;
  // trail decays backwards (lower S)
  float trail = max(0.0, uArcPhase - vS);
  if (trail < 0.0) trail += 1.0;
  float base = 0.20;
  float peak = pow(max(0.0, 1.0 - d * 4.0), 3.2);
  float a = base + peak * 0.8;
  // soft edge
  a *= (1.0 - abs(vSide));
  fragColor = vec4(uColor * a, a * 0.85);
}
`;

/* Composite shaders — bloom extract, downsample, upsample, final */
const POST_VS = `#version 300 es

const BLOOM_EXTRACT_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform float uThreshold;
uniform float uKnee;
out vec4 fragColor;
void main(){
  vec3 c = texture(uTex, vUV).rgb;
  float lum = dot(c, vec3(0.299, 0.587, 0.114));
  // soft knee
  float soft = lum - uThreshold + uKnee;
  soft = clamp(soft, 0.0, 2.0 * uKnee);
  soft = soft * soft / (4.0 * uKnee + 1e-5);
  float contribution = max(soft, lum - uThreshold);
  contribution /= max(lum, 0.0001);
  fragColor = vec4(c * contribution, 1.0);
}
`;

const DOWN_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uTexel;
out vec4 fragColor;
void main(){
  // 13-tap downsample (approx)
  vec2 t = uTexel;
  vec3 c = texture(uTex, vUV).rgb * 0.125;
  c += texture(uTex, vUV + vec2(-t.x, -t.y)).rgb * 0.0625;
  c += texture(uTex, vUV + vec2( t.x, -t.y)).rgb * 0.0625;
  c += texture(uTex, vUV + vec2(-t.x,  t.y)).rgb * 0.0625;
  c += texture(uTex, vUV + vec2( t.x,  t.y)).rgb * 0.0625;
  c += texture(uTex, vUV + vec2(0.0, -t.y)).rgb * 0.125;
  c += texture(uTex, vUV + vec2(0.0,  t.y)).rgb * 0.125;
  c += texture(uTex, vUV + vec2(-t.x, 0.0)).rgb * 0.125;
  c += texture(uTex, vUV + vec2( t.x, 0.0)).rgb * 0.125;
  fragColor = vec4(c, 1.0);
}
`;

const UP_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uTexel;
out vec4 fragColor;
void main(){
  // 3x3 tent
  vec2 t = uTexel;
  vec3 c = vec3(0.0);
  c += texture(uTex, vUV + t * vec2(-1.0, -1.0)).rgb * 0.0625;
  c += texture(uTex, vUV + t * vec2( 0.0, -1.0)).rgb * 0.125;
  c += texture(uTex, vUV + t * vec2( 1.0, -1.0)).rgb * 0.0625;
  c += texture(uTex, vUV + t * vec2(-1.0,  0.0)).rgb * 0.125;
  c += texture(uTex, vUV).rgb * 0.25;
  c += texture(uTex, vUV + t * vec2( 1.0,  0.0)).rgb * 0.125;
  c += texture(uTex, vUV + t * vec2(-1.0,  1.0)).rgb * 0.0625;
  c += texture(uTex, vUV + t * vec2( 0.0,  1.0)).rgb * 0.125;
  c += texture(uTex, vUV + t * vec2( 1.0,  1.0)).rgb * 0.0625;
  fragColor = vec4(c, 1.0);
}
`;

const FINAL_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform vec2 uResolution;
uniform float uTime;
uniform float uExposure;
uniform float uBloomStrength;
uniform vec2 uSunScreen;       // screen-space sun position (NDC), or vec2(-2)
uniform float uSunVisible;     // 0..1
uniform float uFlareStrength;  // 0..1
uniform vec3 uSunColor;
out vec4 fragColor;
${noiseGLSL}
float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
void main(){
  vec3 scn = texture(uScene, vUV).rgb;
  // chromatic aberration
  vec2 c = vUV - 0.5;
  float r2 = dot(c, c);
  float ca = 0.003 * r2;
  vec3 col;
  col.r = texture(uScene, vUV + c * ca).r;
  col.g = scn.g;
  col.b = texture(uScene, vUV - c * ca).b;
  // bloom
  vec3 bloom = texture(uBloom, vUV).rgb;
  col += bloom * uBloomStrength;
  // exposure
  col *= uExposure;
  // lens flare (sun visible)
  if (uSunVisible > 0.0){
    vec2 sun = uSunScreen;
    vec2 d = vUV * 2.0 - 1.0 - sun;
    float dist = length(d);
    // core glow
    float core = exp(-dist * 8.0);
    // 6-spike star
    float ang = atan(d.y, d.x);
    float spike = 0.0;
    for (int i = 0; i < 6; i++){
      float a = float(i) * 1.0472;
      float cs = cos(ang - a);
      spike += pow(max(0.0, cs), 60.0);
    }
    float starS = spike * exp(-dist * 4.0);    float streak = exp(-pow(d.y / max(0.04, dist*0.5), 2.0)) * exp(-dist * 6.0);
    // 3-4 ghost discs along the sun→center line
    vec2 dir = normalize(-d + vec2(1e-6));
    float ghost = 0.0;
    for (int g = 0; g < 4; g++){
      vec2 gpos = vec2(0.3 + float(g) * 0.18);
      float gd = length(vUV - (sun * 0.5 + 0.5) + dir * gpos);
      ghost += exp(-gd * 30.0) * (1.0 - float(g) * 0.25);
    }
    float flare = (core * 0.6 + starS * 0.4 + streak * 0.5 + ghost * 0.3) * uFlareStrength;
    col += flare * uSunColor * uSunVisible;
  }
  // tonemap
  col = aces(col);
  // gamma 2.2
  col = pow(col, vec3(1.0/2.2));
  // vignette
  float vig = smoothstep(0.95, 0.4, length(c));
  col *= mix(0.55, 1.0, vig);
  // grain
  float g = (hash21(gl_FragCoord.xy + uTime * 60.0) - 0.5) * 0.04;
  col += g;
  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

in vec2 vUV;
uniform float uTime;
uniform vec3 uColor;
out vec4 fragColor;
${noiseGLSL}

  try {
    buildBodyPrograms();
    progs.make('ring', RING_VS, RING_FS); // re-make (idempotent guard)
    progs.make('atmo', ATMO_VS, ATMO_FS);
    progs.make('bg', BG_VS, BG_FS);
    progs.make('star', STAR_VS, STAR_FS);
    progs.make('asteroid', AST_VS, AST_FS);
    progs.make('orbit', ORBIT_VS, ORBIT_FS);
    progs.make('corona', CORONA_VS, CORONA_FS);
    progs.make('comet', COMET_VS, COMET_FS);
    progs.make('post:extract', POST_VS, BLOOM_EXTRACT_FS);
    progs.make('post:down',    POST_VS, DOWN_FS);
    progs.make('post:up',      POST_VS, UP_FS);
    progs.make('post:final',   POST_VS, FINAL_FS);
  } catch(e){
    console.error('Shader build failed', e);
    document.getElementById('fallback').textContent = '着色器编译失败：' + e.message;
    document.getElementById('fallback').style.display = 'flex';
    return false;
  }
  // Build meshes' GL resources
  setupSphere();
  setupDisk();
  setupQuad();
  setupStars();
  setupBelts();
  setupOrbits();
  // Setup pipeline
  pipeline.initFBOs(ctx.width, ctx.height);
  // UI
  setupUI();
  // Initial state
  ctx.time.jd = timeMod.nowJD();
  ctx.camera.targetSmooth = [0,0,0];
  ctx.camera.distanceSmooth = 80;
  ctx.compress = 0.62;
  ctx.compressTarget = 0.62;
  // Start
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
  return true;
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.dpr = dpr;
  const w = Math.floor(window.innerWidth * dpr);
  const h = Math.floor(window.innerHeight * dpr);
  ctx.canvas.width = w;
  ctx.canvas.height = h;
  ctx.canvas.style.width = window.innerWidth + 'px';
  ctx.canvas.style.height = window.innerHeight + 'px';
  ctx.width = w; ctx.height = h;
  // Only re-init FBOs if WebGL2 actually initialized successfully
  if(ctx.gl && typeof ctx.gl.VERTEX_SHADER !== 'undefined' && pipeline && pipeline.bloomLevels){
    pipeline.initFBOs(w, h);
  }
}

/* ---------- mesh GL resources ---------- */
const meshGL = {};
function setupSphere(){
  const gl = ctx.gl;
  const m = mesh.sphere;
  const vao = glx.vao(); gl.bindVertexArray(vao);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  // interleave pos(3) + norm(3) = 6 floats
  const interleaved = new Float32Array(m.vcount * 6);
  for(let i=0;i<m.vcount;i++){
    interleaved[i*6+0]=m.positions[i*3+0];
    interleaved[i*6+1]=m.positions[i*3+1];
    interleaved[i*6+2]=m.positions[i*3+2];
    interleaved[i*6+3]=m.normals[i*3+0];
    interleaved[i*6+4]=m.normals[i*3+1];
    interleaved[i*6+5]=m.normals[i*3+2];
  }
  gl.bufferData(gl.ARRAY_BUFFER, interleaved, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
  const ibo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.indices, gl.STATIC_DRAW);
  meshGL.sphere = { vao, icount: m.icount };
  gl.bindVertexArray(null);
}
function setupDisk(){
  const gl = ctx.gl;
  const m = mesh.disk;
  const vao = glx.vao(); gl.bindVertexArray(vao);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const inter = new Float32Array(m.vcount * 8);
  for(let i=0;i<m.vcount;i++){
    inter[i*8+0]=m.positions[i*3+0];
    inter[i*8+1]=m.positions[i*3+1];
    inter[i*8+2]=m.positions[i*3+2];
    inter[i*8+3]=m.normals[i*3+0];
    inter[i*8+4]=m.normals[i*3+1];
    inter[i*8+5]=m.normals[i*3+2];
    inter[i*8+6]=m.uvs[i*2+0];
    inter[i*8+7]=m.uvs[i*2+1];
  }
  gl.bufferData(gl.ARRAY_BUFFER, inter, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 32, 24);
  const ibo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.indices, gl.STATIC_DRAW);
  meshGL.disk = { vao, icount: m.icount };
  gl.bindVertexArray(null);
}
function setupQuad(){
  const gl = ctx.gl;
  const m = mesh.quad;
  const vao = glx.vao(); gl.bindVertexArray(vao);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, m.positions, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
  // + aSide attribute
  const side = new Float32Array([-1, 1, -1, 1]);
  const bufS = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bufS);
  gl.bufferData(gl.ARRAY_BUFFER, side, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 4, 0);
  meshGL.quad = { vao, vcount: 4 };
  gl.bindVertexArray(null);
}
function setupStars(){
  const gl = ctx.gl;
  // Generate ~11000 stars, biased to galactic plane
  const N = 11000;
  // Galactic north in world (ecliptic → world: x_ecl, z_ecl, -y_ecl)
  const galN = [-0.8678, 0.0003, -0.4972];
  const pos3 = new Float32Array(N*3);
  const col3 = new Float32Array(N*3);
  const sz1 = new Float32Array(N);
  let k = 0;
  while(k < N){
    const u = Math.random()*2-1, t = Math.random()*2*Math.PI;
    const sx = Math.sqrt(1-u*u)*Math.cos(t);
    const sy = Math.sqrt(1-u*u)*Math.sin(t);
    const sz = u;
    const dotG = sx*galN[0] + sy*galN[1] + sz*galN[2];
    const pref = 1 - Math.abs(dotG) * 1.6;
    if(Math.random() > pref * 0.7) continue;
    const bright = Math.pow(Math.random(), 3.6);
    const t2 = Math.random();
    let r=1,g=1,b=1;
    if(t2 < 0.02){ r=0.6; g=0.7; b=1.0; }
    else if(t2 < 0.10){ r=0.75; g=0.85; b=1.0; }
    else if(t2 < 0.22){ r=0.95; g=0.95; b=1.0; }
    else if(t2 < 0.40){ r=1.0; g=0.98; b=0.90; }
    else if(t2 < 0.65){ r=1.0; g=0.95; b=0.85; }
    else if(t2 < 0.85){ r=1.0; g=0.85; b=0.65; }
    else { r=1.0; g=0.70; b=0.45; }
    const scale = 0.4 + bright * 1.6;
    // bake star distance: place at 4000 along direction so they appear at infinity
    pos3[k*3+0]=sx*4000; pos3[k*3+1]=sy*4000; pos3[k*3+2]=sz*4000;
    col3[k*3+0]=r*scale; col3[k*3+1]=g*scale; col3[k*3+2]=b*scale;
    sz1[k] = 0.6 + bright * 0.8;
    k++;
  }
  const vao = glx.vao(); gl.bindVertexArray(vao);
  const bufP = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bufP);
  gl.bufferData(gl.ARRAY_BUFFER, pos3, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const bufC = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bufC);
  gl.bufferData(gl.ARRAY_BUFFER, col3, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
  const bufS = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bufS);
  gl.bufferData(gl.ARRAY_BUFFER, sz1, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
  meshGL.stars = { vao, count: k };
  gl.bindVertexArray(null);
}

function setupBelts(){
  const gl = ctx.gl;
  ctx.asteroidBuffers = {};
  const groups = [
    ['main', belts.genMainBelt(2000)], // reduced from 9000 for perf
    ['hilda', belts.genHilda(400)],
    ['trojan', belts.genTrojan(800)],
    ['kuiper', belts.genKuiper(2000)],
  ];
  for(const [name, data] of groups){
    const vao = glx.vao(); gl.bindVertexArray(vao);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    // 8 floats per vertex, attrib locations 0..7
    for(let i=0;i<8;i++){
      gl.enableVertexAttribArray(i);
      gl.vertexAttribPointer(i, 1, gl.FLOAT, false, 32, i*4);
    }
    ctx.asteroidBuffers[name] = { vao, count: data.length / 8 };
    gl.bindVertexArray(null);
  }
}

/* Orbit ribbon data: each frame, rebuild for planets+halley.
   But compression rarely changes — prebuild once at init and on compress change. */
const orbitCache = {};
function setupOrbits(){
  const gl = ctx.gl;
  for(const b of BODIES){
    if(!b.element && !b.isComet) continue;
    const ribbon = buildOrbitRibbon(b, ctx.compress);
    const vao = glx.vao(); gl.bindVertexArray(vao);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    // 3 pos + 1 side + 1 s + 3 tangent = 8 floats per vertex
    const stride = 8 * 4;
    gl.bufferData(gl.ARRAY_BUFFER, ribbon.data, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, stride, 12);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, stride, 16);
    gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 3, gl.FLOAT, false, stride, 20);
    orbitCache[b.id] = { vao, vcount: ribbon.data.length / 8, ribbon };
    gl.bindVertexArray(null);
  }
}
function buildOrbitRibbon(b, compress){
  // sample ellipse in orbit plane, rotate per element, apply compression
  const N = 256;
  const samples = [];
  if(b.isComet){
    // Halley
    const H = orbits.HALLEY;
    const I = H.I * DEG, w = H.omega * DEG, Omega = H.Omega * DEG;
    for(let i=0;i<=N;i++){
      const E = -Math.PI + (i/N) * 2 * Math.PI;
      const a = H.a;
      const xp = a * (Math.cos(E) - H.e);
      const yp = a * Math.sqrt(1 - H.e*H.e) * Math.sin(E);
      const cw = Math.cos(w), sw = Math.sin(w);
      const cO = Math.cos(Omega), sO = Math.sin(Omega);
      const cI = Math.cos(I), sI = Math.sin(I);
      const xe = (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp;
      const ye = (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp;
      const ze = (sw*sI)*xp + (cw*sI)*yp;
      const rA = Math.hypot(xe, ye, ze);
      const rD = orbits.displayR(rA, compress);
      const scale = rD / Math.max(rA, 1e-6);
      samples.push({ p:[xe*scale, ze*scale, -ye*scale], s:i/N });
    }
  } else {
    const p = b.element;
    const T = timeMod.jdToT(ctx.time.jd);
    const e = p.e + p.de * T;
    const I = (p.I + p.dI*T) * DEG;
    const wbar = (p.wbar + p.dwbar*T) * DEG;
    const Omega = (p.Omega + p.dOmega*T) * DEG;
    const w = wbar - Omega;
    const cw = Math.cos(w), sw = Math.sin(w);
    const cO = Math.cos(Omega), sO = Math.sin(Omega);
    const cI = Math.cos(I), sI = Math.sin(I);
    const a = p.a + p.da * T;
    for(let i=0;i<=N;i++){
      const E = -Math.PI + (i/N) * 2 * Math.PI;
      const xp = a * (Math.cos(E) - e);
      const yp = a * Math.sqrt(Math.max(0, 1 - e*e)) * Math.sin(E);
      const xe = (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp;
      const ye = (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp;
      const ze = (sw*sI)*xp + (cw*sI)*yp;
      const rA = Math.hypot(xe, ye, ze);
      const rD = orbits.displayR(rA, compress);
      const scale = rD / Math.max(rA, 1e-6);
      samples.push({ p:[xe*scale, ze*scale, -ye*scale], s:i/N });
    }
  }
  // build ribbon: 2 verts per sample (side=-1, side=+1)
  const data = new Float32Array(samples.length * 2 * 8);
  for(let i=0;i<samples.length;i++){
    const cur = samples[i].p;
    const prev = samples[Math.max(i-1, 0)].p;
    const next = samples[Math.min(i+1, samples.length-1)].p;
    const tx = next[0]-prev[0], ty = next[1]-prev[1], tz = next[2]-prev[2];
    const tlen = Math.hypot(tx,ty,tz) || 1;
    const tangent = [tx/tlen, ty/tlen, tz/tlen];
    const s = samples[i].s;
    // side -1
    const idx = i*2;
    data[idx*8+0]=cur[0]; data[idx*8+1]=cur[1]; data[idx*8+2]=cur[2];
    data[idx*8+3]=-1; data[idx*8+4]=s;
    data[idx*8+5]=tangent[0]; data[idx*8+6]=tangent[1]; data[idx*8+7]=tangent[2];
    // side +1
    const idx2 = i*2+1;
    data[idx2*8+0]=cur[0]; data[idx2*8+1]=cur[1]; data[idx2*8+2]=cur[2];
    data[idx2*8+3]=1; data[idx2*8+4]=s;
    data[idx2*8+5]=tangent[0]; data[idx2*8+6]=tangent[1]; data[idx2*8+7]=tangent[2];
  }
  return { data };
}
function rebuildOrbitsIfNeeded(){
  // we recompute on compress change — tracked by ctx.compressAnim
  if(ctx.compressAnim === null) return;
  if(performance.now() < ctx.compressAnim) return;
  ctx.compressAnim = null;
  setupOrbits();
}

/* ============================================================================
 *  FRAME LOOP
 * ========================================================================= */
let frameCount = 0;
function frame(now){
  frameCount++;
  ctx.frame = frameCount;
  // dt
  if(!ctx.lastT) ctx.lastT = now;
  const dtMs = Math.min(now - ctx.lastT, 100); // cap to 100ms to avoid jumps
  ctx.lastT = now;
  if(!ctx.time.paused){
    ctx.time.jd += ctx.time.speed * (dtMs / 1000);
  }
  // compress animation
  if(ctx.compress !== ctx.compressTarget){
    const delta = (ctx.compressTarget - ctx.compress) * Math.min(1, dtMs / 250);
    ctx.compress += delta;
    if(Math.abs(ctx.compress - ctx.compressTarget) < 0.002){
      ctx.compress = ctx.compressTarget;
    }
    // rebuild orbits mid-animation
    const t = performance.now();
    if(!ctx.compressRebuildTimer || t > ctx.compressRebuildTimer){
      setupOrbits();
      ctx.compressRebuildTimer = t + 50;
    }
  }
  // update orbits
  const T = timeMod.jdToT(ctx.time.jd);
  for(const b of BODIES){
    if(b.id === 'sun') continue;
    if(b.element){
      const p = orbits.computeEcl(b.element, T);
      const w = orbits.eclToWorld(p);
      b.posPrev = b.pos;
      b.pos = w;
      b.rAU = p.a; // approx for distance
      b.distFromSun = Math.hypot(w[0], w[1], w[2]);
    } else if(b.isComet){
      const p = orbits.halleyPos(ctx.time.jd);
      const w = orbits.eclToWorld(p);
      b.posPrev = b.pos;
      b.pos = w;
      b.distFromSun = orbits.displayR(p.r_AU, ctx.compress);
      b.rAU = p.r_AU;
    }
  }
  // moon positions
  for(const m of MOONS){
    const parent = BODIES.find(b => b.id === m.parentId);
    if(!parent) continue;
    const n = 2 * Math.PI / m.periodD; // rad/day
    const theta = n * (ctx.time.jd - J2000);
    const inc = m.incDeg * DEG;
    const a = m.orbitKm * 1e-3 * 1.496e8; // convert km -> AU
    // parent equatorial plane basis
    const axis = parent.rot ? orbits.rotAxisEcl(parent.rot) : [0,1,0];
    const basis = math.orthoBasis({x:axis[0],y:axis[1],z:axis[2]});
    const x = basis[0], y = basis[1], z = basis[2];
    // local circular: x_local = (cosθ, 0, sinθ)
    const lx = Math.cos(theta), lz = Math.sin(theta);
    // rotate around x by inc: y_local = -sin(inc)*lz, z_local = cos(inc)*lz
    const ly = -Math.sin(inc) * lz;
    const lz2 = Math.cos(inc) * lz;
    // for ecliptic reference (Moon), use world axes directly:
    if(m.ref === 'ecliptic'){
      // skip rotation, use ecliptic axes in world
      const w = [lx * a, lz * a, -ly * a]; // world = (x_ecl, z_ecl, -y_ecl)
      // parent world position + compressed moon distance
      const rD = orbits.displayR(a, ctx.compress);
      const moonDisp = rD;
      const scale = moonDisp / Math.max(a, 1e-6);
      m.pos = [parent.pos[0] + w[0]*scale, parent.pos[1] + w[1]*scale, parent.pos[2] + w[2]*scale];
    } else {
      // equator frame
      const wx = (x.x*lx + y.x*ly + z.x*lz2) * a;
      const wy = (x.y*lx + y.y*ly + z.y*lz2) * a;
      const wz = (x.z*lx + y.z*ly + z.z*lz2) * a;
      const rD = orbits.displayR(a, ctx.compress);
      const scale = rD / Math.max(a, 1e-6);
      m.pos = [parent.pos[0] + wx*scale, parent.pos[1] + wy*scale, parent.pos[2] + wz*scale];
    }
  }
  // camera target follow selected body (smooth)
  let targetBody = BODIES.find(b => b.id === ctx.selected) || MOONS.find(m => m.id === ctx.selected);
  if(targetBody){
    const tv = targetBody.pos;
    ctx.camera.targetSmooth = ctx.camera.targetSmooth.map((v,i)=>v + (tv[i]-v)*Math.min(1, dtMs/600));
    let desiredDist;
    if(targetBody.id === 'sun') desiredDist = 25;
    else if(targetBody.isComet) desiredDist = 4;
    else if(targetBody.isMoon) desiredDist = targetBody.radiusDisp * 8 + 0.5;
    else desiredDist = targetBody.radiusDisp * 6 + 1.5;
    ctx.camera.distanceSmooth += (desiredDist - ctx.camera.distanceSmooth) * Math.min(1, dtMs/600);
  }
  // camera position
  const yaw = ctx.camera.yaw, pitch = ctx.camera.pitch;
  const dist = ctx.camera.distanceSmooth;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const eye = [
    ctx.camera.targetSmooth[0] + dist * cp * sy,
    ctx.camera.targetSmooth[1] + dist * sp,
    ctx.camera.targetSmooth[2] + dist * cp * cy,
  ];
  const target = ctx.camera.targetSmooth;
  ctx.view = math.mLookAt(eye, target, [0,1,0]);
  // projection with dynamic near/far
  const distToTarget = dist;
  const near = Math.max(0.012, distToTarget * 0.0035);
  const far = Math.max(distToTarget * 14, 4200);
  ctx.proj = math.mPerspective(60 * DEG, ctx.width/ctx.height, near, far);
  ctx.mvp = math.mMult(ctx.proj, ctx.view);
  ctx.viewProj = ctx.mvp;
  ctx.eye = eye;
  ctx.invVP = math.mInvert(ctx.mvp);
  // render
  renderFrame(now);
  // ui update (throttled)
  if(frameCount % 12 === 0) updateUI();
  if(frameCount % 30 === 0) updateLabels();
  requestAnimationFrame(frame);
}
ctx.lastT = performance.now();

/* ---------- Render ---------- */
function renderFrame(now){
  const gl = ctx.gl;
  // §7.1: depthMask before clear
  gl.depthMask(true);
  gl.colorMask(true,true,true,true);
  gl.disable(gl.SCISSOR_TEST);
  gl.viewport(0,0,ctx.width, ctx.height);

  // Pass 1: scene to FBO
  gl.bindFramebuffer(gl.FRAMEBUFFER, pipeline.scene());
  // clear color to deep space dark
  gl.clearColor(0.001, 0.0012, 0.002, 1.0);
  gl.clearDepth(1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // 1. Background nebula
  drawBackground();
  // 2. Stars (placed at camera + dir*4000)
  drawStars();
  // 3. Sun corona first (behind sun)
  drawCorona();
  // 4. Orbit ribbons (additive, depth read on)
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE); // additive
  if(ctx.toggles.orbits) drawOrbits();
  // 5. Asteroid belts
  if(ctx.toggles.belts) drawBelts();
  // 6. Bodies (sun, planets, moons) with depth
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.enable(gl.CULL_FACE);
  drawBodies();
  // 7. Atmospheres
  gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.disable(gl.CULL_FACE);
  drawAtmospheres();
  // 8. Rings
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  drawRings();
  // 9. Comet tail
  if(ctx.toggles.comet) drawComet();
  // blit scene -> resolve
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, pipeline.scene());
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, pipeline.resolve());
  gl.blitFramebuffer(0,0,ctx.width,ctx.height, 0,0,ctx.width,ctx.height,
                     gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  // Now do bloom + composite
  const resolveT = pipeline.resolveTexGet();
  if(ctx.postFxEnabled){
    drawBloom(resolveT);
  }
  // Always reset viewport to full size — drawBloom mutates it for mip levels,
  // and drawFinal expects the full viewport.
  gl.viewport(0, 0, ctx.width, ctx.height);
  if(ctx.postFxEnabled){
    drawFinal(resolveT);
  } else {
    // Direct blit resolve -> default framebuffer
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, pipeline.resolve());
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
    gl.blitFramebuffer(0,0,ctx.width,ctx.height, 0,0,ctx.width,ctx.height,
                       gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
}

function drawBackground(){

}
