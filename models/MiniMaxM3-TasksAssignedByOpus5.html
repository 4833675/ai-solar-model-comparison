function drawOrbits(){
  const gl = ctx.gl;
  const p = progs.use('orbit');
  gl.uniformMatrix4fv(p._uniforms.uMVP, false, ctx.mvp);
  gl.uniform1f(p._uniforms.uHalfWidthPx, 1.4);
  gl.uniform2f(p._uniforms.uViewportHalfPx, ctx.width*0.5, ctx.height*0.5);
  for(const b of BODIES){
    if(!orbitCache[b.id]) continue;
    // determine arc phase: project current body pos onto orbit parametric S
    let arcPhase = 0.5;
    if(b.element){
      const p2 = orbits.computeEcl(b.element, timeMod.jdToT(ctx.time.jd));
      // find closest S along ribbon
      const best = findClosestS(orbitCache[b.id].ribbon, b.pos);
      arcPhase = best;
    } else if(b.isComet){
      // crude: 0.5
      arcPhase = 0.5;
    }
    const c = b.color || [0.6, 0.7, 0.9];
    gl.uniform3f(p._uniforms.uColor, c[0], c[1], c[2]);
    gl.uniform1f(p._uniforms.uArcPhase, arcPhase);
    gl.bindVertexArray(orbitCache[b.id].vao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, orbitCache[b.id].vcount);
  }
  gl.bindVertexArray(null);
}
function findClosestS(ribbon, worldPos){
  // sample some S, find min dist
  const N = 256;
  let bestS = 0, bestD = Infinity;
  const data = ribbon.data;
  for(let i=0;i<=N;i++){
    const idx = i*2*8;
    const dx = data[idx]-worldPos[0], dy = data[idx+1]-worldPos[1], dz = data[idx+2]-worldPos[2];
    const d = dx*dx+dy*dy+dz*dz;
    if(d < bestD){ bestD = d; bestS = i/N; }
  }
  return bestS;
}

function drawBody(b){
  const gl = ctx.gl;
  const progName = 'body:' + b.type;
  const p = progs.get(progName);
  if(!p) return;
  gl.useProgram(p);
  // build model matrix: translate + basis * rotY(phase) * scale
  const model = math.mIdent();
  // Compute rotation axis in world
  let axis = b.rotAxis || [0,1,0];
  if(b.rot){
    axis = orbits.rotAxisEcl(b.rot);
  }
  const basis = math.orthoBasis({x:axis[0],y:axis[1],z:axis[2]});
  // rotation phase
  let phase = 0;
  if(b.rotPeriodH && b.rotPeriodH !== 0){
    const daysSince = ctx.time.jd - J2000;
    const omega = 2 * Math.PI / (b.rotPeriodH / 24);
    let dPhase = omega * (ctx.time.speed + 1e-10) * (1/86400) * (1/24); // tiny per-frame
    // actually we want cumulative: just compute from JD
    phase = omega * daysSince;
    // clamp per-frame delta (not needed since we recompute from JD)
  }
  // build M = T(pos) * basis * Ry(phase) * S(radius)
  let m = math.mTranslate(math.mIdent(), b.pos[0], b.pos[1], b.pos[2]);
  m = math.mMult(m, math.basisToMat(basis[0], basis[1], basis[2]));
  m = math.mMult(m, math.rotY(phase));
  m = math.mMult(m, math.mScale(math.mIdent(), b.radiusDisp, b.radiusDisp, b.radiusDisp));
  const mvp = math.mMult(ctx.mvp, m);
  // Build normal matrix as a 3x3 in column-major (WebGL order).
  // For orthonormal basis without non-uniform scaling, normal matrix = basisToMat.
  // The basisToMat has columns = (x, y, z) which is exactly what we need for normals.
  const normalMat = new Float32Array([
    basis[0].x, basis[0].y, basis[0].z,
    basis[1].x, basis[1].y, basis[1].z,
    basis[2].x, basis[2].y, basis[2].z,
  ]);
  gl.uniformMatrix4fv(p._uniforms.uMVP, false, mvp);
  gl.uniformMatrix4fv(p._uniforms.uModel, false, m);
  gl.uniformMatrix3fv(p._uniforms.uNormalMat, false, normalMat);
  // sun direction in world
  const sunDir = b.id === 'sun' ? [0,1,0] : math.vNorm({x:-b.pos[0],y:-b.pos[1],z:-b.pos[2]});
  gl.uniform3f(p._uniforms.uSunDir, sunDir[0], sunDir[1], sunDir[2]);
  gl.uniform3f(p._uniforms.uBodyCenter, b.pos[0], b.pos[1], b.pos[2]);
  gl.uniform1f(p._uniforms.uBodyRadius, b.radiusDisp);
  // intensity (§7.8)
  let intensity;
  if(b.id === 'sun'){
    intensity = 1.0; // sun is self-emissive, intensity doesn't matter for shading
  } else {
    const rAU = Math.max(b.distFromSun || 1, 0.05);
    intensity = Math.max(0.26, Math.min(2.1, 1.5 * Math.pow(1/rAU, 0.40)));
  }
  gl.uniform1f(p._uniforms.uSunIntensity, intensity);
  gl.uniform1f(p._uniforms.uAmbient, 0.04);
  // sun color tint (slightly warm)
  gl.uniform3f(p._uniforms.uSunColor, 1.0, 0.97, 0.92);
  // animation time
  gl.uniform1f(p._uniforms.uTime, performance.now() * 0.001);
  // ring shadow attenuation (none by default)
  gl.uniform1f(p._uniforms.uHasRing, 0.0);
  gl.uniform1f(p._uniforms.uShadowStrength, 1.0);
  // body color tint (used by rocky)
  const c = b.color || [0.5, 0.5, 0.5];
  gl.uniform3f(p._uniforms.uAttenuateBy, c[0], c[1], c[2]);
  gl.bindVertexArray(meshGL.sphere.vao);
  gl.drawElements(gl.TRIANGLES, meshGL.sphere.icount, gl.UNSIGNED_INT, 0);
  gl.bindVertexArray(null);
}

function drawMoon(m){
  const gl = ctx.gl;
  const progName = 'body:' + m.type;
  const p = progs.get(progName);
  if(!p) return;
  gl.useProgram(p);
  const parent = BODIES.find(b => b.id === m.parentId);
  const axis = parent && parent.rot ? orbits.rotAxisEcl(parent.rot) : [0,1,0];
  const basis = math.orthoBasis({x:axis[0],y:axis[1],z:axis[2]});
  const daysSince = ctx.time.jd - J2000;
  // moon rotation: tidally locked approximation (matches orbital period)
  const omega = 2 * Math.PI / m.periodD;
  let phase = omega * daysSince;
  let model = math.mTranslate(math.mIdent(), m.pos[0], m.pos[1], m.pos[2]);
  // for moons, use simple model matrix (assume small enough that basis doesn't matter visually)
  const mm = math.mMult(model, math.mScale(math.mIdent(), m.radiusDisp, m.radiusDisp, m.radiusDisp));
  const mvp = math.mMult(ctx.mvp, mm);
  gl.uniformMatrix4fv(p._uniforms.uMVP, false, mvp);
  gl.uniformMatrix4fv(p._uniforms.uModel, false, mm);
  // 3x3 identity for normal matrix (column-major)
  gl.uniformMatrix3fv(p._uniforms.uNormalMat, false, new Float32Array([
    1,0,0,
    0,1,0,
    0,0,1
  ]));
  const sunDir = math.vNorm({x:-m.pos[0],y:-m.pos[1],z:-m.pos[2]});
  gl.uniform3f(p._uniforms.uSunDir, sunDir.x, sunDir.y, sunDir.z);
  gl.uniform3f(p._uniforms.uBodyCenter, m.pos[0], m.pos[1], m.pos[2]);
  gl.uniform1f(p._uniforms.uBodyRadius, m.radiusDisp);
  const rAU = Math.max(parent ? parent.distFromSun || 1 : 1, 0.05);
  const intensity = Math.max(0.26, Math.min(2.1, 1.5 * Math.pow(1/rAU, 0.40)));
  gl.uniform1f(p._uniforms.uSunIntensity, intensity);
  gl.uniform1f(p._uniforms.uAmbient, 0.04);
  gl.uniform3f(p._uniforms.uSunColor, 1.0, 0.97, 0.92);
  gl.uniform1f(p._uniforms.uTime, performance.now() * 0.001);
  gl.uniform1f(p._uniforms.uHasRing, 0.0);
  gl.uniform1f(p._uniforms.uShadowStrength, 1.0);
  gl.uniform3f(p._uniforms.uAttenuateBy, 0.8, 0.8, 0.8);
  gl.bindVertexArray(meshGL.sphere.vao);
  gl.drawElements(gl.TRIANGLES, meshGL.sphere.icount, gl.UNSIGNED_INT, 0);
  gl.bindVertexArray(null);
}

function drawAtmospheres(){
  const gl = ctx.gl;
  // disable culling, additive blending
  gl.disable(gl.CULL_FACE);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.depthMask(false);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  const p = progs.use('atmo');
  // Earth + Venus + Titan (thick); Mars thin; gas giants minimal
  const atmoBodies = [
    { id:'earth', color:[0.30, 0.55, 1.0], intensity: 1.0, scaleH: 0.025 },
    { id:'venus', color:[0.95, 0.85, 0.55], intensity: 1.1, scaleH: 0.045 },
    { id:'titan', color:[0.85, 0.55, 0.30], intensity: 0.8, scaleH: 0.06 },
    { id:'mars', color:[0.85, 0.55, 0.40], intensity: 0.4, scaleH: 0.018 },
  ];
  for(const ab of atmoBodies){
    const b = BODIES.find(x => x.id === ab.id);
    if(!b) continue;
    const R = b.radiusDisp;
    const scale = 1 + ab.scaleH * 7.5;
    const model = math.mMult(
      math.mTranslate(math.mIdent(), b.pos[0], b.pos[1], b.pos[2]),
      math.mScale(math.mIdent(), R*scale, R*scale, R*scale)
    );
    const mvp = math.mMult(ctx.mvp, model);
    gl.uniformMatrix4fv(p._uniforms.uMVP, false, mvp);
    gl.uniformMatrix4fv(p._uniforms.uModel, false, model);
    gl.uniform3f(p._uniforms.uPlanetCenter, b.pos[0], b.pos[1], b.pos[2]);
    gl.uniform1f(p._uniforms.uPlanetRadius, R);
    gl.uniform1f(p._uniforms.uScaleH, ab.scaleH);
    gl.uniform3f(p._uniforms.uSunDir,
      -b.pos[0]/Math.max(b.distFromSun,0.1),
      -b.pos[1]/Math.max(b.distFromSun,0.1),
      -b.pos[2]/Math.max(b.distFromSun,0.1));
    gl.uniform3f(p._uniforms.uColor, ab.color[0], ab.color[1], ab.color[2]);
    gl.uniform1f(p._uniforms.uIntensity, ab.intensity);
    gl.bindVertexArray(meshGL.sphere.vao);
    gl.drawElements(gl.TRIANGLES, meshGL.sphere.icount, gl.UNSIGNED_INT, 0);
    gl.bindVertexArray(null);
  }
  gl.disable(gl.BLEND);
}

function drawRings(){
  const gl = ctx.gl;
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.CULL_FACE);
  const p = progs.use('ring');
  const ringBodies = [
    { id:'saturn', planet:0, inner:1.235, outer:2.34, baseR: 2.0 },
    { id:'uranus', planet:1, inner:1.69, outer:2.00, baseR: 1.4 },
    { id:'jupiter',planet:2, inner:1.40, outer:1.81, baseR: 0.9 },
  ];
  for(const rb of ringBodies){
    const b = BODIES.find(x => x.id === rb.id);
    if(!b || !ctx.toggles.realDist === false) {} // always show if available
    // build model: rotate by planet's rotation axis (ring plane = equator)
    const axis = b.rot ? orbits.rotAxisEcl(b.rot) : [0,1,0];
    const basis = math.orthoBasis({x:axis[0],y:axis[1],z:axis[2]});
    // ring plane normal in world = basis[1]
    const R = b.radiusDisp;
    const inner = rb.inner * R;
    const outer = rb.outer * R;
    const baseR = rb.baseR * R;
    const model = math.mMult(
      math.mTranslate(math.mIdent(), b.pos[0], b.pos[1], b.pos[2]),
      math.basisToMat(basis[0], basis[1], basis[2])
    );
    const scl = math.mIdent();
    scl[0] = baseR; scl[5] = 1; scl[10] = baseR;
    const ms = math.mMult(model, scl);
    const mvp = math.mMult(ctx.mvp, ms);
    gl.uniformMatrix4fv(p._uniforms.uMVP, false, mvp);
    gl.uniformMatrix4fv(p._uniforms.uModel, false, ms);
    gl.uniform3f(p._uniforms.uRingNormal, basis[1].x, basis[1].y, basis[1].z);
    gl.uniform3f(p._uniforms.uSunDir,
      -b.pos[0]/Math.max(b.distFromSun,0.1),
      -b.pos[1]/Math.max(b.distFromSun,0.1),
      -b.pos[2]/Math.max(b.distFromSun,0.1));
    // view dir from ring center to camera
    const vd = [ctx.eye[0]-b.pos[0], ctx.eye[1]-b.pos[1], ctx.eye[2]-b.pos[2]];
    const vdl = Math.hypot(...vd) || 1;
    gl.uniform3f(p._uniforms.uViewDir, vd[0]/vdl, vd[1]/vdl, vd[2]/vdl);
    gl.uniform1f(p._uniforms.uRingInner, rb.inner);
    gl.uniform1f(p._uniforms.uRingOuter, rb.outer);
    gl.uniform1f(p._uniforms.uTime, performance.now() * 0.001);
    gl.uniform1i(p._uniforms.uPlanet, rb.planet);
    gl.uniform1f(p._uniforms.uPlanetRadius, R);
    gl.uniform3f(p._uniforms.uPlanetCenterWorld, b.pos[0], b.pos[1], b.pos[2]);
    gl.uniform1f(p._uniforms.uPlanetShadow, 1.0);
    gl.bindVertexArray(meshGL.disk.vao);
    gl.drawElements(gl.TRIANGLES, meshGL.disk.icount, gl.UNSIGNED_INT, 0);
    gl.bindVertexArray(null);
  }
  gl.disable(gl.BLEND);
}

function drawComet(){
  const gl = ctx.gl;
  const halley = BODIES.find(b => b.id === 'halley');
  if(!halley) return;
  const sun = BODIES[0];
  // sun direction from comet
  const dx = sun.pos[0]-halley.pos[0], dy = sun.pos[1]-halley.pos[1], dz = sun.pos[2]-halley.pos[2];
  const dl = Math.hypot(dx,dy,dz);
  if(dl > 6.5) return; // §4.2: r>6.5AU skip
  const dirToSun = [dx/dl, dy/dl, dz/dl];
  // anti-sun (tail direction)
  const tailDir = [-dirToSun[0], -dirToSun[1], -dirToSun[2]];
  const p = progs.use('comet');
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.depthMask(false);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  // ion tail (blue, straight)
  const lenI = 2.0 * (3/dl)*(3/dl);
  // use a small quad billboard along tail direction (camera-facing): approximate with view-up axis
  // Build billboard axes: tailDir + camera right + camera up
  // Simplification: use a single quad stretched along tailDir
  drawCometBillboard(p, halley.pos, tailDir, lenI, [0.4, 0.6, 1.0], 1.0);
  // dust tail (warmer, broader): bend slightly using velocity
  const vel = (halley.posPrev && halley.pos) ? [
    halley.pos[0]-halley.posPrev[0],
    halley.pos[1]-halley.posPrev[1],
    halley.pos[2]-halley.posPrev[2]
  ] : [0,0,0];
  // dust tail curves slightly
  const bend = 0.2;
  const dustDir = [
    tailDir[0] + bend*vel[0]*1000,
    tailDir[1] + bend*vel[1]*1000,
    tailDir[2] + bend*vel[2]*1000
  ];
  const dlD = Math.hypot(...dustDir);
  drawCometBillboard(p, halley.pos, [dustDir[0]/dlD, dustDir[1]/dlD, dustDir[2]/dlD], lenI*0.8, [1.0, 0.8, 0.55], 0.7);
  gl.disable(gl.BLEND);
}
function drawCometBillboard(p, head, dir, length, color, bright){
  // Build a quad of 4 verts in world space, billboarded toward camera
  const camToHead = [ctx.eye[0]-head[0], ctx.eye[1]-head[1], ctx.eye[2]-head[2]];
  const chl = Math.hypot(...camToHead);
  const camToHeadN = [camToHead[0]/chl, camToHead[1]/chl, camToHead[2]/chl];
  // up: perpendicular to dir and camToHead
  const up = [
    dir[1]*camToHeadN[2] - dir[2]*camToHeadN[1],
    dir[2]*camToHeadN[0] - dir[0]*camToHeadN[2],
    dir[0]*camToHeadN[1] - dir[1]*camToHeadN[0]
  ];
  const ul = Math.hypot(...up) || 1;
  const upN = [up[0]/ul, up[1]/ul, up[2]/ul];
  const w = 0.25 * length;
  const tip = [head[0]+dir[0]*length, head[1]+dir[1]*length, head[2]+dir[2]*length];
  // 4 verts: head+w*up, head-w*up, tip+w*up, tip-w*up
  const verts = new Float32Array([
    head[0]+upN[0]*w, head[1]+upN[1]*w, head[2]+upN[2]*w,
    head[0]-upN[0]*w, head[1]-upN[1]*w, head[2]-upN[2]*w,
    tip[0]+upN[0]*w*0.3, tip[1]+upN[1]*w*0.3, tip[2]+upN[2]*w*0.3,
    tip[0]-upN[0]*w*0.3, tip[1]-upN[1]*w*0.3, tip[2]-upN[2]*w*0.3,
  ]);
  const vao = glx.vao(); ctx.gl.bindVertexArray(vao);
  const buf = ctx.gl.createBuffer(); ctx.gl.bindBuffer(ctx.gl.ARRAY_BUFFER, buf);
  ctx.gl.bufferData(ctx.gl.ARRAY_BUFFER, verts, ctx.gl.DYNAMIC_DRAW);
  ctx.gl.enableVertexAttribArray(0); ctx.gl.vertexAttribPointer(0, 3, ctx.gl.FLOAT, false, 0, 0);
  ctx.gl.uniformMatrix4fv(p._uniforms.uVP, false, ctx.mvp);
  ctx.gl.uniform3f(p._uniforms.uSunWorld, ctx.eye[0], ctx.eye[1], ctx.eye[2]);
  ctx.gl.uniform1f(p._uniforms.uLen, 1.0);
  ctx.gl.uniform3f(p._uniforms.uColor, color[0], color[1], color[2]);
  ctx.gl.uniform1f(p._uniforms.uBright, bright);
  ctx.gl.drawArrays(ctx.gl.TRIANGLE_STRIP, 0, 4);
  ctx.gl.deleteBuffer(buf); ctx.gl.deleteVertexArray(vao);
  ctx.gl.bindVertexArray(null);
}

/* ---------- Bloom + composite ---------- */
function drawBloom(srcTex){
  const gl = ctx.gl;
  // extract
  gl.bindFramebuffer(gl.FRAMEBUFFER, pipeline.bloomDown(0).fb);
  gl.viewport(0,0, ctx.width>>1, ctx.height>>1);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.depthMask(false);
  const pEx = progs.use('post:extract');
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.uniform1i(pEx._uniforms.uTex, 0);
  gl.uniform1f(pEx._uniforms.uThreshold, 1.25);
  gl.uniform1f(pEx._uniforms.uKnee, 0.6);
  gl.bindVertexArray(meshGL.quad.vao);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // downsample chain
  let prevTex = pipeline.bloomDown(0).tex;
  for(let i=1;i<pipeline.bloomLevels();i++){
    const dw = Math.max((ctx.width >> (i+1)), 2);
    const dh = Math.max((ctx.height >> (i+1)), 2);
    gl.viewport(0,0, dw, dh);
    gl.bindFramebuffer(gl.FRAMEBUFFER, pipeline.bloomDown(i).fb);
    const pD = progs.use('post:down');
    gl.bindTexture(gl.TEXTURE_2D, prevTex);
    gl.uniform1i(pD._uniforms.uTex, 0);
    gl.uniform2f(pD._uniforms.uTexel, 1/dw, 1/dh);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    prevTex = pipeline.bloomDown(i).tex;
  }
  // upsample chain: additive blend, accumulate into up framebuffers
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); // additive — §7.3
  gl.depthMask(false);
  for(let i=pipeline.bloomLevels()-1;i>=0;i--){
    const dw = Math.max((ctx.width >> (i+1)), 2);
    const dh = Math.max((ctx.height >> (i+1)), 2);
    gl.viewport(0,0, dw, dh);
    gl.bindFramebuffer(gl.FRAMEBUFFER, pipeline.bloomUp(i).fb);
    // clear first
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    const pU = progs.use('post:up');
    gl.bindTexture(gl.TEXTURE_2D, pipeline.bloomDown(i).tex);
    gl.uniform1i(pU._uniforms.uTex, 0);
    gl.uniform2f(pU._uniforms.uTexel, 1/dw, 1/dh);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    // optional: add next coarser up level
    if(i+1 < pipeline.bloomLevels()){
      const dw2 = Math.max((ctx.width >> (i+2)), 2);
      const dh2 = Math.max((ctx.height >> (i+2)), 2);
      // upsample coarser into current
      const pU2 = progs.use('post:up');
      gl.bindTexture(gl.TEXTURE_2D, pipeline.bloomUp(i+1).tex);
      gl.uniform1i(pU2._uniforms.uTex, 0);
      gl.uniform2f(pU2._uniforms.uTexel, 1/dw2, 1/dh2);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
  }
  gl.disable(gl.BLEND);
}

function drawFinal(sceneTex){
  const gl = ctx.gl;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0, ctx.width, ctx.height);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.depthMask(false);
  gl.colorMask(true,true,true,true);
  const p = progs.use('post:final');
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(p._uniforms.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, pipeline.bloomUp(0).tex);
  gl.uniform1i(p._uniforms.uBloom, 1);
  gl.uniform2f(p._uniforms.uResolution, ctx.width, ctx.height);
  gl.uniform1f(p._uniforms.uTime, performance.now() * 0.001);
  gl.uniform1f(p._uniforms.uExposure, 1.0);
  gl.uniform1f(p._uniforms.uBloomStrength, ctx.toggles.glow ? 0.34 : 0.0);
  // sun position in NDC
  const sun = BODIES[0];
  const mvp = ctx.mvp;
  const sp = [sun.pos[0], sun.pos[1], sun.pos[2], 1];
  const x = mvp[0]*sp[0]+mvp[4]*sp[1]+mvp[8]*sp[2]+mvp[12];
  const y = mvp[1]*sp[0]+mvp[5]*sp[1]+mvp[9]*sp[2]+mvp[13];
  const w = mvp[3]*sp[0]+mvp[7]*sp[1]+mvp[11]*sp[2]+mvp[15];
  let sunVis = 0;
  let sunNDC = [-2,-2];
  if(w > 0){
    sunNDC = [x/w, y/w];
    if(sunNDC[0] > -1.2 && sunNDC[0] < 1.2 && sunNDC[1] > -1.2 && sunNDC[1] < 1.2){
      sunVis = 1;
    }
  }
  gl.uniform2f(p._uniforms.uSunScreen, sunNDC[0], sunNDC[1]);
  gl.uniform1f(p._uniforms.uSunVisible, sunVis);
  gl.uniform1f(p._uniforms.uFlareStrength, 0.45);
  gl.uniform3f(p._uniforms.uSunColor, 1.0, 0.85, 0.55);
  gl.bindVertexArray(meshGL.quad.vao);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindVertexArray(null);
}

/* ============================================================================
 *  UI
 * ========================================================================= */
function setupUI(){
  // left body list
  const left = document.getElementById('ui-left');
  let html = '<h3>天体</h3>';
  html += '<div class="group">恒星</div>';
  html += `<div class="body-item" data-id="sun"><div class="dot" style="background:#ffcc66"></div>太阳</div>`;
  html += '<div class="group">行星</div>';
  for(const p of orbits.PLANETS){
    const c = BODIES.find(b => b.id === p.id).color;
    const hex = '#' + c.map(v => Math.round(v*255).toString(16).padStart(2,'0')).join('');
    html += `<div class="body-item" data-id="${p.id}"><div class="dot" style="background:${hex}"></div>${p.name}</div>`;
  }
  // Halley
  html += '<div class="group">彗星</div>';
  html += `<div class="body-item" data-id="halley"><div class="dot" style="background:#aabbee"></div>哈雷彗星</div>`;
  // moons
  html += '<div class="group">卫星</div>';
  for(const m of MOONS){
    html += `<div class="body-item indent" data-id="${m.id}">${m.name}</div>`;
  }
  left.innerHTML = html;
  left.addEventListener('click', e => {
    const item = e.target.closest('.body-item');
    if(!item) return;
    const id = item.dataset.id;
    ctx.selected = id;
    [...left.querySelectorAll('.body-item')].forEach(x => x.classList.toggle('selected', x.dataset.id === id));
  });
  // toggles
  const tg = document.getElementById('ui-toggles');
  let th = '<h3>显示</h3>';
  const toggleList = [
    ['orbits','轨道'], ['labels','天体名称'], ['moons','卫星'],
    ['belts','小行星带'], ['comet','哈雷彗星'], ['realDist','真实距离'], ['glow','泛光'],
  ];
  for(const [k,label] of toggleList){
    th += `<button class="${ctx.toggles[k]?'active':''}" data-toggle="${k}">${label}</button>`;
  }
  tg.innerHTML = th;
  tg.addEventListener('click', e => {
    const b = e.target.closest('button[data-toggle]');
    if(!b) return;
    const k = b.dataset.toggle;
    if(k === 'realDist'){
      ctx.toggles.realDist = !ctx.toggles.realDist;
      ctx.compressTarget = ctx.toggles.realDist ? 1.0 : 0.62;
      ctx.compressRebuildTimer = performance.now() + 50;
      b.classList.toggle('active', ctx.toggles.realDist);
    } else {
      ctx.toggles[k] = !ctx.toggles[k];
      b.classList.toggle('active', ctx.toggles[k]);
    }
  });
  // bottom controls
  const playBtn = document.getElementById('btn-play');
  playBtn.addEventListener('click', () => {
    ctx.time.paused = !ctx.time.paused;
    playBtn.textContent = ctx.time.paused ? '▶ 播放' : '⏸ 暂停';
    playBtn.classList.toggle('active', !ctx.time.paused);
  });
  // speed slider
  const slider = document.getElementById('speed-slider');
  slider.value = String(Math.log10(Math.max(1e-10, Math.abs(ctx.time.speed)) / 1.157407e-5) * (100/8.55) * (ctx.time.speed < 0 ? -1 : 1) + 50);
  slider.addEventListener('input', () => {
    const v = parseFloat(slider.value) - 50;
    ctx.time.speed = timeMod.speedToDPS(v * 2);
  });
  document.getElementById('btn-now').addEventListener('click', () => {
    ctx.time.jd = timeMod.nowJD();
  });
  // drag / wheel for camera
  let dragging = false, lastX = 0, lastY = 0;
  ctx.canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; ctx.canvas.setPointerCapture(e.pointerId); });
  ctx.canvas.addEventListener('pointermove', e => {
    if(!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    ctx.camera.yaw += dx * 0.005;
    ctx.camera.pitch = Math.max(-1.4, Math.min(1.4, ctx.camera.pitch + dy * 0.005));
  });
  ctx.canvas.addEventListener('pointerup', e => { dragging = false; });
  ctx.canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const k = Math.exp(e.deltaY * 0.001);
    ctx.camera.distanceSmooth = Math.max(0.5, Math.min(8000, ctx.camera.distanceSmooth * k));
  }, { passive:false });
  // click for focus
  ctx.canvas.addEventListener('click', e => {
    if(e.target !== ctx.canvas) return;
    // pick body near click
    const rect = ctx.canvas.getBoundingClientRect();
    const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    const ny = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
    let best = null, bestD = 0.05;
    const all = BODIES.concat(MOONS);
    const mvp = ctx.mvp;
    for(const b of all){
      if(b.id === 'halley' && ctx.toggles.comet === false) continue;
      const bp = [b.pos[0], b.pos[1], b.pos[2], 1];
      const sx = mvp[0]*bp[0]+mvp[4]*bp[1]+mvp[8]*bp[2]+mvp[12];
      const sy = mvp[1]*bp[0]+mvp[5]*bp[1]+mvp[9]*bp[2]+mvp[13];
      const sw = mvp[3]*bp[0]+mvp[7]*bp[1]+mvp[11]*bp[2]+mvp[15];
      if(sw <= 0) continue;
      const ndcX = sx/sw, ndcY = sy/sw;
      const d = Math.hypot(ndcX - nx, ndcY - ny);
      if(d < bestD){
        bestD = d;
        best = b;
      }
    }
    if(best){
      ctx.selected = best.id;
      [...document.getElementById('ui-left').querySelectorAll('.body-item')].forEach(x => x.classList.toggle('selected', x.dataset.id === best.id));
    }
  });
  // keyboard
  window.addEventListener('keydown', e => {
    if(e.code === 'Space'){ e.preventDefault(); document.getElementById('btn-play').click(); }
    else if(e.code === 'ArrowLeft'){
      const slider = document.getElementById('speed-slider');
      slider.value = String(Math.max(0, parseFloat(slider.value) - 5));
      slider.dispatchEvent(new Event('input'));
    } else if(e.code === 'ArrowRight'){
      const slider = document.getElementById('speed-slider');
      slider.value = String(Math.min(100, parseFloat(slider.value) + 5));
      slider.dispatchEvent(new Event('input'));
    } else if(e.code === 'KeyH'){
      document.body.classList.toggle('hidden-ui');
    }
  });
  // initial state: real-time speed
  ctx.time.speed = 1.157407e-5; // ~1 sec per real second ≈ 1 day per second
  // preset selected to earth
  document.querySelector('#ui-left .body-item[data-id="earth"]').classList.add('selected');
}

function updateUI(){
  document.getElementById('utc').textContent = timeMod.utcString(ctx.time.jd);
  document.getElementById('speed').textContent = timeMod.speedLabel(ctx.time.speed);
  // out-of-range warning
  const year = (ctx.time.jd - JD_UNIX_OFFSET) * 86400000;
  const d = new Date(year);
  const y = d.getUTCFullYear();
  document.getElementById('warn').classList.toggle('show', y < 1800 || y > 2050);
  // info panel
  const right = document.getElementById('ui-right');
  let body = BODIES.find(b => b.id === ctx.selected) || MOONS.find(m => m.id === ctx.selected);
  if(!body){ right.innerHTML = '<h3>信息</h3>'; return; }
  let helioc = '', dist = '', speed = '';
  if(body.element){
    const p = orbits.computeEcl(body.element, timeMod.jdToT(ctx.time.jd));
    const lon = Math.atan2(p.y_ecl, p.x_ecl) / DEG;
    const lat = Math.atan2(p.z_ecl, Math.hypot(p.x_ecl, p.y_ecl)) / DEG;
    helioc = `${((lon+360)%360).toFixed(2)}°, ${lat.toFixed(2)}°`;
    dist = `${p.a.toFixed(3)} AU`;
    speed = `${orbits.visViva(p.a, p.a).toFixed(2)} km/s`;
  } else if(body.isComet){
    const p = orbits.halleyPos(ctx.time.jd);
    helioc = '—';
    dist = `${p.r_AU.toFixed(3)} AU`;
    speed = `${orbits.visViva(p.r_AU, 17.834).toFixed(2)} km/s`;
  } else if(body.isMoon){
    helioc = '—';
    dist = `${(body.orbitKm/1.496e8).toFixed(4)} AU 自母行星`;
    speed = '—';
  }
  const phys = orbits.PHYS[body.id];
  const desc = orbits.DESC[body.id] || '';
  let physRows = '';
  if(phys){
    physRows = `<div class="kv"><div class="k">半径</div><div class="v num">${phys.radiusKm.toLocaleString()} km</div></div>
      <div class="kv"><div class="k">质量</div><div class="v num">${phys.mass.toExponential(2)} kg</div></div>
      <div class="kv"><div class="k">公转周期</div><div class="v">${phys.period || '—'}</div></div>
      <div class="kv"><div class="k">卫星数</div><div class="v num">${phys.moons}</div></div>
      <div class="kv"><div class="k">温度</div><div class="v">${phys.temp}</div></div>`;
  }
  right.innerHTML = `
    <div class="name">${body.name}</div>
    <div class="name-en">${body.nameEn || ''}</div>
    <div class="kv"><div class="k">日心距离</div><div class="v num">${dist}</div></div>
    <div class="kv"><div class="k">日心黄经黄纬</div><div class="v num">${helioc}</div></div>
    <div class="kv"><div class="k">轨道速度</div><div class="v num">${speed}</div></div>
    ${physRows}
    <div class="desc">${desc}</div>
  `;
}

function updateLabels(){
  const labelsEl = document.getElementById('labels');
  const items = [];
  const mvp = ctx.mvp;
  const all = BODIES.concat(MOONS);
  for(const b of all){
    if(b.id === 'halley' && !ctx.toggles.comet) continue;
    if(b.isMoon && !ctx.toggles.moons) continue;
    const bp = [b.pos[0], b.pos[1], b.pos[2], 1];
    const sx = mvp[0]*bp[0]+mvp[4]*bp[1]+mvp[8]*bp[2]+mvp[12];
    const sy = mvp[1]*bp[0]+mvp[5]*bp[1]+mvp[9]*bp[2]+mvp[13];
    const sw = mvp[3]*bp[0]+mvp[7]*bp[1]+mvp[11]*bp[2]+mvp[15];
    if(sw <= 0) continue;
    const x = (sx/sw * 0.5 + 0.5) * window.innerWidth;
    const y = (-sy/sw * 0.5 + 0.5) * window.innerHeight;
    // view-radius in pixels
    const dist = Math.hypot(b.pos[0]-ctx.eye[0], b.pos[1]-ctx.eye[1], b.pos[2]-ctx.eye[2]);
    const vr = (b.radiusDisp / Math.max(dist, 0.01)) * (ctx.height * 0.5) / sw;
    const alpha = Math.min(1, vr / 30);
    if(alpha < 0.05) continue;
    items.push(`<div class="label" style="left:${x}px;top:${y}px;opacity:${alpha.toFixed(2)}">${b.name}</div>`);
  }
  labelsEl.innerHTML = items.join('');
}

window.addEventListener('DOMContentLoaded', () => {
  try {
    if(!init()){
      console.error('init failed');
    }
  } catch(e){
    console.error('Fatal init error', e);
    document.getElementById('fallback').textContent = '初始化失败：' + e.message;
    document.getElementById('fallback').style.display = 'flex';
  }
});
