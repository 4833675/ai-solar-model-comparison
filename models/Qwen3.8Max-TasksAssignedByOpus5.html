if(bloomTexA)gl.deleteTexture(bloomTexA);if(bloomFBOA)gl.deleteFramebuffer(bloomFBOA);

gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,W,H);
gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,drb);

updCam(dt);

m4mul(vpM,projM,viewM);m4invert(invVP,vpM);m4transpose(invVP,invVP);

function getAxis(p){const t=p.tilt*DEG,pl=p.pole*DEG;return[Math.sin(t)*Math.cos(pl),Math.cos(t),Math.sin(t)*Math.sin(pl)]}
function drawBody(pg,pos,rad,type,axis,phase){
const model=mat4();// build model matrix: translate * axis-basis * rotY(phase) * scale
// Axis basis
const Y=v3norm(axis);let ref=Math.abs(Y[1])<.9?[0,1,0]:[1,0,0];const X=v3norm(v3cross(ref,Y));const Z=v3cross(X,Y);
model[0]=X[0];model[1]=X[1];model[2]=X[2];model[3]=0;
model[4]=Y[0];model[5]=Y[1];model[6]=Y[2];model[7]=0;
model[8]=Z[0];model[9]=Z[1];model[10]=Z[2];model[11]=0;
model[12]=pos[0];model[13]=pos[1];model[14]=pos[2];model[15]=1;
// Apply rotation around Y axis (local)
const c=Math.cos(phase),s=Math.sin(phase);
const rm=mat4();m4id(rm);rm[0]=c;rm[2]=-s;rm[8]=s;rm[10]=c;
const m2=mat4();m4mul(m2,model,rm);
// Scale
m2[0]*=rad;m2[1]*=rad;m2[2]*=rad;m2[4]*=rad;m2[5]*=rad;m2[6]*=rad;m2[8]*=rad;m2[9]*=rad;m2[10]*=rad;
const mvp=mat4();m4mul(mvp,vpM,m2);
const nm=mat4();m4normalFromModel(nm,m2);
gl.uniformMatrix4fv(progs.planetU.uMVP,false,mvp);
gl.uniformMatrix4fv(progs.planetU.uModel,false,m2);
gl.uniformMatrix4fv(progs.planetU.uNorm,false,nm);
gl.uniform1f(progs.planetU.uType,type);
gl.uniform1f(progs.planetU.uAlb,type===9?1.0:P.find(p=>p.tp===type)?.alb||.3);
const sunDir=v3norm(v3sub(sunPos,pos));
gl.uniform3fv(progs.planetU.uSunDir,sunDir);
const sph=rad>2?sphHi:sphLo;
gl.bindVertexArray(sph.vao);gl.drawElements(gl.TRIANGLES,sph.n,gl.UNSIGNED_SHORT,0);
}
function drawMoons(pg,JD){const T=getT();moonDispPos=[];
for(let mi=0;mi<MOONS.length;mi++){const m=MOONS[mi];const pp=planetDispPos[m.pi];const pr=dispR(P[m.pi].r,false);
const theta=TAU*(JD-2451545)/m.per;const incR=m.inc*DEG;
let local=[Math.cos(theta),0,Math.sin(theta)];
// apply inclination
const ci=Math.cos(incR),si=Math.sin(incR);
local=[local[0],local[2]*si,local[2]*ci];
// display distance
const a0=m.pi===4?421700:m.pi===5?1221870:m.pi===7?19591:m.pi===2?384400:354759;
let base=2.35;
if(m.pi===5)base=Math.max(2.35,2.34+dispR(m.r,false)/pr+0.55);
const d=pr*base*Math.pow(m.orb/a0,.55);
let wp=v3add(pp,v3scale(local,d));
if(m.ref===1){const ax=getAxis(P[m.pi]);const Y=v3norm(ax);let ref=Math.abs(Y[1])<.9?[0,1,0]:[1,0,0];const X=v3norm(v3cross(ref,Y));const Z=v3cross(X,Y);
wp=v3add(pp,v3add(v3add(v3scale(X,local[0]*d),v3scale(Y,local[1]*d)),v3scale(Z,local[2]*d)));}
moonDispPos[mi]=wp;
drawBody(pg,wp,dispR(m.r,false)*0.7,m.tp,getAxis(P[m.pi]),theta);}
}

function drawComet(JD){const H_=HALLEY;
const M=TAU*(JD-H_.Tp)/H_.per;const E=solveK(M,H_.e);
const a=H_.a,e=H_.e,I=H_.I*DEG,w=H_.w*DEG,O=H_.O*DEG;

const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),cI=Math.cos(I),sI=Math.sin(I);
const x=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp;
const y=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp;
const z=(sw*sI)*xp+(cw*sI)*yp;
const eclPos=[x,z,-y];const rAU=v3len(eclPos);
if(rAU>6.5)return;// too far, no tail
const cPos=dispPos(eclPos);
// Draw comet nucleus as small bright point using planet shader
gl.useProgram(progs.planet);gl.uniform3fv(progs.planetU.uCam,eyePos);gl.uniform1f(progs.planetU.uTime,simTime/1000);
drawBody(progs.planet,cPos,0.25,9,[0,1,0],0);
// Draw tail using additive blended line (simplified as stretched billboard)
// Ion tail: anti-sun direction, blue
const antiSun=v3norm(v3scale(cPos,-1));
const tailLen=Math.min(8,3*Math.pow(3/rAU,2));
// Use orbit shader for tail lines
gl.useProgram(progs.orbit);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);
gl.uniformMatrix4fv(progs.orbitU.uVP,false,vpM);gl.uniform2f(progs.orbitU.uScreen,W,H);gl.uniform1f(progs.orbitU.uWidth,3);
gl.uniform3f(progs.orbitU.uColor,.3,.5,1);gl.uniform1f(progs.orbitU.uHead,0);
// Build tail vertices on the fly
const tv=[];const perp=v3norm(v3cross(antiSun,v3norm(v3sub(eyePos,cPos))));
for(let i=0;i<=8;i++){const t=i/8;const p=v3add(cPos,v3scale(antiSun,tailLen*t));
const w2=0.05+t*0.4;tv.push(p[0]+perp[0]*w2,p[1]+perp[1]*w2,p[2]+perp[2]*w2,1,t);
tv.push(p[0]-perp[0]*w2,p[1]-perp[1]*w2,p[2]-perp[2]*w2,-1,t);}
const tva=gl.createVertexArray();gl.bindVertexArray(tva);
const tvb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,tvb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(tv),gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);
gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,1,gl.FLOAT,false,20,12);
gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,1,gl.FLOAT,false,20,16);
gl.drawArrays(gl.TRIANGLE_STRIP,0,18);
gl.deleteVertexArray(tva);gl.deleteBuffer(tvb);
gl.depthMask(true);gl.disable(gl.BLEND);}

if(idx>=0&&idx<9){const p=P[idx];const rAU=v3len(planetPos[idx]);const vel=orbVel(rAU,p.a);
ip.innerHTML=`<h3>${p.nm}</h3><div class="info-row"><span class="label">日心距离</span><span class="value">${rAU.toFixed(4)} AU</span></div><div class="info-row"><span class="label">轨道速度</span><span class="value">${vel.toFixed(2)} km/s</span></div><div class="info-row"><span class="label">偏心率</span><span class="value">${p.e.toFixed(5)}</span></div><div class="info-row"><span class="label">轨道倾角</span><span class="value">${p.I.toFixed(3)}°</span></div><div class="info-row"><span class="label">转轴倾角</span><span class="value">${p.tilt}°</span></div><div class="info-row"><span class="label">公转周期</span><span class="value">${p.per}</span></div><div class="info-row"><span class="label">半径</span><span class="value">${p.r.toLocaleString()} km</span></div><div class="info-row"><span class="label">质量</span><span class="value">${p.mass} kg</span></div><div class="info-row"><span class="label">卫星数</span><span class="value">${p.mn}</span></div><div class="info-row"><span class="label">温度</span><span class="value">${p.tmp}</span></div><div class="info-desc">${p.desc}</div>`;}}
// ===== Input =====
let dragging=false,lastMX=0,lastMY=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lastMX=e.clientX;lastMY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;camYaw+=(e.clientX-lastMX)*.005;camPitch=Math.max(-1.5,Math.min(1.5,camPitch+(e.clientY-lastMY)*.005));lastMX=e.clientX;lastMY=e.clientY});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();camDistG=Math.max(3,Math.min(600,camDistG*(1+e.deltaY*.001)))},{passive:false});
canvas.addEventListener('click',e=>{if(dragging)return;pickBody(e.clientX,e.clientY)});
function pickBody(mx,my){let best=-1,bestD=30;
const all=[{pos:[0,0,0],idx:-2},...planetDispPos.map((p,i)=>({pos:p,idx:i}))];
if(showMoons)moonDispPos.forEach((p,i)=>{if(p)all.push({pos:p,idx:9+i})});
for(const b of all){const c=project(b.pos);if(!c)continue;
const sx=(c[0]*.5+.5)*canvas.clientWidth,sy=(-(c[1]*.5)+.5)*canvas.clientHeight;
const d=Math.hypot(mx-sx,my-sy);if(d<bestD){bestD=d;best=b.idx}}
if(best>=-2)focusBody(best);}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing=!playing;document.getElementById('btnPlay').textContent=playing?'⏸':'▶'}
if(e.code==='ArrowRight')speedVal=Math.min(100,speedVal+5);
if(e.code==='ArrowLeft')speedVal=Math.max(-100,speedVal-5);
if(e.code==='KeyH'){document.querySelectorAll('.panel,#note,#warning').forEach(el=>el.style.display=el.style.display==='none'?'':'none')}});
document.getElementById('btnPlay').onclick=()=>{playing=!playing;document.getElementById('btnPlay').textContent=playing?'⏸':'▶'};
document.getElementById('btnNow').onclick=()=>{simTime=Date.now()};
document.getElementById('speedSlider').oninput=e=>{speedVal=+e.target.value};
document.getElementById('togOrbits').onchange=e=>showOrbits=e.target.checked;
document.getElementById('togLabels').onchange=e=>showLabels=e.target.checked;
document.getElementById('togMoons').onchange=e=>showMoons=e.target.checked;
document.getElementById('togAsteroids').onchange=e=>showAst=e.target.checked;
document.getElementById('togComet').onchange=e=>showComet=e.target.checked;
document.getElementById('togBloom').onchange=e=>showBloom=e.target.checked;
document.getElementById('togRealDist').onchange=e=>{compressTgt=e.target.checked?1.0:.62};
// ===== Build orbit geometry =====
function buildOrbits(){orbitVAOs=[];const N=256;
for(let pi=0;pi<9;pi++){const verts=[];for(let i=0;i<=N;i++){const t=i/N*360;const el={...P[pi],L:t+P[pi].w};const pos=orbPos({...P[pi],L:P[pi].w+t,dL:0},0);
const dp=dispPos(pos);const side=i%2===0?1:-1;const param=i/N;
verts.push(dp[0],dp[1],dp[2],side,param);}
// Actually use simpler approach - line strip as triangle strip with offset
const v2=[];for(let i=0;i<=N;i++){const frac=i/N;const ang=frac*TAU;
// compute orbit point at this mean anomaly
const el2={a:P[pi].a,e:P[pi].e,I:P[pi].I,L:P[pi].w+frac*360,w:P[pi].w,O:P[pi].O,da:0,de:0,dI:0,dL:0,dw:0,dO:0};
const pos=orbPos(el2,0);const dp=dispPos(pos);
v2.push(dp[0],dp[1],dp[2],1,frac,dp[0],dp[1],dp[2],-1,frac);}
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(v2),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);
gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,1,gl.FLOAT,false,20,12);
gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,1,gl.FLOAT,false,20,16);
gl.bindVertexArray(null);orbitVAOs.push({vao,n:(N+1)*2});}}
// ===== Build stars =====
function buildStars(){const data=new Float32Array(starCount*7);
const galPole=[-.8678,.4972,.0003];
for(let i=0;i<starCount;i++){let dir;
// rejection sample toward galactic plane
for(;;){dir=v3norm([Math.random()*2-1,Math.random()*2-1,Math.random()*2-1]);
const gal=Math.exp(-Math.pow(v3dot(dir,galPole),2)*4);
if(Math.random()<.3+.7*gal)break}
const bright=Math.pow(Math.random(),3.6);
const sz=1+bright*2.5;
// color from temperature palette
const tempR=Math.random();let col;
if(tempR<.58)col=[1,.85,.7];else if(tempR<.8)col=[1,.95,.85];else if(tempR<.92)col=[.9,.95,1];else col=[.7,.8,1];
data[i*7]=dir[0];data[i*7+1]=dir[1];data[i*7+2]=dir[2];
data[i*7+3]=sz;data[i*7+4]=col[0]*bright;data[i*7+5]=col[1]*bright;data[i*7+6]=col[2]*bright;}
starVAO=gl.createVertexArray();gl.bindVertexArray(starVAO);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,28,0);
gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,1,gl.FLOAT,false,28,12);
gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,3,gl.FLOAT,false,28,16);
gl.bindVertexArray(null);}
// ===== Build asteroids =====
function buildAsteroids(){const belts=[];
// Main belt 9000
for(let i=0;i<9000;i++){let a;for(;;){a=2.06+Math.random()*1.22;
let prob=1;const gaps=[[2.502,.022,.93],[2.825,.016,.85],[2.958,.012,.70],[3.279,.020,.90],[2.065,.010,.60]];
for(const g of gaps)prob*=1-g[2]*Math.exp(-Math.pow((a-g[0])/g[1],2));
prob*=Math.exp(-Math.pow((a-2.72)/.55,2));
if(Math.random()<prob)break}
const e=Math.abs(gaussRand())*.14;const I=Math.abs(gaussRand())*8*DEG;
belts.push(a,Math.min(e,.34),I,Math.random()*TAU,Math.random()*TAU,Math.random()*TAU,TAU/(365.25*Math.pow(a,1.5)),.5+Math.random());}
// Hilda 900
for(let i=0;i<900;i++){const a=3.90+gaussRand()*.09;const e=.10+Math.random()*.20;const I=Math.abs(gaussRand())*8*DEG;
belts.push(a,e,I,Math.random()*TAU,Math.random()*TAU,Math.random()*TAU,TAU/(365.25*Math.pow(a,1.5)),.5+Math.random());}
// Trojans 2000
const jupN=TAU/(365.25*Math.pow(5.20288700,1.5));const jupL=34.396*DEG;
for(let i=0;i<2000;i++){const a=5.202+gaussRand()*.05;const e=Math.abs(gaussRand())*.06;const I=Math.abs(gaussRand())*12*DEG;
const sign=i<1000?1:-1;const M0=jupL+sign*60*DEG+gaussRand()*26*DEG;
belts.push(a,e,I,Math.random()*TAU,Math.random()*TAU,M0,jupN,.5+Math.random());}
// Kuiper 6000
for(let i=0;i<6000;i++){let a,e,I;const r=Math.random();
if(r<.22){a=39.45+gaussRand()*.55;e=Math.abs(gaussRand())*.12;I=Math.abs(gaussRand())*8*DEG;}
else if(r<.86){a=42.5+Math.random()*5.2;e=Math.random()*.11;I=Math.abs(gaussRand())*7*DEG;}
else{a=48+Math.random()*32;e=.15+Math.random()*.35;I=Math.abs(gaussRand())*22*DEG;}
belts.push(a,e,I,Math.random()*TAU,Math.random()*TAU,Math.random()*TAU,TAU/(365.25*Math.pow(a,1.5)),.4+Math.random()*.6);}
astCount=belts.length/8;
const data=new Float32Array(belts);
astVAO=gl.createVertexArray();gl.bindVertexArray(astVAO);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,4,gl.FLOAT,false,32,0);
gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,32,16);
gl.bindVertexArray(null);}
function gaussRand(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}
// ===== BOOT =====
resize();initShaders();buildLeftPanel();buildStars();buildAsteroids();buildOrbits();buildRingGeo();
requestAnimationFrame(frame);
