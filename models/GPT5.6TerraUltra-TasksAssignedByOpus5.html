<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>太阳系实时运动模型</title>
  <style>
    :root {
      --ink: #e7f2ff;
      --muted: #8ca0b8;
      --faint: #596b82;
      --line: rgba(160, 203, 235, .18);
      --glass: rgba(8, 16, 31, .58);
      --glass-strong: rgba(8, 16, 31, .76);
      --warm: #ffc36b;
      --cyan: #74d8ff;
      --danger: #ffaf9e;
      --shadow: rgba(0, 0, 0, .42);
      --ui-font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --data-font: "SFMono-Regular", "Cascadia Mono", "Menlo", "Consolas", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #02040a; }
    body {
      color: var(--ink);
      font-family: var(--ui-font);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #space {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
      outline: none;
    }
    #space:active { cursor: grabbing; }

    #ui, #labels { position: fixed; inset: 0; pointer-events: none; }
    #ui.hidden { opacity: 0; visibility: hidden; }
    #ui { transition: opacity .22s ease, visibility .22s ease; }

    .panel {
      pointer-events: auto;
      position: absolute;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(17, 31, 54, .72), var(--glass));
      box-shadow: 0 18px 52px var(--shadow), inset 0 1px 0 rgba(255,255,255,.045);
      backdrop-filter: blur(18px) saturate(132%);
      -webkit-backdrop-filter: blur(18px) saturate(132%);
    }

    .eyebrow {
      color: var(--cyan);
      font-family: var(--data-font);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    #title {
      position: absolute;
      left: 24px;
      top: 21px;
      pointer-events: none;
      text-shadow: 0 2px 18px #000;
    }
    #title h1 {
      margin: 4px 0 0;
      font-weight: 480;
      font-size: 18px;
      letter-spacing: .17em;
    }
    #title .sub {
      color: var(--muted);
      font-family: var(--data-font);
      font-size: 10px;
      letter-spacing: .08em;
      margin-top: 5px;
    }

    #body-list {
      left: 22px;
      top: 95px;
      width: 192px;
      max-height: calc(100vh - 298px);
      overflow: auto;
      padding: 11px 8px 12px;
      border-radius: 3px;
      scrollbar-width: thin;
      scrollbar-color: #51657d transparent;
    }
    .list-header {
      padding: 2px 8px 9px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .15em;
    }
    .body-button {
      display: flex;
      align-items: center;
      width: 100%;
      border: 0;
      border-left: 2px solid transparent;
      background: transparent;
      color: #b7c5d6;
      padding: 6px 7px;
      font: 12px var(--ui-font);
      text-align: left;
      cursor: pointer;
      transition: background .16s ease, color .16s ease, border-color .16s ease;
    }
    .body-button:hover { background: rgba(127, 192, 232, .1); color: #fff; }
    .body-button.selected { border-left-color: var(--warm); color: #fff; background: rgba(255, 187, 90, .08); }
    .body-button.moon { padding-left: 22px; color: #8ea1b8; font-size: 11px; }
    .body-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 9px currentColor;
    }

    #info-card {
      right: 22px;
      top: 22px;
      width: min(310px, calc(100vw - 44px));
      padding: 17px 17px 15px;
      border-radius: 3px;
      overflow: hidden;
    }
    #info-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent, var(--warm)), transparent);
      opacity: .85;
    }
    #focus-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    #focus-name { margin: 0; font-weight: 490; font-size: 20px; letter-spacing: .1em; }
    #focus-kind { color: var(--muted); font-size: 11px; }
    #info-status { min-height: 17px; color: var(--danger); font-size: 11px; margin-top: 4px; }
    #data-grid {
      margin: 13px 0 11px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }
    .metric {
      min-height: 49px;
      padding: 8px 9px 7px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .metric label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }
    .metric output {
      display: block;
      color: #e7f4ff;
      font: 11px var(--data-font);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #static-data {
      margin: 0;
      padding: 9px 0 6px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 82px 1fr;
      row-gap: 5px;
      font-size: 11px;
      line-height: 1.4;
    }
    #static-data dt { color: var(--muted); }
    #static-data dd { margin: 0; color: #cfdae7; font-family: var(--data-font); font-size: 10px; }
    #body-copy {
      border-top: 1px solid var(--line);
      margin: 8px 0 0;
      padding-top: 10px;
      color: #aebdce;
      font-size: 11px;
      line-height: 1.65;
    }

    #time-dock {
      pointer-events: auto;
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(580px, calc(100vw - 48px));
      padding: 10px 13px 11px;
      border-radius: 4px;
      display: grid;
      grid-template-columns: auto minmax(146px, 1fr) auto;
      align-items: center;
      gap: 12px;
    }
    .control-button {
      border: 1px solid rgba(181, 220, 247, .24);
      background: rgba(119, 172, 208, .1);
      color: var(--ink);
      height: 27px;
      min-width: 29px;
      padding: 0 9px;
      border-radius: 2px;
      font: 12px var(--ui-font);
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .control-button:hover { background: rgba(130, 211, 255, .2); border-color: rgba(159, 222, 255, .54); }
    #date-readout { text-align: center; min-width: 0; }
    #utc-date {
      color: #eff7ff;
      font: 12px var(--data-font);
      font-variant-numeric: tabular-nums;
      letter-spacing: .025em;
      white-space: nowrap;
    }
    #speed-readout {
      color: var(--cyan);
      margin-top: 3px;
      font: 10px var(--data-font);
      font-variant-numeric: tabular-nums;
    }
    #speed-wrap { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
    #speed-wrap span { color: var(--faint); font: 9px var(--data-font); white-space: nowrap; }
    input[type="range"] { width: 100%; accent-color: #86d9ff; cursor: ew-resize; }

    #toggles {
      pointer-events: auto;
      right: 23px;
      bottom: 23px;
      padding: 9px 10px;
      border-radius: 3px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 13px;
    }
    #toggles label {
      color: #b7c6d8;
      font-size: 10px;
      white-space: nowrap;
      cursor: pointer;
    }
    #toggles input { vertical-align: -2px; margin: 0 5px 0 0; accent-color: #86d9ff; }
    #scale-note {
      grid-column: 1 / -1;
      border-top: 1px solid var(--line);
      color: var(--faint);
      padding-top: 7px;
      font-size: 9px;
      line-height: 1.4;
    }
    #scale-note strong { color: #abcce2; font-weight: 500; }

    #help {
      position: absolute;
      left: 24px;
      bottom: 24px;
      color: rgba(191, 215, 234, .62);
      font-size: 10px;
      line-height: 1.65;
      text-shadow: 0 1px 8px #000;
      pointer-events: none;
    }
    kbd {
      border: 1px solid rgba(180,214,235,.32);
      border-radius: 2px;
      padding: 1px 3px;
      font: 9px var(--data-font);
      color: #d8e8f5;
    }

    #labels { overflow: hidden; }
    .planet-label {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: auto;
      color: #dceeff;
      background: rgba(4, 10, 20, .56);
      border: 1px solid rgba(154, 207, 239, .2);
      border-radius: 2px;
      padding: 3px 5px;
      font-size: 10px;
      letter-spacing: .08em;
      white-space: nowrap;
      text-shadow: 0 1px 4px #000;
      transition: opacity .15s linear;
      cursor: pointer;
    }
    .planet-label:hover { border-color: rgba(255, 202, 120, .8); color: #fff; }
    .planet-label::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      height: 12px;
      border-left: 1px solid rgba(176, 216, 244, .38);
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 12px;
      background: radial-gradient(circle at 50% 45%, #102243, #02040a 58%);
      color: #dcedfb;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #boot.done { opacity: 0; visibility: hidden; }
    #boot .boot-mark {
      width: 43px; height: 43px; border-radius: 50%;
      border: 1px solid rgba(171,225,255,.64);
      box-shadow: 0 0 28px rgba(112,209,255,.42), inset 0 0 18px rgba(112,209,255,.18);
      animation: bootPulse 1.5s ease-in-out infinite;
    }
    #boot .boot-title { font-size: 12px; letter-spacing: .26em; }
    #boot .boot-state { color: #92aac1; font: 10px var(--data-font); }
    #boot.fail .boot-mark { border-color: #ff9784; box-shadow: 0 0 28px rgba(255, 110, 87, .24); }
    #boot.fail .boot-state { color: #ffb4a5; max-width: 440px; text-align: center; line-height: 1.7; }
    @keyframes bootPulse { 50% { transform: scale(1.14); opacity: .66; } }

    @media (max-width: 760px) {
      #title { left: 15px; top: 14px; }
      #title h1 { font-size: 14px; }
      #body-list { left: 12px; top: 72px; width: 154px; max-height: 38vh; }
      #info-card { right: 12px; top: 12px; width: min(266px, calc(100vw - 28px)); padding: 13px; }
      #focus-name { font-size: 17px; }
      #body-copy { display: none; }
      #static-data { display: none; }
      #time-dock { bottom: 12px; width: calc(100vw - 24px); gap: 7px; padding: 8px; }
      #toggles { display: none; }
      #help { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="space" aria-label="可交互的太阳系实时运动模型" tabindex="0"></canvas>

  <div id="labels" aria-live="polite"></div>
  <div id="ui">

    </header>

        <div class="metric"><label>光行时</label><output id="metric-light">—</output></div>
        <div class="metric"><label>近 / 远日点</label><output id="metric-peri">—</output></div>
        <div class="metric"><label>当前轨道速度</label><output id="metric-speed">—</output></div>
      </div>
      <dl id="static-data"></dl>
      <p id="body-copy"></p>
    </aside>

    <section id="time-dock" class="panel" aria-label="时间控制">
      <button id="play-toggle" class="control-button" title="播放或暂停 (空格)">暂停</button>
      <div id="date-readout">
        <div id="utc-date">—</div>
        <div id="speed-readout">实时</div>

      </div>
    </section>

    <section id="toggles" class="panel" aria-label="显示开关">
      <label><input id="toggle-orbits" type="checkbox" checked>轨道</label>
      <label><input id="toggle-labels" type="checkbox" checked>名称</label>
      <label><input id="toggle-moons" type="checkbox" checked>卫星</label>
      <label><input id="toggle-asteroids" type="checkbox" checked>小行星带</label>
      <label><input id="toggle-comet" type="checkbox" checked>哈雷彗星</label>
      <label><input id="toggle-bloom" type="checkbox" checked>辉光</label>
      <label><input id="toggle-real-scale" type="checkbox">真实距离比例</label>
      <div id="scale-note"><strong>视觉比例：</strong>径向幂律压缩距离；天体的角位置、相位、周期、偏心率和倾角保持真实。</div>
    </section>

    <div id="help">拖拽旋转 · 滚轮缩放 · 点击天体聚焦<br><kbd>Space</kbd> 暂停　<kbd>←</kbd>/<kbd>→</kbd> 调速　<kbd>H</kbd> 隐藏界面</div>

      if(a<1)return (a*24).toFixed(1)+' 小时 / 秒';
      if(a<365.25)return a.toFixed(2)+' 天 / 秒';
      return (a/365.25).toFixed(2)+' 年 / 秒';
    }
    function currentScaleLabel() {
      return state.targetCompress>.9?'真实距离比例':'压缩距离比例';
    }
    function updateInfo() {
      const live=state.bodies.get(state.selectedId), b=live&&live.body;
      if(!live||!b)return;
      const jd=jdFromMs(state.simMs), year=2000+(jd-J2000)/365.25;
      dateEl.textContent=dateString(state.simMs); speedEl.textContent=(state.paused?'已暂停 · ':'')+speedString(state.slider);
      playButton.textContent=state.paused?'播放':'暂停';
      infoStatus.textContent=(year<1800||year>2050)?'已超出根数有效区间（外推）':'';
      if(isPlanet(b)) {
        const r=live.raw.r, earth=state.bodies.get('earth').raw.ecl, d=len3(sub3(live.raw.ecl,earth));
        metrics.r.textContent=fmt(r,3)+' AU';
        metrics.lon.textContent=fmt(deg(live.raw.lon),1)+'° / '+fmt(deg(live.raw.lat),2)+'°';
        metrics.earth.textContent=fmt(d,3)+' AU';
        metrics.light.textContent=fmt(d*AU_KM/C_LIGHT_KM_S/60,1)+' 分';
        metrics.peri.textContent=fmt(live.raw.peri,3)+' / '+fmt(live.raw.apo,3)+' AU';
        metrics.speed.textContent=fmt(live.raw.speed,2)+' km/s';
      } else if(isMoon(b)) {
        const parent=live.parent;
        metrics.r.textContent='距'+parent.body.name+' '+Math.round(b.orbitKm).toLocaleString('zh-CN')+' km';
        metrics.lon.textContent=(b.periodDays<0?'逆行 ':'顺行 ')+fmt(Math.abs(b.periodDays),4)+' 天';
        metrics.earth.textContent='绕 '+parent.body.name;
        metrics.light.textContent=fmt(b.orbitKm/C_LIGHT_KM_S,2)+' 秒';
        metrics.peri.textContent='倾角 '+fmt(b.inc,3)+'°';
        metrics.speed.textContent='展示距离 × 幂律';
      } else {
        metrics.r.textContent='0.000 AU';metrics.lon.textContent='—';
        metrics.earth.textContent=fmt(state.bodies.get('earth').raw.r,3)+' AU';
        metrics.light.textContent=fmt(state.bodies.get('earth').raw.r*AU_KM/C_LIGHT_KM_S/60,1)+' 分';
        metrics.peri.textContent='—';metrics.speed.textContent='—';
      }
      document.getElementById('scale-note').innerHTML='<strong>视觉比例：</strong>'+currentScaleLabel()+'；角位置、相位、周期、偏心率和倾角保持真实。';
    }
    function updateLabels() {
      const show=toggles.labels.checked;
      const sun=state.bodies.get('sun'), sunClip=sun?m4transformPoint(state.vp,sun.display):null;
      const sx=sunClip&&sunClip[3]>0?sunClip[0]/sunClip[3]:99, sy=sunClip&&sunClip[3]>0?sunClip[1]/sunClip[3]:99;
      const sr=sunClip&&sunClip[3]>0?sun.radius/Math.max(.0001,sunClip[3])*1.82:0;
      state.labelNodes.forEach((el,id)=>{
        const body=state.bodies.get(id);if(!body){el.style.opacity='0';return;}
        const clip=m4transformPoint(state.vp,body.display);
        if(!show||clip[3]<=0){el.style.opacity='0';return;}
        const x=clip[0]/clip[3],y=clip[1]/clip[3],radius=body.radius/Math.max(.0001,clip[3])*1.6;
        const visible=x>-1.08&&x<1.08&&y>-1.08&&y<1.08;
        const behindSun=id!=='sun'&&Math.hypot(x-sx,y-sy)<sr;
        const alpha=visible&&!behindSun?clamp(radius*23,.16,1):0;
        el.style.opacity=String(alpha);el.style.left=((x*.5+.5)*100)+'%';el.style.top=((1-(y*.5+.5))*100)+'%';
      });
    }
    function getFlare() {
      const clip=m4transformPoint(state.vp,[0,0,0]);
      if(clip[3]<=0)return [0,0,0];
      const x=clip[0]/clip[3],y=clip[1]/clip[3];
      if(Math.abs(x)>1.25||Math.abs(y)>1.25)return [0,0,0];
      let visible=1, ray=sub3([0,0,0],state.camera),rl=len3(ray),rd=mul3(ray,1/rl);
      state.bodies.forEach(live=>{
        if(live.body.id==='sun')return;
        const to=sub3(live.display,state.camera),t=dot3(to,rd);
        if(t<=0||t>=rl)return;
        const d=len3(sub3(to,mul3(rd,t)));
        if(d<live.radius*.92){visible=0; }
      });
      return [x,y,visible];
    }
    function useMat(p,name,m){gl.uniformMatrix4fv(uni(p,name),false,m);}
    function useV3(p,name,v){gl.uniform3fv(uni(p,name),v);}
    function useF(p,name,v){gl.uniform1f(uni(p,name),v);}
    function useI(p,name,v){gl.uniform1i(uni(p,name),v);}
    function drawFullscreen() {gl.bindVertexArray(emptyVao);gl.drawArrays(gl.TRIANGLES,0,3);}

    function drawBackground(time) {
      const p=programs.background;gl.useProgram(p);useMat(p,'uInvVP',state.invVp);useV3(p,'uCamera',state.camera);useF(p,'uTime',time);
      gl.disable(gl.DEPTH_TEST);gl.depthMask(false);setBlend('none');drawFullscreen();
    }
    function drawStars(time) {
      const p=programs.stars;gl.useProgram(p);useMat(p,'uVP',state.vp);useV3(p,'uCamera',state.camera);useF(p,'uTime',time);useF(p,'uPixelRatio',1);
      gl.disable(gl.DEPTH_TEST);gl.depthMask(false);setBlend('add');gl.bindVertexArray(starBuffer.vao);gl.drawArrays(gl.POINTS,0,starBuffer.count);
    }
    function localLight(basis,spin,dir) {
      const c=Math.cos(spin),s=Math.sin(spin),x=add3(mul3(basis.x,c),mul3(basis.z,-s)),z=add3(mul3(basis.x,s),mul3(basis.z,c));
      return [dot3(dir,x),dot3(dir,basis.y),dot3(dir,z)];
    }
    function drawBody(live,time) {
      const b=live.body,p=programs.surface,model=m4model(live.display,live.basis,live.spin,live.radius);
      let ld=b.id==='sun'?[0,1,0]:norm3(mul3(live.display,-1));
      const lightStrength=b.id==='sun'?1:clamp(1.5*Math.pow(1/Math.max(.12,live.raw.r),.40),.26,2.1);
      gl.useProgram(p);useMat(p,'uModel',model);useMat(p,'uVP',state.vp);useV3(p,'uCamera',state.camera);useV3(p,'uCenter',live.display);useV3(p,'uLightDir',ld);
      useV3(p,'uColor',color3(b.color||'#9fa6ad'));useV3(p,'uSunLocal',localLight(live.basis,live.spin,ld));useF(p,'uTime',time);useF(p,'uLightStrength',lightStrength);useI(p,'uType',typeNumber(b));useI(p,'uRingType',ringType(b.id));
      gl.bindVertexArray(sphere.vao);gl.drawElements(gl.TRIANGLES,sphere.count,gl.UNSIGNED_SHORT,0);
    }
    function hasAtmosphere(b) { return ['earth','venus','mars','jupiter','saturn','uranus','neptune','titan'].indexOf(b.type)>=0; }
    function drawAtmosphere(live) {
      const b=live.body;if(!hasAtmosphere(b))return;
      const h=b.type==='earth'?.032:(b.type==='titan'?.055:(b.type==='venus'?.035:.020));
      const col=b.type==='earth'?[.18,.55,1.]:(b.type==='titan'?[.94,.37,.05]:(b.type==='mars'?[.85,.22,.08]:[.48,.72,1.]));
      const p=programs.atmosphere,model=m4basis(live.display,live.basis,live.radius*(1+h*7.5)),ld=norm3(mul3(live.display,-1));
      gl.useProgram(p);useMat(p,'uModel',model);useMat(p,'uVP',state.vp);useV3(p,'uCamera',state.camera);useV3(p,'uCenter',live.display);useV3(p,'uLightDir',ld);useV3(p,'uColor',col);useF(p,'uRadius',live.radius);useF(p,'uHeight',h);
      gl.bindVertexArray(sphere.vao);gl.drawElements(gl.TRIANGLES,sphere.count,gl.UNSIGNED_SHORT,0);
    }
    function drawRing(live) {
      const typ=ringType(live.body.id);if(!typ)return;
      const p=programs.ring,model=m4basis(live.display,live.basis,live.radius),ld=norm3(mul3(live.display,-1));
      gl.useProgram(p);useMat(p,'uModel',model);useMat(p,'uVP',state.vp);useV3(p,'uCamera',state.camera);useV3(p,'uCenter',live.display);useV3(p,'uAxis',live.axis);useV3(p,'uLightDir',ld);useI(p,'uRingType',typ);
      gl.bindVertexArray(ringMesh.vao);gl.drawElements(gl.TRIANGLES,ringMesh.count,gl.UNSIGNED_SHORT,0);
    }
    function drawOrbits() {
      if(!toggles.orbits.checked)return;
      // A screen-space ribbon may flip winding along a projected ellipse.
      gl.disable(gl.CULL_FACE);
      const p=programs.orbit;gl.useProgram(p);useMat(p,'uVP',state.vp);gl.uniform2f(uni(p,'uViewport'),state.width,state.height);
      gl.bindVertexArray(orbitBuffer.vao);
      PLANETS.forEach(body=>{
        const live=state.bodies.get(body.id),verts=state.orbits.get(body.id);if(!verts)return;
        gl.bindBuffer(gl.ARRAY_BUFFER,orbitBuffer.buffer);gl.bufferData(gl.ARRAY_BUFFER,verts,gl.DYNAMIC_DRAW);
        useV3(p,'uColor',color3(body.color));useF(p,'uHead',(live.raw.M+Math.PI)/TAU);gl.drawArrays(gl.TRIANGLE_STRIP,0,ORBIT_SAMPLES*2);
      });
    }
    function drawAsteroids() {
      if(!toggles.asteroids.checked)return;
      const p=programs.asteroid;gl.useProgram(p);useMat(p,'uVP',state.vp);useF(p,'uJD',jdFromMs(state.simMs));useF(p,'uCompress',state.compress);useF(p,'uScale',SCALE);useF(p,'uPixelRatio',1);useV3(p,'uCamera',state.camera);
      gl.bindVertexArray(asteroidBuffer.vao);gl.drawArrays(gl.POINTS,0,asteroidBuffer.count);
    }
    function drawComet() {
      if(!toggles.comet.checked||!state.halley||state.halley.r>6.5)return;
      const h=state.halley,head=displayWorld(h.ecl,state.compress),next=displayWorld(halleyState(jdFromMs(state.simMs)+.7).ecl,state.compress),prev=displayWorld(halleyState(jdFromMs(state.simMs)-.7).ecl,state.compress);
      const anti=norm3(head),vel=norm3(sub3(next,prev)),strength=clamp(Math.pow(3/h.r,2),.05,1.8),length=24*strength;
      const tails=[[norm3(add3(anti,mul3(vel,-.08))),[.25,.62,1.],.65],[norm3(add3(mul3(anti,.72),mul3(vel,-.65))),[1.,.62,.22],1.1]];
      const p=programs.comet;gl.useProgram(p);useMat(p,'uVP',state.vp);gl.bindVertexArray(cometBuffer.vao);
      tails.forEach(t=>{
        const a=new Float32Array(34*4);
        for(let i=0;i<34;i++){const q=i/33,curve=add3(mul3(t[0],length*q*t[2]),mul3(anti,length*q*q*.16));const pos=add3(head,curve),o=i*4;a[o]=pos[0];a[o+1]=pos[1];a[o+2]=pos[2];a[o+3]=(1-q)*(1-q)*strength;}
        gl.bindBuffer(gl.ARRAY_BUFFER,cometBuffer.buffer);gl.bufferData(gl.ARRAY_BUFFER,a,gl.DYNAMIC_DRAW);useV3(p,'uColor',t[1]);gl.drawArrays(gl.LINE_STRIP,0,34);
      });
      const comet={body:{id:'halley',type:'rocky',color:'#d3e8ea',radius:12},display:head,radius:.34,axis:[0,1,0],basis:axisBasis([0,1,0]),spin:0,raw:h};
      drawBody(comet,performance.now()*.001);
    }

    function bindTexture(unit, texture) {
      gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,texture);
    }
    function runBloom() {
      if(!toggles.bloom.checked)return;
      gl.disable(gl.DEPTH_TEST);gl.depthMask(false);setBlend('none');
      let p=programs.prefilter;
      gl.bindFramebuffer(gl.FRAMEBUFFER,targets.down[0].fbo);gl.viewport(0,0,targets.down[0].w,targets.down[0].h);gl.useProgram(p);bindTexture(0,targets.scene.tex);useI(p,'uSource',0);drawFullscreen();
      p=programs.down;
      for(let i=1;i<targets.down.length;i++){
        const t=targets.down[i],source=targets.down[i-1];
        gl.bindFramebuffer(gl.FRAMEBUFFER,t.fbo);gl.viewport(0,0,t.w,t.h);gl.useProgram(p);bindTexture(0,source.tex);useI(p,'uSource',0);gl.uniform2f(uni(p,'uTexel'),1/source.w,1/source.h);drawFullscreen();
      }
      const last=targets.down.length-1,seed=targets.up[last],source=targets.down[last];
      gl.bindFramebuffer(gl.FRAMEBUFFER,seed.fbo);gl.viewport(0,0,seed.w,seed.h);gl.useProgram(p);bindTexture(0,source.tex);useI(p,'uSource',0);gl.uniform2f(uni(p,'uTexel'),1/source.w,1/source.h);drawFullscreen();
      p=programs.up;
      for(let i=last-1;i>=0;i--){
        const t=targets.up[i],base=targets.down[i],small=targets.up[i+1];
        // Keep the widest mip levels from washing the whole sky amber.
        // The first two levels give a tight optical halo; deeper levels
        // remain allocated but do not dominate the composite.
        const weight=i===0?.28:(i===1?.11:0);
        gl.bindFramebuffer(gl.FRAMEBUFFER,t.fbo);gl.viewport(0,0,t.w,t.h);gl.useProgram(p);bindTexture(0,base.tex);bindTexture(1,small.tex);useI(p,'uBase',0);useI(p,'uSmall',1);gl.uniform2f(uni(p,'uTexel'),1/small.w,1/small.h);useF(p,'uWeight',weight);drawFullscreen();
      }
    }
    function resolveScene() {
      if(!targets.scene.msaa)return;
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER,targets.scene.msaaFbo);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,targets.scene.fbo);
      gl.blitFramebuffer(0,0,state.width,state.height,0,0,state.width,state.height,gl.COLOR_BUFFER_BIT,gl.NEAREST);
    }
    function finalComposite(time) {
      gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,state.width,state.height);gl.disable(gl.DEPTH_TEST);gl.depthMask(false);setBlend('none');
      const p=programs.final;gl.useProgram(p);bindTexture(0,targets.scene.tex);bindTexture(1,targets.up[0].tex);useI(p,'uScene',0);useI(p,'uBloom',1);useF(p,'uBloomOn',toggles.bloom.checked?1:0);useF(p,'uTime',time);useF(p,'uFlare',toggles.bloom.checked?state.flare[2]:0);gl.uniform2f(uni(p,'uSunNdc'),state.flare[0],state.flare[1]);drawFullscreen();
    }
    function renderScene(time) {
      const scene=targets.scene;
      gl.bindFramebuffer(gl.FRAMEBUFFER,scene.msaa?scene.msaaFbo:scene.fbo);gl.viewport(0,0,state.width,state.height);
      // Critical: clear obeys depthMask, so restore it explicitly every frame.
      gl.depthMask(true);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LESS);gl.clearColor(.00125,.00165,.0025,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      drawBackground(time);drawStars(time);
      gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);setBlend('none');
      drawBody(state.bodies.get('sun'),time);
      PLANETS.forEach(b=>drawBody(state.bodies.get(b.id),time));
      if(toggles.moons.checked)SATELLITES.forEach(b=>drawBody(state.bodies.get(b.id),time));
      gl.depthMask(false);setBlend('add');drawOrbits();drawAsteroids();
      setBlend('alpha');gl.disable(gl.CULL_FACE);
      PLANETS.forEach(b=>drawAtmosphere(state.bodies.get(b.id)));
      if(toggles.moons.checked)SATELLITES.forEach(b=>drawAtmosphere(state.bodies.get(b.id)));
      ['jupiter','saturn','uranus'].forEach(id=>drawRing(state.bodies.get(id)));
      setBlend('add');drawComet();
      gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);gl.depthMask(true);

    }

    function pickAt(clientX,clientY) {
      const rect=canvas.getBoundingClientRect(),px=(clientX-rect.left)/rect.width*state.width,py=(clientY-rect.top)/rect.height*state.height;
      let best=null,bestScore=Infinity;
      state.bodies.forEach(live=>{
        if(isMoon(live.body)&&!toggles.moons.checked)return;
        const q=m4transformPoint(state.vp,live.display);if(q[3]<=0)return;
        const x=(q[0]/q[3]*.5+.5)*state.width,y=(1-(q[1]/q[3]*.5+.5))*state.height;
        const r=Math.max(11,live.radius/Math.max(.001,q[3])*state.height/Math.tan(rad(47)/2));
        const d=Math.hypot(px-x,py-y);
        if(d<r&&d/r<bestScore){best=live.body.id;bestScore=d/r;}
      });
      if(best)selectBody(best,true);
    }
    function setupInput() {
      const pointers=new Map();
      canvas.addEventListener('pointerdown',ev=>{
        canvas.setPointerCapture(ev.pointerId);pointers.set(ev.pointerId,[ev.clientX,ev.clientY]);
        state.pointerId=ev.pointerId;state.dragging=true;state.dragMoved=false;state.lastPointer=[ev.clientX,ev.clientY];canvas.focus();
      });
      canvas.addEventListener('pointermove',ev=>{
        if(!pointers.has(ev.pointerId))return;
        pointers.set(ev.pointerId,[ev.clientX,ev.clientY]);
        if(pointers.size===2){
          const pts=Array.from(pointers.values()),dist=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]);
          if(state.pinchDistance)state.distanceGoal=clamp(state.distanceGoal*(state.pinchDistance/dist),3.5,1600);
          state.pinchDistance=dist;state.dragMoved=true;return;
        }
        if(ev.pointerId!==state.pointerId)return;
        const dx=ev.clientX-state.lastPointer[0],dy=ev.clientY-state.lastPointer[1];
        if(Math.abs(dx)+Math.abs(dy)>1){state.yaw-=dx*.006;state.pitch-=dy*.006;state.dragMoved=true;}
        state.lastPointer=[ev.clientX,ev.clientY];
      });
      const release=ev=>{
        if(!pointers.has(ev.pointerId))return;
        const wasPrimary=ev.pointerId===state.pointerId,clicked=wasPrimary&&!state.dragMoved;
        pointers.delete(ev.pointerId);state.pinchDistance=0;if(wasPrimary){state.dragging=false;state.pointerId=null;}
        if(clicked)pickAt(ev.clientX,ev.clientY);
      };
      canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
      canvas.addEventListener('wheel',ev=>{ev.preventDefault();state.distanceGoal=clamp(state.distanceGoal*Math.exp(ev.deltaY*.0011),3.5,1600);},{passive:false});
      window.addEventListener('keydown',ev=>{
        if(ev.code==='Space'){ev.preventDefault();state.paused=!state.paused;}
        else if(ev.code==='ArrowLeft'){ev.preventDefault();speedSlider.value=String(clamp(Number(speedSlider.value)-5,-100,100));state.slider=Number(speedSlider.value);}
        else if(ev.code==='ArrowRight'){ev.preventDefault();speedSlider.value=String(clamp(Number(speedSlider.value)+5,-100,100));state.slider=Number(speedSlider.value);}
        else if(ev.key==='h'||ev.key==='H'){ui.classList.toggle('hidden');}
      });
      playButton.addEventListener('click',()=>{state.paused=!state.paused;});
      nowButton.addEventListener('click',()=>{state.simMs=Date.now();state.orbitDirty=true;});
      speedSlider.addEventListener('input',()=>{state.slider=Number(speedSlider.value);});
      toggles.realScale.addEventListener('change',()=>{state.targetCompress=toggles.realScale.checked?1:COMPRESS_DEFAULT;state.orbitDirty=true;});
      window.addEventListener('resize',resize);
    }
    function init() {
      bootState.textContent='正在编译程序化光球、轨道与观测管线…';
      hasFloat=!!gl.getExtension('EXT_color_buffer_float');
      makePrograms();
      sphere=createSphere(40,64);ringMesh=createRing(320);emptyVao=gl.createVertexArray();
      starBuffer=createStars(11000);asteroidBuffer=createAsteroids();orbitBuffer=makeOrbitBuffer();cometBuffer=makeDynamicLineBuffer();
      resize();updateBodies(0);rebuildOrbits();state.lastOrbitJD=jdFromMs(state.simMs);setupInput();
      bootState.textContent=hasFloat?'HDR 与多重采样就绪':'已切换至兼容色彩管线';
      setTimeout(()=>boot.classList.add('done'),430);
      requestAnimationFrame(frame);
    }
    function frame(now) {
      const dt=Math.min(.08,(now-state.lastFrame)/1000);state.lastFrame=now;
      const delta=state.targetCompress-state.compress;
      if(Math.abs(delta)>.00001){const step=Math.sign(delta)*Math.min(Math.abs(delta),dt*(1-COMPRESS_DEFAULT)/.4);state.compress+=step;state.orbitDirty=true;}
      const simDays=state.paused?0:dt*simDaysPerSecond(state.slider);
      state.simMs+=simDays*DAY_MS;updateBodies(simDays);updateCamera(dt);
      const jd=jdFromMs(state.simMs);
      if(state.orbitDirty||Math.abs(jd-state.lastOrbitJD)>20){rebuildOrbits();state.lastOrbitJD=jd;}
      state.flare=getFlare();renderScene(now*.001);
      state.uiClock+=dt;state.labelsClock+=dt;
      if(state.uiClock>.10){updateInfo();state.uiClock=0;}
      if(state.labelsClock>.06){updateLabels();state.labelsClock=0;}
      state.currentFps=mix(state.currentFps,1/Math.max(.0001,dt),.06);
      requestAnimationFrame(frame);
    }
    try { init(); } catch(err) {
      console.error(err);boot.classList.add('fail');boot.querySelector('.boot-title').textContent='观测台初始化失败';bootState.textContent=err.message;
    }
  })();
  </script>
