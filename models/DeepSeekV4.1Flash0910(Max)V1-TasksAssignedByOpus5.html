/* ============================================================= 彗尾构建 */
const tailVerts = [];
function buildTails(camP){
  if (!comet.active || !state.showComet) return;
  const P = comet.wpos;
  const r = comet.r;
  const t = Math.min(12, (3/r)*(3/r));
  const len = Math.min(40, 5.0*t);
  const inten = Math.min(0.55, 0.062*t);
  const anti = nrm3([P[0], P[1], P[2]]);
  const vel = comet.velDir;

  const emit = (curveAmt, w0f, w1f, colIdx) => {
    const base = tailVerts.length/5;
    for (let i = 0; i < TAIL_SEG; i++){
      const f = i/(TAIL_SEG - 1);
      let dx = anti[0]*(1 - f*curveAmt) + (-vel[0])*(f*curveAmt);
      let dy = anti[1]*(1 - f*curveAmt) + (-vel[1])*(f*curveAmt);
      let dz = anti[2]*(1 - f*curveAmt) + (-vel[2])*(f*curveAmt);
      const dl = Math.hypot(dx, dy, dz) || 1;
      dx/=dl; dy/=dl; dz/=dl;
      const cx = P[0] + dx*(f*len), cy = P[1] + dy*(f*len), cz = P[2] + dz*(f*len);
      // 绕尾轴朝相机的 billboard
      let vx = camP[0] - cx, vy = camP[1] - cy, vz = camP[2] - cz;
      let rx = dy*vz - dz*vy, ry = dz*vx - dx*vz, rz = dx*vy - dy*vx;
      const rl = Math.hypot(rx, ry, rz) || 1;
      rx/=rl; ry/=rl; rz/=rl;
      const wdt = (w0f + (w1f - w0f)*f)*len;
      const a = inten*Math.pow(1 - f, 1.55);
      tailVerts.push(cx - rx*wdt, cy - ry*wdt, cz - rz*wdt, a, -1);
      tailVerts.push(cx + rx*wdt, cy + ry*wdt, cz + rz*wdt, a,  1);
    }
    return base;
  };
  emit(0.0, 0.011, 0.072, 0);     // 离子尾：笔直反日
  emit(0.62, 0.015, 0.145, 1);    // 尘埃尾：沿速度反方向弯曲
}

/* =============================================================== 渲染主循环 */
const mProj = m4new(), mView = m4new(), mVP = m4new(), mInvVP = m4new();
const mMat = m4new(), mMat2 = m4new();
const m3tmp = new Float32Array(9);
const projOut = new Float32Array(6);
let flareVis = 0;
let lastFrame = performance.now();
let uiClock = 0;

function render(dt){
  const w = rtW, h = rtH;
  if (!w || !h) return;

  camEye(camPos);
  const dx = camPos[0] - cam.target[0], dy = camPos[1] - cam.target[1], dz = camPos[2] - cam.target[2];
  const dist = Math.hypot(dx, dy, dz);
  const near = Math.max(0.012, dist*0.0035);
  const far  = Math.max(dist*14, 4200);
  m4persp(cam.fov, w/h, near, far, mProj);
  m4look(camPos, cam.target, [0, 1, 0], mView);
  m4mul(mProj, mView, mVP);
  m4inv(mVP, mInvVP);
  lastVP.set(mVP);

  /* ---------------- 场景 ---------------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, msaaOK ? msaaFBO : sceneFBO);
  gl.viewport(0, 0, w, h);
  gl.depthMask(true);                       // 7.1：clear 前必须打开深度写
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.BLEND);

  // 1. 背景
  gl.depthMask(false);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(PROG.bg);
  gl.uniformMatrix4fv(PROG.bg.u.uInvVP, false, mInvVP);
  gl.uniform3fv(PROG.bg.u.uGalPole, GALACTIC_POLE);
  gl.uniform2f(PROG.bg.u.uRes, w, h);
  gl.bindVertexArray(gEmpty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 2. 恒星
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(PROG.star);
  gl.uniformMatrix4fv(PROG.star.u.uVP, false, mVP);
  gl.uniform3fv(PROG.star.u.uCamPos, camPos);
  gl.uniform1f(PROG.star.u.uTime, state.time);
  gl.uniform2f(PROG.star.u.uRes, w, h);
  gl.bindVertexArray(STARS.vao);
  gl.drawArrays(gl.POINTS, 0, STARS.count);

  // 3-4. 太阳与行星、卫星
  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  gl.useProgram(PROG.surf);
  const U = PROG.surf.u;
  gl.uniform3fv(U.uCamPos, camPos);
  gl.uniform3f(U.uSunPos, 0, 0, 0);
  gl.uniform1f(U.uTime, state.time);
  gl.uniform1i(U.uNightLights, 1);

  const drawBody = (b, geom) => {
    if (b.kind === 'moon' && !state.showMoon) return;
    if (b.kind === 'comet' && !state.showComet) return;
    gl.uniformMatrix4fv(U.uModel, false, b.model);
    gl.uniformMatrix4fv(U.uVP, false, mVP);
    gl.uniform1i(U.uBody, b.type);
    gl.uniform1f(U.uRadius, b.dispR);
    gl.uniform1f(U.uSunI, b.kind === 'star' ? 1 : b.sunI);
    gl.uniform1f(U.uBump, b.bump);
    gl.uniform1f(U.uSpecPow, b.specPow);
    gl.uniform1f(U.uTermSoft, b.termSoft);
    gl.uniform1i(U.uRingKind, b.ringKind);
    gl.uniform1f(U.uRingIn, b.ringIn || 0);
    gl.uniform1f(U.uRingOut, b.ringOut || 0);
    if (b.ringKind > 0){
      worldToObjRot(b, m3tmp);
      const L = nrm3([-b.wpos[0], -b.wpos[1], -b.wpos[2]]);
      const so = [m3tmp[0]*L[0] + m3tmp[3]*L[1] + m3tmp[6]*L[2],
                  m3tmp[1]*L[0] + m3tmp[4]*L[1] + m3tmp[7]*L[2],
                  m3tmp[2]*L[0] + m3tmp[5]*L[1] + m3tmp[8]*L[2]];
      gl.uniform3fv(U.uSunDirO, so);
    }
    gl.bindVertexArray(geom.vao);
    gl.drawElements(gl.TRIANGLES, geom.count, geom.type, 0);
  };

  drawBody(sunBody, gSphereHI);
  for (const b of planets) drawBody(b, gSphereMD);
  for (const b of moonList) drawBody(b, gSphereLO);
  if (state.showComet){
    drawBody(comet, gSphereLO);
  }

  // 5. 轨道缎带
  if (state.showOrbit){
    gl.disable(gl.CULL_FACE);
    gl.depthMask(false);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(PROG.orbit);
    gl.uniformMatrix4fv(PROG.orbit.u.uVP, false, mVP);
    gl.uniform2f(PROG.orbit.u.uRes, w, h);
    gl.uniform1f(PROG.orbit.u.uHalfW, 1.6);
    gl.bindVertexArray(orbitVAO);
    for (const b of planets){
      if (b.kind === 'moon') continue;
      const n = buildOrbit(b);
      if (!n) continue;
      gl.uniform3fv(PROG.orbit.u.uColor, orbitColor(b));
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, n);
    }
    if (state.showComet && comet.active){
      const n = buildOrbitHalley();
      if (n){
        gl.uniform3f(PROG.orbit.u.uColor, 0.42, 0.72, 0.92);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, n);
      }
    }
  }

  // 6. 小行星带 / 柯伊伯带
  if (state.showBelt){
    gl.depthMask(false);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(PROG.point);
    gl.uniformMatrix4fv(PROG.point.u.uVP, false, mVP);
    gl.uniform3fv(PROG.point.u.uCamPos, camPos);
    gl.uniform1f(PROG.point.u.uDays, state.jd - J2000);
    gl.uniform1f(PROG.point.u.uScale, SCALE_BASE);
    gl.uniform1f(PROG.point.u.uCompress, state.compress);
    gl.bindVertexArray(BELTS.vao);
    gl.drawArrays(gl.POINTS, 0, BELTS.count);
  }

  // 7. 大气壳层
  gl.disable(gl.CULL_FACE);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(PROG.atm);
  const A = PROG.atm.u;
  gl.uniformMatrix4fv(A.uVP, false, mVP);
  gl.uniform3fv(A.uCamPos, camPos);
  gl.uniform3f(A.uSunPos, 0, 0, 0);
  for (const b of bodies){
    if (!b.atm) continue;
    if (b.kind === 'moon' && !state.showMoon) continue;
    const R = b.dispR*(1 + b.atm.H*7.5);
    m4fromTRS(b.wpos, b.basis, R, mMat);
    gl.uniformMatrix4fv(A.uModel, false, mMat);
    gl.uniform3fv(A.uPlanetPos, b.wpos);
    gl.uniform3fv(A.uAtmColor, b.atm.c);
    gl.uniform1f(A.uPlanetR, b.dispR);
    gl.uniform1f(A.uScaleH, b.atm.H);
    gl.uniform1f(A.uSunI, b.sunI);
    gl.uniform1f(A.uAtmStrength, b.atm.s);
    gl.bindVertexArray(gSphereMD.vao);
    gl.drawElements(gl.TRIANGLES, gSphereMD.count, gSphereMD.type, 0);
  }

  // 8. 环系
  gl.disable(gl.CULL_FACE);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(PROG.ring);
  const R = PROG.ring.u;
  gl.uniformMatrix4fv(R.uVP, false, mVP);
  gl.uniform3fv(R.uCamPos, camPos);
  gl.uniform3f(R.uSunPos, 0, 0, 0);
  for (const b of planets){
    if (!b.ringKind) continue;
    m4fromTRS(b.wpos, b.basis, b.dispR, mMat);
    gl.uniformMatrix4fv(R.uModel, false, mMat);
    gl.uniform3fv(R.uPlanetPos, b.wpos);
    gl.uniform3fv(R.uAxisW, b.axis);
    gl.uniform1f(R.uPlanetR, b.dispR);
    gl.uniform1f(R.uSunI, b.sunI);
    gl.uniform1i(R.uRingKind, b.ringKind);
    const col = b.ringKind === 1 ? [0.62, 0.55, 0.44]
              : b.ringKind === 2 ? [0.030, 0.030, 0.034]
              : [0.30, 0.24, 0.19];
    gl.uniform3fv(R.uRingColor, col);
    const g = b.ringKind === 1 ? gRingSat : b.ringKind === 2 ? gRingUra : gRingJup;
    gl.bindVertexArray(g.vao);
    gl.drawElements(gl.TRIANGLES, g.count, g.type, 0);
  }

  // 9. 彗尾 + 彗发
  if (state.showComet && comet.active){
    tailVerts.length = 0;
    buildTails(camPos);
    if (tailVerts.length){
      gl.bindVertexArray(tailVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER, tailVBO);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(tailVerts));
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.depthMask(false);
      gl.useProgram(PROG.tail);
      gl.uniformMatrix4fv(PROG.tail.u.uVP, false, mVP);
      const cnt = tailVerts.length/5;
      gl.uniform3f(PROG.tail.u.uColor, 0.42, 0.66, 1.0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, TAIL_SEG*2);
      gl.uniform3f(PROG.tail.u.uColor, 1.0, 0.78, 0.48);
      gl.drawArrays(gl.TRIANGLE_STRIP, TAIL_SEG*2, TAIL_SEG*2);
    }
    // 彗发
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.depthMask(false);
    gl.useProgram(PROG.corona);
    gl.uniformMatrix4fv(PROG.corona.u.uVP, false, mVP);
    gl.uniform3fv(PROG.corona.u.uCenter, comet.wpos);
    gl.uniform3fv(PROG.corona.u.uCamPos, camPos);
    gl.uniform1f(PROG.corona.u.uSize, 1.1 + 1.5*Math.min(2.2, Math.pow(3/Math.max(comet.r, 0.1), 2)*0.22));
    gl.uniform1f(PROG.corona.u.uOffset, 0);
    gl.uniform3f(PROG.corona.u.uColorA, 0.62, 0.86, 1.0);
    gl.uniform3f(PROG.corona.u.uColorB, 0.85, 0.96, 1.0);
    gl.uniform1f(PROG.corona.u.uStrength, 0.16 + 0.16*Math.min(1.8, Math.pow(3/Math.max(comet.r, 0.1), 2)*0.16));
    gl.uniform1f(PROG.corona.u.uTime, state.time);
    gl.bindVertexArray(gQuad.vao);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  // 10. 日冕
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.depthMask(false);
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(PROG.corona);
  gl.uniformMatrix4fv(PROG.corona.u.uVP, false, mVP);
  gl.uniform3fv(PROG.corona.u.uCenter, sunBody.wpos);
  gl.uniform3fv(PROG.corona.u.uCamPos, camPos);
  gl.uniform1f(PROG.corona.u.uTime, state.time);
  gl.bindVertexArray(gQuad.vao);
  // 内层
  gl.uniform1f(PROG.corona.u.uSize, SUN_DISPLAY_R*3.1);
  gl.uniform1f(PROG.corona.u.uOffset, SUN_DISPLAY_R*0.55);
  gl.uniform3f(PROG.corona.u.uColorA, 1.0, 0.66, 0.30);
  gl.uniform3f(PROG.corona.u.uColorB, 1.0, 0.90, 0.70);
  gl.uniform1f(PROG.corona.u.uStrength, 0.27);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  // 外层
  gl.uniform1f(PROG.corona.u.uSize, SUN_DISPLAY_R*9.0);
  gl.uniform1f(PROG.corona.u.uOffset, SUN_DISPLAY_R*0.5);
  gl.uniform3f(PROG.corona.u.uColorA, 0.40, 0.58, 1.0);
  gl.uniform3f(PROG.corona.u.uColorB, 0.72, 0.84, 1.0);
  gl.uniform1f(PROG.corona.u.uStrength, 0.060);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  /* ---------------- 解析 MSAA ---------------- */
  if (msaaOK){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, msaaFBO);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, sceneFBO);
    gl.blitFramebuffer(0, 0, w, h, 0, 0, w, h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  }

  /* ---------------- 泛光 ---------------- */
  if (!bloomMips.length){ gl.bindFramebuffer(gl.FRAMEBUFFER, null); return; }
  const thr = HDR_OK ? 1.25 : 0.72;
  const knee = HDR_OK ? 0.60 : 0.35;
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);

  gl.bindVertexArray(gEmpty);
  gl.useProgram(PROG.bright);
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomMips[0].fbo);
  gl.viewport(0, 0, bloomMips[0].w, bloomMips[0].h);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(PROG.bright.u.uTex, 0);
  gl.uniform1f(PROG.bright.u.uThr, thr);
  gl.uniform1f(PROG.bright.u.uKnee, knee);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.useProgram(PROG.down);
  gl.uniform1i(PROG.down.u.uTex, 0);
  for (let i = 1; i < bloomMips.length; i++){
    const src = bloomMips[i-1], dst = bloomMips[i];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0, 0, dst.w, dst.h);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform2f(PROG.down.u.uTexel, 1/src.w, 1/src.h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // 升采样：加法混合累加（避免纹理反馈环，见 7.3）
  gl.useProgram(PROG.up);
  gl.uniform1i(PROG.up.u.uTex, 0);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = bloomMips.length - 1; i > 0; i--){
    const src = bloomMips[i], dst = bloomMips[i-1];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0, 0, dst.w, dst.h);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform2f(PROG.up.u.uTexel, 1/src.w, 1/src.h);
    gl.uniform1f(PROG.up.u.uRadius, 1.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.disable(gl.BLEND);

  /* ---------------- 合成 ---------------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(PROG.comp);
  const C = PROG.comp.u;
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(C.uScene, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, bloomMips[0].tex);
  gl.uniform1i(C.uBloom, 1);
  gl.uniform1f(C.uBloomI, state.showBloom ? 0.34 : 0.0);
  gl.uniform2f(C.uSunScr, sunScreen[0], sunScreen[1]);
  gl.uniform1f(C.uFlare, state.showBloom ? flareVis : 0.0);
  gl.uniform1f(C.uExposure, 1.0);
  gl.uniform1f(C.uGrain, 0.011);
  gl.uniform1f(C.uVig, 0.30);
  gl.uniform1f(C.uTime, state.time);
  gl.bindVertexArray(gEmpty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
}

/* --------------------------------------------------------- 轨道点生成 */
function orbitColor(b){
  const c = b.phy.color;
  return [c[0]*0.55 + 0.12, c[1]*0.55 + 0.14, c[2]*0.55 + 0.20];
}
function buildOrbit(b){
  if (!b.a || b.kind === 'moon') return 0;
  const N = ORBIT_SAMPLES;
  const arr = orbitData;
  const e = b.e, a = b.a, I = b.inc, w = b.w, node = b.node;
  const cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(node), sO = Math.sin(node),
        cI = Math.cos(I), sI = Math.sin(I);
  const E0 = b.E;
  const k = SCALE_BASE*Math.pow(b.r, state.compress)/b.r;
  const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N), pl = new Float32Array(N);
  for (let i = 0; i < N; i++){
    const E = i/N*TAU;
    const xp = a*(Math.cos(E) - e);
    const yp = a*Math.sqrt(Math.max(0, 1 - e*e))*Math.sin(E);
    const x = (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp;
    const y = (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp;
    const z = (sw*sI)*xp + (cw*sI)*yp;
    const r = Math.hypot(x, y, z) || 1e-9;
    const kk = SCALE_BASE*Math.pow(r, state.compress)/r;
    px[i] = x*kk; py[i] = z*kk; pz[i] = -y*kk;
    let lag = ((E0 - E) % TAU + TAU) % TAU/TAU;
    pl[i] = lag;
  }
  let o = 0;
  for (let i = 0; i < N; i++){
    const j = (i + 1) % N;
    const x = px[i], y = py[i], z = pz[i];
    const nx = px[j], ny = py[j], nz = pz[j];
    const lag = pl[i];
    arr[o++] = x; arr[o++] = y; arr[o++] = z; arr[o++] = nx; arr[o++] = ny; arr[o++] = nz; arr[o++] = lag; arr[o++] = -1;
    arr[o++] = x; arr[o++] = y; arr[o++] = z; arr[o++] = nx; arr[o++] = ny; arr[o++] = nz; arr[o++] = lag; arr[o++] =  1;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, orbitVBO);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr);
  return N*2;
}
function buildOrbitHalley(){
  const N = ORBIT_SAMPLES;
  const arr = orbitData;
  const a = HALLEY.a, e = HALLEY.e, I = HALLEY.I*DEG, w = HALLEY.w*DEG, node = HALLEY.node*DEG;
  const cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(node), sO = Math.sin(node),
        cI = Math.cos(I), sI = Math.sin(I);
  const Mnow = TAU*(state.jd - HALLEY.Tp)/HALLEY.P;
  const E0 = solveKepler(normAngle(Mnow), e);
  const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
  for (let i = 0; i < N; i++){
    const E = i/N*TAU;
    const xp = a*(Math.cos(E) - e);
    const yp = a*Math.sqrt(Math.max(0, 1 - e*e))*Math.sin(E);
    const x = (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp;
    const y = (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp;
    const z = (sw*sI)*xp + (cw*sI)*yp;
    const r = Math.hypot(x, y, z) || 1e-9;
    const kk = SCALE_BASE*Math.pow(r, state.compress)/r;
    px[i] = x*kk; py[i] = z*kk; pz[i] = -y*kk;
  }
  let o = 0;
  for (let i = 0; i < N; i++){
    const j = (i + 1) % N;
    const E = i/N*TAU;
    const lag = ((E0 - E) % TAU + TAU) % TAU/TAU;
    arr[o++] = px[i]; arr[o++] = py[i]; arr[o++] = pz[i];
    arr[o++] = px[j]; arr[o++] = py[j]; arr[o++] = pz[j];
    arr[o++] = lag; arr[o++] = -1;
    arr[o++] = px[i]; arr[o++] = py[i]; arr[o++] = pz[i];
    arr[o++] = px[j]; arr[o++] = py[j]; arr[o++] = pz[j];
    arr[o++] = lag; arr[o++] =  1;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, orbitVBO);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr);
  return N*2;
}

/* ----------------------------------------------------- 太阳屏幕位置 / 眩光 */
const sunScreen = new Float32Array([0.5, 0.5]);
function computeFlare(){
  const rect = canvas.getBoundingClientRect();
  projectTo(mVP, [0, 0, 0], rect.width, rect.height, projOut);
  if (projOut[3] <= 1e-6) return 0;
  const uvx = projOut[4]/rect.width, uvy = 1 - projOut[5]/rect.height;
  sunScreen[0] = uvx; sunScreen[1] = uvy;
  if (uvx < -0.25 || uvx > 1.25 || uvy < -0.25 || uvy > 1.25) return 0;

  let vis = 1;
  for (const b of planets){
    if (b.kind === 'moon') continue;
    projectTo(mVP, b.wpos, rect.width, rect.height, projOut);
    if (projOut[3] <= 1e-6) continue;
    if (projOut[2]/projOut[3] > 0.9999) continue;         // 在太阳之后
    const dpx = Math.hypot(projOut[4] - uvx*rect.width, projOut[5] - uvy*rect.height);
    const rpx = b.dispR/projOut[3]*rect.height*0.5;
    if (dpx < rpx*0.98) vis = 0;
  }
  // 画面边缘淡出
  const edge = Math.min(1, Math.min(uvx, 1-uvx, uvy, 1-uvy)/0.22);
  return vis*Math.max(0, edge);
}

/* ------------------------------------------------------------- 标签更新 */
function updateLabels(){
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  const showLab = state.showLabel && !state.uiHidden;
  for (const L of labelEls){
    const b = L.body;
    if (!showLab || (b.kind === 'moon' && !state.showMoon) ||
        (b.kind === 'comet' && (!state.showComet || !comet.active))){
      L.el.style.opacity = '0'; continue;
    }
    projectTo(mVP, b.wpos, w, h, projOut);
    if (projOut[3] <= 1e-6){ L.el.style.opacity = '0'; continue; }
    const x = projOut[4], y = projOut[5];
    if (x < -60 || x > w + 60 || y < -30 || y > h + 30){ L.el.style.opacity = '0'; continue; }
    const rpx = b.dispR/projOut[3]*h*0.5;
    const op = Math.max(0.12, Math.min(1, 1 - (rpx - 34)/70));
    const d = Math.hypot(camPos[0] - b.wpos[0], camPos[1] - b.wpos[1], camPos[2] - b.wpos[2]);
    const farFade = Math.max(0.10, Math.min(1, 1 - (d - 320)/420));
    L.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%,-50%)';
    L.el.style.opacity = (op*farFade).toFixed(3);
  }
}

/* ================================================================= 主循环 */
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - lastFrame)/1000;
  lastFrame = now;
  if (!isFinite(dt) || dt <= 0) dt = 1/60;
  dt = Math.min(dt, 0.08);
  state.time += dt;

  // 速度
  const v = state.slider;
  const dir = v < 0 ? -1 : 1;
  state.realDps = dir*1.157407e-5*Math.pow(10, Math.abs(v)/100*8.55);
  state.speedDps = state.paused ? 0 : state.realDps;

  const dtDays = dt*state.speedDps;
  state.jd += dtDays;

  // 距离压缩过渡（约 0.4 秒）
  const kc = 1 - Math.exp(-dt*7.5);
  state.compress += (state.compressTarget - state.compress)*kc;

  updateBodies(state.jd, dtDays);

  // 相机跟随
  if (focusDecay > 0){
    focusDecay *= Math.exp(-dt*4.2);
    if (focusDecay < 0.002) focusDecay = 0;
  }
  const fb = state.focus >= 0 ? bodies[state.focus] : null;
  if (fb){
    cam.target[0] = fb.wpos[0] + focusOffset[0]*focusDecay;
    cam.target[1] = fb.wpos[1] + focusOffset[1]*focusDecay;
    cam.target[2] = fb.wpos[2] + focusOffset[2]*focusDecay;
  } else {
    cam.target[0] = cam.freeTarget[0];
    cam.target[1] = cam.freeTarget[1];
    cam.target[2] = cam.freeTarget[2];
  }
  cam.dist = cam.distGoal + distOffset[0]*focusDecay;
  cam.dist = Math.max(0.25, cam.dist);

  render(dt);
  flareVis = computeFlare();

  // 界面（约 8 Hz）
  uiClock += dt;
  if (uiClock > 0.12){
    uiClock = 0;
    elDate.textContent = fmtDate(state.jd);
    elSpeed.textContent = fmtSpeed(state.speedDps);
    const y = jdToDate(state.jd).getUTCFullYear();
    elWarn.classList.toggle('on', y < 1800 || y > 2050);
    refreshInfo(false);
  }
  updateLabels();

  // 自适应分辨率
  frameTimes.push(dt);
  if (frameTimes.length > 45){
    frameTimes.shift();
    let sum = 0;
    for (const t of frameTimes) sum += t;
    const avg = sum/frameTimes.length;
    if (avg > 0.0172 && renderScale > 0.5){
      fastCount = 0;
      if (++slowCount > 3){ slowCount = 0; renderScale = Math.max(0.5, renderScale*0.86); resize(true); frameTimes.length = 0; }
    } else if (avg < 0.0115 && renderScale < 1.0){
      slowCount = 0;
      if (++fastCount > 18){ fastCount = 0; renderScale = Math.min(1.0, renderScale*1.07); resize(true); frameTimes.length = 0; }
    } else { slowCount = 0; fastCount = 0; }
  }
}

/* ================================================================== 启动 */
resize(true);
buildList();
buildLabels();
focusOn(0);
cam.dist = cam.distGoal = 128;
distOffset[0] = 0;
focusDecay = 0;
requestAnimationFrame(frame);
setTimeout(() => document.getElementById('boot').classList.add('off'), 260);
setTimeout(() => { elHint.style.opacity = '0'; }, 11000);
if (!HDR_OK){
  console.warn('未获得 EXT_color_buffer_float，已退回 RGBA8 渲染路径。');
}

</script>
