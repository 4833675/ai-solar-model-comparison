<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙幻想 3D 霓光太阳系 | Cosmic Fantasy Solar System</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Three.js & Libraries via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Post-processing CDN scripts -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --primary: #ff007f;
            --primary-glow: rgba(255, 0, 127, 0.6);
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.6);
            --bg-dark: rgba(10, 8, 24, 0.78);
            --border-glass: rgba(255, 255, 255, 0.18);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --font-title: 'Orbitron', 'Noto Sans SC', sans-serif;
            --font-body: 'Noto Sans SC', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030208;
            font-family: var(--font-body);
            color: var(--text-main);
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--bg-dark);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }

        /* HUD Overlay Layer */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        .interactive { pointer-events: auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-box {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .title-box i {
            font-size: 26px;
            color: var(--primary);
            filter: drop-shadow(0 0 12px var(--primary-glow));
            animation: spin-gem 6s linear infinite;
        }

        @keyframes spin-gem {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.15); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .title-box h1 {
            font-family: var(--font-title);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ff007f, #00f0ff, #ffea00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .title-box .subtitle {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        /* Control Bar */
        .control-bar {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 0 16px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-title);
        }

        .ctrl-btn:hover {
            background: rgba(255, 0, 127, 0.25);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-2px);
        }

        .ctrl-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .ctrl-btn.warp-active {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            color: #fff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
            animation: pulse-warp 0.8s infinite alternate;
        }

        @keyframes pulse-warp {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); box-shadow: 0 0 40px rgba(0, 240, 255, 1); }
        }

        /* Bottom Planet Selector Navigation */
        .bottom-nav {
            align-self: center;
            padding: 10px 18px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            max-width: 92vw;
            scrollbar-width: none;
        }

        .bottom-nav::-webkit-scrollbar { display: none; }

        .nav-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            min-width: 75px;
        }

        .nav-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 0, 127, 0.4);
            transform: translateY(-4px);
        }

        .nav-card.active {
            background: linear-gradient(180deg, rgba(255,0,127,0.3) 0%, rgba(0,240,255,0.1) 100%);
            border-color: var(--primary);
            box-shadow: 0 0 22px var(--primary-glow);
        }

        .planet-icon-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-bottom: 4px;
            box-shadow: 0 0 12px currentColor;
        }

        .nav-card span {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .nav-card.active span, .nav-card:hover span { color: #fff; }

        /* Side Info Panel Drawer */
        #info-panel {
            position: absolute;
            right: 24px;
            top: 85px;
            width: 350px;
            max-height: calc(100vh - 200px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateX(420px);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        #info-panel.active {
            transform: translateX(0);
            opacity: 1;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 12px;
        }

        .planet-titles h2 {
            font-family: var(--font-title);
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .planet-titles p {
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover { color: #fff; }

        .desc-box {
            font-size: 13px;
            line-height: 1.6;
            color: #e2e8f0;
            background: rgba(0,0,0,0.3);
            padding: 14px;
            border-radius: 10px;
            border-left: 3px solid var(--primary);
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            font-family: var(--font-title);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-action:hover {
            box-shadow: 0 0 25px var(--accent-glow);
            transform: scale(1.02);
        }

        /* Status Badge Overlay */
        .status-badge {
            position: absolute;
            left: 24px;
            bottom: 95px;
            padding: 8px 16px;
            font-size: 12px;
            font-family: var(--font-title);
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 var(--primary-glow); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255,0,127,0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255,0,127,0); }
        }
    </style>
</head>
<body>

    <!-- WebGL Canvas Container -->
    <div id="webgl-container"></div>

    <!-- Sci-Fi HUD Layer -->
    <div id="hud-layer">
        <!-- Header -->
        <header>
            <div class="glass-panel title-box interactive">
                <i class="fa-solid fa-gem"></i>
                <div>
                    <h1>COSMIC FANTASY 3D</h1>
                    <div class="subtitle">超现实幻想天体视觉模型</div>
                </div>
            </div>

            <div class="glass-panel control-bar interactive">
                <button class="ctrl-btn" id="btn-warp">
                    <i class="fa-solid fa-bolt"></i> 曲速穿梭
                </button>

                <button class="ctrl-btn" id="btn-burst">
                    <i class="fa-solid fa-explosion"></i> 宇宙脉冲
                </button>

                <button class="ctrl-btn" id="btn-theme">
                    <i class="fa-solid fa-palette"></i> 切换配色
                </button>

                <button class="ctrl-btn active" id="btn-toggle-play">
                    <i class="fa-solid fa-pause"></i> 运转
                </button>

                <button class="ctrl-btn" id="btn-reset-cam">
                    <i class="fa-solid fa-compress"></i> 重置视角
                </button>
            </div>
        </header>

        <!-- Status Indicator -->
        <div class="glass-panel status-badge interactive">
            <div class="pulse-dot"></div>
            <span id="status-text">赛博霓霓光天体系统运行中 (点击空间激发重力波)</span>
        </div>

        <!-- Info Panel Drawer -->
        <div class="glass-panel info-panel interactive" id="info-panel">
            <div class="panel-header">
                <div class="planet-titles">
                    <h2 id="p-title-cn">赛博太阳</h2>
                    <p id="p-title-en">CYBER CORE</p>
                </div>
                <button class="close-btn" id="btn-close-info"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="desc-box" id="p-desc">
                脱离真实物理约束的超现实恒星晶核，由高速旋转的能量双轴九面体与恒星脉冲粒子流构成。
            </div>

            <button class="btn-action" id="btn-focus-target">
                <i class="fa-solid fa-crosshairs"></i> 锁定视角追踪
            </button>
        </div>

        <!-- Bottom Planet Navigation Carousel -->
        <div class="glass-panel bottom-nav interactive" id="planet-nav"></div>
    </div>

    <!-- Application Script -->
    <script>

            {

            },
            {

                desc: '巨大的紫色气态天体，表面缠绕着迷幻的大理石流体云带与能量风暴。'
            },
            {
                id: 'saturn',
                nameCN: '光轨土星',
                nameEN: 'CHRONOS',
                color: '#ffea00',
                size: 7.0,
                distance: 124,
                speed: 0.3,
                hasRings: true,
                desc: '拥有环绕着三重彩虹高能荧光星环的震撼天体。'
            },
            {
                id: 'uranus',
                nameCN: '冰晶天王',
                nameEN: 'FROST',
                color: '#00ffff',
                size: 5.5,
                distance: 148,
                speed: 0.2,
                hasRings: true,
                desc: '剔透如纯净青冰的超现实冰晶天体，呈现倾斜的立体粒子光环。'
            },
            {
                id: 'neptune',
                nameCN: '幽蓝海王',
                nameEN: 'ABYSS',
                color: '#0055ff',
                size: 5.2,
                distance: 172,
                speed: 0.1,
                desc: '深邃幽蓝的远古行星，表面游走着电光闪烁的能量风暴圈。'
            }
        ];

        /**
         * ----------------------------------------------------
         * 2. PALETTE THEMES DEFINITIONS
         * ----------------------------------------------------
         */
        const THEMES = [
            { name: '赛博霓虹', primary: '#ff007f', accent: '#00f0ff', bg: 0x030208, bloomStrength: 1.8 },
            { name: '宇宙金辉', primary: '#ffaa00', accent: '#ff3300', bg: 0x080402, bloomStrength: 2.2 },
            { name: '深空深蓝', primary: '#00f0ff', accent: '#aa00ff', bg: 0x010410, bloomStrength: 1.6 }
        ];
        let currentThemeIndex = 0;

        /**
         * ----------------------------------------------------
         * 3. THREE.JS SCENE SETUP & ENGINE
         * ----------------------------------------------------
         */
        const state = {
            isPlaying: true,
            isWarpSpeed: false,
            selectedPlanetId: null,
            targetFocusMesh: null,
            cameraFollowMode: false
        };

        let container, scene, camera, renderer, composer, controls, bloomPass;
        let sunCoreMesh, sunRingMesh1, sunRingMesh2;
        let starPoints, warpLinesGroup;
        const planetObjects = {};
        const orbitParticleSystems = [];

        function initEngine() {
            container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(THEMES[0].bg, 0.0008);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 3000);
            camera.position.set(0, 110, 230);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.35;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 800;
            controls.minDistance = 5;

            // Ambient & Core Point Light
            scene.add(new THREE.AmbientLight(0x332244, 0.6));

            const coreLight = new THREE.PointLight(0xff007f, 4.0, 1200, 0.3);
            coreLight.position.set(0, 0, 0);
            scene.add(coreLight);
            planetObjects['coreLight'] = coreLight;

            // Post-Processing Bloom
            const renderPass = new THREE.RenderPass(scene, camera);
            bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.8,  // bloom strength
                0.5,  // radius
                0.75  // threshold
            );

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            createStarfield();
            buildFantasySolarSystem();

            // Click listener for Gravity Ripples
            window.addEventListener('click', onSceneClick);
            window.addEventListener('resize', onWindowResize);
        }

        /**
         * ----------------------------------------------------
         * 4. FANTASY COSMOS BUILDER
         * ----------------------------------------------------
         */
        function createStarfield() {
            const count = 18000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const palette = [new THREE.Color('#ff007f'), new THREE.Color('#00f0ff'), new THREE.Color('#ffffff'), new THREE.Color('#ffea00')];

            for (let i = 0; i < count; i++) {
                const r = 600 + Math.random() * 1000;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i * 3 + 2] = r * Math.cos(phi);

                const c = palette[Math.floor(Math.random() * palette.length)];
                colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({ size: 1.5, vertexColors: true, transparent: true, opacity: 0.85 });
            starPoints = new THREE.Points(geo, mat);
            scene.add(starPoints);
        }

        function createFantasyTexture(baseHex, accentHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, baseHex);
            grad.addColorStop(0.5, accentHex);
            grad.addColorStop(1, '#ffffff');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Fluid Marble Swirls
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = (i % 2 === 0) ? baseHex : accentHex;
                ctx.globalAlpha = Math.random() * 0.4 + 0.1;
                ctx.beginPath();
                ctx.ellipse(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 200 + 40, Math.random() * 60 + 10, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        function buildFantasySolarSystem() {
            FANTASY_PLANETS.forEach(data => {
                if (data.id === 'sun') {
                    // Octahedron Crystal Energy Core
                    const crystalGeo = new THREE.OctahedronGeometry(data.size, 2);
                    const crystalMat = new THREE.MeshBasicMaterial({
                        color: new THREE.Color(data.color),
                        wireframe: false
                    });
                    sunCoreMesh = new THREE.Mesh(crystalGeo, crystalMat);
                    scene.add(sunCoreMesh);

                    // Dual Energy Spinning Torus Rings
                    const ring1Geo = new THREE.TorusGeometry(data.size * 1.5, 0.6, 16, 100);
                    const ring1Mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
                    sunRingMesh1 = new THREE.Mesh(ring1Geo, ring1Mat);
                    scene.add(sunRingMesh1);

                    const ring2Geo = new THREE.TorusGeometry(data.size * 1.8, 0.4, 16, 100);
                    const ring2Mat = new THREE.MeshBasicMaterial({ color: 0xffea00, wireframe: true });
                    sunRingMesh2 = new THREE.Mesh(ring2Geo, ring2Mat);
                    sunRingMesh2.rotation.x = Math.PI / 3;
                    scene.add(sunRingMesh2);

                    planetObjects['sun'] = { mesh: sunCoreMesh, data, angle: 0 };
                    return;
                }

                // Planet Orbit Pivot
                const orbitPivot = new THREE.Group();
                scene.add(orbitPivot);

                const planetGroup = new THREE.Group();
                orbitPivot.add(planetGroup);

                // FLOWING PARTICLE RIBBON ORBIT LINE
                const particleCount = 600;
                const orbitParticleGeo = new THREE.BufferGeometry();
                const orbitPos = new Float32Array(particleCount * 3);
                const orbitColors = new Float32Array(particleCount * 3);

                const orbitColor = new THREE.Color(data.color);

                for (let i = 0; i < particleCount; i++) {
                    const theta = (i / particleCount) * Math.PI * 2;
                    orbitPos[i * 3] = Math.cos(theta) * data.distance;
                    orbitPos[i * 3 + 1] = (Math.random() - 0.5) * 0.8;
                    orbitPos[i * 3 + 2] = Math.sin(theta) * data.distance;

                    orbitColors[i * 3] = orbitColor.r;
                    orbitColors[i * 3 + 1] = orbitColor.g;
                    orbitColors[i * 3 + 2] = orbitColor.b;
                }

                orbitParticleGeo.setAttribute('position', new THREE.BufferAttribute(orbitPos, 3));
                orbitParticleGeo.setAttribute('color', new THREE.BufferAttribute(orbitColors, 3));

                const orbitParticleMat = new THREE.PointsMaterial({
                    size: 1.4,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.75,
                    blending: THREE.AdditiveBlending
                });

                const orbitParticleSystem = new THREE.Points(orbitParticleGeo, orbitParticleMat);
                scene.add(orbitParticleSystem);
                orbitParticleSystems.push(orbitParticleSystem);

                // Planet Mesh
                const texture = createFantasyTexture(data.color, '#ffffff');
                const planetGeo = new THREE.SphereGeometry(data.size, 32, 32);
                const planetMat = new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.3,
                    metalness: 0.2,
                    emissive: new THREE.Color(data.color),
                    emissiveIntensity: 0.2
                });

                const planetMesh = new THREE.Mesh(planetGeo, planetMat);
                planetGroup.add(planetMesh);

                // Wireframe Energy Shield Grid Around Planet
                const shieldGeo = new THREE.IcosahedronGeometry(data.size * 1.15, 2);
                const shieldMat = new THREE.MeshBasicMaterial({
                    color: new THREE.Color(data.color),
                    wireframe: true,
                    transparent: true,
                    opacity: 0.35
                });
                const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
                planetMesh.add(shieldMesh);

                // Planetary Rings (Saturn & Uranus)
                if (data.hasRings) {
                    const ringGeo = new THREE.RingGeometry(data.size * 1.4, data.size * 2.4, 64);
                    const ringMat = new THREE.MeshBasicMaterial({
                        color: new THREE.Color(data.color),
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.75,
                        wireframe: true
                    });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.rotation.x = Math.PI / 2;
                    planetMesh.add(ringMesh);
                }

                // Moon System for Earth (Gaia Prime)
                if (data.hasMoon) {
                    const moonPivot = new THREE.Group();
                    planetGroup.add(moonPivot);

                    const moonGeo = new THREE.SphereGeometry(1.0, 16, 16);
                    const moonMat = new THREE.MeshStandardMaterial({
                        color: 0x00f0ff,
                        emissive: 0x00f0ff,
                        emissiveIntensity: 0.5
                    });
                    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
                    moonMesh.position.set(data.size * 2.2, 0, 0);
                    moonPivot.add(moonMesh);

                    planetObjects['moon'] = { pivot: moonPivot, angle: 0 };
                }

                const startAngle = Math.random() * Math.PI * 2;

                planetObjects[data.id] = {
                    mesh: planetMesh,
                    group: planetGroup,
                    pivot: orbitPivot,
                    data,
                    angle: startAngle
                };
            });
        }

        /**
         * ----------------------------------------------------
         * 5. ANIMATION & INTERACTIVE FX
         * ----------------------------------------------------
         */
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            const timeScale = state.isPlaying ? 1 : 0;

            // Spin Sun Crystal Core & Energy Rings
            if (sunCoreMesh) {
                sunCoreMesh.rotation.y += delta * 0.5;
                sunCoreMesh.rotation.x += delta * 0.3;
            }
            if (sunRingMesh1) sunRingMesh1.rotation.z += delta * 0.4;
            if (sunRingMesh2) sunRingMesh2.rotation.y -= delta * 0.6;

            // Animate Orbit Particle Rivers (Flowing Particles)
            orbitParticleSystems.forEach(sys => {
                if (state.isPlaying) sys.rotation.y += delta * 0.05;
            });

            // Animate Planets Orbits & Rotations
            FANTASY_PLANETS.forEach(data => {
                if (data.id === 'sun') return;
                const obj = planetObjects[data.id];
                if (!obj) return;

                if (state.isPlaying) {
                    obj.angle += (data.speed * 0.06) * delta;
                }

                obj.group.position.x = Math.cos(obj.angle) * data.distance;
                obj.group.position.z = Math.sin(obj.angle) * data.distance;

                if (state.isPlaying) {
                    obj.mesh.rotation.y += delta * 0.8;
                }
            });

            // Animate Moon around Gaia
            if (planetObjects['moon'] && state.isPlaying) {
                planetObjects['moon'].angle += delta * 2.0;
                planetObjects['moon'].pivot.rotation.y = planetObjects['moon'].angle;
            }

            // Camera Tracking
            if (state.cameraFollowMode && state.targetFocusMesh) {
                const targetWorldPos = new THREE.Vector3();
                state.targetFocusMesh.getWorldPosition(targetWorldPos);
                controls.target.lerp(targetWorldPos, 0.08);
            }

            // Warp Speed Effect Animation
            if (state.isWarpSpeed && starPoints) {
                starPoints.rotation.y += delta * 1.5;
            }

            controls.update();
            composer.render();
        }

        // TRIGGER EXPANDING GRAVITY RIPPLE ON CLICK
        function onSceneClick(event) {
            // Ignore click if on HUD controls
            if (event.target.closest('.interactive')) return;

            const ringGeo = new THREE.RingGeometry(0.1, 1.0, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color(THEMES[currentThemeIndex].accent),
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 1.0
            });
            const rippleMesh = new THREE.Mesh(ringGeo, ringMat);

            // Vector raycasting to mouse 3D position
            const mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const targetPos = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, targetPos);

            rippleMesh.position.copy(targetPos);
            rippleMesh.rotation.x = Math.PI / 2;
            scene.add(rippleMesh);

            // GSAP Expand & Fade Ripple
            gsap.to(rippleMesh.scale, { x: 45, y: 45, z: 45, duration: 1.2, ease: 'power2.out' });
            gsap.to(ringMat, {
                opacity: 0,
                duration: 1.2,
                ease: 'power2.out',
                onComplete: () => scene.remove(rippleMesh)
            });
        }

        // COSMIC BURST SUPERNOVA SHOCKWAVE
        function triggerCosmicBurst() {
            const burstGeo = new THREE.RingGeometry(1, 3, 64);
            const burstMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color(THEMES[currentThemeIndex].primary),
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 1.0
            });
            const burstMesh = new THREE.Mesh(burstGeo, burstMat);
            burstMesh.rotation.x = Math.PI / 2;
            scene.add(burstMesh);

            gsap.to(burstMesh.scale, { x: 120, y: 120, z: 120, duration: 2.0, ease: 'power3.out' });
            gsap.to(burstMat, {
                opacity: 0,
                duration: 2.0,
                ease: 'power3.out',
                onComplete: () => scene.remove(burstMesh)
            });
        }

        /**
         * ----------------------------------------------------
         * 6. UI CONTROLS & THEME SWITCHER
         * ----------------------------------------------------
         */
        function initUI() {
            const navContainer = document.getElementById('planet-nav');
            FANTASY_PLANETS.forEach(data => {
                const card = document.createElement('div');
                card.className = `nav-card ${data.id === 'earth' ? 'active' : ''}`;
                card.dataset.id = data.id;
                card.innerHTML = `
                    <div class="planet-icon-dot" style="background-color: ${data.color};"></div>
                    <span>${data.nameCN}</span>
                `;
                card.addEventListener('click', () => selectPlanet(data.id));
                navContainer.appendChild(card);
            });

            // Warp Speed Mode Toggle
            const btnWarp = document.getElementById('btn-warp');
            btnWarp.addEventListener('click', () => {
                state.isWarpSpeed = !state.isWarpSpeed;
                btnWarp.classList.toggle('warp-active', state.isWarpSpeed);
                if (state.isWarpSpeed) {
                    gsap.to(starPoints.scale, { x: 3, y: 0.1, z: 3, duration: 1 });
                    document.getElementById('status-text').innerText = '⚡ 曲速穿梭加速中！';
                } else {
                    gsap.to(starPoints.scale, { x: 1, y: 1, z: 1, duration: 1 });
                    document.getElementById('status-text').innerText = '赛博霓光天体系统运行中 (点击空间激发重力波)';
                }
            });

            // Cosmic Burst
            document.getElementById('btn-burst').addEventListener('click', triggerCosmicBurst);

            // Theme Switcher
            document.getElementById('btn-theme').addEventListener('click', () => {
                currentThemeIndex = (currentThemeIndex + 1) % THEMES.length;
                const theme = THEMES[currentThemeIndex];

                scene.fog.color.setHex(theme.bg);
                renderer.setClearColor(theme.bg);
                bloomPass.strength = theme.bloomStrength;

                if (planetObjects['coreLight']) {
                    planetObjects['coreLight'].color.set(theme.primary);
                }

                document.getElementById('status-text').innerText = `已切换艺术主题：${theme.name}`;
            });

            // Play / Pause
            const btnPlay = document.getElementById('btn-toggle-play');
            btnPlay.addEventListener('click', () => {
                state.isPlaying = !state.isPlaying;
                btnPlay.classList.toggle('active', state.isPlaying);
            });

            // Reset View
            document.getElementById('btn-reset-cam').addEventListener('click', resetCamera);

            // Lock Target
            document.getElementById('btn-focus-target').addEventListener('click', () => {
                if (state.selectedPlanetId) focusCameraOnPlanet(state.selectedPlanetId, true);
            });

            // Close Drawer
            document.getElementById('btn-close-info').addEventListener('click', () => {
                document.getElementById('info-panel').classList.remove('active');
            });

            selectPlanet('earth');
        }

        function selectPlanet(id) {
            state.selectedPlanetId = id;
            document.querySelectorAll('.nav-card').forEach(card => card.classList.toggle('active', card.dataset.id === id));

            const data = FANTASY_PLANETS.find(p => p.id === id);
            if (!data) return;

            document.getElementById('p-title-cn').innerText = data.nameCN;
            document.getElementById('p-title-en').innerText = data.nameEN;
            document.getElementById('p-desc').innerText = data.desc;
            document.getElementById('info-panel').classList.add('active');

            focusCameraOnPlanet(id, false);
        }

        function focusCameraOnPlanet(id, enableLockFollow = false) {
            const obj = planetObjects[id];
            if (!obj) return;

            state.targetFocusMesh = obj.mesh;
            state.cameraFollowMode = enableLockFollow;

            const targetWorldPos = new THREE.Vector3();
            obj.mesh.getWorldPosition(targetWorldPos);

            const camDistance = id === 'sun' ? 60 : obj.data.size * 4 + 14;
            const targetCamPos = new THREE.Vector3()
                .copy(targetWorldPos)
                .add(new THREE.Vector3(camDistance * 0.8, camDistance * 0.5, camDistance));

            gsap.to(camera.position, {
                x: targetCamPos.x, y: targetCamPos.y, z: targetCamPos.z,
                duration: 1.8, ease: 'power2.out'
            });

            gsap.to(controls.target, {
                x: targetWorldPos.x, y: targetWorldPos.y, z: targetWorldPos.z,
                duration: 1.8, ease: 'power2.out'
            });
        }

        function resetCamera() {
            state.cameraFollowMode = false;
            state.targetFocusMesh = null;

            gsap.to(camera.position, { x: 0, y: 110, z: 230, duration: 1.5, ease: 'power2.inOut' });
            gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1.5, ease: 'power2.inOut' });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initEngine();
            initUI();
            animate();
        });
    </script>
</body>
