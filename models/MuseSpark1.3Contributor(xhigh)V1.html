function norm360(x){x%=360;return x<0?x+360:x;}
function kepler(Mdeg,e){let M=Mdeg*DEG;let E=e<0.8?M:Math.PI;for(let i=0;i<8;i++){E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));}return E;}
// JPL 近似： perifocal -> 黄道直角坐标（AU）
function helioAU(key,jd){
  const el=ELE[key],T=(jd-J2000)/36525;
  const a=el.a+el.da*T,e=el.e+el.de*T,I=(el.I+el.dI*T)*DEG;
  const L=norm360(el.L+el.dL*T),lp=norm360(el.lp+el.dlp*T),nd=norm360(el.nd+el.dnd*T);
  const w=(lp-nd)*DEG,O=nd*DEG;
  const E=kepler(norm360(L-lp),e);
  const xp=a*(Math.cos(E)-e),yp=a*Math.sqrt(Math.max(0,1-e*e))*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),cI=Math.cos(I),sI=Math.sin(I);
  return new THREE.Vector3(
    (cO*cw-sO*sw*cI)*xp+(-cO*sw-sO*cw*cI)*yp,
    (sO*cw+cO*sw*cI)*xp+(-sO*sw+cO*cw*cI)*yp,
    (sw*sI)*xp+(cw*sI)*yp);
}

}

        return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      void main(){
        vec3 g1=normalize(vec3(0.4,1.0,0.25));vec3 g2=normalize(vec3(-0.5,-0.8,-0.35));
        float band=exp(-pow(dot(vP,g1)*3.4,2.0))*0.75+exp(-pow(dot(vP,g2)*4.2,2.0))*0.4;
        vec2 sp=vec2(atan(vP.z,vP.x)*3.0,vP.y*7.0);
        float n=vn(sp)*0.55+vn(sp*2.3+5.0)*0.3+vn(sp*5.1+11.0)*0.15;
        float dust=1.0-smoothstep(0.35,0.85,vn(sp*0.8+7.0));
        vec3 col=(vec3(0.45,0.55,0.9)*0.55+vec3(0.9,0.7,0.55)*0.25)*band*(0.3+0.7*n)*dust;
        gl_FragColor=vec4(col*0.55,1.0);}`});
  scene.add(new THREE.Mesh(bg,bm));
}

/* ============ GLSL 噪声（真二维晶格 value noise + FBM） ============ */
const NOISE=`
float shash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float svnoise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);vec2 u=f*f*(3.0-2.0*f);
  float a=shash(i);float b=shash(i+vec2(1.0,0.0));float c=shash(i+vec2(0.0,1.0));float d=shash(i+vec2(1.0,1.0));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
float sfbm(vec2 p){float v=0.0;float a=0.5;for(int i=0;i<5;i++){v+=a*svnoise(p);p=p*2.03+vec2(19.7,7.3);a*=0.5;}return v;}
float sfbm3(vec2 p){float v=0.0;float a=0.5;for(int i=0;i<3;i++){v+=a*svnoise(p);p=p*2.11+vec2(13.1,5.7);a*=0.5;}return v;}
`;

/* ============ 行星着色器（uType 分支） ============ */
const planetVert=`
varying vec3 vN;varying vec3 vW;varying vec3 vO;
void main(){
  vO=normalize(position);
  vN=normalize(mat3(modelMatrix)*normal);
  vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;
  gl_Position=projectionMatrix*viewMatrix*w;
}`;
const planetFrag=`
precision highp float;
varying vec3 vN;varying vec3 vW;varying vec3 vO;
uniform vec3 uSunPos;uniform vec3 uCamPos;uniform float uType;uniform float uTime;uniform float uSeed;
uniform float uBright;
${NOISE}
void main(){
  vec3 N=normalize(vN);
  vec3 L=normalize(uSunPos-vW);
  vec3 V=normalize(uCamPos-vW);
  vec3 o=normalize(vO);            // 原始单位球坐标：纬度/经度只从它取
  float lat=o.y;
  float lon=atan(o.z,o.x);
  float dayMix=smoothstep(-0.08,0.25,dot(N,L));
  vec2 suv=vec2(lon*2.2+uSeed,lat*3.0-uSeed);
  float t=uTime;
  vec3 base=vec3(0.5);
  float rough=0.85;float spec=0.0;vec3 emis=vec3(0.0);

  if(uType<0.5){
    // 太阳：米粒组织 + 边缘昏暗
    float g=sfbm(vec2(lon*9.0+t*0.25,lat*9.0)+uSeed)+0.5*sfbm(vec2(lon*28.0-t*0.4,lat*28.0));
    base=mix(vec3(1.0,0.42,0.08),vec3(1.0,0.85,0.45),smoothstep(0.25,0.95,g));
    float limb=clamp(dot(N,V),0.0,1.0);
    base*=0.55+0.45*pow(limb,0.55);
    emis=base*1.8*uBright;
    gl_FragColor=vec4(emis,1.0);return;
  } else if(uType<1.5){
    // 水星：灰 + 撞击坑
    float m=sfbm(suv*5.0);
    float cr=sfbm3(vec2(lon*40.0,lat*40.0)+uSeed);
    cr=smoothstep(0.62,0.72,cr)*0.55;
    base=mix(vec3(0.23,0.21,0.20),vec3(0.55,0.52,0.49),m)-cr;
  } else if(uType<2.5){
    // 金星：奶黄硫酸云
    float sw=sfbm(vec2(lon*3.0+t*0.02,lat*6.0)+uSeed);
    float sw2=sfbm(vec2(lon*7.0-t*0.03,lat*12.0)-uSeed);
    base=mix(vec3(0.75,0.62,0.42),vec3(0.98,0.90,0.72),sw*0.65+sw2*0.35);
    float chev=sfbm(vec2(lon*2.0,lat*3.0)+t*0.01);
    base=mix(base,vec3(0.85,0.66,0.40),smoothstep(0.55,0.9,chev)*0.35);
    rough=0.6;
  } else if(uType<3.5){
    // 地球：海陆 + 冰盖 + 夜灯 + 云
    float cont=sfbm(suv*3.2);
    float detail=sfbm(suv*9.0+3.7);
    float landM=smoothstep(0.52,0.56,cont+ (detail-0.5)*0.18);
    vec3 ocean=mix(vec3(0.015,0.10,0.30),vec3(0.02,0.22,0.45),detail);
    vec3 land=mix(vec3(0.10,0.28,0.06),vec3(0.45,0.36,0.18),smoothstep(0.3,0.8,sfbm(suv*6.0+11.0)));
    float ice=smoothstep(0.72,0.82,abs(lat)+(detail-0.5)*0.12);
    base=mix(mix(ocean,land,landM),vec3(0.92,0.94,0.97),ice);
    float cl=sfbm(vec2(lon*4.0+t*0.03,lat*7.0-t*0.008)+uSeed*2.0);
    float clouds=smoothstep(0.52,0.78,cl);
    base=mix(base,vec3(1.0),clouds*0.85*dayMix);
    // 夜灯
    float nightM=1.0-dayMix;
    float cities=step(0.985,shash(floor(suv*vec2(220.0,160.0))))*landM*(1.0-ice)*(1.0-clouds);
    emis=vec3(1.0,0.75,0.42)*cities*nightM*2.2;
    // 海洋镜反
    vec3 R=reflect(-L,N);
    float oceanM=(1.0-landM)*(1.0-ice);
    spec=pow(max(dot(R,V),0.0),42.0)*oceanM*dayMix*0.9;
  } else if(uType<4.5){
    // 火星
    float d=sfbm(suv*4.0);
    base=mix(vec3(0.45,0.18,0.08),vec3(0.78,0.42,0.22),d);
    float maria=smoothstep(0.55,0.8,sfbm(suv*2.2+5.0));
    base=mix(base,vec3(0.30,0.14,0.10),maria*0.45);
    float cap=smoothstep(0.86,0.92,abs(lat)+(sfbm(suv*8.0)-0.5)*0.06);
    base=mix(base,vec3(0.95,0.95,0.97),cap);
    float dust=smoothstep(0.6,0.95,sfbm(vec2(lon*3.0+t*0.05,lat*5.0)));
    base=mix(base,vec3(0.82,0.55,0.35),dust*0.25);
  } else if(uType<5.5){
    // 木星：急流条带 + 大红斑
    float yy=lat*9.0+ (sfbm(vec2(lon*2.0,lat*4.0)+uSeed)-0.5)*2.6;
    float band=0.5+0.5*sin(yy*2.6+t*0.01);
    float turb=sfbm(vec2(lon*6.0+t*0.02,lat*14.0));
    band=0.5+0.5*sin(yy*2.6+turb*4.0);
    base=mix(vec3(0.72,0.55,0.38),vec3(0.92,0.82,0.66),band);
    base=mix(base,vec3(0.62,0.34,0.22),smoothstep(0.4,0.75,sfbm(vec2(lon*3.0,lat*10.0)+4.0))*0.5);
    // 大红斑
    float grsLon=1.2+t*0.008;
    float dLon=mod(lon-grsLon+3.14159265,6.2831853)-3.14159265;
    vec2 q=vec2(dLon*2.4,(lat+0.38)*7.5);
    float grs=smoothstep(1.0,0.55,length(q)+ (turb-0.5)*0.35);
    base=mix(base,vec3(0.78,0.28,0.16),grs*0.9);
    base=mix(base,vec3(0.95,0.75,0.6),smoothstep(0.7,1.0,grs)*0.35);
  } else if(uType<6.5){
    // 土星：柔和金色带
    float yy=lat*7.0+(sfbm(vec2(lon*2.0,lat*5.0)+uSeed)-0.5)*1.8;
    float band=0.5+0.5*sin(yy*2.2);
    base=mix(vec3(0.72,0.62,0.44),vec3(0.90,0.80,0.60),band);
    base=mix(base,vec3(0.55,0.45,0.32),smoothstep(0.5,1.0,abs(lat))*0.4);
  } else if(uType<7.5){
    // 天王星：淡青，极微条带
    float b=sfbm(suv*3.0);
    base=mix(vec3(0.55,0.80,0.83),vec3(0.70,0.90,0.90),b);
    base=mix(base,vec3(0.62,0.85,0.86),smoothstep(0.3,0.9,abs(lat))*0.3);
  } else if(uType<8.5){
    // 海王星：深蓝 + 风暴纹
    float b=sfbm(vec2(lon*4.0+t*0.03,lat*8.0)+uSeed);
    base=mix(vec3(0.10,0.22,0.62),vec3(0.25,0.45,0.90),b);
    float streak=smoothstep(0.6,0.95,sfbm(vec2(lon*9.0-t*0.05,lat*22.0)));
    base=mix(base,vec3(0.75,0.85,1.0),streak*0.35);
    vec2 qq=vec2((lon-2.0)*3.0,(lat-0.3)*9.0);
    float dsp=smoothstep(1.0,0.5,length(qq));
    base=mix(base,vec3(0.05,0.10,0.35),dsp*0.7);
  } else if(uType<9.5){
    // 冥王星
    float m=sfbm(suv*4.5);
    base=mix(vec3(0.45,0.36,0.28),vec3(0.75,0.66,0.52),m);
    float nitro=smoothstep(0.3,0.7,sfbm(suv*2.0+9.0));
    base=mix(base,vec3(0.88,0.86,0.80),nitro*0.5);
  } else if(uType<10.5){
    // 月球/灰岩
    float m=sfbm(suv*6.0);
    float cr=sfbm3(vec2(lon*46.0,lat*46.0)+uSeed);
    cr=smoothstep(0.60,0.72,cr)*0.5;
    base=mix(vec3(0.30,0.30,0.32),vec3(0.62,0.62,0.64),m)-cr;
  } else if(uType<11.5){
    // 木卫一：硫磺黄 + 火山斑
    float m=sfbm(suv*7.0);
    base=mix(vec3(0.85,0.75,0.35),vec3(0.95,0.90,0.60),m);
    float volc=step(0.93,shash(floor(suv*90.0)));
    base=mix(base,vec3(0.25,0.10,0.05),volc*0.8);
  } else if(uType<12.5){
    // 木卫二：冰裂纹
    float m=sfbm(suv*5.0);
    base=mix(vec3(0.70,0.72,0.70),vec3(0.90,0.88,0.84),m);
    float crack=smoothstep(0.48,0.5,abs(sfbm(suv*9.0)-0.5));
    base=mix(base,vec3(0.55,0.30,0.22),(1.0-crack)*0.55);
  } else if(uType<13.5){
    // 土卫六：橙霾
    float m=sfbm(vec2(lon*3.0,lat*5.0)+uSeed);
    base=mix(vec3(0.75,0.52,0.20),vec3(0.90,0.70,0.35),m);
    rough=0.55;
  } else {
    // 海卫一：粉白氮霜
    float m=sfbm(suv*5.0);
    base=mix(vec3(0.72,0.68,0.70),vec3(0.92,0.90,0.90),m);
  }

  float dif=max(dot(N,L),0.0);
  float amb=0.035;
  float wrap=pow(clamp((dot(N,L)+0.6)/1.6,0.0,1.0),1.4);
  vec3 col=base*(amb+dif*1.0+wrap*0.10);
  // 高光
  vec3 R2=reflect(-L,N);
  col+=vec3(1.0,0.97,0.9)*pow(max(dot(R2,V),0.0),36.0)*spec;
  // 晨昏线暖调
  float term=exp(-pow((dot(N,L))*5.0,2.0));
  col+=base*term*vec3(0.35,0.18,0.08);
  col+=emis;
  // 大气边缘微亮（行星本体）
  float rim=pow(1.0-abs(dot(N,V)),2.5);
  col+=vec3(0.25,0.4,0.7)*rim*0.12*dayMix;
  gl_FragColor=vec4(col*uBright,1.0);
}`;

function planetMaterial(type,seed){
  return new THREE.ShaderMaterial({vertexShader:planetVert,fragmentShader:planetFrag,
    uniforms:{uSunPos:{value:new THREE.Vector3()},uCamPos:{value:new THREE.Vector3()},
      uType:{value:type},uTime:{value:Math.random()*10},uSeed:{value:seed},uBright:{value:1.0}}});
}

/* ============ 光环（径向坐标用局部 vLocalPos.xz，真半径） ============ */
function addRing(key,innerMult,outerMult,opacity,colA,colB,cassini){
  const b=bodies[key];if(!b)return null;
  if(b.ring){b.tiltGroup.remove(b.ring);b.ring.geometry.dispose();b.ring.material.dispose();}
  const R=b.r;
  const geo=new THREE.RingGeometry(R*innerMult,R*outerMult,180,1);
  geo.rotateX(-Math.PI/2);
  const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,
    vertexShader:`varying vec3 vL;varying vec3 vW;
      void main(){vL=position;vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;
      gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader:`varying vec3 vL;varying vec3 vW;
      uniform vec3 uSun;uniform float uIn;uniform float uOut;uniform float uR;uniform float uOp;
      uniform vec3 uA;uniform vec3 uB;uniform float uTime;uniform vec3 uSunL;
      ${NOISE}
      void main(){
        float r=length(vL.xz);
        float u=(r-uIn)/(uOut-uIn);
        if(u<0.0||u>1.0) discard;
        float bands=sfbm(vec2(u*46.0,uTime*0.0)+3.0);
        vec3 col=mix(uA,uB,bands);
        float a=0.35+0.65*bands;
        // 卡西尼缝
        float gap=1.0-smoothstep(0.025,0.055,abs(u-${cassini.toFixed(2)}));
        a*=1.0-gap*0.9;
        // 内缘渐隐 + 外缘渐隐
        a*=smoothstep(0.0,0.06,u)*smoothstep(1.0,0.86,u);
        // 行星柱影
        vec3 sd=normalize(uSunL);
        float facing=dot(normalize(vec3(vL.x)),sd);
        vec3 rel=vL-dot(vL,sd)*sd;
        float sh=smoothstep(uR*1.25,uR*0.75,length(rel));
        float inShadow=(dot(normalize(vL),sd)<0.0)?sh:0.0;
        col*=1.0-inShadow*0.85;
        gl_FragColor=vec4(col,a*uOp);
      }`,
    uniforms:{uSun:{value:new THREE.Vector3()},uIn:{value:R*innerMult},uOut:{value:R*outerMult},
      uR:{value:R},uOp:{value:opacity},uA:{value:new THREE.Color(colA)},uB:{value:new THREE.Color(colB)},
      uTime:{value:0},uSunL:{value:new THREE.Vector3(1,0,0)}}});
  const mesh=new THREE.Mesh(geo,mat);
  b.tiltGroup.add(mesh);b.ring=mesh;
  return mesh;
}

/* ============ 轨道线（真近点角 E 均匀采样，高偏心率不打折） ============ */
function orbitPoints(key){
  const el=ELE[key];if(!el)return [];
  const T=(JD-J2000)/36525;
  const a=el.a+el.da*T,e=el.e+el.de*T,I=(el.I+el.dI*T)*DEG;
  const L=norm360(el.L+el.dL*T),lp=norm360(el.lp+el.dlp*T),nd=norm360(el.nd+el.dnd*T);
  const w=(lp-nd)*DEG,O=nd*DEG;
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),cI=Math.cos(I),sI=Math.sin(I);
  const b=a*Math.sqrt(Math.max(0.0001,1-e*e));
  const pts=[];const N=(key==='halley'?720:360);
  for(let i=0;i<N;i++){
    const E=i/N*Math.PI*2;
    const xp=a*(Math.cos(E)-e),yp=b*Math.sin(E);
    const v=new THREE.Vector3(
      (cO*cw-sO*sw*cI)*xp+(-cO*sw-sO*cw*cI)*yp,
      (sO*cw+cO*sw*cI)*xp+(-sO*sw+cO*cw*cI)*yp,
      (sw*sI)*xp+(cw*sI)*yp);
    pts.push(toScene(v));
  }
  return pts;
}
let orbitLines=[];
function buildOrbits(){
  for(const l of orbitLines){orbitGroup.remove(l);l.geometry.dispose();l.material.dispose();}
  orbitLines=[];
  const keys=[...PKEYS,'halley'];
  for(const k of keys){
    const pts=orbitPoints(k);
    const g=new THREE.BufferGeometry().setFromPoints(pts);
    const isH=k==='halley';
    const m=new THREE.LineLoop(g,new THREE.LineBasicMaterial({color:isH?0x7ad8ff:0x4a5f9a,

}

/* ============ 小行星带 + 柯伊伯带（GPU 差分开普勒） ============ */
function beltMesh(count,rMin,rMax,tint,size){
  const a=new Float32Array(count),e=new Float32Array(count),M0=new Float32Array(count),
    incl=new Float32Array(count),node=new Float32Array(count),peri=new Float32Array(count);
  for(let i=0;i<count;i++){
    a[i]=rMin+Math.random()*(rMax-rMin);
    e[i]=Math.random()*0.12;M0[i]=Math.random()*360;
    incl[i]=(Math.random()-0.5)*(rMax>10?8:10);node[i]=Math.random()*360;peri[i]=Math.random()*360;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(count*3),3)); // 占位
  g.setAttribute('aA',new THREE.BufferAttribute(a,1));
  g.setAttribute('aE',new THREE.BufferAttribute(e,1));
  g.setAttribute('aM0',new THREE.BufferAttribute(M0,1));
  g.setAttribute('aI',new THREE.BufferAttribute(incl,1));
  g.setAttribute('aN',new THREE.BufferAttribute(node,1));
  g.setAttribute('aP',new THREE.BufferAttribute(peri,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
    uniforms:{uJD:{value:JD},uTrue:{value:0},uTint:{value:new THREE.Color(tint)},uPx:{value:size}},
    vertexShader:`attribute float aA;attribute float aE;attribute float aM0;attribute float aI;attribute float aN;attribute float aP;
      uniform float uJD;uniform float uTrue;uniform float uPx;
      varying float vB;
      void main(){
        float d=uJD-2451545.0;
        float n=0.98560736/pow(aA,1.5);
        float M=mod(aM0+n*d,360.0)*0.01745329252;
        float E=M+aE*sin(M);
        for(int i=0;i<3;i++){E=E-(E-aE*sin(E)-M)/(1.0-aE*cos(E));}
        float xp=aA*(cos(E)-aE);float yp=aA*sqrt(1.0-aE*aE)*sin(E);
        float w=aP*0.01745329252;float O=aN*0.01745329252;float I=aI*0.01745329252;
        float cw=cos(w),sw=sin(w),cO=cos(O),sO=sin(O),cI=cos(I),sI=sin(I);
        vec3 p=vec3((cO*cw-sO*sw*cI)*xp+(-cO*sw-sO*cw*cI)*yp,
                    (sO*cw+cO*sw*cI)*xp+(-sO*sw+cO*cw*cI)*yp,
                    (sw*sI)*xp+(cw*sI)*yp);
        float r=length(p);
        float R=(uTrue>0.5)? r*120.0 : 42.0*pow(r,0.56);
        vec3 sp=p*(R/max(r,1e-6));
        vB=0.4+0.6*fract(aM0*0.371);
        vec4 mv=modelViewMatrix*vec4(sp,1.0);
        gl_PointSize=uPx*180.0/max(1.0,-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`varying float vB;uniform vec3 uTint;
      void main(){vec2 q=gl_PointCoord-0.5;float dd=length(q);if(dd>0.5) discard;
        gl_FragColor=vec4(uTint*vB,vB);}`});
  const p=new THREE.Points(g,m);p.frustumCulled=false;scene.add(p);return p;
}
const belt1=beltMesh(3200,2.06,3.27,0xbfae90,1.6);

function makeTail(n,color,size,op){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
  const tt=new Float32Array(n);for(let i=0;i<n;i++)tt[i]=i/n;
  g.setAttribute('aT',new THREE.BufferAttribute(tt,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uC:{value:new THREE.Color(color)},uOp:{value:op},uPx:{value:size}},
    vertexShader:`attribute float aT;varying float vT;uniform float uPx;
      void main(){vT=aT;vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=uPx*(1.0-aT*0.8)*160.0/max(1.0,-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying float vT;uniform vec3 uC;uniform float uOp;
      void main(){vec2 q=gl_PointCoord-0.5;float d=length(q);if(d>0.5) discard;
      float a=(1.0-vT)*(1.0-vT)*smoothstep(0.5,0.1,d);gl_FragColor=vec4(uC*a*uOp,a*uOp);}`});
  const p=new THREE.Points(g,m);p.frustumCulled=false;cometGroup.add(p);return p;

/* ============ 位置更新 ============ */
const tmpV=new THREE.Vector3();
function updatePositions(){
  // 太阳
  bodies.sun.group.position.set(0,0,0);
  // 行星
  for(const k of PKEYS){
    const p=helioAU(k,JD);
    bodies[k].group.position.copy(toScene(p));
    bodies[k].auPos=p.clone();
  }
  // 地月（真实方向，视觉距离）
  {
    const d=JD-J2000;
    const Lp=norm360(218.3164477+13.17639648*d);
    const lpM=norm360(83.3532465+0.11140353*d);
    const Nd=norm360(125.122844+(-0.0529538083)*d);
    const eM=0.0549,IM=5.145*DEG;
    const M=norm360(Lp-lpM);
    const E=kepler(M,eM);
    const aM=0.002569; // AU
    const xp=aM*(Math.cos(E)-eM),yp=aM*Math.sqrt(1-eM*eM)*Math.sin(E);
    const w=(lpM-Nd)*DEG,O=Nd*DEG;
    const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),cI=Math.cos(IM),sI=Math.sin(IM);
    const rel=new THREE.Vector3(
      (cO*cw-sO*sw*cI)*xp+(-cO*sw-sO*cw*cI)*yp,
      (sO*cw+cO*sw*cI)*xp+(-sO*sw+cO*cw*cI)*yp,
      (sw*sI)*xp+(cw*sI)*yp);
    const dir=rel.clone().normalize();
    const dist=trueScale? rel.length()*TRUE_AU : bodies.earth.r*3.4;
    bodies.moon.group.position.copy(bodies.earth.group.position).addScaledVector(dir,dist);
  }
  // 其余卫星：圆轨道 + 方向真实
  for(const m of MOONS){
    if(m.k==='moon')continue;
    const par=bodies[m.p];if(!par)continue;
    const per=Math.abs(m.period);
    const ang=(m.ph*57.3+360/per*(JD-J2000))*DEG*(m.period<0?-1:1);
    const incl=(m.k==='triton'?157:8)*DEG;
    const dir=new THREE.Vector3(Math.cos(ang),0.12*Math.sin(ang*0.9),Math.sin(ang));
    dir.y+=Math.sin(ang)*Math.sin(incl)*0.4;dir.normalize();
    const dist=trueScale? par.r*3 : par.r*m.mult*0.62+par.r*0.9;
    bodies[m.k].group.position.copy(par.group.position).addScaledVector(dir,dist);
  }
  // 哈雷彗星
  {
    const p=helioAU('halley',JD);
    cometGroup.position.copy(toScene(p));
    const rAU=Math.max(0.2,p.length());
    const anti=p.clone().normalize(); // 背日方向
    const side=new THREE.Vector3(-anti.z,0.25,anti.x).normalize();
    const L1=trueScale? Math.min(60,Math.max(9,26/Math.max(0.4,rAU))):Math.min(30,Math.max(7,20/Math.max(0.5,rAU)));
    const L2=L1*0.55;
    const setTail=(pts,len,curve)=>{
      const pos=pts.geometry.attributes.position;
      for(let i=0;i<pos.count;i++){
        const t=i/(pos.count-1);
        tmpV.copy(cometGroup.position).addScaledVector(anti,t*len).addScaledVector(side,t*t*len*curve);
        tmpV.y+=t*len*0.06;
        pos.setXYZ(i,tmpV.x-cometGroup.position.x,tmpV.y-cometGroup.position.y,tmpV.z-cometGroup.position.z);
      }
      pos.needsUpdate=true;
    };
    setTail(ionTail,L1,0.04);setTail(dustTail,L2,0.30);
    const act=Math.min(1,2.2/(rAU*rAU)+0.15);
    ionTail.material.uniforms.uOp.value=0.85*act;
    dustTail.material.uniforms.uOp.value=0.6*act;
    cometHead.material.opacity=Math.min(1,0.45+act*0.6);
    const cs=trueScale?2.2:2.6+act*1.2;
    cometHead.scale.setScalar(cs);
  }
  // 太阳光位置 + corona 跟随
  sunLight.position.set(0,0,0);
  corona1.position.set(0,0,0);corona2.position.set(0,0,0);sunGlowFar.position.set(0,0,0);
  const camD=camera.position.length();
  // 大 billboard 进入覆盖圈时淡出，避免整屏染白
  const f1=THREE.MathUtils.smoothstep(camD,22*0.5,22*1.05);
  const f2=THREE.MathUtils.smoothstep(camD,38*0.5,38*1.05);
  corona1.material.opacity=0.95*f1;corona2.material.opacity=0.7*f2;
  sunGlowFar.material.opacity=trueScale?0.9:0.0;
  if(trueScale)sunGlowFar.scale.setScalar(26);
  // 每帧更新着色器 sun/camera
  const sunW=new THREE.Vector3(0,0,0);
  for(const k in bodies){
    const b=bodies[k];
    b.mat.uniforms.uSunPos.value.copy(sunW);
    b.mat.uniforms.uCamPos.value.copy(camera.position);
    b.mat.uniforms.uTime.value+=0.016*speedD*0.15+0.002;
    if(b.atmo){b.atmo.material.uniforms.uSun.value.copy(sunW);b.atmo.material.uniforms.uCam.value.copy(camera.position);}
    if(b.ring){
      b.ring.material.uniforms.uSun.value.copy(sunW);
      // 太阳方向转到环局部空间
      tmpV.copy(sunW).sub(b.group.position);
      b.tiltGroup.worldToLocal(tmpV);
      b.ring.material.uniforms.uSunL.value.copy(tmpV.normalize());
    }
  }
  // 自转
  const dtD=lastDt;
  for(const k of PKEYS){
    const b=bodies[k];const rotH=(INFO[k].rotH||24);
    b.spin+=2*Math.PI*(dtD*24/rotH);
    b.mesh.rotation.y=b.spin;
  }
  bodies.sun.mesh.rotation.y+=dtD*0.05;
  bodies.moon.mesh.rotation.y+=2*Math.PI*(dtD/27.32); // 潮汐锁定近似
}

let target=null,flyT=1,flyFrom=new THREE.Vector3(),flyTo=new THREE.Vector3(),lookFrom=new THREE.Vector3(),lookTo=new THREE.Vector3();
function focusDist(b){
  let r=b.r;
  if(b.ring&&b.key==='saturn')r=b.r*2.27;
  if(b.ring&&b.key!=='saturn')r=b.r*2.1;
  if(b.key==='sun')r=14;
  if(trueScale&&b.key==='sun')r=6;
  return Math.max(r*4.2,r+2.2);
}
function selectBody(key,instant){

  const side=new THREE.Vector3(-toSun.z,0,toSun.x);
  if(side.length()<0.1)side.set(1,0,0);side.normalize();
  const up=new THREE.Vector3(0,1,0);

  }
}

    camera.position.add(delta);controls.target.copy(bp);
  }
  if(!paused){const step=speedD*dt;JD+=step;simDays+=step;}
  lastDt=paused?0:speedD*dt;
  belt1.material.uniforms.uJD.value=JD;
  belt2.material.uniforms.uJD.value=JD;
  updatePositions();
  // 标签投影
  const w=innerWidth,h=innerHeight;

    if(!showLbl||(b.moon&&camera.position.distanceTo(b.group.position)>bodies[b.moon.p].r*30)){
      if(b.moon&&showLbl){/* 远距离隐藏小卫星 */}

    const behind=tmpV.z>1;
    const x=(tmpV.x*0.5+0.5)*w,y=(-tmpV.y*0.5+0.5)*h;
    const dist=camera.position.distanceTo(b.group.position);
    const hide=behind||!showLbl||x<-50||x>w+50||y<-30||y>h+30;
    if(b.moon&&dist>bodies[b.moon.p].r*40){el.style.display='none';continue;}
    if(k==='sun'&&trueScale){/* 保留 */}
    el.style.display=hide?'none':'block';

}
