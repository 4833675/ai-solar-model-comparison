const D2R=Math.PI/180, TAU=Math.PI*2;

function solveKepler(M,e){
  M=((M%TAU)+TAU)%TAU; if(M>Math.PI)M-=TAU;
  let E=e<0.8?M+e*Math.sin(M):Math.PI*(M<0?-1:1);
  for(let i=0;i<60;i++){
    const s=Math.sin(E),c=Math.cos(E);let d=(E-e*s-M)/(1-e*c);
    if(d>1)d=1;if(d<-1)d=-1;E-=d;if(Math.abs(d)<1e-13)break;
  }
  return E;
}
// 轨道平面 → 黄道坐标 (x,y,z) ; 角度均为弧度
function orbitXYZ(a,e,I,Om,w,E){
  const cx=a*(Math.cos(E)-e), cy=a*Math.sqrt(1-e*e)*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I),sI=Math.sin(I);
  return [(cw*cO-sw*sO*cI)*cx+(-sw*cO-cw*sO*cI)*cy,
          (cw*sO+sw*cO*cI)*cx+(-sw*sO+cw*cO*cI)*cy,
          (sw*sI)*cx+(cw*sI)*cy];
}
function eqToEcl(ra,dec){
  const a=ra*D2R,d=dec*D2R,x=Math.cos(d)*Math.cos(a),y=Math.cos(d)*Math.sin(a),z=Math.sin(d),e=23.4392911*D2R;
  return [x,y*Math.cos(e)+z*Math.sin(e),-y*Math.sin(e)+z*Math.cos(e)];
}
// 黄道坐标 (x,y,z) → three 坐标 (x,z,-y) : y 轴为黄道北极
const eclV=(ra,dec)=>{const v=eqToEcl(ra,dec);return new V3(v[0],v[2],-v[1]);};

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry(20261126);
const gauss=()=>{let u=0,v=0;while(!u)u=rng();v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);};

function planetElements(el,jd){
  const T=(jd-J2000)/36525;
  const [a0,ad,e0,ed,I0,Id,L0,Ld,p0,pd,N0,Nd]=el;
  const varpi=p0+pd*T, Omd=N0+Nd*T;
  return {a:a0+ad*T,e:e0+ed*T,I:(I0+Id*T)*D2R,Om:Omd*D2R,w:(varpi-Omd)*D2R,M:(L0+Ld*T-varpi)*D2R};
}
// 月球:平均根数(含近地点/升交点进动)+ 三个最大摄动项(出差、二均差、周年差)
function moonElements(jd){
  const T=(jd-J2000)/36525;
  const L=218.3164477+481267.88123421*T, varpi=83.3532465+4069.0137287*T, Om=125.0445479-1934.1362891*T;
  return {a:384400/AU_KM,e:0.0549,I:5.145*D2R,Om:Om*D2R,w:(varpi-Om)*D2R,M:(L-varpi)*D2R,
    Ms:(357.5291092+35999.0502909*T)*D2R,D:(297.8501921+445267.1114034*T)*D2R};
}
function moonOffsetEcl(el){
  const E=solveKepler(el.M,el.e), p=orbitXYZ(el.a,el.e,el.I,el.Om,el.w,E);
  const dl=(1.2739*Math.sin(2*el.D-el.M)+0.6583*Math.sin(2*el.D)-0.1858*Math.sin(el.Ms))*D2R;
  const c=Math.cos(dl),s=Math.sin(dl);
  return [p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]];
}

const float PI=3.14159265359;

vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){float a=0.5,s=0.0;for(int i=0;i<6;i++){s+=a*snoise(p);p=p*2.02+vec3(1.7,9.2,3.1);a*=0.5;}return s;}

float h31(vec3 p){p=fract(p*0.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
vec3 h33(vec3 p){p=fract(p*vec3(0.1031,0.1030,0.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}

const OCC_GLSL=`
uniform vec3 uSunRel; uniform float uSunR; uniform float uSunI; uniform vec3 uCamRel;
uniform vec4 uOcc[4]; uniform int uNOcc;
float circOv(float r1,float r2,float d){
  if(d>=r1+r2)return 0.0;
  if(d<=abs(r1-r2)){float m=min(r1,r2);return 3.14159265*m*m;}
  float a1=acos(clamp((d*d+r1*r1-r2*r2)/(2.0*d*r1),-1.0,1.0));
  float a2=acos(clamp((d*d+r2*r2-r1*r1)/(2.0*d*r2),-1.0,1.0));
  return r1*r1*a1+r2*r2*a2-0.5*sqrt(max((-d+r1+r2)*(d+r1-r2)*(d-r1+r2)*(d+r1+r2),0.0));
}
float sunVis(vec3 P){
  vec3 ds=uSunRel-P; float dS=length(ds); vec3 dir=ds/dS;
  float rs=asin(clamp(uSunR/dS,0.0,1.0));
  float vis=1.0;
  for(int i=0;i<4;i++){
    if(i>=uNOcc)break;
    vec3 oc=uOcc[i].xyz-P; float dO=length(oc);
    if(dO<=uOcc[i].w||dot(oc,dir)<=0.0||dO>dS)continue;
    float ro=asin(clamp(uOcc[i].w/dO,0.0,1.0));
    vec3 ou=oc/dO;
    float th=atan(length(cross(ou,dir)),dot(ou,dir));
    float cover=circOv(rs,ro,th)/(3.14159265*rs*rs);
    vis*=1.0-clamp(cover,0.0,1.0);
  }
  return vis;
}`;
const PLANET_FS=`
#include <common>
#include <logdepthbuf_pars_fragment>
uniform sampler2D uMap; uniform sampler2D uAux; uniform sampler2D uRingTex;
uniform vec3 uAtmo; uniform float uBump,uCloudShift,uAmbient,uAtmoK,uLimb,uTint;
uniform mat3 uToLocal; uniform vec2 uRing;
varying vec3 vP; varying vec3 vN; varying vec2 vUv;
${OCC_GLSL}
vec3 bumpN(vec3 N,vec3 P,float h){
  vec3 dpdx=dFdx(P),dpdy=dFdy(P);
  float dhx=dFdx(h),dhy=dFdy(h);
  vec3 r1=cross(dpdy,N),r2=cross(N,dpdx);
  float det=dot(dpdx,r1);
  vec3 grad=sign(det)*(dhx*r1+dhy*r2);
  return normalize(abs(det)*N-grad);
}
void main(){
  #include <logdepthbuf_fragment>
  vec3 P=vP; vec3 N=normalize(vN);
  vec3 L=normalize(uSunRel-P); vec3 V=normalize(uCamRel-P);
  vec4 aux=texture2D(uAux,vUv);
  vec3 alb=pow(texture2D(uMap,vUv).rgb,vec3(2.2));
  vec3 Nb=N;
  if(uBump>0.0)Nb=bumpN(N,P,aux.a*uBump);
  float vis=sunVis(P);
  float nl=dot(Nb,L); float ngl=dot(N,L);
  float ndv=max(dot(N,V),0.0);
  float cloud=0.0;
  #ifdef EARTH
    cloud=texture2D(uAux,vUv+vec2(uCloudShift,0.0)).g;
    alb=mix(alb,vec3(0.90),cloud*0.93);
    Nb=normalize(mix(Nb,N,cloud));
    nl=dot(Nb,L);
  #endif
  float diff;
  #ifdef AIRLESS
    float c=max(nl,0.0);
    diff=1.8*c/(c+max(dot(Nb,V),0.0)+0.02);
  #elif defined(WRAP)
    diff=clamp((nl+0.10)/1.10,0.0,1.0);
  #else
    diff=max(nl,0.0);
  #endif
  diff*=smoothstep(-0.03,0.08,ngl);
  #ifdef RING_SHADOW
    {
      vec3 Pl=uToLocal*P; vec3 Ll=uToLocal*L;
      if(abs(Ll.y)>1e-4){
        float t=-Pl.y/Ll.y;
        if(t>0.0){
          vec3 hh=Pl+t*Ll; float rr=length(hh.xz);
          if(rr>uRing.x&&rr<uRing.y){
            float u=(rr-uRing.x)/(uRing.y-uRing.x);
            vis*=1.0-0.97*texture2D(uRingTex,vec2(u,0.5)).a;
          }
        }
      }
    }
  #endif
  vec3 sunCol=vec3(1.0,0.97,0.92)*uSunI;
  vec3 lit=sunCol*(vis+(1.0-vis)*uTint*vec3(0.55,0.16,0.05)*0.10);
  vec3 col=alb*(diff*lit+uAmbient);
  #ifdef EARTH
    float water=aux.b*(1.0-cloud);
    vec3 H=normalize(L+V);
    float spec=pow(max(dot(N,H),0.0),260.0)*water*vis*step(0.0,ngl)*0.55;
    col+=sunCol*spec*vec3(1.0,0.95,0.85);
    float night=1.0-smoothstep(-0.12,0.10,ngl);
    col+=vec3(1.0,0.72,0.38)*aux.r*night*(1.0-cloud*0.85)*1.5;
  #endif
  float rim=pow(1.0-ndv,3.0);
  float sf=smoothstep(-0.25,0.5,ngl);
  col+=uAtmo*rim*sf*uAtmoK*uSunI*vis;
  col+=vec3(1.0,0.38,0.12)*rim*exp(-pow(ngl/0.16,2.0))*uAtmoK*0.55*uSunI*step(0.001,uAtmoK);
  col*=mix(1.0,pow(max(ndv,0.02),0.4),uLimb);
  gl_FragColor=vec4(col,1.0);
}`;

  const k=state.k;

  for(const b of bodies){

    if(b.kind==='comet')b.rr=b.R*Math.max(k,1)/AU_KM;
  }
  const p=1/(1+0.18*Math.log(Math.max(k,1)));
  for(const m of moonsAll){
    const par=m.parentB, a=m.a||384400;
    const rho=a/par.R;

  }
}

function fillOrbit(line,el,mode,tq){
  const n=line.N,pa=line.geometry.attributes.position,ph=line.geometry.attributes.ph;
  for(let i=0;i<=n;i++){
    const E=i/n*TAU;let x,y,z;
    if(mode==='ecl'){const p=orbitXYZ(el.a,el.e,el.I,el.Om,el.w,E);x=p[0];y=p[2];z=-p[1];}
    else{x=el.a*(Math.cos(E)-el.e);y=0;z=-el.a*Math.sqrt(1-el.e*el.e)*Math.sin(E);
      if(tq){const v=new V3(x,y,z).applyQuaternion(tq);x=v.x;y=v.y;z=v.z;}}
    pa.setXYZ(i,x,y,z);ph.setX(i,(E-el.e*Math.sin(E))/TAU);
  }

}

/* ---------- 小行星带 / 特洛伊 / 柯伊伯带 ---------- */
const astUniforms={uT:{value:0},uPR:{value:PR},uFocus:{value:new V3()}};
function buildPoints(n,gen,size,c1,c2,alpha){
  const A=new Float32Array(n*4),B=new Float32Array(n*3),P=new Float32Array(n*3);
  for(let i=0;i<n;i++){const r=gen();A.set([r.a,r.e,r.I,r.Om],i*4);B.set([r.w,r.M0,rng()],i*3);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('aA',new THREE.BufferAttribute(A,4));g.setAttribute('aB',new THREE.BufferAttribute(B,3));
  const m=new THREE.ShaderMaterial({uniforms:{...astUniforms,uSize:{value:size},uCol1:{value:new THREE.Color(...c1)},uCol2:{value:new THREE.Color(...c2)},uAlpha:{value:alpha}},
    vertexShader:AST_VS,fragmentShader:AST_FS,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
  const p=new THREE.Points(g,m);p.frustumCulled=false;scene.add(p);return p;
}
const rayl=s=>s*Math.sqrt(-2*Math.log(1-rng()));
function makeBelts(){
  const gaps=[[2.065,.012],[2.5,.015],[2.82,.02],[2.95,.012],[3.27,.02]];
  state.belt=buildPoints(32000,()=>{
    let a;for(;;){a=2.05+rng()*1.35;let pr=0.35+0.65*Math.exp(-Math.pow((a-2.75)/0.45,2));
      for(const [c,w] of gaps)pr*=1-0.92*Math.exp(-Math.pow((a-c)/w,2));
      if(rng()<pr)break;}
    return {a,e:Math.min(Math.abs(gauss())*0.09,0.34),I:Math.min(rayl(0.1),0.55),Om:rng()*TAU,w:rng()*TAU,M0:rng()*TAU};
  },1.4,[.5,.44,.38],[.8,.68,.52],0.28);
  const LJ=34.39644051*D2R;
  const tro=sign=>buildPoints(3500,()=>{
    const Om=rng()*TAU,w=rng()*TAU,lam=LJ+sign*(60*D2R)+gauss()*0.18;
    return {a:5.2026+gauss()*0.02,e:Math.min(Math.abs(gauss())*0.07,0.2),I:Math.min(rayl(0.12),0.5),Om,w,M0:((lam-Om-w)%TAU+TAU)%TAU};
  },1.6,[.55,.4,.35],[.95,.7,.5],0.7);
  state.trojan=[tro(1),tro(-1)];
  state.kuiper=buildPoints(22000,()=>{
    const r=rng();let a,e,I;
    if(r<0.55){a=42+rng()*6.2;e=Math.abs(gauss())*0.06;I=Math.min(rayl(0.1),0.4);}
    else if(r<0.78){a=39.4+gauss()*0.25;e=0.12+rng()*0.17;I=Math.min(rayl(0.18),0.45);}
    else{for(;;){a=48+Math.pow(rng(),1.6)*60;e=0.1+rng()*0.4;if(a*(1-e)>33)break;}I=Math.min(rayl(0.22),0.7);}
    return {a,e,I,Om:rng()*TAU,w:rng()*TAU,M0:rng()*TAU};
  },1.4,[.35,.42,.55],[.75,.5,.4],0.5);
}

function makeComet(){
  const N=9000,seed=new Float32Array(N*4),pos=new Float32Array(N*3);
  for(let i=0;i<N*4;i++)seed[i]=rng();
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aSeed',new THREE.BufferAttribute(seed,4));
  const U={uTime:{value:0},uLen:{value:0.1},uAct:{value:0},uPR:{value:PR},uDir:{value:new V3(1,0,0)},uVel:{value:new V3(0,0,1)}};
  const pts=new THREE.Points(g,new THREE.ShaderMaterial({uniforms:U,vertexShader:TAIL_VS,fragmentShader:TAIL_FS,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  pts.frustumCulled=false;halley.root.add(pts);halley.tail=U;
  const coma=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex([[0,'rgba(200,240,255,1)'],[.2,'rgba(120,200,255,.5)'],[1,'rgba(80,160,255,0)']]),
    blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,color:new THREE.Color(1.4,1.4,1.6)}));
  halley.root.add(coma);halley.coma=coma;
}

/* ============================================================
   4. 每帧:天体位置
   ============================================================ */
function updateBodies(jd){
  for(const p of planets){
    const el=planetElements(p.el,jd);p.elm=el;
    const E=solveKepler(el.M,el.e),x=orbitXYZ(el.a,el.e,el.I,el.Om,el.w,E);
    p.tpos.set(x[0],x[2],-x[1]);p.pos.copy(p.tpos);p.phase=el.M/TAU;
  }
  // 彗星
  {const c=halley.comet,a=c.a,n=GAUSS_K/Math.pow(a,1.5);
   const f=t=>{const E=solveKepler(n*(t-c.T),c.e);const x=orbitXYZ(a,c.e,c.I*D2R,c.Om*D2R,c.w*D2R,E);return new V3(x[0],x[2],-x[1]);};
   halley.tpos.copy(f(jd));halley.pos.copy(halley.tpos);halley.vel=f(jd+0.05).sub(halley.tpos).multiplyScalar(1/0.05);
   halley.phase=n*(jd-c.T)/TAU;halley.elm={a,e:c.e};}
  // 地月系
  const mel=moonElements(jd);moon.elm=mel;const mo=moonOffsetEcl(mel);
  moon.off.set(mo[0],mo[2],-mo[1]);moon.phase=mel.M/TAU;
  earth.tpos.addScaledVector(moon.off,-0.012150586);earth.pos.copy(earth.tpos);
  moon.tpos.copy(earth.tpos).add(moon.off);moon.pos.copy(earth.pos).addScaledVector(moon.off,moon.s);
  // 其它卫星 (母星赤道面开普勒轨道)
  const T=jd-J2000;
  for(const m of moonsAll){
    if(m===moon)continue;
    const M=(m.L0*D2R)+TAU*T/m.Pd;const E=solveKepler(M,m.e),a=m.aAU;
    m.off.set(a*(Math.cos(E)-m.e),0,-a*Math.sqrt(1-m.e*m.e)*Math.sin(E)).applyQuaternion(m.parentB.tiltQ);
    m.phase=M/TAU;m.elm={a,e:m.e};
    m.tpos.copy(m.parentB.tpos).add(m.off);m.pos.copy(m.parentB.pos).addScaledVector(m.off,m.s);
  }
}

/* ---------- 相机与聚焦 ---------- */
const cam={yaw:0.5,pitch:0.55,dist:150,target:7,yawV:0,pitchV:0,distRate:1.0};
const focusPos=new V3();let focusBody=sun;
const trans={t0:0,dur:2.2,from:new V3(),active:false,travel:0};
function minDistOf(b){return b.kind==='comet'?2e-6:b.rr*1.1;}
function defaultDist(b){
  if(b.kind==='star')return b.rr*4.5;
  if(b.kind==='comet')return 0.12;
  let ext=b.rr*5;
  for(const m of b.moons)ext=Math.max(ext,m.aAU*m.s*1.2);
  return Math.max(b.rr*5,Math.min(ext,b.rr*40));
}
function setFocus(b,distMul){
  if(!b)return;
  trans.from.copy(focusPos);trans.t0=performance.now()/1000;trans.active=true;
  trans.travel=b.pos.distanceTo(focusPos);
  trans.dur=Math.min(3.6,1.4+Math.log10(1+trans.travel*40)*0.9);
  focusBody=b;cam.target=Math.max(minDistOf(b),defaultDist(b)*(distMul||1));cam.distRate=2.2;
  highlightList();buildInfo();
}
function clampTarget(){cam.target=Math.min(Math.max(cam.target,minDistOf(focusBody)),900);}

/* ---------- 输入 ---------- */
const stage=renderer.domElement;const ptrs=new Map();let pinch0=0;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);}});
stage.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){cam.yawV=-dx*0.0052;cam.pitchV=dy*0.0052;cam.yaw+=cam.yawV;cam.pitch+=cam.pitchV;}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0){cam.target*=pinch0/d;clampTarget();}pinch0=d;}
});
const endP=e=>{ptrs.delete(e.pointerId);pinch0=0;};
stage.addEventListener('pointerup',endP);stage.addEventListener('pointercancel',endP);
stage.addEventListener('wheel',e=>{e.preventDefault();cam.target*=Math.exp(e.deltaY*(e.ctrlKey?0.01:0.0012));cam.distRate=9;clampTarget();},{passive:false});
stage.addEventListener('dblclick',e=>{
  let best=null,bd=50;const v=new V3();
  for(const b of bodies){if(b.kind==='comet'&&!state.opt.comet)continue;v.copy(b.pos).sub(focusPos).project(camera);
    if(v.z>1)continue;const x=(v.x*.5+.5)*W0(),y=(-v.y*.5+.5)*H0();const d=Math.hypot(x-e.clientX,y-e.clientY);if(d<bd){bd=d;best=b;}}
  if(best)setFocus(best);
});

const bodyListEl=$('#bodyList'),labelsEl=$('#labels');
function buildList(){
  const mk=(b,sub)=>{const d=document.createElement('div');d.className='bi'+(sub?' sub':'');d.dataset.id=b.id;
    d.innerHTML=`<span class="dot" style="color:${b.color}"></span><span>${b.zh}</span><span class="k">${b.kind==='planet'&&b.id!=='pluto'?(planets.indexOf(b)+1):''}</span>`;
    d.onclick=()=>setFocus(b);bodyListEl.appendChild(d);};
  mk(sun);
  const sep=()=>{const s=document.createElement('div');s.className='sep';bodyListEl.appendChild(s);};
  sep();
  for(const p of planets){mk(p);for(const m of p.moons)mk(m,true);}
  sep();mk(halley);
  // 标签
  for(const b of bodies){const l=document.createElement('div');l.className='lbl'+(b.kind==='moon'?' moon':'');l.style.color=b.color;
    l.innerHTML=`<i></i><span>${b.zh}</span>`;l.onclick=()=>setFocus(b);labelsEl.appendChild(l);b.lbl=l;}
  // 网格标签
  state.gl=[1,5,10,30,50,100].map(r=>{const d=document.createElement('div');d.className='gl';d.textContent=r+' AU';labelsEl.appendChild(d);return {r,d};});
}
function highlightList(){
  bodyListEl.querySelectorAll('.bi').forEach(e=>e.classList.toggle('active',e.dataset.id===focusBody.id));
  for(const b of bodies)b.lbl.classList.toggle('active',b===focusBody);
}

function fmtTime(s){s=Math.abs(s);if(s<60)return s.toFixed(1)+' 秒';if(s<3600)return Math.floor(s/60)+' 分 '+Math.round(s%60)+' 秒';return Math.floor(s/3600)+' 时 '+Math.floor(s%3600/60)+' 分';}

    g('lbl_d2').textContent='光行时间';g('v_d2').textContent=fmtTime(off/C_KMS);

  }else if(b.kind==='star'){
    g('lbl_d1').textContent='距地球';g('v_d1').textContent=`${fmt(earth.tpos.length(),4)} AU(${fmt(earth.tpos.length()*AU_KM/1e6,2)} 百万 km)`;
    g('lbl_d2').textContent='光到地球';g('v_d2').textContent=fmtTime(earth.tpos.length()*LIGHT_AU_S);
    g('v_v').textContent='相对银河系约 230 km/s';g('lbl_orb').textContent='银河公转';g('v_orb').textContent='约 2.3 亿年 / 周';
  }else{

    g('lbl_d2').textContent='日光到达';g('v_d2').textContent=fmtTime(dS*LIGHT_AU_S);
    const a=b.elm.a;
    g('v_v').textContent=`${fmt(Math.sqrt(GM_SUN*(2/(dS*AU_KM)-1/(a*AU_KM))),2)} km/s`;
    const e=b.elm.e;

    g('v_orb').textContent=`a=${fmt(a,3)} AU · e=${fmt(e,4)} · T=${fmt(Math.pow(a,1.5),a>50?0:2)} 年`;
  }

  const d=jd2date(state.jd);
  const p2=n=>String(n).padStart(2,'0');
  const y=d.getUTCFullYear();
  $('#dateBig').textContent=`${y<0?'公元前 '+(1-y):y} 年 ${p2(d.getUTCMonth()+1)} 月 ${p2(d.getUTCDate())} 日  ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`;
  $('#dateSub').textContent=`UTC · JD ${state.jd.toFixed(5)} · 距 J2000 ${((state.jd-J2000)/365.25).toFixed(3)} 年`;
  $('#warn').style.display=(y<1800||y>2050)?'block':'none';
}
function setRateUI(){const r=RATES[state.rateIdx];$('#speedTxt').textContent=r[0];$('#speed').value=state.rateIdx;
  $('#bPlay').textContent=state.playing?'⏸ 暂停':'▶ 继续';$('#bDir').textContent=state.dir>0?'▶ 正向':'◀ 逆向';}
function buildUI(){
  const T=[['orbits','轨道线'],['labels','名称标签'],['belt','小行星带'],['trojan','木星特洛伊群'],['kuiper','柯伊伯带'],['comet','哈雷彗星'],['hz','宜居带 (0.95–1.67 AU)'],['frost','雪线 (2.7 AU)'],['grid','黄道网格'],['bloom','泛光 Bloom'],['flare','镜头光晕'],['stars','星空与银河']];
  const tg=$('#toggles');
  for(const [k,t] of T){const d=document.createElement('div');d.className='tg'+(state.opt[k]?' on':'');d.innerHTML=`<span>${t}</span><div class="sw"></div>`;
    d.onclick=()=>{state.opt[k]=!state.opt[k];d.classList.toggle('on',state.opt[k]);applyOpts();};tg.appendChild(d);}
  const sel=$('#evSel');EVENTS.forEach((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=e[1];sel.appendChild(o);});
  sel.onchange=()=>{if(sel.value==='')return;const e=EVENTS[+sel.value];gotoDate(new Date(e[0]));
    const b=byId[e[2]];setFocus(b,e[3]||1);
    if(e[1].includes('食')){
      updateBodies(state.jd);
      state.playing=false;state.rateIdx=2;setRateUI();
      const d=earth.pos.clone().negate().normalize();   // 从太阳一侧观察
      cam.yaw=Math.atan2(d.x,d.z)+0.28;cam.pitch=Math.asin(d.y)+0.12;
      cam.target=Math.max(minDistOf(b),defaultDist(earth)*(e[1].includes('月全食')?0.45:0.6));
    }
    sel.value='';};
  $('#speed').oninput=e=>{state.rateIdx=+e.target.value;setRateUI();};
  $('#bPlay').onclick=()=>{state.playing=!state.playing;setRateUI();};
  $('#bDir').onclick=()=>{state.dir*=-1;setRateUI();};
  $('#bNow').onclick=()=>{gotoDate(new Date());state.rateIdx=4;state.dir=1;state.playing=true;setRateUI();};
  $('#bGo').onclick=()=>{const dv=$('#dIn').value,tv=$('#tIn').value||'00:00:00';if(!dv)return;const d=new Date(dv+'T'+(tv.length===5?tv+':00':tv)+'Z');if(!isNaN(d))gotoDate(d);};
  const kSl=$('#kSl');const kFrom=v=>Math.pow(1500,v/1000);
  kSl.value=Math.round(Math.log(state.k)/Math.log(1500)*1000);
  const kUp=()=>{state.k=kFrom(+kSl.value);if(state.k<1.02)state.k=1;updateScales();$('#kTxt').textContent=(state.k<10?state.k.toFixed(1):Math.round(state.k))+'×';clampTarget();};
  kSl.oninput=kUp;kUp();
  $('#exSl').oninput=e=>{const v=e.target.value/100;renderer.toneMappingExposure=v;$('#exTxt').textContent=v.toFixed(2);};
  $('#vTop').onclick=()=>{cam.pitch=1.5;};
  $('#vSide').onclick=()=>{cam.pitch=0.04;};
  $('#vAll').onclick=()=>{setFocus(sun);cam.target=70;cam.pitch=0.7;};
  $('#vPulse').onclick=launchPulse;
  window.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    if(e.code==='Space'){e.preventDefault();state.playing=!state.playing;setRateUI();}
    else if(e.key==='r'||e.key==='R'){state.dir*=-1;setRateUI();}
    else if(e.key===']'){state.rateIdx=Math.min(RATES.length-1,state.rateIdx+1);setRateUI();}
    else if(e.key==='['){state.rateIdx=Math.max(0,state.rateIdx-1);setRateUI();}
    else if(e.key==='h'||e.key==='H'){document.body.classList.toggle('hideui');}
    else if(/^[0-9]$/.test(e.key)){const n=+e.key;setFocus(n===0?sun:planets[n-1]);}
  });
  buildList();setRateUI();
}
function gotoDate(d){state.jd=date2jd(d);const iso=d.toISOString();$('#dIn').value=iso.slice(0,10);$('#tIn').value=iso.slice(11,19);
  for(const b of bodies)if(b.line)b.lineJD=-1e9;}
function applyOpts(){
  const o=state.opt;orbitGroup.visible=o.orbits;moonOrbitGroup.visible=o.orbits;labelsEl.style.display=o.labels?'block':'none';
  state.belt.visible=o.belt;state.trojan.forEach(t=>t.visible=o.trojan);state.kuiper.visible=o.kuiper;
  halley.root.visible=o.comet;halley.line.visible=o.comet&&o.orbits;
  state.hz.visible=o.hz;state.frost.visible=o.frost;state.grid.visible=o.grid;
  bloom.enabled=o.bloom;state.sky.visible=o.stars;state.stars.visible=o.stars;
  state.gl.forEach(g=>g.d.style.display=o.grid?'block':'none');
}
function launchPulse(){
  state.pulse={t0:state.jd};if(state.rateIdx>3||state.rateIdx<2){state.rateIdx=2;}state.dir=1;state.playing=true;setRateUI();
  setFocus(sun);cam.target=Math.max(cam.target,12);cam.pitch=Math.max(cam.pitch,0.8);
}

/* ============================================================
   5. 渲染更新
   ============================================================ */
const tmpV=new V3(),tmpV2=new V3();
function updateRender(now,dt){
  // 轨道线(按需重算)
  for(const p of planets){
    if(Math.abs(state.jd-p.lineJD)>150){fillOrbit(p.line,p.elm,'ecl');p.lineJD=state.jd;}
    p.line.material.uniforms.uPhase.value=p.phase;
  }
  if(Math.abs(state.jd-halley.lineJD)>400){const c=halley.comet;fillOrbit(halley.line,{a:c.a,e:c.e,I:c.I*D2R,Om:c.Om*D2R,w:c.w*D2R},'ecl');halley.lineJD=state.jd;}
  halley.line.material.uniforms.uPhase.value=halley.phase;
  for(const m of moonsAll){
    const upd=m===moon?Math.abs(state.jd-m.lineJD)>3:m.lineJD<-1e8;
    if(upd){if(m===moon)fillOrbit(m.line,m.elm,'ecl');else fillOrbit(m.line,{a:m.aAU,e:m.e},'eq',m.parentB.tiltQ);m.lineJD=state.jd;}
    m.line.material.uniforms.uPhase.value=m.phase;
    m.line.position.copy(m.parentB.pos).sub(focusPos);m.line.scale.setScalar(m.s);
    m.line.visible=m.parentB.rr*20>0&&(focusBody===m.parentB||focusBody.parentB===m.parentB||camDistToBody(m.parentB)<m.aAU*m.s*40);
  }
  sunCentered.position.copy(focusPos).negate();
  astUniforms.uT.value=state.jd-J2000;astUniforms.uFocus.value.copy(focusPos);
  const T=state.jd-J2000;
  const sunRel=tmpV.copy(focusPos).negate(); // 太阳的渲染位置
  for(const b of bodies){
    const r=b.root;r.position.copy(b.pos).sub(focusPos);
    r.visible=b===halley?state.opt.comet:true;
    const rr=b.rr;b.tilt.scale.setScalar(rr);
    if(b.kind==='star'){
      b.mesh.rotation.y=TAU*T/b.P;b.U.uTime.value=now*0.001;b.cU.uTime.value=now*0.001;
      b.corona.quaternion.copy(camera.quaternion);const S=9;b.corona.scale.setScalar(rr*S);b.cU.uS.value=S;
      const dcam=camera.position.distanceTo(r.position);
      b.glow1.scale.setScalar(rr*5+dcam*0.007);b.glow2.scale.setScalar(rr*18+dcam*0.02);
      continue;
    }
    // 自转
    if(b.kind==='planet'){
      b.mesh.rotation.y=b.id==='earth'?TAU*(0.7790572732640+1.00273781191135448*T):TAU*T/b.P;
    }else if(b.kind==='moon'){
      const z=tmpV2.copy(b.parentB.pos).sub(b.pos).normalize();
      const x=new V3().crossVectors(UP,z).normalize(),y=new V3().crossVectors(z,x);
      b.tilt.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));
    }else if(b.kind==='comet'){b.mesh.rotation.y=TAU*T/2.2;}
    // uniforms
    const U=b.U;U.uCenter.value.copy(r.position);U.uRadius.value=rr;
    const sr=b.pos.length();
    U.uSunRel.value.set(-b.pos.x/rr,-b.pos.y/rr,-b.pos.z/rr);U.uSunR.value=sun.rr/rr;
    U.uSunI.value=Math.pow(Math.max(sr,0.15),-0.36);
    U.uCamRel.value.copy(camera.position).sub(r.position).multiplyScalar(1/rr);
    U.uCloudShift.value=((T*0.02)%1+1)%1;
    let n=0;const occ=U.uOcc.value;
    const pushOcc=o=>{if(n<4){occ[n].set((o.pos.x-b.pos.x)/rr,(o.pos.y-b.pos.y)/rr,(o.pos.z-b.pos.z)/rr,o.rr/rr);n++;}};
    if(b.kind==='planet')for(const m of b.moons)pushOcc(m);
    else if(b.kind==='moon'){pushOcc(b.parentB);for(const s of b.parentB.moons)if(s!==b)pushOcc(s);}
    U.uNOcc.value=b.ring?1:n;
    if(b.ring){occ[0].set(0,0,0,1);}
    if(b.atmoMesh){const m=b.atmoMesh.material.uniforms;m.uSunI.value=U.uSunI.value;}
    if(b.id==='halley')updateComet(b,r,rr);
  }
  // 彗星尾
}
function camDistToBody(b){return camera.position.distanceTo(tmpV2.copy(b.pos).sub(focusPos));}
function updateComet(b,r,rr){
  const rs=b.tpos.length();
  const act=THREE.MathUtils.smoothstep(4.5,1.2,rs);
  const dir=new V3().copy(b.tpos).normalize();
  const t=b.tail;t.uDir.value.copy(dir);t.uVel.value.copy(b.vel).normalize();
  t.uAct.value=act;t.uLen.value=0.22*act/Math.sqrt(Math.max(rs,0.3))+1e-6;t.uTime.value=performance.now()*0.001;
  const dcam=camera.position.distanceTo(r.position);
  b.coma.scale.setScalar(Math.max(rr*3,dcam*0.006)*(0.5+act*2.5));
  b.coma.material.opacity=0.25+0.75*act;
}

const _p=new V3(),_c=new V3();
function updateLabels(){
  const W=W0(),H=H0(),fy=H/2/Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  for(const b of bodies){
    const l=b.lbl;
    let show=state.opt.labels;
    if(b===halley&&!state.opt.comet)show=false;
    if(show&&b.kind==='moon'){const par=b.parentB;show=(focusBody===par||focusBody.parentB===par);}
    if(!show){l.style.opacity=0;l.style.pointerEvents='none';continue;}
    _p.copy(b.pos).sub(focusPos).applyMatrix4(camera.matrixWorldInverse);
    if(_p.z>=0){l.style.opacity=0;l.style.pointerEvents='none';continue;}
    const dist=-_p.z;const rpx=b.rr/dist*fy;
    _c.copy(_p).applyMatrix4(camera.projectionMatrix);
    const x=(_c.x*.5+.5)*W,y=(-_c.y*.5+.5)*H;
    if(x<-50||x>W+50||y<-30||y>H+30){l.style.opacity=0;l.style.pointerEvents='none';continue;}
    const off=Math.min(rpx,200)+10;
    l.style.transform=`translate(${x+off-3}px,${y-7}px)`;
    let op=1;if(b.kind==='moon')op=THREE.MathUtils.clamp(rpx*0.6/3,0.2,1);
    l.style.opacity=op;l.style.pointerEvents='auto';
  }
  if(state.opt.grid&&state.opt.labels)for(const g of state.gl){
    _p.set(g.r*0.7071-focusPos.x,-focusPos.y,g.r*0.7071-focusPos.z).applyMatrix4(camera.matrixWorldInverse);
    if(_p.z>=0){g.d.style.opacity=0;continue;}
    _c.copy(_p).applyMatrix4(camera.projectionMatrix);const x=(_c.x*.5+.5)*W,y=(-_c.y*.5+.5)*H;
    g.d.style.opacity=1;g.d.style.transform=`translate(${x}px,${y}px)`;
  }
}

/* ---------- 光脉冲 ---------- */
function updatePulse(){
  const po=state.pulseObj,tag=$('#pulseTag');
  if(!state.pulse){po.visible=false;tag.style.display='none';return;}
  const sec=(state.jd-state.pulse.t0)*86400,R=sec/LIGHT_AU_S;
  if(R<0||R>130){if(R>130||R<-1){state.pulse=null;}po.visible=false;tag.style.display='none';return;}
  po.visible=true;po.scale.setScalar(Math.max(R,1e-6));
  tag.style.display='block';tag.textContent=`☀ 光脉冲 · 已行进 ${R.toFixed(2)} AU · 用时 ${fmtTime(sec)} · 光速 299,792 km/s`;
}

/* ---------- 镜头光晕 ---------- */
const fc=$('#flare'),fx=fc.getContext('2d');
function resizeFlare(){fc.width=W0()*PR;fc.height=H0()*PR;}
function drawFlare(){
  fx.setTransform(1,0,0,1,0,0);fx.clearRect(0,0,fc.width,fc.height);
  if(!state.opt.flare)return;
  const W=fc.width,H=fc.height;
  const sp=_p.copy(focusPos).negate();  // sun render pos
  const view=_c.copy(sp).applyMatrix4(camera.matrixWorldInverse);
  if(view.z>=0)return;
  const ndc=sp.clone().project(camera);
  const dist=sp.distanceTo(camera.position);
  // 遮挡检测
  let vis=1;const dirv=sp.clone().sub(camera.position),L=dirv.length();dirv.normalize();
  for(const b of bodies){
    if(b===sun)continue;
    const c=tmpV2.copy(b.pos).sub(focusPos).sub(camera.position);const t=c.dot(dirv);
    if(t<=0||t>L)continue;
    const dmin=Math.sqrt(Math.max(c.lengthSq()-t*t,0));const angR=b.rr/t,angS=sun.rr/L;
    const sep=dmin/t;
    // 太阳盘被遮挡比例的粗略估计
    const cover=THREE.MathUtils.smoothstep(angR+angS*0.2-sep,-angS*0.2,angS*1.2);
    vis*=1-cover;
  }
  if(vis<0.02)return;
  const edge=Math.max(Math.abs(ndc.x),Math.abs(ndc.y));
  const fade=THREE.MathUtils.clamp(1.25-edge,0,1);
  const I=vis*fade*THREE.MathUtils.clamp(Math.pow(Math.max(dist,0.01),-0.45)*0.9,0.08,1);
  if(I<0.01)return;
  const sx=(ndc.x*.5+.5)*W,sy=(-ndc.y*.5+.5)*H,cx=W/2,cy=H/2;
  fx.globalCompositeOperation='lighter';
  // 水平拉丝
  const sl=W*0.7;let g=fx.createLinearGradient(sx-sl,0,sx+sl,0);
  g.addColorStop(0,'rgba(120,170,255,0)');g.addColorStop(.5,`rgba(190,215,255,${0.22*I})`);g.addColorStop(1,'rgba(120,170,255,0)');
  fx.fillStyle=g;fx.fillRect(sx-sl,sy-1.2*PR,sl*2,2.4*PR);
  const sl2=W*0.25;g=fx.createLinearGradient(sx-sl2,0,sx+sl2,0);
  g.addColorStop(0,'rgba(255,200,150,0)');g.addColorStop(.5,`rgba(255,235,210,${0.5*I})`);g.addColorStop(1,'rgba(255,200,150,0)');
  fx.fillStyle=g;fx.fillRect(sx-sl2,sy-0.8*PR,sl2*2,1.6*PR);
  // 鬼影
  const ghosts=[[-.35,.07,'120,180,255'],[.25,.04,'255,170,100'],[.55,.10,'120,255,200'],[.85,.05,'255,120,160'],[1.35,.16,'140,160,255'],[-.8,.06,'255,210,120']];
  for(const [t,s,col] of ghosts){
    const gx=sx+(cx-sx)*(t*2),gy=sy+(cy-sy)*(t*2),r=s*Math.min(W,H)*(0.8+0.4*(1-fade));
    const rg=fx.createRadialGradient(gx,gy,0,gx,gy,r);
    rg.addColorStop(0,`rgba(${col},${0.0})`);rg.addColorStop(.7,`rgba(${col},${0.05*I})`);rg.addColorStop(.92,`rgba(${col},${0.12*I})`);rg.addColorStop(1,`rgba(${col},0)`);
    fx.fillStyle=rg;fx.beginPath();fx.arc(gx,gy,r,0,TAU);fx.fill();
  }
}

/* ============================================================
   6. 主循环
   ============================================================ */
let last=performance.now(),infoT=0,fpsT=0;
function frame(now){
  const dt=Math.min((now-last)/1000,0.1);last=now;
  if(state.playing)state.jd+=state.dir*RATES[state.rateIdx][1]*dt;
  updateBodies(state.jd);
  // 聚焦过渡
  const tn=now/1000;
  if(trans.active){
    const u=Math.min(1,(tn-trans.t0)/trans.dur),e=smoother(u);
    focusPos.copy(trans.from).lerp(focusBody.pos,e);
    if(u>=1)trans.active=false;
  }else focusPos.copy(focusBody.pos);
  // 相机
  cam.yawV*=0.92;cam.pitchV*=0.92;
  if(!ptrs.size){cam.yaw+=cam.yawV;cam.pitch+=cam.pitchV;}
  cam.pitch=THREE.MathUtils.clamp(cam.pitch,-1.5,1.5);
  clampTarget();
  cam.distRate+=(9-cam.distRate)*Math.min(1,dt*0.8);
  cam.dist=Math.exp(Math.log(cam.dist)+(Math.log(cam.target)-Math.log(cam.dist))*(1-Math.exp(-dt*cam.distRate)));
  let hop=0;if(trans.active){const u=Math.min(1,(tn-trans.t0)/trans.dur);hop=Math.min(trans.travel*0.35,25)*Math.sin(Math.PI*smoother(u))*0.8;}
  const D=cam.dist+hop,cp=Math.cos(cam.pitch);
  camera.position.set(Math.sin(cam.yaw)*cp,Math.sin(cam.pitch),Math.cos(cam.yaw)*cp).multiplyScalar(D);
  camera.up.set(0,1,0);camera.lookAt(0,0,0);camera.updateMatrixWorld();
  camera.near=Math.max(1e-7,Math.min(D*1e-3,1e-3)*0.05);camera.updateProjectionMatrix();
  updateRender(now,dt);updatePulse();
  // 背景跟随相机
  state.sky.position.copy(camera.position);state.stars.position.copy(camera.position);
  finalPass.uniforms.uTime.value=(now*0.001)%10;
  composer.render();
  updateLabels();drawFlare();
  infoT+=dt;if(infoT>0.12){infoT=0;updateInfo();updateTimeUI();}
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{
  renderer.setSize(W0(),H0());composer.setSize(W0(),H0());camera.aspect=W0()/H0();camera.updateProjectionMatrix();resizeFlare();
});

async function init(){
  buildUI();updateScales();
  setLoad('生成太阳系背景与银河 …',0.02);await nextFrame();
  makeSky();
  const order=[[2,1],[0,1],[3,1],[4,1],[5,1],[6,1],[1,1],[7,1],[8,1],[9,1],[10,0],[11,0],[12,0],[13,0],[14,0],[15,0],[16,0]];
  ringTex=genTex(99,0,2048,4,false);ringTex.anisotropy=maxAniso;
  let i=0;
  for(const [t,big] of order){setLoad('在 GPU 上生成行星表面 … ',0.05+0.8*i/order.length);await nextFrame();texFor(t,!!big);i++;}
  setLoad('构建天体与轨道 …',0.9);await nextFrame();
  for(const b of bodies)buildVisual(b);
  makeStaticObjects();makeBelts();makeComet();
  applyOpts();
  gotoDate(new Date());updateBodies(state.jd);
  updateScales();
  // 开场:从远处拉近
  focusPos.copy(sun.pos);cam.dist=260;cam.target=7.5;cam.distRate=0.7;cam.pitch=0.6;cam.yaw=0.4;
  focusBody=sun;highlightList();buildInfo();
  resizeFlare();
  setLoad('完成',1);
  const ld=$('#loading');ld.style.opacity=0;setTimeout(()=>ld.remove(),1300);
  last=performance.now();requestAnimationFrame(frame);
}
window.__solar={state,setFocus,byId,cam,gotoDate};
init().catch(err=>{console.error(err);setLoad('初始化失败:'+err.message,0);});
</script>
