<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太阳系 · Solar System</title>
<style>
  :root{ --glass:rgba(10,14,24,.58); --edge:rgba(140,170,255,.14); --txt:#cfd8ec; --dim:#77839e; --acc:#7fb2ff; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #c.drag{cursor:grabbing}
  .panel{position:fixed;background:var(--glass);border:1px solid var(--edge);border-radius:14px;z-index:10;
    backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
    box-shadow:0 8px 40px rgba(0,0,0,.45);user-select:none}
  #ui{top:16px;left:16px;width:254px;padding:14px 16px 12px}
  #ui h1{font-size:15px;font-weight:600;letter-spacing:.5px;color:#e8eeff;display:flex;align-items:baseline;gap:8px}
  #ui h1 small{font-size:10px;color:var(--dim);font-weight:400;letter-spacing:1px}
  #date{margin-top:6px;font-size:12px;color:var(--acc);font-variant-numeric:tabular-nums;letter-spacing:.5px}
  #speedlbl{font-size:11px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:6px;margin-top:10px;align-items:center}
  button{flex:1;background:rgba(127,178,255,.09);border:1px solid var(--edge);color:var(--txt);
    border-radius:8px;padding:5px 0;font-size:11px;cursor:pointer;transition:all .15s;font-family:inherit}
  button:hover{background:rgba(127,178,255,.2);color:#fff}
  button.on{background:rgba(127,178,255,.28);color:#fff;border-color:rgba(127,178,255,.5)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;outline:none;
    background:linear-gradient(90deg,var(--acc) var(--fill,52%),rgba(255,255,255,.12) var(--fill,52%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#dceaff;border:2px solid #5b8fd9;box-shadow:0 0 8px rgba(127,178,255,.7);cursor:pointer}
  .tgl{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .tgl span{flex:1 1 44%;text-align:center;font-size:11px;padding:4px 0;border-radius:7px;cursor:pointer;
    background:rgba(255,255,255,.04);border:1px solid transparent;color:var(--dim);transition:all .15s}
  .tgl span.on{background:rgba(127,178,255,.16);color:#cfe1ff;border-color:rgba(127,178,255,.35)}
  #chips{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
  .chip{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:4px 8px;border-radius:7px;cursor:pointer;
    background:rgba(255,255,255,.035);border:1px solid transparent;transition:all .15s;color:var(--txt)}
  .chip:hover{background:rgba(127,178,255,.14)}
  .chip.on{background:rgba(127,178,255,.22);border-color:rgba(127,178,255,.45);color:#fff}
  .chip i{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
  #info{left:16px;bottom:16px;width:254px;padding:12px 16px;display:none}
  #info h2{font-size:15px;color:#fff;display:flex;align-items:baseline;gap:8px}
  #info h2 small{font-size:10px;color:var(--dim);letter-spacing:1px}
  #info table{width:100%;margin-top:8px;border-collapse:collapse;font-size:11px}
  #info td{padding:2.5px 0;color:var(--txt)}
  #info td:first-child{color:var(--dim);width:42%}
  #info td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  #hint{bottom:14px;left:50%;transform:translateX(-50%);padding:6px 16px;font-size:11px;color:var(--dim);
    border-radius:20px;letter-spacing:.5px;white-space:nowrap}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .lb{position:absolute;left:0;top:0;font-size:10.5px;letter-spacing:1px;color:rgba(210,222,245,.85);
    text-shadow:0 0 6px #000,0 0 2px #000;pointer-events:auto;cursor:pointer;white-space:nowrap;
    transform:translate(-50%,0);transition:color .2s}
  .lb:hover{color:#fff}
  .lb.moon{font-size:9px;color:rgba(170,182,205,.7)}
  .lb.sel{color:#bcd6ff;font-weight:600}
  #bootlog{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="ui" class="panel">
  <h1>太阳系 <small>SOLAR SYSTEM</small></h1>
  <div id="date">—</div>
  <div id="speedlbl">—</div>
  <div class="row"><input id="speed" type="range" min="0" max="1000" value="523"></div>
  <div class="row">
    <button id="bPause">⏸ 暂停</button><button id="bReal">实时</button><button id="bHome">⌂ 全景</button>
  </div>
  <div class="tgl">
    <span id="tOrbit" class="on">轨道线</span><span id="tLabel" class="on">标签</span>
    <span id="tBelt" class="on">小行星带</span><span id="tBloom" class="on">泛光</span>
    <span id="tFlare" class="on">镜头光斑</span><span id="tDrift" class="on">自动巡游</span>
  </div>
  <div id="chips"></div>
</div>
<div id="info" class="panel"><h2 id="iName">—</h2><table id="iTab"></table></div>
<div id="hint" class="panel">拖拽旋转 · 滚轮缩放 · 点击天体聚焦 · 双击空白返回 · 空格暂停 · 数字键直达</div>
<div id="bootlog"></div>
<script>
'use strict';
/* ============================================================
   太阳系运动模型 · 原生 WebGL2 · 单文件
   - JPL 开普勒轨道根数(J2000 + 世纪变率) → 任意日期行星位置
   - 真实自转周期 / 转轴倾角 / 卫星系统 / 小行星带 / 柯伊伯带
   - HDR + MSAA + 多尺度 Bloom + ACES + 镜头光斑 + 程序化星空
   ============================================================ */
const bootlog = document.getElementById('bootlog');
let bootErr = null;
function bLog(s){ bootlog.textContent += s + '\n'; }
window.addEventListener('error', e=>{
  bootErr = e.message || 'err';
  document.title = 'ERR ' + bootErr;
  bLog('ERROR: ' + (e.error && e.error.stack ? e.error.stack : e.message));
});

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, depth:false, powerPreference:'high-performance'});
if(!gl){ document.title='ERR no-webgl2'; bLog('no webgl2'); throw new Error('WebGL2 not supported'); }

/* ---------- HDR / MSAA 能力协商（必须先请求扩展再选格式） ---------- */
const extCBF  = gl.getExtension('EXT_color_buffer_float');
const extCBHF = extCBF ? null : gl.getExtension('EXT_color_buffer_half_float');
const extLinF = gl.getExtension('OES_texture_float_linear');
let HDR_IFMT = 0, HDR_TYPE = 0;
if(extCBF){ HDR_IFMT = gl.RGBA16F; HDR_TYPE = gl.HALF_FLOAT; }
else if(extCBHF){ HDR_IFMT = gl.RGBA16F; HDR_TYPE = gl.HALF_FLOAT; }
else { HDR_IFMT = gl.RGBA8; HDR_TYPE = gl.UNSIGNED_BYTE; }
const IS_HDR = HDR_IFMT !== gl.RGBA8;
const TEX_FILT = (IS_HDR && !extLinF) ? gl.NEAREST : gl.LINEAR;
bLog('hdr=' + IS_HDR + ' ext_f=' + !!extCBF + ' ext_hf=' + !!extCBHF + ' lin=' + !!extLinF);

/* ============================ 数学库 ============================ */
const M4 = {
  create(){ return new Float32Array(16); },
  ident(o){ o.fill(0); o[0]=o[5]=o[10]=o[15]=1; return o; },
  perspective(o, fovy, asp, n, f){
    const t = 1/Math.tan(fovy/2), nf = 1/(n-f);
    o.fill(0);
    o[0]=t/asp; o[5]=t; o[10]=(f+n)*nf; o[11]=-1; o[14]=2*f*n*nf; return o;
  },
  lookAt(o, e, c, up){
    let zx=e[0]-c[0], zy=e[1]-c[1], zz=e[2]-c[2];
    let l=1/Math.hypot(zx,zy,zz); zx*=l; zy*=l; zz*=l;
    let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
    l=Math.hypot(xx,xy,xz); if(l<1e-8){xx=1;xy=0;xz=0;}else{l=1/l;xx*=l;xy*=l;xz*=l;}
    const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0; o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0; o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
    o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]); o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]); o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]); o[15]=1;
    return o;
  },
  mul(o, a, b){
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3], a10=a[4],a11=a[5],a12=a[6],a13=a[7],
          a20=a[8],a21=a[9],a22=a[10],a23=a[11], a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    let b0=b[0],b1=b[1],b2=b[2],b3=b[3];
    o[0]=b0*a00+b1*a10+b2*a20+b3*a30; o[1]=b0*a01+b1*a11+b2*a21+b3*a31;
    o[2]=b0*a02+b1*a12+b2*a22+b3*a32; o[3]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[4];b1=b[5];b2=b[6];b3=b[7];
    o[4]=b0*a00+b1*a10+b2*a20+b3*a30; o[5]=b0*a01+b1*a11+b2*a21+b3*a31;
    o[6]=b0*a02+b1*a12+b2*a22+b3*a32; o[7]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[8];b1=b[9];b2=b[10];b3=b[11];
    o[8]=b0*a00+b1*a10+b2*a20+b3*a30; o[9]=b0*a01+b1*a11+b2*a21+b3*a31;
    o[10]=b0*a02+b1*a12+b2*a22+b3*a32; o[11]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[12];b1=b[13];b2=b[14];b3=b[15];
    o[12]=b0*a00+b1*a10+b2*a20+b3*a30; o[13]=b0*a01+b1*a11+b2*a21+b3*a31;
    o[14]=b0*a02+b1*a12+b2*a22+b3*a32; o[15]=b0*a03+b1*a13+b2*a23+b3*a33;
    return o;
  },
  invert(o, a){
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3], a10=a[4],a11=a[5],a12=a[6],a13=a[7],
          a20=a[8],a21=a[9],a22=a[10],a23=a[11], a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10, b03=a01*a12-a02*a11,
          b04=a01*a13-a03*a11, b05=a02*a13-a03*a12, b06=a20*a31-a21*a30, b07=a20*a32-a22*a30,
          b08=a20*a33-a23*a30, b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
    let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
    if(!det) return M4.ident(o);
    det=1/det;
    o[0]=(a11*b11-a12*b10+a13*b09)*det; o[1]=(a02*b10-a01*b11-a03*b09)*det;
    o[2]=(a31*b05-a32*b04+a33*b03)*det; o[3]=(a22*b04-a21*b05-a23*b03)*det;
    o[4]=(a12*b08-a10*b11-a13*b07)*det; o[5]=(a00*b11-a02*b08+a03*b07)*det;
    o[6]=(a32*b02-a30*b05-a33*b01)*det; o[7]=(a20*b05-a22*b02+a23*b01)*det;
    o[8]=(a10*b10-a11*b08+a13*b06)*det; o[9]=(a01*b08-a00*b10-a03*b06)*det;
    o[10]=(a30*b04-a31*b02+a33*b00)*det; o[11]=(a21*b02-a20*b04-a23*b00)*det;
    o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det;
    o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;
    return o;
  },
  /** model = basis(m3: right,up,fwd) * scale + pos */
  basis(o, r, u, f, s, p){
    o[0]=r[0]*s;o[1]=r[1]*s;o[2]=r[2]*s;o[3]=0;
    o[4]=u[0]*s;o[5]=u[1]*s;o[6]=u[2]*s;o[7]=0;
    o[8]=f[0]*s;o[9]=f[1]*s;o[10]=f[2]*s;o[11]=0;
    o[12]=p[0];o[13]=p[1];o[14]=p[2];o[15]=1; return o;
  },
  xformPt(m, v){
    const x=v[0],y=v[1],z=v[2];
    return [m[0]*x+m[4]*y+m[8]*z+m[12], m[1]*x+m[5]*y+m[9]*z+m[13], m[2]*x+m[6]*y+m[10]*z+m[14], m[3]*x+m[7]*y+m[11]*z+m[15]];
  }
};
function norm3(v){ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; }
function cross3(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
/* ============================ 着色器 ============================ */
/* 共享噪声库（注入到需要的片元着色器） */
const NOISE = /* glsl */`
float hash13(vec3 p){ p = fract(p*0.3183099 + vec3(0.11,0.17,0.23)); p *= 17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
vec3 hash33(vec3 p){ p = fract(p*vec3(0.3183099,0.3678794,0.2878732) + vec3(0.13,0.19,0.29));
  p *= 19.0; return fract(vec3(p.x*p.y*p.z, p.y*p.z*p.x*(p.x+p.y), p.z*p.x*p.y*(p.y+p.z))); }
float vnoise(vec3 p){
  vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);
  float a000=hash13(i+vec3(0.0,0.0,0.0)), a100=hash13(i+vec3(1.0,0.0,0.0));
  float a010=hash13(i+vec3(0.0,1.0,0.0)), a110=hash13(i+vec3(1.0,1.0,0.0));
  float a001=hash13(i+vec3(0.0,0.0,1.0)), a101=hash13(i+vec3(1.0,0.0,1.0));
  float a011=hash13(i+vec3(0.0,1.0,1.0)), a111=hash13(i+vec3(1.0,1.0,1.0));
  return mix(mix(mix(a000,a100,f.x), mix(a010,a110,f.x), f.y),
             mix(mix(a001,a101,f.x), mix(a011,a111,f.x), f.y), f.z);
}
float fbm(vec3 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*vnoise(p); p=p*2.03+vec3(7.7,3.1,9.2); a*=0.5; } return v; }
float fbm3(vec3 p){ float v=0.0, a=0.5; for(int i=0;i<3;i++){ v+=a*vnoise(p); p=p*2.11+vec3(3.3,5.7,1.9); a*=0.5; } return v; }
`;

const SKY_VS = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUV;
void main(){ vUV = aPos*0.5+0.5; gl_Position = vec4(aPos, 0.9999, 1.0); }
`;
/* 程序化深空：多层星点 + 银河带（域扭曲 fbm + 尘埃暗纹） */
const SKY_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform mat4 uInvVP;
uniform float uGain;
out vec4 frag;
${NOISE}
vec3 dirFromUV(vec2 uv){
  vec4 ndc = vec4(uv*2.0-1.0, 0.5, 1.0);
  vec4 w = uInvVP * ndc;
  return normalize(w.xyz/w.w);
}
vec3 starLayer(vec3 d, float freq, float thresh, float size, float bright){
  vec3 p = d*freq;
  vec3 id = floor(p);
  vec3 f = fract(p) - 0.5;
  float h = hash13(id);
  if(h < thresh) return vec3(0.0);
  vec3 off = (hash33(id+7.7) - 0.5)*0.72;
  float dist = length(f - off);
  float s = smoothstep(size, 0.0, dist);
  float tw = 0.75 + 0.25*hash13(id+3.3);
  float mag = pow(hash13(id+11.1), 3.0);
  vec3 tint = mix(vec3(0.65,0.75,1.0), vec3(1.0,0.9,0.7), hash13(id+5.5));
  if(hash13(id+9.9) > 0.93) tint = vec3(1.0,0.55,0.35);
  return tint * s * (0.25 + 2.8*mag) * bright * tw;
}
void main(){
  vec3 d = dirFromUV(vUV);
  vec3 col = vec3(0.0016, 0.0022, 0.0042);
  /* 银河带：固定倾角的大圆 */
  vec3 mwN = normalize(vec3(0.42, 0.52, 0.74));
  float band = 1.0 - abs(dot(d, mwN));
  float bandI = pow(max(band, 0.0), 5.0);
  vec3 warp = vec3(fbm3(d*2.2+13.1), fbm3(d*2.2+27.7), fbm3(d*2.2+41.3));
  float den = fbm(d*3.2 + warp*1.8 + 11.0);
  float dust = fbm(d*8.0 - 5.0 + warp*2.0);
  float mw = bandI * (0.30 + 1.15*den);
  mw *= 1.0 - 0.62*smoothstep(0.52, 0.78, dust);
  vec3 mwCol = mix(vec3(0.10,0.13,0.22), vec3(0.30,0.22,0.15), den) * mw * 1.35;
  col += mwCol;
  col += starLayer(d, 34.0, 0.982, 0.16, 1.0) * (0.55 + 1.3*bandI);
  col += starLayer(d, 78.0, 0.978, 0.13, 0.55) * (0.5 + 1.5*bandI);
  col += starLayer(d, 150.0, 0.972, 0.11, 0.30) * (0.5 + 1.8*bandI);
  frag = vec4(col * uGain, 1.0);
}
`;

const SUN_VS = `#version 300 es
layout(location=0) in vec3 aPos;
uniform mat4 uVP;
uniform mat4 uModel;
out vec3 vObj; out vec3 vWN; out vec3 vWP;
void main(){
  vObj = aPos;
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWP = wp.xyz;
  vWN = mat3(uModel[0].xyz, uModel[1].xyz, uModel[2].xyz) * aPos;
  gl_Position = uVP * wp;
}
`;
/* 太阳：动态米粒组织 + 黑子 + 临边昏暗，HDR 输出交给 Bloom */
const SUN_FS = `#version 300 es
precision highp float;
in vec3 vObj; in vec3 vWN; in vec3 vWP;
uniform vec3 uCamPos;
uniform float uTime;
out vec4 frag;
${NOISE}
void main(){
  vec3 N = normalize(vWN);
  vec3 V = normalize(uCamPos - vWP);
  vec3 p = normalize(vObj);
  float t = uTime * 0.045;
  float w = fbm(p*3.0 + vec3(0.0, t, 0.0));
  float g = fbm(p*9.0 + w*1.6 - vec3(t*1.2, 0.0, t*0.8));
  float gran = smoothstep(0.18, 0.92, g);
  vec3 col = mix(vec3(1.0,0.30,0.03), vec3(1.0,0.86,0.46), gran);
  float spot = smoothstep(0.74, 0.85, fbm(p*4.0 + vec3(40.0) - t*0.5));
  col = mix(col, vec3(0.45,0.10,0.01), spot*0.75);
  float fl = pow(fbm(p*5.5 - vec3(0.0,t*1.6,0.0)), 3.0);
  col += vec3(1.0,0.6,0.25) * fl * 0.8;
  float mu = max(dot(N,V), 0.0);
  col *= 0.52 + 0.48*pow(mu, 0.65);
  frag = vec4(col * 4.2, 1.0);
}
`;

/* 广告牌通用顶点着色器 */
const BB_VS = `#version 300 es
layout(location=0) in vec2 aCorner;
uniform mat4 uView;
uniform mat4 uProj;
uniform vec3 uCenter;
uniform float uSize;
out vec2 vUV;
void main(){
  vec4 cp = uView * vec4(uCenter, 1.0);
  cp.xy += aCorner * uSize;
  gl_Position = uProj * cp;
  vUV = aCorner;
}
`;
/* 日冕：径向衰减 + 噪声流条 + 衍射芒 */
const GLOW_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform float uTime;
uniform float uGain;
out vec4 frag;

/* 行星 / 卫星统一片元着色器：uType 分派 15 种程序化地表 */
const PLANET_FS = `#version 300 es

in vec3 vObj; in vec3 vWN; in vec3 vWP;
uniform vec3 uCamPos;
uniform vec3 uSunPos;
uniform float uSpin;     /* 自转角(弧度, 已对2π取模), 纹理绕本地极轴旋转 */
uniform float uTime;     /* 模拟日 */
uniform int uType;
uniform float uSeed;
uniform vec3 uAtmo;      /* 大气颜色 */
uniform float uAtmoAmt;  /* 大气强度 */
out vec4 frag;
${NOISE}
mat3 rotYm(float a){ float c=cos(a), s=sin(a); return mat3(c,0.0,-s, 0.0,1.0,0.0, s,0.0,c); }
void main(){
  vec3 N = normalize(vWN);
  vec3 V = normalize(uCamPos - vWP);
  vec3 L = normalize(uSunPos - vWP);
  vec3 p = rotYm(-uSpin) * normalize(vObj);   /* 纹理空间(随自转) */
  float ndl = dot(N, L);
  float day = clamp(ndl, 0.0, 1.0);
  float lat = abs(p.y);
  vec3 alb = vec3(0.5);
  float specAmt = 0.0; float specPow = 60.0;
  float cities = 0.0; float clouds = 0.0;

  if(uType == 0){ /* 陨石坑岩质: 水星/月球/卡利斯托等 */
    float n1 = fbm(p*5.0 + uSeed);
    float n2 = fbm(p*13.0 + uSeed*2.0);
    float mare = fbm(p*2.3 + uSeed*7.0);
    alb = mix(vec3(0.30,0.28,0.26), vec3(0.58,0.55,0.51), n1);
    alb *= 0.72 + 0.55*n2;
    alb *= 0.68 + 0.62*smoothstep(0.25, 0.75, mare);
    float cr = vnoise(p*24.0 + uSeed*3.0);
    float ring = smoothstep(0.035, 0.0, abs(cr - 0.52));
    alb *= 1.0 - ring*0.28;
    alb *= 1.0 - smoothstep(0.62, 0.72, cr)*0.18;
  }
  else if(uType == 1){ /* 金星: 硫酸云漩涡 */
    float w1 = fbm(p*1.8 + uSeed + vec3(0.0, uTime*0.004, 0.0));
    float v = fbm(p*vec3(2.0,4.5,2.0) + w1*2.4 + uSeed*3.0);
    alb = mix(vec3(0.83,0.68,0.46), vec3(0.96,0.89,0.72), smoothstep(0.28, 0.72, v));
    alb = mix(alb, vec3(0.72,0.58,0.40), smoothstep(0.62, 0.85, fbm(p*3.2 - w1))*0.55);

    float land = smoothstep(0.52, 0.565, cont);
    float shore = smoothstep(0.505, 0.53, cont) - land;
    float ice = smoothstep(0.855, 0.93, lat + fbm(p*7.0)*0.07);
    vec3 ocean = mix(vec3(0.015,0.075,0.20), vec3(0.04,0.22,0.33), fbm(p*9.0)*0.8);
    float dry = smoothstep(0.15, 0.75, lat + fbm(p*6.0)*0.3);
    vec3 landC = mix(vec3(0.045,0.20,0.05), vec3(0.36,0.26,0.10), dry);
    landC = mix(landC, vec3(0.24,0.30,0.12), fbm(p*11.0)*0.5);
    alb = mix(ocean, landC, land);
    alb = mix(alb, vec3(0.45,0.42,0.30), shore*0.7);
    alb = mix(alb, vec3(0.90,0.93,0.97), ice);
    specAmt = (1.0-land)*(1.0-ice)*0.9; specPow = 110.0;
    vec3 pc = rotYm(-uSpin*1.17 - uTime*0.018) * normalize(vObj);
    float cl = fbm(pc*2.6 + uSeed*5.0) + 0.42*fbm(pc*6.2 + uSeed*2.0);
    clouds = smoothstep(0.56, 0.78, cl);
    cities = land * (1.0-ice) * smoothstep(0.66, 0.78, vnoise(p*26.0 + uSeed*9.0));

  else if(uType == 3){ /* 火星 */
    float n = fbm(p*3.2 + uSeed);
    alb = mix(vec3(0.42,0.15,0.05), vec3(0.72,0.36,0.16), n);
    alb *= 0.72 + 0.55*smoothstep(0.28, 0.72, fbm(p*1.6 + uSeed*3.0));
    float cap = smoothstep(0.87, 0.945, lat + fbm(p*8.0)*0.05);
    alb = mix(alb, vec3(0.95,0.91,0.86), cap);
    alb += vec3(0.05,0.035,0.02)*fbm(p*10.0);

  else if(uType == 4){ /* 木星: 湍流云带 + 大红斑 */
    float w = fbm(p*2.6 + uSeed)*0.4;
    float y = p.y + w;
    float b = sin(y*9.0)*0.5 + sin(y*17.0+1.7)*0.3 + sin(y*29.0+4.2)*0.2;
    alb = mix(vec3(0.58,0.40,0.26), vec3(0.87,0.77,0.62), smoothstep(-0.5, 0.6, b));
    alb = mix(alb, vec3(0.92,0.87,0.76), smoothstep(0.4, 0.9, fbm(p*7.0 + w))*0.42);
    vec2 sp = vec2(atan(p.z, p.x), asin(clamp(p.y,-1.0,1.0)));
    vec2 dd = sp - vec2(1.2, -0.30);
    dd.x = mod(dd.x + 3.14159265, 6.2831853) - 3.14159265;
    dd.x *= 0.87;
    float sd = length(dd / vec2(0.40, 0.19));
    float spotIn = smoothstep(1.0, 0.55, sd);
    alb = mix(alb, vec3(0.78,0.26,0.11), spotIn);
    alb = mix(alb, vec3(0.92,0.55,0.32), smoothstep(1.35, 1.0, sd)*(1.0-spotIn)*0.55);
    alb *= 0.70 + 0.30*smoothstep(1.0, 0.65, lat);
  }
  else if(uType == 5){ /* 土星: 柔和金带 */
    float w = fbm(p*2.4 + uSeed)*0.28;
    float y = p.y + w;
    float b = sin(y*11.0)*0.5 + sin(y*19.0+2.1)*0.28 + sin(y*31.0+0.7)*0.22;
    alb = mix(vec3(0.66,0.55,0.38), vec3(0.90,0.82,0.63), smoothstep(-0.5, 0.6, b));
    alb = mix(alb, vec3(0.94,0.89,0.74), smoothstep(0.45, 0.9, fbm(p*6.0 + w))*0.3);

  else if(uType == 6){ /* 天王星: 淡青 */

    alb = mix(alb, vec3(0.48,0.72,0.76), smoothstep(0.6, 0.95, lat)*0.5);
  }
  else if(uType == 7){ /* 海王星: 深蓝 + 暗斑 + 卷云 */
    float w = fbm(p*2.6 + uSeed)*0.3;
    float b = sin((p.y+w)*7.0)*0.5 + 0.5;
    alb = mix(vec3(0.12,0.22,0.58), vec3(0.28,0.44,0.80), b*0.6 + fbm(p*5.0+w)*0.4);
    vec2 sp = vec2(atan(p.z, p.x), asin(clamp(p.y,-1.0,1.0)));
    vec2 dd = sp - vec2(2.3, -0.28);
    dd.x = mod(dd.x + 3.14159265, 6.2831853) - 3.14159265;
    dd.x *= 0.88;
    float sd = length(dd / vec2(0.30, 0.16));
    alb = mix(alb, vec3(0.05,0.09,0.26), smoothstep(1.0, 0.5, sd));
    alb += vec3(0.75,0.82,0.95) * smoothstep(0.72, 0.9, fbm(p*9.0 + w*3.0))*0.28;
  }
  else if(uType == 8){ /* 冥王星: 斯普尼克冰原 */
    alb = mix(vec3(0.52,0.42,0.32), vec3(0.74,0.64,0.54), fbm(p*3.0 + uSeed));
    vec2 sp = vec2(atan(p.z, p.x), asin(clamp(p.y,-1.0,1.0)));
    vec2 dd = sp - vec2(0.35, 0.02);
    dd.x = mod(dd.x + 3.14159265, 6.2831853) - 3.14159265;
    float sd = length(dd / vec2(0.75, 0.48));
    alb = mix(alb, vec3(0.92,0.89,0.82), smoothstep(1.0, 0.45, sd));
    alb *= 1.0 - 0.35*smoothstep(0.5, 0.75, fbm(p*4.0 + uSeed*3.0));
  }
  else if(uType == 9){ /* 木卫一: 硫磺火山 */
    alb = mix(vec3(0.88,0.76,0.34), vec3(0.94,0.88,0.62), fbm(p*4.0 + uSeed));
    alb = mix(alb, vec3(0.85,0.48,0.12), smoothstep(0.52, 0.72, fbm(p*2.6 + uSeed*2.0)));
    alb = mix(alb, vec3(0.16,0.12,0.06), smoothstep(0.70, 0.80, vnoise(p*6.5 + uSeed*5.0)));
    alb = mix(alb, vec3(0.55,0.60,0.30), smoothstep(0.7, 0.95, lat)*0.5);
  }
  else if(uType == 10){ /* 木卫二: 冰面裂痕 */
    alb = vec3(0.84,0.79,0.71) * (0.9 + 0.2*fbm(p*5.0 + uSeed));
    float r = 1.0 - abs(2.0*fbm(p*3.2 + uSeed) - 1.0);
    float lines = pow(clamp(r, 0.0, 1.0), 16.0);
    alb = mix(alb, vec3(0.58,0.28,0.18), lines*0.85);
    alb = mix(alb, vec3(0.62,0.42,0.30), smoothstep(0.6, 0.8, fbm(p*2.0 + uSeed*4.0))*0.4);
  }
  else if(uType == 11){ /* 木卫三: 双质地貌 */
    float t = smoothstep(0.38, 0.62, fbm(p*2.0 + uSeed));
    alb = mix(vec3(0.40,0.36,0.30), vec3(0.62,0.60,0.54), t) * (0.82 + 0.36*fbm(p*9.0 + uSeed));
  }
  else if(uType == 12){ /* 土卫六: 橙色霾层 */
    alb = vec3(0.87,0.58,0.24) * (0.88 + 0.24*fbm(p*2.2 + uSeed));

    alb = mix(vec3(0.78,0.68,0.64), vec3(0.90,0.86,0.82), fbm(p*5.0 + uSeed));

    vec3 H = normalize(L + V);

  const s = gl.createShader(type);
  gl.shaderSource(s, src);

    const log = gl.getShaderInfoLog(s);

}

  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs, tag+'.fs'));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    const log = gl.getProgramInfoLog(p);
    bLog('LINK ' + tag + ': ' + log);
    document.title = 'ERR link ' + tag;
    throw new Error('link ' + tag);

function makeSphere(seg, rings){
  const pos = [], idx = [];
  for(let r=0; r<=rings; r++){
    const v = r/rings, phi = v*Math.PI - Math.PI/2;
    const cp = Math.cos(phi), sp = Math.sin(phi);
    for(let s=0; s<=seg; s++){
      const u = s/seg, th = u*2*Math.PI;
      pos.push(cp*Math.cos(th), sp, cp*Math.sin(th));
    }
  }
  for(let r=0; r<rings; r++) for(let s=0; s<seg; s++){
    const a = r*(seg+1)+s, b = a+seg+1;
    idx.push(a, b, a+1, b, b+1, a+1);
  }
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(idx), gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return {vao, count: idx.length};
}
function makeRing(inner, outer, seg, rad){

      const th = s/seg*2*Math.PI;
      pos.push(r*Math.cos(th), 0, r*Math.sin(th));
    }
  }
  for(let j=0; j<rad; j++) for(let s=0; s<seg; s++){
    const a = j*(seg+1)+s, b = a+seg+1;
    idx.push(a, b, a+1, b, b+1, a+1);
  }
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

function makeBelt(n, aMin, aMax, incMax, gaps){
  const data = {a:[], ph:[], in:[], br:[]};
  let i = 0;
  while(i < n){
    const a = aMin + rnd()*(aMax-aMin);
    if(gaps && gaps.some(g => Math.abs(a-g[0]) < g[1])) continue;
    data.a.push(a);

  gl.bindVertexArray(vao);

  const x = r*(cO*cw - sO*sw*ci);
  const y = r*(sO*cw + cO*sw*ci);
  const z = r*sw*si;
  out[0] = x*AU; out[1] = z*AU; out[2] = -y*AU;
  return r;
}
/* 轨道线采样(在当前世纪根数下) */
const orbitBuf = new Float32Array(ORBIT_N*3);
function fillOrbit(p, T){
  const a = p.el[0] + p.ra[0]*T, e = p.el[1] + p.ra[1]*T, i = (p.el[2] + p.ra[2]*T)*D2R,
        lp = (p.el[4] + p.ra[4]*T)*D2R, om = (p.el[5] + p.ra[5]*T)*D2R;
  const w = lp - om, cO = Math.cos(om), sO = Math.sin(om), ci = Math.cos(i), si = Math.sin(i);
  const b2 = a*Math.sqrt(1-e*e);
  for(let k=0; k<ORBIT_N; k++){
    const E = k/ORBIT_N*2*Math.PI;
    const xp = a*(Math.cos(E)-e), yp = b2*Math.sin(E);
    const cw = Math.cos(w), sw = Math.sin(w);
    const xe = xp*cw - yp*sw, ye = xp*sw + yp*cw;          /* 轨道面内绕焦点转 ω */
    const x2 = cO*xe - sO*ye*ci, y2 = sO*xe + cO*ye*ci, z2 = ye*si;
    orbitBuf[k*3]   = x2*AU;
    orbitBuf[k*3+1] = z2*AU;
    orbitBuf[k*3+2] = -y2*AU;
  }
}

function fmtSpeed(d){
  if(d < 1/3600) return (d*86400).toFixed(2) + ' 秒/秒';
  if(d < 1/24)  return (d*1440).toFixed(2) + ' 分钟/秒';
  if(d < 1)     return (d*24).toFixed(2) + ' 小时/秒';
  if(d < 30.4)  return d.toFixed(2) + ' 天/秒';
  if(d < 365.25) return (d/30.4).toFixed(2) + ' 个月/秒';
  return (d/365.25).toFixed(2) + ' 年/秒';
}
function fmtDate(jd){
  const z = Math.floor(jd + 0.5), f = jd + 0.5 - z;
  let A = z;
  if(z >= 2299161){ const al = Math.floor((z - 1867216.25)/36524.25); A = z + 1 + al - Math.floor(al/4); }
  const B = A + 1524, C = Math.floor((B - 122.1)/365.25), D = Math.floor(365.25*C), E = Math.floor((B-D)/30.6001);
  const day = B - D - Math.floor(30.6001*E) + f;
  const mon = E < 14 ? E - 1 : E - 13;
  const yr = mon > 2 ? C - 4716 : C - 4715;
  const hh = Math.floor((day%1)*24), mm = Math.floor(((day%1)*24 - hh)*60);
  return `${yr}-${String(mon).padStart(2,'0')}-${String(Math.floor(day)).padStart(2,'0')} ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} UT`;
}

const cam = {
  az: 0.9, el: 0.40, dist: 130, distT: 130,
  target: [0,0,0], eye: [0,0,0],
  sel: null, blend: 1, from: [0,0,0],
  idle: 99, drift: true,
};
const matP = M4.create(), matV = M4.create(), matVP = M4.create(), matInvVP = M4.create(), matM = M4.create();
function focusBody(b){
  if(cam.sel !== b){
    cam.from = [...cam.target];
    cam.blend = 0;
    cam.sel = b;
    cam.distT = b === sun ? 26 : Math.max(b.dispR*6.5, b.dispR + 1.6);
  }
  updateChips(); showInfo(b);
}
function goHome(){
  if(cam.sel){ cam.from = [...cam.target]; cam.blend = 0; }
  cam.sel = null; cam.distT = 130;
  updateChips(); hideInfo();
}
function camUpdate(dt){
  if(cam.blend < 1){
    cam.blend = Math.min(1, cam.blend + dt/1.4);
    const t = cam.blend*cam.blend*(3-2*cam.blend);
    const dst = cam.sel ? cam.sel.pos : [0,0,0];
    cam.target[0] = cam.from[0] + (dst[0]-cam.from[0])*t;
    cam.target[1] = cam.from[1] + (dst[1]-cam.from[1])*t;
    cam.target[2] = cam.from[2] + (dst[2]-cam.from[2])*t;
  } else if(cam.sel){
    cam.target = cam.sel.pos;
  } else {
    cam.target = [0,0,0];
  }
  if(cam.drift && cam.idle > 9 && !paused) cam.az += 0.018*dt;
  cam.idle += dt;
  cam.dist += (cam.distT - cam.dist) * Math.min(1, dt*4.5);
  cam.el = Math.max(-1.55, Math.min(1.55, cam.el));
  const ce = Math.cos(cam.el);
  cam.eye[0] = cam.target[0] + cam.dist*ce*Math.cos(cam.az);
  cam.eye[1] = cam.target[1] + cam.dist*Math.sin(cam.el);
  cam.eye[2] = cam.target[2] + cam.dist*ce*Math.sin(cam.az);
  M4.perspective(matP, 55*D2R, W/H, 0.05, 4000);
  M4.lookAt(matV, cam.eye, cam.target, [0,1,0]);
  M4.mul(matVP, matP, matV);
  M4.invert(matInvVP, matVP);
}

let dragging = false, moved = 0, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e=>{
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  cam.az -= dx*0.0052; cam.el += dy*0.0052;
  cam.idle = 0;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('pointerup', e=>{
  dragging = false; canvas.classList.remove('drag');

});

  e.preventDefault();
  cam.distT *= Math.exp(e.deltaY*0.0011);
  const minD = cam.sel ? cam.sel.dispR*1.9 : 0.5;
  cam.distT = Math.max(minD, Math.min(1500, cam.distT));
  cam.idle = 0;
}, {passive:false});
function allBodies(){ return [sun, ...PLANETS, ...MOONS]; }
function pickAt(cx, cy, isDbl){
  const x = (cx*DPR/W)*2 - 1, y = 1 - (cy*DPR/H)*2;
  const pN = M4.xformPt(matInvVP, [x, y, -1]), pF = M4.xformPt(matInvVP, [x, y, 1]);
  const o = [pN[0]/pN[3], pN[1]/pN[3], pN[2]/pN[3]];
  const f = [pF[0]/pF[3], pF[1]/pF[3], pF[2]/pF[3]];
  const d = norm3([f[0]-o[0], f[1]-o[1], f[2]-o[2]]);
  let best = null, bestT = 1e30;
  for(const b of allBodies()){
    const r = b === sun ? SUN_R*1.4 : Math.max(b.dispR*1.9, 0.55);
    const oc = [o[0]-b.pos[0], o[1]-b.pos[1], o[2]-b.pos[2]];
    const bb = oc[0]*d[0]+oc[1]*d[1]+oc[2]*d[2];
    const cc = oc[0]*oc[0]+oc[1]*oc[1]+oc[2]*oc[2] - r*r;
    const disc = bb*bb - cc;
    if(disc < 0) continue;
    const t = -bb - Math.sqrt(disc);
    if(t > 0 && t < bestT){ bestT = t; best = b; }
  }
  if(best){ focusBody(best); return; }
  /* 标签兜底 */
  for(const [b, el] of labelMap){
    if(el.style.display === 'none') continue;
    const r = el.getBoundingClientRect();
    if(Math.abs(cx - (r.left + r.width/2)) < 30 && Math.abs(cy - (r.top + r.height/2)) < 16){
      focusBody(b); return;
    }
  }
  if(isDbl) goHome();
}
window.addEventListener('keydown', e=>{
  if(e.code === 'Space'){ e.preventDefault(); togglePause(); }
  const order = ['sun','mercury','venus','earth','mars','jupiter','saturn','uranus','neptune','pluto'];
  if(e.key >= '0' && e.key <= '9'){
    const b = allBodies().find(x => x.id === order[+e.key]);
    if(b) focusBody(b);
  }
  if(e.key === '['){ setSpeedDPS(speedDPS/2); }
  if(e.key === ']'){ setSpeedDPS(speedDPS*2); }
  if(e.key === 'Escape') goHome();
});

function drawBody(b, modelFromPole){

function drawShell(b, scale, gain, pw){
  const sc = b.dispR*scale;
  matM[0]=sc;matM[1]=0;matM[2]=0; matM[4]=0;matM[5]=sc;matM[6]=0; matM[8]=0;matM[9]=0;matM[10]=sc;
  matM[12]=b.pos[0];matM[13]=b.pos[1];matM[14]=b.pos[2]; matM[3]=matM[7]=matM[11]=0; matM[15]=1;

let frame = 0, lastT = performance.now();
const FMT0 = document.title;
function render(){
  requestAnimationFrame(render);
  const now = performance.now();
  let dt = Math.min((now - lastT)/1000, 0.1);
  lastT = now;
  resize();
  if(paused) dt = 0;
  simJD += dt * speedDPS;
  const T = (simJD - J2000)/36525;
  const simYears = (simJD - J2000)/365.25;
  const simDays = simJD - J2000;

  /* 位置与自转 */
  for(const p of PLANETS){
    p.lastR = planetPos(p, T, p.pos);
    const rev = simDays*24 / p.rot * 2*Math.PI;
    p.spin = rev % (2*Math.PI);
  }
  for(const m of MOONS){
    const th = m.ph + 2*Math.PI*simDays / m.T;
    const pr = m.parentRef;
    /* 绕母体极轴、带小倾角的圆轨道 */
    const co = Math.cos(m.node), so = Math.sin(m.node);
    const ci = Math.cos(m.inc), si = Math.sin(m.inc);
    let ux = co, uz = -so, uy = 0;
    let vx = so*ci, vz = co*ci, vy = si;
    /* 以母星赤道面(极轴)为基准旋转轨道基 */
    const pole = pr.pole, bR = pr.bR, bF = pr.bF;
    const U0 = [bR[0]*ux + bF[0]*uz + pole[0]*uy, bR[1]*ux + bF[1]*uz + pole[1]*uy, bR[2]*ux + bF[2]*uz + pole[2]*uy];
    const V0 = [bR[0]*vx + bF[0]*vz + pole[0]*vy, bR[1]*vx + bF[1]*vz + pole[1]*vy, bR[2]*vx + bF[2]*vz + pole[2]*vy];
    const c = Math.cos(th), s = Math.sin(th);
    m.pos[0] = pr.pos[0] + m.orbitR*(U0[0]*c + V0[0]*s);
    m.pos[1] = pr.pos[1] + m.orbitR*(U0[1]*c + V0[1]*s);
    m.pos[2] = pr.pos[2] + m.orbitR*(U0[2]*c + V0[2]*s);
    const rev = simDays*24 / (Math.abs(m.T)*24) * 2*Math.PI;
    m.spin = rev % (2*Math.PI);
    /* 卫星极轴沿用母星(潮汐锁定近似) */
    m.pole = pr.pole; m.bR = pr.bR; m.bF = pr.bF;
  }

  camUpdate(dt);
  dateEl.textContent = fmtDate(simJD);
  if(cam.sel && cam.sel.lastR && $('iDist')) $('iDist').textContent = cam.sel.lastR.toFixed(3) + ' AU';

  /* ---------- 场景 → HDR(MSAA) ---------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboMS || fboScene);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);

  /* 星空 */
  gl.depthMask(false);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(prSky);
  gl.uniformMatrix4fv(U(prSky,'uInvVP'), false, matInvVP);
  gl.uniform1f(U(prSky,'uGain'), 1.0);
  gl.bindVertexArray(gFSTri.vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);

  gl.bindVertexArray(gSphere.vao);
  /* 太阳本体 */
  gl.useProgram(prSun);
  M4.ident(matM);
  matM[0]=matM[5]=matM[10]=SUN_R;
  gl.uniformMatrix4fv(U(prSun,'uModel'), false, matM);
  gl.uniformMatrix4fv(U(prSun,'uVP'), false, matVP);
  gl.uniform3fv(U(prSun,'uCamPos'), cam.eye);
  gl.uniform1f(U(prSun,'uTime'), simDays);
  gl.drawElements(gl.TRIANGLES, gSphere.count, gl.UNSIGNED_INT, 0);

  /* 行星与卫星 */
  gl.useProgram(prPlanet);
  for(const p of PLANETS) drawBody(p);
  for(const m of MOONS) drawBody(m);

  /* 土星环 */
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   /* 预乘 alpha */
  gl.useProgram(prRing);
  {
    const sat = PLANETS.find(p=>p.id==='saturn');
    M4.basis(matM, sat.bR, sat.pole, sat.bF, sat.dispR, sat.pos);
    gl.uniformMatrix4fv(U(prRing,'uModel'), false, matM);
    gl.uniformMatrix4fv(U(prRing,'uVP'), false, matVP);
    gl.uniform3fv(U(prRing,'uCamPos'), cam.eye);
    gl.uniform3fv(U(prRing,'uPlanetPos'), sat.pos);
    gl.uniform1f(U(prRing,'uPR'), sat.dispR);
    gl.uniformMatrix3fv(U(prRing,'uTilt'), false, [sat.bR[0],sat.bR[1],sat.bR[2], sat.pole[0],sat.pole[1],sat.pole[2], sat.bF[0],sat.bF[1],sat.bF[2]]);
    gl.uniform1f(U(prRing,'uSeed'), 6.8);
    gl.bindVertexArray(gRing.vao);
    gl.drawElements(gl.TRIANGLES, gRing.count, gl.UNSIGNED_INT, 0);
  }

  /* 轨道线 */
  if(flags.orbit){
    gl.useProgram(prLine);
    gl.uniformMatrix4fv(U(prLine,'uVP'), false, matVP);
    gl.bindVertexArray(orbitVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, orbitVB);
    for(const p of PLANETS){
      fillOrbit(p, T);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, orbitBuf);
      const sel = cam.sel === p;
      const c = [(p.lc>>16&255)/255, (p.lc>>8&255)/255, (p.lc&255)/255];
      gl.uniform4f(U(prLine,'uCol'), c[0], c[1], c[2], sel ? 0.75 : 0.20);
      gl.drawArrays(gl.LINE_LOOP, 0, ORBIT_N);
    }
  }

  /* 小行星带(加法) */
  if(flags.belt){
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(prBelt);
    gl.uniformMatrix4fv(U(prBelt,'uVP'), false, matVP);
    gl.uniformMatrix4fv(U(prBelt,'uView'), false, matV);
    gl.uniform1f(U(prBelt,'uYears'), simYears);
    gl.uniform1f(U(prBelt,'uAU'), AU);
    gl.uniform1f(U(prBelt,'uGain'), 0.55);
    gl.uniform3f(U(prBelt,'uTint'), 0.72, 0.66, 0.58);
    gl.bindVertexArray(gBeltMain.vao);
    gl.drawArrays(gl.POINTS, 0, gBeltMain.count);
    gl.uniform1f(U(prBelt,'uGain'), 0.34);
    gl.uniform3f(U(prBelt,'uTint'), 0.58, 0.62, 0.72);
    gl.bindVertexArray(gBeltKuiper.vao);
    gl.drawArrays(gl.POINTS, 0, gBeltKuiper.count);
  }

  /* 大气辉光壳(背面 + 加法) */
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.cullFace(gl.FRONT);
  gl.enable(gl.CULL_FACE);
  gl.useProgram(prShell);
  gl.bindVertexArray(gSphere.vao);
  for(const b of [...PLANETS, ...MOONS]){
    if(!b.atmo || b.atmo.a < 0.3) continue;
    drawShell(b, 1.045, b.atmo.g, b.atmo.sh);
  }
  gl.disable(gl.CULL_FACE);

  /* 日冕广告牌(近距离衰减——日冕是广角现象, 近焦行星时不能糊满屏) */
  gl.useProgram(prGlow);
  const camSunD = Math.hypot(cam.eye[0], cam.eye[1], cam.eye[2]);
  const glowFade = Math.max(0, Math.min(1, (camSunD - 7) / 42));
  gl.uniformMatrix4fv(U(prGlow,'uView'), false, matV);
  gl.uniformMatrix4fv(U(prGlow,'uProj'), false, matP);
  gl.uniform3f(U(prGlow,'uCenter'), 0, 0, 0);
  gl.uniform1f(U(prGlow,'uSize'), SUN_R*5.2);
  gl.uniform1f(U(prGlow,'uTime'), simDays);
  gl.uniform1f(U(prGlow,'uGain'), 1.35*glowFade*glowFade);
  if(glowFade > 0.01){
    gl.bindVertexArray(gQuad.vao);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  /* 镜头光斑 */
  if(flags.flare){
    const sp = M4.xformPt(matVP, [0,0,0]);
    if(sp[3] > 0){
      const nx = sp[0]/sp[3], ny = sp[1]/sp[3];
      const dcx = -nx, dcy = -ny;
      const vig = Math.max(0, 1 - Math.hypot(nx, ny)*0.85);
      if(vig > 0.01){
        gl.disable(gl.DEPTH_TEST);
        gl.useProgram(prFlare);
        gl.uniform1f(U(prFlare,'uGain'), 0.55*vig);
        const asp = W/H;
        const ghosts = [
          {k:0.00, s:0.55, m:0, c:[1.0,0.85,0.6], g:0.5},
          {k:0.32, s:0.14, m:2, c:[0.45,0.7,1.0], g:0.5},
          {k:0.58, s:0.09, m:0, c:[0.6,0.9,0.75], g:0.7},
          {k:0.85, s:0.20, m:1, c:[0.75,0.55,1.0], g:0.45},
          {k:1.25, s:0.11, m:2, c:[1.0,0.7,0.45], g:0.5},
          {k:1.65, s:0.07, m:0, c:[0.5,0.8,1.0], g:0.8},
        ];
        gl.bindVertexArray(gQuad.vao);
        for(const g of ghosts){
          gl.uniform2f(U(prFlare,'uCenter'), nx + dcx*g.k, ny + dcy*g.k);
          gl.uniform2f(U(prFlare,'uSize'), g.s/asp, g.s);
          gl.uniform3fv(U(prFlare,'uCol'), g.c);
          gl.uniform1i(U(prFlare,'uMode'), g.m);
          gl.uniform1f(U(prFlare,'uGain'), 0.55*vig*g.g);
          gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
        gl.enable(gl.DEPTH_TEST);
      }
    }
  }
  gl.depthMask(true);
  gl.disable(gl.BLEND);

  /* ---------- 解析 MSAA ---------- */
  if(fboMS){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fboMS);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fboScene);
    gl.blitFramebuffer(0,0,W,H, 0,0,W,H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  }

  /* ---------- Bloom 链 ---------- */
  gl.disable(gl.DEPTH_TEST);
  gl.bindVertexArray(gFSTri.vao);
  /* 亮部提取 → B0 */
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboA[0]);
  gl.viewport(0, 0, W>>1, H>>1);
  gl.useProgram(prBright);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texScene);
  gl.uniform1i(U(prBright,'uT'), 0);
  gl.uniform1f(U(prBright,'uTh'), IS_HDR ? 1.0 : 0.72);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  /* 逐级: 模糊 → 降采样 */
  for(let i=0; i<BLOOM_LV; i++){
    const bw = Math.max(1, W>>(i+1)), bh = Math.max(1, H>>(i+1));
    gl.viewport(0, 0, bw, bh);
    gl.useProgram(prBlur);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboB[i]);
    gl.bindTexture(gl.TEXTURE_2D, bloomA[i]);
    gl.uniform1i(U(prBlur,'uT'), 0);
    gl.uniform2f(U(prBlur,'uDir'), 1/bw, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboA[i]);
    gl.bindTexture(gl.TEXTURE_2D, bloomB[i]);
    gl.uniform2f(U(prBlur,'uDir'), 0, 1/bh);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if(i+1 < BLOOM_LV){
      const nw = Math.max(1, W>>(i+2)), nh = Math.max(1, H>>(i+2));
      gl.bindFramebuffer(gl.FRAMEBUFFER, fboA[i+1]);
      gl.viewport(0, 0, nw, nh);
      gl.useProgram(prCopy);
      gl.bindTexture(gl.TEXTURE_2D, bloomA[i]);
      gl.uniform1i(U(prCopy,'uT'), 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
  }

  /* ---------- 合成输出 ---------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(prComp);
  const texs = [texScene, ...bloomA];
  const names = ['uScene','uB0','uB1','uB2','uB3','uB4'];
  for(let i=0; i<6; i++){
    gl.activeTexture(gl.TEXTURE0+i);
    gl.bindTexture(gl.TEXTURE_2D, texs[i]);
    gl.uniform1i(U(prComp,names[i]), i);
  }
  gl.uniform1f(U(prComp,'uExposure'), 1.05);
  gl.uniform1f(U(prComp,'uBloomAmt'), flags.bloom ? 1.0 : 0.0);
  gl.uniform1f(U(prComp,'uTime'), (now*0.001) % 100);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST);

  updateLabels();

  frame++;
  if(frame === 30 && !bootErr){
    const dbg = gl.getParameter(gl.RENDERER);
    document.title = 'OK · frames=30 · msaa=' + msaaSamples + ' · hdr=' + IS_HDR + ' · ' + dbg;
    window.__stats = {frames:frame, msaa:msaaSamples, hdr:IS_HDR, renderer:dbg, bodies:allBodies().length};
    bLog('boot ok msaa=' + msaaSamples + ' hdr=' + IS_HDR);
  }
  if(frame === 900) document.title = FMT0;
}

/* ---------- HTML 标签投影 ---------- */
function updateLabels(){
  if(!flags.label) return;
  const cw = W/DPR, ch = H/DPR;
  for(const [b, el] of labelMap){
    const p = M4.xformPt(matVP, b.pos);
    if(p[3] <= 0){ el.style.display = 'none'; continue; }
    const sx = (p[0]/p[3]*0.5 + 0.5)*cw;
    const sy = (0.5 - p[1]/p[3]*0.5)*ch;
    if(sx < -60 || sx > cw+60 || sy < -40 || sy > ch+40){ el.style.display = 'none'; continue; }
    /* 卫星标签: 仅在足够靠近时显示 */
    if(b.parentRef){
      const dx = cam.eye[0]-b.pos[0], dy = cam.eye[1]-b.pos[1], dz = cam.eye[2]-b.pos[2];
      const dist = Math.hypot(dx, dy, dz);
      if(dist > 60 && cam.sel !== b){ el.style.display = 'none'; continue; }
    }
    const rPx = b.dispR / Math.max(0.001, p[3]) * (H*0.5) / Math.tan(55*D2R/2) / DPR;
    el.style.display = 'block';
    el.style.transform = `translate(-50%, 0) translate(${sx.toFixed(1)}px, ${(sy + Math.max(rPx, 8) + 5).toFixed(1)}px)`;
    el.classList.toggle('sel', cam.sel === b);
    /* 远处时降低标签透明度避免喧宾夺主 */
    const fade = b === sun ? 1 : Math.max(0.35, Math.min(1, rPx*0.4 + 0.55));
    el.style.opacity = fade.toFixed(2);
  }
}

resize();
requestAnimationFrame(render);
</script>
