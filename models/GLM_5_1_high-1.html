<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太阳系运动模型</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#info {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.9); font-size: 14px; text-align: center;
  pointer-events: none; text-shadow: 0 0 10px rgba(100,150,255,0.5);
  letter-spacing: 2px;
}
#controls {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; align-items: center;
  background: rgba(10,10,30,0.7); backdrop-filter: blur(10px);
  padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(100,150,255,0.2);
}
#controls label { color: rgba(255,255,255,0.7); font-size: 13px; }
#controls input[type=range] {
  width: 120px; accent-color: #4488ff;
}
#controls button {
  background: rgba(68,136,255,0.3); border: 1px solid rgba(100,150,255,0.4);
  color: #fff; padding: 6px 16px; border-radius: 20px; cursor: pointer;
  font-size: 13px; transition: all 0.3s;
}
#controls button:hover { background: rgba(68,136,255,0.6); }
#controls button.active { background: rgba(68,136,255,0.5); border-color: rgba(100,150,255,0.8); }
#planet-label {
  position: absolute; color: #fff; font-size: 12px; pointer-events: none;
  text-shadow: 0 0 8px rgba(100,150,255,0.8); opacity: 0; transition: opacity 0.3s;
  white-space: nowrap;
}
</style>
</head>
<body>
<div id="info">太阳系运动模型 — 拖拽旋转 · 滚轮缩放 · 点击行星聚焦</div>
<div id="controls">
  <label>速度</label>
  <input type="range" id="speed" min="0" max="10" step="0.1" value="1">
  <button id="btnOrbits" class="active">轨道</button>
  <button id="btnLabels" class="active">标签</button>
  <button id="btnBloom" class="active">辉光</button>
  <button id="btnPause">暂停</button>
</div>
<div id="planet-label"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const PLANET_DATA = [
  { name: '水星', radius: 0.4, distance: 10, period: 0.241, color: 0xb0b0b0, tilt: 0.034, eccentricity: 0.206, rotSpeed: 0.017 },
  { name: '金星', radius: 0.9, distance: 15, period: 0.615, color: 0xe8cda0, tilt: 3.096, eccentricity: 0.007, rotSpeed: -0.004 },
  { name: '地球', radius: 1.0, distance: 20, period: 1.0,   color: 0x4488ff, tilt: 0.409, eccentricity: 0.017, rotSpeed: 1.0, hasMoon: true },
  { name: '火星', radius: 0.5, distance: 27, period: 1.881, color: 0xdd6644, tilt: 0.440, eccentricity: 0.093, rotSpeed: 0.97 },
  { name: '木星', radius: 3.0, distance: 40, period: 11.86, color: 0xddaa77, tilt: 0.055, eccentricity: 0.049, rotSpeed: 2.4 },
  { name: '土星', radius: 2.5, distance: 55, period: 29.46, color: 0xeedd88, tilt: 0.466, eccentricity: 0.057, rotSpeed: 2.18, hasRings: true },
  { name: '天王星', radius: 1.8, distance: 72, period: 84.01, color: 0x88cccc, tilt: 1.706, eccentricity: 0.046, rotSpeed: -1.39 },
  { name: '海王星', radius: 1.7, distance: 90, period: 164.8, color: 0x4466ee, tilt: 0.494, eccentricity: 0.010, rotSpeed: 1.49 },
];

let scene, camera, renderer, composer, controls;
let sun, planets = [], orbitLines = [], labels = [];
let bloomPass;
let time = 0, speed = 1, paused = false;
let showOrbits = true, showLabels = true, showBloom = true;
let raycaster, mouse;
let focusTarget = null, focusLerp = 0;

init();
animate();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);
  camera.position.set(30, 60, 80);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 5;
  controls.maxDistance = 300;

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  createStarfield();
  createSun();
  createPlanets();
  createAsteroidBelt();
  setupLighting();
  setupPostProcessing();
  setupEvents();
}

function createStarfield() {
  const starsGeo = new THREE.BufferGeometry();
  const count = 15000;
  const pos = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const r = 400 + Math.random() * 600;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = r * Math.cos(phi);

    const temp = Math.random();
    if (temp < 0.3) { colors[i*3]=0.8; colors[i*3+1]=0.85; colors[i*3+2]=1.0; }
    else if (temp < 0.6) { colors[i*3]=1.0; colors[i*3+1]=1.0; colors[i*3+2]=0.9; }
    else { colors[i*3]=1.0; colors[i*3+1]=0.9; colors[i*3+2]=0.8; }

    sizes[i] = 0.5 + Math.random() * 2.0;
  }

  starsGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  starsGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  starsGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const starsMat = new THREE.PointsMaterial({
    size: 0.8, vertexColors: true, transparent: true,
    opacity: 0.9, sizeAttenuation: true,
    blending: THREE.AdditiveBlending, depthWrite: false
  });

  scene.add(new THREE.Points(starsGeo, starsMat));

  const nebulaGeo = new THREE.BufferGeometry();
  const nCount = 2000;
  const nPos = new Float32Array(nCount * 3);
  const nCol = new Float32Array(nCount * 3);
  for (let i = 0; i < nCount; i++) {
    const r = 300 + Math.random() * 400;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    nPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    nPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    nPos[i*3+2] = r * Math.cos(phi);
    const c = Math.random();
    if (c < 0.33) { nCol[i*3]=0.2; nCol[i*3+1]=0.1; nCol[i*3+2]=0.4; }
    else if (c < 0.66) { nCol[i*3]=0.1; nCol[i*3+1]=0.15; nCol[i*3+2]=0.4; }
    else { nCol[i*3]=0.3; nCol[i*3+1]=0.1; nCol[i*3+2]=0.2; }
  }
  nebulaGeo.setAttribute('position', new THREE.BufferAttribute(nPos, 3));
  nebulaGeo.setAttribute('color', new THREE.BufferAttribute(nCol, 3));
  const nebulaMat = new THREE.PointsMaterial({
    size: 15, vertexColors: true, transparent: true, opacity: 0.15,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  scene.add(new THREE.Points(nebulaGeo, nebulaMat));
}

function createSun() {
  const sunGeo = new THREE.SphereGeometry(4, 64, 64);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd44 });
  sun = new THREE.Mesh(sunGeo, sunMat);
  scene.add(sun);

  const glowGeo = new THREE.SphereGeometry(4.5, 64, 64);
  const glowMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor1: { value: new THREE.Color(0xff6600) },
      uColor2: { value: new THREE.Color(0xffdd00) },
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vPosition;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vPosition = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      varying vec3 vNormal;
      varying vec3 vPosition;
      void main() {
        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
        float pulse = 0.9 + 0.1 * sin(uTime * 2.0);
        vec3 col = mix(uColor1, uColor2, intensity) * pulse;
        gl_FragColor = vec4(col, intensity * 0.8);
      }
    `,
    transparent: true, blending: THREE.AdditiveBlending, side: THREE.FrontSide, depthWrite: false
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  sun.add(glow);
  sun.userData.glow = glow;

  const coronaGeo = new THREE.SphereGeometry(6.5, 64, 64);
  const coronaMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec3 vNormal;
      void main() {
        float intensity = pow(0.5 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
        float flicker = 0.85 + 0.15 * sin(uTime * 3.0 + vNormal.y * 5.0);
        vec3 col = vec3(1.0, 0.4, 0.1) * intensity * flicker;
        gl_FragColor = vec4(col, intensity * 0.4);
      }
    `,
    transparent: true, blending: THREE.AdditiveBlending, side: THREE.FrontSide, depthWrite: false
  });
  sun.add(new THREE.Mesh(coronaGeo, coronaMat));

  const surfaceGeo = new THREE.SphereGeometry(3.98, 128, 128);
  const surfaceMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vNormal;
      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec2 vUv;
      varying vec3 vNormal;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f*f*(3.0-2.0*f);
        return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
                   mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
      }
      float fbm(vec2 p) {
        float v = 0.0, a = 0.5;
        for(int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
        return v;
      }
      void main() {
        vec2 uv = vUv * 4.0;
        float n = fbm(uv + uTime * 0.05);
        float n2 = fbm(uv * 2.0 - uTime * 0.03);
        vec3 hot = vec3(1.0, 0.9, 0.3);
        vec3 cool = vec3(1.0, 0.4, 0.05);
        vec3 dark = vec3(0.8, 0.2, 0.02);
        vec3 col = mix(dark, mix(cool, hot, n), n2);
        float rim = 1.0 - max(dot(vNormal, vec3(0,0,1)), 0.0);
        col += vec3(1.0, 0.6, 0.2) * pow(rim, 2.0) * 0.3;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  sun.add(new THREE.Mesh(surfaceGeo, surfaceMat));
  sun.userData.surfaceMat = surfaceMat;
}

function createPlanetTexture(color, type) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const c = new THREE.Color(color);
  const r = Math.floor(c.r * 255), g = Math.floor(c.g * 255), b = Math.floor(c.b * 255);

  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, 512, 256);

  for (let i = 0; i < 8000; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 256;
    const dr = (Math.random() - 0.5) * 60;
    const dg = (Math.random() - 0.5) * 60;
    const db = (Math.random() - 0.5) * 60;
    const nr = Math.max(0, Math.min(255, r + dr));
    const ng = Math.max(0, Math.min(255, g + dg));
    const nb = Math.max(0, Math.min(255, b + db));
    ctx.fillStyle = `rgba(${Math.floor(nr)},${Math.floor(ng)},${Math.floor(nb)},0.3)`;
    ctx.fillRect(x, y, 2 + Math.random() * 3, 1 + Math.random() * 2);
  }

  if (type === 'gas') {
    for (let band = 0; band < 8; band++) {
      const y = 20 + band * 28 + Math.random() * 10;
      ctx.fillStyle = `rgba(${Math.max(0,r-30)},${Math.max(0,g-30)},${Math.max(0,b-20)},0.4)`;
      ctx.fillRect(0, y, 512, 8 + Math.random() * 12);
    }
  }

  if (type === 'earth') {
    for (let i = 0; i < 12; i++) {
      const x = Math.random() * 512, y = 40 + Math.random() * 176;
      ctx.fillStyle = `rgba(34,120,34,0.6)`;
      ctx.beginPath();
      ctx.ellipse(x, y, 20 + Math.random() * 40, 15 + Math.random() * 25, Math.random(), 0, Math.PI * 2);
      ctx.fill();
    }
    for (let i = 0; i < 5; i++) {
      const x = Math.random() * 512, y = Math.random() * 30;
      ctx.fillStyle = 'rgba(230,240,255,0.5)';
      ctx.beginPath();
      ctx.ellipse(x, y, 30 + Math.random() * 50, 5 + Math.random() * 10, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    for (let i = 0; i < 5; i++) {
      const x = Math.random() * 512, y = 230 + Math.random() * 20;
      ctx.fillStyle = 'rgba(230,240,255,0.5)';
      ctx.beginPath();
      ctx.ellipse(x, y, 30 + Math.random() * 50, 5 + Math.random() * 10, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  return new THREE.CanvasTexture(canvas);
}

function createPlanets() {
  PLANET_DATA.forEach((data, idx) => {
    const type = ['水星','金星','地球','火星'].includes(data.name)
      ? (data.name === '地球' ? 'earth' : 'rocky') : 'gas';
    const tex = createPlanetTexture(data.color, type);

    const geo = new THREE.SphereGeometry(data.radius, 64, 64);
    const mat = new THREE.MeshStandardMaterial({
      map: tex, roughness: 0.8, metalness: 0.1,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.z = data.tilt;
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const pivot = new THREE.Group();
    mesh.position.x = data.distance;
    pivot.add(mesh);

    const a = data.distance;
    const e = data.eccentricity;
    const b = a * Math.sqrt(1 - e * e);
    const cx = a * e;
    const orbitPoints = [];
    for (let i = 0; i <= 128; i++) {
      const angle = (i / 128) * Math.PI * 2;
      orbitPoints.push(new THREE.Vector3(
        cx + a * Math.cos(angle), 0, b * Math.sin(angle)
      ));
    }
    const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
    const orbitMat = new THREE.LineBasicMaterial({
      color: data.color, transparent: true, opacity: 0.25,
      blending: THREE.AdditiveBlending
    });
    const orbitLine = new THREE.Line(orbitGeo, orbitMat);
    scene.add(orbitLine);
    orbitLines.push(orbitLine);

    if (data.hasRings) {
      const innerR = data.radius * 1.4;
      const outerR = data.radius * 2.8;
      const ringGeo = new THREE.RingGeometry(innerR, outerR, 128);
      const ringCanvas = document.createElement('canvas');
      ringCanvas.width = 512; ringCanvas.height = 64;
      const rctx = ringCanvas.getContext('2d');
      const gradient = rctx.createLinearGradient(0, 0, 512, 0);
      gradient.addColorStop(0, 'rgba(200,180,120,0.0)');
      gradient.addColorStop(0.1, 'rgba(200,180,120,0.6)');
      gradient.addColorStop(0.3, 'rgba(180,160,100,0.8)');
      gradient.addColorStop(0.45, 'rgba(160,140,80,0.2)');
      gradient.addColorStop(0.55, 'rgba(200,180,120,0.7)');
      gradient.addColorStop(0.75, 'rgba(180,160,100,0.5)');
      gradient.addColorStop(1, 'rgba(160,140,80,0.0)');
      rctx.fillStyle = gradient;
      rctx.fillRect(0, 0, 512, 64);
      for (let i = 0; i < 2000; i++) {
        const x = Math.random() * 512, y = Math.random() * 64;
        rctx.fillStyle = `rgba(${150+Math.random()*80},${130+Math.random()*60},${80+Math.random()*40},${0.1+Math.random()*0.3})`;
        rctx.fillRect(x, y, 2, 1);
      }
      const ringTex = new THREE.CanvasTexture(ringCanvas);
      const ringMat = new THREE.MeshBasicMaterial({
        map: ringTex, side: THREE.DoubleSide, transparent: true, opacity: 0.85,
        blending: THREE.NormalBlending, depthWrite: false
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2 + data.tilt;
      mesh.add(ring);
    }

    if (data.hasMoon) {
      const moonGeo = new THREE.SphereGeometry(0.27, 32, 32);
      const moonMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.9 });
      const moon = new THREE.Mesh(moonGeo, moonMat);
      const moonPivot = new THREE.Group();
      moon.position.x = 2.2;
      moonPivot.add(moon);
      mesh.add(moonPivot);
      mesh.userData.moonPivot = moonPivot;
    }

    const labelDiv = document.createElement('div');
    labelDiv.style.cssText = `
      position:absolute; color:rgba(255,255,255,0.8); font-size:11px;
      pointer-events:none; text-shadow:0 0 6px rgba(100,150,255,0.6);
      transform:translate(-50%,-100%); padding-bottom:4px; white-space:nowrap;
      letter-spacing:1px;
    `;
    labelDiv.textContent = data.name;
    document.body.appendChild(labelDiv);

    scene.add(pivot);
    planets.push({
      mesh, pivot, data, label: labelDiv,
      angle: Math.random() * Math.PI * 2,
      angularSpeed: (2 * Math.PI) / (data.period * 60),
    });
  });
}

function createAsteroidBelt() {
  const count = 3000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 32 + Math.random() * 6;
    const y = (Math.random() - 0.5) * 1.5;
    pos[i*3] = Math.cos(angle) * r;
    pos[i*3+1] = y;
    pos[i*3+2] = Math.sin(angle) * r;
    sizes[i] = 0.05 + Math.random() * 0.15;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x887766, size: 0.2, transparent: true, opacity: 0.6,
    sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const belt = new THREE.Points(geo, mat);
  scene.add(belt);
}

function setupLighting() {
  const ambient = new THREE.AmbientLight(0x111122, 0.5);
  scene.add(ambient);

  const pointLight = new THREE.PointLight(0xffeedd, 3, 300, 1.5);
  pointLight.position.set(0, 0, 0);
  scene.add(pointLight);

  const sunLight2 = new THREE.PointLight(0xff6600, 1.5, 100, 2);
  sunLight2.position.set(0, 0, 0);
  scene.add(sunLight2);
}

function setupPostProcessing() {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(innerWidth, innerHeight), 1.2, 0.5, 0.3
  );
  composer.addPass(bloomPass);
}

function setupEvents() {
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  });

  document.getElementById('speed').addEventListener('input', e => {
    speed = parseFloat(e.target.value);
  });

  document.getElementById('btnOrbits').addEventListener('click', function() {
    showOrbits = !showOrbits;
    this.classList.toggle('active');
    orbitLines.forEach(l => l.visible = showOrbits);
  });

  document.getElementById('btnLabels').addEventListener('click', function() {
    showLabels = !showLabels;
    this.classList.toggle('active');
  });

  document.getElementById('btnBloom').addEventListener('click', function() {
    showBloom = !showBloom;
    this.classList.toggle('active');
  });

  document.getElementById('btnPause').addEventListener('click', function() {
    paused = !paused;
    this.textContent = paused ? '继续' : '暂停';
  });

  renderer.domElement.addEventListener('click', e => {
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const meshes = planets.map(p => p.mesh);
    const hits = raycaster.intersectObjects(meshes);
    if (hits.length > 0) {
      focusTarget = planets.find(p => p.mesh === hits[0].object);
      focusLerp = 0;
    } else {
      focusTarget = null;
    }
  });

  renderer.domElement.addEventListener('dblclick', () => {
    focusTarget = null;
  });
}

function animate() {
  requestAnimationFrame(animate);

  if (!paused) {
    time += 0.016 * speed;
  }

  if (sun.userData.surfaceMat) {
    sun.userData.surfaceMat.uniforms.uTime.value = time;
  }
  if (sun.userData.glow) {
    sun.userData.glow.material.uniforms.uTime.value = time;
  }
  if (sun.children[1]) {
    sun.children[1].material.uniforms.uTime.value = time;
  }
  sun.rotation.y = time * 0.05;

  planets.forEach(planet => {
    if (!paused) {
      planet.angle += planet.angularSpeed * speed * 0.016 * 60;
    }
    const a = planet.data.distance;
    const e = planet.data.eccentricity;
    const b = a * Math.sqrt(1 - e * e);
    const cx = a * e;

    planet.mesh.position.x = cx + a * Math.cos(planet.angle);
    planet.mesh.position.z = b * Math.sin(planet.angle);

    planet.mesh.rotation.y += planet.data.rotSpeed * 0.01 * speed;

    if (planet.mesh.userData.moonPivot) {
      planet.mesh.userData.moonPivot.rotation.y += 0.02 * speed;
    }

    const worldPos = new THREE.Vector3();
    planet.mesh.getWorldPosition(worldPos);

    if (showLabels) {
      const screenPos = worldPos.clone().project(camera);
      const x = (screenPos.x * 0.5 + 0.5) * innerWidth;
      const y = (-screenPos.y * 0.5 + 0.5) * innerHeight;
      planet.label.style.left = x + 'px';
      planet.label.style.top = (y - planet.data.radius * 8) + 'px';
      planet.label.style.opacity = screenPos.z < 1 ? '1' : '0';
    } else {
      planet.label.style.opacity = '0';
    }
  });

  if (focusTarget) {
    focusLerp = Math.min(focusLerp + 0.02, 1);
    const worldPos = new THREE.Vector3();
    focusTarget.mesh.getWorldPosition(worldPos);
    const offset = new THREE.Vector3(
      focusTarget.data.radius * 4,
      focusTarget.data.radius * 3,
      focusTarget.data.radius * 4
    );
    const targetCamPos = worldPos.clone().add(offset);
    camera.position.lerp(targetCamPos, focusLerp * 0.05);
    controls.target.lerp(worldPos, focusLerp * 0.05);
  }

  controls.update();

  if (showBloom) {
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
}
</script>
</body>
</html>
