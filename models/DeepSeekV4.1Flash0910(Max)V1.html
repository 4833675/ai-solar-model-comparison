<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>太阳系 · 实时 WebGL2 模拟</title>
<style>
  :root{
    --bg:#04060b;
    --glass:rgba(10,14,22,.62);
    --line:rgba(140,190,255,.14);
    --line-hi:rgba(140,200,255,.34);
    --txt:#c8d6ea;
    --txt-dim:#6c7f99;
    --accent:#7fd4ff;
    --accent2:#ffb464;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.dragging{cursor:grabbing}

  /* ---------- labels ---------- */
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;
    font-size:11px;letter-spacing:.14em;color:rgba(200,225,255,.82);
    text-shadow:0 0 10px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,1);
    will-change:transform,opacity;transition:opacity .18s linear;pointer-events:none}
  .lbl .dot{display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);margin-right:6px;vertical-align:middle;
    box-shadow:0 0 6px var(--accent);opacity:.9}
  .lbl.moon{font-size:10px;letter-spacing:.1em;color:rgba(175,200,230,.62)}
  .lbl.moon .dot{width:3px;height:3px;background:rgba(160,195,235,.8);box-shadow:none;margin-right:5px}
  .lbl.sun .dot{background:var(--accent2);box-shadow:0 0 8px var(--accent2)}

  /* ---------- panels ---------- */
  .panel{position:fixed;z-index:10;background:var(--glass);
    -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--line);border-radius:12px;
    box-shadow:0 8px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.045);
    transition:opacity .35s ease,transform .35s cubic-bezier(.2,.8,.3,1)}
  .panel.hidden{opacity:0;pointer-events:none;transform:translateY(6px) scale(.985)}

  #brand{left:20px;top:18px;padding:13px 17px 12px;min-width:236px}
  #brand h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.22em;color:#e6f0ff}
  #brand .sub{margin-top:4px;font-size:9.5px;letter-spacing:.2em;color:var(--txt-dim);text-transform:uppercase}
  #clock{margin-top:11px;font-family:var(--mono);font-size:19px;letter-spacing:.06em;color:var(--accent);
    font-variant-numeric:tabular-nums;line-height:1.15;text-shadow:0 0 18px rgba(127,212,255,.35)}
  #clockdate{font-family:var(--mono);font-size:10.5px;color:var(--txt-dim);letter-spacing:.1em;margin-top:3px}
  #rate{margin-top:9px;font-family:var(--mono);font-size:10px;color:var(--txt-dim);letter-spacing:.08em}
  #rate b{color:var(--accent2);font-weight:500}

  #bodylist{left:20px;bottom:20px;padding:8px;max-height:44vh;overflow-y:auto;width:212px;
    scrollbar-width:thin;scrollbar-color:rgba(120,160,210,.28) transparent}
  #bodylist::-webkit-scrollbar{width:5px}
  #bodylist::-webkit-scrollbar-thumb{background:rgba(120,160,210,.28);border-radius:3px}
  .bitem{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;cursor:pointer;
    font-size:11.5px;letter-spacing:.05em;color:var(--txt);transition:background .14s,color .14s}
  .bitem:hover{background:rgba(127,212,255,.09)}
  .bitem.active{background:rgba(127,212,255,.15);color:#fff}
  .bitem .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
  .bitem .en{font-family:var(--mono);font-size:8.5px;color:var(--txt-dim);margin-left:auto;letter-spacing:.08em}
  .bitem.active .en{color:rgba(127,212,255,.75)}
  .bgroup{padding:8px 9px 4px;font-size:9px;letter-spacing:.2em;color:var(--txt-dim);
    text-transform:uppercase;font-family:var(--mono)}

  #settings{right:20px;top:18px;padding:14px 16px 15px;width:262px}
  #settings .stitle{font-size:9.5px;letter-spacing:.22em;color:var(--txt-dim);text-transform:uppercase;
    font-family:var(--mono);margin-bottom:11px;display:flex;align-items:center;gap:8px}
  #settings .stitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;font-size:11px;letter-spacing:.04em}
  .row .k{color:var(--txt);white-space:nowrap}
  .row .v{font-family:var(--mono);font-size:10px;color:var(--accent);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;margin:2px 0 4px}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(140,190,255,.2);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--accent);margin-top:-4.5px;box-shadow:0 0 10px rgba(127,212,255,.8);border:none}
  input[type=range]::-moz-range-track{height:2px;background:rgba(140,190,255,.2);border-radius:2px}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px rgba(127,212,255,.8)}
  .sw-toggle{position:relative;width:34px;height:18px;border-radius:9px;background:rgba(140,190,255,.14);
    border:1px solid var(--line);cursor:pointer;transition:background .18s,border-color .18s;flex:0 0 auto}
  .sw-toggle::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
    background:rgba(180,210,240,.6);transition:transform .18s cubic-bezier(.3,1.4,.5,1),background .18s}
  .sw-toggle.on{background:rgba(127,212,255,.26);border-color:var(--line-hi)}
  .sw-toggle.on::after{transform:translateX(16px);background:var(--accent);box-shadow:0 0 9px var(--accent)}

  #info{right:20px;bottom:20px;padding:13px 16px 14px;width:262px}
  #info .iname{font-size:15px;font-weight:600;letter-spacing:.1em;color:#eaf3ff}
  #info .ien{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--accent);
    text-transform:uppercase;margin-top:2px}
  #info .idesc{font-size:10.5px;line-height:1.65;color:var(--txt-dim);margin-top:9px;letter-spacing:.02em}
  #info .igrid{margin-top:11px;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:10.5px}
  #info .igrid .k{color:var(--txt-dim);letter-spacing:.04em;white-space:nowrap}
  #info .igrid .v{font-family:var(--mono);color:var(--txt);text-align:right;font-variant-numeric:tabular-nums;font-size:10px}

  #hint{left:50%;bottom:22px;transform:translateX(-50%);padding:8px 16px;border-radius:20px;
    font-size:10px;letter-spacing:.1em;color:var(--txt-dim);font-family:var(--mono);white-space:nowrap}
  #hint.hidden{transform:translateX(-50%) translateY(6px) scale(.985)}
  #hint b{color:var(--accent);font-weight:500}

  #toast{left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 34px;text-align:center;
    font-size:12px;letter-spacing:.1em;line-height:1.8;color:var(--txt);max-width:min(440px,86vw);border-radius:14px}
  #toast b{color:var(--accent);font-weight:600}
  #toast .big{font-size:15px;color:#fff;letter-spacing:.2em;margin-bottom:8px;font-weight:600}

  #boot{position:fixed;inset:0;z-index:50;background:#04060b;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;transition:opacity .9s ease}
  #boot.out{opacity:0;pointer-events:none}
  #boot .t{font-size:11px;letter-spacing:.42em;color:var(--txt-dim);font-family:var(--mono)}
  #boot .bar{width:190px;height:1px;background:rgba(140,190,255,.15);overflow:hidden;position:relative}
  #boot .bar i{position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:sl 1.15s linear infinite}
  @keyframes sl{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

  @media (max-width:900px){
    #settings{display:none}
    #info{display:none}
    #bodylist{max-height:32vh;width:180px}
    #hint{display:none}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<div class="panel" id="brand">
  <h1>太阳系</h1>
  <div class="sub">Solar System · WebGL2</div>
  <div id="clock">--:--:--</div>
  <div id="clockdate">----</div>
  <div id="rate">时间流速 <b>1</b> 天/秒</div>
</div>

<div class="panel" id="bodylist"></div>

<div class="panel" id="settings">
  <div class="stitle">控制台</div>
  <div class="row"><span class="k">时间流速</span><span class="v" id="v-speed">1.0×</span></div>
  <input type="range" id="s-speed" min="0" max="1000" value="100">
  <div class="row"><span class="k">曝光</span><span class="v" id="v-expo">0.0 EV</span></div>
  <input type="range" id="s-expo" min="-60" max="60" value="0">
  <div class="row"><span class="k">行星尺寸</span><span class="v" id="v-size">1.0×</span></div>
  <input type="range" id="s-size" min="30" max="320" value="100">
  <div class="row"><span class="k">渲染倍率</span><span class="v" id="v-res">1.00×</span></div>
  <input type="range" id="s-res" min="60" max="200" value="100">
  <div class="row"><span class="k">自动曝光</span><div class="sw-toggle on" id="t-auto"></div></div>
  <div class="row"><span class="k">物理光照衰减</span><div class="sw-toggle on" id="t-phys"></div></div>
  <div class="row"><span class="k">紧凑距离</span><div class="sw-toggle" id="t-dist"></div></div>
  <div class="row"><span class="k">轨道线</span><div class="sw-toggle on" id="t-orb"></div></div>
  <div class="row"><span class="k">标签</span><div class="sw-toggle on" id="t-lbl"></div></div>
  <div class="row"><span class="k">小行星带</span><div class="sw-toggle on" id="t-ast"></div></div>
  <div class="row"><span class="k">泛光</span><div class="sw-toggle on" id="t-bloom"></div></div>
</div>

<div class="panel" id="info"></div>
<div class="panel" id="hint"><b>拖拽</b> 旋转 · <b>滚轮</b> 缩放 · <b>点击天体</b> 跟随 · <b>空格</b> 暂停 · <b>H</b> 隐藏界面</div>

<div id="boot"><div class="t">INITIALIZING EPHEMERIS</div><div class="bar"><i></i></div></div>

<script>
"use strict";
(function(){

/* ==================================================================================
   0. 常量与工具
   ================================================================================== */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const UNITS_PER_AU = 20.0;          // 1 天文单位 = 20 世界单位
const SUN_ANGULAR_R = 0.00465047;   // 太阳半径 (AU)
const OBJ_EPS = 0.0035;             // 法线扰动采样步长

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function mixv(a, b, t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }
function len3(v){ return Math.hypot(v[0], v[1], v[2]); }
function norm3(v){ const l = len3(v) || 1; return [v[0]/l, v[1]/l, v[2]/l]; }
function cross3(a, b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function dot3(a, b){ return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function add3(a, b){ return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
function sub3(a, b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function scl3(a, s){ return [a[0]*s, a[1]*s, a[2]*s]; }

/* ---- mat4 (column-major) ---- */
function m4(){ return new Float32Array(16); }
function m4identity(o){ o.fill(0); o[0]=o[5]=o[10]=o[15]=1; return o; }
function m4mul(o, a, b){
  const t = m4();
  for (let i = 0; i < 4; i++){
    const a0 = a[i], a1 = a[i+4], a2 = a[i+8], a3 = a[i+12];
    t[i]      = a0*b[0]  + a1*b[1]  + a2*b[2]  + a3*b[3];
    t[i+4]    = a0*b[4]  + a1*b[5]  + a2*b[6]  + a3*b[7];
    t[i+8]    = a0*b[8]  + a1*b[9]  + a2*b[10] + a3*b[11];
    t[i+12]   = a0*b[12] + a1*b[13] + a2*b[14] + a3*b[15];
  }
  o.set(t); return o;
}
function m4persp(o, fovy, aspect, near, far){
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  o.fill(0);
  o[0] = f / aspect; o[5] = f;
  o[10] = (far + near) * nf; o[11] = -1;
  o[14] = 2 * far * near * nf;
  return o;
}
function m4lookAt(o, eye, center, up){
  let zx = eye[0]-center[0], zy = eye[1]-center[1], zz = eye[2]-center[2];
  let l = Math.hypot(zx, zy, zz) || 1; zx/=l; zy/=l; zz/=l;
  let xx = up[1]*zz - up[2]*zy, xy = up[2]*zx - up[0]*zz, xz = up[0]*zy - up[1]*zx;
  l = Math.hypot(xx, xy, xz);
  if (l < 1e-7){ xx = 1; xy = 0; xz = 0; } else { xx/=l; xy/=l; xz/=l; }
  const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
  o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0;
  o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0;
  o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
  o[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  o[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  o[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
  o[15]=1;
  return o;
}
function m4invert(o, m){
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],
        a10=m[4],a11=m[5],a12=m[6],a13=m[7],
        a20=m[8],a21=m[9],a22=m[10],a23=m[11],
        a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10,
        b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12,
        b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30,
        b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
  let det = b00*b11 - b01*b10 + b02*b09 + b03*b08 - b04*b07 + b05*b06;
  if (!det) return m4identity(o);
  det = 1 / det;
  o[0]=(a11*b11-a12*b10+a13*b09)*det;  o[1]=(a02*b10-a01*b11-a03*b09)*det;
  o[2]=(a31*b05-a32*b04+a33*b03)*det;  o[3]=(a22*b04-a21*b05-a23*b03)*det;
  o[4]=(a12*b08-a10*b11-a13*b07)*det;  o[5]=(a00*b11-a02*b08+a03*b07)*det;
  o[6]=(a32*b02-a30*b05-a33*b01)*det;  o[7]=(a20*b05-a22*b02+a23*b01)*det;
  o[8]=(a10*b10-a11*b08+a13*b06)*det;  o[9]=(a01*b08-a00*b10-a03*b06)*det;
  o[10]=(a30*b04-a31*b02+a33*b00)*det; o[11]=(a21*b02-a20*b04-a23*b00)*det;
  o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det;
  o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;
  return o;
}

/* ==================================================================================
   1. WebGL2 初始化
   ================================================================================== */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', {
  alpha:false, antialias:false, depth:true, stencil:false,
  premultipliedAlpha:false, preserveDrawingBuffer:false,
  powerPreference:'high-performance'
});

if (!gl){
  document.getElementById('boot').innerHTML =
    '<div class="big">无法启动</div><div>当前浏览器不支持 WebGL2。<br>请使用最新版 Chrome / Edge / Safari / Firefox。</div>';
  return;
}

const EXT_CBF   = gl.getExtension('EXT_color_buffer_float');
const EXT_FLT   = gl.getExtension('OES_texture_float_linear');
const HDR_FMT   = EXT_CBF ? gl.RGBA16F : gl.RGBA8;
const HDR_TYPE  = EXT_CBF ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

/* ==================================================================================
   2. 着色器源码
   ================================================================================== */
const VS_QUAD = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
out vec2 vUV;
void main(){ vUV = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

/* ---------- 通用噪声库 ---------- */
const NOISE = `
vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec4 mod289(vec4 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314*r; }

float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
             i.z + vec4(0.0, i1.z, i2.z, 1.0))
           + i.y + vec4(0.0, i1.y, i2.y, 1.0))
           + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4( x.xy, y.xy );
  vec4 b1 = vec4( x.zw, y.zw );
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

float fbm(vec3 p, int oct){
  float a = 0.5, f = 1.0, s = 0.0;
  for(int i=0;i<9;i++){
    if(i>=oct) break;
    s += a * snoise(p*f);
    f *= 2.03; a *= 0.5;
  }
  return s;
}
float fbmN(vec3 p, int oct){          // 归一化到 ~[-1,1]
  float a = 0.5, f = 1.0, s = 0.0, n = 0.0;
  for(int i=0;i<9;i++){
    if(i>=oct) break;
    s += a * snoise(p*f); n += a;
    f *= 2.03; a *= 0.5;
  }
  return s/max(n,1e-4);
}
float ridged(vec3 p, int oct){
  float a = 0.5, f = 1.0, s = 0.0;
  for(int i=0;i<9;i++){
    if(i>=oct) break;
    s += a * (1.0 - abs(snoise(p*f)));
    f *= 2.11; a *= 0.5;
  }
  return s;
}
float hash13(vec3 p){
  p = fract(p*0.3183099 + 0.1); p *= 17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}
vec3 hash33(vec3 p){
  p = vec3(dot(p,vec3(127.1,311.7,74.7)), dot(p,vec3(269.5,183.3,246.1)), dot(p,vec3(113.5,271.9,124.6)));
  return fract(sin(p)*43758.5453123);
}
vec3 mapDist(vec3 pAU, float dMix, float upa){
  float d = length(pAU);
  float dn = mix(d, pow(max(d,1e-6), 0.52), dMix);
  return pAU * (dn/max(d,1e-6)) * upa;
}
`;

/* ---------- 天空盒：银河 + 星云 + 深空底噪 ---------- */
const FS_SKY = `#version 300 es
precision highp float;
in vec2 vUV;
out vec4 fragColor;
uniform mat4 uInvVP;
uniform vec3 uCamPos;
uniform mat3 uGal;
uniform float uTime;
${NOISE}

void main(){
  vec4 p = uInvVP * vec4(vUV*2.0-1.0, 1.0, 1.0);
  vec3 dir = normalize(p.xyz/p.w - uCamPos);

  // 深空底色：极暗的冷色渐变
  vec3 col = mix(vec3(0.0022,0.0032,0.0060), vec3(0.0011,0.0014,0.0026), dir.y*0.5+0.5);

  // ---- 银河带 ----
  vec3 g = uGal * dir;
  float bandW = 2.55;
  float band = exp(-pow(abs(g.y)*bandW, 1.7));

  float n1 = fbmN(g*2.1, 4);
  float n2 = fbmN(g*5.3 + 13.7, 4);
  float n3 = fbmN(g*11.0 + 41.3, 3);

  // 尘埃带（减光）
  float dust = smoothstep(0.05, 0.62, fbmN(g*3.4 + 7.1, 4)*0.5+0.5);
  dust = mix(dust, dust*0.55, smoothstep(0.0, 0.9, abs(g.y)*bandW*0.5));

  // 星云色调：核心偏暖，外围偏蓝
  vec3 warm = vec3(0.62,0.47,0.34);
  vec3 cool = vec3(0.26,0.34,0.58);
  vec3 mwCol = mix(cool, warm, smoothstep(-0.4,0.55,n1));
  mwCol = mix(mwCol, vec3(0.72,0.66,0.60), smoothstep(0.25,0.85,n2));

  float bright = (0.30 + 0.70*smoothstep(-0.55,0.65,n1)) * (0.62 + 0.38*smoothstep(-0.3,0.8,n2));
  bright *= (1.0 - 0.80*dust);
  bright += 0.28*pow(max(0.0,n3),3.0);

  col += mwCol * band * bright * 0.052;

  // 银河核心增亮（银心方向，沿银道面拉长）
  vec3 gc = (g - vec3(1.0,0.0,0.0)) * vec3(1.0, 2.6, 1.0);
  float core = exp(-dot(gc,gc)*3.0);
  col += vec3(0.55,0.44,0.30) * core * 0.055;

  // ---- 黄道光（极淡） ----
  float zod = exp(-pow(abs(dir.y)*3.4, 1.5));
  col += vec3(0.10,0.09,0.075) * zod * 0.010;

  fragColor = vec4(max(col, 0.0), 1.0);
}`;

const VS_STARS = `#version 300 es

const FS_STARS = `#version 300 es

/* ---------- 天体表面 ---------- */
const VS_BODY = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
uniform mat4 uVP;
uniform mat4 uModel;
uniform mat3 uNormalMat;
uniform vec3 uCamPos;
out vec3 vPos;

const FS_BODY = `#version 300 es
precision highp float;
in vec3 vPos;
in vec3 vWorld;
out vec4 fragColor;

uniform vec3  uCamPos;
uniform vec3  uSunPos;
uniform vec3  uSunColor;
uniform float uSunIntensity;
uniform float uTime;
uniform float uCloudTime;
uniform int   uType;
uniform float uRadius;
uniform mat3  uNormalMat;
uniform float uUnitsPerAU;
uniform float uPhysical;
uniform vec3  uShadowCenter;
uniform float uShadowRadius;
uniform float uShadowSoft;
uniform vec4  uRing;         // x=inner, y=outer (行星半径单位), z=启用, w=密度
uniform vec3  uRingNormal;
uniform vec3  uPlanetCenter;
uniform float uRingTau;
${NOISE}

/* ============ 地形高度场 ============ */
float terrain(vec3 d, int type){
  if(type == 0){                                  // 太阳
    vec3 w = d*3.0;
    float n = fbmN(w + fbmN(w*2.3,3)*0.55, 5);
    float g = fbmN(d*26.0, 4)*0.5;
    return n*0.55 + g;
  } else if(type == 1){                           // 岩石（水星/月球/木卫）
    float h = fbmN(d*3.2, 5)*0.55;
    h += (ridged(d*8.5, 4) - 1.05)*0.30;
    h += fbmN(d*26.0, 3)*0.055;
    return h;
  } else if(type == 2){                           // 金星云
    vec3 w = d*2.0 + vec3(fbmN(d*3.0,3))*0.7;
    return fbmN(w*2.4, 4)*0.5 + fbmN(d*9.0,3)*0.10;
  } else if(type == 3){                           // 地球
    float c = fbmN(d*2.55 + vec3(1.7,0.0,0.0), 6);
    float m = fbmN(d*5.0, 5)*0.30;
    return c + m;
  } else if(type == 4){                           // 火星
    float h = fbmN(d*2.9, 5)*0.5;
    h += (ridged(d*7.0, 4)-1.05)*0.22;
    h += fbmN(d*22.0, 3)*0.05;
    return h;
  } else if(type == 5 || type == 6 || type == 7){  // 气态巨行星
    float lat = asin(clamp(d.y,-1.0,1.0));
    float warp = fbmN(d*2.6 + vec3(0.0, uCloudTime*0.008, 0.0), 4)*0.42;
    return sin(lat*22.0 + warp*3.4)*0.09 + fbmN(d*7.0, 3)*0.05;
  } else if(type == 8){                           // 冰卫星
    float h = fbmN(d*4.0, 5)*0.45;
    h += (ridged(d*13.0, 4)-1.05)*0.28;
    h += fbmN(d*40.0, 3)*0.04;
    return h;
  } else if(type == 9){                           // 土卫六（雾霭）
    return fbmN(d*2.2, 4)*0.35;
  }
  float h = fbmN(d*3.5, 5)*0.5 + (ridged(d*9.0,4)-1.05)*0.25;
  return h;                                       // 冥王星
}

vec3 surfaceNormal(vec3 d, int type){
  vec3 up = abs(d.y) < 0.99 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);
  vec3 t = normalize(cross(up, d));
  vec3 b = cross(d, t);
  float h0 = terrain(d, type);
  float h1 = terrain(normalize(d + t*${OBJ_EPS.toFixed(4)}), type);
  float h2 = terrain(normalize(d + b*${OBJ_EPS.toFixed(4)}), type);
  float amp = (type == 5 || type == 6 || type == 7) ? 1.1 : 5.2;
  if(type == 0) amp = 1.6;
  if(type == 3) amp = 4.0;
  return normalize(d - (t*(h1-h0) + b*(h2-h0))*amp);
}

/* ============ 表面反照率 ============ */
void shade(vec3 d, out vec3 albedo, out float rough, out float specAmt, out vec3 emis){
  albedo = vec3(0.5); rough = 0.8; specAmt = 0.0; emis = vec3(0.0);

  if(uType == 0){                                  // ---------- 太阳 ----------
    float h = terrain(d, 0);
    float gran = smoothstep(-0.35, 0.75, h);
    vec3 c = mix(vec3(0.55,0.115,0.012), vec3(1.0,0.62,0.20), gran);
    c = mix(c, vec3(1.0,0.93,0.74), smoothstep(0.55,0.98,h)*0.9);
    // 米粒组织
    float g2 = fbmN(d*60.0 + vec3(uTime*0.05), 3);
    c *= 0.86 + 0.30*smoothstep(-0.4,0.6,g2);
    // 太阳黑子
    float sp = fbmN(d*4.2 + vec3(4.1,2.0,7.7), 4);
    float spot = smoothstep(0.42, 0.62, sp);
    c = mix(c, vec3(0.30,0.055,0.008), spot*0.85);
    albedo = c; emis = c; rough = 1.0;
    return;
  }

  if(uType == 1){                                  // ---------- 岩石 ----------
    float h = terrain(d, 1);
    float n = fbmN(d*9.0, 4)*0.5+0.5;
    vec3 base = mix(vec3(0.30,0.285,0.27), vec3(0.52,0.48,0.44), smoothstep(-0.2,0.5,h));
    base = mix(base, vec3(0.22,0.20,0.19), smoothstep(0.35,0.85,n)*0.55);
    base *= 0.85 + 0.30*(fbmN(d*45.0,3)*0.5+0.5);
    albedo = base; rough = 0.94; specAmt = 0.03;
    return;
  }

  if(uType == 2){                                  // ---------- 金星 ----------
    float h = terrain(d, 2);
    float v = smoothstep(-0.5,0.7,h);
    vec3 c = mix(vec3(0.56,0.47,0.30), vec3(0.80,0.73,0.55), v);
    c = mix(c, vec3(0.72,0.59,0.37), smoothstep(0.4,0.95,fbmN(d*7.0,4)*0.5+0.5)*0.6);
    // 硫酸云涡旋
    float sw = fbmN(vec3(d.xz*3.0, d.y*7.0) + fbmN(d*2.0,3)*0.9, 4);
    c *= 0.88 + 0.24*smoothstep(-0.5,0.6,sw);
    albedo = c; rough = 0.72; specAmt = 0.05;
    return;
  }

  if(uType == 3){                                  // ---------- 地球 ----------
    float c = fbmN(d*2.55 + vec3(1.7,0.0,0.0), 6);
    float detail = fbmN(d*9.0, 5);
    float land = smoothstep(0.012, 0.055, c + detail*0.22);
    float lat = abs(d.y);
    float hh = (c + detail*0.22);

    // 海洋
    vec3 deep = vec3(0.006,0.030,0.088);
    vec3 shallow = vec3(0.020,0.115,0.215);
    vec3 ocean = mix(deep, shallow, smoothstep(-0.5, 0.02, hh));
    ocean *= 0.85 + 0.3*(fbmN(d*18.0,3)*0.5+0.5);

    // 陆地：按纬度 + 高度着色
    float arid = smoothstep(-0.35, 0.45, fbmN(d*3.6 + 31.0, 4));
    vec3 green = vec3(0.075,0.150,0.058);
    vec3 forest= vec3(0.045,0.105,0.048);
    vec3 desert= vec3(0.420,0.320,0.170);
    vec3 rock  = vec3(0.250,0.215,0.175);
    vec3 landC = mix(green, forest, smoothstep(-0.2,0.4,detail));
    landC = mix(landC, desert, smoothstep(0.35,0.85,arid)*0.9);
    landC = mix(landC, rock, smoothstep(0.28,0.62,hh)*0.55);
    landC *= 0.88 + 0.24*(fbmN(d*28.0,3)*0.5+0.5);

    // 极地冰盖
    float iceN = fbmN(d*7.0, 4)*0.16;
    float ice = smoothstep(0.775, 0.90, lat + iceN) * smoothstep(-0.3, 0.3, hh+0.15);
    ice = max(ice, smoothstep(0.86,0.94, lat+iceN*0.5)*0.9);

    vec3 c3 = mix(ocean, landC, land);
    c3 = mix(c3, vec3(0.86,0.90,0.95), ice);

    // 云层
    vec3 cw = d*2.4 + vec3(fbmN(d*1.6,3))*0.9;
    cw.xz += uCloudTime*0.0035;
    float cl = fbmN(cw*1.9, 5);
    float cl2 = fbmN(cw*6.5, 4);
    float cloud = smoothstep(0.10, 0.62, cl + cl2*0.35);
    float bandv = 0.55 + 0.45*sin(lat*9.0 + 1.2);      // 赤道辐合带 + 中纬风暴带
    cloud *= 0.45 + 0.55*bandv;
    cloud *= 1.0 - 0.35*smoothstep(0.80,0.95,lat);     // 极区少云
    c3 = mix(c3, vec3(0.92,0.94,0.97), clamp(cloud,0.0,1.0)*0.94);

    // 夜面城市灯光
    float nightSide = 0.0;
    albedo = c3; rough = mix(0.16, 0.86, land); specAmt = (1.0-land)*0.85;
    // 由外层主函数计算 ndl 后叠加，这里先存掩码
    emis = vec3(0.0);
    // 用经纬度分布模拟人口
    float pop = smoothstep(0.30, 0.78, fbmN(d*22.0 + 77.0, 4)*0.5+0.5);
    pop *= (1.0 - smoothstep(0.62, 0.86, lat));
    pop *= land * (1.0 - clamp(cloud,0.0,1.0)*0.8);
    pop *= 1.0 - smoothstep(0.30,0.75, ice);
    emis = vec3(1.0,0.66,0.30) * pop * 1.35;
    return;
  }

  if(uType == 4){                                  // ---------- 火星 ----------
    float h = terrain(d, 4);
    float lat = abs(d.y);
    vec3 rust = vec3(0.415,0.185,0.098);
    vec3 dark = vec3(0.235,0.115,0.070);
    vec3 pale = vec3(0.560,0.330,0.190);
    vec3 c = mix(rust, dark, smoothstep(-0.15,0.45, fbmN(d*4.4+9.0,4)*0.5+0.5)*0.8);
    c = mix(c, pale, smoothstep(0.15,0.7,h)*0.55);
    c *= 0.86 + 0.28*(fbmN(d*30.0,3)*0.5+0.5);
    // 极冠
    float cap = smoothstep(0.855, 0.945, lat + fbmN(d*9.0,3)*0.10);
    c = mix(c, vec3(0.92,0.94,0.97), cap*0.92);
    albedo = c; rough = 0.92; specAmt = 0.04;
    return;
  }

  if(uType == 5 || uType == 6 || uType == 7){       // ---------- 气态巨行星 ----------
    float lat = asin(clamp(d.y,-1.0,1.0));
    vec3 warpN = vec3(fbmN(d*2.2,4), 0.0, fbmN(d*2.2+19.0,4));
    float turb = fbmN(d*5.5 + warpN*1.6, 5);
    float bandSig = sin(lat*${'22.0'} + turb*2.6 + uCloudTime*0.012);

    vec3 cA, cB, cC;
    float bandFreq;
    if(uType == 5){                               // 木星
      cA = vec3(0.720,0.610,0.455); cB = vec3(0.420,0.315,0.230); cC = vec3(0.880,0.820,0.720);
      bandFreq = 1.0;
    } else if(uType == 6){                        // 土星
      cA = vec3(0.780,0.700,0.520); cB = vec3(0.560,0.480,0.340); cC = vec3(0.900,0.850,0.700);
      bandFreq = 0.82;
    } else {                                      // 天王/海王
      cA = vec3(0.320,0.640,0.760); cB = vec3(0.130,0.320,0.520); cC = vec3(0.600,0.830,0.900);
      bandFreq = 0.55;
    }
    if(uType == 7){ cA = vec3(0.190,0.330,0.700); cB = vec3(0.070,0.150,0.420); cC = vec3(0.520,0.680,0.940); }

    vec3 c = mix(cA, cB, smoothstep(-0.55,0.75, bandSig)*bandFreq);
    c = mix(c, cC, smoothstep(0.55,1.0, bandSig)*0.55);
    // 纬向条带细节
    float fine = fbmN(vec3(d.x*2.4, d.y*44.0, d.z*2.4), 4);
    c *= 0.90 + 0.20*smoothstep(-0.5,0.6,fine);
    // 极区变暗
    c *= 1.0 - 0.32*smoothstep(0.72,0.99, abs(d.y));

    // 大红斑（木星）
    if(uType == 5){
      float lon = atan(d.z, d.x);
      vec2 uv = vec2(lon, asin(clamp(d.y,-1.0,1.0)));
      vec2 ctr = vec2(${'2.36'}, ${'-0.36'});
      vec2 dd = uv - ctr;
      dd.x = atan(sin(dd.x), cos(dd.x));
      float rr = length(dd/vec2(0.46,0.145));
      float spot = smoothstep(1.15, 0.25, rr);
      float swirl = fbmN(vec3(dd*7.0, uCloudTime*0.02), 3);
      vec3 grs = mix(vec3(0.72,0.30,0.16), vec3(0.92,0.58,0.38), swirl*0.5+0.5);
      c = mix(c, grs, spot*0.92);
      // 周围湍流尾迹
      c *= 1.0 - 0.16*smoothstep(0.35,1.4,rr)*smoothstep(2.2,0.6,rr);
    }
    // 海王星大暗斑
    if(uType == 7){
      float lon = atan(d.z, d.x);
      vec2 uv = vec2(lon, asin(clamp(d.y,-1.0,1.0)));
      vec2 dd = uv - vec2(-1.1, -0.42);
      dd.x = atan(sin(dd.x), cos(dd.x));
      float rr = length(dd/vec2(0.38,0.13));
      c = mix(c, vec3(0.045,0.095,0.30), smoothstep(1.0,0.2,rr)*0.85);
    }
    // 土星/木星表面的细微环影由外层处理
    albedo = c; rough = 0.55; specAmt = 0.04;
    return;
  }

  if(uType == 8){                                  // ---------- 冰卫星 ----------
    float h = terrain(d, 8);
    vec3 ice = vec3(0.82,0.85,0.90);
    vec3 tan_ = vec3(0.60,0.54,0.46);
    vec3 c = mix(tan_, ice, smoothstep(-0.1,0.5,h));
    c *= 0.88 + 0.22*(fbmN(d*38.0,3)*0.5+0.5);
    // 裂纹
    float cr = abs(fbmN(d*7.0, 4));
    c = mix(c, vec3(0.42,0.36,0.32), smoothstep(0.055,0.0,cr)*0.75);
    albedo = c; rough = 0.42; specAmt = 0.25;
    return;
  }

  if(uType == 9){                                  // ---------- 土卫六 ----------
    float h = terrain(d, 9);
    vec3 c = mix(vec3(0.62,0.44,0.19), vec3(0.88,0.68,0.34), smoothstep(-0.4,0.6,h));
    c *= 0.92 + 0.16*(fbmN(d*12.0,3)*0.5+0.5);
    albedo = c; rough = 0.75; specAmt = 0.03;
    return;
  }

  /* 冥王星 */
  float h = terrain(d, 10);
  vec3 c = mix(vec3(0.36,0.30,0.26), vec3(0.76,0.71,0.64), smoothstep(-0.3,0.55,h));
  c = mix(c, vec3(0.60,0.44,0.32), smoothstep(0.25,0.8,fbmN(d*6.0+3.0,4)*0.5+0.5)*0.6);
  c *= 0.88 + 0.22*(fbmN(d*26.0,3)*0.5+0.5);
  albedo = c; rough = 0.9; specAmt = 0.05;
}

float ringDensity(float r){
  float n = fbmN(vec3(r*30.0, 0.0, 0.0), 4)*0.5 + 0.5;
  float d = 0.42 + 0.62*n;
  d *= 1.0 - 0.94*smoothstep(1.88,1.94,r)*(1.0-smoothstep(2.02,2.08,r));   // 卡西尼缝
  d *= 1.0 - 0.72*smoothstep(2.185,2.198,r)*(1.0-smoothstep(2.212,2.225,r)); // 恩克缝
  d *= 1.0 - 0.45*smoothstep(1.58,1.63,r)*(1.0-smoothstep(1.66,1.70,r));
  d *= smoothstep(1.115,1.20,r);
  d *= 1.0 - smoothstep(2.21,2.275,r);
  return clamp(d, 0.0, 1.0);
}

void main(){
  vec3 d = normalize(vPos);
  vec3 nObj = surfaceNormal(d, uType);
  vec3 N = normalize(uNormalMat * nObj);
  vec3 toSun = uSunPos - vWorld;
  float sunDist = length(toSun);
  vec3 L = toSun / max(sunDist, 1e-6);
  vec3 V = normalize(uCamPos - vWorld);

  float distAU = sunDist / uUnitsPerAU;
  // 物理平方反比，带曝光宽容度下限，避免外行星完全不可见
  float atten = uPhysical > 0.5
      ? max(1.0 / max(distAU*distAU, 1e-5), 0.012)
      : 1.0 / max(pow(distAU, 0.78), 0.22);

  vec3 albedo; float rough; float specAmt; vec3 emis;
  shade(d, albedo, rough, specAmt, emis);

  /* ---- 太阳：自发光 ---- */
  if(uType == 0){
    float mu = clamp(dot(N, V), 0.0, 1.0);
    float limb = 1.0 - 0.62*(1.0 - pow(mu, 0.55));      // 临边昏暗
    vec3 c = emis * limb * 2.8;
    c += vec3(1.0,0.55,0.18) * pow(1.0-mu, 3.2) * 0.55;  // 边缘色球
    fragColor = vec4(c, 1.0);
    return;
  }

  /* ---- 阴影：行星投在卫星上 ---- */
  float shadow = 1.0;
  if(uShadowRadius > 0.0){
    vec3 oc = uShadowCenter - vWorld;
    float tca = dot(oc, L);
    if(tca > 0.0){
      float d2 = dot(oc,oc) - tca*tca;
      float r = uShadowRadius;
      if(d2 < r*r){
        float s = sqrt(max(d2,0.0)) / r;
        shadow = smoothstep(1.0 - uShadowSoft, 1.0, s);
      }
    }
  }

  /* ---- 阴影：行星环投在行星上 ---- */
  float ringShadow = 1.0;
  if(uRing.z > 0.5 && uRingTau > 0.0){
    vec3 rel = vWorld - uPlanetCenter;
    float dn = dot(uRingNormal, L);
    if(abs(dn) > 1e-4){
      float t = -dot(uRingNormal, rel) / dn;
      if(t > 0.0){
        vec3 hp = rel + L*t;
        float rr = length(hp) / uRadius;               // 行星半径单位
        if(rr > uRing.x && rr < uRing.y){
          float tau = ringDensity(rr) * uRingTau / max(abs(dn), 0.10);
          ringShadow = 0.07 + 0.93*exp(-tau);      // 保留少量散射光
        }
      }
    }
  }

  float ndl = dot(N, L);
  float diff = max(ndl, 0.0) * smoothstep(-0.045, 0.055, ndl);
  diff *= shadow * ringShadow;

  vec3 H = normalize(L + V);
  float ndh = max(dot(N,H), 0.0);
  float shin = mix(6.0, 220.0, 1.0 - rough);
  float spec = pow(ndh, shin) * specAmt * (0.4 + 0.6*(1.0-rough));
  spec *= diff > 0.0 ? 1.0 : 0.0;

  vec3 col = albedo * uSunColor * uSunIntensity * atten * diff
           + uSunColor * uSunIntensity * atten * spec * 1.4;

  /* ---- 地球夜面灯光 ---- */
  if(uType == 3){
    float night = smoothstep(0.02, -0.22, ndl) * shadow;
    col += emis * night * 0.55 * uSunIntensity * 0.06;
  }
  /* ---- 其余天体的微弱自发光（无） ---- */
  col += albedo * 0.0016;     // 星光环境项

  fragColor = vec4(col, 1.0);
}`;

const VS_RING = `#version 300 es

const FS_RING = `#version 300 es
precision highp float;
in vec3 vWorld;
in vec2 vLocal;
out vec4 fragColor;
uniform vec3  uCamPos;
uniform vec3  uSunPos;
uniform vec3  uCenter;
uniform vec3  uRingNormal;
uniform float uPlanetR;
uniform float uUnitsPerAU;
uniform float uPhysical;
uniform float uTau;
uniform float uTime;
${NOISE}

float ringDensity(float r){
  float n = fbmN(vec3(r*30.0, 0.0, 0.0), 4)*0.5 + 0.5;
  float d = 0.42 + 0.62*n;
  d *= 1.0 - 0.94*smoothstep(1.88,1.94,r)*(1.0-smoothstep(2.02,2.08,r));
  d *= 1.0 - 0.72*smoothstep(2.185,2.198,r)*(1.0-smoothstep(2.212,2.225,r));
  d *= 1.0 - 0.45*smoothstep(1.58,1.63,r)*(1.0-smoothstep(1.66,1.70,r));
  d *= smoothstep(1.115,1.20,r);
  d *= 1.0 - smoothstep(2.21,2.275,r);
  return clamp(d, 0.0, 1.0);
}

void main(){
  float r = length(vLocal)/uPlanetR;       // 行星半径单位
  float dens = ringDensity(r);
  if(dens <= 0.002) discard;

  vec3 V = normalize(uCamPos - vWorld);
  vec3 toSun = uSunPos - vWorld;
  float sd = length(toSun);
  vec3 L = toSun/max(sd,1e-6);
  float distAU = sd/uUnitsPerAU;
  float atten = uPhysical > 0.5 ? max(1.0/max(distAU*distAU,1e-5), 0.012) : 1.0/max(pow(distAU,0.78),0.22);

  /* ---- 行星投在环上的阴影 ---- */
  float shadow = 1.0;
  {
    vec3 oc = uCenter - vWorld;
    float tca = dot(oc, L);
    if(tca > 0.0){
      float d2 = dot(oc,oc) - tca*tca;
      float R = uPlanetR*1.02;
      if(d2 < R*R){
        float ang = tca / sd;
        float soft = clamp(R/sd * 0.75, 0.004, 0.35) / max(ang,1e-3);
        shadow = smoothstep(1.0 - soft, 1.0, sqrt(max(d2,0.0))/R);
      }
    }
  }

  /* ---- 环的光学厚度：掠射时路径更长 -> 更亮且更不透明 ---- */
  float muL = max(abs(dot(uRingNormal, L)), 0.035);   // 入射角余弦
  float muV = max(abs(dot(uRingNormal, V)), 0.035);   // 出射角余弦
  float tau = uTau * dens;
  float alpha = clamp((1.0 - exp(-tau/muV)) * 0.98, 0.0, 0.99);

  /* ---- 散射相位 ---- */
  float cosT = dot(-L, V);
  float g = 0.62;
  float hg = (1.0-g*g) / (4.0*3.14159*pow(1.0 + g*g - 2.0*g*cosT, 1.5));
  float back = 0.55 + 0.45*pow(max(0.0, -cosT), 2.0);   // 逆光增亮
  float phase = clamp(hg*6.0 + back*0.85, 0.25, 1.8);

  /* ---- 颜色 ---- */
  float var = fbmN(vec3(r*68.0, 3.0, 0.0), 3)*0.5+0.5;
  vec3 col = mix(vec3(0.66,0.60,0.50), vec3(0.88,0.84,0.76), var);
  col = mix(col, vec3(0.58,0.52,0.46), smoothstep(1.95,2.15,r)*0.55);

  vec3 outC = col * phase * shadow * atten * 5.6;

  fragColor = vec4(outC * alpha, alpha);
}`;

/* ---------- 小行星（实例化） ---------- */
const VS_AST = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aInstA;    // a, e, inc
layout(location=2) in vec3 aInstB;    // node, peri, M0
layout(location=3) in vec4 aInstC;    // n, size, seed, spin
uniform mat4  uVP;
uniform vec3  uCamPos;
uniform float uSimDays;
uniform float uDistMix;
uniform float uUnitsPerAU;
uniform float uSizeMul;
${NOISE}
out vec3 vN;
out vec3 vWorld;
out float vSeed;

float solveE(float M, float e){
  M = mod(M, 6.28318530718);
  float E = M + e*sin(M);
  for(int i=0;i<4;i++){ E -= (E - e*sin(E) - M)/(1.0 - e*cos(E)); }
  return E;
}
vec3 orbitPos(float a,float e,float inc,float node,float peri,float M){
  float E = solveE(M,e);
  float xv = a*(cos(E)-e);
  float yv = a*sqrt(1.0-e*e)*sin(E);
  float cw=cos(peri), sw=sin(peri), cn=cos(node), sn=sin(node), ci=cos(inc), si=sin(inc);
  vec3 p;
  p.x = (cw*cn - sw*sn*ci)*xv + (-sw*cn - cw*sn*ci)*yv;
  p.y = (cw*sn + sw*cn*ci)*xv + (-sw*sn + cw*cn*ci)*yv;
  p.z = (sw*si)*xv + (cw*si)*yv;
  return vec3(p.x, p.z, -p.y);
}
void main(){
  float a = aInstA.x, e = aInstA.y, inc = aInstA.z;
  float node = aInstB.x, peri = aInstB.y, M0 = aInstB.z;
  float n = aInstC.x, size = aInstC.y, seed = aInstC.z, spin = aInstC.w;

  vec3 pAU = orbitPos(a,e,inc,node,peri, M0 + n*uSimDays);
  vec3 base = mapDist(pAU, uDistMix, uUnitsPerAU);

  // 不规则岩石形状
  float hs = hash13(aPos*3.7 + seed*13.0);
  vec3 local = aPos * (0.62 + 0.62*hs);

  float ang = spin*uSimDays*0.35 + seed*17.0;
  float ca = cos(ang), sa = sin(ang);
  vec3 rot = vec3(local.x*ca - local.z*sa, local.y, local.x*sa + local.z*ca);

  float dist = length(uCamPos - base);
  // 保证最小屏幕尺寸，避免远处消失
  float minW = dist * 0.0016;
  float w = max(size*uSizeMul, minW);

  vec3 wpos = base + rot*w;
  vWorld = wpos;
  vN = normalize(rot);
  vSeed = seed;
  gl_Position = uVP * vec4(wpos,1.0);
}`;

const FS_TONEMAP = `#version 300 es
precision highp float;
in vec2 vUV;
out vec4 fragColor;
uniform sampler2D uHDR;
uniform sampler2D uBloomTex;
uniform sampler2D uStreak;
uniform float uExposure;
uniform float uBloom;
uniform float uStreakAmt;
uniform vec2  uRes;

vec3 aces(vec3 x){
  const float a=2.51, b=0.03, c=2.43, d=0.59, e=0.14;
  return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);
}

void main(){

  vec2 d = uv - 0.5;

  // 径向色散

  vec3 c;
  c.r = texture(uHDR, uv - d*ca).r;
  c.g = texture(uHDR, uv).g;
  c.b = texture(uHDR, uv + d*ca).b;

  bl.r = texture(uBloomTex, uv - d*ca*1.6).r;
  bl.g = texture(uBloomTex, uv).g;
  bl.b = texture(uBloomTex, uv + d*ca*1.6).b;

const FS_FINAL = `#version 300 es
precision highp float;
in vec2 vUV;
out vec4 fragColor;
uniform sampler2D uTex;
uniform vec2  uRes;
uniform float uTime;
uniform float uGrain;

float luma(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }

vec3 fxaa(vec2 uv, vec2 rcp){
  vec3 cM = texture(uTex, uv).rgb;
  float lM = luma(cM);
  float lNW = luma(texture(uTex, uv + vec2(-1.0,-1.0)*rcp).rgb);
  float lNE = luma(texture(uTex, uv + vec2( 1.0,-1.0)*rcp).rgb);
  float lSW = luma(texture(uTex, uv + vec2(-1.0, 1.0)*rcp).rgb);
  float lSE = luma(texture(uTex, uv + vec2( 1.0, 1.0)*rcp).rgb);
  float lMin = min(lM, min(min(lNW,lNE), min(lSW,lSE)));
  float lMax = max(lM, max(max(lNW,lNE), max(lSW,lSE)));
  if (lMax - lMin < max(0.045, lMax*0.125)) return cM;

  vec2 dir = vec2(-((lNW+lNE)-(lSW+lSE)), ((lNW+lSW)-(lNE+lSE)));
  float red = min(abs(dir.x), abs(dir.y)) * 0.5 + 1e-5;
  dir = clamp(dir/red, -8.0, 8.0) * rcp;

  vec3 a = 0.5*(texture(uTex, uv + dir*(1.0/3.0-0.5)).rgb
              + texture(uTex, uv + dir*(2.0/3.0-0.5)).rgb);
  vec3 b = a*0.5 + 0.25*(texture(uTex, uv - dir*0.5).rgb + texture(uTex, uv + dir*0.5).rgb);
  float lB = luma(b);
  return (lB < lMin || lB > lMax) ? a : b;
}

void main(){
  vec2 rcp = 1.0/uRes;
  vec3 c = fxaa(vUV, rcp);

  // 胶片颗粒
  float n = fract(sin(dot(vUV*uRes + uTime*37.0, vec2(12.9898,78.233)))*43758.5453);
  c += (n - 0.5) * uGrain;

  // 抖动，消除色带
  c += (fract(sin(dot(vUV*uRes*1.7 + 3.1, vec2(41.3,289.1)))*43758.5453) - 0.5) * (1.0/255.0);

  fragColor = vec4(clamp(c,0.0,1.0), 1.0);
}`;

const FS_LUM = `#version 300 es
precision highp float;
in vec2 vUV;
out vec4 fragColor;
uniform sampler2D uTex;
uniform float uExposure;
void main(){
  // 几何平均（对数域平均）：对少数极亮像素（太阳）不敏感
  float e = 0.0;
  float frac = 0.0;
  for(int y=0;y<6;y++){
    for(int x=0;x<6;x++){
      vec2 o = (vec2(float(x),float(y)) + 0.5)/6.0 - 0.5;
      vec3 c = texture(uTex, vUV + o*(1.0/8.0)).rgb * uExposure;
      float l = dot(c, vec3(0.2126,0.7152,0.0722));
      e += log2(max(l, 1e-6));
      if (l > 0.02) frac += 1.0;
    }
  }
  e /= 36.0;
  frac /= 36.0;
  // 编码 log2 亮度到 [0,1]（范围 -20 .. 12）
  float v = clamp((e + 20.0)/32.0, 0.0, 1.0);
  fragColor = vec4(v, clamp(frac,0.0,1.0), 0.0, 1.0);
}`;

/* ==================================================================================
   3. GL 辅助
   ================================================================================== */
function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s);
    console.error('Shader compile error:\n' + log + '\n---\n' +
      src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));
    throw new Error('shader: ' + log);
  }
  return s;
}
function makeProg(vsSrc, fsSrc){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){
    const info = gl.getActiveUniform(p, i);
    u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}
function buf(data, target, usage){
  const b = gl.createBuffer();
  gl.bindBuffer(target || gl.ARRAY_BUFFER, b);
  gl.bufferData(target || gl.ARRAY_BUFFER, data, usage || gl.STATIC_DRAW);
  return b;
}

/* ---- 渲染目标 ---- */
function createTarget(w, h, fmt, type, hasDepth){
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt, w, h, 0, gl.RGBA, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  let depth = null;
  if (hasDepth){
    depth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fbo, tex, depth, w, h };
}
function freeTarget(t){
  if (!t) return;
  gl.deleteFramebuffer(t.fbo); gl.deleteTexture(t.tex);
  if (t.depth) gl.deleteRenderbuffer(t.depth);
}

function makeSphere(seg, ring){
  const pos = [], idx = [];
  for (let y = 0; y <= ring; y++){
    const v = y/ring, phi = v*Math.PI;
    for (let x = 0; x <= seg; x++){
      const u = x/seg, th = u*TAU;
      const sx = Math.sin(phi)*Math.cos(th), sy = Math.cos(phi), sz = Math.sin(phi)*Math.sin(th);
      pos.push(sx, sy, sz);
    }
  }
  for (let y = 0; y < ring; y++){
    for (let x = 0; x < seg; x++){
      const a = y*(seg+1)+x, b = a+seg+1;
      // 逆时针（外侧为正面）
      if (y !== 0){ idx.push(a, a+1, b); }
      if (y !== ring-1){ idx.push(a+1, b+1, b); }
    }
  }
  return { vbo: buf(new Float32Array(pos)), ibo: buf(new Uint16Array(idx), gl.ELEMENT_ARRAY_BUFFER), count: idx.length };
}

function makeRingGeom(inner, outer, seg){
  const pos = [], idx = [];
  for (let i = 0; i <= seg; i++){
    const a = i/seg*TAU, c = Math.cos(a), s = Math.sin(a);
    pos.push(c*inner, 0, s*inner);
    pos.push(c*outer, 0, s*outer);
  }
  for (let i = 0; i < seg; i++){
    const a = i*2, b = a+1, c = a+2, d = a+3;
    idx.push(a, c, b, b, c, d);
  }
  return { vbo: buf(new Float32Array(pos)), ibo: buf(new Uint16Array(idx), gl.ELEMENT_ARRAY_BUFFER), count: idx.length };
}

function makeIcosa(){
  const t = (1 + Math.sqrt(5))/2;
  const v = [
    [-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],
    [0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],
    [t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]
  ].map(a => { const l = len3(a); return [a[0]/l, a[1]/l, a[2]/l]; });
  const f = [
    0,11,5, 0,5,1, 0,1,7, 0,7,10, 0,10,11,
    1,5,9, 5,11,4, 11,10,2, 10,7,6, 7,1,8,
    3,9,4, 3,4,2, 3,2,6, 3,6,8, 3,8,9,
    4,9,5, 2,4,11, 6,2,10, 8,6,7, 9,8,1
  ];
  const flat = [];
  for (const i of f) flat.push(v[i][0], v[i][1], v[i][2]);
  return { vbo: buf(new Float32Array(flat)), count: flat.length/3, indexed: false };
}

/* 极轴：赤经/赤纬 -> 黄道坐标 -> 世界坐标 (X, Z, -Y) */
function poleWorld(raDeg, decDeg){
  const e = 23.4393*DEG;
  const ra = raDeg*DEG, dec = decDeg*DEG;
  const x = Math.cos(dec)*Math.cos(ra);
  const y = Math.cos(dec)*Math.sin(ra);
  const z = Math.sin(dec);
  const X = x;
  const Y = y*Math.cos(e) + z*Math.sin(e);
  const Z = -y*Math.sin(e) + z*Math.cos(e);
  return norm3([X, Z, -Y]);
}

function keplerPos(a, e, incDeg, nodeDeg, periDeg, Mdeg, out){
  const M = ((Mdeg % 360) + 360) % 360 * DEG;
  let E = M + e*Math.sin(M);
  for (let i = 0; i < 8; i++){
    const dE = (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E));
    E -= dE;
    if (Math.abs(dE) < 1e-12) break;
  }
  const xv = a*(Math.cos(E) - e);
  const yv = a*Math.sqrt(1 - e*e)*Math.sin(E);
  const inc = incDeg*DEG, node = nodeDeg*DEG, peri = periDeg*DEG;
  const cw = Math.cos(peri), sw = Math.sin(peri);
  const cn = Math.cos(node), sn = Math.sin(node);
  const ci = Math.cos(inc), si = Math.sin(inc);
  const X = (cw*cn - sw*sn*ci)*xv + (-sw*cn - cw*sn*ci)*yv;
  const Y = (cw*sn + sw*cn*ci)*xv + (-sw*sn + cw*cn*ci)*yv;
  const Z = (sw*si)*xv + (cw*si)*yv;
  out[0] = X; out[1] = Z; out[2] = -Y;    // 黄道坐标 -> 世界 (Y 轴为黄道北极)
  return out;
}

    aKm: def.aKm || 0, P: def.P || 0, e: def.e || 0, inc: def.inc || 0,
    ecliptic: !!def.ecliptic, tidal: !!def.tidal,
    info: def.info || null,
    pos: [0,0,0],      // 世界坐标
    posAU: [0,0,0],    // 黄道 AU 坐标（世界坐标未压缩）
    spin: 0,
    mat: m4(), nrm: new Float32Array(9),

  };

    b.ringGeom = makeRingGeom(def.ring.inner, def.ring.outer, 220);
  }
  if (parent) parent.children.push(b);
  ALL.push(b);
  return b;
}

const MOON_BASE = 1.0;
function moonOrbitRadius(moon){
  const pr = moon.parent.rWorld;
  const ratio = moon.aKm / moon.parent.radiusKm;
  const f = 1.80 + 2.20*Math.log10(Math.max(ratio, 1.5));
  return pr * Math.max(f, 1.55) * MOON_BASE;
}

/* ---- 距离映射（与 shader 中 mapDist 保持一致） ---- */
function mapDistAU(pAU, out){
  const d = Math.hypot(pAU[0], pAU[1], pAU[2]);
  if (d < 1e-9){ out[0]=out[1]=out[2]=0; return out; }
  const dn = lerp(d, Math.pow(d, 0.52), state.distMix);
  const s = dn/d * UNITS_PER_AU;
  out[0] = pAU[0]*s; out[1] = pAU[1]*s; out[2] = pAU[2]*s;
  return out;
}

(function genAsteroids(){
  let seed = 1337;
  const rnd = () => { seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < N_AST; i++){
    let a;
    // 柯克伍德空隙：2.5 AU (3:1) 与 2.82 AU (5:2)
    for (let tries = 0; tries < 6; tries++){
      a = 2.06 + Math.pow(rnd(), 0.78) * 1.30;
      const g1 = Math.abs(a - 2.502), g2 = Math.abs(a - 2.825);
      const w = 1 - 0.92*Math.exp(-g1*g1/0.0009) - 0.6*Math.exp(-g2*g2/0.0016);
      if (rnd() < w) break;
    }
    const e = rnd()*rnd()*0.30;
    const inc = (rnd()*rnd())*22*DEG;
    const node = rnd()*TAU, peri = rnd()*TAU, M0 = rnd()*TAU;
    const n = 0.0172021/(a*Math.sqrt(a));
    const size = 0.010 + Math.pow(rnd(), 3.4)*0.055;
    astA[i*3]   = a; astA[i*3+1] = e; astA[i*3+2] = inc;
    astB[i*3]   = node; astB[i*3+1] = peri; astB[i*3+2] = M0;
    astC[i*4]   = n; astC[i*4+1] = size; astC[i*4+2] = rnd(); astC[i*4+3] = (rnd()-0.5)*2.2;
  }
})();

/* 星空 */
const N_STARS = 14000;
(function genStars(){
  const dir = new Float32Array(N_STARS*3);
  const col = new Float32Array(N_STARS*3);
  const mag = new Float32Array(N_STARS);
  let seed = 24601;
  const rnd = () => { seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const galMat = getGalMat();
  for (let i = 0; i < N_STARS; i++){
    let v;
    // 70% 集中在银河带附近
    if (rnd() < 0.70){
      const b = (rnd()-0.5)*0.42, l = rnd()*TAU;
      const g = [Math.cos(b)*Math.cos(l), Math.sin(b), Math.cos(b)*Math.sin(l)];
      v = [g[0]*galMat[0] + g[1]*galMat[1] + g[2]*galMat[2],
           g[0]*galMat[3] + g[1]*galMat[4] + g[2]*galMat[5],
           g[0]*galMat[6] + g[1]*galMat[7] + g[2]*galMat[8]];
    } else {
      const u = rnd()*2-1, th = rnd()*TAU, s = Math.sqrt(1-u*u);
      v = [s*Math.cos(th), u, s*Math.sin(th)];
    }
    v = norm3(v);
    dir[i*3] = v[0]; dir[i*3+1] = v[1]; dir[i*3+2] = v[2];

    const m = Math.pow(rnd(), 2.6);
    mag[i] = m;
    // 恒星色温
    const t = rnd();
    let c;
    if (t < 0.10) c = [0.62,0.72,1.0];
    else if (t < 0.28) c = [0.82,0.88,1.0];
    else if (t < 0.62) c = [1.0,0.98,0.94];
    else if (t < 0.84) c = [1.0,0.88,0.72];
    else c = [1.0,0.70,0.52];
    const br = 0.35 + m*1.5;
    col[i*3] = c[0]*br; col[i*3+1] = c[1]*br; col[i*3+2] = c[2]*br;
  }
  window.__starData = { dir, col, mag };
})();

/* 银河坐标变换矩阵 */
function getGalMat(){
  // 黄道 -> 银道：先绕 X 轴倾斜 60.2°，再绕 Y 轴旋转
  const a = 60.2*DEG, b = 0.35;
  const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
  // R = Ry(b) * Rx(a)
  return new Float32Array([
     cb,   sb*sa,  sb*ca,
     0,    ca,    -sa,
    -sb,   cb*sa,  cb*ca
  ]);
}
const galMat = getGalMat();

/* 轨道线 VAO 缓存 */
const orbitLines = [];
function buildOrbitLine(body){
  if (!body.el) return;
  const el = body.el;
  const T = 0;
  const a = el[0] + el[1]*T;
  const e = el[2] + el[3]*T;
  const inc = el[4] + el[5]*T;
  const L = el[6] + el[7]*T;
  const peri = el[8] + el[9]*T;
  const node = el[10] + el[11]*T;
  const w = peri - node;
  const M = L - peri;
  const N = 320;
  const pts = new Float32Array((N+1)*3);
  const tmp = [0,0,0], tmp2 = [0,0,0];
  for (let i = 0; i <= N; i++){
    const Ma = (M + i/N*360);
    keplerPos(a, e, inc, node, w, Ma, tmp);
    mapDistAU(tmp, tmp2);
    pts[i*3] = tmp2[0]; pts[i*3+1] = tmp2[1]; pts[i*3+2] = tmp2[2];
  }
  if (body.orbitLine) { gl.deleteBuffer(body.orbitLine.vbo); orbitLines.splice(orbitLines.indexOf(body.orbitLine),1); }
  const vbo = buf(pts);
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null);
  body.orbitLine = { vao, vbo, count: N+1, body };
  orbitLines.push(body.orbitLine);
}
function rebuildAllOrbits(){
  for (const b of ALL){
    if (!b.el) continue;
    const el = b.el;
    const a = el[0], e = el[2], inc = el[4], L = el[6], peri = el[8], node = el[10];
    const w = peri - node, M = L - peri;
    const N = 320;
    const pts = new Float32Array((N+1)*3);
    const tmp = [0,0,0], tmp2 = [0,0,0];
    for (let i = 0; i <= N; i++){
      keplerPos(a, e, inc, node, w, M + i/N*360, tmp);
      mapDistAU(tmp, tmp2);
      pts[i*3] = tmp2[0]; pts[i*3+1] = tmp2[1]; pts[i*3+2] = tmp2[2];
    }
    if (b.orbitLine) gl.deleteBuffer(b.orbitLine.vbo);
    const vbo = buf(pts);
    const vao = b.orbitLine ? b.orbitLine.vao : gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
    gl.bindVertexArray(null);
    if (b.orbitLine){ b.orbitLine.vbo = vbo; b.orbitLine.count = N+1; }
    else { const ol = { vao, vbo, count: N+1, body: b }; b.orbitLine = ol; orbitLines.push(ol); }
  }
}
rebuildAllOrbits();

/* 月球轨道线 */
function buildMoonOrbit(m){
  const R = moonOrbitRadius(m);
  const N = 96;
  const pts = new Float32Array(N*3);
  const nrm = m.ecliptic ? [0,1,0] : m.parent.pole;
  let t = norm3(cross3(Math.abs(nrm[1]) < 0.95 ? [0,1,0] : [1,0,0], nrm));
  let b = cross3(nrm, t);
  const tilt = (m.ecliptic ? m.inc*DEG : (m.inc||0)*DEG);
  for (let i = 0; i < N; i++){
    const a = i/N*TAU;
    const ca = Math.cos(a), sa = Math.sin(a);
    let p = [t[0]*ca + b[0]*sa, t[1]*ca + b[1]*sa, t[2]*ca + b[2]*sa];
    // 倾斜
    p = norm3([p[0], p[1] + tilt*p[2]*0.0, p[2]]);
    pts[i*3] = p[0]*R; pts[i*3+1] = p[1]*R; pts[i*3+2] = p[2]*R;
  }
  const vbo = buf(pts);
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null);
  m.moonLine = { vao, vbo, count: N };
}
for (const b of ALL) if (b.parent) buildMoonOrbit(b);

function destroyTargets(){
  freeTarget(hdr); freeTarget(ldr); freeTarget(lumT); freeTarget(streakT);
  bloomMips.forEach(freeTarget);
  hdr = ldr = lumT = streakT = null; bloomMips = [];
}

function allocTargets(){
  destroyTargets();
  hdr = createTarget(RW, RH, HDR_FMT, HDR_TYPE, true);
  ldr = createTarget(RW, RH, gl.RGBA8, gl.UNSIGNED_BYTE, false);
  lumT = createTarget(8, 8, gl.RGBA8, gl.UNSIGNED_BYTE, false);
  let w = Math.max(1, RW >> 1), h = Math.max(1, RH >> 1);
  bloomMips = [];
  for (let i = 0; i < BLOOM_LEVELS; i++){
    bloomMips.push(createTarget(w, h, HDR_FMT, HDR_TYPE, false));
    w = Math.max(1, w >> 1); h = Math.max(1, h >> 1);
  }
  streakT = createTarget(Math.max(1, RW>>2), Math.max(1, RH>>2), HDR_FMT, HDR_TYPE, false);
}

function resize(){
  const dpr = Math.min(state.quality * state.renderScale, 2.5);
  W = Math.max(1, Math.floor(window.innerWidth));
  H = Math.max(1, Math.floor(window.innerHeight));
  const nw = Math.max(2, Math.floor(W*dpr));
  const nh = Math.max(2, Math.floor(H*dpr));
  if (nw === RW && nh === RH && hdr) return;
  RW = nw; RH = nh;
  canvas.width = RW; canvas.height = RH;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  allocTargets();
}

const pointers = new Map();
let dragMode = 0;      // 0 无, 1 旋转, 2 平移
let lastX = 0, lastY = 0, pinchDist = 0;
let camTargetOverride = null;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1){
    dragMode = (e.button === 2 || e.shiftKey) ? 2 : 1;
    lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('dragging');
  } else if (pointers.size === 2){
    const p = [...pointers.values()];
    pinchDist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2){
    const p = [...pointers.values()];
    const d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    if (pinchDist > 0){
      const k = pinchDist / Math.max(d, 1);
      cam.dDist = clamp(cam.dDist * k, cam.minDist, cam.maxDist);
    }
    pinchDist = d;
    return;
  }
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (dragMode === 1){
    cam.dTheta -= dx * 0.0052;
    cam.dPhi = clamp(cam.dPhi - dy * 0.0052, -1.552, 1.552);
  } else if (dragMode === 2){
    // 平移：沿相机右/上方向移动目标
    const sp = cam.dDist * 0.0016;
    const cy = Math.cos(cam.dPhi), sy = Math.sin(cam.dPhi);
    const ct = Math.cos(cam.dTheta), st = Math.sin(cam.dTheta);
    const fwd = [-cy*ct, -sy, -cy*st];
    const right = [-st, 0, ct];
    const up = cross3(right, fwd);
    state.follow = null; camTargetOverride = null;
    cam.dTarget = add3(cam.dTarget, add3(scl3(right, -dx*sp), scl3(up, dy*sp)));
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size === 0){ dragMode = 0; canvas.classList.remove('dragging'); }
  else if (pointers.size === 1){
    // 从双指回到单指：重置拖拽基准，避免跳变
    const p = [...pointers.values()][0];
    lastX = p.x; lastY = p.y;
    dragMode = 1;
  }
  if (pointers.size < 2) pinchDist = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const k = Math.exp(clamp(e.deltaY, -120, 120) * 0.0012);
  cam.dDist = clamp(cam.dDist * k, cam.minDist, cam.maxDist);
}, { passive:false });

/* 点击拾取 */
let downX = 0, downY = 0, downT = 0;
canvas.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; downT = performance.now(); });
canvas.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX-downX, e.clientY-downY) > 5) return;
  if (performance.now() - downT > 350) return;
  pickAt(e.clientX, e.clientY);
});

function pickAt(px, py){
  const rect = canvas.getBoundingClientRect();
  const nx = (px - rect.left)/rect.width*2 - 1;
  const ny = 1 - (py - rect.top)/rect.height*2;
  const eye = camPos();
  let best = null, bestD = 1e9;
  for (const b of ALL){
    const d = sub3(b.pos, eye);
    const l = len3(d);
    if (l < 1e-6) continue;
    const dir = scl3(d, 1/l);
    // 屏幕空间投影
    const vp = viewProj();
    const p = project(vp, b.pos);
    if (!p) continue;
    const dx = p[0] - nx, dy = p[1] - ny;
    const ang = Math.atan2(Math.hypot(dx,dy), 1.0);
    const rad = Math.atan2(b.rWorld, l);
    const hit = ang < Math.max(rad*1.5, 0.014);
    if (hit && l < bestD){ bestD = l; best = b; }
  }
  if (best) focusBody(best);
  else { /* 点空白处不取消选择 */ }
}

function project(m, p){
  const x = m[0]*p[0] + m[4]*p[1] + m[8]*p[2] + m[12];
  const y = m[1]*p[0] + m[5]*p[1] + m[9]*p[2] + m[13];
  const w = m[3]*p[0] + m[7]*p[1] + m[11]*p[2] + m[15];
  if (w <= 1e-6) return null;
  return [x/w, y/w, w];
}

let _vp = m4(), _view = m4(), _proj = m4();
function viewProj(){ return _vp; }
function camPos(){
  const cp = Math.cos(cam.phi), sp = Math.sin(cam.phi);
  const ct = Math.cos(cam.theta), st = Math.sin(cam.theta);
  return [
    cam.target[0] + cam.dist*cp*ct,
    cam.target[1] + cam.dist*sp,
    cam.target[2] + cam.dist*cp*st
  ];
}

function focusBody(b){
  state.selected = b;
  state.follow = b;
  cam.dDist = clamp(Math.max(b.rWorld*5.5, b.rWorld + 0.6), cam.minDist, cam.maxDist);
  if (b.parent && !b.el){
    // 卫星：拉近
    cam.dDist = Math.max(b.rWorld*8, 0.25);
  }
  updateInfo(b);
  updateBodyList();
}
