/* ==================================================================================
   13. 天体位置更新
   ================================================================================== */
const _tmpA = [0,0,0], _tmpB = [0,0,0];
const CENTURY = 36525.0;

function updateBodies(){
  const T = (jd0 + state.simDays - 2451545.0) / CENTURY;

  for (const b of ALL){
    if (b.el){
      const el = b.el;
      const a = el[0] + el[1]*T;
      const e = el[2] + el[3]*T;
      const inc = el[4] + el[5]*T;
      const L = el[6] + el[7]*T;
      const peri = el[8] + el[9]*T;
      const node = el[10] + el[11]*T;
      keplerPos(a, e, inc, node, peri - node, L - peri, _tmpA);
      b.posAU[0] = _tmpA[0]; b.posAU[1] = _tmpA[1]; b.posAU[2] = _tmpA[2];
      mapDistAU(_tmpA, _tmpB);
      b.pos[0] = _tmpB[0]; b.pos[1] = _tmpB[1]; b.pos[2] = _tmpB[2];
      // 自转
      b.spin = (state.simDays / b.rotP) * TAU;
    } else if (b.parent){
      // 卫星
      const R = moonOrbitRadius(b);
      const nrm = b.ecliptic ? [0,1,0] : b.parent.pole;
      const t = norm3(cross3(Math.abs(nrm[1]) < 0.95 ? [0,1,0] : [1,0,0], nrm));
      const bt = cross3(nrm, t);
      const ang = (state.simDays / b.P) * TAU;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      let px = t[0]*ca + bt[0]*sa;
      let py = t[1]*ca + bt[1]*sa;
      let pz = t[2]*ca + bt[2]*sa;
      // 倾角：绕轨道平面的节点轴倾斜
      if (b.inc){
        const ti = b.inc*DEG;
        const ci = Math.cos(ti), si = Math.sin(ti);
        const ny = py*ci - pz*si;
        const nz = py*si + pz*ci;
        py = ny; pz = nz;
      }
      b.pos[0] = b.parent.pos[0] + px*R;
      b.pos[1] = b.parent.pos[1] + py*R;
      b.pos[2] = b.parent.pos[2] + pz*R;
      b.spin = b.tidal ? ang : (state.simDays / (b.rotP || b.P)) * TAU;
    }
    // 模型矩阵
    buildModel(b);
  }
}

function buildModel(b){
  const p = b.pole;
  let ref = Math.abs(p[1]) < 0.92 ? [0,1,0] : [1,0,0];
  let x = norm3(cross3(ref, p));
  let z = cross3(p, x);
  const cs = Math.cos(b.spin), sn = Math.sin(b.spin);
  const rx = [x[0]*cs + z[0]*sn, x[1]*cs + z[1]*sn, x[2]*cs + z[2]*sn];
  const rz = [z[0]*cs - x[0]*sn, z[1]*cs - x[1]*sn, z[2]*cs - x[2]*sn];
  const r = b.rWorld;
  const m = b.mat;
  m[0] = rx[0]*r; m[1] = rx[1]*r; m[2] = rx[2]*r; m[3] = 0;
  m[4] = p[0]*r;  m[5] = p[1]*r;  m[6] = p[2]*r;  m[7] = 0;
  m[8] = rz[0]*r; m[9] = rz[1]*r; m[10] = rz[2]*r; m[11] = 0;
  m[12] = b.pos[0]; m[13] = b.pos[1]; m[14] = b.pos[2]; m[15] = 1;
  b.nrm[0] = rx[0]; b.nrm[1] = rx[1]; b.nrm[2] = rx[2];
  b.nrm[3] = p[0];  b.nrm[4] = p[1];  b.nrm[5] = p[2];
  b.nrm[6] = rz[0]; b.nrm[7] = rz[1]; b.nrm[8] = rz[2];

  // 环：不随行星自转，仅保持极轴姿态
  if (b.ring){
    if (!b.ringMat) b.ringMat = m4();
    const q = b.ringMat;
    q[0] = x[0]*r; q[1] = x[1]*r; q[2] = x[2]*r; q[3] = 0;
    q[4] = p[0]*r; q[5] = p[1]*r; q[6] = p[2]*r; q[7] = 0;
    q[8] = z[0]*r; q[9] = z[1]*r; q[10] = z[2]*r; q[11] = 0;
    q[12] = b.pos[0]; q[13] = b.pos[1]; q[14] = b.pos[2]; q[15] = 1;
  }
}

/* ==================================================================================
   14. 相机更新
   ================================================================================== */
function updateCamera(dt){
  const k = 1 - Math.exp(-dt*7.5);
  // 距离模式过渡
  const targetMix = state.compact ? 1 : 0;
  if (Math.abs(state.distMix - targetMix) > 1e-4){
    const oldMix = state.distMix;
    state.distMix = lerp(state.distMix, targetMix, 1 - Math.exp(-dt*4.0));
    if (Math.abs(state.distMix - targetMix) < 1e-4) state.distMix = targetMix;
    if (Math.abs(oldMix - state.distMix) > 1e-5) rebuildAllOrbits();
  }

  if (state.follow){
    cam.dTarget = [state.follow.pos[0], state.follow.pos[1], state.follow.pos[2]];
  }
  cam.target[0] = lerp(cam.target[0], cam.dTarget[0], k);
  cam.target[1] = lerp(cam.target[1], cam.dTarget[1], k);
  cam.target[2] = lerp(cam.target[2], cam.dTarget[2], k);
  cam.theta = lerp(cam.theta, cam.dTheta, k);
  cam.phi = lerp(cam.phi, cam.dPhi, k);
  cam.dist = lerp(cam.dist, cam.dDist, k);

  // 自动距离：跟随卫星时防止穿模
  if (state.follow){
    const b = state.follow;
    const minD = b.rWorld * 1.6 + 0.02;
    if (cam.dDist < minD) cam.dDist = minD;
  }
}

/* ==================================================================================
   15. 绘制
   ================================================================================== */
let lumHistory = 0.5;
let frameCount = 0;
let lastLumRead = 0;
let exposureSmooth = 1.0;
let autoExposureCurrent = 1.0;

const _mvp = m4(), _vpOnly = m4();

function drawScene(dt, exposure){
  const eye = camPos();
  const near = Math.max(cam.dist*0.0012, 0.0025);
  const far = Math.max(cam.dist*12, 6000);
  m4persp(_proj, cam.fov, RW/RH, near, far);
  m4lookAt(_view, eye, cam.target, [0,1,0]);
  m4mul(_vp, _proj, _view);
  const invVP = m4invert(m4(), _vp);

  gl.bindFramebuffer(gl.FRAMEBUFFER, hdr.fbo);
  gl.viewport(0,0,RW,RH);
  gl.clearColor(0,0,0,1);
  gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.depthFunc(gl.LEQUAL);

  /* ---------- 1. 天空 ---------- */
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.useProgram(progSky.p);
  gl.uniformMatrix4fv(progSky.u.uInvVP, false, invVP);
  gl.uniform3fv(progSky.u.uCamPos, eye);
  gl.uniformMatrix3fv(progSky.u.uGal, false, galMat);
  gl.uniform1f(progSky.u.uTime, state.animTime);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* ---------- 2. 星空 ---------- */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(progStars.p);
  gl.uniformMatrix4fv(progStars.u.uVP, false, _vp);
  gl.uniform1f(progStars.u.uTime, state.animTime);
  gl.uniform1f(progStars.u.uPixelRatio, state.quality*state.renderScale);
  gl.bindVertexArray(starVAO);
  gl.drawArrays(gl.POINTS, 0, N_STARS);
  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);

  /* ---------- 3. 轨道线 ---------- */
  if (state.showOrbits){
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.useProgram(progLine.p);
    gl.uniformMatrix4fv(progLine.u.uVP, false, _vp);
    // 轨道线是"界面层"，用曝光补偿保持视觉亮度恒定
    const expoScale = clamp(1/Math.max(exposure || 1, 1), 0.05, 1);
    for (const ol of orbitLines){
      const b = ol.body;
      const sel = (b === state.selected);
      gl.uniform4f(progLine.u.uColor,
        sel ? 0.42 : 0.16, sel ? 0.72 : 0.36, sel ? 1.0 : 0.62,
        (sel ? 0.30 : 0.070) * expoScale);
      gl.bindVertexArray(ol.vao);
      gl.drawArrays(gl.LINE_STRIP, 0, ol.count);
    }
    // 卫星轨道
    for (const b of ALL){
      if (!b.moonLine) continue;
      const sel = (b === state.selected);
      const show = b.parent === state.selected || b.parent === state.follow || sel ||
                   cam.dist < b.parent.rWorld*30;
      if (!show) continue;
      gl.uniform4f(progLine.u.uColor, 0.55, 0.72, 0.95, (sel ? 0.42 : 0.10) * expoScale);
      gl.bindVertexArray(b.moonLine.vao);
      gl.drawArrays(gl.LINE_LOOP, 0, b.moonLine.count);
    }
    gl.disable(gl.BLEND);
    gl.depthMask(true);
  }

  /* ---------- 4. 不透明天体 ---------- */
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.useProgram(progBody.p);
  const B = progBody;
  gl.uniformMatrix4fv(B.u.uVP, false, _vp);
  gl.uniform3fv(B.u.uCamPos, eye);
  gl.uniform3f(B.u.uSunPos, 0,0,0);
  gl.uniform3f(B.u.uSunColor, 1.0, 0.965, 0.92);
  gl.uniform1f(B.u.uSunIntensity, 2.6);
  gl.uniform1f(B.u.uUnitsPerAU, UNITS_PER_AU);
  gl.uniform1f(B.u.uPhysical, state.physical ? 1 : 0);
  gl.uniform1f(B.u.uCloudTime, state.animTime);

  const vp = _vp;
  for (const b of ALL){
    // 视锥粗剔除
    if (!inView(b)) continue;
    gl.uniformMatrix4fv(B.u.uModel, false, b.mat);
    gl.uniformMatrix3fv(B.u.uNormalMat, false, b.nrm);
    gl.uniform1i(B.u.uType, b.type);
    gl.uniform1f(B.u.uRadius, b.rWorld);
    gl.uniform1f(B.u.uTime, state.animTime + (b === sun ? 0 : 0));
    // 阴影
    if (b.parent){
      gl.uniform3fv(B.u.uShadowCenter, b.parent.pos);
      gl.uniform1f(B.u.uShadowRadius, b.parent.rWorld);
      gl.uniform1f(B.u.uShadowSoft, clamp(b.parent.rWorld/(len3(sub3(b.parent.pos, b.pos)))*0.9, 0.03, 0.6));
    } else {
      gl.uniform3fv(B.u.uShadowCenter, [0,0,0]);
      gl.uniform1f(B.u.uShadowRadius, -1);
      gl.uniform1f(B.u.uShadowSoft, 0.1);
    }
    // 环阴影
    if (b.ring){
      gl.uniform4f(B.u.uRing, b.ring.inner, b.ring.outer, 1, b.ring.tau);
      gl.uniform3fv(B.u.uRingNormal, b.pole);
      gl.uniform3fv(B.u.uPlanetCenter, b.pos);
      gl.uniform1f(B.u.uRingTau, b.ring.tau);
    } else {
      gl.uniform4f(B.u.uRing, 0,0,0,0);
      gl.uniform3f(B.u.uRingNormal, 0,1,0);
      gl.uniform3fv(B.u.uPlanetCenter, b.pos);
      gl.uniform1f(B.u.uRingTau, 0);
    }
    const geom = (b.parent && b.rWorld < 0.6) ? sphereLoVAO : sphereVAO;
    const cnt = (b.parent && b.rWorld < 0.6) ? sphereLo.count : sphere.count;
    gl.bindVertexArray(geom);
    gl.drawElements(gl.TRIANGLES, cnt, gl.UNSIGNED_SHORT, 0);
  }

  /* ---------- 5. 小行星带 ---------- */
  if (state.showAsteroids){
    gl.useProgram(progAst.p);
    gl.uniformMatrix4fv(progAst.u.uVP, false, _vp);
    gl.uniform3fv(progAst.u.uCamPos, eye);
    gl.uniform1f(progAst.u.uSimDays, state.simDays);
    gl.uniform1f(progAst.u.uDistMix, state.distMix);
    gl.uniform1f(progAst.u.uUnitsPerAU, UNITS_PER_AU);
    gl.uniform1f(progAst.u.uSizeMul, state.sizeMul);
    gl.uniform3f(progAst.u.uSunPos, 0,0,0);
    gl.uniform3f(progAst.u.uSunColor, 1.0, 0.965, 0.92);
    gl.uniform1f(progAst.u.uSunIntensity, 2.6);
    gl.uniform1f(progAst.u.uPhysical, state.physical ? 1 : 0);
    gl.bindVertexArray(astVAO);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, ico.count, N_AST);
  }

  /* ---------- 6. 柯伊伯带 ---------- */
  {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.depthMask(false);
    gl.useProgram(progKui.p);
    gl.uniformMatrix4fv(progKui.u.uVP, false, _vp);
    gl.uniform1f(progKui.u.uSimDays, state.simDays);
    gl.uniform1f(progKui.u.uDistMix, state.distMix);
    gl.uniform1f(progKui.u.uUnitsPerAU, UNITS_PER_AU);
    gl.uniform1f(progKui.u.uPixelRatio, state.quality*state.renderScale);
    gl.bindVertexArray(kuiVAO);
    gl.drawArraysInstanced(gl.POINTS, 0, 1, N_KUI);
    gl.disable(gl.BLEND);
    gl.depthMask(true);
  }

  /* ---------- 7. 行星环 ---------- */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(true);
  gl.disable(gl.CULL_FACE);
  gl.useProgram(progRing.p);
  gl.uniformMatrix4fv(progRing.u.uVP, false, _vp);
  gl.uniform3fv(progRing.u.uCamPos, eye);
  gl.uniform3f(progRing.u.uSunPos, 0,0,0);
  gl.uniform1f(progRing.u.uUnitsPerAU, UNITS_PER_AU);
  gl.uniform1f(progRing.u.uPhysical, state.physical ? 1 : 0);
  gl.uniform1f(progRing.u.uTime, state.animTime);
  for (const b of ALL){
    if (!b.ring || !b.ringGeom) continue;
    if (!inView(b, 3)) continue;
    gl.uniformMatrix4fv(progRing.u.uModel, false, b.ringMat);
    gl.uniform3fv(progRing.u.uCenter, b.pos);
    gl.uniform3fv(progRing.u.uRingNormal, b.pole);
    gl.uniform1f(progRing.u.uPlanetR, 1.0);
    gl.uniform1f(progRing.u.uTau, b.ring.tau);
    gl.bindVertexArray(getRingVAO(b));
    gl.drawElements(gl.TRIANGLES, b.ringGeom.count, gl.UNSIGNED_SHORT, 0);
  }

  /* ---------- 8. 大气 ---------- */
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.depthMask(false);
  gl.useProgram(progAtmo.p);
  gl.uniformMatrix4fv(progAtmo.u.uVP, false, _vp);
  gl.uniform3fv(progAtmo.u.uCamPos, eye);
  gl.uniform3f(progAtmo.u.uSunPos, 0,0,0);
  gl.uniform1f(progAtmo.u.uUnitsPerAU, UNITS_PER_AU);
  gl.uniform1f(progAtmo.u.uPhysical, state.physical ? 1 : 0);
  const atmScale = m4();
  for (const b of ALL){
    if (!b.atmo) continue;
    if (!inView(b, 3)) continue;
    const s = 1.0 + 0.075/Math.max(Math.pow(b.rWorld, 0.42), 0.35);
    const r = b.rWorld * s;
    // 模型矩阵：保持姿态，放大半径
    const m = m4();
    for (let i = 0; i < 12; i++) m[i] = b.mat[i] * s;
    m[12] = b.pos[0]; m[13] = b.pos[1]; m[14] = b.pos[2]; m[15] = 1;
    gl.uniformMatrix4fv(progAtmo.u.uModel, false, m);
    gl.uniform3fv(progAtmo.u.uColor, b.atmo.c);
    gl.uniform1f(progAtmo.u.uIntensity, b.atmo.i);
    gl.uniform1f(progAtmo.u.uPower, b.atmo.p);
    gl.uniform3fv(progAtmo.u.uCenter, b.pos);
    if (b.parent){
      gl.uniform3fv(progAtmo.u.uShadowCenter, b.parent.pos);
      gl.uniform1f(progAtmo.u.uShadowRadius, b.parent.rWorld);
    } else {
      gl.uniform3fv(progAtmo.u.uShadowCenter, [0,0,0]);
      gl.uniform1f(progAtmo.u.uShadowRadius, -1);
    }
    gl.bindVertexArray(sphereVAO);
    gl.drawElements(gl.TRIANGLES, sphere.count, gl.UNSIGNED_SHORT, 0);
  }

  /* ---------- 9. 太阳日冕 ---------- */
  gl.disable(gl.CULL_FACE);
  gl.useProgram(progGlow.p);
  gl.uniformMatrix4fv(progGlow.u.uVP, false, _vp);
  gl.uniform3fv(progGlow.u.uCamPos, eye);
  gl.uniform3fv(progGlow.u.uCenter, [0,0,0]);
  gl.uniform1f(progGlow.u.uTime, state.animTime);
  gl.uniform3f(progGlow.u.uColor, 1.0, 0.62, 0.26);
  // 内层
  {
    const s = sun.rWorld * 1.55 / sun.rWorld;
    const m = m4();
    m[0] = sun.rWorld*1.55; m[5] = sun.rWorld*1.55; m[10] = sun.rWorld*1.55; m[15] = 1;
    gl.uniformMatrix4fv(progGlow.u.uModel, false, m);
    gl.uniform1f(progGlow.u.uRadius, sun.rWorld*1.55);
    gl.uniform1f(progGlow.u.uIntensity, 1.15);
    gl.uniform1f(progGlow.u.uFalloff, 7.0);
    gl.bindVertexArray(sphereVAO);
    gl.drawElements(gl.TRIANGLES, sphere.count, gl.UNSIGNED_SHORT, 0);
  }
  // 外层
  {
    const R = sun.rWorld * 3.4;
    const m = m4();
    m[0] = R; m[5] = R; m[10] = R; m[15] = 1;
    gl.uniformMatrix4fv(progGlow.u.uModel, false, m);
    gl.uniform1f(progGlow.u.uRadius, R);
    gl.uniform1f(progGlow.u.uIntensity, 0.30);
    gl.uniform1f(progGlow.u.uFalloff, 3.4);
    gl.bindVertexArray(sphereVAO);
    gl.drawElements(gl.TRIANGLES, sphere.count, gl.UNSIGNED_SHORT, 0);
  }

  gl.disable(gl.BLEND);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
}

/* 环几何 VAO 缓存 */
function getRingVAO(b){
  if (!b._ringVAO){
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, b.ringGeom.vbo);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, b.ringGeom.ibo);
    gl.bindVertexArray(null);
    b._ringVAO = vao;
  }
  return b._ringVAO;
}

function inView(b, margin){
  const p = project(_vp, b.pos);
  if (!p || p[2] <= 0) return false;
  const m = margin || 1;
  const dist = Math.max(p[2], 1e-5);
  const rad = Math.atan2(b.rWorld*m, dist) / (cam.fov*0.5);   // 归一化到半视角
  const pad = rad*1.35 + 0.10;
  return Math.abs(p[0]) < 1 + pad && Math.abs(p[1]) < 1 + pad;
}

/* ---------- 泛光链 ---------- */
function drawQuad(){ gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); }

function bloomPass(exposure){
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.disable(gl.BLEND);

  // bright pass -> mip0
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomMips[0].fbo);
  gl.viewport(0,0,bloomMips[0].w, bloomMips[0].h);
  gl.useProgram(progBright.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, hdr.tex);
  gl.uniform1i(progBright.u.uTex, 0);
  gl.uniform1f(progBright.u.uThreshold, 1.05);
  gl.uniform1f(progBright.u.uExposure, exposure);
  drawQuad();

  // downsample
  gl.useProgram(progDown.p);
  gl.uniform1i(progDown.u.uTex, 0);
  for (let i = 1; i < BLOOM_LEVELS; i++){
    const src = bloomMips[i-1], dst = bloomMips[i];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0,0,dst.w,dst.h);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform2f(progDown.u.uTexel, 1/src.w, 1/src.h);
    drawQuad();
  }

  // upsample (additive)
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(progUp.p);
  gl.uniform1i(progUp.u.uTex, 0);
  for (let i = BLOOM_LEVELS-1; i > 0; i--){
    const src = bloomMips[i], dst = bloomMips[i-1];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0,0,dst.w,dst.h);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform2f(progUp.u.uTexel, 1/src.w, 1/src.h);
    gl.uniform1f(progUp.u.uRadius, 1.15);
    drawQuad();
  }
  gl.disable(gl.BLEND);

  // 拉丝
  gl.bindFramebuffer(gl.FRAMEBUFFER, streakT.fbo);
  gl.viewport(0,0,streakT.w,streakT.h);
  gl.useProgram(progStreak.p);
  gl.bindTexture(gl.TEXTURE_2D, bloomMips[2].tex);
  gl.uniform1i(progStreak.u.uTex, 0);
  gl.uniform2f(progStreak.u.uTexel, 1/bloomMips[2].w, 1/bloomMips[2].h);
  drawQuad();

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
}

/* ---------- 自动曝光测光 ---------- */
function measureLuminance(exposure){
  gl.bindFramebuffer(gl.FRAMEBUFFER, lumT.fbo);
  gl.viewport(0,0,8,8);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(progLum.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, hdr.tex);
  gl.uniform1i(progLum.u.uTex, 0);
  gl.uniform1f(progLum.u.uExposure, exposure);
  drawQuad();
  gl.enable(gl.DEPTH_TEST);

  const buf8 = new Uint8Array(8*8*4);
  gl.readPixels(0,0,8,8, gl.RGBA, gl.UNSIGNED_BYTE, buf8);
  let s = 0, fr = 0;
  for (let i = 0; i < 64; i++){ s += buf8[i*4]; fr += buf8[i*4+1]; }
  const v = s/64/255;
  const logLum = v*32 - 20;                 // 场景几何平均亮度的 log2
  return { logLum, frac: fr/64/255 };
}

/* ---------- 合成 ---------- */
function composite(exposure){
  gl.bindFramebuffer(gl.FRAMEBUFFER, ldr.fbo);
  gl.viewport(0,0,RW,RH);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(progTonemap.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hdr.tex);
  gl.uniform1i(progTonemap.u.uHDR, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomMips[0].tex);
  gl.uniform1i(progTonemap.u.uBloomTex, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, streakT.tex);
  gl.uniform1i(progTonemap.u.uStreak, 2);
  gl.uniform1f(progTonemap.u.uExposure, exposure);
  gl.uniform1f(progTonemap.u.uBloom, state.bloom ? 0.52 : 0.0);
  gl.uniform1f(progTonemap.u.uStreakAmt, state.bloom ? 0.10 : 0.0);
  gl.uniform2f(progTonemap.u.uRes, RW, RH);
  drawQuad();

  // 最终输出
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,RW,RH);
  gl.useProgram(progFinal.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, ldr.tex);
  gl.uniform1i(progFinal.u.uTex, 0);
  gl.uniform2f(progFinal.u.uRes, RW, RH);
  gl.uniform1f(progFinal.u.uTime, state.animTime);
  gl.uniform1f(progFinal.u.uGrain, 0.020);
  drawQuad();
  gl.bindVertexArray(null);
}

/* ==================================================================================
   16. 标签与 HUD
   ================================================================================== */
function updateLabels(){
  const eye = camPos();
  const rect = { w: W, h: H };
  for (const b of ALL){
    const el = labelEls.get(b);
    if (!el) continue;
    if (!state.showLabels || uiHidden){ el.style.opacity = '0'; continue; }
    const p = project(_vp, b.pos);
    if (!p || p[2] <= 0){ el.style.opacity = '0'; continue; }
    const sx = (p[0]*0.5+0.5)*rect.w;
    const sy = (1 - (p[1]*0.5+0.5))*rect.h;
    if (sx < -120 || sx > rect.w+120 || sy < -60 || sy > rect.h+60){ el.style.opacity='0'; continue; }
    // 距离/尺寸可见性
    const dist = len3(sub3(b.pos, eye));
    const ang = Math.atan2(b.rWorld, dist);
    const isMoon = !!b.parent;
    const minAng = isMoon ? 0.00035 : 0.00012;
    if (ang < minAng){ el.style.opacity = '0'; continue; }
    const fade = clamp((ang - minAng)/(minAng*4), 0.0, 1.0);
    el.style.transform = `translate(-50%,-50%) translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) translateY(-${(Math.atan2(b.rWorld,dist)/cam.fov*rect.h*0.5 + 9).toFixed(1)}px)`;
    el.style.opacity = (0.15 + 0.85*fade).toFixed(2);
  }
}

const clockEl = $('clock'), clockDateEl = $('clockdate');
const MONTHS = ['01','02','03','04','05','06','07','08','09','10','11','12'];
function updateClock(){
  const ms = (jd0 + state.simDays - 2440587.5) * 86400000;
  const d = new Date(ms);
  const hh = String(d.getUTCHours()).padStart(2,'0');
  const mm = String(d.getUTCMinutes()).padStart(2,'0');
  const ss = String(d.getUTCSeconds()).padStart(2,'0');
  clockEl.textContent = `${hh}:${mm}:${ss}`;
  clockDateEl.textContent = `${d.getUTCFullYear()}-${MONTHS[d.getUTCMonth()]}-${String(d.getUTCDate()).padStart(2,'0')} UTC`;
}

/* ==================================================================================
   17. 主循环
   ================================================================================== */
let lastT = performance.now();
let fpsAcc = 0, fpsN = 0, fpsT = 0, fps = 60;
let autoDownscaleDone = false;

function frame(now){
  let dt = (now - lastT)/1000;
  lastT = now;
  if (dt > 0.1) dt = 0.1;
  state.animTime += dt;

  if (!state.paused) state.simDays += dt * state.speed;

  updateBodies();
  updateCamera(dt);

  /* --- 曝光 --- */
  const bias = Math.pow(2, state.exposureBias);
  const finalExposure = exposureSmooth * bias;

  drawScene(dt, finalExposure);
  bloomPass(finalExposure);
  composite(finalExposure);

  // 测光放在绘制之后：用刚画完的这一帧计算下一帧的曝光
  if (state.autoExposure){
    if (frameCount > 1 && frameCount % 6 === 0){
      const { logLum } = measureLuminance(exposureSmooth);
      if (isFinite(logLum)){
        // 目标：场景几何平均亮度落在 2^-7.2 ≈ 0.0068，使空白天区保持深黑
        autoExposureCurrent = clamp(Math.pow(2, -7.2 - logLum), 0.12, 12);
      }
    }
    const k = 1 - Math.exp(-dt*1.8);
    exposureSmooth = lerp(exposureSmooth, autoExposureCurrent, k);
  } else {
    exposureSmooth = 1.0;
  }

  updateLabels();
  updateClock();

  /* --- FPS & 自适应降质 --- */
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5){
    fps = fpsN/fpsAcc;
    fpsAcc = 0; fpsN = 0;
    if (fps < 30 && !autoDownscaleDone && state.renderScale > 0.62){
      state.renderScale = Math.max(0.62, state.renderScale*0.82);
      vRes.textContent = state.renderScale.toFixed(2) + '×';
      sRes.value = Math.round(state.renderScale*100);
      RW = 0; resize();
      if (state.renderScale <= 0.63) autoDownscaleDone = true;
    }
  }

  frameCount++;
  requestAnimationFrame(frame);
}

/* ==================================================================================
   18. 启动
   ================================================================================== */
applySizes();
updateBodyList();
updateInfo(null);
syncSpeedUI();
syncToggles();
vExpo.textContent = '0.0 EV';
vSize.textContent = '1.0×';
vRes.textContent = '1.00×';

// 开场：从远景缓慢拉近
cam.dDist = 520;
cam.dist = 520;
cam.dPhi = 0.30;
cam.dTheta = 1.25;
setTimeout(() => {
  cam.dPhi = 0.92; cam.dTheta = 0.85; cam.dDist = 78;
}, 260);
setTimeout(() => { $('boot').classList.add('out'); }, 700);
setTimeout(() => { const b = $('boot'); if (b && b.parentNode) b.parentNode.removeChild(b); }, 1900);

// 默认选中地球（仅高亮信息，不强制拉近镜头）
setTimeout(() => {
  const earth = ALL.find(b => b.id === 'earth');
  if (earth){ state.selected = earth; updateInfo(earth); updateBodyList(); }
}, 400);

requestAnimationFrame(frame);

})();
