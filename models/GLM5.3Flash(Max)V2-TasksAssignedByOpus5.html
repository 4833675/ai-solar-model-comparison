<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>太阳系 · 实时运动模型</title>
<style>
:root{ --panel:rgba(10,15,24,.58); --line:rgba(255,255,255,.09); --txt:#cfd8e3; --dim:#7d8a99; --acc:#7fb2ff; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--txt);font-size:13px;-webkit-font-smoothing:antialiased}
#glc{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#glc.drag{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11px;letter-spacing:.14em;color:rgba(215,228,255,.82);text-shadow:0 0 6px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,1);pointer-events:auto;cursor:pointer;padding:2px 4px;white-space:nowrap;user-select:none}
.lbl:hover{color:#fff}
.lbl.sel{color:#ffe9b8}
.panel{position:fixed;background:var(--panel);backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.45);z-index:10}
#topbar{top:14px;left:50%;transform:translateX(-50%);padding:8px 18px;display:flex;gap:14px;align-items:center;font-size:11px;letter-spacing:.12em;color:var(--dim);white-space:nowrap}
#topbar b{color:var(--txt);font-weight:600;letter-spacing:.2em}
#rangeBadge{display:none;color:#ff9f6b;border:1px solid rgba(255,140,80,.35);padding:1px 9px;border-radius:999px}
#left{left:14px;top:60px;bottom:84px;width:174px;padding:10px 6px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
#left::-webkit-scrollbar{width:5px}
#left::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.grp{font-size:10px;letter-spacing:.24em;color:var(--dim);padding:9px 10px 4px}
.item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;cursor:pointer;color:var(--txt);font-size:12.5px}
.item:hover{background:rgba(127,178,255,.08)}
.item.sel{background:rgba(127,178,255,.15);color:#fff}
.item.sub{padding-left:28px;font-size:11.5px;color:var(--dim)}
.item.sub.sel{color:#dbe9ff}
.dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 7px currentColor;background:currentColor}
#right{right:14px;top:60px;width:268px;max-height:calc(100% - 156px);padding:14px 16px;overflow-y:auto;display:none;scrollbar-width:thin}
#right h2{font-size:16px;letter-spacing:.1em;color:#fff;margin-bottom:2px;font-weight:600}
#right .en{font-size:10px;letter-spacing:.24em;color:var(--dim);margin-bottom:4px}
.sec{font-size:10px;letter-spacing:.24em;color:var(--acc);margin:12px 0 6px;border-top:1px solid var(--line);padding-top:10px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:2.5px 0;font-size:12px;gap:10px}
.kv span:first-child{color:var(--dim);flex:none}
.kv span:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:#e8f0ff;text-align:right}
.desc{font-size:11.5px;line-height:1.75;color:#9fb0c2;margin-top:6px}
#bottom{bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:13px;padding:9px 16px}
.btn{background:rgba(127,178,255,.10);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:5px 13px;cursor:pointer;font-size:12px;letter-spacing:.08em;font-family:inherit}
.btn:hover{background:rgba(127,178,255,.20);color:#fff}
#dt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:13px;color:#e8f0ff;min-width:188px;text-align:center}
#speed{-webkit-appearance:none;appearance:none;width:180px;height:3px;background:rgba(255,255,255,.16);border-radius:2px;outline:none;cursor:pointer}
#speed::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#9cc3ff;box-shadow:0 0 8px rgba(120,170,255,.8);cursor:pointer}
#speed::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#9cc3ff;border:none;cursor:pointer}
#spdLabel{font-size:11px;color:var(--dim);min-width:92px;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace}
#toggles{right:14px;bottom:16px;padding:10px 13px;display:flex;flex-direction:column;gap:6px}
.tgl{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:11.5px;color:var(--dim);letter-spacing:.06em;user-select:none}
.tgl .sw{width:26px;height:14px;border-radius:999px;background:rgba(255,255,255,.10);position:relative;transition:.2s;flex:none}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#8194a8;transition:.2s}
.tgl.on{color:var(--txt)}
.tgl.on .sw{background:rgba(127,178,255,.45)}
.tgl.on .sw::after{left:14px;background:#eaf2ff}
#hint{position:fixed;bottom:20px;left:16px;font-size:10.5px;color:rgba(140,155,175,.5);letter-spacing:.1em;z-index:5}
#fps{position:fixed;top:17px;right:16px;font-size:10px;color:rgba(140,155,175,.45);font-family:ui-monospace,Menlo,monospace;z-index:5}
#errbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000;color:#e08060;font-size:14px;z-index:99;text-align:center;padding:30px;line-height:1.8}
body.uihide .panel,body.uihide #labels,body.uihide #hint,body.uihide #fps{display:none!important}
@media (max-width:960px){#left,#right,#hint{display:none!important}}
</style>
</head>

function m4lookAt(out,eye,c,up){

 let xx=up[1]*zz-up[2]*zy,xy=up[2]*zx-up[0]*zz,xz=up[0]*zy-up[1]*zx;
 l=Math.hypot(xx,xy,xz);if(l<1e-8){xx=1;xy=0;xz=0;}else{xx/=l;xy/=l;xz/=l;}
 const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
 out[0]=xx;out[1]=yx;out[2]=zx;out[3]=0;
 out[4]=xy;out[5]=yy;out[6]=zy;out[7]=0;

function axisBasis(tiltDeg,poleLonDeg){
 const t=tiltDeg*D2R,l=poleLonDeg*D2R;
 const ax=v3norm([Math.sin(t)*Math.cos(l),Math.cos(t),-Math.sin(t)*Math.sin(l)]);
 const ref=Math.abs(ax[1])<0.9?[0,1,0]:[1,0,0];
 const X=v3norm(v3cross(ax,ref));

function bodyModel(out,pos,basis,phase,scale){

 const c=Math.cos(phase),s=Math.sin(phase);
 const c0=[(c*X[0]-s*Z[0])*scale,(c*X[1]-s*Z[1])*scale,(c*X[2]-s*Z[2])*scale];
 const c1=[Y[0]*scale,Y[1]*scale,Y[2]*scale];
 const c2=[(s*X[0]+c*Z[0])*scale,(s*X[1]+c*Z[1])*scale,(s*X[2]+c*Z[2])*scale];
 out[0]=c0[0];out[1]=c0[1];out[2]=c0[2];out[3]=0;
 out[4]=c1[0];out[5]=c1[1];out[6]=c1[2];out[7]=0;
 out[8]=c2[0];out[9]=c2[1];out[10]=c2[2];out[11]=0;
 out[12]=pos[0];out[13]=pos[1];out[14]=pos[2];out[15]=1;
 return out;
}

// ---- 开普勒（§3.2）----
function solveKepler(M,e){
 M=((M%TAU)+TAU+Math.PI)%TAU-Math.PI;      // 归一化 [-π,π]
 let E=M+e*Math.sin(M)*(1+e*Math.cos(M));
 for(let i=0;i<10;i++){
  const f=E-e*Math.sin(E)-M, fp=1-e*Math.cos(E);
  const d=f/fp; E-=d;
  if(Math.abs(d)<1e-13)break;
 }
 return E;
}
// 时刻 T（儒略世纪）→ 当前六根数
function elemAt(p,T){
 const a=p.el[0]+p.rt[0]*T, e=p.el[1]+p.rt[1]*T, I=(p.el[2]+p.rt[2]*T)*D2R;
 const L=(p.el[3]+p.rt[3]*T)*D2R, lp=(p.el[4]+p.rt[4]*T)*D2R, O=(p.el[5]+p.rt[5]*T)*D2R;
 const w=lp-O;
 let M=L-lp; M=((M%TAU)+TAU+Math.PI)%TAU-Math.PI;
 return [a,e,I,O,w,M];
}
// 轨道根数 → 黄道直角坐标 AU（§3.3，逐字实现）
function orbPos(a,e,I,O,w,M,out){
 const E=solveKepler(M,e);
 const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(1-e*e)*Math.sin(E);
 const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),ci=Math.cos(I),si=Math.sin(I);
 out[0]=(cw*cO-sw*sO*ci)*xp+(-sw*cO-cw*sO*ci)*yp;
 out[1]=(cw*sO+sw*cO*ci)*xp+(-sw*sO+cw*cO*ci)*yp;
 out[2]=(sw*si)*xp+(cw*si)*yp;
 return out;
}

function compileShader(type,src){
 const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
  const log=gl.getShaderInfoLog(s);
  const lines=src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n');
  console.error('Shader compile failed:\n'+log+'\n'+lines);
  fatal('着色器编译失败：'+log);
 }
 return s;
}
function makeProgram(vsSrc,fsSrc){
 const p=gl.createProgram();
 gl.attachShader(p,compileShader(gl.VERTEX_SHADER,vsSrc));
 gl.attachShader(p,compileShader(gl.FRAGMENT_SHADER,fsSrc));
 gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS)){const log=gl.getProgramInfoLog(p);console.error(log);fatal('着色器链接失败：'+log);}
 const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
 for(let i=0;i<n;i++){const info=gl.getActiveUniform(p,i);u[info.name.replace('[0]','')]=gl.getUniformLocation(p,info.name);}
 return {p,u};
}

function makeTex(w,h,hdr){
 const t=gl.createTexture();
 gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texImage2D(gl.TEXTURE_2D,0,hdr?HDR_FMT:gl.RGBA8,w,h,0,gl.RGBA,hdr?HDR_TYPE:gl.UNSIGNED_BYTE,null);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 return t;
}
function makeRB(fmt,w,h,msaa){
 const rb=gl.createRenderbuffer();
 gl.bindRenderbuffer(gl.RENDERBUFFER,rb);
 if(msaa)gl.renderbufferStorageMultisample(gl.RENDERBUFFER,msaa,fmt,w,h);
 else gl.renderbufferStorage(gl.RENDERBUFFER,fmt,w,h);
 return rb;
}
const FB={W:0,H:0,msaa:false,

function buildFramebuffers(w,h){

 gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,FB.msaaDep);

 if(!FB.msaa)console.warn('[solar] MSAA 不可用，退回非 MSAA 路径');

// UV 球（7.12 绕序已验证：赤道处 (A,B,D) 叉积朝外）
function buildSphere(stacks,segs){
 const verts=[],idx=[];
 for(let y=0;y<=stacks;y++){
  const phi=Math.PI*y/stacks,sp=Math.sin(phi),cp=Math.cos(phi);
  for(let x=0;x<=segs;x++){
   const th=TAU*x/segs;
   verts.push(sp*Math.cos(th),cp,sp*Math.sin(th));
  }
 }
 for(let y=0;y<stacks;y++)for(let x=0;x<segs;x++){
  const A=y*(segs+1)+x,B=A+1,C=(y+1)*(segs+1)+x,D=C+1;
  idx.push(A,B,D,A,D,C);
 }
 const vao=gl.createVertexArray();gl.bindVertexArray(vao);
 const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
 const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
 gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);
 gl.bindVertexArray(null);
 return {vao,count:idx.length};
}

function buildRingGrid(rMin,rMax,radial,angular){

 for(let i=0;i<=radial;i++){
  const r=rMin+(rMax-rMin)*i/radial;
  for(let j=0;j<=angular;j++){
   const th=TAU*j/angular;
   verts.push(r*Math.cos(th),0,r*Math.sin(th));
  }
 }
 for(let i=0;i<radial;i++)for(let j=0;j<angular;j++){
  const a=i*(angular+1)+j,b=a+1,c=a+angular+1,d=c+1;
  idx.push(a,c,b,b,c,d);
 }
 const vao=gl.createVertexArray();gl.bindVertexArray(vao);
 const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);

/* ================= 着色器公共块 ================= */
const NOISE_GLSL = `
#define TAU 6.28318530718
float hash13(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
vec3 hash33(vec3 p){ p=fract(p*vec3(0.1031,0.1030,0.0973)); p+=dot(p,p.yxz+33.33); return fract((p.xxy+p.yxx)*p.zyx); }
float vnoise(vec3 p){
  vec3 i=floor(p), f=fract(p);
  vec3 u=f*f*(3.0-2.0*f);
  float a=hash13(i),b=hash13(i+vec3(1.,0.,0.)),c=hash13(i+vec3(0.,1.,0.)),d=hash13(i+vec3(1.,1.,0.));
  float e=hash13(i+vec3(0.,0.,1.)),g=hash13(i+vec3(1.,0.,1.)),h=hash13(i+vec3(0.,1.,1.)),k=hash13(i+vec3(1.,1.,1.));
  return mix(mix(mix(a,b,u.x),mix(c,d,u.x),u.y),mix(mix(e,g,u.x),mix(h,k,u.x),u.y),u.z);
}
const mat3 NM3=mat3(0.00,0.80,0.60,-0.80,0.36,-0.48,-0.60,-0.48,0.64);
float fbm(vec3 p,int oc){
  float s=0.0,a=0.5;
  for(int i=0;i<7;i++){ if(i>=oc)break; s+=a*vnoise(p); p=NM3*p*2.02; a*=0.5; }
  return s;
}
vec3 worley(vec3 p){ // (F1,F2,id)
  vec3 ip=floor(p),fp=fract(p);
  float f1=8.0,f2=8.0,id=0.0;
  for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){
    vec3 g=vec3(float(x),float(y),float(z));
    vec3 o=hash33(ip+g);
    vec3 d=g+o-fp;
    float dd=dot(d,d);
    if(dd<f1){ f2=f1; f1=dd; id=hash13(ip+g); }
    else if(dd<f2){ f2=dd; }
  }
  return vec3(sqrt(f1),sqrt(f2),id);
}
float sstep(float a,float b,float x){ float t=clamp((x-a)/(b-a),0.0,1.0); return t*t*(3.0-2.0*t); }
vec3 rotY(vec3 v,float a){ float c=cos(a),s=sin(a); return vec3(c*v.x+s*v.z,v.y,-s*v.x+c*v.z); }
`;
// 环系径向密度（§2.7 / §5.10），ring 与 planet 着色器共享
const RING_GLSL = `
float ringGauss(float x,float c,float s){ float t=(x-c)/s; return exp(-t*t); }
float rband(float r,float a,float b){ return sstep(a-0.008,a+0.008,r)*(1.0-sstep(b-0.008,b+0.008,r)); }
float ringDensity(float r,int ty){
  if(ty==1){
    float d=0.11*rband(r,1.235,1.53)+1.20*rband(r,1.525,1.95);
    d*=1.0-0.87*rband(r,1.95,2.03);
    d+=0.58*rband(r,2.025,2.27);
    d*=1.0-0.92*ringGauss(r,2.214,0.0045);
    d*=1.0-0.80*ringGauss(r,2.265,0.0018);
    d+=0.30*ringGauss(r,2.324,0.0055);
    d*=0.70+0.60*fbm(vec3(r*230.0,3.7,9.1),3);
    return max(d,0.0);
  }else if(ty==2){
    float d=0.55*ringGauss(r,1.951,0.0055);
    d+=0.20*ringGauss(r,1.909,0.0022)+0.17*ringGauss(r,1.863,0.0020)
      +0.14*ringGauss(r,1.823,0.0019)+0.11*ringGauss(r,1.786,0.0018)
      +0.09*ringGauss(r,1.751,0.0017)+0.07*ringGauss(r,1.690,0.0016);
    return d;
  }else if(ty==3){
    return 0.016*rband(r,1.40,1.81);
  }
  return 0.0;
}
`;

const SPHERE_FS = `#version 300 es

vec3 gEmis=vec3(0.0);

// ---- 撞击坑（§5.2，7.5 防胞界切断）----
void craterOct(vec3 p,float freq,float depth,float exMul){
  vec3 w=worley(p*freq);
  float d1=w.x,id=w.z;
  float ex=step(id,0.74)*sstep(0.60,0.40,d1)*exMul;
  if(ex<=0.0)return;
  float rad=0.13+0.22*fract(id*7.31);
  float t=d1/rad;
  float bowl=t<1.0?-(1.0-t*t):0.0;
  float rim=exp(-pow((t-1.0)/0.26,2.0));
  gH+=(bowl*0.90+rim*0.50)*depth*ex;
  gAm+=(bowl*0.55+rim*0.32)*ex;
}
void craterField(vec3 p,float exMul,float depthMul){
  craterOct(p,5.0,1.0*depthMul,exMul);
  craterOct(p,12.0,0.52*depthMul,exMul);
  if(uLod>14.0)craterOct(p,28.0,0.26*depthMul,exMul);
  if(uLod>28.0)craterOct(p,62.0,0.13*depthMul,exMul);
}

void surfMercury(vec3 p){

void surfEarth(vec3 p,vec3 N,vec3 L){
  float lat=p.y;
  float hE=fbm(p*1.85+vec3(13.7,3.1,7.7),5);
  float coast=sstep(0.546,0.552,hE);
  float land=sstep(0.552,0.5545,hE);
  vec3 deep=vec3(0.010,0.042,0.100),shal=vec3(0.014,0.105,0.160),shore=vec3(0.030,0.21,0.22);
  vec3 oc=mix(deep,shal,sstep(0.30,0.548,hE));
  oc=mix(oc,shore,coast*0.85);
  float veg=fbm(p*2.3+vec3(51.0),4);
  float dryBand=exp(-pow((abs(lat)-0.42)/0.16,2.0));
  float desert=clamp(sstep(0.42,0.62,veg)*dryBand+sstep(0.62,0.78,veg)*0.35,0.0,1.0);
  vec3 lc=mix(vec3(0.036,0.082,0.026),vec3(0.23,0.16,0.09),desert);
  float rock=sstep(0.64,0.71,hE);
  lc=mix(lc,vec3(0.145,0.13,0.115),rock);
  float ice=sstep(0.865,0.915,abs(lat)+0.05*(hE-0.5)+0.03*fbm(p*3.0+vec3(7.0),3));
  lc=mix(lc,vec3(0.78,0.80,0.82),ice);
  gAlb=mix(oc,lc,land);
  float hB=fbm(p*1.85+vec3(13.7,3.1,7.7),4);      // 凹凸用低倍频高度，防等高线混叠
  gH=max(hB-0.552,0.0)*1.2+land*0.12*fbm(p*5.0+vec3(3.0),3);
  gHs=land*(1.0-ice)*0.4;
  gSpec=(1.0-land)*0.9;
  // 云：随纬度变化的纬向漂移（§5.3）
  float drift=0.35*sin(uTimeD*0.012+abs(lat)*4.0)*(1.0-abs(lat));
  vec3 pc=rotY(p,drift);
  float cl=fbm(pc*2.7+vec3(31.0,uTimeD*0.002,0.0),4);
  float itcz=exp(-pow(lat/0.14,2.0));
  float mid=exp(-pow((abs(lat)-0.62)/0.18,2.0));
  float subtrop=1.0-0.45*exp(-pow((abs(lat)-0.33)/0.10,2.0));
  float amt=clamp((0.30+0.45*itcz+0.35*mid)*subtrop,0.0,1.0);
  float cov=sstep(0.615-0.22*amt,0.715-0.22*amt,cl);
  gCloud=cov;
  gAlb=mix(gAlb,vec3(0.85,0.87,0.90),cov*0.92);
  gSpec*=(1.0-cov);
  // 夜面灯光
  float night=sstep(0.08,-0.15,dot(N,L));
  float cityN=vnoise(p*22.0)*0.65+vnoise(p*61.0)*0.35;
  float city=sstep(0.58,0.80,cityN)*land*(1.0-ice)*(1.0-cov)*(1.0-rock*0.6);
  gEmis+=vec3(1.0,0.72,0.38)*city*night*0.55;
}
void surfMars(vec3 p){
  float m=fbm(p*3.1+vec3(31.0),5);

void surfJupiter(vec3 p){

  float g2=exp(-(pow(dl-8.0,2.0)/144.0+pow((asin(clamp(p.y,-1.0,1.0))*57.29578-15.0),2.0)/49.0));
  float heart=clamp(g1+g2*0.9,0.0,1.0);
  gAlb=mix(gAlb,vec3(0.62,0.55,0.48)*0.85,sstep(0.3,0.7,heart)); // 斯普特尼克心形亮区
  gAlb=mix(gAlb,gAlb*vec3(0.7,0.55,0.45),sstep(0.75,0.92,p.y));
  craterField(p,0.5,0.5);
  gAlb*=1.0+clamp(gAm,-0.4,0.4)*0.4;
  gHs=0.35;
}
void surfLuna(vec3 p){
  float mare=sstep(0.565,0.635,fbm(p*1.6+vec3(5.0,1.0,9.0),4));
  gAlb=mix(vec3(0.155,0.15,0.14),vec3(0.075,0.072,0.072),mare); // 反照率 ~0.12（7.8）
  gAlb*=0.85+0.3*fbm(p*4.0+vec3(2.0),3);
  craterField(p,1.0-0.75*mare,1.0);
  gAlb*=1.0+clamp(gAm,-0.6,0.6)*0.5;
  float dT=distance(p,normalize(vec3(0.718,-0.682,-0.140)));
  float ang=atan(p.z,p.x);
  float rays=pow(vnoise(vec3(ang*2.5,dT*22.0,4.2)),3.0)*sstep(0.5,0.05,dT);
  gAlb*=1.0+0.22*rays;                            // 第谷辐射纹
  gHs=0.85;
}
void surfIo(vec3 p){
  float v=fbm(p*3.0+vec3(23.0),4);
  gAlb=mix(vec3(0.50,0.40,0.10),vec3(0.72,0.58,0.20),sstep(0.3,0.7,v));
  gAlb=mix(gAlb,vec3(0.82,0.72,0.35),sstep(0.62,0.8,fbm(p*6.0+vec3(9.0),3)));
  vec3 w=worley(p*7.0);
  float volc=sstep(0.24,0.08,w.x)*step(w.z,0.35);
  gAlb=mix(gAlb,vec3(0.12,0.06,0.03),volc);
  gEmis+=vec3(1.0,0.4,0.1)*volc*sstep(0.10,0.0,w.x)*0.12; // 火山口微弱自发光
  gHs=0.3;
}
void surfEuropa(vec3 p){
  gAlb=vec3(0.55,0.53,0.48)*0.85*(0.9+0.15*fbm(p*4.0+vec3(3.0),3));
  float l=sstep(0.045,0.0,abs(fbm(p*3.0+vec3(2.0),4)-0.5));
  l+=sstep(0.030,0.0,abs(fbm(p*6.5+vec3(11.0),4)-0.5));
  l+=sstep(0.022,0.0,abs(fbm(p*11.0+vec3(29.0),4)-0.5));
  gAlb=mix(gAlb,vec3(0.33,0.17,0.10),clamp(l,0.0,1.0)*0.65); // 红褐线纹
  gHs=0.1;
}
void surfGanymede(vec3 p){
  float dark=sstep(0.55,0.62,fbm(p*2.0+vec3(9.0),4));
  vec3 lightC=vec3(0.20,0.19,0.175),darkC=vec3(0.088,0.083,0.078);
  gAlb=mix(lightC,darkC,dark);
  float groove=sstep(0.035,0.0,abs(fbm(p*5.0+vec3(31.0),4)-0.5));
  gAlb=mix(gAlb,vec3(0.26,0.25,0.23),groove*(1.0-dark)*0.5); // 亮色沟槽
  craterField(p,0.6,0.6);
  gAlb*=1.0+clamp(gAm,-0.5,0.5)*0.4;
  gHs=0.45;
}
void surfCallisto(vec3 p){
  gAlb=vec3(0.105,0.098,0.09)*(0.8+0.4*fbm(p*2.5+vec3(13.0),4));
  craterField(p,0.85,1.0);
  gAlb*=1.0+clamp(gAm,-0.6,0.6)*0.55;
  gHs=0.9;
}
void surfTitan(vec3 p){
  float v=fbm(p*2.2+vec3(37.0),4);
  gAlb=vec3(0.42,0.24,0.08)*(0.92+0.10*v);       // 橙色浓雾，细节被抹平
  gAlb=mix(gAlb,gAlb*0.82,sstep(0.3,0.55,fbm(p*1.3+vec3(3.0),3)));
  gTw=0.45;                                      // 晨昏线特别柔和
  gHs=0.0;
}
void surfCharon(vec3 p){
  gAlb=vec3(0.155,0.148,0.142)*(0.85+0.3*fbm(p*3.0+vec3(7.0),4));
  gAlb=mix(gAlb,vec3(0.20,0.095,0.055),sstep(0.78,0.93,p.y)*0.8); // 北极红冠
  craterField(p,0.5,0.7);
  gAlb*=1.0+clamp(gAm,-0.4,0.4)*0.4;
  gHs=0.55;
}
void surfHalley(vec3 p){
  gAlb=vec3(0.10,0.095,0.09)*(0.7+0.6*fbm(p*5.0,4));
  craterField(p,0.7,0.8);
  gAlb*=1.0+clamp(gAm,-0.5,0.5)*0.5;
  gHs=0.5;
}

// 环在行星上的投影（§5.10 第 2 条）
float ringShadow(vec3 L){
  if(uRinged<0.5)return 1.0;
  mat3 B=transpose(uBasis);
  vec3 sb=B*L;
  if(abs(sb.y)<1e-4)return 1.0;
  vec3 pb=B*(vWorld-uCenter);
  float t=-pb.y/sb.y;
  if(t<=0.0)return 1.0;
  float r=length(pb.xz+t*sb.xz);
  if(r<1.10||r>2.50)return 1.0;
  float d=ringDensity(r,int(uRinged+0.5));
  return exp(-d*1.45/max(abs(sb.y),0.10));
}

void main(){
  vec3 N=normalize(vNormal);
  vec3 V=normalize(uCam-vWorld);
  vec3 L=normalize(uSunPos-vWorld);
  vec3 p=normalize(vObj);
  gAlb=vec3(0.5);
  if(uType==0){ // ---- 太阳（§5.1）----
    vec3 flow=vec3(mod(uTimeD*0.02,6.28),0.0,mod(uTimeD*0.013,6.28));
    vec3 w1=worley(p*76.0+flow);
    vec3 w2=worley(p*31.0-flow*0.6);
    float g=clamp(w1.y-w1.x,0.0,1.0);           // F2−F1 胞界网络（7.9）
    float g2=clamp(w2.y-w2.x,0.0,1.0);
    float sg=fbm(p*6.5+flow*0.3,4);             // 超米粒组织
    float sn=fbm(p*3.05+vec3(77.0),4);
    float umbra=sstep(0.705,0.75,sn);
    float spot=sstep(0.665,0.71,sn);
    float pen=clamp(spot-umbra,0.0,1.0);
    float lum=0.62+0.30*g+0.15*g2+(sg-0.5)*0.55;
    float mu=max(dot(N,V),0.0);
    float limb=0.24+0.76*pow(mu,0.38);          // 临边昏暗：亮度+色温
    lum*=limb;
    lum*=(1.0-pen*0.38-umbra*0.80);
    float t=clamp((lum-0.15)*1.15,0.0,1.0);
    vec3 c0=vec3(0.35,0.03,0.005),c1=vec3(0.85,0.22,0.02),c2=vec3(1.0,0.50,0.08),c3=vec3(1.0,0.80,0.32),c4=vec3(1.0,0.97,0.82);
    vec3 col=mix(c0,c1,sstep(0.0,0.25,t));
    col=mix(col,c2,sstep(0.25,0.5,t));
    col=mix(col,c3,sstep(0.5,0.75,t));
    col=mix(col,c4,sstep(0.75,1.0,t));
    col=mix(col,col*vec3(0.35,0.22,0.15),pen*0.5+umbra*0.85);
    col*=2.0*(0.35+0.65*limb);
    frag=vec4(col,1.0);
    return;
  }
  else if(uType==1)surfMercury(p);
  else if(uType==2)surfVenus(p);
  else if(uType==3)surfEarth(p,N,L);
  else if(uType==4)surfMars(p);
  else if(uType==5)surfJupiter(p);
  else if(uType==6)surfSaturn(p);
  else if(uType==7)surfUranus(p);
  else if(uType==8)surfNeptune(p);
  else if(uType==9)surfPluto(p);
  else if(uType==10)surfLuna(p);
  else if(uType==11)surfIo(p);
  else if(uType==12)surfEuropa(p);
  else if(uType==13)surfGanymede(p);
  else if(uType==14)surfCallisto(p);
  else if(uType==15)surfTitan(p);
  else if(uType==16)surfCharon(p);
  else surfHalley(p);
  // 屏幕空间导数凹凸（§5 开头公式）
  if(gHs>0.001&&uLod>4.0){
    vec3 dpx=dFdx(vWorld),dpy=dFdy(vWorld);
    float dhx=dFdx(gH),dhy=dFdy(gH);
    vec3 r1=cross(dpy,N),r2=cross(N,dpx);
    float det=dot(dpx,r1);
    if(abs(det)>1e-10){
      vec3 grad=(r1*dhx+r2*dhy)/det;
      N=normalize(N-uHStr*0.05*uDispR*grad);
    }
  }
  float ndl=dot(N,L);
  float diff=clamp(ndl,0.0,1.0)*sstep(-gTw*0.35,0.12+gTw,ndl);
  vec3 light=vec3(1.0,0.97,0.92)*diff*uSunIrr*(1.0-0.38*gCloud);
  light*=ringShadow(L);
  vec3 col=gAlb*light+gEmis+gAlb*vec3(0.0035,0.004,0.005);
  if(gSpec>0.001){
    vec3 H=normalize(L+V);
    col+=vec3(1.0,0.97,0.9)*pow(max(dot(N,H),0.0),420.0)*gSpec*uSunIrr*0.85;
  }
  frag=vec4(col,1.0);
}`;
/* ================= 轨道缎带 / 小行星带 / 环 / 彗尾 ================= */
// 屏幕空间展宽（§4.2，7.2 像素单位）；使用 wPos/wTan/sideSign
const STRIP_WIDEN = `
  vec4 cp=uVP*vec4(wPos,1.0);
  if(cp.w<=0.0){ gl_Position=vec4(0.0,0.0,2.0,1.0); vSide=0.0; vLag=1.0; return; }
  vec2 sc=cp.xy/cp.w;
  vec4 ct=uVP*vec4(wPos+wTan,1.0);
  vec2 st=ct.xy/max(abs(ct.w),1e-4)-sc;
  if(ct.w<0.0)st=-st;
  vec2 a=sc*uHalfVP;
  vec2 b=a+st*uHalfVP;
  vec2 td=b-a;
  float tl=length(td);
  vec2 npx=tl>1e-6?vec2(-td.y,td.x)/tl:vec2(1.0,0.0);
  vec2 off=npx*uWidthPx*sideSign/uHalfVP;
  gl_Position=vec4((sc+off)*cp.w,cp.z,cp.w);
`;
const KEPLER_GLSL = `
float keplerE(float M,float e){
  M=mod(M+3.14159265,6.2831853)-3.14159265;
  float E=M+e*sin(M)*(1.0+e*cos(M));
  for(int i=0;i<8;i++){ E-=(E-e*sin(E)-M)/(1.0-e*cos(E)); }
  return E;
}
`;
const ORBIT_VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 aPos;   // elements 模式: x=M ；local 模式: xyz=位置
layout(location=1) in vec3 aTan;
layout(location=2) in float aLag;
layout(location=3) in float aSide;
uniform mat4 uVP;
uniform vec2 uHalfVP;
uniform float uWidthPx,uMode,uScale,uComp,uMcur;
uniform float uA,uE;
uniform mat3 uRot;
uniform mat4 uLocal;
out float vSide,vLag;
${KEPLER_GLSL}
vec3 orbitPos(float M){
  float E=keplerE(M,uE);
  float xp=uA*(cos(E)-uE), yp=uA*sqrt(1.0-uE*uE)*sin(E);
  vec3 pe=uRot*vec3(xp,yp,0.0);
  float r=length(pe);
  vec3 wd=vec3(pe.x,pe.z,-pe.y);
  return normalize(wd)*(uScale*pow(max(r,1e-6),uComp));
}
void main(){
  if(uMode<0.5){
    vec3 wPos=orbitPos(aPos.x);
    vec3 wTan=orbitPos(aPos.x+0.008)-orbitPos(aPos.x-0.008);
    vLag=mod(uMcur-aPos.x+6.2831853,6.2831853)/6.2831853;
    float sideSign=aSide;
    ${STRIP_WIDEN}
  }else{
    vec4 lp=uLocal*vec4(aPos.xyz,1.0);
    vec3 wPos=lp.xyz;
    vec3 wTan=mat3(uLocal)*aTan;
    vLag=aLag;
    float sideSign=aSide;
    ${STRIP_WIDEN}
  }
}`;
const ORBIT_FS = `#version 300 es
precision highp float;
in float vSide,vLag;
uniform vec3 uColor;
uniform float uAlpha;
out vec4 frag;
void main(){
  float edge=1.0-abs(vSide);
  float a=(0.10+0.85*pow(max(0.0,1.0-vLag*1.05),3.2))*pow(edge,1.6)*uAlpha;
  frag=vec4(uColor*a,a);
}`;

// 小行星/柯伊伯带：顶点着色器解 Kepler（§2.6）
const POINTS_VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 aD0;  // a, e, I(deg), O(deg)
layout(location=1) in vec4 aD1;  // w(deg), M0(rad), n(rad/day), size
uniform mat4 uVP;
uniform vec3 uCam;
uniform float uTdays,uComp,uScale,uPxF,uGlow;
uniform vec3 uTint;
out vec3 vCol;
out float vA;
float sst(float a,float b,float x){ float t=clamp((x-a)/(b-a),0.0,1.0); return t*t*(3.0-2.0*t); }
${KEPLER_GLSL}
void main(){
  float a=aD0.x, e=aD0.y;
  float I=radians(aD0.z), O=radians(aD0.w), w=radians(aD1.x);
  float M=aD1.y+aD1.z*uTdays;
  float E=keplerE(M,e);
  float xp=a*(cos(E)-e), yp=a*sqrt(1.0-e*e)*sin(E);
  float cw=cos(w),sw=sin(w),cO=cos(O),sO=sin(O),ci=cos(I),si=sin(I);
  float x=(cw*cO-sw*sO*ci)*xp+(-sw*cO-cw*sO*ci)*yp;
  float y=(cw*sO+sw*cO*ci)*xp+(-sw*sO+cw*cO*ci)*yp;
  float z=(sw*si)*xp+(cw*si)*yp;
  float r=length(vec3(x,y,z));
  vec3 wd=vec3(x,z,-y);
  vec3 pos=normalize(wd)*(uScale*pow(max(r,1e-6),uComp));
  gl_Position=uVP*vec4(pos,1.0);
  float dist=length(pos-uCam);
  gl_PointSize=clamp(aD1.w*uPxF/max(dist,0.1),0.75,4.5);
  float h=fract(sin(aD1.y*127.1)*43758.5453);
  vCol=uTint*(0.7+0.6*h);
  float bright=pow(clamp(2.8/r,0.0,1.0),0.75)*uGlow;
  vA=bright*sst(0.4,1.5,dist);
  if(gl_Position.w<=0.0)vA=0.0;
}`;
const POINTS_FS = `#version 300 es
precision highp float;
in vec3 vCol;
in float vA;
out vec4 frag;
void main(){
  vec2 d=gl_PointCoord-0.5;
  float a=smoothstep(0.5,0.12,length(d));
  frag=vec4(vCol*(vA*a),1.0);
}`;

// 环系（§5.10）
const RING_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
uniform mat4 uVP,uModel;
out vec3 vObj,vWorld;
void main(){
  vObj=aPos;
  vec4 w=uModel*vec4(aPos,1.0);
  vWorld=w.xyz;
  gl_Position=uVP*w;
}`;
const RING_FS = `#version 300 es
precision highp float;
in vec3 vObj,vWorld;
out vec4 frag;
uniform mat4 uModel;
uniform vec3 uCam,uL,uCenter,uColor;
uniform float uDispR,uRMin,uRMax;
uniform int uRingTy;
${NOISE_GLSL}
${RING_GLSL}
void main(){
  float r=length(vObj.xz);
  if(r<uRMin||r>uRMax)discard;
  float d=ringDensity(r,uRingTy);
  if(d<1e-4)discard;
  vec3 rN=normalize(mat3(uModel)*vec3(0.0,1.0,0.0));
  vec3 V=normalize(uCam-vWorld);
  float muv=max(abs(dot(rN,V)),0.10);            // μ 下限 0.10（7.4）
  float mus=max(abs(dot(rN,uL)),0.10);
  float tv=d*1.45/muv;
  float ts=d*1.45/mus;
  float alpha=1.0-exp(-tv);
  float lit;
  if(dot(rN,V)*dot(rN,uL)>=0.0) lit=(1.0-exp(-ts))*0.85;         // 正面受光
  else lit=exp(-ts*0.42)*1.15*(1.0-exp(-ts*0.75));               // 背光前向散射
  vec3 rel=vWorld-uCenter;
  float bb=dot(rel,uL);
  float sh=1.0;
  if(bb<0.0){
    float dm=sqrt(max(dot(rel,rel)-bb*bb,0.0));
    sh=sstep(uDispR*0.97,uDispR*1.09,dm);                        // 行星投影软半影
  }
  vec3 col=uColor*(0.55+0.45*clamp(d/1.2,0.0,1.0));
  frag=vec4(col*lit*sh*alpha,alpha);                             // 预乘 alpha
}`;

// 彗尾缎带（顶点色）
const TAIL_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aTan;

}`;

precision highp float;
in vec2 vUv;

uniform sampler2D uScene,uBloomTex;
uniform vec2 uRes,uSunPos;
uniform float uSunVis,uExposure,uTime,uBloomOn;

  vec2 uv=vUv;

  float r2=dot(cc,cc);
  float ca=0.0022*r2;                     // 色散
  vec3 col;
  col.r=texture(uScene,uv+cc*ca).r;
  col.g=texture(uScene,uv).g;
  col.b=texture(uScene,uv-cc*ca).b;
  col+=texture(uBloomTex,uv).rgb*(0.34*uBloomOn);
  if(uSunVis>0.003){                      // 镜头眩光（整体克制）
    vec2 sp=uSunPos;
    vec2 d=uv-sp; d.x*=asp;
    float dl=length(d);
    float core=exp(-dl*7.0)*0.38;
    float spikes=0.0;
    for(int i=0;i<6;i++){
      float an=float(i)*1.04719755;
      vec2 dir=vec2(cos(an),sin(an));

}`;

 {const M2=TAU*(((state.simJD+0.5)-b.def.Tp)/b.def.P%1+1)%1;

  const e2=orbPos(b.def.a,b.def.e,b.def.I*D2R,b.def.O*D2R,b.def.w*D2R,M2,[0,0,0]);
  const e1=orbPos(b.def.a,b.def.e,b.def.I*D2R,b.def.O*D2R,b.def.w*D2R,M1,[0,0,0]);
  const w2=[0,0,0],w1=[0,0,0];
  compressDir(eclToWorld(e2,w2),v3len(e2),state.comp,SCALE_DISP,p2);
  compressDir(eclToWorld(e1,w1),v3len(e1),state.comp,SCALE_DISP,p1);}
 const negVel=v3norm(v3sub(p2,p1));
 const gain=Math.min(0.55*s,2.0);
 const N=36,step=len/(N-1);
 // 离子尾：笔直反日，偏蓝
 let pp=b.posW.slice();
 for(let i=0;i<N;i++){
  const q=i/(N-1);
  const pos=i===0?b.posW.slice():v3add(b.posW,v3scale(dirAnti,q*len*1.1));
  const tan=v3norm(v3sub(pos,pp));pp=pos;
  const w=2.0+2.5*q;
  const c=[0.30*gain*(1-q),0.55*gain*(1-q),1.0*gain*(1-q)];
  tailArr.push(pos[0],pos[1],pos[2],tan[0],tan[1],tan[2],q,-1,c[0],c[1],c[2],w);
  tailArr.push(pos[0],pos[1],pos[2],tan[0],tan[1],tan[2],q,1,c[0],c[1],c[2],w);
 }
 // 退化三角形连接两条 ribbon
 tailArr.push(...tailArr.slice(-12));
 const firstDust=[b.posW[0],b.posW[1],b.posW[2],0,1,0,0,-1,0,0,0,4.5];
 tailArr.push(...firstDust,...firstDust);
 // 尘埃尾：沿速度反方向弯曲滞后，偏暖
 pp=b.posW.slice();let cur=b.posW.slice();
 for(let i=0;i<N;i++){
  const q=i/(N-1);
  const dir=v3norm(v3lerp(dirAnti,negVel,0.85*q));
  if(i>0)cur=v3add(cur,v3scale(dir,step*1.15));
  const tan=v3norm(v3sub(cur,pp));pp=cur;
  const w=5.0+8.0*q;
  const c=[1.0*gain*(1-q),0.85*gain*(1-q),0.55*gain*(1-q)*0.8];
  tailArr.push(cur[0],cur[1],cur[2],tan[0],tan[1],tan[2],q,-1,c[0],c[1],c[2],w);
  tailArr.push(cur[0],cur[1],cur[2],tan[0],tan[1],tan[2],q,1,c[0],c[1],c[2],w);
 }

let flare={ux:0.5,uy:0.5,vis:0,scale:1};
function computeFlare(){
 const s=sunBody.scr;
 flare.vis=0;flare.scale=1;
 if(s.w>0){
  const ux=s.x/cssW(),uy=1-s.y/cssH();
  const dSun=v3len(cam.eye);
  const sunRpx=sunBody.dispR/Math.max(dSun,0.01)/Math.tan(state.fov/2)*(cssH()/2);
  flare.scale=clampf(1.3-Math.pow(sunRpx/220,1.5),0.08,1.0);   // 近日时抑制泛光/眩光白场
  let v=ss(-0.15,0.10,ux)*ss(1.15,0.90,ux)*ss(-0.15,0.10,uy)*ss(1.15,0.90,uy)*flare.scale;
  for(const b of bodies){
   if(b===sunBody||b.scr.w<=0)continue;
   const d=Math.hypot(b.scr.x-s.x,b.scr.y-s.y);
   if(d<b.scr.r*0.95&&b.scr.depth<s.depth)v*=0.12;
  }
  flare.ux=ux;flare.uy=uy;flare.vis=v;
 }
}

function showInfo(b){
 const right=$('right');right.innerHTML='';
 infoRefs=null;
 const d=b.def;
 let html=`<h2>${d.name}</h2><div class="en">${d.en}</div><div class="sec">实时数据</div><div id="rt"></div><div class="sec">物理参数</div>`;
 const rows=[['半径',d.rkm?d.rkm.toLocaleString()+' km':'—'],['质量',d.mass||'—'],['公转周期',d.period||'—'],
  ['卫星数',d.moonsN||'—'],['表面/云顶温度',d.temp||'—']];
 if(b.kind==='planet'||b.kind==='dwarf'){rows.push(['轨道偏心率',fmt(b.def.el[1],4)],['轨道倾角',fmt(b.def.el[2],2)+'°']);}
 rows.push(['转轴倾角',d.tiltText||fmt(d.tilt,2)+'°'],['大气成分',d.atmo||'—']);
 if(b.kind==='moon'){rows.splice(2,0,['轨道半径',d.aKm.toLocaleString()+' km'],['轨道周期',Math.abs(d.P).toFixed(3)+' 天'+(d.P<0?'（逆行）':'')]);}
 html+=rows.map(r=>`<div class="kv"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
 html+=`<div class="sec">简介</div><div class="desc">${d.desc}</div>`;
 right.innerHTML=html;right.style.display='block';
 const rt=right.querySelector('#rt');
 const mk=names=>{infoRefs={};rt.innerHTML=names.map(n=>`<div class="kv"><span>${n[0]}</span><span id="rt_${n[1]}">—</span></div>`).join('');
  for(const n of names)infoRefs[n[1]]=rt.querySelector('#rt_'+n[1]);};
 if(b.kind==='moon'){
  mk([['母星距离','pd'],['与地球距离','ed'],['光行时','lt'],['轨道速度','v']]);
 }else if(b.kind==='sun'){
  mk([['与地球距离','ed'],['光行时','lt']]);
 }else{
  mk([['日心距离','r'],['日心黄经','lon'],['日心黄纬','lat'],['与地球距离','ed'],['光行时','lt'],['近日点','ph'],['远日点','ah'],['轨道速度','v']]);
 }
}
function updateInfo(){
 const b=state.selected;if(!b||!infoRefs)return;
 const R=infoRefs,earth=byKey.earth;
 const ltAU=v=>(v*8.3167).toFixed(v*8.3167<100?1:0)+' 分钟';
 if(b.kind==='moon'){
  R.pd.textContent=b.def.aKm.toLocaleString()+' km';
  const ed=v3len(v3sub(b.realAU,earth.realAU));
  R.ed.textContent=ed.toFixed(4)+' AU';R.lt.textContent=ltAU(ed);
  R.v.textContent=(TAU*b.def.aKm/(Math.abs(b.def.P)*86400)).toFixed(3)+' km/s';
 }else if(b.kind==='sun'){
  const ed=v3len(earth.realAU);
  R.ed.textContent=ed.toFixed(4)+' AU';R.lt.textContent=ltAU(ed);
 }else{
  const isComet=b.kind==='comet';
  const a=isComet?b.elems.a:b.elems[0];
  const eE=isComet?b.elems.e:b.elems[1];
  const r=b.rAU,ecl=b.eclAU;
  R.r.textContent=r.toFixed(3)+' AU';
  R.lon.textContent=(((Math.atan2(ecl[1],ecl[0])/D2R)%360+360)%360).toFixed(1)+'°';
  R.lat.textContent=(Math.asin(ecl[2]/r)/D2R).toFixed(2)+'°';
  const ed=v3len(v3sub(b.realAU,earth.realAU));
  R.ed.textContent=ed.toFixed(3)+' AU';R.lt.textContent=ltAU(ed);
  R.ph.textContent=(a*(1-eE)).toFixed(2)+' AU';
  R.ah.textContent=(a*(1+eE)).toFixed(2)+' AU';
  R.v.textContent=visViva(r,a).toFixed(2)+' km/s';
 }
}
// ---- 标签 ----
function buildLabels(){
 const box=$('labels');
 for(const b of bodies){
  const el=document.createElement('div');
  el.className='lbl';el.textContent=b.def.name;
  el.onclick=()=>select(b);
  box.appendChild(el);b.lbl=el;
 }
}
function pickable(b){
 if(b.kind==='moon'&&!state.show.moons)return false;
 if(b.kind==='comet'&&!state.show.comet)return false;
 return true;
}
function updateLabels(){
 for(const b of bodies){
  const el=b.lbl,s=b.scr;
  const vis=state.show.labels&&pickable(b)&&s.w>0&&s.x>-60&&s.x<cssW()+60&&s.y>-40&&s.y<cssH()+60;
  if(!vis){el.style.display='none';continue;}
  el.style.display='block';
  el.style.left=s.x+'px';
  el.style.top=(s.y-s.r-6)+'px';
  el.style.opacity=clampf(1.15-s.r/120,0.22,0.92);
  el.classList.toggle('sel',state.selected===b);
 }
}
// ---- 开关 ----
const TOGGLES=[['orbits','轨道'],['labels','名称'],['moons','卫星'],['belts','小行星带'],['comet','彗星'],['realscale','真实距离比例'],['bloom','辉光']];
function buildToggles(){
 const box=$('toggles');
 for(const[key,name]of TOGGLES){
  const d=document.createElement('div');
  const on=key==='realscale'?false:state.show[key];
  d.className='tgl'+(on?' on':'');d.innerHTML=`<span class="sw"></span>${name}`;
  d.onclick=()=>{
   if(key==='realscale'){state.compTarget=state.compTarget<0.8?1.0:COMPRESS0;}
   else state.show[key]=!state.show[key];
   const isOn=key==='realscale'?state.compTarget>0.8:state.show[key];
   d.classList.toggle('on',isOn);
  };
  box.appendChild(d);
 }
}
// ---- 选择 ----
function select(b){
 state.selected=b;
 for(const x of bodies)x.listEl&&x.listEl.classList.toggle('sel',x===b);
 showInfo(b);updateInfo();
 focusOn(b);
}
// ---- 时间控制 ----
const playBtn=$('playBtn'),dtEl=$('dt'),spdEl=$('speed'),spdLabel=$('spdLabel'),rangeBadge=$('rangeBadge');
function applySlider(){
 state.slider=parseFloat(spdEl.value);
 state.daysPerSec=sliderToDays(state.slider);
 spdLabel.textContent=formatSpeed(state.daysPerSec);
}
spdEl.addEventListener('input',applySlider);
playBtn.onclick=()=>{state.paused=!state.paused;playBtn.textContent=state.paused?'▶':'❚❚';};
$('nowBtn').onclick=()=>{state.simJD=nowJD();};
window.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
 if(e.code==='Space'){e.preventDefault();playBtn.click();}
 else if(e.code==='ArrowRight'){spdEl.value=Math.min(100,parseFloat(spdEl.value)+5);applySlider();}
 else if(e.code==='ArrowLeft'){spdEl.value=Math.max(-100,parseFloat(spdEl.value)-5);applySlider();}
 else if(e.code==='KeyH')document.body.classList.toggle('uihide');
});
function updateHUD(){
 dtEl.textContent=jdToUTC(state.simJD);
 const y=jdYear(state.simJD);
 rangeBadge.style.display=(y<1800||y>2050)?'inline-block':'none';
}
// ---- 指针交互 ----
let drag=null;const pointers=new Map();
canvas.addEventListener('pointerdown',e=>{
 canvas.setPointerCapture(e.pointerId);
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1)drag={x:e.clientX,y:e.clientY,moved:0};
 canvas.classList.add('drag');
});
canvas.addEventListener('pointermove',e=>{
 const p=pointers.get(e.pointerId);if(!p)return;
 const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(pointers.size===1&&drag){
  drag.moved+=Math.abs(dx)+Math.abs(dy);
  cam.yaw-=dx*0.005;cam.pitch=clampf(cam.pitch+dy*0.005,-1.52,1.52);
 }else if(pointers.size===2){
  const pts=[...pointers.values()];
  const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
  if(canvas._pinch){cam.dist=clampf(cam.dist*canvas._pinch/d,cam.minD,3200);}
  canvas._pinch=d;
 }
});
function endPointer(e){
 pointers.delete(e.pointerId);canvas._pinch=null;
 canvas.classList.remove('drag');
 if(drag&&drag.moved<6)pickAt(e.clientX,e.clientY);
 drag=null;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{
 e.preventDefault();
 cam.dist=clampf(cam.dist*Math.exp(e.deltaY*0.0012),cam.minD,3200);
},{passive:false});
function pickAt(x,y){
 let best=null,bs=1e9;
 for(const b of bodies){
  if(!pickable(b))continue;
  const s=b.scr;if(s.w<=0)continue;
  const d=Math.hypot(s.x-x,s.y-y);
  if(d<Math.max(26,s.r*1.35)){
   const score=d-s.r*0.5;
   if(score<bs){bs=score;best=b;}
  }
 }
 if(best)select(best);
}
// ---- 尺寸 ----
function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 const w=Math.round(cssW()*dpr),h=Math.round(cssH()*dpr);
 if(canvas.width!==w||canvas.height!==h){
  canvas.width=w;canvas.height=h;
  buildFramebuffers(w,h);
 }
}
window.addEventListener('resize',resize);
// ---- 验收钩子 ----
function astroCalc(key,jd){
 const T=centuryFromJD(jd);
 const def=PLANET_DEFS.find(p=>p.key===key);
 if(!def)return null;
 const el=elemAt(def,T);
 const ecl=orbPos(el[0],el[1],el[2],el[3],el[4],el[5],[0,0,0]);
 const r=v3len(ecl);
 return {rAU:r,lonDeg:((Math.atan2(ecl[1],ecl[0])/D2R)%360+360)%360,
  latDeg:Math.asin(ecl[2]/r)/D2R,vKms:visViva(r,el[0])};
}
window.__solar={
 gl,get err(){return gl.getError();},
 get jd(){return state.simJD;},set jd(v){state.simJD=v;},
 now:()=>{state.simJD=nowJD();},
 astro:astroCalc,
 body:k=>{const b=byKey[k];return b?{rAU:b.rAU,posW:b.posW,realAU:b.realAU,dispR:b.dispR,comp:state.comp}:null;},
 msaa:()=>FB.msaa,hdr:()=>HDR_OK,
 fps:()=>state.fps,
 readCenter(){
  const px=new Float32Array(4);
  gl.bindFramebuffer(gl.FRAMEBUFFER,FB.sceneFB);
  gl.readPixels(Math.floor(FB.W/2),Math.floor(FB.H/2),1,1,gl.RGBA,gl.FLOAT,px);
  return [px[0],px[1],px[2]];
 },
 setSpeed:v=>{spdEl.value=v;applySlider();},
 focus:k=>select(byKey[k])
};
// ---- 主循环 ----
let lastT=performance.now();
function frame(t){
 const dt=Math.min((t-lastT)/1000,0.1);lastT=t;
 state.fps=state.fps*0.95+(1/Math.max(dt,1e-4))*0.05;
 resize();
 updateScene(dt);
 updateCamera();
 updateScr();
 renderScene();
 updateLabels();
 updateHUD();
 if(state.frame%6===0)updateInfo();
 if(state.frame%30===0)$('fps').textContent=state.fps.toFixed(0)+' fps';
 state.frame++;
 requestAnimationFrame(frame);
}
// ---- 启动 ----
resize();
buildList();
buildLabels();
buildToggles();
applySlider();
state.selected=byKey.earth;
byKey.earth.listEl.classList.add('sel');
showInfo(byKey.earth);
// URL 参数钩子（便于脚本化验证）：#focus=saturn&dist=14&jd=...&speed=..&pitch=..&yaw=..&paused=1
(function(){
 try{
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.has('jd')){state.simJD=parseFloat(h.get('jd'));}
  if(h.has('speed')){spdEl.value=h.get('speed');applySlider();}
  if(h.has('focus')){
   const b=byKey[h.get('focus')];
   if(b){state.selected=b;
    for(const x of bodies)x.listEl&&x.listEl.classList.toggle('sel',x===b);
    showInfo(b);cam.focus=b;cam.target=b.posW.slice();
    cam.minD=Math.max(b.dispR*1.5,0.5);
    cam.dist=h.has('dist')?parseFloat(h.get('dist')):clampf(b.dispR*(b.ringTy?9:8),b.dispR*2.2,2000);}
  }
  if(h.has('dist'))cam.dist=parseFloat(h.get('dist'));
  if(h.has('pitch'))cam.pitch=parseFloat(h.get('pitch'));
  if(h.has('yaw'))cam.yaw=parseFloat(h.get('yaw'));
  if(h.has('paused'))state.paused=h.get('paused')==='1';
  if(h.has('real')){state.comp=state.compTarget=parseFloat(h.get('real'));}
  if(h.has('bloom'))state.show.bloom=h.get('bloom')==='1';
 }catch(e){console.warn('hash boot',e);}
})();
console.info('[solar] ready · MSAA='+FB.msaa+' · HDR='+HDR_OK);
requestAnimationFrame(frame);
</script>
</body>
