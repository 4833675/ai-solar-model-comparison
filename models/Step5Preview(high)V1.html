<style>

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);

    padding-left:9px;line-height:14px}

  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;backdrop-filter:blur(14px) saturate(1.2);

    background:radial-gradient(circle at 35% 35%,#fff,#ffd28a 45%,#ff9d3c 75%,#c25e00);
    box-shadow:0 0 12px rgba(255,180,80,.85)}
  #brand p{margin-top:6px;font-size:10.5px;color:var(--dim);letter-spacing:.6px;line-height:1.6}

/* ═══════════════════════════════════════════════════════════════
   0. 常量与工具
   ═══════════════════════════════════════════════════════════════ */
const DEG   = Math.PI / 180;
const AUKM  = 149597870.7;
const AU    = 100;                        // 世界尺度：1 AU = 100 units
const UNIT_KM = AUKM / AU;                // 1 unit ≈ 1.496e6 km
const J2000 = 2451545.0;
const DAY   = 86400000;

const dateToJD = ms  => ms / DAY + 2440587.5;
const jdToDate = jd  => new Date((jd - 2440587.5) * DAY);
const mod      = (a,n)=> ((a % n) + n) % n;
const clamp    = (v,a,b)=> Math.min(b, Math.max(a, v));
const fmt      = (n,d=2)=> n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

/** 牛顿迭代解开普勒方程 M = E - e·sinE */
function solveKepler(M, e){
  M = mod(M + Math.PI, 2*Math.PI) - Math.PI;
  let E = M + e * Math.sin(M);
  for (let i=0;i<40;i++){
    const d = (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E));
    E -= d;
    if (Math.abs(d) < 1e-12) break;
  }
  return E;
}

/** 日心黄道坐标 → three.js 坐标（y 轴指向黄北极） */
function elementsToPos(el, jd){
  const T = (jd - J2000) / 36525;
  const a   = el.a  + (el.aD  || 0) * T;
  const e   = el.e  + (el.eD  || 0) * T;
  const inc = (el.i  + (el.iD  || 0) * T) * DEG;
  const L   = (el.L  + (el.LD  || 0) * T) * DEG;
  const wbar= (el.w  + (el.wD  || 0) * T) * DEG;
  const om  = (el.om + (el.omD || 0) * T) * DEG;
  const w   = wbar - om;
  const E   = solveKepler(L - wbar, e);
  const xp  = a * (Math.cos(E) - e);
  const yp  = a * Math.sqrt(Math.max(0, 1-e*e)) * Math.sin(E);
  const cw=Math.cos(w),  sw=Math.sin(w),  cO=Math.cos(om), sO=Math.sin(om);
  const ci=Math.cos(inc),si=Math.sin(inc);
  const x = (cw*cO - sw*sO*ci)*xp + (-sw*cO - cw*sO*ci)*yp;
  const y = (cw*sO + sw*cO*ci)*xp + (-sw*sO + cw*cO*ci)*yp;
  const z = (sw*si)*xp + (cw*si)*yp;
  return [x, z, -y];
}
function elementsOf(el, jd){
  const T = (jd - J2000) / 36525;
  return {
    a  : el.a  + (el.aD ||0)*T,
    e  : el.e  + (el.eD ||0)*T,
    i  : (el.i  + (el.iD ||0)*T)*DEG,
    w  : (el.w  + (el.wD ||0)*T)*DEG,
    om : (el.om + (el.omD||0)*T)*DEG
  };
}
/** 轨道椭圆采样（世界单位，含闭合点） */
function orbitPoints(el, jd, segs=600){
  const {a,e,i,w,om} = elementsOf(el, jd);
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(om),sO=Math.sin(om),ci=Math.cos(i),si=Math.sin(i);
  const pts=[];
  for (let k=0;k<=segs;k++){
    const E = k/segs * 2*Math.PI;
    const xp = a*(Math.cos(E)-e), yp = a*Math.sqrt(Math.max(0,1-e*e))*Math.sin(E);
    pts.push(
      ((cw*cO - sw*sO*ci)*xp + (-sw*cO - cw*sO*ci)*yp) * AU,
      ((sw*si)*xp + (cw*si)*yp) * AU,
      -((cw*sO + sw*cO*ci)*xp + (-sw*sO + cw*cO*ci)*yp) * AU
    );
  }
  return pts;
}

/* ═══════════════════════════════════════════════════════════════
   2. 程序化贴图（离线兜底 + 附加细节）
   ═══════════════════════════════════════════════════════════════ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash3(x,y,z){
  let n = Math.imul(x,374761393) + Math.imul(y,668265263) + Math.imul(z,1274126177);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16)) >>> 0) / 4294967295;
}
function vnoise(x,y,z){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), w=zf*zf*(3-2*zf);
  const c000=hash3(xi,yi,zi),     c100=hash3(xi+1,yi,zi);
  const c010=hash3(xi,yi+1,zi),   c110=hash3(xi+1,yi+1,zi);
  const c001=hash3(xi,yi,zi+1),   c101=hash3(xi+1,yi,zi+1);
  const c011=hash3(xi,yi+1,zi+1), c111=hash3(xi+1,yi+1,zi+1);
  const x00=c000*(1-u)+c100*u, x10=c010*(1-u)+c110*u;
  const x01=c001*(1-u)+c101*u, x11=c011*(1-u)+c111*u;
  return (x00*(1-v)+x10*v)*(1-w) + (x01*(1-v)+x11*v)*w;
}
function fbm3(x,y,z,oct=5,lac=2.0,gain=0.5){
  let f=0,a=0.5,fr=1,norm=0;
  for(let i=0;i<oct;i++){ f+=a*vnoise(x*fr,y*fr,z*fr); norm+=a; fr*=lac; a*=gain; }
  return f/norm;
}
const makeCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

/** 岩石 / 冰质天体表面 */
function genRock(w,h,o){
  const c=makeCanvas(w,h), ctx=c.getContext('2d'), img=ctx.createImageData(w,h);
  const rand=mulberry32(o.seed||1), stops=o.stops;
  const craters=[];
  for(let i=0;i<(o.craters||0);i++)
    craters.push({u:rand(), v:rand(), r:(0.006+rand()*0.05), d:0.55+rand()*0.5});
  const samp=(u,v)=>{
    const lon=u*Math.PI*2, lat=(0.5-v)*Math.PI;
    const cx=Math.cos(lat)*Math.cos(lon), cy=Math.sin(lat), cz=Math.cos(lat)*Math.sin(lon);
    let n=fbm3(cx*3.2,cy*3.2,cz*3.2,5)*0.55 + fbm3(cx*9+11,cy*9+3,cz*9+7,4)*0.3;
    if(o.polar) n += Math.pow(Math.abs(cy),3)*0.5;
    let hh=n;
    for(const cr of craters){
      let dLon=Math.abs(u-cr.u)*Math.PI*2; if(dLon>Math.PI) dLon=Math.PI*2-dLon;
      const dLat=Math.abs(v-cr.v)*Math.PI;
      const d=Math.sqrt(dLon*dLon+dLat*dLat)/(cr.r*Math.PI);
      if(d<1) hh += cr.d*Math.cos(d*1.5708)*0.55;
    }
    return clamp(hh,0,1);
  };
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const t=samp(x/w,y/h);
    let col;
    if(t<=stops[0][0]) col=stops[0][1];
    else{
      let k=1; while(k<stops.length-1 && t>stops[k][0]) k++;
      const a=stops[k-1], b=stops[k];
      const f=(t-a[0])/Math.max(1e-6,b[0]-a[0]);
      col=[a[1][0]+(b[1][0]-a[1][0])*f, a[1][1]+(b[1][1]-a[1][1])*f, a[1][2]+(b[1][2]-a[1][2])*f];
    }
    const i=(y*w+x)*4;
    img.data[i]=col[0]*255; img.data[i+1]=col[1]*255; img.data[i+2]=col[2]*255; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  return c;
}
/** 气态巨行星条带 */
function genGas(w,h,o){
  const c=makeCanvas(w,h), ctx=c.getContext('2d'), img=ctx.createImageData(w,h);
  const cols=o.cols, nb=o.bands||9;
  for(let y=0;y<h;y++){
    const v=y/h, lat=(0.5-v)*Math.PI;
    for(let x=0;x<w;x++){
      const u=x/w, lon=u*Math.PI*2;
      const warp=fbm3(Math.cos(lon)*2+40,Math.sin(lon)*2,lat*3.4,5)-0.5;
      const warp2=fbm3(Math.cos(lon)*7+9,Math.sin(lon)*7,lat*7,4)-0.5;
      const bw=Math.sin((lat*1.7+warp*1.5)*nb + warp2*0.7);
      const t=clamp(0.5+0.5*bw*1.15+(fbm3(lon*3,lat*9,0,3)-0.5)*0.35,0,1);
      const streak=fbm3(lon*14,lat*30,warp*6,4);
      const idx=t*(cols.length-1);
      const i0=Math.min(Math.floor(idx),cols.length-1), i1=Math.min(i0+1,cols.length-1), f=idx-i0;
      const s=0.86+0.22*streak;
      const i=(y*w+x)*4;
      img.data[i]  =Math.min(255,(cols[i0][0]+(cols[i1][0]-cols[i0][0])*f)*s*255);
      img.data[i+1]=Math.min(255,(cols[i0][1]+(cols[i1][1]-cols[i0][1])*f)*s*255);
      img.data[i+2]=Math.min(255,(cols[i0][2]+(cols[i1][2]-cols[i0][2])*f)*s*255);
      img.data[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  for(const s of (o.spots||[])){        // [u, v, 半径, [r,g,b]]
    const cx=s[0]*w, cy=s[1]*h, rx=s[2]*w, ry=s[2]*h*0.6, col=s[3];
    ctx.save(); ctx.translate(cx,cy); ctx.scale(1, ry/rx);
    const g=ctx.createRadialGradient(0,0,0,0,0,rx);
    g.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},1)`);
    g.addColorStop(0.7,`rgba(${col[0]},${col[1]},${col[2]},0.55)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,rx,0,7); ctx.fill(); ctx.restore();
  }
  return c;
}
/** 云层 */
function genClouds(w,h,seed){
  const c=makeCanvas(w,h), ctx=c.getContext('2d'), img=ctx.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const u=x/w,v=y/h,lon=u*Math.PI*2,lat=(0.5-v)*Math.PI;
    const n=fbm3(Math.cos(lon)*3+seed,Math.sin(lon)*3,Math.sin(lat)*5,6,2.2,0.55);
    const a=clamp((n-0.44)*3.2,0,1);
    const i=(y*w+x)*4;
    img.data[i]=255;img.data[i+1]=255;img.data[i+2]=255;img.data[i+3]=a*255;
  }
  ctx.putImageData(img,0,0);return c;
}
/** 由彩色图高斯差分近似法线贴图 */
function genNormal(src,r=2){
  const w=src.width,h=src.height;
  const c=makeCanvas(w,h), ctx=c.getContext('2d');
  ctx.drawImage(src,0,0);
  const d=ctx.getImageData(0,0,w,h), out=ctx.createImageData(w,h);
  const lum=(i)=>(d.data[i]*0.299+d.data[i+1]*0.587+d.data[i+2]*0.114)/255;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    const dx=lum((y*w+((x+r)%w))*4)-lum((y*w+((x-r+w)%w))*4);
    const dy=lum((((y+r)%h)*w+x)*4)-lum(((((y-r)+h)%h)*w+x)*4);
    let nx=-dx*r*2.2, ny=-dy*r*2.2, nz=1;
    const len=Math.hypot(nx,ny,nz);
    out.data[i]=(nx/len*0.5+0.5)*255; out.data[i+1]=(ny/len*0.5+0.5)*255;
    out.data[i+2]=(nz/len*0.5+0.5)*255; out.data[i+3]=255;
  }
  ctx.putImageData(out,0,0);return c;
}

function genRing(profile,w=2048){
  const c=makeCanvas(w,4), ctx=c.getContext('2d'), img=ctx.createImageData(w,4);
  const col=(t)=>{
    let k=0; while(k<profile.length-2 && t>profile[k+1][0]) k++;
    const a=profile[k],b=profile[k+1];
    const f=clamp((t-a[0])/Math.max(1e-6,b[0]-a[0]),0,1);
    return a[1]+(b[1]-a[1])*f;
  };
  for(let x=0;x<w;x++){
    const t=x/(w-1), a=col(t);
    const shade=0.72+0.28*fbm3(t*90,0.5,0.5,3,2,0.5);
    for(let y=0;y<4;y++){
      const i=(y*w+x)*4;
      img.data[i]=216*shade; img.data[i+1]=196*shade; img.data[i+2]=162*shade; img.data[i+3]=a*255;
    }
  }
  ctx.putImageData(img,0,0);return c;
}
function genDot(soft=0.55){
  const s=64,c=makeCanvas(s,s),ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(soft,'rgba(255,255,255,.55)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,s,s);return c;
}
function genGlow(col,stops){
  const w=256,c=makeCanvas(w,w),ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);
  for(const [p,a] of stops) g.addColorStop(p,`rgba(${col[0]},${col[1]},${col[2]},${a})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,w,w);return c;
}

function normalFromImage(img, r=2){

  const h=Math.max(8, Math.round(w*(img.naturalHeight||img.height||256)/(img.naturalWidth||img.width||512)));
  const c=makeCanvas(w,h), ctx=c.getContext('2d');
  ctx.drawImage(img,0,0,w,h);
  return canvasTex(genNormal(c,r), false);
}
/** 光强 1/r² 衰减补偿：让远近行星亮度接近，同时保留远行星略暗的真实感 */
const BRIGHT = d => clamp(Math.pow(d/100, 1.45), 0.18, 620);

/* ═══════════════════════════════════════════════════════════════
   4. 星空 + 银河带

const STAR_COLORS=[[155,176,255],[170,191,255],[202,215,255],[248,248,255],[255,244,234],[255,210,161],[255,198,138]];
function starMaterial(){
  return new THREE.ShaderMaterial({
    uniforms:{uMap:{value:canvasTex(genDot(0.4),false)}, uPR:{value:renderer.getPixelRatio()}},
    vertexShader:`attribute float aSize;varying vec3 vC;uniform float uPR;
      void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aSize*2.0*uPR;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform sampler2D uMap;varying vec3 vC;
      void main(){vec4 t=texture2D(uMap,gl_PointCoord);if(t.a<0.02)discard;
      gl_FragColor=vec4(vC*t.a*1.6,1.0);}`,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, vertexColors:true
  });
}
const milkyway = (function(){
  const R=26000, v=new THREE.Vector3();

  // 全天均匀星场
  const N=9000, pos=new Float32Array(N*3), col=new Float32Array(N*3), siz=new Float32Array(N);
  const rand=mulberry32(7);
  for(let i=0;i<N;i++){
    v.set(rand()*2-1,rand()*2-1,rand()*2-1);
    if(v.lengthSq()<0.04){i--;continue;}
    v.normalize().multiplyScalar(R*(0.75+rand()*0.25));
    pos[i*3]=v.x;pos[i*3+1]=v.y;pos[i*3+2]=v.z;
    const m=rand(), c=STAR_COLORS[m<0.3?0:m<0.6?1:m<0.85?2:m<0.94?3:m<0.98?4:6];
    const b=0.35+rand()*0.65;
    col[i*3]=c[0]/255*b; col[i*3+1]=c[1]/255*b; col[i*3+2]=c[2]/255*b;
    siz[i]=(m>0.985?2.6:m>0.9?1.9:1.0)*(0.7+rand()*0.6);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(siz,1));
  const p=new THREE.Points(g,starMaterial()); p.frustumCulled=false; scene.add(p);

  // 银河带
  const M=14000, mpos=new Float32Array(M*3), mcol=new Float32Array(M*3), msiz=new Float32Array(M);
  const rand2=mulberry32(23), tiltA=60*DEG, bw=0.13;
  for(let i=0;i<M;i++){
    const a=rand2()*Math.PI*2;
    let d=0; for(let k=0;k<3;k++) d+=rand2()*bw/3;
    d*=(rand2()<0.5?-1:1);
    const ca=Math.cos(a), sa=Math.sin(a);
    const r=R*(0.85+rand2()*0.15), j=(rand2()-0.5)*R*0.04;
    mpos[i*3]=ca*r+j;
    mpos[i*3+1]=(sa*Math.cos(tiltA)-d)*r+j;
    mpos[i*3+2]=(sa*Math.sin(tiltA))*r+j;
    const w=1-Math.min(1,Math.abs(d)/bw);
    const c=STAR_COLORS[rand2()<0.5?2:rand2()<0.7?3:5];
    const b=0.10+rand2()*0.4*w;
    mcol[i*3]=c[0]/255*b; mcol[i*3+1]=c[1]/255*b; mcol[i*3+2]=c[2]/255*b;
    msiz[i]=0.7+rand2()*0.7;
  }
  const g2=new THREE.BufferGeometry();
  g2.setAttribute('position',new THREE.BufferAttribute(mpos,3));
  g2.setAttribute('color',new THREE.BufferAttribute(mcol,3));
  g2.setAttribute('aSize',new THREE.BufferAttribute(msiz,1));
  const p2=new THREE.Points(g2,starMaterial()); p2.frustumCulled=false; scene.add(p2);
  return p2;
})();

/* ═══════════════════════════════════════════════════════════════
   5. 太阳：表层着色器 / 光晕 / 点光源
   ═══════════════════════════════════════════════════════════════ */
const SUN_NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const sunGroup = new THREE.Group(); scene.add(sunGroup);
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), new THREE.ShaderMaterial({
  uniforms:{ uTime:{value:0},
    uA:{value:new THREE.Color(1.00,0.42,0.07)},
    uB:{value:new THREE.Color(1.00,0.90,0.62)},
    uC:{value:new THREE.Color(0.30,0.10,0.02)} },
  vertexShader:`varying vec3 vP;varying vec3 vN;varying vec3 vV;
    void main(){vP=position;vN=normalize(normalMatrix*normal);
    vec4 mv=modelViewMatrix*vec4(position,1.0);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`${SUN_NOISE}
    uniform float uTime;uniform vec3 uA,uB,uC;varying vec3 vP;varying vec3 vN;varying vec3 vV;
    void main(){
      vec3 p=normalize(vP);
      float t=uTime*0.05;
      float g1=snoise(p*2.6+vec3(0.0,0.0,t));
      float g2=snoise(p*6.3+vec3(t*0.8,0.0,-t));
      float g3=snoise(p*13.0+vec3(0.0,t*1.4,0.0));
      float g=0.5+0.5*(g1*0.55+g2*0.32+g3*0.13);
      float spot=smoothstep(0.60,0.90,snoise(p*1.9+31.0));
      float limb=pow(clamp(dot(normalize(vN),normalize(vV)),0.0,1.0),0.42);
      float heat=g*limb;
      vec3 col=mix(uA,uB,smoothstep(0.10,0.95,heat));
      col=mix(col,uC,spot*0.80);
      col+=uB*pow(heat,4.0)*0.55;
      gl_FragColor=vec4(col*(0.62+0.42*heat),1.0);
    }`
}));

function atmoMesh(cfg, radius){
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 44), new THREE.ShaderMaterial({
    uniforms:{uColor:{value:new THREE.Color(cfg.color)},uPow:{value:cfg.power||3.0},uInt:{value:cfg.inten||1.0}},
    vertexShader:`varying vec3 vN;varying vec3 vV;
      void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);vN=normalize(normalMatrix*normal);
      vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform vec3 uColor;uniform float uPow,uInt;varying vec3 vN;varying vec3 vV;
      void main(){float d=max(dot(normalize(vN),normalize(vV)),0.0);
      float f=pow(1.0-d,uPow);gl_FragColor=vec4(uColor*f*uInt,1.0);}`,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
  }));
  m.scale.setScalar(radius);
  m.__atmoR = cfg.radius;
  return m;
}

function buildPlanet(p){
  const pivot=new THREE.Group(), tilt=new THREE.Group(), spin=new THREE.Group();

  let mat, cloudMat=null;

    mat=new THREE.MeshStandardMaterial({color, roughness:0.82, metalness:0.02});
    mat.map=canvasTex(genRock(768,384,{seed:3,craters:0,amp:0.9,

             [0.62,[0.30,0.36,0.20]],[1,[0.76,0.72,0.64]]]}));
    mat.emissiveMap=canvasTex(genClouds(512,256,3),false);
    mat.emissive=new THREE.Color(0xffdca8);

    if(p.key==='jupiter') cv=genGas(768,384,{seed:7,bands:12,

        spots:[[0.33,0.655,0.062,[196,88,52]],[0.62,0.42,0.032,[232,224,210]],[0.78,0.55,0.026,[210,190,170]]]});
    else if(p.key==='saturn') cv=genGas(768,384,{seed:9,bands:9,
        cols:[[0.72,0.63,0.44],[0.86,0.79,0.62],[0.94,0.88,0.75],[0.78,0.70,0.55],[0.96,0.92,0.82]]});
    else if(p.key==='uranus') cv=genGas(384,192,{seed:15,bands:5,
        cols:[[0.55,0.82,0.85],[0.66,0.88,0.90],[0.58,0.84,0.87],[0.72,0.90,0.92]]});
    else if(p.key==='neptune') cv=genGas(768,384,{seed:17,bands:7,
        cols:[[0.15,0.30,0.65],[0.20,0.38,0.75],[0.28,0.48,0.86],[0.36,0.58,0.92],[0.22,0.42,0.80]],
        spots:[[0.40,0.62,0.055,[18,32,86]],[0.70,0.44,0.030,[220,230,250]]]});
    else if(p.key==='venus') cv=genRock(768,384,{seed:19,craters:0,amp:0.5,
        stops:[[0,[0.72,0.60,0.34]],[0.5,[0.87,0.78,0.55]],[1,[0.98,0.94,0.80]]]});
    else cv=genRock(768,384,{seed:p.key.length*31+5,craters:34,amp:1.18,
        stops:[[0,[0.28,0.26,0.24]],[0.42,[0.50,0.47,0.44]],[0.62,[0.66,0.62,0.58]],[0.82,[0.80,0.76,0.72]],[1,[0.93,0.91,0.89]]]});
    mat.map=canvasTex(cv);
    mat.normalMap=canvasTex(genNormal(cv),false);

}

function buildRing(p){
  const {inner,outer,opacity}=p.ring;
  const segs=256, rad=10, pos=[], uv=[], idx=[];
  for(let i=0;i<=rad;i++){
    const t=i/rad, r=inner+(outer-inner)*t;
    for(let j=0;j<=segs;j++){
      const a=j/segs*Math.PI*2;
      pos.push(Math.cos(a)*r, 0, Math.sin(a)*r);
      uv.push(t, j/segs);
    }
  }
  for(let i=0;i<rad;i++)for(let j=0;j<segs;j++){
    const a=i*(segs+1)+j, b=a+segs+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(uv),2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat=new THREE.ShaderMaterial({
    uniforms:{
      uMap:{value:canvasTex(genRing(RING_PROFILES[p.key]||RING_PROFILES.saturn))},
      uOpacity:{value:opacity},
      uSun:{value:new THREE.Vector3()},
      uPlanet:{value:new THREE.Vector3()},
      uPlanetR:{value:p.vis},
      uTint:{value:new THREE.Color(p.key==='uranus'?0xa8d8e0:0xd8c8a8)}
    },
    vertexShader:`varying vec2 vUv;varying vec3 vW;varying vec3 vNW;
      void main(){vUv=uv;
        vec4 wp=modelMatrix*vec4(position,1.0);vW=wp.xyz;
        vNW=normalize(mat3(modelMatrix)*vec3(0.0,1.0,0.0));
        gl_Position=projectionMatrix*viewMatrix*wp;}`,
    fragmentShader:`uniform sampler2D uMap;uniform float uOpacity,uPlanetR;
      uniform vec3 uSun,uPlanet,uTint;varying vec2 vUv;varying vec3 vW;varying vec3 vNW;
      void main(){
        vec4 c=texture2D(uMap,vec2(vUv.x,0.5));
        float a=c.a*uOpacity;
        if(a<0.012) discard;
        vec3 L=uSun-vW; float dL=length(L); L/=dL;
        float nl=abs(dot(L,normalize(vNW)));
        float lit=0.20+0.80*nl;
        // 行星本体投影在环上的阴影
        vec3 P=vW-uPlanet;
        float t=-dot(P,L);
        vec3 cp=P+t*L;
        float dc=length(cp);
        float sh=1.0-0.86*smoothstep(uPlanetR*0.96,uPlanetR*1.12,dc)*step(0.0,t)*step(t,dL);
        gl_FragColor=vec4(c.rgb*uTint*lit*sh+vec3(0.02)*sh, a);
      }`,
    transparent:true, side:THREE.DoubleSide, depthWrite:false
  });
  const ring=new THREE.Mesh(g, mat);
  ring.rotateX(-Math.PI/2);
  p._tilt.add(ring);
  p._ring=ring;
  ring.scale.setScalar(p.vis);
}

function buildMoon(parent, md){

  const vis=Math.max(md.visMin || (md.radius/parent.radius*parent.vis*0.55), 0.022);
  const mat=new THREE.MeshStandardMaterial({

    roughness:0.95, metalness:0});

  if(md.key==='io')      cv=genRock(384,192,{seed:21,craters:4,amp:0.9,stops:[[0,[0.62,0.5,0.2]],[0.5,[0.86,0.78,0.4]],[1,[0.95,0.9,0.6]]]});
  else if(md.key==='titan')    cv=genGas(384,192,{seed:23,bands:4,cols:[[0.85,0.68,0.32],[0.94,0.84,0.55],[0.9,0.75,0.4]]});
  else if(md.key==='moon')     cv=genRock(384,192,{seed:25,craters:52,amp:1.2,stops:[[0,[0.24,0.23,0.22]],[0.5,[0.55,0.54,0.52]],[1,[0.9,0.89,0.87]]]});
  else if(md.key==='triton')   cv=genRock(384,192,{seed:27,craters:10,amp:0.8,stops:[[0,[0.5,0.55,0.6]],[0.55,[0.82,0.86,0.9]],[1,[0.96,0.98,1.0]]]});
  else cv=genRock(384,192,{seed:md.key.length*97+3,craters:26,amp:1.05,stops:[[0,[0.3,0.3,0.3]],[0.5,[0.66,0.65,0.62]],[0.85,[0.85,0.84,0.82]],[1,[0.95,0.94,0.92]]]});
  mat.map=canvasTex(cv);
  mat.normalMap=canvasTex(genNormal(cv),false);
  mat.normalScale=new THREE.Vector2(1,1);
  // 卫星贴图在数据表里已写成完整 URL，此处兼容两种写法
  if(md.tex&&md.tex.map) loadTex(md.tex.map.startsWith('http')?md.tex.map:TX+md.tex.map, mat, 'map', true,
    ()=>{ mat.normalMap=normalFromImage(mat.map.image); mat.normalScale=new THREE.Vector2(1,1); mat.needsUpdate=true; });

function makeTail(count, color, size, spd, spread){
  const g=new THREE.BufferGeometry();
  const c=new THREE.Color(color[0],color[1],color[2]);
  const colA=new Float32Array(count*3);
  for(let i=0;i<count;i++){ colA[i*3]=c.r; colA[i*3+1]=c.g; colA[i*3+2]=c.b; }
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count*3),3));
  g.setAttribute('color',    new THREE.BufferAttribute(colA,3));
  g.setAttribute('aAlpha',   new THREE.BufferAttribute(new Float32Array(count),1));
  const m=new THREE.ShaderMaterial({
    uniforms:{uMap:{value:canvasTex(genDot(0.35),false)}, uSize:{value:size}, uPR:{value:renderer.getPixelRatio()}},
    vertexShader:`attribute float aAlpha;varying vec3 vC;varying float vA;uniform float uSize,uPR;
      void main(){vC=color;vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.0);
      float s=uSize*uPR*(260.0/max(-mv.z,0.05));
      gl_PointSize=clamp(s,0.0,40.0);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform sampler2D uMap;varying vec3 vC;varying float vA;
      void main(){vec4 t=texture2D(uMap,gl_PointCoord);if(t.a<0.03)discard;
      gl_FragColor=vec4(vC*t.a*vA*1.5,1.0);}`,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, vertexColors:true
  });
  const p=new THREE.Points(g,m); p.frustumCulled=false;
  return {points:p,g,count,life:new Float32Array(count),max:new Float32Array(count),
    vel:new Float32Array(count*3),spd,spread,isDust:color===color};
}

function updateComet(dayStep){
  const p=cometPos(simJD);
  cometGroup.position.copy(p);
  const d=p.length()/AU;
  const active=d<3.2;
  COMET._coma.visible = d<2.4;
  if(COMET._coma.visible) COMET._coma.material.opacity=clamp(1.8-d,0,1.4)*0.85;
  cometBody.rotation.y+=0.004;

  const sunDir=p.clone().negate().normalize();
  for(const t of [TAIL_ION,TAIL_DUST]){
    const pos=t.g.attributes.position.array, al=t.g.attributes.aAlpha.array;
    for(let i=0;i<t.count;i++){
      if(t.life[i]>0){
        t.life[i]-=Math.abs(dayStep);
        pos[i*3]  +=t.vel[i*3]  *t.spd*Math.abs(dayStep);
        pos[i*3+1]+=t.vel[i*3+1]*t.spd*Math.abs(dayStep);
        pos[i*3+2]+=t.vel[i*3+2]*t.spd*Math.abs(dayStep);
        al[i]=Math.max(0,t.life[i]/t.max[i])*0.9;
      } else if(active){
        t.life[i]=t.max[i]=16+Math.random()*24;
        pos[i*3]=(Math.random()-0.5)*0.012;
        pos[i*3+1]=(Math.random()-0.5)*0.012;
        pos[i*3+2]=(Math.random()-0.5)*0.012;
        const sw=t.spread*(Math.random()-0.5);
        _v.copy(sunDir);
        _v.x+=sw; _v.z+=sw; _v.normalize();
        if(t===TAIL_DUST){                       // 尘埃尾沿轨道切线方向弯曲拖尾
          _v2.copy(p).cross(_v).normalize().multiplyScalar(0.28*(Math.random()-0.5));
          _v.add(_v2).normalize();
        }
        t.vel[i*3]=_v.x; t.vel[i*3+1]=_v.y; t.vel[i*3+2]=_v.z;
        al[i]=0.95;
      }
    }
    t.g.attributes.position.needsUpdate=true;
    t.g.attributes.aAlpha.needsUpdate=true;
  }
}

      if(c===p._ring){ c.scale.setScalar(p.vis*f); if(c.material.uniforms) c.material.uniforms.uPlanetR.value=p.vis*f; }

const clock3=new THREE.Clock(), dummy=new THREE.Object3D();

function updateBelt(){
  for(let i=0;i<ROCKS;i++){
    const a=ad.a[i], e=ad.e[i];
    const n=2*Math.PI/(365.25*Math.pow(a,1.5));
    const M=ad.M0[i]+simJD*n;
    const E=M+2*e*Math.sin(M)+1.25*e*e*Math.sin(2*M);
    const r=a*(1-e*Math.cos(E));
    const th=Math.atan2(Math.sqrt(1-e*e)*Math.sin(E),Math.cos(E)-e)+ad.w[i];
    const x=Math.cos(ad.om[i])*Math.cos(th)-Math.sin(ad.om[i])*Math.sin(th)*Math.cos(ad.inc[i]);
    const z=Math.sin(ad.om[i])*Math.cos(th)+Math.cos(ad.om[i])*Math.sin(th)*Math.cos(ad.inc[i]);
    const y=Math.sin(th)*Math.sin(ad.inc[i]);
    const sp=ad.spin[i]+simJD*0.02;
    dummy.position.set(x*r*AU, y*r*AU, -z*r*AU);
    dummy.rotation.set(sp,sp*0.7,sp*0.4);
    dummy.scale.setScalar(ad.size[i]);
    dummy.updateMatrix();
    belt.setMatrixAt(i,dummy.matrix);
  }
  belt.instanceMatrix.needsUpdate=true;
}
function updateTrojans(){
  const j=PLANET_MAP.jupiter;
  const p=elementsToPos(j.el,simJD);
  const lonJ=Math.atan2(-p[2],p[0]);
  for(let i=0;i<TROJANS.arr.length;i++){
    const o=TROJANS.arr[i], ang=lonJ+o.lag*DEG, a=o.a;
    dummy.position.set(Math.cos(ang)*a*AU, o.d, Math.sin(ang)*a*AU);
    dummy.rotation.set(i,i*0.5,0);
    dummy.scale.setScalar(0.02+(i%3)*0.008);
    dummy.updateMatrix();
    TROJANS.mesh.setMatrixAt(i,dummy.matrix);
  }
  TROJANS.mesh.instanceMatrix.needsUpdate=true;
}
const PLANET_MAP={}; PLANETS.forEach(p=>PLANET_MAP[p.key]=p);

function updateLabels(){
  if(!state.labels){ labelLayer.style.display='none'; return; }
  labelLayer.style.display='block';
  const w=innerWidth,h=innerHeight;
  for(const L of labels){
    L.pivot.getWorldPosition(labelV);
    if(L.isMoon && state.focus!==L.body.key && state.focus!==L.body._parent.key){
      L.el.style.display='none'; continue;
    }
    const dist=labelV.distanceTo(camera.position);
    labelV.project(camera);
    if(labelV.z>1){ L.el.style.display='none'; continue; }
    const x=(labelV.x*0.5+0.5)*w, y=(-labelV.y*0.5+0.5)*h;
    if(x<-80||x>w+80||y<-40||y>h+40){ L.el.style.display='none'; continue; }
    L.el.style.display='block';
    L.el.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px)`;
    L.el.style.opacity=state.focus===L.body.key?1:clamp(0.24+300/Math.max(dist,20),0.18,0.72);
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock3.getDelta(),0.1);
  const simDt=state.paused?0:dt*state.rate;
  simJD+=simDt;

  sunMesh.material.uniforms.uTime.value+=dt;
  sunMesh.rotation.y+=dt*0.01;

  for(const p of PLANETS){
    const pos=elementsToPos(p.el,simJD);
    p._pivot.position.set(pos[0]*AU,pos[1]*AU,pos[2]*AU);
    p._spin.rotation.y=2*Math.PI*(simJD/p.rot);
    if(p._ring) p._ring.material.uniforms.uSun.value.copy(sunGroup.position);
    if(p._ring) p._ring.material.uniforms.uPlanet.value.copy(p._pivot.position);
    for(const md of (p.moonsData||[])){
      const f=md._factor||1;
      const n=2*Math.PI/md.P;
      const M=md.M0*DEG+simJD*n*md.dir;
      const th=M+2*md.e*Math.sin(M);
      const rr=md.ar*p.vis*f;
      const ci=Math.cos(md.inc*DEG),si=Math.sin(md.inc*DEG);
      const cO=Math.cos(md.om*DEG),sO=Math.sin(md.om*DEG);
      const x0=Math.cos(th)*rr, y0=Math.sin(th)*rr;
      const x=cO*x0-sO*y0*ci, z=sO*x0+cO*y0*ci, y=y0*si;
      md._pivot.position.set(p._pivot.position.x+x, p._pivot.position.y+y, p._pivot.position.z-z);
      md._mesh.lookAt(p._pivot.position.x, p._pivot.position.y, p._pivot.position.z);
    }
  }

  updateBelt();
  updateTrojans();
  updateComet(simDt);

  // 跟随时把相机与目标一起平移，保持相对视角
  if(focusBody===SUN || !focusBody._pivot) _wp.set(0,0,0);
  else focusBody._pivot.getWorldPosition(_wp);
  const dx=_wp.x-controls.target.x, dy=_wp.y-controls.target.y, dz=_wp.z-controls.target.z;
  controls.target.x+=dx; controls.target.y+=dy; controls.target.z+=dz;
  camera.position.x+=dx; camera.position.y+=dy; camera.position.z+=dz;

  if(wantDist){
    _off.copy(camera.position).sub(controls.target);
    const cur=_off.length();
    const nd=cur+(wantDist-cur)*(1-Math.exp(-dt*3.0));
    camera.position.copy(controls.target).add(_off.setLength(nd||wantDist));
    if(Math.abs(nd-wantDist)/wantDist<0.004) wantDist=0;
  }
  controls.minDistance=Math.max(curRadius(focusBody)*1.5, 0.0008);

  controls.update();
  updateLabels();
  updateClock();
  composer.render();

  fpsN++; fpsT+=dt;
  if(fpsT>0.5){ fpsEl.textContent=`${Math.round(fpsN/fpsT)} FPS`; fpsN=0; fpsT=0; }
}
focusOn('sun');
document.getElementById('loader').classList.add('hide');
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth,innerHeight);
});
</script>
</body>
