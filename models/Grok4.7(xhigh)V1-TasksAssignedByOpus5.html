function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rngGauss(rnd) {
  let u = 1 - rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rnd());
}
function halfNormal(rnd, mean) {
  const s = mean / Math.sqrt(2 / Math.PI);
  return Math.abs(rngGauss(rnd)) * s;
}
function meanMotion(a) { return TAU / (365.25 * Math.pow(a, 1.5)); }

function buildBelts() {
  const rnd = mulberry32(0x51A7);
  const jupN = 3034.74612775 * DEG / 36525;
  const nepN = 218.45945325 * DEG / 36525;
  const jupL = 34.39644051 * DEG;
  const parts = [];
  function push(a, e, Ideg, Om, w, M0, n, size, col) {
    parts.push(a, e, Ideg * DEG, Om, w, M0, n, size, col[0], col[1], col[2]);
  }
  const gaps = [[2.502,0.022,0.93],[2.825,0.016,0.85],[2.958,0.012,0.70],[3.279,0.020,0.90],[2.065,0.010,0.60]];
  function keep(a) {
    let p = 1;
    for (const [c, sig, str] of gaps) {
      const x = (a - c) / sig;
      p *= 1 - str * Math.exp(-x * x);
    }
    const g = (a - 2.72) / 0.55;
    return p * Math.exp(-(g * g));
  }
  let guard = 0;
  while (parts.length / 11 < 9000 && guard++ < 80000) {
    const a = 2.06 + rnd() * (3.28 - 2.06);
    if (rnd() > keep(a)) continue;
    const e = Math.min(0.34, halfNormal(rnd, 0.14));
    const I = halfNormal(rnd, 8);
    push(a, e, I, rnd()*TAU, rnd()*TAU, rnd()*TAU, meanMotion(a), 0.7+rnd()*0.8, [0.62,0.52,0.38]);
  }
  for (let i = 0; i < 900; i++) {
    const a = 3.90 + rngGauss(rnd) * 0.09;
    const e = 0.10 + rnd() * 0.20;
    push(a, e, halfNormal(rnd, 9), rnd()*TAU, rnd()*TAU, rnd()*TAU, meanMotion(Math.max(a, 2)), 0.75+rnd()*0.7, [0.55,0.62,0.48]);
  }
  for (let i = 0; i < 2000; i++) {
    const sign = i < 1000 ? 1 : -1;
    const M0 = jupL + sign * 60 * DEG + rngGauss(rnd) * 26 * DEG;
    const a = 5.202 + rngGauss(rnd) * 0.04;
    push(a, Math.min(0.22, halfNormal(rnd, 0.06)), halfNormal(rnd, 12), rnd()*TAU, rnd()*TAU, M0, jupN, 0.8+rnd()*0.9, [0.78,0.66,0.40]);
  }
  const nPlu = Math.round(6000 * 0.22), nCls = Math.round(6000 * 0.64), nSca = 6000 - nPlu - nCls;
  for (let i = 0; i < nPlu; i++) {
    const a = 39.45 + rngGauss(rnd) * 0.55;
    push(a, 0.08+rnd()*0.20, halfNormal(rnd, 12), rnd()*TAU, rnd()*TAU, rnd()*TAU, nepN * 2/3, 0.65+rnd()*0.6, [0.55,0.50,0.62]);
  }
  for (let i = 0; i < nCls; i++) {
    const a = 42.5 + rnd() * (47.7 - 42.5);
    push(a, rnd()*0.11, halfNormal(rnd, 7), rnd()*TAU, rnd()*TAU, rnd()*TAU, meanMotion(a), 0.6+rnd()*0.55, [0.48,0.50,0.58]);
  }
  for (let i = 0; i < nSca; i++) {
    const a = 48 + rnd() * (80 - 48);
    push(a, 0.15+rnd()*0.35, halfNormal(rnd, 22), rnd()*TAU, rnd()*TAU, rnd()*TAU, meanMotion(a), 0.55+rnd()*0.5, [0.42,0.40,0.46]);
  }
  return new Float32Array(parts);
}

function buildStars() {
  const rnd = mulberry32(0xC0DE);
  const galN = norm([-0.8678, 0.4972, 0.0003]);
  let ref = Math.abs(galN[1]) < 0.9 ? [0,1,0] : [1,0,0];
  const gx = norm(cross(ref, galN));
  const gz = cross(gx, galN);
  const pal = [
    [0.72,0.80,1.00],[0.78,0.86,1.00],[0.90,0.93,1.00],[1.00,0.96,0.88],
    [1.00,0.90,0.70],[1.00,0.72,0.42],[1.00,0.52,0.30]
  ];
  const cuts = [0.001, 0.006, 0.014, 0.044, 0.12, 0.24, 1];
  const N = 11000;
  const data = new Float32Array(N * 6);
  for (let i = 0; i < N; i++) {
    const b = rngGauss(rnd) * 0.20;
    const l = rnd() * TAU;
    const cb = Math.cos(b), sb = Math.sin(b);
    const lx = cb * Math.cos(l), ly = sb, lz = cb * Math.sin(l);
    const dir = [
      gx[0]*lx + galN[0]*ly + gz[0]*lz,
      gx[1]*lx + galN[1]*ly + gz[1]*lz,
      gx[2]*lx + galN[2]*ly + gz[2]*lz
    ];
    const u = rnd();
    let k = 6;
    for (let j = 0; j < 7; j++) if (u <= cuts[j]) { k = j; break; }
    const mag = Math.pow(rnd(), 3.6);
    const bright = 0.04 + mag * 1.15;
    const o = i * 6;
    data[o] = dir[0]; data[o+1] = dir[1]; data[o+2] = dir[2];
    data[o+3] = pal[k][0] * bright;
    data[o+4] = pal[k][1] * bright;
    data[o+5] = pal[k][2] * bright;
  }
  return data;
}

const NOISE = `
float hash13(vec3 p){
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
vec3 hash33(vec3 p){
  p = vec3(dot(p, vec3(127.1, 311.7, 74.7)), dot(p, vec3(269.5, 183.3, 246.1)), dot(p, vec3(113.5, 271.9, 124.6)));
  return fract(sin(p) * 43758.5453123);

float hash11(float n){ return fract(sin(n * 127.1) * 43758.5453); }
float sstep(float a, float b, float x){
  float d = b - a;
  float t = abs(d) < 1e-6 ? step(a, x) : clamp((x - a) / d, 0.0, 1.0);
  return t * t * (3.0 - 2.0 * t);
}
float vnoise(vec3 p){
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i), hash13(i+vec3(1,0,0)), f.x),
                  mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), f.x),
                  mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), f.x), f.y), f.z);
}
mat3 rotN(){
  return mat3(0.00,-0.80,-0.60, 0.80,0.36,-0.48, 0.60,-0.48,0.64);

float fbm(vec3 p, int oct){
  float a = 0.5, s = 0.0, w = 0.0;
  mat3 m = rotN();
  for (int i = 0; i < 6; i++){
    if (i >= oct) break;
    s += a * vnoise(p);
    w += a;
    p = m * p * 2.03;
    a *= 0.5;
  }
  return s / max(w, 1e-5);
}
float n1(float x){
  float i = floor(x);

  for (int y = -1; y <= 1; y++)

    vec3 c = ip + vec3(float(x), float(y), float(z));
    vec3 h = hash33(c);

    else if (d < f2) f2 = d;

float ringDen(float r, int kind){
  if (kind == 1){
    if (r < 1.40 || r > 1.81) return 0.0;
    return 0.016 * sstep(1.40, 1.47, r) * (1.0 - sstep(1.70, 1.81, r));
  }
  if (kind == 3){
    float d = 0.0;
    d += 0.55 * exp(-pow((r-1.951)/0.0055, 2.0));
    d += 0.20 * exp(-pow((r-1.909)/0.0022, 2.0));
    d += 0.16 * exp(-pow((r-1.863)/0.0020, 2.0));
    d += 0.13 * exp(-pow((r-1.823)/0.0018, 2.0));
    d += 0.11 * exp(-pow((r-1.786)/0.0017, 2.0));
    d += 0.09 * exp(-pow((r-1.751)/0.0016, 2.0));
    d += 0.07 * exp(-pow((r-1.690)/0.0015, 2.0));

  if (r >= 1.235 && r < 1.53) d = 0.11;
  else if (r >= 1.525 && r < 2.025) d = 1.20;
  else if (r >= 2.025 && r < 2.27) d = 0.58;

const FS_BG = `#version 300 es

const VS_STAR = `#version 300 es

const FS_BODY = `#version 300 es

vec3 sunRamp(float x){
  x = clamp(x, 0.0, 1.0);
  vec3 c0 = vec3(0.42, 0.045, 0.012);
  vec3 c1 = vec3(0.98, 0.24, 0.025);
  vec3 c2 = vec3(1.40, 0.66, 0.12);
  vec3 c3 = vec3(1.72, 1.28, 0.58);
  vec3 c4 = vec3(1.95, 1.82, 1.48);
  if (x < 0.25) return mix(c0, c1, x / 0.25);
  if (x < 0.50) return mix(c1, c2, (x - 0.25) / 0.25);
  if (x < 0.75) return mix(c2, c3, (x - 0.50) / 0.25);
  return mix(c3, c4, (x - 0.75) / 0.25);
}
vec3 shadeSun(vec3 p, vec3 N, vec3 V){
  vec3 q = p + vec3(uTime * 0.012, uTime * 0.004, -uTime * 0.008);
  float f1, f2, id;
  worley(q * mix(10.0, 76.0, uDetail), f1, f2, id);
  float g1 = sstep(0.0, 0.16, f2 - f1);
  worley(q * mix(6.0, 31.0, uDetail) + 4.0, f1, f2, id);
  float g2 = sstep(0.0, 0.20, f2 - f1);
  float gran = mix(0.62, g1 * 0.62 + g2 * 0.38, uDetail);
  float super = fbm(p * 6.5 + vec3(uTime * 0.01, 0.2, -uTime * 0.004), 4);
  float sf = fbm(p * 2.7 + vec3(2.2, -1.1, 0.4), 5);

  float pen = sstep(0.595, 0.66, sf);
  float shade = clamp(0.36 + gran * 0.36 + (super - 0.5) * 0.50, 0.0, 1.0);
  shade = mix(shade, shade * 0.62, pen);
  shade = mix(shade, 0.10, umbra);
  float mu = max(dot(N, V), 0.0);
  float limb = 0.24 + 0.76 * pow(mu, 0.38);

  float rad = 0.13 + 0.22 * fract(id * 7.31);
  float t = f1 / max(rad, 1e-3);
  float bowl = t < 1.0 ? -(1.0 - t * t) : 0.0;
  float rim = exp(-pow((t - 1.0) / 0.26, 2.0));
  float exist = step(id, cov) * sstep(0.60, 0.40, f1);

  alb += (bowl * 0.55 + rim * 0.32) * exist;

void rocky(vec3 p, float cov, float depthScale, vec3 base, inout vec3 col){

void main(){

const VS_ORB = `#version 300 es

const VS_AST = `#version 300 es
precision highp float;

layout(location=1) in vec4 a1;

  M = mod(M + 3.14159265, 6.2831853) - 3.14159265;

const FS_ATM = `#version 300 es

  let h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  const maxSide = 8192;
  if (Math.max(w, h) > maxSide) {
    const s = maxSide / Math.max(w, h);
    w = Math.floor(w * s); h = Math.floor(h * s);
  }
  if (w === W && h === H && sceneTex) return;
  W = w; H = h;
  canvas.width = w; canvas.height = h;
  allocTargets();
}

let view = new Float32Array(16), proj = new Float32Array(16), vp = new Float32Array(16);
let eye = [0, 0, 40];
let glErrShown = false;

function render() {
  const near = Math.max(0.012, state.dist * 0.0035);
  const far = Math.max(state.dist * 14, 4200);
  eye = eyeOf();
  const aspect = W / Math.max(H, 1);
  proj = perspective(state.fov, aspect, near, far);
  view = lookAt(eye, state.target, [0, 1, 0]);
  vp = mul4(proj, view);
  const invVP = invert4(vp);
  const basis = camBasis(eye);
  const drawFbo = useMSAA ? msaaFbo : resolveFbo;

  gl.bindFramebuffer(gl.FRAMEBUFFER, drawFbo);
  gl.viewport(0, 0, W, H);
  gl.depthMask(true);
  gl.colorMask(true, true, true, true);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LESS);

  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.useProgram(prog.bg);
  gl.uniformMatrix4fv(prog.L.bg.uInvVP, false, invVP);
  gl.uniform3fv(prog.L.bg.uCam, eye);
  gl.uniform3fv(prog.L.bg.uGalN, norm([-0.8678, 0.4972, 0.0003]));
  gl.uniform1f(prog.L.bg.uTime, state.visTime);
  drawTri();

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(prog.star);
  gl.uniformMatrix4fv(prog.L.star.uVP, false, vp);
  gl.uniform3fv(prog.L.star.uCam, eye);
  gl.uniform1f(prog.L.star.uTime, state.visTime);
  gl.bindVertexArray(starVAO);
  gl.drawArrays(gl.POINTS, 0, starCount);

  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.frontFace(gl.CCW);
  gl.useProgram(prog.body);
  bodies.forEach((b) => {
    if (b.kind === "moon" && !state.showMoons) return;
    if (b.kind === "comet" && !state.showComet) return;
    const radius = b.displayR;
    const phase = b.phase || 0;
    const axis = b.axis || [0, 1, 0];
    const mdl = modelOf(b.world, axis, phase, radius);
    const mvp = mul4(vp, mdl.m);
    const ang = radius / Math.max(len(sub(b.world, eye)), 0.05);
    gl.uniformMatrix4fv(prog.L.body.uMVP, false, mvp);
    gl.uniformMatrix4fv(prog.L.body.uModel, false, mdl.m);
    gl.uniformMatrix3fv(prog.L.body.uNMat, false, mdl.n);
    gl.uniformMatrix3fv(prog.L.body.uInvRot, false, mdl.inv);
    gl.uniform1i(prog.L.body.uBody, b.body);
    gl.uniform1i(prog.L.body.uRing, b.ring || 0);
    gl.uniform1f(prog.L.body.uTime, state.visTime);
    gl.uniform1f(prog.L.body.uDetail, clamp((ang - 0.012) / 0.08, 0, 1));
    gl.uniform1f(prog.L.body.uBump, ang > 0.035 ? (b.body === 3 ? 0.55 : 0.42) : 0);
    gl.uniform1f(prog.L.body.uAlb, b.alb || 1);
    gl.uniform1f(prog.L.body.uSunI, b.body === 0 ? 1 : sunIntensity(Math.max(b.rAU || b.parentBody && b.parentBody.rAU || 1, 0.2)));
    gl.uniform1f(prog.L.body.uSoft, b.body === 15 ? 0.55 : 0.20);
    gl.uniform3fv(prog.L.body.uCam, eye);
    gl.bindVertexArray(sphere.vao);
    gl.drawElements(gl.TRIANGLES, sphere.count, gl.UNSIGNED_SHORT, 0);
  });

  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  if (orbitN) {
    gl.useProgram(prog.orb);
    gl.uniformMatrix4fv(prog.L.orb.uVP, false, vp);
    gl.uniform2f(prog.L.orb.uHalfVp, W * 0.5, H * 0.5);
    gl.uniform1f(prog.L.orb.uHalfPx, 2.1 * Math.max(dpr, 1));
    gl.bindVertexArray(orbitVAO);
    gl.drawArrays(gl.TRIANGLES, 0, orbitN);
  }
  if (state.showAst) {
    gl.useProgram(prog.ast);
    gl.uniformMatrix4fv(prog.L.ast.uVP, false, vp);
    gl.uniformMatrix4fv(prog.L.ast.uView, false, view);
    gl.uniform1f(prog.L.ast.uJD, state.jd);
    gl.uniform1f(prog.L.ast.uCompress, state.compress);
    gl.uniform1f(prog.L.ast.uScale, SCALE);
    gl.uniform1f(prog.L.ast.uFocal, 140);
    gl.bindVertexArray(astVAO);
    gl.drawArrays(gl.POINTS, 0, astCount);
  }

  gl.enable(gl.CULL_FACE);
  gl.useProgram(prog.atm);
  bodies.forEach((b) => {
    if (!b.atm) return;
    if (b.kind === "moon" && !state.showMoons) return;
    const shell = b.displayR * (1 + b.atm.H * 7.5);
    const mdl = modelOf(b.world, b.axis, b.phase || 0, shell);
    gl.uniformMatrix4fv(prog.L.atm.uMVP, false, mul4(vp, mdl.m));
    gl.uniformMatrix4fv(prog.L.atm.uModel, false, mdl.m);
    gl.uniform3fv(prog.L.atm.uCenter, b.world);
    gl.uniform3fv(prog.L.atm.uCam, eye);
    gl.uniform1f(prog.L.atm.uRadius, b.displayR);
    gl.uniform1f(prog.L.atm.uH, b.atm.H);
    gl.uniform1f(prog.L.atm.uStrength, b.atm.strength);
    gl.uniform3fv(prog.L.atm.uColor, b.atm.color);
    gl.bindVertexArray(sphere.vao);
    gl.drawElements(gl.TRIANGLES, sphere.count, gl.UNSIGNED_SHORT, 0);
  });

  gl.disable(gl.CULL_FACE);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(prog.ring);
  bodies.forEach((b) => {
    if (!b.ring) return;
    const B = basisFromAxis(b.axis);
    const m = new Float32Array(16);
    const R = b.displayR;
    m[0] = B[0][0]*R; m[1] = B[0][1]*R; m[2] = B[0][2]*R;
    m[4] = B[1][0]*R; m[5] = B[1][1]*R; m[6] = B[1][2]*R;
    m[8] = B[2][0]*R; m[9] = B[2][1]*R; m[10] = B[2][2]*R;
    m[12] = b.world[0]; m[13] = b.world[1]; m[14] = b.world[2]; m[15] = 1;
    gl.uniformMatrix4fv(prog.L.ring.uMVP, false, mul4(vp, m));
    gl.uniformMatrix4fv(prog.L.ring.uModel, false, m);
    gl.uniform1i(prog.L.ring.uKind, b.ring);
    gl.uniform3fv(prog.L.ring.uCenter, b.world);
    gl.uniform3fv(prog.L.ring.uAxis, b.axis);
    gl.uniform3fv(prog.L.ring.uCam, eye);
    gl.uniform1f(prog.L.ring.uRad, b.displayR);
    gl.uniform1f(prog.L.ring.uSunI, sunIntensity(b.rAU));
    const mesh = ringMesh[b.ring];
    gl.bindVertexArray(mesh.vao);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
  });

  gl.blendFunc(gl.ONE, gl.ONE);
  if (tailN && state.showComet) {
    gl.useProgram(prog.tail);
    gl.uniformMatrix4fv(prog.L.tail.uVP, false, vp);
    gl.bindVertexArray(tailVAO);
    gl.drawArrays(gl.TRIANGLES, 0, tailN);
  }
  gl.useProgram(prog.cor);
  gl.uniformMatrix4fv(prog.L.cor.uVP, false, vp);
  gl.uniform3fv(prog.L.cor.uRight, basis.r);
  gl.uniform3fv(prog.L.cor.uUp, basis.u);
  gl.uniform1f(prog.L.cor.uTime, state.visTime);
  gl.bindVertexArray(billVAO);
  gl.uniform3fv(prog.L.cor.uCenter, [0, 0, 0]);
  gl.uniform1f(prog.L.cor.uSize, 4.6 * 2.6);
  gl.uniform3fv(prog.L.cor.uColor, [1.0, 0.72, 0.32]);
  gl.uniform1f(prog.L.cor.uGain, 0.16);
  gl.uniform1f(prog.L.cor.uFall, 1.85);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.uniform1f(prog.L.cor.uSize, 4.6 * 6.2);
  gl.uniform3fv(prog.L.cor.uColor, [0.85, 0.32, 0.08]);
  gl.uniform1f(prog.L.cor.uGain, 0.045);
  gl.uniform1f(prog.L.cor.uFall, 1.35);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  if (state.showComet && HALLEY.rAU < 6.5) {
    const f = Math.min(4.0, (3 / Math.max(HALLEY.rAU, 0.4)) ** 2);
    gl.uniform3fv(prog.L.cor.uCenter, HALLEY.world);
    gl.uniform1f(prog.L.cor.uSize, 0.35 + 0.22 * f);
    gl.uniform3fv(prog.L.cor.uColor, [0.75, 0.85, 1.0]);
    gl.uniform1f(prog.L.cor.uGain, 0.55);
    gl.uniform1f(prog.L.cor.uFall, 1.4);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  if (useMSAA) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, msaaFbo);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, resolveFbo);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  }

  const flare = sunScreen();
  if (state.glow > 0.01) {
    gl.disable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(prog.down);
    gl.uniform1i(prog.L.down.uTex, 0);
    gl.uniform1f(prog.L.down.uThreshold, useHDR ? 1.25 : 0.72);
    gl.uniform1f(prog.L.down.uKnee, 0.6);
    let src = sceneTex, sw = W, sh = H;
    for (let i = 0; i < 6; i++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, bloom[i].fbo);
      gl.viewport(0, 0, bloom[i].w, bloom[i].h);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, src);
      gl.uniform2f(prog.L.down.uTexel, 1 / sw, 1 / sh);
      gl.uniform1i(prog.L.down.uPre, i === 0 ? 1 : 0);
      drawTri();
      src = bloom[i].tex; sw = bloom[i].w; sh = bloom[i].h;
    }
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(prog.up);
    gl.uniform1i(prog.L.up.uTex, 0);
    for (let i = 5; i > 0; i--) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, bloom[i - 1].fbo);
      gl.viewport(0, 0, bloom[i - 1].w, bloom[i - 1].h);
      gl.bindTexture(gl.TEXTURE_2D, bloom[i].tex);
      gl.uniform2f(prog.L.up.uTexel, 1 / bloom[i].w, 1 / bloom[i].h);
      drawTri();
    }
    gl.disable(gl.BLEND);
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.useProgram(prog.comp);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(prog.L.comp.uScene, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, state.glow > 0.01 ? bloom[0].tex : blackTex);
  gl.uniform1i(prog.L.comp.uBloom, 1);
  gl.uniform2f(prog.L.comp.uSun, flare.uv[0], flare.uv[1]);
  gl.uniform1f(prog.L.comp.uVis, flare.vis);
  gl.uniform1f(prog.L.comp.uGlow, state.glow);
  gl.uniform1f(prog.L.comp.uExposure, 1.05);
  gl.uniform1f(prog.L.comp.uTime, state.visTime);
  gl.uniform2f(prog.L.comp.uRes, W, H);
  drawTri();
  gl.activeTexture(gl.TEXTURE0);

  if (!glErrShown) {
    glErrShown = true;
    const e = gl.getError();
    if (e) showErr("gl.getError() = " + e);
  }
}

function project(world) {
  const c = xform(vp, world);
  if (c[3] <= 0.05) return null;
  const x = (c[0] / c[3] * 0.5 + 0.5) * canvas.clientWidth;
  const y = (-c[1] / c[3] * 0.5 + 0.5) * canvas.clientHeight;
  return { x, y, w: c[3], ndcZ: c[2] / c[3] };
}
function sunScreen() {
  const p = project([0, 0, 0]);
  if (!p) return { vis: 0, uv: [0.5, 0.5] };
  const uvx = p.x / canvas.clientWidth;
  const uvy = 1 - p.y / canvas.clientHeight;
  let vis = 1;
  const edge = Math.max(Math.abs(uvx * 2 - 1), Math.abs(uvy * 2 - 1));
  vis *= 1 - smoothstepJs(0.9, 1.25, edge);
  const sunDist = len(eye);
  const focal = (canvas.clientHeight * 0.5) / Math.tan(state.fov * 0.5);
  bodies.forEach((b) => {
    if (b === SUN || b.kind === "comet") return;
    if (b.kind === "moon" && !state.showMoons) return;
    const bp = project(b.world);
    if (!bp) return;
    const pix = Math.hypot(bp.x - p.x, bp.y - p.y);
    const vd = len(sub(b.world, eye));
    const rp = b.displayR * focal / Math.max(vd, 0.05);
    if (pix < rp && vd < sunDist * 0.985) vis = 0;
  });
  return { vis: clamp(vis, 0, 1), uv: [uvx, uvy] };
}
function smoothstepJs(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

function daysPerSec(v) {
  if (state.paused) return 0;
  const sign = v < 0 ? -1 : 1;
  return sign * 1.157407e-5 * Math.pow(10, Math.abs(v) / 100 * 8.55);
}
function formatRate(dps) {
  const sign = dps < 0 ? "−" : "";
  const a = Math.abs(dps);
  const sec = a * 86400;
  if (a < 1e-12) return "暂停";
  if (sec < 90) return sign + sec.toFixed(sec < 10 ? 2 : 1) + " 秒/秒";
  const min = sec / 60;
  if (min < 90) return sign + min.toFixed(1) + " 分/秒";
  const hr = min / 60;
  if (hr < 48) return sign + hr.toFixed(1) + " 小时/秒";
  if (a < 400) return sign + a.toFixed(a < 10 ? 2 : 1) + " 天/秒";
  return sign + (a / 365.25).toFixed(2) + " 年/秒";
}
function formatUTC(jd) {
  const ms = (jd - 2440587.5) * 86400000;
  if (!Number.isFinite(ms) || Math.abs(ms) > 8.64e15) return "JD " + jd.toFixed(2);
  const d = new Date(ms);
  if (Number.isNaN(d.getTime())) return "JD " + jd.toFixed(2);
  const p = (n) => String(n).padStart(2, "0");
  return d.getUTCFullYear() + "-" + p(d.getUTCMonth()+1) + "-" + p(d.getUTCDate()) + " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + ":" + p(d.getUTCSeconds()) + " UTC";
}
function parseUTC(s) {
  let t = s.trim().replace(" ", "T");
  if (!/[zZ]$/.test(t) && !/[+-]\d\d:?\d\d$/.test(t)) t += "Z";
  const ms = Date.parse(t);
  if (Number.isNaN(ms)) return null;
  return ms / 86400000 + 2440587.5;
}
function fmtNum(n, d) { return Number.isFinite(n) ? n.toFixed(d) : "—"; }
function fmtLight(sec) {
  if (sec < 90) return sec.toFixed(1) + " 秒";
  if (sec < 5400) return (sec / 60).toFixed(1) + " 分";
  return (sec / 3600).toFixed(2) + " 小时";
}
function earthDistAU(ecl) {
  const e = byId.earth.ecl;
  return len(sub(ecl, e));
}

function updateLive() {
  const live = $("live");
  if (!live || !state.focus) return;
  const b = state.focus;
  const rows = [];
  const add = (k, v) => rows.push('<div class="row"><span>' + k + '</span><b>' + v + '</b></div>');
  if (b === SUN) {
    const ed = byId.earth.rAU;
    add("与地球距离", fmtNum(ed, 4) + " AU");
    add("光行时", fmtLight(ed * LIGHT_S));
  } else {
    add("日心距离", fmtNum(b.rAU, 4) + " AU");
    add("日心黄经", fmtNum(b.lon, 2) + "°");
    add("日心黄纬", fmtNum(b.lat, 2) + "°");
    const ed = earthDistAU(b.ecl);
    add("与地球距离", fmtNum(ed, 4) + " AU");
    add("光行时", fmtLight(ed * LIGHT_S));
    if (b.kind === "moon") {
      add("绕行星速度", fmtNum(b.speed, 2) + " km/s");
    } else if (b.elem) {
      add("近日点", fmtNum(b.elem.a * (1 - b.elem.e), 4) + " AU");
      add("远日点", fmtNum(b.elem.a * (1 + b.elem.e), 3) + " AU");
      add("轨道速度", fmtNum(b.speed, 2) + " km/s");
    }
    if (b.ring && b.axisE) {
      const toSun = scl(b.ecl, -1 / (b.rAU || 1));
      const elev = Math.asin(clamp(dot(toSun, b.axisE), -1, 1)) * 180 / Math.PI;
      const toCam = norm(sub(eye, b.world));
      const toSunW = norm(scl(b.world, -1));
      const side = dot(b.axis, toCam) * dot(b.axis, toSunW) > 0 ? "同侧受光" : "异侧背光";
      add("环面太阳高度", fmtNum(elev, 1) + "°");
      add("相对观察者", side);
    }
  }
  add("儒略日", fmtNum(state.jd, 2));
  live.innerHTML = rows.join("");
  const fine = $("fine");
  if (fine) {
    const y = new Date((state.jd - 2440587.5) * 86400000).getUTCFullYear();
    fine.textContent = (y < 1800 || y > 2050 ? "当前日期已超出根数有效区间，位置是外推。 " : "") + "显示距离被压缩，黄经与相对角位置保持精确。";
  }
}
function updateLabels() {
  const focal = (canvas.clientHeight * 0.5) / Math.tan(state.fov * 0.5);
  let hover = null, hoverD = 1e9;
  bodies.forEach((b) => {
    const el = b.tag;
    if (!el) return;
    const hide = (!state.showNames) || (b.kind === "moon" && !state.showMoons) || (b.kind === "comet" && !state.showComet);
    const pr = project(b.world);
    if (!pr || hide) { el.style.opacity = "0"; return; }
    const vd = Math.max(len(sub(b.world, eye)), 0.05);
    const rp = b.displayR * focal / vd;
    let op = smoothstepJs(1.6, 8, rp);
    if (b.kind === "planet" || b.kind === "dwarf" || b === SUN) op = Math.max(op, rp > 1.4 ? 0.55 : 0.2);
    if (b.kind === "moon") op *= smoothstepJs(2.2, 10, rp);
    if (b === state.focus) op = Math.max(op, 0.92);
    el.style.opacity = String(op);
    el.style.left = pr.x + "px";
    el.style.top = (pr.y - rp) + "px";
    el.classList.toggle("on", b === state.focus);
    if (op > 0.15 && rp < hoverD) { /* cursor uses click radius, not label */ }
  });
}
function pick(cssX, cssY) {
  const focal = (canvas.clientHeight * 0.5) / Math.tan(state.fov * 0.5);
  let best = null, bestD = 28;
  bodies.forEach((b) => {
    if (b.kind === "moon" && !state.showMoons) return;
    if (b.kind === "comet" && !state.showComet) return;
    const pr = project(b.world);
    if (!pr) return;
    const vd = Math.max(len(sub(b.world, eye)), 0.05);
    const rp = b.displayR * focal / vd;
    const d = Math.hypot(pr.x - cssX, pr.y - cssY);
    const lim = Math.max(18, rp * 1.15);
    if (d < lim && d < bestD) { best = b; bestD = d; }
  });
  return best;
}

let last = performance.now();
let frames = 0, fpsT = performance.now();
let dateLock = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  state.visTime += Math.min(dt, 0.033);
  const prev = state.jd;
  if (!state.paused) state.jd += daysPerSec(state.speed) * dt;
  bodies.forEach((b) => {
    if (!b.rotH) return;
    let dph = TAU * (state.jd - prev) / (b.rotH / 24);
    dph = wrapPi(dph);
    b.phase += clamp(dph, -0.22, 0.22);
  });
  const targetT = state.realScale ? 1 : 0;
  if (state.compressT !== targetT) {
    const dir = targetT > state.compressT ? 1 : -1;
    state.compressT = clamp(state.compressT + dir * dt / 0.4, 0, 1);
  }
  const s = state.compressT * state.compressT * (3 - 2 * state.compressT);
  state.compress = lerp(0.62, 1, s);
  updateBodies(state.compress);
  if (state.focus) state.goalTarget = state.focus.world.slice();
  const k = 1 - Math.exp(-dt * 4.4);
  state.target = lerp3(state.target, state.goalTarget, k);
  state.dist = lerp(state.dist, state.goalDist, k);
  state.glow = lerp(state.glow, state.showGlow ? 1 : 0, 1 - Math.exp(-dt * 8));
  resize();
  const eyeNow = eyeOf();
  rebuildOrbits(eyeNow);
  rebuildTail(eyeNow);
  render();
  const date = $("date");
  if (document.activeElement !== date) date.value = formatUTC(state.jd);
  $("rate").textContent = formatRate(daysPerSec(state.speed));
  $("scaleNote").textContent = state.compress > 0.98
    ? "角位置精确 · 当前为真实距离比例"
    : "角位置精确 · 径向距离按 r^" + state.compress.toFixed(2) + " 压缩，便于同屏观察";
  const y = new Date((state.jd - 2440587.5) * 86400000).getUTCFullYear();
  $("warn").hidden = !(y < 1800 || y > 2050);
  updateLive();
  updateLabels();
  frames++;
  if (now - fpsT > 500) {
    $("fps").textContent = Math.round(frames * 1000 / (now - fpsT)) + " fps";
    frames = 0; fpsT = now;
  }
  requestAnimationFrame(frame);
}

const ptrs = new Map();
let drag = 0;
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  drag = 0;
  canvas.classList.add("drag");
});
canvas.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  drag += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size >= 2) {
    const arr = [...ptrs.values()];
    const span = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
    if (canvas._pinch && span > 0) state.goalDist = clamp(state.goalDist * (canvas._pinch / span), 0.45, 9000);
    canvas._pinch = span;
    return;
  }
  state.yaw -= dx * 0.005;
  state.pitch = clamp(state.pitch + dy * 0.004, -1.25, 1.25);
});
function endPtr(e) {
  if (ptrs.size === 1 && drag < 5) {
    const rect = canvas.getBoundingClientRect();
    const hit = pick(e.clientX - rect.left, e.clientY - rect.top);
    if (hit) selectBody(hit, true);
  }
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) canvas._pinch = 0;
  if (!ptrs.size) canvas.classList.remove("drag");
}
canvas.addEventListener("pointerup", endPtr);
canvas.addEventListener("pointercancel", endPtr);
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  state.goalDist = clamp(state.goalDist * Math.exp(e.deltaY * 0.00115), 0.45, 9000);
}, { passive: false });
window.addEventListener("keydown", (e) => {
  if (e.target && e.target.matches && e.target.matches("input, textarea")) return;
  if (e.code === "Space") { e.preventDefault(); state.paused = !state.paused; $("play").textContent = state.paused ? "播放" : "暂停"; }
  else if (e.code === "ArrowLeft") { state.speed = clamp(state.speed - 2, -100, 100); $("speed").value = state.speed; }
  else if (e.code === "ArrowRight") { state.speed = clamp(state.speed + 2, -100, 100); $("speed").value = state.speed; }
  else if (e.key === "h" || e.key === "H") document.body.classList.toggle("ui-off");
});
window.addEventListener("resize", resize);

function selfTest() {
  const jd = Date.UTC(2026, 7, 7) / 86400000 + 2440587.5;
  const T = (jd - J2000) / 36525;
  const st = planetState(byId.earth, T);
  const ll = lonLat(st.ecl);
  const v = visViva(ll.r, st.a);
  console.log("Earth 2026-08-07", ll, "v", v);
  if (Math.abs(ll.r - 1.014) > 0.01 || Math.abs(ll.lon - 314.6) > 1.5) {
    showErr("轨道自检偏差 r=" + ll.r.toFixed(4) + " λ=" + ll.lon.toFixed(2));
  }
  return { r: ll.r, lon: ll.lon, v };
}

try {
  if (gl) {
    initGL();
    initMeshes();
    buildUI();
    resize();
    const chk = selfTest();
    window.__sol = {
      setDate(s) { const j = parseUTC(s); if (j) { state.jd = j; snapSpin(); } },
      state, bodies, byId, chk,
      glError() { return gl.getError(); }
    };
    requestAnimationFrame(frame);
  }
} catch (err) {
  showErr(String(err && err.stack || err));
}
</script>
