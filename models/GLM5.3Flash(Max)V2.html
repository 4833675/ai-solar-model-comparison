<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--ink);

function solveKepler(M,e){
  M=((M%TAU)+TAU)%TAU;
  let E=e<0.8?M:Math.PI;
  for(let k=0;k<14;k++){
    const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
    E-=d; if(Math.abs(d)<1e-9)break;
  }
  return E;
}
/* 黄道坐标 (AU) + 日心距。M=(L-lp)+n·d,n=360°/(365.25·a^1.5) */
function keplerPos(a,e,iDeg,L,lp,node,d){
  const n=360/(365.25*Math.pow(a,1.5));
  const M=((L-lp)+n*d)*D2R;
  const E=solveKepler(M,e);
  const xv=a*(Math.cos(E)-e), yv=a*Math.sqrt(1-e*e)*Math.sin(E);
  const N=node*D2R, w=(lp-node)*D2R, inc=iDeg*D2R;
  const cN=Math.cos(N),sN=Math.sin(N),cw=Math.cos(w),sw=Math.sin(w),ci=Math.cos(inc),si=Math.sin(inc);

  const yh=(sN*cw+cN*sw*ci)*xv+(-sN*sw+cN*cw*ci)*yv;
  const zh=(sw*si)*xv+(cw*si)*yv;
  return {x:xh,y:yh,z:zh,r:Math.sqrt(xh*xh+yh*yh+zh*zh)};
}

/* ---------- 小工具 ---------- */
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const easeIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const pad=n=>String(n).padStart(2,'0');
const fmtInt=n=>Math.round(n).toLocaleString('zh-CN');
const isCoarse=matchMedia('(pointer:coarse)').matches;
function mulberry32(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;};}

/* ---------- 3D 值噪声(圆柱采样保证横向无缝) ---------- */
function makeNoise(seed){
  const rnd=mulberry32(seed),perm=new Uint8Array(512),vals=new Float32Array(256);
  for(let i=0;i<256;i++){perm[i]=i;vals[i]=rnd()*2-1;}
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;const t=perm[i];perm[i]=perm[j];perm[j]=t;}
  for(let i=0;i<256;i++)perm[256+i]=perm[i];
  const g=(x,y,z)=>vals[perm[(perm[(perm[x&255]+(y&255))&255]+(z&255))&255]];
  const fade=t=>t*t*(3-2*t);
  function n3(x,y,z){
    const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);
    const fx=x-X,fy=y-Y,fz=z-Z,u=fade(fx),v=fade(fy),w=fade(fz);
    const c000=g(X,Y,Z),c100=g(X+1,Y,Z),c010=g(X,Y+1,Z),c110=g(X+1,Y+1,Z);
    const c001=g(X,Y,Z+1),c101=g(X+1,Y,Z+1),c011=g(X,Y+1,Z+1),c111=g(X+1,Y+1,Z+1);
    const x00=c000+(c100-c000)*u,x10=c010+(c110-c010)*u;
    const x01=c001+(c101-c001)*u,x11=c011+(c111-c011)*u;
    const y0=x00+(x10-x00)*v,y1=x01+(x11-x01)*v;
    return y0+(y1-y0)*w;
  }
  function fbm(x,y,z,oct=4,lac=2,gain=0.5){
    let a=0.5,s=0,f=1,norm=0;
    for(let o=0;o<oct;o++){s+=a*n3(x*f,y*f,z*f);norm+=a;a*=gain;f*=lac;}
    return s/norm;
  }
  return {n3,fbm,rnd};
}
function cyl(x,y,W,H,rad,ys){ // 纹理像素 → 圆柱面坐标(横向无缝)
  const th=(x/W)*TAU;
  return [Math.cos(th)*rad, y/H*ys, Math.sin(th)*rad];
}

/* ---------- 程序化贴图 ---------- */
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function stampCrater(ctx,W,H,cx,cy,r,amp){
  const g=ctx.createRadialGradient(cx,cy,r*0.15,cx,cy,r);
  g.addColorStop(0,'rgba(0,0,0,'+amp+')');
  g.addColorStop(0.68,'rgba(0,0,0,'+(amp*0.45)+')');
  g.addColorStop(0.78,'rgba(255,255,255,'+(amp*0.75)+')');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();
}
function drawCraters(ctx,W,H,seed,count){
  const crnd=mulberry32(seed^0x9e37);
  for(let k=0;k<count;k++){
    const cx=crnd()*W, cy=H*0.06+crnd()*H*0.88;
    const r=2+Math.pow(crnd(),2.6)*W*0.055;
    const a=0.14+0.1*crnd();
    stampCrater(ctx,W,H,cx,cy,r,a);
    if(cx<r)stampCrater(ctx,W,H,cx+W,cy,r,a);
    if(cx>W-r)stampCrater(ctx,W,H,cx-W,cy,r,a);
  }
}
function genRocky(o){ // 岩石天体:基色三段渐变 + 陨石坑 + 暗斑 + 极冠
  const W=o.W,H=o.H,c=cnv(W,H),ctx=c.getContext('2d');
  const img=ctx.createImageData(W,H),d=img.data;
  const nz=makeNoise(o.seed),nz2=makeNoise(o.seed+7);
  const A=o.cols[0],B=o.cols[1],C=o.cols[2];
  const mixc=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,p[2]+(q[2]-p[2])*t];
  for(let y=0;y<H;y++){
    const v=y/H,lat=Math.abs(v-0.5)*2;
    for(let x=0;x<W;x++){
      const [px,py,pz]=cyl(x,y,W,H,1.35,2.7);
      let n=nz.fbm(px,py,pz,4);
      n=(n+0.4*nz.fbm(px*3.1,py*3.1,pz*3.1,4))/1.4;
      let t=clamp(0.5+n*0.8,0,1);
      let col=t<0.5?mixc(A,B,t*2):mixc(B,C,(t-0.5)*2);
      if(o.maria){
        const m=nz2.fbm(px*0.9+11,py*0.9,pz*0.9,3);
        if(m>o.mariaT)col=mixc(col,o.maria,clamp((m-o.mariaT)*4,0,0.75));
      }
      if(o.caps){
        const edge=o.caps.lat+0.05*nz2.n3(px*3,py*3,pz*3);
        const s=smoothstep(edge,edge+0.05,lat);
        if(s>0)col=mixc(col,o.caps.col,s);
      }
      const i=(y*W+x)*4;
      d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  drawCraters(ctx,W,H,o.seed,o.craters||0);
  return c;
}
function palStops(stops){ // ['#hex',t] → 可查找调色板
  return stops.map(s=>[s[1],[parseInt(s[0].slice(1,3),16),parseInt(s[0].slice(3,5),16),parseInt(s[0].slice(5,7),16)]]);
}
function palLookup(pal,t){
  if(t<=pal[0][0])return pal[0][1];
  for(let i=1;i<pal.length;i++){
    if(t<=pal[i][0]){
      const [t0,c0]=pal[i-1],[t1,c1]=pal[i];
      const k=smoothstep(t0,t1,t);
      return [c0[0]+(c1[0]-c0[0])*k,c0[1]+(c1[1]-c0[1])*k,c0[2]+(c1[2]-c0[2])*k];
    }
  }
  return pal[pal.length-1][1];
}
function genBanded(o){ // 气态行星:纬向条带 + 湍流扰动 + 细条纹 + 风暴斑
  const W=o.W,H=o.H,c=cnv(W,H),ctx=c.getContext('2d');
  const img=ctx.createImageData(W,H),d=img.data;
  const nz=makeNoise(o.seed),nz2=makeNoise(o.seed+13);
  const pal=palStops(o.stops);
  for(let y=0;y<H;y++){
    const v=y/H;
    for(let x=0;x<W;x++){
      const [px,py,pz]=cyl(x,y,W,H,1.5,3.1);
      const wob=o.turb*(0.35*nz.fbm(px*1.3,py*2.6,pz*1.3,4)+0.65*nz.fbm(px*3.6,py*7,pz*3.6,3));
      const t=clamp(v+wob,0,1);
      let col=palLookup(pal,t);
      const br=1+o.streak*nz2.fbm(px*2,py*44,pz*2,3);
      col=[col[0]*br,col[1]*br,col[2]*br];
      if(o.spot){
        let du=Math.abs(x/W-o.spot.u);du=Math.min(du,1-du);
        const dv=(v-o.spot.v);
        const dd=Math.hypot(du/o.spot.rx,dv/o.spot.ry);
        if(dd<1.5){
          const core=1-smoothstep(0.55,1.12,dd);
          col=[lerp(col[0],o.spot.col[0],core),lerp(col[1],o.spot.col[1],core),lerp(col[2],o.spot.col[2],core)];
          const rim=Math.exp(-Math.pow((dd-1.02)/0.14,2))*0.3;
          col=[col[0]*(1-rim),col[1]*(1-rim),col[2]*(1-rim)];
        }
      }
      const i=(y*W+x)*4;
      d[i]=clamp(col[0],0,255);d[i+1]=clamp(col[1],0,255);d[i+2]=clamp(col[2],0,255);d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  return c;
}
function genEarthDay(){ // 地球昼面;返回画布与陆地掩膜(供夜面灯光使用)
  const W=768,H=384,c=cnv(W,H),ctx=c.getContext('2d');
  const img=ctx.createImageData(W,H),d=img.data;
  const land=new Uint8Array(W*H);
  const nz=makeNoise(101),nz2=makeNoise(215);
  const mixc=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,p[2]+(q[2]-p[2])*t];
  for(let y=0;y<H;y++){
    const v=y/H,lat=Math.abs(v-0.5)*2;
    for(let x=0;x<W;x++){
      const [px,py,pz]=cyl(x,y,W,H,1.5,3);
      const q=nz.fbm(px*0.8,py*0.8,pz*0.8,3);
      let cont=nz.fbm(px*1.15+q*0.9,py*1.15+q*0.5,pz*1.15,5);
      cont+=0.22*nz2.fbm(px*3.4,py*3.4,pz*3.4,4);
      let col;
      if(cont>0.043){ // 陆地
        land[y*W+x]=1;
        const h=cont-0.043;
        const m=nz2.fbm(px*1.6+31,py*1.6,pz*1.6,4);
        col=mixc([64,98,54],[168,142,92],clamp((0.36-m)*2.4,0,1)*clamp(1.6-lat,0,1));
        if(h>0.16)col=mixc(col,[126,112,94],clamp((h-0.16)*5,0,0.9));
        const snow=clamp((h-0.3)*8,0,1)+smoothstep(0.62,0.8,lat+0.06*nz.n3(px*4,py*4,pz*4));
        if(snow>0)col=mixc(col,[236,240,246],clamp(snow,0,1));
      }else{
        const depth=clamp((0.043-cont)*3.2,0,1);
        col=mixc([38,102,138],[9,32,66],depth);
      }
      const capT=0.8+0.05*nz.n3(px*3,0,pz*3);
      const ices=smoothstep(capT,capT+0.06,lat);
      if(ices>0)col=mixc(col,[228,236,246],ices);
      const i=(y*W+x)*4;
      d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  return {c,land,W,H};
}
function genEarthNight(land,W,H){ // 夜面:陆地上的城市灯光;alpha=陆地掩膜
  const c=cnv(W,H),ctx=c.getContext('2d');
  const img=ctx.createImageData(W,H),d=img.data;
  const nz=makeNoise(77);
  for(let i=0;i<W*H;i++){const j=i*4;d[j]=0;d[j+1]=0;d[j+2]=0;d[j+3]=land[i]?255:0;}
  const rnd=mulberry32(4242);
  const put=(x,y,b)=>{
    x=((x%W)+W)%W;
    if(y<0||y>=H)return;
    if(!land[y*W+x])return;
    const j=(y*W+x)*4;
    d[j]=Math.min(255,d[j]+b);d[j+1]=Math.min(255,d[j+1]+b*0.72);d[j+2]=Math.min(255,d[j+2]+b*0.4);
  };
  for(let k=0;k<150;k++){ // 城市群
    let cx,cy,tries=0;
    do{cx=(rnd()*W)|0;cy=(H*0.14+rnd()*H*0.66)|0;tries++;}
    while(!land[cy*W+cx]&&tries<40);
    const n=14+(rnd()*70)|0,s=2+rnd()*8;
    for(let p=0;p<n;p++){
      const x=(cx+(rnd()+rnd()-1)*s*2.2)|0,y=(cy+(rnd()+rnd()-1)*s*1.1)|0;
      put(x,y,60+rnd()*150);
    }
  }
  for(let k=0;k<2600;k++)put((rnd()*W)|0,(rnd()*H)|0,40+rnd()*90); // 零星灯光
  ctx.putImageData(img,0,0);
  return c;
}
function genClouds(){ // 云层:rgb=白,alpha=云量
  const W=512,H=256,c=cnv(W,H),ctx=c.getContext('2d');
  const img=ctx.createImageData(W,H),d=img.data;
  const nz=makeNoise(303);
  for(let y=0;y<H;y++){
    const v=y/H,lat=Math.abs(v-0.5)*2;
    for(let x=0;x<W;x++){
      const [px,py,pz]=cyl(x,y,W,H,1.5,3);
      const q=nz.fbm(px*1.1+9,py*1.1,pz*1.1,3);
      let n=nz.fbm(px*2.2+q*1.3,py*2.2,pz*2.2,5);
      n=smoothstep(0.5,0.78,n)*(1-smoothstep(0.86,1,lat));
      const i=(y*W+x)*4;
      d[i]=255;d[i+1]=255;d[i+2]=255;d[i+3]=n*235;
    }
  }
  ctx.putImageData(img,0,0);
  return c;
}
function genRingTex(bands){ // 1D 径向环带 → 1024×16
  const W=1024,H=16,c=cnv(W,H),ctx=c.getContext('2d');
  const img=ctx.createImageData(W,H),d=img.data;
  const nz=makeNoise(909);
  for(let x=0;x<W;x++){
    const t=x/W;
    let a=0,col=[203,184,148];
    for(const b of bands){
      if(t>=b[0]&&t<b[1]){a=b[2];col=b[3];break;}
    }
    const st=0.72+0.5*nz.fbm(t*46,0.5,0.5,3);
    a=clamp(a*st,0,1);
    if(t<0.03)a*=t/0.03; if(t>0.97)a*=(1-t)/0.03;
    for(let y=0;y<H;y++){
      const i=(y*W+x)*4;
      d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=a*255;
    }
  }
  ctx.putImageData(img,0,0);
  return c;
}
function genGlow(size,stops){ // 径向发光贴图(日冕/彗发/粒子)
  const c=cnv(size,size),ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const s of stops)g.addColorStop(s[0],s[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  return c;
}

const SUN_VS=`
varying vec3 vPos;varying vec3 vN;varying vec3 vW;
void main(){
  vPos=position;
  vN=normalize(mat3(modelMatrix)*normal);
  vW=(modelMatrix*vec4(position,1.)).xyz;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);

const SUN_FS=`
uniform float uTime;
varying vec3 vPos;varying vec3 vN;varying vec3 vW;
float hash(vec3 p){p=fract(p*0.3183099+vec3(0.1,0.2,0.3));p*=17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){
  vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.-2.*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1.,0.,0.)),f.x),
                 mix(hash(i+vec3(0.,1.,0.)),hash(i+vec3(1.,1.,0.)),f.x),f.y),
             mix(mix(hash(i+vec3(0.,0.,1.)),hash(i+vec3(1.,0.,1.)),f.x),
                 mix(hash(i+vec3(0.,1.,1.)),hash(i+vec3(1.,1.,1.)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=0.5,s=0.;
  for(int i=0;i<5;i++){s+=a*noise(p);p*=2.03;a*=0.5;}return s;}
void main(){
  vec3 p=normalize(vPos);
  float t=uTime*0.05;
  float n=fbm(p*4.0+vec3(t,-t*0.7,t*0.4));
  n+=0.45*fbm(p*9.0-vec3(t*1.3,0.,t));
  n+=0.22*fbm(p*18.0+vec3(0.,t*2.2,0.));
  n/=1.67;
  vec3 col=mix(vec3(0.98,0.28,0.02),vec3(1.0,0.62,0.12),smoothstep(0.18,0.6,n));
  col=mix(col,vec3(1.0,0.94,0.68),smoothstep(0.52,0.95,n));
  vec3 V=normalize(cameraPosition-vW);
  float mu=clamp(dot(normalize(vN),V),0.,1.);
  col*=0.5+0.5*pow(mu,0.55);   // 临边昏暗

  gl_FragColor=vec4(col,1.0);
}`;

const EARTH_FS=`
uniform sampler2D dayMap;uniform sampler2D nightMap;uniform vec3 uSunDir;
varying vec2 vUv;varying vec3 vN;varying vec3 vW;
void main(){
  vec3 N=normalize(vN);
  vec3 L=normalize(uSunDir);
  vec3 V=normalize(cameraPosition-vW);
  float ndl=dot(N,L);
  vec3 day=texture2D(dayMap,vUv).rgb;
  vec4 nite=texture2D(nightMap,vUv);
  float ocean=1.0-step(0.5,nite.a);          // 夜图 alpha=陆地掩膜
  float dayMix=smoothstep(-0.08,0.25,ndl);
  float diff=clamp(ndl,0.,1.);
  vec3 dayCol=day*(0.05+1.1*pow(diff,0.85));
  float spec=pow(max(dot(reflect(-L,N),V),0.),30.)*0.5*ocean*diff;
  float warm=exp(-pow(abs(ndl)*5.5,2.))*0.22;
  vec3 dayFinal=dayCol+spec*vec3(1.0,0.9,0.72)+warm*vec3(0.9,0.42,0.18)*diff;
  vec3 nightCol=nite.rgb*vec3(1.0,0.86,0.62)*1.7+day*0.012;
  vec3 col=mix(nightCol,dayFinal,dayMix);
  float fres=pow(1.0-clamp(dot(N,V),0.,1.),3.0);
  col+=fres*vec3(0.28,0.52,1.0)*(0.05+0.4*dayMix);
  gl_FragColor=vec4(col,1.0);
}`;

let milkyGroup;
function buildStars(){
  const N1=isCoarse?8000:14000,N2=isCoarse?2000:4200,total=N1+N2;
  const pos=new Float32Array(total*3),col=new Float32Array(total*3);
  const palette=[[0.72,0.8,1],[0.95,0.97,1],[1,1,1],[1,0.93,0.82],[1,0.84,0.66],[1,0.72,0.6]];
  const rnd=mulberry32(20260829);
  const ROT=1.05; // 黄道-银道夹角 ≈60°
  for(let i=0;i<total;i++){
    let dx,dy,dz;
    if(i<N1){ // 全天均匀
      const u=rnd()*2-1,ph=rnd()*TAU,rr=Math.sqrt(1-u*u);
      dx=rr*Math.cos(ph);dy=u;dz=rr*Math.sin(ph);
    }else{    // 银道面带状聚集,再倾斜 60°
      const phi=rnd()*TAU,off=(rnd()+rnd()+rnd()-1.5)*0.21;
      dx=Math.cos(phi)*Math.cos(off);
      dy=Math.sin(off)*0.5;
      dz=Math.sin(phi)*Math.cos(off);
      const y2=Math.sin(ROT)*dz+Math.cos(ROT)*dy;
      const z2=Math.cos(ROT)*dz-Math.sin(ROT)*dy;
      dy=y2;dz=z2;
    }
    const R=6200+rnd()*500;
    pos[i*3]=dx*R;pos[i*3+1]=dy*R;pos[i*3+2]=dz*R;
    const p=palette[(Math.pow(rnd(),1.6)*palette.length)|0];
    const b=0.35+Math.pow(rnd(),2.6)*1.35;
    col[i*3]=p[0]*b;col[i*3+1]=p[1]*b;col[i*3+2]=p[2]*b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const starDot=toTex(genGlow(32,[[0,'rgba(255,255,255,1)'],[0.5,'rgba(255,255,255,0.4)'],[1,'rgba(255,255,255,0)']]),false);
  const m=new THREE.PointsMaterial({size:2.2,sizeAttenuation:false,vertexColors:true,map:starDot,
    transparent:true,opacity:0.95,depthWrite:false,blending:THREE.AdditiveBlending});
  const stars=new THREE.Points(g,m);stars.frustumCulled=false;
  scene.add(stars);

  // 银河雾气 + 星云
  milkyGroup=new THREE.Group();
  const hazeT=toTex(genGlow(128,[[0,'rgba(190,200,235,0.55)'],[0.4,'rgba(160,175,220,0.2)'],[1,'rgba(120,140,200,0)']]),false);
  const nrnd=mulberry32(777);
  for(let i=0;i<240;i++){
    const phi=nrnd()*TAU,off=(nrnd()+nrnd()+nrnd()-1.5)*0.16;
    const bx=Math.cos(phi),bz=Math.sin(phi);
    let dx=bx*Math.cos(off),dy=Math.sin(off)*0.5,dz=bz*Math.cos(off);
    const y2=Math.sin(ROT)*dz+Math.cos(ROT)*dy;
    const z2=Math.cos(ROT)*dz-Math.sin(ROT)*dy;
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:hazeT,transparent:true,
      opacity:0.06+nrnd()*0.1,depthWrite:false,blending:THREE.AdditiveBlending,
      color:new THREE.Color(0.75+nrnd()*0.25,0.78+nrnd()*0.2,0.9)}));
    const R=5600+nrnd()*300;
    sp.position.set(dx*R,y2*R,z2*R);
    const s=700+nrnd()*1100;sp.scale.set(s,s*0.6,1);
    milkyGroup.add(sp);
  }
  const nebT=toTex(genGlow(128,[[0,'rgba(255,255,255,0.5)'],[0.35,'rgba(230,230,255,0.18)'],[1,'rgba(200,200,255,0)']]),false);
  const nebs=[[0x8a4fc9,0.05],[0x2f9e9e,0.045],[0xc96f4f,0.04],[0x4f6fc9,0.05]];
  for(const [cc,op] of nebs){
    const phi=nrnd()*TAU,off=(nrnd()-0.5)*0.3;
    const dx=Math.cos(phi)*Math.cos(off),dy=Math.sin(off)*0.5,dz=Math.sin(phi)*Math.cos(off);
    const y2=Math.sin(ROT)*dz+Math.cos(ROT)*dy;
    const z2=Math.cos(ROT)*dz-Math.sin(ROT)*dy;
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:nebT,transparent:true,opacity:op,
      depthWrite:false,blending:THREE.AdditiveBlending,color:cc}));
    const R=5800;
    sp.position.set(dx*R,y2*R,z2*R);
    const s=1500+nrnd()*900;sp.scale.set(s,s*0.7,1);
    milkyGroup.add(sp);
  }
  scene.add(milkyGroup);
}

function fixRingUV(geo,inner,outer){
  const pos=geo.attributes.position,uv=geo.attributes.uv;
  for(let i=0;i<pos.count;i++){
    const r=Math.hypot(pos.getX(i),pos.getY(i));
    uv.setXY(i,(r-inner)/(outer-inner),0.5);
  }
  uv.needsUpdate=true;
}
function buildOrbitLine(el,accent,dashed){
  const pts=[],tmp={};
  const SEG=256;
  for(let s=0;s<=SEG;s++){
    const E=s/SEG*TAU;
    const a=el.a,e=el.e;
    const xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E);
    const N=el.node*D2R,w=(el.lp-el.node)*D2R,inc=el.i*D2R;
    const cN=Math.cos(N),sN=Math.sin(N),cw=Math.cos(w),sw=Math.sin(w),ci=Math.cos(inc),si=Math.sin(inc);
    const xh=(cN*cw-sN*sw*ci)*xv+(-cN*sw-sN*cw*ci)*yv;
    const yh=(sN*cw+cN*sw*ci)*xv+(-sN*sw+cN*cw*ci)*yv;
    const zh=(sw*si)*xv+(cw*si)*yv;
    const r=Math.sqrt(xh*xh+yh*yh+zh*zh),f=mapR(r)/r;
    pts.push(new THREE.Vector3(xh*f,zh*f,-yh*f));
  }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  const m=dashed?
    new THREE.LineDashedMaterial({color:accent,transparent:true,opacity:0.4,dashSize:3,gapSize:2.6,depthWrite:false,blending:THREE.AdditiveBlending}):
    new THREE.LineBasicMaterial({color:accent,transparent:true,opacity:0.3,depthWrite:false,blending:THREE.AdditiveBlending});
  const line=new THREE.Line(g,m);
  if(dashed)line.computeLineDistances();
  scene.add(line);
  orbitLines.push(line);
  return line;
}

async function buildPlanets(){

    const anchor=new THREE.Group();
    scene.add(anchor);
    const tiltG=new THREE.Group();
    tiltG.rotation.z=-p.tilt*D2R;

    let mat;
    if(p.tex==='earth'){
      const day=genEarthDay();
      const night=genEarthNight(day.land,day.W,day.H);
      earthMat=new THREE.ShaderMaterial({
        uniforms:{dayMap:{value:toTex(day.c)},nightMap:{value:toTex(night)},uSunDir:{value:new THREE.Vector3(1,0,0)}},
        vertexShader:EARTH_VS,fragmentShader:EARTH_FS});

      const cloud=new THREE.Mesh(new THREE.SphereGeometry(p.displayR*1.018,seg,Math.round(seg*0.66)),
        new THREE.MeshLambertMaterial({map:toTex(genClouds()),transparent:true,depthWrite:false}));
      spinG.add(cloud);
    }

    const rec=makeBodyRecord(p,anchor,{tiltG,spinG,mesh,displayR:p.displayR,kind:'planet',el:p});

    if(p.atmo){
      const a=makeAtmo(p.displayR,p.atmo.color,p.atmo.k);

    if(p.rings){
      const rt=genRingTex(p.key==='saturn'?

      const geo=new THREE.RingGeometry(p.rings.inner,p.rings.outer,160,1);
      fixRingUV(geo,p.rings.inner,p.rings.outer);
      const rm=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:toTex(rt),transparent:true,
        side:THREE.DoubleSide,depthWrite:false}));
      rm.rotation.x=-Math.PI/2;
      tiltG.add(rm);
    }
    if(p.moons){
      rec.moons=[];

let belt=null,beltData=null,kuiper=null;
function buildBelts(){

  belt=new THREE.InstancedMesh(geo,mat,N);
  belt.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  belt.frustumCulled=false;
  const rnd=mulberry32(31415);
  beltData={a:new Float32Array(N),om:new Float32Array(N),ph:new Float32Array(N),
    yA:new Float32Array(N),yP:new Float32Array(N),
    q:[],s:new Float32Array(N)};
  const col=new THREE.Color(),q=new THREE.Quaternion(),e=new THREE.Euler();
  for(let i=0;i<N;i++){
    const aAU=2.12+rnd()*1.24+(rnd()-0.5)*0.15;
    beltData.a[i]=mapR(aAU);
    beltData.om[i]=TAU/(365.25*Math.pow(aAU,1.5));
    beltData.ph[i]=rnd()*TAU;
    beltData.yA[i]=beltData.a[i]*Math.sin((rnd()-0.5)*0.22);
    beltData.yP[i]=rnd()*TAU;
    beltData.s[i]=0.13+Math.pow(rnd(),2.4)*0.6;
    e.set(rnd()*TAU,rnd()*TAU,rnd()*TAU);q.setFromEuler(e);
    beltData.q.push(q.clone());
    const g=0.2+rnd()*0.3;
    belt.setColorAt(i,col.setRGB(g*1.06,g,g*0.9));
  }
  belt.instanceColor.needsUpdate=true;
  scene.add(belt);

  const KN=isCoarse?2500:5200;
  const kp=new Float32Array(KN*3);
  for(let i=0;i<KN;i++){
    const aAU=32+Math.pow(rnd(),1.4)*18;
    const r=mapR(aAU),th=rnd()*TAU,off=(rnd()-0.5)*0.3;
    kp[i*3]=Math.cos(th)*r;
    kp[i*3+1]=Math.sin(off)*r*0.12;
    kp[i*3+2]=-Math.sin(th)*r;
  }
  const kg=new THREE.BufferGeometry();
  kg.setAttribute('position',new THREE.BufferAttribute(kp,3));
  kuiper=new THREE.Points(kg,new THREE.PointsMaterial({color:0x9aa8bc,size:1.6,
    sizeAttenuation:false,transparent:true,opacity:0.4,depthWrite:false,
    map:toTex(genGlow(32,[[0,'rgba(255,255,255,1)'],[0.5,'rgba(255,255,255,0.4)'],[1,'rgba(255,255,255,0)']]),false)}));
  kuiper.frustumCulled=false;
  scene.add(kuiper);
}

    const pos=new Float32Array(n*3),size=new Float32Array(n),alp=new Float32Array(n);
    const rnd=mulberry32(color.length*1000+n);

    g.setAttribute('aSize',new THREE.BufferAttribute(size,1));
    g.setAttribute('aAlpha',new THREE.BufferAttribute(alp,1));
    const m=new THREE.ShaderMaterial({uniforms:{uTex:{value:toTex(genGlow(64,[[0,'rgba(255,255,255,1)'],[0.4,'rgba(255,255,255,0.4)'],[1,'rgba(255,255,255,0)']]),false)},
      uColor:{value:new THREE.Color(color)}},vertexShader:TAIL_VS,fragmentShader:TAIL_FS,
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
    const pts=new THREE.Points(g,m);
    pts.frustumCulled=false;
    scene.add(pts);
    return {pts,meta,g,alp,pos};
  }
  rec.ion=makeTail(420,0x7fd4ff,1.1,2.6);
  rec.dust=makeTail(360,0xffd9a0,1.5,3.4);
  rec.activity=0;rec.prevPos=new THREE.Vector3();rec.hasPrev=false;
  BODIES.push(rec);
  labelEl(rec);
}

/* ---------- 时间与状态 ---------- */
let simDays=nowDays();
let speedDays=7,paused=false;
let followRec=null,trans=null;
const prevFollowPos=new THREE.Vector3();

function planetState(rec,d,out){
  const q=keplerPos(rec.el.a,rec.el.e,rec.el.i,rec.el.L,rec.el.lp,rec.el.node,d);
  const f=mapR(q.r)/q.r;
  out.set(q.x*f,q.z*f,-q.y*f);
  return q.r; // 真实日心距(AU)
}
const tmpV=new THREE.Vector3();
function updateBodies(){
  // 行星
  for(const rec of BODIES){
    if(rec.kind==='planet'){
      const rAU=planetState(rec,simDays,rec.anchor.position);
      rec.rAU=rAU;
      const p=rec.def;
      // 自转按帧限速逼近,避免高倍速下的频闪
      const target=TAU*(simDays*24/p.rotH)*p.rotSign;
      const dd=((target-rec.spin+Math.PI)%TAU+TAU)%TAU-Math.PI;
      rec.spin+=clamp(dd,-1.5,1.5);
      rec.mesh.rotation.y=rec.spin;
      if(p.key==='earth'){
        const cl=rec.spinG.children[1];
        if(cl)cl.rotation.y=rec.spin*0.18;
        earthMat.uniforms.uSunDir.value.copy(rec.anchor.position).multiplyScalar(-1).normalize();
      }
      if(rec.moons){
        for(const mo of rec.moons){
          const th=TAU*(simDays/mo.def.period)+mo.phase;
          const inc=mo.def.incl*D2R;
          const dd=mo.def.dist;
          mo.anchor.position.set(Math.cos(th)*dd,Math.sin(th)*Math.sin(inc)*dd,-Math.sin(th)*Math.cos(inc)*dd);
          mo.mesh.rotation.y=-th+Math.PI; // 潮汐锁定
        }
      }
    }
  }
  // 彗星
  const cr=BODIES.find(b=>b.kind==='comet');
  if(cr){
    const rAU=planetState(cr,simDays,cr.anchor.position);
    cr.rAU=rAU;
    const act=Math.pow(clamp((5.5-rAU)/4,0,1),1.2);
    cr.activity=act;
    const pos=cr.anchor.position;
    if(!cr.hasPrev){cr.prevPos.copy(pos);cr.hasPrev=true;}
    const anti=tmpV.copy(pos).normalize();
    const vel=new THREE.Vector3().copy(pos).sub(cr.prevPos);
    const velN=vel.lengthSq()>1e-9?vel.normalize():anti.clone();
    cr.coma.material.opacity=0.06+0.6*act;
    const cs=1.6+4.5*act;
    cr.coma.scale.set(cs,cs,1);
    cr.mesh.visible=true;
    updateTail(cr.ion,pos,anti,act,56,2.8);
    const dustDir=new THREE.Vector3().copy(anti).addScaledVector(velN,0.42).normalize();
    updateTail(cr.dust,pos,dustDir,act*0.95,34,3.6);
    cr.prevPos.copy(pos);
  }
  // 小行星带
  if(belt&&belt.visible){
    const m=new THREE.Matrix4(),sclV=new THREE.Vector3();
    for(let i=0;i<beltData.a.length;i++){
      const th=beltData.ph[i]+beltData.om[i]*simDays;
      const a=beltData.a[i];
      tmpV.set(Math.cos(th)*a,Math.sin(th+beltData.yP[i])*beltData.yA[i],-Math.sin(th)*a);
      sclV.set(beltData.s[i],beltData.s[i],beltData.s[i]);
      m.compose(tmpV,beltData.q[i],sclV);
      belt.setMatrixAt(i,m);
    }
    belt.instanceMatrix.needsUpdate=true;
  }
  if(kuiper)kuiper.rotation.y=simDays*TAU/(350*365.25);
  // 日冕呼吸 + 相机过近淡出
  const t=performance.now()/1000;
  sunUniforms.uTime.value=t;
  const pulse=1+0.025*Math.sin(t*0.7)+0.012*Math.sin(t*2.3);
  const camD=camera.position.length();
  const fade=smoothstep(24,55,camD);
  corona1.scale.set(22*pulse,22*pulse,1);
  corona1.material.opacity=0.9*fade;
  corona2.material.opacity=0.4*fade;
  milkyGroup.visible=$('tgMW').classList.contains('on');
}
const tailTmp=new THREE.Vector3(),tailPerp=new THREE.Vector3();
function updateTail(tail,origin,dir,act,len,spread){
  const {meta,g,pos,alp}=tail;
  for(let i=0;i<meta.length;i++){
    const mt=meta[i];
    const t=mt.t;
    const flick=0.55+0.45*Math.sin(performance.now()/1000*mt.fs+mt.f);
    tailTmp.copy(dir).multiplyScalar(t*len);
    tailPerp.set(mt.jx,mt.jy,mt.jz).multiplyScalar(t*spread);
    pos[i*3]=origin.x+tailTmp.x+tailPerp.x;
    pos[i*3+1]=origin.y+tailTmp.y+tailPerp.y;
    pos[i*3+2]=origin.z+tailTmp.z+tailPerp.z;
    alp[i]=act*Math.pow(1-t,1.6)*flick;
  }
  g.attributes.position.needsUpdate=true;
  g.attributes.aAlpha.needsUpdate=true;
  tail.pts.visible=act>0.01;
}

/* ---------- 相机与聚焦 ---------- */
function focusBody(rec,distOverride){
  const bp=rec.anchor.position;
  let dist=rec.displayR*6+3.2;
  if(rec.kind==='comet')dist=26;
  if(rec.kind==='star')dist=46;
  if(distOverride)dist=distOverride;
  const dir=camera.position.clone().sub(bp);
  if(dir.lengthSq()<1e-6)dir.set(0,0.4,1);
  dir.normalize();
  trans={t:0,rec,from:camera.position.clone(),tFrom:controls.target.clone(),dir,dist};
  followRec=rec;
  controls.enablePan=false;
  setActiveUI(rec);
}
function overview(){
  followRec=null;
  trans={t:0,rec:null,from:camera.position.clone(),tFrom:controls.target.clone(),
    fixedTo:new THREE.Vector3(0,235,515),tTo:new THREE.Vector3(0,0,0)};
  controls.enablePan=true;
  setActiveUI(null);
}
function updateCamera(dt){
  if(trans){
    trans.t+=dt/1.15;
    const k=easeIO(clamp(trans.t,0,1));
    let cTo,tTo;
    if(trans.rec){
      const bp=trans.rec.anchor.position;
      tTo=bp;
      cTo=bp.clone().addScaledVector(trans.dir,trans.dist);
    }else{
      tTo=trans.tTo;cTo=trans.fixedTo;
    }
    camera.position.lerpVectors(trans.from,cTo,k);
    controls.target.lerpVectors(trans.tFrom,tTo,k);
    if(trans.t>=1){
      if(trans.rec)prevFollowPos.copy(trans.rec.anchor.position);
      trans=null;
    }
  }else if(followRec){
    const bp=followRec.anchor.position;
    tmpV.copy(bp).sub(prevFollowPos);
    camera.position.add(tmpV);
    controls.target.copy(bp);
    prevFollowPos.copy(bp);
  }
}

/* ---------- UI ---------- */
function setActiveUI(rec){
  document.querySelectorAll('#bodyList button').forEach(b=>{
    b.classList.toggle('on',rec&&b.dataset.key===rec.def.key);
  });
  document.querySelectorAll('.lbl').forEach(l=>{
    l.classList.toggle('on',rec&&rec.def&&l.textContent===rec.def.name);
  });
  renderInfo(rec);
}
function renderInfo(rec){
  const ip=$('infoPanel');
  if(!rec){ip.classList.remove('show');return;}
  ip.classList.add('show');
  const p=rec.def;
  $('ipType').textContent=p.type;
  $('ipName').textContent=p.name;
  $('ipEn').textContent=p.en;
  const rows=$('ipRows');
  rows.innerHTML='';
  for(const k in p.info){
    const r=document.createElement('div');
    r.className='row';
    r.innerHTML='<b></b><span></span>';
    r.querySelector('b').textContent=k;
    r.querySelector('span').textContent=p.info[k];
    rows.appendChild(r);
  }
  if(rec.kind!=='star'){
    const r1=document.createElement('div');
    r1.className='row live';
    r1.innerHTML='<b>当前日距</b><span id="ipLiveR">—</span>';
    rows.appendChild(r1);
    const r2=document.createElement('div');
    r2.className='row live';
    r2.innerHTML='<b>当前轨速</b><span id="ipLiveV">—</span>';
    rows.appendChild(r2);
  }
  $('ipFact').textContent=p.fact||'';
  const jb=$('ipJump');
  if(rec.kind==='comet'){
    jb.style.display='';
    jb.textContent='跳至 2061 年回归';
  }else jb.style.display='none';
}
$('ipClose').addEventListener('click',()=>{$('infoPanel').classList.remove('show');});
$('ipJump').addEventListener('click',()=>{
  simDays=22434.6; // 2061-07-28 前后近日点
  $('simDate').classList.remove('flash');void $('simDate').offsetWidth;
  $('simDate').classList.add('flash');
});
function buildList(){
  const list=$('bodyList');
  const items=[{key:'sun',name:'太阳',accent:SUN.accent},...PLANETS.map(p=>({key:p.key,name:p.name,accent:p.accent})),{key:'halley',name:'哈雷彗星',accent:HALLEY.accent}];
  for(const it of items){
    const b=document.createElement('button');
    b.dataset.key=it.key;
    b.innerHTML='<span class="dot" style="background:'+it.accent+';color:'+it.accent+'"></span>'+it.name;
    b.addEventListener('click',()=>focusBody(BODIES.find(r=>r.def.key===it.key)));
    list.appendChild(b);
  }
}
function toggleChip(id,fn){
  $(id).addEventListener('click',()=>{
    $(id).classList.toggle('on');
    fn($(id).classList.contains('on'));
  });
}
function buildUI(){
  buildList();
  toggleChip('tgOrbit',v=>{orbitLines.forEach(l=>l.visible=v);});
  toggleChip('tgLabel',v=>{$('labels').style.display=v?'':'none';});
  toggleChip('tgBelt',v=>{if(belt)belt.visible=v;if(kuiper)kuiper.visible=v;});
  toggleChip('tgMW',v=>{milkyGroup.visible=v;});
  $('btnPlay').addEventListener('click',togglePause);
  $('btnToday').addEventListener('click',()=>{
    simDays=nowDays();
    $('simDate').classList.remove('flash');void $('simDate').offsetWidth;
    $('simDate').classList.add('flash');
  });
  $('btnOver').addEventListener('click',overview);
  document.querySelectorAll('.spd').forEach(ch=>{
    ch.addEventListener('click',()=>{
      document.querySelectorAll('.spd').forEach(c=>c.classList.remove('on'));
      ch.classList.add('on');
      speedDays=parseFloat(ch.dataset.v);
    });
  });
  window.addEventListener('keydown',e=>{
    if(e.code==='Space'&&e.target===document.body){e.preventDefault();togglePause();}
    if(e.code==='Escape')overview();
  });
  // 点击拾取
  let dx=0,dy=0,dt0=0;
  const ray=new THREE.Raycaster();
  const ptr=new THREE.Vector2();
  $('gl').addEventListener('pointerdown',e=>{dx=e.clientX;dy=e.clientY;dt0=performance.now();});
  $('gl').addEventListener('pointerup',e=>{
    if(Math.hypot(e.clientX-dx,e.clientY-dy)>6||performance.now()-dt0>420)return;
    ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(ptr,camera);
    const hits=ray.intersectObjects(BODIES.map(b=>b.hit).filter(Boolean),false);
    if(hits.length)focusBody(hits[0].object.userData.rec);
    else if(followRec)overview();
  });
  $('gl').addEventListener('pointermove',e=>{
    if(isCoarse)return;
    ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(ptr,camera);
    const hits=ray.intersectObjects(BODIES.map(b=>b.hit).filter(Boolean),false);
    $('gl').style.cursor=hits.length?'pointer':'';
  });
}
function togglePause(){
  paused=!paused;
  $('btnPlay').textContent=paused?'▶':'❚❚';
}
/* 标签投影 */
const wpV=new THREE.Vector3(),viewV=new THREE.Vector3();
function updateLabels(){
  for(const rec of BODIES){
    const el=rec.label;
    if(!el)continue;
    rec.anchor.getWorldPosition(wpV);
    viewV.copy(wpV).applyMatrix4(camera.matrixWorldInverse);
    if(viewV.z>-0.5){el.style.display='none';continue;}
    const dist=viewV.length();
    if(rec===followRec&&dist<rec.displayR*9&&!trans){el.style.display='none';continue;}
    wpV.project(camera);
    const sx=(wpV.x*0.5+0.5)*innerWidth,sy=(-wpV.y*0.5+0.5)*innerHeight;
    if(sx<-60||sx>innerWidth+60||sy<-40||sy>innerHeight+40){el.style.display='none';continue;}
    el.style.display='';
    el.style.opacity=clamp(1.7-dist/1500,0.3,1).toFixed(2);
    el.style.transform='translate('+(sx|0)+'px,'+(sy|0)+'px) translate(-50%,-150%)';
  }
}
/* HUD */
let hudT=0;
function updateHUD(dt){
  hudT+=dt;
  if(hudT<0.2)return;
  hudT=0;
  const dtMs=(simDays+10957.5)*86400000;
  const d=new Date(dtMs);
  $('simDate').textContent=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())
    +' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+' UTC';
  $('simSub').textContent='J2000 +'+fmtInt(simDays)+' 天 · '+(paused?'已暂停':speedLabel());
  const ip=$('infoPanel');
  if(ip.classList.contains('show')){
    const rec=followRec;
    if(rec&&rec.kind!=='star'){
      const elR=$('ipLiveR'),elV=$('ipLiveV');
      if(elR&&rec.rAU!=null){
        elR.textContent=rec.rAU.toFixed(3)+' AU';
        const a=rec.el.a;
        elV.textContent=visViva(rec.rAU,a).toFixed(1)+' km/s';
      }
    }
  }
}
function speedLabel(){
  if(speedDays<0.001)return '实时';
  if(speedDays<0.1)return '1 秒 ≈ '+Math.round(speedDays*24)+' 小时';
  if(speedDays<2)return '1 秒 ≈ 1 天';
  if(speedDays<20)return '1 秒 ≈ '+Math.round(speedDays/7)+' 周';
  if(speedDays<200)return '1 秒 ≈ '+Math.round(speedDays/30.44)+' 月';
  return '1 秒 ≈ '+(speedDays/365.25).toFixed(1)+' 年';
}

/* ---------- 深链参数 ---------- */
function applyDeepLink(){
  if(Q.jd!=null)simDays=parseFloat(Q.jd);
  if(Q.speed!=null){
    speedDays=parseFloat(Q.speed);
    document.querySelectorAll('.spd').forEach(c=>c.classList.remove('on'));
  }
  if(Q.paused==='1'){paused=true;$('btnPlay').textContent='▶';}
  if(Q.focus){
    const rec=BODIES.find(b=>b.def.key===Q.focus.toLowerCase());
    if(rec)focusBody(rec,Q.dist?parseFloat(Q.dist):null);
    if(Q.snap==='1'&&trans)trans.t=1;   // 跳过过渡,直接就位
  }
  if(Q.overview==='1')overview();
}

/* ---------- 主循环 ---------- */
let lastT=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min((now-lastT)/1000,0.1);
  lastT=now;
  if(!paused)simDays+=dt*speedDays;
  updateBodies();
  updateCamera(dt);
  controls.update();
  updateLabels();
  updateHUD(dt);
  composer.render();
}
function onResize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  setFXAA();
}
window.addEventListener('resize',onResize);

/* ---------- 启动流程 ---------- */
const step=async(txt,p)=>{
  $('loadStatus').textContent=txt;
  $('loadFill').style.width=(p*100).toFixed(0)+'%';
  await new Promise(r=>setTimeout(r,20));
};
(async function init(){
  try{
    await step('生成星空与银河…',0.08);
    buildStars();
    await step('点燃太阳…',0.16);
    buildSun();
    await buildPlanets();
    await step('散布小行星带与柯伊伯带…',0.82);
    buildBelts();
    await step('追踪哈雷彗星…',0.92);
    buildComet();
    buildUI();
    applyDeepLink();
    await step('就绪',1);
    if(Q.debug==='1'){
      setTimeout(()=>{
        document.title=bootErr.length?('ERRS['+bootErr.join(' | ')+']')
          :('SS_OK['+BODIES.length+' bodies, d='+simDays.toFixed(1)+']');
      },3500);
    }
    requestAnimationFrame(t=>{lastT=t;tick(t);});
    setTimeout(()=>$('loading').classList.add('done'),350);
  }catch(err){
    fatal('初始化失败:'+(err&&err.message||err));
    console.error(err);
  }
})();
</script>
