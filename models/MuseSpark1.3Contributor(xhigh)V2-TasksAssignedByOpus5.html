<!DOCTYPE html>
<html lang="zh-CN">

<title>太阳系实时运动模型</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);

#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv:active{cursor:grabbing}
.panel{position:fixed;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.45);z-index:10}
#left{left:14px;top:14px;width:196px;max-height:calc(100% - 130px);display:flex;flex-direction:column;overflow:hidden}
#left h2{font-size:11px;letter-spacing:.28em;color:var(--dim);padding:12px 14px 6px;font-weight:600}
#blist{overflow-y:auto;padding:2px 6px 10px;scrollbar-width:thin}
#blist::-webkit-scrollbar{width:5px}#blist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.bi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;color:var(--txt);
  padding:6px 8px;border-radius:9px;cursor:pointer;font-size:13px}
.bi:hover{background:rgba(255,255,255,.07)}
.bi.on{background:rgba(127,212,255,.14);box-shadow:inset 0 0 0 1px rgba(127,212,255,.35)}
.bi .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
.bi.sat{padding-left:26px;font-size:12px;color:#c3cbdb}
.bi small{margin-left:auto;color:var(--dim);font-size:10px}
#right{right:14px;top:14px;width:296px;max-height:calc(100% - 130px);overflow-y:auto;padding:14px 15px;scrollbar-width:thin}
#right::-webkit-scrollbar{width:5px}#right::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
#right h1{font-size:19px;letter-spacing:.06em;display:flex;align-items:center;gap:9px}
#right h1 .dot{width:13px;height:13px;border-radius:50%;box-shadow:0 0 10px currentColor}
#right .en{color:var(--dim);font-size:11px;letter-spacing:.14em;margin:1px 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin:8px 0}
.kv dt{color:var(--dim);white-space:nowrap}.kv dd{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sec{font-size:10.5px;letter-spacing:.3em;color:var(--dim);margin:13px 0 5px;border-top:1px solid var(--line);padding-top:10px}
.blurb{font-size:12px;color:#c9d2e4;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.warn{display:none;margin-top:9px;font-size:11.5px;color:#ffcf7f;background:rgba(255,170,40,.1);
  border:1px solid rgba(255,190,80,.4);border-radius:9px;padding:7px 9px}
.warn.show{display:block}
.note{font-size:11px;color:var(--dim);margin-top:8px}
#bottom{left:50%;transform:translateX(-50%);bottom:14px;display:flex;align-items:center;gap:10px;padding:9px 14px;flex-wrap:wrap;justify-content:center;max-width:min(860px,94vw)}
#bottom button{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--txt);border-radius:9px;

#bottom button:hover{background:rgba(127,212,255,.16)}
#dateTxt{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:13px;min-width:178px;text-align:center}
#spdTxt{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--acc);min-width:118px;text-align:center}
input[type=range]{width:170px;accent-color:#7fd4ff}
#toggles{right:14px;bottom:14px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:12px;max-width:220px}
#toggles label{display:flex;align-items:center;gap:8px;cursor:pointer;color:#c9d2e4;white-space:nowrap}
#toggles input{accent-color:#7fd4ff}
#labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-140%);font-size:11px;letter-spacing:.12em;color:rgba(230,238,250,.92);
  text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.9);white-space:nowrap;pointer-events:none}
.lb::after{content:"";display:block;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.75);margin:2px auto 0}
#hint{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9;font-size:11.5px;letter-spacing:.18em;
  color:rgba(200,212,230,.75);background:rgba(10,14,24,.45);border:1px solid var(--line);border-radius:999px;padding:5px 16px;backdrop-filter:blur(8px)}
#help{position:fixed;left:14px;bottom:14px;z-index:9;font-size:11px;color:var(--dim);background:rgba(10,14,24,.45);
  border:1px solid var(--line);border-radius:9px;padding:6px 10px;backdrop-filter:blur(8px)}
body.hideui .panel,body.hideui #help,body.hideui #hint{display:none}
@media(max-width:900px){#right{display:none}#left{width:150px}#help{display:none}}

<script>

const TAU=Math.PI*2, DEG=Math.PI/180, RAD=180/Math.PI;

const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}

/* ---------------- 2.1 行星轨道根数 ---------------- */

 {r:24622,m:"1.024×10²⁶",per:"164.8 年",sat:16,temp:"−201 ℃",atmo:"H₂ 80% · He 19% · 甲烷 1%",tb:"28.32°",c:"#5b7fe0",blurb:"太阳系风速最快的世界，可达 2100 km/h。深蓝色来自高空的甲烷霾。"},
 {r:1188.3,m:"1.303×10²²",per:"247.9 年",sat:5,temp:"−233 ~ −223 ℃",atmo:"N₂ · 甲烷 · CO",tb:"119.6°",c:"#c8b09a",blurb:"矮行星的心脏——斯普特尼克平原是一片氮冰 glaciers，上面还画着一颗巨大的爱心。"},
];
const SUNR=696340;
/* kind: 0水星 1金星 2地球 3火星 4木星 5土星 6天王 7海王 8冥王 */
const KIND=[1,3,2,4,5,5,6,6,8];
/* ---------------- 2.4 卫星 ---------------- */
const MOONS=[
 {n:"月球",en:"Moon",host:2,r:1737.4,a:384400,per:27.32166,inc:5.145,eq:false,c:"#b8b4ac",blurb:"地球唯一的天然卫星，潮汐锁定，只有一面永远朝向我们。"},
 {n:"木卫一",en:"Io",host:4,r:1821.6,a:421700,per:1.769138,inc:0.05,eq:true,c:"#e8d24a",blurb:"太阳系火山最活跃的天体，表面 покрыт 硫磺霜，400 多座活火山不断喷发。"},
 {n:"木卫二",en:"Europa",host:4,r:1560.8,a:671034,per:3.551181,inc:0.47,eq:true,c:"#d8e2e0",blurb:"冰壳之下藏着深达百公里的全球海洋，是寻找地外生命的头号候选。"},
 {n:"木卫三",en:"Ganymede",host:4,r:2634.1,a:1070412,per:7.154553,inc:0.20,eq:true,c:"#9a8f7f",blurb:"太阳系最大的卫星，比水星还大，拥有自身的磁场。"},
 {n:"木卫四",en:"Callisto",host:4,r:2410.3,a:1882709,per:16.6890,inc:0.19,eq:true,c:"#7a756c",blurb:"表面最古老的天体之一，撞击坑密密麻麻，记录着 40 亿年的轰炸史。"},
 {n:"土卫六",en:"Titan",host:5,r:2574.7,a:1221870,per:15.945,inc:0.35,eq:true,c:"#e0a53c",blurb:"唯一拥有浓密大气和液态甲烷湖泊的卫星，雨下的是天然气。"},
 {n:"海卫一",en:"Triton",host:7,r:1353.4,a:354759,per:-5.876854,inc:156.9,eq:true,c:"#d8d4d0",blurb:"逆行公转的被捕获者，太阳系最冷的天体之一，氮间歇泉高达 8 公里。"},

];
/* ---------------- 2.5 哈雷彗星 ---------------- */
const HALLEY={a:17.834,e:0.96714,I:162.26,omW:111.33,Om:58.42,Tp:2446470.96,P:27512.6};

/* ---------------- 3.1~3.4 轨道力学 ---------------- */
function normM(m){m%=TAU;if(m>Math.PI)m-=TAU;if(m<-Math.PI)m+=TAU;return m;}
function kepler(M,e){
  M=normM(M);let E=M+e*Math.sin(M)*(1+e*Math.cos(M));
  for(let i=0;i<10;i++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-13)break;}
  return E;
}
function elemToEcl(a,e,I,w,Om,M){
  const E=kepler(M,e),cE=Math.cos(E),sE=Math.sin(E);
  const xp=a*(cE-e),yp=a*Math.sqrt(Math.max(0,1-e*e))*sE;
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I),sI=Math.sin(I);
  return [ (cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,
           (cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,
           (sw*sI)*xp+(cw*sI)*yp ];
}
const ecl2world=(x,y,z)=>[x,z,-y];
function planetEcl(i,JD){
  const P=PLANETS[i],T=(JD-J2000)/36525;
  const a=P.a+P.da*T,e=P.e+P.de*T,I=(P.I+P.dI*T)*DEG,
        L=(P.L+P.dL*T)*DEG,lp=(P.lp+P.dlp*T)*DEG,Om=(P.om+P.dom*T)*DEG;
  const w=lp-Om,M=normM(L-lp);
  const p=elemToEcl(a,e,I,w,Om,M);
  const r=Math.hypot(p[0],p[1],p[2]);
  return {p,r,a,e,I,w,Om,M,L,lp};
}
function halleyEcl(JD){
  const M=TAU*(JD-HALLEY.Tp)/HALLEY.P;
  return {p:elemToEcl(HALLEY.a,HALLEY.e,HALLEY.I*DEG,HALLEY.omW*DEG,HALLEY.Om*DEG,M),
          M:normM(M)};
}
/* 自转轴（黄道→world） */
function axisWorld(i){
  const s=SPIN[i],t=s.tilt*DEG,l=s.pole*DEG;
  const ex=Math.sin(t)*Math.cos(l),ey=Math.sin(t)*Math.sin(l),ez=Math.cos(t);
  return norm3(ecl2world(ex,ey,ez));
}
function norm3(v){const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];}
/* 显示压缩 */
let COMPRESS=0.62,COMP_TARGET=0.62;const SCALE=34;
function dispPos(ecl,rAU){
  const r=Math.max(rAU,1e-9);
  const k=SCALE*Math.pow(r,COMPRESS)/r;
  const w=ecl2world(ecl[0],ecl[1],ecl[2]);
  return [w[0]*k,w[1]*k,w[2]*k];
}
function bodyR(km){return 0.72*Math.pow(km/6371,0.42);}
const SUN_R=4.6;
/* 卫星显示距离 3.7 */
function moonD(hostIdx,moon){
  const R=hostIdx<0?SUN_R:(hostIdx===9?SUN_R:bodyR(PHYS[hostIdx].r));
  let ringOut=0;
  if(hostIdx===5)ringOut=2.34;else if(hostIdx===6)ringOut=2.0;else if(hostIdx===4)ringOut=1.81;
  const sibs=MOONS.filter(m=>m.host===hostIdx).map(m=>m.a);
  const a0=Math.min(...sibs);
  const innerR=MOONS.filter(m=>m.host===hostIdx).map(m=>bodyR(m.r)/R);
  const base=Math.max(2.35,ringOut+Math.min(...innerR)+0.55);
  return R*base*Math.pow(moon.a/a0,0.55);
}

/* ---------------- 时间状态 ---------------- */
let JD=Date.now()/86400000+2440587.5;
let playing=true,speedV=42;
function speedDays(v){return Math.sign(v)*1.157407e-5*Math.pow(10,Math.abs(v)/100*8.55);}
function speedText(v){
  const d=Math.abs(speedDays(v));
  const u=d<1/1440?["秒",d*86400]:d<1/24?["分",d*1440]:d<1?["小时",d*24]:d<900?["天",d]:["年",d/365.25];
  return (v<0?"−":"")+u[1].toFixed(u[1]>=100?0:u[1]>=10?1:2)+" "+u[0]+"/秒";
}
function jdToDate(jd){return new Date((jd-2440587.5)*86400000);}

/* 球体网格（绕序验证见 7.12：用 (a,c,b)+(a,d,c) 使法向朝外） */
function makeSphere(lat,lon){
  const P=[],N=[],UV=[],IX=[];
  for(let i=0;i<=lat;i++){const th=i/lat*Math.PI,st=Math.sin(th),ct=Math.cos(th);
    for(let j=0;j<=lon;j++){const ph=j/lon*TAU,sp=Math.sin(ph),cp=Math.cos(ph);
      const x=st*cp,y=ct,z=st*sp;P.push(x,y,z);N.push(x,y,z);UV.push(j/lon,i/lat);}}
  for(let i=0;i<lat;i++)for(let j=0;j<lon;j++){
    const a=i*(lon+1)+j,b=(i+1)*(lon+1)+j,c=(i+1)*(lon+1)+j+1,d=i*(lon+1)+j+1;
    IX.push(a,c,b, a,d,c);}
  const v=gl.createVertexArray();gl.bindVertexArray(v);
  const mk=(arr,n)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);return b;};
  const b0=mk(P,3);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  const b1=mk(N,3);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
  const b2=mk(UV,2);gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,2,gl.FLOAT,false,0,0);
  const ei=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ei);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(IX),gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return {vao:v,count:IX.length};
}

/* 环几何（XZ 平面，y=0） */
function makeRing(r0,r1,seg){
  const P=[],UV=[],IX=[];
  for(let i=0;i<=seg;i++){const a=i/seg*TAU,c=Math.cos(a),s=Math.sin(a);
    P.push(c*r0,0,s*r0, c*r1,0,s*r1);UV.push(0,i/seg, 1,i/seg);
    if(i<seg){const k=i*2;IX.push(k,k+1,k+2, k+1,k+3,k+2);}}
  const v=gl.createVertexArray();gl.bindVertexArray(v);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(P),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  const e=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,e);

const NOISE=`
float hash13(vec3 p){p=fract(p*0.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
vec3 hash33(vec3 p){p=fract(p*vec3(0.1031,0.1030,0.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
float vnoise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
 float n000=hash13(i),n100=hash13(i+vec3(1,0,0)),n010=hash13(i+vec3(0,1,0)),n110=hash13(i+vec3(1,1,0));
 float n001=hash13(i+vec3(0,0,1)),n101=hash13(i+vec3(1,0,1)),n011=hash13(i+vec3(0,1,1)),n111=hash13(i+vec3(1,1,1));
 return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);}
mat3 rotM(float a,float b){float ca=cos(a),sa=sin(a),cb=cos(b),sb=sin(b);
 return mat3(cb,0.,sb, sa*sb,ca,-sa*cb, -ca*sb,sa,ca*cb);}
float fbm(vec3 p){float s=0.,a=0.5;mat3 r=rotM(0.7,1.3);
 for(int i=0;i<5;i++){s+=a*vnoise(p);p=r*p*2.03+vec3(11.3);a*=0.5;}return s;}
float fbm7(vec3 p){float s=0.,a=0.5;mat3 r=rotM(0.7,1.3);
 for(int i=0;i<7;i++){s+=a*vnoise(p);p=r*p*2.03+vec3(11.3);a*=0.5;}return s;}
vec2 worley12(vec3 p){vec3 ip=floor(p),fp=fract(p);float f1=8.,f2=8.;
 for(int k=-1;k<=1;k++)for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){
  vec3 g=vec3(float(i),float(j),float(k));
  vec3 o=hash33(ip+g);vec3 r=g+o-fp;float d=dot(r,r);
  if(d<f1){f2=f1;f1=d;}else if(d<f2){f2=d;}}

float sstep(float a,float b,float x){float t=clamp((x-a)/(b-a),0.,1.);return t*t*(3.-2.*t);}

float craterH(vec3 p,float depth,float seed){

 float dp[4];dp[0]=1.;dp[1]=.52;dp[2]=.26;dp[3]=.13;

   vec3 rr=g+hash33(ip+g)-fp;float d=dot(rr,rr);

    const ex=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,
          ey=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,
          ez=(sw*sI)*xp+(cw*sI)*yp;
    const r=Math.hypot(ex,ey,ez);
    pts.push(dispPos([ex,ey,ez],r));
  }

}

  gl.uniformMatrix4fv(U(starProg,"uP"),false,new Float32Array(PROJ));
  gl.uniform3fv(U(starProg,"uCam"),new Float32Array(cp));
  gl.uniform1f(U(starProg,"uT"),simT.t);gl.uniform1f(U(starProg,"uPR"),DPR);
  gl.bindVertexArray(starVAO);gl.drawArrays(gl.POINTS,0,starN);
  gl.disable(gl.BLEND);
  /* 球体 */
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);
  const sunIFor=r=>clamp(1.5*Math.pow(1/Math.max(r,0.05),0.40),0.26,2.1);
  drawBody([0,0,0],SUN_R,[0,1,0],simT.t*0.02,0,{sunI:1,c1:[0,0,0],c2:[0,0,0],seed:0});
  S.P.forEach((p,i)=>{
    const rAU=p.el.r;
    const opt={sunI:sunIFor(rAU),low:false,seed:0,turb:1,rings:0,c1:[0,0,0],c2:[0,0,0]};
    if(i===4){Object.assign(opt,GIANT[4],{rings:0});}
    else if(i===5){Object.assign(opt,GIANT[5],{rings:1});}
    else if(i===6){Object.assign(opt,{c1:GIANT[6].c1,c2:GIANT[6].c2,turb:0.5,seed:10,rings:2});}
    else if(i===7){Object.assign(opt,GIANT[7],{rings:0});}
    else if(i===0){opt.seed=11;}
    else if(i===1){opt.seed=12;}
    else if(i===3){opt.seed=13;}
    else if(i===8){opt.seed=14;}
    drawBody(p.wp,p.R,axisWorld(i),spinPhase[i],MKIND[i],opt);
  });
  if(show.moon)S.S.forEach(s=>{
    drawBody(s.wp,s.R,axisWorld(s.m.host),simT.t*0.1+s.th,MOONKIND[s.m.n]||7,
      {sunI:sunIFor(S.P[s.m.host].el.r),low:true,seed:s.m.n.length});
  });
  /* 轨道缎带 */
  if(show.orbit){
    const cols=[[0.55,0.5,0.45],[0.8,0.65,0.4],[0.35,0.6,1.0],[0.9,0.4,0.25],[0.8,0.6,0.4],[0.85,0.75,0.5],[0.5,0.8,0.85],[0.4,0.5,1.0],[0.7,0.6,0.55],[0.5,0.7,1.0]];
    const arr=new Float32Array(10*(ORB_N+1)*2*8);
    let body=0;
    const put=(pts,ci,base)=>{
      for(let k=0;k<=ORB_N;k++){
        const p=pts[k];
        const q0=pts[Math.max(0,k-1)],q1=pts[Math.min(ORB_N,k+1)];
        let t=[q1[0]-q0[0],q1[1]-q0[1],q1[2]-q0[2]];
        const d=k/ORB_N;
        const a=base+0.55*Math.pow(Math.max(0,1-d*2.2),3.2);
        for(let s=0;s<2;s++){
          const o=(body*(ORB_N+1)*2+(k*2+s))*8;
          arr[o]=p[0];arr[o+1]=p[1];arr[o+2]=p[2];
          arr[o+3]=t[0];arr[o+4]=t[1];arr[o+5]=t[2];
          arr[o+6]=s?1:-1;arr[o+7]=a;
        }
      }
      const c=cols[ci%cols.length];
      gl.useProgram(orbProg);
      gl.uniformMatrix4fv(U(orbProg,"uV"),false,new Float32Array(VIEW));
      gl.uniformMatrix4fv(U(orbProg,"uP"),false,new Float32Array(PROJ));
      gl.uniform2f(U(orbProg,"uVP"),W,H);
      gl.uniform1f(U(orbProg,"uW"),ci===9?1.5:2.2);
      gl.uniform3f(U(orbProg,"uC"),c[0],c[1],c[2]);
      gl.bindVertexArray(orbVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER,orbBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER,body*(ORB_N+1)*2*8*4,arr,body*(ORB_N+1)*2*8,(ORB_N+1)*2*8);
      gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
      gl.depthMask(false);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
      gl.drawArrays(gl.TRIANGLE_STRIP,body*(ORB_N+1)*2,(ORB_N+1)*2);
      gl.disable(gl.BLEND);gl.depthMask(true);gl.enable(gl.CULL_FACE);
      body++;
    };
    /* 注意：put 每次都重绑定同一缓冲不同偏移——简化起见每次只画一条 */
    for(let i=0;i<9;i++)put(sampleOrbit(i),i,0.10);
    if(show.comet){
      const pts=[];
      // 哈雷轨道整圈采样，从当前位置向后（拖尾渐变起点=彗星当前位置）
      const Mc=S.hc.M;
      for(let k=0;k<=ORB_N;k++){
        const M=Mc-TAU*k/ORB_N;
        const E=kepler(M,HALLEY.e);
        const xp=HALLEY.a*(Math.cos(E)-HALLEY.e),yp=HALLEY.a*Math.sqrt(1-HALLEY.e*HALLEY.e)*Math.sin(E);
        const w=HALLEY.omW*DEG,Om=HALLEY.Om*DEG,I=HALLEY.I*DEG;
        const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I),sI=Math.sin(I);
        const ex=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,
              ey=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,
              ez=(sw*sI)*xp+(cw*sI)*yp;
        const r=Math.hypot(ex,ey,ez);
        pts.push(dispPos([ex,ey,ez],r));
      }
      // 为拖尾效果旋转数组使当前位置在首位
      put(pts,9,0.05);
    }
  }
  /* 小行星带 */
  if(show.rock){
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
    gl.depthMask(false);gl.enable(gl.DEPTH_TEST);
    gl.useProgram(rockProg);
    gl.uniform1f(U(rockProg,"uJD"),JD);
    gl.uniform1f(U(rockProg,"uCmp"),COMPRESS);
    gl.uniform1f(U(rockProg,"uPR"),DPR);
    gl.uniform1f(U(rockProg,"uT"),simT.t);
    gl.uniformMatrix4fv(U(rockProg,"uV"),false,new Float32Array(VIEW));
    gl.uniformMatrix4fv(U(rockProg,"uP"),false,new Float32Array(PROJ));
    gl.bindVertexArray(ROCKS.vao);
    gl.drawArrays(gl.POINTS,0,ROCKS.n);
    gl.disable(gl.BLEND);gl.depthMask(true);
  }
  /* 大气壳 */
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.depthMask(false);gl.enable(gl.DEPTH_TEST);
  const atmo=(w,R,c,h,I)=>{
    gl.useProgram(atmoProg);
    const s=R*(1+h*7.5);
    gl.uniformMatrix4fv(U(atmoProg,"uM"),false,new Float32Array([s,0,0,0, 0,s,0,0, 0,0,s,0, w[0],w[1],w[2],1]));
    gl.uniformMatrix4fv(U(atmoProg,"uV"),false,new Float32Array(VIEW));
    gl.uniformMatrix4fv(U(atmoProg,"uP"),false,new Float32Array(PROJ));
    gl.uniform3fv(U(atmoProg,"uCam"),new Float32Array(cp));
    gl.uniform3fv(U(atmoProg,"uC"),new Float32Array(c));
    gl.uniform3fv(U(atmoProg,"uCtr"),new Float32Array(w));
    gl.uniform1f(U(atmoProg,"uR"),R);gl.uniform1f(U(atmoProg,"uH"),h);gl.uniform1f(U(atmoProg,"uI"),I);
    gl.bindVertexArray(SPH_LOW.vao);
    gl.drawElements(gl.TRIANGLES,SPH_LOW.count,gl.UNSIGNED_INT,0);
  };
  atmo(S.P[2].wp,S.P[2].R,[0.30,0.55,1.0],0.035,sunIFor(S.P[2].el.r)*0.5);
  atmo(S.P[1].wp,S.P[1].R,[0.9,0.8,0.6],0.03,sunIFor(S.P[1].el.r)*0.4);
  atmo(S.P[5].wp,S.P[5].R,[0.7,0.65,0.5],0.04,sunIFor(S.P[5].el.r)*0.35);
  atmo(S.P[7].wp,S.P[7].R,[0.35,0.5,1.0],0.035,sunIFor(S.P[7].el.r)*0.5);
  gl.disable(gl.BLEND);gl.depthMask(true);
  /* 环系 */
  {
    gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
    const drawRing=(pi,geo,kind,tint)=>{
      const w=S.P[pi].wp,R=S.P[pi].R,ax=axisWorld(pi);
      const ref=Math.abs(ax[1])>0.94?[1,0,0]:[0,1,0];
      let X=[ref[1]*ax[2]-ref[2]*ax[1],ref[2]*ax[0]-ref[0]*ax[2],ref[0]*ax[1]-ref[1]*ax[0]];
      const l=Math.hypot(...X);X=X.map(v=>v/l);
      const Z=[X[1]*ax[2]-X[2]*ax[1],X[2]*ax[0]-X[0]*ax[2],X[0]*ax[1]-X[1]*ax[0]];
      const M=[X[0]*R,ax[0]*R,Z[0]*R,0, X[1]*R,ax[1]*R,Z[1]*R,0, X[2]*R,ax[2]*R,Z[2]*R,0, w[0],w[1],w[2],1];
      gl.useProgram(ringProg);
      gl.uniformMatrix4fv(U(ringProg,"uM"),false,new Float32Array(M));
      gl.uniformMatrix4fv(U(ringProg,"uV"),false,new Float32Array(VIEW));
      gl.uniformMatrix4fv(U(ringProg,"uP"),false,new Float32Array(PROJ));
      gl.uniform3fv(U(ringProg,"uCam"),new Float32Array(cp));
      gl.uniform3fv(U(ringProg,"uN"),new Float32Array(ax));
      gl.uniform3fv(U(ringProg,"uCtr"),new Float32Array(w));
      gl.uniform1f(U(ringProg,"uR"),R);
      gl.uniform1f(U(ringProg,"uKind"),kind);
      gl.uniform1f(U(ringProg,"uSunI"),sunIFor(S.P[pi].el.r));
      gl.uniform3fv(U(ringProg,"uTint"),new Float32Array(tint));
      gl.bindVertexArray(geo.vao);
      gl.drawElements(gl.TRIANGLES,geo.count,gl.UNSIGNED_INT,0);
    };
    drawRing(5,RING_SAT,0,[0.85,0.78,0.62]);
    drawRing(6,RING_URA,1,[0.35,0.38,0.40]);
    drawRing(4,RING_JUP,2,[0.6,0.55,0.5]);
    gl.enable(gl.CULL_FACE);gl.disable(gl.BLEND);gl.depthMask(true);
  }
  /* 彗星彗发+彗尾 */
  if(show.comet&&S.hr<6.5){
    const f=Math.pow(3/Math.max(S.hr,0.4),2);
    drawBody(S.hwp,0.35,[0,1,0],0,7,{sunI:sunIFor(S.hr),low:true,seed:5});
    // 尾：CPU 重建 billboard 缎带
    const sunD=norm3([-S.hwp[0],-S.hwp[1],-S.hwp[2]]);
    const ph=computeSystem._prevH;
    const vel=ph?[S.hwp[0]-ph[0],S.hwp[1]-ph[1],S.hwp[2]-ph[2]]:[0,0,0];
    let dust=sunD.map((v,i)=>v*0.8+(vel[i]||0)*30);
    dust=norm3(dust.map(v=>v||0.001));
    const mkTail=(dir,len,w0,col)=>{
      const arr=new Float32Array((TAIL_N+1)*2*8);
      const view=norm3([cp[0]-S.hwp[0],cp[1]-S.hwp[1],cp[2]-S.hwp[2]]);
      let side=[dir[1]*view[2]-dir[2]*view[1],dir[2]*view[0]-dir[0]*view[2],dir[0]*view[1]-dir[1]*view[0]];
      const l=Math.hypot(...side)||1;side=side.map(v=>v/l);
      for(let k=0;k<=TAIL_N;k++){
        const t=k/TAIL_N;
        const bend=t*t*2.0;
        const cx=S.hwp[0]+dir[0]*len*t,cy=S.hwp[1]+dir[1]*len*t,cz=S.hwp[2]+dir[2]*len*t;
        const wdt=w0*(0.3+t*1.6);
        const a=Math.pow(1-t,1.8)*clamp(f,0,3)*0.5;
        for(let s=0;s<2;s++){const o=(k*2+s)*8;
          arr[o]=cx+side[0]*(s?1:-1)*wdt;arr[o+1]=cy+side[1]*(s?1:-1)*wdt;arr[o+2]=cz+side[2]*(s?1:-1)*wdt;
          arr[o+3]=dir[0];arr[o+4]=dir[1];arr[o+5]=dir[2];arr[o+6]=s?1:-1;arr[o+7]=a;}
      }
      gl.useProgram(orbProg);
      gl.uniformMatrix4fv(U(orbProg,"uV"),false,new Float32Array(VIEW));
      gl.uniformMatrix4fv(U(orbProg,"uP"),false,new Float32Array(PROJ));
      gl.uniform2f(U(orbProg,"uVP"),W,H);
      gl.uniform1f(U(orbProg,"uW"),2.0);
      gl.uniform3f(U(orbProg,"uC"),col[0],col[1],col[2]);
      gl.bindVertexArray(tailVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER,tailBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER,0,arr);
      gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);gl.disable(gl.CULL_FACE);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,(TAIL_N+1)*2);
      gl.disable(gl.BLEND);gl.depthMask(true);gl.enable(gl.CULL_FACE);
    };
    mkTail(sunD,8*f+2,0.5,[0.35,0.55,1.0]);
    mkTail(dust,5*f+1.5,0.9,[1.0,0.8,0.5]);
  }
  computeSystem._prevH=[...S.hwp];
  /* 日冕 */
  {
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);
    gl.enable(gl.DEPTH_TEST);
    gl.useProgram(corProg);
    gl.uniformMatrix4fv(U(corProg,"uV"),false,new Float32Array(VIEW));
    gl.uniformMatrix4fv(U(corProg,"uP"),false,new Float32Array(PROJ));
    gl.uniform3f(U(corProg,"uC"),0,0,0);
    gl.uniform1f(U(corProg,"uT"),simT.t);
    gl.bindVertexArray(COR_VAO);
    gl.uniform1f(U(corProg,"uS"),SUN_R*3.1);gl.uniform1f(U(corProg,"uK"),1.0);
    gl.drawElements(gl.TRIANGLES,6,gl.UNSIGNED_INT,0);
    gl.uniform1f(U(corProg,"uS"),SUN_R*9.0);gl.uniform1f(U(corProg,"uK"),2.6);
    gl.drawElements(gl.TRIANGLES,6,gl.UNSIGNED_INT,0);
    gl.disable(gl.BLEND);gl.depthMask(true);
  }
  /* 解析 MSAA */
  if(msFBO){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msFBO);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,resFBO);
    gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER,resFBO);
  }
  const sceneTex=resTex;
  /* 泛光：阈值提取 + 6 级降采样 + 累加 */
  const doBloom=show.bloom;
  const bw=W>>1,bh=H>>1;
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);
  gl.bindVertexArray(FS_VAO);
  const bindTx=(t,i)=>{gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,t);};
  if(doBloom){
    gl.bindFramebuffer(gl.FRAMEBUFFER,brightFBO);gl.viewport(0,0,bw,bh);
    gl.useProgram(brightProg);
    bindTx(sceneTex,0);gl.uniform1i(U(brightProg,"uS"),0);
    gl.uniform1f(U(brightProg,"uThr"),HDR?1.25:0.72);
    gl.uniform1f(U(brightProg,"uKnee"),0.6);
    gl.drawArrays(gl.TRIANGLES,0,3);
    let src=brightTex,sw=bw,sh2=bh;
    const chain=[brightTex,...bloomTex];
    for(let i=0;i<6;i++){
      const w2=Math.max(1,sw>>1),h2=Math.max(1,sh2>>1);
      // bloomTex[i] 尺寸已在 buildTargets 中设为逐级减半（从 bw/2 开始），与此处一致
      gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFBO[i]);gl.viewport(0,0,w2,h2);
      gl.useProgram(downProg);
      bindTx(src,0);gl.uniform1i(U(downProg,"uS"),0);
      gl.uniform2f(U(downProg,"uPx"),1/sw,1/sh2);
      gl.drawArrays(gl.TRIANGLES,0,3);
      src=bloomTex[i];sw=w2;sh2=h2;
    }
    /* 升采样累加：用加法混合（7.3 反馈环对策） */
    let dst=brightFBO,dw=bw,dh=bh;
    // 先把最小 mip 清为 0 再逐级加回？简化：以 bright 为累加目标自上而下加
    for(let i=5;i>=0;i--){
      const w2=i===0?bw:Math.max(1,bw>>(i+1)),h2=i===0?bh:Math.max(1,bh>>(i+1));
      // 目标为上一级
      const target=i===0?brightFBO:bloomFBO[i-1];
      const tw=i===0?bw:Math.max(1,bw>>i),th2=i===0?bh:Math.max(1,bh>>i);
      gl.bindFramebuffer(gl.FRAMEBUFFER,target);gl.viewport(0,0,tw,th2);
      gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE); // 只采样源 mip，不读写同一纹理
      gl.useProgram(upProg);
      bindTx(i===5?bloomTex[5]:bloomTex[i],0);gl.uniform1i(U(upProg,"uS"),0);
      gl.uniform2f(U(upProg,"uPx"),1/(i===0?(bw>>1):Math.max(1,bw>>(i+1))),1/(i===0?(bh>>1):Math.max(1,bh>>(i+1))));
      gl.drawArrays(gl.TRIANGLES,0,3);
      gl.disable(gl.BLEND);
    }
  }
  /* 合成 */
  // 太阳屏幕坐标与可见度（CPU）
  let sunSX=0,sunSY=0,sunV=0;
  {
    const c=xform(mMul(PROJ,VIEW),[0,0,0]);
    const behind=c[2]>1||c[2]<-1;
    sunSX=c[0]*0.5+0.5;sunSY=c[1]*0.5+0.5;
    sunV=(!behind&&sunSX>-0.3&&sunSX<1.3&&sunSY>-0.3&&sunSY<1.3)?1:0;
    if(sunV){ // 行星遮挡检测
      const all=S.P.map(p=>({w:p.wp,R:p.R}));
      for(const b of all){
        const s=projScr(b.w);
        const dx=(s[0]/W- sunSX)* (W/H),dy=s[1]/H-(1-sunSY);
        // 上式坐标系混乱，改用 NDC 比较
        const ndcB=xform(mMul(PROJ,VIEW),b.w);
        const ndcS=c;
        const dd=Math.hypot((ndcB[0]-ndcS[0])*(W/H),(ndcB[1]-ndcS[1]));
        if(dd<0.02&&ndcB[2]<ndcS[2]+0.001&&ndcB[2]>-1){sunV*=0.25;break;}
      }
      const dEdge=Math.min(sunSX,1-sunSX,sunSY,1-sunSY);
      sunV*=clamp(dEdge/0.25+0.3,0,1);
    }
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.BLEND);
  gl.useProgram(compProg);
  bindTx(sceneTex,0);gl.uniform1i(U(compProg,"uS"),0);
  bindTx(doBloom?brightTex:sceneTex,1);gl.uniform1i(U(compProg,"uB"),1);
  gl.uniform2f(U(compProg,"uSun"),sunSX,sunSY);
  gl.uniform1f(U(compProg,"uSunV"),sunV);
  gl.uniform1f(U(compProg,"uT"),simT.t);
  gl.uniform1f(U(compProg,"uBloom"),doBloom?0.34:0.0);
  gl.uniform1f(U(compProg,"uAsp"),W/H);
  gl.bindVertexArray(FS_VAO);
  gl.drawArrays(gl.TRIANGLES,0,3);
  const err=gl.getError();
  if(err&&!frame._err){frame._err=1;console.warn("GL error",err);}
  dateTxt.textContent=fmtDate(jdToDate(JD));
  spdTxt.textContent=(playing?"":"已暂停 · ")+speedText(speedV);
  if(frames%12===0)updateInfo(S);
  updateLabels(S);
  frames++;
}
computeSystem._prevH=null;
/* 自检：2026-08-07 地球 */
(function(){
  const tJD=Date.UTC(2026,7,7,12)/86400000+2440587.5;
  const el=planetEcl(2,tJD);
  const lon=((Math.atan2(el.p[1],el.p[0])*RAD%360)+360)%360;
  console.log("[自检 2026-08-07] r=",el.r.toFixed(4),"黄经=",lon.toFixed(2),
    "v=",(29.7847*Math.sqrt(2/el.r-1/el.a)).toFixed(2));
})();
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(frame);});
</script>
