<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>太阳系 · Solar System</title>
<style>
  :root{
    --glass: rgba(14, 18, 34, 0.55);
    --glass-line: rgba(120, 160, 255, 0.18);
    --txt: #e8ecff;
    --txt-dim: #93a0c8;
    --accent: #6ea8ff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--txt);
    cursor: grab;
  }
  body:active{ cursor: grabbing; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }

  /* 顶部标题 */
  #title{
    position:fixed; top:22px; left:26px; z-index:10; pointer-events:none;
    text-shadow:0 0 24px rgba(80,140,255,.6);
  }
  #title h1{
    font-size:22px; font-weight:600; letter-spacing:6px;
    background:linear-gradient(90deg,#bcd2ff,#7fb0ff,#ffd9a8);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #title p{ font-size:11px; letter-spacing:3px; color:var(--txt-dim); margin-top:4px;}

  /* 控制面板 */
  #panel{
    position:fixed; top:22px; right:22px; z-index:10; width:248px;
    background:var(--glass); border:1px solid var(--glass-line);
    border-radius:16px; padding:16px 18px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow:0 8px 40px rgba(0,0,0,.45);
  }
  #panel h2{ font-size:12px; letter-spacing:2px; color:var(--accent); margin-bottom:14px; font-weight:600;}
  .row{ margin-bottom:14px; }
  .row label{ display:flex; justify-content:space-between; font-size:12px; color:var(--txt-dim); margin-bottom:6px;}
  .row label span{ color:var(--txt); font-variant-numeric:tabular-nums;}
  input[type=range]{ width:100%; -webkit-appearance:none; appearance:none; height:4px; border-radius:4px;
    background:linear-gradient(90deg,var(--accent),#3a4a78); outline:none;}
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px;height:14px;border-radius:50%;
    background:#dce8ff; box-shadow:0 0 10px var(--accent); cursor:pointer;}
  input[type=range]::-moz-range-thumb{ width:14px;height:14px;border-radius:50%;border:0;
    background:#dce8ff; box-shadow:0 0 10px var(--accent); cursor:pointer;}
  .toggles{ display:flex; flex-direction:column; gap:9px; }
  .toggle{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--txt-dim); cursor:pointer; user-select:none;}
  .toggle input{ appearance:none; width:32px;height:18px;border-radius:18px; background:#2a3454; position:relative; cursor:pointer; transition:.2s;}
  .toggle input::after{ content:""; position:absolute; top:2px;left:2px; width:14px;height:14px;border-radius:50%; background:#8896c0; transition:.2s;}
  .toggle input:checked{ background:linear-gradient(90deg,var(--accent),#4d7fd8);}
  .toggle input:checked::after{ left:16px; background:#fff;}
  #resetView{
    width:100%; padding:9px; margin-top:4px; border-radius:10px; border:1px solid var(--glass-line);
    background:rgba(110,168,255,.12); color:var(--txt); font-size:12px; letter-spacing:1px; cursor:pointer; transition:.2s;
  }
  #resetView:hover{ background:rgba(110,168,255,.28);}

  /* 行星信息卡 */
  #info{
    position:fixed; left:22px; bottom:22px; z-index:10; width:300px;
    background:var(--glass); border:1px solid var(--glass-line); border-radius:16px; padding:18px 20px;
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow:0 8px 40px rgba(0,0,0,.45);
    opacity:0; transform:translateY(16px); transition:.45s cubic-bezier(.2,.8,.2,1); pointer-events:none;
  }
  #info.show{ opacity:1; transform:none; }
  #info .tag{ font-size:10px; letter-spacing:3px; color:var(--accent); }
  #info h3{ font-size:24px; font-weight:600; margin:2px 0 2px; letter-spacing:1px;}
  #info .en{ font-size:12px; color:var(--txt-dim); letter-spacing:2px; margin-bottom:12px;}
  #info dl{ display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:12px;}
  #info dt{ color:var(--txt-dim);}
  #info dd{ color:var(--txt); font-variant-numeric:tabular-nums; text-align:right;}
  #info .fact{ margin-top:12px; padding-top:12px; border-top:1px solid var(--glass-line);
    font-size:12px; line-height:1.65; color:#c4cdf0;}

  /* 行星标签（3D投影） */
  #labels{ position:fixed; inset:0; pointer-events:none; z-index:5; }
  .plabel{
    position:absolute; transform:translate(-50%,-50%); font-size:11px; letter-spacing:1px;
    color:#dbe4ff; white-space:nowrap; text-shadow:0 0 8px rgba(0,0,0,.9);
    transition:opacity .3s;
  }
  .plabel::before{
    content:""; display:block; width:5px;height:5px; margin:0 auto 4px; border-radius:50%;
    background:var(--c,#9ec0ff); box-shadow:0 0 8px var(--c,#9ec0ff);
  }

  /* 提示 */
  #hint{
    position:fixed; bottom:22px; right:22px; z-index:10; font-size:11px; color:var(--txt-dim);
    letter-spacing:1px; text-align:right; line-height:1.8; pointer-events:none;
  }
  #hint b{ color:var(--accent); font-weight:500;}
  #hint kbd{
    display:inline-block; min-width:18px; padding:1px 5px; margin:0 1px;
    border:1px solid var(--glass-line); border-radius:4px;
    background:rgba(110,168,255,.08); color:var(--accent);
    font-family:inherit; font-size:10px; font-weight:600; text-align:center;
  }

  /* 行星悬停气泡 */
  #tooltip{
    position:fixed; z-index:11; pointer-events:none; opacity:0; transform:translate(-50%,-130%);
    padding:5px 10px; border-radius:8px; background:rgba(10,14,28,.85);
    border:1px solid var(--glass-line); backdrop-filter:blur(8px);
    font-size:11px; letter-spacing:1px; color:#dbe4ff; white-space:nowrap;
    box-shadow:0 4px 18px rgba(0,0,0,.5); transition:opacity .15s;
  }
  #tooltip.show{ opacity:1; }

  /* 聚焦脉冲指示环 */
  .pulse-ring{
    position:absolute; transform:translate(-50%,-50%); border-radius:50%;
    border:1.5px solid rgba(110,168,255,.8); pointer-events:none;
    box-shadow:0 0 12px rgba(110,168,255,.5);
    animation:pulseRing 2s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{ width:18px; height:18px; opacity:.9; border-width:2px; }
    100%{ width:64px; height:64px; opacity:0; border-width:.5px; }
  }

  /* 模拟时间显示 */
  #simTime{
    position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:10;
    padding:8px 18px; border-radius:20px; text-align:center; pointer-events:none;
    background:var(--glass); border:1px solid var(--glass-line);
    backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  #simTime .lbl{ font-size:9px; letter-spacing:3px; color:var(--accent); }
  #simTime .date{ font-size:14px; font-weight:600; color:var(--txt); font-variant-numeric:tabular-nums; margin-top:2px;}

  /* 面板折叠按钮（移动端） */
  #panelToggle{
    display:none; position:fixed; top:22px; right:22px; z-index:11;
    width:42px; height:42px; border-radius:12px; border:1px solid var(--glass-line);
    background:var(--glass); backdrop-filter:blur(14px); color:var(--accent);
    font-size:18px; cursor:pointer; align-items:center; justify-content:center;
  }

  /* 加载界面（升级版） */
  #loading{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #050818 0%, #000 70%);
    color:var(--accent); transition:opacity .9s; overflow:hidden;
  }
  #loading.hide{ opacity:0; pointer-events:none;}
  .load-orbit{
    position:relative; width:120px; height:120px; margin:0 auto 28px;
  }
  .load-orbit::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(110,168,255,.15);
  }
  .load-core{
    position:absolute; top:50%; left:50%; width:24px; height:24px; transform:translate(-50%,-50%);
    border-radius:50%; background:radial-gradient(circle,#ffe9b0,#ff7a2a 60%,#c2400a);
    box-shadow:0 0 30px rgba(255,140,40,.7), 0 0 60px rgba(255,90,20,.4);
    animation:sunPulse 2.4s ease-in-out infinite;
  }
  @keyframes sunPulse{ 50%{ box-shadow:0 0 40px rgba(255,170,60,.9), 0 0 80px rgba(255,110,30,.55);} }
  .load-planet{
    position:absolute; top:50%; left:50%; width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%; background:radial-gradient(circle,#9ec5ff,#3a6dd8);
    box-shadow:0 0 10px rgba(110,168,255,.7);
    transform-origin:0 0; animation:rev 2.6s linear infinite;
  }
  @keyframes rev{ to{ transform:rotate(360deg) translateX(54px) rotate(-360deg);} }
  .load-text{ font-size:13px; letter-spacing:6px; color:var(--accent); }
  .load-sub{ font-size:10px; letter-spacing:3px; color:var(--txt-dim); margin-top:8px;}
  .load-bar{ width:180px; height:2px; margin:18px auto 0; background:rgba(110,168,255,.15); border-radius:2px; overflow:hidden;}
  .load-bar span{ display:block; height:100%; width:30%; background:linear-gradient(90deg,transparent,var(--accent),transparent); animation:loadSweep 1.4s ease-in-out infinite;}
  @keyframes loadSweep{ 0%{ transform:translateX(-100%);} 100%{ transform:translateX(450%);} }

  /* 响应式 */
  @media (max-width: 760px){
    #panel{
      top:auto; bottom:22px; right:14px; left:14px; width:auto; max-height:0; padding:0 18px;
      overflow:hidden; transition:max-height .4s ease, padding .4s ease; pointer-events:none;
    }
    #panel.open{ max-height:420px; padding:16px 18px; pointer-events:auto;}
    #panelToggle{ display:flex; }
    #info{ left:14px; right:14px; bottom:120px; width:auto; }
    #title{ top:16px; left:16px; }
    #title h1{ font-size:17px; letter-spacing:4px;}
    #simTime{ top:14px; padding:6px 12px;}
    #simTime .date{ font-size:12px;}
    #hint{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    .load-planet, .load-core, .load-bar span{ animation:none;}
    .pulse-ring{ animation:none; opacity:.6; width:40px; height:40px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="loading">
  <div class="load-orbit">
    <div class="load-core"></div>
    <div class="load-planet"></div>
  </div>
  <div class="load-text">SOLAR SYSTEM</div>
  <div class="load-sub">正在生成宇宙…</div>
  <div class="load-bar"><span></span></div>
</div>

<div id="title">
  <h1>SOLAR SYSTEM</h1>
  <p>太阳系交互模型</p>
</div>

<button id="panelToggle" aria-label="切换控制面板">⚙</button>

<div id="simTime">
  <div class="lbl">MISSION TIME · 模拟时间</div>
  <div class="date" id="simDate">2026-01-01</div>
</div>

<div id="panel">
  <h2>控制面板</h2>
  <div class="row">
    <label>时间流速 <span id="speedVal">1.0×</span></label>
    <input id="speed" type="range" min="0" max="50" step="0.1" value="1" />
  </div>
  <div class="toggles">
    <label class="toggle"><input id="tgOrbit" type="checkbox" checked /><span>轨道线</span></label>
    <label class="toggle"><input id="tgLabel" type="checkbox" checked /><span>行星名称</span></label>
    <label class="toggle"><input id="tgBelt" type="checkbox" checked /><span>小行星带</span></label>
    <label class="toggle"><input id="tgGlow" type="checkbox" checked /><span>恒星辉光</span></label>
  </div>
  <button id="resetView">重置视角</button>
</div>

<div id="info">
  <div class="tag" id="iTag">CELESTIAL BODY</div>
  <h3 id="iName">—</h3>
  <div class="en" id="iEn">—</div>
  <dl id="iData"></dl>
  <div class="fact" id="iFact"></div>
</div>

<div id="tooltip"></div>

<div id="labels"></div>

<div id="hint">
  <div>拖拽 <b>旋转</b> · 滚轮 <b>缩放</b> · 点击行星 <b>聚焦</b></div>
  <div style="margin-top:4px"><kbd>1</kbd>–<kbd>8</kbd> 切换 · <kbd>Space</kbd> 暂停 · <kbd>R</kbd> 重置 · <kbd>+</kbd><kbd>-</kbd> 调速</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   基础场景
============================================================ */
const app = document.getElementById('app');
const W = () => window.innerWidth, H = () => window.innerHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x01020a);

const camera = new THREE.PerspectiveCamera(55, W()/H(), 0.1, 6000);
camera.position.set(0, 70, 200);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(W(), H());
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 1400;

/* ============================================================
   后处理：辉光
============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W(), H()), 1.15, 0.85, 0.08);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const bloomLayer = bloom;

/* ============================================================
   工具：噪声 & 过程化纹理
============================================================ */
// 简易值噪声（用于 canvas 纹理）
function makeRand(seed){
  let s = seed >>> 0;
  return () => {
    s = (s*1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
function smoothNoise2D(w, h, scale, seed){
  const rand = makeRand(seed);
  const gw = Math.ceil(w/scale)+2, gh = Math.ceil(h/scale)+2;
  const grid = new Float32Array(gw*gh);
  for(let i=0;i<grid.length;i++) grid[i] = rand();
  const buf = new Float32Array(w*h);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const gx = x/scale, gy = y/scale;
      const x0=Math.floor(gx), y0=Math.floor(gy);
      const tx = gx-x0, ty = gy-y0;
      const sx = tx*tx*(3-2*tx), sy = ty*ty*(3-2*ty);
      const a=grid[y0*gw+x0], b=grid[y0*gw+x0+1];
      const c=grid[(y0+1)*gw+x0], d=grid[(y0+1)*gw+x0+1];
      const ab = a+(b-a)*sx, cd=c+(d-c)*sx;
      buf[y*w+x] = ab+(cd-ab)*sy;
    }
  }
  return buf;
}
function fbmCanvas(w,h,octaves,baseScale,seed){
  const out = new Float32Array(w*h);
  let amp=1, sum=0, scale=baseScale;
  for(let o=0;o<octaves;o++){
    const n = smoothNoise2D(w,h,scale,seed+o*97);
    for(let i=0;i<out.length;i++) out[i]+=n[i]*amp;
    sum+=amp; amp*=0.5; scale*=0.5;
  }
  for(let i=0;i<out.length;i++) out[i]/=sum;
  return out;
}

function newCanvas(w,h){
  const c = document.createElement('canvas');
  c.width=w; c.height=h;
  return { c, ctx:c.getContext('2d') };
}

// 通用：把 fbm 上色
function applyPalette(ctx,w,h,data,stops){
  const img = ctx.createImageData(w,h);
  for(let i=0;i<w*h;i++){
    const v = data[i];
    // 找到 v 在 stops 中的颜色
    let lo=0, hi=stops.length-1;
    for(let k=0;k<stops.length;k++){ if(stops[k][0]<=v) lo=k; }
    hi = Math.min(lo+1, stops.length-1);
    const a = stops[lo], b = stops[hi];
    const t = (v-a[0])/((b[0]-a[0])||1);
    const r = a[1]+(b[1]-a[1])*t;
    const g = a[2]+(b[2]-a[2])*t;
    const bl= a[3]+(b[3]-a[3])*t;
    img.data[i*4]=r; img.data[i*4+1]=g; img.data[i*4+2]=bl; img.data[i*4+3]=255;
  }
  ctx.putImageData(img,0,0);
}

/* —— 各行星纹理生成 —— */
function texMercury(){
  const w=1024,h=512, {c,ctx}=newCanvas(w,h);
  const data = fbmCanvas(w,h,6,180,11);
  applyPalette(ctx,w,h,data,[
    [0, 60,56,52],[0.45,92,86,80],[0.6,130,120,110],[0.78,170,158,145],[1,205,192,178]
  ]);
  // 撒陨石坑
  const rand=makeRand(7);
  for(let i=0;i<260;i++){
    const x=rand()*w, y=rand()*h, r=rand()*22+3;
    const g=ctx.createRadialGradient(x,y,1,x,y,r);
    g.addColorStop(0,'rgba(20,18,16,0.55)');
    g.addColorStop(0.6,'rgba(40,36,32,0.25)');
    g.addColorStop(1,'rgba(255,240,220,0.12)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function texVenus(){
  const w=1024,h=512,{c,ctx}=newCanvas(w,h);
  const data=fbmCanvas(w,h,6,140,23);
  // 横向拉伸做成云带
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const v=data[y*w+x]; data[y*w+x]= v*0.6 + data[y*w+Math.floor((x*0.5+w*0.25)%w)]*0.4;
  }
  applyPalette(ctx,w,h,data,[
    [0,150,110,60],[0.4,210,170,100],[0.6,238,210,150],[0.8,250,232,185],[1,255,248,220]
  ]);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function texEarth(){
  const w=1024,h=512,{c,ctx}=newCanvas(w,h);
  const land=fbmCanvas(w,h,7,150,41);
  const detail=fbmCanvas(w,h,4,60,88);
  const img=ctx.createImageData(w,h);
  for(let i=0;i<w*h;i++){
    const v=land[i], d=detail[i];
    const lat = Math.abs((i/w - h/2/w) ); // 0..1 极地权重近似
    const polar = Math.pow(Math.abs((Math.floor(i/w)/(h/2))-1),3);
    let r,g,b;
    if(v<0.48){ // 海洋
      const od=(0.48-v)/0.48;
      r=10+od*8; g=40+od*30; b=95+od*70;
    } else if(v<0.52){ // 海岸沙滩
      r=200; g=190; b=140;
    } else { // 陆地
      const lv=(v-0.52)/0.48;
      if(lv<0.3 && d>0.55){ r=90+lv*60; g=110+lv*40; b=55; }       // 草原
      else if(lv<0.65){ r=55+lv*60; g=95+lv*40; b=45+lv*10; }        // 森林
      else if(lv<0.85){ r=140+lv*40; g=120+lv*30; b=80; }           // 沙漠/裸地
      else { r=200; g=200; b=200; }                                  // 雪山
    }
    // 极地冰盖
    if(polar>0.6){ const k=Math.min(1,(polar-0.6)/0.4); r=r*(1-k)+245*k; g=g*(1-k)+250*k; b=b*(1-k)+255*k; }
    img.data[i*4]=r; img.data[i*4+1]=g; img.data[i*4+2]=b; img.data[i*4+3]=255;
  }
  ctx.putImageData(img,0,0);
  // 云层
  const cloud=fbmCanvas(w,h,5,90,71);
  ctx.globalAlpha=0.5;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const cv=cloud[y*w+x];
    if(cv>0.55){ const k=(cv-0.55)/0.45; ctx.fillStyle=`rgba(255,255,255,${k*0.7})`;
      ctx.fillRect(x,y,1,1); }
  }
  ctx.globalAlpha=1;
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function texMars(){
  const w=1024,h=512,{c,ctx}=newCanvas(w,h);
  const data=fbmCanvas(w,h,6,150,5);
  const detail=fbmCanvas(w,h,4,55,61);
  const img=ctx.createImageData(w,h);
  for(let i=0;i<w*h;i++){
    const v=data[i], d=detail[i];
    const yy=Math.floor(i/w);
    const polar=Math.pow(Math.abs((yy/(h/2))-1),3);
    let r,g,b;
    if(v<0.4){ r=120+v*60; g=55+v*30; b=35+v*15; }
    else if(v<0.7){ r=180+v*40; g=95+v*35; b=55+v*15; }
    else { r=210+v*30; g=140+v*30; b=85+v*10; }
    if(d>0.62){ r*=0.8; g*=0.78; b*=0.75; } // 暗区
    if(polar>0.7){ const k=Math.min(1,(polar-0.7)/0.3); r=r*(1-k)+245*k; g=g*(1-k)+240*k; b=b*(1-k)+235*k; }
    img.data[i*4]=r; img.data[i*4+1]=g; img.data[i*4+2]=b; img.data[i*4+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function texGasGiant(seed, stops, bandScale){
  const w=1024,h=512,{c,ctx}=newCanvas(w,h);
  const data=fbmCanvas(w,h,6,bandScale,seed);     // 大尺度横向带
  const turb=fbmCanvas(w,h,5,70,seed+5);          // 湍流扰动
  const img=ctx.createImageData(w,h);
  for(let i=0;i<w*h;i++){
    const v=data[i], tu=turb[i];
    // 用大尺度噪声当“纬度带”指标 + 湍流微扰
    const cv=Math.min(0.999,Math.max(0,v*0.8+tu*0.25));
    const s=stops;
    let lo=0; for(let k=0;k<s.length;k++) if(s[k][0]<=cv) lo=k;
    const hi=Math.min(lo+1,s.length-1);
    const a=s[lo],b=s[hi]; const t=(cv-a[0])/((b[0]-a[0])||1);
    img.data[i*4]=a[1]+(b[1]-a[1])*t;
    img.data[i*4+1]=a[2]+(b[2]-a[2])*t;
    img.data[i*4+2]=a[3]+(b[3]-a[3])*t;
    img.data[i*4+3]=255;
  }
  ctx.putImageData(img,0,0);
  // 大红斑/风暴
  const rand=makeRand(seed+9);
  for(let i=0;i<6;i++){
    const x=rand()*w, y=h*(0.3+rand()*0.4), rx=rand()*80+40, ry=rx*(0.25+rand()*0.2);
    const g=ctx.createRadialGradient(x,y,1,x,y,rx);
    g.addColorStop(0,'rgba(180,70,40,0.5)'); g.addColorStop(1,'rgba(180,70,40,0)');
    ctx.save(); ctx.translate(x,y); ctx.scale(1,ry/rx); ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(0,0,rx,0,7); ctx.fill(); ctx.restore();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}

/* ============================================================
   太阳（ShaderMaterial 表面 + 日珥 + 多层辉光）
============================================================ */
const sunRadius = 12;
const sunVS = `
  varying vec3 vPos;
  void main(){ vPos = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `;
const sunFS = `
  varying vec3 vPos;
  uniform float uTime;
  uniform float uBoost;   // 关闭辉光时降低自发光，避免发白
  // 经典 hash 噪声
  float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
  float noise(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
  float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<6;i++){ v+=a*noise(p); p=p*2.02; a*=0.5;} return v;}
  void main(){
    vec3 p = normalize(vPos)*3.0;
    float n1 = fbm(p + vec3(uTime*0.06));
    float n2 = fbm(p*2.5 + vec3(uTime*0.12) + n1);
    vec3 cDark = vec3(0.95,0.18,0.02);
    vec3 cMid  = vec3(1.0,0.45,0.06);
    vec3 cHot  = vec3(1.0,0.9,0.45);
    vec3 col = mix(cDark, cMid, n1);
    col = mix(col, cHot, smoothstep(0.4,0.95,n2));
    // 细密颗粒（granulation）
    float gran = fbm(p*6.0 + uTime*0.2);
    col += vec3(1.0,0.8,0.4)*pow(gran,3.0)*1.4;
    col *= uBoost;
    gl_FragColor = vec4(col,1.0);
  }`;
const sunMat = new THREE.ShaderMaterial({
  vertexShader:sunVS, fragmentShader:sunFS,
  uniforms:{ uTime:{ value:0 }, uBoost:{ value:1.5 } }
});
const sun = new THREE.Mesh(new THREE.SphereGeometry(sunRadius,64,64), sunMat);
sun.name='太阳';

// 日珥（prominence）：贴在太阳边缘的几簇火焰状等离子体
function makeProminence(){
  const segments = 8;
  const group = new THREE.Group();
  const coronaMat = new THREE.ShaderMaterial({
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide,
    uniforms:{ uTime:{ value:0 } },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying vec2 vUv; uniform float uTime;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      void main(){
        float arc = sin(vUv.x*3.14159);
        float flame = sin(vUv.x*18.0 + uTime*2.0)*0.5+0.5;
        float fall = pow(1.0-vUv.y, 1.6);
        float a = arc*fall*(0.5+flame*0.6);
        vec3 col = mix(vec3(1.0,0.35,0.05), vec3(1.0,0.85,0.5), vUv.y);
        gl_FragColor = vec4(col, a*0.9);
      }`
  });
  const rand = makeRand(31);
  for(let i=0;i<segments;i++){
    const w = sunRadius*0.9 + rand()*0.6*sunRadius;
    const geo = new THREE.PlaneGeometry(w, w*0.7, 16, 8);
    const m = new THREE.Mesh(geo, coronaMat);
    // 让平面始终面向中心并环绕分布
    const ang = (i/segments)*Math.PI*2;
    m.position.set(Math.cos(ang)*sunRadius*0.96, 0, Math.sin(ang)*sunRadius*0.96);
    m.lookAt(0,0,0);
    m.rotation.z += (rand()-0.5)*0.5;
    // 围绕太阳自转：放入枢轴
    group.add(m);
  }
  group.userData.mat = coronaMat;
  return group;
}

// 自转显示基准：地球转一圈 ~3.5 秒（视觉），其余按真实周期比例
const SPIN_BASE = 3.5; // 秒/地球自转
const ORBIT_BASE = 18; // 地球公转一圈所需秒数（速度=1时）

PLANETS.forEach((p, idx)=>{
  // 轨道枢轴
  const pivot = new THREE.Object3D();
  planetGroup.add(pivot);
  pivot.rotation.y = Math.random()*Math.PI*2; // 随机起始相位

  // 持有者：定位到轨道距离
  const holder = new THREE.Object3D();
  holder.position.x = p.dist;
  pivot.add(holder);

  // 倾斜组
  const tilt = new THREE.Object3D();
  tilt.rotation.z = THREE.MathUtils.degToRad(p.tilt);
  holder.add(tilt);

  // 行星本体
  const mat = new THREE.MeshStandardMaterial({
    map: p.tex(),
    roughness: 0.85, metalness: 0.0
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.radius, 64, 48), mat);
  mesh.name = p.name;
  tilt.add(mesh);
  pickables.push(mesh);

  // 大气层（菲涅尔辉光 + 朝向太阳的终结线高光）
  if(p.atmo){
    const atmoMat = new THREE.ShaderMaterial({
      transparent:true, blending:THREE.AdditiveBlending, side:THREE.BackSide, depthWrite:false,
      uniforms:{
        uColor:{ value:new THREE.Color(p.atmo) },
        uSunDir:{ value:new THREE.Vector3(1,0,0) }
      },
      vertexShader:`
        varying vec3 vN; varying vec3 vWorld;
        void main(){ vN=normalize(normalMatrix*normal);
          vec4 wp = modelMatrix*vec4(position,1.0); vWorld = wp.xyz;
          gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
      fragmentShader:`
        varying vec3 vN; varying vec3 vWorld; uniform vec3 uColor; uniform vec3 uSunDir;
        void main(){
          float fres = pow(1.0-abs(vN.z), 3.0);
          // 大气朝太阳的一侧更强
          vec3 dir = normalize(vWorld);
          float lit = max(0.0, dot(dir, normalize(uSunDir)));
          float day = pow(lit, 0.7);
          vec3 col = uColor*(0.4 + day*1.1);
          gl_FragColor = vec4(col, fres*0.95*(0.35+day*0.8));
        }`
    });
    const atmo = new THREE.Mesh(new THREE.SphereGeometry(p.radius*1.08, 48, 32), atmoMat);

    const ringGeo = new THREE.RingGeometry(p.radius*1.4, p.radius*2.6, 128, 1);

    const pos = ringGeo.attributes.position, uv = ringGeo.attributes.uv;
    const v3 = new THREE.Vector3();
    for(let i=0;i<pos.count;i++){
      v3.fromBufferAttribute(pos,i);
      const r = (v3.length()-p.radius*1.4)/(p.radius*2.6-p.radius*1.4);
      uv.setXY(i, r, 0.5);

  let moonPivot=null, moonMesh=null;

  // 自转方向 & 速度（地球为基准，按真实周期比例）
  const spinDir = p.day<0 ? -1 : 1;

  const orbitSpeed = ORBIT_BASE * p.period;

  p._obj = { pivot, holder, tilt, mesh, moonPivot, spinDir, spinSpeed, orbitSpeed };

  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  const mat = new THREE.PointsMaterial({ size:0.32, vertexColors:true, transparent:true, opacity:0.85, depthWrite:false });
  beltGroup.add(new THREE.Points(geo, mat));
}

/* ============================================================
   星空 + 银河带
============================================================ */
function makeStars(){
  const N = 9000;
  const geo = new THREE.BufferGeometry();
  const pos=new Float32Array(N*3), col=new Float32Array(N*3), siz=new Float32Array(N);
  const rand=makeRand(7);
  for(let i=0;i<N;i++){
    // 球面分布，偏向一条银河带
    let theta=rand()*Math.PI*2;
    let phi;
    if(rand()<0.35){ phi = Math.PI/2 + (rand()-0.5)*0.5; } // 银河带集中
    else { phi = Math.acos(2*rand()-1); }
    const R = 2500 + rand()*600;
    pos[i*3]=R*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1]=R*Math.cos(phi);
    pos[i*3+2]=R*Math.sin(phi)*Math.sin(theta);
    // 星色：白/蓝白/黄白/橙
    const t=rand(); let r,g,b;
    if(t<0.55){ r=1; g=1; b=1; }
    else if(t<0.75){ r=0.7; g=0.8; b=1; }
    else if(t<0.9){ r=1; g=0.95; b=0.8; }
    else { r=1; g=0.75; b=0.6; }
    const bright = 0.4 + rand()*0.6;
    col[i*3]=r*bright; col[i*3+1]=g*bright; col[i*3+2]=b*bright;
    siz[i] = rand()<0.04 ? rand()*3+2 : rand()*1.4+0.4;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(siz,1));
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uPx:{ value:renderer.getPixelRatio() } },
    vertexShader:`
      attribute float aSize; varying vec3 vC; uniform float uPx;
      void main(){ vC=color; vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize = aSize*uPx*(300.0/-mv.z); gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vC;
      void main(){ vec2 c=gl_PointCoord-0.5; float d=length(c);
        float a=smoothstep(0.5,0.0,d); gl_FragColor=vec4(vC,a);} `,
    vertexColors:true
  });
  return new THREE.Points(geo, mat);
}
const stars = makeStars(); scene.add(stars);

// 远景星云片（柔和色斑）
function nebula(){
  const {c,ctx}=newCanvas(512,512);
  const rand=makeRand(5);
  ctx.fillStyle='rgba(0,0,0,0)'; ctx.fillRect(0,0,512,512);
  for(let i=0;i<40;i++){
    const x=rand()*512,y=rand()*512,r=rand()*120+40;
    const hue=[200,260,300,20][Math.floor(rand()*4)];
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`hsla(${hue},80%,60%,${rand()*0.18+0.05})`);
    g.addColorStop(1,'hsla(0,0%,0%,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  const tex=new THREE.CanvasTexture(c);
  const mat=new THREE.MeshBasicMaterial({ map:tex, side:THREE.BackSide, transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.5 });
  const sphere=new THREE.Mesh(new THREE.SphereGeometry(2400,32,32), mat);
  return sphere;
}
scene.add(nebula());

/* ============================================================
   交互：点击聚焦
============================================================ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let focusTarget = null;        // 要聚焦的 Object3D
let camAnim = null;            // {from,to,t,dur}

renderer.domElement.addEventListener('pointerdown', e=>{ dragStart={x:e.clientX,y:e.clientY}; });
let dragStart=null;
renderer.domElement.addEventListener('pointerup', e=>{
  if(!dragStart) return;
  const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
  if(Math.hypot(dx,dy)>5) return; // 拖动则不触发点击
  mouse.x=(e.clientX/W())*2-1; mouse.y=-(e.clientY/H())*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if(hits.length){
    const mesh = hits[0].object;
    const p = PLANETS.find(pp=>pp._obj.mesh===mesh);
    if(p){ focusOn(p); showInfo(p); }
  }
});

function focusOn(p){
  focusTarget = p._obj.holder;
  // 计算理想相机位置：行星朝向太阳的反方向偏上
  const wp = new THREE.Vector3(); p._obj.mesh.getWorldPosition(wp);
  const dir = wp.clone().normalize();
  const dist = p.radius*6 + 6;
  const target = wp.clone().add(dir.multiplyScalar(dist)).add(new THREE.Vector3(0, p.radius*2+2, 0));
  camAnim = { from: camera.position.clone(), to: target, fromT: controls.target.clone(), toT: wp.clone(), t:0, dur:1.4 };
}

function showInfo(p){
  const box=document.getElementById('info');
  document.getElementById('iName').textContent=p.name;
  document.getElementById('iEn').textContent=p.en;
  document.getElementById('iTag').textContent='CELESTIAL BODY · 天体档案';
  const dl=document.getElementById('iData'); dl.innerHTML='';
  for(const k in p.data){
    const dt=document.createElement('dt'); dt.textContent=k;
    const dd=document.createElement('dd'); dd.textContent=p.data[k];
    dl.appendChild(dt); dl.appendChild(dd);
  }
  document.getElementById('iFact').textContent=p.fact;
  box.classList.add('show');
}

/* ============================================================
   UI 绑定
============================================================ */
const ui = {
  speed: document.getElementById('speed'),
  speedVal: document.getElementById('speedVal'),
  tgOrbit: document.getElementById('tgOrbit'),
  tgLabel: document.getElementById('tgLabel'),
  tgBelt: document.getElementById('tgBelt'),
  tgGlow: document.getElementById('tgGlow'),
  reset: document.getElementById('resetView'),
};
let timeScale = 1;
ui.speed.addEventListener('input', e=>{ timeScale=parseFloat(e.target.value); ui.speedVal.textContent=timeScale.toFixed(1)+'×'; });
ui.tgOrbit.addEventListener('change', e=>{ orbitLines.forEach(l=>l.visible=e.target.checked); });
ui.tgLabel.addEventListener('change', e=>{ labelsLayer.style.display = e.target.checked?'block':'none'; });
ui.tgBelt.addEventListener('change', e=>{ beltGroup.visible=e.target.checked; });
ui.tgGlow.addEventListener('change', e=>{ bloom.enabled=e.target.checked; sun.visible=true; });
ui.reset.addEventListener('click', ()=>{
  focusTarget=null; camAnim={ from:camera.position.clone(),
    to:new THREE.Vector3(0,70,200), fromT:controls.target.clone(),
    toT:new THREE.Vector3(0,0,0), t:0, dur:1.4 };
  document.getElementById('info').classList.remove('show');
});

/* ============================================================
   主循环
============================================================ */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const scaled = dt * timeScale;
  const t = clock.elapsedTime;

  // 太阳
  sunMat.uniforms.uTime.value = t;
  sun.rotation.y += scaled * 0.05;

  // 行星
  PLANETS.forEach(p=>{
    const o=p._obj;
    o.pivot.rotation.y += (Math.PI*2 / o.orbitSpeed) * scaled;
    o.mesh.rotation.y += (Math.PI*2 / o.spinSpeed) * scaled * o.spinDir;
    if(o.moonPivot) o.moonPivot.rotation.y += scaled * 0.9;
  });

  // 小行星带缓慢自转
  beltGroup.rotation.y += scaled * 0.02;
  // 星空缓慢自转（增加沉浸感）
  stars.rotation.y += dt * 0.003;

  // 相机动画
  if(camAnim){
    camAnim.t += dt/camAnim.dur;
    const k = camAnim.t>1?1:camAnim.t;
    const e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2; // easeInOut
    camera.position.lerpVectors(camAnim.from, camAnim.to, e);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
    if(k>=1) camAnim=null;
  } else if(focusTarget){
    // 持续跟随移动中的行星
    focusTarget.getWorldPosition(tmpV);
    controls.target.lerp(tmpV, 0.08);
  }

  controls.update();

  // 更新标签位置
  const showLabel = ui.tgLabel.checked;
  labels.forEach(L=>{
    L.obj.getWorldPosition(tmpV);
    tmpV.project(camera);
    const inFront = tmpV.z<1;
    if(showLabel && inFront){
      L.el.style.display='block';
      L.el.style.left = (tmpV.x*0.5+0.5)*W()+'px';
      L.el.style.top = (-tmpV.y*0.5+0.5)*H()+'px';
      const dist = camera.position.distanceTo(L.obj.getWorldPosition(new THREE.Vector3()));
      L.el.style.opacity = Math.max(0.2, Math.min(1, 400/dist));
    } else L.el.style.display='none';
  });

  composer.render();
}

window.addEventListener('resize', ()=>{
  camera.aspect=W()/H(); camera.updateProjectionMatrix();
  renderer.setSize(W(),H()); composer.setSize(W(),H());
});

// 隐藏 loading 并启动
window.addEventListener('load', ()=>{
  setTimeout(()=>document.getElementById('loading').classList.add('hide'), 300);
});
animate();
</script>
