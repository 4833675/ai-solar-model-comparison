<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>太阳系实时运动模型</title>
<style>
:root{
  --bg:rgba(8,10,16,.55);--bd:rgba(210,220,255,.12);--tx:#d7deee;--dim:#8b95ad;--acc:#9ec5ff;
  --mono:"SF Mono","Menlo","Consolas","Liberation Mono",monospace;
  --sans:"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--tx);font-family:var(--sans);user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui.hid .panel,#ui.hid #hud-bottom,#ui.hid #toggles,#ui.hid #note{opacity:0;visibility:hidden}
.panel{
  pointer-events:auto;position:absolute;top:18px;width:272px;max-height:calc(100% - 118px);
  background:var(--bg);border:1px solid var(--bd);border-radius:14px;
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);
  overflow:auto;padding:14px 12px 12px;
}
#list{left:16px}
#info{right:16px;width:318px}
.ptitle{font-size:11px;letter-spacing:.22em;color:var(--dim);margin:0 6px 10px;text-transform:uppercase}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:#c9d2e6}
.item:hover{background:rgba(255,255,255,.05)}
.item.on{background:rgba(140,180,255,.14);color:#fff}
.item .dot{width:7px;height:7px;border-radius:50%;flex:none}
.item.moon{padding-left:26px;font-size:12px;color:#9aa6c0}
.item.moon .dot{width:5px;height:5px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:3px 8px;font-size:12px;margin-top:8px}
.kv b{color:var(--dim);font-weight:500}
.kv span{font-family:var(--mono);font-variant-numeric:tabular-nums;color:#e8eefc;font-size:11.5px}
.hname{font-size:20px;letter-spacing:.08em;font-weight:560;margin:2px 4px 2px}
.hsub{font-size:11px;color:var(--dim);margin:0 4px 8px;letter-spacing:.12em}
.blurb{font-size:12px;line-height:1.65;color:#b7c0d4;margin:10px 4px 0}
.warn{margin:10px 4px 0;padding:7px 8px;border-radius:8px;background:rgba(180,90,40,.18);border:1px solid rgba(255,170,90,.22);color:#ffd2a8;font-size:11px;line-height:1.5}
.note-static{margin:10px 4px 0;font-size:10.5px;line-height:1.55;color:#7f89a0}
#hud-bottom{
  pointer-events:auto;position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:16px;
  background:var(--bg);border:1px solid var(--bd);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);white-space:nowrap;
}
button.tb{
  background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--tx);
  border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;letter-spacing:.08em;
}
button.tb:hover{background:rgba(255,255,255,.12)}
#clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;min-width:168px;text-align:center}
#spdlab{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--acc);min-width:92px}
input[type=range]{width:140px;accent-color:#8ab4ff}
#toggles{
  pointer-events:auto;position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:5px;
  padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--bd);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
#toggles label{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#c5cde0;cursor:pointer;letter-spacing:.04em}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1}
.lab{
  position:absolute;transform:translate(-50%,-140%);font-size:10px;letter-spacing:.16em;
  color:rgba(230,236,255,.78);text-shadow:0 1px 6px #000;white-space:nowrap;font-weight:500;
}
#note{position:absolute;left:16px;bottom:16px;font-size:10px;color:#667089;letter-spacing:.08em;max-width:280px;line-height:1.5}
#err{position:fixed;inset:20% 10%;color:#f8c;font-family:var(--mono);font-size:12px;white-space:pre-wrap;z-index:9;display:none}
@media(max-width:860px){
  #list{width:196px}#info{display:none}#hud-bottom{left:12px;right:12px;transform:none;flex-wrap:wrap;justify-content:center}
}
</style>
</head>

<canvas id="c"></canvas>
<div id="labels"></div>
<div id="ui">
  <div class="panel" id="list"><div class="ptitle">天体</div></div>
  <div class="panel" id="info"></div>
  <div id="hud-bottom">
    <button class="tb" id="btnPlay">暂停</button>
    <div id="clock">—</div>
    <button class="tb" id="btnNow">此刻</button>
    <input type="range" id="spd" min="-100" max="100" value="42"/>
    <div id="spdlab">—</div>
  </div>
  <div id="toggles">
    <label><input type="checkbox" id="tgOrb" checked/> 轨道</label>
    <label><input type="checkbox" id="tgName" checked/> 名称</label>
    <label><input type="checkbox" id="tgMoon" checked/> 卫星</label>
    <label><input type="checkbox" id="tgAst" checked/> 小行星带</label>
    <label><input type="checkbox" id="tgCom" checked/> 彗星</label>
    <label><input type="checkbox" id="tgReal"/> 真实距离比例</label>
    <label><input type="checkbox" id="tgBloom" checked/> 辉光</label>
  </div>
  <div id="note">距离已径向幂律压缩，角位置与轨道相位保持精确 · 空格暂停 · H 隐藏界面</div>
</div>
<div id="err"></div>
<script>
"use strict";
const DEG=Math.PI/180, RAD=180/Math.PI, TAU=Math.PI*2;
const J2000=2451545.0, AU_KM=149597870.7;
const SCALE0=34, COMP0=0.62;
function clamp(x,a,b){return x<a?a:x>b?b:x}
function lerp(a,b,t){return a+(b-a)*t}
function sat(x){return clamp(x,0,1)}
function wrpPi(a){a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI}
function wrp360(a){a%=360;if(a<0)a+=360;return a}
function sstep(a,b,x){const t=sat((x-a)/(b-a));return t*t*(3-2*t)}

/* ---------- vec / mat ---------- */
const V3={
  c(x,y,z){return new Float32Array([x,y,z])},
  cl(a){return new Float32Array(a)},
  set(o,x,y,z){o[0]=x;o[1]=y;o[2]=z;return o},
  add(a,b,o){o[0]=a[0]+b[0];o[1]=a[1]+b[1];o[2]=a[2]+b[2];return o},
  sub(a,b,o){o[0]=a[0]-b[0];o[1]=a[1]-b[1];o[2]=a[2]-b[2];return o},
  sc(a,s,o){o[0]=a[0]*s;o[1]=a[1]*s;o[2]=a[2]*s;return o},
  dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]},
  crs(a,b,o){const x=a[1]*b[2]-a[2]*b[1],y=a[2]*b[0]-a[0]*b[2],z=a[0]*b[1]-a[1]*b[0];o[0]=x;o[1]=y;o[2]=z;return o},
  len(a){return Math.hypot(a[0],a[1],a[2])},
  nrm(a,o){const l=Math.hypot(a[0],a[1],a[2])||1;o[0]=a[0]/l;o[1]=a[1]/l;o[2]=a[2]/l;return o},
  lerp(a,b,t,o){o[0]=a[0]+(b[0]-a[0])*t;o[1]=a[1]+(b[1]-a[1])*t;o[2]=a[2]+(b[2]-a[2])*t;return o}
};
function m4(){return new Float32Array(16)}
function mId(o){const m=o||m4();m.fill(0);m[0]=m[5]=m[10]=m[15]=1;return m}
function mCopy(a,o){o.set(a);return o}
function mMul(a,b,o){
  const r=o||m4();
  for(let c=0;c<4;c++){
    const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    r[c*4]  =a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;
    r[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
    r[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;
    r[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;
  }
  return r;
}
function mPersp(fovy,asp,n,f,o){
  const m=o||m4(),t=1/Math.tan(fovy*0.5),nf=1/(n-f);
  m.fill(0);m[0]=t/asp;m[5]=t;m[10]=(f+n)*nf;m[11]=-1;m[14]=2*f*n*nf;return m;
}
function mLook(eye,tgt,up,o){
  const m=o||m4();
  const zx=eye[0]-tgt[0],zy=eye[1]-tgt[1],zz=eye[2]-tgt[2];
  let zl=Math.hypot(zx,zy,zz)||1;const z0=zx/zl,z1=zy/zl,z2=zz/zl;
  let xx=up[1]*z2-up[2]*z1,xy=up[2]*z0-up[0]*z2,xz=up[0]*z1-up[1]*z0;
  let xl=Math.hypot(xx,xy,xz)||1;xx/=xl;xy/=xl;xz/=xl;
  const y0=z1*xz-z2*xy,y1=z2*xx-z0*xz,y2=z0*xy-z1*xx;
  m[0]=xx;m[1]=y0;m[2]=z0;m[3]=0;
  m[4]=xy;m[5]=y1;m[6]=z1;m[7]=0;
  m[8]=xz;m[9]=y2;m[10]=z2;m[11]=0;
  m[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  m[13]=-(y0*eye[0]+y1*eye[1]+y2*eye[2]);
  m[14]=-(z0*eye[0]+z1*eye[1]+z2*eye[2]);
  m[15]=1;return m;
}
function mInv(a,o){
  const m=o||m4();
  const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7];
  const a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10;
  const b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12;
  const b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30;
  const b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if(!det)return mId(m);det=1/det;
  m[0]=(a11*b11-a12*b10+a13*b09)*det;m[1]=(a02*b10-a01*b11-a03*b09)*det;
  m[2]=(a31*b05-a32*b04+a33*b03)*det;m[3]=(a22*b04-a21*b05-a23*b03)*det;
  m[4]=(a12*b08-a10*b11-a13*b07)*det;m[5]=(a00*b11-a02*b08+a03*b07)*det;
  m[6]=(a32*b02-a30*b05-a33*b01)*det;m[7]=(a20*b05-a22*b02+a23*b01)*det;
  m[8]=(a10*b10-a11*b08+a13*b06)*det;m[9]=(a01*b08-a00*b10-a03*b06)*det;
  m[10]=(a30*b04-a31*b02+a33*b00)*det;m[11]=(a21*b02-a20*b04-a23*b00)*det;
  m[12]=(a11*b07-a10*b09-a12*b06)*det;m[13]=(a00*b09-a01*b07+a02*b06)*det;
  m[14]=(a31*b01-a30*b03-a32*b00)*det;m[15]=(a20*b03-a21*b01+a22*b00)*det;
  return m;
}
function mTRSB(tx,ty,tz, bx, axis, phase, s, o){
  const y=axis;
  const tmp=Math.abs(y[1])<0.9? [0,1,0]:[1,0,0];
  const x=[tmp[1]*y[2]-tmp[2]*y[1], tmp[2]*y[0]-tmp[0]*y[2], tmp[0]*y[1]-tmp[1]*y[0]];
  let xl=Math.hypot(x[0],x[1],x[2])||1;x[0]/=xl;x[1]/=xl;x[2]/=xl;
  const z=[x[1]*y[2]-x[2]*y[1], x[2]*y[0]-x[0]*y[2], x[0]*y[1]-x[1]*y[0]];
  const c=Math.cos(phase),si=Math.sin(phase);
  const r00=c*x[0]+si*z[0], r01=y[0], r02=-si*x[0]+c*z[0];
  const r10=c*x[1]+si*z[1], r11=y[1], r12=-si*x[1]+c*z[1];
  const r20=c*x[2]+si*z[2], r21=y[2], r22=-si*x[2]+c*z[2];
  const m=o||m4();
  m[0]=r00*s;m[1]=r10*s;m[2]=r20*s;m[3]=0;
  m[4]=r01*s;m[5]=r11*s;m[6]=r21*s;m[7]=0;
  m[8]=r02*s;m[9]=r12*s;m[10]=r22*s;m[11]=0;
  m[12]=tx;m[13]=ty;m[14]=tz;m[15]=1;
  if(bx){bx[0]=x[0];bx[1]=x[1];bx[2]=x[2];bx[3]=y[0];bx[4]=y[1];bx[5]=y[2];bx[6]=z[0];bx[7]=z[1];bx[8]=z[2];}
  return m;
}
function mBasis(tx,ty,tz,axis,s,o){
  return mTRSB(tx,ty,tz,null,axis,0,s,o);
}

/* ---------- time / kepler ---------- */
function unixToJD(ms){return ms/86400000+2440587.5}
function jdToT(jd){return (jd-J2000)/36525}
function keplerE(M,e){
  M=wrpPi(M);
  let E=M+e*Math.sin(M)*(1+e*Math.cos(M));
  for(let i=0;i<10;i++){
    const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
    E-=d; if(Math.abs(d)<1e-13)break;
  }
  return E;
}
function elmToEcl(a,e,I,L,vp,Om){
  const w=(vp-Om)*DEG, inc=I*DEG, M=wrpPi((L-vp)*DEG);
  const E=keplerE(M,e), ce=Math.cos(E), se=Math.sin(E);
  const xp=a*(ce-e), yp=a*Math.sqrt(Math.max(0,1-e*e))*se;
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(Om*DEG),sO=Math.sin(Om*DEG),ci=Math.cos(inc),si=Math.sin(inc);
  const x=(cw*cO-sw*sO*ci)*xp+(-sw*cO-cw*sO*ci)*yp;
  const y=(cw*sO+sw*cO*ci)*xp+(-sw*sO+cw*cO*ci)*yp;
  const z=(sw*si)*xp+(cw*si)*yp;
  return [x,y,z,M,E];
}
function eclToWorld(x,y,z,o){const t=o||V3.c(0,0,0);t[0]=x;t[1]=z;t[2]=-y;return t}
function worldToEcl(w){return [w[0],-w[2],w[1]]}
function compressR(r,S,C){return S*Math.pow(Math.max(r,1e-8),C)}
function dispRkm(km){return 0.72*Math.pow(km/6371,0.42)}

function makeSphere(segU,segV){
  const vs=[],id=[];
  for(let v=0;v<=segV;v++){
    const tv=v/segV,th=tv*Math.PI,st=Math.sin(th),ct=Math.cos(th);
    for(let u=0;u<=segU;u++){
      const tu=u/segU,ph=tu*TAU,cp=Math.cos(ph),sp=Math.sin(ph);
      const x=st*cp,y=ct,z=st*sp;
      vs.push(x,y,z,x,y,z,tu,1-tv);
    }
  }
  const stride=segU+1;
  for(let v=0;v<segV;v++){
    for(let u=0;u<segU;u++){
      const a=v*stride+u,b=a+stride;
      id.push(a,a+1,b, a+1,b+1,b);
    }
  }
  return {v:new Float32Array(vs),i:new Uint32Array(id),n:id.length};
}
function makeFSTri(){return new Float32Array([-1,-1, 3,-1, -1,3])}
function makeDisc(nA,nR,r0,r1){
  const vs=[],id=[];
  for(let j=0;j<=nR;j++){
    const t=j/nR,r=r0+(r1-r0)*t;
    for(let i=0;i<=nA;i++){
      const a=i/nA*TAU,c=Math.cos(a),s=Math.sin(a);
      vs.push(r*c,0,r*s, 0,1,0, r,a);
    }
  }
  const stride=nA+1;
  for(let j=0;j<nR;j++)for(let i=0;i<nA;i++){
    const a=j*stride+i,b=a+stride;
    id.push(a,b,a+1, a+1,b,b+1);
  }
  return {v:new Float32Array(vs),i:new Uint32Array(id),n:id.length};
}

const GLSL_NOISE=`
float sstep(float a,float b,float x){float t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
float hash13(vec3 p){p=fract(p*0.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
vec3 hash33(vec3 p){
  p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));
  return fract(sin(p)*43758.5453123);
}
float vnoise(vec3 p){
  vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  float n000=hash13(i);
  float n100=hash13(i+vec3(1,0,0));
  float n010=hash13(i+vec3(0,1,0));
  float n110=hash13(i+vec3(1,1,0));
  float n001=hash13(i+vec3(0,0,1));
  float n101=hash13(i+vec3(1,0,1));
  float n011=hash13(i+vec3(0,1,1));
  float n111=hash13(i+vec3(1,1,1));
  float nx00=mix(n000,n100,f.x),nx10=mix(n010,n110,f.x),nx01=mix(n001,n101,f.x),nx11=mix(n011,n111,f.x);
  return mix(mix(nx00,nx10,f.y),mix(nx01,nx11,f.y),f.z);
}
const mat3 FBM_R=mat3(0.00,0.80,0.60, -0.80,0.36,-0.48, -0.60,-0.48,0.64);
float fbm(vec3 p,int oct){
  float a=0.5,s=0.0;
  for(int i=0;i<8;i++){
    if(i>=oct)break;
    s+=a*vnoise(p);p=FBM_R*p*2.02;a*=0.5;
  }
  return s;
}
void worley(vec3 p,out float f1,out float f2,out float id){
  vec3 i=floor(p),f=fract(p);
  f1=8.0;f2=8.0;id=0.0;
  for(int z=-1;z<=1;z++)
  for(int y=-1;y<=1;y++)
  for(int x=-1;x<=1;x++){
    vec3 g=vec3(float(x),float(y),float(z));
    vec3 o=hash33(i+g);
    float d=length(g+o-f);
    float cid=hash13(i+g+19.7);
    if(d<f1){f2=f1;f1=d;id=cid;}
    else if(d<f2) f2=d;
  }
}
float craterH(vec3 p,float freq,float depth,out float alb){
  float f1,f2,id;worley(p*freq,f1,f2,id);
  float rad=0.13+0.22*fract(id*7.31);
  float t=f1/max(rad,1e-4);
  float bowl=t<1.0?-(1.0-t*t):0.0;
  float rim=exp(-((t-1.0)/0.26)*((t-1.0)/0.26));
  float exist=step(id,0.74)*sstep(0.60,0.40,f1);
  alb=(bowl*0.55+rim*0.32)*exist;
  return (bowl*0.90+rim*0.50)*depth*exist;
}
vec3 bumpN(vec3 N,vec3 wp,float h,float k){
  vec3 dpx=dFdx(wp),dpy=dFdy(wp);
  float dhx=dFdx(h),dhy=dFdy(h);
  vec3 r1=cross(dpy,N),r2=cross(N,dpx);
  float det=dot(dpx,r1);
  vec3 grad=(r1*dhx+r2*dhy)/max(det,1e-8);
  return normalize(N-k*grad);
}
`;

float saturnDensity(float r){
  float d=0.0;
  d+=0.11*sstep(1.235,1.250,r)*sstep(1.530,1.515,r);
  d+=1.20*sstep(1.525,1.540,r)*sstep(1.950,1.935,r);
  d+=0.58*sstep(2.025,2.040,r)*sstep(2.270,2.250,r);
  d*=mix(1.0,0.13,sstep(1.950,1.952,r)*sstep(2.030,2.028,r));
  d*=1.0-0.92*exp(-pow((r-2.214)/0.0045,2.0));
  d*=1.0-0.80*exp(-pow((r-2.265)/0.0018,2.0));
  d+=0.30*exp(-pow((r-2.324)/0.0055,2.0));
  d*=0.70+0.60*fbm(vec3(r*230.0,r*17.0,3.1),4);
  return max(d,0.0);
}
float uranusDensity(float r){
  float d=0.55*exp(-pow((r-1.951)/0.0055,2.0));
  d+=0.20*exp(-pow((r-1.909)/0.0022,2.0));
  d+=0.17*exp(-pow((r-1.863)/0.0020,2.0));
  d+=0.14*exp(-pow((r-1.823)/0.0019,2.0));
  d+=0.11*exp(-pow((r-1.786)/0.0018,2.0));
  d+=0.09*exp(-pow((r-1.751)/0.0017,2.0));
  d+=0.07*exp(-pow((r-1.690)/0.0020,2.0));
  return d;
}
float ringDens(float r){
  if(uRingKind<0.5)return saturnDensity(r);
  if(uRingKind<1.5)return uranusDensity(r);
  return 0.016*sstep(1.40,1.45,r)*sstep(1.81,1.76,r);
}
vec3 palSun(float t){
  t=clamp(t,0.0,1.0);
  vec3 c0=vec3(0.35,0.05,0.02);
  vec3 c1=vec3(0.95,0.32,0.04);
  vec3 c2=vec3(1.00,0.72,0.18);
  vec3 c3=vec3(1.00,0.92,0.62);
  vec3 c4=vec3(1.00,0.98,0.92);
  if(t<0.25)return mix(c0,c1,t/0.25);
  if(t<0.50)return mix(c1,c2,(t-0.25)/0.25);
  if(t<0.75)return mix(c2,c3,(t-0.50)/0.25);
  return mix(c3,c4,(t-0.75)/0.25);
}
void craters(vec3 p,float deep,out float h,out float a){
  float a1,a2,a3,a4;
  h =craterH(p,5.0,1.00*deep,a1);
  h+=craterH(p,12.0,0.52*deep,a2);
  h+=craterH(p,28.0,0.26*deep,a3);
  h+=craterH(p,62.0,0.13*deep,a4);
  a=a1+a2*0.7+a3*0.45+a4*0.25;
}
void surf(vec3 p,out vec3 alb,out vec3 emi,out float h,out float rough,out float metal){
  alb=vec3(0.3);emi=vec3(0.0);h=0.0;rough=0.85;metal=0.0;
  float lat=asin(clamp(p.y,-1.0,1.0));
  float lon=atan(p.z,p.x);
  if(uType==0){
    vec3 q=p+vec3(uTime*0.004,0.0,uTime*0.002);
    float f1,f2,id;
    worley(q*76.0,f1,f2,id);
    float cell1=clamp((f2-f1)*3.4,0.0,1.0);
    worley(q*31.0,f1,f2,id);
    float cell2=clamp((f2-f1)*2.6,0.0,1.0);
    float gran=0.55*cell1+0.45*cell2;
    float sg=fbm(q*6.5,5);
    sg=(sg-0.5)*1.15+0.5;
    float spotN=fbm(q*3.2+4.0,5);
    float pen=sstep(0.78,0.86,spotN);
    float umb=sstep(0.86,0.93,spotN);
    float limb=0.24+0.76*pow(max(dot(normalize(vN),normalize(uCam-vW)),0.0),0.38);
    float t=0.38+0.34*gran+0.22*(sg-0.5)+0.08;
    t=clamp((t-0.42)*1.15+0.50,0.0,1.0);
    t*=mix(1.0,0.55,limb);
    t=mix(t,0.22,pen*0.85);
    t=mix(t,0.08,umb);
    alb=palSun(t);
    float dim=mix(1.0,0.28,pen);dim=mix(dim,0.08,umb);
    emi=alb*2.05*limb*dim;
    alb=vec3(0.0);
    h=gran*0.04;
    return;
  }
  if(uType==1||uType==10||uType==14||uType==17){
    float ca;craters(p,uType==1?0.9:1.0,h,ca);
    float n=fbm(p*3.4,5);
    vec3 base=uType==1?vec3(0.42,0.39,0.36):uType==10?vec3(0.38,0.37,0.35):uType==14?vec3(0.32,0.29,0.26):vec3(0.36,0.33,0.31);
    alb=base*(0.82+0.22*(n-0.5)*2.0);
    alb*=1.0-0.45*max(-ca,0.0)+0.25*max(ca,0.0);
    if(uType==10){
      float mare=sstep(0.58,0.50,fbm(p*1.6+2.0,5));
      alb=mix(alb,vec3(0.16,0.17,0.19),mare*0.78);
      h*=mix(1.0,0.28,mare);
      float ray=0.0;
      for(int k=0;k<3;k++){
        vec3 c=normalize(hash33(vec3(9.1+float(k)*3.2,2.4,0.7))*2.0-1.0);
        float ang=abs(atan(dot(cross(c,p),normalize(cross(c,vec3(0,1,0)))),dot(normalize(p-c*dot(p,c)),normalize(cross(c,vec3(0,1,0))))));
        float d=acos(clamp(dot(p,c),-1.0,1.0));
        ray+=exp(-abs(sin(ang*18.0+float(k)))*8.0)*exp(-d*1.6)*sstep(0.15,0.02,length(p-c));
      }
      alb+=vec3(0.18)*ray*0.35;
    }
    alb*= (uType==1?0.14:uType==10?0.12:uType==14?0.22:0.38)/0.22;
    rough=0.92;
    return;
  }
  if(uType==2){
    float latw=lat+0.35*sin(lon*3.0+uTime*0.015);
    vec3 q=p*3.2;q.x+=0.55*sin(latw*6.0+uTime*0.02);
    float b=fbm(q*2.2+uTime*0.01,6);
    float tw=fbm(q*5.5+b*1.4,5);
    alb=mix(vec3(0.78,0.70,0.48),vec3(0.93,0.90,0.82),tw);
    alb=mix(alb,vec3(0.70,0.62,0.42),sstep(0.35,0.75,abs(lat)));
    alb*=0.75;
    h=(tw-0.5)*0.08;
    rough=0.55;
    return;
  }
  if(uType==3){
    float ht=fbm(p*2.15,7);
    float land=sstep(0.545,0.560,ht);
    float coast=sstep(0.548,0.562,ht)*sstep(0.575,0.555,ht);
    vec3 deep=vec3(0.015,0.05,0.16);
    vec3 shoal=vec3(0.05,0.28,0.30);
    vec3 ocean=mix(deep,shoal,sstep(0.50,0.552,ht));
    float bio=fbm(p*3.4+8.0,5);
    vec3 green=vec3(0.07,0.16,0.05);
    vec3 desert=vec3(0.32,0.26,0.12);
    vec3 rock=vec3(0.22,0.21,0.20);
    vec3 ice=vec3(0.86,0.91,0.95);
    vec3 grd=mix(desert,green,sstep(0.42,0.62,bio));
    grd=mix(grd,rock,sstep(0.68,0.80,ht));
    float iceN=sstep(0.58,0.78,abs(p.y)+0.08*fbm(p*4.0,3));
    grd=mix(grd,ice,iceN);
    alb=mix(ocean,grd,land);
    alb=mix(alb,vec3(0.12,0.42,0.38),coast*(1.0-land)*0.85);
    h=land*((ht-0.552)*1.6);
    float cldN=fbm(p*2.8+vec3(uTime*0.018*(1.0-0.75*abs(p.y)),0.0,0.0),6);
    float clat=0.35+0.65*(exp(-pow(lat/0.18,2.0))+exp(-pow((abs(lat)-0.55)/0.18,2.0)));
    float cloud=sstep(0.52,0.68,cldN)*clat;
    alb=mix(alb,vec3(0.92,0.94,0.97),cloud*0.88);
    h+=cloud*0.04;
    rough=mix(0.18,0.88,land);
    rough=mix(rough,0.7,cloud);
    float night=sstep(0.05,-0.12,dot(normalize(vN),normalize(uSun-vW)));
    float city=pow(vnoise(p*90.0),18.0)*land*(1.0-cloud)*night;
    emi=vec3(1.0,0.72,0.35)*city*1.6;
    return;
  }
  if(uType==4){
    float ca;float deep=mix(1.0,0.22,sstep(0.02,-0.15,p.y));
    craters(p,0.5*deep,h,ca);
    vec3 base=vec3(0.42,0.155,0.067);
    float n=fbm(p*3.0,5);
    alb=base*(0.75+0.35*(n-0.35));
    alb*=1.0+ca*0.4;
    alb*=0.17/0.22;
    float pole=sstep(0.62,0.80,abs(p.y)+0.04*fbm(p*5.0,3));
    alb=mix(alb,vec3(0.85,0.88,0.92),pole);
    float valley=exp(-pow((p.y-0.02)/0.07,2.0))*exp(-pow((lon-0.4)/0.55,2.0));
    alb=mix(alb,vec3(0.18,0.07,0.04),valley*0.65);
    h+=-valley*0.15;
    rough=0.9;
    return;
  }
  if(uType==5||uType==6){
    float tw=uType==5?1.0:0.42;
    float latd=lat*57.29578;
    float wlat=latd;
    wlat+=tw*6.5*(fbm(vec3(p.x,p.y*0.25,p.z)*2.4+uTime*0.01,4)-0.5);
    wlat+=tw*3.2*(fbm(vec3(p.z,p.y*0.4,p.x)*5.1+2.0,4)-0.5);
    float bands=0.0;
    bands+=sin(wlat*0.90)*0.50;
    bands+=sin(wlat*0.40)*0.28;
    bands+=sin(wlat*0.21)*0.16;
    bands+=sin(wlat*0.12)*0.10;
    float fade=1.0-sstep(46.0,82.0,abs(latd))*0.94;
    bands*=fade;
    vec3 dark,lite,mid;
    if(uType==5){dark=vec3(0.42,0.26,0.14);lite=vec3(0.78,0.68,0.50);mid=vec3(0.62,0.48,0.30);}
    else {dark=vec3(0.55,0.44,0.26);lite=vec3(0.86,0.78,0.58);mid=vec3(0.72,0.62,0.40);}
    alb=mix(mid,lite,sstep(-0.2,0.55,bands));
    alb=mix(alb,dark,sstep(0.15,-0.45,bands));
    float f1,f2,id;
    vec3 pw=vec3(p.x,p.y*2.4,p.z)*3.5;
    worley(pw,f1,f2,id);
    float spot=sstep(0.22,0.08,f1)*sstep(0.35,0.55,abs(lat))*fade;
    alb=mix(alb,dark*0.7,spot*0.55*(0.4+0.6*fract(id*5.2)));
    if(uType==5){
      vec2 grs=vec2(lon-0.85,lat+0.22);
      grs.x*=2.15;float rg=length(grs);
      if(rg<0.22){
        float ang=atan(grs.y,grs.x)+rg*6.0-uTime*0.08;
        float sp=fbm(vec3(cos(ang),sin(ang),rg*4.0),4);
        vec3 gc=mix(vec3(0.62,0.22,0.10),vec3(0.85,0.45,0.18),sp);
        alb=mix(alb,gc,sstep(0.22,0.10,rg));
        alb+=vec3(0.15,0.05,0.02)*exp(-pow((rg-0.16)/0.03,2.0));
      }
    }
    if(uType==6 && p.y>0.80){
      float ang=mod(lon*57.29578+360.0,60.0)-30.0;
      float hex=0.115/max(cos(ang*0.01745329252),0.15);
      float d=abs(length(p.xz)-hex*0.55);
      alb*=1.0-0.45*exp(-pow(d/0.012,2.0))*sstep(0.80,0.88,p.y);
    }
    h=bands*0.04;
    rough=0.45;
    alb*=uType==5?0.52:0.47;
    return;
  }
  if(uType==7||uType==8){
    vec3 base=uType==7?vec3(0.42,0.72,0.74):vec3(0.18,0.32,0.78);
    float b=sin(lat*18.0+fbm(p*3.0,3)*2.0)*0.04;
    alb=base*(0.85+b);
    float cloud=sstep(0.72,0.88,fbm(p*4.2+vec3(uTime*0.01,0.0,0.0),4))*sstep(0.15,0.45,abs(lat));
    alb=mix(alb,vec3(0.75,0.88,0.95),cloud*0.55);
    if(uType==8){
      vec2 ds=vec2(lon+1.1,(lat+0.28)*1.6);
      alb=mix(alb,vec3(0.06,0.10,0.28),sstep(0.20,0.08,length(ds)));
    }
    alb*=uType==7?0.51:0.41;
    h=b*0.2;
    rough=0.4;
    return;
  }
  if(uType==9){
    float ca;craters(p,0.45,h,ca);
    alb=vec3(0.55,0.48,0.40)*(0.7+0.3*fbm(p*3.0,4));
    float belt=exp(-pow(p.y/0.22,2.0));
    alb=mix(alb,vec3(0.18,0.12,0.10),belt*0.8);
    vec3 c1=normalize(vec3(0.15,0.22,0.85));
    vec3 c2=normalize(vec3(-0.10,0.18,0.90));
    float heart=exp(-pow(length(p-c1)/0.28,2.0))+exp(-pow(length(p-c2)/0.24,2.0));
    alb=mix(alb,vec3(0.86,0.84,0.80),clamp(heart,0.0,1.0)*0.85);
    alb*=0.49;
    rough=0.88;
    return;
  }
  if(uType==11){
    float n=fbm(p*4.0,5);
    alb=mix(vec3(0.85,0.62,0.12),vec3(0.55,0.22,0.05),sstep(0.4,0.7,n));

    alb=mix(alb,vec3(0.12,0.08,0.06),vent);
    emi=vec3(1.0,0.25,0.05)*vent*0.55*sstep(0.06,0.0,f1);
    h=-vent*0.2+(n-0.5)*0.1;
    alb*=0.63;
    return;
  }
  if(uType==12){
    alb=vec3(0.78,0.76,0.70);
    float l=0.0;
    for(int i=0;i<3;i++){
      float f=3.0+float(i)*4.5;
      l+=sstep(0.06,0.0,abs(fbm(p*f+float(i)*5.0,4)-0.5));
    }
    alb=mix(alb,vec3(0.42,0.22,0.14),clamp(l,0.0,1.0)*0.75);
    alb*=0.67;h=l*0.05;rough=0.35;
    return;
  }
  if(uType==13){
    float n=fbm(p*2.2,5);
    alb=mix(vec3(0.28,0.25,0.22),vec3(0.62,0.58,0.52),sstep(0.45,0.62,n));
    float g=sstep(0.05,0.0,abs(fbm(p*7.0,4)-0.5));
    alb=mix(alb,vec3(0.72,0.70,0.66),g*0.6);
    alb*=0.43;h=(n-0.5)*0.12;rough=0.7;
    return;
  }
  if(uType==15){
    float n=fbm(p*2.0+uTime*0.008,4);
    alb=mix(vec3(0.62,0.38,0.14),vec3(0.78,0.52,0.22),n);
    alb*=0.22;h=(n-0.5)*0.03;rough=0.6;
    return;
  }
  if(uType==16){
    float n=fbm(p*3.2,4);
    alb=mix(vec3(0.62,0.66,0.70),vec3(0.82,0.84,0.86),n);
    alb=mix(alb,vec3(0.90,0.92,0.95),sstep(0.55,0.78,abs(p.y)));
    alb*=0.76;h=(n-0.5)*0.06;rough=0.4;
    return;
  }
  alb=vec3(0.4); 
}

void main(){
  vec3 p=normalize(vObj);
  vec3 N=normalize(vN);
  vec3 alb,emi;float h,rough,metal;
  surf(p,alb,emi,h,rough,metal);
  if(uType!=0 && uType!=3){

  }else if(uType==3){
    float land=sstep(0.545,0.560,fbm(p*2.15,7));
    N=bumpN(N,vW,h*land,0.65);
  }else{
    N=bumpN(N,vW,h,0.25);
  }
  vec3 V=normalize(uCam-vW);
  vec3 L=normalize(uSun-vW);
  float ndl=dot(N,L);
  float wrap=sstep(uType==15?-0.55:uType==2?-0.38:-0.22,0.55,ndl);
  float mu=max(ndl,0.0);
  vec3 H=normalize(L+V);
  float spec=pow(max(dot(N,H),0.0),mix(40.0,420.0,1.0-rough))*mu*(1.0-rough);
  if(uType==3){
    float ht=fbm(p*2.15,7);
    float land=sstep(0.545,0.560,ht);
    float cldN=fbm(p*2.8+vec3(uTime*0.018*(1.0-0.75*abs(p.y)),0.0,0.0),6);
    float cloud=sstep(0.52,0.68,cldN);
    spec*=(1.0-land)*(1.0-cloud);
  }
  float ringSh=1.0;
  if(uHasRing>0.5){
    vec3 nR=normalize(uAxis);
    float den=dot(L,nR);
    if(abs(den)>0.025){
      float tHit=-dot(vW-uCenter,nR)/den;
      if(tHit>0.0){
        vec3 hp=vW+L*tHit;
        float rr=length(hp-uCenter)/max(uBodyR,1e-4);
        float rdn=ringDens(rr);
        ringSh=exp(-rdn*1.45/max(abs(den),0.10));
      }
    }
  }
  float amb=0.028;
  vec3 col=alb*uLight*(wrap*0.92+amb)*ringSh + spec*uLight*0.55*vec3(1.0,0.97,0.90)*ringSh + emi;
  if(uType==0) col=emi;
  float limb=pow(1.0-max(dot(N,V),0.0),1.6);
  if(uType>=5 && uType<=8) col+=alb*limb*0.12*uLight;
  o=vec4(col,1.0);
}

    const tx=q[0]-prv[0],ty=q[1]-prv[1],tz=q[2]-prv[2], par=i/(ORB_N-1);
    for(let s=0;s<2;s++){
      const o=(i*2+s)*8, side=s===0?-1:1;
      v[o]=p[0];v[o+1]=p[1];v[o+2]=p[2];v[o+3]=tx;v[o+4]=ty;v[o+5]=tz;v[o+6]=side;v[o+7]=par;
    }
  }

/* ---------- FBO ---------- */
const hdrFmt=extFloat?gl.RGBA16F:gl.RGBA8;
const hdrType=extFloat?gl.HALF_FLOAT:gl.UNSIGNED_BYTE;
let fbo={w:0,h:0};
function makeTex(w,h,fmt,type,filter){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,fmt,w,h,0,gl.RGBA,type,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter||gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function makeF(tex){
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  return f;
}
function resizeFBO(w,h){
  if(fbo.w===w&&fbo.h===h)return;
  fbo.w=w;fbo.h=h;
  const kill=x=>{if(x){if(x instanceof WebGLTexture)gl.deleteTexture(x);else if(x instanceof WebGLFramebuffer)gl.deleteFramebuffer(x);else if(x instanceof WebGLRenderbuffer)gl.deleteRenderbuffer(x);}};
  ["msaaC","msaaD","msaaF","scene","sceneF","bloom","bloomF"].forEach(k=>{
    if(k==="bloom"&&fbo.bloom)fbo.bloom.forEach(kill);
    else if(k==="bloomF"&&fbo.bloomF)fbo.bloomF.forEach(kill);
    else kill(fbo[k]);
  });
  fbo.useMSAA=false;
  const msaaC=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,msaaC);
  gl.renderbufferStorageMultisample(gl.RENDERBUFFER,4,hdrFmt,w,h);
  const msaaD=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,msaaD);
  gl.renderbufferStorageMultisample(gl.RENDERBUFFER,4,gl.DEPTH_COMPONENT24,w,h);
  const msaaF=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,msaaF);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,msaaC);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,msaaD);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE){
    fbo.useMSAA=true;fbo.msaaC=msaaC;fbo.msaaD=msaaD;fbo.msaaF=msaaF;
  }else{
    gl.deleteRenderbuffer(msaaC);gl.deleteRenderbuffer(msaaD);gl.deleteFramebuffer(msaaF);
    const depth=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,depth);
    gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,w,h);
    fbo.msaaD=depth;
  }
  fbo.scene=makeTex(w,h,hdrFmt,hdrType,gl.LINEAR);
  fbo.sceneF=makeF(fbo.scene);
  if(!fbo.useMSAA){
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo.sceneF);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,fbo.msaaD);
  }
  fbo.bloom=[];fbo.bloomF=[];
  let bw=w,bh=h;
  for(let i=0;i<6;i++){
    bw=Math.max(1,bw>>1);bh=Math.max(1,bh>>1);
    const t=makeTex(bw,bh,hdrFmt,hdrType,gl.LINEAR);
    fbo.bloom.push(t);fbo.bloomF.push(makeF(t));
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}

function daysPerSec(v){
  if(Math.abs(v)<0.5)return 0;
  return Math.sign(v)*1.157407e-5*Math.pow(10,Math.abs(v)/100*8.55);
}
function fmtSpeed(dps){
  const s=Math.abs(dps);
  const sign=dps<0?"−":"";
  if(s<1/86400)return "实时";
  if(s<1/1440)return sign+(s*86400).toFixed(1)+" 秒/秒";
  if(s<1/24)return sign+(s*1440).toFixed(2)+" 分/秒";
  if(s<1)return sign+(s*24).toFixed(2)+" 小时/秒";
  if(s<365.25)return sign+s.toFixed(2)+" 天/秒";
  return sign+(s/365.25).toFixed(2)+" 年/秒";
}
function jdToDate(jd){
  const ms=(jd-2440587.5)*86400000;
  const d=new Date(ms);
  const p=n=>String(n).padStart(2,"0");
  return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" "+p(d.getUTCHours())+":"+p(d.getUTCMinutes())+":"+p(d.getUTCSeconds())+" UTC";
}

function updatePlanet(p,T){
  const a=p.a+p.da*T,e=p.e+p.de*T,I=p.I+p.dI*T,L=p.L+p.dL*T,vp=p.vp+p.dvp*T,Om=p.Om+p.dOm*T;
  const r=elmToEcl(a,e,I,L,vp,Om);
  p.aAU=a;p.eNow=e;p.INow=I;p.Lnow=wrp360(L);p.vpNow=vp;p.OmNow=Om;p.wNow=(vp-Om)*DEG;
  p.Mnow=r[3];p.rAU=Math.hypot(r[0],r[1],r[2]);
  V3.set(p.ecl,r[0],r[1],r[2]);
  eclWorldComp(r[0],r[1],r[2],scale,compress,p.pos);
  p.vkm=29.7847*Math.sqrt(Math.max(0,2/p.rAU-1/a));
  const [ex,ey,ez]=[r[0],r[1],r[2]];
  p.lon=wrp360(Math.atan2(ey,ex)*RAD);
  p.lat=Math.asin(clamp(ez/p.rAU,-1,1))*RAD;
  mTRSB(p.pos[0],p.pos[1],p.pos[2],p.basis,p.axis,0,1,matM);
}
function updateHalley(jd){
  const M=TAU*(jd-HALLEY.Tp)/HALLEY.Pdays;
  const w=HALLEY.w*DEG,Om=HALLEY.Om*DEG,I=HALLEY.I*DEG;
  const xy=keplerXY(HALLEY.a,HALLEY.e,M);
  const ecl=rotEcl(xy[0],xy[1],w,Om,I);
  halleyB.aAU=HALLEY.a;halleyB.eNow=HALLEY.e;halleyB.INow=HALLEY.I;halleyB.Mnow=wrpPi(M);
  halleyB.rAU=Math.hypot(ecl[0],ecl[1],ecl[2]);
  V3.set(halleyB.ecl,ecl[0],ecl[1],ecl[2]);
  eclWorldComp(ecl[0],ecl[1],ecl[2],scale,compress,halleyB.pos);
  halleyB.vkm=29.7847*Math.sqrt(Math.max(0,2/halleyB.rAU-1/HALLEY.a));
  halleyB.lon=wrp360(Math.atan2(ecl[1],ecl[0])*RAD);
  halleyB.lat=Math.asin(clamp(ecl[2]/halleyB.rAU,-1,1))*RAD;
  const xy2=keplerXY(HALLEY.a,HALLEY.e,M+0.002);
  const e2=rotEcl(xy2[0],xy2[1],w,Om,I);
  const w2=eclWorldComp(e2[0],e2[1],e2[2],scale,compress,tmp1);
  V3.sub(w2,halleyB.pos,halleyB.vel|| (halleyB.vel=V3.c(0,0,0)));
}
function moonDistSetup(){
  const map={};
  for(const m of moonB){(map[m.parent.id]||(map[m.parent.id]=[])).push(m);}
  for(const pid in map){
    const list=map[pid], par=list[0].parent;
    const a0=Math.min(...list.map(m=>Math.abs(m.akm)));
    const inner=list.reduce((b,m)=>Math.abs(m.akm)<Math.abs(b.akm)?m:b);
    const ringOuter=par.ring?par.ring[1]:0;
    const base=Math.max(2.35, ringOuter + inner.dispR/par.dispR + 0.55);
    for(const m of list) m.dispDist=par.dispR*base*Math.pow(Math.abs(m.akm)/a0,0.55);
  }
}

const moonPhase0={io:Math.PI,europa:0,ganymede:0,callisto:1.2,moon:2.1,titan:0.4,triton:0.8,charon:0.0};

function updateMoons(jd){
  for(const m of moonB){
    const th=TAU*(jd-J2000)/m.P+(moonPhase0[m.id]||0);
    const d=m.dispDist;
    let lx=Math.cos(th)*d, ly=0, lz=Math.sin(th)*d;
    const inc=m.inc*DEG, ci=Math.cos(inc), si=Math.sin(inc);
    const y2=ly*ci-lz*si,z2=ly*si+lz*ci;ly=y2;lz=z2;
    const par=m.parent;
    if(m.ref==="ecl"){
      V3.set(m.pos,par.pos[0]+lx,par.pos[1]+ly,par.pos[2]+lz);
    }else{
      const b=par.basis;
      V3.set(m.pos,
        par.pos[0]+b[0]*lx+b[3]*ly+b[6]*lz,
        par.pos[1]+b[1]*lx+b[4]*ly+b[7]*lz,
        par.pos[2]+b[2]*lx+b[5]*ly+b[8]*lz);
    }
    m.axis=par.axis;
    m.rAU=par.rAU;
    const dx=m.pos[0]-par.pos[0],dy=m.pos[1]-par.pos[1],dz=m.pos[2]-par.pos[2];
    m.lon=wrp360(Math.atan2(-dz,dx)*RAD);m.lat=0;
    m.vkm=Math.abs(TAU*m.akm/m.P/86400);
  }
}

function spinBodies(dtDays){

function writeTails(){
  if(halleyB.rAU>6.5){halleyB.tailN=0;return;}
  const len=compressR(Math.min(2.8,(3/halleyB.rAU)**2*0.9),scale,compress)*0.045;
  const anti=V3.nrm(V3.sc(halleyB.pos,-1,tmp1),tmp1);
  const vel=halleyB.vel||anti;
  const vn=V3.nrm(vel,tmp2);
  const camR=V3.nrm(V3.sub(cam.eye,halleyB.pos,tmp3),tmp3);
  function ribbon(dir,curve,n,off){
    const bits=n;
    for(let i=0;i<bits;i++){
      const t=i/(bits-1);
      const cd=V3.c(
        lerp(anti[0],dir[0],t*curve),
        lerp(anti[1],dir[1],t*curve),
        lerp(anti[2],dir[2],t*curve));
      V3.nrm(cd,cd);
      const px=halleyB.pos[0]+cd[0]*len*Math.pow(t,1.05);
      const py=halleyB.pos[1]+cd[1]*len*Math.pow(t,1.05);
      const pz=halleyB.pos[2]+cd[2]*len*Math.pow(t,1.05);
      const sx=camR[1]*cd[2]-camR[2]*cd[1], sy=camR[2]*cd[0]-camR[0]*cd[2], sz=camR[0]*cd[1]-camR[1]*cd[0];
      const sl=Math.hypot(sx,sy,sz)||1;
      const w=len*0.04*(0.15+t*1.6);
      const a=(1-t)*(1-t)*0.9;
      for(let s=0;s<2;s++){
        const k=(off+i*2+s)*4, side=s===0?-1:1;
        tailV[k]=px+sx/sl*w*side;tailV[k+1]=py+sy/sl*w*side;tailV[k+2]=pz+sz/sl*w*side;tailV[k+3]=a;
      }
    }
  }
  ribbon(anti,0.05,24,0);
  const dust=V3.c(-vn[0]*0.7+anti[0]*0.3,-vn[1]*0.7+anti[1]*0.3,-vn[2]*0.7+anti[2]*0.3);
  ribbon(dust,0.85,24,48);
  gl.bindBuffer(gl.ARRAY_BUFFER,tailB);gl.bufferSubData(gl.ARRAY_BUFFER,0,tailV);
  halleyB.tailN=96;
}

function camEyeFrom(tgt,yaw,pitch,dist,o){
  const cp=Math.cos(pitch),sp=Math.sin(pitch),cy=Math.cos(yaw),sy=Math.sin(yaw);
  return V3.set(o, tgt[0]+dist*cp*sy, tgt[1]+dist*sp, tgt[2]+dist*cp*cy);
}
function updateCam(dt){
  cam.fT=Math.min(1,cam.fT+dt);
  const k=sstep(0,1,cam.fT);
  V3.lerp(cam.fFrom,cam.fTo,k,cam.tgt);
  if(cam.fT<1) cam.dist=lerp(cam.dFrom,cam.dTo,k);
  camEyeFrom(cam.tgt,cam.yaw,cam.pitch,cam.dist,cam.eye);
}
function zoomTo(dist){

function focusBody(b){
  cam.focus=b;
  V3.set(cam.fFrom,cam.tgt[0],cam.tgt[1],cam.tgt[2]);
  V3.set(cam.fTo,b.pos[0],b.pos[1],b.pos[2]);
  cam.dFrom=cam.dist;
  cam.dTo=Math.max(b.dispR*7.5+4.2, b.id==="sun"?38:8.5);
  if(b.kind==="moon")cam.dTo=Math.max(3.2,b.dispR*10+2.4);
  cam.fT=0;
  highlightList();
  fillInfo(true);
}
function project(p,vp,w,h){
  const x=vp[0]*p[0]+vp[4]*p[1]+vp[8]*p[2]+vp[12];
  const y=vp[1]*p[0]+vp[5]*p[1]+vp[9]*p[2]+vp[13];
  const z=vp[2]*p[0]+vp[6]*p[1]+vp[10]*p[2]+vp[14];
  const ww=vp[3]*p[0]+vp[7]*p[1]+vp[11]*p[2]+vp[15];
  if(ww===0)return null;
  const iw=1/ww;
  if(z*iw<-1||z*iw>1)return null;
  return {x:(x*iw*0.5+0.5)*w, y:(1-(y*iw*0.5+0.5))*h, z:z*iw, w:ww};
}
function pickAt(sx,sy){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  let best=null,bd=1e9;
  for(const b of bodies){
    if(b.kind==="moon"&&!show.moon)continue;
    if(b.kind==="comet"&&!show.com)continue;
    const pr=project(b.pos,matVP,w,h);if(!pr)continue;
    const d=Math.hypot(pr.x-sx,pr.y-sy);
    const rad=Math.max(16, b.dispR*220/Math.max(pr.w,0.2));
    if(d<rad && d<bd){bd=d;best=b;}
  }
  return best;
}

window.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();document.getElementById("btnPlay").click();}
  if(e.code==="KeyH")document.getElementById("ui").classList.toggle("hid");
  if(e.code==="ArrowLeft"){spdSlider=clamp(spdSlider-6,-100,100);document.getElementById("spd").value=spdSlider;}
  if(e.code==="ArrowRight"){spdSlider=clamp(spdSlider+6,-100,100);document.getElementById("spd").value=spdSlider;}
});

let drag=false,lx=0,ly=0,moved=0;
let pinch=0;
canvas.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;moved=0;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointerup",e=>{
  drag=false;
  if(moved<6){const b=pickAt(e.clientX,e.clientY);if(b)focusBody(b);}
});
canvas.addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  moved+=Math.abs(dx)+Math.abs(dy);
  cam.yaw-=dx*0.005;cam.pitch=clamp(cam.pitch-dy*0.005,-1.2,1.2);
});
function wheelZoom(e){
  const t=e.target;
  if(t && (t.closest && (t.closest("#list")||t.closest("#info")||t.closest("#hud-bottom")||t.closest("#toggles")||t.tagName==="INPUT")))return;
  e.preventDefault();
  const step=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*canvas.clientHeight:e.deltaY;
  zoomTo(cam.dist*Math.exp(step*0.00115));
}
window.addEventListener("wheel",wheelZoom,{passive:false});
canvas.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    const a=e.touches[0],b=e.touches[1];
    pinch=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  }
},{passive:true});
canvas.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pinch)zoomTo(cam.dist*(pinch/d));
    pinch=d;
  }
},{passive:true});

/* ---------- draw passes ---------- */
function lightOf(rAU){return clamp(1.5*Math.pow(1/Math.max(rAU,0.05),0.40),0.26,2.1)}
function ringKind(p){return p.ring[2]==="sat"?0:p.ring[2]==="ura"?1:2}
function atmOf(b){
  if(b.id==="earth")return {h:0.034,col:[0.25,0.48,1.0]};
  if(b.id==="venus")return {h:0.048,col:[0.85,0.75,0.45]};
  if(b.id==="mars")return {h:0.026,col:[0.70,0.35,0.18]};
  if(b.id==="titan")return {h:0.055,col:[0.78,0.48,0.22]};
  if(b.id==="jupiter"||b.id==="saturn")return {h:0.028,col:[0.70,0.62,0.45]};
  if(b.id==="uranus")return {h:0.030,col:[0.40,0.75,0.80]};
  if(b.id==="neptune")return {h:0.030,col:[0.25,0.40,0.90]};
  return null;
}

function drawOrbitsPass(){
  if(!show.orb)return;
  gl.useProgram(P_ORB.p);
  gl.uniformMatrix4fv(P_ORB.u.uVP,false,matVP);
  gl.uniform2f(P_ORB.u.uRes,fbo.w,fbo.h);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  const drawB=(bf,col,cur,hw)=>{
    gl.uniform3fv(P_ORB.u.uCol,col);gl.uniform1f(P_ORB.u.uCur,cur);gl.uniform1f(P_ORB.u.uHalf,hw);
    gl.bindBuffer(gl.ARRAY_BUFFER,bf.b);
    enableAttr(0,3,32,0);enableAttr(1,3,32,12);enableAttr(2,1,32,24);enableAttr(3,1,32,28);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,bf.n);
  };
  for(const p of planetB){
    const c=p.col.map(x=>x*0.55+0.12);
    drawB(orbBuf[p.id],c,orbBuf[p.id].cur||0.5, p.id==="pluto"?1.8:2.3);
  }
  if(show.com) drawB(orbBuf.halley,[0.35,0.62,0.78],orbBuf.halley.cur||0.5,1.8);
  if(show.moon){
    for(const m of moonB){
      moonOrbBuf[m.id].cur=wrpPi(TAU*(simJD-J2000)/m.P)/TAU+0.5;
      drawB(moonOrbBuf[m.id],[0.42,0.48,0.58],moonOrbBuf[m.id].cur,1.5);
    }
  }
}

function drawAsteroids(){
  if(!show.ast)return;
  gl.useProgram(P_AST.p);
  gl.uniformMatrix4fv(P_AST.u.uVP,false,matVP);
  gl.uniform3fv(P_AST.u.uCam,cam.eye);
  gl.uniform1f(P_AST.u.uJD,simJD);
  gl.uniform1f(P_AST.u.uScale,scale);
  gl.uniform1f(P_AST.u.uComp,compress);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(false);
  gl.bindBuffer(gl.ARRAY_BUFFER,AST.A);enableAttr(0,4,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,AST.B);enableAttr(1,4,0,0);
  gl.drawArrays(gl.POINTS,0,AST.n);
}

function drawBody(b){
  gl.useProgram(P_SPH.p);
  mTRSB(b.pos[0],b.pos[1],b.pos[2],b.basis,b.axis,b.phase,b.dispR,matM);
  gl.uniformMatrix4fv(P_SPH.u.uM,false,matM);
  gl.uniformMatrix4fv(P_SPH.u.uVP,false,matVP);
  gl.uniform3fv(P_SPH.u.uCam,cam.eye);
  gl.uniform3f(P_SPH.u.uSun,0,0,0);
  gl.uniform3fv(P_SPH.u.uAxis,b.axis);
  gl.uniform3fv(P_SPH.u.uCenter,b.pos);
  gl.uniform1f(P_SPH.u.uTime,simJD);
  gl.uniform1f(P_SPH.u.uLight,b.id==="sun"?1:lightOf(b.rAU||0.1));
  gl.uniform1f(P_SPH.u.uRau,b.rAU||0.01);
  gl.uniform1f(P_SPH.u.uBodyR,b.dispR);
  gl.uniform1f(P_SPH.u.uHasRing,b.ring?1:0);
  gl.uniform1f(P_SPH.u.uRingKind,b.ring?ringKind(b):0);
  gl.uniform1i(P_SPH.u.uType,b.type||0);
  bindSphere();
  drawSphere();
}

function drawAtmos(b){
  const a=atmOf(b);if(!a)return;
  const H=a.h, sc=b.dispR*(1+H*7.5);
  gl.useProgram(P_ATM.p);
  mTRSB(b.pos[0],b.pos[1],b.pos[2],null,b.axis,0,sc,matM);
  gl.uniformMatrix4fv(P_ATM.u.uM,false,matM);
  gl.uniformMatrix4fv(P_ATM.u.uVP,false,matVP);
  gl.uniform3fv(P_ATM.u.uCam,cam.eye);
  gl.uniform3fv(P_ATM.u.uCenter,b.pos);
  gl.uniform3fv(P_ATM.u.uSunCol,a.col);
  gl.uniform1f(P_ATM.u.uR,b.dispR);
  gl.uniform1f(P_ATM.u.uH,H);
  gl.uniform1f(P_ATM.u.uLight,lightOf(b.rAU||1));
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(false);
  gl.enable(gl.CULL_FACE);gl.cullFace(gl.FRONT);
  bindSphere();drawSphere();
  gl.cullFace(gl.BACK);
}

function drawRings(p){
  if(!p.ring)return;
  const mesh=ringMesh[p.ring[2]];
  gl.useProgram(P_RING.p);
  mTRSB(p.pos[0],p.pos[1],p.pos[2],null,p.axis,0,p.dispR,matM);
  gl.uniformMatrix4fv(P_RING.u.uM,false,matM);
  gl.uniformMatrix4fv(P_RING.u.uVP,false,matVP);
  gl.uniform3fv(P_RING.u.uCam,cam.eye);
  gl.uniform3fv(P_RING.u.uCenter,p.pos);
  gl.uniform3fv(P_RING.u.uAxis,p.axis);
  gl.uniform1f(P_RING.u.uBodyR,p.dispR);
  gl.uniform1f(P_RING.u.uKind,ringKind(p));
  gl.uniform1f(P_RING.u.uLight,lightOf(p.rAU));
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  gl.bindBuffer(gl.ARRAY_BUFFER,mesh.v);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.i);
  enableAttr(0,3,32,0);enableAttr(1,3,32,12);enableAttr(2,2,32,24);
  gl.drawElements(gl.TRIANGLES,mesh.n,gl.UNSIGNED_INT,0);
  gl.enable(gl.CULL_FACE);
}

function drawCorona(){
  const fwd=V3.nrm(V3.sub(cam.tgt,cam.eye,tmp1),tmp1);
  const rgt=V3.nrm(V3.crs(fwd,UP,tmp2),tmp2);
  const upv=V3.crs(rgt,fwd,tmp3);
  gl.useProgram(P_COR.p);
  gl.uniformMatrix4fv(P_COR.u.uVP,false,matVP);
  gl.uniform3fv(P_COR.u.uC,sunB.pos);
  gl.uniform3fv(P_COR.u.uRgt,rgt);
  gl.uniform3fv(P_COR.u.uUp,upv);
  gl.uniform1f(P_COR.u.uTime,simJD);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(false);
  gl.bindBuffer(gl.ARRAY_BUFFER,quadV);
  enableAttr(0,2,16,0);enableAttr(1,2,16,8);
  gl.uniform1f(P_COR.u.uS,sunB.dispR*3.1);gl.uniform1f(P_COR.u.uLayer,0);gl.drawArrays(gl.TRIANGLES,0,6);
  gl.uniform1f(P_COR.u.uS,sunB.dispR*9.0);gl.uniform1f(P_COR.u.uLayer,1);gl.drawArrays(gl.TRIANGLES,0,6);
}

function drawComet(){
  if(!show.com)return;
  gl.disable(gl.BLEND);gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);
  drawBody(halleyB);
  if(halleyB.rAU>6.5||!halleyB.tailN)return;
  gl.useProgram(P_TAIL.p);
  gl.uniformMatrix4fv(P_TAIL.u.uVP,false,matVP);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(false);
  gl.bindBuffer(gl.ARRAY_BUFFER,tailB);
  enableAttr(0,3,16,0);enableAttr(1,1,16,12);
  gl.uniform3f(P_TAIL.u.uCol,0.35,0.55,1.0);gl.drawArrays(gl.TRIANGLE_STRIP,0,48);
  gl.uniform3f(P_TAIL.u.uCol,0.85,0.62,0.28);gl.drawArrays(gl.TRIANGLE_STRIP,48,48);
}

function sunVisible(){
  const pr=project(sunB.pos,matVP,fbo.w,fbo.h);
  if(!pr)return {vis:0,ndc:[0,0]};
  const ndc=[pr.x/fbo.w*2-1, 1-pr.y/fbo.h*2];
  let vis=sat(1.2-Math.hypot(ndc[0],ndc[1])*0.35);
  const sunD=V3.len(V3.sub(sunB.pos,cam.eye,tmp1));
  for(const p of planetB){
    const q=project(p.pos,matVP,fbo.w,fbo.h);if(!q)continue;
    const pd=V3.len(V3.sub(p.pos,cam.eye,tmp2));
    if(pd>sunD)continue;
    const rr=Math.max(4,p.dispR*fbo.h*0.55/Math.max(q.w,0.2));
    const d=Math.hypot(q.x-pr.x,q.y-pr.y);
    if(d<rr)vis*=sstep(rr*0.4,rr*1.1,d);
  }
  return {vis,ndc};
}

function passFS(pr,tex,w,h,mode,extra){
  gl.useProgram(pr.p);
  gl.viewport(0,0,w,h);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  if(pr.u.uTex)gl.uniform1i(pr.u.uTex,0);
  if(pr.u.uRes)gl.uniform2f(pr.u.uRes,w,h);
  if(pr.u.uMode!=null)gl.uniform1i(pr.u.uMode,mode);
  if(extra)extra(pr);
  drawFS();
}

function bloomPass(){
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo.bloomF[0]);
  passFS(P_FS,fbo.scene,fbo.bloom[0]? (fbo.w>>1):1, fbo.h>>1,0,pr=>{
    gl.uniform1f(pr.u.uTh,extFloat?1.25:0.85);gl.uniform1f(pr.u.uKnee,0.6);gl.uniform1f(pr.u.uScale,1);
  });
  let pw=fbo.w>>1,ph=fbo.h>>1;
  for(let i=1;i<6;i++){
    const w=Math.max(1,pw>>1),h=Math.max(1,ph>>1);
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo.bloomF[i]);
    passFS(P_FS,fbo.bloom[i-1],w,h,1,pr=>gl.uniform1f(pr.u.uScale,1));
    pw=w;ph=h;
  }
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  for(let i=5;i>0;i--){
    const w=Math.max(1,fbo.w>>(i)),h=Math.max(1,fbo.h>>i);
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo.bloomF[i-1]);
    passFS(P_FS,fbo.bloom[i],w,h,2,pr=>gl.uniform1f(pr.u.uScale,1));
  }
  gl.disable(gl.BLEND);
}

function drawLabels(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  for(const b of bodies){
    const el=labMap[b.id];if(!el)continue;
    let vis=show.name;
    if(b.kind==="moon"&&!show.moon)vis=false;
    if(b.kind==="comet"&&!show.com)vis=false;
    const pr=vis?project(b.pos,matVP,w,h):null;
    if(!pr){el.style.display="none";continue;}
    const rad=b.dispR*260/Math.max(pr.w,0.15);
    const a=sat((rad-1.2)/18);
    if(a<0.05 && b!==cam.focus){el.style.display="none";continue;}
    el.style.display="block";
    el.style.left=pr.x+"px";el.style.top=pr.y+"px";
    el.style.opacity=b===cam.focus?0.95:Math.max(0.15,a);
  }
}

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2.2);
  const w=Math.max(1,canvas.clientWidth*dpr|0), h=Math.max(1,canvas.clientHeight*dpr|0);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;resizeFBO(w,h);}
}

/* ---------- main loop ---------- */
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-lastT)*0.001);lastT=now;
  resize();
  const dps=daysPerSec(spdSlider);
  const dtDays=playing?dps*dt:0;
  simJD+=dtDays;
  compressV+=(compressTgt-compressV)*Math.min(1,dt/0.18);
  compress=compressV;
  const T=jdToT(simJD);
  updatePlanet.time=T;
  for(const p of planetB) updatePlanet(p,T);
  updateHalley(simJD);
  for(const p of planetB) mTRSB(p.pos[0],p.pos[1],p.pos[2],p.basis,p.axis,0,1,matM);
  updateMoons(simJD);
  spinBodies(dtDays);
  V3.set(sunB.pos,0,0,0);sunB.rAU=0;
  if(cam.focus && cam.focus!==sunB) V3.set(cam.fTo,cam.focus.pos[0],cam.focus.pos[1],cam.focus.pos[2]);
  updateCam(dt);
  rebuildOrbits();
  writeTails();

  const dist=V3.len(V3.sub(cam.eye,cam.tgt,tmp1));
  const near=Math.max(0.012,dist*0.0035), far=Math.max(dist*14,4200);
  mPersp(55*DEG,fbo.w/fbo.h,near,far,matP);
  mLook(cam.eye,cam.tgt,UP,matV);
  mMul(matP,matV,matVP);mInv(matVP,matInvVP);

  const targetFBO=fbo.useMSAA?fbo.msaaF:fbo.sceneF;
  gl.bindFramebuffer(gl.FRAMEBUFFER,targetFBO);
  gl.viewport(0,0,fbo.w,fbo.h);
  gl.depthMask(true);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.BLEND);gl.disable(gl.CULL_FACE);

  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);
  gl.useProgram(P_SKY.p);
  gl.uniformMatrix4fv(P_SKY.u.uInvVP,false,matInvVP);
  gl.uniform3fv(P_SKY.u.uCam,cam.eye);
  gl.uniform3fv(P_SKY.u.uGal,GAL);
  gl.uniform1f(P_SKY.u.uTime,simJD);
  drawFS();

  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(P_STAR.p);
  gl.uniformMatrix4fv(P_STAR.u.uVP,false,matVP);
  gl.uniform3fv(P_STAR.u.uCam,cam.eye);
  gl.uniform1f(P_STAR.u.uTime,now*0.001);
  gl.uniform2f(P_STAR.u.uRes,fbo.w,fbo.h);
  gl.bindBuffer(gl.ARRAY_BUFFER,_star.dir);enableAttr(0,3,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,_star.col);enableAttr(1,3,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,_star.mag);enableAttr(2,1,0,0);
  gl.drawArrays(gl.POINTS,0,_star.n);

  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);
  gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);
  drawBody(sunB);
  for(const p of planetB) drawBody(p);
  if(show.moon) for(const m of moonB) drawBody(m);

  drawOrbitsPass();
  drawAsteroids();
  gl.enable(gl.CULL_FACE);
  for(const p of planetB) drawAtmos(p);
  if(show.moon) for(const m of moonB) drawAtmos(m);
  for(const p of planetB) drawRings(p);
  drawComet();
  drawCorona();

  if(fbo.useMSAA){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,fbo.msaaF);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,fbo.sceneF);
    gl.blitFramebuffer(0,0,fbo.w,fbo.h,0,0,fbo.w,fbo.h,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  }

  if(show.bloom) bloomPass();

  const fl=sunVisible();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,fbo.w,fbo.h);
  gl.disable(gl.DEPTH_TEST);gl.depthMask(true);gl.disable(gl.BLEND);
  gl.useProgram(P_COMP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,fbo.scene);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,fbo.bloom[0]);
  gl.uniform1i(P_COMP.u.uScene,0);gl.uniform1i(P_COMP.u.uBloom,1);
  gl.uniform2f(P_COMP.u.uSunNdc,fl.ndc[0],fl.ndc[1]);
  gl.uniform1f(P_COMP.u.uFlare,show.bloom?fl.vis:0);
  gl.uniform1f(P_COMP.u.uTime,now*0.001);
  gl.uniform1f(P_COMP.u.uDoBloom,show.bloom?1:0);
  drawFS();

  document.getElementById("clock").textContent=jdToDate(simJD);
  document.getElementById("spdlab").textContent=fmtSpeed(dps);
  if((now|0)%8===0)fillInfo();
  drawLabels();
}

focusBody(sunB);
cam.fT=1;V3.set(cam.tgt,0,0,0);cam.dist=92;
requestAnimationFrame(t=>{lastT=t;frame(t);});
</script>
</body>
</html>
