<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
 * 基础工具
 * ============================================================ */
const DEG = Math.PI / 180, TAU = Math.PI * 2;
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mixc = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];

// 三维值噪声（球面采样，纹理无缝）
function makeNoise3(seed) {
  let s = seed;
  const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const arr = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = (rand() * (i + 1)) | 0; [arr[i], arr[j]] = [arr[j], arr[i]]; }
  const p = new Uint8Array(512);
  for (let i = 0; i < 512; i++) p[i] = arr[i & 255];
  const fade = t => t * t * (3 - 2 * t);
  function n3(x, y, z) {
    const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
    const xf = x - X, yf = y - Y, zf = z - Z;
    const u = fade(xf), v = fade(yf), w = fade(zf);
    const h = (i, j, k) => p[(p[(p[(X + i) & 255] + Y + j) & 255] + Z + k) & 255] / 255;
    return lerp(
      lerp(lerp(h(0,0,0), h(1,0,0), u), lerp(h(0,1,0), h(1,1,0), u), v),
      lerp(lerp(h(0,0,1), h(1,0,1), u), lerp(h(0,1,1), h(1,1,1), u), v), w);
  }
  function fbm3(x, y, z, oct = 5) {
    let val = 0, amp = 0.5, f = 1;
    for (let i = 0; i < oct; i++) { val += amp * n3(x * f, y * f, z * f); amp *= 0.5; f *= 2; }
    return val;
  }
  return { n3, fbm3, rand };
}

/* ============================================================
 * 轨道力学（开普勒方程）
 * ============================================================ */
function solveKepler(M, e) {
  M = ((M % TAU) + TAU) % TAU;
  let E = e < 0.8 ? M : Math.PI;
  for (let i = 0; i < 16; i++) {
    const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= dE;
    if (Math.abs(dE) < 1e-10) break;
  }
  return E;
}
// 由轨道根数 + 时间（天）求位置，单位 AU；输出到 three 坐标（黄道面 → XZ 平面）
function keplerPosAU(el, tDays, out) {
  const M = el.M0 + TAU * tDays / el.period;
  const E = solveKepler(M, el.e);
  const xv = el.a * (Math.cos(E) - el.e);
  const yv = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
  const cw = Math.cos(el.w), sw = Math.sin(el.w);
  const cO = Math.cos(el.O), sO = Math.sin(el.O);
  const ci = Math.cos(el.i), si = Math.sin(el.i);
  const x = (cO * cw - sO * sw * ci) * xv + (-cO * sw - sO * cw * ci) * yv;
  const y = (sO * cw + cO * sw * ci) * xv + (-sO * sw + cO * cw * ci) * yv;
  const z = (sw * si) * xv + (cw * si) * yv;
  return out.set(x, z, y);
}

/* ============================================================
 * 显示比例（艺术化压缩，保留相对关系与轨道形状）
 * ============================================================ */
const SUN_R = 10;
const distScale = au => 40 * Math.pow(au, 0.55);      // 日距压缩：1AU→40，30AU→260
const sizeScale = rE => 1.1 * Math.pow(rE, 0.7);      // 行星半径压缩：地球→1.1
const _v = new THREE.Vector3();
function scaledPos(el, t, out) {                       // 开普勒位置 → 显示坐标
  keplerPosAU(el, t, out);
  const r = out.length();
  return out.multiplyScalar(distScale(r) / r);
}

/* ============================================================
 * 天体数据（J2000 近似轨道根数）
 * a:半长轴AU e:偏心率 i:倾角 O:升交点黄经 w:近日点幅角 M0:平近点角
 * period:公转周期(天) rot:自转周期(小时,负=逆行) tilt:轴倾角 radius:半径(地球=1)
 * ============================================================ */
const PLANETS = [

    info:[['直径','4,879 km'],['距太阳','0.387 AU'],['公转周期','88 天'],['自转周期','58.6 天'],['轨道倾角','7.00°'],['偏心率','0.206'],['卫星','0 颗']] },

  { id:'earth', name:'地球', en:'Earth', a:1.00000, e:0.01671, i:0.00005, O:-11.26064, w:114.19799, M0:357.52700, period:365.256,  rot:23.9345, tilt:23.4393, radius:1.0, tex:'earth', atmo:{ color:0x4f9fff, strength:1.0 },
    info:[['直径','12,742 km'],['距太阳','1.000 AU'],['公转周期','365.25 天'],['自转周期','23.9 小时'],['轨道倾角','0.00°'],['偏心率','0.017'],['卫星','1 颗（月球）']] },
  { id:'mars', name:'火星', en:'Mars', a:1.52371, e:0.09339, i:1.84961, O:49.55854,  w:286.48230, M0:19.41248,  period:686.980,  rot:24.6229, tilt:25.19,  radius:0.532, tex:'mars', atmo:{ color:0xc1684a, strength:0.45 },
    info:[['直径','6,779 km'],['距太阳','1.524 AU'],['公转周期','687 天'],['自转周期','24.6 小时'],['轨道倾角','1.85°'],['偏心率','0.093'],['卫星','2 颗']] },
  { id:'jupiter', name:'木星', en:'Jupiter', a:5.20290, e:0.04840, i:1.30320, O:100.55600, w:274.17200, M0:19.67600,  period:4332.59, rot:9.925,   tilt:3.13,   radius:11.209, tex:'jupiter', atmo:{ color:0xd8b48a, strength:0.5 },
    info:[['直径','139,820 km'],['距太阳','5.203 AU'],['公转周期','11.86 年'],['自转周期','9.9 小时'],['轨道倾角','1.30°'],['偏心率','0.048'],['卫星','95 颗（含伽利略四卫星）']] },
  { id:'saturn', name:'土星', en:'Saturn', a:9.53700, e:0.05420, i:2.48500, O:113.71500, w:339.14700, M0:317.08200, period:10759.2, rot:10.656,  tilt:26.73,  radius:9.449, tex:'saturn', atmo:{ color:0xe0cf9f, strength:0.45 },
    rings:{ inner:1.24, outer:2.27, tex:'saturnRing', opacity:0.95 },
    info:[['直径','116,460 km'],['距太阳','9.537 AU'],['公转周期','29.45 年'],['自转周期','10.7 小时'],['轨道倾角','2.49°'],['偏心率','0.054'],['卫星','146 颗（含土卫六）']] },
  { id:'uranus', name:'天王星', en:'Uranus', a:19.1900, e:0.04720, i:0.77300, O:74.00600,  w:96.95800,  M0:142.26800, period:30688.5, rot:-17.24,  tilt:97.77,  radius:4.007, tex:'uranus', atmo:{ color:0x9fe8f0, strength:0.6 },
    rings:{ inner:1.55, outer:1.95, tex:'uranusRing', opacity:0.6 },
    info:[['直径','50,724 km'],['距太阳','19.19 AU'],['公转周期','84.0 年'],['自转周期','17.2 小时（逆行）'],['轨道倾角','0.77°'],['偏心率','0.047'],['卫星','28 颗']] },
  { id:'neptune', name:'海王星', en:'Neptune', a:30.0700, e:0.00860, i:1.77000, O:131.78400, w:273.18700, M0:259.90900, period:60182.0, rot:16.11,   tilt:28.32,  radius:3.883, tex:'neptune', atmo:{ color:0x4f7fff, strength:0.7 },
    info:[['直径','49,244 km'],['距太阳','30.07 AU'],['公转周期','164.8 年'],['自转周期','16.1 小时'],['轨道倾角','1.77°'],['偏心率','0.009'],['卫星','16 颗（含海卫一）']] },
];

// 卫星：orbit 为显示单位半径，period 天（负=逆行）
const MOONS = {
  earth:   [ { name:'月球',   r:0.32, orbit:4.2,  period:27.32,  tex:'moon' } ],
  jupiter: [ { name:'木卫一', r:0.26, orbit:8.2,  period:1.769,  tex:'io' },
             { name:'木卫二', r:0.22, orbit:10.4, period:3.551,  tex:'europa' },
             { name:'木卫三', r:0.38, orbit:13.0, period:7.155,  tex:'ganymede' },
             { name:'木卫四', r:0.34, orbit:16.2, period:16.689, tex:'callisto' } ],
  saturn:  [ { name:'土卫六', r:0.36, orbit:15.0, period:15.945, tex:'titan' } ],
  neptune: [ { name:'海卫一', r:0.28, orbit:7.0,  period:-5.877, tex:'triton' } ],
};

// 哈雷彗星（1P/Halley）
const COMET_EL = { a:17.834, e:0.96714, i:162.26 * DEG, O:58.42 * DEG, w:111.33 * DEG, M0:66.5 * DEG, period:27511 };

/* ============================================================
 * 程序化纹理
 * ============================================================ */
const sph = (u, v) => {
  const lon = u * TAU, lat = (0.5 - v) * Math.PI;
  return [Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon)];
};
function surfaceTex(w, h, fn, post) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const col = fn(x / w, v);
      const i = (y * w + x) * 4;
      d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2];
      d[i + 3] = col[3] === undefined ? 255 : col[3];
    }
  }
  ctx.putImageData(img, 0, 0);
  if (post) post(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
// 陨石坑（后处理）
function craters(ctx, w, h, count, seed) {
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < count; i++) {
    const x = rnd() * w, y = h * 0.06 + rnd() * h * 0.88, r = 0.8 + rnd() * rnd() * 5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
    ctx.fillStyle = `rgba(0,0,0,${0.10 + rnd() * 0.16})`; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r, Math.PI * 0.9, Math.PI * 1.7);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 0.8; ctx.stroke();
  }
}

const TEX = {
  mercury: () => {
    const n = makeNoise3(101);
    return surfaceTex(512, 256, (u, v) => {
      const [px, py, pz] = sph(u, v);
      const m = n.fbm3(px * 4, py * 4, pz * 4, 5);
      return mixc([132, 128, 124], [84, 80, 78], smooth(0.35, 0.65, m));
    }, (ctx, w, h) => craters(ctx, w, h, 220, 7));
  },
  venus: () => {
    const n = makeNoise3(202);
    return surfaceTex(512, 256, (u, v) => {
      const [px, py, pz] = sph(u, v);
      const w1 = n.fbm3(px * 2 + 11, py * 2, pz * 2, 4);
      const sw = n.fbm3(px * 3.5 + w1 * 3, py * 3.5, pz * 3.5 + w1 * 3, 5);
      return mixc([234, 206, 152], [200, 156, 98], smooth(0.3, 0.72, sw));
    });
  },
  earth: () => {
    const n = makeNoise3(303);
    return surfaceTex(1024, 512, (u, v) => {
      const [px, py, pz] = sph(u, v);
      const cont = n.fbm3(px * 2.4 + 5, py * 2.4, pz * 2.4, 6);
      const det  = n.fbm3(px * 7 + 31, py * 7, pz * 7, 4);
      const m = cont * 0.82 + det * 0.18;
      if (Math.abs(py) > 0.82 - det * 0.06) return [238, 244, 250];          // 极地冰盖
      if (m > 0.545) {                                                        // 陆地
        let c = mixc([63, 106, 52], [148, 124, 82], clamp((det - 0.35) * 2.2, 0, 1));
        if (Math.abs(py) < 0.35 && det > 0.5) c = mixc(c, [170, 150, 95], 0.5); // 赤道沙漠
        return c;
      }
      return mixc([16, 52, 110], [9, 28, 70], clamp((m - 0.35) / 0.2, 0, 1)); // 海洋
    });
  },
  clouds: () => {
    const n = makeNoise3(404);
    return surfaceTex(512, 256, (u, v) => {
      const [px, py, pz] = sph(u, v);
      const m = n.fbm3(px * 3.2, py * 3.2, pz * 3.2, 5);

function radialTex(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [t, col] of stops) g.addColorStop(t, col);
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const starDotTex = () => radialTex(64, [[0, 'rgba(255,255,255,1)'], [0.4, 'rgba(255,255,255,.6)'], [1, 'rgba(255,255,255,0)']]);
const sunGlowTex = () => radialTex(256, [[0, 'rgba(255,244,214,1)'], [0.25, 'rgba(255,196,110,.55)'], [0.55, 'rgba(255,120,40,.18)'], [1, 'rgba(255,80,20,0)']]);

// 太阳表面（动画等离子体）
const SUN_VERT = /* glsl */`
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
`;
const SUN_FRAG = /* glsl */`
  uniform float uTime;
  varying vec2 vUv;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
               mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
  }
  float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }
    return v;
  }
  void main() {
    vec2 uv = vUv * vec2(4.0, 2.0);
    float t = uTime * 0.05;
    float n = fbm(uv * 3.0 + vec2(t, t * 0.6));
    n += 0.5 * fbm(uv * 7.0 - vec2(t * 1.7, 0.0));
    n *= 0.67;
    vec3 col = mix(vec3(0.55, 0.08, 0.0), vec3(1.0, 0.45, 0.08), smoothstep(0.15, 0.55, n));
    col = mix(col, vec3(1.0, 0.95, 0.55), smoothstep(0.55, 0.9, n));
    gl_FragColor = vec4(col * 2.2, 1.0);
  }
`;
// 大气辉光（菲涅尔边缘光）
const ATMO_VERT = /* glsl */`
  varying vec3 vNormal;
  void main() {
    vNormal = normalize(normalMatrix * normal);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const ATMO_FRAG = /* glsl */`
  uniform vec3 uColor;
  uniform float uStrength;
  varying vec3 vNormal;
  void main() {
    float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 4.0);
    gl_FragColor = vec4(uColor, 1.0) * intensity * uStrength;
  }
`;
function atmoMaterial(color, strength) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) }, uStrength: { value: strength } },
    vertexShader: ATMO_VERT, fragmentShader: ATMO_FRAG,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  });
}

function makeOrbitLine(el, color = 0x3d5a78, opacity = 0.3, segments = 360) {
  const pts = [];
  const v = new THREE.Vector3();
  for (let k = 0; k <= segments; k++) {
    scaledPos(el, el.period * k / segments, v);   // 平近点角均匀采样 → 近日点附近更密
    pts.push(v.clone());
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity })
  );
  line.userData.baseColor = color;
  line.userData.baseOpacity = opacity;
  return line;
}
function circleLine(r, color = 0x4a6a8a, opacity = 0.16) {
  const pts = [];
  for (let k = 0; k <= 64; k++) pts.push(new THREE.Vector3(Math.cos(k / 64 * TAU) * r, 0, Math.sin(k / 64 * TAU) * r));
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity })
  );
  line.userData.baseColor = color;
  line.userData.baseOpacity = opacity;
  return line;
}
function makeLabel(text, cls, y) {
  const div = document.createElement('div');
  div.className = 'label' + (cls ? ' ' + cls : '');
  div.textContent = text;
  const obj = new CSS2DObject(div);
  obj.position.set(0, y, 0);
  labelObjs.push(obj);
  return obj;
}

function buildRing(parentTilt, planetR, cfg) {
  const inner = planetR * cfg.inner, outer = planetR * cfg.outer;
  const geo = new THREE.RingGeometry(inner, outer, 160, 1);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {                      // 重映射 UV：u = 径向比例
    v.fromBufferAttribute(pos, i);
    uv.setXY(i, (v.length() - inner) / (outer - inner), 0.5);
  }
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    map: tex(cfg.tex), side: THREE.DoubleSide, transparent: true, opacity: cfg.opacity, depthWrite: false,
  }));
  mesh.rotation.x = -Math.PI / 2;
  parentTilt.add(mesh);
}

function buildPlanets() {
  for (const d of PLANETS) {
    const el = { a: d.a, e: d.e, i: d.i * DEG, O: d.O * DEG, w: d.w * DEG, M0: d.M0 * DEG, period: d.period };
    const R = sizeScale(d.radius);

    const group = new THREE.Group();
    const tilt = new THREE.Group();
    tilt.rotation.z = d.tilt * DEG;                          // 真实轴倾角
    group.add(tilt);

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(R, 48, 32),
      new THREE.MeshStandardMaterial({ map: tex(d.tex), roughness: 1, metalness: 0 })
    );
    tilt.add(mesh);

    if (d.atmo) {
      const atm = new THREE.Mesh(new THREE.SphereGeometry(R * 1.25, 48, 32), atmoMaterial(d.atmo.color, d.atmo.strength));
      tilt.add(atm);
    }
    if (d.id === 'earth') {                                  // 云层（独立缓慢旋转）
      cloudsMesh = new THREE.Mesh(
        new THREE.SphereGeometry(R * 1.02, 48, 32),
        new THREE.MeshStandardMaterial({ map: tex('clouds'), transparent: true, depthWrite: false, opacity: 0.9 })
      );
      tilt.add(cloudsMesh);
    }
    if (d.rings) buildRing(tilt, R, d.rings);

    // 卫星（在赤道面内公转）
    const moons = (MOONS[d.id] || []).map(m => {
      const mm = new THREE.Mesh(
        new THREE.SphereGeometry(m.r, 24, 16),
        new THREE.MeshStandardMaterial({ map: tex(m.tex), roughness: 1, metalness: 0 })
      );
      tilt.add(mm);
      const ol = circleLine(m.orbit);
      tilt.add(ol);
      orbitLines.push(ol);
      return { mesh: mm, orbit: m.orbit, period: m.period, phase: Math.random() * TAU };
    });

    group.add(makeLabel(d.name, '', R * 1.5 + 0.9));
    scene.add(group);

    const orbitLine = makeOrbitLine(el);
    scene.add(orbitLine);
    orbitLines.push(orbitLine);

    const entry = {
      id: d.id, name: d.name, en: d.en, group, tilt, mesh, moons, el, rot: d.rot,
      followDist: Math.max(R * 5.5, 3.2), orbitLine, info: d.info,
    };
    mesh.userData.entry = entry;
    pickables.push(mesh);
    bodies.push(entry);
  }
}

function buildBelt({ count, aMin, aMax, iMaxDeg, size, colorA, colorB }) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const els = [];
  for (let i = 0; i < count; i++) {
    const a = aMin + Math.random() * (aMax - aMin);
    els.push({
      a, i: Math.random() ** 2 * iMaxDeg * DEG,
      O: Math.random() * TAU, M0: Math.random() * TAU,
      n: TAU / (Math.pow(a, 1.5) * 365.25),                  // 开普勒第三定律
    });
    const c = mixc(colorA, colorB, Math.random());
    col[i * 3] = c[0] / 255; col[i * 3 + 1] = c[1] / 255; col[i * 3 + 2] = c[2] / 255;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const points = new THREE.Points(geo, new THREE.PointsMaterial({
    size, vertexColors: true, map: starDotTex(), transparent: true,
    depthWrite: false, sizeAttenuation: true, opacity: 0.85,
  }));
  scene.add(points);
  belts.push({ els, pos, geo });
}
function updateBelts(t) {
  for (const b of belts) {
    for (let i = 0; i < b.els.length; i++) {
      const e = b.els[i];
      const M = e.M0 + e.n * t;
      const x0 = Math.cos(M), z0 = Math.sin(M);
      const ci = Math.cos(e.i), si = Math.sin(e.i), cO = Math.cos(e.O), sO = Math.sin(e.O);
      const x = cO * x0 - sO * ci * z0;
      const y = sO * x0 + cO * ci * z0;
      const z = si * z0;
      const r = distScale(e.a);
      b.pos[i * 3] = x * r; b.pos[i * 3 + 1] = z * r; b.pos[i * 3 + 2] = y * r;
    }
    b.geo.attributes.position.needsUpdate = true;
  }
}

function makeTail(count, size, headColor, curveFactor, spreadFactor) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const seeds = [];
  for (let i = 0; i < count; i++) {
    const t = Math.random() ** 0.8;                          // 头部粒子更密
    seeds.push({ t, ang: Math.random() * TAU, spread: 0.3 + Math.random() * 0.7 });
    const fade = Math.pow(1 - t, 1.2);
    col[i * 3] = headColor[0] * fade; col[i * 3 + 1] = headColor[1] * fade; col[i * 3 + 2] = headColor[2] * fade;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const points = new THREE.Points(geo, new THREE.PointsMaterial({
    size, map: starDotTex(), vertexColors: true, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.85,
  }));
  points.frustumCulled = false;
  return { points, pos, geo, seeds, curveFactor, spreadFactor };
}

  const dust = makeTail(420, 1.9, [1.0, 0.97, 0.88], 0.4, 1.0);   // 尘埃尾：宽、弯曲、暖色
  const ion  = makeTail(320, 1.4, [0.5, 0.72, 1.0], 0.0, 0.35);   // 离子尾：窄、笔直、蓝色
  scene.add(dust.points, ion.points);
  tails.push(dust, ion);

  cometEntry = {
    id: 'comet', name: '哈雷彗星', en: '1P/Halley', group, mesh: nucleus, coma,
    followDist: 10, orbitLine,
    info: [['正式名称', '1P/Halley'], ['公转周期', '75.3 年'], ['偏心率', '0.967'], ['轨道倾角', '162.3°（逆行）'], ['上次近日点', '1986 年 2 月'], ['下次近日点', '2061 年 7 月']],
  };
  nucleus.userData.entry = cometEntry;
  pickables.push(nucleus);
}

const _sunDir = new THREE.Vector3(), _vel = new THREE.Vector3(), _u = new THREE.Vector3(), _w = new THREE.Vector3();
function updateComet(t) {
  scaledPos(COMET_EL, t, tmpA);
  cometEntry.group.position.copy(tmpA);
  const r = tmpA.length();

  // 彗尾长度 / 彗发亮度随日距变化（越靠近太阳越壮观）
  const L = clamp(32000 / Math.pow(r, 1.8), 1.5, 95);
  cometEntry.coma.scale.setScalar(clamp(150 / r, 1.6, 9));
  cometEntry.coma.material.opacity = clamp(90 / r, 0.15, 0.95);

  _sunDir.copy(tmpA).normalize();                            // 背日方向
  scaledPos(COMET_EL, t - 0.8, tmpB);
  _vel.copy(tmpA).sub(tmpB).normalize();                     // 运动方向
  _u.crossVectors(_sunDir, _vel);
  if (_u.lengthSq() < 1e-6) _u.set(0, 1, 0); else _u.normalize();
  _w.crossVectors(_sunDir, _u).normalize();

  for (const tail of tails) {
    const Lt = L * (tail.curveFactor === 0 ? 0.85 : 1);
    for (let i = 0; i < tail.seeds.length; i++) {
      const s = tail.seeds[i];
      const along = s.t * Lt;
      const spread = s.spread * Math.pow(s.t, 1.4) * Lt * 0.16 * tail.spreadFactor;
      const bend = s.t * s.t * Lt * tail.curveFactor;
      tmpC.copy(tmpA)
        .addScaledVector(_sunDir, along)
        .addScaledVector(_u, Math.cos(s.ang) * spread)
        .addScaledVector(_w, Math.sin(s.ang) * spread)
        .addScaledVector(_vel, -bend);
      tail.pos[i * 3] = tmpC.x; tail.pos[i * 3 + 1] = tmpC.y; tail.pos[i * 3 + 2] = tmpC.z;
    }
    tail.geo.attributes.position.needsUpdate = true;
  }
}

function buildStars() {
  const dot = starDotTex();
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

  // 均匀分布的恒星
  {
    const N = 6500, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const v = new THREE.Vector3().randomDirection().multiplyScalar(2600 + Math.random() * 2200);
      pos.set([v.x, v.y, v.z], i * 3);
      const warm = Math.random();
      const c = warm < 0.15 ? [1, 0.85, 0.7] : warm < 0.4 ? [0.75, 0.85, 1] : [1, 1, 1];
      const b = 0.35 + Math.random() * 0.65;
      col.set([c[0] * b, c[1] * b, c[2] * b], i * 3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
      size: 1.8, sizeAttenuation: false, map: dot, vertexColors: true,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    })));
  }
  // 银河带（沿倾斜平面的密集星带）
  {
    const N = 4500, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    const n = new THREE.Vector3(0.3, 1, 0.15).normalize();
    const e1 = new THREE.Vector3(1, 0, 0).cross(n).normalize();
    const e2 = new THREE.Vector3().crossVectors(n, e1).normalize();
    for (let i = 0; i < N; i++) {
      const th = Math.random() * TAU, R = 3400 + gauss() * 500;
      const v = new THREE.Vector3()
        .addScaledVector(e1, Math.cos(th) * R)
        .addScaledVector(e2, Math.sin(th) * R)
        .addScaledVector(n, gauss() * R * 0.09)
        .addScaledVector(new THREE.Vector3().randomDirection(), Math.random() * 120);
      pos.set([v.x, v.y, v.z], i * 3);
      const b = 0.15 + Math.random() * 0.4;
      col.set([b * 0.9, b * 0.95, b], i * 3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
      size: 1.4, sizeAttenuation: false, map: dot, vertexColors: true,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    })));
  }
  // 远处星云（极淡的色彩层次）
  {
    const t = nebulaTex();
    const colors = [0x16264e, 0x2a1a4e, 0x0e2a3a, 0x241a3a, 0x12203e];
    for (let i = 0; i < 5; i++) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: t, color: colors[i], transparent: true, opacity: 0.16, depthWrite: false,
      }));
      sp.position.copy(new THREE.Vector3().randomDirection().multiplyScalar(3800));
      sp.scale.setScalar(2200 + Math.random() * 1800);
      scene.add(sp);
    }
  }
}

/* ============================================================
 * UI / 交互
 * ============================================================ */
const $ = id => document.getElementById(id);
const sliderToSpeed = v => 0.1 * Math.pow(20000, v / 1000);
const speedToSlider = s => 1000 * Math.log(s / 0.1) / Math.log(20000);

function fmtSpeed(s) {
  if (s < 1) return (s * 24).toFixed(1) + ' 小时/秒';
  if (s < 300) return s.toFixed(1) + ' 天/秒';
  return (s / 365.25).toFixed(2) + ' 年/秒';
}
function updateSpeedUI() {
  $('speed-label').textContent = '速度 ' + fmtSpeed(speed);
  $('speed-slider').value = speedToSlider(speed);
}
function updateDateUI() {
  const d = new Date(Date.UTC(2000, 0, 1, 12) + simDays * 86400000);
  const p = n => String(n).padStart(2, '0');
  $('date-label').textContent = `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())}`;
}

function setPaused(v) {
  paused = v;
  $('btn-pause').textContent = paused ? '▶' : '⏸';
}

function showInfo(entry) {
  $('info-name').textContent = entry.name;
  $('info-en').textContent = entry.en;
  $('info-rows').innerHTML = entry.info.map(([k, v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`).join('');
  $('info-panel').classList.remove('hidden');
}
function hideInfo() { $('info-panel').classList.add('hidden'); }

function highlightOrbit(entry) {
  for (const b of [sunEntry, ...bodies, cometEntry]) {
    if (!b.orbitLine) continue;
    const on = b === entry;
    b.orbitLine.material.color.setHex(on ? 0x8fd8ff : b.orbitLine.userData.baseColor);
    b.orbitLine.material.opacity = on ? 0.8 : b.orbitLine.userData.baseOpacity;
  }
}

function select(entry) {
  followed = entry;
  selectTime = performance.now() / 1000;
  entry.group.getWorldPosition(prevFollowPos);
  showInfo(entry);
  highlightOrbit(entry);
}
function deselect() {
  followed = null;
  hideInfo();
  highlightOrbit(null);
}

function wireUI() {
  // 时间控制
  $('btn-pause').addEventListener('click', () => setPaused(!paused));
  $('speed-slider').addEventListener('input', e => { speed = sliderToSpeed(+e.target.value); updateSpeedUI(); });
  document.querySelectorAll('.presets button').forEach(btn =>
    btn.addEventListener('click', () => { speed = +btn.dataset.speed; setPaused(false); updateSpeedUI(); }));

  // 开关
  $('tgl-orbits').addEventListener('change', e => {
    showOrbits = e.target.checked;
    for (const l of orbitLines) l.visible = showOrbits;
  });
  $('tgl-labels').addEventListener('change', e => {
    showLabels = e.target.checked;
    for (const l of labelObjs) l.element.style.display = showLabels ? '' : 'none';
  });
  $('tgl-bloom').addEventListener('change', e => { useBloom = e.target.checked; });

  $('btn-reset').addEventListener('click', () => {
    deselect();
    camera.position.copy(camEnd);
    controls.target.set(0, 0, 0);
  });
  $('info-close').addEventListener('click', deselect);

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
    if (e.code === 'Escape') deselect();
  });

  // 点击拾取（区分拖拽与点击）
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let downX = 0, downY = 0;
  const castAt = (x, y) => {
    ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    return hits.length ? hits[0].object.userData.entry : null;
  };
  renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
    const entry = castAt(e.clientX, e.clientY);
    if (entry) select(entry); else deselect();
  });
  renderer.domElement.addEventListener('pointermove', e => {
    document.body.style.cursor = castAt(e.clientX, e.clientY) ? 'pointer' : '';
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
    labelRenderer.setSize(innerWidth, innerHeight);
  });
}

/* ============================================================
 * 初始化
 * ============================================================ */
async function init() {
  const loadTxt = document.querySelector('#loading .txt');
  const tick = msg => new Promise(r => { loadTxt.textContent = msg; setTimeout(r, 15); });

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 12000);
  camera.position.copy(camStart);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 1.5;
  controls.maxDistance = 2500;
  controls.enabled = false;                                  // 开场动画结束后启用

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.35, 0.7, 0.72);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(innerWidth, innerHeight);
  Object.assign(labelRenderer.domElement.style, { position: 'fixed', top: '0', left: '0', pointerEvents: 'none', zIndex: 5 });
  document.body.appendChild(labelRenderer.domElement);

  // 预生成纹理（耗时操作，逐个让出主线程刷新加载提示）
  const texList = ['mercury', 'venus', 'earth', 'clouds', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune',
                   'moon', 'io', 'europa', 'ganymede', 'callisto', 'titan', 'triton', 'saturnRing', 'uranusRing'];
  const texNames = { mercury:'水星', venus:'金星', earth:'地球', clouds:'云层', mars:'火星', jupiter:'木星', saturn:'土星',
                     uranus:'天王星', neptune:'海王星', moon:'月球', io:'木卫一', europa:'木卫二', ganymede:'木卫三',
                     callisto:'木卫四', titan:'土卫六', triton:'海卫一', saturnRing:'土星环', uranusRing:'天王星环' };
  for (const name of texList) { await tick(`正在绘制 ${texNames[name]}…`); tex(name); }

  await tick('正在点亮太阳…');
  buildSun();
  buildPlanets();
  buildBelt({ count: 3200, aMin: 2.1, aMax: 3.3, iMaxDeg: 8,  size: 1.3, colorA: [158, 142, 120], colorB: [110, 100, 92] });   // 小行星带
  buildBelt({ count: 2800, aMin: 30,  aMax: 50, iMaxDeg: 15, size: 1.6, colorA: [130, 155, 185], colorB: [95, 115, 145] });  // 柯伊伯带
  buildComet();
  buildStars();
  wireUI();
  updateSpeedUI();
  updateDateUI();

  document.getElementById('loading').classList.add('done');
  animate();
}

/* ============================================================
 * 主循环
 * ============================================================ */
const clock = new THREE.Clock();
let frame = 0;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const now = performance.now() / 1000;
  frame++;

  if (!paused) simDays += dt * speed;

  // 行星：开普勒轨道位置 + 自转 + 卫星
  for (const b of bodies) {
    scaledPos(b.el, simDays, tmpA);
    b.group.position.copy(tmpA);
    b.mesh.rotation.y = TAU * (((simDays * 24) / b.rot) % 1);
    for (const m of b.moons) {
      const ang = m.phase + TAU * simDays / m.period;
      m.mesh.position.set(Math.cos(ang) * m.orbit, 0, Math.sin(ang) * m.orbit);
    }
  }
  if (cloudsMesh) cloudsMesh.rotation.y = TAU * (((simDays * 24) / 21.5) % 1);
  updateBelts(simDays);
  updateComet(simDays);
  sunMat.uniforms.uTime.value = now;

  // 开场相机动画
  if (introT < 1) {
    introT = Math.min(1, introT + dt / INTRO_DUR);
    camera.position.lerpVectors(camStart, camEnd, easeOutCubic(introT));
    if (introT >= 1) controls.enabled = true;
  }

  // 聚焦跟随
  if (followed) {
    followed.group.getWorldPosition(tmpA);
    tmpB.copy(tmpA).sub(prevFollowPos);                      // 天体本帧位移 → 相机同步平移
    camera.position.add(tmpB);
    controls.target.copy(tmpA);
    prevFollowPos.copy(tmpA);
    if (now - selectTime < 1.8) {                            // 选中后短暂平滑推近
      const dist = camera.position.distanceTo(tmpA);
      tmpC.copy(camera.position).sub(tmpA).normalize();
      camera.position.copy(tmpA).addScaledVector(tmpC, lerp(dist, followed.followDist, 0.07));
    }
  }

  if (frame % 6 === 0) updateDateUI();

  controls.update();
  if (useBloom) composer.render(); else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

window.addEventListener('error', e => {
  const el = document.querySelector('#loading .txt');
  if (el && !document.getElementById('loading').classList.contains('done')) {
    el.textContent = '加载失败：' + (e.message || '未知错误') + '（请检查网络后刷新）';
  }
});

init();
</script>
