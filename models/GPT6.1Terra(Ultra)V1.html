let d=new Date(sim);dateText.textContent=d.toISOString().slice(0,10).replaceAll('-',' / ');range.value=Math.round((sim-start)/(end-start)*1000);requestAnimationFrame(render)}
function select(i){selected=i;document.querySelectorAll('.planet-btn').forEach((b,j)=>b.classList.toggle('active',i===j));let p=planets[i];if(!p){details.innerHTML='<div class="tag">THE SOLAR SYSTEM</div><h2>太阳系</h2><p>选择一颗行星，了解它的基本信息。</p><div class="metrics"><span>恒星<b>1</b></span><span>行星<b>8</b></span></div>';return}details.innerHTML='<div class="tag">'+p.en+' / 行星</div><h2>'+p.name+'</h2><p>'+p.desc+'</p><div class="metrics"><span>公转周期<b>'+p.period+'</b></span><span>直径 · KM<b>'+p.diameter+'</b></span></div>'}
planets.forEach((p,i)=>{let b=document.createElement('button');b.className='planet-btn';b.innerHTML='<span class="dot" style="color:'+p.color+';background:'+p.color+'"></span><span class="cn">'+p.name+'</span><span class="en">'+p.en+'</span>';b.addEventListener('click',()=>select(i));list.appendChild(b)});select(-1);
function updatePlay(){$('#play').textContent=playing?'Ⅱ':'▶';$('#play').setAttribute('aria-label',playing?'暂停时间':'播放时间')}
$('#play').onclick=()=>{if(!playing&&sim>=end)sim=start;playing=!playing;updatePlay()};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b))});range.addEventListener('input',()=>{sim=start+(end-start)*(+range.value/1000)});$('#orbitToggle').onclick=e=>{showOrbits=!showOrbits;e.currentTarget.classList.toggle('active',showOrbits)};$('#labelToggle').onclick=e=>{showLabels=!showLabels;e.currentTarget.classList.toggle('active',showLabels)};$('#reset').onclick=()=>{yaw=-.44;pitch=.86;zoom=1;sim=Math.max(start,Math.min(end,Date.now()));select(-1)};
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>1)drag.moved=true;yaw+=dx*.006;pitch=Math.max(.12,Math.min(1.48,pitch+dy*.006));drag.x=e.clientX;drag.y=e.clientY});canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){let hit=[...points].reverse().find(pt=>Math.hypot(pt.x-e.clientX,pt.y-e.clientY)<Math.max(15,planets[pt.i].size+7));if(hit)select(hit.i)}drag=null});canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(3.5,zoom*Math.exp(-e.deltaY*.001)))},{passive:false});requestAnimationFrame(render);
