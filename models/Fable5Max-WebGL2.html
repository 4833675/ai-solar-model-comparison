<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>太阳系 · Solar System</title>
<style>
:root{
  --ink:#d7dde9; --dim:#8a93a8; --amber:#f0a94f; --amber-hi:#ffd9a0;
  --hair:rgba(165,185,225,0.16); --glass:rgba(9,13,22,0.58);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:-apple-system,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#gl.drag{cursor:grabbing}
#labels{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;transform:translate(-50%,calc(-100% - 14px));text-align:center;font-size:11px;letter-spacing:.16em;color:rgba(222,231,246,.88);text-shadow:0 1px 8px rgba(0,0,0,.95);white-space:nowrap;user-select:none;transition:opacity .3s}
.lbl small{display:block;font-size:8px;letter-spacing:.32em;color:rgba(170,186,214,.5);margin-top:2px;font-weight:400}
.lbl::after{content:"";position:absolute;left:50%;top:calc(100% + 1px);width:1px;height:11px;background:linear-gradient(rgba(205,220,245,.55),transparent)}
.lbl:hover{color:var(--amber-hi)}
header{position:fixed;top:26px;left:32px;z-index:3;pointer-events:none}
header h1{font-family:"Songti SC","Noto Serif SC","STSong","SimSun",serif;font-weight:300;font-size:44px;line-height:1;letter-spacing:.20em;background:linear-gradient(115deg,#ffffff 15%,var(--amber-hi) 60%,var(--amber) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.2em}
header .sub{margin-top:9px;font-size:9.5px;letter-spacing:.46em;color:var(--dim);text-transform:uppercase}
#clock{position:fixed;top:32px;right:34px;text-align:right;z-index:3;pointer-events:none}
#date{font-size:23px;font-weight:300;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#rate{font-size:9.5px;color:var(--dim);letter-spacing:.24em;margin-top:6px}
#dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:96vw}
#chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--hair);border-radius:999px;background:rgba(8,12,20,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--dim);font-size:11px;letter-spacing:.12em;cursor:pointer;transition:all .2s;user-select:none}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c,#888);box-shadow:0 0 6px var(--c,#888)}
.chip:hover{color:var(--ink);border-color:rgba(200,215,245,.35)}
.chip.on{color:#0c0f16;background:var(--amber);border-color:var(--amber);font-weight:600}
.chip.on i{background:#0c0f16;box-shadow:none}
#bar{display:flex;align-items:center;gap:14px;padding:10px 18px;border:1px solid var(--hair);border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#bar button{background:none;border:none;color:var(--ink);cursor:pointer;font-family:inherit}
#bar .ic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .2s}
#bar .ic:hover{background:rgba(255,255,255,.08)}
#bar .ic svg{width:13px;height:13px;fill:var(--ink)}
#bar .txt{font-size:11px;letter-spacing:.2em;color:var(--dim);padding:4px 6px;transition:color .2s}
#bar .txt:hover{color:var(--amber-hi)}
#speed{-webkit-appearance:none;appearance:none;width:150px;height:2px;background:rgba(180,200,235,.25);border-radius:2px;outline:none;cursor:pointer}
#speed::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px rgba(240,169,79,.8);cursor:pointer}
#speed::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--amber);cursor:pointer}
#speedLbl{font-size:10px;color:var(--dim);letter-spacing:.1em;min-width:86px;text-align:left;font-variant-numeric:tabular-nums}
.sep{width:1px;height:18px;background:var(--hair)}
.tog{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.tog input{display:none}
.tog span{font-size:11px;letter-spacing:.18em;color:var(--dim);transition:color .2s;padding:2px 0;border-bottom:1px solid transparent}
.tog input:checked+span{color:var(--ink);border-bottom-color:var(--amber)}
#card{position:fixed;right:26px;top:50%;transform:translateY(-50%) translateX(24px);width:296px;padding:24px 24px 20px;border:1px solid var(--hair);border-radius:16px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:5;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
#card.show{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
#cardX{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;line-height:1}
#cardX:hover{color:var(--ink)}
#cardKicker{font-size:8.5px;letter-spacing:.42em;color:var(--amber);text-transform:uppercase}
#cardName{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-weight:400;font-size:30px;letter-spacing:.14em;margin-top:8px}
#cardEn{font-size:10px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase;margin-top:4px}
#cardDesc{font-size:12px;line-height:1.85;color:rgba(200,210,228,.85);margin-top:14px}
#cardFacts{margin-top:14px;border-top:1px solid var(--hair)}
#cardFacts .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(165,185,225,.08);font-size:11px}
#cardFacts .k{color:var(--dim);letter-spacing:.1em;flex-shrink:0}
#cardFacts .v{text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.03em}
#cardLive{margin-top:12px;font-size:10.5px;color:var(--amber-hi);letter-spacing:.12em;font-variant-numeric:tabular-nums;min-height:14px}
#hint{position:fixed;left:32px;bottom:24px;z-index:3;font-size:10px;letter-spacing:.22em;color:var(--dim);pointer-events:none;transition:opacity 1.2s}
#credits{position:fixed;right:34px;bottom:24px;z-index:3;font-size:9px;letter-spacing:.18em;color:rgba(120,132,155,.55);pointer-events:none;text-align:right}
#boot{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity 1s}
#boot.off{opacity:0;pointer-events:none}
#boot .orb{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#ffe9b8,#f0a94f 45%,#b34d10 80%,#3d1500);box-shadow:0 0 40px rgba(240,169,79,.7),0 0 120px rgba(240,120,40,.35);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
#bootTxt{font-size:11px;letter-spacing:.42em;color:var(--dim)}
#boot .bar{width:180px;height:1px;background:rgba(165,185,225,.15)}
#bootBar{display:block;width:0%;height:100%;background:var(--amber);transition:width .25s;box-shadow:0 0 8px rgba(240,169,79,.9)}
#fatal{position:fixed;inset:0;background:#000;z-index:30;display:none;align-items:center;justify-content:center;padding:40px;text-align:center;font-size:13px;line-height:2;color:var(--dim);letter-spacing:.1em}
@media (max-width:760px){
  header h1{font-size:30px} header{top:18px;left:20px}
  #clock{top:20px;right:20px} #date{font-size:16px}
  #chips{display:none} #speed{width:90px}
  #card{right:12px;left:12px;width:auto;top:auto;bottom:86px;transform:translateY(12px)}
  #card.show{transform:translateY(0)}
  #hint,#credits{display:none}
  #bar{flex-wrap:wrap;justify-content:center;border-radius:20px}
}
@media (prefers-reduced-motion:reduce){ #boot .orb{animation:none} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<header>
  <h1>太阳系</h1>
  <div class="sub">Solar System · Keplerian Orrery</div>
</header>

<div id="clock">
  <div id="date">—</div>
  <div id="rate">—</div>
</div>

<div id="dock">
  <div id="chips"></div>
  <div id="bar">
    <button class="ic" id="btnPlay" title="暂停 / 播放（空格）"></button>
    <button class="txt" id="btnToday" title="回到今天">今天</button>
    <input type="range" id="speed" min="0" max="1000" value="579">
    <div id="speedLbl">—</div>
    <span class="sep"></span>
    <label class="tog"><input type="checkbox" id="tOrbits" checked><span>轨道</span></label>
    <label class="tog"><input type="checkbox" id="tLabels" checked><span>标签</span></label>
    <label class="tog"><input type="checkbox" id="tBelt" checked><span>小行星带</span></label>
    <span class="sep"></span>
    <button class="txt" id="btnHome" title="回到全景（Esc）">总览</button>
  </div>
</div>

<aside id="card">
  <button id="cardX">×</button>
  <div id="cardKicker">—</div>
  <h2 id="cardName">—</h2>
  <div id="cardEn">—</div>
  <p id="cardDesc"></p>
  <div id="cardFacts"></div>
  <div id="cardLive"></div>
</aside>

<div id="hint">拖动旋转 · 滚轮缩放 · 点击天体聚焦</div>
<div id="credits">J2000 历元 · JPL 近似星历<br>开普勒方程实时求解 · 位置误差 ≈ ±1°</div>

<div id="boot">
  <div class="orb"></div>
  <div id="bootTxt">正在点亮太阳</div>
  <div class="bar"><i id="bootBar"></i></div>
</div>
<div id="fatal"></div>

<script>
"use strict";
/* =====================================================================
   太阳系 · 单文件 WebGL2 太阳系仪
   —— JPL 近似星历(1800–2050) · 开普勒方程实时求解 · HDR 泛光渲染
   ===================================================================== */

/* ---------- 小工具 ---------- */
const TAU = Math.PI*2, RAD = Math.PI/180;
const clamp = (x,a,b)=>x<a?a:(x>b?b:x);
const lerp = (a,b,t)=>a+(b-a)*t;
const sstep = (a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const V3 = {
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  scale:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}
};
function m4I(){const o=new Float32Array(16);o[0]=o[5]=o[10]=o[15]=1;return o;}
function m4Mul(a,b){const o=new Float32Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++)
    o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
  return o;}
function m4Persp(fov,asp,n,f){const t=1/Math.tan(fov/2),o=new Float32Array(16);
  o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
function m4LookAt(e,c,u){const f=V3.norm(V3.sub(c,e)),s=V3.norm(V3.cross(f,u)),up=V3.cross(s,f);
  const o=new Float32Array(16);
  o[0]=s[0];o[1]=up[0];o[2]=-f[0];o[4]=s[1];o[5]=up[1];o[6]=-f[1];
  o[8]=s[2];o[9]=up[2];o[10]=-f[2];
  o[12]=-V3.dot(s,e);o[13]=-V3.dot(up,e);o[14]=V3.dot(f,e);o[15]=1;return o;}
function m4T(x,y,z){const o=m4I();o[12]=x;o[13]=y;o[14]=z;return o;}
function m4S(s){const o=m4I();o[0]=s;o[5]=s;o[10]=s;return o;}
function m4RotX(a){const c=Math.cos(a),s=Math.sin(a),o=m4I();o[5]=c;o[6]=s;o[9]=-s;o[10]=c;return o;}
function m4RotY(a){const c=Math.cos(a),s=Math.sin(a),o=m4I();o[0]=c;o[2]=-s;o[8]=s;o[10]=c;return o;}
function m4RotZ(a){const c=Math.cos(a),s=Math.sin(a),o=m4I();o[0]=c;o[1]=s;o[4]=-s;o[5]=c;return o;}
function m3FromM4(m){return new Float32Array([m[0],m[1],m[2],m[4],m[5],m[6],m[8],m[9],m[10]]);}
function mulPoint(m,p){const w=m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15];
  return [(m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12]),(m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13]),(m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]),w];}
function Rng(seed){let s=seed>>>0;return ()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}

/* ---------- 天体力学：JPL 近似星历 (Table 1, 1800–2050) ---------- */
/* 元素: a(AU) e i(°) L(°) ϖ(°) Ω(°)，每项 [J2000值, 每儒略世纪变率] */
const EPH = {
  mercury:{a:[0.38709927,0.00000037],e:[0.20563593,0.00001906],i:[7.00497902,-0.00594749],L:[252.25032350,149472.67411175],wb:[77.45779628,0.16047689],O:[48.33076593,-0.12534081]},
  venus:  {a:[0.72333566,0.00000390],e:[0.00677672,-0.00004107],i:[3.39467605,-0.00078890],L:[181.97909950,58517.81538729],wb:[131.60246718,0.00268329],O:[76.67984255,-0.27769418]},
  earth:  {a:[1.00000261,0.00000562],e:[0.01671123,-0.00004392],i:[-0.00001531,-0.01294668],L:[100.46457166,35999.37244981],wb:[102.93768193,0.32327364],O:[0,0]},
  mars:   {a:[1.52371034,0.00001847],e:[0.09339410,0.00007882],i:[1.84969142,-0.00813131],L:[-4.55343205,19140.30268499],wb:[-23.94362959,0.44441088],O:[49.55953891,-0.29257343]},
  jupiter:{a:[5.20288700,-0.00011607],e:[0.04838624,-0.00013253],i:[1.30439695,-0.00183714],L:[34.39644051,3034.74612775],wb:[14.72847983,0.21252668],O:[100.47390909,0.20469106]},
  saturn: {a:[9.53667594,-0.00125060],e:[0.05386179,-0.00050991],i:[2.48599187,0.00193609],L:[49.95424423,1222.49362201],wb:[92.59887831,-0.41897216],O:[113.66242448,-0.28867794]},
  uranus: {a:[19.18916464,-0.00196176],e:[0.04725744,-0.00004397],i:[0.77263783,-0.00242939],L:[313.23810451,428.48202785],wb:[170.95427630,0.40805281],O:[74.01692503,0.04240589]},
  neptune:{a:[30.06992276,0.00026291],e:[0.00859048,0.00005105],i:[1.77004347,0.00035372],L:[-55.12002969,218.45945325],wb:[44.96476227,-0.32241464],O:[131.78422574,-0.00508664]},
  pluto:  {a:[39.48211675,-0.00031596],e:[0.24882730,0.00005170],i:[17.14001206,0.00004818],L:[238.92903833,145.20780515],wb:[224.06891629,-0.04062942],O:[110.30393684,-0.01183482]}
};
/* 恩克彗星 2P/Encke：q e i Ω ω, 过近日点 2023-10-22 (JD2460239.7), 周期1204.2天 */
const ENCKE = {q:0.3360,e:0.8483,i:11.78,O:334.57,w:186.54,Tp:8694.7,P:1204.2};

const DIST_C = 38, DIST_P = 0.60;         // 距离压缩: r_显示 = C·r^P (真实比例可忽略)
function distScale(rAU){return DIST_C*Math.pow(rAU,DIST_P);}
function eclToWorld(x,y,z){               // 黄道坐标(x,y,z北) → 场景(y轴向北)
  const r=Math.hypot(x,y,z)||1e-9, s=distScale(r)/r;
  return [x*s, z*s, -y*s];
}
function solveKepler(M,e){
  M = ((M%TAU)+TAU)%TAU;
  let E = e>0.5 ? Math.PI : M + e*Math.sin(M);
  for(let k=0;k<20;k++){
    const d = (E - e*Math.sin(E) - M)/(1 - e*Math.cos(E));
    E -= d;
    if(Math.abs(d)<1e-9) break;
  }
  return E;
}
function perifocalToEcl(xv,yv,w,O,I){
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),ci=Math.cos(I),si=Math.sin(I);
  return [
    (cw*cO - sw*sO*ci)*xv + (-sw*cO - cw*sO*ci)*yv,
    (cw*sO + sw*cO*ci)*xv + (-sw*sO + cw*cO*ci)*yv,
    (sw*si)*xv + (cw*si)*yv
  ];
}
function planetState(eph,d){              // d = J2000 起算天数
  const T=d/36525;
  const a=eph.a[0]+eph.a[1]*T, e=eph.e[0]+eph.e[1]*T, I=(eph.i[0]+eph.i[1]*T)*RAD;
  const L=eph.L[0]+eph.L[1]*T, wb=eph.wb[0]+eph.wb[1]*T, Od=eph.O[0]+eph.O[1]*T;
  const M=(L-wb)*RAD, w=(wb-Od)*RAD, O=Od*RAD;
  const E=solveKepler(M,e);
  const xv=a*(Math.cos(E)-e), yv=a*Math.sqrt(1-e*e)*Math.sin(E);
  const ecl=perifocalToEcl(xv,yv,w,O,I);
  return {pos:eclToWorld(ecl[0],ecl[1],ecl[2]), rAU:Math.hypot(xv,yv), aAU:a, E,
          lon:(Math.atan2(ecl[1],ecl[0])/RAD+360)%360};
}
function cometState(cm,d){
  const a=cm.q/(1-cm.e);
  const M=TAU*((d-cm.Tp)/cm.P);
  const E=solveKepler(M,cm.e);
  const xv=a*(Math.cos(E)-cm.e), yv=a*Math.sqrt(1-cm.e*cm.e)*Math.sin(E);
  const ecl=perifocalToEcl(xv,yv,cm.w*RAD,cm.O*RAD,cm.i*RAD);
  return {pos:eclToWorld(ecl[0],ecl[1],ecl[2]), rAU:Math.hypot(xv,yv), aAU:a, E};
}
function jdToDate(jd){
  let z=Math.floor(jd+0.5); const f=jd+0.5-z; let A=z;
  if(z>=2299161){const g=Math.floor((z-1867216.25)/36524.25);A=z+1+g-Math.floor(g/4);}
  const B=A+1524, C=Math.floor((B-122.1)/365.25), D=Math.floor(365.25*C), E=Math.floor((B-D)/30.6001);
  const day=B-D-Math.floor(30.6001*E)+f, mo=E<14?E-1:E-13, y=mo>2?C-4716:C-4715;
  return {y, m:mo, d:Math.floor(day)};
}

/* ---------- 天体定义 ---------- */
const BODIES = [
 {id:'sun',cn:'太阳',en:'Sol',kind:'恒星 G2V',r:8.0,color:'#ffb347',
  desc:'太阳系的心脏，占据整个系统 99.86% 的质量。它每秒将 400 万吨物质转化为光与热，已经燃烧了 46 亿年。',
  facts:[['直径','1,392,700 km'],['光谱型','G2V 黄矮星'],['表面温度','5,505 °C'],['核心温度','1,500 万 °C'],['质量占比','99.86%'],['年龄','约 46 亿年']]},
 {id:'mercury',cn:'水星',en:'Mercury',kind:'类地行星',r:0.95,tilt:0.03,rotH:1407.6,tex:'mercury',color:'#9c938b',atmo:[0.55,0.55,0.62],atmoK:0.14,atmoPow:3.2,
  desc:'最小、最靠近太阳的行星。没有大气调节温度，白昼灼热、黑夜酷寒，昼夜温差达 600 度。',

function makeNoise2(seed){
  const perm=new Uint8Array(512), p=[]; const r=Rng(seed);
  for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=(r()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)perm[i]=p[i&255];
  function n2(x,y,px){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const sx=xf*xf*(3-2*xf),sy=yf*yf*(3-2*yf);
    const h=(X,Y)=>perm[(perm[(((X%px)+px)%px)&255]+(Y&255))&255]/255;
    const a=h(xi,yi),b=h(xi+1,yi),c=h(xi,yi+1),dd=h(xi+1,yi+1);
    return a+(b-a)*sx+(c-a)*sy+(a-b-c+dd)*sx*sy;
  }
  function fbm(x,y,oct,px){let s=0,amp=0.5,f=1,pp=px;
    for(let i=0;i<oct;i++){s+=amp*n2(x*f,y*f,pp);amp*=0.5;f*=2;pp*=2;}return s;}
  return {n2,fbm,rng:r};
}
function mix3(c1,c2,t){t=clamp(t,0,1);return [c1[0]+(c2[0]-c1[0])*t,c1[1]+(c2[1]-c1[1])*t,c1[2]+(c2[2]-c1[2])*t];}
function paint(w,h,fn){
  const img=new ImageData(w,h),d=img.data;
  for(let y=0;y<h;y++){const v=y/h;
    for(let x=0;x<w;x++){const u=x/w;
      const c=fn(u,v,(0.5-v)*Math.PI);
      const i=4*(y*w+x);
      d[i]=clamp(c[0],0,255);d[i+1]=clamp(c[1],0,255);d[i+2]=clamp(c[2],0,255);d[i+3]=c.length>3?clamp(c[3],0,255):255;
    }}
  return img;
}
function stampCraters(img,n,seed,minR,maxR,strength){
  const w=img.width,h=img.height,d=img.data,r=Rng(seed);
  for(let k=0;k<n;k++){
    const cx=r()*w, cy=(0.06+0.88*r())*h, cr=minR+r()*(maxR-minR);
    for(let dy=-cr;dy<=cr;dy++){const yy=Math.round(cy+dy);if(yy<0||yy>=h)continue;
      for(let dx=-cr;dx<=cr;dx++){
        const dist=Math.hypot(dx,dy)/cr; if(dist>1)continue;
        const xx=((Math.round(cx+dx)%w)+w)%w, i=4*(yy*w+xx);
        let mul;
        if(dist<0.75){const t=dist/0.75; mul=1-strength*(0.42-0.28*t);}
        else{mul=1+strength*0.2*(1-(dist-0.75)/0.25);}
        d[i]*=mul;d[i+1]*=mul;d[i+2]*=mul;
      }}
  }
}

      const rings=[[0.18,0.008,0.5],[0.36,0.006,0.35],[0.55,0.01,0.45],[0.82,0.02,0.9],[0.9,0.008,0.4]];
      for(const rg of rings)alpha=Math.max(alpha,rg[2]*Math.exp(-Math.pow((u-rg[0])/rg[1],2)));
      const c=[172,188,196];
      return [c[0],c[1],c[2],alpha*160];});},
  sky(w,h){const N=makeNoise2(210);
    const img=paint(w,h,(u,v)=>{
      let r=5,g=6,b=13;
      const vb=0.5+0.16*Math.sin(TAU*(u-0.12));
      const dcore=Math.abs(v-vb)/0.075;
      let neb=Math.exp(-dcore*dcore)*(0.3+0.7*N.fbm(u*6,v*12,5,6));
      neb*=1-0.72*sstep(0.5,0.72,N.fbm(u*14,v*22,4,14));      // 尘埃暗带
      const tint=N.fbm(u*3,v*5,3,3);
      r+=neb*(22+38*tint);g+=neb*(26+34*tint);b+=neb*(46+44*(1-tint*0.4));
      const cold=sstep(0.55,0.8,N.fbm(u*4+9,v*7,4,4))*0.5;
      r+=cold*5;g+=cold*8;b+=cold*18;
      return [r,g,b];});
    return img;}
};

const canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
function fatal(msg){const f=document.getElementById('fatal');f.style.display='flex';
  f.innerHTML='<div>'+msg+'</div>';document.getElementById('boot').classList.add('off');throw new Error(msg);}
if(!gl) fatal('你的浏览器不支持 WebGL2。<br>请使用较新的 Chrome / Edge / Safari / Firefox 打开。');
const HDR=!!gl.getExtension('EXT_color_buffer_float');
const ANISO=gl.getExtension('EXT_texture_filter_anisotropic');

function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src.trim());gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));fatal('着色器编译失败<br><small>'+gl.getShaderInfoLog(s)+'</small>');}
  return s;}
function makeProg(vs,fs){const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))fatal('着色器链接失败<br><small>'+gl.getProgramInfoLog(p)+'</small>');
  p._u={};return p;}
function U(p,n){if(!(n in p._u))p._u[n]=gl.getUniformLocation(p,n);return p._u[n];}

/* --- 着色器源码 --- */
const MESH_VS=`#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNormal;
layout(location=2) in vec2 aUv;
uniform mat4 uProj,uView,uModel;
uniform mat3 uNMat;
out vec3 vWorld; out vec3 vNormal; out vec2 vUv;
void main(){
  vec4 w=uModel*vec4(aPos,1.0);
  vWorld=w.xyz; vNormal=uNMat*aNormal; vUv=aUv;
  gl_Position=uProj*uView*w;
}`;
const PLANET_FS=`#version 300 es
precision highp float;
in vec3 vWorld; in vec3 vNormal; in vec2 vUv;
uniform sampler2D uDay,uNight,uClouds;
uniform float uHasNight,uHasClouds,uSpec,uAnim,uAtmoK,uAtmoPow;
uniform vec3 uAtmo,uCamPos;
out vec4 frag;
void main(){
  vec3 N=normalize(vNormal);
  vec3 L=normalize(-vWorld);
  vec3 V=normalize(uCamPos-vWorld);
  float ndl=dot(N,L);
  float day=smoothstep(-0.12,0.28,ndl);
  vec4 texc=texture(uDay,vUv);
  vec3 base=texc.rgb;
  float cloud=0.0;
  if(uHasClouds>0.5){
    cloud=texture(uClouds,vec2(vUv.x-uAnim*0.0045,vUv.y)).r;
    base=mix(base,vec3(0.97),cloud*0.92);
  }
  vec3 col=base*(0.018+day*1.12);
  vec3 H=normalize(L+V);
  float spec=pow(max(dot(N,H),0.0),95.0)*texc.a*uSpec*day*(1.0-cloud*0.8);
  col+=spec*vec3(1.0,0.9,0.72)*1.4;
  if(uHasNight>0.5){
    vec3 lights=texture(uNight,vUv).rgb;
    col+=lights*(1.0-smoothstep(-0.16,0.10,ndl))*(1.0-cloud*0.85)*2.1;
  }
  float fres=pow(clamp(1.0-dot(N,V),0.0,1.0),uAtmoPow);
  col+=uAtmo*fres*(0.10+0.90*day)*uAtmoK*1.35;
  frag=vec4(col,1.0);
}`;
const SUN_FS=`#version 300 es
precision highp float;
in vec3 vWorld; in vec3 vNormal; in vec2 vUv;
uniform float uT; uniform vec3 uCamPos;
out vec4 frag;
float hash13(vec3 p){p=fract(p*0.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float noise3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),
                 mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),
                 mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*noise3(p);p*=2.03;a*=0.5;}return s;}
void main(){
  vec3 N=normalize(vNormal);
  float f=fbm(N*2.6+vec3(uT*0.030,uT*0.021,-uT*0.017));
  float g=fbm(N*7.0+vec3(-uT*0.06,uT*0.043,uT*0.031)+f*1.6);
  float m=f*0.62+g*0.38;
  vec3 col=mix(vec3(0.55,0.12,0.008),vec3(1.0,0.42,0.06),smoothstep(0.12,0.58,m));
  col=mix(col,vec3(1.0,0.86,0.5),smoothstep(0.55,0.95,m));
  vec3 V=normalize(uCamPos-vWorld);
  float mu=clamp(dot(N,V),0.0,1.0);
  col*=0.5+0.5*pow(mu,0.65);
  col+=vec3(1.0,0.5,0.16)*pow(1.0-mu,2.2)*1.1;
  frag=vec4(col*2.9,1.0);
}`;
const RING_FS=`#version 300 es
precision highp float;
in vec3 vWorld; in vec3 vNormal; in vec2 vUv;
uniform sampler2D uTex;
uniform vec3 uPlanetPos; uniform float uPlanetR;
out vec4 frag;
void main(){
  vec4 c=texture(uTex,vec2(vUv.x,0.5));
  if(c.a<0.01) discard;
  vec3 N=normalize(vNormal);
  vec3 toSun=-vWorld; float len=length(toSun);
  vec3 d=toSun/len;
  float illum=0.30+0.70*abs(dot(N,d));
  vec3 oc=uPlanetPos-vWorld;
  float s0=dot(oc,d);
  float dist2=dot(oc,oc)-s0*s0;
  float sh=1.0;
  if(s0>0.0&&s0<len) sh=smoothstep(uPlanetR*uPlanetR*0.75,uPlanetR*uPlanetR*1.2,dist2);
  vec3 col=c.rgb*illum*sh+c.rgb*0.05;
  frag=vec4(col,c.a);
}`;
const SKY_FS=`#version 300 es
precision highp float;
in vec2 vUv; in vec3 vWorld; in vec3 vNormal;
uniform sampler2D uTex; uniform float uDim;
out vec4 frag;

const STAR_VS=`#version 300 es
layout(location=0) in vec3 aPos;

uniform mat4 uProj,uView; uniform float uT,uScale;

const STAR_FS=`#version 300 es

const BELT_VS=`#version 300 es
layout(location=0) in vec4 aD0;
layout(location=1) in vec2 aD1;
uniform mat4 uProj,uView;
uniform float uDays,uC,uP,uPx;
out float vTint;
void main(){

  float n=360.0/(365.256*pow(aAU,1.5));

  float w=max(gl_Position.w,0.001);

const PT_VS=`#version 300 es

const CORONA_VS=`#version 300 es
layout(location=0) in vec2 aPos;
uniform mat4 uProj,uView;
uniform vec3 uCenter,uRight,uUp; uniform float uSize;
out vec2 vUv;
void main(){

const CORONA_FS=`#version 300 es
precision highp float;
in vec2 vUv;
uniform float uT,uIntensity; uniform vec3 uTint;
out vec4 frag;
float hash13(vec3 p){p=fract(p*0.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float noise3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),
                 mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),
                 mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<4;i++){s+=a*noise3(p);p*=2.11;a*=0.5;}return s;}
void main(){
  float r=length(vUv);
  if(r>1.0) discard;
  float n=fbm(vec3(vUv*3.2,uT*0.05));
  float core=exp(-r*4.2)*1.7;
  float halo=exp(-r*1.55)*0.6*(0.45+0.85*n);
  float g=(core+halo)*uIntensity*(1.0-smoothstep(0.62,0.98,r));
  frag=vec4(uTint*g,1.0);
}`;
const POST_VS=`#version 300 es
layout(location=0) in vec2 aPos;

void main(){

  frag=vec4(c*k,1.0);
}`;
const BLUR_FS=`#version 300 es
precision highp float;
in vec2 vUv; uniform sampler2D uTex; uniform vec2 uDir;
out vec4 frag;
void main(){
  float w[5]=float[](0.227027,0.1945946,0.1216216,0.054054,0.016216);
  vec3 s=texture(uTex,vUv).rgb*w[0];
  for(int i=1;i<5;i++){
    s+=texture(uTex,vUv+uDir*float(i)).rgb*w[i];
    s+=texture(uTex,vUv-uDir*float(i)).rgb*w[i];
  }
  frag=vec4(s,1.0);
}`;
const COPY_FS=`#version 300 es
precision highp float;

const COMPOSITE_FS=`#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uScene,uB0,uB1,uB2;
uniform float uT,uBloom;
out vec4 frag;
vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);}
void main(){
  vec2 cc=vUv-0.5;
  float r2=dot(cc,cc);
  vec2 off=cc*r2*0.012;
  vec3 scene;
  scene.r=texture(uScene,vUv+off).r;
  scene.g=texture(uScene,vUv).g;
  scene.b=texture(uScene,vUv-off).b;
  vec3 bloom=texture(uB0,vUv).rgb*0.5+texture(uB1,vUv).rgb*0.45+texture(uB2,vUv).rgb*0.42;
  vec3 col=scene+bloom*uBloom;
  col=aces(col*0.92);
  col*=1.0-0.26*smoothstep(0.38,0.85,length(cc));
  float grain=fract(sin(dot(gl_FragCoord.xy+vec2(uT*61.7),vec2(12.9898,78.233)))*43758.5453);
  col+=(grain-0.5)*0.014;
  frag=vec4(col,1.0);
}`;

/* --- 几何 --- */
function makeSphereVao(rings,segs){
  const pos=[],nor=[],uv=[],idx=[];
  for(let y=0;y<=rings;y++){
    const v=y/rings,th=v*Math.PI,st=Math.sin(th),ct=Math.cos(th);
    for(let x=0;x<=segs;x++){
      const u=x/segs,ph=u*TAU;
      const nx=st*Math.cos(ph),ny=ct,nz=st*Math.sin(ph);
      pos.push(nx,ny,nz);nor.push(nx,ny,nz);uv.push(1-u,v);
    }}
  for(let y=0;y<rings;y++)for(let x=0;x<segs;x++){
    const a=y*(segs+1)+x,b=a+segs+1;
    idx.push(a,b,a+1,a+1,b,b+1);
  }
  return buildVao(pos,nor,uv,idx);
}
function makeRingVao(rIn,rOut,segs){
  const pos=[],nor=[],uv=[],idx=[];
  for(let s=0;s<=segs;s++){
    const ang=s/segs*TAU,c=Math.cos(ang),sn=Math.sin(ang);
    pos.push(c*rIn,0,sn*rIn);nor.push(0,1,0);uv.push(0,s/segs);
    pos.push(c*rOut,0,sn*rOut);nor.push(0,1,0);uv.push(1,s/segs);
  }
  for(let s=0;s<segs;s++){
    const a=s*2,b=a+1,c=a+2,d=a+3;
    idx.push(a,b,c,c,b,d);
  }
  return buildVao(pos,nor,uv,idx);
}
function buildVao(pos,nor,uv,idx){
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);
  const pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pb);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  const nb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,nb);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(nor),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
  const ub=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ub);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(uv),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,2,gl.FLOAT,false,0,0);
  const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return {vao,count:idx.length};
}
const sphereHi=makeSphereVao(48,96);
const sphereLo=makeSphereVao(24,48);
const quadVao=(()=>{  // 全屏三角形
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);

function makeLineVao(pts){ // pts: [x,y,z,frac]*
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);

  gl.bindVertexArray(null);
  return {vao,count:pts.length/4};
}

/* --- 纹理上传 --- */
const textures={};
function uploadTex(name,img,wrapS){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,wrapS||gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  if(ANISO)gl.texParameterf(gl.TEXTURE_2D,ANISO.TEXTURE_MAX_ANISOTROPY_EXT,
    Math.min(8,gl.getParameter(ANISO.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  textures[name]=t;
}
const blackTex=(()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);return t;})();

/* --- 帧缓冲 (HDR 泛光管线) --- */
const IFMT=HDR?gl.RGBA16F:gl.RGBA8, ITYPE=HDR?gl.HALF_FLOAT:gl.UNSIGNED_BYTE;
function makeRT(w,h){
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,IFMT,w,h,0,gl.RGBA,ITYPE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  return {fb,tex,w,h};
}
let sceneRT=null,depthRB=null,bloomA=[],bloomB=[];
let CW=0,CH=0,RS=1;
function setupRTs(){
  const w=canvas.width,h=canvas.height;
  if(sceneRT){gl.deleteFramebuffer(sceneRT.fb);gl.deleteTexture(sceneRT.tex);gl.deleteRenderbuffer(depthRB);

/* 轨道线 */
const orbitLines=[];
function buildPlanetOrbit(id){
  const eph=EPH[id],d0=state.simDays,T=d0/36525;
  const a=eph.a[0]+eph.a[1]*T,e=eph.e[0]+eph.e[1]*T,I=(eph.i[0]+eph.i[1]*T)*RAD;
  const wb=eph.wb[0]+eph.wb[1]*T,Od=eph.O[0]+eph.O[1]*T;
  const w=(wb-Od)*RAD,O=Od*RAD;
  const N=360,pts=[];
  for(let i=0;i<=N;i++){
    const E=i/N*TAU;
    const xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E);
    const ecl=perifocalToEcl(xv,yv,w,O,I);
    const p=eclToWorld(ecl[0],ecl[1],ecl[2]);
    pts.push(p[0],p[1],p[2],i/N);
  }
  return makeLineVao(pts);
}
function buildCometOrbit(){
  const a=ENCKE.q/(1-ENCKE.e),e=ENCKE.e;
  const N=480,pts=[];
  for(let i=0;i<=N;i++){
    const E=i/N*TAU;
    const xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E);
    const ecl=perifocalToEcl(xv,yv,ENCKE.w*RAD,ENCKE.O*RAD,ENCKE.i*RAD);
    const p=eclToWorld(ecl[0],ecl[1],ecl[2]);
    pts.push(p[0],p[1],p[2],i/N);
  }
  return makeLineVao(pts);
}
function buildMoonOrbit(m){
  const N=128,pts=[];
  for(let i=0;i<=N;i++){
    const ang=i/N*TAU;
    pts.push(Math.cos(ang)*m.a,0,-Math.sin(ang)*m.a,i/N);
  }
  return makeLineVao(pts);
}

/* 星空 & 小行星带 */
let starVao=null,starCount=0,beltVao=null,beltCount=0;
function buildStars(){
  const n=3600,r=Rng(77),data=[];
  for(let i=0;i<n;i++){
    let x,y,z,l;
    do{x=r()*2-1;y=r()*2-1;z=r()*2-1;l=x*x+y*y+z*z;}while(l>1||l<0.04);
    l=Math.sqrt(l);
    const R=4800;
    const t=r();
    let cr,cg,cb;
    if(t<0.12){cr=0.62;cg=0.74;cb=1.0;}
    else if(t<0.28){cr=1.0;cg=0.82;cb=0.6;}
    else{cr=0.92;cg=0.94;cb=1.0;}
    const br=0.34+r()*r()*0.68;
    data.push(x/l*R,y/l*R,z/l*R, cr*br,cg*br,cb*br, 1.1+r()*2.0, r()*100);
  }
  starCount=n;
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,32,0);
  gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,32,12);
  gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,2,gl.FLOAT,false,32,24);
  gl.bindVertexArray(null);starVao=vao;
}
function buildBelt(){
  const r=Rng(99),data=[];
  const nMain=4200,nKuiper=1400;
  for(let i=0;i<nMain;i++){
    const a=2.15+(r()+r())/2*1.15;
    const y=(r()+r()+r()-1.5)*1.7;
    data.push(a,r()*360,y,0.8+r()*1.4, 0.4+r()*0.6,0);
  }
  for(let i=0;i<nKuiper;i++){
    const a=31+(r()+r())/2*16;
    const y=(r()+r()+r()-1.5)*8;
    data.push(a,r()*360,y,1.0+r()*1.8, 0.25+r()*0.4,0);
  }
  beltCount=nMain+nKuiper;
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,4,gl.FLOAT,false,24,0);
  gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,2,gl.FLOAT,false,24,16);
  gl.bindVertexArray(null);beltVao=vao;
}

const tailJit=(()=>{const r=Rng(55),a=[];for(let i=0;i<TAIL_N;i++)a.push([r()*2-1,r()*2-1,r()*2-1,r()]);return a;})();

/* ---------- 相机 ---------- */
const cam={
  theta:-0.65, phi:0.98, dist:1400,
  center:[0,0,0], vTheta:0, vPhi:0,
  targetDist:420, minDist:12,
  eye:[0,0,0]
};
function camEye(){
  const sp=Math.sin(cam.phi),cp=Math.cos(cam.phi);
  return [
    cam.center[0]+cam.dist*sp*Math.cos(cam.theta),
    cam.center[1]+cam.dist*cp,
    cam.center[2]+cam.dist*sp*Math.sin(cam.theta)
  ];
}

/* ---------- 主更新 ---------- */
function updateBodies(){
  const d=state.simDays;
  for(const b of bodies){
    if(b.id==='sun'){b.pos=[0,0,0];continue;}
    if(b.isPlanet){
      const st=planetState(EPH[b.id],d);
      b.pos=st.pos;b.rAU=st.rAU;b.aAU=st.aAU;b.E=st.E;b.lon=st.lon;
    }else if(b.isMoon){
      const par=bodyById[b.parent];
      const ang=TAU*(d/b.period)+(b.id.length*1.7);
      const local=[Math.cos(ang)*b.a,0,-Math.sin(ang)*b.a];
      let off;
      if(b.useTilt){off=mulPoint(par.tiltM,local);}
      else{const m=m4RotX((b.incl||0)*RAD);off=mulPoint(m,local);}
      b.pos=[par.pos[0]+off[0],par.pos[1]+off[1],par.pos[2]+off[2]];
      b.orbAng=ang;
    }else if(b.isComet){
      const st=cometState(ENCKE,d);
      b.pos=st.pos;b.rAU=st.rAU;b.aAU=st.aAU;b.E=st.E;
      b.vis=sstep(2.9,1.5,st.rAU);
    }
  }
}

/* ---------- 渲染 ---------- */
let proj=m4I(),view=m4I(),vp=m4I();
function setMV(prog){
  gl.uniformMatrix4fv(U(prog,'uProj'),false,proj);
  gl.uniformMatrix4fv(U(prog,'uView'),false,view);
}
function drawMesh(mesh){gl.bindVertexArray(mesh.vao);gl.drawElements(gl.TRIANGLES,mesh.count,gl.UNSIGNED_SHORT,0);}
function bindTex(unit,tex){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tex||blackTex);}

function render(nowSec){
  const d=state.simDays;
  proj=m4Persp(50*RAD,canvas.width/canvas.height,0.5,20000);
  view=m4LookAt(cam.eye,cam.center,[0,1,0]);
  vp=m4Mul(proj,view);

  bindRT(sceneRT);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.CULL_FACE);

  /* 天空 */
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.BLEND);
  gl.useProgram(progSky);setMV(progSky);
  gl.uniformMatrix4fv(U(progSky,'uModel'),false,m4Mul(m4T(cam.eye[0],cam.eye[1],cam.eye[2]),m4S(9000)));
  gl.uniformMatrix3fv(U(progSky,'uNMat'),false,m3FromM4(m4I()));
  bindTex(0,textures.sky);gl.uniform1i(U(progSky,'uTex'),0);
  gl.uniform1f(U(progSky,'uDim'),0.8);
  drawMesh(sphereLo);

  /* 星星 */
  gl.enable(gl.DEPTH_TEST);gl.depthMask(false);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(progStar);setMV(progStar);
  gl.uniform1f(U(progStar,'uT'),nowSec);
  gl.uniform1f(U(progStar,'uScale'),RS);
  gl.bindVertexArray(starVao);gl.drawArrays(gl.POINTS,0,starCount);

  /* 太阳 + 行星 + 卫星（不透明） */
  gl.depthMask(true);gl.disable(gl.BLEND);
  gl.useProgram(progSun);setMV(progSun);
  {
    const rot=m4RotY(nowSec*0.02);
    gl.uniformMatrix4fv(U(progSun,'uModel'),false,m4Mul(rot,m4S(bodyById.sun.r)));
    gl.uniformMatrix3fv(U(progSun,'uNMat'),false,m3FromM4(rot));
    gl.uniform1f(U(progSun,'uT'),nowSec);
    gl.uniform3fv(U(progSun,'uCamPos'),cam.eye);
    drawMesh(sphereHi);
  }
  gl.useProgram(progPlanet);setMV(progPlanet);
  gl.uniform3fv(U(progPlanet,'uCamPos'),cam.eye);
  gl.uniform1f(U(progPlanet,'uAnim'),state.animT);
  gl.uniform1i(U(progPlanet,'uDay'),0);gl.uniform1i(U(progPlanet,'uNight'),1);gl.uniform1i(U(progPlanet,'uClouds'),2);
  for(const b of bodies){
    if(b.id==='sun'||b.isComet)continue;
    let rotM;
    if(b.isPlanet){
      const spin=TAU*(d*24/b.rotH);
      rotM=m4Mul(b.tiltM,m4RotY(spin));
    }else{
      const par=bodyById[b.parent];
      const rotBase=b.useTilt?par.tiltM:m4I();
      rotM=m4Mul(rotBase,m4RotY((b.orbAng||0)+Math.PI));
    }
    const model=m4Mul(m4T(b.pos[0],b.pos[1],b.pos[2]),m4Mul(rotM,m4S(b.r)));
    gl.uniformMatrix4fv(U(progPlanet,'uModel'),false,model);
    gl.uniformMatrix3fv(U(progPlanet,'uNMat'),false,m3FromM4(rotM));
    bindTex(0,textures[b.tex]);
    bindTex(1,b.night?textures[b.night]:null);
    bindTex(2,b.clouds?textures[b.clouds]:null);
    gl.uniform1f(U(progPlanet,'uHasNight'),b.night?1:0);
    gl.uniform1f(U(progPlanet,'uHasClouds'),b.clouds?1:0);
    gl.uniform1f(U(progPlanet,'uSpec'),b.spec||0);
    const at=b.atmo||[0.5,0.5,0.5];
    gl.uniform3f(U(progPlanet,'uAtmo'),at[0],at[1],at[2]);
    gl.uniform1f(U(progPlanet,'uAtmoK'),b.atmoK||0.1);
    gl.uniform1f(U(progPlanet,'uAtmoPow'),b.atmoPow||3.0);
    drawMesh(b.isMoon?sphereLo:sphereHi);
  }

  /* 行星环 */
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
  gl.useProgram(progRing);setMV(progRing);
  gl.uniform1i(U(progRing,'uTex'),0);
  for(const b of bodies){
    if(!b.ring)continue;
    const model=m4Mul(m4T(b.pos[0],b.pos[1],b.pos[2]),m4Mul(b.tiltM,m4S(b.r)));
    gl.uniformMatrix4fv(U(progRing,'uModel'),false,model);
    gl.uniformMatrix3fv(U(progRing,'uNMat'),false,m3FromM4(b.tiltM));
    bindTex(0,textures[b.ring]);
    gl.uniform3fv(U(progRing,'uPlanetPos'),b.pos);
    gl.uniform1f(U(progRing,'uPlanetR'),b.r);
    drawMesh(b.ringMesh);
  }

  /* 轨道线（含彗星） */
  gl.blendFunc(gl.ONE,gl.ONE);
  if(state.showOrbits){
    gl.useProgram(progLine);setMV(progLine);
    for(const ol of orbitLines){
      const b=ol.body;
      let head=0,model=m4I(),base=ol.base,glow=ol.glow;
      if(b.isPlanet||b.isComet){head=(((b.E||0)%TAU)+TAU)%TAU/TAU;}
      else if(b.isMoon){
        const par=bodyById[b.parent];
        const camd=V3.len(V3.sub(cam.eye,par.pos));
        const fade=sstep(par.r*60,par.r*22,camd);
        if(fade<0.02)continue;
        base=ol.base*fade;glow=ol.glow*fade;
        head=(((b.orbAng||0)%TAU)+TAU)%TAU/TAU;
        const rotBase=b.useTilt?par.tiltM:m4RotX((b.incl||0)*RAD);
        model=m4Mul(m4T(par.pos[0],par.pos[1],par.pos[2]),rotBase);
      }
      if(b.isComet){base*=0.5+0.5*b.vis;}
      gl.uniformMatrix4fv(U(progLine,'uModel'),false,model);
      gl.uniform3fv(U(progLine,'uColor'),ol.color);
      gl.uniform1f(U(progLine,'uHead'),head);
      gl.uniform1f(U(progLine,'uBase'),base*(state.selected===b?2.2:1));
      gl.uniform1f(U(progLine,'uGlow'),glow);
      gl.bindVertexArray(ol.mesh.vao);
      gl.drawArrays(gl.LINE_STRIP,0,ol.mesh.count);
    }
  }

  /* 小行星带 + 柯伊伯带 */
  if(state.showBelt){
    gl.useProgram(progBelt);setMV(progBelt);
    gl.uniform1f(U(progBelt,'uDays'),d);
    gl.uniform1f(U(progBelt,'uC'),DIST_C);
    gl.uniform1f(U(progBelt,'uP'),DIST_P);
    gl.uniform1f(U(progBelt,'uPx'),canvas.height*0.62);
    gl.uniform1f(U(progBelt,'uAlpha'),0.24);
    gl.bindVertexArray(beltVao);gl.drawArrays(gl.POINTS,0,beltCount);
  }

  /* 彗尾 */
  const comet=bodyById.encke;
  if(comet.vis>0.01){
    updateTail(comet);
    gl.useProgram(progPt);setMV(progPt);
    gl.uniform1f(U(progPt,'uPx'),canvas.height*0.9);
    gl.bindVertexArray(tailVao);
    gl.bindBuffer(gl.ARRAY_BUFFER,tailBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,tailData);
    gl.drawArrays(gl.POINTS,0,TAIL_N*2);
  }

  /* 日冕 */
  gl.useProgram(progCorona);setMV(progCorona);
  const right=[view[0],view[4],view[8]],up=[view[1],view[5],view[9]];
  gl.uniform3fv(U(progCorona,'uRight'),right);
  gl.uniform3fv(U(progCorona,'uUp'),up);
  gl.uniform1f(U(progCorona,'uT'),nowSec);
  gl.bindVertexArray(billVao);
  gl.uniform3f(U(progCorona,'uCenter'),0,0,0);
  gl.uniform1f(U(progCorona,'uSize'),bodyById.sun.r*4.4);
  gl.uniform3f(U(progCorona,'uTint'),1.0,0.55,0.22);
  gl.uniform1f(U(progCorona,'uIntensity'),0.7);
  gl.drawArrays(gl.TRIANGLES,0,6);
  gl.uniform1f(U(progCorona,'uSize'),bodyById.sun.r*2.4);
  gl.uniform3f(U(progCorona,'uTint'),1.0,0.78,0.42);
  gl.uniform1f(U(progCorona,'uIntensity'),1.25);
  gl.drawArrays(gl.TRIANGLES,0,6);
  if(comet.vis>0.01){
    gl.uniform3fv(U(progCorona,'uCenter'),comet.pos);
    gl.uniform1f(U(progCorona,'uSize'),0.8+1.6*comet.vis);
    gl.uniform3f(U(progCorona,'uTint'),0.6,0.82,1.0);
    gl.uniform1f(U(progCorona,'uIntensity'),comet.vis*1.1);
    gl.drawArrays(gl.TRIANGLES,0,6);
  }

  gl.depthMask(true);gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);

  /* ---- 后处理：亮部提取 → 多级模糊 → 合成 ---- */
  gl.bindVertexArray(quadVao);
  bindRT(bloomA[0]);
  gl.useProgram(progBright);
  bindTex(0,sceneRT.tex);gl.uniform1i(U(progBright,'uTex'),0);
  gl.uniform1f(U(progBright,'uThresh'),HDR?1.0:0.72);
  gl.drawArrays(gl.TRIANGLES,0,3);
  for(let i=0;i<3;i++){
    if(i>0){
      bindRT(bloomA[i]);
      gl.useProgram(progCopy);
      bindTex(0,bloomA[i-1].tex);gl.uniform1i(U(progCopy,'uTex'),0);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }
    const passes=i===2?2:1;
    for(let p=0;p<passes;p++){
      gl.useProgram(progBlur);
      gl.uniform1i(U(progBlur,'uTex'),0);
      bindRT(bloomB[i]);bindTex(0,bloomA[i].tex);
      gl.uniform2f(U(progBlur,'uDir'),1.35/bloomA[i].w,0);
      gl.drawArrays(gl.TRIANGLES,0,3);
      bindRT(bloomA[i]);bindTex(0,bloomB[i].tex);
      gl.uniform2f(U(progBlur,'uDir'),0,1.35/bloomA[i].h);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }
  }
  bindRT(null);
  gl.useProgram(progComposite);
  bindTex(0,sceneRT.tex);bindTex(1,bloomA[0].tex);bindTex(2,bloomA[1].tex);bindTex(3,bloomA[2].tex);
  gl.uniform1i(U(progComposite,'uScene'),0);gl.uniform1i(U(progComposite,'uB0'),1);
  gl.uniform1i(U(progComposite,'uB1'),2);gl.uniform1i(U(progComposite,'uB2'),3);
  gl.uniform1f(U(progComposite,'uT'),nowSec%10);
  gl.uniform1f(U(progComposite,'uBloom'),1.0);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

function updateTail(comet){
  const d=state.simDays;
  const away=V3.norm(comet.pos);
  const s1=cometState(ENCKE,d+0.5),s0=cometState(ENCKE,d-0.5);
  const vel=V3.norm(V3.sub(s1.pos,s0.pos));
  const k=comet.vis;
  const ionLen=10+42*k, dustLen=ionLen*0.75;
  let o=0;
  for(let i=0;i<TAIL_N;i++){
    const j=tailJit[i], t=(i+0.5)/TAIL_N;
    /* 离子尾：笔直、蓝 */
    {
      const spread=t*ionLen*0.055;
      const p=[comet.pos[0]+away[0]*t*t*ionLen+j[0]*spread,
               comet.pos[1]+away[1]*t*t*ionLen+j[1]*spread,
               comet.pos[2]+away[2]*t*t*ionLen+j[2]*spread];
      const br=(1-t)*(1-t)*k*0.85;
      tailData[o++]=p[0];tailData[o++]=p[1];tailData[o++]=p[2];
      tailData[o++]=0.45*br;tailData[o++]=0.75*br;tailData[o++]=1.0*br;
      tailData[o++]=(1-t)*1.3+0.35;
    }
    /* 尘埃尾：弯曲、暖白 */
    {
      const spread=t*dustLen*0.10;
      const p=[comet.pos[0]+(away[0]-vel[0]*0.45*t)*t*dustLen+j[1]*spread,
               comet.pos[1]+(away[1]-vel[1]*0.45*t)*t*dustLen+j[2]*spread,
               comet.pos[2]+(away[2]-vel[2]*0.45*t)*t*dustLen+j[0]*spread];
      const br=(1-t)*(1-t)*k*0.6;
      tailData[o++]=p[0];tailData[o++]=p[1];tailData[o++]=p[2];
      tailData[o++]=1.0*br;tailData[o++]=0.85*br;tailData[o++]=0.62*br;
      tailData[o++]=(1-t)*1.6+0.4;
    }
  }
}

/* ---------- 标签 ---------- */
const labelRoot=document.getElementById('labels');
const labelEls={};
function makeLabels(){
  for(const b of bodies){
    const el=document.createElement('div');
    el.className='lbl';
    el.innerHTML=b.cn+'<small>'+b.en+'</small>';
    el.style.color=b.color||'#cfd8ea';
    el.addEventListener('click',ev=>{ev.stopPropagation();focusBody(b);});
    labelRoot.appendChild(el);
    labelEls[b.id]=el;
  }
}
function updateLabels(){
  for(const b of bodies){
    const el=labelEls[b.id];
    if(!el)continue;
    let show=state.showLabels;
    if(b.isMoon){
      const par=bodyById[b.parent];
      show=show&&V3.len(V3.sub(cam.eye,par.pos))<par.r*26;
    }
    if(b.isComet)show=show&&(b.vis>0.06||state.selected===b);
    if(!show){el.style.opacity=0;el.style.pointerEvents='none';continue;}
    const p=mulPoint(vp,b.pos);
    if(p[3]<=0.1){el.style.opacity=0;el.style.pointerEvents='none';continue;}
    const sx=(p[0]/p[3]*0.5+0.5)*CW, sy=(0.5-p[1]/p[3]*0.5)*CH;
    if(sx<-60||sx>CW+60||sy<-40||sy>CH+40){el.style.opacity=0;el.style.pointerEvents='none';continue;}
    el.style.opacity=1;el.style.pointerEvents='auto';
    el.style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px) translate(-50%,calc(-100% - 14px))';
  }
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const ICON_PAUSE='<svg viewBox="0 0 12 12"><rect x="1.5" y="1" width="3.2" height="10" rx="1"/><rect x="7.3" y="1" width="3.2" height="10" rx="1"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 12 12"><path d="M2.5 1.2 L11 6 L2.5 10.8 Z"/></svg>';
function fmtSpeed(){
  if(!state.playing)return '已暂停';
  const s=state.speed;
  if(s<1)return '1 秒 ≈ '+(s*24).toFixed(1)+' 小时';
  if(s<400)return '1 秒 ≈ '+(s<10?s.toFixed(1):Math.round(s))+' 天';
  return '1 秒 ≈ '+(s/365.25).toFixed(1)+' 年';
}
function updateClock(){
  const jd=2451545.0+state.simDays;
  const dt=jdToDate(jd);
  $('date').textContent=dt.y+' 年 '+dt.m+' 月 '+dt.d+' 日';
  $('rate').textContent=fmtSpeed();
}
function sliderToSpeed(v){return 0.05*Math.pow(10,v/1000*4.8);}
function setupUI(){
  $('btnPlay').innerHTML=ICON_PAUSE;
  $('btnPlay').addEventListener('click',()=>{
    state.playing=!state.playing;
    $('btnPlay').innerHTML=state.playing?ICON_PAUSE:ICON_PLAY;
  });
  $('btnToday').addEventListener('click',()=>{
    state.simDays=(Date.now()/86400000+2440587.5)-2451545.0;
  });
  $('speed').addEventListener('input',e=>{state.speed=sliderToSpeed(+e.target.value);$('speedLbl').textContent=fmtSpeed();});
  state.speed=sliderToSpeed(579);
  $('speedLbl').textContent=fmtSpeed();
  $('tOrbits').addEventListener('change',e=>state.showOrbits=e.target.checked);
  $('tLabels').addEventListener('change',e=>state.showLabels=e.target.checked);
  $('tBelt').addEventListener('change',e=>state.showBelt=e.target.checked);
  $('btnHome').addEventListener('click',goHome);
  $('cardX').addEventListener('click',()=>{$('card').classList.remove('show');state.selected=null;refreshChips();});
  window.addEventListener('keydown',e=>{
    if(e.code==='Space'){
      e.preventDefault();
      if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
      state.playing=!state.playing;
      $('btnPlay').innerHTML=state.playing?ICON_PAUSE:ICON_PLAY;
    }
    if(e.code==='Escape')goHome();
  });
  /* 行星导航 */
  const chips=$('chips');
  const navBodies=bodies.filter(b=>!b.isMoon);
  for(const b of navBodies){
    const c=document.createElement('button');
    c.className='chip';c.dataset.id=b.id;
    c.innerHTML='<i style="--c:'+b.color+'"></i>'+b.cn;
    c.addEventListener('click',()=>focusBody(b));
    chips.appendChild(c);
  }
  setTimeout(()=>{$('hint').style.opacity=0;},9000);
}
function refreshChips(){
  document.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('on',!!state.selected&&c.dataset.id===state.selected.id);
  });
}
function focusBody(b){
  introT=1;                              // 用户主动聚焦时结束开场动画
  state.selected=b;state.follow=b;
  const r=b.r||1.2;
  cam.targetDist=clamp(r*7.5,4.5,300);
  cam.minDist=Math.max(r*2.4,1.8);
  fillCard(b);
  $('card').classList.add('show');
  refreshChips();
}
function goHome(){
  state.follow=null;state.selected=null;
  cam.targetDist=420;cam.minDist=12;
  $('card').classList.remove('show');
  refreshChips();
}
function fillCard(b){
  $('cardKicker').textContent=b.kind||'天体';
  $('cardName').textContent=b.cn;
  $('cardEn').textContent=b.en;
  $('cardDesc').textContent=b.desc||'';
  const facts=$('cardFacts');facts.innerHTML='';
  for(const [k,v] of (b.facts||[])){
    const row=document.createElement('div');row.className='row';
    row.innerHTML='<span class="k">'+k+'</span><span class="v">'+v+'</span>';
    facts.appendChild(row);
  }
  $('cardLive').textContent='';
}
function updateCardLive(){
  const b=state.selected;
  if(!b||!$('card').classList.contains('show'))return;
  if(b.rAU&&b.aAU){
    const v=29.78*Math.sqrt(Math.max(0,2/b.rAU-1/b.aAU));
    $('cardLive').textContent='当前日距 '+b.rAU.toFixed(3)+' AU · 轨道速度 '+v.toFixed(1)+' km/s';
  }else if(b.id==='sun'){
    $('cardLive').textContent='每秒钟聚变 6 亿吨氢';
  }
}

/* ---------- 交互 ---------- */
function setupInput(){
  let down=false,px=0,py=0,moved=0,pid=null;
  const pts=new Map();
  let pinch0=0,dist0=0;
  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){down=true;px=e.clientX;py=e.clientY;moved=0;pid=e.pointerId;canvas.classList.add('drag');}
    else if(pts.size===2){
      down=false;pid=null;              // 双指手势取消“点击选中”判定
      const a=[...pts.values()];
      pinch0=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);dist0=cam.dist;
    }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){
      const a=[...pts.values()];
      const pn=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
      if(pinch0>0)cam.targetDist=cam.dist=clamp(dist0*pinch0/pn,cam.minDist,1600);
      return;
    }
    if(!down||e.pointerId!==pid)return;
    const dx=e.clientX-px,dy=e.clientY-py;
    px=e.clientX;py=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    cam.theta-=dx*0.0052;
    cam.phi=clamp(cam.phi-dy*0.0052,0.12,Math.PI-0.12);
    cam.vTheta=-dx*0.0052;cam.vPhi=-dy*0.0052;
  });
  const up=e=>{
    pts.delete(e.pointerId);
    if(e.pointerId===pid){
      canvas.classList.remove('drag');
      if(down&&moved<6)pick(e.clientX,e.clientY);
      down=false;pid=null;
    }
    if(pts.size<2)pinch0=0;
  };
  canvas.addEventListener('pointerup',up);
  canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    cam.targetDist=clamp(cam.targetDist*Math.exp(e.deltaY*0.0011),cam.minDist,1600);
  },{passive:false});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('resize',resize);
}
function pick(mx,my){
  let best=null,bestD=1e9;
  for(const b of bodies){
    if(b.isMoon){
      const par=bodyById[b.parent];
      if(V3.len(V3.sub(cam.eye,par.pos))>par.r*26)continue;
    }
    const p=mulPoint(vp,b.pos);
    if(p[3]<=0.1)continue;
    const sx=(p[0]/p[3]*0.5+0.5)*CW,sy=(0.5-p[1]/p[3]*0.5)*CH;
    const rPix=(b.r||1)/p[3]*canvas.height*1.2/RS;
    const dd=Math.hypot(mx-sx,my-sy);
    if(dd<Math.max(16,rPix+10)&&dd<bestD){bestD=dd;best=b;}
  }
  if(best)focusBody(best);
}

/* ---------- 主循环 ---------- */
let lastT=0,introT=0;
function frame(tms){
  const now=tms/1000;
  const dt=Math.min(now-lastT||0.016,0.05);
  lastT=now;
  state.animT+=dt;

  if(state.playing)state.simDays+=state.speed*dt;

  /* 相机 */
  if(introT<1){
    introT=Math.min(1,introT+dt/2.8);
    const e=1-Math.pow(1-introT,3);
    cam.dist=lerp(1400,420,e);
    cam.phi=lerp(0.62,0.98,e);
    cam.theta+=dt*0.05*(1-e);
    cam.targetDist=420;
  }else{
    cam.dist+=(cam.targetDist-cam.dist)*(1-Math.exp(-dt*5));
    if(!(Math.abs(cam.vTheta)<1e-5))cam.theta+=cam.vTheta*= Math.exp(-dt*3.2);
    if(!(Math.abs(cam.vPhi)<1e-5))cam.phi=clamp(cam.phi+(cam.vPhi*=Math.exp(-dt*3.2)),0.12,Math.PI-0.12);
  }
  updateBodies();
  if(state.follow){
    const t=state.follow.pos,k=1-Math.exp(-dt*6);
    cam.center[0]+=(t[0]-cam.center[0])*k;
    cam.center[1]+=(t[1]-cam.center[1])*k;
    cam.center[2]+=(t[2]-cam.center[2])*k;
  }else{
    const k=1-Math.exp(-dt*4);
    cam.center[0]-=cam.center[0]*k;cam.center[1]-=cam.center[1]*k;cam.center[2]-=cam.center[2]*k;
  }
  cam.eye=camEye();

  render(now);
  updateLabels();
  updateClock();
  updateCardLive();
  requestAnimationFrame(frame);
}

/* ---------- 启动 ---------- */
async function boot(){
  resize();
  const steps=[
    ['正在测绘水星表面',()=>uploadTex('mercury',TEXGEN.mercury(512,256))],
    ['正在搅动金星云海',()=>uploadTex('venus',TEXGEN.venus(512,256))],
    ['正在灌注地球海洋',()=>uploadTex('earth',TEXGEN.earth(512,256))],
    ['正在点亮城市灯火',()=>uploadTex('earthNight',TEXGEN.earthNight(512,256))],
    ['正在铺展地球云层',()=>uploadTex('earthClouds',TEXGEN.earthClouds(512,256))],
    ['正在氧化火星大地',()=>uploadTex('mars',TEXGEN.mars(512,256))],
    ['正在编织木星条纹',()=>uploadTex('jupiter',TEXGEN.jupiter(512,256))],
    ['正在打磨土星光环',()=>{uploadTex('saturn',TEXGEN.saturn(512,256));uploadTex('saturnRing',TEXGEN.saturnRing(1024,4),gl.CLAMP_TO_EDGE);}],
    ['正在冷凝冰巨行星',()=>{uploadTex('uranus',TEXGEN.uranus(512,256));uploadTex('uranusRing',TEXGEN.uranusRing(1024,4),gl.CLAMP_TO_EDGE);uploadTex('neptune',TEXGEN.neptune(512,256));}],
    ['正在雕刻冥王星之心',()=>uploadTex('pluto',TEXGEN.pluto(256,128))],
    ['正在召集众卫星',()=>{uploadTex('moon',TEXGEN.moon(256,128));uploadTex('io',TEXGEN.io(256,128));uploadTex('europa',TEXGEN.europa(256,128));
      uploadTex('ganymede',TEXGEN.ganymede(256,128));uploadTex('callisto',TEXGEN.callisto(256,128));uploadTex('titan',TEXGEN.titan(256,128));}],
    ['正在泼洒银河',()=>uploadTex('sky',TEXGEN.sky(1024,512))],
    ['正在播撒小行星带',()=>{buildStars();buildBelt();buildTail();}],
    ['正在求解开普勒方程',()=>{
      for(const b of bodies){
        if(b.isPlanet){
          orbitLines.push({body:b,mesh:buildPlanetOrbit(b.id),color:hex2rgb(b.color),base:0.115,glow:0.55});
        }else if(b.isMoon){
          orbitLines.push({body:b,mesh:buildMoonOrbit(b),color:[0.6,0.68,0.8],base:0.10,glow:0.35});
        }else if(b.isComet){
          orbitLines.push({body:b,mesh:buildCometOrbit(),color:[0.4,0.65,0.85],base:0.09,glow:0.5});
        }
        if(b.ring)b.ringMesh=makeRingVao(b.ringIn,b.ringOut,160);
      }
    }]
  ];
  const bar=$('bootBar'),txt=$('bootTxt');
  for(let i=0;i<steps.length;i++){
    txt.textContent=steps[i][0];
    bar.style.width=((i+1)/steps.length*100).toFixed(0)+'%';
    await new Promise(r=>setTimeout(r,10));
    steps[i][1]();
  }
  makeLabels();setupUI();setupInput();
  updateBodies();
  requestAnimationFrame(t=>{lastT=t/1000;requestAnimationFrame(frame);});
  setTimeout(()=>$('boot').classList.add('off'),350);
}
function hex2rgb(hx){
  const n=parseInt(hx.slice(1),16);
  return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255];
}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fatal('WebGL 上下文丢失，请刷新页面。');});

/* 调试/游玩接口 */
window.SOLAR={state,bodies,bodyById,cam,
  focus:id=>focusBody(bodyById[id]),
  home:goHome,
  skipIntro:()=>{introT=1;},
  lon:id=>bodyById[id].lon};

boot();
