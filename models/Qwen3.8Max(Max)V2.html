<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }

  canvas { display: block; }

    position: fixed; inset: 0; display: none; place-items: center; z-index: 99;
    color: #9fb4e0; font-size: 14px; text-align: center; line-height: 2; background: #05070f;
  }

  .glass {
    background: rgba(10, 16, 32, 0.55);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(120, 160, 255, 0.18);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);

  #panel { position: fixed; top: 18px; left: 18px; width: 268px; padding: 16px 18px; color: #cfe0ff; z-index: 10; user-select: none; }

    font-size: 17px; font-weight: 700; letter-spacing: 2px;

    -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px;

    width: 100%; margin-top: 12px; padding: 7px 0; font-size: 13px; letter-spacing: 4px;

  #hint { position: fixed; bottom: 14px; right: 18px; color: #55689a; font-size: 11px; z-index: 5; pointer-events: none; }

  .planet-label {
    color: rgba(210,228,255,.9); font-size: 11px; letter-spacing: 2px; text-shadow: 0 0 6px rgba(0,20,60,.9), 0 0 12px rgba(80,140,255,.5);

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
window.__THREE_OK = true;

/* ---------------- 天体数据（真实周期 / 偏心率 / 轨道倾角） ---------------- */
const D2R = THREE.MathUtils.degToRad;
const PLANETS = [
  { name:'水星', en:'Mercury', r:4.2, a:72,  e:0.2056, period:87.97,   rot:1.35, phase:2.1, inc:7.0,  spin:0.017,  tilt:0.03, tex:'mercury',
    dia:'4,879 km', pd:'88 天', au:'0.39 AU', desc:'距太阳最近的行星，没有大气层缓冲，昼夜温差超过 600℃，表面布满与月球相似的撞击坑。' },
  { name:'金星', en:'Venus',   r:7.2, a:104, e:0.0068, period:224.70,  rot:2.30, phase:4.4, inc:3.39, spin:-0.004, tilt:2.6,  tex:'venus',
    dia:'12,104 km', pd:'225 天', au:'0.72 AU', desc:'被浓密二氧化碳大气与硫酸云覆盖，温室效应使其成为太阳系最炽热的行星，且自转方向与众不同（逆行）。' },
  { name:'地球', en:'Earth',   r:7.6, a:140, e:0.0167, period:365.25,  rot:1.80, phase:0.6, inc:0.0,  spin:1.0,    tilt:0.41, tex:'earth', moon:true,
    dia:'12,756 km', pd:'365.25 天', au:'1.00 AU', desc:'目前已知唯一孕育生命的星球，71% 的表面被液态水覆盖，拥有一颗天然卫星——月球。' },
  { name:'火星', en:'Mars',    r:5.4, a:180, e:0.0934, period:686.98,  rot:5.00, phase:3.3, inc:1.85, spin:0.97,   tilt:0.44, tex:'mars',
    dia:'6,792 km', pd:'687 天', au:'1.52 AU', desc:'因表面氧化铁而呈锈红色，拥有太阳系最高的火山奥林帕斯山与最深的水手号峡谷。' },
  { name:'木星', en:'Jupiter', r:19,  a:272, e:0.0489, period:4332.59, rot:0.25, phase:5.2, inc:1.30, spin:2.4,    tilt:0.05, tex:'jupiter',
    dia:'142,984 km', pd:'11.86 年', au:'5.20 AU', desc:'太阳系最大的行星，质量是其余七颗行星总和的 2.5 倍，大红斑是持续数百年的巨型风暴。' },
  { name:'土星', en:'Saturn',  r:16,  a:352, e:0.0565, period:10759.2, rot:1.60, phase:1.0, inc:2.49, spin:2.2,    tilt:0.47, tex:'saturn', ring:true,
    dia:'120,536 km', pd:'29.46 年', au:'9.58 AU', desc:'以壮丽的冰粒与岩石碎块构成的光环闻名，平均密度低于水，拥有上百颗卫星。' },
  { name:'天王星', en:'Uranus', r:11, a:428, e:0.0457, period:30688.5, rot:2.90, phase:3.9, inc:0.77, spin:1.4,    tilt:1.71, tex:'uranus',
    dia:'51,118 km', pd:'84 年', au:'19.2 AU', desc:'自转轴倾角近 98°，几乎是"躺着"绕太阳公转的冰巨星，大气中的甲烷使其呈青蓝色。' },
  { name:'海王星', en:'Neptune', r:10.6, a:498, e:0.0113, period:60182, rot:0.80, phase:5.8, inc:1.77, spin:1.5,   tilt:0.49, tex:'neptune',
    dia:'49,528 km', pd:'164.8 年', au:'30.1 AU', desc:'距太阳最远的行星，拥有太阳系最猛烈的风暴，风速可达每小时 2,100 公里。' },
];
const COMET = { name:'哈雷彗星', en:"Halley's Comet", a:560, e:0.86, period:27510, rot:2.1, phase:0.35, inc:9,
  dia:'~11 km', pd:'约 75.3 年', au:'17.8 AU', desc:'以天文学家埃德蒙·哈雷命名的周期彗星，每约 75 年回归一次，轨道高度椭圆且方向独特。' };
const SUN_INFO = { name:'太阳', en:'Sun', dia:'1,392,700 km', pd:'—', au:'—', desc:'太阳系的中心恒星，占据太阳系总质量的 99.86%，核心每秒将约 6 亿吨氢聚变为氦，释放光和热。' };

/* ---------------- 开普勒解算（2D 平面坐标 → 映射到 XZ 平面） ---------------- */
function keplerPos(body, days) {
  const M = (2 * Math.PI * days / body.period) + body.phase;
  let E = M;
  for (let i = 0; i < 7; i++) E = E - (E - body.e * Math.sin(E) - M) / (1 - body.e * Math.cos(E));
  const b = body.a * Math.sqrt(1 - body.e * body.e);
  const xo = body.a * (Math.cos(E) - body.e), yo = b * Math.sin(E);
  const c = Math.cos(body.rot), s = Math.sin(body.rot);
  return { x: xo * c - yo * s, z: xo * s + yo * c };
}
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------------- 场景基础 ---------------- */
const app = document.getElementById('app');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 30000);
camera.position.set(120, 420, 640);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;z-index:4;';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 12; controls.maxDistance = 4000;

/* 灯光：太阳点光源 + 微弱环境光 */
scene.add(new THREE.AmbientLight(0x1a2438, 1.2));
const sunLight = new THREE.PointLight(0xfff0d8, 3.2, 0, 0);
scene.add(sunLight);

/* 后期：辉光 Bloom */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.05, 0.65, 0.22);
composer.addPass(bloom);

/* ---------------- 程序化贴图 ---------------- */
function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4; return t;
}
function rocky(ctx, w, h, base, dark, light, seed) {
  const rnd = mulberry32(seed);
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    const r = rnd() * 9 + 1, x = rnd() * w, y = rnd() * h;
    ctx.fillStyle = (rnd() < 0.5 ? dark : light);
    ctx.globalAlpha = rnd() * 0.35 + 0.05;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function earthTex() {
  return canvasTex(1024, 512, (ctx, w, h) => {
    const rnd = mulberry32(42);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#0a2e66'); g.addColorStop(0.5, '#155a9e'); g.addColorStop(1, '#0a2e66');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (let c = 0; c < 14; c++) { // 大陆
      const cx = rnd() * w, cy = h * 0.18 + rnd() * h * 0.64;
      for (let i = 0; i < 46; i++) {
        const r = rnd() * 26 + 6;
        ctx.fillStyle = rnd() < 0.72 ? 'rgba(46,112,58,0.85)' : 'rgba(150,128,78,0.8)';
        ctx.beginPath(); ctx.arc((cx + (rnd() - 0.5) * 130 + w) % w, cy + (rnd() - 0.5) * 60, r, 0, 6.2832); ctx.fill();
      }
    }
    ctx.fillStyle = 'rgba(235,245,255,0.9)'; // 极冰
    ctx.fillRect(0, 0, w, h * 0.05); ctx.fillRect(0, h * 0.95, w, h * 0.05);
    for (let i = 0; i < 90; i++) { // 云
      ctx.fillStyle = 'rgba(255,255,255,' + (rnd() * 0.25 + 0.06) + ')';
      ctx.beginPath(); ctx.ellipse(rnd() * w, rnd() * h, rnd() * 46 + 12, rnd() * 7 + 2.5, 0, 0, 6.2832); ctx.fill();
    }
  });
}
function gasTex(bands, seed, spot) {
  return canvasTex(1024, 512, (ctx, w, h) => {
    const rnd = mulberry32(seed);
    const bh = h / bands.length;
    bands.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(0, i * bh - 1, w, bh + 2); });
    for (let i = 0; i < 1500; i++) { // 湍流条纹
      const y = rnd() * h, bi = Math.min(bands.length - 1, (y / bh) | 0);
      ctx.globalAlpha = rnd() * 0.30 + 0.04;
      ctx.fillStyle = rnd() < 0.5 ? bands[bi] : (rnd() < 0.5 ? '#ffffff' : '#3a2410');
      const ww = rnd() * 160 + 30;
      ctx.beginPath(); ctx.ellipse(rnd() * w, y + Math.sin(rnd() * 9) * 4, ww, rnd() * 4 + 1.2, 0, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (spot) { // 大红斑
      const g = ctx.createRadialGradient(w * 0.68, h * 0.63, 4, w * 0.68, h * 0.63, 46);
      g.addColorStop(0, 'rgba(210,80,45,0.95)'); g.addColorStop(0.7, 'rgba(190,70,40,0.7)'); g.addColorStop(1, 'rgba(190,70,40,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(w * 0.68, h * 0.63, 52, 26, 0, 0, 6.2832); ctx.fill();
    }
  });
}
const TEX = {
  mercury: () => canvasTex(512, 256, (c, w, h) => rocky(c, w, h, '#9a9088', '#4d463f', '#c9bfb2', 11)),
  venus:   () => canvasTex(512, 256, (c, w, h) => { rocky(c, w, h, '#d9a95e', '#a87430', '#f2d9a0', 22); }),
  earth:   earthTex,
  mars:    () => canvasTex(512, 256, (c, w, h) => { rocky(c, w, h, '#c1552e', '#6e2812', '#e8926a', 33);
    c.fillStyle = 'rgba(240,240,235,0.85)'; c.fillRect(0, 0, w, 9); c.fillRect(0, h - 9, w, 9); }),
  jupiter: () => gasTex(['#c8a878','#e8d5b0','#a87948','#e0c898','#8a5c34','#d8b880','#b08858','#e8d8b8','#9a6c40','#d0b080'], 44, true),
  saturn:  () => gasTex(['#d8c090','#ecdcb0','#c0a468','#e8d8a8','#b09458','#e0d0a0','#c8ac70'], 55, false),
  uranus:  () => gasTex(['#7fd0cc','#92dcd6','#6ec4c2','#a0e4de','#82d2cc'], 66, false),
  neptune: () => gasTex(['#2f5fc4','#4478d8','#2850a8','#5488e0','#3060b8'], 77, false),
};
function glowSprite(color, size) {
  const t = canvasTex(256, 256, (ctx) => {
    const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, color + '0.85)'); g.addColorStop(0.25, color + '0.35)'); g.addColorStop(1, color + '0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  });
  const m = new THREE.SpriteMaterial({ map: t, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
  const s = new THREE.Sprite(m); s.scale.setScalar(size); return s;
}

/* ---------------- 太阳（噪声着色器 + 光晕） ---------------- */
const sunUniforms = { time: { value: 0 } };
const sunMat = new THREE.ShaderMaterial({
  uniforms: sunUniforms,
  vertexShader: `
    varying vec3 vPos; varying vec3 vN; varying vec3 vW;
    void main(){ vPos = position; vN = normalize(normalMatrix * normal);
      vec4 wp = modelMatrix * vec4(position,1.0); vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `
    uniform float time; varying vec3 vPos; varying vec3 vN; varying vec3 vW;
    float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }
    float noise(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      float a=hash(i), b=hash(i+vec3(1,0,0)), c=hash(i+vec3(0,1,0)), d=hash(i+vec3(1,1,0));
      float e=hash(i+vec3(0,0,1)), g=hash(i+vec3(1,0,1)), k=hash(i+vec3(0,1,1)), l=hash(i+vec3(1,1,1));
      return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y), mix(mix(e,g,f.x),mix(k,l,f.x),f.y), f.z); }
    float fbm(vec3 p){ float v=0.0, amp=0.5; for(int i=0;i<5;i++){ v+=amp*noise(p); p*=2.15; amp*=0.5; } return v; }
    void main(){
      float n1 = fbm(vPos*0.10 + vec3(time*0.16, time*0.09, 0.0));
      float n2 = fbm(vPos*0.24 - vec3(0.0, time*0.12, time*0.05));
      vec3 hot = vec3(1.0,0.96,0.78), mid = vec3(1.0,0.60,0.14), cool = vec3(0.86,0.26,0.03);
      vec3 col = mix(mid, hot, smoothstep(0.42, 0.8, n1));
      col = mix(col, cool, smoothstep(0.62, 0.30, n2)*0.45);
      vec3 viewDir = normalize(cameraPosition - vW);
      float rim = pow(1.0 - abs(dot(normalize(vN), viewDir)), 2.2);
      col += rim * vec3(1.0,0.55,0.18) * 1.4;
      gl_FragColor = vec4(col * 1.9, 1.0);
    }`
});
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(30, 64, 64), sunMat);
sunMesh.userData.info = SUN_INFO; sunMesh.userData.followKey = 'sun';
scene.add(sunMesh);
scene.add(glowSprite('rgba(255,190,90,', 260));
const flare = glowSprite('rgba(255,230,170,', 110); scene.add(flare);

/* ---------------- 星空 ---------------- */
(function stars() {
  const N = 4200, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const rnd = mulberry32(2026), c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const R = 3600 + rnd() * 3600, th = rnd() * Math.PI * 2, ph = Math.acos(2 * rnd() - 1);
    pos[i*3] = R * Math.sin(ph) * Math.cos(th); pos[i*3+1] = R * Math.cos(ph); pos[i*3+2] = R * Math.sin(ph) * Math.sin(th);
    const t = rnd(); c.set(t < 0.12 ? 0xffd8a8 : (t < 0.3 ? 0xa8c4ff : 0xffffff));
    const lum = 0.35 + rnd() * 0.65;
    col[i*3] = c.r * lum; col[i*3+1] = c.g * lum; col[i*3+2] = c.b * lum;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: 3.2, vertexColors: true, transparent: true, opacity: 0.95, sizeAttenuation: false, depthWrite: false });
  scene.add(new THREE.Points(geo, mat));
})();

/* ---------------- 行星构建 ---------------- */
const planetObjs = [];   // { data, group(倾角组), mesh, sys(自转系统), label }
const orbitLines = [];
function addLabel(parent, text, dy) {
  const div = document.createElement('div');
  div.className = 'planet-label'; div.textContent = text;
  const lab = new CSS2DObject(div); lab.position.set(0, dy, 0);
  parent.add(lab); return lab;
}
for (const p of PLANETS) {
  const group = new THREE.Group();              // 轨道倾角组
  group.rotation.x = D2R(p.inc);
  scene.add(group);

  // 轨道线
  const pts = [];
  for (let i = 0; i <= 256; i++) {
    const th = i / 256 * Math.PI * 2, b = p.a * Math.sqrt(1 - p.e * p.e);
    const xo = p.a * Math.cos(th) - p.a * p.e, yo = b * Math.sin(th);
    const c = Math.cos(p.rot), s = Math.sin(p.rot);
    pts.push(new THREE.Vector3(xo * c - yo * s, 0, xo * s + yo * c));
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x5a82e0, transparent: true, opacity: 0.28 })
  );
  group.add(line); orbitLines.push(line);

  // 行星本体（自转系统组 + 轴倾角）
  const sys = new THREE.Group(); sys.rotation.z = p.tilt;
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.r, 48, 48),
    new THREE.MeshStandardMaterial({ map: TEX[p.tex](), roughness: 0.92, metalness: 0.02 })
  );
  mesh.userData.info = p; mesh.userData.followKey = p.name;
  sys.add(mesh); group.add(sys);

  // 土星环
  if (p.ring) {
    const inner = p.r * 1.4, outer = p.r * 2.35;
    const rg = new THREE.RingGeometry(inner, outer, 160, 1);
    const uv = rg.attributes.uv, posA = rg.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < uv.count; i++) { // UV 按半径映射
      v.fromBufferAttribute(posA, i);
      uv.setXY(i, (v.length() - inner) / (outer - inner), 0.5);
    }
    const ringTex = canvasTex(512, 16, (ctx, w) => {
      const segs = [[0,0.08,0.15],[0.08,0.3,0.75],[0.3,0.36,0.2],[0.36,0.62,0.9],[0.62,0.66,0.1],[0.66,0.86,0.6],[0.86,1,0.3]];
      for (const [a, b, al] of segs) {
        const g = ctx.createLinearGradient(a * w, 0, b * w, 0);
        g.addColorStop(0, 'rgba(216,197,152,0)'); g.addColorStop(0.5, `rgba(226,208,164,${al})`); g.addColorStop(1, 'rgba(216,197,152,0)');
        ctx.fillStyle = g; ctx.fillRect(a * w, 0, (b - a) * w + 1, 16);
      }
    });
    const ring = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({ map: ringTex, side: THREE.DoubleSide, transparent: true, depthWrite: false }));
    ring.rotation.x = Math.PI / 2;
    sys.add(ring);
  }
  // 月球
  let moonMesh = null;
  if (p.moon) {
    moonMesh = new THREE.Mesh(new THREE.SphereGeometry(2.1, 24, 24),
      new THREE.MeshStandardMaterial({ map: TEX.mercury(), roughness: 1, color: 0xbfbfb8 }));
    group.add(moonMesh);
  }
  addLabel(sys, p.name, p.r + 7);
  planetObjs.push({ data: p, group, sys, mesh, moonMesh });
}

/* ---------------- 小行星带 ---------------- */
const BELT_N = 900;
const beltGeo = new THREE.BufferGeometry();
const beltPos = new Float32Array(BELT_N * 3);
const beltData = [];
{ const rnd = mulberry32(777);
  for (let i = 0; i < BELT_N; i++) {
    const a = 208 + rnd() * 46;
    beltData.push({ a, ang: rnd() * 6.2832, y: (rnd() - 0.5) * 7, rate: 6.2832 / (1600 * Math.pow(a / 225, 1.5)) });
  }
}
beltGeo.setAttribute('position', new THREE.BufferAttribute(beltPos, 3));
const beltPts = new THREE.Points(beltGeo, new THREE.PointsMaterial({ color: 0xa89880, size: 1.4, transparent: true, opacity: 0.75, depthWrite: false }));
scene.add(beltPts);

/* ---------------- 哈雷彗星（彗核 + 双尾） ---------------- */
const cometGroup = new THREE.Group();
cometGroup.rotation.x = D2R(COMET.inc);
scene.add(cometGroup);
const cometOrbit = (() => {
  const pts = [], b = COMET.a * Math.sqrt(1 - COMET.e * COMET.e);
  for (let i = 0; i <= 256; i++) {
    const th = i / 256 * 6.2832;
    const xo = COMET.a * Math.cos(th) - COMET.a * COMET.e, yo = b * Math.sin(th);
    const c = Math.cos(COMET.rot), s = Math.sin(COMET.rot);
    pts.push(new THREE.Vector3(xo * c - yo * s, 0, xo * s + yo * c));
  }
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x7fc8e8, transparent: true, opacity: 0.16 }));
  cometGroup.add(l); orbitLines.push(l); return l;
})();
function tailTexture(rgb) {
  return canvasTex(256, 64, (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, `rgba(${rgb},0.85)`); g.addColorStop(0.35, `rgba(${rgb},0.35)`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const gv = ctx.createLinearGradient(0, 0, 0, h);
    gv.addColorStop(0, 'rgba(0,0,0,1)'); gv.addColorStop(0.5, 'rgba(255,255,255,0)'); gv.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = gv; ctx.fillRect(0, 0, w, h);
  });
}
const cometCore = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 16), new THREE.MeshBasicMaterial({ color: 0xeaf6ff }));
cometCore.userData.info = COMET; cometCore.userData.followKey = COMET.name;
const coma = glowSprite('rgba(190,228,255,', 26);
const tailIon = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: tailTexture('150,215,255'), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
const tailDust = tailIon.clone();
tailDust.material = tailIon.material.clone(); tailDust.material.map = tailTexture('255,225,170');
cometGroup.add(cometCore, coma, tailIon, tailDust);

/* ---------------- 状态与 UI ---------------- */
let simDays = 0, timeScale = 30, playing = true, spinOn = true;
const show = { orbit: true, label: true, belt: true };
let followKey = null; const prevFollow = new THREE.Vector3();
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();

const speedSlider = document.getElementById('speed'), speedVal = document.getElementById('speedVal');
function sliderToSpeed(v) { return Math.round(Math.pow(10, v / 100 * 3.3) / 5) * 5 || 1; }
speedSlider.addEventListener('input', () => {
  timeScale = sliderToSpeed(+speedSlider.value);
  speedVal.textContent = timeScale >= 365 ? (timeScale / 365.25).toFixed(1) + ' 年/秒' : timeScale + ' 天/秒';
});
timeScale = sliderToSpeed(42); speedVal.textContent = timeScale + ' 天/秒';

const playBtn = document.getElementById('playBtn');
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '暂 停' : '播 放'; };
document.getElementById('tOrbit').onchange = e => { show.orbit = e.target.checked; orbitLines.forEach(l => l.visible = show.orbit); };
document.getElementById('tLabel').onchange = e => { show.label = e.target.checked; labelRenderer.domElement.style.display = show.label ? '' : 'none'; };
document.getElementById('tBelt').onchange = e => { show.belt = e.target.checked; beltPts.visible = show.belt; };
document.getElementById('tSpin').onchange = e => spinOn = e.target.checked;

const infoCard = document.getElementById('infoCard');
function showInfo(d) {
  document.getElementById('iName').textContent = d.name;
  document.getElementById('iEn').textContent = d.en;
  document.getElementById('iDia').textContent = d.dia;
  document.getElementById('iPeriod').textContent = d.pd;
  document.getElementById('iAU').textContent = d.au;
  document.getElementById('iDesc').textContent = d.desc;
  infoCard.classList.add('show');
}
document.getElementById('infoClose').onclick = () => { infoCard.classList.remove('show'); followKey = null; setActiveBtn(null); };

const btnWrap = document.getElementById('planetBtns'), btnMap = {};
for (const key of ['sun', ...PLANETS.map(p => p.name), COMET.name]) {
  const b = document.createElement('button');
  b.textContent = key === 'sun' ? '太阳' : key;
  b.onclick = () => focusBody(key);
  btnWrap.appendChild(b); btnMap[key] = b;
}
function setActiveBtn(k) { for (const key in btnMap) btnMap[key].classList.toggle('active', key === k); }
function getWorldPos(key, out) {
  if (key === 'sun') return out.set(0, 0, 0);
  if (key === COMET.name) return cometCore.getWorldPosition(out);
  return planetObjs.find(o => o.data.name === key).mesh.getWorldPosition(out);
}
function focusBody(key) {
  followKey = key; setActiveBtn(key);
  getWorldPos(key, prevFollow);
  const target = getWorldPos(key, tmpV).clone();
  const r = key === 'sun' ? 30 : (PLANETS.find(p => p.name === key)?.r ?? 4);
  const dir = camera.position.clone().sub(target).normalize();
  const dist = Math.min(Math.max(r * 9, 46), camera.position.distanceTo(target));
  camera.position.copy(target).addScaledVector(dir, dist);
  controls.target.copy(target);
  showInfo(key === 'sun' ? SUN_INFO : key === COMET.name ? COMET : PLANETS.find(p => p.name === key));
}

/* 点击拾取 */
const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);
  const targets = [sunMesh, cometCore, ...planetObjs.map(o => o.mesh)];
  const hits = raycaster.intersectObjects(targets, false);
  if (hits.length) focusBody(hits[0].object.userData.followKey);
});

/* ---------------- 主循环 ---------------- */
const clockDate = document.getElementById('clockDate'), clockElapsed = document.getElementById('clockElapsed');
const startMs = new Date(2026, 0, 1).getTime();
let clockTick = 0;
const lastT = { v: performance.now() };

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now(), dt = Math.min((now - lastT.v) / 1000, 0.1); lastT.v = now;
  if (playing) simDays += timeScale * dt;
  const t = now / 1000;

  sunUniforms.time.value = t;
  sunMesh.rotation.y = t * 0.05;

  for (const o of planetObjs) {
    const p = o.data, pos = keplerPos(p, simDays);
    o.sys.position.set(pos.x, 0, pos.z);
    if (spinOn) o.mesh.rotation.y = simDays * p.spin * 0.6;
    if (o.moonMesh) {
      const ma = simDays / 27.3 * 6.2832 + 1.2, md = p.r + 11;
      o.moonMesh.position.set(pos.x + Math.cos(ma) * md, 0, pos.z + Math.sin(ma) * md);
      o.moonMesh.rotation.y = ma;
    }
  }

  // 小行星带
  if (show.belt) {
    for (let i = 0; i < BELT_N; i++) {
      const d = beltData[i], ang = d.ang + simDays * d.rate;
      beltPos[i*3] = Math.cos(ang) * d.a; beltPos[i*3+1] = d.y; beltPos[i*3+2] = Math.sin(ang) * d.a;
    }
    beltGeo.attributes.position.needsUpdate = true;
  }

  // 彗星
  const cp = keplerPos(COMET, simDays);
  cometCore.position.set(cp.x, 0, cp.z);
  coma.position.copy(cometCore.position);
  const dist = Math.hypot(cp.x, cp.z);
  const heat = Math.max(0, 1 - dist / 420);
  coma.scale.setScalar(6 + heat * 26);
  const tailLen = 20 + heat * heat * 260;
  if (tailLen > 24) {
    tmpV.set(cp.x, 0, cp.z).normalize();                     // 背日方向（局部系近似）
    tmpV2.copy(camera.position).sub(cometCore.position).normalize();
    const n = tmpV.clone().cross(tmpV2).normalize();
    const yDir = n.clone().cross(tmpV).normalize();
    const m = new THREE.Matrix4().makeBasis(tmpV, yDir, n);
    tailIon.quaternion.setFromRotationMatrix(m);
    tailIon.scale.set(tailLen * 1.3, 5 + heat * 9, 1);
    tailIon.position.copy(cometCore.position).addScaledVector(tmpV, tailLen * 0.65);
    const bend = tmpV.clone().applyAxisAngle(yDir, 0.22);
    const m2 = new THREE.Matrix4().makeBasis(bend, yDir, n);
    tailDust.quaternion.setFromRotationMatrix(m2);
    tailDust.scale.set(tailLen, 7 + heat * 12, 1);
    tailDust.position.copy(cometCore.position).addScaledVector(bend, tailLen * 0.5);
    tailIon.visible = tailDust.visible = true;
  } else { tailIon.visible = tailDust.visible = false; }

  // 相机跟随
  if (followKey) {
    getWorldPos(followKey, tmpV);
    tmpV2.copy(tmpV).sub(prevFollow);
    camera.position.add(tmpV2); controls.target.add(tmpV2);
    prevFollow.copy(tmpV);
  }
  controls.update();

  composer.render();
  labelRenderer.render(scene, camera);

  if (++clockTick % 6 === 0) {
    const d = new Date(startMs + simDays * 86400000);
    clockDate.textContent = d.getFullYear() < 9999 ? d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日' : '遥远的未来…';
    clockElapsed.textContent = '已运行 ' + Math.floor(simDays / 365.25) + ' 年 ' + Math.floor(simDays % 365.25) + ' 天';
  }
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
frame();
</script>
