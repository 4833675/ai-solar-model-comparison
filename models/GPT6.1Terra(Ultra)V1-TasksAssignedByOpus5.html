  const sun={id:'sun',name:'太阳',type:'sun',radius:696340,mass:'1.989×10³⁰',period:'—',moons:'—',temp:'5,772 K',tilt:0,poleLon:0,rotH:609.12,textbookTilt:'7.25°',atmosphere:'氢、氦',description:'太阳是太阳系的恒星，质量占整个太阳系的绝大部分。它的光和热驱动行星气候，也照亮了遥远的世界。'};
  // a, e, I, L, longitude of perihelion, longitude of ascending node and their rates / century.
  const rows=[
 ['mercury','水星',2439.7,'3.30×10²³','87.97 天',0,'−173 ~ 427 ℃',7,318.4,1407.6,'0.03°','极稀薄的氧、钠等','水星是离太阳最近的行星，布满撞击坑。稀薄的大气无法有效保温，因此昼夜温差很大。',[.38709927,.20563593,7.00497902,252.25032350,77.45779628,48.33076593],[.00000037,.00001906,-.00594749,149472.67411175,.16047689,-.12534081]],
 ['venus','金星',6051.8,'4.87×10²⁴','224.70 天',0,'464 ℃',177.4,211.2,-5832.5,'177.4°','二氧化碳、氮','厚重的二氧化碳大气造成强烈温室效应。金星的自转方向与大多数行星相反。',[.72333566,.00677672,3.39467605,181.97909950,131.60246718,76.67984255],[.00000390,-.00004107,-.00078890,58517.81538729,.00268329,-.27769418]],
 ['earth','地球',6371,'5.972×10²⁴','365.256 天',1,'−89 ~ 57 ℃',23.44,90,23.9345,'23.44°','氮、氧','地球表面大部分被液态水覆盖。大气与磁场共同保护着地表环境。',[1.00000261,.01671123,-.00001531,100.46457166,102.93768193,0],[.00000562,-.00004392,-.01294668,35999.37244981,.32327364,0]],
 ['mars','火星',3389.5,'6.42×10²³','686.98 天',2,'−143 ~ 35 ℃',26.76,352.9,24.6229,'25.19°','二氧化碳、氮、氩','火星的红色来自表面富含铁的尘埃。南方古老高地与北方较年轻平原形成鲜明对比。',[1.52371034,.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891],[.00001847,.00007882,-.00813131,19140.30268499,.44441088,-.29257343]],
 ['jupiter','木星',69911,'1.898×10²⁷','11.86 年',95,'−108 ℃',2.25,247.8,9.925,'3.13°','氢、氦','木星是太阳系最大的行星。它的大红斑是一场持续了数百年的巨大风暴。',[5.20288700,.04838624,1.30439695,34.39644051,14.72847983,100.47390909],[-.00011607,-.00013253,-.00183714,3034.74612775,.21252668,.20469106]],
 ['saturn','土星',58232,'5.683×10²⁶','29.46 年',274,'−139 ℃',28.06,79.5,10.656,'26.73°','氢、氦','土星由气体构成，拥有太阳系最壮观的环系。环由大量冰粒和岩石碎片组成。',[9.53667594,.05386179,2.48599187,49.95424423,92.59887831,113.66242448],[-.00125060,-.00050991,.00193609,1222.49362201,-.41897216,-.28867794]],
 ['uranus','天王星',25362,'8.68×10²⁵','84.01 年',28,'−195 ℃',97.77,77.7,-17.24,'97.77°','氢、氦、甲烷','天王星的自转轴几乎横躺在轨道平面内。大气中的甲烷吸收红光，让它呈现青蓝色。',[19.18916464,.04725744,.77263783,313.23810451,170.95427630,74.01692503],[-.00196176,-.00004397,-.00242939,428.48202785,.40805281,.04240589]],
 ['neptune','海王星',24622,'1.024×10²⁶','164.8 年',16,'−201 ℃',28.02,319.3,16.11,'28.32°','氢、氦、甲烷','海王星是最远的行星，拥有太阳系中最快的一些风。甲烷让它呈现深蓝色。',[30.06992276,.00859048,1.77004347,-55.12002969,44.96476227,131.78422574],[.00026291,.00005105,.00035372,218.45945325,-.32241464,-.00508664]],
 ['pluto','冥王星',1188.3,'1.303×10²²','247.9 年',5,'−233 ~ −223 ℃',112.8,137.4,-153.29,'119.6°','氮、甲烷、一氧化碳','冥王星是柯伊伯带中的矮行星，其偏心且倾斜的轨道有时比海王星更靠近太阳。表面分布着氮冰平原和暗色地区。',[39.48211675,.24882730,17.14001206,238.92903833,224.06891629,110.30393684],[-.00031596,.00005170,.00004818,145.20780515,-.04062942,-.01183482]]
 ];
 const planets=rows.map(r=>({id:r[0],name:r[1],type:r[0]==='pluto'?'dwarf':'planet',radius:r[2],mass:r[3],period:r[4],moons:r[5],temp:r[6],tilt:r[7],poleLon:r[8],rotH:r[9],textbookTilt:r[10],atmosphere:r[11],description:r[12],elements:r[13],rates:r[14]}));
 const moonRows=[
 ['moon','月球','earth',1737.4,384400,27.32166,5.145,'ecliptic','地球唯一的天然卫星，其表面的暗色月海是古老的玄武岩平原。'],
 ['io','木卫一 · Io','jupiter',1821.6,421700,1.769138,.05,'equator','木卫一是太阳系火山活动最剧烈的天体。木星和邻近卫星产生的潮汐作用不断加热它。'],
 ['europa','木卫二 · Europa','jupiter',1560.8,671034,3.551181,.47,'equator','木卫二的冰壳表面布满裂纹，冰壳下可能存在全球性海洋。'],
 ['ganymede','木卫三 · Ganymede','jupiter',2634.1,1070412,7.154553,.20,'equator','木卫三是太阳系最大的卫星，也是已知唯一具有自身磁场的卫星。'],
 ['callisto','木卫四 · Callisto','jupiter',2410.3,1882709,16.6890,.19,'equator','木卫四遍布古老撞击坑，保留了太阳系早期的地质记录。'],
 ['titan','土卫六 · Titan','saturn',2574.7,1221870,15.945,.35,'equator','土卫六拥有浓厚大气，表面有液态甲烷和乙烷形成的湖泊。'],
 ['triton','海卫一 · Triton','neptune',1353.4,354759,-5.876854,156.9,'equator','海卫一逆行绕海王星运行，可能曾是被捕获的柯伊伯带天体。'],
 ['charon','冥卫一 · Charon','pluto',606,19591,6.3872,.08,'equator','冥卫一与冥王星构成紧密的双天体系统，两者始终以同一面相对。']
 ];
 const moons=moonRows.map((r,i)=>({id:r[0],name:r[1],type:'moon',parent:r[2],radius:r[3],orbitKm:r[4],periodDays:r[5],period:Math.abs(r[5])+' 天'+(r[5]<0?'（逆行）':''),inclination:r[6],reference:r[7],description:r[8],mass:'—',moons:'—',temp:'—',tilt:0,poleLon:0,rotH:r[5]*24,textbookTilt:'—',atmosphere:'—',phase:i*1.63}));
 const comet={id:'halley',name:'哈雷彗星',type:'comet',radius:5.5,mass:'—',period:'75.32 年',moons:'—',temp:'—',tilt:0,poleLon:0,rotH:126,textbookTilt:'—',atmosphere:'—',description:'哈雷彗星约每 75 年回到内太阳系。接近太阳时，冰与尘埃升华形成彗发与背向太阳的彗尾。',elements:[17.834,.96714,162.26,0,169.75,58.42],rates:[0,0,0,0,0,0],tp:2446470.96,periodDays:27512.6};
 const bodies=[sun,...planets,...moons,comet], byId=Object.fromEntries(bodies.map(b=>[b.id,b]));
 function norm(x){return ((x+Math.PI)%TAU+TAU)%TAU-Math.PI}
 function kepler(M,e){M=norm(M);let E=M+e*Math.sin(M)*(1+e*Math.cos(M));for(let i=0;i<10;i++){let d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-13)break}return E}
 function elementsAt(b,jd){const T=(jd-J2000)/36525;const v=b.elements.map((x,i)=>x+b.rates[i]*T);return {a:v[0],e:v[1],I:v[2],L:v[3],peri:v[4],node:v[5],omega:v[4]-v[5],M:b.type==='comet'?TAU*(jd-b.tp)/b.periodDays:(v[3]-v[4])*D}}
 function orbitPoint(b,jd,E){const q=elementsAt(b,jd),w=q.omega*D,o=q.node*D,i=q.I*D;const x=q.a*(Math.cos(E)-q.e),y=q.a*Math.sqrt(1-q.e*q.e)*Math.sin(E),cw=Math.cos(w),sw=Math.sin(w),co=Math.cos(o),so=Math.sin(o),ci=Math.cos(i),si=Math.sin(i);return [(cw*co-sw*so*ci)*x+(-sw*co-cw*so*ci)*y,(cw*so+sw*co*ci)*x+(-sw*so+cw*co*ci)*y,sw*si*x+cw*si*y]}

function speedText(){let s=speedDays()*86400,sign=s<0?'−':'';s=Math.abs(s);if(Math.abs(speed)<1)return '实时';if(s<60)return sign+fmt(s,1)+' 秒/秒';if(s<3600)return sign+fmt(s/60,1)+' 分/秒';if(s<86400)return sign+fmt(s/3600,1)+' 时/秒';if(s<31557600)return sign+fmt(s/86400,1)+' 天/秒';return sign+fmt(s/31557600,1)+' 年/秒'}

document.querySelectorAll('[data-option]').forEach(el=>el.onclick=()=>{let key=el.dataset.option;options[key]=!options[key];el.classList.toggle('active',options[key]);if(key==='linear')document.querySelector('.footer-note strong').textContent=options.linear?'距离采用真实比例':'距离采用视觉压缩';if(key==='moons'&&!options.moons&&Astro.byId[selected].type==='moon')focus(Astro.byId[selected].parent);if(key==='comet'&&!options.comet&&selected==='halley')focus('sun')});
window.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.code==='Space'){e.preventDefault();$('#play').click()}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();speed=Math.max(-100,Math.min(100,speed+(e.key==='ArrowRight'?1:-1)));$('#speed').value=speed;$('#speedLabel').textContent=speedText()}else if(e.key.toLowerCase()==='h')document.body.classList.toggle('ui-hidden')});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1)drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,moved:false};if(pointers.size===2){let a=[...pointers.values()];pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(drag)drag.moved=true}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let a=[...pointers.values()],n=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch)camera.desiredDistance=Math.max(2,Math.min(4000,camera.desiredDistance*pinch/n));pinch=n}else if(drag){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;camera.yaw-=dx*.006;camera.pitch=Math.max(-1.5,Math.min(1.5,camera.pitch+dy*.006));if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>4)drag.moved=true;drag.x=e.clientX;drag.y=e.clientY}});
canvas.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(drag&&!drag.moved){let best=null,dist=Infinity;for(const b of displayBodies){const p=renderer.project(b.position);if(!p||!p.visible)continue;let d=Math.hypot(p.x-e.clientX,p.y-e.clientY),screenRadius=b.radius*canvas.clientHeight/(.8284*Math.max(p.depth,.001));if(d<Math.max(18,screenRadius)&&d<dist){dist=d;best=b.id}}if(best)focus(best)}if(!pointers.size)drag=null});canvas.addEventListener('wheel',e=>{e.preventDefault();camera.desiredDistance=Math.max(2,Math.min(4000,camera.desiredDistance*Math.exp(e.deltaY*.001)))},{passive:false});
function makeOrbits(){let key=Math.round(jd/30)+'/'+compression.toFixed(4);if(key===orbitsKey)return;orbitsKey=key;orbitCache={};for(let b of [...Astro.planets,Astro.comet]){let pts=[];for(let i=0;i<=180;i++)pts.push(Astro.display(Astro.orbitPoint(b,jd,i*Math.PI*2/180),compression));orbitCache[b.id]=pts}}
function render(t){let dt=Math.min(.1,(t-last)/1000);last=t;let delta=playing?dt*speedDays():0;jd+=delta;let goal=options.linear?1:.62;compression+=(goal-compression)*Math.min(1,dt*8);if(Math.abs(goal-compression)<.0001)compression=goal;makeOrbits();displayBodies=[];for(const b of Astro.bodies){if(b.type==='moon'&&!options.moons||b.type==='comet'&&!options.comet)continue;phase[b.id]=(phase[b.id]||0)+Math.max(-.22,Math.min(.22,2*Math.PI*delta/(b.rotH/24||1)));displayBodies.push({id:b.id,name:b.name,position:worldPos(b),radius:radius(b),axis:Astro.world(Astro.pole(b)),phase:phase[b.id],distanceAU:Math.hypot(...Astro.position(b,jd)),orbit:orbitCache[b.id]||null,orbitPhase:b.elements?((Astro.kepler(Astro.elementsAt(b,jd).M,Astro.elementsAt(b,jd).e)/Astro.TAU)%1+1)%1:0,selected:b.id===selected})}
let targetBody=displayBodies.find(b=>b.id===selected)||displayBodies[0],k=1-Math.exp(-dt*5);camera.target=camera.target.map((x,i)=>x+(targetBody.position[i]-x)*k);camera.distance+=(camera.desiredDistance-camera.distance)*k;let cp=Math.cos(camera.pitch),eye=add(camera.target,[Math.sin(camera.yaw)*cp*camera.distance,Math.sin(camera.pitch)*camera.distance,Math.cos(camera.yaw)*cp*camera.distance]);renderer.render({jd,bodies:displayBodies,camera:{eye,target:camera.target},options,compress:compression});if(options.labels){let s='';for(const b of displayBodies){let p=renderer.project(b.position);if(p&&p.visible&&p.x>0&&p.y>0&&p.x<innerWidth&&p.y<innerHeight)s+=`<span class="planet-label" style="left:${p.x}px;top:${p.y}px;opacity:${b.id===selected?1:Math.min(.8,Math.max(.18,b.radius*canvas.clientHeight/(.8284*Math.max(p.depth,.001))/5))}">${b.name}</span>`}labels.innerHTML=s}else labels.innerHTML='';if(t-lastUI>250){updateInfo();lastUI=t}requestAnimationFrame(render)}
window.addEventListener('resize',()=>renderer.resize());buildList();updateInfo();renderer.resize();requestAnimationFrame(render);
})();
