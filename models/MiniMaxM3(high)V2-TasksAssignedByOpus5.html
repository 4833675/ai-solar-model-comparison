/* ============================================================================
 * §12 轨道采样 (用于轨道缎带)
 * ============================================================================ */
function buildOrbitRibbons(){
  ORBIT_RIBBONS.length = 0;
  const planets = ['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune','pluto'];
  const samples = 256;
  for (const k of planets){
    const arr = new Float32Array(samples * 5);
    const elem = ELEMENTS[k];
    for (let i = 0; i < samples; i++){
      const u = i / samples;
      const M = TWO_PI * u;
      const e = elem.e0;
      const E = solveKepler(M, e);
      const cosE = Math.cos(E), sinE = Math.sin(E);
      const sqrt1me2 = Math.sqrt(1 - e*e);
      const xP = elem.a0 * (cosE - e);
      const yP = elem.a0 * sqrt1me2 * sinE;
      const I = elem.I0 * RAD;
      const Om = elem.O0 * RAD;
      const w = (elem.w0 - elem.O0) * RAD;
      const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I),sI=Math.sin(I);
      const x=(cw*cO-sw*sO*cI)*xP+(-sw*cO-cw*sO*cI)*yP;
      const y=(cw*sO+sw*cO*cI)*xP+(-sw*sO+cw*cO*cI)*yP;
      const z=(sw*sI)*xP+(cw*sI)*yP;
      arr[i*5]   = dispR(x);
      arr[i*5+1] = dispR(z);
      arr[i*5+2] = dispR(-y);
      arr[i*5+3] = -1;     // side placeholder
      arr[i*5+4] = u;      // arc
    }
    ORBIT_RIBBONS.push({ key:k, samples, arr });
  }
}

// 给定一个 (samples*5) 数组 (pos.xyz + side + arc), 创建动态 VAO
function makeOrbitVAO(ribbon){
  if (ribbon.vao) gl.deleteVertexArray(ribbon.vao);
  if (ribbon.buf) gl.deleteBuffer(ribbon.buf);
  // 扩展为 triangle strip: 每个 sample 两个顶点 (side=-1, side=+1)
  const n = ribbon.samples;
  const expanded = new Float32Array(n * 2 * 5);
  for (let i = 0; i < n; i++){
    const o = i * 5;
    expanded[(i*2)*5+0] = ribbon.arr[o+0];
    expanded[(i*2)*5+1] = ribbon.arr[o+1];
    expanded[(i*2)*5+2] = ribbon.arr[o+2];
    expanded[(i*2)*5+3] = -1;
    expanded[(i*2)*5+4] = ribbon.arr[o+4];
    expanded[(i*2+1)*5+0] = ribbon.arr[o+0];
    expanded[(i*2+1)*5+1] = ribbon.arr[o+1];
    expanded[(i*2+1)*5+2] = ribbon.arr[o+2];
    expanded[(i*2+1)*5+3] = +1;
    expanded[(i*2+1)*5+4] = ribbon.arr[o+4];
  }
  // 索引 — triangle strip 顺序: 0,1,2, 2,1,3, 2,3,4, 4,3,5, ...
  const idx = new Uint16Array((n - 1) * 6);
  for (let i = 0; i < n - 1; i++){
    const v0 = i*2, v1 = i*2+1, v2 = (i+1)*2, v3 = (i+1)*2+1;
    idx[i*6+0] = v0; idx[i*6+1] = v2; idx[i*6+2] = v1;
    idx[i*6+3] = v1; idx[i*6+4] = v2; idx[i*6+5] = v3;
  }
  ribbon.expanded = expanded;
  ribbon.indices = idx;
  ribbon.indexCount = idx.length;

  ribbon.vao = gl.createVertexArray();
  gl.bindVertexArray(ribbon.vao);
  ribbon.buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ribbon.buf);
  gl.bufferData(gl.ARRAY_BUFFER, expanded, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 20, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 20, 16);
  ribbon.ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ribbon.ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
}

function rebuildAllOrbitVAOs(){
  for (const r of ORBIT_RIBBONS) makeOrbitVAO(r);
}

/* ============================================================================
 * §13 状态更新:位置 / 自转 / 卫星
 * ============================================================================ */
function updateBodiesState(){
  const T = (STATE.JD - J2000_JD) / 36525;
  for (const b of BODIES){
    if (b.id === 'sun'){ b.posWorld = [0,0,0]; continue; }
    const st = elementsToState(b.key, T, STATE.JD);
    // ecliptic → world (规格书 §3.4): world = (x, z, -y)
    const w = [dispR(st.posWorld[0]), dispR(st.posWorld[1]), dispR(st.posWorld[2])];
    b.posWorld = w;
    b.rAU = st.rAU;
    b.speedKmS = st.speedKmS;
    b.eclLonLat = [Math.atan2(st.posWorld[1], st.posWorld[0]), Math.asin(st.posWorld[2]/st.rAU)];
    b.elem = st.elem;
  }

  // 卫星
  for (const m of MOONS){
    const parent = m.parent;
    const theta = TWO_PI * (STATE.JD - J2000_JD) / m.period + m.phase0;
    // 显示距离 (规格书 §3.7): 基准 = max(2.35, ringOuter + moonDispR / parentDispR + 0.55)
    let base = 2.35;
    if (parent.hasRing){
      const ringOuter = parent.ringType === 0 ? 2.34 : parent.ringType === 1 ? 2.00 : 1.81;
      base = Math.max(base, ringOuter + (m.dispRadius / parent.dispRadius) + 0.55);
    }
    const a0 = MOON_DATA
      .filter(x => x.parent === parent.id)
      .reduce((mn, x) => Math.min(mn, x.aKm), Infinity);
    const myKm = m.aKm;
    m.aDisplay = parent.dispRadius * base * Math.pow(myKm / a0, 0.55);
    m.theta = theta;

    // 局部坐标 (cos θ·d, 0, sin θ·d), 绕 X 倾斜 inc
    const cx = Math.cos(theta) * m.aDisplay;
    const cz = Math.sin(theta) * m.aDisplay;
    const inc = m.inc * RAD;
    const lx = cx;
    const ly = cz * Math.sin(inc);
    const lz = cz * Math.cos(inc);
    // 参考面
    let wx, wy, wz;
    if (m.ref === 'ecliptic'){
      // 直接加到母行星世界坐标
      wx = parent.posWorld[0] + lx;
      wy = parent.posWorld[1] + ly;
      wz = parent.posWorld[2] + lz;
    } else {
      // 用母行星自转轴正交基
      const ax = parent.axis;
      // 取 X 垂直于 ax 的任意向量
      let refX = [1,0,0];
      if (Math.abs(ax[0]) > 0.9) refX = [0,1,0];
      const ex = v3Cross(ax, refX);
      const exL = Math.hypot(ex[0], ex[1], ex[2]);
      ex[0] /= exL; ex[1] /= exL; ex[2] /= exL;
      const ez = v3Cross(ax, ex);
      wx = parent.posWorld[0] + ex[0]*lx + ax[0]*ly + ez[0]*lz;
      wy = parent.posWorld[1] + ex[1]*lx + ax[1]*ly + ez[1]*lz;
      wz = parent.posWorld[2] + ex[2]*lx + ax[2]*ly + ez[2]*lz;
    }
    m.posWorld = [wx, wy, wz];
  }

  // 哈雷
  const hs = halleyState(STATE.JD);
  HALLEY.posWorld = [dispR(hs.posWorld[0]), dispR(hs.posWorld[1]), dispR(hs.posWorld[2])];
  HALLEY.rAU = hs.rAU;

  // 自转相位 (规格书 §7.11)
  const dtDays = (STATE.lastJD !== undefined) ? (STATE.JD - STATE.lastJD) : 0;
  for (const b of BODIES){
    if (b.rotH !== 0){
      const periodDays = b.rotH / 24;
      let delta = TWO_PI * dtDays / periodDays;
      // clamp
      if (delta > 0.22) delta = 0.22;
      if (delta < -0.22) delta = -0.22;
      b.rotPhase = (b.rotPhase || 0) + delta;
    }
  }
  STATE.lastJD = STATE.JD;

  // 真实比例过渡
  const target = STATE.realScaleTarget;
  const speed = 1 / 0.4;   // 0.4s 完成
  if (Math.abs(STATE.realScaleAnim - target) > 0.001){
    STATE.realScaleAnim += (target - STATE.realScaleAnim) * Math.min(1, dtDays * 24 * speed);
  }
  STATE.realScaleMix = STATE.realScaleAnim;
}

/* ============================================================================
 * §14 矩阵与相机
 * ============================================================================ */
function makeModelMatrix(b){
  // 顺序: 缩放 × 自转 (绕轴) × 平移
  const m = m4Identity(new Float32Array(16));
  // 先做平移
  const tx = b.posWorld[0], ty = b.posWorld[1], tz = b.posWorld[2];
  // 自转: 以 axis 为 Y, 任意取 X
  const ax = b.axis || [0,1,0];
  let refX = [1,0,0];
  if (Math.abs(ax[0]) > 0.9) refX = [0,1,0];
  const ex = v3Cross(ax, refX);
  const exL = Math.hypot(ex[0], ex[1], ex[2]) || 1;
  ex[0]/=exL; ex[1]/=exL; ex[2]/=exL;
  const ez = v3Cross(ax, ex);
  // 把轴的旋转相位绕 Y 转
  const cs = Math.cos(b.rotPhase || 0), sn = Math.sin(b.rotPhase || 0);
  // 旋转后的 X = cs·ex - sn·ez;  Z = sn·ex + cs·ez;  Y = ax
  const rxX = cs*ex[0] - sn*ez[0], rxY = cs*ex[1] - sn*ez[1], rxZ = cs*ex[2] - sn*ez[2];
  const rzX = sn*ex[0] + cs*ez[0], rzY = sn*ex[1] + cs*ez[1], rzZ = sn*ex[2] + cs*ez[2];
  const ryX = ax[0], ryY = ax[1], ryZ = ax[2];
  // 把三列排进矩阵,并应用缩放
  const S = b.dispRadius;
  m[0]=rxX*S; m[1]=rxY*S; m[2]=rxZ*S; m[3]=0;
  m[4]=ryX*S; m[5]=ryY*S; m[6]=ryZ*S; m[7]=0;
  m[8]=rzX*S; m[9]=rzY*S; m[10]=rzZ*S; m[11]=0;
  m[12]=tx; m[13]=ty; m[14]=tz; m[15]=1;
  return m;
}

function getCameraPos(){
  const cy = STATE.camYaw, cp = STATE.camPitch, cd = STATE.camDist;
  const tx = STATE.camTarget[0], ty = STATE.camTarget[1], tz = STATE.camTarget[2];
  const cosP = Math.cos(cp);
  const x = tx + cd * cosP * Math.sin(cy);
  const z = tz + cd * cosP * Math.cos(cy);
  const y = ty + cd * Math.sin(cp);
  return [x, y, z];
}

function computeMVPandDepth(){
  const camPos = getCameraPos();
  const fov = 50 * RAD;
  const aspect = W / H;
  // 动态近远平面 (规格书 §4.4)
  const tgt = STATE.camTarget;
  const distToTarget = Math.hypot(camPos[0]-tgt[0], camPos[1]-tgt[1], camPos[2]-tgt[2]);
  const near = Math.max(0.012, distToTarget * 0.0035);
  const far = Math.max(distToTarget * 14, 4200);
  const P = m4Perspective(new Float32Array(16), fov, aspect, near, far);
  const V = m4LookAt(new Float32Array(16), camPos, tgt, [0,1,0]);
  const PV = m4Multiply(new Float32Array(16), P, V);
  // 太阳世界坐标 (用于太阳光线方向)
  const sunPos = BODIES[0].posWorld;
  return { camPos, P, V, PV, sunPos, near, far };
}

/* ============================================================================
 * §15 渲染流程
 * ============================================================================ */
function setUniform(progKey, name, ...vals){
  const loc = PROG[progKey].unif[name];
  if (!loc) return;
  const fn = gl['uniform' + vals.length + 'fv'];
  if (fn) fn.call(gl, loc, vals);
  else {
    // mat4
    if (vals.length === 16) gl.uniformMatrix4fv(loc, false, vals);
    else if (vals.length === 4) gl.uniformMatrix2fv(loc, false, vals);
  }
}

function setUniform1i(progKey, name, val){
  const loc = PROG[progKey].unif[name];
  if (loc) gl.uniform1i(loc, val);
}

function renderPass(passFn){
  passFn();
}

let _sunScreen = [0,0];
let _sunVisible = 0;

function frame(){
  // 时间推进
  if (!STATE.paused){
    const speedDaysPerSec = stateSpeedDaysPerSec();
    STATE.JD += speedDaysPerSec * STATE.lastDt;
  }
  STATE.time += STATE.lastDt;

  // 更新天体状态
  updateBodiesState();
  // 更新小行星位置
  for (const g of ASTEROID_GROUPS) updateEllipticPos(g, STATE.JD);
  uploadAsteroidPositions();

  // 重建需要重建的轨道 (realScaleMix 改变时)
  // 简化: 每帧重建 (256 顶点极少)
  if (STATE.dirtyScale){
    buildOrbitRibbons();
    rebuildAllOrbitVAOs();
    STATE.dirtyScale = false;
  }

  // 计算相机/投影
  const { camPos, P, V, PV, sunPos } = computeMVPandDepth();

  // --- 1. 场景渲染到 MSAA FBO ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, FBO.scene.fbo);
  gl.viewport(0, 0, W, H);
  // 关键: 每次 clear 之前确保 depthMask=true (规格书 §7.1)
  gl.depthMask(true);
  gl.colorMask(true,true,true,true);
  gl.clearColor(0,0,0,1);
  gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

  // 太阳方向 (世界)
  const sunDir = [-sunPos[0], -sunPos[1], -sunPos[2]];
  // 归一化
  const slen = Math.hypot(sunDir[0], sunDir[1], sunDir[2]) || 1;
  sunDir[0]/=slen; sunDir[1]/=slen; sunDir[2]/=slen;

  // -- 背景 --
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.useProgram(PROG.bg.prog);
  // 计算 inv(PV)
  const invPV = m4Invert(new Float32Array(16), PV);
  setUniform('bg','uInvVP', ...invPV);
  setUniform('bg','uCamPos', camPos[0], camPos[1], camPos[2]);
  setUniform('bg','uViewport', W, H);
  gl.bindVertexArray(VAO.postQuad.vao);
  gl.drawElements(gl.TRIANGLES, VAO.postQuad.count, gl.UNSIGNED_SHORT, 0);

  // -- 恒星 (additive) --
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.useProgram(PROG.stars.prog);
  setUniform('stars','uVP', ...PV);
  setUniform('stars','uCamPos', camPos[0], camPos[1], camPos[2]);
  setUniform('stars','uAspect', W/H);
  setUniform('stars','uTime', STATE.time);
  gl.bindVertexArray(VAO.stars.vao);
  gl.drawArrays(gl.POINTS, 0, VAO.stars.count);
  gl.bindVertexArray(null);

  // -- 太阳 --
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LESS);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.useProgram(PROG.sun.prog);
  const sunModel = makeModelMatrix(BODIES[0]);
  const sunMVP = m4Multiply(new Float32Array(16), PV, sunModel);
  setUniform('sun','uMVP', ...sunMVP);
  setUniform('sun','uModel', ...sunModel);
  setUniform('sun','uCamPos', camPos[0], camPos[1], camPos[2]);
  setUniform('sun','uTime', STATE.time);
  gl.bindVertexArray(BODIES[0].mesh.vao);
  gl.drawElements(gl.TRIANGLES, BODIES[0].mesh.count, gl.UNSIGNED_SHORT, 0);

  // -- 太阳日冕 (billboard, additive) --
  // 计算太阳屏幕位置
  const sunClip = m4Multiply(new Float32Array(16), PV, (()=>{const m=new Float32Array(16); m[15]=1; m[12]=sunPos[0]; m[13]=sunPos[1]; m[14]=sunPos[2]; return m;})());
  // 解析
  const sx = sunClip[0]/sunClip[3], sy = sunClip[1]/sunClip[3];
  const sunOnScreen = (sunClip[2] > -sunClip[3] && sunClip[2] < sunClip[3]) && sx > -1.1 && sx < 1.1 && sy > -1.1 && sy < 1.1;
  // 太阳视半径
  const sunScreenR = sunOnScreen ? (BODIES[0].dispRadius / camDistTo(sunPos)) * (H/2) / Math.tan(50*RAD/2) : 0;

  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.useProgram(PROG.corona.prog);
  // 把太阳放屏幕空间: 用一个把太阳世界位置放屏幕中心的 MVP
  // 我们直接做一个简单方案: 在 VS 里把 aPlane 乘以 uScale, 通过 uMVP 把 [0,0] 放到 sunClip.xy
  // 这要求 VS 把 aPlane 当成 NDC 偏移, uMVP 平移到太阳屏幕位置
  // 简化: 把日冕 quad 放在太阳的 3D 位置, 在片元里基于 (vUV) 计算屏幕空间
  // 这里用一个特殊技巧: 矩阵把单位 quad 在世界空间中缩放到合适大小后放太阳位置
  function billboardMVP(scale){
    const m = m4Identity(new Float32Array(16));
    // 我们要: 把 aPlane (∈[-1,1]) * scale 放到相机空间下太阳位置
    // 先把太阳位置变成相机坐标:
    const invV = m4Invert(new Float32Array(16), V);
    // 把 [0,0,0] 投影到相机空间
    const sunCam = [0,0,0];
    sunCam[0] = invV[0]*sunPos[0] + invV[4]*sunPos[1] + invV[8]*sunPos[2] + invV[12];
    sunCam[1] = invV[1]*sunPos[0] + invV[5]*sunPos[1] + invV[9]*sunPos[2] + invV[13];
    sunCam[2] = invV[2]*sunPos[0] + invV[6]*sunPos[1] + invV[10]*sunPos[2] + invV[14];
    // 然后投影 + 偏移
    // 用一个矩阵把 aPlane 直接转到 NDC 太阳位置
    // NDC 太阳位置 = (sunClip.x, sunClip.y) / sunClip.w
    const ndcX = sunClip[0]/sunClip[3];
    const ndcY = sunClip[1]/sunClip[3];
    // 把 aPlane (-1..1) 转到 (ndcX ± scaleX, ndcY ± scaleY)
    // 在 NDC 中 aPlane*scale + offset
    // 简化为: 我们用 worldPos, 让 VS 处理
    m[0] = scale; m[5] = scale; m[10] = scale;
    m[12] = sunPos[0]; m[13] = sunPos[1]; m[14] = sunPos[2];
    return m;
  }
  const sunDist = Math.hypot(camPos[0]-sunPos[0], camPos[1]-sunPos[1], camPos[2]-sunPos[2]);
  // 太阳屏幕半径 (像素)
  const ssr = sunOnScreen ? (BODIES[0].dispRadius / Math.max(sunDist, 0.01)) * (H/2) / Math.tan(50*RAD/2) : 0;
  // 内层
  {
    const scale = ssr / (H/2) * 3.1;
    const mvp = m4Multiply(new Float32Array(16), P, (()=>{const m=new Float32Array(16); m[0]=scale*Math.hypot(V[0],V[1],V[2])/Math.hypot(V[0],V[1],V[2]); m[5]=scale; m[10]=1; m[12]=sunPos[0]; m[13]=sunPos[1]; m[14]=sunPos[2]; m[15]=1; return m;})());
    // 用相机空间方法:V 是 world→camera, 直接乘 sunPos
    const sxC = V[0]*sunPos[0] + V[4]*sunPos[1] + V[8]*sunPos[2] + V[12];
    const syC = V[1]*sunPos[0] + V[5]*sunPos[1] + V[9]*sunPos[2] + V[13];
    const szC = V[2]*sunPos[0] + V[6]*sunPos[1] + V[10]*sunPos[2] + V[14];
    const m = m4Identity(new Float32Array(16));
    m[0] = scale; m[5] = scale;
    m[12] = sxC; m[13] = syC; m[14] = szC; m[15] = 1;
    const vpMvp = m4Multiply(new Float32Array(16), P, m);
    setUniform('corona','uMVP', ...vpMvp);
    setUniform('corona','uScale', 1.0);
    setUniform('corona','uTime', STATE.time);
    setUniform('corona','uInner', 1.0);
    gl.bindVertexArray(VAO.coronaQuad.vao);
    gl.drawElements(gl.TRIANGLES, VAO.coronaQuad.count, gl.UNSIGNED_SHORT, 0);
  }
  // 外层
  {
    const scale = ssr / (H/2) * 9.0;
    const sxC = V[0]*sunPos[0] + V[4]*sunPos[1] + V[8]*sunPos[2] + V[12];
    const syC = V[1]*sunPos[0] + V[5]*sunPos[1] + V[9]*sunPos[2] + V[13];
    const szC = V[2]*sunPos[0] + V[6]*sunPos[1] + V[10]*sunPos[2] + V[14];
    const m = m4Identity(new Float32Array(16));
    m[0] = scale; m[5] = scale;
    m[12] = sxC; m[13] = syC; m[14] = szC; m[15] = 1;
    const vpMvp = m4Multiply(new Float32Array(16), P, m);
    setUniform('corona','uMVP', ...vpMvp);
    setUniform('corona','uScale', 1.0);
    setUniform('corona','uTime', STATE.time);
    setUniform('corona','uInner', 0.0);
    gl.bindVertexArray(VAO.coronaQuad.vao);
    gl.drawElements(gl.TRIANGLES, VAO.coronaQuad.count, gl.UNSIGNED_SHORT, 0);
  }

  // 太阳可见性
  if (sunOnScreen){
    _sunScreen[0] = sunClip[0]/sunClip[3];
    _sunScreen[1] = sunClip[1]/sunClip[3];
    _sunVisible = 1;
  } else {
    _sunVisible = 0;
  }

  // -- 行星 --
  for (const b of BODIES){
    if (b.id === 'sun') continue;
    gl.useProgram(PROG.planet.prog);
    const model = makeModelMatrix(b);
    const mvp = m4Multiply(new Float32Array(16), PV, model);
    setUniform('planet','uMVP', ...mvp);
    setUniform('planet','uModel', ...model);
    setUniform('planet','uCamPos', camPos[0], camPos[1], camPos[2]);
    setUniform('planet','uSunPos', sunPos[0], sunPos[1], sunPos[2]);
    setUniform('planet','uSunDir', sunDir[0], sunDir[1], sunDir[2]);
    setUniform('planet','uTime', STATE.time);
    setUniform1i('planet','uType', b.surfaceType);
    setUniform('planet','uTint', b.tint[0], b.tint[1], b.tint[2]);
    setUniform('planet','uAlbedo', b.albedo);
    setUniform('planet','uRotPhase', b.rotPhase);
    setUniform('planet','uRingNormal', 0, 1, 0);  // 物体空间环法向
    setUniform('planet','uHasRing', b.hasRing && b.id === 'saturn' ? 1.0 : 0.0);
    gl.bindVertexArray(b.mesh.vao);
    gl.drawElements(gl.TRIANGLES, b.mesh.count, gl.UNSIGNED_SHORT, 0);
  }

  // -- 大气壳层 --
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  for (const b of BODIES){
    if (b.id === 'sun') continue;
    if (!b.atmosScaleH) continue;
    gl.useProgram(PROG.atmos.prog);
    // 在大球上画, 用 push-constant 模型矩阵
    const model = makeModelMatrix(b);
    // 缩放到 (1 + 标高 × 7.5)
    const sScale = 1 + b.atmosScaleH * 7.5;
    const m = new Float32Array(model);
    m[0] *= sScale; m[5] *= sScale; m[10] *= sScale;
    const mvp = m4Multiply(new Float32Array(16), PV, m);
    setUniform('atmos','uMVP', ...mvp);
    setUniform('atmos','uCamPos', camPos[0], camPos[1], camPos[2]);
    setUniform('atmos','uSunPos', sunPos[0], sunPos[1], sunPos[2]);
    setUniform('atmos','uSunDir', sunDir[0], sunDir[1], sunDir[2]);
    setUniform('atmos','uCenter', b.posWorld[0], b.posWorld[1], b.posWorld[2]);
    setUniform('atmos','uRadius', b.dispRadius);
    setUniform('atmos','uScaleH', b.atmosScaleH * 0.4);  // 标高相对行星半径
    setUniform('atmos','uColor', b.atmosColor[0], b.atmosColor[1], b.atmosColor[2]);
    setUniform('atmos','uIntensity', 0.65);
    gl.bindVertexArray(b.mesh.vao);
    gl.drawElements(gl.TRIANGLES, b.mesh.count, gl.UNSIGNED_SHORT, 0);
  }

  // -- 环系 (土星 / 天王星 / 木星) --
  for (const b of BODIES){
    if (!b.hasRing) continue;
    gl.useProgram(PROG.ring.prog);
    // 模型矩阵: 行星轴 × 平移
    // 环法向 = 行星轴
    const model = m4Identity(new Float32Array(16));
    const ax = b.axis;
    let refX = [1,0,0];
    if (Math.abs(ax[0]) > 0.9) refX = [0,1,0];
    const ex = v3Cross(ax, refX);
    const exL = Math.hypot(ex[0], ex[1], ex[2]) || 1;
    ex[0]/=exL; ex[1]/=exL; ex[2]/=exL;
    const ez = v3Cross(ax, ex);
    // 把环的 Y 轴对齐到 ax, X 轴对齐到 ex (但我们不旋转环顶点, 顶点已经在 XZ 平面)
    // 让 model 的 X = ex, Y = ax, Z = ez
    const S = b.dispRadius;
    model[0]=ex[0]*S; model[1]=ex[1]*S; model[2]=ex[2]*S;
    model[4]=ax[0]*S; model[5]=ax[1]*S; model[6]=ax[2]*S;
    model[8]=ez[0]*S; model[9]=ez[1]*S; model[10]=ez[2]*S;
    model[12]=b.posWorld[0]; model[13]=b.posWorld[1]; model[14]=b.posWorld[2];
    model[15]=1;
    const mvp = m4Multiply(new Float32Array(16), PV, model);
    setUniform('ring','uMVP', ...mvp);
    setUniform('ring','uModel', ...model);
    setUniform('ring','uCamPos', camPos[0], camPos[1], camPos[2]);
    setUniform('ring','uSunPos', sunPos[0], sunPos[1], sunPos[2]);
    setUniform('ring','uSunDir', sunDir[0], sunDir[1], sunDir[2]);
    setUniform('ring','uMinR', 1.2);
    setUniform('ring','uMaxR', (b.ringType === 0) ? 2.34 : (b.ringType === 1) ? 2.00 : 1.81);
    setUniform('ring','uBodyR', b.dispRadius);
    setUniform1i('ring','uType', b.ringType);
    setUniform('ring','uTime', STATE.time);
    gl.bindVertexArray(VAO.ringQuad.vao);
    gl.drawElements(gl.TRIANGLES, VAO.ringQuad.count, gl.UNSIGNED_SHORT, 0);
  }

  // -- 卫星 --
  for (const m of MOONS){
    if (!DISPLAY.moons) continue;
    gl.useProgram(PROG.planet.prog);
    const model = makeMoonModel(m);
    const mvp = m4Multiply(new Float32Array(16), PV, model);
    setUniform('planet','uMVP', ...mvp);
    setUniform('planet','uModel', ...model);
    setUniform('planet','uCamPos', camPos[0], camPos[1], camPos[2]);
    setUniform('planet','uSunPos', sunPos[0], sunPos[1], sunPos[2]);
    setUniform('planet','uSunDir', sunDir[0], sunDir[1], sunDir[2]);
    setUniform('planet','uTime', STATE.time);
    setUniform1i('planet','uType', m.surfaceType);
    setUniform('planet','uTint', m.tint[0], m.tint[1], m.tint[2]);
    setUniform('planet','uAlbedo', 0.5);
    setUniform('planet','uRotPhase', m.rotPhase);
    setUniform('planet','uRingNormal', 0, 1, 0);
    setUniform('planet','uHasRing', 0);
    gl.bindVertexArray(VAO.sphereMd.vao);
    gl.drawElements(gl.TRIANGLES, VAO.sphereMd.count, gl.UNSIGNED_SHORT, 0);
  }

  // -- 哈雷彗星头 + 双尾 --
  if (DISPLAY.comets && HALLEY.rAU < 6.5){
    renderComet();
  }

  // -- 轨道缎带 --
  if (DISPLAY.orbits){
    gl.depthMask(false);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.useProgram(PROG.orbit.prog);
    setUniform('orbit','uPxHalf', 1.5 / H);
    for (const r of ORBIT_RIBBONS){
      const arc = (()=>{
        if (r.key === 'halley') return 0;
        const elem = ELEMENTS[r.key];
        const Tnow = (STATE.JD - J2000_JD)/36525;
        const Lnow = (elem.L0 + elem.dL*Tnow) * RAD;
        const wBnow = (elem.w0 + elem.dw*Tnow) * RAD;
        let Mnow = Lnow - wBnow;
        Mnow = ((Mnow + Math.PI) % TWO_PI + TWO_PI) % TWO_PI - Math.PI;
        return Mnow / TWO_PI + 0.5;
      })();
      const b = BODIES.find(x => x.key === r.key);
      if (b){
        const c = b.tint;
        setUniform('orbit','uColor', c[0], c[1], c[2]);
      } else {
        setUniform('orbit','uColor', 0.5, 0.6, 0.8);
      }
      setUniform('orbit','uActive', arc);
      setUniform('orbit','uMVP', ...PV);
      gl.bindVertexArray(r.vao);
      gl.drawElements(gl.TRIANGLES, r.indexCount, gl.UNSIGNED_SHORT, 0);
    }
  }

  // -- 小行星带 --
  if (DISPLAY.asteroids){
    gl.depthMask(false);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.useProgram(PROG.asteroid.prog);
    setUniform('asteroid','uVP', ...PV);
    setUniform('asteroid','uPxScale', 1.0);
    for (const g of ASTEROID_GROUPS){
      if (!g.vao) continue;
      const distCenter = Math.hypot(g.positions ? g.positions[0] : 0, g.positions ? g.positions[1] : 0, g.positions ? g.positions[2] : 0);
      const brightness = Math.max(0.3, 1.4 - Math.log10(distCenter/DISP_SCALE + 1));
      setUniform('asteroid','uColor', g.color[0]*brightness, g.color[1]*brightness, g.color[2]*brightness);
      setUniform('asteroid','uBright', brightness);
      gl.bindVertexArray(g.vao);
      gl.drawArrays(gl.POINTS, 0, g.count);
    }
  }

  // 恢复
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.bindVertexArray(null);

  // --- 2. MSAA 解析 (规格书 §4.1) ---
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, FBO.scene.fbo);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, FBO.sceneResolved.fbo);
  gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.LINEAR);

  // --- 3. 泛光 ---
  // downsample 6 级
  let srcTex = FBO.sceneResolved.color;
  for (let i = 0; i < FBO.bloom.length; i++){
    const lvl = FBO.bloom[i];
    gl.bindFramebuffer(gl.FRAMEBUFFER, lvl.fbo);
    gl.viewport(0, 0, lvl.w, lvl.h);
    gl.disable(gl.BLEND);
    gl.useProgram(PROG.bloom.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, srcTex);
    setUniform1i('bloom','uPass', 0);
    setUniform('bloom','uTexel', 1/lvl.w, 1/lvl.h);
    setUniform('bloom','uThreshold', 1.25);
    setUniform('bloom','uSoftKnee', 0.6);
    gl.bindVertexArray(VAO.postQuad.vao);
    gl.drawElements(gl.TRIANGLES, VAO.postQuad.count, gl.UNSIGNED_SHORT, 0);
    srcTex = lvl.tex;
  }
  // upsample (加法混合, 规格书 §7.3)
  // 关键: 写入 lvl[i] 但从 lvl[i+1] 采样 — 避免读写同一纹理 (feedback loop)
  for (let i = FBO.bloom.length - 1; i >= 1; i--){
    const lvl = FBO.bloom[i];
    const src = FBO.bloom[i+1] || FBO.sceneResolved;
    gl.bindFramebuffer(gl.FRAMEBUFFER, lvl.fbo);
    gl.viewport(0, 0, lvl.w, lvl.h);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(PROG.bloom.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src.tex || src.color);
    setUniform1i('bloom','uPass', 1);
    setUniform('bloom','uTexel', 1/lvl.w, 1/lvl.h);
    gl.bindVertexArray(VAO.postQuad.vao);
    gl.drawElements(gl.TRIANGLES, VAO.postQuad.count, gl.UNSIGNED_SHORT, 0);
    gl.disable(gl.BLEND);
  }
  // 最后一级 (i=0): 用 bloom[1] 作为源
  {
    const lvl = FBO.bloom[0];
    const src = FBO.bloom[1];
    gl.bindFramebuffer(gl.FRAMEBUFFER, lvl.fbo);
    gl.viewport(0, 0, lvl.w, lvl.h);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(PROG.bloom.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    setUniform1i('bloom','uPass', 1);
    setUniform('bloom','uTexel', 1/lvl.w, 1/lvl.h);
    gl.bindVertexArray(VAO.postQuad.vao);
    gl.drawElements(gl.TRIANGLES, VAO.postQuad.count, gl.UNSIGNED_SHORT, 0);
    gl.disable(gl.BLEND);
  }

  // --- 4. 最终合成 ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.useProgram(PROG.final.prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, FBO.sceneResolved.color);
  setUniform1i('final','uScene', 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, FBO.bloom[0].tex);
  setUniform1i('final','uBloom', 1);
  setUniform('final','uViewport', W, H);
  setUniform('final','uSunScreen', _sunScreen[0], _sunScreen[1]);
  setUniform('final','uSunVisible', _sunVisible);
  setUniform('final','uTime', STATE.time);
  setUniform('final','uBloomIntensity', DISPLAY.glow ? 0.34 : 0.0);
  setUniform('final','uGlowIntensity', DISPLAY.glow ? 0.55 : 0.0);
  gl.bindVertexArray(VAO.postQuad.vao);
  gl.drawElements(gl.TRIANGLES, VAO.postQuad.count, gl.UNSIGNED_SHORT, 0);

  // --- 5. 标签 (HTML overlay) ---
  updateLabels();

  // 检查错误 — 在每个 pass 末尾清错,只保留错误标签
  // 错误检测移到各 pass 末尾
  while (gl.getError() !== gl.NO_ERROR) {}
}

let _glLast = '';

  _glLast = tag;
}

  const err = gl.getError();
  if (err) console.warn('GL 0x' + err.toString(16) + ' @ ' + _glLast);
}

function camDistTo(p){
  const c = getCameraPos();
  return Math.hypot(c[0]-p[0], c[1]-p[1], c[2]-p[2]);
}

function makeMoonModel(m){
  const mtx = m4Identity(new Float32Array(16));
  mtx[0]=m.dispRadius; mtx[5]=m.dispRadius; mtx[10]=m.dispRadius;
  mtx[12]=m.posWorld[0]; mtx[13]=m.posWorld[1]; mtx[14]=m.posWorld[2];
  return mtx;
}

/* ============================================================================
 * §16 彗星 (Halley): 头 + 离子尾 + 尘埃尾
 * ============================================================================ */
function renderComet(){
  const head = HALLEY.posWorld;
  const sun = BODIES[0].posWorld;
  // 反日方向
  const anti = [head[0]-sun[0], head[1]-sun[1], head[2]-sun[2]];
  const al = Math.hypot(anti[0], anti[1], anti[2]) || 1;
  anti[0]/=al; anti[1]/=al; anti[2]/=al;
  // 尘埃尾更宽, 沿速度反方向弯曲 — 我们用近似
  const { V } = computeMVPandDepth();
  // 长度 = (3/r)^2 缩放, 单位为 dispR 单位
  const rAU = HALLEY.rAU;
  const tailLen = Math.pow(3 / Math.max(rAU, 0.3), 2) * 14;
  const tailWidth = 0.04;

  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

  // 离子尾 (笔直, 蓝)
  {
    const pts = makeCometTail(head, anti, tailLen, tailWidth * 0.6);
    gl.useProgram(PROG.comet.prog);
    const { PV } = computeMVPandDepth();
    setUniform('comet','uMVP', ...PV);
    setUniform('comet','uPxHalf', 1.5 / H);
    setUniform('comet','uWidth', 60 / H);
    setUniform('comet','uColor', 0.45, 0.65, 1.0);
    setUniform('comet','uIntensity', 0.7);
    setUniform('comet','uIsDust', 0);
    gl.bindVertexArray(pts.vao);
    gl.drawArrays(gl.TRIANGLES, 0, pts.count);
  }
  // 尘埃尾 (弯曲, 暖黄)
  {
    // 弯曲方向 = anti + 切向分量(垂直于 anti, 在 anti 与速度方向所构成的平面内)
    // 简化: 用 anti + 上方向(世界 Y) 一点
    const dustDir = [anti[0]*0.85 + 0*0.15, anti[1]*0.85 + 0.5*0.15, anti[2]*0.85 + 0*0.15];
    const dl = Math.hypot(dustDir[0], dustDir[1], dustDir[2]) || 1;
    dustDir[0]/=dl; dustDir[1]/=dl; dustDir[2]/=dl;
    const pts = makeCometTail(head, dustDir, tailLen * 0.85, tailWidth * 1.4);
    gl.useProgram(PROG.comet.prog);
    const { PV } = computeMVPandDepth();
    setUniform('comet','uMVP', ...PV);
    setUniform('comet','uPxHalf', 1.5 / H);
    setUniform('comet','uWidth', 110 / H);
    setUniform('comet','uColor', 1.0, 0.78, 0.45);
    setUniform('comet','uIntensity', 0.5);
    setUniform('comet','uIsDust', 1);
    gl.bindVertexArray(pts.vao);
    gl.drawArrays(gl.TRIANGLES, 0, pts.count);
  }

  // 彗发 (头)
  {
    gl.useProgram(PROG.comet.prog);
    const { PV } = computeMVPandDepth();
    setUniform('comet','uMVP', ...PV);
    setUniform('comet','uPxHalf', 1.5 / H);
    setUniform('comet','uWidth', 22 / H);
    setUniform('comet','uColor', 1.0, 0.92, 0.78);
    setUniform('comet','uIntensity', 1.0);
    setUniform('comet','uIsDust', 0);
    // 重新建一个只包含头一个 quad 的 mesh
    const tmp = makeCometTail(head, anti, 0.0, 0.05);
    gl.bindVertexArray(tmp.vao);
    gl.drawArrays(gl.TRIANGLES, 0, tmp.count);
  }
}

let _cometMesh = null;
function makeCometTail(head, dir, length, halfWidth){
  // 创建 triangle strip 风格 mesh: N 段, 每段 2 顶点
  const N = 32;
  // 取一个垂直于 dir 的向量
  let refX = [1,0,0];
  if (Math.abs(dir[0]) > 0.9) refX = [0,1,0];
  const perp = v3Cross(dir, refX);
  const pl = Math.hypot(perp[0], perp[1], perp[2]) || 1;
  perp[0]/=pl; perp[1]/=pl; perp[2]/=pl;

  // 顶点数据: pos(3) + side(1) + u(1)
  const data = new Float32Array(N * 2 * 5);
  const indices = [];
  for (let i = 0; i < N; i++){
    const u = i / (N - 1);
    const t = u * length;
    const w = halfWidth * Math.pow(1 - u, 0.8);   // 越远越窄
    const cx = head[0] + dir[0]*t;
    const cy = head[1] + dir[1]*t;
    const cz = head[2] + dir[2]*t;
    const lx = cx + perp[0]*w;
    const ly = cy + perp[1]*w;
    const lz = cz + perp[2]*w;
    const rx = cx - perp[0]*w;
    const ry = cy - perp[1]*w;
    const rz = cz - perp[2]*w;
    data[(i*2)*5+0] = lx;
    data[(i*2)*5+1] = ly;
    data[(i*2)*5+2] = lz;
    data[(i*2)*5+3] = -1;
    data[(i*2)*5+4] = u;
    data[(i*2+1)*5+0] = rx;
    data[(i*2+1)*5+1] = ry;
    data[(i*2+1)*5+2] = rz;
    data[(i*2+1)*5+3] = +1;
    data[(i*2+1)*5+4] = u;
    if (i < N - 1){
      const v0 = i*2, v1 = i*2+1, v2 = (i+1)*2, v3 = (i+1)*2+1;
      indices.push(v0, v2, v1, v1, v2, v3);
    }
  }
  if (!_cometMesh){
    _cometMesh = gl.createVertexArray();
    gl.bindVertexArray(_cometMesh);
    _cometMesh.buf = gl.createBuffer();
    _cometMesh.ib = gl.createBuffer();
    gl.bindVertexArray(null);
  }
  gl.bindVertexArray(_cometMesh);
  gl.bindBuffer(gl.ARRAY_BUFFER, _cometMesh.buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 20, 12);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 20, 16);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, _cometMesh.ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.DYNAMIC_DRAW);
  gl.bindVertexArray(null);
  return { vao: _cometMesh, count: indices.length };
}

/* ============================================================================
 * §17 标签 (HTML overlay)
 * ============================================================================ */
const _labelsDiv = () => document.getElementById('labels');
const _labelNodes = new Map();

function ensureLabel(id){
  if (_labelNodes.has(id)) return _labelNodes.get(id);
  const div = document.createElement('div');
  div.className = 'label';
  div.textContent = id;
  _labelsDiv().appendChild(div);
  _labelNodes.set(id, div);
  return div;
}

function updateLabels(){
  if (STATE.uiHidden) {
    for (const div of _labelNodes.values()) div.style.opacity = 0;
    return;
  }
  const camPos = getCameraPos();
  const { PV } = computeMVPandDepth();
  // 把 sun + planets + moons 投到屏幕
  const list = [];
  for (const b of BODIES){
    list.push({ id:b.id, name:b.name, pos:b.posWorld, rad:b.dispRadius, color: b.tint });
  }
  for (const m of MOONS){
    if (m.id === 'moon') list.push({ id:m.id, name:m.name, pos:m.posWorld, rad:m.dispRadius, color:m.tint });
  }
  // 哈雷
  list.push({ id:'halley', name:'哈雷彗星', pos:HALLEY.posWorld, rad:0.05, color:[1,0.9,0.7] });

  for (const item of list){
    if (!item.pos) continue;
    const div = ensureLabel(item.id);
    const clip = m4Multiply(new Float32Array(16), PV, (()=>{const m=new Float32Array(16); m[15]=1; m[12]=item.pos[0]; m[13]=item.pos[1]; m[14]=item.pos[2]; return m;})());
    const x = clip[0]/clip[3];
    const y = clip[1]/clip[3];
    const inFront = clip[2] > -clip[3] && clip[2] < clip[3];
    const dist = Math.hypot(camPos[0]-item.pos[0], camPos[1]-item.pos[1], camPos[2]-item.pos[2]);
    const pxRad = (item.rad / Math.max(dist, 0.001)) * (H/2) / Math.tan(50*RAD/2);
    const visScale = Math.min(1.0, pxRad / 8.0);
    if (!inFront || x < -1.2 || x > 1.2 || y < -1.2 || y > 1.2 || visScale < 0.05){
      div.style.opacity = 0;
      continue;
    }
    const sx = (x * 0.5 + 0.5) * W;
    const sy = (-y * 0.5 + 0.5) * H;
    div.style.left = sx + 'px';
    div.style.top = (sy + Math.max(pxRad, 6) + 6) + 'px';
    div.textContent = item.name;
    div.style.opacity = String(Math.min(1, visScale));
    const c = item.color;
    div.style.color = `rgba(${Math.round((c[0]*0.6+0.3)*255)}, ${Math.round((c[1]*0.6+0.3)*255)}, ${Math.round((c[2]*0.6+0.4)*255)}, 0.92)`;
  }
}

/* ============================================================================
 * §18 时间速度映射 (规格书 §6)
 * ============================================================================ */
function stateSpeedDaysPerSec(){
  // speed ∈ [-100, 100]
  // 规格书 §6: 速度_天每秒 = sign(v) · 1.157407e-5 · 10^(|v|/100 · 8.55)
  const v = STATE.speed;
  if (v === 0) return 0;
  const sign = v < 0 ? -1 : 1;
  const exp = Math.abs(v) / 100 * 8.55;
  return sign * 1.157407e-5 * Math.pow(10, exp);
}

function formatSpeedLabel(v){
  const daysPerSec = stateSpeedDaysPerSec();
  const sign = daysPerSec < 0 ? '−' : '';
  const a = Math.abs(daysPerSec);
  if (a === 0) return '暂停';
  if (a < 1/86400) return sign + (a * 86400 * 365.25 * 1000).toFixed(1) + ' ms/s';
  if (a < 1/86400 * 60) return sign + (a * 86400 * 60).toFixed(1) + ' s/s';
  if (a < 1) return sign + (a).toFixed(3) + ' 天/s';
  if (a < 365) return sign + a.toFixed(1) + ' 天/s';
  const years = a / 365.25;
  if (years < 100) return sign + years.toFixed(2) + ' 年/s';
  return sign + years.toFixed(0) + ' 年/s';
}

function buildObjectList(){
  const root = document.getElementById('obj-list');
  root.innerHTML = '';
  // 恒星
  const grp1 = document.createElement('div');
  grp1.className = 'grp'; grp1.textContent = '恒星';
  root.appendChild(grp1);
  addObj(root, 'sun', '太阳', '#ffd58a');
  // 行星
  const grp2 = document.createElement('div');
  grp2.className = 'grp'; grp2.textContent = '行星';
  root.appendChild(grp2);
  const order = ['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune','pluto'];
  for (const k of order) {
    const b = BODIES.find(x => x.key === k);
    if (b) addObj(root, b.id, b.name, dotColorFor(k));
  }
  // 卫星 (只列地球的月球)
  const grp3 = document.createElement('div');
  grp3.className = 'grp'; grp3.textContent = '卫星';
  root.appendChild(grp3);
  for (const m of MOONS){
    if (m.parent.id === 'earth') addMoon(root, m.id, m.name, dotColorFor(m.id));
  }
  // 矮行星 / 彗星
  const grp4 = document.createElement('div');
  grp4.className = 'grp'; grp4.textContent = '矮行星 / 彗星';
  root.appendChild(grp4);
  addObj(root, 'halley', '哈雷彗星', '#fce0a8');
}
function addObj(root, id, name, color){
  const div = document.createElement('div');
  div.className = 'obj';
  div.id = 'list-' + id;
  div.innerHTML = `<span class="dot" style="background:${color}; color:${color}"></span><span>${name}</span>`;
  div.onclick = () => selectObject(id);
  root.appendChild(div);
}
function addMoon(root, id, name, color){
  const div = document.createElement('div');
  div.className = 'obj moon';
  div.id = 'list-' + id;
  div.innerHTML = `<span class="dot" style="background:${color}; color:${color}"></span><span>${name}</span>`;
  div.onclick = () => selectObject(id);
  root.appendChild(div);
}
function dotColorFor(id){
  return ({
    sun:'#ffd58a', mercury:'#bcb1a3', venus:'#e9d39a', earth:'#5fa1e8',
    mars:'#d06a3a', jupiter:'#d2b08a', saturn:'#dec79a', uranus:'#9cd4e8',
    neptune:'#5a83d6', pluto:'#c2a58f', moon:'#dad3c4', halley:'#fce0a8'
  })[id] || '#aaa';
}

function selectObject(id){
  STATE.selectedId = id;
  // 视觉选中
  document.querySelectorAll('.obj').forEach(el => el.classList.remove('sel'));
  const li = document.getElementById('list-' + id);
  if (li) li.classList.add('sel');
  // 更新信息面板
  updateInfoPanel();
  // 平滑聚焦相机
  const tgt = getObjectWorldPos(id);
  if (tgt){
    const targetWorld = tgt.pos;
    const distApprox = tgt.distance || 5;
    // 简单的平滑过渡
    STATE.camTarget = STATE.camTarget.map((c, i) => c + (targetWorld[i] - c) * 0.0); // 立即设
    // 实际: 用 lerp 动画
    STATE._focusAnim = { from:[...STATE.camTarget], to: targetWorld, fromDist: STATE.camDist, toDist: distApprox, t: 0 };
  }
}

function getObjectWorldPos(id){
  if (id === 'sun') return { pos:[0,0,0], distance: 12 };
  const b = BODIES.find(x => x.id === id);
  if (b) return { pos:b.posWorld, distance: Math.max(b.dispRadius * 8, 1.5) };
  const m = MOONS.find(x => x.id === id);
  if (m) return { pos:m.posWorld, distance: Math.max(m.dispRadius * 6, 0.8) };
  if (id === 'halley') return { pos:HALLEY.posWorld, distance: 1.2 };
  return null;
}

function updateInfoPanel(){
  const id = STATE.selectedId;
  const nameEl = document.getElementById('info-name');
  const typeEl = document.getElementById('info-type');
  const liveEl = document.getElementById('info-live');
  const physEl = document.getElementById('info-phys');
  const orbEl = document.getElementById('info-orb');
  const descEl = document.getElementById('info-desc');
  let entry = null, info = null, data = null;
  if (id === 'sun'){
    entry = { id:'sun', name:'太阳', type:'恒星 · G2V', body:BODIES[0], desc:DESC.sun };
  } else if (id === 'halley'){
    entry = { id:'halley', name:'哈雷彗星', type:'周期彗星 · 75.32 年', data:HALLEY, desc:'哈雷彗星是最著名的周期彗星,每 75-76 年回归一次。1986 年最近一次过近日点,下一次将在 2061 年 7 月 28 日。它的轨道是高度椭圆的逆行轨道(e=0.967, i=162°),在远离太阳时只是一块冰冷的脏雪球,接近太阳时升华出标志性的彗发与双条彗尾。' };
  } else {
    const b = BODIES.find(x => x.id === id);
    if (b){ entry = { id:b.id, name:b.name, type:PHYS[b.key].type, body:b, desc:DESC[b.key] }; }
    else {
      const m = MOONS.find(x => x.id === id);
      if (m){ entry = { id:m.id, name:m.name, type:'天然卫星', moon:m, desc: '卫星半径 ' + m.radius + ' km,绕 ' + m.parent.name + ' 公转周期 ' + Math.abs(m.period).toFixed(4) + ' 天。' }; }
    }
  }
  if (!entry) return;
  nameEl.textContent = entry.name;
  typeEl.textContent = entry.type;
  liveEl.innerHTML = '';
  physEl.innerHTML = '';
  orbEl.innerHTML = '';
  descEl.textContent = entry.desc || '';

  if (entry.body){
    const b = entry.body;
    if (b.id !== 'sun'){
      const dist = Math.hypot(b.posWorld[0], b.posWorld[1], b.posWorld[2]);
      // 与地球的距离
      const earth = BODIES.find(x => x.key === 'earth');
      const distEarth = Math.hypot(b.posWorld[0]-earth.posWorld[0], b.posWorld[1]-earth.posWorld[1], b.posWorld[2]-earth.posWorld[2]);
      const lightTimeMin = (distEarth * AU_KM / 299792.458) / 60;
      addKv(liveEl, '日心距离', dist.toFixed(4) + ' AU');
      addKv(liveEl, '视黄经', (Math.atan2(b.posWorld[0], b.posWorld[2]) * DEG).toFixed(2) + '°');
      addKv(liveEl, '视黄纬', (Math.asin(b.posWorld[1] / Math.max(dist, 0.001)) * DEG).toFixed(2) + '°');
      addKv(liveEl, '地心距离', distEarth.toFixed(4) + ' AU');
      addKv(liveEl, '光行时', lightTimeMin.toFixed(2) + ' 分钟');
      addKv(liveEl, '轨道速度', b.speedKmS.toFixed(2) + ' km/s');
    } else {
      addKv(liveEl, '位置', '太阳系中心');
    }
    // 物理
    const phys = PHYS[b.key || b.id];
    if (phys){
      addKv(physEl, '半径', phys.radius.toLocaleString() + ' km');
      addKv(physEl, '质量', phys.mass.toExponential(3) + ' kg');
      addKv(physEl, '公转周期', phys.orbit);
      addKv(physEl, '卫星数', phys.moons);
      addKv(physEl, '表面温度', phys.temp);
    }
    // 轨道
    if (b.elem){
      addKv(orbEl, 'a', b.elem.a.toFixed(6) + ' AU');
      addKv(orbEl, 'e', b.elem.e.toFixed(6));
      addKv(orbEl, 'I', b.elem.I.toFixed(3) + '°');
      addKv(orbEl, 'L', b.elem.L.toFixed(3) + '°');
      addKv(orbEl, 'ϖ', b.elem.wB.toFixed(3) + '°');
      addKv(orbEl, 'Ω', b.elem.O.toFixed(3) + '°');
    }
  } else if (entry.data){
    // halley
    const d = entry.data;
    const r = Math.hypot(d.posWorld[0], d.posWorld[1], d.posWorld[2]);
    addKv(liveEl, '日心距离', r.toFixed(3) + ' AU');
    addKv(orbEl, 'a', HALLEY.a + ' AU');
    addKv(orbEl, 'e', HALLEY.e);
    addKv(orbEl, 'I', HALLEY.I + '°');
    addKv(orbEl, 'ω', HALLEY.w + '°');
    addKv(orbEl, 'Ω', HALLEY.O + '°');
    addKv(orbEl, '周期', HALLEY.P + ' 天');
    addKv(orbEl, 'Tp', 'JD ' + HALLEY.Tp);
  } else if (entry.moon){
    const m = entry.moon;
    addKv(liveEl, '距母行星', m.aDisplay.toFixed(3));
    addKv(liveEl, '相位', ((m.theta / TWO_PI) * 360).toFixed(1) + '°');
    addKv(physEl, '半径', m.radius + ' km');
    addKv(physEl, '轨道半径', m.aKm.toLocaleString() + ' km');
    addKv(physEl, '周期', m.period + ' 天');
    addKv(physEl, '倾角', m.inc + '°');
    addKv(physEl, '参考面', m.ref === 'ecliptic' ? '黄道' : '赤道');
  }
}

function addKv(parent, k, v){
  const kEl = document.createElement('div'); kEl.className = 'k'; kEl.textContent = k;
  const vEl = document.createElement('div'); vEl.className = 'v'; vEl.textContent = v;
  parent.appendChild(kEl); parent.appendChild(vEl);
}

/* ============================================================================
 * §20 鼠标 / 触摸 / 键盘交互
 * ============================================================================ */
let _pinchDist = 0;
function setupInteraction(){
  const c = canvas;
  c.addEventListener('mousedown', e => {
    STATE.mouseDown = true;
    STATE.lastX = e.clientX; STATE.lastY = e.clientY;
    c.classList.add('dragging');
  });
  c.addEventListener('mouseup', e => {
    STATE.mouseDown = false;
    c.classList.remove('dragging');
  });
  c.addEventListener('mouseleave', () => { STATE.mouseDown = false; c.classList.remove('dragging'); });
  c.addEventListener('mousemove', e => {
    if (STATE.mouseDown){
      const dx = e.clientX - STATE.lastX;
      const dy = e.clientY - STATE.lastY;
      STATE.camYaw -= dx * 0.005;
      STATE.camPitch -= dy * 0.005;
      STATE.camPitch = Math.max(-Math.PI/2 + 0.02, Math.min(Math.PI/2 - 0.02, STATE.camPitch));
      STATE.lastX = e.clientX; STATE.lastY = e.clientY;
    } else {
      // hover
      hoverPick(e.clientX, e.clientY);
    }
  });
  c.addEventListener('wheel', e => {
    e.preventDefault();
    const k = Math.exp(e.deltaY * 0.0015);
    STATE.camDist *= k;
    STATE.camDist = Math.max(0.05, Math.min(30000, STATE.camDist));
  }, { passive:false });
  c.addEventListener('click', e => {
    if (Math.hypot(e.clientX - STATE.lastX, e.clientY - STATE.lastY) < 4){
      clickPick(e.clientX, e.clientY);
    }
  });
  c.addEventListener('touchstart', e => {
    if (e.touches.length === 1){
      STATE.mouseDown = true;
      STATE.lastX = e.touches[0].clientX;
      STATE.lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      _pinchDist = Math.hypot(dx, dy);
    }
  }, { passive:true });
  c.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && STATE.mouseDown){
      const dx = e.touches[0].clientX - STATE.lastX;
      const dy = e.touches[0].clientY - STATE.lastY;
      STATE.camYaw -= dx * 0.005;
      STATE.camPitch -= dy * 0.005;
      STATE.camPitch = Math.max(-Math.PI/2 + 0.02, Math.min(Math.PI/2 - 0.02, STATE.camPitch));
      STATE.lastX = e.touches[0].clientX; STATE.lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      if (_pinchDist > 0){
        STATE.camDist *= _pinchDist / d;
        STATE.camDist = Math.max(0.05, Math.min(30000, STATE.camDist));
      }
      _pinchDist = d;
    }
  }, { passive:true });
  c.addEventListener('touchend', () => { STATE.mouseDown = false; _pinchDist = 0; });

  window.addEventListener('keydown', e => {
    if (e.key === ' '){ e.preventDefault(); togglePause(); }
    else if (e.key === 'ArrowLeft'){ STATE.speed = Math.max(-100, STATE.speed - 5); document.getElementById('speed-slider').value = STATE.speed; document.getElementById('speed-label').textContent = formatSpeedLabel(STATE.speed); }
    else if (e.key === 'ArrowRight'){ STATE.speed = Math.min(100, STATE.speed + 5); document.getElementById('speed-slider').value = STATE.speed; document.getElementById('speed-label').textContent = formatSpeedLabel(STATE.speed); }
    else if (e.key === 'h' || e.key === 'H'){ toggleUI(); }
  });
}

function togglePause(){
  STATE.paused = !STATE.paused;
  document.getElementById('btn-play').textContent = STATE.paused ? '▶ 播放' : '⏸ 暂停';
}

function toggleUI(){
  STATE.uiHidden = !STATE.uiHidden;
  document.getElementById('ui-left').classList.toggle('hidden', STATE.uiHidden);
  document.getElementById('ui-right').classList.toggle('hidden', STATE.uiHidden);
  document.getElementById('ui-bottom').classList.toggle('hidden', STATE.uiHidden);
  document.getElementById('ui-toggles').classList.toggle('hidden', STATE.uiHidden);
  document.getElementById('hint').classList.toggle('hidden', STATE.uiHidden);
}

function clickPick(cx, cy){
  const { PV } = computeMVPandDepth();
  let bestId = null, bestD = 16;
  const items = [];
  for (const b of BODIES){ items.push({ id:b.id, pos:b.posWorld, rad:b.dispRadius }); }
  for (const m of MOONS){ items.push({ id:m.id, pos:m.posWorld, rad:m.dispRadius }); }
  items.push({ id:'halley', pos:HALLEY.posWorld, rad:0.1 });
  for (const it of items){
    if (!it.pos) continue;
    const clip = m4Multiply(new Float32Array(16), PV, (()=>{const m=new Float32Array(16); m[15]=1; m[12]=it.pos[0]; m[13]=it.pos[1]; m[14]=it.pos[2]; return m;})());
    const x = clip[0]/clip[3], y = clip[1]/clip[3];
    const sx = (x*0.5 + 0.5) * W;
    const sy = (-y*0.5 + 0.5) * H;
    const d = Math.hypot(sx-cx, sy-cy);
    const threshold = Math.max(8, (it.rad / Math.max(Math.hypot(getCameraPos()[0]-it.pos[0], getCameraPos()[1]-it.pos[1], getCameraPos()[2]-it.pos[2]), 0.001)) * H/2 / Math.tan(50*RAD/2));
    if (d < bestD && d < threshold){
      bestD = d; bestId = it.id;
    }
  }
  if (bestId) selectObject(bestId);
}

function hoverPick(cx, cy){
  const { PV } = computeMVPandDepth();
  let bestId = null, bestD = 14;
  const items = [];
  for (const b of BODIES){ items.push({ id:b.id, pos:b.posWorld, rad:b.dispRadius }); }
  for (const m of MOONS){ items.push({ id:m.id, pos:m.posWorld, rad:m.dispRadius }); }
  items.push({ id:'halley', pos:HALLEY.posWorld, rad:0.1 });
  for (const it of items){
    if (!it.pos) continue;
    const clip = m4Multiply(new Float32Array(16), PV, (()=>{const m=new Float32Array(16); m[15]=1; m[12]=it.pos[0]; m[13]=it.pos[1]; m[14]=it.pos[2]; return m;})());
    const x = clip[0]/clip[3], y = clip[1]/clip[3];
    const sx = (x*0.5 + 0.5) * W;
    const sy = (-y*0.5 + 0.5) * H;
    const d = Math.hypot(sx-cx, sy-cy);
    const threshold = Math.max(8, (it.rad / Math.max(Math.hypot(getCameraPos()[0]-it.pos[0], getCameraPos()[1]-it.pos[1], getCameraPos()[2]-it.pos[2]), 0.001)) * H/2 / Math.tan(50*RAD/2));
    if (d < bestD && d < threshold){
      bestD = d; bestId = it.id;
    }
  }
  STATE.hoveredId = bestId;
  canvas.classList.toggle('over-body', !!bestId);
}

/* ============================================================================
 * §21 UI 初始化与初始化
 * ============================================================================ */
function setupUI(){
  document.getElementById('btn-play').onclick = togglePause;
  document.getElementById('btn-now').onclick = () => {
    STATE.JD = nowJD();
    updateInfoPanel();
  };
  const slider = document.getElementById('speed-slider');
  const slabel = document.getElementById('speed-label');
  slider.value = STATE.speed;
  slabel.textContent = formatSpeedLabel(STATE.speed);
  slider.addEventListener('input', () => {
    STATE.speed = +slider.value;
    slabel.textContent = formatSpeedLabel(STATE.speed);
    if (STATE.speed !== 0 && STATE.paused) togglePause();
  });
  document.getElementById('t-orbits').addEventListener('change', e => { DISPLAY.orbits = e.target.checked; });
  document.getElementById('t-names').addEventListener('change', e => { DISPLAY.names = e.target.checked; });
  document.getElementById('t-moons').addEventListener('change', e => { DISPLAY.moons = e.target.checked; });
  document.getElementById('t-asteroids').addEventListener('change', e => { DISPLAY.asteroids = e.target.checked; });
  document.getElementById('t-comets').addEventListener('change', e => { DISPLAY.comets = e.target.checked; });
  document.getElementById('t-glow').addEventListener('change', e => { DISPLAY.glow = e.target.checked; });
  document.getElementById('t-realscale').addEventListener('change', e => {
    STATE.realScaleTarget = e.target.checked ? 1.0 : 0.0;
    STATE.dirtyScale = true;
  });
}

/* ============================================================================
 * §22 主循环
 * ============================================================================ */
let _lastFrameMs = 0;

function loop(nowMs){
  const now = nowMs || performance.now();
  const dt = Math.min(0.1, (now - _lastFrameMs) / 1000);
  _lastFrameMs = now;
  STATE.lastDt = dt;

  // 聚焦动画
  if (STATE._focusAnim){
    STATE._focusAnim.t += dt;
    const k = Math.min(1, STATE._focusAnim.t / 1.0);
    const ease = 1 - Math.pow(1 - k, 3);
    STATE.camTarget[0] = STATE._focusAnim.from[0] + (STATE._focusAnim.to[0] - STATE._focusAnim.from[0]) * ease;
    STATE.camTarget[1] = STATE._focusAnim.from[1] + (STATE._focusAnim.to[1] - STATE._focusAnim.from[1]) * ease;
    STATE.camTarget[2] = STATE._focusAnim.from[2] + (STATE._focusAnim.to[2] - STATE._focusAnim.from[2]) * ease;
    STATE.camDist = STATE._focusAnim.fromDist + (STATE._focusAnim.toDist - STATE._focusAnim.fromDist) * ease;
    if (k >= 1) STATE._focusAnim = null;
  }

  // 时间显示
  document.getElementById('time-text').textContent = jdToStr(STATE.JD);
  const T = (STATE.JD - J2000_JD) / 36525;
  if (T < -2 || T > 1){
    document.getElementById('warn-banner').classList.remove('hidden');
  } else {
    document.getElementById('warn-banner').classList.add('hidden');
  }
  // 信息面板也周期性刷新
  updateInfoPanel();

  frame();
  requestAnimationFrame(loop);
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 1.8);
  W = Math.floor(window.innerWidth * dpr);
  H = Math.floor(window.innerHeight * dpr);
  canvas.width = W; canvas.height = H;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  if (gl) initFBOs(W, H);
}

/* ============================================================================
 * §23 启动
 * ============================================================================ */
function start(){
  canvas = document.getElementById('gl');
  gl = canvas.getContext('webgl2', { antialias:false, alpha:false });
  if (!gl){
    alert('您的浏览器不支持 WebGL2');
    return;
  }
  resize();
  window.addEventListener('resize', resize);
  buildAllProgs();
  buildMeshes();
  buildStars();
  buildAsteroids();
  buildBodies();
  buildMoons();
  buildOrbitRibbons();
  rebuildAllOrbitVAOs();
  // 初始日期: 2026-08-01 UTC
  STATE.JD = unixMsToJD(Date.UTC(2026, 7, 1, 0, 0, 0));
  STATE.lastJD = STATE.JD;
  STATE.speed = 0;   // 暂停起步
  setupUI();
  buildObjectList();
  setupInteraction();
  selectObject('sun');
  document.getElementById('loading').classList.add('gone');
  requestAnimationFrame(loop);
}

start();
</script>
