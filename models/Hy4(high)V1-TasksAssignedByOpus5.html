<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>太阳系 · 实时运动模型</title>
<style>
:root{
  --ink:#e8eef8; --dim:#8b9bb4; --faint:#5c6b83; --line:rgba(158,190,232,.14);
  --glass:rgba(9,14,24,.62); --accent:#8fc4ff; --warm:#ffcf94;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.lbl{font-size:9.5px;letter-spacing:.19em;color:var(--faint);text-transform:uppercase}
.panel{position:fixed;background:var(--glass);border:1px solid var(--line);border-radius:13px;
  backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);
  box-shadow:0 18px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.045)}
#ui{position:fixed;inset:0;pointer-events:none;transition:opacity .35s ease}
#ui.hidden{opacity:0}
#ui.hidden .panel,#ui.hidden #labels{pointer-events:none!important}
#left{left:18px;top:18px;bottom:132px;width:206px;display:flex;flex-direction:column;pointer-events:auto}
#left header{padding:16px 16px 13px;border-bottom:1px solid var(--line)}
#left h1{font-size:15px;font-weight:600;letter-spacing:.16em;margin-bottom:5px}
#left .sub{font-size:10px;color:var(--faint);letter-spacing:.1em;line-height:1.6}
#list{overflow-y:auto;overflow-x:hidden;flex:1;padding:9px 7px 12px;scrollbar-width:thin;scrollbar-color:#2c3c55 transparent}
#list::-webkit-scrollbar{width:5px}#list::-webkit-scrollbar-thumb{background:#2c3c55;border-radius:4px}
.grp{padding:11px 10px 5px;font-size:9px;letter-spacing:.2em;color:var(--faint)}
.item{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:7px;cursor:pointer;
  font-size:12px;color:#c2cfe2;transition:background .16s,color .16s;white-space:nowrap}
.item:hover{background:rgba(140,185,255,.09);color:#fff}
.item.sel{background:rgba(140,185,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(160,205,255,.2)}
.item.moon{padding-left:25px;font-size:11px;color:#93a5bf}
.item.moon.sel{color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 9px currentColor}
.item .en{margin-left:auto;font-size:9px;color:var(--faint);letter-spacing:.04em}
#right{right:18px;top:18px;width:272px;max-height:calc(100vh - 250px);overflow-y:auto;pointer-events:auto;
  scrollbar-width:thin;scrollbar-color:#2c3c55 transparent}
#right::-webkit-scrollbar{width:5px}#right::-webkit-scrollbar-thumb{background:#2c3c55;border-radius:4px}
#rc{padding:16px 17px 17px}
#rc .kicker{font-size:9px;letter-spacing:.24em;color:var(--faint);margin-bottom:7px}
#rc h2{font-size:21px;font-weight:600;letter-spacing:.07em;margin-bottom:3px}
#rc .en2{font-size:10px;color:var(--faint);letter-spacing:.15em;margin-bottom:14px}
.sec{margin-top:15px;padding-top:12px;border-top:1px solid var(--line)}
.sec .lbl{display:block;margin-bottom:9px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:3.5px 0;font-size:11px;line-height:1.5}
.row .k{color:var(--dim);flex:none}
.row .v{color:#dfe9f8;text-align:right;font-size:11px}
.row .v.hi{color:var(--warm)}
#desc{margin-top:13px;font-size:11px;line-height:1.85;color:#a9b9d0;letter-spacing:.015em}
#warn{margin-top:12px;padding:8px 10px;border:1px solid rgba(255,183,110,.3);border-radius:7px;
  background:rgba(255,160,70,.07);font-size:10px;color:#ffc78c;line-height:1.6;display:none}
#bottom{left:50%;transform:translateX(-50%);bottom:18px;min-width:560px;padding:10px 14px;
  display:flex;align-items:center;gap:13px;pointer-events:auto}
button{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--ink);
  border-radius:7px;font-family:inherit;font-size:11px;transition:all .16s;white-space:nowrap}
button:hover{background:rgba(140,190,255,.16);border-color:rgba(160,205,255,.4)}
button:active{transform:scale(.96)}
#play{width:34px;height:34px;flex:none;font-size:13px;border-radius:50%}
#now{padding:7px 11px;letter-spacing:.08em}
#date{min-width:172px;text-align:center;font-size:12px;letter-spacing:.06em;line-height:1.35;white-space:nowrap}
#date small{display:block;font-size:9px;color:var(--faint);letter-spacing:.14em;margin-top:3px}
#speedWrap{display:flex;flex-direction:column;gap:5px;min-width:170px}
#speedLbl{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);letter-spacing:.1em}
#speedLbl b{color:var(--accent);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:3px;
  background:linear-gradient(90deg,rgba(140,190,255,.25),rgba(140,190,255,.7));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:#d9e9ff;border:2px solid #4d7fb8;box-shadow:0 0 9px rgba(120,180,255,.7)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#d9e9ff;border:2px solid #4d7fb8}
#toggles{right:18px;bottom:18px;width:172px;padding:11px 12px;pointer-events:auto}
#toggles .lbl{display:block;margin-bottom:9px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:4.5px 0;font-size:11px;color:#b6c5da;cursor:pointer}
.tg:hover{color:#fff}
.sw{width:27px;height:15px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid var(--line);
  position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;
  background:#7d8da4;transition:transform .2s,background .2s}
.tg.on .sw{background:rgba(120,180,255,.42)}
.tg.on .sw::after{transform:translateX(12px);background:#eaf4ff;box-shadow:0 0 7px #a8d0ff}
#note{left:18px;bottom:18px;width:206px;padding:10px 13px;font-size:9.5px;color:var(--faint);
  line-height:1.65;letter-spacing:.02em;pointer-events:auto;max-height:104px;overflow:hidden}
#note b{color:#9fb4d0;font-weight:500}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-50%);font-size:10px;letter-spacing:.11em;color:#dce8f8;
  text-shadow:0 0 8px #000,0 1px 3px #000;white-space:nowrap;will-change:transform,opacity}
.tag::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;
  margin-right:6px;vertical-align:middle;opacity:.6}
#err{position:fixed;inset:0;display:none;place-items:center;background:#05070c;z-index:99;padding:40px;
  font-size:13px;color:#ffb4a8;line-height:1.9;text-align:center;white-space:pre-wrap}
#hint{position:fixed;left:50%;top:20px;transform:translateX(-50%);font-size:10px;letter-spacing:.14em;
  color:rgba(190,210,235,.5);pointer-events:none;text-shadow:0 1px 6px #000}
@media (max-width:1080px){#right{width:236px}#bottom{min-width:0;left:50%;gap:9px;padding:9px 11px}
  #note{display:none}#left{width:176px;bottom:96px}#date{min-width:140px}}
@media (max-width:760px){#left{bottom:auto;height:190px;width:150px}#right{top:auto;bottom:88px;right:10px;
  width:190px;max-height:38vh}#toggles{display:none}#bottom{bottom:10px;width:calc(100% - 20px)}
  #speedWrap{min-width:90px}#date{min-width:110px;font-size:10px}#left{left:10px;top:10px}#hint{display:none}}
</style>
</head>

<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="ui">
  <div id="note" class="panel"><b>比例说明</b><br>径向距离经幂律压缩 r^0.62，仅改变距离，<b>角位置、相位、偏心率、倾角均为真实值</b>。开启「真实距离比例」可对比。根数标称有效区间 1800–2050 年。</div>
  <aside id="left" class="panel">
    <header><h1>太阳系</h1><div class="sub">JPL 近似根数 · 实时积分<br>WebGL2 原生渲染</div></header>
    <div id="list"></div>
  </aside>
  <aside id="right" class="panel"><div id="rc"></div></aside>
  <div id="bottom" class="panel">
    <button id="play" title="空格">❚❚</button>
    <div id="date" class="mono">—<small>UTC</small></div>
    <div id="speedWrap"><div id="speedLbl"><span>时间流速</span><b id="spd" class="mono">实时</b></div>
      <input id="speed" type="range" min="-100" max="100" step="1" value="0"></div>
    <button id="now" title="回到此刻">此刻</button>
  </div>
  <div id="toggles" class="panel"><span class="lbl">显示选项</span><div id="tgbox"></div></div>
  <div id="hint">拖拽旋转 · 滚轮缩放 · 点击天体聚焦 · 空格暂停 · H 隐藏界面</div>
</div>
<div id="err"></div>

function solveKepler(M,e){

}

function eclAtE(a,e,I,Om,om,E){
  const cE=Math.cos(E),sE=Math.sin(E);

  return {x:(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,
          y:(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,
          z:(sw*sI)*xp+(cw*sI)*yp};}
function buildTrack(tr,fn,head){
  const arr=tr.arr,pts=new Array(ORB_N+1);
  for(let i=0;i<=ORB_N;i++)pts[i]=fn(i/ORB_N);
  for(let i=0;i<=ORB_N;i++){
    const p=pts[i],pr=pts[Math.max(0,i-1)],nx=pts[Math.min(ORB_N,i+1)];
    const t=V3.norm(V3.sub(nx,pr)),u=i/ORB_N;
    for(let s=0;s<2;s++){const o=(i*2+s)*ORB_STRIDE,side=s?1:-1;
      arr[o]=p[0];arr[o+1]=p[1];arr[o+2]=p[2];
      arr[o+3]=t[0];arr[o+4]=t[1];arr[o+5]=t[2];
      arr[o+6]=side;arr[o+7]=u;}
  }
  uploadTrack(tr,arr);tr.head=head;

      ((o.E%TAU)+TAU)%TAU/TAU);}

    ((E%TAU)+TAU)%TAU/TAU);

    const inc=m.inc*DEG,ci=Math.cos(inc),si=Math.sin(inc),d=m.dispD;
    const fn=u=>{const th=u*TAU,x=Math.cos(th)*d,z=Math.sin(th)*d;

  const vd=V3.norm(V3.sub(eye,origin));

  side=V3.norm(side);
  const arr=new Float32Array((TAIL_N+1)*2*5);
  for(let i=0;i<=TAIL_N;i++){const t=i/TAIL_N;
    let p=V3.add(origin,V3.scale(dir,len*t));
    if(bendVec)p=V3.add(p,V3.scale(bendVec,len*t*t));
    const w=width*(0.18+1.5*t);
    for(let s=0;s<2;s++){const sg=s?1:-1,o=(i*2+s)*5,q=V3.add(p,V3.scale(side,w*sg));
      arr[o]=q[0];arr[o+1]=q[1];arr[o+2]=q[2];arr[o+3]=sg;arr[o+4]=t;}}
  gl.bindBuffer(gl.ARRAY_BUFFER,TAIL_BUF[idx]);gl.bufferSubData(gl.ARRAY_BUFFER,0,arr);
  use(PR.TAIL);m4(PR.TAIL,'uVP',VP);v3u(PR.TAIL,'uColor',col);
  f1(PR.TAIL,'uIntensity',intensity);
  gl.bindVertexArray(TAIL_VAO[idx]);gl.drawArrays(gl.TRIANGLE_STRIP,0,(TAIL_N+1)*2);}
function sunVisibility(){
  const c=M4.xform(VP,[0,0,0,1]);
  if(c[3]<=0)return {vis:0,uv:[0.5,0.5]};
  const nx=c[0]/c[3],ny=c[1]/c[3],uv=[nx*0.5+0.5,ny*0.5+0.5];
  const sd=V3.len(eye);let vis=1;
  for(const b of BODIES){if(b.id==='Sun')continue;
    if(b.kind==='moon'&&!S.show.moons)continue;
    const q=M4.xform(VP,[b.pos[0],b.pos[1],b.pos[2],1]);if(q[3]<=0)continue;
    const d=V3.len(V3.sub(b.pos,eye));if(d>=sd)continue;
    const dx=(q[0]/q[3]-nx)*W/2,dy=(q[1]/q[3]-ny)*H/2;
    const rp=b.R*focal/Math.max(d,0.01),dd=Math.hypot(dx,dy);
    vis*=sstep(rp*0.88,rp*1.28,dd);}
  const off=Math.max(0,Math.max(Math.abs(uv[0]-0.5)-0.5,Math.abs(uv[1]-0.5)-0.5));
  return {vis:vis*Math.exp(-off*9),uv};}
/* ============================== 主渲染 ============================== */
function renderScene(JD,sv){
  gl.bindFramebuffer(gl.FRAMEBUFFER,T.msFBO||T.sceneFBO);
  gl.viewport(0,0,W,H);
  gl.depthMask(true);                    // ★ 7.1：clear 前必须恢复深度写入
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.BLEND);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);
  // 1 背景星云（深度测试/写入关闭）
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.CULL_FACE);
  use(PR.BG);m4(PR.BG,'uInvVP',M4.invert(VP));v3u(PR.BG,'uCam',eye);
  gl.bindVertexArray(GEO.BG.vao);gl.drawArrays(gl.TRIANGLES,0,3);
  // 2 恒星（加法混合，深度关）
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  use(PR.STAR);m4(PR.STAR,'uVP',VP);v3u(PR.STAR,'uCam',eye);
  f1(PR.STAR,'uTime',tSec);f1(PR.STAR,'uDpr',DPR);
  gl.bindVertexArray(GEO.STAR.vao);gl.drawArrays(gl.POINTS,0,GEO.STAR.count);
  // 3 不透明球体
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.disable(gl.BLEND);
  use(PR.BODY);m4(PR.BODY,'uVP',VP);v3u(PR.BODY,'uCam',eye);
  v3u(PR.BODY,'uSunPos',[0,0,0]);f1(PR.BODY,'uTime',tSec);
  gl.bindVertexArray(GEO.BODY.vao);
  for(const b of BODIES){
    if(b.kind==='moon'&&!S.show.moons)continue;
    if(b.kind==='comet'&&!S.show.comet)continue;
    m4(PR.BODY,'uModel',composeModel(b.pos,b.basis,b.phase,b.R));
    v3u(PR.BODY,'uCenter',b.pos);v3u(PR.BODY,'uTint',b.tint);
    v3u(PR.BODY,'uRingN',b.axis);m3(PR.BODY,'uBasisT',b.basisT);
    v2(PR.BODY,'uSpin',Math.cos(b.phase),Math.sin(b.phase));
    f1(PR.BODY,'uR',b.R);f1(PR.BODY,'uSeed',b.seed);f1(PR.BODY,'uI',b.I);f1(PR.BODY,'uAlb',b.alb);
    i1(PR.BODY,'uType',b.type);
    const rg=b.ring?RINGS[b.name]:null;
    i1(PR.BODY,'uRings',rg?1:0);i1(PR.BODY,'uRingKind',rg?rg.kind:0);
    f1(PR.BODY,'uRingIn',rg?rg.inner:0);f1(PR.BODY,'uRingOut',rg?rg.outer:0);
    gl.drawElements(gl.TRIANGLES,GEO.BODY.count,gl.UNSIGNED_SHORT,0);}
  // 4 轨道缎带
  gl.depthMask(false);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  gl.disable(gl.CULL_FACE);
  if(S.show.orbits){use(PR.ORBIT);m4(PR.ORBIT,'uVP',VP);
    v2(PR.ORBIT,'uViewport',W,H);f1(PR.ORBIT,'uHalfW',0.95*DPR);
    for(const key in TRACKS){const tr=TRACKS[key];
      if(key.startsWith('M:')&&!S.show.moons)continue;
      if(key==='C:Halley'&&!S.show.comet)continue;
      v3u(PR.ORBIT,'uColor',tr.color);f1(PR.ORBIT,'uHead',tr.head);
      f1(PR.ORBIT,'uBase',0.040);f1(PR.ORBIT,'uPeak',0.60);
      f1(PR.ORBIT,'uK',3.2);f1(PR.ORBIT,'uAlpha',key.startsWith('M:')?0.42:1.0);
      gl.bindVertexArray(tr.vao);gl.drawArrays(gl.TRIANGLE_STRIP,0,tr.count);}}
  // 5 小行星带
  gl.blendFunc(gl.ONE,gl.ONE);
  if(S.show.belt){use(PR.BELT);m4(PR.BELT,'uVP',VP);m4(PR.BELT,'uView',VIEW);
    f1(PR.BELT,'uDays',JD-J2000);f1(PR.BELT,'uScale',34);f1(PR.BELT,'uComp',S.comp);
    f1(PR.BELT,'uFocal',focal);f1(PR.BELT,'uDpr',DPR);
    v3u(PR.BELT,'uColor',[0.86,0.82,0.74]);
    gl.bindVertexArray(GEO.BELT.vao);gl.drawArrays(gl.POINTS,0,GEO.BELT.count);}
  // 6 大气壳层
  if(1){use(PR.ATMO);m4(PR.ATMO,'uVP',VP);v3u(PR.ATMO,'uCam',eye);
    v3u(PR.ATMO,'uSunPos',[0,0,0]);f1(PR.ATMO,'uTime',tSec);
    gl.bindVertexArray(GEO.ATMO.vao);
    for(const b of ATMO_BODIES){
      if(b.kind==='moon'&&!S.show.moons)continue;
      const cf=b.atmo;
      m4(PR.ATMO,'uModel',composeModel(b.pos,b.basis,0,b.R*(1+cf.h*7.5)));
      v3u(PR.ATMO,'uCenter',b.pos);v3u(PR.ATMO,'uAtmoColor',cf.c);
      f1(PR.ATMO,'uR',b.R);f1(PR.ATMO,'uScaleH',cf.h);
      f1(PR.ATMO,'uI',b.I);f1(PR.ATMO,'uStrength',cf.s);
      gl.drawElements(gl.TRIANGLES,GEO.ATMO.count,gl.UNSIGNED_SHORT,0);}}
  // 7 环系（不剔除、正常 alpha 混合）
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  use(PR.RING);m4(PR.RING,'uVP',VP);v3u(PR.RING,'uCam',eye);
  v3u(PR.RING,'uSunPos',[0,0,0]);f1(PR.RING,'uTime',tSec);
  gl.bindVertexArray(GEO.RING.vao);
  for(const b of RING_BODIES){const rg=RINGS[b.name];
    m4(PR.RING,'uModel',composeModel(b.pos,b.basis,0,b.R));
    v3u(PR.RING,'uCenter',b.pos);v3u(PR.RING,'uRingN',b.axis);v3u(PR.RING,'uRingCol',rg.col);
    f1(PR.RING,'uR',b.R);f1(PR.RING,'uI',b.I);
    f1(PR.RING,'uRingIn',rg.inner);f1(PR.RING,'uRingOut',rg.outer);
    i1(PR.RING,'uRingKind',rg.kind);
    gl.drawElements(gl.TRIANGLES,GEO.RING.count,gl.UNSIGNED_SHORT,0);}
  // 8 彗发 + 两条彗尾
  gl.blendFunc(gl.ONE,gl.ONE);
  if(S.show.comet&&halB.rAU<6.5){
    const L=clamp(Math.pow(3/halB.rAU,2),0.10,5.0);
    const pos=halB.pos;
    drawGlow(pos,halB.R*(2.6+Math.min(L,3.2)*1.4),[0.36,0.68,0.92],2.6,0.55*Math.min(L,2.4),8.1);
    const anti=V3.norm(pos);
    const p1=compress(eclToWorld(halleyEcl(JD+0.05)),34,S.comp);
    const p0=compress(eclToWorld(halleyEcl(JD-0.05)),34,S.comp);
    const vel=V3.norm(V3.sub(p1,p0)),dust=V3.norm(V3.add(V3.scale(anti,0.62),V3.scale(vel,-0.78)));
    const len=13.0*Math.min(L,3.6);
    drawTail(0,pos,anti,null,len,0.42,[0.30,0.56,1.00],0.16*Math.min(L,2.6));
    drawTail(1,pos,dust,V3.scale(vel,-0.30),len*0.74,0.85,[1.00,0.72,0.42],0.10*Math.min(L,2.6));}
  // 9 日冕（深度测试开，行星可遮挡）
  drawGlow([0,0,0],4.6*3.1,[1.00,0.56,0.22],2.2,0.62,1.3);
  drawGlow([0,0,0],4.6*9.0,[1.00,0.42,0.15],3.6,0.17,4.7);
  gl.depthMask(true);gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function postProcess(sv){
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.BLEND);gl.disable(gl.CULL_FACE);
  // MSAA 解析
  if(T.msFBO){gl.bindFramebuffer(gl.READ_FRAMEBUFFER,T.msFBO);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,T.sceneFBO);
    gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.NEAREST);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,null);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,null);}
  // 亮度阈值
  const m0=T.bloom[0];gl.bindFramebuffer(gl.FRAMEBUFFER,m0.fb);gl.viewport(0,0,m0.w,m0.h);
  use(PR.BRIGHT);bindTex(0,T.sceneTex,PR.BRIGHT,'uTex');
  v2(PR.BRIGHT,'uTexel',1/W,1/H);
  f1(PR.BRIGHT,'uThreshold',HDR?1.25:0.70);f1(PR.BRIGHT,'uKnee',0.60);
  gl.bindVertexArray(GEO.BRIGHT.vao);gl.drawArrays(gl.TRIANGLES,0,3);
  // 6 级降采样（13-tap）
  for(let i=1;i<6;i++){const s=T.bloom[i-1],d=T.bloom[i];
    gl.bindFramebuffer(gl.FRAMEBUFFER,d.fb);gl.viewport(0,0,d.w,d.h);
    use(PR.DOWN);bindTex(0,s.tex,PR.DOWN,'uTex');v2(PR.DOWN,'uTexel',1/s.w,1/s.h);
    gl.bindVertexArray(GEO.DOWN.vao);gl.drawArrays(gl.TRIANGLES,0,3);}
  // 升采样：加法混合累加，绝不采样目标 mip（7.3）
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  for(let i=4;i>=0;i--){const s=T.bloom[i+1],d=T.bloom[i];
    gl.bindFramebuffer(gl.FRAMEBUFFER,d.fb);gl.viewport(0,0,d.w,d.h);
    use(PR.UP);bindTex(0,s.tex,PR.UP,'uTex');v2(PR.UP,'uTexel',1/s.w,1/s.h);
    gl.bindVertexArray(GEO.UP.vao);gl.drawArrays(gl.TRIANGLES,0,3);}
  gl.disable(gl.BLEND);
  // 合成
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
  use(PR.COMP);bindTex(0,T.sceneTex,PR.COMP,'uScene');bindTex(1,T.bloom[0].tex,PR.COMP,'uBloom');
  v2(PR.COMP,'uRes',W,H);v2(PR.COMP,'uSunUV',sv.uv[0],sv.uv[1]);
  f1(PR.COMP,'uSunVis',sv.vis);f1(PR.COMP,'uBloomOn',S.show.bloom?1:0);
  f1(PR.COMP,'uTime',tSec);f1(PR.COMP,'uExposure',HDR?1.12:1.28);
  f1(PR.COMP,'uAspect',W/H);f1(PR.COMP,'uFlare',0.62);
  gl.bindVertexArray(GEO.COMP.vao);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.depthMask(true);gl.enable(gl.DEPTH_TEST);
}
let labelTick=0;
function updateLabels(){
  const rect=canvas.getBoundingClientRect();
  for(const id in LABELS){const d=LABELS[id],b=BMAP[id];
    const hide=!S.show.names||(b.kind==='comet'&&!S.show.comet);
    if(hide){d.style.display='none';continue;}
    const c=M4.xform(VP,[b.pos[0],b.pos[1],b.pos[2],1]);
    if(c[3]<=0||Math.abs(c[0]/c[3])>1.05||Math.abs(c[1]/c[3])>1.05){d.style.display='none';continue;}
    const dist=Math.max(V3.len(V3.sub(b.pos,eye)),0.01);
    const rp=b.R*focal/dist;
    const op=clamp(0.16+rp*0.10,0,0.95)*(S.uiHidden?0:1);
    if(op<0.04){d.style.display='none';continue;}
    d.style.display='block';
    d.style.left=((c[0]/c[3]*0.5+0.5)*rect.width)+'px';
    d.style.top=((1-(c[1]/c[3]*0.5+0.5))*rect.height-rp/DPR*0.75-11)+'px';
    d.style.opacity=op.toFixed(2);
    d.style.fontSize=(id==='Sun'?12:10)+'px';}
}
/* ============================== 主循环 ============================== */
let fSum=0,fCnt=0;
function frame(now){
  const dtRaw=now-S.lastFrame,dt=Math.min(0.05,Math.max(0,dtRaw/1000));
  S.lastFrame=now;S.tSec=now/1000;tSec=S.tSec;
  if(!S.paused){const ds=daysPerSec(S.speed)*dt;S.sim+=ds*DAY_MS;S.dtDays=ds;}
  else S.dtDays=0;
  // 距离压缩比例 0.62 ↔ 1.0 平滑过渡（约 0.4 s）
  const goal=S.show.real?1.0:0.62;
  S.comp=mix(S.comp,goal,1-Math.exp(-dt/0.115));
  if(Math.abs(S.comp-goal)<0.0004)S.comp=goal;
  resize(false);
  const JD=jdFromMs(S.sim),T=(JD-J2000)/36525;
  updateBodies(JD,T);
  // 相机平滑跟随
  if(S.focus&&BMAP[S.focus])S.goal=BMAP[S.focus].pos.slice();else S.goal=[0,0,0];
  const k=1-Math.exp(-dt/0.30);
  for(let i=0;i<3;i++)S.target[i]=mix(S.target[i],S.goal[i],k);
  S.dist=mix(S.dist,S.distGoal,k);
  eye=camEye();
  const near=Math.max(0.012,S.dist*0.0035),far=Math.max(S.dist*14,4200);
  VIEW=M4.lookAt(eye,S.target,[0,1,0]);
  const PROJ=M4.perspective(45*DEG,W/H,near,far);
  VP=M4.mul(PROJ,VIEW);S.VP=VP;S.eye=eye;focal=H/(2*Math.tan(45*DEG/2));
  rebuildTracks(T,JD);
  const sv=sunVisibility();
  renderScene(JD,sv);
  postProcess(sv);
  if(++labelTick%2===0)updateLabels();
  if(now-(S.lastInfo||0)>130){updateLive(JD);
    document.getElementById('date').innerHTML=fmtDate(S.sim)+'<small>UTC · '+
      (S.paused?'已暂停':'模拟中')+'</small>';
    S.lastInfo=now;}
  // 自适应分辨率：以实测帧时间为准，保 60 fps
  fSum+=dtRaw;fCnt++;
  if(fCnt>=90){const avg=fSum/fCnt;fSum=0;fCnt=0;
    if(avg>21.5&&renderScale>0.62){renderScale=Math.max(0.62,renderScale-0.08);resize(true);}
    else if(avg<14.5&&renderScale<1.0){renderScale=Math.min(1.0,renderScale+0.05);resize(true);}}
  requestAnimationFrame(frame);
}
document.getElementById('date').innerHTML=fmtDate(S.sim)+'<small>UTC · 模拟中</small>';
spdEl.textContent=fmtSpeed(0);
requestAnimationFrame(frame);
</script>
