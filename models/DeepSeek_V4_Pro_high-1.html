<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #info {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.6); font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; pointer-events: none;
    text-shadow: 0 0 10px rgba(100,180,255,0.5);
  }
  #controls-hint {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.25); font-size: 11px; letter-spacing: 1px;
    pointer-events: none; transition: opacity 1.5s;
  }
  .label {
    position: absolute; color: rgba(255,255,255,0.7); font-size: 11px;
    pointer-events: none; text-shadow: 0 0 6px rgba(0,0,0,0.8);
    transform: translate(-50%, -50%); white-space: nowrap;
  }
</style>
</head>
<body>
<div id="info">SOLAR SYSTEM</div>
<div id="controls-hint">drag to rotate &bull; scroll to zoom &bull; right-drag to pan</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─────────────────────────────────────
// Scene Setup
// ─────────────────────────────────────
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 25, 45);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ─────────────────────────────────────
// Controls
// ─────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 120;
controls.target.set(0, 0, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15;
controls.update();

// ─────────────────────────────────────
// Post-processing (Bloom)
// ─────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.8,   // strength
  0.4,   // radius
  0.2    // threshold
);
composer.addPass(bloomPass);

// ─────────────────────────────────────
// Lighting
// ─────────────────────────────────────
scene.add(new THREE.AmbientLight(0x111122, 0.4));
const sunLight = new THREE.PointLight(0xffffff, 250, 200, 0.5);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);
const sunLight2 = new THREE.PointLight(0xffccaa, 100, 100, 0.5);
sunLight2.position.set(0, 0, 0);
scene.add(sunLight2);

// ─────────────────────────────────────
// Starfield
// ─────────────────────────────────────
function createStarfield() {
  const starsCount = 4000;
  const positions = new Float32Array(starsCount * 3);
  const colors = new Float32Array(starsCount * 3);
  const sizes = new Float32Array(starsCount);

  for (let i = 0; i < starsCount; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 200 + Math.random() * 100;

    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);

    const colorChoice = Math.random();
    if (colorChoice < 0.1) {
      colors[i * 3] = 0.9; colors[i * 3 + 1] = 0.8; colors[i * 3 + 2] = 1.0; // blue-white
    } else if (colorChoice < 0.2) {
      colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.9; colors[i * 3 + 2] = 0.7; // warm
    } else {
      const b = 0.8 + Math.random() * 0.2;
      colors[i * 3] = b; colors[i * 3 + 1] = b; colors[i * 3 + 2] = b;
    }
    sizes[i] = 0.3 + Math.random() * 1.5;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.PointsMaterial({
    size: 0.25,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.9,
  });

  const stars = new THREE.Points(geo, mat);
  scene.add(stars);
  return stars;
}
const stars = createStarfield();

// ─────────────────────────────────────
// Sun
// ─────────────────────────────────────
function createSunTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, 0, 256);
  gradient.addColorStop(0, '#ffdd00');
  gradient.addColorStop(0.15, '#ff9900');
  gradient.addColorStop(0.3, '#ff6600');
  gradient.addColorStop(0.45, '#ff4400');
  gradient.addColorStop(0.5, '#ff3300');
  gradient.addColorStop(0.55, '#ff4400');
  gradient.addColorStop(0.7, '#ff6600');
  gradient.addColorStop(0.85, '#ff9900');
  gradient.addColorStop(1, '#ffdd00');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 512, 256);

  for (let i = 0; i < 2000; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 256;
    const r = Math.random() * 2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,${200 + Math.random() * 55},${Math.random() * 100},${0.3 + Math.random() * 0.4})`;
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapU = THREE.RepeatWrapping;
  return tex;
}

const sunGroup = new THREE.Group();
scene.add(sunGroup);

const sunGeo = new THREE.SphereGeometry(2.5, 64, 64);
const sunTex = createSunTexture();
const sunMat = new THREE.MeshStandardMaterial({
  map: sunTex,
  emissive: new THREE.Color(0xff6600),
  emissiveIntensity: 2.5,
  roughness: 0.6,
  metalness: 0.1,
});
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
sunGroup.add(sunMesh);

// Sun inner glow
const glowGeo = new THREE.SphereGeometry(2.7, 64, 64);
const glowMat = new THREE.ShaderMaterial({
  uniforms: {
    time: { value: 0 },
    sunColor: { value: new THREE.Color(0xff8800) },
  },
  vertexShader: /* glsl */ `
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec3 vWorldPos;
    void main() {
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vWorldPos = worldPos.xyz;
      vNormal = normalize(mat3(modelMatrix) * normal);
      vPosition = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */ `
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec3 vWorldPos;
    uniform float time;
    uniform vec3 sunColor;
    void main() {
      vec3 viewDir = normalize(cameraPosition - vWorldPos);
      float fresnel = 1.0 - abs(dot(viewDir, vNormal));
      fresnel = pow(fresnel, 3.5);
      float pulse = 1.0 + sin(time * 2.0) * 0.08 + sin(time * 5.0) * 0.04;
      float alpha = fresnel * 0.7 * pulse;
      gl_FragColor = vec4(sunColor, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
sunGroup.add(glowMesh);

// Sun outer corona (larger sprite)
function createGlowSprite() {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  gradient.addColorStop(0, 'rgba(255,180,60,1)');
  gradient.addColorStop(0.1, 'rgba(255,150,30,0.9)');
  gradient.addColorStop(0.25, 'rgba(255,100,20,0.6)');
  gradient.addColorStop(0.4, 'rgba(255,60,10,0.25)');
  gradient.addColorStop(0.6, 'rgba(255,30,5,0.05)');
  gradient.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);

  const tex = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({
    map: tex,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.8,
  });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(16, 16, 1);
  return sprite;
}
sunGroup.add(createGlowSprite());

// ─────────────────────────────────────
// Planet Creation
// ─────────────────────────────────────
function createPlanetTexture(baseColor, type) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');

  const base = new THREE.Color(baseColor);
  ctx.fillStyle = `rgb(${base.r*255},${base.g*255},${base.b*255})`;
  ctx.fillRect(0, 0, 256, 128);

  if (type === 'gas') {
    for (let y = 0; y < 128; y++) {
      const alpha = 0.03 + Math.sin(y * 0.3) * 0.04 + Math.sin(y * 0.7) * 0.03;
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      ctx.fillRect(0, y, 256, 1);
    }
  }

  for (let i = 0; i < 800; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 128;
    const r = Math.random() * 2.5;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    const lightness = 0.6 + Math.random() * 0.4;
    ctx.fillStyle = `rgba(${base.r*255*lightness},${base.g*255*lightness},${base.b*255*lightness},0.3)`;
    ctx.fill();
  }

  if (type === 'earth') {
    const oceanGrad = ctx.createRadialGradient(80, 30, 10, 80, 30, 120);
    oceanGrad.addColorStop(0, 'rgba(30,100,220,0.6)');
    oceanGrad.addColorStop(0.5, 'rgba(20,80,200,0.4)');
    oceanGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(0, 0, 256, 128);

    const greenGrad = ctx.createRadialGradient(180, 40, 8, 180, 40, 60);
    greenGrad.addColorStop(0, 'rgba(40,150,60,0.6)');
    greenGrad.addColorStop(0.6, 'rgba(30,120,40,0.3)');
    greenGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = greenGrad;
    ctx.fillRect(0, 0, 256, 128);

    const whiteGrad = ctx.createRadialGradient(190, 30, 3, 190, 30, 30);
    whiteGrad.addColorStop(0, 'rgba(255,255,255,0.8)');
    whiteGrad.addColorStop(0.5, 'rgba(255,255,255,0.4)');
    whiteGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = whiteGrad;
    ctx.fillRect(0, 0, 256, 128);
  }

  if (type === 'jupiter') {
    for (let y = 0; y < 128; y++) {
      const bandAlpha = 0.08 + Math.sin(y * 0.2 + 2) * 0.06 + Math.sin(y * 0.5) * 0.04;
      ctx.fillStyle = `rgba(${80 + y/2},${40 + y/3},${20},${bandAlpha})`;
      ctx.fillRect(0, y, 256, 1);
    }
    const spotX = 140, spotY = 55;
    const spotGrad = ctx.createRadialGradient(spotX, spotY, 3, spotX, spotY, 25);
    spotGrad.addColorStop(0, 'rgba(220,120,80,0.7)');
    spotGrad.addColorStop(0.4, 'rgba(200,100,60,0.4)');
    spotGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = spotGrad;
    ctx.fillRect(0, 0, 256, 128);
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapU = THREE.RepeatWrapping;
  return tex;
}

function createRingTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, 512, 0);
  gradient.addColorStop(0, 'rgba(210,180,140,0)');
  gradient.addColorStop(0.08, 'rgba(210,180,140,0.1)');
  gradient.addColorStop(0.15, 'rgba(240,220,180,0.6)');
  gradient.addColorStop(0.25, 'rgba(230,210,170,0.9)');
  gradient.addColorStop(0.35, 'rgba(200,180,140,0.7)');
  gradient.addColorStop(0.4, 'rgba(160,140,100,0.1)');
  gradient.addColorStop(0.45, 'rgba(220,200,160,0.8)');
  gradient.addColorStop(0.55, 'rgba(240,220,180,0.85)');
  gradient.addColorStop(0.65, 'rgba(200,180,140,0.5)');
  gradient.addColorStop(0.75, 'rgba(240,220,180,0.6)');
  gradient.addColorStop(0.85, 'rgba(180,160,120,0.2)');
  gradient.addColorStop(0.92, 'rgba(210,180,140,0.05)');
  gradient.addColorStop(1, 'rgba(210,180,140,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 512, 64);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

function createMoonTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#c8c8c8';
  ctx.fillRect(0, 0, 128, 64);
  for (let i = 0; i < 400; i++) {
    const x = Math.random() * 128, y = Math.random() * 64;
    const r = Math.random() * 3;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${60 + Math.random()*100},${60 + Math.random()*100},${60 + Math.random()*100},0.6)`;
    ctx.fill();
  }
  for (let i = 0; i < 30; i++) {
    const x = Math.random() * 128, y = Math.random() * 64;
    const r = 1 + Math.random() * 4;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,0.3)`;
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const planets = [];
const orbitLines = [];

const planetData = [
  { name: 'Mercury', color: '#a0a0a0', size: 0.3, distance: 4, speed: 4.15, type: 'rock' },
  { name: 'Venus',   color: '#e8cda0', size: 0.65, distance: 6.5, speed: 3.0, type: 'rock' },
  { name: 'Earth',   color: '#4488cc', size: 0.7, distance: 9, speed: 2.4, type: 'earth', hasMoon: true },
  { name: 'Mars',    color: '#d45a3a', size: 0.45, distance: 12, speed: 1.8, type: 'rock' },
  { name: 'Jupiter', color: '#d4b896', size: 2.0, distance: 17, speed: 1.1, type: 'jupiter' },
  { name: 'Saturn',  color: '#e8d5a3', size: 1.6, distance: 22, speed: 0.8, type: 'gas', hasRings: true },
  { name: 'Uranus',  color: '#7ec8e3', size: 1.1, distance: 28, speed: 0.55, type: 'gas' },
  { name: 'Neptune', color: '#4455dd', size: 1.05, distance: 33, speed: 0.42, type: 'gas' },
];

planetData.forEach((data) => {
  const tex = createPlanetTexture(data.color, data.type);
  const geo = new THREE.SphereGeometry(data.size, 48, 48);
  const mat = new THREE.MeshStandardMaterial({
    map: tex,
    roughness: data.type === 'gas' ? 0.5 : 0.8,
    metalness: 0.1,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;

  // Orbit pivot
  const pivot = new THREE.Object3D();
  pivot.rotation.y = Math.random() * Math.PI * 2;
  mesh.position.set(data.distance, 0, 0);

  // Axial tilt
  mesh.rotation.z = (Math.random() - 0.5) * 0.3;
  if (data.name === 'Uranus') mesh.rotation.z = 1.5;

  pivot.add(mesh);
  scene.add(pivot);

  const planetObj = {
    name: data.name,
    mesh,
    pivot,
    distance: data.distance,
    speed: data.speed,
    angle: Math.random() * Math.PI * 2,
    tilt: (Math.random() - 0.5) * 0.1,
    hasRings: data.hasRings,
    hasMoon: data.hasMoon,
  };

  // Saturn rings
  if (data.hasRings) {
    const ringTex = createRingTexture();
    const ringGeo = new THREE.RingGeometry(data.size * 1.3, data.size * 2.1, 128);
    const ringMat = new THREE.MeshStandardMaterial({
      map: ringTex,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.85,
      roughness: 0.6,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2 + 0.45;
    mesh.add(ring);
    planetObj.ring = ring;
  }

  // Moon for Earth
  if (data.hasMoon) {
    const moonTex = createMoonTexture();
    const moonGeo = new THREE.SphereGeometry(0.18, 24, 24);
    const moonMat = new THREE.MeshStandardMaterial({ map: moonTex, roughness: 0.8 });
    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    const moonPivot = new THREE.Object3D();
    moonMesh.position.set(1.2, 0, 0);
    moonPivot.add(moonMesh);
    mesh.add(moonPivot);
    planetObj.moonPivot = moonPivot;
    planetObj.moonMesh = moonMesh;
  }

  // Orbit line
  const orbitGeo = new THREE.BufferGeometry();
  const orbitPoints = [];
  const orbitSegments = 256;
  for (let i = 0; i <= orbitSegments; i++) {
    const angle = (i / orbitSegments) * Math.PI * 2;
    orbitPoints.push(Math.cos(angle) * data.distance, 0, Math.sin(angle) * data.distance);
  }
  orbitGeo.setAttribute('position', new THREE.Float32BufferAttribute(orbitPoints, 3));
  const orbitLine = new THREE.Line(
    orbitGeo,
    new THREE.LineBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.35, depthWrite: false })
  );
  scene.add(orbitLine);
  planetObj.orbitLine = orbitLine;

  planets.push(planetObj);
});

// ─────────────────────────────────────
// Asteroid Belt
// ─────────────────────────────────────
function createAsteroidBelt() {
  const count = 2000;
  const positions = new Float32Array(count * 3);
  const innerRadius = 14;
  const outerRadius = 16;

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = innerRadius + Math.random() * (outerRadius - innerRadius);
    const y = (Math.random() - 0.5) * 0.6;
    positions[i * 3] = Math.cos(angle) * radius;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = Math.sin(angle) * radius;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.06,
    color: 0x8888aa,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.6,
  });
  const belt = new THREE.Points(geo, mat);
  scene.add(belt);
  return belt;
}
const asteroidBelt = createAsteroidBelt();

// ─────────────────────────────────────
// Animation
// ─────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  const elapsed = performance.now() * 0.001;

  // Update sun glow shader
  glowMat.uniforms.time.value = elapsed;

  // Rotate sun
  sunGroup.children[0].rotation.y += dt * 0.15;

  // Animate stars (slow rotation)
  stars.rotation.y += dt * 0.02;
  stars.rotation.x += dt * 0.005;

  // Animate asteroid belt
  asteroidBelt.rotation.y += dt * 0.05;

  // Animate planets
  planets.forEach((p) => {
    p.pivot.rotation.y += dt * p.speed;
    p.mesh.rotation.y += dt * (0.5 + p.speed * 0.2);

    if (p.ring) {
      p.ring.rotation.z += dt * 0.15;
    }
    if (p.moonPivot) {
      p.moonPivot.rotation.y += dt * 4.5;
    }
  });

  controls.update();
  composer.render();
}

animate();

// ─────────────────────────────────────
// Resize Handler
// ─────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// Fade out controls hint
setTimeout(() => {
  const hint = document.getElementById('controls-hint');
  if (hint) hint.style.opacity = '0';
  setTimeout(() => hint && hint.remove(), 1500);
}, 8000);

console.log('%c☀ Solar System Ready %c| Drag to rotate | Scroll to zoom | Right-drag to pan',
  'color:#ffaa00;font-size:16px;', 'color:#aaa;');
</script>
</body>
</html>
