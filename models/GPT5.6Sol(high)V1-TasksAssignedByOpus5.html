function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const particles=makeParticles();
let fbo,tex,depth;
function rebuildFBO(){if(fbo){gl.deleteFramebuffer(fbo);gl.deleteTexture(tex);gl.deleteRenderbuffer(depth)}fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);let ext=gl.getExtension('EXT_color_buffer_float');gl.texImage2D(gl.TEXTURE_2D,0,ext?gl.RGBA16F:gl.RGBA8,canvas.width,canvas.height,0,gl.RGBA,ext?gl.HALF_FLOAT:gl.UNSIGNED_BYTE,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);depth=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,depth);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,canvas.width,canvas.height);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,depth);gl.bindFramebuffer(gl.FRAMEBUFFER,null)}
function resize(){let d=Math.min(devicePixelRatio||1,1.8),w=Math.round(innerWidth*d),h=Math.round(innerHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;rebuildFBO()}gl.viewport(0,0,w,h)}
function drawBody(b){gl.useProgram(sphereProg);gl.bindVertexArray(sphere.vao);gl.uniformMatrix4fv(loc(sphereProg,'uVP'),false,VP);let basis=axisBasis(axisOf(b),b.phase),r=radiusOf(b);gl.uniformMatrix4fv(loc(sphereProg,'uModel'),false,model(b.pos,basis,r));gl.uniform3fv(loc(sphereProg,'uCam'),eye);gl.uniform3fv(loc(sphereProg,'uCenter'),b.pos);gl.uniform1f(loc(sphereProg,'uType'),b.type);gl.uniform1f(loc(sphereProg,'uTime'),performance.now()/1000);gl.uniform1f(loc(sphereProg,'uAU'),b===sun?0:(b.orbit?.r||1));gl.uniform1f(loc(sphereProg,'uRingShadow'),1);gl.drawElements(gl.TRIANGLES,sphere.count,gl.UNSIGNED_SHORT,0)}
function drawOrbit(p){let data=orbitSamples(p);gl.bindVertexArray(orbitVAO);gl.bindBuffer(gl.ARRAY_BUFFER,orbitBuf);gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);gl.useProgram(orbitProg);gl.uniformMatrix4fv(loc(orbitProg,'uVP'),false,VP);gl.uniform2f(loc(orbitProg,'uRes'),canvas.width,canvas.height);gl.uniform1f(loc(orbitProg,'uHead'),mod(p.orbit.M/TAU,1));let c=hex(p.color);gl.uniform3fv(loc(orbitProg,'uColor'),c);gl.drawArrays(gl.TRIANGLE_STRIP,0,data.length/8)}
function drawRing(p,kind,outer){let b=axisBasis(axisOf(p));gl.useProgram(ringProg);gl.bindVertexArray(ring.vao);gl.uniformMatrix4fv(loc(ringProg,'uVP'),false,VP);gl.uniform3fv(loc(ringProg,'uCenter'),p.pos);gl.uniform3fv(loc(ringProg,'uX'),b[0]);gl.uniform3fv(loc(ringProg,'uZ'),b[2]);gl.uniform3fv(loc(ringProg,'uAxis'),b[1]);gl.uniform3fv(loc(ringProg,'uCam'),eye);gl.uniform1f(loc(ringProg,'uR'),radiusOf(p));gl.uniform1f(loc(ringProg,'uOuter'),outer);gl.uniform1f(loc(ringProg,'uKind'),kind);gl.drawArrays(gl.TRIANGLE_STRIP,0,ring.count)}
function hex(s){return[parseInt(s.slice(1,3),16)/255,parseInt(s.slice(3,5),16)/255,parseInt(s.slice(5,7),16)/255]}
function render(now){resize();let realDt=Math.min((now-last)/1000,.05);last=now;let dps=speedDays(speedV);let dtDays=playing?realDt*dps:0;jd+=dtDays;compress=mix(compress,compressTarget,1-Math.exp(-realDt*9));updateBodies(dtDays);if(selected!==sun&&!moons.includes(selected))cam.desiredTarget=selected.pos.slice();else if(moons.includes(selected))cam.desiredTarget=selected.pos.slice();let k=1-Math.exp(-realDt*3.8);cam.target=cam.target.map((x,i)=>mix(x,cam.desiredTarget[i],k));cam.dist=mix(cam.dist,cam.desiredDist,k);cameraMatrix();
gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,canvas.width,canvas.height);gl.depthMask(true);gl.clearColor(.0015,.002,.003,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.useProgram(bgProg);gl.bindVertexArray(null);gl.uniform2f(loc(bgProg,'uRes'),canvas.width,canvas.height);gl.uniform1f(loc(bgProg,'uYaw'),cam.yaw);gl.uniform1f(loc(bgProg,'uPitch'),cam.pitch);gl.uniform1f(loc(bgProg,'uTime'),now/1000);gl.drawArrays(gl.TRIANGLES,0,3);
gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);drawBody(sun);for(const p of planets)drawBody(p);if(opts.comet)drawBody(halley);if(opts.moons)for(const m of moons)drawBody(m);
gl.disable(gl.CULL_FACE);gl.depthMask(false);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);if(opts.orbits){for(const p of planets)drawOrbit(p);if(opts.comet)drawOrbit(halley)}if(opts.belts){gl.useProgram(pointProg);gl.bindVertexArray(particles.vao);gl.uniformMatrix4fv(loc(pointProg,'uVP'),false,VP);gl.uniform1f(loc(pointProg,'uJD'),jd);gl.uniform1f(loc(pointProg,'uCompress'),compress);gl.drawArrays(gl.POINTS,0,particles.count)}gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);drawRing(planets[4],2,1.81);drawRing(planets[5],0,2.34);drawRing(planets[6],1,2);gl.depthMask(true);
gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.useProgram(postProg);gl.bindVertexArray(null);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(loc(postProg,'uTex'),0);gl.uniform2f(loc(postProg,'uPx'),1/canvas.width,1/canvas.height);gl.uniform1i(loc(postProg,'uGlow'),opts.glow?1:0);gl.uniform1f(loc(postProg,'uGrain'),now*.00001);gl.drawArrays(gl.TRIANGLES,0,3);
updateLabels();if((now|0)%180<17){updateInfo();document.getElementById('notice').style.display=(yearFromJD(jd)<1800||yearFromJD(jd)>2050)?'block':'none'}requestAnimationFrame(render)}
function speedDays(v){if(v===0)return 1.157407e-5;return Math.sign(v)*1.157407e-5*Math.pow(10,Math.abs(v)/100*8.55)}
function speedLabel(x){let a=Math.abs(x),sg=x<0?'−':'';if(a<1/60)return sg+(a*86400).toFixed(1)+' 秒 / 秒';if(a<1)return sg+(a*24).toFixed(1)+' 小时 / 秒';if(a<365)return sg+a.toFixed(a<10?2:1)+' 天 / 秒';return sg+(a/365.25).toFixed(2)+' 年 / 秒'}
function jdDate(J){return new Date((J-2440587.5)*86400000)}function yearFromJD(J){return jdDate(J).getUTCFullYear()}
function updateInfo(){let b=selected,o=b.orbit,earth=planets[2],r=b===sun?0:(o?.r||0),ec=b.ec||[0,0,0],er=v3.len(v3.sub(ec,earth.ec));document.getElementById('objectName').textContent=b.name;document.getElementById('objectLatin').textContent=b.latin.toUpperCase();document.getElementById('mDist').textContent=b===sun?'—':r.toFixed(3)+' AU';let lon=mod(Math.atan2(ec[1],ec[0])/D,360),lat=Math.asin((ec[2]||0)/(r||1))/D;document.getElementById('mLon').textContent=b===sun?'—':lon.toFixed(1)+'° / '+lat.toFixed(1)+'°';document.getElementById('mEarth').textContent=b===sun?v3.len(earth.ec).toFixed(3)+' AU':er.toFixed(3)+' AU';let light=(b===sun?v3.len(earth.ec):er)*8.316746;document.getElementById('mLight').textContent=light<60?light.toFixed(1)+' 分':(light/60).toFixed(2)+' 时';document.getElementById('mApsis').textContent=b===sun?'—':(o.a*(1-o.e)).toFixed(2)+' / '+(o.a*(1+o.e)).toFixed(2)+' AU';document.getElementById('mSpeed').textContent=b===sun?'—':(29.7847*Math.sqrt(2/r-1/o.a)).toFixed(2)+' km/s';document.getElementById('facts').innerHTML=[['半径',(b.radius||0).toLocaleString('zh-CN')+' km'],['质量',b.mass+' kg'],['公转周期',b.period],['已知卫星',b.moons],['表面 / 云顶温度',b.temp],['轨道偏心率',b===sun?'—':o.e.toFixed(5)],['轨道倾角',b===sun?'—':o.I.toFixed(3)+'°'],['自转轴倾角',(b.bookTilt??b.tilt)+'°']].map(x=>`<div class="fact"><span>${x[0]}</span><b class="mono">${x[1]}</b></div>`).join('');document.getElementById('story').textContent=stories[b.name]||`${b.name}绕${b.parent||'太阳'}运行。卫星轨道按真实周期推进，其显示距离经过压缩以保持可见。`}
function updateLabels(){labelsEl.style.display=opts.labels?'block':'none';for(const b of [sun,...planets,halley,...moons]){let el=document.getElementById('lab-'+b.name);if(!el)continue;let p=project(b.pos),vis=p.w>0&&p.z<1&&opts.labels&&(opts.moons||!moons.includes(b))&&(opts.comet||b!==halley);el.style.opacity=vis?String(clamp(1-cam.dist/650,.25,.86)):'0';el.style.left=((p.x*.5+.5)*innerWidth)+'px';el.style.top=((1-(p.y*.5+.5))*innerHeight-12)+'px';el.classList.toggle('selected',b===selected)}}
function buildUI(){let html='<div class="sect">恒星</div>'+button(sun)+'<div class="sect" style="margin-top:9px">行星与矮行星</div>';for(const p of planets){html+=button(p);for(const m of moons.filter(x=>x.parent===p.name))html+=button(m,true)}html+='<div class="sect" style="margin-top:9px">小天体</div>'+button(halley);document.getElementById('left').innerHTML=html;document.querySelectorAll('.body-btn').forEach(el=>el.onclick=()=>focus([sun,...planets,halley,...moons].find(x=>x.name===el.dataset.name)));for(const b of [sun,...planets,halley,...moons]){let l=document.createElement('div');l.id='lab-'+b.name;l.className='label';l.textContent=b.name;labelsEl.appendChild(l)}let ts=[['orbits','轨道'],['labels','名称'],['moons','卫星'],['belts','小天体带'],['comet','哈雷彗星'],['real','真实距离比例'],['glow','辉光']];document.getElementById('toggles').innerHTML=ts.map(([k,n])=>`<label class="toggle">${n}<input type="checkbox" data-k="${k}" ${opts[k]?'checked':''}><span class="switch"></span></label>`).join('');document.querySelectorAll('.toggle input').forEach(x=>x.onchange=()=>{opts[x.dataset.k]=x.checked;if(x.dataset.k==='real')compressTarget=x.checked?1:.62});}
function button(b,sub=false){return `<button class="body-btn ${sub?'subitem':''} ${b===selected?'active':''}" data-name="${b.name}" style="--c:${b.color||'#bdc8ce'}"><i class="dot"></i><span>${b.name}</span><small style="margin-left:auto;color:#526777">${b.latin}</small></button>`}
canvas.addEventListener('pointerdown',e=>{cam.drag=true;cam.x=e.clientX;cam.y=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!cam.drag)return;let dx=e.clientX-cam.x,dy=e.clientY-cam.y;cam.x=e.clientX;cam.y=e.clientY;cam.yaw-=dx*.006;cam.pitch+=dy*.006});canvas.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-cam.x,e.clientY-cam.y)<5)pick(e.clientX,e.clientY);cam.drag=false});canvas.addEventListener('wheel',e=>{e.preventDefault();cam.desiredDist=clamp(cam.desiredDist*Math.exp(e.deltaY*.0012),4,1600)},{passive:false});
function pick(x,y){let best=null,bd=28;for(const b of [sun,...planets,...(opts.comet?[halley]:[]),...(opts.moons?moons:[])]){let p=project(b.pos);if(p.w<=0)continue;let sx=(p.x*.5+.5)*innerWidth,sy=(1-(p.y*.5+.5))*innerHeight,d=Math.hypot(sx-x,sy-y);if(d<bd){bd=d;best=b}}if(best)focus(best)}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Ⅱ':'▶'};document.getElementById('now').onclick=()=>{jd=Date.now()/86400000+2440587.5};document.getElementById('speed').oninput=e=>{speedV=+e.target.value};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click()}if(e.key==='ArrowRight'){speedV=clamp(speedV+4,-100,100);document.getElementById('speed').value=speedV}if(e.key==='ArrowLeft'){speedV=clamp(speedV-4,-100,100);document.getElementById('speed').value=speedV}if(e.key.toLowerCase()==='h'){uiHidden=!uiHidden;document.body.classList.toggle('hidden-ui',uiHidden)}});buildUI();updateBodies(0);updateInfo();
setInterval(()=>{let d=jdDate(jd);document.getElementById('utc').textContent=d.toISOString().replace('T',' · ').replace('.000Z',' UTC').replace('Z',' UTC');document.getElementById('speedRead').textContent=playing?speedLabel(speedDays(speedV)):'已暂停'},100);requestAnimationFrame(render);
