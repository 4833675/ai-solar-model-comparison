const tmpEye = V3.create();
const tmpNormalMat = new Float32Array(9);

function mat3NormalFromModel(model){
  // 均匀缩放场景下直接取模型矩阵旋转部分即可
  tmpNormalMat[0]=model[0]; tmpNormalMat[1]=model[1]; tmpNormalMat[2]=model[2];
  tmpNormalMat[3]=model[4]; tmpNormalMat[4]=model[5]; tmpNormalMat[5]=model[6];
  tmpNormalMat[6]=model[8]; tmpNormalMat[7]=model[9]; tmpNormalMat[8]=model[10];
  return tmpNormalMat;
}

/* 屏幕空间投影 (镜头眩光可见度判定 / 拾取 / HTML标签 共用) */
function projectToScreen(o, worldPos){
  const x=worldPos[0],y=worldPos[1],z=worldPos[2];
  const cx=vpMat[0]*x+vpMat[4]*y+vpMat[8]*z+vpMat[12];
  const cy=vpMat[1]*x+vpMat[5]*y+vpMat[9]*z+vpMat[13];
  const cw=vpMat[3]*x+vpMat[7]*y+vpMat[11]*z+vpMat[15];
  const vz=viewMat[2]*x+viewMat[6]*y+viewMat[10]*z+viewMat[14];
  o.visible = cw>1e-6;
  o.u = o.visible ? (cx/cw)*0.5+0.5 : -1;
  o.v = o.visible ? (cy/cw)*0.5+0.5 : -1;
  o.viewDist = -vz;
  return o;
}
const tmpProjSun = {u:0,v:0,visible:false,viewDist:0};
const tmpProjBody = {u:0,v:0,visible:false,viewDist:0};

// 太阳镜头眩光可见度: 是否在屏幕内、是否被更近的行星遮挡
function computeSunVisibility(){
  projectToScreen(tmpProjSun, [0,0,0]);
  if(!tmpProjSun.visible || tmpProjSun.viewDist<=0) return 0;
  if(tmpProjSun.u<-0.15||tmpProjSun.u>1.15||tmpProjSun.v<-0.15||tmpProjSun.v>1.15) return 0;
  const aspect = canvas.width/Math.max(1,canvas.height);
  for(const b of bodyRuntime){
    projectToScreen(tmpProjBody, b.worldPos);
    if(!tmpProjBody.visible || tmpProjBody.viewDist>=tmpProjSun.viewDist) continue;
    const screenR = (b.displayR/tmpProjBody.viewDist) * projMat[5] * 0.5;
    const du=(tmpProjSun.u-tmpProjBody.u)*aspect, dv=(tmpProjSun.v-tmpProjBody.v);
    if(Math.hypot(du,dv) < screenR*1.05) return 0;
  }
  let vis = 1;
  const edge = 0.06;
  if(tmpProjSun.u<edge) vis*=tmpProjSun.u/edge; else if(tmpProjSun.u>1-edge) vis*=(1-tmpProjSun.u)/edge;
  if(tmpProjSun.v<edge) vis*=tmpProjSun.v/edge; else if(tmpProjSun.v>1-edge) vis*=(1-tmpProjSun.v)/edge;
  return Math.max(0,Math.min(1,vis));
}

function frame(now){
  requestAnimationFrame(frame);
  const dtSec = Math.min(0.1, (now-lastFrameTime)/1000);
  lastFrameTime = now;

  resize();

  // -- 时间推进 --
  let simDeltaDays = 0;
  if(timeState.playing){
    simDeltaDays = timeState.speedDaysPerSec*dtSec;
    timeState.currentJD += simDeltaDays;
  }
  const T = jdToCentury(timeState.currentJD);

  // -- 相机平滑 --
  const smooth = 1-Math.pow(0.001, dtSec);
  V3.lerp(camera.target, camera.target, camera.targetGoal, smooth);
  camera.distance += (camera.distanceGoal-camera.distance)*smooth;

  // -- 真实距离比例动画过渡 (3.5: ~0.4秒, 期间轨道曲线逐帧重建) --
  {
    const prevCompress = DISPLAY.compress;
    const compressSmooth = 1-Math.pow(0.001, dtSec/0.4);
    DISPLAY.compress += (DISPLAY.compressTarget-DISPLAY.compress)*compressSmooth;
    if(Math.abs(DISPLAY.compress-DISPLAY.compressTarget)<0.0005) DISPLAY.compress=DISPLAY.compressTarget;
    if(Math.abs(DISPLAY.compress-prevCompress) > 1e-6){
      for(const b of bodyRuntime){
        if(b.orbitVAO){ gl.deleteBuffer(b.orbitVAO.buf); gl.deleteVertexArray(b.orbitVAO.vao); b.orbitVAO=null; }
      }
      if(comet.orbitVAO){ gl.deleteBuffer(comet.orbitVAO.buf); gl.deleteVertexArray(comet.orbitVAO.vao); comet.orbitVAO=null; }
    }
  }

  // -- 更新天体世界坐标 --
  for(const b of bodyRuntime){
    const pos = keplerToEcliptic(b.def, T);
    const rAU = Math.hypot(pos.x,pos.y,pos.z);
    const disp = rDisplay(rAU);
    const k = rAU>1e-9? disp/rAU : 0;
    eclToWorld(b.worldPos, pos.x*k, pos.y*k, pos.z*k);
    if(b.rotPeriodDays){
      let dPhase = 2*Math.PI*simDeltaDays/b.rotPeriodDays;
      dPhase = Math.max(-0.22, Math.min(0.22, dPhase)); // 7.11: 限制每帧增量, 避免高倍速频闪
      b.rotPhase += dPhase;
    }
  }
  for(const mr of moonRuntime){
    const parent = bodyRuntime.find(b=>b.def.key===mr.def.parent);
    updateMoonWorldPos(mr, timeState.currentJD, parent.worldPos, parent.displayR, parent);
  }
  updateComet(timeState.currentJD);

  // -- 若已聚焦某天体, 持续跟随其最新位置 (而不仅是点击瞬间的位置) --
  if(selectedKey){
    const sb = bodyByKey(selectedKey);
    if(sb){
      const pos = sb.getPos();
      camera.targetGoal[0]=pos[0]; camera.targetGoal[1]=pos[1]; camera.targetGoal[2]=pos[2];
    }
  }

  // -- 矩阵 --
  const aspect = canvas.width/Math.max(1,canvas.height);
  M4.perspective(projMat, 45*DEG2RAD, aspect, Math.max(0.02, camera.distance*0.0035), Math.max(camera.distance*14,4200));
  cameraEye(tmpEye);
  M4.lookAt(viewMat, tmpEye, camera.target, [0,1,0]);
  M4.multiply(vpMat, projMat, viewMat);

  M4.invert(invVpMat, vpMat);

  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneDrawFBO());
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true); // 7.1: clear 前必须开启 depthMask, 否则深度缓冲不会被清除
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  // -- 背景银河 (深度测试/写入关) --
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.useProgram(bgProg);
  gl.uniformMatrix4fv(bgU.uInvViewProj, false, invVpMat);
  gl.uniform2f(bgU.uResolution, canvas.width, canvas.height);
  gl.bindVertexArray(fsTriVAO);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindVertexArray(null);

  // -- 恒星 (深度测试关, 加法混合) --
  gl.useProgram(starProg);
  gl.uniformMatrix4fv(starU.uViewProj, false, vpMat);
  gl.uniform3f(starU.uCameraPos, tmpEye[0], tmpEye[1], tmpEye[2]);
  gl.uniform1f(starU.uTime, now*0.001);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.bindVertexArray(starVAO);
  gl.drawArrays(gl.POINTS, 0, STAR_COUNT);
  gl.bindVertexArray(null);
  gl.disable(gl.BLEND);

  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);

  // -- 太阳 --
  gl.useProgram(bodyProg);
  gl.uniformMatrix4fv(bodyU.uViewProj, false, vpMat);
  gl.uniform3f(bodyU.uLightPos, 0,0,0);
  gl.uniform3f(bodyU.uCameraPos, tmpEye[0], tmpEye[1], tmpEye[2]);
  gl.uniform1f(bodyU.uTime, now*0.001);
  {
    const model = M4.create();
    M4.fromScale(model, [SUN_DISPLAY_RADIUS,SUN_DISPLAY_RADIUS,SUN_DISPLAY_RADIUS]);
    gl.uniformMatrix4fv(bodyU.uModel, false, model);
    gl.uniformMatrix3fv(bodyU.uNormalMat, false, mat3NormalFromModel(model));
    gl.uniform3f(bodyU.uBaseColor, 1.9,1.55,0.55);
    gl.uniform1i(bodyU.uEmissive, 1);
    gl.uniform1i(bodyU.uBodyType, BODY_TYPE.sun);
    gl.bindVertexArray(sphereHi.vao);
    gl.drawElements(gl.TRIANGLES, sphereHi.count, gl.UNSIGNED_SHORT, 0);
  }

  // -- 行星 --
  gl.uniform1i(bodyU.uEmissive, 0);
  const rotYM = M4.create(), scaleM = M4.create(), rotScaleM = M4.create(), basisM = M4.create(), model = M4.create();
  for(const b of bodyRuntime){
    gl.uniform1i(bodyU.uBodyType, b.bodyType);
    M4.rotationY(rotYM, b.rotPhase);
    M4.fromScale(scaleM, [b.displayR,b.displayR,b.displayR]);
    M4.multiply(rotScaleM, rotYM, scaleM);              // RotY * Scale
    M4.fromBasis(basisM, b.xAxisW, b.axisW, b.zAxisW, [0,0,0]);
    M4.multiply(model, basisM, rotScaleM);               // Basis * RotY * Scale
    model[12]=b.worldPos[0]; model[13]=b.worldPos[1]; model[14]=b.worldPos[2]; // 平移(等价于左乘T)
    gl.uniformMatrix4fv(bodyU.uModel, false, model);
    gl.uniformMatrix3fv(bodyU.uNormalMat, false, mat3NormalFromModel(model));
    gl.uniform3fv(bodyU.uBaseColor, b.def.color);
    if(b.def.hasRing){
      gl.uniform1i(bodyU.uHasRing, 1);
      gl.uniform3fv(bodyU.uRingBasisX, b.xAxisW);
      gl.uniform3fv(bodyU.uRingBasisY, b.axisW);
      gl.uniform3fv(bodyU.uRingBasisZ, b.zAxisW);
      gl.uniform3fv(bodyU.uPlanetCenterForRing, b.worldPos);
      gl.uniform1f(bodyU.uRingPlanetR, b.displayR);
      gl.uniform1i(bodyU.uRingType, RING_TYPE[b.def.key]);
    } else {
      gl.uniform1i(bodyU.uHasRing, 0);
    }
    gl.bindVertexArray(sphereLo.vao);
    gl.drawElements(gl.TRIANGLES, sphereLo.count, gl.UNSIGNED_SHORT, 0);
  }
  gl.bindVertexArray(null);

  // -- 卫星 (无环, 不自转倾斜, 仅按公转位置放置) --
  if(display.moons){
    gl.uniform1i(bodyU.uHasRing, 0);
    for(const mr of moonRuntime){
      gl.uniform1i(bodyU.uBodyType, mr.bodyType);
      M4.fromScale(scaleM, [mr.displayR,mr.displayR,mr.displayR]);
      model.set(scaleM);
      model[12]=mr.worldPos[0]; model[13]=mr.worldPos[1]; model[14]=mr.worldPos[2];
      gl.uniformMatrix4fv(bodyU.uModel, false, model);
      gl.uniformMatrix3fv(bodyU.uNormalMat, false, mat3NormalFromModel(model));
      gl.uniform3f(bodyU.uBaseColor, 0.6,0.6,0.6);
      gl.bindVertexArray(sphereLo.vao);
      gl.drawElements(gl.TRIANGLES, sphereLo.count, gl.UNSIGNED_SHORT, 0);
    }
    gl.bindVertexArray(null);
  }

  // -- 彗核 (小型自发光球) --
  if(display.comet){
    gl.uniform1i(bodyU.uBodyType, 0);
    gl.uniform1i(bodyU.uEmissive, 1);
    {
      M4.fromScale(scaleM, [comet.displayR,comet.displayR,comet.displayR]);
      model.set(scaleM);
      model[12]=comet.worldPos[0]; model[13]=comet.worldPos[1]; model[14]=comet.worldPos[2];
      gl.uniformMatrix4fv(bodyU.uModel, false, model);
      gl.uniformMatrix3fv(bodyU.uNormalMat, false, mat3NormalFromModel(model));
      gl.uniform3f(bodyU.uBaseColor, 1.3,1.35,1.4);
      gl.bindVertexArray(sphereLo.vao);
      gl.drawElements(gl.TRIANGLES, sphereLo.count, gl.UNSIGNED_SHORT, 0);
    }
    gl.uniform1i(bodyU.uEmissive, 0);
    gl.bindVertexArray(null);
  }

  // -- 轨道缎带 (深度测试开/深度写关/加法混合, 见 4.1 管线顺序) --
  if(display.orbits){
    gl.useProgram(orbitProg);
    gl.uniformMatrix4fv(orbitU.uViewProj, false, vpMat);
    gl.uniform2f(orbitU.uViewportPx, canvas.width, canvas.height);
    gl.uniform1f(orbitU.uLineWidthPx, Math.max(1.8, Math.min(3.0, canvas.width/500)));
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE); // 着色器已输出预乘alpha颜色, 避免二次相乘导致几乎不可见
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE); // 展宽缎带随视角变化绕序不固定, 同彗尾坑 (7.12类比)
    const ORBIT_SEGMENTS = 256;
    for(const b of bodyRuntime){
      if(!b.orbitVAO){
        const pts = sampleOrbitEllipse(b.def, T, ORBIT_SEGMENTS);
        b.orbitVAO = buildOrbitRibbonVAO(gl, pts, ORBIT_SEGMENTS);
      }
      const curPos = keplerToEcliptic(b.def, T);
      const curParam = (normRad(curPos.E)+Math.PI)/(2*Math.PI);
      gl.uniform3f(orbitU.uColor, orbitLineColor(b.def.color[0]), orbitLineColor(b.def.color[1]), orbitLineColor(b.def.color[2]));
      gl.uniform1f(orbitU.uCurrentParam, curParam);
      gl.uniform1f(orbitU.uBaseAlpha, 0.34);
      gl.uniform1f(orbitU.uPeakAlpha, 0.55);
      gl.bindVertexArray(b.orbitVAO.vao);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, b.orbitVAO.count);
    }
    if(display.comet){
      if(!comet.orbitVAO){
        const COMET_ORBIT_SEGMENTS = 900; // 高偏心率轨道, 加密取样以平滑近日点附近的弯曲 (缓存一次, 成本可忽略)
        const pts = sampleCometOrbit(COMET_ORBIT_SEGMENTS);
        comet.orbitVAO = buildOrbitRibbonVAO(gl, pts, COMET_ORBIT_SEGMENTS);
      }
      let M = normRad(2*Math.PI*(timeState.currentJD-HALLEY.Tp)/HALLEY.periodDays);
      const curParam = (M+Math.PI)/(2*Math.PI);
      gl.uniform3f(orbitU.uColor, 0.65,0.80,0.95);
      gl.uniform1f(orbitU.uCurrentParam, curParam);
      gl.uniform1f(orbitU.uBaseAlpha, 0.30);
      gl.uniform1f(orbitU.uPeakAlpha, 0.5);
      gl.bindVertexArray(comet.orbitVAO.vao);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, comet.orbitVAO.count);
    }
    gl.bindVertexArray(null);
    gl.enable(gl.CULL_FACE);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  // -- 小行星带/柯伊伯带 (深度测试开/深度写关/加法混合) --
  if(display.belt){
    gl.useProgram(beltProg);
    gl.uniformMatrix4fv(beltU.uViewProj, false, vpMat);
    gl.uniform1f(beltU.uDaysSinceJ2000, timeState.currentJD - J2000_JD);
    gl.uniform1f(beltU.uCompress, DISPLAY.compress);
    gl.uniform1f(beltU.uScale, DISPLAY.SCALE);
    gl.uniform1f(beltU.uPixelScale, canvas.height*1.1);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE); // 着色器已输出预乘alpha颜色, 避免二次相乘
    gl.depthMask(false);
    gl.bindVertexArray(beltVAO);
    const br = beltParticles.ranges;
    gl.uniform3f(beltU.uColor, 0.62,0.56,0.48);
    gl.drawArrays(gl.POINTS, br.main[0], br.main[1]-br.main[0]);
    gl.uniform3f(beltU.uColor, 0.55,0.48,0.40);
    gl.drawArrays(gl.POINTS, br.hilda[0], br.hilda[1]-br.hilda[0]);
    gl.uniform3f(beltU.uColor, 0.70,0.62,0.50);
    gl.drawArrays(gl.POINTS, br.trojan[0], br.trojan[1]-br.trojan[0]);
    gl.uniform3f(beltU.uColor, 0.55,0.65,0.72);
    gl.drawArrays(gl.POINTS, br.kuiper[0], br.kuiper[1]-br.kuiper[0]);
    gl.bindVertexArray(null);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  // -- 大气 (深度测试开/深度写关/加法混合) --
  gl.useProgram(atmoProg);
  gl.uniformMatrix4fv(atmoU.uViewProj, false, vpMat);
  gl.uniform3f(atmoU.uCameraPos, tmpEye[0], tmpEye[1], tmpEye[2]);
  gl.uniform3f(atmoU.uLightPos, 0,0,0);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.depthMask(false);
  for(const b of bodyRuntime){
    const cfg = ATMO_CONFIG[b.def.key];
    if(!cfg) continue;
    const shellR = b.displayR*(1.0+cfg.scaleHeight*7.5);
    const model2 = M4.create();
    M4.fromScale(model2, [shellR,shellR,shellR]);
    model2[12]=b.worldPos[0]; model2[13]=b.worldPos[1]; model2[14]=b.worldPos[2];
    gl.uniformMatrix4fv(atmoU.uModel, false, model2);
    gl.uniform3f(atmoU.uPlanetCenter, b.worldPos[0], b.worldPos[1], b.worldPos[2]);
    gl.uniform1f(atmoU.uPlanetRadius, b.displayR);
    gl.uniform1f(atmoU.uScaleHeight, cfg.scaleHeight);
    gl.uniform3fv(atmoU.uAtmoColor, cfg.color);
    gl.uniform1f(atmoU.uIntensity, cfg.intensity);
    gl.bindVertexArray(sphereLo.vao);
    gl.drawElements(gl.TRIANGLES, sphereLo.count, gl.UNSIGNED_SHORT, 0);
  }
  gl.bindVertexArray(null);
  gl.depthMask(true);
  gl.disable(gl.BLEND);

  // -- 环系 (深度测试开/深度写关/正常alpha混合/不剔除) --
  gl.useProgram(ringProg);
  gl.uniformMatrix4fv(ringU.uViewProj, false, vpMat);
  gl.uniform3f(ringU.uCameraPos, tmpEye[0], tmpEye[1], tmpEye[2]);
  gl.uniform3f(ringU.uLightPos, 0,0,0);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  for(const b of bodyRuntime){
    if(!b.def.hasRing) continue;
    const basisM2 = M4.create(), model2 = M4.create();
    M4.fromBasis(basisM2, b.xAxisW, b.axisW, b.zAxisW, [0,0,0]);
    M4.fromScale(model2, [b.displayR,b.displayR,b.displayR]);
    M4.multiply(model2, basisM2, model2);
    model2[12]=b.worldPos[0]; model2[13]=b.worldPos[1]; model2[14]=b.worldPos[2];
    gl.uniformMatrix4fv(ringU.uModel, false, model2);
    gl.uniform3f(ringU.uPlanetCenter, b.worldPos[0], b.worldPos[1], b.worldPos[2]);
    gl.uniform1f(ringU.uPlanetRadiusWorld, b.displayR);
    gl.uniform3fv(ringU.uRingNormalWorld, b.axisW);
    gl.uniform1i(ringU.uRingType, RING_TYPE[b.def.key]);
    const mesh = ringMeshes[b.def.key];
    gl.bindVertexArray(mesh.vao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, mesh.count);
  }
  gl.bindVertexArray(null);
  gl.enable(gl.CULL_FACE);
  gl.depthMask(true);
  gl.disable(gl.BLEND);

  // -- 彗尾 (加法混合, r<6.5AU 才显示, 长度/亮度按 (3/r)^2 缩放) --
  if(display.comet && comet.rAU < 6.5){
    const scale = Math.min(4.0, Math.pow(3.0/Math.max(comet.rAU,0.15), 2.0));
    const ionDir = V3.create(); V3.normalize(ionDir, comet.worldPos); // 反日方向(太阳在原点)
    const negVel = V3.create(); V3.scale(negVel, comet.velDir, -1);
    const dustDir = V3.create();
    dustDir[0]=ionDir[0]*0.72+negVel[0]*0.28; dustDir[1]=ionDir[1]*0.72+negVel[1]*0.28; dustDir[2]=ionDir[2]*0.72+negVel[2]*0.28;
    V3.normalize(dustDir, dustDir);
    const curveDir = V3.create(); V3.cross(curveDir, dustDir, ionDir); V3.normalize(curveDir, curveDir);

    gl.useProgram(tailProg);
    gl.uniformMatrix4fv(tailU.uViewProj, false, vpMat);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE); // billboard朝向不保证绕序, 见彗尾调试记录
    gl.bindVertexArray(tailVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, tailBuf);

    const SEG = 40;
    // 离子尾: 笔直, 偏蓝
    let verts = buildTailVerts(comet.worldPos, ionDir, curveDir, 9.0*scale, SEG, 0.10, tmpEye, 0.0);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts);
    gl.uniform3f(tailU.uColor, 0.55,0.70,1.0);
    gl.uniform1f(tailU.uIntensity, 0.55*Math.min(1,scale));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, (SEG+1)*2);

    // 尘埃尾: 更宽, 沿速度反方向弯曲滞后, 偏暖黄
    verts = buildTailVerts(comet.worldPos, dustDir, curveDir, 6.5*scale, SEG, 0.32, tmpEye, 0.10);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts);
    gl.uniform3f(tailU.uColor, 1.0,0.88,0.65);
    gl.uniform1f(tailU.uIntensity, 0.35*Math.min(1,scale));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, (SEG+1)*2);

    gl.bindVertexArray(null);
    gl.enable(gl.CULL_FACE);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  // -- 解析 MSAA, 生成泛光, 做色调映射合成到默认帧缓冲 --
  resolveSceneFBO();
  if(display.glow) renderBloom();
  const sunVis = computeSunVisibility();

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.useProgram(tonemapProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fb.resolveTex);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, bloom.texs[0]);
  gl.uniform1i(tonemapU.uScene, 0);
  gl.uniform1i(tonemapU.uBloom, 1);
  gl.uniform2f(tonemapU.uResolution, canvas.width, canvas.height);
  gl.uniform1f(tonemapU.uBloomIntensity, display.glow?0.34:0.0);
  gl.uniform2f(tonemapU.uSunUV, tmpProjSun.u, tmpProjSun.v);
  gl.uniform1f(tonemapU.uSunVisibility, sunVis);
  gl.uniform1f(tonemapU.uExposure, 1.0);
  gl.uniform1f(tonemapU.uTime, now*0.001);
  gl.bindVertexArray(fsTriVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);

  // -- 界面刷新 --
  updateDateLabel();
  updateLabels();
  if(selectedKey){
    const sb = bodyByKey(selectedKey);
    if(sb) refreshInfoRealtime(sb);
  }
}
requestAnimationFrame(frame);

/* 暴露给控制台自检使用 */
window.__solar = { PLANETS, keplerToEcliptic, jdToCentury, unixMsToJD, timeState, rDisplay, DISPLAY, ALL_BODIES, focusOnBody };
</script>
