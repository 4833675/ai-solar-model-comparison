<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
canvas { display: block; }

#labels-container { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.label {
  position: absolute;
  color: #fff;
  font-size: 11px;
  font-weight: 500;
  text-shadow: 0 0 8px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.7);
  transform: translate(-50%, -50%);
  white-space: nowrap;
  letter-spacing: .5px;
  opacity: 0;
  transition: opacity .3s;
}
.label.visible { opacity: 1; }
.label.sun-label { font-size: 14px; color: #ffcc80; text-shadow: 0 0 12px rgba(255,160,0,.8), 0 0 24px rgba(255,120,0,.5); }

#ui {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; align-items: center; z-index: 20;
  background: rgba(10,10,20,.85); backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 40px; padding: 12px 20px;
}
#ui button {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.06);
  color: #ccc; cursor: pointer; font-size: 13px; font-weight: 600;
  transition: all .25s; display: flex; align-items: center; justify-content: center;
  position: relative;
}
#ui button:hover { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.5); color: #fff; transform: scale(1.15); }
#ui button.active { background: rgba(255,255,255,.25); border-color: #fff; color: #fff; box-shadow: 0 0 16px rgba(255,255,255,.3); }

#ui button[data-planet="sun"] { background: #ff8c00; border-color: #ffa500; color: #000; }
#ui button[data-planet="mercury"] { background: #8c8c8c; }
#ui button[data-planet="venus"] { background: #d4a574; }
#ui button[data-planet="earth"] { background: #4a90d9; }
#ui button[data-planet="mars"] { background: #c1440e; }
#ui button[data-planet="jupiter"] { background: #c4956a; }
#ui button[data-planet="saturn"] { background: #e0c97f; }
#ui button[data-planet="uranus"] { background: #7ec8e3; }
#ui button[data-planet="neptune"] { background: #3f54ba; }

#speed-slider {
  -webkit-appearance: none; appearance: none;
  width: 80px; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,.2); outline: none; cursor: pointer;
}
#speed-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; cursor: pointer; border: none;
}

#speed-label { color: #aaa; font-size: 11px; min-width: 38px; text-align: center; }

#info-hint {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,.5); font-size: 11px; z-index: 20;
  pointer-events: none; letter-spacing: 1px;
}

@media (max-width: 768px) {
  #ui { gap: 5px; padding: 10px 14px; border-radius: 30px; }
  #ui button { width: 28px; height: 28px; font-size: 10px; }
  #speed-slider { width: 50px; }
  .label { font-size: 9px; }
}
</style>
</head>
<body>

<div id="labels-container">
  <div class="label sun-label" data-planet="sun">Sun</div>
  <div class="label" data-planet="mercury">Mercury</div>
  <div class="label" data-planet="venus">Venus</div>
  <div class="label" data-planet="earth">Earth</div>
  <div class="label" data-planet="mars">Mars</div>
  <div class="label" data-planet="jupiter">Jupiter</div>
  <div class="label" data-planet="saturn">Saturn</div>
  <div class="label" data-planet="uranus">Uranus</div>
  <div class="label" data-planet="neptune">Neptune</div>
</div>

<div id="ui">
  <button data-planet="sun" title="Sun">S</button>
  <button data-planet="mercury" title="Mercury">M</button>
  <button data-planet="venus" title="Venus">V</button>
  <button data-planet="earth" title="Earth">E</button>
  <button data-planet="mars" title="Mars">Ma</button>
  <button data-planet="jupiter" title="Jupiter">J</button>
  <button data-planet="saturn" title="Saturn">S</button>
  <button data-planet="uranus" title="Uranus">U</button>
  <button data-planet="neptune" title="Neptune">N</button>
  <input type="range" id="speed-slider" min="0" max="3" step="0.1" value="1">
  <span id="speed-label">1×</span>
</div>

<div id="info-hint">🖱 Drag to orbit &bull; Scroll to zoom &bull; Click planets to focus</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─────────────────────────────────────
// SCENE SETUP
// ─────────────────────────────────────
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 800);
camera.position.set(35, 45, 70);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// ─────────────────────────────────────
// ORBIT CONTROLS
// ─────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 180;
controls.maxPolarAngle = Math.PI * 0.85;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15;
controls.update();

// ─────────────────────────────────────
// TEXTURE GENERATORS
// ─────────────────────────────────────
function createCanvasTexture(width, height, drawFn) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  drawFn(ctx, width, height);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function seededRandom(seed) {
  return function() {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };
}

function createPlanetTexture(baseColor, spotColor, density = 80) {
  return createCanvasTexture(256, 128, (ctx, w, h) => {
    ctx.fillStyle = baseColor;
    ctx.fillRect(0, 0, w, h);
    const rand = seededRandom(Math.random() * 10000 | 0);
    for (let i = 0; i < density; i++) {
      const x = rand() * w;
      const y = rand() * h;
      const r = rand() * 12 + 2;
      const alpha = rand() * 0.35 + 0.05;
      ctx.fillStyle = spotColor;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.ellipse(x, y, r * (0.3 + rand()), r * (0.3 + rand()), 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
}

function createJupiterTexture() {
  return createCanvasTexture(512, 256, (ctx, w, h) => {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#c4956a');
    grad.addColorStop(0.15, '#d4a574');
    grad.addColorStop(0.2, '#8b5e3c');
    grad.addColorStop(0.35, '#e8c99b');
    grad.addColorStop(0.45, '#a0522d');
    grad.addColorStop(0.55, '#dbb47a');
    grad.addColorStop(0.6, '#c08050');
    grad.addColorStop(0.7, '#e0c090');
    grad.addColorStop(0.8, '#996633');
    grad.addColorStop(0.9, '#d4a870');
    grad.addColorStop(1, '#c4956a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    const rand = seededRandom(42);
    for (let i = 0; i < 300; i++) {
      const x = rand() * w;
      const y = rand() * h;
      const r = rand() * 20 + 3;
      ctx.fillStyle = rand() > 0.5 ? '#c08050' : '#e8c99b';
      ctx.globalAlpha = rand() * 0.25;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.5, r * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 40; i++) {
      ctx.fillRect(0, rand() * h, w, rand() * 4 + 1);
    }
    ctx.globalAlpha = 1;
  });
}

function createSaturnTexture() {
  return createCanvasTexture(256, 128, (ctx, w, h) => {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#e8d5a3');
    grad.addColorStop(0.3, '#dcc890');
    grad.addColorStop(0.5, '#f0e0b0');
    grad.addColorStop(0.7, '#dcc890');
    grad.addColorStop(1, '#e8d5a3');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    const rand = seededRandom(123);
    for (let i = 0; i < 80; i++) {
      ctx.fillStyle = '#c4a870';
      ctx.globalAlpha = rand() * 0.2;
      ctx.fillRect(0, rand() * h, w, rand() * 3 + 1);
    }
    ctx.globalAlpha = 1;
  });
}

function createEarthTexture() {
  return createCanvasTexture(512, 256, (ctx, w, h) => {
    const oceanGrad = ctx.createLinearGradient(0, 0, 0, h);
    oceanGrad.addColorStop(0, '#1a4a7a');
    oceanGrad.addColorStop(0.3, '#2277bb');
    oceanGrad.addColorStop(0.5, '#3399dd');
    oceanGrad.addColorStop(0.7, '#2277bb');
    oceanGrad.addColorStop(1, '#1a4a7a');
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(0, 0, w, h);

    const rand = seededRandom(777);
    function continent(cx, cy, rx, ry, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 2; a += 0.2) {
        const px = cx + Math.cos(a) * rx * (0.6 + rand() * 0.8);
        const py = cy + Math.sin(a) * ry * (0.6 + rand() * 0.8);
        a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }

    continent(120, 70, 55, 40, '#4a8c3f');
    continent(140, 60, 35, 45, '#3d7235');
    continent(100, 80, 30, 25, '#5a9e4a');
    continent(300, 60, 50, 55, '#4a8c3f');
    continent(310, 50, 40, 30, '#3d7235');
    continent(200, 170, 35, 35, '#8b7355');
    continent(180, 180, 25, 20, '#9b8b6b');
    continent(350, 150, 30, 40, '#4a8c3f');
    continent(80, 150, 20, 25, '#5a9e4a');

    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 60; i++) {
      ctx.beginPath();
      ctx.ellipse(rand() * w, rand() * h, rand() * 25 + 5, rand() * 5 + 1, rand() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
}

function createRingTexture() {
  return createCanvasTexture(512, 64, (ctx, w, h) => {
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.08, 'rgba(180,160,130,0.1)');
    grad.addColorStop(0.15, 'rgba(210,190,150,0.7)');
    grad.addColorStop(0.22, 'rgba(200,180,140,0.9)');
    grad.addColorStop(0.28, 'rgba(160,140,110,0.4)');
    grad.addColorStop(0.32, 'rgba(220,200,160,0.85)');
    grad.addColorStop(0.38, 'rgba(190,170,140,0.9)');
    grad.addColorStop(0.44, 'rgba(140,120,90,0.3)');
    grad.addColorStop(0.48, 'rgba(200,175,145,0.7)');
    grad.addColorStop(0.55, 'rgba(180,155,125,0.6)');
    grad.addColorStop(0.62, 'rgba(160,140,110,0.3)');
    grad.addColorStop(0.68, 'rgba(190,165,135,0.5)');
    grad.addColorStop(0.75, 'rgba(150,130,100,0.2)');
    grad.addColorStop(0.85, 'rgba(130,110,80,0.08)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  });
}

function createGlowTexture(innerColor, outerColor) {
  return createCanvasTexture(256, 256, (ctx, w, h) => {
    const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    grad.addColorStop(0, innerColor);
    grad.addColorStop(0.15, innerColor);
    grad.addColorStop(0.5, outerColor);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  });
}

// ─────────────────────────────────────
// STARFIELD
// ─────────────────────────────────────
function createStarfield() {
  const count = 3500;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 250 + Math.random() * 350;
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);

    const type = Math.random();
    if (type < 0.1) { colors[i * 3] = 0.6; colors[i * 3 + 1] = 0.7; colors[i * 3 + 2] = 1.0; }
    else if (type < 0.2) { colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.85; colors[i * 3 + 2] = 0.6; }
    else if (type < 0.25) { colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.65; colors[i * 3 + 2] = 0.5; }
    else { const b = 0.7 + Math.random() * 0.3; colors[i * 3] = b; colors[i * 3 + 1] = b; colors[i * 3 + 2] = b; }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.5,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.85,
  });
  const stars = new THREE.Points(geo, mat);
  scene.add(stars);
  return { mesh: stars, geo, mat, count };
}
const starfield = createStarfield();

// ─────────────────────────────────────
// SUN (custom shader)
// ─────────────────────────────────────
const sunUniforms = {
  uTime: { value: 0 },
};
const sunVertexShader = /* glsl */ `
  varying vec2 vUv;
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  void main() {
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vWorldPos = worldPos.xyz;
    vUv = uv;
    vNormal = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const sunFragmentShader = /* glsl */ `
  varying vec2 vUv;
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  uniform float uTime;

  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }

  float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
      mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
      f.y
    );
  }

  float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    vec2 shift = vec2(100.0);
    for (int i = 0; i < 5; i++) {
      v += a * noise(p);
      p = p * 2.0 + shift;
      a *= 0.5;
    }
    return v;
  }

  void main() {
    vec2 uv = vUv;
    float t = uTime * 0.08;

    float n1 = fbm(uv * 4.0 + vec2(t * 0.7, t * 0.3));
    float n2 = fbm(uv * 7.0 - vec2(t * 0.5, t * 0.8));
    float n3 = fbm(uv * 13.0 + vec2(t * 0.2, -t * 0.4));
    float pattern = n1 * 0.55 + n2 * 0.3 + n3 * 0.15;

    vec3 dark  = vec3(0.85, 0.25, 0.02);
    vec3 mid   = vec3(1.0, 0.55, 0.08);
    vec3 bright = vec3(1.0, 0.85, 0.25);
    vec3 hot   = vec3(1.0, 0.95, 0.6);

    vec3 color = mix(dark, mid, smoothstep(0.3, 0.55, pattern));
    color = mix(color, bright, smoothstep(0.5, 0.7, pattern));
    color = mix(color, hot, smoothstep(0.68, 0.8, pattern));

    float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 2.5);
    color = mix(color, dark * 0.6, fresnel * 0.45);

    gl_FragColor = vec4(color, 1.0);
  }
`;

const sunGeo = new THREE.SphereGeometry(4.5, 128, 128);
const sunMat = new THREE.ShaderMaterial({
  uniforms: sunUniforms,
  vertexShader: sunVertexShader,
  fragmentShader: sunFragmentShader,
});
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
sunMesh.castShadow = false;
sunMesh.receiveShadow = false;
scene.add(sunMesh);

// Sun glow sprites
const glowTextures = [
  createGlowTexture('rgba(255,180,30,0.9)', 'rgba(255,100,10,0)'),
  createGlowTexture('rgba(255,140,20,0.5)', 'rgba(255,60,0,0)'),
  createGlowTexture('rgba(255,100,10,0.25)', 'rgba(200,40,0,0)'),
  createGlowTexture('rgba(255,80,5,0.12)', 'rgba(150,20,0,0)'),
];
const glowSizes = [12, 18, 28, 42];
glowTextures.forEach((tex, i) => {
  const spriteMat = new THREE.SpriteMaterial({
    map: tex,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true,
    transparent: true,
    opacity: 0.7 - i * 0.15,
  });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(glowSizes[i], glowSizes[i], 1);
  scene.add(sprite);
});

// ─────────────────────────────────────
// LIGHTING
// ─────────────────────────────────────
const sunLight = new THREE.PointLight(0xfff5e0, 80, 300, 1.4);
sunLight.position.set(0, 0, 0);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 300;
scene.add(sunLight);

const ambientLight = new THREE.AmbientLight(0x0a0a20, 0.6);
scene.add(ambientLight);

// ─────────────────────────────────────
// PLANETS
// ─────────────────────────────────────
const planetData = [
  {
    name: 'mercury', distance: 10, radius: 0.22, speed: 4.15,
    color: 0xb0b0b0, roughness: 0.7, metalness: 0.2,
    texture: () => createPlanetTexture('#b0b0b0', '#888888', 120),
  },
  {
    name: 'venus', distance: 16, radius: 0.58, speed: 1.62,
    color: 0xe8d5a3, roughness: 0.5, metalness: 0.05,
    texture: () => createPlanetTexture('#e8d5a3', '#d4c090', 80),
  },
  {
    name: 'earth', distance: 23, radius: 0.6, speed: 1.0,
    color: 0x4a90d9, roughness: 0.4, metalness: 0.05,
    texture: createEarthTexture,
  },
  {
    name: 'mars', distance: 31, radius: 0.35, speed: 0.53,
    color: 0xc1440e, roughness: 0.8, metalness: 0.1,
    texture: () => createPlanetTexture('#c1440e', '#8b2500', 100),
  },
  {
    name: 'jupiter', distance: 50, radius: 2.4, speed: 0.084,
    color: 0xc4956a, roughness: 0.35, metalness: 0.02,
    texture: createJupiterTexture,
  },
  {
    name: 'saturn', distance: 68, radius: 2.0, speed: 0.034,
    color: 0xe0c97f, roughness: 0.4, metalness: 0.05,
    texture: createSaturnTexture,
  },
  {
    name: 'uranus', distance: 85, radius: 1.3, speed: 0.012,
    color: 0x7ec8e3, roughness: 0.3, metalness: 0.03,
    texture: () => createPlanetTexture('#7ec8e3', '#5ba4c0', 50),
  },
  {
    name: 'neptune', distance: 98, radius: 1.2, speed: 0.006,
    color: 0x3f54ba, roughness: 0.3, metalness: 0.03,
    texture: () => createPlanetTexture('#3f54ba', '#2a3d8f', 50),
  },
];

const planets = [];

planetData.forEach((data) => {
  const orbitGroup = new THREE.Group();
  orbitGroup.name = data.name + '-orbit';
  scene.add(orbitGroup);

  const planetGroup = new THREE.Group();
  planetGroup.position.set(data.distance, 0, 0);
  planetGroup.name = data.name;
  orbitGroup.add(planetGroup);

  const tex = data.texture();
  const geo = new THREE.SphereGeometry(data.radius, 64, 64);
  const mat = new THREE.MeshStandardMaterial({
    map: tex,
    roughness: data.roughness,
    metalness: data.metalness,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = data.name;
  planetGroup.add(mesh);

  // Earth atmosphere
  if (data.name === 'earth') {
    const atmoGeo = new THREE.SphereGeometry(data.radius * 1.06, 64, 64);
    const atmoMat = new THREE.MeshPhongMaterial({
      color: 0x4488ff,
      emissive: 0x112244,
      emissiveIntensity: 0.3,
      transparent: true,
      opacity: 0.15,
      side: THREE.FrontSide,
      depthWrite: false,
    });
    const atmo = new THREE.Mesh(atmoGeo, atmoMat);
    atmo.name = 'earth-atmosphere';
    planetGroup.add(atmo);
  }

  // Orbit ring
  const orbitPoints = [];
  const segments = 256;
  for (let i = 0; i <= segments; i++) {
    const angle = (i / segments) * Math.PI * 2;
    orbitPoints.push(new THREE.Vector3(Math.cos(angle) * data.distance, 0, Math.sin(angle) * data.distance));
  }
  const orbitLineGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
  const orbitLineMat = new THREE.LineBasicMaterial({
    color: 0x334466,
    transparent: true,
    opacity: 0.25,
    depthWrite: false,
  });
  const orbitLine = new THREE.Line(orbitLineGeo, orbitLineMat);
  scene.add(orbitLine);

  planets.push({
    ...data,
    orbitGroup,
    planetGroup,
    mesh,
    angle: Math.random() * Math.PI * 2,
  });
});

// ─────────────────────────────────────
// EARTH'S MOON
// ─────────────────────────────────────
const earthData = planets.find(p => p.name === 'earth');
const moonOrbitGroup = new THREE.Group();
earthData.planetGroup.add(moonOrbitGroup);

const moonGeo = new THREE.SphereGeometry(0.16, 32, 32);
const moonTex = createPlanetTexture('#cccccc', '#aaaaaa', 60);
const moonMat = new THREE.MeshStandardMaterial({ map: moonTex, roughness: 0.8, metalness: 0.05 });
const moonMesh = new THREE.Mesh(moonGeo, moonMat);
moonMesh.position.set(1.1, 0, 0);
moonMesh.castShadow = true;
moonMesh.name = 'moon';
moonOrbitGroup.add(moonMesh);

// ─────────────────────────────────────
// SATURN'S RINGS
// ─────────────────────────────────────
const saturnData = planets.find(p => p.name === 'saturn');
const ringTex = createRingTexture();
const ringGeo = new THREE.RingGeometry(saturnData.radius * 1.3, saturnData.radius * 2.3, 128);
// Rotate UVs for RingGeometry
const pos = ringGeo.attributes.position;
const uv = ringGeo.attributes.uv;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const y = pos.getY(i);
  const dist = Math.sqrt(x * x + y * y);
  uv.setXY(i, (dist - saturnData.radius * 1.3) / (saturnData.radius * 2.3 - saturnData.radius * 1.3), 0.5);
}
const ringMat = new THREE.MeshBasicMaterial({
  map: ringTex,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.75,
  depthWrite: false,
});
const ringMesh = new THREE.Mesh(ringGeo, ringMat);
ringMesh.rotation.x = -Math.PI / 2 + 0.45;
ringMesh.name = 'saturn-rings';
saturnData.planetGroup.add(ringMesh);

// ─────────────────────────────────────
// ASTEROID BELT
// ─────────────────────────────────────
function createAsteroidBelt() {
  const count = 2000;
  const positions = new Float32Array(count * 3);
  const innerR = 36, outerR = 46;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = innerR + Math.random() * (outerR - innerR);
    const y = (Math.random() - 0.5) * 0.8;
    positions[i * 3] = Math.cos(angle) * r;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = Math.sin(angle) * r;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.15,
    color: 0x888899,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.5,
  });
  const belt = new THREE.Points(geo, mat);
  belt.name = 'asteroid-belt';
  scene.add(belt);
  return belt;
}
createAsteroidBelt();

// ─────────────────────────────────────
// LABELS
// ─────────────────────────────────────
const labelEls = {};
document.querySelectorAll('.label').forEach(el => {
  labelEls[el.dataset.planet] = el;
});

// ─────────────────────────────────────
// FOCUS / CAMERA TARGET SMOOTHING
// ─────────────────────────────────────
let focusTarget = new THREE.Vector3(0, 0, 0);
let focusZoom = 60;
let isFocusing = false;

function focusOnPlanet(name) {
  if (name === 'sun') {
    focusTarget.set(0, 0, 0);
    focusZoom = 14;
  } else {
    const planet = planets.find(p => p.name === name);
    if (planet) {
      const worldPos = new THREE.Vector3();
      planet.mesh.getWorldPosition(worldPos);
      focusTarget.copy(worldPos);
      focusZoom = planet.radius * 8 + 4;
    }
  }
  isFocusing = true;
  document.querySelectorAll('#ui button').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`#ui button[data-planet="${name}"]`);
  if (btn) btn.classList.add('active');
}

document.querySelectorAll('#ui button').forEach(btn => {
  btn.addEventListener('click', () => focusOnPlanet(btn.dataset.planet));
});

// Speed slider
const speedSlider = document.getElementById('speed-slider');
const speedLabel = document.getElementById('speed-label');
let speedMultiplier = 1.0;
speedSlider.addEventListener('input', () => {
  speedMultiplier = parseFloat(speedSlider.value);
  speedLabel.textContent = speedMultiplier.toFixed(1) + '×';
});

// ─────────────────────────────────────
// ANIMATION
// ─────────────────────────────────────
const clock = new THREE.Clock();

function animate(timestamp) {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  const elapsed = timestamp * 0.001;

  // Update sun shader
  sunUniforms.uTime.value = elapsed;

  // Update planet orbits
  planets.forEach(p => {
    p.angle += p.speed * dt * speedMultiplier;
    p.orbitGroup.rotation.y = p.angle;
    p.mesh.rotation.y += dt * 0.5;
  });

  // Moon orbit
  moonOrbitGroup.rotation.y += dt * 5.0 * speedMultiplier;

  // Smooth camera focus
  if (isFocusing) {
    controls.autoRotate = false;
    controls.target.lerp(focusTarget, 0.06);
    const dist = camera.position.distanceTo(controls.target);
    const desiredDist = focusZoom;
    const newDist = dist + (desiredDist - dist) * 0.06;
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, newDist);
    if (controls.target.distanceTo(focusTarget) < 0.1 && Math.abs(dist - desiredDist) < 0.3) {
      isFocusing = false;
      controls.autoRotate = true;
    }
  }

  controls.update();

  // Update labels
  const halfW = window.innerWidth / 2;
  const halfH = window.innerHeight / 2;
  for (const [name, el] of Object.entries(labelEls)) {
    let worldPos;
    if (name === 'sun') {
      worldPos = new THREE.Vector3(0, 0, 0);
    } else {
      const planet = planets.find(p => p.name === name);
      if (!planet) continue;
      worldPos = new THREE.Vector3();
      planet.mesh.getWorldPosition(worldPos);
    }

    const screenPos = worldPos.clone().project(camera);
    const x = (screenPos.x * halfW) + halfW;
    const y = -(screenPos.y * halfH) + halfH;
    el.style.left = x + 'px';
    el.style.top = (y - (name === 'sun' ? 28 : 18)) + 'px';

    if (screenPos.z > 1 || x < -50 || x > window.innerWidth + 50 || y < -50 || y > window.innerHeight + 50) {
      el.classList.remove('visible');
    } else {
      el.classList.add('visible');
    }
  }

  renderer.render(scene, camera);
}

// ─────────────────────────────────────
// RESIZE
// ─────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─────────────────────────────────────
// KEYBOARD SHORTCUTS
// ─────────────────────────────────────
window.addEventListener('keydown', (e) => {
  const keys = {
    '1': 'sun', '2': 'mercury', '3': 'venus', '4': 'earth', '5': 'mars',
    '6': 'jupiter', '7': 'saturn', '8': 'uranus', '9': 'neptune',
    '0': 'sun',
  };
  if (keys[e.key]) {
    focusOnPlanet(keys[e.key]);
  }
  if (e.key === 'r' || e.key === 'R') {
    focusTarget.set(0, 0, 0);
    focusZoom = 55;
    isFocusing = true;
    document.querySelectorAll('#ui button').forEach(b => b.classList.remove('active'));
  }
});

// ─────────────────────────────────────
// START
// ─────────────────────────────────────
requestAnimationFrame(animate);

console.log('☀ Solar System ready — Drag to orbit | Scroll to zoom | 1-9 to focus planets | R to reset');
</script>
