              t*ax.x*ax.z+s*ax.y, t*ax.y*ax.z-s*ax.x, t*ax.z*ax.z+c);

  if(uType==1){ /* 水星：撞击坑 */
    float n=fbmN(p*3.0,3,2.0,0.5);
    alb=vec3(0.55,0.50,0.45)*(0.72+0.5*n)*0.55;
    float am=0.0;
    craterLayer(p,5.0,1.00,h,am); craterLayer(p,12.0,0.52,h,am);
    craterLayer(p,28.0,0.26,h,am); craterLayer(p,62.0,0.13,h,am);
    alb*=1.0+am*0.8;
  } else if(uType==2){ /* 金星：厚云涡旋 */
    float vn=fbmN(p*3.4+vec3(uTime*0.002,0.0,uTime*0.0012),5,2.0,0.5);
    float latV=asin(p.y);
    float bandV=sin(latV*14.0+vn*4.0)*0.5+0.5;
    alb=vec3(0.88,0.80,0.62)*(0.76+0.26*(vn-0.5)+0.10*(bandV-0.5));
    alb*=0.72;
  } else if(uType==3){ /* 地球 */
    float hgt=fbmN(p*4.5,7,2.0,0.5);
    float sea=0.552;
    float landF=step(sea,hgt);
    float el=clamp((hgt-sea)/0.4,0.0,1.0);
    float coast=1.0-clamp(abs(hgt-sea)/0.012,0.0,1.0);
    vec3 ocean=mix(vec3(0.004,0.030,0.070),vec3(0.020,0.120,0.120),coast*0.75);
    float vegN=fbmN(p*6.0+vec3(9.3,2.7,5.5),4,2.0,0.5);
    vec3 landC=mix(vec3(0.20,0.34,0.11),vec3(0.62,0.50,0.30),smoothstep(0.45,0.68,vegN));
    landC=mix(landC,vec3(0.42,0.36,0.30),smoothstep(0.14,0.34,el));
    float latc=abs(p.y);
    landC=mix(landC,vec3(0.90,0.92,0.96),smoothstep(0.58,0.72,latc)*(1.0-0.5*vegN));
    landC=mix(landC,vec3(0.90,0.92,0.96),smoothstep(0.70,0.80,latc));
    alb=mix(ocean,landC,landF);
    h=landF*el*0.15;
    spec=(1.0-landF)*0.85; shin=420.0;
    float csp=0.012+0.055*(1.0-abs(p.y));
    float ca=cos(uTime*csp), sa=sin(uTime*csp);
    vec3 cq=vec3(p.x*ca-p.z*sa,p.y,p.x*sa+p.z*ca);
    float cN=fbmN(cq*4.0+vec3(1.7,8.1,3.3),5,2.0,0.5);
    float clat=abs(p.y);
    float amt=clamp(0.34+0.38*exp(-pow(clat/0.16,2.0))+0.42*exp(-pow((clat-0.55)/0.16,2.0)),0.10,0.85);
    cloud=smoothstep(1.0-0.62*amt,1.35-0.62*amt,cN);
    float lN=fbmN(p*13.0+vec3(4.7,2.1,9.9),4,2.0,0.5);
    float lg=pow(clamp(lN,0.0,1.0),9.0)*landF*(1.0-cloud*0.7);
    em=vec3(1.0,0.78,0.42)*lg*1.3;
  } else if(uType==4){ /* 火星 */
    float n=fbmN(p*2.6,4,2.0,0.5);
    alb=vec3(0.52,0.19,0.08)*(0.66+0.55*n);
    float dich=smoothstep(-0.30,0.20,p.y);
    float am=0.0;
    craterLayer(p,5.0,0.5*(1.0-0.78*dich),h,am);
    craterLayer(p,12.0,0.26*(1.0-0.78*dich),h,am);
    craterLayer(p,28.0,0.13*(1.0-0.78*dich),h,am);
    craterLayer(p,62.0,0.07*(1.0-0.78*dich),h,am);
    alb*=1.0+am*0.7;
    float capN=fbmN(p*4.0,3,2.0,0.5);
    float cap=smoothstep(0.52,0.70,abs(p.y)+0.07*capN);
    alb=mix(alb,vec3(0.94,0.94,0.97),cap*0.92);
    float lon=atan(p.z,p.x);
    float vm=exp(-pow(p.y/0.055,2.0))*exp(-pow((lon+1.05)/0.30,2.0));
    alb*=1.0-0.40*vm;
  } else if(uType==5||uType==6){ /* 木星 / 土星 */
    float turb=(uType==5)?1.0:0.42;
    float latR=asin(p.y);
    float latD=latR*57.2958;
    float n1=fbmN(p*2.2,4,2.0,0.5);
    float n2=fbmN(p*6.0+vec3(13.7,2.9,5.1),3,2.0,0.5);
    float latW=latD+(n1-0.5)*16.0*turb+(n2-0.5)*8.0*turb;
    float bands=sin(latW*3.14159/45.0+0.3)+0.65*sin(latW*3.14159/20.0+1.7)
               +0.45*sin(latW*3.14159/10.6+2.9)+0.30*sin(latW*3.14159/6.0+0.8);
    bands/=2.4;
    bands*=1.0-0.94*smoothstep(46.0,90.0,abs(latW));
    vec3 cB=vec3(0.86,0.76,0.60)*0.50;
    vec3 cD=vec3(0.55,0.42,0.30)*0.48;
    alb=mix(cD,cB,clamp(0.5+bands*1.1,0.0,1.0));
    alb*=1.0+0.10*(n2-0.5);
    vec4 wv=worley(vec3(p.x*8.0,p.y*2.4,p.z*8.0));
    float vortex=sstep(0.30,0.06,wv.x);
    alb=mix(alb,mix(cB,cD,0.5)*1.05,vortex*0.35);
    if(uType==5){ /* 大红斑 */
      float lonG=atan(p.z,p.x)*57.2958;
      float lonC=(lonG>150.0)?lonG-360.0:lonG;
      float gx=(lonC+60.0)/17.0;
      float gy=(latD+22.0)/8.0;
      float d2=gx*gx+gy*gy;
      float grs=exp(-d2*3.0);
      if(d2<1.6){
        float angp=atan(gy,gx);
        float rr=sqrt(d2);
        float sp=fbmN(vec3(cos(angp+rr*5.0)*4.0,sin(angp+rr*5.0)*4.0,uTime*0.05),3,2.0,0.5);
        vec3 gCol=mix(vec3(0.66,0.24,0.15),vec3(0.92,0.58,0.38),sp);
        alb=mix(alb,gCol,grs);
        alb+=vec3(0.85,0.62,0.45)*exp(-pow((d2-1.0)/0.22,2.0))*0.16*sstep(1.5,0.9,d2);
      }
    } else if(latR>0.80){ /* 土星北极六边形 */
      float lonD=atan(p.z,p.x)*57.2958;
      float hexE=0.115/cos(3.14159*(mod(lonD,60.0)-30.0)/180.0);
      float hexLine=exp(-pow((latR-hexE)/0.020,2.0));
      alb*=1.0-0.55*hexLine;
    }
  } else if(uType==7||uType==8){ /* 冰巨行星 */
    float lat=asin(p.y);
    float band=sin(lat*8.0)*0.08+sin(lat*21.0+1.3)*0.05;
    vec3 base=(uType==7)?vec3(0.42,0.66,0.68):vec3(0.24,0.44,0.80);
    alb=base*(0.50+0.12*band+0.10*fbmN(p*3.0,3,2.0,0.5));
    float mN=fbmN(p*9.0+vec3(4.4,2.2,8.8),3,2.0,0.5);
    float streak=pow(clamp((mN-0.60)/0.40,0.0,1.0),1.6)*smoothstep(0.05,0.40,abs(lat));
    alb+=alb*streak*0.5;
    if(uType==8){
      float lon=atan(p.z,p.x);
      float dsp=(lon+1.2)*(lon+1.2)/0.09+(lat-0.50)*(lat-0.50)/0.045;
      alb*=1.0-0.55*exp(-dsp);
    }
  } else if(uType==9){ /* 月球：月海 + 辐射纹 */
    float n=fbmN(p*2.6,4,2.0,0.5);
    alb=vec3(0.60,0.58,0.55)*(0.70+0.45*n)*0.30;
    float mariaN=fbmN(p*2.2+vec3(7.7,3.1,1.1),3,2.0,0.5);
    float maria=smoothstep(0.60,0.74,mariaN);
    alb=mix(alb,alb*0.55,maria);
    float am=0.0, mf=1.0-0.70*maria;
    craterLayer(p,5.0,1.00*mf,h,am); craterLayer(p,12.0,0.52*mf,h,am);
    craterLayer(p,28.0,0.26*mf,h,am); craterLayer(p,62.0,0.13*mf,h,am);
    alb*=1.0+am*0.9;
    float rays=0.0;
    rays=max(rays,pow(max(dot(p,normalize(vec3(0.3,-0.6,0.4))),0.0),70.0));
    rays=max(rays,pow(max(dot(p,normalize(vec3(-0.8,0.1,0.2))),0.0),90.0));
    rays=max(rays,pow(max(dot(p,normalize(vec3(0.5,0.7,-0.3))),0.0),110.0));
    alb+=vec3(0.8,0.8,0.78)*rays*0.35*(1.0-maria);
  } else if(uType==10){ /* 木卫一 */
    float n=fbmN(p*4.0,4,2.0,0.5);
    alb=vec3(0.92,0.60,0.28)*(0.55+0.30*n)*0.85;
    vec4 w=worley(p*7.0);
    float spots=sstep(0.32,0.13,w.x);
    alb=mix(alb,vec3(0.24,0.12,0.06),spots*0.92);
    em=vec3(1.0,0.55,0.20)*sstep(0.06,0.02,w.x)*0.6*spots;
  } else if(uType==11){ /* 木卫二：线纹网络 */
    alb=vec3(0.86,0.88,0.92)*0.60;
    float n1=fbmN(p*3.0,3,2.0,0.5);
    alb*=0.90+0.16*(n1-0.5);
    float lin=abs(fbmN(p*6.0,3,2.0,0.5)-0.5);
    lin+=0.7*abs(fbmN(p*12.0+vec3(3.1,7.7,1.3),3,2.0,0.5)-0.5);
    lin+=0.4*abs(fbmN(p*24.0+vec3(9.9,2.2,6.6),3,2.0,0.5)-0.5);
    float lm=sstep(0.060,0.022,lin);
    alb=mix(alb,vec3(0.42,0.26,0.16),lm*0.8);
  } else if(uType==12){ /* 木卫三：亮色沟槽 */
    float n=fbmN(p*2.6,4,2.0,0.5);
    alb=vec3(0.36,0.33,0.30)*(0.60+0.5*n)*0.85;
    float gr=abs(fbmN(p*7.0,3,2.0,0.5)-0.5);
    gr+=0.6*abs(fbmN(p*16.0+vec3(5.5,8.8,2.2),3,2.0,0.5)-0.5);
    float gm=sstep(0.065,0.022,gr);
    alb=mix(alb,vec3(0.72,0.72,0.70)*0.9,gm*0.85);
    float am=0.0;
    craterLayer(p,6.0,0.30,h,am); craterLayer(p,14.0,0.15,h,am);
    alb*=1.0+am*0.7;
  } else if(uType==13){ /* 土卫六：橙色浓雾 */
    float n=fbmN(p*3.2,4,2.0,0.5);
    alb=vec3(0.80,0.62,0.38)*(0.60+0.28*n)*0.62;
    float dark=fbmN(p*2.0+vec3(7.7,1.1,4.4),3,2.0,0.5);
    alb*=0.80+0.30*dark;
  } else if(uType==14){ /* 冥王星：克苏鲁带 + 心形平原 */
    float n=fbmN(p*3.0,4,2.0,0.5);
    alb=vec3(0.55,0.45,0.38)*(0.62+0.5*n)*0.90;
    float eq=exp(-pow(p.y/0.16,2.0));
    float eqN=fbmN(p*2.0+vec3(3.3,9.9,5.5),3,2.0,0.5);
    alb*=1.0-0.50*eq*smoothstep(0.30,0.62,eqN);
    float lon=atan(p.z,p.x), lat=asin(p.y);
    float g1=exp(-(pow((lon-0.12)/0.14,2.0)+pow((lat-0.05)/0.16,2.0)));
    float g2=exp(-(pow((lon+0.10)/0.10,2.0)+pow((lat+0.17)/0.13,2.0)));
    alb=mix(alb,vec3(0.85,0.82,0.78)*0.95,max(g1,g2)*0.9);
  } else if(uType==15){ /* 木卫四 */
    float n=fbmN(p*2.4,4,2.0,0.5);
    alb=vec3(0.32,0.29,0.26)*(0.60+0.5*n)*0.60;
    float am=0.0;
    craterLayer(p,5.0,1.10,h,am); craterLayer(p,12.0,0.55,h,am);
    craterLayer(p,28.0,0.28,h,am); craterLayer(p,62.0,0.14,h,am);
    alb*=1.0+am*0.9;
  } else if(uType==16){ /* 冥卫一 */
    float n=fbmN(p*3.0,4,2.0,0.5);
    alb=vec3(0.44,0.41,0.39)*(0.62+0.5*n)*0.55;
    float am=0.0;
    craterLayer(p,6.0,0.70,h,am); craterLayer(p,14.0,0.35,h,am);
    alb*=1.0+am*0.8;
    float capN=fbmN(p*3.0+vec3(6.6,2.2,8.8),3,2.0,0.5);
    alb*=1.0-0.35*smoothstep(0.45,0.62,p.y+0.12*capN);
  } else if(uType==17){ /* 海卫一：哈密瓜地形 */
    float n=fbmN(p*3.0,3,2.0,0.5);
    alb=vec3(0.82,0.68,0.64)*(0.58+0.25*n)*0.62;
    float tN=fbmN(p*6.0+vec3(5.1,1.7,3.3),3,2.0,0.5);
    alb*=0.90+0.14*sin(tN*40.0);
  }

  /* 凹凸映射（屏幕空间导数一次求梯度） */
  vec3 N=p;
  if(uType==1||uType==3||uType==4||uType==9||uType==10||uType==11||uType==12||uType==14||uType==15||uType==16||uType==17){
    vec3 dpx=dFdx(vWorld), dpy=dFdy(vWorld);
    float dhx=dFdx(h), dhy=dFdy(h);
    vec3 r1=cross(dpy,N), r2=cross(N,dpx);
    float det=dot(dpx,r1);
    if(abs(det)>1e-9){
      vec3 grad=(r1*dhx+r2*dhy)/det;
      N=normalize(N-grad*uBump);
    }
  }
  vec3 L=normalize(uLightObj);
  float ndl=dot(N,L);
  float soft=(uType==13)?0.30:0.10;
  float dayF=smoothstep(-soft,soft*1.6,ndl);
  float diff=max(ndl,0.0);
  float light=uSunI*(diff*1.02+0.030*dayF);
  light*=ringShadowFactor(p);
  vec3 col=alb*light;
  if(spec>0.0&&diff>0.0){
    vec3 Hv=normalize(L+V);
    col+=vec3(1.0)*pow(max(dot(N,Hv),0.0),shin)*spec*uSunI*0.9;
  }
  col+=em*(1.0-dayF)*uSunI*0.9;
  if(uType==3&&cloud>0.01){
    vec3 cLight=vec3(uSunI*(max(ndl,0.0)+0.03));
    col=mix(col,vec3(1.0,0.98,0.95)*cLight*0.95,cloud*0.9);
    vec3 Hv=normalize(L+V);
    col+=vec3(1.0)*pow(max(dot(N,Hv),0.0),40.0)*0.35*uSunI*cloud;
  }
  float ndv=max(dot(p,V),0.0);
  col*=0.68+0.32*pow(ndv,0.8);
  fragColor=vec4(col,1.0);
}`;

/* ---- 环系（密度函数 + 双向阴影 + 前向散射） ---- */
const S_RING_VERT = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNorm;
layout(location=2) in vec2 aUV;
uniform mat4 uModel;
uniform mat4 uVP;
out vec3 vLocal; out vec3 vWorld; out vec2 vUV; out vec3 vNorm;
void main(){
  vLocal=aPos; vUV=aUV;
  vec4 w=uModel*vec4(aPos,1.0);
  vWorld=w.xyz;
  vNorm=mat3(uModel)*aNorm;
  gl_Position=uVP*w;
}`;
const S_RING_FRAG = `#version 300 es
precision highp float;
precision highp int;
in vec3 vLocal; in vec3 vWorld; in vec2 vUV; in vec3 vNorm;
out vec4 fragColor;
uniform int uRingType;
uniform vec3 uSunPos; uniform vec3 uCamPos; uniform vec3 uPlanetPos; uniform float uPlanetR;
uniform float uRMax;
` + S_NOISE + `
float band01(float r,float a,float b){ float w=0.006; return sstep(a-w,a+w,r)*(1.0-sstep(b-w,b+w,r)); }
float gauss1(float r,float c,float s){ float t=(r-c)/s; return exp(-t*t); }
float ringDensity(float r, int rt){
  if(rt==1){
    float d=0.11*band01(r,1.235,1.53)+1.20*band01(r,1.525,1.95)+0.58*band01(r,2.025,2.27);
    d*=1.0-0.87*band01(r,1.95,2.03);
    d*=1.0-0.92*gauss1(r,2.214,0.0045);
    d*=1.0-0.80*gauss1(r,2.265,0.0018);
    d+=0.30*gauss1(r,2.324,0.0055);
    float tex=fbmN(vec3(r*230.0,7.3,3.7),3,2.0,0.5);
    return d*(0.70+0.60*tex);
  } else if(rt==2){
    return 0.55*gauss1(r,1.951,0.0055)+0.20*gauss1(r,1.909,0.0025)+0.16*gauss1(r,1.863,0.0022)
         + 0.13*gauss1(r,1.823,0.0020)+0.11*gauss1(r,1.786,0.0019)+0.09*gauss1(r,1.751,0.0018)
         + 0.07*gauss1(r,1.690,0.0016);
  } else if(rt==3){
    return 0.016*band01(r,1.40,1.81);
  }
  return 0.0;
}
void main(){
  float r=length(vLocal.xz);
  float d=ringDensity(r,uRingType);
  vec3 n=normalize(vNorm);
  vec3 rd=normalize(uCamPos-vWorld);
  vec3 L=normalize(uSunPos-uPlanetPos);
  float muV=max(abs(dot(n,rd)),0.10);
  float muS=max(abs(dot(n,L)),0.10);
  float tauV=d*1.45/muV;
  float tauS=d*1.45/muS;
  float alpha=1.0-exp(-tauV);
  vec3 col;
  if((dot(n,L)*dot(n,rd))>0.0){
    col=vec3(1.0)*(1.0-exp(-tauS))*0.85;
  } else {
    col=vec3(1.0)*exp(-tauS*0.42)*1.15*(1.0-exp(-tauS*0.75));
  }
  vec3 oc=vWorld-uPlanetPos;
  float bb=dot(oc,L);
  if(bb<0.0){
    float dmin=sqrt(max(dot(oc,oc)-bb*bb,0.0));
    col*=smoothstep(uPlanetR*0.97,uPlanetR*1.09,dmin);
  }
  float tex=fbmN(vec3(r*230.0,7.3,3.7),3,2.0,0.5);
  col*=0.93+0.10*tex;
  alpha*=1.0-smoothstep(uRMax-0.010,uRMax,r);
  fragColor=vec4(col,alpha);
}`;

/* ---- 大气壳层（视线撞击参数光学厚度积分） ---- */
const S_ATMO_FRAG = `#version 300 es
precision highp float;
precision highp int;
in vec3 vWorld;
out vec4 fragColor;
uniform vec3 uCamPos; uniform vec3 uSunDir; uniform vec3 uPlanetPos; uniform float uPlanetR;
uniform float uH; uniform vec3 uColor; uniform float uStrength; uniform float uSunI;
` + S_NOISE + `
void main(){
  vec3 rd=normalize(vWorld-uCamPos);
  vec3 oc=uPlanetPos-uCamPos;
  float tca=dot(oc,rd);
  float b=sqrt(max(dot(oc,oc)-tca*tca,0.0))/uPlanetR;
  float dens=exp(-max(b-1.0,0.0)/uH);
  dens*=1.0-sstep(1.0,0.960,b)*0.86;
  vec3 an=normalize(uCamPos+rd*tca-uPlanetPos);
  float ndl=dot(an,uSunDir);
  float lit=smoothstep(-0.05,0.15,ndl);
  float mie=pow(ndl*0.5+0.5,4.0);
  float amount=dens*lit*(0.72+0.55*mie)*uStrength*uSunI;
  fragColor=vec4(uColor*amount,1.0);
}`;

/* ---- 轨道缎带 / 彗尾条带（屏幕空间展宽，1−|side| 柔边） ---- */
const S_STRIP_VERT = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aTan;
layout(location=2) in float aSide;
layout(location=3) in float aAlpha;
layout(location=4) in vec3 aCol;
layout(location=5) in float aWidthPx;
uniform mat4 uVP;
uniform vec2 uViewportPx;
out float vSide; out float vAlpha; out vec3 vCol;
void main(){
  vec4 c0=uVP*vec4(aPos,1.0);
  vec4 c1=uVP*vec4(aPos+aTan,1.0);
  vec2 p0=c0.xy/c0.w;
  vec2 p1=c1.xy/c1.w;
  vec2 dir=p1-p0;
  float l=length(dir);
  vec2 nrm=(l>1e-8)?vec2(-dir.y,dir.x)/l:vec2(1.0,0.0);
  vec2 off=nrm*aWidthPx*2.0/uViewportPx;
  gl_Position=vec4(c0.xy+off*c0.w,c0.zw);
  vSide=aSide; vAlpha=aAlpha; vCol=aCol;
}`;
const S_STRIP_FRAG = `#version 300 es
precision highp float;
in float vSide; in float vAlpha; in vec3 vCol;
out vec4 fragColor;
void main(){
  float edge=1.0-abs(vSide);
  fragColor=vec4(vCol*vAlpha*edge*1.2,1.0);
}`;

/* ---- 小行星带：顶点着色器解开普勒（每粒子 8 浮点根数） ---- */
const S_AST_VERT = `#version 300 es
precision highp float;
precision highp int;
layout(location=0) in float aA;
layout(location=1) in float aE;
layout(location=2) in float aI;
layout(location=3) in float aO;
layout(location=4) in float aW;
layout(location=5) in float aM0;
layout(location=6) in float aN;
layout(location=7) in float aSize;
layout(location=8) in vec3 aCol;
uniform mat4 uVP;
uniform vec3 uCamPos;
uniform float uScale; uniform float uCompress; uniform float uJDJ; uniform float uPointK;
out vec3 vCol; out float vBright;
void main(){
  float M=aM0+aN*uJDJ;
  M=M-6.2831853*floor(M/6.2831853);
  float E=M+aE*sin(M)*(1.0+aE*cos(M));
  for(int i=0;i<10;i++){ E-=(E-aE*sin(E)-M)/(1.0-aE*cos(E)); }
  float aI_=radians(aI),aO_=radians(aO),aW_=radians(aW);
  float cw=cos(aW_),sw=sin(aW_),cO=cos(aO_),sO=sin(aO_),cI=cos(aI_),sI=sin(aI_);
  float xp=aA*(cos(E)-aE);
  float yp=aA*sqrt(1.0-aE*aE)*sin(E);
  vec3 ecl=vec3(
    (cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,
    (cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,
    (sw*sI)*xp+(cw*sI)*yp);
  float rr=length(ecl);
  vec3 wp=vec3(ecl.x,ecl.z,-ecl.y);
  float k=uScale*pow(rr,uCompress)/rr;
  wp*=k;
  gl_Position=uVP*vec4(wp,1.0);
  float dist=length(wp-uCamPos);
  gl_PointSize=clamp(aSize*uPointK/dist,0.75,4.5);
  vCol=aCol;
  vBright=clamp(1.25*pow(1.0/rr,0.85),0.04,1.0);
}`;
const S_AST_FRAG = `#version 300 es
precision highp float;
in vec3 vCol; in float vBright;
out vec4 fragColor;
void main(){
  vec2 c=gl_PointCoord*2.0-1.0;
  float d=length(c);
  if(d>1.0) discard;
  float a=smoothstep(1.0,0.5,d);
  fragColor=vec4(vCol*vBright*a*1.6,1.0);
}`;

/* ---- 点精灵（彗核） ---- */
const S_SPRITE_VERT = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in float aSizePx;
layout(location=2) in vec3 aCol;
uniform mat4 uVP;
out vec3 vCol;
void main(){
  gl_Position=uVP*vec4(aPos,1.0);
  gl_PointSize=aSizePx;
  vCol=aCol;
}`;
const S_SPRITE_FRAG = `#version 300 es
precision highp float;
in vec3 vCol;
out vec4 fragColor;
void main(){
  vec2 c=gl_PointCoord*2.0-1.0;
  float d=length(c);
  if(d>1.0) discard;
  fragColor=vec4(vCol*exp(-d*d*2.5),1.0);
}`;

/* ---- 泛光：软膝阈值 / 13-tap 降采样 / 3×3 tent 升采样（加法混合） ---- */
const S_BTH_FRAG = `#version 300 es
precision highp float;
precision highp int;
in vec2 vUV;
out vec4 fragColor;
uniform sampler2D uTex;
uniform float uThr; uniform float uKnee;
void main(){
  vec3 c=texture(uTex,vUV).rgb;
  vec3 soft=max(c-uThr+uKnee,0.0);
  soft=soft*soft/(4.0*uKnee+0.0001);
  fragColor=vec4(max(soft,c-uThr),1.0);
}`;
const S_BDOWN_FRAG = `#version 300 es
precision highp float;
precision highp int;
in vec2 vUV;
out vec4 fragColor;
uniform sampler2D uTex;
uniform vec2 uTexel;
void main(){
  vec2 o=uTexel;
  vec3 s=texture(uTex,vUV).rgb*8.0;
  s+=(texture(uTex,vUV+vec2(o.x,0.0)).rgb+texture(uTex,vUV-vec2(o.x,0.0)).rgb
     +texture(uTex,vUV+vec2(0.0,o.y)).rgb+texture(uTex,vUV-vec2(0.0,o.y)).rgb)*2.0;
  s+=(texture(uTex,vUV+o).rgb+texture(uTex,vUV-o).rgb
     +texture(uTex,vUV+vec2(o.x,-o.y)).rgb+texture(uTex,vUV+vec2(-o.x,o.y)).rgb);
  fragColor=vec4(s/24.0,1.0);
}`;
const S_BUP_FRAG = `#version 300 es
precision highp float;
precision highp int;
in vec2 vUV;
out vec4 fragColor;
uniform sampler2D uTex;
uniform vec2 uTexel;
void main(){
  vec2 o=uTexel;
  vec3 s=texture(uTex,vUV).rgb*4.0;
  s+=(texture(uTex,vUV+vec2(o.x,0.0)).rgb+texture(uTex,vUV-vec2(o.x,0.0)).rgb
     +texture(uTex,vUV+vec2(0.0,o.y)).rgb+texture(uTex,vUV-vec2(0.0,o.y)).rgb)*2.0;
  s+=(texture(uTex,vUV+o).rgb+texture(uTex,vUV-o).rgb
     +texture(uTex,vUV+vec2(o.x,-o.y)).rgb+texture(uTex,vUV+vec2(-o.x,o.y)).rgb);
  fragColor=vec4(s/16.0,1.0);
}`;

/* ---- 合成：色散 → 泛光 → 眩光 → 曝光 → ACES → gamma → 暗角 → 颗粒 ---- */
const S_COMP_FRAG = `#version 300 es
precision highp float;
precision highp int;
in vec2 vUV;
out vec4 fragColor;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform vec2 uViewport;
uniform float uTime;
uniform vec2 uFlarePos;
uniform float uFlareI;
uniform float uGlow;
uniform float uExposure;
float hash13(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
vec3 aces(vec3 x){
  const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;
  return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0);
}
void main(){
  vec2 uv=vUV;
  vec2 c=uv-0.5;
  vec3 col=vec3(texture(uScene,uv+c*0.0016).r, texture(uScene,uv).g, texture(uScene,uv-c*0.0016).b);
  vec3 bloom=texture(uBloom,uv).rgb;
  col+=bloom*0.34*uGlow;
  if(uFlareI>0.001&&uGlow>0.0){
    vec2 fp=uFlarePos;
    vec2 d=uv*2.0-1.0-fp;
    float dist=length(d);
    vec2 dn=(dist>1e-4)?d/dist:vec2(1.0,0.0);
    vec3 fl=vec3(0.0);
    fl+=vec3(1.0,0.85,0.6)*exp(-dist*dist*14.0)*0.28;
    fl+=vec3(1.0,0.9,0.7)*exp(-dist*dist*90.0)*0.35;
    float sp=0.0;
    sp+=pow(clamp(1.0-abs(dot(dn,vec2(1.0,0.0)))/0.016,0.0,1.0),6.0);
    sp+=pow(clamp(1.0-abs(dot(dn,vec2(0.866,0.5)))/0.016,0.0,1.0),6.0);
    sp+=pow(clamp(1.0-abs(dot(dn,vec2(0.5,0.866)))/0.016,0.0,1.0),6.0);
    sp+=pow(clamp(1.0-abs(dot(dn,vec2(0.0,1.0)))/0.016,0.0,1.0),6.0);
    sp+=pow(clamp(1.0-abs(dot(dn,vec2(-0.5,0.866)))/0.016,0.0,1.0),6.0);
    sp+=pow(clamp(1.0-abs(dot(dn,vec2(-0.866,0.5)))/0.016,0.0,1.0),6.0);
    fl+=vec3(1.0,0.9,0.75)*sp*0.06;
    fl+=vec3(0.8,0.9,1.0)*exp(-(d.y*d.y)/0.00005)*exp(-(d.x*d.x)*1.2)*0.045;
    vec2 tc=-normalize(fp);
    vec2 g1=fp+tc*0.62; fl+=vec3(0.35,0.65,1.0)*exp(-pow(length(uv*2.0-1.0-g1)/0.045,2.0))*0.10;
    vec2 g2=fp+tc*0.30; fl+=vec3(0.3,0.9,0.75)*exp(-pow(length(uv*2.0-1.0-g2)/0.030,2.0))*0.07;
    vec2 g3=fp+tc*(-0.14); fl+=vec3(1.0,0.55,0.35)*exp(-pow(length(uv*2.0-1.0-g3)/0.024,2.0))*0.05;
    col+=fl*uFlareI;
  }
  col*=uExposure;
  col=aces(col);
  col=pow(col,vec3(1.0/2.2));
  col*=1.0-0.30*pow(length(uv-0.5)*1.65,2.4);
  col+=(hash13(vec3(uv*uViewport,uTime*24.0))-0.5)*0.018;
  fragColor=vec4(col,1.0);
}`;

/* =====================================================================
   WebGL2 初始化
   ===================================================================== */
let gl, canvas, HDR = false, MSAA_OK = false;
let VP_W = 1, VP_H = 1, K_PROJ = 1;   // K_PROJ = (vp_h/2)/tan(fov/2)
const P = {}, B = {}, FB = {};
let BLACK_TEX = null, AST_COUNT = 0, RIBBON_BUF, RIBBON_COUNT = 0, COMET_BUF, COMET_COUNT = 0, SPRITE_BUF, SPRITE_COUNT = 0;

function mkProg(vs, fs, tag){
  const v=gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(v,vs); gl.compileShader(v);
  if(!gl.getShaderParameter(v,gl.COMPILE_STATUS)){ const e=gl.getShaderInfoLog(v); console.error('[VS '+tag+']',e); showErr('着色器编译失败: '+tag+'<br>'+e); }
  const f=gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(f,fs); gl.compileShader(f);
  if(!gl.getShaderParameter(f,gl.COMPILE_STATUS)){ const e=gl.getShaderInfoLog(f); console.error('[FS '+tag+']',e); showErr('着色器编译失败: '+tag+'<br>'+e); }
  const pr=gl.createProgram(); gl.attachShader(pr,v); gl.attachShader(pr,f); gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){ const e=gl.getProgramInfoLog(pr); console.error('[LINK '+tag+']',e); showErr('程序链接失败: '+tag+'<br>'+e); }
  return {prog:pr, us:{}, vs:v, fs:f, tag};
}
function setU(pr, name, v){
  const us=pr.us;
  let loc=us[name];
  if(loc===undefined){ loc=gl.getUniformLocation(pr.prog,name); us[name]=loc; }
  if(loc===null||loc===-1) return;
  if(typeof v==='number'){ gl.uniform1f(loc,v); return; }
  switch(v.length){
    case 2: gl.uniform2fv(loc,v); break;
    case 3: gl.uniform3fv(loc,v); break;
    case 4: gl.uniform4fv(loc,v); break;
    case 9: gl.uniformMatrix3fv(loc,false,v); break;
    case 16: gl.uniformMatrix4fv(loc,false,v); break;
  }
}
function setUi(pr, name, v){
  const us=pr.us;
  let loc=us[name];
  if(loc===undefined){ loc=gl.getUniformLocation(pr.prog,name); us[name]=loc; }
  if(loc===null||loc===-1) return;
  gl.uniform1i(loc,v);
}
function bufData(arr,usage){ const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,arr,usage||gl.STATIC_DRAW); return b; }
function makeTex(w,h,internal,format,type){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,internal,w,h,0,format,type,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}

/* ---------- 几何体 ---------- */
function makeSphereData(su,sv){
  const verts=new Float32Array((su+1)*(sv+1)*6), idx=[];
  let p=0;
  for(let j=0;j<=sv;j++){
    const th=Math.PI*j/sv, y=Math.cos(th), sr=Math.sin(th);
    for(let i=0;i<=su;i++){
      const ph=TAU*i/su, x=sr*Math.cos(ph), z=sr*Math.sin(ph);
      verts[p++]=x; verts[p++]=y; verts[p++]=z;
      verts[p++]=x; verts[p++]=y; verts[p++]=z;
    }
  }
  for(let j=0;j<sv;j++) for(let i=0;i<su;i++){
    const a=j*(su+1)+i, b=a+1, c=a+su+1, d=c+1;
    idx.push(a,b,c, b,d,c);   // 绕序已手算验证：法向朝外
  }
  return {verts, idx:new Uint16Array(idx)};
}
function makeRingData(rmin,rmax,segs){
  const verts=new Float32Array((segs+1)*2*8), idx=[];
  let p=0;
  for(let i=0;i<=segs;i++){
    const th=TAU*i/segs, c=Math.cos(th), s=Math.sin(th);
    for(let k=0;k<2;k++){
      const r=k===0?rmin:rmax;
      verts[p++]=r*c; verts[p++]=0; verts[p++]=r*s;
      verts[p++]=0; verts[p++]=1; verts[p++]=0;
      verts[p++]=i/segs; verts[p++]=k;
    }
  }
  for(let i=0;i<segs;i++){
    const a=i*2, b=i*2+1, c=i*2+2, d=i*2+3;
    idx.push(a,b,d, a,d,c);
  }
  return {verts, idx:new Uint16Array(idx)};
}
function bindAttrib(vao, buf, stride, specs){
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  for(const s of specs){
    gl.enableVertexAttribArray(s.loc);
    gl.vertexAttribPointer(s.loc, s.n, gl.FLOAT, false, stride, s.off);
  }
}
function bindElem(vao, idx){
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idx);
}

/* ---------- 帧缓冲：MSAA RGBA16F → 场景 RGBA16F → 泛光 mip 链 ---------- */
function buildTargets(w,h){
  const fInternal = HDR ? gl.RGBA16F : gl.RGBA8;
  const fType = HDR ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
  // 场景 FBO（含深度，非 MSAA 时直接作为绘制目标）
  FB.scene = {tex:makeTex(w,h,fInternal,gl.RGBA,fType), fbo:gl.createFramebuffer()};
  gl.bindFramebuffer(gl.FRAMEBUFFER,FB.scene.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,FB.scene.tex,0);
  FB.scene.depth=gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER,FB.scene.depth);
  gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,w,h);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,FB.scene.depth);
  // MSAA 尝试（失败则优雅退回非 MSAA）
  MSAA_OK=false;
  FB.msaa={fbo:gl.createFramebuffer()};
  gl.bindFramebuffer(gl.FRAMEBUFFER,FB.msaa.fbo);
  FB.msaa.color=gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER,FB.msaa.color);
  gl.renderbufferStorageMultisample(gl.RENDERBUFFER,4,fInternal,w,h);
  FB.msaa.depth=gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER,FB.msaa.depth);
  gl.renderbufferStorageMultisample(gl.RENDERBUFFER,4,gl.DEPTH_COMPONENT24,w,h);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,FB.msaa.color);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,FB.msaa.depth);
  MSAA_OK = (gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE);
  // 泛光链
  FB.bloom=[];
  for(let i=0;i<6;i++){
    const bw=Math.max(2,w>>(i+1)), bh=Math.max(2,h>>(i+1));
    const tex=makeTex(bw,bh,fInternal,gl.RGBA,fType);
    const fbo=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    FB.bloom.push({tex,fbo,w:bw,h:bh});
  }
  if(!HDR){ // RGBA8 时降低泛光阈值
    FB.bloomThr=0.85; FB.bloomKnee=0.4;
  } else { FB.bloomThr=1.25; FB.bloomKnee=0.6; }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.bindRenderbuffer(gl.RENDERBUFFER,null);
}

/* ---------- 程序与缓冲 ---------- */
function buildPrograms(){
  P.bg=mkProg(S_FS_TRI,S_BG_FRAG,'bg');
  P.stars=mkProg(S_STAR_VERT,S_STAR_FRAG,'stars');
  P.sphere=mkProg(S_SPHERE_VERT,S_SUN_FRAG,'sun');       // 太阳
  P.planet=mkProg(S_SPHERE_VERT,S_PLANET_FRAG,'planet');
  P.ring=mkProg(S_RING_VERT,S_RING_FRAG,'ring');
  P.atmo=mkProg(S_SPHERE_VERT,S_ATMO_FRAG,'atmo');
  P.strip=mkProg(S_STRIP_VERT,S_STRIP_FRAG,'strip');
  P.ast=mkProg(S_AST_VERT,S_AST_FRAG,'ast');
  P.sprite=mkProg(S_SPRITE_VERT,S_SPRITE_FRAG,'sprite');
  P.corona=mkProg(S_CORONA_VERT,S_CORONA_FRAG,'corona');
  P.bth=mkProg(S_FS_TRI,S_BTH_FRAG,'bth');
  P.bdn=mkProg(S_FS_TRI,S_BDOWN_FRAG,'bdn');
  P.bup=mkProg(S_FS_TRI,S_BUP_FRAG,'bup');
  P.comp=mkProg(S_FS_TRI,S_COMP_FRAG,'comp');
}
function buildGeometry(){
  const sph=makeSphereData(96,48);
  B.sphere=gl.createVertexArray();
  bindAttrib(B.sphere, bufData(sph.verts), 24, [{loc:0,n:3,off:0},{loc:1,n:3,off:12}]);
  B.sphereIdx=gl.createBuffer();
  bindElem(B.sphere, B.sphereIdx);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,B.sphereIdx);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,sph.idx,gl.STATIC_DRAW);
  B.sphereCount=sph.idx.length;
  // 环（3 套几何：土星/天王星/木星）
  B.ring=[];
  const rngs=[[1.235,2.34],[1.60,2.00],[1.40,1.81]];
  for(let i=0;i<3;i++){
    const rd=makeRingData(rngs[i][0],rngs[i][1],256);
    const vao=gl.createVertexArray();
    bindAttrib(vao, bufData(rd.verts), 32, [{loc:0,n:3,off:0},{loc:1,n:3,off:12},{loc:2,n:2,off:24}]);
    const ib=gl.createBuffer();
    bindElem(vao, ib);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,rd.idx,gl.STATIC_DRAW);
    B.ring.push({vao,count:rd.idx.length});
  }
  // 全屏三角形
  B.quad=gl.createVertexArray();
  // 条带（轨道缎带 + 彗尾共用，动态：先建缓冲再绑定属性，否则指针指向旧缓冲）
  B.strip=gl.createVertexArray();
  B.stripBuf=gl.createBuffer();
  gl.bindVertexArray(B.strip);
  gl.bindBuffer(gl.ARRAY_BUFFER,B.stripBuf);
  gl.bufferData(gl.ARRAY_BUFFER, 262144*4, gl.DYNAMIC_DRAW);
  const stripSpecs=[{loc:0,n:3,off:0},{loc:1,n:3,off:12},{loc:2,n:1,off:24},{loc:3,n:1,off:28},{loc:4,n:3,off:32},{loc:5,n:1,off:44}];
  for(const s of stripSpecs){ gl.enableVertexAttribArray(s.loc); gl.vertexAttribPointer(s.loc,s.n,gl.FLOAT,false,48,s.off); }
  RIBBON_BUF=new Float32Array(262144); COMET_BUF=new Float32Array(4096);
  // 点精灵（彗核）
  B.sprite=gl.createVertexArray();
  B.spriteBuf=gl.createBuffer();
  gl.bindVertexArray(B.sprite);
  gl.bindBuffer(gl.ARRAY_BUFFER,B.spriteBuf);
  gl.bufferData(gl.ARRAY_BUFFER, 64*4, gl.DYNAMIC_DRAW);
  const spriteSpecs=[{loc:0,n:3,off:0},{loc:1,n:1,off:12},{loc:2,n:3,off:16}];
  for(const s of spriteSpecs){ gl.enableVertexAttribArray(s.loc); gl.vertexAttribPointer(s.loc,s.n,gl.FLOAT,false,28,s.off); }
  SPRITE_BUF=new Float32Array(16);
  // 1×1 黑色纹理（辉光关闭时）
  BLACK_TEX=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,BLACK_TEX);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
}

/* ---------- 恒星（11000 颗，向银道面聚集，光谱型调色板） ---------- */
const STAR_COLORS=[[1.0,0.60,0.30],[1.0,0.80,0.55],[1.0,0.95,0.80],[0.95,0.98,1.0],[0.82,0.90,1.0],[0.70,0.82,1.0],[0.60,0.72,1.0]];
function buildStars(){
  const out=[];
  let s=0, tries=0;
  while(s<11000 && tries<200000){
    tries++;
    const v=randUnit();
    if(Math.random() > Math.exp(-Math.pow(dot(v,GAL_W)/0.13,2))) continue;
    const b=Math.pow(Math.random(),3.6);
    const r=Math.random();
    let col;
    if(r<0.30) col=STAR_COLORS[0]; else if(r<0.65) col=STAR_COLORS[1];
    else if(r<0.85) col=STAR_COLORS[2]; else if(r<0.94) col=STAR_COLORS[3];
    else if(r<0.98) col=STAR_COLORS[4]; else if(r<0.995) col=STAR_COLORS[5];
    else col=STAR_COLORS[6];
    out.push(v[0],v[1],v[2], col[0],col[1],col[2], b, Math.random()*TAU);
    s++;
  }
  B.stars=gl.createVertexArray();
  bindAttrib(B.stars, bufData(new Float32Array(out)), 32,
    [{loc:0,n:3,off:0},{loc:1,n:3,off:12},{loc:2,n:1,off:24},{loc:3,n:1,off:28}]);
  B.starCount=s;
}

/* ---------- 小行星带 / 希尔达 / 特洛伊 / 柯伊伯带（CPU 生成一次，GPU 每帧解 Kepler） ---------- */
function buildAsteroids(){
  const out=[];
  const nOf=a=>TAU/(Math.pow(a,1.5)*365.25);
  const push=(a,e,I,O,w,M0,size,col)=>{ out.push(a,e,I,O,w,M0,nOf(a),size,col[0],col[1],col[2]); };
  let n=0, tries=0;
  const gaps=[[2.502,0.022,0.93],[2.825,0.016,0.85],[2.958,0.012,0.70],[3.279,0.020,0.90],[2.065,0.010,0.60]];
  while(n<9000 && tries<400000){                       // 主带：拒绝采样挖柯克伍德空隙
    tries++;
    const a=2.06+Math.random()*1.22;
    let p=Math.exp(-Math.pow((a-2.72)/0.55,2));
    for(const g of gaps) p*=(1-g[2]*Math.exp(-Math.pow((a-g[0])/g[1],2)));
    if(Math.random()>p) continue;
    const e=Math.min(0.34,Math.abs(gauss())*0.175);
    const I=Math.min(30,Math.abs(gauss())*10.0);
    const c=0.7+Math.random()*0.25;
    push(a,e,I,Math.random()*360,Math.random()*360,Math.random()*TAU,0.05+Math.random()*0.09,[0.62*c,0.58*c,0.52*c]);
    n++;
  }
  for(let i=0;i<900;i++){                              // 希尔达族
    const a=3.90+(Math.random()-0.5)*0.18, e=0.10+Math.random()*0.20;
    push(a,e,Math.min(14,Math.abs(gauss())*4.5),Math.random()*360,Math.random()*360,Math.random()*TAU,0.06+Math.random()*0.09,[0.80,0.60,0.42]);
  }
  for(let i=0;i<2000;i++){                             // 木星特洛伊（M₀ 锁在木星前后 60°）
    const side=(i<1000)?1:-1;
    const M0=(34.396+side*60+gauss()*26)*D2R;
    push(5.202,0.02+Math.random()*0.10,Math.min(20,Math.abs(gauss())*5.5),Math.random()*360,Math.random()*360,M0,0.06+Math.random()*0.08,[0.82,0.60,0.38]);
  }
  for(let i=0;i<6000;i++){                             // 柯伊伯带：22% 冥族 / 64% 经典 / 14% 离散盘
    const r=Math.random();
    let a,e,I,col;
    if(r<0.22){ a=39.45+(Math.random()-0.5)*1.1; e=Math.min(0.28,Math.abs(gauss())*0.08); I=Math.min(18,Math.abs(gauss())*5.5); col=[0.58,0.66,0.85]; }
    else if(r<0.86){ a=42.5+Math.random()*5.2; e=Math.min(0.11,Math.abs(gauss())*0.05); I=Math.min(16,Math.abs(gauss())*5.3); col=[0.62,0.70,0.86]; }
    else { a=48+Math.random()*32; e=0.15+Math.random()*0.35; I=Math.min(40,Math.abs(gauss())*16); col=[0.55,0.65,0.82]; }
    push(a,e,I,Math.random()*360,Math.random()*360,Math.random()*TAU,0.05+Math.random()*0.08,col);
  }
  AST_COUNT=out.length/11;
  B.ast=gl.createVertexArray();
  bindAttrib(B.ast, bufData(new Float32Array(out)), 44,
    [{loc:0,n:1,off:0},{loc:1,n:1,off:4},{loc:2,n:1,off:8},{loc:3,n:1,off:12},{loc:4,n:1,off:16},
     {loc:5,n:1,off:20},{loc:6,n:1,off:24},{loc:7,n:1,off:28},{loc:8,n:3,off:32}]);
}

/* =====================================================================
   天体系统
   ===================================================================== */
const state = {
  simJD: realJD(), paused:false, speedV:0,
  compress: COMPRESS_NORM, compressT: COMPRESS_NORM,
  flags:{orbits:true, labels:true, moons:true, belt:true, comet:true, real:false, glow:true},
  cam:{yaw:0.62, pitch:0.38, dist:340, target:[0,0,0]},
  focus:null, focusAnim:null, follow:false,
  selected:null,
};
let wallT=0, lastT=0, EYE=[0,0,0], VP_MAT, VIEW_MAT, PROJ_MAT, NEAR=0.1;
let BODIES=[], BY_KEY={};

const RING_RANGE=[[0,0],[1.235,2.34],[1.60,2.00],[1.40,1.81]];  // 索引=ringType
const RING_RMAX=[0,2.34,2.00,1.81];
const ATMO_DEFS={
  '地球':{H:0.028,c:[0.25,0.55,1.0],s:0.62},

  '土卫六 Titan':{H:0.050,c:[0.95,0.60,0.28],s:0.55},
  '冥王星':{H:0.030,c:[0.7,0.8,0.95],s:0.22},
};
const TINTS={
  '太阳':[1.0,0.85,0.55],'水星':[0.72,0.69,0.66],'金星':[0.94,0.84,0.62],'地球':[0.35,0.55,0.90],
  '火星':[0.90,0.45,0.30],'木星':[0.90,0.78,0.60],'土星':[0.95,0.87,0.68],'天王星':[0.60,0.88,0.90],
  '海王星':[0.45,0.62,1.0],'冥王星':[0.80,0.72,0.65],'月球':[0.80,0.78,0.75],'木卫一 Io':[0.92,0.72,0.45],
  '木卫二 Europa':[0.85,0.87,0.92],'木卫三 Ganymede':[0.70,0.67,0.62],'木卫四 Callisto':[0.65,0.62,0.58],
  '土卫六 Titan':[0.90,0.72,0.45],'海卫一 Triton':[0.85,0.75,0.72],'冥卫一 Charon':[0.75,0.72,0.70],
  '哈雷彗星':[0.62,0.80,1.0],
};
/* 着色器类型：1水星 2金星 3地球 4火星 5木星 6土星 7天王星 8海王星 9月球 10Io 11Europa 12Ganymede 13Titan 14冥王星 15Callisto 16Charon 17Triton */
const ST_TYPE={
  '水星':1,'金星':2,'地球':3,'火星':4,'木星':5,'土星':6,'天王星':7,'海王星':8,'冥王星':14,
  '月球':9,'木卫一 Io':10,'木卫二 Europa':11,'木卫三 Ganymede':12,'土卫六 Titan':13,
  '海卫一 Triton':17,'冥卫一 Charon':16,'木卫四 Callisto':15,
};
const RING_TYPE={'木星':3,'土星':1,'天王星':2};

function buildBodies(){
  BODIES=[]; BY_KEY={};
  const mk=(o)=>{ const b=Object.assign({},o); BY_KEY[b.key]=b; BODIES.push(b); return b; };
  // 太阳
  mk({key:'sun',name:'太阳',kind:'star',tint:TINTS['太阳'],dispR:4.6,phys:PHYS['太阳'],orbitRow:null});
  // 行星
  for(let i=0;i<ORBIT.length;i++){
    const row=ORBIT[i], name=row[0], phys=PHYS[name];
    const rt=RING_TYPE[name]||0;
    mk({
      key:name, name, kind:(name==='冥王星')?'dwarf':'planet', tint:TINTS[name], phys,
      orbitRow:row, oi:i, st:ST_TYPE[name], ringType:rt, ringRange:RING_RANGE[rt], ringRMax:RING_RMAX[rt],
      rotH:ROT[name]?ROT[name][2]:null, tilt:ROT[name]?ROT[name][0]:0, poleLon:ROT[name]?ROT[name][1]:0,
      dispR:dispR(phys.r), atmo:ATMO_DEFS[name]||null, phase:Math.random()*TAU,
    });
  }
  // 哈雷彗星
  mk({key:'halley',name:'哈雷彗星',kind:'comet',tint:TINTS['哈雷彗星'],dispR:0.28,
      phys:HALLEY, orbitRow:null, st:0, ringType:0, rotH:null, atmo:null, phase:0});
  // 卫星
  for(let i=0;i<MOONS.length;i++){
    const m=MOONS[i], parent=BY_KEY[m[1]];
    const disp=dispR(m[2]);
    // 3.7 显示距离：基准 = max(2.35, 环外缘 + 最内层卫星显示半径/母星显示半径 + 0.55)
    const a0 = MOONS.filter(x=>x[1]===m[1]).reduce((min,x)=>Math.min(min,x[3]),1e18);
    const base=Math.max(2.35, RING_RMAX[RING_TYPE[m[1]]||0] + disp/parent.dispR + 0.55);
    mk({
      key:m[0], name:m[0], kind:'moon', parent:m[1], tint:TINTS[m[0]], phys:m,
      orbitRow:null, oi:-1, st:ST_TYPE[m[0]], ringType:0, ringRange:[0,0],
      rotH:null, tilt:0, poleLon:0,
      dispR:disp, dispD: parent.dispR*base*Math.pow(m[3]/a0,0.55),
      atmo:ATMO_DEFS[m[0]]||null, phase:0,
      Pd:m[4], inc:m[5], ref:m[6], ph0:Math.random()*TAU,
    });
  }
  // 惯性系自转轴正交基
  for(const b of BODIES){
    if(b.tilt!==0||b.poleLon!==0) b.basis=spinBasis(b.tilt,b.poleLon);
    else b.basis=[[1,0,0],[0,1,0],[0,0,1]];
    b.world=[0,0,0]; b.ecl=[0,0,0]; b.rAU=0; b.sunI=1; b.lastJD=state.simJD; b.M=0; b.el=null;
  }
}

/* =====================================================================
   逐帧计算
   ===================================================================== */
function computeBodies(){
  const T=(state.simJD-JD_J2000)/36525;
  for(const b of BODIES){
    if(b.orbitRow){
      const el=b.el=elementsAt(T,b.orbitRow);
      const w=el.varpi-el.O;
      const M=normAngle(el.L-el.varpi);
      const ecl=eclPosFromElements({a:el.a,e:el.e,I:el.I,w,O:el.O},M);
      b.ecl=ecl; b.M=M;
      b.rAU=Math.hypot(ecl[0],ecl[1],ecl[2]);
      b.lon=normDeg(Math.atan2(ecl[1],ecl[0])*R2D);
      b.lat=Math.asin(clamp(ecl[2]/(b.rAU||1),-1,1))*R2D;
      b.vel=29.7847*Math.sqrt(Math.max(0,2/b.rAU-1/el.a));
      b.world=compress(worldOf(ecl),SCALE,state.compress);
      b.sunI=clamp(1.5*Math.pow(1/b.rAU,0.40),0.26,2.1);
      if(b.rotH!==null){
        const dtD=(state.simJD-b.lastJD); b.lastJD=state.simJD;
        b.phase+=clamp(TAU*dtD/(b.rotH/24),-0.22,0.22);   // 7.11 自转相位限速
      }
    }
  }
}
function computeComet(){
  const b=BY_KEY['halley'];
  const M=TAU*(state.simJD-HALLEY.Tp)/HALLEY.P;
  b.M=M;
  const el={a:HALLEY.a,e:HALLEY.e,I:rad(HALLEY.I),w:rad(HALLEY.w),O:rad(HALLEY.O)};
  const ecl=eclPosFromElements(el,M);
  b.ecl=ecl; b.rAU=Math.hypot(ecl[0],ecl[1],ecl[2]);
  b.lon=normDeg(Math.atan2(ecl[1],ecl[0])*R2D);
  b.lat=Math.asin(clamp(ecl[2]/(b.rAU||1),-1,1))*R2D;
  b.vel=29.7847*Math.sqrt(Math.max(0,2/b.rAU-1/HALLEY.a));
  b.world=compress(worldOf(ecl),SCALE,state.compress);
  b.sunI=clamp(1.5*Math.pow(1/b.rAU,0.40),0.26,2.1);
  const e1=eclPosFromElements(el,M-0.004), e2=eclPosFromElements(el,M+0.004);
  b.velDir=norm(sub(compress(worldOf(e2),SCALE,state.compress), compress(worldOf(e1),SCALE,state.compress)));
}
function computeMoons(){
  for(const b of BODIES){
    if(b.kind!=='moon') continue;
    const p=BY_KEY[b.parent];
    const th=TAU*(state.simJD-JD_J2000)/b.Pd+b.ph0;
    const d=b.dispD;
    let x=Math.cos(th)*d, y=0, z=Math.sin(th)*d;
    const inc=rad(b.inc);
    y=-Math.sin(inc)*z; z=Math.cos(inc)*z;
    const Bm=p.basis;
    b.world=[p.world[0]+Bm[0][0]*x+Bm[1][0]*y+Bm[2][0]*z,
             p.world[1]+Bm[0][1]*x+Bm[1][1]*y+Bm[2][1]*z,
             p.world[2]+Bm[0][2]*x+Bm[1][2]*y+Bm[2][2]*z];
    b.rAU=p.rAU; b.sunI=p.sunI;
  }
}
function camEye(){
  const cp=Math.cos(state.cam.pitch);
  return [state.cam.target[0]+Math.sin(state.cam.yaw)*cp*state.cam.dist,
          state.cam.target[1]+Math.sin(state.cam.pitch)*state.cam.dist,
          state.cam.target[2]+Math.cos(state.cam.yaw)*cp*state.cam.dist];
}
function updateCamera(){
  if(state.focusAnim){
    const t=(wallT-state.focusAnim.t0)/state.focusAnim.dur;
    const k=t>=1?1:t*t*(3-2*t);
    state.cam.target=[lerp(state.focusAnim.fT[0],state.focusAnim.tT[0],k),
                      lerp(state.focusAnim.fT[1],state.focusAnim.tT[1],k),
                      lerp(state.focusAnim.fT[2],state.focusAnim.tT[2],k)];
    state.cam.dist=lerp(state.focusAnim.fD,state.focusAnim.tD,k);
    if(t>=1){ state.focusAnim=null; state.follow=!!state.focus; }
  } else if(state.follow&&state.focus){
    state.cam.target=state.focus.world.slice();
  }
  EYE=camEye();
  state.cam.dist=clamp(state.cam.dist,1.0,1400);
  NEAR=Math.max(0.012,state.cam.dist*0.0035);
  const far=Math.max(state.cam.dist*14,4200);
  PROJ_MAT=mat4Perspective(FOV*D2R,VP_W/VP_H,NEAR,far);
  VIEW_MAT=mat4LookAt(EYE,state.cam.target,[0,1,0]);
  VP_MAT=mat4Mul(PROJ_MAT,VIEW_MAT);
}

/* ---------- 轨道缎带（每帧重建，屏幕空间展宽） ---------- */
function buildRibbons(){
  if(!state.flags.orbits){ RIBBON_COUNT=0; return; }
  const N=384;
  let ptr=0;
  const pos=new Float32Array(N*3);
  for(const b of BODIES){
    if(!b.orbitRow && b.key!=='halley') continue;
    const rb = b.key==='halley'
      ? {a:HALLEY.a,e:HALLEY.e,I:rad(HALLEY.I),w:rad(HALLEY.w),O:rad(HALLEY.O)}
      : (()=>{ const el=b.el; return {a:el.a,e:el.e,I:el.I,w:el.varpi-el.O,O:el.O}; })();
    for(let i=0;i<N;i++){
      const M=i/N*TAU;
      const ecl=eclPosFromElements(rb,M);
      const w=compress(worldOf(ecl),SCALE,state.compress);
      pos[i*3]=w[0]; pos[i*3+1]=w[1]; pos[i*3+2]=w[2];
    }
    let f=normAngle(b.M)/TAU; f=(f%1+1)%1;
    const ip=Math.round(f*N)%N;
    const rbC=b.tint;
    for(let i=0;i<N;i++){
      const i0=(i-1+N)%N, i1=(i+1)%N;
      const tx=pos[i1*3]-pos[i0*3], ty=pos[i1*3+1]-pos[i0*3+1], tz=pos[i1*3+2]-pos[i0*3+2];
      const tl=Math.hypot(tx,ty,tz)||1;
      const lag=(ip-i+N)%N;
      const alpha=0.05+0.30*Math.pow(Math.max(0,1-lag*0.035),3.2);
      for(const side of [-1,1]){
        RIBBON_BUF[ptr++]=pos[i*3];   RIBBON_BUF[ptr++]=pos[i*3+1]; RIBBON_BUF[ptr++]=pos[i*3+2];
        RIBBON_BUF[ptr++]=tx/tl*0.02; RIBBON_BUF[ptr++]=ty/tl*0.02; RIBBON_BUF[ptr++]=tz/tl*0.02;
        RIBBON_BUF[ptr++]=side;       RIBBON_BUF[ptr++]=alpha;
        RIBBON_BUF[ptr++]=rbC[0];     RIBBON_BUF[ptr++]=rbC[1];     RIBBON_BUF[ptr++]=rbC[2];
        RIBBON_BUF[ptr++]=1.1;
      }
    }
  }
  RIBBON_COUNT=ptr/12;
}

/* ---------- 彗尾（离子尾 + 尘埃尾 + 彗核） ---------- */
function buildCometTails(){
  COMET_COUNT=0; SPRITE_COUNT=0;
  const h=BY_KEY['halley'];
  if(!state.flags.comet || h.rAU>6.5) return;
  const head=h.world;
  const anti=norm(sub(head,[0,0,0]));
  const vd=h.velDir;
  const L=4.2*Math.pow(3/h.rAU,2);
  const B=Math.min(1,Math.pow(3/h.rAU,2));
  const emit=(pos,tan,side,alpha,col,wpx)=>{
    COMET_BUF[COMET_COUNT*12]=pos[0]; COMET_BUF[COMET_COUNT*12+1]=pos[1]; COMET_BUF[COMET_COUNT*12+2]=pos[2];
    COMET_BUF[COMET_COUNT*12+3]=tan[0]; COMET_BUF[COMET_COUNT*12+4]=tan[1]; COMET_BUF[COMET_COUNT*12+5]=tan[2];
    COMET_BUF[COMET_COUNT*12+6]=side; COMET_BUF[COMET_COUNT*12+7]=alpha;
    COMET_BUF[COMET_COUNT*12+8]=col[0]; COMET_BUF[COMET_COUNT*12+9]=col[1]; COMET_BUF[COMET_COUNT*12+10]=col[2];
    COMET_BUF[COMET_COUNT*12+11]=wpx;
    COMET_COUNT++;
  };
  const wPx=w=>w*K_PROJ/Math.max(1,len(sub(head,EYE)));
  // 离子尾：笔直反日方向，偏蓝
  for(let i=0;i<=22;i++){
    const u=i/22;
    const pos=[head[0]+anti[0]*L*u, head[1]+anti[1]*L*u, head[2]+anti[2]*L*u];
    const tan=[anti[0]*0.02,anti[1]*0.02,anti[2]*0.02];
    const a=Math.pow(1-u,2)*0.95*B;
    for(const side of [-1,1]) emit(pos,tan,side,a,[0.45,0.65,1.0],wPx(0.10*(1-u*0.5)));
  }
  // 尘埃尾：弯曲滞后，偏暖黄
  const bend=norm([anti[0]*0.5+vd[0]*0.95, anti[1]*0.5+vd[1]*0.95, anti[2]*0.5+vd[2]*0.95]);
  for(let i=0;i<=26;i++){
    const u=i/26;
    const t=u*u*0.85;
    const dx=anti[0]*(1-t)+bend[0]*t, dy=anti[1]*(1-t)+bend[1]*t, dz=anti[2]*(1-t)+bend[2]*t;
    const dl=Math.hypot(dx,dy,dz)||1;
    const pos=[head[0]+dx/dl*L*0.75*u, head[1]+dy/dl*L*0.75*u, head[2]+dz/dl*L*0.75*u];
    const tan=[dx/dl*0.02,dy/dl*0.02,dz/dl*0.02];
    const a=Math.pow(1-u,2)*0.5*B;
    for(const side of [-1,1]) emit(pos,tan,side,a,[1.0,0.78,0.50],wPx(0.30*(1-u*0.7)));
  }
  // 彗核
  const dpx=clamp(0.12*K_PROJ/Math.max(1,len(sub(head,EYE))),2,60);
  SPRITE_BUF[0]=head[0]; SPRITE_BUF[1]=head[1]; SPRITE_BUF[2]=head[2];
  SPRITE_BUF[3]=dpx; SPRITE_BUF[4]=0.9; SPRITE_BUF[5]=0.95; SPRITE_BUF[6]=1.0;
  SPRITE_COUNT=1;
}

/* =====================================================================
   渲染管线（4.1 顺序）
   ===================================================================== */
function render(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, MSAA_OK?FB.msaa.fbo:FB.scene.fbo);
  gl.viewport(0,0,VP_W,VP_H);
  gl.depthMask(true);                                  // ★ 7.1：clear 前必须恢复 depthMask
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);

  // 1 背景星云
  gl.depthMask(false); gl.disable(gl.BLEND);
  gl.useProgram(P.bg.prog);
  setU(P.bg,'uInvVP',mat4Invert(VP_MAT)); setU(P.bg,'uCamPos',EYE); setU(P.bg,'uGalN',GAL_W);
  gl.bindVertexArray(B.quad); gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(P.stars.prog);
  setU(P.stars,'uViewRot',new Float32Array([VIEW_MAT[0],VIEW_MAT[1],VIEW_MAT[2],VIEW_MAT[4],VIEW_MAT[5],VIEW_MAT[6],VIEW_MAT[8],VIEW_MAT[9],VIEW_MAT[10]]));
  setU(P.stars,'uProj',PROJ_MAT); setU(P.stars,'uTime',wallT);
  gl.bindVertexArray(B.stars); gl.drawArrays(gl.POINTS,0,B.starCount);

  // 3 太阳
  gl.depthMask(true); gl.disable(gl.BLEND);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  drawSun();

  // 4 行星 / 卫星
  for(const b of BODIES){
    if(b.kind==='star') continue;
    if(b.kind==='moon' && !state.flags.moons) continue;
    drawPlanet(b);
  }

  // 5 轨道缎带
  gl.depthMask(false); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  if(state.flags.orbits) drawRibbons();

  // 6 小行星带
  if(state.flags.belt) drawAsteroids();

  // 7 大气壳层
  for(const b of BODIES){
    if(!b.atmo) continue;
    if(b.kind==='moon' && !state.flags.moons) continue;
    drawAtmo(b);
  }

  // 8 环系
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.CULL_FACE);
  for(const b of BODIES) if(b.ringType) drawRing(b);
  gl.enable(gl.CULL_FACE);

  // 9 彗尾
  if(state.flags.comet) drawComet();

  // 10 日冕
  drawCorona();

  // MSAA 解析
  if(MSAA_OK){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,FB.msaa.fbo);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,FB.scene.fbo);
    gl.blitFramebuffer(0,0,VP_W,VP_H,0,0,VP_W,VP_H,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  }
  // 泛光
  if(state.flags.glow) doBloom();
  // 合成
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.disable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
  gl.viewport(0,0,VP_W,VP_H);
  gl.useProgram(P.comp.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,FB.scene.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,state.flags.glow?FB.bloom[0].tex:BLACK_TEX);
  setUi(P.comp,'uScene',0); setUi(P.comp,'uBloom',1);
  setU(P.comp,'uViewport',[VP_W,VP_H]); setU(P.comp,'uTime',wallT);
  setU(P.comp,'uExposure',1.0); setU(P.comp,'uGlow',state.flags.glow?1:0);
  const fl=computeFlare();
  setU(P.comp,'uFlarePos',fl.ndc); setU(P.comp,'uFlareI',fl.i);
  gl.bindVertexArray(B.quad); gl.drawArrays(gl.TRIANGLES,0,3);
  const e=gl.getError();
  if(e!==0) console.error('GL error:',e);
}

function doBloom(){
  gl.disable(gl.BLEND);
  // 阈值提取 → level0
  gl.bindFramebuffer(gl.FRAMEBUFFER,FB.bloom[0].fbo);
  gl.viewport(0,0,FB.bloom[0].w,FB.bloom[0].h);
  gl.useProgram(P.bth.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,FB.scene.tex);
  setU(P.bth,'uThr',FB.bloomThr); setU(P.bth,'uKnee',FB.bloomKnee);
  gl.bindVertexArray(B.quad); gl.drawArrays(gl.TRIANGLES,0,3);
  // 13-tap 降采样
  for(let i=1;i<6;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER,FB.bloom[i].fbo);
    gl.viewport(0,0,FB.bloom[i].w,FB.bloom[i].h);
    gl.useProgram(P.bdn.prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,FB.bloom[i-1].tex);
    setU(P.bdn,'uTexel',[1/FB.bloom[i-1].w,1/FB.bloom[i-1].h]);
    gl.bindVertexArray(B.quad); gl.drawArrays(gl.TRIANGLES,0,3);
  }
  // 3×3 tent 升采样，加法混合累加（7.3：只采样源 mip，不读写同一张）
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  for(let i=4;i>=0;i--){
    gl.bindFramebuffer(gl.FRAMEBUFFER,FB.bloom[i].fbo);
    gl.viewport(0,0,FB.bloom[i].w,FB.bloom[i].h);
    gl.useProgram(P.bup.prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,FB.bloom[i+1].tex);
    setU(P.bup,'uTexel',[1/FB.bloom[i+1].w,1/FB.bloom[i+1].h]);
    gl.bindVertexArray(B.quad); gl.drawArrays(gl.TRIANGLES,0,3);
  }
  gl.disable(gl.BLEND);
}
function computeFlare(){
  const sv=mulMV(VIEW_MAT,[0,0,0,1]);
  if(sv[2]>-0.5) return {ndc:[0,0],i:0};
  let occ=1;
  for(const b of BODIES){
    if(b.kind==='star'||b.kind==='comet') continue;
    const pv=mulMV(VIEW_MAT,[b.world[0],b.world[1],b.world[2],1]);
    if(pv[2]>=sv[2]-0.1) continue;
    const sN=[sv[0]/-sv[2],sv[1]/-sv[2]], pN=[pv[0]/-pv[2],pv[1]/-pv[2]];
    const dx=(sN[0]-pN[0])*VP_W*0.5, dy=(sN[1]-pN[1])*VP_H*0.5;
    const rPx=b.dispR*K_PROJ/(-pv[2]);
    if(Math.hypot(dx,dy)<rPx*1.1) occ*=0.12;
  }
  const st=clamp(26/Math.hypot(EYE[0],EYE[1],EYE[2]),0,1);
  return {ndc:[sv[0]/-sv[2],sv[1]/-sv[2]], i:st*occ};
}

const $=id=>document.getElementById(id);
function buildUI(){
  const list=$('bodyList');
  for(const b of BODIES){
    const row=document.createElement('div');
    row.className='bodyRow'+(b.kind==='moon'?' moon':'');
    const dot=document.createElement('span');

    if(b.kind==='dwarf'){ const t=document.createElement('span'); t.className='tag'; t.textContent='矮行星'; row.appendChild(t); }
    if(b.kind==='comet'){ const t=document.createElement('span'); t.className='tag'; t.textContent='彗星'; row.appendChild(t); }
    b.rowEl=row;
    row.addEventListener('click',()=>{ selectBody(b); setFocus(b); });
    list.appendChild(row);
  }
  // 名称标签
  const lc=$('labels');
  for(const b of BODIES){
    const el=document.createElement('div');
    el.className='lbl'; el.textContent=b.name;
    el.style.display='none';
    lc.appendChild(el); b.labelEl=el;
  }
  // 开关
  const toggles={
    tgOrbits:'orbits', tgLabels:'labels', tgMoons:'moons', tgBelt:'belt', tgComet:'comet', tgReal:'real', tgGlow:'glow',
  };
  for(const id in toggles){
    $(id).addEventListener('change',e=>{
      const k=toggles[id];
      state.flags[k]=e.target.checked;
      if(k==='real') state.compressT=e.target.checked?COMPRESS_REAL:COMPRESS_NORM;
      if(k==='labels') for(const b of BODIES) b.labelEl.style.display=state.flags.labels?'':'none';
    });
  }
  // 底部
  $('btnPlay').addEventListener('click',()=>{ state.paused=!state.paused; updateBottom(); });
  $('btnNow').addEventListener('click',()=>{ state.simJD=realJD(); });
  $('btnAll').addEventListener('click',()=>{ setFocus(null); });
  $('speedSlider').addEventListener('input',e=>{ state.speedV=+e.target.value; updateBottom(); });
  // 相机交互
  let drag=null, pointers=new Map();
  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,[e.clientX,e.clientY]);
    drag={x:e.clientX,y:e.clientY,moved:false};
    canvas.classList.add('grabbing');
  });
  canvas.addEventListener('pointermove',e=>{
    if(pointers.has(e.pointerId)) pointers.set(e.pointerId,[e.clientX,e.clientY]);
    if(pointers.size===2){
      const pts=[...pointers.values()];
      const d=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]);
      if(pinchD0){ state.cam.dist=clamp(state.cam.dist*pinchD0/d,1,1400); pinchD0=d; }
      else pinchD0=d;
      return;
    }
    if(drag&&e.pointerType!=='touch'){
      const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
      if(drag.moved){
        state.cam.yaw-=dx*0.0052;
        state.cam.pitch=clamp(state.cam.pitch+dy*0.0052,-1.35,1.35);
      }
      drag.x=e.clientX; drag.y=e.clientY;
    }
  });
  let pinchD0=0;
  canvas.addEventListener('pointerup',e=>{
    if(e.pointerType==='touch'&&drag&&!drag.moved){
      pick(e.clientX,e.clientY);
    }
    pointers.delete(e.pointerId);
    if(pointers.size<2) pinchD0=0;
    if(pointers.size===0){ drag=null; canvas.classList.remove('grabbing'); }
  });
  canvas.addEventListener('pointercancel',e=>{
    pointers.delete(e.pointerId); pinchD0=0;
    if(pointers.size===0){ drag=null; canvas.classList.remove('grabbing'); }
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    state.cam.dist=clamp(state.cam.dist*Math.exp(e.deltaY*0.0013),1,1400);
  },{passive:false});
  canvas.addEventListener('click',e=>{ if(e.pointerType!=='touch') pick(e.clientX,e.clientY); });
  window.addEventListener('keydown',e=>{
    if(e.code==='Space'){ e.preventDefault(); state.paused=!state.paused; updateBottom(); }
    else if(e.key==='ArrowLeft'){ state.speedV=clamp(state.speedV-10,-100,100); $('speedSlider').value=state.speedV; updateBottom(); }
    else if(e.key==='ArrowRight'){ state.speedV=clamp(state.speedV+10,-100,100); $('speedSlider').value=state.speedV; updateBottom(); }
    else if(e.key==='h'||e.key==='H'){ $('ui').classList.toggle('hidden'); }
  });
}
function pick(px,py){
  let best=null, bd=1e9;
  for(const b of BODIES){
    if(b.kind==='star') continue;
    if(b.kind==='moon'&&!state.flags.moons) continue;
    const v=mulMV(VIEW_MAT,[b.world[0],b.world[1],b.world[2],1]);
    if(v[2]>-0.3) continue;
    const nx=v[0]/-v[2], ny=v[1]/-v[2];
    const sx=(nx*0.5+0.5)*VP_W, sy=(0.5-ny*0.5)*VP_H;
    const rPx=Math.max(16,b.dispR*K_PROJ/(-v[2])+7);
    const d=Math.hypot(sx-px,sy-py);
    if(d<rPx&&d<bd){ bd=d; best=b; }
  }
  if(best){ selectBody(best); setFocus(best); }
  else { selectBody(null); setFocus(null); }
}
function setFocus(b){
  state.focus=b||null; state.follow=false;
  const tT=b?b.world.slice():[0,0,0];
  const tD=b?Math.max(b.dispR*8+2,3.5):340;
  state.focusAnim={t0:wallT,dur:1.0,fT:state.cam.target.slice(),fD:state.cam.dist,tT,tD};
}
function selectBody(b){
  state.selected=b;
  for(const x of BODIES) if(x.rowEl) x.rowEl.classList.toggle('sel',x===b);
  const rp=$('rightPanel');
  if(!b){ rp.classList.add('hidden'); return; }
  rp.classList.remove('hidden');
  $('infoEmpty').style.display='none';
  $('infoName').textContent=b.name;
  $('infoSub').textContent=b.phys?b.phys.tag:(b.kind==='moon'?(b.parent+'的卫星'):'—');
  buildStaticRows(b);
  $('infoSci').textContent=b.phys?b.phys.sci:'';
}

function updateLabels(){

  }
  for(const b of BODIES){
    const el=b.labelEl;
    const v=mulMV(VIEW_MAT,[b.world[0],b.world[1],b.world[2],1]);

    if(Math.abs(nx)>1.15||Math.abs(ny)>1.15){ el.style.display='none'; continue; }
    const rPx=b.dispR*K_PROJ/(-v[2]);

function fmtJD(jd){
  const d=new Date((jd-2440587.5)*86400000);
  return d.toISOString().slice(0,16).replace('T',' ');
}
function fmtSpeed(){
  if(state.paused) return '暂停';
  if(state.speedV===0) return '实时';
  const dps=speedDps(), a=Math.abs(dps);
  let v,u;
  if(a<1/86400){ v=dps*86400; u='秒/秒'; }
  else if(a<1/3600){ v=dps*3600; u='分/秒'; }
  else if(a<1){ v=dps*24; u='时/秒'; }
  else if(a<365.25){ v=dps; u='天/秒'; }
  else { v=dps/365.25; u='年/秒'; }
  const t=Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=10?v.toFixed(1):v.toFixed(2);
  return t+' '+u;
}
function updateBottom(){
  $('dateText').textContent=fmtJD(state.simJD)+' UTC';
  $('speedVal').textContent=fmtSpeed();
  $('btnPlay').textContent=state.paused?'▶':'❚❚';
  $('warn').style.display=(state.simJD<JD_1800||state.simJD>JD_2050)?'block':'none';
}
function showErr(msg){
  const el=$('err');
  el.style.display='flex';
  el.innerHTML='<div>'+msg+'</div>';
}
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.max(2,Math.floor(innerWidth*dpr)), h=Math.max(2,Math.floor(innerHeight*dpr));
  if(w!==VP_W||h!==VP_H){
    VP_W=w; VP_H=h;
    canvas.width=w; canvas.height=h;
    K_PROJ=(h*0.5)/Math.tan(FOV*0.5*D2R);
    buildTargets(w,h);
  }
}

/* =====================================================================
   主循环
   ===================================================================== */
function frame(now){
  wallT=now/1000;
  const rdt=lastT?Math.min(0.1,(now-lastT)/1000):0;
  lastT=now;
  if(!state.paused) state.simJD+=speedDps()*rdt;
  state.compressT=state.flags.real?COMPRESS_REAL:COMPRESS_NORM;
  state.compress+=(state.compressT-state.compress)*Math.min(1,rdt*2.5);
  computeBodies(); computeComet(); computeMoons();
  updateCamera();
  buildRibbons(); buildCometTails();
  render();
  updateBottom(); updateLabels(); updatePanel();
  requestAnimationFrame(frame);
}
function init(){
  canvas=$('gl');
  gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:true,stencil:false,premultipliedAlpha:false,preserveDrawingBuffer:false});
  if(!gl){ showErr('此浏览器不支持 WebGL2。<br>请使用 Chrome / Edge / Firefox / Safari 的最新版本。'); return; }
  HDR=!!gl.getExtension('EXT_color_buffer_float');
  buildGeometry();
  buildPrograms();
  buildBodies();
  buildUI();
  buildStars();
  buildAsteroids();
  resize();
  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',resize);
  updateBottom();
  requestAnimationFrame(frame);
}
init();
</script>
</body>
