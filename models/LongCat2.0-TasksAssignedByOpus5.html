<script>
"use strict";
// ═══════════════════════════════════════════════════════════════
//  太阳系实时运动模型  —  LongCat 2.0
//  单文件 WebGL2 实现，零外部依赖
// ═══════════════════════════════════════════════════════════════

const loadBar = document.getElementById('loadBar');
const loadText = document.getElementById('loadText');
function setProgress(p, txt) { loadBar.style.width = p + '%'; if (txt) loadText.textContent = txt; }

// ═══════════════════════════════════════════════════════════════
//  数学库
// ═══════════════════════════════════════════════════════════════
const M = {
  create() { return new Float32Array(16); },
  identity(o) { o.fill(0); o[0]=o[5]=o[10]=o[15]=1; return o; },
  clone(a) { return new Float32Array(a); },
  mul(o, a, b) {
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3], a10=a[4],a11=a[5],a12=a[6],a13=a[7],
          a20=a[8],a21=a[9],a22=a[10],a23=a[11], a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    for (let i=0;i<4;i++) {
      const b0=b[i*4],b1=b[i*4+1],b2=b[i*4+2],b3=b[i*4+3];
      o[i*4]   = b0*a00 + b1*a10 + b2*a20 + b3*a30;
      o[i*4+1] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
      o[i*4+2] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
      o[i*4+3] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
    }
    return o;
  },
  perspective(o, fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2);
    o.fill(0);
    o[0] = f / aspect; o[5] = f;
    o[10] = (far + near) / (near - far);
    o[11] = -1; o[14] = (2 * far * near) / (near - far);
    return o;
  },
  lookAt(o, eye, center, up) {
    let zx=eye[0]-center[0], zy=eye[1]-center[1], zz=eye[2]-center[2];
    let l = Math.hypot(zx,zy,zz); zx/=l; zy/=l; zz/=l;
    let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
    l = Math.hypot(xx,xy,xz); if (l>1e-8){xx/=l;xy/=l;xz/=l;}
    let yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0;
    o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0;
    o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
    o[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
    o[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
    o[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
    o[15]=1;
    return o;
  },
  translation(o, x, y, z) { M.identity(o); o[12]=x; o[13]=y; o[14]=z; return o; },
  scaling(o, x, y, z) { M.identity(o); o[0]=x; o[5]=y; o[10]=z; return o; },
  invert(o, a) {
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3], a10=a[4],a11=a[5],a12=a[6],a13=a[7],
          a20=a[8],a21=a[9],a22=a[10],a23=a[11], a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10,
          b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12,
          b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30,
          b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
    let det = b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
    if (!det) return null;
    det = 1 / det;
    o[0]=(a11*b11-a12*b10+a13*b09)*det; o[1]=(a02*b10-a01*b11-a03*b09)*det;
    o[2]=(a31*b05-a32*b04+a33*b03)*det; o[3]=(a22*b04-a21*b05-a23*b03)*det;
    o[4]=(a12*b08-a10*b11-a13*b07)*det; o[5]=(a00*b11-a02*b08+a03*b07)*det;
    o[6]=(a32*b02-a30*b05-a33*b01)*det; o[7]=(a20*b05-a22*b02+a23*b01)*det;
    o[8]=(a10*b10-a11*b08+a13*b06)*det; o[9]=(a01*b08-a00*b10-a03*b06)*det;
    o[10]=(a30*b04-a31*b02+a33*b00)*det; o[11]=(a21*b02-a20*b04-a23*b00)*det;
    o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det;
    o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;
    return o;
  },
  transpose(o, a) {
    if (o!==a){o[0]=a[0];o[1]=a[4];o[2]=a[8];o[3]=a[12];o[4]=a[1];o[5]=a[5];o[6]=a[9];o[7]=a[13];o[8]=a[2];o[9]=a[6];o[10]=a[10];o[11]=a[14];o[12]=a[3];o[13]=a[7];o[14]=a[11];o[15]=a[15];}
    else{const a1=a[1],a2=a[2],a3=a[3],a6=a[6],a7=a[7],a11=a[11];o[1]=a[4];o[2]=a[8];o[3]=a[12];o[4]=a1;o[6]=a[9];o[7]=a[13];o[8]=a2;o[9]=a6;o[11]=a[14];o[12]=a3;o[13]=a7;o[14]=a11;}
    return o;
  }
};

const V = {
  add(a,b) { return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]; },
  sub(a,b) { return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; },
  scale(a,s) { return [a[0]*s,a[1]*s,a[2]*s]; },
  dot(a,b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; },
  cross(a,b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; },
  len(a) { return Math.hypot(a[0],a[1],a[2]); },
  normalize(a) { const l=V.len(a)||1; return [a[0]/l,a[1]/l,a[2]/l]; },
  lerp(a,b,t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
};

// ═══════════════════════════════════════════════════════════════
//  WebGL2 初始化
// ═══════════════════════════════════════════════════════════════
setProgress(5, '初始化 WebGL2…');

const glCanvas = document.createElement('canvas');
document.body.appendChild(glCanvas);

const gl = glCanvas.getContext('webgl2', {
  antialias: false, alpha: false, depth: true, stencil: false,
  preserveDrawingBuffer: false, powerPreference: 'high-performance'
});

if (!gl) { document.getElementById('loadText').textContent = '错误：浏览器不支持 WebGL2'; throw new Error('WebGL2 not supported'); }

const hasFloatFB = !!gl.getExtension('EXT_color_buffer_float');
const hasLinearFloat = !!gl.getExtension('OES_texture_float_linear');

setProgress(10, '编译着色器…');

function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader error:', gl.getShaderInfoLog(s), src);
    throw new Error('Shader compile failed');
  }
  return s;
}

function createProgram(vsSrc, fsSrc) {
  const vs = compileShader(vsSrc, gl.VERTEX_SHADER);
  const fs = compileShader(fsSrc, gl.FRAGMENT_SHADER);
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link failed: ' + gl.getProgramInfoLog(p));
  const uniforms = {};
  const numU = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < numU; i++) { const info = gl.getActiveUniform(p, i); uniforms[info.name.replace(/\[0\]$/,'')] = gl.getUniformLocation(p, info.name); }
  return { program: p, uniforms };
}

// ═══════════════════════════════════════════════════════════════
//  几何体
// ═══════════════════════════════════════════════════════════════
setProgress(15, '创建几何体…');

function createSphere(latBands = 64, lonBands = 128) {
  const positions = [], normals = [], indices = [];
  for (let lat = 0; lat <= latBands; lat++) {
    const theta = lat * Math.PI / latBands;
    const sinT = Math.sin(theta), cosT = Math.cos(theta);
    for (let lon = 0; lon <= lonBands; lon++) {
      const phi = lon * 2 * Math.PI / lonBands;
      const x = Math.cos(phi) * sinT, y = cosT, z = Math.sin(phi) * sinT;
      normals.push(x, y, z); positions.push(x, y, z);
    }
  }
  for (let lat = 0; lat < latBands; lat++) {
    for (let lon = 0; lon < lonBands; lon++) {
      const f = lat * (lonBands + 1) + lon, s = f + lonBands + 1;
      indices.push(f, s, f+1, s, s+1, f+1);
    }
  }
  return { positions: new Float32Array(positions), normals: new Float32Array(normals), indices: new Uint32Array(indices), indexCount: indices.length };
}

const sphereGeo = createSphere(48, 96);
const sphereVBO = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, sphereVBO); gl.bufferData(gl.ARRAY_BUFFER, sphereGeo.positions, gl.STATIC_DRAW);
const sphereNBO = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, sphereNBO); gl.bufferData(gl.ARRAY_BUFFER, sphereGeo.normals, gl.STATIC_DRAW);
const sphereIBO = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphereIBO); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, sphereGeo.indices, gl.STATIC_DRAW);

const fsTriVBO = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, fsTriVBO);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
const DEG2RAD = Math.PI / 180;
const J2000 = 2451545.0;

function solveKepler(M, e) {
  M = Math.atan2(Math.sin(M), Math.cos(M));
  let E = M + e * Math.sin(M) * (1 + e * Math.cos(M));
  for (let i = 0; i < 10; i++) {
    const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= dE;
    if (Math.abs(dE) < 1e-13) break;
  }
  return E;
}

function orbitalToEcliptic(elem, T) {
  const a = elem.a + elem.da * T;
  const e = elem.e + elem.de * T;
  const I = (elem.I + elem.dI * T) * DEG2RAD;
  const L = (elem.L + elem.dL * T) * DEG2RAD;
  const wpi = (elem.wpi + elem.dwpi * T) * DEG2RAD;
  const O = (elem.O + elem.dO * T) * DEG2RAD;
  const w = wpi - O;
  let M = L - wpi;
  M = Math.atan2(Math.sin(M), Math.cos(M));
  const E = solveKepler(M, e);
  const cosE = Math.cos(E), sinE = Math.sin(E);
  const xv = a * (cosE - e);
  const yv = a * Math.sqrt(1 - e * e) * sinE;
  const cosO = Math.cos(O), sinO = Math.sin(O);
  const cosW = Math.cos(w), sinW = Math.sin(w);
  const cosI = Math.cos(I), sinI = Math.sin(I);
  const x = (cosW*cosO - sinW*sinO*cosI) * xv + (-sinW*cosO - cosW*sinO*cosI) * yv;
  const y = (cosW*sinO + sinW*cosO*cosI) * xv + (-sinW*sinO + cosW*cosO*cosI) * yv;
  const z = (sinW*sinI) * xv + (cosW*sinI) * yv;
  return [x, y, z];
}

function eclipticToWorld(ecl) { return [ecl[0], ecl[2], -ecl[1]]; }

function getPlanetPosition(name, JD) {
  const T = (JD - J2000) / 36525;
  return eclipticToWorld(orbitalToEcliptic(ORBITAL_ELEMENTS[name], T));
}

function getHalleyPosition(JD) {
  const M = 2 * Math.PI * (JD - HALLEY.Tp) / HALLEY.period;
  const a = HALLEY.a, e = HALLEY.e;
  const I = HALLEY.I * DEG2RAD, omega = HALLEY.omega * DEG2RAD, O = HALLEY.O * DEG2RAD;
  const E = solveKepler(M, e);
  const cosE = Math.cos(E), sinE = Math.sin(E);
  const xv = a * (cosE - e), yv = a * Math.sqrt(1 - e * e) * sinE;
  const cosO = Math.cos(O), sinO = Math.sin(O);
  const cosW = Math.cos(omega), sinW = Math.sin(omega);
  const cosI = Math.cos(I), sinI = Math.sin(I);
  const x = (cosW*cosO - sinW*sinO*cosI) * xv + (-sinW*cosO - cosW*sinO*cosI) * yv;
  const y = (cosW*sinO + sinW*cosO*cosI) * xv + (-sinW*sinO + cosW*cosO*cosI) * yv;
  const z = (sinW*sinI) * xv + (cosW*sinI) * yv;
  return eclipticToWorld([x, y, z]);
}

function orbitalVelocity(r_AU, a_AU) { return 29.7847 * Math.sqrt(2 / r_AU - 1 / a_AU); }

function updateCamera() {
  camera.target = V.lerp(camera.target, camera.targetGoal, 0.08);

  camera.yaw += (camera.yawGoal - camera.yaw) * 0.08;
  camera.pitch += (camera.pitchGoal - camera.pitch) * 0.08;
  const cp = Math.cos(camera.pitch), sp = Math.sin(camera.pitch);
  const cy = Math.cos(camera.yaw), sy = Math.sin(camera.yaw);
  camera.position = [
    camera.target[0] + camera.distance * cp * sy,
    camera.target[1] + camera.distance * sp,
    camera.target[2] + camera.distance * cp * cy
  ];
  M.lookAt(camera.viewMatrix, camera.position, camera.target, camera.up);
  M.invert(camera.invViewMatrix, camera.viewMatrix);
}

let sceneFBO, sceneTex, sceneDepthRB, width = 0, height = 0, dpr = 1;

function createSceneFBO(w, h) {
  if (sceneFBO) { gl.deleteFramebuffer(sceneFBO); gl.deleteTexture(sceneTex); gl.deleteRenderbuffer(sceneDepthRB); }
  width = w; height = h;
  sceneFBO = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
  sceneTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  const iFmt = hasFloatFB ? gl.RGBA16F : gl.RGBA8;
  const type = hasFloatFB ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
  gl.texImage2D(gl.TEXTURE_2D, 0, iFmt, w, h, 0, gl.RGBA, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
  sceneDepthRB = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, sceneDepthRB);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, sceneDepthRB);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// 泛光 FBOs（ping-pong 双缓冲，避免读写反馈环）
let bloomFBOs = [], bloomTexs = [];
let bloomPingTexs = [], bloomPongTexs = [], bloomPingFBOs = [], bloomPongFBOs = [];
const BLOOM_LEVELS = 6;

function createBloomFBOs(w, h) {
  // 清理旧资源
  bloomFBOs.forEach(f=>gl.deleteFramebuffer(f));
  bloomTexs.forEach(t=>gl.deleteTexture(t));
  bloomPingFBOs.forEach(f=>gl.deleteFramebuffer(f));
  bloomPongFBOs.forEach(f=>gl.deleteFramebuffer(f));
  bloomPingTexs.forEach(t=>gl.deleteTexture(t));
  bloomPongTexs.forEach(t=>gl.deleteTexture(t));
  bloomFBOs = []; bloomTexs = [];
  bloomPingTexs = []; bloomPongTexs = []; bloomPingFBOs = []; bloomPongFBOs = [];

  const fmt = hasFloatFB ? gl.RGBA16F : gl.RGBA8;
  const tp = hasFloatFB ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

  for (let i = 0; i < BLOOM_LEVELS; i++) {
    let bw = Math.max(1, Math.floor(w >> (i+1))), bh = Math.max(1, Math.floor(h >> (i+1)));

    // 每个级别创建 ping 和 pong 两个纹理+FBO
    const pingTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, pingTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, fmt, bw, bh, 0, gl.RGBA, tp, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const pingFBO = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, pingFBO);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, pingTex, 0);

    const pongTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, pongTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, fmt, bw, bh, 0, gl.RGBA, tp, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const pongFBO = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, pongFBO);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, pongTex, 0);

    bloomPingTexs.push(pingTex); bloomPongTexs.push(pongTex);
    bloomPingFBOs.push(pingFBO); bloomPongFBOs.push(pongFBO);

    // 兼容旧代码引用（composite 用）
    bloomFBOs.push(pingFBO); bloomTexs.push(pingTex);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

const NOISE_GLSL = `
float hash13(vec3 p){p=fract(p*0.1031);p+=dot(p,p.yzx+33.33);return fract((p.x+p.y)*p.z);}
vec3 hash33(vec3 p){p=fract(p*vec3(0.1031,0.1030,0.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
float vnoise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  float n000=hash13(i),n100=hash13(i+vec3(1,0,0)),n010=hash13(i+vec3(0,1,0)),n110=hash13(i+vec3(1,1,0)),
        n001=hash13(i+vec3(0,0,1)),n101=hash13(i+vec3(1,0,1)),n011=hash13(i+vec3(0,1,1)),n111=hash13(i+vec3(1,1,1));
  return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);}
float fbm(vec3 p){float s=0.0,a=0.5;
  mat3 rot=mat3(0.00,0.80,0.60,-0.80,0.36,-0.48,-0.60,-0.48,0.64);
  for(int i=0;i<6;i++){s+=a*vnoise(p);p=rot*p*2.02;a*=0.5;}return s;}
vec2 worley(vec3 p){vec3 id=floor(p),fd=fract(p);float d1=1e10,d2=1e10;
  for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){
    vec3 off=vec3(x,y,z),r=hash33(id+off),v=off+r-fd;float d=dot(v,v);
    if(d<d1){d2=d1;d1=d;}else if(d<d2){d2=d;}}
  return vec2(sqrt(d1),sqrt(d2));}
float sstep(float a,float b,float x){float t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
`;

const PLANET_FS = `#version 300 es
precision highp float;
in vec3 vObjPos;
in vec3 vNormal;
in vec3 vWorldPos;
out vec4 fragColor;
uniform vec3 uSunDir;
uniform float uIntensity;
uniform int uType;       // 0=rock,1=earth,2=mars,3=jupiter,4=saturn,5=uranus,6=neptune,7=venus,8=ice
uniform float uTime;
${NOISE_GLSL}

// ── 地球 ──
vec3 surfEarth(vec3 p, vec3 N, vec3 L){
  float lat = asin(p.y);
  float lon = atan(p.z, p.x);

  // 海陆高度场（7倍频 fbm）
  float h = fbm(p * 3.0);
  float ocean = sstep(0.552, 0.45, h); // 1=海洋

  // 海洋颜色
  float depth = sstep(0.552, 0.3, h);
  vec3 seaDeep = vec3(0.02, 0.08, 0.25);
  vec3 seaShallow = vec3(0.05, 0.25, 0.45);
  vec3 oceanCol = mix(seaDeep, seaShallow, depth);

  // 陆地颜色
  float landH = fbm(p * 5.0 + vec3(10.0));
  vec3 green = vec3(0.15, 0.35, 0.1);
  vec3 desert = vec3(0.6, 0.5, 0.25);
  vec3 rock = vec3(0.4, 0.35, 0.3);
  vec3 ice = vec3(0.9, 0.92, 0.95);
  vec3 landCol = mix(green, desert, sstep(0.5, 0.7, landH));
  landCol = mix(landCol, rock, sstep(0.7, 0.85, landH));

  // 极冰
  float polar = sstep(0.75, 0.88, abs(lat) / 1.5708);
  polar *= 0.7 + 0.3 * fbm(p * 8.0);
  landCol = mix(landCol, ice, polar);

  vec3 color = mix(oceanCol, landCol, 1.0 - ocean);

  // 云层
  float cloud = fbm(p * 4.0 + vec3(uTime * 0.01, 0.0, uTime * 0.005));
  cloud = sstep(0.55, 0.75, cloud);
  // 云量按纬度调制
  float cloudLat = 0.5 + 0.5 * cos(lat * 3.0);
  cloud *= cloudLat;
  color = mix(color, vec3(0.95), cloud * 0.7);

  // 海洋镜面高光
  float spec = 0.0;
  if (ocean > 0.5 && cloud < 0.3) {
    vec3 V = normalize(-vWorldPos);
    vec3 H = normalize(L + V);
    spec = pow(max(dot(N, H), 0.0), 420.0) * 0.6;
  }
  color += vec3(spec);

  // 夜面灯光
  float night = sstep(0.0, -0.05, dot(N, L));
  if (night > 0.0 && ocean < 0.5) {
    float cityLights = pow(max(fbm(p * 80.0) - 0.65, 0.0) * 5.0, 2.0);
    color += vec3(1.0, 0.8, 0.4) * cityLights * night * 0.5;
  }

  return color;
}

// ── 火星 ──
vec3 surfMars(vec3 p, vec3 N, vec3 L){
  // 基础红棕色（低反照率 0.17）
  vec3 base = vec3(0.55, 0.22, 0.1);
  float n = fbm(p * 6.0);
  base = base * (0.8 + 0.4 * n);

  // 撞击坑
  vec2 w = worley(p * 12.0);
  float craters = sstep(0.0, 0.08, w.x) * 0.3;
  base *= (1.0 - craters);

  // 极冠
  float lat = asin(p.y);
  float polar = sstep(0.7, 0.85, abs(lat) / 1.5708);
  base = mix(base, vec3(0.9, 0.88, 0.85), polar * 0.8);

  // 水手谷（赤道附近暗色长沟）
  float valles = exp(-pow(lat * 4.0, 2.0)) * exp(-pow(atan(p.z, p.x) - 1.2, 2.0) * 2.0);
  base *= (1.0 - valles * 0.3);

  return base;
}

// ── 木星 ──
vec3 surfJupiter(vec3 p, vec3 N, vec3 L){
  float lat = degrees(asin(p.y));

  // 纬向带纹
  float bands = sin(lat * 4.0) * 0.5 + sin(lat * 9.0) * 0.25 + sin(lat * 17.0) * 0.12 + sin(lat * 30.0) * 0.06;
  // 横向扭曲
  float turb = fbm(vec3(p.x * 0.5, p.y * 0.3 + bands, p.z * 0.5) * 2.0) * 8.0;
  bands = sin((lat + turb) * 0.3);

  // 极区淡出
  float polarFade = sstep(46.0, 94.0, abs(lat));
  bands *= (1.0 - polarFade * 0.8);

  // 颜色
  vec3 c1 = vec3(0.75, 0.55, 0.35);
  vec3 c2 = vec3(0.9, 0.8, 0.6);
  vec3 color = mix(c1, c2, bands * 0.5 + 0.5);

  // 大红斑（南纬约 -22°）
  float lon = degrees(atan(p.z, p.x));
  float spotLat = -22.0;
  float spotDist = length(vec2((lat - spotLat) * 0.8, lon - 200.0));
  float spot = sstep(18.0, 0.0, spotDist);
  if (spot > 0.0) {
    float angle = atan(p.z, p.x) + spotDist * 0.1 + uTime * 0.001;
    float spiral = sin(angle * 3.0 + spotDist * 0.3) * 0.5 + 0.5;
    vec3 spotCol = mix(vec3(0.6, 0.2, 0.1), vec3(0.7, 0.3, 0.15), spiral);
    color = mix(color, spotCol, spot * 0.7);
    // 边缘亮晕
    float rim = sstep(18.0, 12.0, spotDist) * sstep(10.0, 12.0, spotDist);
    color = mix(color, vec3(0.9, 0.7, 0.5), rim * 0.3);
  }

  return color;
}

// ── 土星 ──
vec3 surfSaturn(vec3 p, vec3 N, vec3 L){
  float lat = degrees(asin(p.y));

  // 纬向带纹（比木星柔和）
  float bands = sin(lat * 4.0) * 0.4 + sin(lat * 9.0) * 0.15 + sin(lat * 17.0) * 0.06;
  float turb = fbm(vec3(p.x * 0.4, p.y * 0.25 + bands, p.z * 0.4) * 2.0) * 5.0;
  bands = sin((lat + turb) * 0.25);

  float polarFade = sstep(46.0, 94.0, abs(lat));
  bands *= (1.0 - polarFade * 0.8);

  vec3 c1 = vec3(0.7, 0.6, 0.4);
  vec3 c2 = vec3(0.9, 0.82, 0.6);
  vec3 color = mix(c1, c2, bands * 0.5 + 0.5);

  // 北极六边形
  if (abs(lat) > 0.80 * 90.0) {
    float lon = degrees(atan(p.z, p.x));
    float hexEdge = 0.115 / cos(radians(mod(lon, 60.0) - 30.0));
    color *= (1.0 - sstep(0.1, 0.12, hexEdge) * 0.3);
  }

  return color;
}

// ── 金星（厚云）──
vec3 surfVenus(vec3 p, vec3 N, vec3 L){
  // 涡旋状条纹
  float lat = asin(p.y);
  float lon = atan(p.z, p.x);
  float spiral = sin(lon * 2.0 + lat * 3.0 + fbm(p * 4.0) * 5.0);
  float stripes = sin(lat * 8.0 + fbm(p * 3.0) * 4.0);

  vec3 c1 = vec3(0.85, 0.75, 0.5);
  vec3 c2 = vec3(0.95, 0.9, 0.7);
  vec3 color = mix(c1, c2, stripes * 0.3 + spiral * 0.2 + 0.5);
  color *= 0.9; // 高反照率

  return color;
}

// ── 天王星/海王星 ──
vec3 surfIceGiant(vec3 p, vec3 N, vec3 L, bool isNeptune){
  float n = fbm(p * 5.0);
  vec3 base = isNeptune ? vec3(0.15, 0.25, 0.7) : vec3(0.4, 0.7, 0.75);

  // 很淡的带纹
  float lat = asin(p.y);
  float bands = sin(lat * 6.0) * 0.08;
  base *= (1.0 + bands);

  if (isNeptune) {
    // 暗斑
    float spotDist = length(vec2(asin(p.y) * 2.0 + 0.5, atan(p.z, p.x) - 0.8));
    float spot = sstep(0.5, 0.0, spotDist);
    base = mix(base, vec3(0.08, 0.12, 0.4), spot * 0.6);
  }

  return base;
}

// ── 岩质天体（水星、月球）──
vec3 surfRock(vec3 p, vec3 N, vec3 L){
  vec3 base = vec3(0.5, 0.48, 0.45);

  // 撞击坑
  float height = 0.0;
  float albedo = 0.0;
  for (int oct = 0; oct < 4; oct++) {
    float freq = 5.0 * pow(2.4, float(oct));
    float depth = 1.0 * pow(0.52, float(oct));
    vec2 w = worley(p * freq);
    float d1 = w.x;
    float id = hash13(floor(p * freq));
    float rad = 0.13 + 0.22 * fract(id * 7.31);
    float t = d1 / rad;
    float bowl = (t < 1.0) ? -(1.0 - t*t) : 0.0;
    float rim = exp(-((t-1.0)/0.26) * ((t-1.0)/0.26));
    float exist = sstep(0.74, 0.74, id) * sstep(0.60, 0.40, d1);
    height += (bowl * 0.9 + rim * 0.5) * depth * exist;
    albedo += (bowl * 0.55 + rim * 0.32) * depth * exist;
  }

  base *= (1.0 + albedo * 0.4);
  base *= (1.0 + height * 0.2);

  return base;
}

void main(){
  vec3 N = normalize(vNormal);
  vec3 L = normalize(uSunDir);
  vec3 p = normalize(vObjPos);

  vec3 color;
  if (uType == 1) color = surfEarth(p, N, L);
  else if (uType == 2) color = surfMars(p, N, L);
  else if (uType == 3) color = surfJupiter(p, N, L);
  else if (uType == 4) color = surfSaturn(p, N, L);
  else if (uType == 7) color = surfVenus(p, N, L);
  else if (uType == 5) color = surfIceGiant(p, N, L, false);
  else if (uType == 6) color = surfIceGiant(p, N, L, true);
  else color = surfRock(p, N, L);

  // 光照
  float diff = max(dot(N, L), 0.0);
  float ambient = 0.08;
  color *= (ambient + diff * uIntensity);

  // 临边昏暗
  vec3 V = normalize(-vWorldPos);
  float limb = 0.3 + 0.7 * pow(max(dot(N, V), 0.0), 0.3);
  color *= limb;

  fragColor = vec4(color, 1.0);
}`;

float solveK(float M, float e){
  M = atan(sin(M), cos(M));
  float E = M + e*sin(M)*(1.0+e*cos(M));
  for(int i=0;i<10;i++){float dE=(E-e*sin(E)-M)/(1.0-e*cos(E));E-=dE;if(abs(dE)<1e-13)break;}
  return E;
}

void main(){
  float T = (uJD - 2451545.0) / 36525.0;
  float M = aM0 + aN * T * 36525.0;

function generateOrbitGeometry(name) {
  const samples = 256;
  const positions = [];

  const elem = ORBITAL_ELEMENTS[name];
  if (!elem) return null;

  // 计算轨道上的点
  for (let i = 0; i <= samples; i++) {
    const M = (i / samples) * Math.PI * 2;
    const E = solveKepler(M, elem.e);
    const cosE = Math.cos(E), sinE = Math.sin(E);
    const a = elem.a, e = elem.e;
    const xv = a * (cosE - e);
    const yv = a * Math.sqrt(1 - e * e) * sinE;
    const I = elem.I * DEG2RAD;
    const O = elem.O * DEG2RAD;
    const wpi = elem.wpi * DEG2RAD;
    const w = wpi - O;
    const cosO = Math.cos(O), sinO = Math.sin(O);
    const cosW = Math.cos(w), sinW = Math.sin(w);
    const cosI = Math.cos(I), sinI = Math.sin(I);
    const x = (cosW*cosO - sinW*sinO*cosI) * xv + (-sinW*cosO - cosW*sinO*cosI) * yv;
    const y = (cosW*sinO + sinW*cosO*cosI) * xv + (-sinW*sinO + cosW*cosO*cosI) * yv;
    const z = (sinW*sinI) * xv + (cosW*sinI) * yv;
    const world = eclipticToWorld([x, y, z]);

    // 压缩径向距离
    const r = V.len(world);
    const cp = V.scale(V.normalize(world), SCALE * Math.pow(r, COMPRESS));
    positions.push(...cp);
  }

  return {
    positions: new Float32Array(positions),
    count: samples + 1
  };
}

function getMoonPosition(moon, JD) {
  const parentPos = bodyPositions[moon.parent];
  if (!parentPos) return [0,0,0];

  const theta = 2 * Math.PI * (JD - J2000) / moon.period;

  // 卫星显示距离计算
  const parentDisplayR = displayRadius(moon.parent);
  const moonDisplayR = 0.72 * Math.pow(moon.radius / 6371, 0.42);

  // 找该行星最内层卫星
  let a0 = moon.a;
  for (const m of MOONS) {
    if (m.parent === moon.parent && m.a < a0) a0 = m.a;
  }

  // 环外缘（土星 2.34，天王星 2.00，木星 1.81）
  let ringOuter = 0;
  if (moon.parent === 'saturn') ringOuter = 2.34;
  else if (moon.parent === 'uranus') ringOuter = 2.00;
  else if (moon.parent === 'jupiter') ringOuter = 1.81;

  const base = Math.max(2.35, ringOuter + moonDisplayR / parentDisplayR + 0.55);
  const d = parentDisplayR * base * Math.pow(moon.a / a0, 0.55);

  // 局部坐标
  let local = [Math.cos(theta) * d, 0, Math.sin(theta) * d];

  // 倾斜
  const inc = moon.inc * DEG2RAD;
  local = [local[0], local[1] * Math.cos(inc) - local[2] * Math.sin(inc), local[1] * Math.sin(inc) + local[2] * Math.cos(inc)];

  if (moon.ref === 'ecliptic') {
    // 参考面 = 黄道面，直接加
    return V.add(parentPos, local);
  } else {
    // 参考面 = 母行星赤道面
    const axis = getRotationAxis(moon.parent);
    let ref = Math.abs(axis[1]) < 0.99 ? [0,1,0] : [1,0,0];
    let xAxis = V.normalize(V.cross(ref, axis));
    let zAxis = V.normalize(V.cross(axis, xAxis));
    let yAxis = axis;

    const world = V.add(parentPos, [
      xAxis[0] * local[0] + yAxis[0] * local[1] + zAxis[0] * local[2],
      xAxis[1] * local[0] + yAxis[1] * local[1] + zAxis[1] * local[2],
      xAxis[2] * local[0] + yAxis[2] * local[1] + zAxis[2] * local[2]
    ]);
    return world;
  }
}

function renderMoons() {
  if (!renderState.showMoons) return;

  for (const moon of MOONS) {
    const worldPos = getMoonPosition(moon, simJD);
    const parentPos = bodyPositions[moon.parent];
    const toSun = V.normalize(V.scale(worldPos, -1));
    const rAU = V.len(worldPos);
    const intensity = Math.max(0.26, Math.min(2.1, 1.5 * Math.pow(1/Math.max(rAU, 0.1), 0.4)));

    const moonDisplayR = 0.72 * Math.pow(moon.radius / 6371, 0.42);

    // 构建模型矩阵
    const m = M.translation(M.create(), worldPos[0], worldPos[1], worldPos[2]);
    const s = M.scaling(M.create(), moonDisplayR, moonDisplayR, moonDisplayR);
    const model = M.mul(M.create(), m, s);

    const inv = M.create();
    M.invert(inv, model);
    const normalMat = M.transpose(M.create(), inv);

    gl.useProgram(progSphere.program);
    gl.uniformMatrix4fv(progSphere.uniforms.uModel, false, model);
    gl.uniformMatrix4fv(progSphere.uniforms.uViewProj, false, camera.viewProjMatrix);
    gl.uniformMatrix3fv(progSphere.uniforms.uNormalMat, false, new Float32Array([
      normalMat[0],normalMat[1],normalMat[2],normalMat[4],normalMat[5],normalMat[6],normalMat[8],normalMat[9],normalMat[10]
    ]));
    gl.uniform3f(progSphere.uniforms.uSunDir, toSun[0], toSun[1], toSun[2]);
    gl.uniform1f(progSphere.uniforms.uIntensity, intensity);
    gl.uniform1i(progSphere.uniforms.uType, 0); // 岩质

    gl.bindBuffer(gl.ARRAY_BUFFER, sphereVBO);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, sphereNBO);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphereIBO);
    gl.drawElements(gl.TRIANGLES, sphereGeo.indexCount, gl.UNSIGNED_INT, 0);
  }
}

const ATMOSPHERE_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNormal;
uniform mat4 uModel;
uniform mat4 uViewProj;
uniform mat3 uNormalMat;
out vec3 vObjPos;
out vec3 vNormal;
out vec3 vWorldPos;
void main(){
  vObjPos = aPos;
  vNormal = normalize(uNormalMat * aNormal);
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorldPos = wp.xyz;
  gl_Position = uViewProj * wp;
}`;

const ATMOSPHERE_FS = `#version 300 es
precision highp float;
in vec3 vObjPos;
in vec3 vNormal;
in vec3 vWorldPos;
out vec4 fragColor;
uniform vec3 uSunDir;
uniform vec3 uCameraPos;
uniform float uPlanetRadius;
uniform float uScale;

float sstep(float a, float b, float x){
  float t = clamp((x - a) / (b - a), 0.0, 1.0);
  return t * t * (3.0 - 2.0 * t);
}

void main(){
  vec3 N = normalize(vNormal);
  vec3 L = normalize(uSunDir);
  vec3 V = normalize(uCameraPos - vWorldPos);
  vec3 rd = normalize(vWorldPos - uCameraPos);
  vec3 oc = vWorldPos - uCameraPos;

  // 视线撞击参数
  float tca = dot(oc, rd);
  float b = sqrt(dot(oc, oc) - tca * tca) / uPlanetRadius;
  float dens = exp(-max(b - 1.0, 0.0) / 0.03);
  dens *= 1.0 - sstep(1.0, 0.96, b) * 0.86;

  // 昼夜判定
  vec3 an = normalize(uCameraPos + rd * tca - vWorldPos + normalize(vWorldPos) * uPlanetRadius);
  float light = max(dot(an, L), 0.0);
  light = 0.15 + 0.85 * light;

  // 前向散射
  float forward = pow(dot(rd, L) * 0.5 + 0.5, 4.0);

  vec3 atmColor = vec3(0.3, 0.6, 1.0);
  float alpha = dens * light * (0.05 + forward * 0.15);

  // 边缘增亮
  float limb = pow(1.0 - max(dot(N, V), 0.0), 2.0);
  alpha += limb * dens * 0.1;

  fragColor = vec4(atmColor * alpha * 3.0, alpha);
}
`;

const progAtmosphere = createProgram(ATMOSPHERE_VS, ATMOSPHERE_FS);

//  土星环
// ═══════════════════════════════════════════════════════════════

// 环密度函数
function ringDensity(r) {
  // r 以母行星半径为单位
  let d = 0.0;
  // C 环
  if (r >= 1.235 && r < 1.53) d = Math.max(d, 0.11);
  // B 环
  if (r >= 1.525 && r < 1.95) d = Math.max(d, 1.20);
  // 卡西尼缝
  if (r >= 1.95 && r < 2.03) d *= 0.13;
  // A 环
  if (r >= 2.025 && r < 2.27) d = Math.max(d, 0.58);
  // 恩克缝
  d *= (1.0 - 0.92 * Math.exp(-Math.pow((r - 2.214)/0.0045, 2)));
  // 基勒缝
  d *= (1.0 - 0.80 * Math.exp(-Math.pow((r - 2.265)/0.0018, 2)));
  // F 环
  d += 0.30 * Math.exp(-Math.pow((r - 2.324)/0.0055, 2));

  // 细密环纹
  d *= 0.70 + 0.60 * Math.sin(r * 230.0);

  return d;
}

const RING_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos; // x = 归一化半径, y = 角度
uniform mat4 uModel;
uniform mat4 uViewProj;
uniform float uInnerRadius;
uniform float uOuterRadius;
out vec2 vRingCoord; // x = 半径(planet radii), y = 角度
out vec3 vWorldPos;
void main(){
  float r = uInnerRadius + aPos.x * (uOuterRadius - uInnerRadius);
  float angle = aPos.y;
  vec3 local = vec3(cos(angle) * r, 0.0, sin(angle) * r);
  vRingCoord = vec2(r, angle);
  vec4 wp = uModel * vec4(local, 1.0);
  vWorldPos = wp.xyz;
  gl_Position = uViewProj * wp;
}`;

const RING_FS = `#version 300 es
precision highp float;
in vec2 vRingCoord;
in vec3 vWorldPos;
out vec4 fragColor;
uniform vec3 uSunDir;
uniform vec3 uCameraPos;
uniform float uPlanetRadius;
uniform vec3 uPlanetPos;

float ringDensity(float r){
  float d = 0.0;
  if (r >= 1.235 && r < 1.53) d = max(d, 0.11);
  if (r >= 1.525 && r < 1.95) d = max(d, 1.20);
  if (r >= 1.95 && r < 2.03) d *= 0.13;
  if (r >= 2.025 && r < 2.27) d = max(d, 0.58);
  d *= (1.0 - 0.92 * exp(-((r - 2.214)/0.0045) * ((r - 2.214)/0.0045)));
  d *= (1.0 - 0.80 * exp(-((r - 2.265)/0.0018) * ((r - 2.265)/0.0018)));
  d += 0.30 * exp(-((r - 2.324)/0.0055) * ((r - 2.324)/0.0055));
  d *= 0.70 + 0.60 * sin(r * 230.0);
  return d;
}

// 行星在环上的投影阴影
float planetShadow(vec3 ringPoint, vec3 sunDir, vec3 planetCenter, float planetRadius){
  vec3 oc = ringPoint - planetCenter;
  float bb = dot(oc, sunDir);
  if (bb > 0.0) return 1.0; // 在行星背后，不受影响
  float dmin = sqrt(dot(oc, oc) - bb * bb);
  float shadow = smoothstep(planetRadius * 0.97, planetRadius * 1.09, dmin);
  return shadow; // 1 = 无阴影, 0 = 全阴影
}

void main(){
  float r = vRingCoord.x;
  float d = ringDensity(r);
  if (d < 0.001) discard;

  vec3 ringNormal = vec3(0.0, 1.0, 0.0);
  vec3 L = normalize(uSunDir);
  vec3 V = normalize(uCameraPos - vWorldPos);

  float muView = max(abs(dot(ringNormal, V)), 0.10);
  float muSun = max(abs(dot(ringNormal, L)), 0.10);

  float tauView = d * 1.45 / muView;
  float tauSun = d * 1.45 / muSun;
  float alpha = 1.0 - exp(-tauView);

  // 判断正面受光还是背光
  float side = sign(dot(ringNormal, L) * dot(ringNormal, V));
  float brightness;
  if (side > 0.0) {
    brightness = (1.0 - exp(-tauSun)) * 0.85;
  } else {
    brightness = exp(-tauSun * 0.42) * 1.15 * (1.0 - exp(-tauSun * 0.75));
  }

  // 行星阴影投射到环上
  float shadow = planetShadow(vWorldPos, L, uPlanetPos, uPlanetRadius);
  brightness *= shadow;

  vec3 color = vec3(0.85, 0.78, 0.6) * brightness;
  fragColor = vec4(color, alpha);
}`;

const progRing = createProgram(RING_VS, RING_FS);

// 生成环几何体
function createRingGeometry(innerR, outerR, segments = 128, rings = 64) {
  const positions = [];
  for (let i = 0; i < rings; i++) {
    const r0 = i / rings;
    const r1 = (i + 1) / rings;
    for (let j = 0; j < segments; j++) {
      const a0 = (j / segments) * Math.PI * 2;
      const a1 = ((j + 1) / segments) * Math.PI * 2;

      positions.push(r0, a0, r1, a0, r0, a1);
      positions.push(r1, a0, r1, a1, r0, a1);
    }
  }
  return new Float32Array(positions);
}

  gl.uniform3f(progSphere.uniforms.uSunDir, toSun[0], toSun[1], toSun[2]);
  gl.uniform1f(progSphere.uniforms.uIntensity, Math.max(0.3, Math.min(2.1, 1.0 / Math.max(rAU * rAU * 0.3, 0.1))));
  gl.uniform1i(progSphere.uniforms.uType, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, sphereVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, sphereNBO);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphereIBO);
  gl.drawElements(gl.TRIANGLES, sphereGeo.indexCount, gl.UNSIGNED_INT, 0);

  // 计算相机基向量
  const camForward = V.normalize(V.sub(camera.target, camera.position));
  const camRight = V.normalize(V.cross(camForward, camera.up));
  const camUp = V.cross(camRight, camForward);

  // 离子尾（笔直指向反日方向，偏蓝）
  gl.useProgram(progCometTail.program);
  gl.uniformMatrix4fv(progCometTail.uniforms.uViewProj, false, camera.viewProjMatrix);
  gl.uniform3f(progCometTail.uniforms.uCometPos, compPos[0], compPos[1], compPos[2]);
  gl.uniform3f(progCometTail.uniforms.uTailDir, toSun[0], toSun[1], toSun[2]);
  gl.uniform3f(progCometTail.uniforms.uCameraRight, camRight[0], camRight[1], camRight[2]);
  gl.uniform3f(progCometTail.uniforms.uCameraUp, camUp[0], camUp[1], camUp[2]);
  gl.uniform1f(progCometTail.uniforms.uTailLength, tailLength);
  gl.uniform1f(progCometTail.uniforms.uTailWidth, 0.3);
  gl.uniform3f(progCometTail.uniforms.uTailColor, 0.4, 0.5, 1.0); // 蓝色

  gl.bindBuffer(gl.ARRAY_BUFFER, cometTailVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, cometTailGeo.length / 2);

  // 尘埃尾（沿速度反方向弯曲，偏暖黄）
  const dustDir = V.normalize(V.scale(velDir, -1));
  gl.uniform3f(progCometTail.uniforms.uTailDir, dustDir[0], dustDir[1], dustDir[2]);
  gl.uniform1f(progCometTail.uniforms.uTailLength, tailLength * 0.6);
  gl.uniform1f(progCometTail.uniforms.uTailWidth, 0.5);
  gl.uniform3f(progCometTail.uniforms.uTailColor, 0.9, 0.7, 0.3); // 暖黄色

  gl.bindBuffer(gl.ARRAY_BUFFER, cometTailVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, cometTailGeo.length / 2);
}

setProgress(70, '场景就绪');

// ═══════════════════════════════════════════════════════════════
//  时间系统
// ═══════════════════════════════════════════════════════════════
let simJD = 0, simSpeed = 0, paused = false, timeAccum = 0;

function getJDNow() { return Date.now() / 86400000 + 2440587.5; }
function initTime() { simJD = getJDNow(); }

function speedToDaysPerSec(v) {
  const av = Math.abs(v);
  const sign = v < 0 ? -1 : 1;
  return sign * 1.157407e-5 * Math.pow(10, av / 100 * 8.55);
}

function jdToDateStr(jd) {
  const d = Math.floor(jd - 2440587.5);
  const date = new Date(d * 86400000);
  return date.toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
}

// ═══════════════════════════════════════════════════════════════
//  渲染状态
// ═══════════════════════════════════════════════════════════════
const renderState = {
  showOrbits: true, showNames: true, showMoons: true,
  showAsteroids: true, showComet: true, showBloom: true,
  realDist: false, compressAnim: 0, selectedBody: 'sun'
};

const bodyPositions = {};

function computeBodyPositions() {
  bodyPositions['sun'] = [0, 0, 0];
  for (const name of planetNames) bodyPositions[name] = getPlanetPosition(name, simJD);
}

function compressPosition(pos) {
  const r = V.len(pos);
  if (r < 1e-8) return pos;
  return V.scale(V.normalize(pos), SCALE * Math.pow(r, COMPRESS));
}

function displayRadius(name) {
  if (name === 'sun') return 4.6;
  return 0.72 * Math.pow(PHYSICAL_DATA[name].radius / 6371, 0.42);
}

function getRotationAxis(name) {
  const d = POLE_DATA[name];
  const tilt = d.tilt * DEG2RAD, lon = d.poleLon * DEG2RAD;
  const ecl = [Math.sin(tilt)*Math.cos(lon), Math.sin(tilt)*Math.sin(lon), Math.cos(tilt)];
  return eclipticToWorld(ecl);
}

const rotationPhase = {};
function getRotationPhase(name) {
  if (!(name in rotationPhase)) rotationPhase[name] = Math.random() * Math.PI * 2;
  const d = ROTATION_DATA[name];
  const periodDays = Math.abs(d.rotH) / 24;
  let dPhase = 2 * Math.PI * timeAccum / periodDays;
  dPhase = Math.max(-0.22, Math.min(0.22, dPhase));
  rotationPhase[name] += dPhase;
  return rotationPhase[name];
}

function buildModelMatrix(name) {
  const pos = compressPosition(bodyPositions[name]);
  const R = displayRadius(name);
  const axis = getRotationAxis(name);
  const phase = getRotationPhase(name);
  let ref = Math.abs(axis[1]) < 0.99 ? [0,1,0] : [1,0,0];
  let xAxis = V.normalize(V.cross(ref, axis));
  let zAxis = V.normalize(V.cross(axis, xAxis));
  let yAxis = axis;
  const cp = Math.cos(phase), sp = Math.sin(phase);
  const rx = V.add(V.scale(xAxis, cp), V.scale(zAxis, sp));
  const rz = V.add(V.scale(zAxis, cp), V.scale(xAxis, -sp));
  const m = M.create();
  m[0]=rx[0]; m[1]=rx[1]; m[2]=rx[2]; m[3]=0;
  m[4]=yAxis[0]; m[5]=yAxis[1]; m[6]=yAxis[2]; m[7]=0;
  m[8]=rz[0]; m[9]=rz[1]; m[10]=rz[2]; m[11]=0;
  m[12]=pos[0]; m[13]=pos[1]; m[14]=pos[2]; m[15]=1;
  const s = M.scaling(M.create(), R, R, R);
  return M.mul(M.create(), m, s);
}

// ═══════════════════════════════════════════════════════════════
//  渲染函数
// ═══════════════════════════════════════════════════════════════

// 行星类型映射
const PLANET_TYPES = {
  mercury:0, venus:7, earth:1, mars:2, jupiter:3, saturn:4, uranus:5, neptune:6, pluto:0
};

function renderSphere(prog, name, sunDir, intensity) {
  gl.useProgram(prog.program); // ★ 确保 uniform 位置与当前程序关联
  const model = buildModelMatrix(name);
  const inv = M.create();
  M.invert(inv, model);
  const normalMat = M.transpose(M.create(), inv);

  gl.uniformMatrix4fv(prog.uniforms.uModel, false, model);
  gl.uniformMatrix4fv(prog.uniforms.uViewProj, false, camera.viewProjMatrix);
  gl.uniformMatrix3fv(prog.uniforms.uNormalMat, false, new Float32Array([
    normalMat[0],normalMat[1],normalMat[2],normalMat[4],normalMat[5],normalMat[6],normalMat[8],normalMat[9],normalMat[10]
  ]));
  if (prog.uniforms.uSunDir) gl.uniform3f(prog.uniforms.uSunDir, sunDir[0], sunDir[1], sunDir[2]);
  if (prog.uniforms.uBodyColor) {
    const c = PHYSICAL_DATA[name].color || [0.7,0.7,0.7];
    gl.uniform3f(prog.uniforms.uBodyColor, c[0], c[1], c[2]);
  }
  if (prog.uniforms.uIntensity) gl.uniform1f(prog.uniforms.uIntensity, intensity);
  if (prog.uniforms.uTime) gl.uniform1f(prog.uniforms.uTime, performance.now() * 0.001);
  if (prog.uniforms.uType) gl.uniform1i(prog.uniforms.uType, PLANET_TYPES[name] || 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, sphereVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, sphereNBO);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphereIBO);
  gl.drawElements(gl.TRIANGLES, sphereGeo.indexCount, gl.UNSIGNED_INT, 0);
}

function renderBackground() {
  gl.useProgram(progBG.program);
  gl.uniformMatrix4fv(progBG.uniforms.uInvViewProj, false, camera.invProjMatrix);
  gl.uniform3f(progBG.uniforms.uCameraPos, camera.position[0], camera.position[1], camera.position[2]);
  gl.bindBuffer(gl.ARRAY_BUFFER, fsTriVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function renderStars() {
  gl.useProgram(progStar.program);
  gl.uniformMatrix4fv(progStar.uniforms.uViewProj, false, camera.viewProjMatrix);
  gl.uniform3f(progStar.uniforms.uCameraPos, camera.position[0], camera.position[1], camera.position[2]);

  gl.bindBuffer(gl.ARRAY_BUFFER, starDirVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, starBrightVBO);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, starColorVBO);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 0, 0);

  gl.drawArrays(gl.POINTS, 0, STAR_COUNT);
}

function renderAsteroids() {
  if (!renderState.showAsteroids) return;
  gl.useProgram(progAsteroid.program);
  gl.uniform1f(progAsteroid.uniforms.uJD, simJD);
  gl.uniformMatrix4fv(progAsteroid.uniforms.uViewProj, false, camera.viewProjMatrix);
  gl.uniform3f(progAsteroid.uniforms.uCameraPos, camera.position[0], camera.position[1], camera.position[2]);
  gl.uniform1f(progAsteroid.uniforms.uCompress, COMPRESS);
  gl.uniform1f(progAsteroid.uniforms.uScale, SCALE);

  const stride = 8 * 4;
  gl.bindBuffer(gl.ARRAY_BUFFER, asteroidOrbVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 1, gl.FLOAT, false, stride, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, stride, 4);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, stride, 8);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 1, gl.FLOAT, false, stride, 12);
  gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 1, gl.FLOAT, false, stride, 16);
  gl.enableVertexAttribArray(5); gl.vertexAttribPointer(5, 1, gl.FLOAT, false, stride, 20);
  gl.enableVertexAttribArray(6); gl.vertexAttribPointer(6, 1, gl.FLOAT, false, stride, 24);
  gl.enableVertexAttribArray(7); gl.vertexAttribPointer(7, 1, gl.FLOAT, false, stride, 28);

  gl.drawArrays(gl.POINTS, 0, ASTEROID_MAIN);
}

function renderBloom() {
  if (!renderState.showBloom) return;
  gl.useProgram(progBloomBlur.program);
  gl.bindBuffer(gl.ARRAY_BUFFER, fsTriVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // 清除所有泛光 FBO（避免垃圾数据）
  for (let i = 0; i < BLOOM_LEVELS; i++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomPingFBOs[i]);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomPongFBOs[i]);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  }

  // 1. 从场景提取亮部 → bloomPingFBOs[0]
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomPingFBOs[0]);
  gl.useProgram(progBloomExtract.program);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(progBloomExtract.uniforms.uScene, 0);
  gl.uniform1f(progBloomExtract.uniforms.uThreshold, 1.25);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 2. 逐级降采样 + 高斯模糊（ping-pong）
  gl.useProgram(progBloomBlur.program);
  for (let i = 0; i < BLOOM_LEVELS - 1; i++) {
    const texw = Math.max(1, Math.floor(width >> (i+1)));
    const texh = Math.max(1, Math.floor(height >> (i+1)));

    // 水平模糊：读 ping[i] → 写 pong[i+1]
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomPongFBOs[i + 1]);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomPingTexs[i]);
    gl.uniform1i(progBloomBlur.uniforms.uTex, 0);
    gl.uniform2f(progBloomBlur.uniforms.uDir, 1/texw, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // 垂直模糊：读 pong[i+1] → 写 ping[i+1]
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomPingFBOs[i + 1]);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomPongTexs[i + 1]);
    gl.uniform2f(progBloomBlur.uniforms.uDir, 0, 1/texh);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}

function composite() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(progPost.program);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(progPost.uniforms.uScene, 0);
  // 绑定泛光纹理到纹理单元 1
  gl.activeTexture(gl.TEXTURE1);
  if (bloomPingTexs.length > 0) {
    gl.bindTexture(gl.TEXTURE_2D, bloomPingTexs[bloomPingTexs.length - 1]);
  }
  gl.uniform1i(progPost.uniforms.uBloomTex, 1);
  gl.uniform1f(progPost.uniforms.uBloom, renderState.showBloom ? 1.0 : 0.0);
  gl.uniform2f(progPost.uniforms.uResolution, width, height);
  gl.bindBuffer(gl.ARRAY_BUFFER, fsTriVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 镜头眩光
  if (renderState.showBloom) {
    // 计算太阳屏幕位置
    const sunClip = transformPoint([0, 0, 0], camera.viewProjMatrix);
    if (sunClip[3] > 0) {
      const sunNdc = [sunClip[0] / sunClip[3], sunClip[1] / sunClip[3]];
      const sunScreen = [(sunNdc[0] * 0.5 + 0.5), (-sunNdc[1] * 0.5 + 0.5)];

      // 可见度：太阳在屏幕内且未被行星遮挡
      let visibility = 1.0;
      if (sunScreen[0] < 0 || sunScreen[0] > 1 || sunScreen[1] < 0 || sunScreen[1] > 1) {
        visibility = 0.0;
      }

      // 检查行星遮挡
      if (visibility > 0) {
        for (const name of planetNames) {
          const pClip = transformPoint(compressPosition(bodyPositions[name]), camera.viewProjMatrix);
          if (pClip[3] <= 0) continue;
          const pNdc = [pClip[0] / pClip[3], pClip[1] / pClip[3]];
          const pScreen = [(pNdc[0] * 0.5 + 0.5), (-pNdc[1] * 0.5 + 0.5)];
          const pRadius = displayRadius(name) / (width * 0.5) * camera.distance / V.len(V.sub(camera.position, compressPosition(bodyPositions[name])));
          const dist = Math.hypot(sunScreen[0] - pScreen[0], sunScreen[1] - pScreen[1]);
          if (dist < pRadius && pClip[3] > 0) {
            visibility *= 0.1; // 被遮挡
          }
        }
      }

      if (visibility > 0.01) {
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
        gl.useProgram(progFlare.program);
        gl.uniform2f(progFlare.uniforms.uSunScreen, sunScreen[0], sunScreen[1]);
        gl.uniform1f(progFlare.uniforms.uVisibility, visibility * 0.5);
        gl.uniform2f(progFlare.uniforms.uResolution, width, height);
        gl.bindBuffer(gl.ARRAY_BUFFER, fsTriVBO);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.disable(gl.BLEND);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
//  主渲染循环
// ═══════════════════════════════════════════════════════════════
let lastTime = performance.now();

function render() {
  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  if (!paused) {
    timeAccum = speedToDaysPerSec(simSpeed) * dt;
    simJD += timeAccum;
  } else {
    timeAccum = 0;
  }

  const target = renderState.realDist ? 1.0 : 0.0;
  if (Math.abs(renderState.compressAnim - target) > 0.001) {
    renderState.compressAnim += (target - renderState.compressAnim) * Math.min(1, dt / 0.4);
    COMPRESS = 0.62 + renderState.compressAnim * 0.38;
  }

  computeBodyPositions();
  updateCamera();

  const aspect = width / height;
  // 动态近远平面
  const camToTarget = V.len(V.sub(camera.position, camera.target));
  camera.near = Math.max(0.012, camToTarget * 0.0035);
  camera.far = Math.max(camToTarget * 14, 4200);
  M.perspective(camera.projMatrix, camera.fov, aspect, camera.near, camera.far);
  M.mul(camera.viewProjMatrix, camera.projMatrix, camera.viewMatrix);
  M.invert(camera.invProjMatrix, camera.viewProjMatrix);

  // Pass 1: HDR 场景
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
  gl.viewport(0, 0, width, height);
  gl.clearColor(0, 0, 0, 1);
  gl.depthMask(true); // ★ 坑 7.1
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // Pass 1: 背景（深度测试关、深度写关）
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
  renderBackground();

  // Pass 2: 恒星（深度测试关、加法混合）
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  renderStars();
  gl.disable(gl.BLEND);

  // Pass 3-4: 太阳 + 行星（深度测试开、深度写开、背面剔除）
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  for (const name of planetNames) {
    const pos = bodyPositions[name];
    const rAU = V.len(pos);
    const intensity = Math.max(0.26, Math.min(2.1, 1.5 * Math.pow(1/Math.max(rAU, 0.1), 0.4)));
    const toSun = V.normalize(V.scale(pos, -1));
    renderSphere(progSphere, name, toSun, intensity);
  }

  // 太阳
  gl.disable(gl.CULL_FACE);
  renderSphere(progSun, 'sun', [0,0,0], 1.0);

  // 地球大气层
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.CULL_FACE);
  renderEarthAtmosphere();
  gl.enable(gl.CULL_FACE);
  gl.disable(gl.BLEND);

  // 卫星
  renderMoons();

  // 土星环
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.CULL_FACE);
  renderSaturnRings();
  gl.enable(gl.CULL_FACE);
  gl.disable(gl.BLEND);

  // 彗星
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  renderComet();
  gl.disable(gl.BLEND);

  // Pass 5: 轨道缎带（深度测试开、深度写关、加法混合）
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  for (const name of planetNames) {
    renderOrbit(name);
  }
  gl.disable(gl.BLEND);

  // Pass 6: 小行星带（深度测试开、深度写关、加法混合）
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  renderAsteroids();
  gl.disable(gl.BLEND);

  gl.depthMask(true); // 恢复深度写入

  // Pass 2: 泛光
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
  renderBloom();

  // Pass 3: 合成
  composite();

  updateUI();
  requestAnimationFrame(render);
}

// ═══════════════════════════════════════════════════════════════
//  UI
// ═══════════════════════════════════════════════════════════════
const labelsDiv = document.getElementById('labels');
const dateTimeDiv = document.getElementById('dateTime');
const speedLabel = document.getElementById('speedLabel');
const outOfRangeDiv = document.getElementById('outOfRange');

function updateUI() {
  dateTimeDiv.textContent = jdToDateStr(simJD);
  const dps = speedToDaysPerSec(simSpeed);
  if (Math.abs(dps) < 1/3600) speedLabel.textContent = '实时';
  else if (Math.abs(dps) < 1) speedLabel.textContent = (dps * 3600).toFixed(1) + ' 时/秒';
  else if (Math.abs(dps) < 365) speedLabel.textContent = dps.toFixed(1) + ' 天/秒';
  else speedLabel.textContent = (dps / 365.25).toFixed(1) + ' 年/秒';

  const year = (simJD - 2451545.0) / 365.25 + 2000;
  outOfRangeDiv.style.display = (year < 1800 || year > 2050) ? 'block' : 'none';
  updateLabels();
}

function transformPoint(p, m) {
  return [
    m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],
    m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],
    m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14],
    m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15]
  ];
}

function updateLabels() {
  if (!renderState.showNames) { labelsDiv.innerHTML = ''; return; }
  let html = '';
  for (const name of planetNames) {
    const pos = compressPosition(bodyPositions[name]);
    const clip = transformPoint(pos, camera.viewProjMatrix);
    if (clip[3] <= 0) continue;
    const ndc = [clip[0]/clip[3], clip[1]/clip[3]];
    const sx = (ndc[0] * 0.5 + 0.5) * window.innerWidth;
    const sy = (-ndc[1] * 0.5 + 0.5) * window.innerHeight;
    if (sx < -50 || sx > window.innerWidth + 50 || sy < -50 || sy > window.innerHeight + 50) continue;
    const alpha = Math.min(1, displayRadius(name) * 0.5);
    html += `<div class="label" style="left:${sx}px;top:${sy}px;opacity:${alpha}">${CN_NAMES[name]}</div>`  ;
  }
  labelsDiv.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
//  交互
// ═══════════════════════════════════════════════════════════════
let isDragging = false, lastMouse = [0, 0];

glCanvas.addEventListener('mousedown', e => { isDragging = true; lastMouse = [e.clientX, e.clientY]; });
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastMouse[0], dy = e.clientY - lastMouse[1];
  lastMouse = [e.clientX, e.clientY];
  camera.yawGoal -= dx * 0.005;
  camera.pitchGoal += dy * 0.005;
  camera.pitchGoal = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, camera.pitchGoal));
});

glCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  camera.distanceGoal *= 1 + e.deltaY * 0.001;
  camera.distanceGoal = Math.max(2, Math.min(500, camera.distanceGoal));
}, { passive: false });

glCanvas.addEventListener('click', e => {
  const rect = glCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width * 2 - 1;
  const my = -((e.clientY - rect.top) / rect.height * 2 - 1);
  let bestDist = 0.04, bestName = null;
  for (const name of planetNames) {
    const pos = compressPosition(bodyPositions[name]);
    const clip = transformPoint(pos, camera.viewProjMatrix);
    if (clip[3] <= 0) continue;
    const ndc = [clip[0]/clip[3], clip[1]/clip[3]];
    const dist = Math.hypot(ndc[0] - mx, ndc[1] - my);
    if (dist < bestDist) { bestDist = dist; bestName = name; }
  }
  if (bestName) focusOn(bestName);
});

function focusOn(name) {
  renderState.selectedBody = name;
  const pos = compressPosition(bodyPositions[name]);
  camera.targetGoal = pos;
  const r = displayRadius(name);
  camera.distanceGoal = Math.max(r * 4, 5);
  updateInfoCard(name);
}

const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', () => {
  paused = !paused;
  playBtn.textContent = paused ? '▶ 播放' : '⏸ 暂停';
});

document.getElementById('nowBtn').addEventListener('click', () => { simJD = getJDNow(); });

const speedSlider = document.getElementById('speedSlider');
speedSlider.addEventListener('input', e => { simSpeed = parseFloat(e.target.value); });

document.getElementById('tOrbits').addEventListener('change', e => renderState.showOrbits = e.target.checked);
document.getElementById('tNames').addEventListener('change', e => renderState.showNames = e.target.checked);
document.getElementById('tMoons').addEventListener('change', e => renderState.showMoons = e.target.checked);
document.getElementById('tAsteroids').addEventListener('change', e => renderState.showAsteroids = e.target.checked);
document.getElementById('tComet').addEventListener('change', e => renderState.showComet = e.target.checked);
document.getElementById('tBloom').addEventListener('change', e => { renderState.showBloom = e.target.checked; });
document.getElementById('tRealDist').addEventListener('change', e => { renderState.realDist = e.target.checked; });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  if (e.code === 'ArrowLeft') { speedSlider.value = Math.max(-100, simSpeed - 5); simSpeed = parseFloat(speedSlider.value); }
  if (e.code === 'ArrowRight') { speedSlider.value = Math.min(100, simSpeed + 5); simSpeed = parseFloat(speedSlider.value); }
  if (e.code === 'KeyH') {
    const hidden = document.getElementById('bodyList').style.display === 'none';
    document.getElementById('bodyList').style.display = hidden ? 'block' : 'none';
    document.getElementById('infoCard').style.display = hidden ? 'block' : 'none';
    document.getElementById('controls').style.display = hidden ? 'flex' : 'none';
    document.getElementById('toggles').style.display = hidden ? 'flex' : 'none';
  }
});

function eclipticLonLat(pos) {
  // 世界坐标 → 黄道坐标
  const ecl = [pos[0], -pos[2], pos[1]];
  const r = V.len(ecl);
  if (r < 1e-10) return { lon: 0, lat: 0 };
  const lon = Math.atan2(ecl[1], ecl[0]) * 180 / Math.PI;
  const lat = Math.asin(ecl[2] / r) * 180 / Math.PI;
  return { lon: (lon + 360) % 360, lat };
}

function updateInfoCard(name) {
  const card = document.getElementById('infoCard');
  const pos = bodyPositions[name];
  const rAU = V.len(pos);
  const vAU = orbitalVelocity(rAU, ORBITAL_ELEMENTS[name]?.a || rAU);
  const elem = ORBITAL_ELEMENTS[name];
  const { lon, lat } = eclipticLonLat(pos);
  const lightTime = rAU * 499.0; // 光行时（秒）

  let lightTimeStr;
  if (lightTime < 60) lightTimeStr = lightTime.toFixed(1) + ' 秒';
  else if (lightTime < 3600) lightTimeStr = (lightTime / 60).toFixed(1) + ' 分钟';
  else lightTimeStr = (lightTime / 3600).toFixed(2) + ' 小时';

  const perihelion = elem ? (elem.a * (1 - elem.e)).toFixed(4) : '—';
  const aphelion = elem ? (elem.a * (1 + elem.e)).toFixed(4) : '—';
  const inclination = elem ? elem.I.toFixed(2) + '°' : '—';
  const eccentricity = elem ? elem.e.toFixed(6) : '—';

  card.innerHTML = `
    <div class="name">${CN_NAMES[name]}</div>
    <div class="subtitle">${name.charAt(0).toUpperCase() + name.slice(1)}</div>
    <div class="divider"></div>
    <div class="row"><span class="label">日心距离</span><span class="val">${rAU.toFixed(4)} AU</span></div>
    <div class="row"><span class="label">日心黄经</span><span class="val">${lon.toFixed(2)}°</span></div>
    <div class="row"><span class="label">日心黄纬</span><span class="val">${lat.toFixed(2)}°</span></div>
    <div class="row"><span class="label">轨道速度</span><span class="val">${vAU.toFixed(2)} km/s</span></div>
    <div class="row"><span class="label">光行时</span><span class="val">${lightTimeStr}</span></div>
    <div class="divider"></div>
    <div class="row"><span class="label">近日点</span><span class="val">${perihelion} AU</span></div>
    <div class="row"><span class="label">远日点</span><span class="val">${aphelion} AU</span></div>
    <div class="row"><span class="label">偏心率</span><span class="val">${eccentricity}</span></div>
    <div class="row"><span class="label">轨道倾角</span><span class="val">${inclination}</span></div>
    <div class="divider"></div>
    <div class="desc">${CN_DESC[name] || ''}</div>
  `;
}

function buildBodyList() {
  const list = document.getElementById('bodyList');
  let html = '<h3>天体</h3>';
  html += `<div class="body-item ${renderState.selectedBody==='sun'?'active':''}" data-name="sun">
    <span class="body-dot" style="background:#ffcc44"></span>太阳</div>`;
  for (const name of planetNames) {
    html += `<div class="body-item ${renderState.selectedBody===name?'active':''}" data-name="${name}">
      <span class="body-dot" style="background:#aaa"></span>${CN_NAMES[name]}</div>`;
  }
  list.innerHTML = html;
  list.querySelectorAll('.body-item').forEach(item => {
    item.addEventListener('click', () => {
      focusOn(item.dataset.name);
      list.querySelectorAll('.body-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
    });
  });
}
