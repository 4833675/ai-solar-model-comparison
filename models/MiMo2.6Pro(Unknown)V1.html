/* ============================================================
   VISUAL SCALE MAP
   Real AU spacing is unreadable; we warp radius & sizes with
   power laws so outer planets remain reachable while order,
   eccentricity and inclination stay honest.
   ============================================================ */
const AU = 50;                       // display units per 1 AU at compression factor 1
const R_EXP = 0.55;                  // r_display ∝ r_AU^R_EXP
const SIZE_BASE = 2.4;               // planet visual scale
const SIZE_EXP = 0.42;               // radiusKm^SIZE_EXP
const SUN_SIZE = 11;

function orbitRadius(aAU){ return AU * Math.pow(Math.max(aAU, 1e-6), R_EXP); }
function bodyRadius(radiusKm, isSun=false){
  if (isSun) return SUN_SIZE;
  return Math.max(0.22, SIZE_BASE * Math.pow(radiusKm / 6371, SIZE_EXP));
}
function moonRadius(radiusKm){
  return Math.max(0.08, 0.55 * Math.pow(radiusKm / 1737.4, SIZE_EXP));
}
function moonSemi(aAU, parentKm){
  // keep moons visually around their planet
  const pr = bodyRadius(parentKm);
  return pr * (1.8 + aAU * 28);
}

/* ============================================================
   KEPLERIAN PROPAGATION
   M = L - w - Om  (mean anomaly)
   Solve Kepler M = E - e sin E, then true anomaly → perifocal
   → ecliptic via classical rotations.
   ============================================================ */
function solveKepler(M, e){
  M = ((M + Math.PI) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI) - Math.PI;
  let E = e < 0.8 ? M : Math.PI;
  for (let k = 0; k < 12; k++){
    const f = E - e * Math.sin(E) - M;
    const fp = 1 - e * Math.cos(E);
    const d = f / fp;
    E -= d;
    if (Math.abs(d) < 1e-10) break;
  }
  return E;
}

function trueAnomaly(E, e){
  return 2 * Math.atan2(Math.sqrt(1+e)*Math.sin(E/2), Math.sqrt(1-e)*Math.cos(E/2));
}

/** Returns THREE.Vector3 in ecliptic frame, already distance-warped. */
function bodyPosition(orb, daysSinceJ2000, out = new THREE.Vector3()){
  const n = 360 / orb.period; // mean motion deg/day
  const L = orb.L + n * daysSinceJ2000;
  const Mdeg = L - orb.w - orb.Om;
  const M = Mdeg * DEG;
  const e = orb.e;
  const E = solveKepler(M, e);
  const nu = trueAnomaly(E, e);
  const a = orb.a;
  const r = a * (1 - e * Math.cos(E)); // AU

  // perifocal
  const cosw = Math.cos(orb.w * DEG), sinw = Math.sin(orb.w * DEG);
  const cosO = Math.cos(orb.Om * DEG), sinO = Math.sin(orb.Om * DEG);
  const cosi = Math.cos(orb.i * DEG), sini = Math.sin(orb.i * DEG);
  const cosN = Math.cos(nu), sinN = Math.sin(nu);

  // ecliptic (AU)
  const x = (cosO*cosw - sinO*sinw*cosi) * cosN
          + (-cosO*sinw - sinO*cosw*cosi) * sinN;
  const y = (sinO*cosw + cosO*sinw*cosi) * cosN
          + (-sinO*sinw + cosO*cosw*cosi) * sinN;
  const z = (sinw*sini) * cosN + (cosw*sini) * sinN;

  // warp radial distance only (keep direction)
  const rAU = Math.hypot(x,y,z) || 1;
  const scale = orbitRadius(r) / rAU;
  out.set(x * scale, z * scale, -y * scale); // Three.js Y-up: map ecliptic → XZ
  return out;
}

function moonPosition(moon, parentPos, days, out = new THREE.Vector3()){
  const n = 360 / moon.period;
  const L = (moon.L0 + n * days) * DEG;
  const e = moon.e;
  const E = solveKepler(L, e);
  const nu = trueAnomaly(E, e);
  const rm = moonSemi(moon.aAU, parentById(moon.parent).radiusKm);
  const r = rm * (1 - e * Math.cos(E));
  const w = moon.w * DEG;
  const cosw = Math.cos(w), sinw = Math.sin(w);
  const cosi = Math.cos(moon.i * DEG), sini = Math.sin(moon.i * DEG);
  const cosN = Math.cos(nu), sinN = Math.sin(nu);
  // perifocal → inclined plane
  const px = r * cosN;
  const py = r * sinN;
  const rx = px * cosw - py * sinw * cosi;
  const ry = px * sinw + py * cosw * cosi;
  const rz = py * sini;
  out.copy(parentPos);
  out.x += rx;
  out.y += rz;
  out.z += ry;
  return out;
}

function parentById(id){ return BODIES.find(b => b.id === id); }

function meanAnomalyNow(orb, days){
  const n = 360 / orb.period;
  return (orb.L + n * days - orb.w - orb.Om) * DEG;
}

/* ============================================================
   DATE UTILITIES
   ============================================================ */
function jdToDate(jd){
  // Fliegel / Van Flandern
  const a = jd + 0.5;
  const z = Math.floor(a);
  let f = a - z;
  let A = z;
  if (z >= 2299161){
    const alpha = Math.floor((z - 1867216.25) / 36524.25);
    A = z + 1 + alpha - Math.floor(alpha / 4);
  }
  const B = A + 1524;
  const C = Math.floor((B - 122.1) / 365.25);
  const D = Math.floor(365.25 * C);
  const E = Math.floor((B - D) / 30.6001);
  const dayF = B - D - Math.floor(30.6001 * E) + f;
  const day = Math.floor(dayF);
  const month = E < 14 ? E - 1 : E - 13;
  const year = month > 2 ? C - 4716 : C - 4715;
  const frac = dayF - day;
  const hours = frac * 24;
  const h = Math.floor(hours);
  const m = Math.floor((hours - h) * 60);
  const s = Math.floor(((hours - h) * 60 - m) * 60);
  return { year, month, day, h, m, s };
}
function dateToJD(y, mo, d, h=0, mi=0, s=0){
  if (mo <= 2){ y -= 1; mo += 12; }
  const A = Math.floor(y/100);
  const B = 2 - A + Math.floor(A/4);
  const dayF = d + (h + mi/60 + s/3600)/24;
  return Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(mo+1)) + dayF + B - 1524.5;
}
function fmtDate(dt){
  const p = n => String(n).padStart(2,'0');
  return `${dt.year}-${p(dt.month)}-${p(dt.day)} ${p(dt.h)}:${p(dt.m)}:${p(dt.s)}`;
}

/* ============================================================
   PROCEDURAL TEXTURES (canvas) — self-contained
   ============================================================ */
function makeCanvas(w,h){
  const c = document.createElement('canvas');
  c.width=w; c.height=h;
  return c;
}
function noise2(x,y,s){
  // cheap hash noise
  const n = Math.sin(x*127.1 + y*311.7 + s*74.7) * 43758.5453;
  return n - Math.floor(n);
}
function fbm(x,y,oct=5,s=0){
  let v=0, a=0.5, f=1;
  for(let i=0;i<oct;i++){
    v += a * (noise2(x*f, y*f, s) * 2 - 1);
    f *= 2; a *= 0.5;
  }
  return v;
}

function paintSphereFallback(ctx, w, h, base, opts={}){
  ctx.fillStyle = base;
  ctx.fillRect(0,0,w,h);
}

function textureEarth(){
  const w=1024,h=512, c=makeCanvas(w,h), ctx=c.getContext('2d');
  // ocean
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0a2a55'); g.addColorStop(.45,'#0d4f8c'); g.addColorStop(.7,'#0a3a6a'); g.addColorStop(1,'#0c2d52');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  // continents via value noise threshold
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const nx=x/w, ny=y/h;
      let v = fbm(nx*6, ny*6, 6, 11) * 0.6 + fbm(nx*14, ny*14, 4, 3)*0.25;
      // polar fade
      const polar = Math.abs(ny-0.5)*2;
      v -= polar*0.35;
      if (v > 0.05){
        const elev = Math.min(1, (v-0.05)*1.4);
        const r=40+elev*50, gg=90+elev*70, b=40+elev*20;
        // desert vs forest by latitude
        const lat = Math.abs(ny-0.5)*2;
        const r2 = Math.min(255, r + lat*70);
        const g2 = Math.min(255, gg - lat*30);
        ctx.fillStyle=`rgb(${r2|0},${g2|0},${b|0})`;
        ctx.fillRect(x,y,1,1);
        if (elev>0.72 && noise2(x,y,7)>0.55){
          ctx.fillStyle='#e8eefc';
          ctx.fillRect(x,y,1,1);
        }
      }
    }
  }
  // ice caps
  const iceTop=ctx.createLinearGradient(0,0,0,h*0.08);
  iceTop.addColorStop(0,'#f2f7ff'); iceTop.addColorStop(1,'rgba(242,247,255,0)');
  ctx.fillStyle=iceTop; ctx.fillRect(0,0,w,h*0.1);
  const iceBot=ctx.createLinearGradient(0,h*0.9,0,h);
  iceBot.addColorStop(0,'rgba(242,247,255,0)'); iceBot.addColorStop(1,'#f2f7ff');
  ctx.fillStyle=iceBot; ctx.fillRect(0,h*0.88,w,h*0.12);
  return new THREE.CanvasTexture(c);
}

function textureClouds(){
  const w=512,h=256, c=makeCanvas(w,h), ctx=c.getContext('2d');
  const img=ctx.createImageData(w,h);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const nx=x/w, ny=y/h;
      let v = fbm(nx*5, ny*8, 5, 21);
      // band-ish
      v += 0.15*Math.sin(ny*Math.PI*6);
      const a = Math.max(0, Math.min(1, (v-0.05)*2));
      const i=(y*w+x)*4;
      img.data[i]=240; img.data[i+1]=245; img.data[i+2]=255;
      img.data[i+3]=a*180;
    }
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.needsUpdate=true; return t;
}

function textureMercury(){
  const w=512,h=256,c=makeCanvas(w,h),ctx=c.getContext('2d');
  ctx.fillStyle='#8a8680'; ctx.fillRect(0,0,w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*8,y/h*8,5,31);
    const v=140+n*40;
    ctx.fillStyle=`rgb(${v|0},${(v-4)|0},${(v-10)|0})`;
    ctx.fillRect(x,y,1,1);
  }
  // craters
  for(let i=0;i<90;i++){
    const x=Math.random()*w, y=Math.random()*h, r=2+Math.random()*10;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle='rgba(40,35,30,0.35)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba(200,195,185,0.15)'; ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

function textureVenus(){
  const w=512,h=256,c=makeCanvas(w,h),ctx=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const v=fbm(x/w*4 + y/h*2, y/h*6, 5, 41);
    const swirl = 0.5+0.5*Math.sin(y/h*18 + v*4);
    const r=210+swirl*30, g=170+swirl*40, b=90+swirl*30;
    ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
    ctx.fillRect(x,y,1,1);
  }
  return new THREE.CanvasTexture(c);
}

function textureMars(){
  const w=512,h=256,c=makeCanvas(w,h),ctx=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*6,y/h*6,5,51);
    const r=150+n*50, g=60+n*25, b=30+n*15;
    ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
    ctx.fillRect(x,y,1,1);
  }
  // polar caps
  const p1=ctx.createLinearGradient(0,0,0,18);
  p1.addColorStop(0,'#eef4f8'); p1.addColorStop(1,'rgba(238,244,248,0)');
  ctx.fillStyle=p1; ctx.fillRect(0,0,w,20);
  const p2=ctx.createLinearGradient(0,h-18,0,h);
  p2.addColorStop(0,'rgba(238,244,248,0)'); p2.addColorStop(1,'#eef4f8');
  ctx.fillStyle=p2; ctx.fillRect(0,h-20,w,20);
  // olympus
  ctx.beginPath(); ctx.arc(w*0.3,h*0.4,8,0,Math.PI*2); ctx.fillStyle='rgba(80,30,15,0.5)'; ctx.fill();
  return new THREE.CanvasTexture(c);
}

function textureBands(base, bandColors, seed){
  const w=1024,h=512,c=makeCanvas(w,h),ctx=c.getContext('2d');
  ctx.fillStyle=base; ctx.fillRect(0,0,w,h);
  for(let y=0;y<h;y++){
    const t=y/h;
    // turbulent bands
    const n = fbm(t*20, 3, 4, seed);
    const band = Math.sin(t * Math.PI * bandColors.length * 2 + n*2);
    const idx = Math.floor(((band+1)/2) * (bandColors.length-0.001));
    const col = bandColors[Math.max(0, Math.min(bandColors.length-1, idx))];
    ctx.fillStyle=col;
    ctx.fillRect(0,y,w,1);
  }
  // storm ovals
  if (seed===70){
    for(let i=0;i<5;i++){
      const x=Math.random()*w, y=h*(0.35+Math.random()*0.3);
      ctx.beginPath();
      ctx.ellipse(x,y,18+Math.random()*22,8+Math.random()*10,0,0,Math.PI*2);
      ctx.fillStyle='rgba(180,80,50,0.45)'; ctx.fill();
    }
    // Great Red Spot
    ctx.beginPath();
    ctx.ellipse(w*0.62, h*0.42, 36, 16, 0, 0, Math.PI*2);
    ctx.fillStyle='rgba(200,90,55,0.65)'; ctx.fill();
  }
  if (seed===80){
    // saturn mild
  }
  return new THREE.CanvasTexture(c);
}

function textureUranus(){
  const w=512,h=256,c=makeCanvas(w,h),ctx=c.getContext('2d');
  for(let y=0;y<h;y++){
    const t=y/h;
    const n=fbm(t*10, 1, 3, 90);
    const r=140+n*10, g=210+n*15, b=220+n*20;
    ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
    ctx.fillRect(0,y,w,1);
  }
  return new THREE.CanvasTexture(c);
}

function textureNeptune(){
  const w=512,h=256,c=makeCanvas(w,h),ctx=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*5,y/h*7,4,95);
    const r=40+n*20, g=60+n*30, b=160+n*50;
    ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
    ctx.fillRect(x,y,1,1);
  }
  // dark spot
  ctx.beginPath(); ctx.ellipse(w*0.4,h*0.45,20,10,0.3,0,Math.PI*2);
  ctx.fillStyle='rgba(10,15,40,0.45)'; ctx.fill();
  return new THREE.CanvasTexture(c);
}

function textureMoonRock(base, seed){
  const w=256,h=128,c=makeCanvas(w,h),ctx=c.getContext('2d');
  ctx.fillStyle=base; ctx.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){
    const x=Math.random()*w,y=Math.random()*h,r=1.5+Math.random()*6;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}

function textureSun(){
  const w=512,h=256,c=makeCanvas(w,h),ctx=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*10,y/h*10,5,101);
    const n2=fbm(x/w*25,y/h*25,3,102);
    const v=0.5+0.5*(n*0.7+n2*0.3);
    const r=255, g=180+v*70, b=60+v*80;
    ctx.fillStyle=`rgb(${r|0},${Math.min(255,g)|0},${Math.min(255,b)|0})`;
    ctx.fillRect(x,y,1,1);
  }
  return new THREE.CanvasTexture(c);
}

function textureRing(inner, outer, style){
  const w=1024,h=64,c=makeCanvas(w,h),ctx=c.getContext('2d');
  ctx.clearRect(0,0,w,h);
  for(let x=0;x<w;x++){
    const t=x/w;
    let a=0.85;
    let rgb=[220,200,160];
    if (style==='saturn'){
      // Cassini division ~0.62, secondary gaps
      if (t>0.58 && t<0.66) a*=0.15;
      if (t>0.35 && t<0.38) a*=0.45;
      if (t<0.05) a*=t/0.05;
      if (t>0.95) a*=(1-t)/0.05;
      const wob = 0.85+0.15*Math.sin(t*40);
      rgb=[220*wob, 205*wob, 175*wob];
    }
    ctx.fillStyle=`rgba(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0},${a})`;
    ctx.fillRect(x,0,1,h);
  }
  return new THREE.CanvasTexture(c);
}

function buildStars(){
  const N=9000;
  const pos=new Float32Array(N*3);
  const col=new Float32Array(N*3);
  const sz=new Float32Array(N);
  const palette=[new THREE.Color(0xffffff), new THREE.Color(0xb8d0ff), new THREE.Color(0xffd2a0), new THREE.Color(0xffa0c0)];
  for(let i=0;i<N;i++){
    const r = 2500 + Math.random()*3500;
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph);
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    const c=palette[(Math.random()*palette.length)|0];
    const b=0.55+Math.random()*0.45;
    col[i*3]=c.r*b; col[i*3+1]=c.g*b; col[i*3+2]=c.b*b;
    sz[i]=0.6+Math.random()*2.4;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.setAttribute('size', new THREE.BufferAttribute(sz,1));
  const m=new THREE.PointsMaterial({
    size: 1.8, sizeAttenuation:true, vertexColors:true,

  });
  const pts=new THREE.Points(g,m);

  // nebula puffs
  for(let i=0;i<6;i++){
    const tex=makeNebulaTex(['rgba(60,80,180,0.18)','rgba(120,40,140,0.12)','rgba(20,90,120,0.14)'][i%3]);
    const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
    const r=3000+Math.random()*2000;

    spr.position.set(r*Math.sin(ph)*Math.cos(th), r*Math.cos(ph)*0.4, r*Math.sin(ph)*Math.sin(th));

    spr.scale.set(s,s,1);
    scene.add(spr);
  }
}

function buildPlanetTexture(body){
  switch(body.id){
    case 'earth': return textureEarth();

function createBody(body){
  const R = bodyRadius(body.radiusKm, body.id==='sun');
  const group = new THREE.Group();
  scene.add(group);

  let mesh;
  if (body.id === 'sun'){
    mesh = sunMesh; // already added to sunGroup; we'll track separately
    // label on sun
    const lab = makeLabel(body.name, 'label');
    lab.position.set(0, R*1.3, 0);
    sunGroup.add(lab);
    meshes['sun'] = {
      id:'sun', body, group:sunGroup, mesh:sunMesh, radius:R,
      label:lab, atmo:null, cloud:null, trail:null, ang:0
    };
    return meshes['sun'];
  }

  const tex = buildPlanetTexture(body);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const mat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.92, metalness: 0.02
  });
  mesh = new THREE.Mesh(new THREE.SphereGeometry(R, 48, 32), mat);
  mesh.rotation.z = body.tilt * DEG;
  group.add(mesh);

  // atmosphere rim for thick-atmosphere planets
  if (['earth','venus','neptune','uranus','mars','jupiter','saturn'].includes(body.id)){
    const atmoCol = {
      earth:0x6eb6ff, venus:0xffe0a0, mars:0xff8866,
      jupiter:0xffd0a0, saturn:0xffe8b8, uranus:0x9af0ff, neptune:0x7a9cff
    }[body.id] || 0x88bbff;
    const atmoMat = new THREE.ShaderMaterial({
      uniforms:{ c:{value:new THREE.Color(atmoCol)}, p:{value: body.id==='earth'?3.2:2.4}, glow:{value: body.id==='earth'?0.85:0.45} },
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.FrontSide,
      vertexShader:`
        varying vec3 vN; varying vec3 vP;
        void main(){ vN=normalize(normalMatrix*normal);
          vec4 mv=modelViewMatrix*vec4(position,1.0); vP=mv.xyz;
          gl_Position=projectionMatrix*mv; }`,
      fragmentShader:`
        uniform vec3 c; uniform float p; uniform float glow;
        varying vec3 vN; varying vec3 vP;
        void main(){
          vec3 vd=normalize(-vP);
          float f=pow(1.0-abs(dot(normalize(vN),vd)), p);
          gl_FragColor=vec4(c, f*glow);
        }`
    });
    const atmo = new THREE.Mesh(new THREE.SphereGeometry(R*1.03, 32, 24), atmoMat);
    group.add(atmo);
    meshes[body.id] = { id:body.id, body, group, mesh, atmo, cloud:null, radius:R, label:null, trail:null, ang:0 };
  } else {
    meshes[body.id] = { id:body.id, body, group, mesh, atmo:null, cloud:null, radius:R, label:null, trail:null, ang:0 };
  }

  // earth clouds
  if (body.id === 'earth'){
    const cl = new THREE.Mesh(
      new THREE.SphereGeometry(R*1.018, 40, 28),
      new THREE.MeshStandardMaterial({
        map: textureClouds(), transparent:true, opacity:0.75,
        depthWrite:false, roughness:1, metalness:0
      })
    );
    group.add(cl);
    meshes[body.id].cloud = cl;
  }

  // saturn rings
  if (body.rings){
    const inner = R*1.35, outer = R*2.35;
    const geo = new THREE.RingGeometry(inner, outer, 128, 8);
    // fix UVs for radial texture
    const pos = geo.attributes.position;
    const uv = geo.attributes.uv;
    const v3 = new THREE.Vector3();
    for (let i=0;i<pos.count;i++){
      v3.fromBufferAttribute(pos,i);
      const rr = v3.length();
      const t = (rr - inner) / (outer - inner);
      uv.setXY(i, t, 0.5);
    }
    const ringTex = textureRing(inner, outer, 'saturn');
    const ring = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      map: ringTex, side: THREE.DoubleSide, transparent:true,
      depthWrite:false, opacity:0.95
    }));
    // align with equator (tilt applied on mesh)
    ring.rotation.x = Math.PI/2;
    const ringPivot = new THREE.Group();
    ringPivot.rotation.z = body.tilt * DEG;
    ringPivot.add(ring);
    group.add(ringPivot);
    meshes[body.id].rings = ring;
  }

  // label
  const lab = makeLabel(body.name, 'label');
  lab.position.set(0, R*1.6, 0);
  group.add(lab);
  meshes[body.id].label = lab;

  // trail
  const TR = 180;
  const tpos = new Float32Array(TR*3);
  const tgeo = new THREE.BufferGeometry();
  tgeo.setAttribute('position', new THREE.BufferAttribute(tpos,3));
  tgeo.setDrawRange(0,0);
  const tmat = new THREE.LineBasicMaterial({
    color: body.color, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false
  });
  const trail = new THREE.Line(tgeo, tmat);
  trail.visible = false;
  scene.add(trail);
  meshes[body.id].trail = trail;
  meshes[body.id].trailLen = TR;
  meshes[body.id].trailIdx = 0;
  meshes[body.id].trailCount = 0;

  return meshes[body.id];
}

function buildOrbitLine(body){
  if (body.id==='sun') return;
  const N=256;
  const pts=[];
  for(let i=0;i<=N;i++){
    // one full orbit using mean anomaly sweep — place by eccentric anomaly for accurate ellipse
    const M = (i/N)*Math.PI*2;
    const E = solveKepler(M, body.e);
    const nu = trueAnomaly(E, body.e);
    const a = body.a;
    const r = a * (1 - body.e * Math.cos(E));
    const cosw = Math.cos(body.w*DEG), sinw=Math.sin(body.w*DEG);
    const cosO = Math.cos(body.Om*DEG), sinO=Math.sin(body.Om*DEG);
    const cosi = Math.cos(body.i*DEG), sini=Math.sin(body.i*DEG);
    const cosN=Math.cos(nu), sinN=Math.sin(nu);
    const x = (cosO*cosw - sinO*sinw*cosi)*cosN + (-cosO*sinw - sinO*cosw*cosi)*sinN;
    const y = (sinO*cosw + cosO*sinw*cosi)*cosN + (-sinO*sinw + cosO*cosw*cosi)*sinN;
    const z = (sinw*sini)*cosN + (cosw*sini)*sinN;
    const rAU = Math.hypot(x,y,z)||1;
    const scale = orbitRadius(r)/rAU;
    pts.push(new THREE.Vector3(x*scale, z*scale, -y*scale));
  }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  const m=new THREE.LineBasicMaterial({
    color: body.color, transparent:true, opacity:0.35,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const line=new THREE.LineLoop(g,m);
  scene.add(line);
  orbitLines[body.id]=line;
}

BODIES.forEach(createBody);
BODIES.forEach(buildOrbitLine);

// sun orbit (none) but focus helper
focusTargets['sun'] = new THREE.Vector3(0,0,0);

// moons
const moonObjs = MOONS.map(m => {
  const parent = parentById(m.parent);
  const R = moonRadius(m.radiusKm);
  const tex = textureMoonRock(m.hex, m.name.length*7);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(R, 24, 16),
    new THREE.MeshStandardMaterial({ map:tex, roughness:0.95, metalness:0 })
  );
  scene.add(mesh);
  const lab = makeLabel(m.name, 'moon-label');
  lab.position.set(0, R*1.8, 0);
  lab.element.style.opacity = '0.55';
  lab.element.style.fontSize = '9px';
  mesh.add(lab);
  return { ...m, mesh, label:lab, radius:R, parentData:parent };
});

/* ---- Asteroid belt particles ---- */
const beltGroup = new THREE.Group();
scene.add(beltGroup);
{
  const N=2500;
  const pos=new Float32Array(N*3);
  const col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const a = 2.1 + Math.random()*1.4; // AU
    const e = Math.random()*0.15;
    const iInc = (Math.random()-0.5)*15 * DEG;
    const Om = Math.random()*Math.PI*2;
    const M = Math.random()*Math.PI*2;
    const E = solveKepler(M, e);
    const nu = trueAnomaly(E, e);
    const r = a * (1 - e*Math.cos(E));
    const cosw=1, sinw=0, cosO=Math.cos(Om), sinO=Math.sin(Om), cosi=Math.cos(iInc), sini=Math.sin(iInc);
    const cosN=Math.cos(nu), sinN=Math.sin(nu);
    const x = (cosO*cosw - sinO*sinw*cosi)*cosN + (-cosO*sinw - sinO*cosw*cosi)*sinN;
    const y = (sinO*cosw + cosO*sinw*cosi)*cosN + (-sinO*sinw + cosO*cosw*cosi)*sinN;
    const z = (sinw*sini)*cosN + (cosw*sini)*sinN;
    const rAU=Math.hypot(x,y,z)||1;
    const scale=orbitRadius(r)/rAU;
    pos[i*3]=x*scale; pos[i*3+1]=z*scale; pos[i*3+2]=-y*scale;
    const g=0.55+Math.random()*0.3;
    col[i*3]=0.75*g; col[i*3+1]=0.7*g; col[i*3+2]=0.62*g;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({ size:0.35, sizeAttenuation:true, vertexColors:true, transparent:true, opacity:0.75, depthWrite:false });
  beltGroup.add(new THREE.Points(g,m));
}

/* ---- Post-processing ---- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 0.2);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let bloomOn = true;

/* ============================================================
   STATE + UI
   ============================================================ */
const state = {
  playing: true,
  daysPerSec: 20,
  days: 0, // days since J2000
  focus: 'sun',
  toggles: { orbits:true, labels:true, belt:true, trails:false, bloom:true },
  camLerp: 0,
};

const bodyListEl = document.getElementById('bodyList');
const infoName = document.getElementById('infoName');
const infoTag = document.getElementById('infoTag');
const infoKV = document.getElementById('infoKV');
const infoDesc = document.getElementById('infoDesc');
const infoOrb = document.getElementById('infoOrb');
const dateBox = document.getElementById('dateBox');
const speedVal = document.getElementById('speedVal');
const speedInput = document.getElementById('speed');
const btnPlay = document.getElementById('btnPlay');

const extras = [
  { id:'moon', name:'月球', en:'Moon', kind:'moon', color:0xcfcfcf, hex:'#cfcfcf',
    mass:'7.35×10²² kg', temp:'−20 °C 均', moons:0, axialTilt:'6.7°', radiusKm:1737.4,
    desc:'地球唯一天然卫星。潮汐锁定，始终以同一面朝向地球，驱动海洋潮汐。' },
  { id:'belt', name:'小行星带', en:'Asteroid Belt', kind:'belt', color:0xb0a898, hex:'#b0a898',
    mass:'~3×10²¹ kg', temp:'—', moons:0, axialTilt:'—', radiusKm:0,
    desc:'位于火星与木星之间（约 2.1–3.3 AU）的岩石碎块群，总质量远小于月球。' }
];

function allSelectable(){
  return [...BODIES, ...extras];
}

function findAny(id){
  return allSelectable().find(b => b.id === id);
}

function renderBodyList(){
  bodyListEl.innerHTML = '';
  allSelectable().forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'body-btn' + (state.focus===b.id ? ' active' : '');
    btn.innerHTML = `<span class="swatch" style="background:${b.hex};color:${b.hex}"></span>
      <span class="name">${b.name}</span>
      <span class="sub">${b.kind==='moon'?'MOON':b.kind==='belt'?'BELT':b.kind==='star'?'STAR':'PLANET'}</span>`;
    btn.addEventListener('click', () => selectBody(b.id));
    bodyListEl.appendChild(btn);
  });
}

function selectBody(id){
  state.focus = id;
  state.camLerp = 0;
  renderBodyList();
  const b = findAny(id);
  if (!b) return;
  infoName.textContent = b.name;
  infoTag.textContent = b.kind === 'star' ? 'STAR' : b.kind === 'moon' ? 'SATELLITE' : b.kind === 'belt' ? 'REGION' : 'PLANET';
  infoOrb.style.background = b.hex;
  infoOrb.style.color = b.hex;
  const rows = [];
  if (b.kind === 'belt'){
    rows.push(['轨道半径', '2.1 – 3.3 AU'], ['组成', '碳质 / 石质'], ['代表', '谷神星 灶神星']);
  } else if (b.id === 'sun'){
    rows.push(
      ['半径', '696,340 km'],
      ['质量', b.mass],
      ['光谱型', 'G2V'],
      ['表面温度', b.temp],
      ['行星数量', '8'],
      ['自转周期', '25.4 d']
    );
  } else {
    const aAU = b.a !== undefined ? b.a : null;
    if (aAU) rows.push(['半长轴', aAU.toFixed(4) + ' AU']);
    if (b.e !== undefined) rows.push(['离心率', b.e.toFixed(5)]);
    if (b.i !== undefined) rows.push(['倾角', b.i.toFixed(3) + '°']);
    if (b.period) rows.push(['公转周期', b.period >= 1000 ? (b.period/365.25).toFixed(2)+' y' : b.period.toFixed(2)+' d']);
    rows.push(['半径', (b.radiusKm||0).toLocaleString() + ' km']);
    rows.push(['质量', b.mass]);
    rows.push(['轴倾角', b.axialTilt]);
    rows.push(['表面/云顶温', b.temp]);
    rows.push(['卫星', String(b.moons ?? 0)]);
  }
  infoKV.innerHTML = rows.map(([k,v]) => `<div class="k">${k}</div><div class="v">${v}</div>`).join('');
  infoDesc.textContent = b.desc || '';
}

function mapSpeed(v){
  // 0..100 → 0 .. 1200 days/s  (exponential)
  const t = v/100;
  return Math.round(Math.pow(t, 2.2) * 1200 * 10)/10;
}

function syncSpeedLabel(){
  const d = state.daysPerSec;
  speedVal.textContent = d < 1 ? `× ${d.toFixed(2)} 天/秒` : `× ${Math.round(d)} 天/秒`;
}

speedInput.addEventListener('input', () => {
  state.daysPerSec = mapSpeed(+speedInput.value);
  syncSpeedLabel();
});
state.daysPerSec = mapSpeed(+speedInput.value);
syncSpeedLabel();

btnPlay.addEventListener('click', () => {
  state.playing = !state.playing;
  btnPlay.textContent = state.playing ? '⏸ 暂停' : '▶ 播放';
});

document.getElementById('btnNow').addEventListener('click', () => {
  const now = new Date();
  const jd = dateToJD(now.getFullYear(), now.getMonth()+1, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
  state.days = jd - J2000;
});

document.getElementById('btnReset').addEventListener('click', () => {
  selectBody('sun');
  camera.position.set(0, 85, 155);
  controls.target.set(0,0,0);
  controls.update();
});

document.querySelectorAll('[data-tog]').forEach(btn => {
  btn.addEventListener('click', () => {
    const k = btn.dataset.tog;
    state.toggles[k] = !state.toggles[k];
    btn.classList.toggle('on', state.toggles[k]);
    if (k === 'orbits') Object.values(orbitLines).forEach(l => l.visible = state.toggles.orbits);
    if (k === 'labels') {
      Object.values(meshes).forEach(m => { if (m.label) m.label.visible = state.toggles.labels; });
      moonObjs.forEach(m => m.label.visible = state.toggles.labels);
    }
    if (k === 'belt') beltGroup.visible = state.toggles.belt;
    if (k === 'trails') Object.values(meshes).forEach(m => { if (m.trail) m.trail.visible = state.toggles.trails && m.id!=='sun'; });
    if (k === 'bloom') { bloomOn = state.toggles.bloom; bloom.enabled = bloomOn; }

});

// click to select via raycaster
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
canvas.addEventListener('pointerdown', (ev)=>{
  if (ev.button !== 0) return;
  ndc.x = (ev.clientX/innerWidth)*2 - 1;
  ndc.y = -(ev.clientY/innerHeight)*2 + 1;
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(
    Object.values(meshes).map(m => m.mesh).concat(moonObjs.map(m => m.mesh)),
    false
  );
  if (hits.length){
    const obj = hits[0].object;
    for (const m of Object.values(meshes)) if (m.mesh === obj) return selectBody(m.id);
    for (const m of moonObjs) if (m.mesh === obj) return selectBody('moon');
  }
});

/* ============================================================
   SIMULATION
   ============================================================ */
const _v = new THREE.Vector3();
const _target = new THREE.Vector3();
let last = performance.now();

function focusPosition(id, out){
  if (id === 'sun' || id === 'belt') return out.set(0,0,0);
  if (id === 'moon'){
    const mo = moonObjs.find(m => m.name === '月球') || moonObjs[0];
    return out.copy(mo.mesh.position);
  }
  const m = meshes[id];
  if (!m) return out.set(0,0,0);
  return out.copy(m.group.position);
}

function updateFocusCamera(dt){
  focusPosition(state.focus, _target);
  // relative distance based on body size
  let dist = 18;
  if (state.focus === 'sun') dist = 95;
  else if (state.focus === 'belt') dist = 90;
  else {
    const m = meshes[state.focus];
    if (m) dist = Math.max(3.2, m.radius * 7.5);
  }

  // Desired framing offset (world) relative to focus
  const desired = _v.set(dist * 0.25, dist * 0.42, dist * 0.9);

  // Always keep camera glued to the moving focus (translate both target & camera)
  const follow = new THREE.Vector3().subVectors(_target, controls.target);
  const smooth = 1 - Math.pow(0.0008, dt);
  const delta = follow.multiplyScalar(Math.min(1, smooth * 4));
  controls.target.add(delta);
  camera.position.add(delta);

  // Ease camera toward a pleasing framing on first select
  if (state.camLerp < 1){
    state.camLerp = Math.min(1, state.camLerp + dt * 1.4);
    const want = new THREE.Vector3().copy(controls.target).add(desired);
    camera.position.lerp(want, Math.min(1, dt * 2.4));
  }
}

function pushTrail(id, pos){
  const m = meshes[id];
  if (!m || !m.trail) return;
  const arr = m.trail.geometry.attributes.position.array;
  const N = m.trailLen;
  const i = m.trailIdx % N;
  arr[i*3]=pos.x; arr[i*3+1]=pos.y; arr[i*3+2]=pos.z;
  m.trailIdx++;
  m.trailCount = Math.min(N, m.trailCount+1);
  m.trail.geometry.setDrawRange(0, m.trailCount);
  m.trail.geometry.attributes.position.needsUpdate = true;
}

function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (state.playing){
    state.days += state.daysPerSec * dt;
  }

  // sun spin + corona
  meshes['sun'].mesh.rotation.y += dt * 0.02;
  coronaMat.uniforms.uTime.value += dt;
  sunGlow.material.rotation += dt * 0.05;

  // planets
  for (const b of BODIES){
    if (b.id === 'sun') continue;
    const m = meshes[b.id];
    bodyPosition(b, state.days, m.group.position);
    // axial spin (visual)
    const rotDir = b.rotHours >= 0 ? 1 : -1;
    const spin = rotDir * dt * (24 / Math.abs(b.rotHours)) * 0.35;
    m.mesh.rotation.y += spin;
    if (m.cloud) m.cloud.rotation.y += spin * 0.6;
    if (state.toggles.trails) pushTrail(b.id, m.group.position);
  }

  // moons
  for (const mo of moonObjs){
    const parent = meshes[mo.parent];
    moonPosition(mo, parent.group.position, state.days, mo.mesh.position);
  }

  // subtle belt rotation (true for distribution over time)
  beltGroup.rotation.y += dt * 0.002;

  // date + live telemetry
  const jd = J2000 + state.days;
  dateBox.textContent = fmtDate(jdToDate(jd));
  const liveEl = document.getElementById('live');
  if (state.focus === 'sun'){
    liveEl.textContent = '中心天体 · 坐标原点 · G2V 主序星';
  } else if (state.focus === 'belt'){
    liveEl.textContent = `模拟粒子 ${beltGroup.children[0]?.geometry?.attributes?.position?.count || 0} · 区域 2.1–3.3 AU`;
  } else if (state.focus === 'moon'){
    const mo = moonObjs[0];
    const d = mo.mesh.position.distanceTo(meshes['earth'].group.position);
    liveEl.textContent = `地月距 ≈ 384,400 km · 模型距 ${d.toFixed(2)} u`;
  } else {
    const b = findAny(state.focus);
    const m = meshes[state.focus];
    if (b && m && b.a){
      const n = 360 / b.period;
      const Mdeg = b.L + n * state.days - b.w - b.Om;
      const E = solveKepler(Mdeg * DEG, b.e);
      const r = b.a * (1 - b.e * Math.cos(E));
      const v = (2 * Math.PI * b.a / b.period) * Math.sqrt((1 + b.e) / (1 - b.e)); // rough AU/day
      liveEl.textContent = `日心距 ${r.toFixed(4)} AU · 虚近点角 ${((Mdeg%360+360)%360).toFixed(2)}° · ≈${v.toFixed(5)} AU/d`;
    }
  }

  // camera follow
  updateFocusCamera(dt);

  controls.update();
  if (bloomOn) composer.render();
  else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

function resize(){
  const w=innerWidth, h=innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  composer.setSize(w,h);
  labelRenderer.setSize(w,h);
}
addEventListener('resize', resize);

// init
state.days = 0; // J2000 default; jump to "now" for a nicer demo
(function initToNow(){
  const now = new Date();
  const jd = dateToJD(now.getFullYear(), now.getMonth()+1, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
  state.days = jd - J2000;
})();

renderBodyList();
selectBody('sun');
resize();
requestAnimationFrame(tick);

// hide loader
setTimeout(() => {
  document.getElementById('loader').classList.add('hide');
}, 700);

// expose tiny debug hook
window.__helios = { state, BODIES, meshes };
