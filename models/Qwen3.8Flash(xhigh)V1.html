<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太阳系 · 真实轨道运动模型</title>
<style>
  :root{
    --gold:#e8c27a; --cyan:#7ad8e8; --panel:rgba(10,14,26,.62); --line:rgba(232,194,122,.18);
    --text:#e9eefb; --dim:#8fa0c2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#02040a;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;color:var(--text)}
  #app{position:fixed;inset:0}
  canvas{display:block}

  .glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:0 8px 40px rgba(0,0,0,.45)}

  #topbar{position:fixed;top:18px;left:22px;padding:14px 20px;max-width:340px;z-index:10;
    border-left:2px solid var(--gold)}
  #topbar h1{font-size:17px;font-weight:600;letter-spacing:2px;color:var(--gold)}
  #topbar h1 small{font-size:10px;color:var(--dim);letter-spacing:1px;margin-left:8px;font-weight:400}
  #clock{margin-top:8px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.5px}
  #clock b{color:var(--cyan);font-weight:500;font-size:15px}
  #hint{margin-top:8px;font-size:10.5px;color:#5f6f8f;line-height:1.7}

  #planets{position:fixed;top:18px;right:22px;padding:10px;z-index:10;display:flex;flex-direction:column;gap:2px}
  #planets .row{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 9px;border-radius:9px;cursor:pointer;
    font-size:12.5px;letter-spacing:1px;color:var(--dim);transition:all .18s}
  #planets .row:hover{background:rgba(232,194,122,.08);color:var(--text)}
  #planets .row.active{background:rgba(232,194,122,.14);color:var(--gold)}
  #planets .dot{width:9px;height:9px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 8px currentColor}

  #controls{position:fixed;left:22px;bottom:22px;padding:14px 18px;z-index:10;width:340px}
  #controls .lbl{font-size:10px;color:var(--dim);letter-spacing:1.5px;margin-bottom:6px}
  #speedWrap{display:flex;align-items:center;gap:10px}
  #speed{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--gold),#3a4560);outline:none}
  #speed::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 10px rgba(232,194,122,.8);cursor:pointer}
  #speedVal{font-size:11px;color:var(--cyan);min-width:86px;text-align:right;font-variant-numeric:tabular-nums}
  #btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);font-size:11px;
    padding:6px 12px;border-radius:8px;cursor:pointer;letter-spacing:1px;transition:all .18s;font-family:inherit}
  .btn:hover{color:var(--text);border-color:var(--gold)}
  .btn.on{color:#0b0e18;background:var(--gold);border-color:var(--gold)}

  #info{position:fixed;right:22px;bottom:22px;width:330px;padding:18px 20px;z-index:10;display:none;
    border-right:2px solid var(--cyan)}
  #info h2{font-size:16px;color:var(--gold);letter-spacing:2px}
  #info h2 span{font-size:10px;color:var(--dim);letter-spacing:1px;font-weight:400;margin-left:8px}
  #info .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;margin-top:12px}
  #info .k{font-size:10px;color:#5f6f8f;letter-spacing:1px}
  #info .v{font-size:12px;color:var(--text);margin-top:1px;font-variant-numeric:tabular-nums}
  #info p{margin-top:12px;font-size:11.5px;line-height:1.85;color:var(--dim);border-top:1px dashed var(--line);padding-top:10px}

  #labels{position:fixed;inset:0;pointer-events:none;z-index:5}
  .plabel{position:absolute;transform:translate(-50%,-140%);font-size:11px;letter-spacing:2px;color:rgba(233,238,251,.85);
    text-shadow:0 0 8px rgba(0,0,0,.9);white-space:nowrap;transition:opacity .3s}
  .plabel::after{content:"";display:block;width:1px;height:10px;background:linear-gradient(rgba(232,194,122,.7),transparent);margin:3px auto 0}
  .plabel.sel{color:var(--gold);font-weight:600}

  #fade{position:fixed;inset:0;background:#02040a;z-index:50;pointer-events:none;transition:opacity 1.6s ease}
  #err{position:fixed;inset:0;display:none;place-items:center;z-index:60;background:#02040a;color:#7a8db2;font-size:13px;text-align:center;line-height:2}
</style>
</head>

/* ============================================================
   渲染基础
   ============================================================ */
const app = document.getElementById('app');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
} catch(e){ document.getElementById('err').style.display='grid'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 4000);
camera.position.set(0, 70, 150);

const _f=new THREE.Vector3(), _f2=new THREE.Vector3();
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.minDistance = 2; controls.maxDistance = 900;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .55, .5, .8);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const L = (hex) => new THREE.Color(hex).convertSRGBToLinear();

/* ============================================================
   GLSL 公共噪声
   ============================================================ */
const NOISE = `
float hash13(vec3 p){ p=fract(p*.1031); p+=dot(p,p.yzx+33.33); return fract((p.x+p.y)*p.z); }
float vnoise(vec3 x){
  vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  float a=mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y);
  float b=mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y);
  return mix(a,b,f.z);
}
float fbm(vec3 p){ float v=0.,a=.5; for(int i=0;i<5;i++){ v+=a*vnoise(p); p=p*2.07+vec3(1.7); a*=.5; } return v; }
float rid(vec3 p){ return 1.-abs(vnoise(p)*2.-1.); }
`;

/* ---------- 通用行星材质 ---------- */
function planetMaterial(p){
  const u = {
    uTime:{value:0},
    uC1:{value:L(p.c1)}, uC2:{value:L(p.c2)}, uC3:{value:L(p.c3)}, uC4:{value:L(p.c4)},
    uSeed:{value:p.seed||0}, uMode:{value:p.mode||0},
    uLandF:{value:p.landF||0}, uLandTh:{value:p.landTh??.5}, uLandW:{value:p.landW??.1},
    uBandF:{value:p.bandF||0}, uBandT:{value:p.bandT||0},
    uCrater:{value:p.crater||0}, uCap:{value:p.cap||0},
    uNight:{value:p.night||0}, uSpec:{value:p.spec||0},
    uSpot:{value:p.spot||0}, uSpotLat:{value:p.spotLat||0}, uStorm:{value:p.storm||0},
    uIo:{value:p.io||0}, uEuropa:{value:p.europa||0}, uTitan:{value:p.titan||0},
    uAtmo:{value:L(p.atmo||0x000000)}, uAtmoAmt:{value:p.term!=null?p.term:0},
  };
  return new THREE.ShaderMaterial({
    uniforms:u,
    vertexShader:`
      varying vec3 vN; varying vec3 vW; varying vec3 vObj;
      void main(){
        vObj = normalize(position);
        vec4 wp = modelMatrix*vec4(position,1.);
        vW = wp.xyz;
        vN = normalize(mat3(modelMatrix)*normal);
        gl_Position = projectionMatrix*viewMatrix*wp;
      }`,
    fragmentShader:`
      precision highp float;
      ${NOISE}
      uniform float uTime,uSeed,uMode,uLandF,uLandTh,uLandW,uBandF,uBandT,uCrater,uCap,
                    uNight,uSpec,uSpot,uSpotLat,uStorm,uIo,uEuropa,uTitan,uAtmoAmt;
      uniform vec3 uC1,uC2,uC3,uC4,uAtmo;
      varying vec3 vN; varying vec3 vW; varying vec3 vObj;
      vec3 ramp(float t){ t=clamp(t,0.,1.);
        return t<.333 ? mix(uC1,uC2,t*3.) : (t<.666 ? mix(uC2,uC3,(t-.333)*3.) : mix(uC3,uC4,(t-.666)*3.)); }
      float hgt(vec3 n){ return fbm(n*uLandF*2. + uSeed*7.); }
      vec3 bump(vec3 n){
        if(uCrater<.01 && uMode>0.5) return n;
        float e=.045;
        vec3 t1=normalize(cross(n,abs(n.y)<.99?vec3(0,1,0):vec3(1,0,0))), t2=cross(n,t1);
        float h=hgt(n);
        vec3 g=( (hgt(n+t1*e)-h)*t1 + (hgt(n+t2*e)-h)*t2 )/e;
        return normalize(n - g*.4*uCrater);
      }
      void main(){
        vec3 n = normalize(vObj);
        vec3 V = normalize(cameraPosition - vW);
        vec3 Ld = normalize(-vW);                    // 太阳位于原点
        float lam = atan(n.z,n.x), lat = asin(clamp(n.y,-1.,1.));

        // ---- 反照率图案 ----
        vec3 alb; float ocean=0.;
        if(uMode>0.5){                               // 条带（气态/冰巨星）
          float turb = fbm(vec3(lam*1.4, n.y*3.2, uSeed)+vec3(uTime*.004,0,0));
          float tb = .5+.5*sin(n.y*uBandF + turb*uBandT*3.);
          tb = mix(.5, tb, .85+.15*fbm(n*6.+uSeed));
          alb = ramp(tb);
          if(uSpot>.5){                              // 大红斑
            float dx=mod(lam-1.0+3.14159,6.28318)-3.14159, dy=n.y-uSpotLat;
            float d=length(vec2(dx*1.6,dy*4.2));
            float sw=fbm(vec3(lam,dy,1.)*9.+uTime*.08);
            float m=smoothstep(.55,.18,d+sw*.18);
            alb=mix(alb, mix(uC1*.75,vec3(1.,.28,.12),.75+.25*sw), m*uSpot);
          }
          if(uStorm>.5){                             // 海王星大黑斑
            float dx=mod(lam+.6+3.14159,6.28318)-3.14159, dy=n.y-.28;
            float d=length(vec2(dx*1.8,dy*4.));
            float m=smoothstep(.4,.1,d)*smoothstep(.15,.35,fbm(vec3(lam,dy,2.)*6.+uTime*.15));
            alb=mix(alb,alb*.28+vec3(.02,.03,.1),m);
            alb+=smoothstep(.45,.2,d)*(1.-m)*vec3(.5,.6,.9)*.12;
          }
          if(uIo>.5){                                // 木卫一火山
            float v=fbm(n*5.+uSeed);
            alb=mix(vec3(1.,.85,.25),vec3(.85,.45,.1),v);
            alb+=pow(rid(n*14.+uSeed),8.)*vec3(1.,.35,.1)*1.2;   // 火山喷发痕
            alb=mix(alb,vec3(.15,.1,.08),smoothstep(.6,.8,fbm(n*3.+9.)));
          }
          if(uEuropa>.5){                            // 木卫二冰裂纹
            alb=vec3(.82,.78,.72)*(.9+.1*fbm(n*6.));
            float cr=pow(rid(n*3.5+uSeed),22.)*.7+pow(rid(n*8.+4.),30.)*.5;
            cr=clamp(cr,0.,1.);
            alb=mix(alb,vec3(.45,.25,.18),cr);
          }
          if(uTitan>.5){                             // 土卫六霾层
            float haze=fbm(vec3(lam,n.y*2.,uTime*.02));
            alb=mix(vec3(.75,.42,.1),vec3(.95,.68,.28),haze);
            alb*=.85+.3*fbm(n*4.+2.);
          }
        } else {                                     // 岩质
          float land = fbm(n*uLandF + uSeed*3.);
          ocean = smoothstep(uLandTh+uLandW, uLandTh-uLandW, land);
          float det = fbm(n*uLandF*4.+uSeed);
          alb = mix(vec3(.035,.11,.24)*(.7+.6*det), ramp(.42+.58*det)*(.8+.4*fbm(n*9.+1.)), 1.-ocean);
          if(uCrater>.01){
            float c = pow(rid(n*uLandF*4.5+uSeed*2.),6.)*uCrater;
            alb *= 1.-.45*c;
          }
          if(uNight>.5 && ocean<.5){ }               // 地球陆地稍暗由后续处理
        }
        // ---- 极冠 ----
        if(uCap>0.){
          float capm = smoothstep(uCap-.06, uCap+.08, abs(n.y)+ (fbm(n*6.+uSeed)-.5)*.22);
          alb = mix(alb, vec3(.92,.95,.98), capm);
        }

        // ---- 光照 ----
        vec3 nb = bump(n);
        float ndl = dot(nb,Ld);
        float lit = pow(clamp(ndl,0.,1.), .95);
        vec3 col = alb*(lit + .028);

        // 晨昏线暖色散射
        float term = smoothstep(.28,0.,ndl)*smoothstep(-.12,.2,ndl);
        col += alb*term*uAtmoAmt*vec3(1.,.5,.25)*.55;
        // 大气边缘光
        float fres = pow(1.-max(dot(nb,V),0.),3.2);
        col += uAtmo*fres*(lit*.85+.06)*uAtmoAmt*1.6;
        // 镜面（海洋）
        if(uSpec>.5){
          vec3 H=normalize(Ld+V);
          col += pow(max(dot(nb,H),0.),60.)*uSpec*ocean*lit*vec3(.9,.95,1.);
        }
        // 夜面城市灯（地球）
        if(uNight>.5){
          float dark = smoothstep(.05,-.08,ndl);
          float grid = step(.62, hash13(vec3(floor(n*46.)))) * step(.5,.5+.5*sin(n.x*40.));
          col += vec3(1.,.72,.35)*dark*(1.-ocean)*grid*step(uCap-.1,1.) * .5 *
                 smoothstep(.55,.75,fbm(n*3.+uSeed*3.));
        }
        gl_FragColor = vec4(col,1.);
      }`
  });
}

function cloudMaterial(c){
  return new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{ uTime:{value:0}, uTint:{value:L(c.tint)}, uD:{value:c.dens}, uF:{value:c.freq}, uT:{value:c.turb} },
    vertexShader:`varying vec3 vN; varying vec3 vObj; varying vec3 vW;
      void main(){ vObj=normalize(position); vec4 wp=modelMatrix*vec4(position,1.);
        vW=wp.xyz; vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`${NOISE}
      precision highp float;
      uniform float uTime,uD,uF,uT; uniform vec3 uTint;
      varying vec3 vN; varying vec3 vObj; varying vec3 vW;
      void main(){
        vec3 n=normalize(vObj);
        float f = fbm(n*uF + vec3(uTime*.015,0.,uTime*.007));
        f += fbm(n*uF*2.6+uT)*uT*.22;
        float a = smoothstep(1.-uD*.62, 1.-uD*.62+.28, f);
        float lit = pow(clamp(dot(n,normalize(-vW)),0.,1.),.9);
        vec3 col = uTint*(lit*1.05+.05);
        gl_FragColor = vec4(col, a*lit*.95);
      }`
  });
}

function ringMat(planet, cfg){
  return new THREE.ShaderMaterial({
    transparent:true, side:THREE.DoubleSide, depthWrite:false,
    uniforms:{ uPR:{value:cfg.inner}, uOR:{value:cfg.outer}, uTint:{value:L(cfg.tiltHue)},
               uPlanetPos:{value:new THREE.Vector3()}, uPlanetR:{value:planet.r||3.9}, uThin:{value:cfg.thin?1:0} },
    vertexShader:`varying vec3 vW; varying vec2 vXY;
      void main(){ vXY=position.xz;           // 几何已烘焙到 XZ 赤道面
        vec4 wp=modelMatrix*vec4(position,1.);
        vW=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`${NOISE}
      precision highp float;
      uniform float uPR,uOR,uPlanetR,uThin; uniform vec3 uTint,uPlanetPos;
      varying vec3 vW; varying vec2 vXY;
      float dens(float t){
        float d = .35+.65*fbm(vec3(t*90.,0.,0.));
        if(uThin<.5){
          d *= smoothstep(0.,.06,t)*smoothstep(1.,.94,t);
          d *= 1.-smoothstep(.40,.445,t)*smoothstep(.50,.445,t)*.85;   // 卡西尼缝
          d *= 1.-smoothstep(.86,.875,t)*smoothstep(.895,.875,t)*.6;   // 恩克缝
        } else { d *= smoothstep(0.,.3,t)*smoothstep(1.,.6,t); }
        d *= .55+.45*hash13(vec3(floor(t*220.),0.,0.));
        return clamp(d,0.,1.);
      }
      void main(){
        float r=length(vXY); float t=(r-uPR)/(uOR-uPR);
        if(t<0.||t>1.) discard;
        float D=dens(t);
        vec3 Ld=normalize(-vW);
        float lit=.35+.65*abs(dot(vec3(0,1,0),Ld));   // 环面法线≈世界y(近似)
        // 行星本影: 环点位于日→行星连线的延长段且横向距离<行星半径
        vec3 lp=uPlanetPos; float pl=length(lp);
        vec3 pln=lp/max(pl,1e-4); float pp=dot(vW,pln);
        float perp=length(vW-pln*pp);
        float sh = pp>pl*.9 ? smoothstep(uPlanetR*.8,uPlanetR*1.35,perp) : 1.;
        vec3 col=uTint*lit*mix(.08,1.,sh);
        gl_FragColor=vec4(col, D*(.85-uThin*.35));
      }`
  });
}

function keplerPos(data, tDays, out){
  // data: {vA(visual semi-major), e, inc, om, w, M0, P}
  const M = data.M0 + 2*Math.PI*(tDays/data.P);
  let E = M % (2*Math.PI);
  for(let k=0;k<6;k++) E = E - (E - data.e*Math.sin(E) - M)/(1 - data.e*Math.cos(E));
  const xv = data.vA*(Math.cos(E)-data.e), yv = data.vA*Math.sqrt(1-data.e*data.e)*Math.sin(E);
  // 近点辐角 → 轨道面 → 倾角 → 升交点
  const cw=Math.cos(data.w), sw=Math.sin(data.w), ci=Math.cos(data.inc), si=Math.sin(data.inc),
        co=Math.cos(data.om), so=Math.sin(data.om);
  const x1=xv*cw - yv*sw, y1=xv*sw + yv*cw;
  const y2=y1*ci, z2=y1*si;
  out.set( x1*co - y2*so, z2, x1*so + y2*co );
  return out;
}

function orbitLinePoints(d){
  const pts=[]; const P=new THREE.Vector3();
  const M0=d.M0;
  for(let k=0;k<=256;k++){ d.M0 = M0 + k/256*2*Math.PI*0; // 用真近点角采样整圈：令E扫过2π
    // 直接扫E画椭圆(与时间无关)
    const E=k/256*2*Math.PI;
    const xv=d.vA*(Math.cos(E)-d.e), yv=d.vA*Math.sqrt(1-d.e*d.e)*Math.sin(E);
    const cw=Math.cos(d.w), sw=Math.sin(d.w), ci=Math.cos(d.inc), si=Math.sin(d.inc),
          co=Math.cos(d.om), so=Math.sin(d.om);
    const x1=xv*cw-yv*sw, y1=xv*sw+yv*cw, y2=y1*ci, z2=y1*si;
    pts.push(new THREE.Vector3(x1*co-y2*so, z2, x1*so+y2*co));
  }
  d.M0=M0; return pts;
}

function starfield(){

    else v=new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).normalize();
    const R=1600+Math.random()*300;
    v.multiplyScalar(R); pos.set([v.x,v.y,v.z], i*3);
    const t=Math.random();
    c.setHSL(t<.6?.06+Math.random()*.05:.55+Math.random()*.1, t<.6?.3:.5, .75+Math.random()*.25);
    col.set([c.r,c.g,c.b], i*3);
    sz[i]=Math.pow(Math.random(),2.6)*3.4+.35; sd[i]=Math.random();
  }
const g=new THREE.BufferGeometry();

  g.setAttribute('aSize',new THREE.BufferAttribute(sz,1));

    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{uTime:{value:0}},
    vertexShader:`attribute float aSize; attribute float aSeed; attribute vec3 aCol;

      void main(){ vec2 p=gl_PointCoord*2.-1.; float d=length(p); if(d>1.)discard;

  }));

    void main(){ vec2 p=vUv*2.-1.; float r=length(p);
      float ring=smoothstep(.86,.9,r)*smoothstep(1.,.94,r);
      float ang=atan(p.y,p.x);
      float spin=.5+.5*sin(ang*6.-uTime*2.);
      gl_FragColor=vec4(vec3(.91,.76,.48)*(.28+.28*spin), ring*(.12+.15*spin)); }`});
const selRing=new THREE.Mesh(new THREE.PlaneGeometry(1,1), selMat);
selRing.visible=false; scene.add(selRing);

/* ============================================================
   交互 / UI
   ============================================================ */
let simDays = J2000_TO_2026, daysPerSec = 1, paused = false;
let selected = null, followBody = null;
const speedEl=document.getElementById('speed'), speedVal=document.getElementById('speedVal');
function applySpeed(){ const s=+speedEl.value; daysPerSec = .05*Math.pow(10, s/22);
  speedVal.textContent = daysPerSec<1?daysPerSec.toFixed(2)+' 天/秒':daysPerSec<100?daysPerSec.toFixed(1)+' 天/秒':Math.round(daysPerSec)+' 天/秒'; }
speedEl.addEventListener('input', applySpeed); applySpeed();

document.getElementById('bPause').addEventListener('click', e=>{ paused=!paused;
  e.target.classList.toggle('on',!paused); e.target.textContent = paused?'▶ 播放':'⏸ 暂停'; });
const bOrb=document.getElementById('bOrbits');
bOrb.addEventListener('click', ()=>{ bOrb.classList.toggle('on');
  const v=bOrb.classList.contains('on'); for(const b of bodies) if(b.orbit) b.orbit.visible=v; });
const bLab=document.getElementById('bLabels');
bLab.addEventListener('click', ()=>{ bLab.classList.toggle('on');
  document.getElementById('labels').style.display=bLab.classList.contains('on')?'':'none'; });
document.getElementById('bReset').addEventListener('click', ()=>{
  followBody=null; selected=null; setActiveRow(null); document.getElementById('info').style.display='none';
  flight={cam:new THREE.Vector3(0,70,150), tgt:new THREE.Vector3(0,0,0), k:0}; });

// 行星列表
const listEl=document.getElementById('planets');
const allBodies=[sunBody, ...bodies.filter(b=>!b.isSun), ];
for(const b of allBodies){
  const row=document.createElement('div'); row.className='row'; row.dataset.name=b.name;
  const col = b.isSun?'#ffd98a':(b.pd?b.pd.color:b.color||0x7ad8e8);
  row.innerHTML=`<span class="dot" style="color:#${col.toString(16).padStart(6,'0')}"></span>${b.name}`;
  row.addEventListener('click', ()=>selectBody(b));
  listEl.appendChild(row);
}
function setActiveRow(name){ for(const r of listEl.children) r.classList.toggle('active', r.dataset.name===name); }

// 标签
const labelsEl=document.getElementById('labels');
for(const b of allBodies){ const el=document.createElement('div'); el.className='plabel'; el.textContent=b.name;
  labelsEl.appendChild(el); b.labelEl=el;
  for(const m of (b.moons||[])){ const me=document.createElement('div'); me.className='plabel';
    me.style.fontSize='9.5px'; me.style.color='rgba(143,160,194,.8)'; me.textContent=m.name;
    labelsEl.appendChild(me); m.labelEl=me; } }

// 信息面板
const infoEl=document.getElementById('info');
function showInfo(b){
  const src=b.info || (b.pd&&b.pd.info) || {};
  document.getElementById('iName').firstChild.textContent=b.name;
  document.getElementById('iEn').textContent=b.en;
  const g=document.getElementById('iGrid'); g.innerHTML='';
  for(const [k,v] of Object.entries(src)){ if(k==='desc') continue; const dd=document.createElement('div');
    dd.innerHTML=`<div class="k">${k}</div><div class="v">${v}</div>`; g.appendChild(dd); }
  document.getElementById('iDesc').textContent=src.desc||'';
  infoEl.style.display='block';
}
let flight=null;
function selectBody(b){
  selected=b; followBody=b; setActiveRow(b.name); showInfo(b);
  const wp=b.mesh.getWorldPosition(new THREE.Vector3());
  const dir=camera.position.clone().sub(wp).normalize();
  const dist=Math.max((b.r||9)*6.5, 3.5);
  flight={ off: dir.multiplyScalar(dist).add(new THREE.Vector3(0,dist*.35,0)), k:0,
           p0:camera.position.clone(), t0:controls.target.clone() };
}
addEventListener('keydown', e=>{ if(e.key==='Escape'){ followBody=null; selected=null;
  setActiveRow(null); infoEl.style.display='none'; selRing.visible=false; } });

// 拾取
const ray=new THREE.Raycaster(); let downXY=null;
renderer.domElement.addEventListener('pointerdown', e=>downXY=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downXY || Math.hypot(e.clientX-downXY[0], e.clientY-downXY[1])>4) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const meshes=allBodies.map(b=>b.mesh);
  const hit=ray.intersectObjects(meshes,false)[0];
  if(hit){ const b=allBodies.find(bb=>bb.mesh===hit.object); if(b) selectBody(b); }
});

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});

/* ============================================================
   主循环
   ============================================================ */
const clock=new THREE.Clock();
const startDate=Date.UTC(2026,8,1);
const tmpV=new THREE.Vector3();

function updateAsteroids(dt){
  if(paused||dt<=0) return;
  const {phase,ra,ecc,incl}=astGeo.userData, pos=astGeo.attributes.position.array;
  for(let i=0;i<AST_N;i++){
    // 开普勒第三定律: a_vis=26√a_AU → P=365.26·a^1.5 = 365.26·(ra/26)^3 天
    phase[i]+= (2*Math.PI/(365.26*Math.pow(ra[i]/26,3)))*daysPerSec*dt;
    const r=ra[i]*(1-ecc[i]*Math.cos(phase[i])), ci=Math.cos(incl[i]), si=Math.sin(incl[i]);
    const x=Math.cos(phase[i])*r, z=Math.sin(phase[i])*r;
    pos[i*3]=x; pos[i*3+1]=z*si; pos[i*3+2]=z*ci;
  }
  astGeo.attributes.position.needsUpdate=true;
}

let frameDt=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(), .1); frameDt=dt;
  if(!paused) simDays += daysPerSec*dt;
  const tt = clock.elapsedTime;

  sunMat.uniforms.uTime.value=tt; coronaMat.uniforms.uTime.value=tt;
  stars.material.uniforms.uTime.value=tt; selMat.uniforms.uTime.value=tt;
  stars.rotation.y = tt*.002;
  sunMesh.rotation.y = simDays/SUN.rot*2*Math.PI*.12;
  corona.quaternion.copy(camera.quaternion);

  for(const b of bodies){
    if(b.isSun){ if(b.labelEl) continue; }
    if(b.mat&&b.mat.uniforms) b.mat.uniforms.uTime.value=tt;
    if(b.data){
      keplerPos(b.data, simDays, tmpV);
      if(b.group) b.group.position.copy(tmpV);
      else b.mesh.position.copy(tmpV);
    }
    if(b.spin) b.spin.rotation.y = (simDays/b.pd.rot)*2*Math.PI;
    if(b.cloud){ b.cloud.material.uniforms.uTime.value=tt; b.cloud.rotation.y = simDays*b.pd.cloud.rotD*2*Math.PI; }
    if(b.ring){ b.ring.material.uniforms.uPlanetPos.value.copy(b.group.position); }
    for(const m of (b.moons||[])){
      const ang = simDays/m.P*2*Math.PI;
      m.mesh.position.set(Math.cos(ang)*m.d, 0, Math.sin(ang)*m.d);
      m.group.rotation.x = m.inc*DEG;
      m.mesh.rotation.y = ang; // 潮汐锁定
      if(m.mesh.material.uniforms) m.mesh.material.uniforms.uTime.value=tt;
    }
    if(b.isComet){
      b.mesh.getWorldPosition(_v);
      b.mat.uniforms.uTime.value=tt;
      const dist=_v.length(), act=THREE.MathUtils.clamp((70-dist)/45,0,1);
      b.tailMat.uniforms.uAct.value=act*act;
      b.tailMat.uniforms.uTime.value=tt;
      if(act>0.01){
        const pos=b.tailGeo.attributes.position.array, sdA=b.tailGeo.attributes.aSeed.array;
        const radial=_v.clone().normalize(), vel=_v2;
        // 速度方向≈切向
        const prev=keplerPos(b.data, simDays-40, new THREE.Vector3());
        vel.copy(_v).sub(prev).normalize();
        const ionDir=radial.clone().multiplyScalar(1).add(vel.clone().multiplyScalar(.25)).normalize();
        const dustDir=radial.clone().add(vel.clone().multiplyScalar(.6)).normalize();
        for(let i=0;i<500;i++){
          const s=sdA[i], Lg=(4+70*act)*s, w=s<.6?ionDir:dustDir;
          const j=(i%97)/97-.5;
          pos[i*3]  =_v.x + w.x*Lg + j*radial.y*Lg*.06 + Math.sin(tt+i)*s*.6;
          pos[i*3+1]=_v.y + w.y*Lg + j*Lg*.14 + Math.cos(tt*.8+i)*s*.6;
          pos[i*3+2]=_v.z + w.z*Lg - j*radial.x*Lg*.06;
        }
        b.tailGeo.attributes.position.needsUpdate=true;
      }
    }
  }
  updateAsteroids(paused?0:dt);

  // 相机跟随与飞行
  if(followBody){
    const wp=followBody.mesh.getWorldPosition(_v);
    if(flight){
      flight.k+=dt/1.4; const e=Math.min(flight.k,1), es=e*e*(3-2*e);
      controls.target.copy(_v2.copy(flight.t0).lerp(wp, es));
      camera.position.copy(_f.copy(flight.p0).lerp(_f2.copy(wp).add(flight.off), es));
      if(flight.k>=1.45) flight=null;
    } else {
      const old=controls.target.clone();
      controls.target.lerp(wp,.35);
      camera.position.add(controls.target.clone().sub(old));
    }
  } else if(flight){
    controls.target.lerp(flight.tgt, .1); camera.position.lerp(flight.cam, .1);
    if(camera.position.distanceTo(flight.cam)<1) flight=null;
  }
  controls.update();

  // 选中光环
  if(selected && !selected.isSun){
    const wp=selected.mesh.getWorldPosition(_v);
    selRing.position.copy(wp); selRing.quaternion.copy(camera.quaternion);
    const s=(selected.r||1)*3.4*(1+.05*Math.sin(tt*3));
    selRing.scale.setScalar(s); selRing.visible=true;
  } else if(selected && selected.isSun){
    selRing.position.copy(sunMesh.position); selRing.quaternion.copy(camera.quaternion);
    selRing.scale.setScalar(SUN.r*2.6); selRing.visible=true;
  } else selRing.visible=false;

  // 标签投影
  const camDir=new THREE.Vector3(); camera.getWorldDirection(camDir);
  const place=(el, obj, r, base)=>{
    if(!el) return;
    obj.getWorldPosition(_v);
    const toP=_v.clone().sub(camera.position); const dist=toP.length();
    if(camera.position.clone().add(camDir.clone().multiplyScalar(dist)).distanceTo(_v)>dist*.5){el.style.opacity=0;return;}
    _v.project(camera);
    if(_v.z>1){el.style.opacity=0;return;}
    el.style.left=((_v.x*.5+.5)*innerWidth)+'px';
    el.style.top=((-_v.y*.5+.5)*innerHeight - (r/dist)*420 - 6)+'px';
    el.style.opacity = dist<700 ? Math.min(1,(base||1)*THREE.MathUtils.clamp(700-dist,0,300)/300) : 0;
  };
  for(const b of allBodies) if(b.labelEl) place(b.labelEl, b.mesh, (b.r||9)*1.6, b===selected?1.3:1), b.labelEl.classList.toggle('sel', b===selected);
  for(const b of bodies) for(const m of (b.moons||[])){ if(!m.labelEl) continue;
    place(m.labelEl, m.mesh, m.r, .9);
    const wp=m.mesh.getWorldPosition(_v2); if(wp.distanceTo(camera.position)>90) m.labelEl.style.opacity=0; }

  // 日期
  const dd=new Date(startDate + (simDays-J2000_TO_2026)*86400000);
  document.getElementById('date').textContent=dd.toISOString().slice(0,10);
  document.getElementById('days').textContent=Math.floor(simDays-J2000_TO_2026).toLocaleString();

  composer.render();
}

// 深链: ?focus=Saturn 加载后自动锁定飞行
{ const m=location.search.match(/[?&]focus=([\w\u4e00-\u9fff]+)/i);
  if(m){ const b=allBodies.find(x=>x.en&&x.en.toLowerCase()===m[1].toLowerCase()||x.name===m[1]); if(b) selectBody(b); } }

// 首帧后淡入
composer.render();
requestAnimationFrame(()=>{ const f=document.getElementById('fade'); f.style.opacity=0; setTimeout(()=>f.remove(),1800); });
loop();
</script>
</body>
