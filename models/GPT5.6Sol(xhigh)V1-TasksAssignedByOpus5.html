function sunVisibility(sp){if(!sp.visible||sp.x<0||sp.x>scene.w||sp.y<0||sp.y>scene.h)return 0;for(const p of planets){const q=project(p.pos,scene.vp,scene.w,scene.h);if(!q.visible||q.w>=sp.w)continue;const rp=p.radiusD*scene.h/(2*Math.tan(camera.fov/2)*Math.max(q.w,.01));if(Math.hypot(q.x-sp.x,q.y-sp.y)<rp*.95)return .08}return 1}

function pick(cssX,cssY){let best=null,score=1e9;for(const o of labelObjs){if(moonDefs.includes(o)&&!$('tMoons').checked||o===halley&&!$('tComet').checked)continue;const q=project(o.pos||[0,0,0],scene.vp,innerWidth,innerHeight);if(!q.visible)continue;const rr=clamp((o.radiusD||1)*innerHeight/(V.len(V.sub(o.pos||[0,0,0],scene.eye))*Math.tan(camera.fov/2))*1.7,10,55),d=Math.hypot(cssX-q.x,cssY-q.y);if(d<rr&&d<score){best=o;score=d}}if(best)setSelected(best);return!!best}
