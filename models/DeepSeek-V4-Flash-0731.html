<html lang="zh-CN">

<style>
  :root{
    --accent:#7fd8ff;
    --gold:#ffd27a;
    --txt:#e6eefc;
    --dim:#93a7c8;
    --glass-bg:linear-gradient(160deg,rgba(18,28,52,.58),rgba(8,12,26,.50));
    --glass-br:1px solid rgba(140,180,255,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060f;color:var(--txt);
    font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  #scene{position:fixed;inset:0;z-index:0}
  #scene canvas{display:block;cursor:grab}
  #vignette{position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(2,4,12,.42) 82%,rgba(1,2,8,.62) 100%)}
  .glass{background:var(--glass-bg);backdrop-filter:blur(14px) saturate(150%);
    -webkit-backdrop-filter:blur(14px) saturate(150%);border:var(--glass-br);border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}

  /* 标题 */
  #title{position:fixed;top:16px;left:18px;z-index:20;pointer-events:none}
  #title h1{font-size:20px;font-weight:700;letter-spacing:2px;
    background:linear-gradient(120deg,#fff 10%,var(--accent) 55%,#c9a4ff 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #title p{font-size:10.5px;letter-spacing:3.5px;color:var(--dim);margin-top:3px;text-transform:uppercase}

  /* 时钟 */
  #clock{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:20;
    display:flex;align-items:center;gap:12px;padding:8px 16px;font-size:12px;white-space:nowrap}
  #clockDate{font-family:'SF Mono',Menlo,Consolas,monospace;letter-spacing:.5px}
  #clockSpeed{color:var(--gold);font-family:'SF Mono',Menlo,Consolas,monospace}

  /* 控制面板 */
  #controls{position:fixed;top:16px;right:18px;z-index:20;display:flex;flex-direction:column;gap:9px;padding:12px 14px;min-width:308px}
  .c-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{appearance:none;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#cfe4ff;
    font-size:12px;padding:5px 11px;border-radius:10px;cursor:pointer;transition:all .18s ease;font-family:inherit;white-space:nowrap}
  .chip:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
  .chip.on{background:linear-gradient(135deg,#57b6f2,#3f8ef0);color:#041018;border-color:transparent;font-weight:600;
    box-shadow:0 0 14px rgba(87,182,242,.45)}
  .chip.play{min-width:86px;font-weight:600}
  #speedSlider{flex:1;min-width:110px;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;
    background:linear-gradient(90deg,#3f8ef0,#7fd8ff);outline:none;cursor:pointer}
  #speedSlider::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;
    border:2px solid var(--accent);box-shadow:0 0 10px rgba(127,216,255,.85);cursor:pointer}
  #speedSlider::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--accent);
    box-shadow:0 0 10px rgba(127,216,255,.85);cursor:pointer}
  #speedVal{font-size:11.5px;color:var(--dim);min-width:84px;text-align:right;font-family:'SF Mono',Menlo,Consolas,monospace}

  /* 行星列表 */
  #list{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:20;
    display:flex;flex-direction:column;gap:3px;padding:8px;max-height:70vh;overflow-y:auto;scrollbar-width:none}
  #list::-webkit-scrollbar{display:none}
  .li{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:10px;border:1px solid transparent;
    background:transparent;color:var(--txt);cursor:pointer;font-family:inherit;font-size:12.5px;text-align:left;
    transition:all .15s ease;white-space:nowrap}
  .li i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c);flex:none}
  .li span{flex:none}
  .li em{font-style:normal;font-size:9.5px;color:var(--dim);letter-spacing:.5px;margin-left:auto;flex:none}
  .li:hover{background:rgba(255,255,255,.07)}
  .li.active{background:linear-gradient(90deg,rgba(127,216,255,.16),rgba(127,216,255,.04));
    box-shadow:inset 2.5px 0 0 var(--accent)}
  .li.active span{color:var(--accent)}

  /* 信息卡 */
  #info{position:fixed;left:18px;bottom:18px;z-index:20;width:330px;padding:16px 18px;
    transition:opacity .25s ease,transform .25s ease}
  #info.hidden{opacity:0;transform:translateY(14px);pointer-events:none}
  .ic{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;font-size:12px;transition:all .15s}
  .ic:hover{background:rgba(255,60,60,.35);border-color:rgba(255,120,120,.4)}
  .ih{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .id{width:12px;height:12px;border-radius:50%;flex:none}
  .ih h3{font-size:21px;font-weight:700;letter-spacing:1px;
    background:linear-gradient(120deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .ih p{font-size:11px;color:var(--dim);letter-spacing:1.5px;margin-top:2px}
  .ig{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px}
  .st{display:flex;flex-direction:column;gap:2px;border-top:1px solid rgba(255,255,255,.07);padding-top:6px}
  .st span{font-size:10.5px;color:var(--dim);letter-spacing:1px}
  .st b{font-size:12.5px;color:var(--txt);font-weight:500}
  .id2{font-size:12px;line-height:1.75;color:#a8bcdc;margin-top:12px;border-top:1px solid rgba(255,255,255,.07);padding-top:10px}

  /* 提示 / FPS */
  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;align-items:center;

  #hint kbd{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);padding:2px 7px;border-radius:6px;

  #fps{position:fixed;bottom:16px;right:18px;z-index:20;font-size:11px;color:#6ff0a8;padding:4px 10px;border-radius:8px;
    font-family:'SF Mono',Menlo,Consolas,monospace;letter-spacing:1px}

  /* 3D 标签 */
  .plabel{position:relative;display:flex;align-items:center;gap:5px;font-size:12px;letter-spacing:1.5px;color:#dfeaff;
    text-shadow:0 0 12px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.9);white-space:nowrap;pointer-events:none}
  .ldot{width:7px;height:7px;border-radius:50%;display:inline-block}
  body.no-labels .plabel{display:none}

  /* 悬停提示 */
  #tooltip{position:fixed;z-index:30;padding:7px 12px;font-size:12px;border-radius:10px;background:rgba(10,16,32,.85);
    border:1px solid rgba(140,180,255,.25);backdrop-filter:blur(8px);color:var(--txt);pointer-events:none;
    opacity:0;transition:opacity .15s;letter-spacing:1px}
  #tooltip.show{opacity:1}

  /* 加载页 */
  #loading{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(900px at 50% 42%,#0a1028 0%,#05070f 60%,#020308 100%);transition:opacity .8s ease}
  #loading.done{opacity:0;pointer-events:none}
  .l-inner{text-align:center;width:min(420px,86vw)}
  .l-orbit{width:58px;height:58px;margin:0 auto 26px;border-radius:50%;border:2px solid rgba(127,216,255,.15);
    border-top-color:var(--accent);border-right-color:var(--accent);animation:spin 1.1s linear infinite;
    box-shadow:0 0 24px rgba(127,216,255,.25)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .l-inner h1{font-size:26px;letter-spacing:4px;
    background:linear-gradient(120deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .l-inner>p{font-size:10.5px;letter-spacing:6px;color:var(--dim);margin:8px 0 34px}
  .l-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
  #l-fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#3f8ef0,var(--accent),#c9a4ff);
    box-shadow:0 0 12px rgba(127,216,255,.7);transition:width .35s ease}
  #l-status{margin-top:14px;font-size:12px;color:var(--dim);letter-spacing:2px}
  .l-err h2{color:#ff8f8f;margin-bottom:10px}
  .l-err p{color:#b8a8c8;font-size:13px;line-height:1.8;margin-bottom:16px}

  /* 响应式 */
  @media (max-width:900px){
    #title h1{font-size:16px}

    #controls{top:12px;left:12px;right:12px;min-width:0}
    #list{top:auto;bottom:64px;left:50%;transform:translateX(-50%);right:auto;flex-direction:row;max-width:94vw;
      overflow-x:auto;padding:7px}
    .li em{display:none}
    #hint{display:none}
    #fps{display:none}
    #info{left:12px;right:12px;bottom:112px;width:auto}
  }
</style>

const TAU = Math.PI * 2;
const AU_SCALE = 4;          // 1 AU → 4 场景单位（比例刻意放大以便观看）

const rad = d => d * Math.PI / 180;

/* ---------------- 工具：随机数与噪声 ---------------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeValueNoise(rand){
  const size = 256, cells = new Float32Array(size * size);
  for(let i = 0; i < cells.length; i++) cells[i] = rand();
  const smooth = t => t * t * (3 - 2 * t);
  return function(x, y){
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const x0 = ((xi % size) + size) % size, x1 = (x0 + 1) % size;
    const y0 = ((yi % size) + size) % size, y1 = (y0 + 1) % size;
    const a = cells[y0 * size + x0], b = cells[y0 * size + x1];
    const c = cells[y1 * size + x0], d = cells[y1 * size + x1];
    const u = smooth(xf), v = smooth(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbm(noise, x, y, oct){
  let v = 0, amp = 1, f = 1, tot = 0;
  for(let i = 0; i < oct; i++){ v += amp * noise(x * f, y * f); tot += amp; amp *= 0.5; f *= 2.03; }
  return v / tot;
}
function px(w, h, fn){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const img = g.createImageData(w, h), d = img.data;
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    const col = fn(x, y), i = (y * w + x) * 4;
    d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = col[3] === undefined ? 255 : col[3];
  }
  g.putImageData(img, 0, 0);
  return c;
}
function tex(canvas, rx = 1){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, 1);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function hexToRgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function glowCanvas(hex, peak){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, hexToRgba(hex, peak));
  gr.addColorStop(0.3, hexToRgba(hex, peak * 0.4));
  gr.addColorStop(0.62, hexToRgba(hex, peak * 0.1));
  gr.addColorStop(1, hexToRgba(hex, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return c;
}
function nebulaCanvas(hue, sat){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, `hsla(${hue},${sat}%,70%,0.5)`);
  gr.addColorStop(0.35, `hsla(${hue},${sat}%,55%,0.22)`);
  gr.addColorStop(0.7, `hsla(${hue},${sat}%,45%,0.08)`);
  gr.addColorStop(1, `hsla(${hue},${sat}%,40%,0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return c;
}
function colorHex(c){ return '#' + c.toString(16).padStart(6, '0'); }

  { key:'neptune', zh:'海王星', en:'Neptune', a:30.069, e:0.00859, i:1.770,  O:131.784, w:272.846, M0:256.22, period:60190,   rotHours:16.11,  tilt:28.32,  radius:1.75, color:0x3d6fd8, gas:true,  bump:false },

];
const MOON_EL = { a:2.4, e:0.0549, i:rad(5.145), O:rad(125.08), w:rad(318.15), M0:rad(135.27), period:27.322 };

/* ---------------- 开普勒轨道力学 ---------------- */
function solveKepler(el, M){
  let E = M;
  for(let k = 0; k < 9; k++){
    const f = E - el.e * Math.sin(E) - M;
    const fp = 1 - el.e * Math.cos(E);
    E -= f / fp;
    if(Math.abs(f) < 1e-8) break;
  }
  return E;
}
function helioXYZ(el, t, scale = AU_SCALE){
  const M = el.M0 + TAU * (t / el.period);
  const E = solveKepler(el, M);
  const nu = 2 * Math.atan2(Math.sqrt(1 + el.e) * Math.sin(E / 2), Math.sqrt(1 - el.e) * Math.cos(E / 2));
  const r = el.a * (1 - el.e * el.e) / (1 + el.e * Math.cos(nu));
  const u = el.w + nu;
  const cO = Math.cos(el.O), sO = Math.sin(el.O), ci = Math.cos(el.i), si = Math.sin(el.i);
  const x = r * (cO * Math.cos(u) - sO * Math.sin(u) * ci);
  const y = r * (sO * Math.cos(u) + cO * Math.sin(u) * ci);
  const z = r * Math.sin(u) * si;
  return [x * scale, z * scale, y * scale];   // 黄道面 → 场景 XZ 平面
}
function orbitLinePoints(el, scale, n = 256){
  const arr = new Float32Array((n + 1) * 3);
  for(let k = 0; k <= n; k++){
    const nu = TAU * k / n;
    const r = el.a * (1 - el.e * el.e) / (1 + el.e * Math.cos(nu));
    const u = el.w + nu;
    const cO = Math.cos(el.O), sO = Math.sin(el.O), ci = Math.cos(el.i), si = Math.sin(el.i);
    const x = r * (cO * Math.cos(u) - sO * Math.sin(u) * ci) * scale;
    const y = r * (sO * Math.cos(u) + cO * Math.sin(u) * ci) * scale;
    const z = r * Math.sin(u) * si * scale;
    arr[k * 3] = x; arr[k * 3 + 1] = z; arr[k * 3 + 2] = y;
  }
  return arr;
}

function earthMap(){

    const latn = fbm(noise, x * 0.02 + 55, y * 0.02 + 31, 3);

const SUN_VERT = `
varying vec3 vWorldPos;
varying vec3 vNormal;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  vNormal = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const SUN_FRAG = `
uniform float uTime;
varying vec3 vWorldPos;
varying vec3 vNormal;
float hash(vec3 p){
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float noise(vec3 p){
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
        mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
    mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
        mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){
  float v = 0.0;
  float a = 0.5;
  for(int i = 0; i < 5; i++){
    v += a * noise(p);
    p = p * 2.03 + 1.7;
    a *= 0.5;
  }
  return v;
}
void main(){
  vec3 dir = normalize(vWorldPos);
  float n = fbm(dir * 4.5 + vec3(uTime * 0.055, uTime * 0.03, uTime * 0.02));
  float m = fbm(dir * 11.0 - vec3(uTime * 0.09, 0.0, uTime * 0.05));
  float h = n * 0.68 + m * 0.32;
  vec3 col = mix(vec3(1.0, 0.42, 0.03), vec3(1.0, 0.82, 0.30), smoothstep(0.25, 0.72, h));
  col = mix(col, vec3(1.0, 0.99, 0.90), smoothstep(0.72, 0.95, h));
  vec3 vd = normalize(cameraPosition - vWorldPos);
  float limb = clamp(dot(normalize(vNormal), vd), 0.0, 1.0);
  col *= (0.62 + 0.38 * limb) * 1.75;
  gl_FragColor = vec4(col, 1.0);
}`;

function makeStars(){
  const rand = mulberry32(42);
  const add = (count, size, mul) => {
    const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
    for(let i = 0; i < count; i++){
      const d = 420 + rand() * 460;
      const u = rand() * 2 - 1, th = rand() * TAU, s = Math.sqrt(1 - u * u);
      pos[i * 3] = d * s * Math.cos(th); pos[i * 3 + 1] = d * s * Math.sin(th); pos[i * 3 + 2] = d * u;
      const t2 = rand();
      let r, g, b;
      if(t2 < 0.72){ r = 0.85 + rand() * 0.15; g = 0.9 + rand() * 0.1; b = 1; }
      else if(t2 < 0.9){ r = 1; g = 0.92 + rand() * 0.08; b = 0.78 + rand() * 0.12; }
      else { r = 1; g = 0.7; b = 0.5; }
      const br = (0.35 + rand() * 0.65) * mul;
      col[i * 3] = r * br; col[i * 3 + 1] = g * br; col[i * 3 + 2] = b * br;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

    return new THREE.Points(geo, mat);

function orbitLine(el, scale, colorHex){
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(orbitLinePoints(el, scale), 3));
  const base = new THREE.Line(geo, new THREE.LineBasicMaterial({ color:colorHex,
    transparent:true, opacity:0.3, depthWrite:false }));
  const glow = new THREE.Line(geo, new THREE.LineBasicMaterial({ color:colorHex,
    transparent:true, opacity:0.12, blending:THREE.AdditiveBlending, depthWrite:false }));
  const g = new THREE.Group();
  g.add(base, glow);
  g.userData = { base, glow };
  linesGroup.add(g);
  return g;
}
function addAtmosphere(group, r, hex, peak, scale){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex(glowCanvas(hex, peak)),
    blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity:0.9 }));
  sp.scale.setScalar(r * scale);
  group.add(sp);
}
function buildSaturnRings(tilt, r){
  const inner = r * 1.45, outer = r * 2.35;
  const geo = new THREE.RingGeometry(inner, outer, 220, 1);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for(let i = 0; i < pos.count; i++){
    const rr = Math.hypot(pos.getX(i), pos.getY(i));
    uv.setXY(i, (rr - inner) / (outer - inner), 0.5);
  }
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({ map:tex(saturnRingCanvas()), side:THREE.DoubleSide,
    transparent:true, depthWrite:true });
  tilt.add(new THREE.Mesh(geo, mat));
}
function buildPlanets(){
  for(const p of PLANETS){
    const group = new THREE.Group();
    const tilt = new THREE.Group();
    tilt.rotation.z = rad(p.tilt);

    const map = planetMapOf(p);
    const opts = { map:tex(map), specular:0x262a33, shininess:p.gas ? 2 : 8 };
    if(!p.gas && p.bump){ opts.bumpMap = tex(map); opts.bumpScale = p.radius * 0.35; }
    const sphere = new THREE.Mesh(new THREE.SphereGeometry(p.radius, 64, 64), new THREE.MeshPhongMaterial(opts));
    tilt.add(sphere);
    group.add(tilt);

    if(p.key === 'saturn') buildSaturnRings(tilt, p.radius);
    if(p.key === 'earth'){
      const cm = tex(cloudMap());
      const cSphere = new THREE.Mesh(new THREE.SphereGeometry(p.radius * 1.016, 64, 64),
        new THREE.MeshPhongMaterial({ map:cm, transparent:true, opacity:0.85, depthWrite:false,
          specular:0x111111, shininess:2 }));
      tilt.add(cSphere);
      addAtmosphere(group, p.radius, '#5fb2ff', 0.4, 3.3);
    }
    if(p.key === 'venus') addAtmosphere(group, p.radius, '#f2ddb0', 0.35, 2.7);
    if(p.key === 'mars') addAtmosphere(group, p.radius, '#ff9c6a', 0.3, 2.9);

    const el = { a:p.a, e:p.e, i:rad(p.i), O:rad(p.O), w:rad(p.w), M0:rad(p.M0), period:p.period };
    const orbit = orbitLine(el, AU_SCALE, p.color);
    addLabel(group, p.zh, p.radius * 2.5, colorHex(p.color));
    scene.add(group);

    const body = { key:p.key, zh:p.zh, en:p.en, cat:p.key === 'pluto' ? '矮行星' : '行星',
      group, radius:p.radius, colorCss:colorHex(p.color), info:INFO[p.key], el, sphere, spin:0,
      spinPeriod:p.rotHours,
      orbit, clouds:p.key === 'earth' ? tilt.children.find(m => m.isMesh && m !== sphere) : null, tilt };
    planetBodies.push(body);
    if(p.key === 'earth') earthBody = body;
  }
}
function buildMoon(){
  moonGroup = new THREE.Group();
  const tilt = new THREE.Group();
  tilt.rotation.z = MOON_EL.i;
  moonSphere = new THREE.Mesh(new THREE.SphereGeometry(0.28, 48, 48),
    new THREE.MeshPhongMaterial({ map:tex(moonMap()), specular:0x23262e, shininess:8,
      bumpMap:tex(moonMap()), bumpScale:0.07 }));
  tilt.add(moonSphere);
  moonGroup.add(tilt);
  addLabel(moonGroup, '月球', 0.55, '#c9d6e8');
  earthBody.group.add(orbitLine(MOON_EL, 1, 0x9fb4cc));
  earthBody.group.add(moonGroup);
  moonBody = { key:'moon', zh:'月球', en:'Moon', cat:'卫星', group:moonGroup, radius:0.28,
    colorCss:'#c9d6e8', info:INFO.moon, mesh:moonSphere };
}

/* ---------------- 小行星带 / 柯伊伯带 / 彗星 ---------------- */
function buildBelt(){
  const rng = mulberry32(777), count = 1600;
  beltEls = new Array(count);
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  for(let i = 0; i < count; i++){
    const a = 2.2 + rng() * 1.2;                                  // 2.2~3.4 AU，位于火木之间
    beltEls[i] = { a, e:0.02 + rng() * 0.14, i:rad(rng() * 10), O:rad(rng() * 360),
      w:rad(rng() * 360), M0:rad(rng() * 360), period:Math.pow(a, 1.5) * 365.25 };
    const bright = rng() > 0.93 ? 1.35 : 1;
    const c = 120 + rng() * 90;
    col[i * 3] = Math.min(255, c * bright); col[i * 3 + 1] = Math.min(255, (c - 8) * bright);
    col[i * 3 + 2] = Math.min(255, (c - 20) * bright);
  }
  beltGeo = new THREE.BufferGeometry();
  beltGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  beltGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  beltPoints = new THREE.Points(beltGeo, new THREE.PointsMaterial({ size:0.05, sizeAttenuation:true,
    vertexColors:true, transparent:true, opacity:0.9, depthWrite:false }));
  scene.add(beltPoints);
}
function buildKuiper(){
  const rng = mulberry32(333), count = 2200;
  kuiperEls = new Array(count);
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  for(let i = 0; i < count; i++){
    const a = 38 + rng() * 8;
    kuiperEls[i] = { a, e:rng() * 0.1, i:rad(rng() * 16), O:rad(rng() * 360),
      w:rad(rng() * 360), M0:rad(rng() * 360), period:Math.pow(a, 1.5) * 365.25 };
    col[i * 3] = 150 + rng() * 40; col[i * 3 + 1] = 175 + rng() * 40; col[i * 3 + 2] = 210 + rng() * 35;
  }
  kuiperGeo = new THREE.BufferGeometry();
  kuiperGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  kuiperGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  kuiperPoints = new THREE.Points(kuiperGeo, new THREE.PointsMaterial({ size:0.3, sizeAttenuation:true,
    vertexColors:true, transparent:true, opacity:0.3, depthWrite:false }));
  scene.add(kuiperPoints);
}
const COMET_DEFS = [
  { a:3.0, e:0.90, i:58,  O:205, w:38,  M0:60  },
  { a:2.6, e:0.92, i:122, O:82,  w:205, M0:200 },
  { a:4.1, e:0.88, i:42,  O:305, w:165, M0:310 },
];
function buildComets(){
  const headTex = tex(glowCanvas('#cfe6ff', 0.9));
  for(const d of COMET_DEFS){
    const el = { a:d.a, e:d.e, i:rad(d.i), O:rad(d.O), w:rad(d.w), M0:rad(d.M0),
      period:Math.pow(d.a, 1.5) * 365.25 };                            // 开普勒第三定律
    const N = 56;
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    for(let i = 0; i < N; i++){
      const g = 1 - i / (N - 1);                                       // 彗尾渐变（加法混合下黑色即透明）
      col[i * 3] = (0.7 + 0.8 * g) * g; col[i * 3 + 1] = (0.85 + 0.6 * g) * g; col[i * 3 + 2] = (1.0 + 0.35 * g) * g;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:0.85,
      blending:THREE.AdditiveBlending, depthWrite:false });
    const line = new THREE.Line(geo, mat);
    const head = new THREE.Sprite(new THREE.SpriteMaterial({ map:headTex, blending:THREE.AdditiveBlending,
      transparent:true, depthWrite:false, opacity:1 }));
    head.scale.setScalar(1.5);
    const g2 = new THREE.Group();
    g2.add(line, head);
    scene.add(g2);
    comets.push({ el, line, head, pos, N, mat });
  }
}
function fillPositions(els, arr, t){
  for(let i = 0; i < els.length; i++){
    const el = els[i];
    const M = el.M0 + TAU * (t / el.period);
    let E = M;
    for(let k = 0; k < 6; k++){
      const f = E - el.e * Math.sin(E) - M;
      E -= f / (1 - el.e * Math.cos(E));
      if(Math.abs(f) < 1e-8) break;
    }
    const nu = 2 * Math.atan2(Math.sqrt(1 + el.e) * Math.sin(E / 2), Math.sqrt(1 - el.e) * Math.cos(E / 2));
    const r = el.a * (1 - el.e * el.e) / (1 + el.e * Math.cos(nu));
    const u = el.w + nu;
    const cO = Math.cos(el.O), sO = Math.sin(el.O), ci = Math.cos(el.i), si = Math.sin(el.i);
    const x = r * (cO * Math.cos(u) - sO * Math.sin(u) * ci) * AU_SCALE;
    const y = r * (sO * Math.cos(u) + cO * Math.sin(u) * ci) * AU_SCALE;
    const z = r * Math.sin(u) * si * AU_SCALE;
    const i3 = i * 3;
    arr[i3] = x; arr[i3 + 1] = z; arr[i3 + 2] = y;
  }
}

/* ---------------- HUD 与交互 ---------------- */
const $ = id => document.getElementById(id);
const slider = $('speedSlider'), speedValEl = $('speedVal'), clockDateEl = $('clockDate'),
  clockSpeedEl = $('clockSpeed'), playBtn = $('playBtn'), listEl = $('list'),
  infoEl = $('info'), tooltipEl = $('tooltip'), fpsEl = $('fps'), loadingEl = $('loading');
const presetBtns = [...document.querySelectorAll('#presets .chip')];
const tgOrbits = $('tgOrbits'), tgLabels = $('tgLabels'), tgBelt = $('tgBelt'),
  tgKuiper = $('tgKuiper'), tgAuto = $('tgAuto'), btnReset = $('btnReset');

const state = { paused:false, speed:10, simDays:0, focus:null };
const ALL_BODIES = [];
let hoverBody = null;

function fmtUTC(d){
  const p2 = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())} UTC`;
}
function fmtDays(d){ return d >= 10000 ? Math.round(d).toLocaleString('en-US') : d.toFixed(1); }
function fmtSpeed(){
  if(state.speed >= 365.25) return `${(state.speed / 365.25).toFixed(2)} 年/秒`;
  if(state.speed >= 1) return state.speed >= 100 ? `${Math.round(state.speed)} 天/秒` : `${state.speed.toFixed(2)} 天/秒`;
  return `${(state.speed * 24).toFixed(2)} 时/秒`;
}
function updateHUD(){
  const d = new Date(EPOCH + state.simDays * 86400000);
  clockDateEl.textContent = `📅 ${fmtUTC(d)} · 已模拟 ${fmtDays(state.simDays)} 天`;
  const s = `1 秒 ≈ ${fmtSpeed()}`;
  clockSpeedEl.textContent = s;
  speedValEl.textContent = fmtSpeed();
}
function sliderFromSpeed(){ slider.value = String((Math.log10(state.speed) + 1) / 5 * 100); }

function setFocus(b){
  state.focus = b;
  for(const el of listEl.children) el.classList.toggle('active', !!(b && el.dataset.key === b.key));
  for(const pb of planetBodies){
    const on = !!(b && pb.key === b.key);
    pb.orbit.userData.base.material.opacity = on ? 0.85 : 0.3;
    pb.orbit.userData.glow.material.opacity = on ? 0.38 : 0.12;
  }
  if(b) showInfo(b); else hideInfo();
}
function showInfo(b){
  const rows = b.info.rows.map(([k, v]) => `<div class="st"><span>${k}</span><b>${v}</b></div>`).join('');
  infoEl.innerHTML = `<button class="ic" id="icBtn">✕</button>
    <div class="ih"><i class="id" style="background:${b.colorCss};box-shadow:0 0 12px ${b.colorCss}"></i>
    <div><h3>${b.zh}</h3><p>${b.en} · ${b.cat}</p></div></div>
    <div class="ig">${rows}</div><p class="id2">${b.info.desc}</p>`;
  infoEl.classList.remove('hidden');
}
function hideInfo(){ infoEl.classList.add('hidden'); }

function wireHUD(){
  ALL_BODIES.push(sunBody, ...planetBodies, moonBody);
  for(const b of ALL_BODIES){
    const el = document.createElement('button');
    el.className = 'li';
    el.dataset.key = b.key;
    el.style.setProperty('--c', b.colorCss);
    el.innerHTML = `<i></i><span>${b.zh}</span><em>${b.en}</em>`;
    listEl.appendChild(el);
  }
  listEl.addEventListener('click', e => {
    const btn = e.target.closest('.li');
    if(!btn) return;
    const body = ALL_BODIES.find(x => x.key === btn.dataset.key);
    setFocus(body === state.focus ? null : body);
  });
  infoEl.addEventListener('click', e => { if(e.target.id === 'icBtn') setFocus(null); });

  function togglePause(){ state.paused = !state.paused; playBtn.textContent = state.paused ? '▶ 继续' : '⏸ 暂停'; }
  playBtn.addEventListener('click', togglePause);
  slider.addEventListener('input', () => {
    state.speed = Math.pow(10, -1 + (+slider.value) / 100 * 5);
    presetBtns.forEach(b => b.classList.remove('on'));
    updateHUD();
  });
  presetBtns.forEach(b => b.addEventListener('click', () => {
    state.speed = +b.dataset.speed;
    sliderFromSpeed();
    presetBtns.forEach(x => x.classList.toggle('on', x === b));
    updateHUD();
  }));
  tgOrbits.addEventListener('click', () => { tgOrbits.classList.toggle('on'); linesGroup.visible = tgOrbits.classList.contains('on'); });
  tgLabels.addEventListener('click', () => { tgLabels.classList.toggle('on'); document.body.classList.toggle('no-labels', !tgLabels.classList.contains('on')); });
  tgBelt.addEventListener('click', () => { tgBelt.classList.toggle('on'); beltPoints.visible = tgBelt.classList.contains('on'); });
  tgKuiper.addEventListener('click', () => { tgKuiper.classList.toggle('on'); kuiperPoints.visible = tgKuiper.classList.contains('on'); });
  tgAuto.addEventListener('click', () => { tgAuto.classList.toggle('on'); controls.autoRotate = tgAuto.classList.contains('on'); });
  btnReset.addEventListener('click', () => {
    setFocus(null);
    introFrom.copy(camera.position);
    intro = true; introT = 0;
    controls.enabled = false;
  });

  const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const rayTargets = ALL_BODIES.map(b => b.mesh);
  const meshBody = new Map(rayTargets.map((m, i) => [m, ALL_BODIES[i]]));
  const canvas = renderer.domElement;
  let downX = 0, downY = 0;
  canvas.addEventListener('pointermove', e => {
    ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(rayTargets, false);
    if(hits.length && hits[0].object){
      hoverBody = meshBody.get(hits[0].object);
      tooltipEl.textContent = hoverBody.zh;
      tooltipEl.style.left = (e.clientX + 16) + 'px';
      tooltipEl.style.top = (e.clientY + 18) + 'px';
      tooltipEl.classList.add('show');
      canvas.style.cursor = 'pointer';
    } else {
      hoverBody = null;
      tooltipEl.classList.remove('show');
      canvas.style.cursor = 'grab';
    }
  });
  canvas.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
  canvas.addEventListener('pointerup', e => {
    if(Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;   // 拖动不算点击
    ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(rayTargets, false);
    setFocus(hits.length && hits[0].object ? meshBody.get(hits[0].object) : null);
  });

  window.addEventListener('keydown', e => {
    if(e.code === 'Space'){ e.preventDefault(); togglePause(); }
    else if(e.key === '+' || e.key === '='){
      state.speed = clamp(state.speed * 1.35, 0.01, 50000); sliderFromSpeed();
      presetBtns.forEach(b => b.classList.remove('on')); updateHUD();
    }
    else if(e.key === '-' || e.key === '_'){
      state.speed = clamp(state.speed / 1.35, 0.01, 50000); sliderFromSpeed();
      presetBtns.forEach(b => b.classList.remove('on')); updateHUD();
    }
    else if(e.key.toLowerCase() === 'f') setFocus(null);
    else if(e.key.toLowerCase() === 'o') tgOrbits.click();
    else if(e.key.toLowerCase() === 'l') tgLabels.click();
    else if(e.key.toLowerCase() === 'r') tgAuto.click();
  });

  updateHUD();
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
const tmpA = new THREE.Vector3(), tmpW = new THREE.Vector3();
let sunT = 0, hudT = 0, fpsT = 0, frames = 0, firstFrame = true;

function updateComets(t, dt){
  for(const c of comets){
    const [x, y, z] = helioXYZ(c.el, t);
    const r = Math.hypot(x, y, z);
    c.mat.opacity = clamp(3.4 - r * 0.5, 0.1, 0.9);
    c.head.material.opacity = clamp(3.2 - r * 0.45, 0.2, 1);
    c.head.getWorldPosition(tmpW);
    c.head.scale.setScalar(Math.max(0.3, camera.position.distanceTo(tmpW) * 0.028));
    if(!state.paused){
      for(let i = c.N - 1; i > 0; i--){
        c.pos[i * 3] = c.pos[(i - 1) * 3];
        c.pos[i * 3 + 1] = c.pos[(i - 1) * 3 + 1];
        c.pos[i * 3 + 2] = c.pos[(i - 1) * 3 + 2];
      }
    }
    c.pos[0] = x; c.pos[1] = y; c.pos[2] = z;
    c.line.geometry.attributes.position.needsUpdate = true;
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  sunT += dt;
  if(!state.paused) state.simDays += state.speed * dt;
  const t = state.simDays;

  for(const b of planetBodies){
    const [x, y, z] = helioXYZ(b.el, t);
    b.group.position.set(x, y, z);
    if(!state.paused) b.spin = (b.spin + TAU * (24 / b.spinPeriod) * (state.speed * dt)) % TAU;
    b.sphere.rotation.y = b.spin;
    if(b.clouds) b.clouds.rotation.y = b.spin * 1.06;
  }
  const [mx, my, mz] = helioXYZ(MOON_EL, t, 1);
  moonGroup.position.set(mx, my, mz);
  moonSphere.rotation.y = Math.atan2(mx, mz);          // 潮汐锁定：同一面朝向地球

  if(beltPoints.visible) fillPositions(beltEls, beltGeo.attributes.position.array, t);
  if(kuiperPoints.visible) fillPositions(kuiperEls, kuiperGeo.attributes.position.array, t);
  updateComets(t, dt);

  sunMat.uniforms.uTime.value = sunT;
  corona1.material.opacity = 0.75 + Math.sin(sunT * 0.7) * 0.1;

  const fg = state.focus ? state.focus.group : null;
  if(fg) fg.getWorldPosition(tmpA); else tmpA.set(0, 0, 0);
  controls.target.lerp(tmpA, 0.14);

  if(intro){
    introT += dt;
    const k = Math.min(1, introT / introDur);
    camera.position.lerpVectors(introFrom, introTo, 1 - Math.pow(1 - k, 3));
    if(k >= 1){ intro = false; controls.enabled = true; }
  }
  controls.update();
  composer.render();
  cssRender.render(scene, camera);

  if(firstFrame){ firstFrame = false; window.__solarReady = true; }
  hudT += dt;
  if(hudT >= 0.2){ hudT = 0; updateHUD(); }
  frames++; fpsT += dt;
  if(fpsT >= 0.5){ fpsEl.textContent = Math.round(frames / fpsT) + ' FPS'; frames = 0; fpsT = 0; }
}

/* ---------------- 启动 ---------------- */
const raf = () => new Promise(r => requestAnimationFrame(r));
async function boot(){
  const lFill = $('l-fill'), lStatus = $('l-status');
  const st = (p, s) => { lFill.style.width = p + '%'; lStatus.textContent = s; };
  try{
    st(5, '初始化渲染器');
    await raf(); initScene();
    st(15, '生成星空与星云');
    await raf(); makeStars(); makeNebula();
    st(28, '生成太阳');
    await raf(); buildSun();
    st(40, '生成行星贴图');
    await raf();
    linesGroup = new THREE.Group(); scene.add(linesGroup);
    buildPlanets();
    st(62, '构建行星系统');
    await raf(); buildMoon();
    st(76, '生成小行星带与柯伊伯带');
    await raf(); buildBelt(); buildKuiper();
    st(88, '添加彗星');
    await raf(); buildComets();
    st(96, '构建控制界面');
    await raf(); wireHUD();
    st(100, '启动渲染');
    await raf(); await raf();
    animate();
    setTimeout(() => loadingEl.classList.add('done'), 500);
    setTimeout(() => loadingEl.remove(), 1600);
  }catch(err){
    console.error(err);
    loadingEl.innerHTML = `<div class="l-inner l-err"><h2>初始化失败</h2><p>${err.message || err}</p>
      <button class="chip on" onclick="location.reload()">重新加载</button></div>`;
  }
}
boot();
</script>
