/* ---- 彗尾 ---- */
const TAIL_SEG = 30;
const tailBuf = new Float32Array((TAIL_SEG + 1) * 2 * 9);
const tailW = new Float32Array(TAIL_SEG + 1);
function buildCometTail(b, kind) {
  const rAU = b.st.r;
  if (rAU > 6.5) return false;
  const L = b.st.r > 0 ? SCALE * Math.pow(rAU, SIM.compress) * 0.085 *
                         clamp(Math.pow(3 / rAU, 1.8), 0, 9) : 0;
  if (L < 0.02) return false;
  const antiSun = V3.norm(V3.mul(b.lightDir, -1));
  const pts = [b.pos.slice()];
  let cur = b.pos.slice();
  const step = L / TAIL_SEG;
  for (let k = 1; k <= TAIL_SEG; k++) {
    const f = k / TAIL_SEG;
    let d;
    if (kind === 0) d = antiSun;
    else d = V3.norm([
      lerp(antiSun[0], -b.velDir[0], f * 0.72),
      lerp(antiSun[1], -b.velDir[1], f * 0.72),
      lerp(antiSun[2], -b.velDir[2], f * 0.72)
    ]);
    cur = [cur[0] + d[0] * step, cur[1] + d[1] * step, cur[2] + d[2] * step];
    pts.push(cur);
  }
  const w0 = kind === 0 ? 5.0 : 13.0;
  const w1 = kind === 0 ? 13.0 : 26.0;
  for (let k = 0; k <= TAIL_SEG; k++) tailW[k] = lerp(w0, w1, Math.pow(k / TAIL_SEG, 0.75));
  ribbonFill(tailBuf, pts, tailW);
  uploadRibbon(RIB.tail, tailBuf);
  return true;
}

/* ---- 行星 uniform ---- */
function setPlanetU(b) {
  const p = P.planet, c = b.cfg;
  gl.uniform1i(p.u.uType, b.type);
  gl.uniform1f(p.u.uTime, SIM.animT);
  gl.uniform1f(p.u.uBump, c.bump * 0.030);
  gl.uniform1f(p.u.uSunI, b.sunI || 1);
  gl.uniform1f(p.u.uSoft0, c.soft0);
  gl.uniform1f(p.u.uSoft1, c.soft1);
  gl.uniform1f(p.u.uTurb, c.turb || 0);
  gl.uniform1f(p.u.uGRS, c.grs || 0);
  gl.uniform1f(p.u.uDetail, clamp(b.screenR / 90, 0, 1));
  gl.uniform1f(p.u.uSpecI, c.specI || 0);
  gl.uniform3fv(p.u.uSpecC, c.specC);
  gl.uniform3fv(p.u.uColA, c.colA);
  gl.uniform3fv(p.u.uColB, c.colB);
  gl.uniform3fv(p.u.uColC, c.colC);
  gl.uniform3fv(p.u.uSunDirO, b.sunO);
  const s = b.rDisp;
  gl.uniform3f(p.u.uCamO, b.camO[0] / s, b.camO[1] / s, b.camO[2] / s);
  if (b.ring) {
    gl.uniform1f(p.u.uRingOn, 1);
    gl.uniform1f(p.u.uRingIn, b.ring.inner);
    gl.uniform1f(p.u.uRingOut, b.ring.outer);
    gl.uniform1i(p.u.uRingBody, b.ring.body);
  } else gl.uniform1f(p.u.uRingOn, 0);
}

/* ---- 主渲染 ---- */
function render() {
  const sun = BY_KEY.sun;

  /* 深度写必须显式打开：clear 受 depthMask 约束 (7.1) */
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.useMSAA ? FB.msaa.fbo : FB.scene.fbo);
  gl.viewport(0, 0, W, H);
  gl.depthMask(true);
  gl.clearColor(0, 0, 0, 1);
  gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  /* 1. 背景星云：深度测试关、深度写关 */
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
  gl.useProgram(P.bg);
  gl.uniformMatrix4fv(P.bg.u.uInvVP, false, INVVP);
  gl.uniform3fv(P.bg.u.uCam, CAM.eye);
  gl.uniform3fv(P.bg.u.uGalN, GAL_N);
  gl.uniform1f(P.bg.u.uTime, SIM.animT);
  gl.bindVertexArray(VAO.empty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* 2. 恒星点：加法混合 */
  if (UI.stars) {
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(P.star);
    gl.uniformMatrix4fv(P.star.u.uVP, false, VP);
    gl.uniform3fv(P.star.u.uCam, CAM.eye);
    gl.uniform1f(P.star.u.uTime, SIM.animT);
    gl.bindVertexArray(VAO.stars);
    gl.drawArrays(gl.POINTS, 0, N_STARS);
    gl.disable(gl.BLEND);
  }

  /* 3. 太阳球体 */
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.useProgram(P.sun);
  gl.uniformMatrix4fv(P.sun.u.uVP, false, VP);
  gl.uniformMatrix4fv(P.sun.u.uModel, false, sun.mat);
  gl.uniform1f(P.sun.u.uTime, SIM.animT);
  gl.uniform3fv(P.sun.u.uCam, CAM.eye);
  gl.bindVertexArray(VAO.sphere);
  gl.drawElements(gl.TRIANGLES, GEO.sphereN, gl.UNSIGNED_INT, 0);

  /* 4. 行星 / 卫星球体 */
  gl.useProgram(P.planet);
  gl.uniformMatrix4fv(P.planet.u.uVP, false, VP);
  for (const b of BODIES) {
    if (b.id === 'sun') continue;
    if (b.group === 'moon' && !UI.moons) continue;
    if (b.group === 'comet' && !UI.comet) continue;
    if (b.screenR < 0.35) continue;
    setPlanetU(b);
    gl.uniformMatrix4fv(P.planet.u.uModel, false, b.mat);
    gl.drawElements(gl.TRIANGLES, GEO.sphereN, gl.UNSIGNED_INT, 0);
  }

  gl.depthMask(false);

  /* 5. 轨道缎带 */
  if (UI.orbits) {
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.disable(gl.CULL_FACE);
    gl.useProgram(P.orbit);
    gl.uniformMatrix4fv(P.orbit.u.uVP, false, VP);
    gl.uniform2f(P.orbit.u.uViewport, W, H);
    for (const o of ORBITS) {
      const b = o.body;
      if (b.group === 'moon' && !UI.moons) continue;
      if (b.group === 'comet' && !UI.comet) continue;
      const par = o.local ? BY_KEY[b.parent] : null;
      gl.uniform3f(P.orbit.u.uOffset, par ? par.pos[0] : 0, par ? par.pos[1] : 0, par ? par.pos[2] : 0);
      gl.uniform3fv(P.orbit.u.uCol, o.col);
      gl.uniform1f(P.orbit.u.uHalfW, o.hw * DPR);
      const sel = CAM.focus === b.id;
      gl.uniform1f(P.orbit.u.uBodyT, b.bodyT || 0);
      gl.uniform1f(P.orbit.u.uK, o.local ? 2.6 : 3.4);
      gl.uniform1f(P.orbit.u.uBase, sel ? 0.16 : 0.085);
      gl.uniform1f(P.orbit.u.uPeak, sel ? 1.15 : 0.62);
      gl.uniform1f(P.orbit.u.uOpacity, sel ? 1.0 : 0.62);
      gl.bindVertexArray(o.rib.vao);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, o.n);
    }
    gl.disable(gl.BLEND);
  }

  /* 6. 小天体带 */
  if (UI.belts) {
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(P.belt);
    gl.uniformMatrix4fv(P.belt.u.uVP, false, VP);
    gl.uniform1f(P.belt.u.uDays, SIM.jd - J2000);
    gl.uniform1f(P.belt.u.uScale, SCALE);
    gl.uniform1f(P.belt.u.uCompress, SIM.compress);
    gl.uniform1f(P.belt.u.uPix, 0.18 * pixPerUnit() * DPR);
    for (const b of BELTS) {
      gl.uniform3fv(P.belt.u.uCol, b.col);
      gl.uniform1f(P.belt.u.uBright, b.br);
      gl.bindVertexArray(b.vao);
      gl.drawArrays(gl.POINTS, 0, b.n);
    }
    gl.disable(gl.BLEND);
  }

  /* 7. 大气壳层 */
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.disable(gl.CULL_FACE);
  gl.useProgram(P.atmo);
  gl.uniformMatrix4fv(P.atmo.u.uVP, false, VP);
  gl.bindVertexArray(VAO.sphere);          // 前面的粒子/缎带 pass 换过 VAO，必须切回来
  const atmMat = M4.ident();
  for (const b of BODIES) {
    if (!b.atmos || b.screenR < 1.2) continue;
    if (b.group === 'moon' && !UI.moons) continue;
    const sf = 1 + b.atmos.h * 7.5;
    M4.basisTRS(atmMat, b.basis.X, b.basis.Y, b.basis.Z, b.pos, b.phase, b.rDisp * sf);
    gl.uniformMatrix4fv(P.atmo.u.uModel, false, atmMat);
    gl.uniform3fv(P.atmo.u.uCol, b.atmos.col);
    gl.uniform1f(P.atmo.u.uH, b.atmos.h);
    gl.uniform1f(P.atmo.u.uStr, b.atmos.str);
    gl.uniform1f(P.atmo.u.uShell, sf);
    gl.uniform1f(P.atmo.u.uSunI, b.sunI || 1);
    gl.uniform3fv(P.atmo.u.uSunDirO, b.sunO);
    const sc = b.rDisp * sf;
    gl.uniform3f(P.atmo.u.uCamO, b.camO[0] / sc, b.camO[1] / sc, b.camO[2] / sc);
    gl.drawElements(gl.TRIANGLES, GEO.sphereN, gl.UNSIGNED_INT, 0);
  }
  gl.disable(gl.BLEND);

  /* 8. 环系：正常 alpha 混合、不剔除 */
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(P.ring);
  gl.uniformMatrix4fv(P.ring.u.uVP, false, VP);
  gl.bindVertexArray(VAO.quad);
  const ringMat = M4.ident();
  for (const b of BODIES) {
    if (!b.ring || b.screenR < 1.0) continue;
    M4.basisTRS(ringMat, b.basis.X, b.basis.Y, b.basis.Z, b.pos, 0, b.rDisp);
    gl.uniformMatrix4fv(P.ring.u.uModel, false, ringMat);
    gl.uniform1f(P.ring.u.uOuter, b.ring.outer);
    gl.uniform1f(P.ring.u.uInner, b.ring.inner);
    gl.uniform1i(P.ring.u.uBody, b.ring.body);
    gl.uniform3fv(P.ring.u.uCol, b.ring.col);
    gl.uniform1f(P.ring.u.uSunI, b.sunI || 1);
    gl.uniform3fv(P.ring.u.uSunDirO, b.sunO);
    gl.uniform3f(P.ring.u.uCamO, b.camO[0] / b.rDisp, b.camO[1] / b.rDisp, b.camO[2] / b.rDisp);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  gl.disable(gl.BLEND);

  /* 9. 彗尾 + 彗发 */
  if (UI.comet) {
    const com = BY_KEY.halley;
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.disable(gl.CULL_FACE);
    gl.useProgram(P.tail);
    gl.uniformMatrix4fv(P.tail.u.uVP, false, VP);
    gl.uniform2f(P.tail.u.uViewport, W, H);
    gl.uniform3f(P.tail.u.uOffset, 0, 0, 0);
    gl.uniform1f(P.tail.u.uHalfW, DPR);
    gl.bindVertexArray(RIB.tail.vao);
    const bright = clamp(Math.pow(3 / Math.max(com.st.r, 0.2), 1.4), 0.05, 4.0);
    if (buildCometTail(com, 1)) {
      gl.uniform3f(P.tail.u.uCol, 0.62 * bright, 0.48 * bright, 0.26 * bright);
      gl.uniform1f(P.tail.u.uPow, 1.0);
      gl.uniform1f(P.tail.u.uOpacity, 0.85);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, RIB.tail.n);
    }
    if (buildCometTail(com, 0)) {
      gl.uniform3f(P.tail.u.uCol, 0.20 * bright, 0.42 * bright, 0.95 * bright);
      gl.uniform1f(P.tail.u.uPow, 1.35);
      gl.uniform1f(P.tail.u.uOpacity, 1.0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, RIB.tail.n);
    }
    /* 彗发 */
    gl.useProgram(P.corona);
    gl.uniformMatrix4fv(P.corona.u.uVP, false, VP);
    gl.uniform3fv(P.corona.u.uCenter, com.pos);
    gl.uniform3fv(P.corona.u.uRight, [VIEW[0], VIEW[4], VIEW[8]]);
    gl.uniform3fv(P.corona.u.uUp, [VIEW[1], VIEW[5], VIEW[9]]);
    gl.uniform1f(P.corona.u.uSize, Math.max(0.55, com.rDisp * 9));
    gl.uniform1f(P.corona.u.uInt, clamp(0.28 * bright, 0.02, 1.1));
    gl.uniform1f(P.corona.u.uSharp, 2.4);
    gl.uniform1f(P.corona.u.uTime, SIM.animT);
    gl.uniform3f(P.corona.u.uCol, 0.55, 0.72, 1.0);
    gl.bindVertexArray(VAO.quad);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disable(gl.BLEND);
  }

  /* 10. 日冕（两层，深度测试开所以会被行星正确遮挡） */
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.disable(gl.CULL_FACE);
  gl.useProgram(P.corona);
  gl.uniformMatrix4fv(P.corona.u.uVP, false, VP);
  gl.uniform3fv(P.corona.u.uCenter, sun.pos);
  gl.uniform3fv(P.corona.u.uRight, [VIEW[0], VIEW[4], VIEW[8]]);
  gl.uniform3fv(P.corona.u.uUp, [VIEW[1], VIEW[5], VIEW[9]]);
  gl.uniform1f(P.corona.u.uTime, SIM.animT);
  gl.uniform3f(P.corona.u.uCol, 1.0, 0.72, 0.34);
  gl.bindVertexArray(VAO.quad);
  gl.uniform1f(P.corona.u.uSize, SUN_DISP_R * 3.1);
  gl.uniform1f(P.corona.u.uSharp, 2.6);
  gl.uniform1f(P.corona.u.uInt, 0.22);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.uniform1f(P.corona.u.uSize, SUN_DISP_R * 9.0);
  gl.uniform1f(P.corona.u.uSharp, 3.6);
  gl.uniform1f(P.corona.u.uInt, 0.06);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.disable(gl.BLEND);

  gl.bindVertexArray(null);

  /* 解析 MSAA */
  if (FB.useMSAA) blitColor(FB.msaa.fbo, FB.scene.fbo, W, H);

  /* ---- 泛光 ---- */
  if (UI.bloom && FB.scene.ok !== false) {
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.BLEND);
    gl.useProgram(P.bright);
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.bloom[0].fbo);
    gl.viewport(0, 0, FB.bloom[0].w, FB.bloom[0].h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.scene.tex);
    gl.uniform1i(P.bright.u.uTex, 0);
    gl.uniform2f(P.bright.u.uTexel, 1 / W, 1 / H);
    gl.uniform1f(P.bright.u.uThresh, HDR_OK ? 1.35 : 0.62);
    gl.uniform1f(P.bright.u.uKnee, HDR_OK ? 0.55 : 0.35);
    gl.bindVertexArray(VAO.empty);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.useProgram(P.down);
    for (let i = 1; i < FB.bloom.length; i++) {
      const m = FB.bloom[i], s = FB.bloom[i - 1];
      gl.bindFramebuffer(gl.FRAMEBUFFER, m.fbo);
      gl.viewport(0, 0, m.w, m.h);
      gl.bindTexture(gl.TEXTURE_2D, s.tex);
      gl.uniform1i(P.down.u.uTex, 0);
      gl.uniform2f(P.down.u.uTexel, 1 / s.w, 1 / s.h);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    /* 升采样：用加法混合累加，绝不「读旧值再相加」形成反馈环 (7.3) */
    gl.useProgram(P.up);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = FB.bloom.length - 2; i >= 0; i--) {
      const m = FB.bloom[i], s = FB.bloom[i + 1];
      gl.bindFramebuffer(gl.FRAMEBUFFER, m.fbo);
      gl.viewport(0, 0, m.w, m.h);
      gl.bindTexture(gl.TEXTURE_2D, s.tex);
      gl.uniform1i(P.up.u.uTex, 0);
      gl.uniform2f(P.up.u.uTexel, 1 / s.w, 1 / s.h);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.disable(gl.BLEND);
  }

  /* ---- 合成到默认帧缓冲 ---- */
  const fwd = V3.norm(V3.sub(CAM.target, CAM.eye));
  const toSun = V3.norm(V3.mul(CAM.eye, -1));
  let flare = 0, sunU = 0.5, sunV = 0.5;
  if (UI.bloom) {
    const ok = project(sun.pos);
    if (ok) {
      sunU = _sp[0] / W; sunV = 1 - _sp[1] / H;
      flare = smooth(sstep(0.0, 0.30, V3.dot(toSun, fwd)));
      flare *= (1 - sstep(0.78, 1.06, Math.abs(sunU - 0.5) * 2));
      flare *= (1 - sstep(0.78, 1.06, Math.abs(sunV - 0.5) * 2));
      const sw = _sp[2];
      for (const b of BODIES) {
        if (b.id === 'sun' || !b.onScreen || b.screenW >= sw) continue;
        const d = Math.hypot(b.screenX * DPR - _sp[0], b.screenY * DPR - _sp[1]);
        const occ = 1 - sstep(b.screenR * DPR * 0.90, b.screenR * DPR * 1.18, d);
        if (occ > 0.001) flare *= (1 - occ);
      }
      flare = clamp(flare, 0, 1);
    }
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.BLEND);
  gl.useProgram(P.comp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.scene.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, FB.bloom[0].tex);
  gl.uniform1i(P.comp.u.uScene, 0);
  gl.uniform1i(P.comp.u.uBloom, 1);
  gl.uniform1f(P.comp.u.uExposure, 1.0);
  gl.uniform1f(P.comp.u.uBloomStr, UI.bloom ? 0.30 : 0.0);
  gl.uniform1f(P.comp.u.uTime, SIM.animT);
  gl.uniform1f(P.comp.u.uCA, UI.bloom ? 0.010 : 0.0);
  gl.uniform1f(P.comp.u.uVig, 0.42);
  gl.uniform1f(P.comp.u.uAspect, W / H);
  gl.uniform1f(P.comp.u.uFlare, flare);
  gl.uniform2f(P.comp.u.uSun, sunU, sunV);
  gl.uniform3f(P.comp.u.uFlareCol, 1.0, 0.88, 0.70);
  gl.bindVertexArray(VAO.empty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);
  gl.activeTexture(gl.TEXTURE0);
}

/* ======================= 8. 界面与交互 ======================= */
const UI = { orbits: true, labels: true, moons: true, belts: true, comet: true,
             stars: true, realScale: false, bloom: true };
const TOGGLES = [
  { k: 'orbits',    n: '轨道' },
  { k: 'labels',    n: '名称' },
  { k: 'moons',     n: '卫星' },
  { k: 'belts',     n: '小行星带' },
  { k: 'comet',     n: '彗星' },
  { k: 'stars',     n: '星空' },
  { k: 'realScale', n: '真实距离比例', hot: true },
  { k: 'bloom',     n: '辉光' }
];

const $ = id => document.getElementById(id);
const blist = $('blist'), rscroll = $('rscroll'), labelBox = $('labels');

/* ---- 天体列表 ---- */
const order = ['sun'];
for (const p of PLANETS) { order.push(p.key); for (const m of MOONS) if (m.parent === p.key) order.push(m.key); }
order.push('halley');

function buildList() {
  blist.innerHTML = '';
  for (const k of order) {
    const b = BY_KEY[k];
    const d = document.createElement('div');
    d.className = 'bi' + (b.group === 'moon' ? ' sub' : '');
    d.dataset.k = k;
    d.innerHTML = '<span class="sw" style="background:' + b.color + ';color:' + b.color + '"></span>' +
                  '<span class="nm">' + b.name + '</span>';
    d.onclick = () => focusBody(k, true);
    blist.appendChild(d);
  }
}

/* ---- 标签 ---- */
function buildLabels() {
  labelBox.innerHTML = '';
  for (const k of order) {
    const b = BY_KEY[k];
    const d = document.createElement('div');
    d.className = 'lbl';
    d.innerHTML = b.name + '<b>' + (b.en || '') + '</b>';
    d.style.opacity = '0';
    labelBox.appendChild(d);
    b.labelEl = d;
  }
}

/* ---- 信息卡 ---- */
let curKey = 'earth';
const LIVE = {};
function kv(k, v, hl, id) {
  return '<div class="kv' + (hl ? ' hl' : '') + '"><span class="k">' + k +
         '</span><span class="v"' + (id ? ' id="' + id + '"' : '') + '>' + v + '</span></div>';
}
function buildInfo(k) {
  const b = BY_KEY[k];
  curKey = k;
  const isSun = b.id === 'sun', isMoon = b.group === 'moon', isCom = b.group === 'comet';
  let h = '';
  h += '<div class="iname">' + b.name + '</div><div class="ien">' + (b.en || '') + '</div>';
  h += '<div class="idesc">' + (b.desc || '') + '</div>';
  h += '<div class="warn" id="wExtrap">已超出根数有效区间（1800–2050 年外推）</div>';

  h += '<div class="sect"><div class="h">实时数据</div>';
  if (isSun) {
    h += kv('光行时到地球', '', true, 'lv0');
    h += kv('地球日心距', '', false, 'lv1');
  } else {
    h += kv('日心距离', '', true, 'lv0');
    h += kv('日心黄经 / 黄纬', '', false, 'lv1');
    h += kv('与地球距离', b.id === 'earth' ? '—' : '', false, 'lv2');
    h += kv('光行时', b.id === 'earth' ? '—' : '', false, 'lv3');
    if (b.peri != null) h += kv('近日点 / 远日点', '', false, 'lv4');
    h += kv('当前轨道速度', '', false, 'lv5');
  }
  h += '</div>';

  h += '<div class="sect"><div class="h">物理参数</div>';
  h += kv('半径', b.radius.toLocaleString('en-US') + '<u>km</u>');
  h += kv('质量', b.mass + '<u>kg</u>');
  if (!isSun) {
    h += kv('公转周期', b.period);
    h += kv('自转周期', fmtRot(b));
  } else h += kv('自转周期', fmtRot(b));
  if (!isMoon && !isSun && !isCom) h += kv('卫星数', String(b.moons));
  h += kv('温度', b.temp);
  if (isMoon) {
    const m = MOONS.find(x => x.key === b.id);
    h += kv('轨道半径', m.orbitR.toLocaleString('en-US') + '<u>km</u>');
    h += kv('轨道周期', Math.abs(m.period).toFixed(4) + '<u>天' + (m.period < 0 ? '（逆行）' : '') + '</u>');
    h += kv('轨道倾角', m.inc.toFixed(3) + '°<u>' + (m.ref === 'ecl' ? '对黄道' : '对母星赤道') + '</u>');
  }
  h += kv('大气 / 表面', b.atm);
  h += '</div>';

  if (!isSun && !isMoon) {
    h += '<div class="sect"><div class="h">轨道与自转轴</div>';
    h += kv('轨道半长轴', '', false, 'lv6');
    h += kv('轨道偏心率', '', false, 'lv7');
    h += kv('轨道倾角（对黄道）', '', false, 'lv8');
    h += kv('转轴倾角', (b.tiltBook != null ? b.tiltBook : b.tilt.toFixed(2) + '°') +
            '<u>对自身轨道面</u>');
    h += '</div>';
  }
  if (isMoon) {
    h += '<div class="sect"><div class="h">轨道</div>';
    h += kv('母星', BY_KEY[b.parent].name);
    h += kv('潮汐锁定', '是');
    h += '</div>';
  }
  h += '<div class="sect"><div class="h">距离比例</div>' +
       '<div class="kv"><span class="k">显示半径</span><span class="v">' +
       (b.rDisp).toFixed(3) + '<u>单位（幂律放大）</u></span></div></div>';

  rscroll.innerHTML = h;
  rscroll.scrollTop = 0;
  for (let i = 0; i < 9; i++) LIVE['lv' + i] = $('lv' + i);
  LIVE.wExtrap = $('wExtrap');
  for (const el of blist.children) el.classList.toggle('on', el.dataset.k === k);
  updateLive();
}
function fmtRot(b) {
  const d = Math.abs(b.rotDays);
  const s = d < 1 ? (d * 24).toFixed(2) + ' 小时' : d.toFixed(3) + ' 天';
  return s + (b.rotDays < 0 ? '<u>逆行</u>' : '');
}
function num(x, n) { return (x >= 0 ? '' : '−') + Math.abs(x).toFixed(n === undefined ? 3 : n); }
function fmtDistAU(au) {
  if (au >= 0.01) return au.toFixed(4) + ' AU';
  return (au * 149597870.7).toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' km';
}
function fmtLight(min) {
  if (min < 1) return (min * 60).toFixed(1) + ' 秒';
  if (min < 60) return min.toFixed(2) + ' 分';
  return (min / 60).toFixed(2) + ' 小时';
}
function updateLive() {
  const b = BY_KEY[curKey];
  if (!b) return;
  const year = new Date(SIM.ms).getUTCFullYear();
  if (LIVE.wExtrap) LIVE.wExtrap.classList.toggle('show', year < 1800 || year > 2050);
  if (b.id === 'sun') {
    const e = BY_KEY.earth;
    if (LIVE.lv0) LIVE.lv0.textContent = fmtLight(e.lightMin);
    if (LIVE.lv1) LIVE.lv1.textContent = e.st.r.toFixed(5) + ' AU';
    return;
  }
  const s = b.st;
  if (!s) return;
  if (LIVE.lv0) LIVE.lv0.textContent = s.r.toFixed(5) + ' AU';
  if (LIVE.lv1) {
    const lon = ((s.lon * R2D) % 360 + 360) % 360;
    LIVE.lv1.textContent = lon.toFixed(2) + '° / ' + num(s.lat * R2D, 2) + '°';
  }
  if (LIVE.lv2) LIVE.lv2.textContent = b.id === 'earth' ? '—' : fmtDistAU(b.dEarth);
  if (LIVE.lv3) LIVE.lv3.textContent = b.id === 'earth' ? '—' : fmtLight(b.lightMin);
  if (LIVE.lv4 && b.peri != null) LIVE.lv4.textContent = b.peri.toFixed(3) + ' / ' + b.apo.toFixed(3) + ' AU';
  if (LIVE.lv5) LIVE.lv5.textContent = b.speed ? b.speed.toFixed(3) + ' km/s' : '—';
  if (LIVE.lv6) LIVE.lv6.textContent = s.a.toFixed(4) + ' AU';
  if (LIVE.lv7) LIVE.lv7.textContent = s.e.toFixed(6);
  if (LIVE.lv8) LIVE.lv8.textContent = (b.ei != null ? (ELEM[b.ei][2] + RATE[b.ei][2] * SIM.T).toFixed(3) : '—') + '°';
}

/* ---- 时间显示 ---- */
const MON = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
function p2(n) { return n < 10 ? '0' + n : '' + n; }
function updateClock() {
  const d = new Date(SIM.ms);
  $('datetime').innerHTML =
    d.getUTCFullYear() + '–' + p2(d.getUTCMonth() + 1) + '–' + p2(d.getUTCDate()) +
    ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + '<small>UTC</small>';
}
function fmtSpeed(days) {
  const a = Math.abs(days);
  let s;
  if (a < 1 / 1440) s = (days * 86400).toFixed(1) + ' 秒/秒';
  else if (a < 1 / 24) s = (days * 1440).toFixed(1) + ' 分/秒';
  else if (a < 1) s = (days * 24).toFixed(2) + ' 小时/秒';
  else if (a < 365.25) s = days.toFixed(2) + ' 天/秒';
  else s = (days / 365.25).toFixed(2) + ' 年/秒';
  return s;
}
function updateSpeed() {
  const el = $('spd');
  el.textContent = SIM.playing ? fmtSpeed(SIM.daysPerSec) : '暂停';
  el.classList.toggle('rev', SIM.playing && SIM.speed < 0);
}
function setPlay(v) {
  SIM.playing = v;
  $('icPlay').style.display = v ? 'none' : '';
  $('icPause').style.display = v ? '' : 'none';
  updateSpeed();
}

/* ---- 开关 ---- */
function buildToggles() {
  const box = $('toggles');
  box.innerHTML = '';
  for (const t of TOGGLES) {
    const d = document.createElement('div');
    d.className = 'tg' + (UI[t.k] ? ' on' : '') + (t.hot ? ' hot' : '');
    d.dataset.k = t.k;
    d.innerHTML = '<span class="dot"></span><span>' + t.n + '</span>';
    d.onclick = () => {
      UI[t.k] = !UI[t.k];
      d.classList.toggle('on', UI[t.k]);
      if (t.k === 'realScale') {
        SIM.realScale = UI.realScale;
        SIM.compressTarget = UI.realScale ? COMPRESS_REAL : COMPRESS_DEF;
        orbitsDirty = true;
        $('notice').innerHTML = UI.realScale
          ? '径向距离已切换为<b>真实线性比例</b>（r<sup>1.0</sup>）。内行星塌向中心、小行星带挤成一条窄环——这才是真实的样子。'
          : '径向距离按 <b>r<sup>0.62</sup></b> 压缩，方向、黄经、相位、周期、偏心率、倾角<b>全部精确</b>。';
      }
    };
    box.appendChild(d);
  }
}

/* ---- 相机控制 ---- */
function focusBody(k, zoom) {
  const b = BY_KEY[k];
  if (!b) return;
  CAM.focus = k;
  if (zoom) CAM.goalDist = Math.max(b.rDisp * 3.8, 0.32);
  buildInfo(k);
}
let drag = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, y: e.clientY, moved: 0, t: performance.now(), id: e.pointerId };
  canvas.classList.add('grabbing');
});
canvas.addEventListener('pointermove', e => {
  if (drag && drag.id === e.pointerId) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    CAM.yaw -= dx * 0.0055;
    CAM.pitch = clamp(CAM.pitch + dy * 0.0055, -1.5, 1.5);
    drag.x = e.clientX; drag.y = e.clientY;
  } else {
    /* 悬停高亮光标 */
    let hit = false;
    for (const b of BODIES) {
      if (!b.onScreen) continue;
      const d = Math.hypot(b.screenX - e.clientX, b.screenY - e.clientY);
      if (d < Math.max(b.screenR + 6, 14)) { hit = true; break; }
    }
    canvas.classList.toggle('hit', hit);
  }
});
canvas.addEventListener('pointerup', e => {
  canvas.classList.remove('grabbing');
  if (drag && drag.id === e.pointerId) {
    if (drag.moved < 6 && performance.now() - drag.t < 600) pick(e.clientX, e.clientY);
    drag = null;
  }
});
canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('grabbing'); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(clamp(e.deltaY, -240, 240) * 0.0011);
  CAM.goalDist = clamp(CAM.goalDist * f, 0.16, 6000);
}, { passive: false });

/* 触摸双指缩放 */
let pinch = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinch = { d: Math.hypot(dx, dy) };
    drag = null;
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (pinch && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinch.d > 0) CAM.goalDist = clamp(CAM.goalDist * (pinch.d / d), 0.16, 6000);
    pinch.d = d;
    e.preventDefault();
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { pinch = null; }, { passive: true });

function pick(px, py) {
  let best = null, bestD = 1e9;
  for (const b of BODIES) {
    if (!b.onScreen) continue;
    if (b.group === 'moon' && !UI.moons) continue;
    if (b.group === 'comet' && !UI.comet) continue;
    const d = Math.hypot(b.screenX - px, b.screenY - py);
    const thr = Math.max(b.screenR + 8, 16);
    if (d < thr && d < bestD) { bestD = d; best = b; }
  }
  if (best) focusBody(best.id, true);
}

/* ---- 底部控件 ---- */
function buildControls() {
  $('bPlay').onclick = () => setPlay(!SIM.playing);
  $('bBack').onclick = () => { SIM.ms = Date.now(); SIM.speed = 44; $('slider').value = 44; updateSpeed(); };
  $('datetime').onclick = () => { SIM.ms = Date.now(); };
  const sl = $('slider');
  sl.oninput = () => { SIM.speed = parseFloat(sl.value); updateSpeed(); };
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setPlay(!SIM.playing); }
    else if (e.code === 'ArrowLeft') { SIM.speed = clamp(SIM.speed - 3, -100, 100); sl.value = SIM.speed; updateSpeed(); }
    else if (e.code === 'ArrowRight') { SIM.speed = clamp(SIM.speed + 3, -100, 100); sl.value = SIM.speed; updateSpeed(); }
    else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hideui');
  });
}

/* ---- 提示 ---- */
function hint(msg, ms) {
  const h = $('hint');
  h.textContent = msg; h.classList.add('show');
  clearTimeout(hint._t);
  hint._t = setTimeout(() => h.classList.remove('show'), ms || 3400);
}

/* ======================= 9. 主循环 ======================= */
let fpsAcc = 0, fpsN = 0, lastFpsT = 0;

function updateLabels() {
  for (const b of BODIES) {
    const el = b.labelEl;
    if (!el) continue;
    if (!UI.labels || !b.onScreen || b.screenR < 0.7) { el.style.opacity = '0'; continue; }
    if (b.group === 'moon' && !UI.moons) { el.style.opacity = '0'; continue; }
    if (b.group === 'comet' && !UI.comet) { el.style.opacity = '0'; continue; }
    const op = clamp((b.screenR - 0.7) / 5, 0, 1) * 0.92;
    el.style.opacity = op.toFixed(3);
    el.style.transform = 'translate(-50%,-50%) translate(' +
      (b.screenX).toFixed(1) + 'px,' + (b.screenY - b.screenR - 11).toFixed(1) + 'px)';
    el.classList.toggle('sel', CAM.focus === b.id);
  }
}

function frame(now) {
  const dt = Math.min(now - (SIM.lastFrameMs || now), 66);
  SIM.lastFrameMs = now;
  frameNo++;

  resize();
  updateSim(dt);

  /* 聚焦目标跟随天体 */
  if (CAM.focus && BY_KEY[CAM.focus]) {
    const b = BY_KEY[CAM.focus];
    CAM.goal[0] = b.pos[0]; CAM.goal[1] = b.pos[1]; CAM.goal[2] = b.pos[2];
  }
  updateCamera(dt);
  updateProjections();

  /* 轨道缎带：压缩过渡期间逐帧重建，其余按漂移量节流 */
  if (orbitsDirty || (frameNo % 5 === 0 && Math.abs(SIM.jd - lastOrbitJD) > 4)) buildOrbits();

  render();
  updateLabels();
  updateClock();
  if (frameNo % 6 === 0) { updateLive(); updateSpeed(); }

  fpsAcc += dt; fpsN++;
  if (now - lastFpsT > 500) {
    const f = 1000 / (fpsAcc / fpsN);
    $('fps').textContent = f.toFixed(0) + ' FPS · ' + W + '×' + H +
      (FB.useMSAA ? ' · MSAA×' + Math.min(4, MAX_SAMPLES) : ' · 无 MSAA') +
      (HDR_OK ? ' · HDR' : ' · LDR');
    fpsAcc = 0; fpsN = 0; lastFpsT = now;
  }
  requestAnimationFrame(frame);
}

/* ======================= 10. 启动 ======================= */
function init() {
  buildPrograms();
  buildGeometry();
  buildStars();
  buildBelts();
  buildBodies();
  RIB.tail = dynRibbon(9);

  SIM.compress = SIM.compressTarget = COMPRESS_DEF;
  updateSim(0);
  initOrbits();
  buildOrbits();

  buildList();
  buildLabels();
  buildToggles();
  buildControls();
  buildInfo('earth');
  CAM.focus = null;
  CAM.goal = [0, 0, 0];
  CAM.goalDist = 190;
  setPlay(true);
  SIM.speed = 44; $('slider').value = 44; updateSpeed();

  resize();
  window.addEventListener('resize', () => { resize(); });
  $('boot').classList.add('gone');
  setTimeout(() => { const b = $('boot'); if (b) b.remove(); }, 800);
  setTimeout(() => hint('拖拽旋转 · 滚轮缩放 · 点击天体聚焦 · 空格暂停 · H 隐藏界面', 5200), 900);

  requestAnimationFrame(frame);
}

try {
  init();
} catch (err) {
  console.error(err);
  const b = $('boot');
  if (b) { b.classList.remove('gone'); b.innerHTML = '<div class="err">启动失败：\n' + (err && err.message ? err.message : err) + '</div>'; }
}
</script>
</body>
</html>
