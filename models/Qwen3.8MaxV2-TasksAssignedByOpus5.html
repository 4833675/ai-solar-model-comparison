<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>太阳系实时运动模型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e0e0e0;font-size:13px}
canvas{display:block;width:100%;height:100%;position:fixed;top:0;left:0}
.panel{position:fixed;background:rgba(10,12,18,0.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:10px;pointer-events:auto}
#bodyList{left:12px;top:50%;transform:translateY(-50%);width:150px;max-height:70vh;overflow-y:auto;padding:10px 0;z-index:10}

#bodyList::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px}

#bodyList .item:hover{background:rgba(255,255,255,0.08)}

#bodyList .item.moon{padding-left:26px;font-size:11px;color:#999}

#infoPanel{right:12px;top:50%;transform:translateY(-50%);width:260px;max-height:75vh;overflow-y:auto;padding:16px;z-index:10;display:none}

#infoPanel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px}
#infoPanel h2{font-size:16px;font-weight:600;margin-bottom:10px;color:#fff}
#infoPanel .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04)}

#infoPanel .desc{margin-top:10px;font-size:11px;line-height:1.6;color:#aaa}
#timeBar{bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 18px;z-index:10}
#timeBar button{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:#ddd;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;transition:background 0.2s}

#timeBar #dateDisplay{font-family:'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums;font-size:12px;min-width:170px;text-align:center;color:#adf}
#timeBar input[type=range]{width:140px;accent-color:#5a9cff;height:3px}
#timeBar #speedLabel{font-size:10px;color:#888;min-width:80px;font-family:'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
#toggles{right:12px;bottom:14px;padding:10px 14px;z-index:10;font-size:11px}
#toggles label{display:block;padding:2px 0;cursor:pointer;color:#aaa}
#toggles label:hover{color:#fff}
#toggles input{margin-right:6px;accent-color:#5a9cff}
#labels{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
#labels .lbl3d{position:absolute;font-size:10px;letter-spacing:1px;color:rgba(220,230,255,0.85);text-shadow:0 0 4px rgba(0,0,0,0.9);transform:translate(-50%,-100%);white-space:nowrap;transition:opacity 0.3s}

.hidden{display:none!important}

<script>
"use strict";
// ===== MATH LIBRARY =====
const PI=Math.PI,TAU=PI*2,DEG=PI/180;
function mat4(){return new Float32Array(16)}
function m4ident(o){o.fill(0);o[0]=o[5]=o[10]=o[15]=1;return o}
function m4mul(o,a,b){for(let i=0;i<4;i++){const ai0=a[i],ai1=a[i+4],ai2=a[i+8],ai3=a[i+12];o[i]=ai0*b[0]+ai1*b[1]+ai2*b[2]+ai3*b[3];o[i+4]=ai0*b[4]+ai1*b[5]+ai2*b[6]+ai3*b[7];o[i+8]=ai0*b[8]+ai1*b[9]+ai2*b[10]+ai3*b[11];o[i+12]=ai0*b[12]+ai1*b[13]+ai2*b[14]+ai3*b[15]}return o}
function m4persp(o,fov,asp,n,f){const t=1/Math.tan(fov/2);o.fill(0);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o}
function m4lookAt(o,eye,ctr,up){let zx=eye[0]-ctr[0],zy=eye[1]-ctr[1],zz=eye[2]-ctr[2];let l=1/Math.hypot(zx,zy,zz);zx*=l;zy*=l;zz*=l;let xx=up[1]*zz-up[2]*zy,xy=up[2]*zx-up[0]*zz,xz=up[0]*zy-up[1]*zx;l=1/Math.hypot(xx,xy,xz);xx*=l;xy*=l;xz*=l;let yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;o[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);o[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);o[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);o[15]=1;return o}
function m4translate(o,x,y,z){m4ident(o);o[12]=x;o[13]=y;o[14]=z;return o}
function m4scale(o,s){m4ident(o);o[0]=o[5]=o[10]=s;return o}
function m4rotY(o,a){const c=Math.cos(a),s=Math.sin(a);m4ident(o);o[0]=c;o[2]=-s;o[8]=s;o[10]=c;return o}
function m4mul3(a,b){const o=mat4();return m4mul(o,a,b)}
function v3norm(v){const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l]}
function v3cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function v3dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function v3sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function v3add(a,b){return[a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
function v3scale(a,s){return[a[0]*s,a[1]*s,a[2]*s]}
function v3len(a){return Math.hypot(a[0],a[1],a[2])}
function clamp(x,a,b){return x<a?a:x>b?b:x}
function lerp(a,b,t){return a+(b-a)*t}
function smoothstep(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}

// ===== ORBITAL MECHANICS =====
const J2000=2451545.0;
function solveKepler(M,e){M=((M%TAU)+TAU+PI)%TAU-PI;let E=M+e*Math.sin(M)*(1+e*Math.cos(M));for(let i=0;i<10;i++){const dE=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=dE;if(Math.abs(dE)<1e-13)break}return E}
function orbitalPos(a,e,I,L,peri,Omega,T){
 const aa=a[0]+a[1]*T,ee=e[0]+e[1]*T,II=(I[0]+I[1]*T)*DEG,LL=L[0]+L[1]*T,pp=(peri[0]+peri[1]*T),OO=(Omega[0]+Omega[1]*T)*DEG;
 const w=(pp-OO*180/PI)*DEG, M=(LL-pp)*DEG;
 const E=solveKepler(M,ee);
 const xp=aa*(Math.cos(E)-ee), yp=aa*Math.sqrt(1-ee*ee)*Math.sin(E);
 const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(OO),sO=Math.sin(OO),cI=Math.cos(II),sI=Math.sin(II);
 const x=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp;
 const y=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp;
 const z=(sw*sI)*xp+(cw*sI)*yp;
 return[x,z,-y]; // ecliptic -> world (y-up)
}
function orbitalPosAU(a,e,I,L,peri,Omega,T){
 const aa=a[0]+a[1]*T,ee=e[0]+e[1]*T;
 const LL=L[0]+L[1]*T,pp=peri[0]+peri[1]*T;
 const M=(LL-pp)*DEG;
 const E=solveKepler(M,ee);
 const r=aa*(1-ee*Math.cos(E));
 return r;
}

// Display scaling
const SCALE=34,COMPRESS=0.62;
let compressVal=COMPRESS,compressTarget=COMPRESS;
function rDisplay(rAU){return SCALE*Math.pow(Math.max(rAU,0.001),compressVal)}
function bodyRadius(km){return 0.72*Math.pow(km/6371,0.42)}
const SUN_DISPLAY_R=4.6;

// ===== WEBGL SETUP =====
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){document.body.innerHTML='<h1 style="color:#fff;padding:40px">需要 WebGL2 支持</h1>';throw'no webgl2'}
const extFloat=gl.getExtension('EXT_color_buffer_float');
const hasHDR=!!extFloat;

let W,H,aspect;
function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 let cw=canvas.clientWidth||window.innerWidth||1920;
 let ch=canvas.clientHeight||window.innerHeight||1080;
 if(cw<2)cw=1920; if(ch<2)ch=1080;
 W=Math.floor(cw*dpr);
 H=Math.floor(ch*dpr);
 canvas.width=W;canvas.height=H;aspect=W/H;
 createFramebuffers();
}
window.addEventListener('resize',resize);

// Shader compilation
function createShader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s),src);return null}return s}
function createProgram(vs,fs){const p=gl.createProgram();gl.attachShader(p,createShader(gl.VERTEX_SHADER,vs));gl.attachShader(p,createShader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(p));return null}return p}
function getUniforms(prog,names){const u={};names.forEach(n=>u[n]=gl.getUniformLocation(prog,n));return u}

// ===== GEOMETRY =====
function createSphere(latB,lonB){
 const pos=[],idx=[];
 for(let la=0;la<=latB;la++){const th=la*PI/latB,st=Math.sin(th),ct=Math.cos(th);
  for(let lo=0;lo<=lonB;lo++){const ph=lo*TAU/lonB;pos.push(st*Math.cos(ph),ct,st*Math.sin(ph))}}
 for(let la=0;la<latB;la++)for(let lo=0;lo<lonB;lo++){const a=la*(lonB+1)+lo,b=a+lonB+1;idx.push(a,b,a+1,b,b+1,a+1)}
 return{pos:new Float32Array(pos),idx:new Uint16Array(idx)}
}
const sphereHi=createSphere(48,64),sphereLo=createSphere(24,32);
function makeMesh(geo){const vao=gl.createVertexArray();gl.bindVertexArray(vao);const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,geo.pos,gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,geo.idx,gl.STATIC_DRAW);gl.bindVertexArray(null);return{vao,count:geo.idx.length}}
const meshHi=makeMesh(sphereHi),meshLo=makeMesh(sphereLo);

// Fullscreen triangle
const fsTriVAO=gl.createVertexArray();
gl.bindVertexArray(fsTriVAO);
const fsBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,fsBuf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.bindVertexArray(null);

// ===== FRAMEBUFFERS =====
let sceneFBO,sceneTex,sceneDepth,msaaFBO,msaaRB,msaaDepth;
let bloomFBOs=[],bloomTexs=[];
const BLOOM_LEVELS=6;
function createFramebuffers(){
 // cleanup old
 [sceneFBO,msaaFBO,...bloomFBOs].forEach(f=>{if(f)gl.deleteFramebuffer(f)});
 [sceneTex,...bloomTexs].forEach(t=>{if(t)gl.deleteTexture(t)});
 if(sceneDepth)gl.deleteRenderbuffer(sceneDepth);
 if(msaaRB)gl.deleteRenderbuffer(msaaRB);
 if(msaaDepth)gl.deleteRenderbuffer(msaaDepth);
 bloomFBOs=[];bloomTexs=[];
 const fmt=hasHDR?gl.RGBA16F:gl.RGBA8;
 const type=hasHDR?gl.HALF_FLOAT:gl.UNSIGNED_BYTE;
 // Scene texture
 sceneTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,sceneTex);
 gl.texImage2D(gl.TEXTURE_2D,0,fmt,W,H,0,gl.RGBA,type,null);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);

 if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE){msaaFBO=null}
 // Bloom mip chain
 let bw=W>>1,bh=H>>1;
 for(let i=0;i<BLOOM_LEVELS;i++){

// ===== NOISE GLSL (shared) =====
const NOISE_GLSL=`
float hash11(float p){p=fract(p*0.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash13(vec3 p){p=fract(p*vec3(0.1031,0.1030,0.0973));p+=dot(p,p.yxz+33.33);return fract((p.x+p.y)*p.z);}
vec3 hash33(vec3 p){p=fract(p*vec3(0.1031,0.1030,0.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
float vnoise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
 float a=hash13(i),b=hash13(i+vec3(1,0,0)),c=hash13(i+vec3(0,1,0)),d=hash13(i+vec3(1,1,0));
 float e=hash13(i+vec3(0,0,1)),ff=hash13(i+vec3(1,0,1)),g=hash13(i+vec3(0,1,1)),h=hash13(i+vec3(1,1,1));
 return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,ff,f.x),mix(g,h,f.x),f.y),f.z);}
mat3 rot3(float a){float c=cos(a),s=sin(a);return mat3(c,0,s,0,1,0,-s,0,c);}
float fbm(vec3 p,int oct){float v=0.0,amp=0.5;mat3 r=rot3(0.73);
 for(int i=0;i<8;i++){if(i>=oct)break;v+=amp*vnoise(p);p=r*p*2.02;amp*=0.5;}return v;}
vec2 worley2(vec3 p){vec3 i=floor(p),f=fract(p);float d1=1e9,d2=1e9;
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){
  vec3 g=vec3(float(x),float(y),float(z));vec3 o=hash33(i+g);
  float d=length(g+o-f);if(d<d1){d2=d1;d1=d;}else if(d<d2){d2=d;}}
 return vec2(d1,d2);}
float sstep(float a,float b,float x){float t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
`;

// Bump mapping via screen-space derivatives
vec3 applyBump(vec3 N,vec3 wp,float h,float str){
 vec3 dpx=dFdx(wp),dpy=dFdy(wp);
 float dhx=dFdx(h),dhy=dFdy(h);
 vec3 r1=cross(dpy,N),r2=cross(N,dpx);
 float det=dot(dpx,r1);
 if(abs(det)<1e-8)return N;
 vec3 grad=(r1*dhx+r2*dhy)/det;
 return normalize(N-str*grad);
}

// Crater function
float craters(vec3 p,float freq,float depth,out float alb){
 vec3 pp=p*freq;vec3 i=floor(pp),f=fract(pp);
 float d1=1e9;float cid=0.0;
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){
  vec3 g=vec3(float(x),float(y),float(z));
  vec3 o=hash33(i+g);float d=length(g+o-f);
  if(d<d1){d1=d;cid=hash13(i+g+7.7);}}
 float rad=0.13+0.22*fract(cid*7.31);
 float t=d1/rad;
 float bowl=t<1.0?-(1.0-t*t):0.0;
 float rim=exp(-pow((t-1.0)/0.26,2.0));
 float exist=step(cid,0.74)*sstep(0.60,0.40,d1);
 float h=(bowl*0.90+rim*0.50)*depth*exist;
 alb=(bowl*0.55+rim*0.32)*exist;
 return h;
}

vec3 rockColor(vec3 p){
 float alb=0.0;float h=0.0;float a;
 h+=craters(p,5.0,1.0,a);alb+=a;
 h+=craters(p,12.0,0.52,a);alb+=a*0.5;
 h+=craters(p,28.0,0.26,a);alb+=a*0.25;
 h+=craters(p,62.0,0.13,a);alb+=a*0.12;
 float base=0.42+0.12*fbm(p*3.0,4);
 base+=alb*0.3;
 base=clamp(base+h*0.15,0.05,0.85);
 return vec3(base*0.85,base*0.82,base*0.78);
}

vec3 earthColor(vec3 p,vec3 N,vec3 L){
 float cont=fbm(p*2.8+vec3(3.7,1.2,8.1),7);
 float land=sstep(0.545,0.560,cont);
 vec3 col;
 if(land<0.5){
  float depth=sstep(0.35,0.55,cont);
  col=mix(vec3(0.01,0.04,0.18),vec3(0.01,0.12,0.35),depth);
  float shore=sstep(0.535,0.552,cont);
  col=mix(col,vec3(0.02,0.22,0.25),shore*0.5);
 }else{
  float biome=fbm(p*4.5+vec3(11.0,5.0,2.0),4);
  float lat=abs(p.y);
  vec3 green=mix(vec3(0.02,0.12,0.02),vec3(0.06,0.18,0.03),biome);
  vec3 desert=vec3(0.22,0.16,0.06);
  col=mix(green,desert,sstep(0.4,0.6,biome)*sstep(0.0,0.35,lat));
  col=mix(col,vec3(0.35,0.33,0.30),sstep(0.7,0.85,cont));
  col=mix(col,vec3(0.85,0.88,0.92),sstep(0.72,0.82,lat));
 }
 // clouds
 float cl=fbm(p*3.2+vec3(uTime*0.01,0.0,uTime*0.007),5);
 float lat=abs(p.y);
 float clAmt=sstep(0.42,0.58,cl)*(0.6+0.4*sin(lat*3.14));
 col=mix(col,vec3(0.9),clAmt*0.7);
 // ice caps
 col=mix(col,vec3(0.9,0.92,0.95),sstep(0.82,0.88,lat));
 return col;
}

vec3 marsColor(vec3 p){
 float alb=0.0;float h=0.0;float a;
 float northFactor=sstep(-0.1,0.1,p.y); // north has fewer craters
 float cDepth=mix(0.5,0.11,northFactor);
 h+=craters(p,6.0,cDepth,a);alb+=a;
 h+=craters(p,14.0,cDepth*0.5,a);alb+=a*0.5;
 h+=craters(p,32.0,cDepth*0.25,a);alb+=a*0.25;
 float base=0.5+0.15*fbm(p*3.5,4)+alb*0.2;
 vec3 col=vec3(base*0.72,base*0.27,base*0.12);
 // polar caps
 float lat=abs(p.y);
 col=mix(col,vec3(0.85,0.83,0.80),sstep(0.80,0.90,lat+0.05*fbm(p*8.0,3)));
 // Valles Marineris
 float vm=exp(-pow((p.y+0.02)/0.06,2.0))*exp(-pow((atan(p.z,p.x)-1.2)/0.5,2.0));
 col*=1.0-vm*0.4;
 return col;
}

vec3 jupiterColor(vec3 p){
 float lat=asin(clamp(p.y,-1.0,1.0))/3.14159*180.0;
 float lon=atan(p.z,p.x);
 float turb=fbm(vec3(lon*2.0,lat*0.1,uTime*0.005),4)*8.0;
 float latW=lat+turb;
 float band=sin(latW*0.7)*0.5+sin(latW*0.31)*0.3+sin(latW*0.17)*0.15+sin(latW*0.09)*0.1;
 float polar=sstep(46.0,70.0,abs(lat));
 band*=(1.0-polar*0.94);
 vec3 c1=vec3(0.72,0.55,0.35),c2=vec3(0.85,0.78,0.65),c3=vec3(0.60,0.38,0.22);
 vec3 col=mix(c1,c2,band*0.5+0.5);
 col=mix(col,c3,sstep(0.6,0.9,band)*0.4);
 // Great Red Spot
 float grsLon=lon-uTime*0.002;
 float dx=atan(sin(grsLon-0.8),cos(grsLon-0.8));
 float dy=lat+22.0;
 float grs=dx*dx/(0.28*0.28)+dy*dy/(0.13*0.13);
 if(grs<1.0){
  float ang=atan(dy,dx*2.15)+grs*3.0+uTime*0.01;
  float swirl=fbm(vec3(cos(ang)*grs*3.0,sin(ang)*grs*3.0,grs*2.0),3);
  col=mix(col,vec3(0.75,0.28,0.15),sstep(1.0,0.3,grs)*(0.6+0.4*swirl));
  col=mix(col,vec3(0.9,0.75,0.6),sstep(0.7,1.0,grs)*0.5);
 }
 return col;
}

vec3 saturnColor(vec3 p){
 float lat=asin(clamp(p.y,-1.0,1.0))/3.14159*180.0;
 float lon=atan(p.z,p.x);
 float turb=fbm(vec3(lon*1.5,lat*0.08,uTime*0.003),4)*3.4;
 float latW=lat+turb;
 float band=sin(latW*0.6)*0.4+sin(latW*0.28)*0.3+sin(latW*0.15)*0.2;
 float polar=sstep(46.0,70.0,abs(lat));
 band*=(1.0-polar*0.94);
 vec3 c1=vec3(0.82,0.72,0.50),c2=vec3(0.90,0.84,0.68);

 // hexagon at north pole

  float hexEdge=0.115/cos(hexAng);
  float hdist=abs((90.0-lat)/18.0-hexEdge);

 }

vec3 uranusColor(vec3 p){

 float band=sin(lat*6.0)*0.03;

vec3 neptuneColor(vec3 p){
 float lat=asin(clamp(p.y,-1.0,1.0));
 float lon=atan(p.z,p.x);
 float band=sin(lat*5.0)*0.04;
 vec3 col=vec3(0.15+band,0.25+band,0.72+band);
 // bright cloud streaks

 // dark spot

vec3 venusColor(vec3 p){
 float lat=asin(clamp(p.y,-1.0,1.0));
 float lon=atan(p.z,p.x);
 float swirl=fbm(vec3(lon*2.0+lat*0.5,lat*3.0,uTime*0.002),5);
 float bands=sin(lat*8.0+swirl*4.0)*0.1;
 vec3 col=vec3(0.85+bands,0.75+bands*0.8,0.55+bands*0.5);

vec3 plutoColor(vec3 p){
 float lat=asin(clamp(p.y,-1.0,1.0));
 float lon=atan(p.z,p.x);
 float base=0.4+0.15*fbm(p*4.0,4);
 vec3 col=vec3(base*0.9,base*0.82,base*0.72);
 // dark equatorial band (Cthulhu)
 col*=1.0-0.4*exp(-pow(lat/0.35,2.0))*sstep(-1.5,0.0,lon)*sstep(3.0,1.5,lon);
 // heart (Sputnik Planitia)

vec3 moonColor(vec3 p){
 float alb=0.0;float h=0.0;float a;
 h+=craters(p,5.0,1.0,a);alb+=a;
 h+=craters(p,12.0,0.52,a);alb+=a*0.5;

vec3 ioColor(vec3 p){

vec3 europaColor(vec3 p){

vec3 ganymedeColor(vec3 p){

vec3 titanColor(vec3 p){

void main(){
 vec3 N=normalize(vNormal);
 vec3 V=normalize(uCamPos-vWorldPos);
 vec3 L=sunDir();
 vec3 p=normalize(vObjPos);
 float NdL=max(dot(N,L),0.0);
 float sunInt=clamp(1.5*pow(1.0/max(uRAU,0.1),0.40),0.26,2.1);
 
 vec3 albedo;float height=0.0;float bumpStr=0.4;
 bool hasBump=true;
 
 if(uType==0){albedo=rockColor(p);} // mercury-like
 else if(uType==1){albedo=venusColor(p);hasBump=false;}
 else if(uType==2){albedo=earthColor(p,N,L);bumpStr=0.2;}
 else if(uType==3){albedo=marsColor(p);}
 else if(uType==4){albedo=jupiterColor(p);hasBump=false;}
 else if(uType==5){albedo=saturnColor(p);hasBump=false;}
 else if(uType==6){albedo=uranusColor(p);hasBump=false;}
 else if(uType==7){albedo=neptuneColor(p);hasBump=false;}
 else if(uType==8){albedo=plutoColor(p);}
 else if(uType==9){albedo=moonColor(p);}
 else if(uType==10){albedo=ioColor(p);}
 else if(uType==11){albedo=europaColor(p);hasBump=false;}
 else if(uType==12){albedo=ganymedeColor(p);}
 else if(uType==13){albedo=titanColor(p);hasBump=false;}
 else if(uType==14){albedo=moonColor(p)*0.8;} // triton/charon
 else{albedo=vec3(0.5);}
 
 if(hasBump){N=applyBump(N,vWorldPos,fbm(p*10.0,3),bumpStr);}
 
 // Ring shadow on planet
 if(uRingOuter>0.0){
  vec3 objSun=normalize((inverse(uModel)*vec4(uSunPos,1.0)).xyz-vObjPos);
  if(abs(objSun.y)>0.01){
   float t=-vObjPos.y/objSun.y;
   if(t>0.0){
    vec2 rp=vObjPos.xz+objSun.xz*t;
    float rr=length(rp)/uRadius;
    if(rr>uRingInner&&rr<uRingOuter){
     float rd=0.5; // simplified density
     NdL*=exp(-rd*1.45/abs(objSun.y));
    }
   }
  }
 }
 
 vec3 col=albedo*NdL*sunInt;
 // ambient
 col+=albedo*0.008;
 // terminator softness
 float term=sstep(-0.06,0.08,dot(N,L));
 col*=term;
 col+=albedo*NdL*sunInt*(1.0-term)*0.02;
 
 fragColor=vec4(col,1.0);
}`;

// ===== SUN SHADER =====
const sunFS=`#version 300 es
precision highp float;
in vec3 vObjPos,vWorldPos,vNormal;
uniform vec3 uCamPos;
uniform float uTime;
out vec4 fragColor;
${NOISE_GLSL}
void main(){
 vec3 N=normalize(vNormal);
 vec3 V=normalize(uCamPos-vWorldPos);
 vec3 p=normalize(vObjPos);
 float t=uTime*0.15;
 // Granulation (F2-F1)
 vec2 w1=worley2(p*76.0+vec3(t*0.3,0.0,t*0.2));
 vec2 w2=worley2(p*31.0-vec3(0.0,t*0.2,t*0.1));
 float cell1=w1.y-w1.x;
 float cell2=w2.y-w2.x;
 float gran=cell1*0.6+cell2*0.4;
 // Supergranulation
 float sgran=fbm(p*6.5+vec3(t*0.1),4);
 // Combine brightness
 float bright=0.5+gran*1.8+(sgran-0.5)*0.4;
 // Sunspots
 float spot=fbm(p*3.2+vec3(t*0.05,0.0,t*0.03),5);
 float spotMask=sstep(0.72,0.78,spot);
 float umbra=sstep(0.76,0.80,spot);
 bright*=1.0-spotMask*0.55;
 bright*=1.0-umbra*0.35;
 // Limb darkening
 float mu=max(dot(N,V),0.0);
 float limb=0.24+0.76*pow(mu,0.38);
 bright*=limb;
 // Color ramp

float solveK(float M,float e){

  const a=3.90+gaussRand()*0.09;
  const e=0.10+Math.random()*0.20;
  const I=Math.abs(gaussRand()*5)*DEG;
  const O=Math.random()*TAU,w=Math.random()*TAU,M0=Math.random()*TAU;
  const n=TAU/(365.25*Math.pow(a,1.5));
  bodies.push(a,e,I,O,w,M0,n,0.7+Math.random());
 }
 // Trojans 2000
 const jupN=TAU/(365.25*Math.pow(5.202,1.5));
 for(let i=0;i<2000;i++){
  const a=5.202+gaussRand()*0.15;
  const e=Math.abs(gaussRand()*0.08);
  const I=Math.abs(gaussRand()*12)*DEG;
  const O=Math.random()*TAU,w=Math.random()*TAU;
  const sign=i<1000?1:-1;
  const M0=(34.396*DEG)+sign*PI/3+gaussRand()*26*DEG;
  bodies.push(a,e,I,O,w,M0,jupN,0.7+Math.random());
 }
 // Kuiper 6000
 for(let i=0;i<6000;i++){
  let a,e,I;
  const r=Math.random();
  if(r<0.22){a=39.45+gaussRand()*0.55;e=Math.abs(gaussRand()*0.15);I=Math.abs(gaussRand()*12)*DEG;}
  else if(r<0.86){a=42.5+Math.random()*5.2;e=Math.random()*0.11;I=Math.abs(gaussRand()*7)*DEG;}
  else{a=48+Math.random()*32;e=0.15+Math.random()*0.35;I=Math.abs(gaussRand()*22)*DEG;}
  const O=Math.random()*TAU,w=Math.random()*TAU,M0=Math.random()*TAU;
  const n=TAU/(365.25*Math.pow(a,1.5));
  bodies.push(a,e,I,O,w,M0,n,0.5+Math.random()*0.8);
 }
 return new Float32Array(bodies);
}
function gaussRand(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}

// ===== ORBIT LINES =====
function buildOrbitLine(planet,samples){
 samples=samples||128;
 const verts=[];
 const T0=(simJD-J2000)/36525;
 for(let i=0;i<=samples;i++){
  const frac=i/samples;
  const L0=planet.L[0]+planet.L[1]*T0;
  const L=L0+frac*360;
  const pos=orbitalPos(planet.a,planet.e,planet.I,[L,0],planet.peri,planet.Om,T0);
  const rAU=v3len(pos);
  const rD=rDisplay(rAU);
  const dir=v3norm(pos);
  const wp=v3scale(dir,rD);
  verts.push(wp[0],wp[1],wp[2],-1,frac);
  verts.push(wp[0],wp[1],wp[2],1,frac);
 }
 return new Float32Array(verts);
}
let orbitVAOs=[];
function rebuildOrbits(){
 orbitVAOs.forEach(v=>gl.deleteVertexArray(v.vao));
 orbitVAOs=[];
 for(const p of PLANETS){
  const data=buildOrbitLine(p);
  const vao=gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);
  gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,1,gl.FLOAT,false,20,12);
  gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,1,gl.FLOAT,false,20,16);
  gl.bindVertexArray(null);
  orbitVAOs.push({vao,count:data.length/5});
 }
}

function buildRingMesh(inner,outer,segs){
 const verts=[],idx=[];
 for(let i=0;i<=segs;i++){
  const a=i/segs*TAU;
  const c=Math.cos(a),s=Math.sin(a);
  verts.push(c*inner,0,s*inner, c*outer,0,s*outer);
 }
 for(let i=0;i<segs;i++){
  const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);
 }
 return{pos:new Float32Array(verts),idx:new Uint16Array(idx)};
}
function makeRingMesh(inner,outer){

 const vao=gl.createVertexArray();gl.bindVertexArray(vao);
 const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
 gl.bufferData(gl.ARRAY_BUFFER,geo.pos,gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
 const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
 gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,geo.idx,gl.STATIC_DRAW);
 gl.bindVertexArray(null);
 return{vao,count:geo.idx.length};
}

function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min((now-lastTime)/1000,0.1);lastTime=now;
 animTime+=dt;
 
 // Time
 if(!paused)simJD+=timeSpeed*dt;
 const T=(simJD-J2000)/36525;
 
 // Compress animation
 compressVal+=(compressTarget-compressVal)*Math.min(1,dt/0.4);
 if(Math.abs(compressVal-compressTarget)>0.001)rebuildOrbits();
 
 // Update planet positions
 for(let i=0;i<PLANETS.length;i++){
  const p=PLANETS[i];
  const pos=orbitalPos(p.a,p.e,p.I,p.L,p.peri,p.Om,T);
  const rAU=v3len(pos);
  planetRAU[i]=rAU;
  const rD=rDisplay(rAU);
  planetPositions[i]=v3scale(v3norm(pos),rD);
  // rotation
  const rotPeriodDays=Math.abs(p.rotH)/24;
  const dPhase=clamp(TAU*(timeSpeed*dt)/rotPeriodDays,-0.22,0.22);
  rotPhases[i]+=p.rotH>0?dPhase:-dPhase;
 }
 
 // Moon positions
 for(let i=0;i<MOONS.length;i++){
  const m=MOONS[i];
  const theta=TAU*(simJD-J2000)/m.period;
  const parentPos=planetPositions[m.parent];
  const parentR=planetRadii[m.parent];
  // display distance
  const a0=MOONS.filter(mm=>mm.parent===m.parent).reduce((min,mm)=>Math.min(min,mm.orbitR),1e9);
  let base=2.35;
  if(m.parent===5)base=2.34+bodyRadius(m.radius)/parentR+0.55; // saturn rings
  const d=parentR*Math.max(base,2.35)*Math.pow(m.orbitR/a0,0.55);
  const inc=m.inc*DEG;
  let local=[Math.cos(theta)*d,0,Math.sin(theta)*d];
  // tilt by inclination
  const ci=Math.cos(inc),si=Math.sin(inc);
  local=[local[0],local[1]*ci-local[2]*si,local[1]*si+local[2]*ci];
  if(m.ref==='equator'){
   // transform by parent axis basis (simplified)
   const p2=PLANETS[m.parent];
   const tilt=p2.tilt*DEG,pl=p2.poleLon*DEG;
   const axis=[Math.sin(tilt)*Math.cos(pl),Math.cos(tilt),Math.sin(tilt)*Math.sin(pl)];
   // simplified: just add local directly
  }
  moonPositions[i]=v3add(parentPos,local);
 }
 
 // Camera target follows focused body
 if(focusBody>=0&&focusBody<PLANETS.length)camTargetGoal=[...planetPositions[focusBody]];
 else if(focusBody>=100)camTargetGoal=[...moonPositions[focusBody-100]];
 else if(focusBody===-2)camTargetGoal=[0,0,0];
 updateCamera(dt);
 
 // Matrices
 const near=Math.max(0.012,camDist*0.0035);
 const far=Math.max(camDist*14,4200);
 m4persp(projMat,50*DEG,aspect,near,far);
 m4lookAt(viewMat,eyePos,camTarget,[0,1,0]);
 m4mul(vpMat,projMat,viewMat);
 
 // Warning badge

 document.getElementById('warnBadge').style.display=(year<1800||year>2050)?'block':'none';
 
 // === RENDER ===
 const target=msaaFBO||sceneFBO;
 gl.bindFramebuffer(gl.FRAMEBUFFER,target);
 gl.viewport(0,0,W,H);
 gl.depthMask(true); // 7.1 !!!
 gl.clearColor(0,0,0,1);
 gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 
 // 1. Background
 gl.disable(gl.DEPTH_TEST);gl.depthMask(false);
 gl.useProgram(progBG);
 const invVP=mat4();invertMat4(invVP,vpMat);
 gl.uniformMatrix4fv(uBG.uInvVP,false,invVP);
 gl.uniform3fv(uBG.uCamPos,eyePos);
 gl.bindVertexArray(fsTriVAO);
 gl.drawArrays(gl.TRIANGLES,0,3);
 
 // 2. Stars
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
 gl.useProgram(progStar);
 gl.uniformMatrix4fv(uStar.uVP,false,vpMat);
 gl.uniform3fv(uStar.uCamPos,eyePos);
 gl.uniform1f(uStar.uTime,animTime);
 gl.bindVertexArray(starVAO);
 gl.drawArrays(gl.POINTS,0,STAR_COUNT);
 gl.disable(gl.BLEND);
 
 // 3. Sun
 gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.enable(gl.CULL_FACE);
 drawSun();
 
 // 4. Planets & moons
 for(let i=0;i<PLANETS.length;i++)drawPlanet(i);
 if(showMoons)for(let i=0;i<MOONS.length;i++)drawMoon(i);
 
 // 5. Orbit lines
 if(showOrbits){
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);

  gl.uniform1f(uOrbit.uWidth,1.5);
  const orbitColors=[[0.6,0.6,0.6],[0.9,0.7,0.3],[0.3,0.5,1.0],[1.0,0.4,0.2],[0.8,0.6,0.4],[0.9,0.8,0.5],[0.5,0.8,0.8],[0.3,0.4,1.0],[0.7,0.6,0.5]];
  for(let i=0;i<PLANETS.length;i++){
   gl.uniform3fv(uOrbit.uColor,orbitColors[i]);
   const T0=(simJD-J2000)/36525;
   const headFrac=((PLANETS[i].L[0]+PLANETS[i].L[1]*T0-PLANETS[i].peri[0])%360+360)%360/360;
   gl.uniform1f(uOrbit.uHeadParam,headFrac);
   gl.bindVertexArray(orbitVAOs[i].vao);
   gl.drawArrays(gl.TRIANGLE_STRIP,0,orbitVAOs[i].count);
  }

 }
 
 // 6. Asteroids
 if(showAsteroids){
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);
  gl.useProgram(progAst);

 }
 
 // 7. Atmospheres
 drawAtmospheres();
 
 // 8. Rings
 drawRings();
 
 // 9. Comet
 if(showComet)drawComet(T);
 
 // 10. Corona
 drawCorona();
 
 // Resolve MSAA
 if(msaaFBO){
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msaaFBO);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,sceneFBO);
  gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.NEAREST);
 }
 
 // === POST PROCESSING ===
 gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.CULL_FACE);
 
 if(showBloom){
  // Extract
  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFBOs[0]);
  gl.viewport(0,0,W>>1,H>>1);
  gl.useProgram(progExtract);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneTex);
  gl.uniform1i(uExtract.uTex,0);
  gl.uniform1f(uExtract.uThreshold,hasHDR?1.25:0.8);
  gl.uniform1f(uExtract.uKnee,0.6);
  gl.bindVertexArray(fsTriVAO);gl.drawArrays(gl.TRIANGLES,0,3);
  // Downsample
  for(let i=1;i<BLOOM_LEVELS;i++){
   const pw=Math.max(W>>(i),1),ph=Math.max(H>>(i),1);
   gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFBOs[i]);
   gl.viewport(0,0,pw,ph);
   gl.useProgram(progDown);
   gl.bindTexture(gl.TEXTURE_2D,bloomTexs[i-1]);
   gl.uniform1i(uDown.uTex,0);
   gl.uniform2f(uDown.uTexel,1/(pw*2),1/(ph*2));
   gl.drawArrays(gl.TRIANGLES,0,3);
  }
  // Upsample with additive blend
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  for(let i=BLOOM_LEVELS-2;i>=0;i--){
   const pw=Math.max(W>>(i+1),1),ph=Math.max(H>>(i+1),1);
   gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFBOs[i]);
   gl.viewport(0,0,Math.max(W>>(i+1),1),Math.max(H>>(i+1),1));
   gl.useProgram(progUp);
   gl.bindTexture(gl.TEXTURE_2D,bloomTexs[i+1]);
   gl.uniform1i(uUp.uTex,0);
   gl.uniform2f(uUp.uTexel,1/pw,1/ph);
   gl.drawArrays(gl.TRIANGLES,0,3);
  }
  gl.disable(gl.BLEND);
 }
 
 // Composite to screen
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);
 gl.viewport(0,0,W,H);
 gl.useProgram(progPost);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneTex);
 gl.uniform1i(uPost.uScene,0);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,bloomTexs[0]||sceneTex);
 gl.uniform1i(uPost.uBloom,1);
 gl.uniform1f(uPost.uBloomStr,showBloom?0.34:0.0);
 // Sun screen pos
 const sunClip=[0,0,0,0];
 for(let i=0;i<4;i++)sunClip[i]=vpMat[i]*0+vpMat[i+4]*0+vpMat[i+8]*0+vpMat[i+12];
 let sunVis=0;
 if(sunClip[3]>0){
  const sx=sunClip[0]/sunClip[3],sy=sunClip[1]/sunClip[3];
  if(Math.abs(sx)<1.2&&Math.abs(sy)<1.2)sunVis=1.0;
  gl.uniform2f(uPost.uSunScreen,sx*0.5+0.5,sy*0.5+0.5);
 }
 gl.uniform1f(uPost.uSunVisible,sunVis);
 gl.uniform1f(uPost.uTime,animTime);
 gl.bindVertexArray(fsTriVAO);gl.drawArrays(gl.TRIANGLES,0,3);
 
 // Labels
 updateLabels();
 
 // Date display
 const d=new Date((simJD-2440587.5)*86400000);
 document.getElementById('dateDisplay').textContent=d.toISOString().slice(0,16).replace('T',' ')+' UTC';
 
 // Live data in info panel
 updateLiveData(T);
}

function drawPlanet(i){
 const p=PLANETS[i];
 const pos=planetPositions[i];
 const r=planetRadii[i];
 // Build model matrix: translate * axis basis * rotY(phase) * scale
 const tilt=p.tilt*DEG,pl=p.poleLon*DEG;
 const axis=[Math.sin(tilt)*Math.cos(pl),Math.cos(tilt),Math.sin(tilt)*Math.sin(pl)];
 const ref=Math.abs(axis[1])<0.99?[0,1,0]:[1,0,0];
 const X=v3norm(v3cross(ref,axis));
 const Z=v3cross(axis,X);
 const model=mat4();
 const c=Math.cos(rotPhases[i]),s=Math.sin(rotPhases[i]);
 // model = T * [X axis Z] * RotY * S
 model[0]=(X[0]*c+Z[0]*s)*r;model[1]=(X[1]*c+Z[1]*s)*r;model[2]=(X[2]*c+Z[2]*s)*r;model[3]=0;
 model[4]=axis[0]*r;model[5]=axis[1]*r;model[6]=axis[2]*r;model[7]=0;
 model[8]=(-X[0]*s+Z[0]*c)*r;model[9]=(-X[1]*s+Z[1]*c)*r;model[10]=(-X[2]*s+Z[2]*c)*r;model[11]=0;
 model[12]=pos[0];model[13]=pos[1];model[14]=pos[2];model[15]=1;
 const mvp=mat4();m4mul(mvp,vpMat,model);
 // normal matrix (upper-left 3x3 of model, normalized)
 const nm=new Float32Array([model[0]/r,model[1]/r,model[2]/r,model[4]/r,model[5]/r,model[6]/r,model[8]/r,model[9]/r,model[10]/r]);
 
 gl.useProgram(progPlanet);
 gl.uniformMatrix4fv(uPlanet.uMVP,false,mvp);
 gl.uniformMatrix4fv(uPlanet.uModel,false,model);
 gl.uniformMatrix3fv(uPlanet.uNormalMat,false,nm);
 gl.uniform3fv(uPlanet.uCamPos,eyePos);
 gl.uniform3fv(uPlanet.uSunPos,[0,0,0]);
 const typeMap={rock:0,venus:1,earth:2,mars:3,jupiter:4,saturn:5,uranus:6,neptune:7,pluto:8};
 gl.uniform1i(uPlanet.uType,typeMap[p.type]||0);
 gl.uniform1f(uPlanet.uTime,animTime);
 gl.uniform1f(uPlanet.uRadius,r);
 gl.uniform1f(uPlanet.uRAU,planetRAU[i]);
 // ring shadow params
 if(p.type==='saturn'){gl.uniform1f(uPlanet.uRingInner,1.235);gl.uniform1f(uPlanet.uRingOuter,2.34);}
 else if(p.type==='uranus'){gl.uniform1f(uPlanet.uRingInner,1.60);gl.uniform1f(uPlanet.uRingOuter,2.00);}
 else{gl.uniform1f(uPlanet.uRingInner,0);gl.uniform1f(uPlanet.uRingOuter,0);}
 
 gl.bindVertexArray(meshHi.vao);
 gl.drawElements(gl.TRIANGLES,meshHi.count,gl.UNSIGNED_SHORT,0);
}

 const atmoBodies=[{idx:2,color:[0.3,0.5,1.0],h:0.035},{idx:4,color:[1.0,0.6,0.3],h:0.025},{idx:1,color:[0.9,0.8,0.5],h:0.04},{idx:5,color:[0.9,0.8,0.5],h:0.03},{idx:6,color:[0.5,0.8,0.9],h:0.03},{idx:7,color:[0.3,0.4,1.0],h:0.03}];

function drawRings(){

 gl.depthMask(false);gl.disable(gl.CULL_FACE);
 gl.useProgram(progRing);

function drawComet(T){
 const days=(simJD-HALLEY.Tp);
 const M=TAU*days/HALLEY.P;
 const E=solveKepler(M,HALLEY.e);
 const xp=HALLEY.a*(Math.cos(E)-HALLEY.e);
 const yp=HALLEY.a*Math.sqrt(1-HALLEY.e*HALLEY.e)*Math.sin(E);
 const cw=Math.cos(HALLEY.w),sw=Math.sin(HALLEY.w);
 const cO=Math.cos(HALLEY.Om),sO=Math.sin(HALLEY.Om);
 const cI=Math.cos(HALLEY.I),sI=Math.sin(HALLEY.I);
 const x=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp;
 const y=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp;
 const z=(sw*sI)*xp+(cw*sI)*yp;
 const ecl=[x,z,-y];
 const rAU=v3len(ecl);
 if(rAU>6.5)return; // too far, no tail
 const rD=rDisplay(rAU);
 const cometPos=v3scale(v3norm(ecl),rD);
 // Draw coma as small bright point + tail
 const tailLen=Math.min(3.0,(3/rAU)*(3/rAU)*2.0);
 const antiSun=v3norm(v3scale(cometPos,-1));
 // Simple tail as line strip (billboard approximation)
 const tailVerts=[];
 const segments=20;
 for(let i=0;i<=segments;i++){
  const t=i/segments;
  const tp=v3add(cometPos,v3scale(antiSun,tailLen*t));
  tailVerts.push(tp[0],tp[1],tp[2],(1-t)*0.5*(3/rAU));
 }
 // Draw with comet shader
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);
 gl.useProgram(progComet);
 gl.uniformMatrix4fv(uComet.uVP,false,vpMat);
 gl.uniform3fv(uComet.uColor,[0.4,0.6,1.0]); // ion tail blue
 const buf=gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER,buf);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(tailVerts),gl.DYNAMIC_DRAW);
 const vao=gl.createVertexArray();gl.bindVertexArray(vao);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,16,0);
 gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,1,gl.FLOAT,false,16,12);
 gl.drawArrays(gl.LINE_STRIP,0,segments+1);
 gl.deleteVertexArray(vao);gl.deleteBuffer(buf);
 gl.disable(gl.BLEND);gl.depthMask(true);
}

function drawCorona(){

}

function updateLabels(){
 ensureLabels();
 const positions=[[0,0,0],...planetPositions];
 for(let i=0;i<labelEls.length;i++){
  const sp=projectToScreen(positions[i]);
  if(!sp||Math.abs(sp[0])>1.1||Math.abs(sp[1])>1.1){labelEls[i].style.display='none';continue;}
  labelEls[i].style.display='';
  labelEls[i].style.left=((sp[0]*0.5+0.5)*100)+'%';
  labelEls[i].style.top=((-sp[1]*0.5+0.5)*100)+'%';
 }
}

function updateLiveData(T){
 if(selectedBody<0||selectedBody>=PLANETS.length)return;
 const el=document.getElementById('liveData');
 if(!el)return;
 const p=PLANETS[selectedBody];
 const pos=orbitalPos(p.a,p.e,p.I,p.L,p.peri,p.Om,T);
 const rAU=v3len(pos);
 const lon=((Math.atan2(pos[2],pos[0])/DEG)%360+360)%360; // note: world coords
 const v=29.7847*Math.sqrt(Math.max(2/rAU-1/(p.a[0]+p.a[1]*T),0.01));
 const earthPos=orbitalPos(PLANETS[2].a,PLANETS[2].e,PLANETS[2].I,PLANETS[2].L,PLANETS[2].peri,PLANETS[2].Om,T);
 const distEarth=v3len(v3sub(pos,earthPos));
 const lightTime=distEarth*499.0; // seconds (1 AU = 499 light-seconds)
 el.innerHTML=`<div class="row"><span class="lbl">日心距离</span><span class="val">${rAU.toFixed(4)} AU</span></div><div class="row"><span class="lbl">轨道速度</span><span class="val">${v.toFixed(2)} km/s</span></div><div class="row"><span class="lbl">与地球距离</span><span class="val">${distEarth.toFixed(3)} AU</span></div><div class="row"><span class="lbl">光行时</span><span class="val">${(lightTime/60).toFixed(1)} 分</span></div>`;
}

// Matrix inversion (needed for background)
function invertMat4(o,m){
 const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7];
 const a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
 const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10;
 const b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12;
 const b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30;
 const b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
 let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
 if(!det)return o;det=1/det;
 o[0]=(a11*b11-a12*b10+a13*b09)*det;o[1]=(a02*b10-a01*b11-a03*b09)*det;
 o[2]=(a31*b05-a32*b04+a33*b03)*det;o[3]=(a22*b04-a21*b05-a23*b03)*det;
 o[4]=(a12*b08-a10*b11-a13*b07)*det;o[5]=(a00*b11-a02*b08+a03*b07)*det;
 o[6]=(a32*b02-a30*b05-a33*b01)*det;o[7]=(a20*b05-a22*b02+a23*b01)*det;
 o[8]=(a10*b10-a11*b08+a13*b06)*det;o[9]=(a01*b08-a00*b10-a03*b06)*det;
 o[10]=(a30*b04-a31*b02+a33*b00)*det;o[11]=(a21*b02-a20*b04-a23*b00)*det;
 o[12]=(a11*b07-a10*b09-a12*b06)*det;o[13]=(a00*b09-a01*b07+a02*b06)*det;
 o[14]=(a31*b01-a30*b03-a32*b00)*det;o[15]=(a20*b03-a21*b01+a22*b00)*det;
 return o;
}
