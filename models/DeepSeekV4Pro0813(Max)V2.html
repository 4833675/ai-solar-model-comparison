<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#02030a;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:#e8eefc}
  canvas{display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  .panel{pointer-events:auto;background:rgba(8,12,26,.55);border:1px solid rgba(255,255,255,.12);

  #title-panel{position:absolute;top:16px;left:16px;padding:13px 18px}

  #speedline{font-size:12px;color:#6f87ad;margin-top:2px}
  #toggles{position:absolute;top:16px;right:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;

  .chip{pointer-events:auto;font-size:12px;padding:5px 11px;border-radius:999px;

  .pbtn{pointer-events:auto;display:flex;align-items:center;gap:9px;font-size:13px;padding:6px 12px;

  .pbtn:hover{background:rgba(255,255,255,.09);transform:translateX(-3px)}

  .pdot{width:9px;height:9px;border-radius:50%;flex:none}
  #infocard{width:252px;padding:13px 15px;display:none;overflow-y:auto}
  #infocard h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
  #infocard .en{font-size:11px;color:#8ba0c4;font-weight:400;letter-spacing:.5px}
  #infocard .desc{font-size:12px;color:#b7c5de;line-height:1.55;margin:8px 0 10px}
  #infocard table{width:100%;font-size:12px;border-collapse:collapse}
  #infocard td{padding:3px 0;color:#8fa6cc}
  #infocard td:first-child{color:#6f87ad;width:86px}
  #infocard td:last-child{text-align:right;color:#c6d4ee;font-variant-numeric:tabular-nums}
  #infocard .live{border-top:1px solid rgba(255,255,255,.12);margin-top:8px;padding-top:8px}
  #infocard .live td:last-child{color:#ffd98a}
  #controls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 16px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:96vw}
  .ctlbtn{pointer-events:auto;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06);color:#dbe6f9;font-size:15px;cursor:pointer;transition:all .15s;flex:none}
  .ctlbtn:hover{background:rgba(255,255,255,.14)}
  .ctlbtn.wide{width:auto;padding:0 13px;font-size:12px;letter-spacing:.5px}
  #speed-slider{width:170px;accent-color:#5e94ff;cursor:pointer}
  .sep{width:1px;height:22px;background:rgba(255,255,255,.14);flex:none}
  #hint{position:absolute;bottom:20px;left:18px;font-size:11px;color:#5c7196;letter-spacing:.5px}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:6}
  .lbl{position:absolute;font-size:12px;color:#d6e2f8;white-space:nowrap;text-align:center;
    text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.6);transition:opacity .12s}
  .lbl .en{font-size:9px;color:#8ba0c4;display:block;letter-spacing:.6px;margin-top:1px}
  .lbl.moonlbl{font-size:10px}
  #loading{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;gap:18px;align-items:center;
    justify-content:center;background:radial-gradient(1200px 700px at 50% 45%,#0a1230 0%,#02030a 70%);
    transition:opacity .7s;text-align:center;padding:0 24px}
  #loading.done{opacity:0;pointer-events:none}
  .spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.15);
    border-top-color:#6aa0ff;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadmsg{font-size:13px;color:#8fa6cf;line-height:1.8}
  #errtoast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;
    background:rgba(130,25,25,.8);color:#ffd9d9;padding:8px 15px;border-radius:10px;font-size:12px;

  @media (max-width:920px){

      overflow-x:auto;align-items:center;max-height:none}
    #planetbar{flex-direction:row}
    #infocard{display:none!important}
    #hint{display:none}
    #title-panel{padding:10px 14px}
    #title-panel h1{font-size:16px}

  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================== 基础工具 ============================== */
const RAD = Math.PI/180;
const J2000_MS = Date.UTC(2000,0,1,12);
const K = 23;                       // 显示距离压缩系数: r_display = K * a^0.5
const scaleAU = a => K*Math.sqrt(a);
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const smooth = (a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const lerp3 = (a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const mul3 = (a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const fmt = (n,d)=>n.toFixed(d);
const pad2 = n=>String(n).padStart(2,'0');
const nowDays = ()=>(Date.now()-J2000_MS)/86400000;

/* ============================== 噪声工具 ============================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makePerm(seed){
  const rnd=mulberry32(seed),p=new Uint8Array(512),base=Array.from({length:256},(_,i)=>i);
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;[base[i],base[j]]=[base[j],base[i]]}
  for(let i=0;i<512;i++)p[i]=base[i&255];
  return p;
}
function valueNoise2(perm,x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const h=(a,b)=>perm[(perm[a&255]+b)&255]/255;
  const A=h(xi,yi),B=h(xi+1,yi),C=h(xi,yi+1),D=h(xi+1,yi+1);
  return A+(B-A)*u+(C-A)*v+(A-B-C+D)*u*v;
}
function fbm2(perm,x,y,oct){
  let s=0,amp=0.5,f=1,tot=0;
  for(let i=0;i<oct;i++){s+=amp*valueNoise2(perm,x*f,y*f);tot+=amp;amp*=0.5;f*=2.05}
  return s/tot;
}

/* ============================== 程序化纹理 ============================== */
function texCanvas(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');fn(ctx,w,h);return c}
function canvasTexture(c,srgb=true){
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
  t.anisotropy=8;return t;
}
function pixelMap(ctx,w,h,fn){
  const img=ctx.createImageData(w,h),d=img.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4,r=fn(x,y);
    d[i]=clamp(r[0],0,255);d[i+1]=clamp(r[1],0,255);d[i+2]=clamp(r[2],0,255);d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
}
function rampStops(stops,t){
  if(t<=stops[0][0])return stops[0][1].slice();
  for(let i=0;i<stops.length-1;i++){
    const a=stops[i],b=stops[i+1];
    if(t<=b[0])return lerp3(a[1],b[1],smooth(0,1,(t-a[0])/(b[0]-a[0])));
  }
  return stops[stops.length-1][1].slice();
}
function makeRocky(o){ // 水星/月球: 陨石坑表面
  const perm=makePerm(o.seed);
  return texCanvas(512,256,ctx=>{
    pixelMap(ctx,512,256,(x,y)=>{
      const n=fbm2(perm,x*0.018,y*0.018,6);
      const n2=fbm2(perm,x*0.07+3,y*0.07+9,4);
      const n3=fbm2(perm,x*0.006+7,y*0.006+4,3);
      let col=lerp3(o.c1,o.c2,smooth(-0.2,1.0,n*1.2));
      col=mul3(col,0.8+0.34*n2);
      col=mul3(col,0.88+0.24*n3);
      return col;
    });
    const rnd=mulberry32(o.seed*7+3);
    for(let i=0;i<(o.craters||120);i++){
      const x=rnd()*512,y=rnd()*256,r=1.2+Math.pow(rnd(),2)*7;
      ctx.fillStyle='rgba(0,0,0,'+(0.10+rnd()*0.12)+')';
      ctx.beginPath();ctx.arc(x+r*0.18,y+r*0.18,r*0.92,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.07)';
      ctx.beginPath();ctx.arc(x-r*0.12,y-r*0.12,r*0.55,0,7);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.lineWidth=0.7;
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
    }
  });
}
function makeMars(){
  const perm=makePerm(19);
  return texCanvas(512,256,ctx=>{
    pixelMap(ctx,512,256,(x,y)=>{
      const v=y/256;
      const n=fbm2(perm,x*0.016,y*0.016,5);
      const n2=fbm2(perm,x*0.05+2,y*0.05+8,3);
      const ice=fbm2(perm,x*0.07+9,y*0.07+4,3);
      let col=lerp3([122,47,22],[219,124,64],smooth(-0.15,1.15,n*1.4));
      col=mul3(col,1-0.35*smooth(0.5,0.42,n2));
      col=mul3(col,0.9+0.2*ice);
      if(v<0.045+ice*0.03)col=[235,238,242];
      if(v>0.955-ice*0.03)col=[235,238,242];
      return col;
    });
    const rnd=mulberry32(55);
    for(let i=0;i<70;i++){
      const x=rnd()*512,y=rnd()*256,r=1+rnd()*4;
      ctx.fillStyle='rgba(60,20,8,0.22)';
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    }
  });
}
function makeVenus(){
  const perm=makePerm(23);
  return texCanvas(512,256,ctx=>{
    pixelMap(ctx,512,256,(x,y)=>{
      const v=y/256;
      const n=fbm2(perm,x*0.013,y*0.026,5);
      const x2=x+(n-0.5)*140;
      const s=fbm2(perm,x2*0.02,y*0.012,4);
      const vs=fbm2(perm,x*0.03,y*0.008,3);
      const stops=[[0,[193,152,86]],[0.32,[228,205,145]],[0.55,[212,174,109]],
        [0.75,[234,218,163]],[1,[193,152,86]]];
      let col=rampStops(stops,clamp(v+(s-0.5)*0.32,0,1));
      col=mul3(col,0.88+0.24*vs);
      return col;
    });
  });
}
function makeGasGiant(cfg){
  const perm=makePerm(cfg.seed);
  return texCanvas(512,256,ctx=>{
    pixelMap(ctx,512,256,(x,y)=>{
      const u=x/512,v=y/256;
      const n=fbm2(perm,x*cfg.fx,y*cfg.fy,5);
      const n2=fbm2(perm,x*cfg.fx*3.3+9.1,y*cfg.fy*3.3+3.7,3);
      let lat=clamp(v+(n-0.5)*cfg.turb+(n2-0.5)*(cfg.turb2||0.03),0,1);
      let col=rampStops(cfg.stops,lat);
      col=mul3(col,0.94+0.12*n2);
      for(const sp of (cfg.spots||[])){
        const dx=(u-sp.x)/sp.rx,dy=(v-sp.y)/sp.ry,d=dx*dx+dy*dy;
        if(d<1){
          const sw=fbm2(perm,x*0.06+sp.x*9,y*0.06+sp.y*5,4);
          const f=(1-d)*sp.a*smooth(1,0.86,d);
          col=lerp3(col,lerp3(sp.c1,sp.c2,sw),f);
        }
      }
      const pol=Math.abs(v-0.5)*2;
      col=mul3(col,1-0.14*pol*pol);
      return col;
    });
  });
}
function makeEarthDay(){ // CDN 纹理加载失败时的程序化地球
  const perm=makePerm(42);
  return texCanvas(1024,512,ctx=>{
    pixelMap(ctx,1024,512,(x,y)=>{
      const v=y/512;
      const n=fbm2(perm,x*0.016,y*0.016,6);
      const coast=fbm2(perm,x*0.05+11.7,y*0.05+3.1,4);
      const th=0.548+(coast-0.5)*0.045;
      const ice=fbm2(perm,x*0.07+2.2,y*0.07+6.6,3);
      let col;
      if(n>th){
        const h=Math.min(1,(n-th)/0.26);
        const dry=fbm2(perm,x*0.028+5.2,y*0.028+9.7,4);
        const latA=Math.abs(v-0.5)*2;
        if(h>0.8)col=[168,162,152];
        else if(latA>0.75)col=[148,150,148];
        else if(dry>0.6&&latA>0.16)col=[190,164,110];
        else if(dry>0.6)col=[136,128,66];
        else col=[52,110,52];
        if(h>0.5)col=lerp3(col,[130,126,116],(h-0.5)*1.4);
      }else{
        const depth=Math.min(1,(th-n)/0.24);
        if(n>th-0.012)col=[196,190,150];
        else col=lerp3([10,34,72],[28,84,140],Math.pow(depth,0.55));
      }
      if(v<0.035+ice*0.03)col=[236,241,246];
      if(v>0.965)col=[236,241,246];
      return col;
    });
  });
}
function makeNightLights(){ // 程序化夜景灯光
  const perm=makePerm(42),perm2=makePerm(77);
  return texCanvas(1024,512,ctx=>{
    pixelMap(ctx,1024,512,(x,y)=>{
      const n=fbm2(perm,x*0.016,y*0.016,6);
      const coast=fbm2(perm,x*0.05+11.7,y*0.05+3.1,4);
      const th=0.548+(coast-0.5)*0.045;
      if(n>th){
        const rnd=valueNoise2(perm2,x*0.9,y*0.9);
        if(rnd>0.982)return[255,214,140];
        if(rnd>0.94)return[120,100,70];
      }
      return[0,0,0];
    });
  });
}
function makeClouds(){
  const perm=makePerm(31);
  return texCanvas(1024,512,ctx=>{
    const img=ctx.createImageData(1024,512),d=img.data;
    for(let y=0;y<512;y++)for(let x=0;x<1024;x++){
      const i=(y*1024+x)*4;
      const n=fbm2(perm,x*0.03,y*0.018,5);
      const w=fbm2(perm,x*0.09+4.1,y*0.013+8.2,4);
      let a=smooth(0.55,0.78,n)*0.9+smooth(0.6,0.8,w)*0.45;
      a=Math.min(1,a);
      const sh=fbm2(perm,x*0.11+2,y*0.11+5,3);
      const c=190+60*sh;
      d[i]=c;d[i+1]=c;d[i+2]=c;d[i+3]=a*255;
    }
    ctx.putImageData(img,0,0);
  });
}
function makeRings1D(stops){ // 土星环: 径向剖面
  return texCanvas(1024,4,ctx=>{
    const img=ctx.createImageData(1024,4),d=img.data;
    for(let x=0;x<1024;x++){
      const t=x/1023;
      let alpha=0,base=[210,198,160];
      for(const s of stops){
        const a0=s.a*(0.82+0.36*valueNoise2(makePermPerCall,x*0.06,s.seed));
        if(t>=s.from&&t<s.to){alpha=Math.max(alpha,a0);if(s.color)base=s.color}
      }
      // 边缘淡出
      alpha*=smooth(0,0.02,t)*smooth(1,0.985,t);
      for(let y=0;y<4;y++){
        const i=(y*1024+x)*4;
        d[i]=base[0];d[i+1]=base[1];d[i+2]=base[2];d[i+3]=alpha*255;
      }
    }
    ctx.putImageData(img,0,0);
  });
}
let _ppCache={};
function makePermPerCall(){return _ppCache.r||(_ppCache.r=makePerm(99))}
function radialTex(size,stops){
  return texCanvas(size,size,ctx=>{
    const g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    for(const s of stops)g.addColorStop(s.o,s.c);

/* ============================== GLSL 噪声 ============================== */
const GLSL_NOISE = `
float hash13(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise3(vec3 p){
  vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  float n000=hash13(i),n100=hash13(i+vec3(1,0,0)),n010=hash13(i+vec3(0,1,0)),n110=hash13(i+vec3(1,1,0));
  float n001=hash13(i+vec3(0,0,1)),n101=hash13(i+vec3(1,0,1)),n011=hash13(i+vec3(0,1,1)),n111=hash13(i+vec3(1,1,1));
  return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);
}
float fbm3(vec3 p){float s=0.0,a=0.5;for(int i=0;i<4;i++){s+=a*vnoise3(p);p*=2.03;a*=0.5;}return s;}
`;

/* ============================== 开普勒求解 ============================== */
function keplerPos(el,t){
  const a=el.a,e=el.e;
  const M=(((el.M0||0)+2*Math.PI*t/el.P)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  let E = e<0.8 ? M+e*Math.sin(M) : Math.PI;
  for(let k=0;k<8;k++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
  if(!isFinite(E))E=M;
  const cE=Math.cos(E),sE=Math.sin(E);
  const x=a*(cE-e),y=a*Math.sqrt(1-e*e)*sE;
  const om=el.varpi!==undefined?(el.varpi-el.Om):el.omega;
  const co=Math.cos(om),so=Math.sin(om);
  const xp=x*co-y*so,yp=x*so+y*co;
  const ci=Math.cos(el.i),si=Math.sin(el.i);
  const y2=yp*ci,z2=yp*si;
  const cO=Math.cos(el.Om),sO=Math.sin(el.Om);
  const p=new THREE.Vector3(xp*cO-y2*sO,xp*sO+y2*cO,z2);
  return {p,r:a*(1-e*cE)};
}

  };
  mk(1.06,THREE.FrontSide,cfg.p,cfg.i);
  mk(1.28,THREE.BackSide,cfg.outerP||5,cfg.outerI||0.3);
}

function buildRing(group,inner,outer,canvasTexData){
  const geo=new THREE.RingGeometry(inner,outer,220,1);
  const pos=geo.attributes.position,uv=geo.attributes.uv;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i);
    const r=Math.sqrt(x*x+y*y);
    uv.setXY(i,(r-inner)/(outer-inner),0.5);
  }
  const mat=new THREE.MeshLambertMaterial({map:canvasTexData,transparent:true,
    side:THREE.DoubleSide,depthWrite:false});
  const ring=new THREE.Mesh(geo,mat);
  ring.rotation.x=-Math.PI/2;
  ring.renderOrder=5;
  group.add(ring);
}

function makeBelt(n,r0,r1,seed,yspread,sMin,sMax,hue){
  const geo=new THREE.IcosahedronGeometry(1,0);
  const mat=new THREE.MeshStandardMaterial({roughness:1,metalness:0});
  const inst=new THREE.InstancedMesh(geo,mat,n);
  const rnd=mulberry32(seed),D=new THREE.Object3D();
  const data={r:new Float32Array(n),a0:new Float32Array(n),y:new Float32Array(n),
    s:new Float32Array(n),rot:new Float32Array(n*3),rate:new Float32Array(n)};
  const c=new THREE.Color();
  for(let i=0;i<n;i++){
    const r=r0+Math.pow(rnd(),1.4)*(r1-r0);
    const a0=rnd()*Math.PI*2,y=(rnd()-0.5)*yspread;
    const s=sMin+Math.pow(rnd(),2)*(sMax-sMin);
    data.r[i]=r;data.a0[i]=a0;data.y[i]=y;data.s[i]=s;
    data.rot[i*3]=rnd()*Math.PI*2;data.rot[i*3+1]=rnd()*Math.PI*2;data.rot[i*3+2]=rnd()*Math.PI*2;
    const rAU=Math.pow(r/K,2);
    data.rate[i]=2*Math.PI/(365.25*Math.pow(Math.max(rAU,0.05),1.5));
    D.position.set(Math.cos(a0)*r,Math.sin(a0)*r,y);
    D.rotation.set(data.rot[i*3],data.rot[i*3+1],data.rot[i*3+2]);
    D.scale.setScalar(s);
    D.updateMatrix();
    inst.setMatrixAt(i,D.matrix);
    c.setHSL(hue+rnd()*0.06,0.25,0.2+rnd()*0.35);
    inst.setColorAt(i,c);
  }
  inst.instanceMatrix.needsUpdate=true;
  if(inst.instanceColor)inst.instanceColor.needsUpdate=true;
  scene.add(inst);
  return {inst,data};
}

function makeComet(def){
  const group=new THREE.Group();
  const head=new THREE.Mesh(new THREE.SphereGeometry(def.headR,24,24),
    new THREE.MeshBasicMaterial({color:0xe8f0ff}));
  group.add(head);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:canvasTexture(radialTex(64,[
    {o:0,c:'rgba(230,240,255,0.9)'},{o:0.4,c:'rgba(150,180,255,0.3)'},{o:1,c:'rgba(0,0,0,0)'}])),
    blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  glow.scale.set(def.headR*5,def.headR*5,1);
  group.add(glow);
  const tailMat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0},uAlpha:{value:0},uColor:{value:new THREE.Color(0.62,0.75,1.0)}},
    blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,side:THREE.DoubleSide,
    vertexShader:`varying vec2 vUv;
      void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uTime;uniform float uAlpha;uniform vec3 uColor;varying vec2 vUv;
      ${GLSL_NOISE}
      void main(){
        float n=vnoise3(vec3(vUv.x*16.0,vUv.y*5.0,uTime*0.6));
        float a=pow(1.0-abs(vUv.y*2.0-1.0),1.6)*(0.45+0.55*n)*uAlpha;
        gl_FragColor=vec4(uColor*(0.75+0.45*n),a);
      }`
  });
  const tailGeo=new THREE.CylinderGeometry(0.12,1.4,1,10,8,true);
  const tail1=new THREE.Mesh(tailGeo,tailMat);
  const tail2=new THREE.Mesh(tailGeo,tailMat.clone());
  tail2.material.uniforms.uColor.value.set(0.5,0.7,1.0);
  group.add(tail1);group.add(tail2);
  scene.add(group);
  addLabel(group,def.name,def.en,{moon:true,color:'#9fbcff',
    show:()=>state.comets&&group.userData.vis});
  return {group,head,tail1,tail2,def};
}

{
  // 哈雷彗星轨道线:用近日点时刻反推平近点角,逐点按 23·√r 压缩(近日点不会陷入太阳)
  const halley=COMETS[0];
  const Tp=(halley.TpMS-J2000_MS)/86400000;
  const hEl={a:halley.a,e:halley.e,i:halley.i,Om:halley.Om,omega:halley.omega,
    M0:(-2*Math.PI*Tp/halley.P)%(2*Math.PI),P:halley.P};
  const pts=new Float32Array(2000*3);
  let prev=new THREE.Vector3(17,0,0);
  for(let i=0;i<2000;i++){
    const res=keplerPos(hEl,i/2000*halley.P);
    let v;
    if(res.p.lengthSq()>1e-12&&isFinite(res.p.x))v=res.p.normalize().multiplyScalar(scaleAU(res.r));
    else v=prev.clone();
    prev=v;
    pts[i*3]=v.x;pts[i*3+1]=v.y;pts[i*3+2]=v.z;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pts,3));
  const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x7799cc,
    transparent:true,opacity:0.16,depthWrite:false}));

}

/* ============================== 轨迹 ============================== */
function makeTrail(cfg){
  const n=700,pos=new Float32Array(n*3),col=new Float32Array(n*3);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('color',new THREE.BufferAttribute(col,3).setUsage(THREE.DynamicDrawUsage));
  const m=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.9,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const line=new THREE.Line(g,m);
  line.frustumCulled=false;line.visible=false;
  const accent=new THREE.Color(cfg.color);
  return {line,pos,col,g,n,head:0,accent,cfg,
    init(p){for(let i=0;i<n;i++){this.pos[i*3]=p.x;this.pos[i*3+1]=p.y;this.pos[i*3+2]=p.z}},
    push(p){
      this.head=(this.head+1)%n;
      this.pos[this.head*3]=p.x;this.pos[this.head*3+1]=p.y;this.pos[this.head*3+2]=p.z;
      for(let i=0;i<n;i++){
        let age=((this.head-i)%n+n)%n/n;
        const f=Math.pow(1-age,2)*0.85;
        this.col[i*3]=this.accent.r*f;
        this.col[i*3+1]=this.accent.g*f;
        this.col[i*3+2]=this.accent.b*f;
      }
      this.g.attributes.position.needsUpdate=true;
      this.g.attributes.color.needsUpdate=true;
    }};
}

renderer.domElement.addEventListener('pointerup',e=>{
  if(!pickDown)return;
  const moved=Math.hypot(e.clientX-pickDown.x,e.clientY-pickDown.y)>8;
  const slow=performance.now()-pickDown.t>500;
  pickDown=null;
  if(moved||slow)return;
  pickNdc.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);
  pickRay.setFromCamera(pickNdc,camera);
  const hits=pickRay.intersectObjects(clickMap.map(c=>c.obj),false);
  if(hits.length){
    const entry=clickMap.find(c=>c.obj===hits[0].object);
    if(entry){cancelTour();focusBody(entry.focus);}
  }
});

// 错误提示
function toast(msg){
  const t=$('errtoast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',6000);
}
addEventListener('error',e=>toast('渲染错误: '+(e.message||'未知')+' @ '+
  (e.error&&e.error.stack?e.error.stack.split('\n').slice(0,4).join(' | '):((e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno))));
addEventListener('unhandledrejection',e=>toast('加载错误: '+(e.reason&&(e.reason.stack||e.reason.message)||e.reason)));

/* ============================== 地球高清纹理升级 ============================== */
(function upgradeEarth(){
  const base='https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/';
  const urls={day:'earth_atmos_2048.jpg',night:'earth_lights_2048.png',
    clouds:'earth_clouds_1024.png',spec:'earth_specular_2048.jpg',bump:'earth_normal_2048.jpg',
    moon:'moon_1024.jpg'};
  const loader=new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');
  const load=(k,u)=>new Promise((res,rej)=>{
    loader.load(u,t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;res([k,t])},undefined,()=>rej(k));
  });
  Promise.all(Object.entries(urls).map(([k,u])=>load(k,base+u))).then(list=>{
    const tex={};
    for(const [k,t] of list)tex[k]=t;
    const earth=PLANETS[2];
    const day=new THREE.MeshPhongMaterial({map:tex.day,specularMap:tex.spec,specular:0x2a2a2a,
      shininess:16,bumpMap:tex.bump,bumpScale:0.5});
    earth.mesh.material=day;
    earth.clouds.material.map=tex.clouds;
    earth.clouds.material.needsUpdate=true;
    earth.nightMat.uniforms.uMap.value=tex.night;
    earth.moon.mesh.material.map=tex.moon;
    earth.moon.mesh.material.needsUpdate=true;
  }).catch(()=>{/* 保留程序化纹理 */});
})();

/* ============================== 主循环 ============================== */
buildPlanets();
// 初始轨迹位置
for(const tr of trailObjs)tr.init(tr.cfg.group.position);
resetView();
// 初始显示太阳信息
showInfo(SUN_INFO);
state.selected=SUN_INFO;setActive(SUN_INFO);

const tmpV=new THREE.Vector3();
let last=performance.now();
function updateBelt(b){
  const D=new THREE.Object3D(),data=b.data,n=data.r.length;
  for(let i=0;i<n;i++){
    const ang=data.a0[i]+tDays*data.rate[i];
    D.position.set(Math.cos(ang)*data.r[i],Math.sin(ang)*data.r[i],data.y[i]);
    D.rotation.set(data.rot[i*3],data.rot[i*3+1]+ang*0.7,data.rot[i*3+2]);
    D.scale.setScalar(data.s[i]);
    D.updateMatrix();
    b.inst.setMatrixAt(i,D.matrix);
  }
  b.inst.instanceMatrix.needsUpdate=true;
}
function updatePlanets(){
  for(const cfg of PLANETS){
    const r=keplerPos(cfg.el,tDays);
    cfg.group.position.set(r.p.x*cfg.k,r.p.y*cfg.k,r.p.z*cfg.k);
    cfg.mesh.rotation.y=2*Math.PI*tDays/cfg.rotDays;
    if(cfg.clouds)cfg.clouds.rotation.y=2*Math.PI*tDays/cfg.rotDays*1.25+1.7;
    if(trailObjs.length)trailObjs[PLANETS.indexOf(cfg)].push(cfg.group.position);
  }
  // 地球
  const earth=PLANETS[2];
  earth.nightMat.uniforms.uSunDir.value.copy(earth.group.position).multiplyScalar(-1).normalize();
  // 月亮
  const mr=keplerPos(MOON_EL,tDays);
  earth.moon.group.position.copy(earth.group.position).addScaledVector(mr.p,earth.moon.k);
  earth.moon.mesh.rotation.y=2*Math.PI*tDays/MOON_EL.P;
  earth.moonLine.position.copy(earth.group.position);
  // 伽利略卫星
  const jup=PLANETS[4];
  for(const g of GALILEAN){
    const ang=g.ph+2*Math.PI*tDays/g.P;
    g.mesh.position.set(Math.cos(ang)*g.r,Math.sin(ang)*g.r,0);
    g.mesh.rotation.y=ang;
  }
}
function updateComets(){
  const sunPos=new THREE.Vector3(0,0,0);
  for(const co of cometObjs){
    const def=co.def;
    let E,M0;
    if(def.TpMS!==undefined){
      const Tp=(def.TpMS-J2000_MS)/86400000;
      M0=(-2*Math.PI*Tp/def.P)%(2*Math.PI);
    }else M0=def.M0;
    const el={a:def.a,e:def.e,i:def.i,Om:def.Om,varpi:def.Om+def.omega,M0,P:def.P};
    const res=keplerPos(el,tDays);
    // 逐点 23·√r 显示压缩:近日点也不会陷入太阳
    const len2=res.p.lengthSq();
    const dd=(len2>1e-12&&isFinite(res.p.x))?scaleAU(res.r)/Math.sqrt(len2):0;
    co.group.position.set(res.p.x*dd,res.p.y*dd,res.p.z*dd);
    const rAU=res.r;
    const vis=smooth(4.5,1.8,rAU);
    co.group.userData.vis=vis>0.03;
    co.group.visible=state.comets;
    co.head.visible=true;
    const dir=co.group.position.clone().negate().normalize();
    const len=clamp(1.5+9/(rAU*rAU),2,9);
    co.tail1.visible=vis>0.03;
    co.tail2.visible=vis>0.03;
    if(vis>0.03){
      co.tail1.position.copy(dir).multiplyScalar(len/2);
      co.tail1.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
      co.tail1.scale.set(1,len,1);
      co.tail2.position.copy(dir).multiplyScalar(len*0.62);
      co.tail2.quaternion.copy(co.tail1.quaternion);
      co.tail2.scale.set(0.42,len*1.25,1);
    }
    co.tail1.material.uniforms.uAlpha.value=vis*0.8;
    co.tail2.material.uniforms.uAlpha.value=vis*0.5;
  }
}
function updateLabels(){
  const w=innerWidth,h=innerHeight;
  const show=state.labels;
  for(const l of labelDefs){
    if(!show||(l.show&&!l.show())){l.el.style.display='none';continue}
    l.target.getWorldPosition(tmpV);
    const dCam=camera.position.distanceTo(tmpV);
    const wPos=tmpV.clone();
    tmpV.project(camera);
    if(tmpV.z>1||tmpV.z<-1||Math.abs(tmpV.x)>1.08||Math.abs(tmpV.y)>1.08){
      l.el.style.display='none';continue;
    }
    // 太阳遮挡: 天体位于太阳后方且视角被日面挡住时隐藏标签
    const dSun=camera.position.length();
    const toBody=wPos.sub(camera.position).normalize();
    const toSun=camera.position.clone().negate().normalize();
    if(dCam>dSun&&toBody.dot(toSun)>Math.cos(Math.asin(SUN_INFO.radius/dSun))){
      l.el.style.display='none';continue;
    }
    l.el.style.display='block';
    l.el.style.left=(tmpV.x*0.5+0.5)*w+'px';
    l.el.style.top=(-tmpV.y*0.5+0.5)*h-l.offset+'px';
    l.el.style.opacity=clamp(1.5-dCam/260,0.15,1);
  }
}
function updateCamera(dt){
  // 飞行补间
  if(state.fly){
    const f=state.fly;
    const t=clamp((performance.now()-f.t0)/f.dur,0,1);
    const e=t*t*(3-2*t);
    camera.position.lerpVectors(f.fromPos,f.toPos,e);
    controls.target.lerpVectors(f.fromTgt,f.toTgt,e);
    if(t>=1)state.fly=null;
  }
  // 巡游
  if(state.tour&&!state.fly){
    state.tourT+=dt;
    if(state.tourT>8){state.tourT=0;state.tourStop=(state.tourStop+1)%TOUR_SEQ.length}
    const p=TOUR_SEQ[state.tourStop];
    const target=p.group?p.group.position.clone():sunGroup.position.clone();
    const R=p.el?p.radius*6+6:(p.sun?20:0);
    const a=state.tourT*0.22+state.tourStop*1.7;
    const desired=target.clone().add(new THREE.Vector3(Math.sin(a)*R,Math.sin(a*0.6)*R*0.5+2,R*Math.cos(a)));
    const k=1-Math.exp(-dt*2.4);
    camera.position.lerp(desired,k);
    controls.target.lerp(target,1-Math.exp(-dt*3.2));
  }else if(state.follow&&state.selected&&state.selected.group&&!state.fly){
    // 跟随:保持相机相对行星的视向与距离,随行星一起移动
    const delta=camera.position.clone().sub(controls.target);
    state.selected.group.getWorldPosition(tmpV);
    controls.target.lerp(tmpV,1-Math.exp(-dt*6));
    camera.position.copy(controls.target).add(delta);
  }
}
function animate(now){
  requestAnimationFrame(animate);
  const dt=clamp((now-last)/1000,0,0.1);last=now;
  if(!state.paused)tDays+=state.daysPerSec*dt;
  // 着色器噪声统一使用墙钟时间,与模拟速度无关,避免高速模拟时星光/彗尾频闪
  const wallSec=now/1000;
  sunGroup.sunMat.uniforms.uTime.value=wallSec;
  sunGroup.children[1].material.uniforms.uTime.value=wallSec;
  starSphere.material.uniforms.uTime.value=wallSec;
  for(const co of cometObjs){
    co.tail1.material.uniforms.uTime.value=wallSec;
    co.tail2.material.uniforms.uTime.value=wallSec;
  }
  sunGroup.rotation.y=2*Math.PI*tDays/25.38;
  updatePlanets();
  updateComets();
  if(state.belt){updateBelt(belt);updateBelt(kuiper)}
  updateCamera(dt);
  starSphere.position.copy(camera.position);
  controls.update();
  updateLabels();
  updateInfoLive();
  $('clock').textContent=fmtDate(J2000_MS+tDays*86400000);
  $('speedline').textContent=(state.paused?'已暂停 · ':'速度: ')+fmtSpeed(state.daysPerSec);
  composer.render();
  $('debug').dataset.ready='1';
}
animate(performance.now());
$('loading').classList.add('done');

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
window.__SOLAR_OK=true;
// 调试句柄(便于诊断)
window.__solar={belt,kuiper,planets:PLANETS,state,camera,controls};
</script>
