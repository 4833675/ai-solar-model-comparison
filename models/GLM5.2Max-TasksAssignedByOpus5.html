  if (key.startsWith("moon:")) {
    const en = key.slice(5);
    const m = MOONS.find(x => x.en === en);
    const parent = bodyStates.find(b => b.key === m.parent);
    pos = parent ? parent.worldPos : [0,0,0];
    rad = displayRadius(m.radius_km);
  } else {
    const b = bodyStates.find(x => x.key === key);
    pos = b ? b.worldPos : [0,0,0];
    rad = b ? b.radius : 1;
  }
  focusBody(pos, rad);
}

function updateUI() {
  document.getElementById("dateDisplay").textContent = formatDateUTC(simTimeMs);
  // 速度标签
  const v = timeSpeed;
  const lbl = document.getElementById("speedLabel");
  if (v === 0) lbl.textContent = "实时";
  else {
    const sds = Math.sign(v) * 1.157407e-5 * Math.pow(10, Math.abs(v)/100 * 8.55);
    const a = Math.abs(sds);
    let s;
    if (a < 1/86400) s = (a*86400).toFixed(2) + " 秒/秒";
    else if (a < 1/3600) s = (a*3600*24).toFixed(1) + " 分/秒";
    else if (a < 1/24) s = (a*24).toFixed(1) + " 时/秒";
    else if (a < 1) s = a.toFixed(2) + " 天/秒";
    else if (a < 365.25) s = a.toFixed(1) + " 天/秒";
    else s = (a/365.25).toFixed(2) + " 年/秒";
    lbl.textContent = (v < 0 ? "-" : "") + s;
  }
  // 信息面板（每帧更新实时数据）
  updateInfoPanel();
  // 标签
  updateLabels();
}

function updateInfoPanel() {
  const el = document.getElementById("infoPanel");
  const key = selectedKey;
  if (key.startsWith("moon:")) {
    const en = key.slice(5);
    const m = MOONS.find(x => x.en === en);

    const jd = unixMsToJD(simTimeMs);

    const lonDeg = ((o.lon * 180 / Math.PI) % 360 + 360) % 360;
    const latDeg = o.lat * 180 / Math.PI;
    // 与地球距离
    const earth = computeOrbit(PLANET_ELEMENTS.earth, T);
    const dx = o.x - earth.x, dy = o.y - earth.y, dz = o.z - earth.z;
    const distAU = Math.sqrt(dx*dx+dy*dy+dz*dz);
    const lightTimeMin = distAU * 8.3167; // 分钟
    // 近远日点
    const el0 = PLANET_ELEMENTS[key];
    const periAU = o.a * (1 - o.e);
    const apoAU = o.a * (1 + o.e);
    // 速度
    const v_kms = 29.7847 * Math.sqrt(Math.max(0.0001, 2/o.r - 1/o.a));
    realtimeRows = `
      <div class="info-section-title">实时数据</div>
      <div class="info-row"><span class="k">日心距离</span><span class="v">${o.r.toFixed(4)} AU</span></div>
      <div class="info-row"><span class="k">黄经</span><span class="v">${lonDeg.toFixed(2)}°</span></div>
      <div class="info-row"><span class="k">黄纬</span><span class="v">${latDeg.toFixed(2)}°</span></div>
      <div class="info-row"><span class="k">距地球</span><span class="v">${distAU.toFixed(3)} AU</span></div>
      <div class="info-row"><span class="k">光行时</span><span class="v">${lightTimeMin.toFixed(1)} 分钟</span></div>
      <div class="info-row"><span class="k">近日点</span><span class="v">${periAU.toFixed(3)} AU</span></div>
      <div class="info-row"><span class="k">远日点</span><span class="v">${apoAU.toFixed(3)} AU</span></div>
      <div class="info-row"><span class="k">轨道速度</span><span class="v">${v_kms.toFixed(2)} km/s</span></div>
    `;
  }
  // 诚实性警告
  const year = new Date(simTimeMs).getUTCFullYear();
  let warn = "";
  if (year < 1800 || year > 2050) {
    warn = `<div class="info-warn">已超出根数有效区间（1800–2050 年），数值为外推</div>`;
  }
  // 比例说明
  let scaleNote = "";

    scaleNote = `<div style="font-size:10.5px;color:rgba(180,200,230,0.5);margin-top:6px;">距离按幂律压缩，但角位置精确</div>`;
  }
  const physRows = `
    <div class="info-section-title">物理参数</div>
    <div class="info-row"><span class="k">半径</span><span class="v">${phys.radius_km.toLocaleString()} km</span></div>
    <div class="info-row"><span class="k">质量</span><span class="v">${phys.mass_kg.toExponential(3)} kg</span></div>
    ${key !== "sun" ? `<div class="info-row"><span class="k">公转周期</span><span class="v">${formatPeriod(phys.period_d)}</span></div>` : ""}
    ${key !== "sun" ? `<div class="info-row"><span class="k">轨道偏心率</span><span class="v">${PLANET_ELEMENTS[key].e.toFixed(5)}</span></div>` : ""}
    ${key !== "sun" ? `<div class="info-row"><span class="k">轨道倾角</span><span class="v">${PLANET_ELEMENTS[key].I.toFixed(3)}°</span></div>` : ""}
    <div class="info-row"><span class="k">转轴倾角</span><span class="v">${Math.abs(ROTATION[key].tilt).toFixed(2)}°</span></div>
    <div class="info-row"><span class="k">自转周期</span><span class="v">${formatRotH(ROTATION[key].rotH)}</span></div>
    <div class="info-row"><span class="k">卫星数</span><span class="v">${phys.moons}</span></div>
    ${phys.temp ? `<div class="info-row"><span class="k">表面温度</span><span class="v">${phys.temp}</span></div>` : ""}
    ${phys.atm ? `<div class="info-row"><span class="k">大气</span><span class="v">${phys.atm}</span></div>` : ""}
  `;
  el.innerHTML = `
    <div class="info-title">${PHYS_NAMES[key].zh}</div>
    <div class="info-en">${PHYS_NAMES[key].en}</div>
    ${warn}
    ${realtimeRows}
    ${physRows}
    <div class="info-desc">${phys.desc}</div>
    ${scaleNote}
  `;
}

function formatPeriod(d) {
  if (d < 365.25) return d.toFixed(2) + " 天";
  return (d / 365.25).toFixed(2) + " 年";
}
function formatRotH(h) {
  const a = Math.abs(h);
  if (a < 48) return a.toFixed(2) + " 小时" + (h < 0 ? " (逆行)" : "");
  return (a / 24).toFixed(2) + " 天" + (h < 0 ? " (逆行)" : "");
}

// 标签：把可见天体投影到屏幕
function updateLabels() {
  if (!Toggles.names) { labelsEl.innerHTML = ""; return; }
  const view = computeViewMatrix();
  const aspect = width / height;
  const eyeDist = V.len(camera.eye);
  const near = Math.max(0.012, eyeDist * 0.0035);
  const far = Math.max(eyeDist * 14, 4200);
  const proj = M.perspective(camera.fov, aspect, near, far);
  const vp = M.mul(proj, view);
  let html = "";
  for (const b of bodyStates) {
    if (b.key === "sun") continue;
    const clip = M.transformPoint(vp, b.worldPos);
    if (clip[2] > 1 || clip[2] < -1) continue;
    const sx = (clip[0] * 0.5 + 0.5) * window.innerWidth;
    const sy = (-clip[1] * 0.5 + 0.5) * window.innerHeight;
    // 视半径（像素）
    const dist = V.len(V.sub(camera.eye, b.worldPos));
    const viewR = b.radius / Math.max(dist, 0.001);
    const pxR = viewR * Math.min(window.innerHeight, window.innerWidth) * 0.5 / Math.tan(camera.fov * 0.5);
    const alpha = Math.max(0, Math.min(1, 1 - pxR * 0.02));
    html += `<div class="body-label" style="left:${sx}px;top:${sy}px;opacity:${alpha.toFixed(2)}">${b.name}</div>`;
  }
  labelsEl.innerHTML = html;
}

// =====================================================================
// 15. 输入处理
// =====================================================================
let dragging = false, lastX = 0, lastY = 0;
let pinchDist = 0;
canvas.addEventListener("pointerdown", e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  camera.yaw -= dx * 0.005;
  camera.pitch = Math.max(-1.5, Math.min(1.5, camera.pitch + dy * 0.005));
});
canvas.addEventListener("pointerup", e => { dragging = false; });
canvas.addEventListener("pointercancel", e => { dragging = false; });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = Math.exp(e.deltaY * 0.001);
  camera.dist = Math.max(0.5, Math.min(8000, camera.dist * factor));
}, { passive: false });

// 触摸双指缩放
let touchD = 0;
canvas.addEventListener("touchmove", e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.sqrt(dx*dx+dy*dy);
    if (touchD > 0) {
      camera.dist = Math.max(0.5, Math.min(8000, camera.dist * (touchD / d)));
    }
    touchD = d;
  }
}, { passive: false });
canvas.addEventListener("touchend", e => { if (e.touches.length < 2) touchD = 0; });

// 点击拾取
canvas.addEventListener("click", e => {
  // 拖拽过则不算点击
  if (Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) > 4 && dragging) return;
  pickBody(e.clientX, e.clientY);
});
function pickBody(cx, cy) {
  const view = computeViewMatrix();
  const aspect = width / height;
  const eyeDist = V.len(camera.eye);
  const near = Math.max(0.012, eyeDist * 0.0035);
  const far = Math.max(eyeDist * 14, 4200);
  const proj = M.perspective(camera.fov, aspect, near, far);
  const vp = M.mul(proj, view);
  let best = null, bestD = 30;
  for (const b of bodyStates) {
    const clip = M.transformPoint(vp, b.worldPos);
    if (clip[2] > 1 || clip[2] < -1) continue;
    const sx = (clip[0] * 0.5 + 0.5) * window.innerWidth;
    const sy = (-clip[1] * 0.5 + 0.5) * window.innerHeight;
    const d = Math.hypot(cx - sx, cy - sy);
    if (d < bestD) { bestD = d; best = b; }
  }
  if (best) selectBody(best.key);
}

// 键盘
window.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowRight") { timeSpeed = Math.min(100, timeSpeed + 5); document.getElementById("speedSlider").value = timeSpeed; }
  else if (e.code === "ArrowLeft") { timeSpeed = Math.max(-100, timeSpeed - 5); document.getElementById("speedSlider").value = timeSpeed; }
  else if (e.key === "h" || e.key === "H") { document.body.classList.toggle("ui-hidden"); }
});

function togglePlay() {
  paused = !paused;
  document.getElementById("playBtn").textContent = paused ? "▶" : "❚❚";
}

// 控制按钮
document.getElementById("playBtn").onclick = togglePlay;
document.getElementById("nowBtn").onclick = () => { simTimeMs = Date.now(); };
document.getElementById("rewindBtn").onclick = () => { timeSpeed = Math.max(-100, timeSpeed - 15); document.getElementById("speedSlider").value = timeSpeed; };
document.getElementById("fastBtn").onclick = () => { timeSpeed = Math.min(100, timeSpeed + 15); document.getElementById("speedSlider").value = timeSpeed; };

// =====================================================================
// 16. 启动
// =====================================================================
function start() {
  resize();
  initGLResources();
  buildBodyList();
  buildToggles();
  // 先做一次渲染，填充 bodyStates，再聚焦地球
  render();
  selectBody("earth");
  // 渲染循环：IAB 后台时 rAF 可能被节流，用 setInterval 作为主驱动保证稳定 30 fps
  let lastFrameMs = performance.now();
  function rafLoop(t) {
    lastFrameMs = t;
    frame(t);
    requestAnimationFrame(rafLoop);
  }
  requestAnimationFrame(rafLoop);
  // 兜底：rAF 节流时由 setInterval 接管
  setInterval(() => {
    if (performance.now() - lastFrameMs > 60) {
      const t = performance.now();
      lastFrameMs = t;
      frame(t);
    }
  }, 33);
}

// 确保 PHYS_NAMES 在使用前已定义（移到顶部以避免 TDZ）
// （已在前面定义）

start();
</script>
