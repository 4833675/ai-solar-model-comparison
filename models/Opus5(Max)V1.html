<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>太阳系 · Solar System Orrery</title>
<style>
:root{
  --bg:#04050a; --panel:rgba(9,13,22,.70); --line:rgba(126,166,224,.16);
  --tx:#cbdcf2; --tx2:#7f92ab; --amber:#ffb35c; --cyan:#6fd3ff; --hot:#ff6a45;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.06em;white-space:nowrap;
  pointer-events:auto;cursor:pointer;opacity:0;transition:opacity .25s;will-change:transform}
.lbl .dot{width:5px;height:5px;border:1px solid currentColor;border-radius:50%;display:inline-block;
  vertical-align:middle;margin-right:5px;opacity:.85}
.lbl b{font-weight:500}
.lbl i{font-style:normal;opacity:.45;font-size:9px;margin-left:5px;letter-spacing:.1em}
.lbl:hover{text-shadow:0 0 8px currentColor}
.lbl.sel{text-shadow:0 0 10px currentColor}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:12px}
#hud .panel{position:absolute;pointer-events:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:0 8px 40px rgba(0,0,0,.55)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

#left{position:absolute;left:14px;top:14px;bottom:14px;width:238px;display:flex;
  flex-direction:column;gap:10px;pointer-events:none}
#hud #left>.panel{position:relative;left:auto;top:auto;right:auto;bottom:auto;
  width:100%;pointer-events:auto}
#top{padding:11px 14px 12px;flex:0 0 auto}
#top .t1{font-size:15px;letter-spacing:.34em;font-weight:300}
#top .t2{font-size:8.5px;letter-spacing:.42em;color:var(--tx2);margin:3px 0 9px}
#clock{font-size:19px;letter-spacing:.03em;color:#fff;font-weight:300;line-height:1.15}
#clockd{font-size:10px;color:var(--tx2);letter-spacing:.13em;margin-top:2px}
#rate{font-size:10.5px;color:var(--amber);margin-top:7px;letter-spacing:.06em}
#jd{font-size:9px;color:#54627a;margin-top:2px}

#stats{position:absolute;right:14px;top:14px;pointer-events:none;text-align:right;
  font-family:var(--mono);font-size:9.5px;color:#5d6c82;line-height:1.55;letter-spacing:.05em}
#stats b{color:var(--cyan);font-weight:400}

#nav{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px}
#nav::-webkit-scrollbar{width:4px}#nav::-webkit-scrollbar-thumb{background:rgba(126,166,224,.2);border-radius:2px}
.grp{font-size:8.5px;letter-spacing:.24em;color:#4e5c72;padding:8px 8px 4px}
.it{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;transition:background .14s}
.it:hover{background:rgba(126,166,224,.09)}
.it.on{background:rgba(255,179,92,.13)}
.it .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 7px currentColor}
.it .nm{font-size:11.5px}
.it .en{font-size:8.5px;color:#5c6a80;margin-left:auto;letter-spacing:.09em}
.it.sub{padding-left:22px}.it.sub .nm{font-size:10.5px;color:#9db0c8}
.it.sub .sw{width:6px;height:6px}

#info{flex:0 1 auto;min-height:0;max-height:52%;overflow-y:auto;overflow-x:hidden;padding:12px 14px}
#info::-webkit-scrollbar{width:4px}#info::-webkit-scrollbar-thumb{background:rgba(126,166,224,.2);border-radius:2px}
#info h3{font-size:14px;font-weight:400;letter-spacing:.09em;display:flex;align-items:baseline;gap:7px}
#info h3 span{font-size:8.5px;color:#5c6a80;letter-spacing:.16em}
#info .desc{font-size:10px;line-height:1.62;color:#8ea2ba;margin:8px 0 9px}
#info table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:9.5px}
#info td{padding:2.5px 0;vertical-align:top}
#info td:first-child{color:#5f6e85;letter-spacing:.05em}
#info td:last-child{text-align:right;color:#d3e2f5}
#info .live td:last-child{color:var(--cyan)}

#cfg{right:14px;top:66px;width:214px;padding:10px 13px 12px;max-height:calc(100vh - 148px);overflow-y:auto}
#cfg::-webkit-scrollbar{width:4px}#cfg::-webkit-scrollbar-thumb{background:rgba(126,166,224,.2);border-radius:2px}
#cfg .sec{font-size:8.5px;letter-spacing:.24em;color:#4e5c72;margin:11px 0 6px}
#cfg .sec:first-child{margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;padding:3.5px 0;font-size:10.5px;color:#a9bcd3}
.row .v{font-family:var(--mono);font-size:9px;color:var(--cyan);min-width:44px;text-align:right}
.sw2{width:28px;height:15px;border-radius:8px;background:rgba(126,166,224,.15);position:relative;cursor:pointer;
  transition:background .18s;flex:0 0 auto}
.sw2:after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
  background:#6d7f96;transition:.18s}
.sw2.on{background:rgba(255,179,92,.3)}.sw2.on:after{left:15px;background:var(--amber);box-shadow:0 0 8px var(--amber)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:rgba(126,166,224,.2);
  border-radius:2px;outline:none;margin:6px 0 3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--amber);cursor:pointer;box-shadow:0 0 8px rgba(255,179,92,.65)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--amber);cursor:pointer}

#bar{left:50%;transform:translateX(-50%);bottom:14px;padding:8px 12px;display:flex;align-items:center;gap:9px}
.btn{width:29px;height:29px;border-radius:7px;border:1px solid var(--line);background:rgba(126,166,224,.05);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#a9bcd3;transition:.15s;flex:0 0 auto}
.btn:hover{background:rgba(126,166,224,.15);color:#fff;border-color:rgba(126,166,224,.4)}
.btn.act{color:var(--amber);border-color:rgba(255,179,92,.4);background:rgba(255,179,92,.1)}
.btn svg{width:13px;height:13px;fill:currentColor}
.btn.w{width:auto;padding:0 11px;font-size:10px;letter-spacing:.09em}
#speed{width:132px}
#spdlab{font-family:var(--mono);font-size:9.5px;color:var(--amber);min-width:74px;text-align:center;letter-spacing:.03em}

#load{position:fixed;inset:0;z-index:100;background:#04050a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity .8s}
#load .lt{font-size:13px;letter-spacing:.55em;color:#8ea2ba;font-weight:300;text-indent:.55em}
#load .lb{width:230px;height:1px;background:rgba(126,166,224,.16);overflow:hidden}
#load .lf{height:100%;width:0;background:linear-gradient(90deg,var(--hot),var(--amber),var(--cyan));
  transition:width .3s;box-shadow:0 0 12px var(--amber)}
#load .ls{font-family:var(--mono);font-size:9px;color:#4e5c72;letter-spacing:.14em;height:11px}
#load.gone{opacity:0;pointer-events:none}
#err{position:fixed;left:20px;bottom:20px;right:20px;z-index:200;background:#2a0d0d;border:1px solid #7a2b2b;
  color:#ffb3b3;font-family:var(--mono);font-size:11px;padding:12px;border-radius:8px;display:none;
  white-space:pre-wrap;max-height:44vh;overflow:auto}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:9;font-size:10px;color:#5d6c82;
  letter-spacing:.11em;pointer-events:none;transition:opacity 1s;text-align:center;line-height:1.7}
.hid{display:none!important}
@media (max-height:560px){#info{max-height:38%}}
@media (max-width:1100px){#left{bottom:74px}}
@media (max-width:920px){#nav,#cfg,#info{display:none}#left{bottom:auto}
  #bar{gap:6px;padding:6px 8px}#speed{width:84px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>

<div id="hud">
  <div id="stats" class="mono"></div>

  <div id="left">
  <div id="top" class="panel">
    <div class="t1">太阳系</div>
    <div class="t2">SOLAR SYSTEM ORRERY</div>
    <div id="clock" class="mono">—</div>
    <div id="clockd" class="mono">—</div>
    <div id="rate" class="mono">—</div>
    <div id="jd" class="mono">—</div>
  </div>

  <div id="nav" class="panel"></div>

  <div id="info" class="panel">
    <h3><em id="ifn" style="font-style:normal">太阳</em><span id="ife">SOL</span></h3>
    <div class="desc" id="ifd"></div>
    <table id="ift"></table>
  </div>
  </div><!-- /#left -->

  <div id="cfg" class="panel"></div>

  <div id="bar" class="panel">
    <div class="btn" id="bBack" title="减速 [←]"><svg viewBox="0 0 24 24"><path d="M11 19V5l-9 7 9 7zm11 0V5l-9 7 9 7z"/></svg></div>
    <div class="btn act" id="bPlay" title="暂停 / 播放 [空格]"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></div>
    <div class="btn" id="bFwd" title="加速 [→]"><svg viewBox="0 0 24 24"><path d="M13 5v14l9-7-9-7zM2 5v14l9-7-9-7z"/></svg></div>
    <input type="range" id="speed" min="-9" max="9" step="0.01" value="4">
    <div id="spdlab" class="mono">1 天/秒</div>
    <div class="btn w" id="bNow" title="回到此刻">现在</div>
    <div class="btn w" id="bAll" title="俯瞰全系 [O]">全景</div>
    <div class="btn" id="bUI" title="隐藏界面 [H]"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg></div>
  </div>
</div>

<div id="hint">拖拽旋转 · 滚轮缩放 · 点击天体聚焦 · 双击自由视角<br>空格暂停 · ←→ 调速 · O 全景 · H 隐藏界面</div>
<div id="err"></div>
<div id="load">
  <div class="lt">太阳系</div>
  <div class="lb"><div class="lf" id="lf"></div></div>
  <div class="ls" id="ls">INITIALIZING</div>
</div>
<script>
"use strict";
window.onerror=function(m,s,l,c,e){var d=document.getElementById('err');
  d.style.display='block';d.textContent='ERROR: '+m+'  @'+l+':'+c+'\n'+(e&&e.stack?e.stack:'');};
/* ============================================================================
   0.  数学工具 / MATH
   ========================================================================== */
const PI=Math.PI, TAU=PI*2, D2R=PI/180, R2D=180/PI;
const AU=149597870.7;            // km
const J2000=2451545.0;
const OBL=23.4392911*D2R;        // 黄赤交角

const v3=(x=0,y=0,z=0)=>[x,y,z];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

function m4(){return new Float32Array(16);}
function m4id(o){o=o||m4();o.fill(0);o[0]=o[5]=o[10]=o[15]=1;return o;}
function m4mul(a,b,o){o=o||m4();
  for(let c=0;c<4;c++){const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    o[c*4  ]=a[0]*b0+a[4]*b1+a[8 ]*b2+a[12]*b3;
    o[c*4+1]=a[1]*b0+a[5]*b1+a[9 ]*b2+a[13]*b3;
    o[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;
    o[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;}
  return o;}
function m4persp(fovy,asp,n,f,o){o=o||m4();o.fill(0);
  const t=1/Math.tan(fovy*.5);
  o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
/* 仅旋转的视图矩阵(相机相对渲染,平移恒为0) */
function m4viewRot(r,u,f,o){o=m4id(o);
  o[0]=r[0];o[4]=r[1];o[8] =r[2];
  o[1]=u[0];o[5]=u[1];o[9] =u[2];
  o[2]=-f[0];o[6]=-f[1];o[10]=-f[2];return o;}
/* 由三个基向量+平移+缩放构造模型矩阵 */
function m4basis(x,y,z,p,s,o){o=o||m4();
  o[0]=x[0]*s;o[1]=x[1]*s;o[2]=x[2]*s;o[3]=0;
  o[4]=y[0]*s;o[5]=y[1]*s;o[6]=y[2]*s;o[7]=0;
  o[8]=z[0]*s;o[9]=z[1]*s;o[10]=z[2]*s;o[11]=0;
  o[12]=p[0];o[13]=p[1];o[14]=p[2];o[15]=1;return o;}
function m4inv(m,o){o=o||m4();
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],
        a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,
        b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,
        b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06; if(!d)return m4id(o); d=1/d;
  o[0]=(a11*b11-a12*b10+a13*b09)*d; o[1]=(a02*b10-a01*b11-a03*b09)*d;
  o[2]=(a31*b05-a32*b04+a33*b03)*d; o[3]=(a22*b04-a21*b05-a23*b03)*d;
  o[4]=(a12*b08-a10*b11-a13*b07)*d; o[5]=(a00*b11-a02*b08+a03*b07)*d;
  o[6]=(a32*b02-a30*b05-a33*b01)*d; o[7]=(a20*b05-a22*b02+a23*b01)*d;
  o[8]=(a10*b10-a11*b08+a13*b06)*d; o[9]=(a01*b08-a00*b10-a03*b06)*d;
  o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;
  o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;
  o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d;return o;}

/* 赤道 -> 黄道 (J2000) */
function eq2ecl(x,y,z){return [x, y*Math.cos(OBL)+z*Math.sin(OBL), -y*Math.sin(OBL)+z*Math.cos(OBL)];}
function radec2vec(ra,dec){const c=Math.cos(dec*D2R);return [c*Math.cos(ra*D2R),c*Math.sin(ra*D2R),Math.sin(dec*D2R)];}
/* 由自转极(赤经/赤纬,度)构造天体固连坐标基 (黄道系) */
function poleFrame(ra,dec){
  const p=norm(eq2ecl(...radec2vec(ra,dec)));
  let n=cross([0,0,1],p);
  if(len(n)<1e-7)n=[1,0,0];
  n=norm(n);
  return {p:p,x0:n,y0:norm(cross(p,n))};
}

/* ============================================================================
   1.  历表 / EPHEMERIS  (JPL Standish 近似根数, 1800–2050)
       a[AU] e i[°] L[°] ϖ[°] Ω[°]  + 每儒略世纪变率
   ========================================================================== */
const PLEL={
mercury:[ 0.38709927,0.20563593, 7.00497902, 252.25032350, 77.45779628, 48.33076593,
          0.00000037,0.00001906,-0.00594749,149472.67411175, 0.16047689,-0.12534081],
venus:  [ 0.72333566,0.00677672, 3.39467605, 181.97909950,131.60246718, 76.67984255,
          0.00000390,-0.00004107,-0.00078890,58517.81538729, 0.00268329,-0.27769418],
embary: [ 1.00000261,0.01671123,-0.00001531, 100.46457166,102.93768193,  0.0,
          0.00000562,-0.00004392,-0.01294668,35999.37244981, 0.32327364,  0.0],
mars:   [ 1.52371034,0.09339410, 1.84969142,  -4.55343205,-23.94362959, 49.55953891,
          0.00001847,0.00007882,-0.00813131,19140.30268499, 0.44441088,-0.29257343],
jupiter:[ 5.20288700,0.04838624, 1.30439695,  34.39644051, 14.72847983,100.47390909,
         -0.00011607,-0.00013253,-0.00183714, 3034.74612775, 0.21252668, 0.20469106],
saturn: [ 9.53667594,0.05386179, 2.48599187,  49.95424423, 92.59887831,113.66242448,
         -0.00125060,-0.00050991, 0.00193609, 1222.49362201,-0.41897216,-0.28867794],
uranus: [19.18916464,0.04725744, 0.77263783, 313.23810451,170.95427630, 74.01692503,
         -0.00196176,-0.00004397,-0.00242939,  428.48202785, 0.40805281, 0.04240589],
neptune:[30.06992276,0.00859048, 1.77004347, -55.12002969, 44.96476227,131.78422574,
          0.00026291,0.00005105, 0.00035372,  218.45945325,-0.32241464,-0.00508664],
pluto:  [39.48211675,0.24882730,17.14001206, 238.92903833,224.06891629,110.30393684,
         -0.00031596,0.00005170, 0.00004818,  145.20780515,-0.04062942,-0.01183482]};

function kepler(M,e){ // M rad -> E rad
  let E=M+e*Math.sin(M)*(1+e*Math.cos(M));
  for(let i=0;i<12;i++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-13)break;}
  return E;}
function orb2vec(a,e,I,w,O,E){ // 轨道根数 -> 直角坐标(参考面)
  const xv=a*(Math.cos(E)-e), yv=a*Math.sqrt(1-e*e)*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),ci=Math.cos(I),si=Math.sin(I);
  return [ (cw*cO-sw*sO*ci)*xv + (-sw*cO-cw*sO*ci)*yv,
           (cw*sO+sw*cO*ci)*xv + (-sw*sO+cw*cO*ci)*yv,
           (sw*si)*xv + (cw*si)*yv ];}
function planetPos(key,jd){
  const p=PLEL[key], T=(jd-J2000)/36525;
  const a=p[0]+p[6]*T, e=p[1]+p[7]*T, I=(p[2]+p[8]*T)*D2R;
  const L=(p[3]+p[9]*T)*D2R, wb=(p[4]+p[10]*T)*D2R, O=(p[5]+p[11]*T)*D2R;
  let M=L-wb; M=((M+PI)%TAU+TAU)%TAU-PI;

function moonGeo(jd){

  const S=Math.sin;

       -0.185116*S(M)-0.114332*S(2*F)+0.058793*S(2*D-2*Mp)+0.057066*S(2*D-M-Mp)
       +0.053322*S(2*D+Mp)+0.045758*S(2*D-M)-0.040923*S(M-Mp)-0.034720*S(D)
       -0.030383*S(M+Mp)+0.015327*S(2*D-2*F)-0.012528*S(Mp+2*F)+0.010980*S(Mp-2*F)
       +0.010675*S(4*D-Mp)+0.010034*S(3*Mp)+0.008548*S(4*D-2*Mp);
  let b=5.128122*S(F)+0.280602*S(Mp+F)+0.277693*S(Mp-F)+0.173237*S(2*D-F)
       +0.055413*S(2*D-Mp+F)+0.046271*S(2*D-Mp-F)+0.032573*S(2*D+F)+0.017198*S(2*Mp+F)
       +0.009266*S(2*D+Mp-F)+0.008822*S(2*Mp-F)+0.008216*S(2*D-M-F)+0.004324*S(2*D-2*Mp-F);
  const C=Math.cos;

       +246.158*C(2*D-2*Mp)-204.586*C(2*D-M)-170.733*C(2*D+Mp)-152.138*C(2*D-M-Mp)
       -129.620*C(D)+108.743*C(M-Mp)+104.755*C(2*D+M)+79.661*C(Mp-2*F)-34.782*C(4*D-Mp);

const bodyMap={}, scene=[];
function mkBody(d,depth){
  const b=Object.assign({},d);
  b.depth=depth; b.pos=[0,0,0]; b.rel=[0,0,0]; b.vel=[0,0,0];
  b.Rau=b.R/AU;
  b.frame=poleFrame(b.pRA!==undefined?b.pRA:0, b.pDec!==undefined?b.pDec:90);
  b.mats={x:[1,0,0],y:[0,1,0],z:[0,0,1]};
  b.trail=[]; b.trailT=-1e18;
  bodyMap[b.k]=b; scene.push(b); return b;
}
BODIES.forEach(d=>mkBody(d,d.k==='sun'?0:1));
MOONS.forEach(d=>{
  const m=mkBody(d,2);
  if(!m.pRA){ // 潮汐锁定卫星: 极点近似取母星极点
    const p=bodyMap[m.par]; m.frame=p.frame; m.locked=true; m.rot=m.P;
  }
  const p=bodyMap[m.par]; (p.moons=p.moons||[]).push(m);
});

/* 环系统: [内半径km, 外半径km, 类型] */
const RINGDEF={saturn:[74500,140300],uranus:[37000,51500],neptune:[41900,63000],jupiter:[122000,129000]};
bodyMap.jupiter.ring=4;

const MOON_MASS_RATIO=1/82.30056;   // 月球/(地月) 质量比

function cometPos(c,jd){
  const n=0.01720209895/Math.pow(c.a,1.5);      // 高斯常数 rad/day
  let M=n*(jd-c.Tp); M=((M+PI)%TAU+TAU)%TAU-PI;
  return orb2vec(c.a,c.e,c.i*D2R,c.w*D2R,c.O*D2R,kepler(M,c.e));
}
function satRel(m,jd){
  const n=TAU/m.P, M=m.M0*D2R+n*(jd-J2000);
  const E=kepler(((M+PI)%TAU+TAU)%TAU-PI,m.e);
  const v=orb2vec(m.a/AU,m.e,m.i*D2R,m.w*D2R,m.O*D2R,E);
  const f=bodyMap[m.par].frame;   // 母星赤道面 -> 黄道
  return [f.x0[0]*v[0]+f.y0[0]*v[1]+f.p[0]*v[2],
          f.x0[1]*v[0]+f.y0[1]*v[1]+f.p[1]*v[2],
          f.x0[2]*v[0]+f.y0[2]*v[1]+f.p[2]*v[2]];
}
function bodyRel(b,jd){
  if(b.el)     return planetPos(b.el,jd);
  if(b.comet)  return cometPos(b.comet,jd);
  if(b.special==='moon') return moonGeo(jd);
  if(b.a!==undefined)    return satRel(b,jd);
  return [0,0,0];
}
/* 计算全系统状态 */
function computeStates(jd){
  const dt=1e-3;
  for(const b of scene){
    if(b.k==='sun'){b.pos=[0,0,0];b.vel=[0,0,0];continue;}
    const p0=bodyRel(b,jd), p1=bodyRel(b,jd+dt);
    b.rel=p0;
    const par=bodyMap[b.par];
    b.pos=add(par.pos,p0);
    b.vel=add(par.vel,mul(sub(p1,p0),1/dt));   // AU/day
    if(b.k==='earth'){                          // 地月质心修正
      const g=moonGeo(jd);
      b.pos=sub(b.pos,mul(g,MOON_MASS_RATIO));
    }
    if(b.special==='moon'){
      const g=moonGeo(jd);
      b.pos=add(par.pos,mul(g,1-MOON_MASS_RATIO));
    }
    // 自转姿态
    const f=b.frame;
    let W;
    if(b.locked){ // 潮汐锁定: 本初子午线朝向母星
      const d=norm(sub(par.pos,b.pos));
      W=Math.atan2(dot(d,f.y0),dot(d,f.x0));
    }else{
      W=((b.W0||0)+360/(b.rot||1)*(jd-J2000))*D2R;
    }
    const cw=Math.cos(W),sw=Math.sin(W);
    b.mats={x:[f.x0[0]*cw+f.y0[0]*sw, f.x0[1]*cw+f.y0[1]*sw, f.x0[2]*cw+f.y0[2]*sw],
            y:[-f.x0[0]*sw+f.y0[0]*cw,-f.x0[1]*sw+f.y0[1]*cw,-f.x0[2]*sw+f.y0[2]*cw],
            z:f.p};
  }
}

/* ============================================================================
   4.  小天体带 / MINOR BODIES  (GPU 求解开普勒)
   ========================================================================== */
let rndS=12345;
function rnd(){rndS=(rndS*1664525+1013904223)&0x7fffffff;return rndS/0x7fffffff;}
function gauss(){return (rnd()+rnd()+rnd()+rnd()+rnd()+rnd()-3)/1.5;}

function genBelt(){
  const D=[],KIRK=[2.502,2.825,2.958,3.279,2.065],KW=[.028,.020,.016,.030,.020];
  const N=42000;
  for(let i=0;i<N;i++){
    let a,ok=false,tries=0;
    while(!ok&&tries++<24){
      a=2.06+rnd()*1.22;
      // 密度分布 + 柯克伍德空隙
      let p=Math.exp(-Math.pow((a-2.72)/0.46,2))*0.75+0.25;
      for(let g=0;g<KIRK.length;g++) p*=1-0.94*Math.exp(-Math.pow((a-KIRK[g])/KW[g],2));
      if(rnd()<p)ok=true;
    }
    const e=Math.min(0.42,Math.abs(gauss())*0.09+0.02);
    const inc=Math.min(32,Math.abs(gauss())*7.5+0.6);
    const br=0.55+rnd()*0.45, ty=rnd();
    D.push(a,e,inc*D2R,rnd()*TAU,rnd()*TAU,rnd()*TAU,
      ty<0.75?br*0.34:br*0.55, ty<0.75?br*0.28:br*0.47, ty<0.75?br*0.22:br*0.40,
      0.55+rnd()*1.5);
  }
  // 特洛伊群 L4 / L5
  const aJ=5.2029;
  for(let i=0;i<7000;i++){
    const L=(i%2? 60:-60)+gauss()*13;
    const a=aJ+gauss()*0.09;
    const e=Math.min(0.25,Math.abs(gauss())*0.06+0.01);
    const inc=Math.min(40,Math.abs(gauss())*10+1);
    const br=0.5+rnd()*0.5;
    // 以木星平黄经为基准放置
    D.push(a,e,inc*D2R,rnd()*TAU,rnd()*TAU,(34.396+L)*D2R,br*0.36,br*0.30,br*0.26,0.5+rnd()*1.2);
  }
  // 希尔达族 3:2 共振
  for(let i=0;i<2200;i++){
    const a=3.97+gauss()*0.05, e=0.1+Math.abs(gauss())*0.08, inc=Math.abs(gauss())*6;
    const br=0.45+rnd()*0.4;
    D.push(a,Math.min(.3,e),inc*D2R,rnd()*TAU,rnd()*TAU,rnd()*TAU,br*0.36,br*0.29,br*0.24,0.5+rnd());
  }
  return new Float32Array(D);
}
function genKuiper(){
  const D=[],N=26000;
  for(let i=0;i<N;i++){
    let a,e,inc;
    const r=rnd();
    if(r<0.22){ a=39.45+gauss()*0.35; e=0.05+Math.abs(gauss())*0.11; inc=Math.abs(gauss())*11+1; } // 冥族
    else if(r<0.86){ a=42.5+rnd()*5.8; e=Math.abs(gauss())*0.055; inc=Math.abs(gauss())*6.5+0.5; } // 经典带
    else { a=47.8+rnd()*22; e=0.12+Math.abs(gauss())*0.22; inc=Math.abs(gauss())*13+1; }           // 离散盘
    const br=0.35+rnd()*0.45;
    D.push(a,Math.min(0.62,e),Math.min(45,inc)*D2R,rnd()*TAU,rnd()*TAU,rnd()*TAU,
      br*0.42,br*0.40,br*0.46,0.45+rnd()*1.1);
  }
  return new Float32Array(D);
}

const GL_HEAD=`#version 300 es
precision highp float; precision highp int;
`;
const GL_NOISE=`
const float PI=3.14159265359;
float hash11(float p){p=fract(p*0.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash13(vec3 p3){p3=fract(p3*0.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
vec2  hash23(vec3 p3){p3=fract(p3*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
vec3  hash33(vec3 p3){p3=fract(p3*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yxz+33.33);
  return fract((p3.xxy+p3.yxx)*p3.zyx)*2.0-1.0;}
float vnoise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z);}
float gnoise(vec3 p){vec3 i=floor(p),f=fract(p);vec3 u=f*f*(3.0-2.0*f);
  return 1.55*mix(mix(mix(dot(hash33(i+vec3(0,0,0)),f-vec3(0,0,0)),dot(hash33(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                      mix(dot(hash33(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash33(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
                  mix(mix(dot(hash33(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash33(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                      mix(dot(hash33(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(hash33(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);}
float fbm(vec3 p,int oct){float s=0.0,a=0.5,n=0.0;
  for(int i=0;i<12;i++){if(i>=oct)break;s+=a*gnoise(p);n+=a;a*=0.5;p=p*2.02+vec3(7.3,1.7,3.1);}return s/n;}
float fbmA(vec3 p,int oct){return fbm(p,oct)*0.5+0.5;}
float ridged(vec3 p,int oct){float s=0.0,a=0.5,n=0.0;
  for(int i=0;i<12;i++){if(i>=oct)break;float v=1.0-abs(gnoise(p));s+=a*v*v;n+=a;a*=0.5;p=p*2.03+vec3(2.1,5.7,9.3);}return s/n;}
vec3 warp(vec3 p,float k,int oct){
  return p+k*vec3(fbm(p+vec3(0.0,0.0,0.0),oct),fbm(p+vec3(5.2,1.3,9.1),oct),fbm(p+vec3(1.7,8.3,2.8),oct));}
float craters(vec3 p,float sc,float rmax){
  p*=sc; vec3 i=floor(p),f=fract(p); float h=0.0;
  for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){
    vec3 g=vec3(float(x),float(y),float(z));
    vec3 o=hash33(i+g)*0.5+0.5;
    float rr=hash13(i+g+vec3(11.7,3.3,7.1));
    float rad=0.12+rmax*rr*rr*rr;
    float d=length(f-g-o)/rad;
    if(d<1.6){
      float bowl=smoothstep(0.0,0.88,d)-1.0;
      float rim=exp(-pow((d-0.96)/0.20,2.0))*0.7;
      float ej=exp(-pow((d-1.25)/0.45,2.0))*0.12;
      h+=(bowl+rim+ej)*(0.32+0.68*rr);
    }
  }
  return h;}
float cellF(vec3 p){ // 最近特征点距离
  vec3 i=floor(p),f=fract(p);float m=9.0;
  for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){
    vec3 g=vec3(float(x),float(y),float(z));
    vec3 o=hash33(i+g)*0.5+0.5;
    m=min(m,length(f-g-o));}
  return m;}
vec3 rotZ(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x*c-p.y*s,p.x*s+p.y*c,p.z);}

  float cl=cos(lat);

  if(uSeed>0.0){float s1=uSeed*1.7,s2=uSeed*2.9;
    d=vec3(d.x,d.y*cos(s1)-d.z*sin(s1),d.y*sin(s1)+d.z*cos(s1));d=rotZ(d,s2);}
  float alat=abs(d.z);

  vec3 alb=vec3(0.5); float hgt=0.5, spec=0.0, night=0.0, cloud=0.0, ice=0.0;

    float cal=smoothstep(0.30,0.0,length(d-normalize(vec3(0.30,-0.85,0.35))));

      tau=0.52+0.30*n1+0.20*n2; c=vec3(0.90,0.85,0.74);
      float enc=smoothstep(133410.0,133500.0,r)*smoothstep(133735.0,133645.0,r);
      tau*=1.0-0.97*enc;                                                     // 恩克缝
      float kee=smoothstep(136485.0,136505.0,r)*smoothstep(136548.0,136528.0,r);
      tau*=1.0-0.95*kee;
      tau*=1.0-0.25*smoothstep(136400.0,136780.0,r);
    }
    else if(r<140400.0){                                                     // F 环
      float f=exp(-pow((r-140180.0)/70.0,2.0));
      tau=f*0.55; c=vec3(0.92,0.90,0.86);
    }
    // 密度波
    tau*=1.0+0.30*sin(u*720.0+n1*12.0)*smoothstep(0.15,0.5,tau);
    c*=0.90+0.22*n1;
  } else if(uType==1){                      /* 天王星: 窄环 */
    float rings[9];
    rings[0]=41837.0;rings[1]=42234.0;rings[2]=42571.0;rings[3]=44718.0;rings[4]=45661.0;
    rings[5]=47176.0;rings[6]=47627.0;rings[7]=48300.0;rings[8]=51149.0;
    float wid[9];
    wid[0]=90.0;wid[1]=90.0;wid[2]=110.0;wid[3]=130.0;wid[4]=130.0;
    wid[5]=140.0;wid[6]=170.0;wid[7]=1900.0;wid[8]=1300.0;
    float amp[9];
    amp[0]=0.35;amp[1]=0.35;amp[2]=0.40;amp[3]=0.45;amp[4]=0.45;
    amp[5]=0.50;amp[6]=0.55;amp[7]=0.10;amp[8]=1.10;
    for(int i=0;i<9;i++) tau+=amp[i]*exp(-pow((r-rings[i])/wid[i],2.0));
    tau+=0.012*smoothstep(37000.0,39500.0,r)*smoothstep(51500.0,50000.0,r);
    c=vec3(0.55,0.56,0.58);
  } else if(uType==2){                      /* 海王星: 弧环 */
    tau =0.16*exp(-pow((r-62930.0)/180.0,2.0));      // 亚当斯
    tau+=0.10*exp(-pow((r-53200.0)/180.0,2.0));      // 勒威耶
    tau+=0.06*exp(-pow((r-41900.0)/1300.0,2.0));     // 伽勒
    tau+=0.02*smoothstep(53200.0,57200.0,r)*smoothstep(59000.0,57200.0,r);
    c=vec3(0.48,0.52,0.60);
  } else {                                  /* 木星: 主环 + 晕 */
    tau =0.030*exp(-pow((r-128500.0)/1400.0,2.0));
    tau+=0.014*smoothstep(122000.0,124000.0,r)*smoothstep(129200.0,128000.0,r);
    tau+=0.004*smoothstep(122000.0,110000.0,r);
    c=vec3(0.72,0.55,0.42);
  }
  o=vec4(c,max(tau,0.0));
}`;

const EXT_HF=gl.getExtension('EXT_color_buffer_half_float');

function sh(type,src,nm){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const log=gl.getShaderInfoLog(s);
    const lines=src.split('\n');
    let ctx='';
    const m=/ERROR:\s*\d+:(\d+)/.exec(log);
    if(m){const n=+m[1];for(let i=Math.max(0,n-4);i<Math.min(lines.length,n+3);i++)ctx+=(i+1)+'| '+lines[i]+'\n';}
    throw new Error('['+nm+'] '+log+'\n'+ctx);
  }
  return s;}
function P(vs,fs,nm){
  const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vs,nm+'.vs'));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs,nm+'.fs'));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error('['+nm+'] '+gl.getProgramInfoLog(p));
  const cache={};
  p.u=new Proxy({},{get:(t,k)=>{if(!(k in cache))cache[k]=gl.getUniformLocation(p,k);return cache[k];}});
  p.name=nm;
  return p;}

/* ---- 网格 ---- */
function buf(data,target){
  const b=gl.createBuffer(); target=target||gl.ARRAY_BUFFER;
  gl.bindBuffer(target,b); gl.bufferData(target,data,gl.STATIC_DRAW); return b;}
function makeSphere(nx,ny){
  const pos=[],uv=[],idx=[];
  for(let j=0;j<=ny;j++){
    const v=j/ny,lat=(v-0.5)*PI,cl=Math.cos(lat),sl=Math.sin(lat);
    for(let i=0;i<=nx;i++){
      const u=i/nx,lon=(u-0.5)*TAU;
      pos.push(cl*Math.cos(lon),cl*Math.sin(lon),sl); uv.push(u,v);
    }}
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const a=j*(nx+1)+i,b=a+nx+1;
    idx.push(a,a+1,b, a+1,b+1,b);}
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const pb=buf(new Float32Array(pos)); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  const ub=buf(new Float32Array(uv));  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,2,gl.FLOAT,false,0,0);
  buf(new Uint32Array(idx),gl.ELEMENT_ARRAY_BUFFER);
  gl.bindVertexArray(null);
  return {vao:vao,n:idx.length};}
function makeRingMesh(seg){
  const a=[];
  for(let i=0;i<=seg;i++){const t=i/seg*TAU; a.push(t,0, t,1);}
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  buf(new Float32Array(a)); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null);
  return {vao:vao,n:(seg+1)*2};}

/* ---- 纹理 / FBO ---- */
function tex2D(w,h,ifmt,fmt,type,filter){
  const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,ifmt,w,h,0,fmt,type,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter||gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;}
function fbo(attach,depth,w,h){
  const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  const bufs=[];
  attach.forEach((t,i)=>{gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,t,0);
    bufs.push(gl.COLOR_ATTACHMENT0+i);});
  gl.drawBuffers(bufs);
  if(depth){
    const rb=gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER,rb);
    gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,w,h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,rb);
    f.rb=rb;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return f;}
function drawQuad(){gl.bindVertexArray(MESH.empty);gl.drawArrays(gl.TRIANGLES,0,3);}

const TEXES={};

function bakeBodyTex(key,type,w,h,seed){
  const alb=tex2D(w,h,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,gl.LINEAR_MIPMAP_LINEAR);
  const mat=tex2D(w,h,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,gl.LINEAR_MIPMAP_LINEAR);
  if(!bakeFB) bakeFB=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,bakeFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,alb,0);

  [alb,mat].forEach(t=>{gl.bindTexture(gl.TEXTURE_2D,t);gl.generateMipmap(gl.TEXTURE_2D);
    if(EXT_AN)gl.texParameterf(gl.TEXTURE_2D,EXT_AN.TEXTURE_MAX_ANISOTROPY_EXT,MAXANISO);});

}

function bakeRingTex(key,type,r0,r1){
  const W=4096;

let W=1,H=1,DPR=1;
const RT={bloom:[]};
function makeTargets(){
  if(RT.sceneT){gl.deleteTexture(RT.sceneT);gl.deleteFramebuffer(RT.sceneF);
    gl.deleteRenderbuffer(RT.sceneF.rb);gl.deleteTexture(RT.ldrT);gl.deleteFramebuffer(RT.ldrF);
    RT.bloom.forEach(b=>{gl.deleteTexture(b.t);gl.deleteFramebuffer(b.f);}); RT.bloom=[];}
  RT.sceneT=tex2D(W,H,HDR?gl.RGBA16F:gl.RGBA8,gl.RGBA,HDR?HDRTYPE:gl.UNSIGNED_BYTE);
  gl.bindTexture(gl.TEXTURE_2D,RT.sceneT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  RT.sceneF=fbo([RT.sceneT],true,W,H);
  RT.ldrT=tex2D(W,H,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE);
  gl.bindTexture(gl.TEXTURE_2D,RT.ldrT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  RT.ldrF=fbo([RT.ldrT],false,W,H);
  let w=Math.max(1,W>>1),h=Math.max(1,H>>1);
  for(let i=0;i<7&&w>4&&h>4;i++){
    const t=tex2D(w,h,HDR?gl.RGBA16F:gl.RGBA8,gl.RGBA,HDR?HDRTYPE:gl.UNSIGNED_BYTE);
    gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    RT.bloom.push({t:t,f:fbo([t],false,w,h),w:w,h:h});
    w=Math.max(1,w>>1); h=Math.max(1,h>>1);
  }
}

function updateCamera(dt){
  if(cam.tr<1){cam.tr=Math.min(1,cam.tr+dt/cam.trDur);}
  const e=cam.tr>=1?1:(cam.tr<0.5?4*cam.tr*cam.tr*cam.tr:1-Math.pow(-2*cam.tr+2,3)/2);
  let a=focusPos(cam.focus);
  if(cam.prevFocus&&cam.tr<1){const p=focusPos(cam.prevFocus);
    a=[lerp(p[0],a[0],e),lerp(p[1],a[1],e),lerp(p[2],a[2],e)];}
  cam.anchor=a;
  cam.dist=cam.dist*Math.pow(cam.tDist/cam.dist,Math.min(1,dt*7.0));
  if(cfg.spin&&!drag.on) cam.yaw+=dt*0.018;
  cam.pitch=clamp(cam.pitch,-1.553,1.553);
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const d=[cp*Math.cos(cam.yaw),cp*Math.sin(cam.yaw),sp];
  cam.pos=add(cam.anchor,mul(d,cam.dist));
  cam.fwd=mul(d,-1);
  let up=[0,0,1];
  cam.right=norm(cross(cam.fwd,up));
  cam.up=cross(cam.right,cam.fwd);
}
function setFocus(k,inst){
  const b=bodyMap[k]; if(!b)return;
  if(cam.focus!==k){cam.prevFocus=cam.focus;cam.tr=inst?1:0;}
  cam.focus=k;
  const r=Math.max(dispR(b),b.Rau);
  cam.tDist=r*(b.k==='sun'?9:(b.moons&&b.moons.length?6.2:4.4));
  if(inst)cam.dist=cam.tDist;
  cfg.sel=k; updateInfo(); buildNav();
}

   19.  轨道路径
   ========================================================================== */
const ORBN=513;
function satE(b,jd){
  const n=TAU/b.P,M=b.M0*D2R+n*(jd-J2000);
  return kepler(((M+PI)%TAU+TAU)%TAU-PI,b.e);}
function buildOrbit(b,jd){
  const o=ensureOrbit(b.k,ORBN);
  const pts=new Array(ORBN);
  if(b.el){
    const E=planetElems(b.el,jd);
    for(let i=0;i<ORBN;i++) pts[i]=orb2vec(E.a,E.e,E.I,E.w,E.O,i/(ORBN-1)*TAU);
    const p=PLEL[b.el],T=(jd-J2000)/36525;
    let M=((p[3]+p[9]*T)-(p[4]+p[10]*T))*D2R; M=((M+PI)%TAU+TAU)%TAU-PI;
    b.headT=kepler(M,E.e)/TAU;
  } else if(b.comet){
    const c=b.comet;
    for(let i=0;i<ORBN;i++) pts[i]=orb2vec(c.a,c.e,c.i*D2R,c.w*D2R,c.O*D2R,i/(ORBN-1)*TAU);
    const n=0.01720209895/Math.pow(c.a,1.5);
    let M=n*(jd-c.Tp); M=((M+PI)%TAU+TAU)%TAU-PI;
    b.headT=kepler(M,c.e)/TAU;
  } else if(b.special==='moon'){
    for(let i=0;i<ORBN;i++) pts[i]=moonGeo(jd+i/(ORBN-1)*27.321661);
    b.headT=0;
  } else {
    const f=bodyMap[b.par].frame;
    for(let i=0;i<ORBN;i++){
      const v=orb2vec(b.a/AU,b.e,b.i*D2R,b.w*D2R,b.O*D2R,i/(ORBN-1)*TAU);
      pts[i]=[f.x0[0]*v[0]+f.y0[0]*v[1]+f.p[0]*v[2],
              f.x0[1]*v[0]+f.y0[1]*v[1]+f.p[1]*v[2],
              f.x0[2]*v[0]+f.y0[2]*v[1]+f.p[2]*v[2]];
    }
    b.headT=satE(b,jd)/TAU;
  }
  for(let i=0;i<ORBN;i++){
    const p=pts[i],q=pts[(i+1)%(ORBN-1)];
    for(let s=0;s<2;s++){
      const j=(i*2+s)*3;
      o.pos[j]=p[0];o.pos[j+1]=p[1];o.pos[j+2]=p[2];
      o.nxt[j]=q[0];o.nxt[j+1]=q[1];o.nxt[j+2]=q[2];
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,o.bp); gl.bufferSubData(gl.ARRAY_BUFFER,0,o.pos);
  gl.bindBuffer(gl.ARRAY_BUFFER,o.bn); gl.bufferSubData(gl.ARRAY_BUFFER,0,o.nxt);
  b.orbJd=jd; b.orbOk=true;
}
function updateHead(b,jd){
  if(b.el){const p=PLEL[b.el],T=(jd-J2000)/36525,e=p[1]+p[7]*T;
    let M=((p[3]+p[9]*T)-(p[4]+p[10]*T))*D2R;M=((M+PI)%TAU+TAU)%TAU-PI;b.headT=kepler(M,e)/TAU;}
  else if(b.comet){const c=b.comet,n=0.01720209895/Math.pow(c.a,1.5);
    let M=n*(jd-c.Tp);M=((M+PI)%TAU+TAU)%TAU-PI;b.headT=kepler(M,c.e)/TAU;}
  else if(b.special==='moon'){b.headT=((jd-b.orbJd)/27.321661)%1;}
  else b.headT=satE(b,jd)/TAU;
}

function onScreen(rel,R,d){

function setOcc(p,b){
  let n=0;
  const push=(o)=>{if(n>=5||o===b)return;const r=sub(o.pos,cam.pos);
    occBuf[n*4]=r[0];occBuf[n*4+1]=r[1];occBuf[n*4+2]=r[2];occBuf[n*4+3]=dispR(o);n++;};
  if(b.depth===2){push(bodyMap[b.par]);
    const sib=bodyMap[b.par].moons||[];
    for(let i=0;i<sib.length&&n<5;i++) if(sib[i]!==b&&sib[i].R>300) push(sib[i]);}
  else if(b.moons){const ms=b.moons.slice().sort((x,y)=>y.R-x.R);
    for(let i=0;i<ms.length&&n<5;i++) push(ms[i]);}
  for(let i=n;i<5;i++){occBuf[i*4]=0;occBuf[i*4+1]=0;occBuf[i*4+2]=0;occBuf[i*4+3]=0;}
  gl.uniform4fv(p.u.uOcc,occBuf); gl.uniform1i(p.u.uNocc,n);

function computeSunVis(){
  const rel=sub([0,0,0],cam.pos), d=len(rel);
  if(d<1e-9){sunVis=1;return;}
  const dir=mul(rel,1/d); let v=1;
  for(const b of scene){
    if(b.k==='sun')continue;
    const c=sub(b.pos,cam.pos), t=dot(c,dir);
    if(t<=0||t>d)continue;
    const perp=len(sub(c,mul(dir,t))), R=dispR(b);
    v=Math.min(v,smoothstep(R*0.55,R*1.5,perp));
    if(v<=0)break;

  sunVis=v;
  const z=dot(rel,cam.fwd);
  if(z>1e-12){
    sunUV=[0.5+dot(rel,cam.right)/(z*tanH*(W/H))*0.5, 0.5+dot(rel,cam.up)/(z*tanH)*0.5];
  }else{sunUV=[dot(rel,cam.right)>0?2.5:-1.5,0.5];sunVis*=0;}
  sunPx=clamp(pxRadius(dispR(bodyMap.sun),d)/40,0,1);
}

    const c=b.col, k=(cfg.sel===b.k)?1.7:1.0;
    gl.uniform3f(p.u.uCol,c[0]*k*0.62,c[1]*k*0.66,c[2]*k*0.78);
    const dim=(b.depth===2)?0.55:1.0;
    gl.uniform1f(p.u.uOp,op*(cfg.sel===b.k?0.85:0.42)*dim*cfg.trail);
    gl.bindVertexArray(o.vao);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,ORBN*2);
  }
}

function drawSprites(){
  ensureSprite();
  let n=0;
  const tanv=H*0.5/tanH;
  for(const b of scene){
    const rel=sub(b.pos,cam.pos), d=len(rel);
    if(d<1e-9)continue;
    const R=dispR(b), px=R/d*tanv;
    let flux,size;
    if(b.k==='sun'){ flux=SUNRAD*0.55*(b.Rau/d)*(b.Rau/d)*1.0e5*sunVis;
      /* 精灵按真实半径, 与放大无关 */
      size=clamp(8+Math.log(1+flux)*3.0,8,30); }
    else{
      const r=Math.max(len(b.pos),0.05);
      flux=(ALB[b.k]||0.35)*(b.Rau/d)*(b.Rau/d)/(r*r)*1.1e9;
      size=clamp(3.0+Math.log(1+flux)*1.5,3.0,13);
    }
    let a=clamp(flux,0.0,8)*smoothstep(3.6,0.8,px);
    if(b.comet){const rr=len(b.pos);const ac=Math.pow(clamp(2.6/rr,0,1),2.0);
      a=clamp(0.12+3.2*ac,0,4.5);size=clamp(5+16*ac,5,22);}
    if(a<0.004)continue;
    if(n>=60)break;
    const c=b.col;
    sprData[n*8]=rel[0];sprData[n*8+1]=rel[1];sprData[n*8+2]=rel[2];
    const mx=Math.max(c[0],c[1],c[2]);
    sprData[n*8+3]=c[0]/mx;sprData[n*8+4]=c[1]/mx;sprData[n*8+5]=c[2]/mx;
    sprData[n*8+6]=a; sprData[n*8+7]=size;
    n++;
  }
  if(!n)return;
  gl.bindBuffer(gl.ARRAY_BUFFER,sprBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,sprData.subarray(0,n*8));
  const p=PR.sprite; gl.useProgram(p);
  gl.uniformMatrix4fv(p.u.uVP,false,VP);
  gl.uniform1f(p.u.uPx,DPR);
  gl.bindVertexArray(sprVao);
  gl.drawArrays(gl.POINTS,0,n);
}

/* ============================================================================
   22.  帧渲染
   ========================================================================== */
function render(){
  tanH=tanHalf();
  m4persp(cam.fov,W/H,1e-8,FAR,PROJ);
  m4viewRot(cam.right,cam.up,cam.fwd,VIEW);
  m4mul(PROJ,VIEW,VP);
  computeSunVis();
  const sunR=dispR(bodyMap.sun);
  const tanv=H*0.5/tanH;

  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.sceneF);
  gl.viewport(0,0,W,H);
  gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
  gl.depthMask(true);                 // 必须在 clear 之前: glClear 受深度写掩码约束
  gl.colorMask(true,true,true,true);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.clearColor(0,0,0,1); gl.clearDepth(1.0);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  /* --- 星空 --- */
  if(cfg.sky&&skyTex){
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    const p=PR.sky; gl.useProgram(p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_CUBE_MAP,skyTex);
    gl.uniform1i(p.u.uSky,0);
    gl.uniform3fv(p.u.uR,new Float32Array(cam.right));
    gl.uniform3fv(p.u.uU,new Float32Array(cam.up));
    gl.uniform3fv(p.u.uF,new Float32Array(cam.fwd));
    gl.uniform2f(p.u.uTan,tanH*(W/H),tanH);
    const sd=norm(mul(cam.pos,-1));
    gl.uniform3fv(p.u.uSunDir,new Float32Array(sd));
    gl.uniform1f(p.u.uZodi,cfg.zodi*0.03/Math.pow(Math.max(expoNow,0.2),0.85));
    gl.uniform1f(p.u.uMWGain,cfg.mw*2.1/Math.pow(Math.max(expoNow,0.2),0.85));
    drawQuad();
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  }

  /* --- 收集可见天体 --- */
  const vis=[];
  for(const b of scene){
    const rel=sub(b.pos,cam.pos), d=len(rel);
    const R=dispR(b), px=R/d*tanv;
    b._rel=rel; b._d=d; b._R=R; b._px=px;
    if(px<0.45||!onScreen(rel,R,d))continue;
    vis.push(b);
  }

  /* --- 太阳 --- */
  const S=bodyMap.sun;
  if(S._px>=0.45&&onScreen(S._rel,S._R,S._d)){
    const p=PR.sun; gl.useProgram(p);
    m4basis(S.mats.x,S.mats.y,S.mats.z,S._rel,S._R,MDL);
    m4mul(VP,MDL,MVP);
    gl.uniformMatrix4fv(p.u.uMVP,false,MVP);
    gl.uniformMatrix4fv(p.u.uModel,false,MDL);
    gl.uniform1f(p.u.uOblate,1.0);
    gl.uniform1f(p.u.uTime,(jd-J2000)*0.9);
    const sk=S._R/S.Rau;                    // 放大时守恒总光通量
    gl.uniform1f(p.u.uInt,SUNRAD/(sk*sk));
    gl.uniform1f(p.u.uFcoef,FCOEF);
    const mesh=S._px>170?MESH.hi:(S._px>26?MESH.md:MESH.lo);
    gl.bindVertexArray(mesh.vao);
    gl.drawElements(gl.TRIANGLES,mesh.n,gl.UNSIGNED_INT,0);
  }

  /* --- 固体天体 --- */
  gl.useProgram(PR.body);
  for(const b of vis){
    if(b.k==='sun')continue;
    drawSphereBody(b,b._rel,b._d,b._R,b._px);
  }

  /* --- 日冕 --- */
  if(S._d>0){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    const p=PR.corona; gl.useProgram(p);
    const qs=S._R*16.0;
    gl.uniform3fv(p.u.uCen,new Float32Array(S._rel));
    gl.uniform3fv(p.u.uR,new Float32Array(cam.right));
    gl.uniform3fv(p.u.uU,new Float32Array(cam.up));
    gl.uniform1f(p.u.uSize,qs);
    gl.uniformMatrix4fv(p.u.uVP,false,VP);
    gl.uniform1f(p.u.uTime,(jd-J2000)*0.9);
    gl.uniform1f(p.u.uCore,S._R/qs);
    const sk2=S._R/S.Rau;
    gl.uniform1f(p.u.uInt,SUNRAD*0.135/(sk2*sk2));
    gl.uniform1f(p.u.uFcoef,FCOEF);
    gl.bindVertexArray(MESH.quadVao);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.enable(gl.CULL_FACE);
  }

  /* --- 行星环 --- */
  if(cfg.rings){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false); gl.disable(gl.CULL_FACE);
    for(const b of vis) if(RINGDEF[b.k]&&b._px>0.8) drawRings(b,b._rel,b._R);
    gl.enable(gl.CULL_FACE);
  }

  /* --- 小天体带 --- */
  if(cfg.belt||cfg.kuiper){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
    drawParticles();
  }

  /* --- 云层 --- */
  if(cfg.clouds){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    for(const b of vis) if(b.k==='earth'&&b._px>1.5) drawClouds(b,b._rel,b._d,b._R,b._px);
  }

  /* --- 大气 --- */
  if(cfg.atmo){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    const al=vis.filter(b=>ATMO[b.k]&&b._px>1.2).sort((a,b)=>b._d-a._d);
    for(const b of al) drawAtmo(b,b._rel,b._d,b._R);
    gl.enable(gl.DEPTH_TEST);
  }

  /* --- 彗尾 --- */
  if(cfg.comets){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
    drawTails();
  }

  /* --- 轨道 --- */
  if(cfg.orbits){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    drawOrbits();
    gl.enable(gl.CULL_FACE);
  }

  /* --- 光点 --- */
  if(cfg.sprites){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    drawSprites();
    gl.enable(gl.DEPTH_TEST);
  }

  post();
}

function post(){
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
  gl.depthMask(false);
  const NB=RT.bloom.length;
  // 亮部提取
  let p=PR.pre; gl.useProgram(p);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.bloom[0].f);
  gl.viewport(0,0,RT.bloom[0].w,RT.bloom[0].h);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,RT.sceneT);
  gl.uniform1i(p.u.uT,0); gl.uniform2f(p.u.uTexel,1/W,1/H);
  gl.uniform1f(p.u.uThr,0.80); gl.uniform1f(p.u.uSoft,0.50);
  gl.uniform1f(p.u.uExpo,expoNow);
  drawQuad();
  // 降采样
  p=PR.down; gl.useProgram(p);
  for(let i=1;i<NB;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER,RT.bloom[i].f);
    gl.viewport(0,0,RT.bloom[i].w,RT.bloom[i].h);
    gl.bindTexture(gl.TEXTURE_2D,RT.bloom[i-1].t);
    gl.uniform1i(p.u.uT,0);
    gl.uniform2f(p.u.uTexel,1/RT.bloom[i-1].w,1/RT.bloom[i-1].h);
    drawQuad();
  }
  // 升采样叠加
  p=PR.up; gl.useProgram(p);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  for(let i=NB-1;i>0;i--){
    gl.bindFramebuffer(gl.FRAMEBUFFER,RT.bloom[i-1].f);
    gl.viewport(0,0,RT.bloom[i-1].w,RT.bloom[i-1].h);
    gl.bindTexture(gl.TEXTURE_2D,RT.bloom[i].t);
    gl.uniform1i(p.u.uT,0);
    gl.uniform2f(p.u.uTexel,1/RT.bloom[i].w,1/RT.bloom[i].h);
    gl.uniform1f(p.u.uR,1.15);
    drawQuad();
  }
  gl.disable(gl.BLEND);
  // 合成
  p=PR.comp; gl.useProgram(p);
  gl.bindFramebuffer(gl.FRAMEBUFFER,cfg.fxaa?RT.ldrF:null);
  gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,RT.sceneT);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,RT.bloom[0].t);
  gl.uniform1i(p.u.uScene,0); gl.uniform1i(p.u.uBloom,1);
  gl.uniform2f(p.u.uRes,W,H);
  gl.uniform1f(p.u.uExpo,expoNow);
  gl.uniform1f(p.u.uBloomI,cfg.bloom);
  gl.uniform1f(p.u.uGodI,cfg.god);
  gl.uniform1f(p.u.uFlareI,cfg.flare);
  gl.uniform1f(p.u.uCA,cfg.ca*0.035);
  gl.uniform1f(p.u.uVig,cfg.vig);
  gl.uniform1f(p.u.uGrain,cfg.grain);
  gl.uniform1f(p.u.uTime,performance.now()*0.001);
  gl.uniform1f(p.u.uSunVis,sunVis);
  gl.uniform1f(p.u.uSunSize,sunPx);
  gl.uniform2f(p.u.uSunUV,sunUV[0],sunUV[1]);
  gl.uniform3f(p.u.uSunCol,1.0,0.92,0.80);
  drawQuad();
  if(cfg.fxaa){
    p=PR.fxaa; gl.useProgram(p);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,W,H);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,RT.ldrT);
    gl.uniform1i(p.u.uT,0); gl.uniform2f(p.u.uTexel,1/W,1/H);
    drawQuad();
  }
}

const labelBox=document.getElementById('labels');
const labels={};
function projectPt(rel){
  const z=dot(rel,cam.fwd);
  if(z<=1e-12)return null;
  const x=dot(rel,cam.right)/(z*tanH*(W/H));
  const y=dot(rel,cam.up)/(z*tanH);
  if(Math.abs(x)>1.35||Math.abs(y)>1.35)return null;
  return [(x*0.5+0.5)*cv.clientWidth,(1-(y*0.5+0.5))*cv.clientHeight,z];
}
function updateLabels(){
  const show=cfg.labels;
  for(const b of scene){
    let el=labels[b.k];
    if(!el){
      el=document.createElement('div'); el.className='lbl';
      el.innerHTML='<span class="dot"></span><b>'+b.zh+'</b><i>'+b.en+'</i>';
      el.style.color='rgb('+Math.round(155+b.col[0]*100)+','+Math.round(165+b.col[1]*90)+','+
        Math.round(175+b.col[2]*80)+')';
      el.addEventListener('click',ev=>{ev.stopPropagation();setFocus(b.k);});
      labelBox.appendChild(el); labels[b.k]=el;
    }
    let ok=show;
    if(ok&&b.depth===2){
      const par=bodyMap[b.par];
      const dp=len(sub(par.pos,cam.pos));
      ok=dp<len(b.rel)*140;
    }
    if(ok&&b.comet) ok=len(b.pos)<12;
    const rel=b._rel||sub(b.pos,cam.pos);
    const pr=ok?projectPt(rel):null;
    if(!pr||(b._px>0&&b._px>cv.clientHeight*0.42)){el.style.opacity=0;el.style.pointerEvents='none';continue;}
    const off=Math.min(Math.max((b._px||0)/DPR+9,11),150);
    el.style.transform='translate(-50%,-50%) translate('+pr[0].toFixed(1)+'px,'+(pr[1]-off).toFixed(1)+'px)';
    el.style.opacity=cfg.sel===b.k?1:0.68;
    el.style.pointerEvents='auto';
    el.classList.toggle('sel',cfg.sel===b.k);
  }
}

/* ============================================================================
   24.  时间与格式化
   ========================================================================== */
function date2jd(D){return D.getTime()/86400000+2440587.5;}
function jd2parts(J){
  const z=Math.floor(J+0.5); let f=J+0.5-z, a=z;
  if(z>=2299161){const al=Math.floor((z-1867216.25)/36524.25);a=z+1+al-Math.floor(al/4);}
  const b=a+1524,c=Math.floor((b-122.1)/365.25),d=Math.floor(365.25*c),e=Math.floor((b-d)/30.6001);
  const dd=b-d-Math.floor(30.6001*e);
  const mo=e<14?e-1:e-13, yr=mo>2?c-4716:c-4715;
  let h=f*24; const H=Math.floor(h); h=(h-H)*60; const M=Math.floor(h); const S=Math.floor((h-M)*60);
  return {y:yr,m:mo,d:dd,H:H,M:M,S:S};}
const WD=['日','一','二','三','四','五','六'];
function fmtDate(J){
  const p=jd2parts(J), z=n=>(n<10?'0':'')+n;
  const w=WD[((Math.floor(J+0.5)%7)+7+1)%7];
  return {a:p.y+'-'+z(p.m)+'-'+z(p.d),b:z(p.H)+':'+z(p.M)+':'+z(p.S)+'  周'+w};}
function speedOf(s){const a=Math.abs(s);if(a<0.05)return 0;
  return Math.sign(s)*1.157407e-5*Math.pow(10,a);}
function fmtRate(dps){
  const s=dps*86400,a=Math.abs(s);
  if(a<1e-6)return '暂停';
  let v,u;
  if(a<90){v=s;u='秒';}else if(a<5400){v=s/60;u='分';}
  else if(a<172800){v=s/3600;u='时';}else if(a<2.6e6){v=s/86400;u='天';}
  else if(a<3.1e7){v=s/2.63e6;u='月';}else{v=s/3.156e7;u='年';}
  return (Math.abs(v)<10?v.toFixed(1):Math.round(v))+' '+u+'/秒';}
function fmtLen(au){
  const km=au*AU;
  if(km<1000)return km.toFixed(1)+' km';
  if(km<1e6)return Math.round(km).toLocaleString('en-US')+' km';
  if(au<0.02)return (km/1e6).toFixed(3)+' 百万km';
  return au.toFixed(au<10?4:3)+' AU';}

 ['s','grain','颗粒',0,0.08,0.001,null,null,v=>v.toFixed(3)],
 ['sec','画质 · QUALITY'],
 ['s','scale','渲染倍率',0.5,2.0,0.05,null,null,v=>v.toFixed(2)+'×'],
 ['s','atmoQ','大气采样',4,24,1,null,null,v=>v.toFixed(0)],
 ['t','fxaa','FXAA 抗锯齿'],['t','sprites','光点辉光'],
];
function buildCfg(){
  const c=$('cfg'); let h='';
  for(const s of CFGSPEC){
    if(s[0]==='sec'){h+='<div class="sec">'+s[1]+'</div>';continue;}
    if(s[0]==='t'){h+='<div class="row"><span>'+s[2]+'</span><div class="sw2'+(cfg[s[1]]?' on':'')+
      '" data-t="'+s[1]+'"></div></div>';continue;}
    const cur=cfg[s[1]];
    const inv=s[7]?s[7](cur):cur;
    h+='<div class="row" style="padding-top:7px"><span>'+s[2]+'</span><span class="v" id="v_'+s[1]+'">'+
      s[8](cur)+'</span></div><input type="range" data-s="'+s[1]+'" min="'+s[3]+'" max="'+s[4]+
      '" step="'+s[5]+'" value="'+inv+'">';
  }
  c.innerHTML=h;
  c.querySelectorAll('.sw2').forEach(e=>e.onclick=()=>{
    const k=e.dataset.t; cfg[k]=!cfg[k]; e.classList.toggle('on',cfg[k]);
    if(k==='labels')updateLabels();});
  c.querySelectorAll('input[type=range]').forEach(e=>e.oninput=()=>{
    const k=e.dataset.s, sp=CFGSPEC.find(x=>x[0]==='s'&&x[1]===k);
    const v=parseFloat(e.value);
    cfg[k]=sp[6]?sp[6](v):v;
    $('v_'+k).textContent=sp[8](cfg[k]);
    if(k==='scale'){W=0;resize();}
  });
}
/* ============================================================================
   26.  交互
   ========================================================================== */
const drag={on:false,x:0,y:0,moved:0};
cv.addEventListener('pointerdown',e=>{drag.on=true;drag.x=e.clientX;drag.y=e.clientY;drag.moved=0;
  cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  if(!drag.on)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.x=e.clientX; drag.y=e.clientY; drag.moved+=Math.abs(dx)+Math.abs(dy);
  cam.yaw-=dx*0.005; cam.pitch=clamp(cam.pitch+dy*0.005,-1.553,1.553);});
cv.addEventListener('pointerup',e=>{
  drag.on=false;
  if(drag.moved<5) pick(e.clientX,e.clientY);});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(clamp(e.deltaY,-120,120)*0.0016);
  const b=bodyMap[cam.focus];
  cam.tDist=clamp(cam.tDist*f,Math.max(dispR(b)*1.04,b.Rau*1.02),260);
},{passive:false});
let pinch=0;
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinch){const b=bodyMap[cam.focus];
      cam.tDist=clamp(cam.tDist*(pinch/d),Math.max(dispR(b)*1.04,b.Rau*1.02),260);}
    pinch=d; e.preventDefault();
  }},{passive:false});
cv.addEventListener('touchend',()=>{pinch=0;});
cv.addEventListener('dblclick',()=>{cam.tDist=Math.min(cam.tDist*3.2,260);});
function pick(cx,cy){
  let best=null,bd=1e9;
  for(const b of scene){
    const p=projectPt(b._rel||sub(b.pos,cam.pos));
    if(!p)continue;
    const d=Math.hypot(p[0]-cx,p[1]-cy);
    const rad=Math.max((b._px||0)/DPR,10);
    if(d<rad+14&&d/(rad+14)<bd){bd=d/(rad+14);best=b;}
  }
  if(best)setFocus(best.k);
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k===' '){playing=!playing;$('bPlay').classList.toggle('act',playing);e.preventDefault();}
  else if(k==='arrowright'){$('speed').value=Math.min(9,parseFloat($('speed').value)+0.25);onSpeed();}
  else if(k==='arrowleft'){$('speed').value=Math.max(-9,parseFloat($('speed').value)-0.25);onSpeed();}
  else if(k==='o'){viewAll();}
  else if(k==='h'){$('hud').classList.toggle('hid');labelBox.classList.toggle('hid');}
  else if(k==='n'){jd=date2jd(new Date());}
  else if(k==='r'){setFocus(cfg.sel,true);}
});
function onSpeed(){speed=speedOf(parseFloat($('speed').value));
  $('spdlab').textContent=fmtRate(speed);}
function viewAll(){
  cam.prevFocus=cam.focus;cam.focus='sun';cam.tr=0;cfg.sel='sun';
  cam.tDist=62; cam.pitch=0.62; updateInfo(); buildNav();
}
$('speed').addEventListener('input',onSpeed);
$('bPlay').onclick=()=>{playing=!playing;$('bPlay').classList.toggle('act',playing);};
$('bFwd').onclick=()=>{$('speed').value=Math.min(9,parseFloat($('speed').value)+0.5);onSpeed();};
$('bBack').onclick=()=>{$('speed').value=Math.max(-9,parseFloat($('speed').value)-0.5);onSpeed();};
$('bNow').onclick=()=>{jd=date2jd(new Date());};
$('bAll').onclick=viewAll;
$('bUI').onclick=()=>{$('hud').classList.toggle('hid');labelBox.classList.toggle('hid');};
addEventListener('resize',()=>{W=0;resize();});

/* ============================================================================
   27.  启动
   ========================================================================== */
const TEXPLAN={};
function planTextures(){
  let rock=0;
  for(const b of scene){
    if(b.tex===undefined||b.tex<0)continue;
    let key,size,seed=0;
    if(b.tex===10){const i=rock%3;key='rock'+i;seed=1.0+i*0.87;size=[512,256];rock++;}
    else{key='t'+b.tex;
      size=(b.tex===2||b.tex===3||b.tex===4||b.tex===9)?[2048,1024]:[1024,512];}
    b.texKey=key;
    if(!TEXPLAN[key])TEXPLAN[key]={type:b.tex,w:size[0],h:size[1],seed:seed,key:key};
  }
}
const TASKS=[];
function boot(){
  TASKS.push(['编译着色器 · SHADERS',()=>{buildPrograms();buildMeshes();resize();}]);
  for(let i=0;i<6;i++)TASKS.push(['烘焙星空 · SKYBOX '+(i+1)+'/6',()=>bakeSkyFace(i)]);
  TASKS.push(['行星环 · RINGS',()=>{
    bakeRingTex('saturn',0,RINGDEF.saturn[0],RINGDEF.saturn[1]);
    bakeRingTex('uranus',1,RINGDEF.uranus[0],RINGDEF.uranus[1]);
    bakeRingTex('neptune',2,RINGDEF.neptune[0],RINGDEF.neptune[1]);
    bakeRingTex('jupiter',3,RINGDEF.jupiter[0],RINGDEF.jupiter[1]);}]);
  planTextures();
  for(const k in TEXPLAN){const p=TEXPLAN[k];
    TASKS.push(['生成表面 · '+k.toUpperCase(),()=>bakeBodyTex(p.key,p.type,p.w,p.h,p.seed)]);}
  TASKS.push(['小行星带 · 51k',()=>{beltVao=partVao(genBelt());}]);
  TASKS.push(['柯伊伯带 · 26k',()=>{kuipVao=partVao(genKuiper());}]);
  TASKS.push(['彗尾粒子',()=>{buildTail(7000);}]);
  TASKS.push(['场景初始化',()=>{
    jd=date2jd(new Date());
    computeStates(jd);
    const sd=norm(mul(bodyMap.earth.pos,-1));
    cam.yaw=Math.atan2(sd[1],sd[0])+1.10;
    cam.pitch=0.30;
    setFocus('earth',true);
    onSpeed();
    buildCfg();
  }]);
  step(0);
}
function step(i){
  if(i>=TASKS.length){
    $('lf').style.width='100%'; $('ls').textContent='READY';
    setTimeout(()=>{$('load').classList.add('gone');
      setTimeout(()=>$('load').remove(),900);},240);
    setTimeout(()=>{$('hint').style.opacity=0;},11000);
    requestAnimationFrame(loop);
    return;
  }
  $('ls').textContent=TASKS[i][0];
  $('lf').style.width=(i/TASKS.length*100).toFixed(1)+'%';
  (document.hidden?(f=>setTimeout(f,0)):(f=>requestAnimationFrame(f)))(()=>{
    try{TASKS[i][1]();}catch(e){
      $('err').style.display='block';
      $('err').textContent='任务失败 ['+TASKS[i][0]+']\n'+(e.stack||e.message||e);
      return;}
    step(i+1);
  });
}

let lastT=0,fps=60,frames=0,fpsT=0;
function loop(t){
  const dt=Math.min(0.1,(t-lastT)/1000||0.016); lastT=t;
  frames++; fpsT+=dt;
  if(fpsT>0.5){fps=frames/fpsT;frames=0;fpsT=0;}
  if(playing) jd+=speed*dt;
  computeStates(jd);
  // 自动曝光
  const fb=bodyMap[cam.focus];
  const rr=(cam.focus==='sun')?clamp(cam.dist,0.011,45):Math.max(len(fb.pos),0.28);
  const closeness=smoothstep(2600,55,cam.dist/Math.max(dispR(fb),1e-12));
  const target=Math.pow(clamp(rr,0.011,45),1.85*closeness)*cfg.expo*(1.0+0.85*(1.0-closeness));
  expoNow=expoNow*Math.pow(target/expoNow,Math.min(1,dt*2.2));
  updateCamera(dt);
  resize();
  render();
  updateLabels();
  const D=fmtDate(jd);
  $('clock').textContent=D.a; $('clockd').textContent=D.b;
  $('rate').textContent=(playing?'▶ ':'❚❚ ')+fmtRate(speed);
  $('jd').textContent='JD '+jd.toFixed(4);
  updateLive();
  $('stats').innerHTML='<b>'+fps.toFixed(0)+'</b> FPS · '+W+'×'+H+'<br>'+
    '视距 <b>'+fmtLen(cam.dist)+'</b><br>曝光 <b>'+(expoNow<10?expoNow.toFixed(2):expoNow.toFixed(0))+'</b>'+
    ' · 焦点 <b>'+bodyMap[cam.focus].zh+'</b>';
  requestAnimationFrame(loop);
}
try{boot();}catch(e){
  $('err').style.display='block'; $('err').textContent='启动失败\n'+(e.stack||e.message||e);}
</script>
