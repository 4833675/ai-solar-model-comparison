<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System · Real-time Keplerian Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #04060c;
      --fg: #e7ecf3;
      --muted: #8a93a6;
      --accent: #6ad0ff;
      --accent2: #ffb86b;
      --line: rgba(255, 255, 255, 0.08);
      --glass: rgba(10, 14, 24, 0.55);
      --glass-strong: rgba(10, 14, 24, 0.78);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ------- UI ------- */
    .panel {
      position: fixed;
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--fg);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.04);
      user-select: none;
    }

    #title {
      top: 18px;
      left: 18px;
      padding: 14px 18px;
      max-width: 320px;
    }
    #title h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #title h1::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffd27a 0%, #ff7a3a 70%, transparent 100%);
      box-shadow: 0 0 12px #ffb86b;
    }
    #title p {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    #controls {
      top: 18px;
      right: 18px;
      padding: 14px 16px;
      width: 280px;
    }
    #controls .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
    }
    #controls label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.3px;
    }
    #controls .value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      min-width: 56px;
      text-align: right;
    }
    #controls input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--p, 50%), rgba(255,255,255,0.1) var(--p, 50%));
      border-radius: 2px;
      outline: none;
    }
    #controls input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(106, 208, 255, 0.6);
    }
    #controls .group {
      border-top: 1px solid var(--line);
      margin-top: 8px;
      padding-top: 8px;
    }
    #controls .toggle {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    #controls .chip {
      flex: 1;
      text-align: center;
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      cursor: pointer;
      color: var(--muted);
      transition: all 0.18s;
    }
    #controls .chip.active {
      background: rgba(106, 208, 255, 0.12);
      border-color: rgba(106, 208, 255, 0.4);
      color: var(--fg);
    }
    #controls .chip:hover { color: var(--fg); }

    #planets {
      bottom: 18px;
      left: 18px;
      padding: 10px;
      width: 280px;
    }
    #planets h3 {
      margin: 4px 8px 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .planet-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .planet-row:hover { background: rgba(255,255,255,0.04); }
    .planet-row.active { background: rgba(106, 208, 255, 0.1); }
    .planet-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }
    .planet-name {
      font-size: 13px;
      font-weight: 500;
      flex: 1;
    }
    .planet-info {
      font-size: 10px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    #info {
      bottom: 18px;
      right: 18px;
      padding: 12px 16px;
      min-width: 240px;
      font-family: 'JetBrains Mono', monospace;
    }
    #info .k { color: var(--muted); font-size: 11px; }
    #info .v { color: var(--fg); font-size: 12px; }
    #info .row { display: flex; justify-content: space-between; padding: 3px 0; gap: 16px; }

    #hud {
      position: fixed;
      pointer-events: none;
      color: var(--fg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
    }

    .label {
      position: absolute;
      transform: translate(-50%, -150%);
      padding: 3px 8px;
      background: var(--glass-strong);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 11px;
      letter-spacing: 0.4px;
      white-space: nowrap;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .label .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      z-index: 100;
      transition: opacity 0.6s;
    }
    #loading .ring {
      width: 48px; height: 48px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 760px) {
      #title { max-width: 220px; }
      #controls { width: 240px; }
      #planets { width: 240px; }
      #info { min-width: 200px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="loading"><div class="ring"></div></div>

  <div id="title" class="panel">
    <h1>SOLAR SYSTEM</h1>
    <p>Real-time Keplerian orbits · 8 planets + Sun · Kepler's equation solved per frame</p>
  </div>

  <div id="controls" class="panel">
    <div class="row">
      <label>Time speed</label>
      <span class="value" id="speedVal">1.0 days/s</span>
    </div>
    <div class="row">
      <input id="speed" type="range" min="0" max="6" step="0.01" value="1" style="--p: 16%" />
    </div>
    <div class="group row" style="display:block">
      <div class="toggle" style="margin-bottom:6px">
        <div class="chip active" data-toggle="orbits">Orbits</div>
        <div class="chip active" data-toggle="labels">Labels</div>
        <div class="chip" data-toggle="trails">Trails</div>
        <div class="chip active" data-toggle="bloom">Bloom</div>
      </div>
      <div class="toggle">
        <div class="chip" data-toggle="pause">Pause</div>
        <div class="chip" data-toggle="reset">Reset</div>
      </div>
    </div>
    <div class="group row" style="display:block">
      <label style="display:block; margin-bottom:6px">Camera follow</label>
      <div class="toggle">
        <div class="chip active" data-follow="free">Free</div>
        <div class="chip" data-follow="sun">Sun</div>
      </div>
    </div>
  </div>

  <div id="planets" class="panel">
    <h3>PLANETS</h3>
    <div id="planetList"></div>
  </div>

  <div id="info" class="panel">
    <div class="row"><span class="k">Frame</span><span class="v" id="fps">0 fps</span></div>
    <div class="row"><span class="k">Sim time</span><span class="v" id="simT">J2000 + 0d</span></div>
    <div class="row"><span class="k">Distance</span><span class="v" id="dist">— AU</span></div>
    <div class="row"><span class="k">Target</span><span class="v" id="target">—</span></div>
  </div>

  <div id="hud"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// Solar System — Real-time Keplerian simulation
// Author: opencode
// All orbit elements are real (NASA JPL). Visual sizes use a power scaling
// so all planets remain visible; relative orbital spacing uses a^(0.48).

// Defensive polyfill: silence a benign Chrome devtools bug
// "window.__chromium_devtools_metrics_reporter is not a function" that
// fires in some Chrome 120+ builds before the metrics hook is initialized.
try {
  Object.defineProperty(window, '__chromium_devtools_metrics_reporter', {
    value: function () { /* noop */ },
    writable: false,
    configurable: true
  });
} catch (_) { /* already defined */ }


// ============================================================
// 1. Real astronomical data (NASA JPL, J2000 epoch)
//    a        : semi-major axis (AU)
//    e        : eccentricity
//    i        : inclination to ecliptic (deg)
//    period   : orbital period (Earth days)
//    radius   : mean radius (Earth radii)  -> scaled visually
//    color    : approximate surface tint
// ============================================================
const AU_SCENE  = 5.0;            // 1 AU in scene units
const A_POW     = 0.48;           // orbital radius compression
const PLANETS_DATA = [
  { key:'mercury', name:'Mercury', a:0.38710, e:0.20563, i:7.005,  period:87.969,  radius:0.383, color:0xa6a6a6, accent:0xb8b8b8, desc:'Smallest planet, 88-day orbit' },
  { key:'venus',   name:'Venus',   a:0.72333, e:0.00677, i:3.395,  period:224.701, radius:0.949, color:0xe8c07a, accent:0xffd9a3, desc:'Hottest planet, retrograde spin' },
  { key:'earth',   name:'Earth',   a:1.00000, e:0.01671, i:0.000,  period:365.256, radius:1.000, color:0x3d7fbf, accent:0x6ab0ff, desc:'Home, 365.25-day orbit' },
  { key:'mars',    name:'Mars',    a:1.52368, e:0.09339, i:1.848,  period:686.971, radius:0.532, color:0xc1532a, accent:0xff6a3d, desc:'Red planet, 687-day orbit' },
  { key:'jupiter', name:'Jupiter', a:5.20260, e:0.04839, i:1.304,  period:4332.59, radius:11.21, color:0xd0a070, accent:0xffc28a, desc:'Largest, banded gas giant' },
  { key:'saturn',  name:'Saturn',  a:9.55491, e:0.05386, i:2.486,  period:10759.2, radius:9.45,  color:0xe6cf95, accent:0xffe5a8, desc:'Ringed gas giant' },
  { key:'uranus',  name:'Uranus',  a:19.2184, e:0.04726, i:0.773,  period:30688.5, radius:4.01,  color:0x9fdce6, accent:0xb6f0fa, desc:'Ice giant tipped on its side' },
  { key:'neptune', name:'Neptune', a:30.0714, e:0.00859, i:1.770,  period:60182.0, radius:3.88,  color:0x3d5fcf, accent:0x5b86ff, desc:'Windiest planet, deep blue' }
];

// Visual radius function: log-ish so tiny planets stay visible
function visualRadius(r) {
  // Mercury 0.19, Earth 0.24, Jupiter 0.50, Saturn 0.47
  return 0.16 * Math.pow(r, 0.45) + 0.08;
}
function sceneOrbit(a) {
  return AU_SCENE * Math.pow(a, A_POW);
}

// ============================================================
// 2. Kepler solver — solve M = E - e*sin(E) for E (Newton-Raphson)
// ============================================================
function solveKepler(M, e, eps = 1e-7, iters = 12) {
  // Normalize M to [-PI, PI]
  M = ((M + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  let E = e < 0.8 ? M : Math.PI * Math.sign(M);
  for (let i = 0; i < iters; i++) {
    const f  = E - e * Math.sin(E) - M;
    const fp = 1 - e * Math.cos(E);
    const dE = f / fp;
    E -= dE;
    if (Math.abs(dE) < eps) break;
  }
  return E;
}

// Position in orbital plane from true anomaly via E
function orbitalPosition(a, e, E) {
  const x = a * (Math.cos(E) - e);
  const y = a * Math.sqrt(1 - e * e) * Math.sin(E);
  return { x, y };
}

// ============================================================
// 3. Renderer / scene / camera
// ============================================================
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c);
scene.fog = null;

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 4000);
camera.position.set(0, 22, 42);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.5;
controls.maxDistance = 300;
controls.target.set(0, 0, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.18;

// ============================================================
// 4. Lighting
// ============================================================
const sunLight = new THREE.PointLight(0xfff1d0, 3.4, 0, 1.2);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

const ambient = new THREE.AmbientLight(0x101420, 0.35);
scene.add(ambient);

// ============================================================
// 5. Star field + nebula backdrop
// ============================================================
function makeStarfield(count, radius) {
  const positions = new Float32Array(count * 3);
  const colors    = new Float32Array(count * 3);
  const sizes     = new Float32Array(count);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    // Uniform on sphere
    const u = Math.random();
    const v = Math.random();
    const theta = 2 * Math.PI * u;
    const phi   = Math.acos(2 * v - 1);
    const r = radius * (0.85 + 0.15 * Math.random());
    positions[i*3+0] = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);

    // Star color: mostly white, some blue, some red
    const t = Math.random();
    if (t < 0.7) c.setRGB(1, 1, 1);
    else if (t < 0.85) c.setHSL(0.6, 0.5, 0.85);
    else if (t < 0.95) c.setHSL(0.08, 0.6, 0.7);
    else c.setHSL(0.13, 0.7, 0.65);
    const bright = 0.4 + Math.random() * 0.6;
    colors[i*3+0] = c.r * bright;
    colors[i*3+1] = c.g * bright;
    colors[i*3+2] = c.b * bright;
    sizes[i] = Math.pow(Math.random(), 6) * 6.0 + 0.4;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));
  return geo;
}

function makeNebula(starGeo) {
  // A few large soft sprites, faked via Points with circular alpha
  const count = starGeo.attributes.position.count;
  const positions = starGeo.attributes.position.array;
  const colors = new Float32Array(count * 3);
  const sizes  = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    positions[i*3+0] *= 0.97;
    positions[i*3+1] *= 0.97;
    positions[i*3+2] *= 0.97;
    const palette = Math.random();
    let r,g,b;
    if (palette < 0.33)      { r=0.20; g=0.10; b=0.40; }
    else if (palette < 0.66) { r=0.10; g=0.20; b=0.50; }
    else                     { r=0.40; g=0.10; b=0.20; }
    const a = Math.pow(Math.random(), 4) * 0.18;
    colors[i*3+0] = r * a;
    colors[i*3+1] = g * a;
    colors[i*3+2] = b * a;
    sizes[i] = Math.pow(Math.random(), 3) * 50 + 10;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));
  return geo;
}

const starGeo = makeStarfield(22000, 1500);
const nebGeo  = makeNebula(starGeo.clone());

const starMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: /* glsl */`
    attribute float size;
    varying vec3 vColor;
    uniform float uTime;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      // subtle twinkle
      float t = 0.85 + 0.15 * sin(uTime * 0.6 + position.x * 0.13 + position.y * 0.27);
      gl_PointSize = size * t * (300.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d);
      // soft cross flare
      float cross = exp(-abs(c.x) * 22.0) * 0.35 + exp(-abs(c.y) * 22.0) * 0.35;
      a += cross;
      gl_FragColor = vec4(vColor * a, a);
    }`,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true
});

const nebMat = new THREE.ShaderMaterial({
  uniforms: {},
  vertexShader: /* glsl */`
    attribute float size;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (200.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d);
      a *= a;
      gl_FragColor = vec4(vColor * a, a);
    }`,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true
});

const stars = new THREE.Points(starGeo, starMat);
const neb   = new THREE.Points(nebGeo,  nebMat);
scene.add(neb);
scene.add(stars);

// ============================================================
// 6. Sun — custom shader with FBM turbulence + atmosphere + flare
// ============================================================
const sunUniforms = {
  uTime: { value: 0 }
};

const sunMat = new THREE.ShaderMaterial({
  uniforms: sunUniforms,
  vertexShader: /* glsl */`
    varying vec3 vNormal;
    varying vec3 vPos;
    varying vec2 vUv;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vPos = position;
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vNormal;
    varying vec3 vPos;
    varying vec2 vUv;
    uniform float uTime;

    // 3D hash + value noise + FBM
    float hash(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
    float vnoise(vec3 p) {
      vec3 i = floor(p);
      vec3 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(mix(hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)), f.x),
            mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
        mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
            mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y),
        f.z);
    }
    float fbm(vec3 p) {
      float a = 0.5; float v = 0.0;
      for (int i = 0; i < 5; i++) {
        v += a * vnoise(p);
        p *= 2.07; a *= 0.5;
      }
      return v;
    }
    void main() {
      vec3 p = normalize(vPos) * 2.4;
      float t = uTime * 0.08;
      float n1 = fbm(p + vec3(t, t*0.7, -t*0.5));
      float n2 = fbm(p*2.0 + vec3(-t*0.6, t*0.3, t*0.8));
      float n  = mix(n1, n2, 0.5);
      // hot core, cooler edges
      float temp = pow(n, 1.2);
      vec3 hot  = vec3(1.00, 0.95, 0.80);
      vec3 mid  = vec3(1.00, 0.72, 0.30);
      vec3 cool = vec3(0.95, 0.32, 0.08);
      vec3 col = mix(cool, mid, smoothstep(0.2, 0.6, temp));
      col = mix(col, hot, smoothstep(0.6, 0.95, temp));
      // granulation highlights
      col += 0.18 * pow(n2, 4.0) * vec3(1.0, 0.9, 0.7);
      // limb darkening softened
      col *= 0.9 + 0.1 * dot(normalize(vNormal), vec3(0,0,1));
      gl_FragColor = vec4(col, 1.0);
    }`
});

const sunGeom = new THREE.SphereGeometry(1.8, 96, 64);

    varying vec3 vNormal;
    varying vec3 vWorldPos;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    uniform float uTime;
    void main() {
      // view-dependent fresnel: brightest at the silhouette
      float f = pow(1.0 - abs(dot(normalize(vNormal), vec3(0,0,1))), 2.2);

      float wisp = 0.5 + 0.5 * sin(uTime * 0.6 + vWorldPos.x * 0.5 + vWorldPos.y * 0.7);
      float a = f * (0.55 + 0.25 * wisp);

  transparent: true,

// ============================================================
// 7. Planet factory — procedural surface + atmosphere
// ============================================================
const planetVS = /* glsl */`
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  varying vec3 vLocalPos;
  void main() {
    vNormal = normalize(normalMatrix * normal);
    vLocalPos = position;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;

function noise2D(x, y) {
  return (Math.sin(x*12.9898 + y*78.233) * 43758.5453) % 1;
}
function fbm2(x, y) {
  let v = 0, a = 0.5;
  for (let i = 0; i < 5; i++) {
    v += a * (Math.sin((x*1.7 + y*0.9 + i*11.3) * 12.9898 + 7.0) * 0.5 + 0.5);
    x *= 2.0; y *= 2.0; a *= 0.5;
  }
  return v;
}

function makePlanetMaterial(planet) {
  const baseColor  = new THREE.Color(planet.color);
  const accentColor = new THREE.Color(planet.accent);
  const k = planet.key;
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime:      { value: 0 },
      uSunDir:    { value: new THREE.Vector3(1, 0, 0) },
      uColor:     { value: baseColor },
      uAccent:    { value: accentColor },
      uKey:       { value: planetKeyId(k) },
      uSeed:      { value: planet.a * 17.3 + (k.charCodeAt(0) % 7) * 3.1 }
    },
    vertexShader: planetVS,
    fragmentShader: /* glsl */`
      varying vec3 vNormal;
      varying vec3 vWorldPos;
      varying vec3 vLocalPos;
      uniform vec3 uSunDir;
      uniform vec3 uColor;
      uniform vec3 uAccent;
      uniform float uTime;
      uniform float uSeed;
      uniform float uKey; // 0=mercury 1=venus 2=earth 3=mars 4=jupiter 5=saturn 6=uranus 7=neptune

      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vnoise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        f = f*f*(3.0-2.0*f);
        return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
                   mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
      }
      float fbm(vec2 p) {
        float a = 0.5; float v = 0.0;
        for (int i=0;i<5;i++) { v += a*vnoise(p); p*=2.0; a*=0.5; } return v;
      }

      // 3-octave for clouds
      float clouds(vec2 uv, float t) {
        float a = 0.55, v = 0.0;
        v += a * vnoise(uv * 4.0 + vec2(t*0.01, 0.0));
        v += a*0.5 * vnoise(uv * 8.0 + vec2(t*0.02, t*0.01));
        v += a*0.25 * vnoise(uv * 16.0 + vec2(0.0, t*0.03));
        return v;
      }

      void main() {
        vec3 N = normalize(vNormal);
        vec3 L = normalize(uSunDir);
        float ndl = max(dot(N, L), 0.0);

        // spherical UV from local pos
        vec3 lp = normalize(vLocalPos);
        float lat = asin(lp.y);        // -PI/2..PI/2
        float lon = atan(lp.z, lp.x);  // -PI..PI
        vec2 uv = vec2(lon/6.28318 + 0.5, lat/3.14159 + 0.5);

        vec3 surface;
        float specMask = 0.0;

        if (uKey < 0.5) {
          // Mercury — cratered grey
          float n  = fbm(uv * 8.0 + uSeed);
          float cr = pow(vnoise(uv * 28.0 + uSeed*2.0), 6.0);
          surface = mix(uColor, uAccent, n*0.6);
          surface = mix(surface, uColor*0.55, cr*0.7);
        } else if (uKey < 1.5) {
          // Venus — thick yellow clouds, slow swirl
          vec2 cuv = uv * vec2(3.0, 5.0) + vec2(uTime*0.005, 0.0);
          float c = clouds(cuv, uTime);
          float bands = sin(uv.y * 8.0) * 0.5 + 0.5;
          surface = mix(uColor*0.85, uAccent, c*0.8 + bands*0.3);
          specMask = 0.4;
        } else if (uKey < 2.5) {
          // Earth — oceans + continents + clouds
          float n  = fbm(uv * 5.0 + uSeed);
          float continent = smoothstep(0.48, 0.62, n);
          vec3 ocean = vec3(0.10, 0.30, 0.55);
          vec3 land  = mix(vec3(0.20, 0.45, 0.20), vec3(0.55, 0.45, 0.25), fbm(uv*10.0 + uSeed));
          surface = mix(ocean, land, continent);
          // ice caps
          float ice = smoothstep(0.42, 0.5, abs(uv.y - 0.5));
          surface = mix(surface, vec3(0.92, 0.96, 1.0), ice);
          // clouds
          float cl = clouds(uv * 4.0 + vec2(uTime*0.008, 0.0), uTime);
          surface = mix(surface, vec3(0.95), smoothstep(0.55, 0.75, cl) * 0.55);
          specMask = 0.45;
        } else if (uKey < 3.5) {
          // Mars — rust + ice caps + dark plains
          float n = fbm(uv * 6.0 + uSeed);
          float plains = smoothstep(0.35, 0.7, n);
          surface = mix(uColor*0.6, uColor, plains);
          surface = mix(surface, uAccent*0.7, fbm(uv*14.0 + uSeed*2.0)*0.4);
          float ice = smoothstep(0.42, 0.48, abs(uv.y - 0.5));
          surface = mix(surface, vec3(0.95, 0.92, 0.88), ice);
        } else if (uKey < 4.5) {
          // Jupiter — bands + great red spot
          float bands = sin(uv.y * 22.0) * 0.5 + 0.5;
          float turb  = fbm(uv * vec2(5.0, 18.0) + uTime*0.01);
          surface = mix(uColor*0.7, uAccent, bands*0.6 + turb*0.3);
          // GRS at lat ~ -0.18
          vec2 grsCenter = vec2(0.35, 0.32);
          float grs = exp(-length((uv - grsCenter) * vec2(8.0, 22.0)));
          surface = mix(surface, vec3(0.85, 0.30, 0.18), grs * 0.85);
        } else if (uKey < 5.5) {
          // Saturn — soft bands
          float bands = sin(uv.y * 16.0) * 0.5 + 0.5;
          float turb  = fbm(uv * vec2(4.0, 12.0) + uTime*0.008);
          surface = mix(uColor, uAccent, bands*0.5 + turb*0.3);
        } else if (uKey < 6.5) {
          // Uranus — cyan with faint bands
          float bands = sin(uv.y * 10.0) * 0.05;
          surface = uColor + bands;
          float turb  = fbm(uv * 6.0) * 0.1;
          surface += vec3(turb);
        } else {
          // Neptune — deep blue + faint storms
          float n = fbm(uv * 4.0 + uSeed);
          surface = uColor + vec3(0.0, 0.02, 0.05) * n;
          float storm = smoothstep(0.85, 0.95, fbm(uv*2.0));
          surface = mix(surface, vec3(0.3, 0.4, 0.7), storm*0.4);
        }

        float ambient = 0.04;
        vec3 lit = surface * (ndl + ambient);

        // Specular highlight (oceans / cloud tops)
        if (specMask > 0.01) {
          vec3 V = normalize(cameraPosition - vWorldPos);
          vec3 H = normalize(L + V);
          float spec = pow(max(dot(N, H), 0.0), 48.0);
          lit += spec * 0.6 * specMask * vec3(1.0, 0.95, 0.85);
        }

        // Soft terminator
        float term = smoothstep(0.0, 0.15, ndl);
        lit *= mix(0.3, 1.0, term);

        gl_FragColor = vec4(lit, 1.0);
      }`
  });
}

function planetKeyId(k) {
  const order = ['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune'];
  return order.indexOf(k);
}

// Build planets
const planets = [];
const orbitLines = [];

for (let i = 0; i < PLANETS_DATA.length; i++) {
  const p = PLANETS_DATA[i];
  const r = visualRadius(p.radius);
  const geom = new THREE.SphereGeometry(r, 64, 48);
  const mat  = makePlanetMaterial(p);
  const mesh = new THREE.Mesh(geom, mat);

  // Random starting mean anomaly + node + arg of perihelion
  const M0   = Math.random() * Math.PI * 2;
  const node = Math.random() * Math.PI * 2;
  const argP = Math.random() * Math.PI * 2;
  const incl = THREE.MathUtils.degToRad(p.i);

  const group = new THREE.Group();
  group.add(mesh);
  scene.add(group);

  // Atmosphere shell (back-side, additive)
  const atmMat = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(p.accent) }, uPower: { value: 2.0 } },
    vertexShader: /* glsl */`
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vNormal;
      uniform vec3 uColor;
      uniform float uPower;
      void main() {
        float intensity = pow(0.7 - dot(vNormal, vec3(0,0,1)), uPower);
        gl_FragColor = vec4(uColor, 1.0) * intensity;
      }`,
    transparent: true,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    depthWrite: false
  });
  const atm = new THREE.Mesh(new THREE.SphereGeometry(r * 1.18, 32, 24), atmMat);
  group.add(atm);

  // Saturn rings
  let rings = null;
  if (p.key === 'saturn') {
    rings = makeSaturnRings(r);
    group.add(rings);
  }

  // Build orbit line
  const lineMat = new THREE.LineBasicMaterial({
    color: p.accent,
    transparent: true,
    opacity: 0.35,
    depthWrite: false
  });
  const linePts = [];
  const segs = 256;
  for (let s = 0; s <= segs; s++) {
    const E = (s / segs) * Math.PI * 2;
    const pos = orbitalPosition(p.a, p.e, E);
    linePts.push(new THREE.Vector3(pos.x, 0, pos.y));
  }
  const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
  const line = new THREE.LineLoop(lineGeo, lineMat);
  // Tilt by inclination
  line.rotation.x = incl;
  line.rotation.z = node;
  scene.add(line);
  orbitLines.push(line);

  // Trail buffer (line strip)
  const trailMax = 600;
  const trailPos = new Float32Array(trailMax * 3);
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
  trailGeo.setDrawRange(0, 0);
  const trailMat = new THREE.LineBasicMaterial({
    color: p.accent,
    transparent: true,
    opacity: 0.7,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const trail = new THREE.Line(trailGeo, trailMat);
  scene.add(trail);

  planets.push({
    data: p,
    mesh, mat, atm, rings, group, line, trail, trailGeo, trailPos,
    trailMax, trailCount: 0,
    r, M0, node, argP, incl
  });
}

function makeSaturnRings(planetR) {
  const inner = planetR * 1.35;
  const outer = planetR * 2.70;
  const segs = 256;
  const positions = [];
  const colors = [];
  const uvs = [];
  const indices = [];
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    const cx = Math.cos(a), cz = Math.sin(a);
    positions.push(cx*inner, 0, cz*inner);  uvs.push(0, 0);
    positions.push(cx*outer, 0, cz*outer);  uvs.push(1, 0);
  }
  for (let i = 0; i < segs; i++) {
    const a = i*2, b = i*2+1, c = i*2+2, d = i*2+3;
    indices.push(a, b, d, a, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    uniforms: {
      uInner: { value: inner },
      uOuter: { value: outer },
      uSunDir: { value: new THREE.Vector3(1, 0, 0) }
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      varying float vR;
      varying vec3 vWorldPos;
      uniform float uInner; uniform float uOuter;
      void main() {
        vUv = uv;
        vR = length(position.xz);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: /* glsl */`
      varying vec2 vUv;
      varying float vR;
      varying vec3 vWorldPos;
      uniform float uInner; uniform float uOuter;
      uniform vec3 uSunDir;
      float hash(float x) { return fract(sin(x*127.1)*43758.5453); }
      float noise1(float x) {
        float i = floor(x), f = fract(x);
        f = f*f*(3.0-2.0*f);
        return mix(hash(i), hash(i+1.0), f);
      }
      void main() {
        float t = (vR - uInner) / (uOuter - uInner);
        // Multi-frequency ringlets
        float band1 = sin(t * 110.0) * 0.5 + 0.5;
        float band2 = sin(t * 35.0 + 1.3) * 0.5 + 0.5;
        float band3 = sin(t * 220.0 + 0.5) * 0.5 + 0.5;
        float fine  = noise1(t * 800.0);
        // Cassini-like gap near t ~ 0.55
        float cassini = smoothstep(0.53, 0.555, t) * smoothstep(0.585, 0.555, t);
        float density = band1*0.35 + band2*0.4 + band3*0.15 + fine*0.10;
        float a = density * (1.0 - cassini);
        // Edge fade
        a *= smoothstep(0.0, 0.04, t) * smoothstep(1.0, 0.94, t);
        // Color gradient: brighter inner, dimmer outer
        vec3 colA = vec3(0.95, 0.86, 0.68);
        vec3 colB = vec3(0.78, 0.62, 0.42);
        vec3 col  = mix(colA, colB, t);
        // Sun lighting: brighter on lit side
        vec3 L = normalize(uSunDir);
        float sunDot = max(dot(normalize(vWorldPos), L), 0.0);
        col *= 0.4 + 0.6 * sunDot;
        gl_FragColor = vec4(col, a);
      }`
  });
  return new THREE.Mesh(geo, mat);
}

// ============================================================
// 8. Moon (Earth's)

const moonMat = new THREE.ShaderMaterial({
  uniforms: { uSunDir: { value: new THREE.Vector3(1,0,0) } },
  vertexShader: /* glsl */`
    varying vec3 vNormal;
    varying vec3 vLocal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vLocal = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vNormal;
    varying vec3 vLocal;
    uniform vec3 uSunDir;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vnoise(vec2 p) {
      vec2 i = floor(p); vec2 f = fract(p);
      f = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
                 mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
    }
    float fbm(vec2 p) {
      float a=0.5,v=0.0; for (int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.0; a*=0.5; } return v;
    }
    void main() {
      vec3 N = normalize(vNormal);
      vec3 L = normalize(uSunDir);
      float ndl = max(dot(N,L),0.0);
      float lat = asin(vLocal.y);

      vec2 uv = vec2(lon/6.28318 + 0.5, lat/3.14159 + 0.5);

      vec3 base = mix(vec3(0.55), vec3(0.85), craters);
      gl_FragColor = vec4(base * (0.05 + 0.95 * ndl), 1.0);
    }`
});

// Subtle vignette + grain
const VignetteShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform float uTime;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 q = vUv - 0.5;
      float v = smoothstep(0.85, 0.30, length(q));
      c.rgb *= mix(0.6, 1.0, v);
      // grain
      float g = fract(sin(dot(vUv*1024.0 + uTime, vec2(12.9898,78.233))) * 43758.5453);
      c.rgb += (g - 0.5) * 0.025;
      gl_FragColor = c;
    }`
};
const vignettePass = new ShaderPass(VignetteShader);
composer.addPass(vignettePass);

  const map = [0, 1, 7, 30, 365, 3650, 36500];
  const idx = Math.min(5, Math.floor(v));
  const t = v - idx;
  const lo = map[idx], hi = map[Math.min(idx+1, 6)];
  state.speedDaysPerSec = lo * Math.pow(hi/lo, t);
  let label;
  const s = state.speedDaysPerSec;
  if (s < 1) label = `${(s*24).toFixed(1)} h/s`;
  else if (s < 100) label = `${s.toFixed(1)} d/s`;
  else if (s < 1000) label = `${(s/7).toFixed(1)} w/s`;
  else if (s < 100000) label = `${(s/365.25).toFixed(1)} yr/s`;
  else label = `${(s/3652.5).toFixed(1)} ×10yr/s`;
  speedVal.textContent = label;
  speedEl.style.setProperty('--p', `${(v/6*100).toFixed(1)}%`);
}
speedEl.addEventListener('input', updateSpeedUI);
updateSpeedUI();

document.querySelectorAll('#controls .chip[data-toggle]').forEach(chip => {
  chip.addEventListener('click', () => {
    const k = chip.dataset.toggle;
    if (k === 'pause') {
      state.paused = !state.paused;
      chip.classList.toggle('active', state.paused);
    } else if (k === 'reset') {
      state.simDays = 0;
      for (const p of planets) {
        p.trailCount = 0;
        p.trailGeo.setDrawRange(0, 0);
        p.trailGeo.attributes.position.needsUpdate = true;
      }
    } else if (k === 'orbits') {
      state.showOrbits = !state.showOrbits;
      for (const ln of orbitLines) ln.visible = state.showOrbits;
      chip.classList.toggle('active', state.showOrbits);
    } else if (k === 'labels') {
      state.showLabels = !state.showLabels;
      chip.classList.toggle('active', state.showLabels);
    } else if (k === 'trails') {
      state.showTrails = !state.showTrails;
      chip.classList.toggle('active', state.showTrails);
    } else if (k === 'bloom') {
      state.useBloom = !state.useBloom;
      bloomPass.enabled = state.useBloom;
      chip.classList.toggle('active', state.useBloom);
    }
  });
});

document.querySelectorAll('#controls .chip[data-follow]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#controls .chip[data-follow]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.follow = chip.dataset.follow;
  });
});

// Build planet list UI
const listEl = $('planetList');
for (const p of planets) {
  const row = document.createElement('div');
  row.className = 'planet-row';
  const hex = '#' + new THREE.Color(p.data.accent).getHexString();
  row.innerHTML = `
    <span class="planet-dot" style="background:${hex};color:${hex}"></span>
    <span class="planet-name">${p.data.name}</span>
    <span class="planet-info">${p.data.period.toFixed(1)}d</span>`;
  row.addEventListener('click', () => {
    document.querySelectorAll('.planet-row').forEach(r => r.classList.remove('active'));
    row.classList.add('active');
    state.follow = p.data.key;
    document.querySelectorAll('#controls .chip[data-follow]').forEach(c => c.classList.remove('active'));
    $('target').textContent = p.data.name;
  });
  listEl.appendChild(row);
}

// ============================================================
// 12. Resize
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// 13. Animation loop
// ============================================================
const clock = new THREE.Clock();
let frame = 0, fps = 0, fpsT = performance.now();
const tmpV = new THREE.Vector3();
const sunPos = new THREE.Vector3(0, 0, 0);

function updatePlanet(p, dtDays) {
  // mean motion n = 2π / period (rad/day)
  const n = (2 * Math.PI) / p.data.period;
  const M = p.M0 + n * (state.simDays + dtDays);
  const E = solveKepler(M, p.data.e);
  const pos = orbitalPosition(p.data.a, p.data.e, E);

  // Compute world position with incl + node + arg of perihelion
  // First: rotate in plane by argP
  const ca = Math.cos(p.argP), sa = Math.sin(p.argP);
  const x1 = pos.x * ca - pos.y * sa;
  const y1 = pos.x * sa + pos.y * ca;
  // Tilt by inclination around x-axis
  const ci = Math.cos(p.incl), si = Math.sin(p.incl);
  const y2 = y1 * ci;
  const z2 = y1 * si;
  // Rotate around y-axis by node
  const cn = Math.cos(p.node), sn = Math.sin(p.node);
  const X = x1 * cn - z2 * sn;
  const Z = x1 * sn + z2 * cn;
  const Y = y2;

  const sc = sceneOrbit(p.data.a);
  p.group.position.set(X * sc, Y * sc, Z * sc);
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.1);
  const realElapsedDays = state.paused ? 0 : state.speedDaysPerSec * dt;
  state.simDays += realElapsedDays;

  // Update sun
  sunUniforms.uTime.value += dt;
  // Scale flare with camera distance so it never dominates the view
  const sunDist = camera.position.length();
  const flareScale = THREE.MathUtils.clamp(sunDist * 0.32, 5.0, 12);
  sunFlare.lookAt(camera.position);
  sunFlare.scale.set(flareScale, flareScale, 1);
  sunFlare.material.opacity = 0.85 + 0.1 * Math.sin(performance.now() * 0.001);
  corona.rotation.y += dt * 0.04;
  corona.rotation.x += dt * 0.01;

  // Update planets
  for (const p of planets) {
    updatePlanet(p, 0);
    p.mesh.rotation.y += dt * (2 * Math.PI / (p.data.period * 0.05)); // visual spin
    p.mat.uniforms.uTime.value = sunUniforms.uTime.value;
    p.mat.uniforms.uSunDir.value
      .copy(sunPos)
      .sub(p.group.position)
      .normalize();
    p.atm.material.uniforms.uColor.value.set(p.data.accent);
    if (p.rings) {
      p.rings.material.uniforms.uSunDir.value
        .copy(sunPos).sub(p.group.position).normalize();
      p.rings.rotation.z = 0.47; // Saturn's axial tilt
    }

    // Trail update — sliding window: when full, shift left by one point
    if (state.showTrails) {
      const arr = p.trailPos;
      if (p.trailCount >= p.trailMax) {
        arr.copyWithin(0, 3);
        p.trailCount = p.trailMax - 1;
      }
      const i = p.trailCount * 3;
      arr[i+0] = p.group.position.x;
      arr[i+1] = p.group.position.y;
      arr[i+2] = p.group.position.z;
      p.trailCount++;
      p.trailGeo.attributes.position.needsUpdate = true;
      p.trailGeo.setDrawRange(0, p.trailCount);
    } else if (p.trailCount > 0 && (frame % 60 === 0)) {
      // Decay trails when off
      p.trailCount = 0;
      p.trailGeo.setDrawRange(0, 0);
    }
  }

  // Earth moon
  const earth = planets[2];
  const moonOrbit = 0.6;
  const moonPhase = state.simDays / 27.3;
  const mx = Math.cos(moonPhase) * moonOrbit;
  const mz = Math.sin(moonPhase) * moonOrbit;
  moon.position.set(
    earth.group.position.x + mx,
    earth.group.position.y,
    earth.group.position.z + mz
  );
  moonMat.uniforms.uSunDir.value
    .copy(sunPos).sub(moon.position).normalize();
  moon.rotation.y += dt * 0.5;

  // Camera follow
  if (state.follow === 'sun') {
    controls.target.lerp(sunPos, 0.1);
  } else if (state.follow !== 'free') {
    const tp = planets.find(p => p.data.key === state.follow);
    if (tp) {
      controls.target.lerp(tp.group.position, 0.15);
    }
  } else {
    controls.target.lerp(sunPos, 0.02);
  }

  // Update labels
  if (state.showLabels) {
    const w = window.innerWidth, h = window.innerHeight;
    for (const p of planets) {
      const el = labels[p.data.key];
      tmpV.copy(p.group.position).project(camera);
      const onScreen = tmpV.z < 1 && tmpV.z > -1;
      if (onScreen) {
        const x = (tmpV.x * 0.5 + 0.5) * w;
        const y = (-tmpV.y * 0.5 + 0.5) * h;
        el.style.left = x + 'px';
        el.style.top  = y + 'px';
        el.style.opacity = '0.95';
      } else {
        el.style.opacity = '0';
      }
    }
  } else {
    for (const k in labels) labels[k].style.opacity = '0';
  }

  // Update info
  if (frame % 12 === 0) {
    const now = performance.now();
    fps = (fps * 0.7 + (12000 / Math.max(1, now - fpsT)) * 0.3);
    fpsT = now;
    $('fps').textContent = `${fps.toFixed(0)} fps`;
    $('simT').textContent = `J2000 + ${formatDays(state.simDays)}`;
    if (state.follow === 'free' || state.follow === 'sun') {
      $('dist').textContent = `${camera.position.length().toFixed(2)} u`;
    } else {
      const tp = planets.find(p => p.data.key === state.follow);
      if (tp) {
        $('dist').textContent = `${tp.group.position.length().toFixed(2)} u`;
      }
    }
  }

  controls.update();
  vignettePass.uniforms.uTime.value = sunUniforms.uTime.value;
  composer.render();
  frame++;
  requestAnimationFrame(tick);
}

function formatDays(d) {
  if (d < 365.25) return `${d.toFixed(1)}d`;
  if (d < 36525)  return `${(d/365.25).toFixed(2)}y`;
  return `${(d/365.25).toFixed(0)}y`;
}

// Boot
window.addEventListener('load', () => {
  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => document.getElementById('loading').remove(), 700);
});
tick();

</script>
