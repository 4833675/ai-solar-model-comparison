<script>
"use strict";
/* =====================================================================
   太阳系动力模型 — 单文件 · WebGL2
   真实性：JPL 开普勒轨道根数(J2000 历元+世纪变率) · 真实自转/轴倾角/公转周期
           真实比例模式 · 月球潮汐锁定 · 木星特洛伊群 · 柯克伍德空隙 · 哈雷彗星
   视觉：  程序化行星表面 · 日冕 · 大气边缘 · 土星环(含行星投影) · 双尾彗星
           银河背景 · 小行星带 · HDR 泛光 · 镜头光斑 · ACES 色调映射
   ===================================================================== */
const TAU=Math.PI*2, DEG=Math.PI/180;
const AU_U=60, AU_KM=1.495978707e8;           // 1 AU = 60 场景单位
const GM_SUN=1.32712440018e11;                // km^3/s^2
const J2000=2451545.0, FAR=1e6;
const LOGC=2/Math.log2(FAR+1);                // 对数深度系数
const FOV=50*DEG;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
/* ---------- 向量 / 矩阵 ---------- */
const v3=(x=0,y=0,z=0)=>[x,y,z];
const vadd=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const vsub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const vscl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const vdot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const vcross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vlen=a=>Math.hypot(a[0],a[1],a[2]);
const vnorm=a=>{const l=vlen(a)||1;return[a[0]/l,a[1]/l,a[2]/l];};
const vlerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function m4persp(fov,asp,n,f){const t=1/Math.tan(fov/2);return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]);}
function m4lookAt(e,c,u){
  const f=vnorm(vsub(c,e)), s=vnorm(vcross(f,u)), up=vcross(s,f);
  return new Float32Array([s[0],up[0],-f[0],0, s[1],up[1],-f[1],0, s[2],up[2],-f[2],0, -vdot(s,e),-vdot(up,e),vdot(f,e),1]);
}
function m4mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
function m3rx(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([1,0,0, 0,c,s, 0,-s,c]);}
function m3ry(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([c,0,-s, 0,1,0, s,0,c]);}
function m3mul(a,b){const o=new Float32Array(9);for(let c=0;c<3;c++)for(let r=0;r<3;r++){let s=0;for(let k=0;k<3;k++)s+=a[k*3+r]*b[c*3+k];o[c*3+r]=s;}return o;}
const M3I=new Float32Array([1,0,0,0,1,0,0,0,1]);
const m3v=(m,v)=>[m[0]*v[0]+m[3]*v[1]+m[6]*v[2], m[1]*v[0]+m[4]*v[1]+m[7]*v[2], m[2]*v[0]+m[5]*v[1]+m[8]*v[2]];
const m3col=(m,i)=>[m[i*3],m[i*3+1],m[i*3+2]];
/* 行星自转轴固定朝向（惯性空间中不随公转摆动）: R = Ry(λ)·Rx(ε)·Ry(−λ) */
const m3fix=(lam,eps)=>m3mul(m3ry(lam),m3mul(m3rx(eps*DEG),m3ry(-lam)));
/* ---------- 儒略日 ---------- */
function dateToJD(y,m,d){if(m<3){y--;m+=12;}return d-32075+Math.floor(1461*(y+4800)/4)+Math.floor(367*(m-2)/12)-Math.floor(3*((y+4900)/100)/4)-0.5;}
function jdToCal(jd){
  const z=Math.floor(jd+0.5), f=jd+0.5-z; let a=z;
  if(z>=2299161){const aa=Math.floor((z-1867216.25)/36524.25); a=z+1+aa-Math.floor(aa/4);}
  const b=a+1524, c=Math.floor((b-122.1)/365.25), d=Math.floor(365.25*c), e=Math.floor((b-d)/30.6001);
  const day=b-d-Math.floor(30.6001*e)+f, mo=e<14?e-1:e-13, yr=mo>2?c-4716:c-4715;
  return [yr,mo,day];

function nowJD(){const n=new Date();return dateToJD(n.getUTCFullYear(),n.getUTCMonth()+1,n.getUTCDate())+(n.getUTCHours()+n.getUTCMinutes()/60+n.getUTCSeconds()/3600+n.getUTCMilliseconds()/3.6e6)/24;}
function fmtJD(jd){
  const [y,m,d]=jdToCal(jd), df=Math.floor(d), fr=(d-df)*24;

/* ---------- 开普勒轨道（JPL 近似星历，1800–2050） ---------- */
function solveKepler(M,e){
  M%=TAU; if(M>Math.PI)M-=TAU; if(M<-Math.PI)M+=TAU;
  let E=e<0.8?M:(M>=0?Math.PI:-Math.PI); /* 高偏心率按 M 符号取初值，避免收敛到错误分支 */
  for(let i=0;i<20;i++){
    const dd=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
    E-=dd;
    if(Math.abs(dd)<1e-10)break;
  }
  if(Math.abs(E-e*Math.sin(E)-M)>1e-6){ /* 兜底：f(E) 严格单调，二分必收敛 */
    let lo=-Math.PI,hi=Math.PI;
    for(let i=0;i<64;i++){
      const mid=(lo+hi)/2;
      if(mid-e*Math.sin(mid)-M>0)hi=mid;else lo=mid;
    }
    E=(lo+hi)/2;
  }
  return E;
}
/* 由轨道根数求场景坐标（黄道面→场景 XZ 面，Y 为黄北极）*/
function keplerXYZ(a,e,I,w,O,E){
  const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(Math.max(0,1-e*e))*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),ci=Math.cos(I),si=Math.sin(I);
  const X=(cw*cO-sw*sO*ci)*xp+(-sw*cO-cw*sO*ci)*yp;
  const Y=(cw*sO+sw*cO*ci)*xp+(-sw*sO+cw*cO*ci)*yp;
  const Z=sw*si*xp+cw*si*yp;
  return [X*AU_U, Z*AU_U, -Y*AU_U]; // 场景坐标
}
function orbState(el,jd){
  const T=(jd-J2000)/36525;
  const a=el.el[0]+el.rt[0]*T, e=el.el[1]+el.rt[1]*T;
  const I=(el.el[2]+el.rt[2]*T)*DEG, L=(el.el[3]+el.rt[3]*T)*DEG, W=(el.el[4]+el.rt[4]*T)*DEG, O=(el.el[5]+el.rt[5]*T)*DEG;
  const E=solveKepler(L-W,e), r=Math.hypot(a*(Math.cos(E)-e),0)+0; const E2=E;
  const p=keplerXYZ(a,e,I,W-O,O,E);
  const rAU=Math.hypot(p[0],p[1],p[2])/AU_U;
  return {pos:p, rAU, aAU:a, e};
}
function orbSpeed(rAU,aAU){return Math.sqrt(Math.max(0,GM_SUN*(2/(rAU*AU_KM)-1/(aAU*AU_KM))));}
function orbitLineOf(el,n,T){
  const a=el.el[0]+el.rt[0]*T, e=el.el[1]+el.rt[1]*T;
  const I=(el.el[2]+el.rt[2]*T)*DEG, L=(el.el[3]+el.rt[3]*T)*DEG, W=(el.el[4]+el.rt[4]*T)*DEG, O=(el.el[5]+el.rt[5]*T)*DEG;
  const pts=new Float32Array((n+1)*3);
  for(let j=0;j<=n;j++){const p=keplerXYZ(a,e,I,W-O,O,j/n*TAU);pts[j*3]=p[0];pts[j*3+1]=p[1];pts[j*3+2]=p[2];}
  return pts;
}

const PL=[
 {name:'水星',en:'MERCURY',el:[0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593],rt:[0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081],Rkm:2439.7,tilt:0.034,spinD:58.646,lam:0.3,dot:'#9c8f84',mass:'3.30×10²³ kg',dayTxt:'58.6 天',perTxt:'88.0 天',temp:'167°C',desc:'距太阳最近的行星，没有实质大气，昼夜温差超过 600°C。'},

/* ---------- 公共 GLSL 噪声库 ---------- */
const G_COMMON=`
float hash13(vec3 p){p=fract(p*0.1031);p+=dot(p,p.yzx+33.33);return fract((p.x+p.y)*p.z);}
vec3 hash33(vec3 p){p=fract(p*vec3(0.1031,0.1030,0.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
float noise3(vec3 p){
  vec3 i=floor(p),f=fract(p);vec3 u=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i+vec3(0,0,0)),hash13(i+vec3(1,0,0)),u.x),
                 mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),u.x),u.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),u.x),
                 mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),u.x),u.y),u.z);
}
float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*noise3(p);p=p*2.03+vec3(19.1,7.7,3.3);a*=0.5;}return s;}
float fbm3(vec3 p){float s=0.0,a=0.5;for(int i=0;i<4;i++){s+=a*noise3(p);p=p*2.13+vec3(5.2,9.1,1.7);a*=0.5;}return s;}
float ridge(vec3 p){float s=0.0,a=0.55;for(int i=0;i<4;i++){s+=a*(1.0-abs(noise3(p)*2.0-1.0));p=p*2.17+vec3(9.3,4.7,2.1);a*=0.5;}return s;}
float craterF(vec3 p,float sc){
  vec3 q=p*sc;vec3 iq=floor(q);float d=1.0;
  for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){
    vec3 g=vec3(float(x),float(y),float(z));vec3 o=hash33(iq+g);
    d=min(d,length(g+o-fract(q)));
  }return d;
}
float craterBump(vec3 p,float sc,float seed){
  float d=craterF(p+seed,sc);
  return -smoothstep(0.42,0.0,d)*0.8+smoothstep(0.42,0.68,d)*0.35;
}`;

const G_VS_BODY=`#version 300 es
layout(location=0) in vec3 aPos;
uniform mat4 uVP;uniform vec3 uCenter;uniform mat3 uRot;uniform float uRadius;uniform float uLogC;
out vec3 vLocal;out vec3 vWorld;out vec3 vNormal;
void main(){
  vLocal=aPos;
  vec3 w=uCenter+uRot*(aPos*uRadius);
  vWorld=w;vNormal=normalize(uRot*aPos);
  vec4 cp=uVP*vec4(w,1.0);
  if(cp.w<1e-4){gl_Position=vec4(0.0,0.0,-3.0,1.0);return;}
  cp.z=(log2(max(1e-8,cp.w+1.0))*uLogC-1.0)*cp.w;
  gl_Position=cp;
}`;

    float wob=fbm3(vec3(p.x*2.5,p.y*6.0,p.z*2.5)+uTime*0.01)*0.5;
    vec3 c=mix(vec3(0.10,0.22,0.62),vec3(0.20,0.38,0.78),sin(lat*4.0+wob*2.0)*0.5+0.5);
    c=mix(c,vec3(0.85,0.90,1.0),smoothstep(0.60,0.85,fbm3(vec3(p.x*4.0,p.y*24.0,p.z*4.0)+uTime*0.02))*0.45);
    float dl=mod(lon-2.4+3.14159,6.28318)-3.14159;
    float dsp=length(vec2(dl*2.6,(lat+0.38)*2.2));
    c=mix(c,vec3(0.06,0.10,0.35),smoothstep(0.40,0.22,dsp)*0.7);
    bump=(wob-0.25)*0.1;return c;
  }else if(uType==8){ /* 月球 */
    float h=fbm3(p*2.6+2.9);
    float cr=craterBump(p,5.5,1.3)*0.75+craterBump(p+4.4,12.0,6.1)*0.4+craterBump(p+8.8,24.0,9.9)*0.25;
    bump=cr+(h-0.5)*0.5;
    vec3 c=mix(vec3(0.56,0.55,0.53),vec3(0.74,0.73,0.71),h);
    c=mix(c,vec3(0.30,0.30,0.32),smoothstep(0.58,0.72,fbm3(p*1.3+6.6))*0.65);
    c*=1.0+cr*0.5;spec=0.02;return c;
  }else{ /* 通用卫星 / 彗核 */
    float h=fbm3(p*3.4+float(uType)*3.7)*0.75+ridge(p*5.0)*0.25;
    float cr=craterBump(p+float(uType)*1.7,8.0,float(uType))*uCraters;
    bump=(h-0.5)*0.6+cr*0.7;
    vec3 c=mix(uColA,uColB,h);
    c*=1.0+cr*0.4;
    if(uType==9)c=mix(c,vec3(0.62,0.22,0.08),smoothstep(0.62,0.78,fbm3(p*6.0))*0.5);
    if(uType==10)c=mix(c,vec3(0.55,0.33,0.22),smoothstep(0.72,0.86,ridge(p*7.0+3.0))*0.5);
    if(uType==13)c=mix(c,vec3(0.95,0.78,0.45),smoothstep(0.5,0.8,fbm3(p*2.0))*0.3);
    if(uType==14)c=mix(c,vec3(0.85,0.62,0.55),smoothstep(0.62,0.78,abs(lat))*0.4);
    return c;
  }
}
void main(){
  vec3 p=normalize(vLocal);
  float bump=0.0,spec=0.0,city=0.0,clSh=0.0,alphaOut=1.0;
  vec3 alb;vec3 N=vNormal;
  if(uMode==2){ /* 云层球 */
    alb=vec3(1.0);
    float f=cloudF(p);
    alphaOut=smoothstep(0.47,0.66,f);
  }else{
    alb=surface(p,bump,spec,city);
    bool rocky=(uType==0||uType==2||uType==3||uType>=8);
    if(rocky){
      vec3 t1=normalize(cross(p,abs(p.y)>0.99?vec3(1,0,0):vec3(0,1,0)));
      vec3 t2=cross(p,t1);
      float e0=heightAt(p);
      float e1=heightAt(normalize(p+t1*0.004));
      float e2=heightAt(normalize(p+t2*0.004));
      N=normalize(vNormal-(t1*(e1-e0)+t2*(e2-e0))*85.0);
    }
    if(uType==2)clSh=smoothstep(0.47,0.66,cloudF(p));
    if(uType==5){ /* 土星环投影到行星 */
      vec3 d=normalize(-vWorld);
      float dn=dot(d,uAxis);
      if(abs(dn)>1e-4){
        float t=dot(uCenter-vWorld,uAxis)/dn;
        if(t>0.0){
          float rr=length(vWorld+d*t-uCenter)/uRadius;
          if(rr>1.24&&rr<2.33)clSh=ringA(clamp((rr-1.24)/1.09,0.0,1.0));
        }
      }
    }
  }
  vec3 V=normalize(uEye-vWorld);
  vec3 L=normalize(-vWorld);
  float ndl=dot(N,L);
  float day=smoothstep(-0.12,0.30,ndl);
  float li=max(mix(max(ndl,0.0),day,0.22),uMode==2?0.015:0.0);
  vec3 H=normalize(L+V);
  float sp=pow(max(dot(N,H),0.0),110.0)*spec*uSpecStr*day;
  vec3 col=alb*li*1.05+alb*0.012;
  if(uMode==0&&uType==2)col*=1.0-0.45*clSh*day;
  if(uMode==0&&uType==5)col*=1.0-0.8*clSh*day;
  col+=vec3(1.0,0.95,0.85)*sp;
  float fres=pow(1.0-max(dot(N,V),0.0),3.0);
  vec3 term=mix(uAtmoCol,vec3(1.0,0.45,0.18),smoothstep(0.30,0.02,abs(ndl-0.05)));
  col+=term*fres*(day*0.85+0.06)*uAtmoStr;
  if(uMode==0&&city>0.0)col+=vec3(1.0,0.72,0.34)*city*1.5*smoothstep(0.10,-0.14,ndl);
  float aOut=(uMode==2)?alphaOut*(day*0.96+0.04):1.0;
  fragColor=vec4(col,aOut);
}`;

  vec3 rgbA=0.5*(texture(t,uv+dir*(1.0/3.0-0.5)).rgb+texture(t,uv+dir*(2.0/3.0-0.5)).rgb);
  vec3 rgbB=rgbA*0.5+0.25*(texture(t,uv+dir*-0.5).rgb+texture(t,uv+dir*0.5).rgb);
  float lB=lum(rgbB);
  return (lB<lMin||lB>lMax)?rgbA:rgbB;

    vec2 dv=(suv-0.5)*asp;
    float ks[6];ks[0]=0.35;ks[1]=0.7;ks[2]=1.15;ks[3]=1.65;ks[4]=2.3;ks[5]=-0.45;

}`;

const FB={};
function mkColorTex(w,h){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,HDRFMT,w,h,0,gl.RGBA,HDRTYPE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function buildTargets(){
  for(const k of ['scene','b1','b2','b3','b4'])if(FB[k]){gl.deleteFramebuffer(FB[k].fbo);gl.deleteTexture(FB[k].tex);}
  if(FB.depth)gl.deleteRenderbuffer(FB.depth);
  const W=gl.drawingBufferWidth,H=gl.drawingBufferHeight;
  const hw=Math.max(W>>1,1),hh=Math.max(H>>1,1),qw=Math.max(W>>2,1),qh=Math.max(H>>2,1);
  const mk=(w,h,withDepth)=>{
    const tex=mkColorTex(w,h);
    const fbo=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    if(withDepth){
      const db=gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER,db);
      gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,w,h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,db);
      FB.depth=db;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    return {fbo,tex,w,h};
  };
  FB.scene=mk(W,H,true);
  FB.b1=mk(hw,hh,false);FB.b2=mk(hw,hh,false);
  FB.b3=mk(qw,qh,false);FB.b4=mk(qw,qh,false);
}

const GEO={};
function buildGeometry(){

    const lat=48,lon=96,pos=[],idx=[];

  }
  { /* 小行星岩块（二十面体抖动，平直法线） */
    const t=(1+Math.sqrt(5))/2;

    const f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
             [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
    const jit=x=>{const s=Math.sin(x*127.1)*43758.5453;return s-Math.floor(s);};
    v=v.map((p,i)=>{const m=1+(jit(i*3.7)-0.5)*0.6;return [p[0]*m,p[1]*m,p[2]*m];});

    p.st={rAU:vlen(p.pos)/AU_U,aAU:a,e};
    p.spin=TAU*((jd-J2000)/p.spinD)+p.idx*1.3;
    p.curR+=(p.tgtR-p.curR)*0.08;
  }
  for(const m of MOs){
    const par=PLs[m.p];
    m.curR+=(m.tgtR-m.curR)*0.08;
    m.curDist+=(m.tgtDist-m.curDist)*0.08;
    const sgn=m.incl>90?-1:1;
    const th=sgn*TAU*((jd-J2000)/m.per)+m.ph;
    const incl3=m.ecl?m3fix(0.5,m.incl):m3rx(m.incl*DEG);
    const orb=m3mul(par.fix,incl3);
    m.rot3=m3mul(orb,m3ry(th));
    m.pos=vadd(par.pos,m3v(orb,[Math.cos(th)*m.curDist,0,-Math.sin(th)*m.curDist]));
    m.spin=th; /* 潮汐锁定 */
  }
  SU.spin=TAU*((jd-J2000)/25.05);
  SU.curR+=(SU.tgtR-SU.curR)*0.08;
  const c1=cometPos(jd),c2=cometPos(jd+0.5);
  CO.pos=c1;
  CO.rAU=vlen(c1)/AU_U;
  CO.spin=TAU*((jd-J2000)/2.2);
  CO.curR+=(CO.tgtR-CO.curR)*0.08;
  const anti=vnorm(c1);
  const vel=vnorm(vsub(c2,c1));
  const vperp=vsub(vel,vscl(anti,vdot(vel,anti)));
  CO.vel=vlen(vperp)>1e-4?vnorm(vperp):vnorm(vcross(anti,[0,1,0]));
  CO.str=clamp(1.8/Math.pow(Math.max(CO.rAU,0.35),1.5),0,1)*(0.25+0.75*clamp(2.2/CO.rAU,0,1));
}

/* ============================================================
   相机 / 输入
   ============================================================ */
const cam={th:-0.4,ph:0.62,dist:4200,tgt:[0,0,0],tgtGoal:[0,0,0],distGoal:4200,eye:[0,0,0],right:[1,0,0],upv:[0,1,0],fwd:[0,0,-1]};
let focus=null,introT=0,intro=true;
function focusOn(b){
  focus=b;
  cam.followT=0;
  cam.tgtGoal=b.pos;
  cam.distGoal=clamp(b.curR*7.5,b.curR*1.5,6000);
  if(b===SU)cam.distGoal=clamp(b.curR*4.5,b.curR*1.6,6000);
  if(b===CO)cam.distGoal=5.5;
  syncChips();showInfo(b);
}
function overview(){
  focus=null;cam.tgtGoal=[0,0,0];
  cam.distGoal=Math.min(cam.distGoal,420);
  $('#info').classList.remove('show');
  syncChips();
}
function updateCamera(dt){
  if(intro){
    introT+=dt/7;
    const e=clamp(introT,0,1),k=e<0.5?4*e*e*e:1-Math.pow(-2*e+2,3)/2;
    cam.dist=lerp(4200,340,k);cam.distGoal=cam.dist;
    cam.ph=lerp(0.62,0.42,k);cam.th=lerp(-0.4,-1.15,k);
    if(introT>=1)intro=false;
  }else{
    const k2=1-Math.exp(-dt*8);
    if(focus){ /* 平滑追赶后精确跟随，避免高倍速下的视差滞后 */
      cam.followT=Math.min(1,(cam.followT||0)+dt*1.4);
      const e=cam.followT*cam.followT*(3-2*cam.followT);
      cam.tgt=vlerp(cam.tgt,focus.pos,e);
    }else{
      cam.tgt=vlerp(cam.tgt,cam.tgtGoal,k2);
    }
    cam.dist=lerp(cam.dist,cam.distGoal,k2);
    if(focus){cam.distGoal=Math.max(cam.distGoal,focus.curR*1.5);cam.dist=Math.max(cam.dist,focus.curR*1.35);}
    cam.dist=clamp(cam.dist,0.0002,12000);
  }
  const sp=Math.sin(cam.ph),cp=Math.cos(cam.ph);
  cam.eye=vadd(cam.tgt,[cam.dist*sp*Math.cos(cam.th),cam.dist*cp,cam.dist*sp*Math.sin(cam.th)]);
  cam.fwd=vnorm(vsub(cam.tgt,cam.eye));
  cam.right=vnorm(vcross(cam.fwd,[0,1,0]));
  cam.upv=vcross(cam.right,cam.fwd);
}
function pick(x,y){
  const W=cv.clientWidth,H=cv.clientHeight;
  const ndcx=x/W*2-1,ndcy=-(y/H*2-1);
  const dir=vnorm(vadd(vadd(cam.fwd,vscl(cam.right,ndcx*Math.tan(FOV/2)*W/H)),vscl(cam.upv,ndcy*Math.tan(FOV/2))));
  let best=null,bt=1e18;
  for(const b of LST){
    if(b.kind==='moon'){
      const par=PLs[b.p];
      if(vlen(vsub(cam.eye,par.pos))>par.curR*50)continue;
    }
    const oc=vsub(cam.eye,b.pos);
    const r=Math.max(b.curR*1.4,vlen(oc)*0.012);
    const bq=vdot(oc,dir),cq=vdot(oc,oc)-r*r;
    const disc=bq*bq-cq;
    if(disc>0){const t=-bq-Math.sqrt(disc);if(t>0&&t<bt){bt=t;best=b;}}
  }
  if(best)focusOn(best);
}
function setupInput(){
  const pts=new Map();
  let pbtn=0,moved=0,pinch0=0;
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){pbtn=e.button;moved=0;intro=false;}
    if(pts.size===2){
      const a=[...pts.values()];pinch0=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
    }
    cv.classList.add('drag');
  });
  cv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    const prev=pts.get(e.pointerId);
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){
      const a=[...pts.values()];
      const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
      if(pinch0>0)cam.distGoal=clamp(cam.distGoal*pinch0/d,0.0002,12000);
      pinch0=d;intro=false;
      return;
    }
    const dx=e.clientX-prev[0],dy=e.clientY-prev[1];
    moved+=Math.abs(dx)+Math.abs(dy);
    if(pbtn===2){
      const k=cam.dist*0.0016;
      if(focus)focus=null;
      cam.tgt=vadd(cam.tgt,vadd(vscl(cam.right,-dx*k),vscl(cam.upv,dy*k)));
      cam.tgtGoal=cam.tgt;
    }else if(pbtn===0){
      cam.th-=dx*0.005;cam.ph=clamp(cam.ph-dy*0.005,0.03,Math.PI-0.03);
    }
  });
  const up=e=>{
    if(pts.has(e.pointerId)){
      pts.delete(e.pointerId);
      if(pts.size===0){
        cv.classList.remove('drag');
        if(pbtn===0&&moved<6)pick(e.clientX,e.clientY);
      }
    }
  };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{
    e.preventDefault();intro=false;
    cam.distGoal=clamp(cam.distGoal*Math.exp(e.deltaY*0.0011),0.0002,12000);
  },{passive:false});
  cv.addEventListener('dblclick',e=>{pick(e.clientX,e.clientY);if(!focus)overview();});
  window.addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault();togglePlay();}
    else if(e.key==='o'||e.key==='O')toggleOpt('orbits');
    else if(e.key==='l'||e.key==='L')toggleOpt('labels');
    else if(e.key==='r'||e.key==='R')toggleOpt('real');
    else if(e.key==='h'||e.key==='H')$('#btnHalley').click();
    else if(e.key==='t'||e.key==='T')$('#btnNow').click();
    else if(e.key==='Escape')overview();
  });
}
/* ============================================================
   渲染
   ============================================================ */
let VP=null,proj=null,view=null;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.max(Math.floor(cv.clientWidth*dpr),1),h=Math.max(Math.floor(cv.clientHeight*dpr),1);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  buildTargets();
  proj=m4persp(FOV,cv.width/cv.height,0.01,FAR);
}
window.addEventListener('resize',resize);

const uPRf=()=>clamp((window.devicePixelRatio||1)*(cv.clientHeight/1000),1,3);
function hexCol(h){return hex2rgb(h);}

function drawBodySphere(b,uType,uMode,radius,rot,extra){
  const u=UNI.planet;
  gl.uniform3fv(u.uCenter,b.pos);
  gl.uniformMatrix3fv(u.uRot,false,rot);
  gl.uniform1f(u.uRadius,radius);
  gl.uniform1i(u.uType,uType);
  gl.uniform1i(u.uMode,uMode);
  if(extra)extra();
  gl.bindVertexArray(GEO.sphere);
  gl.drawElements(gl.TRIANGLES,GEO.sphereN,gl.UNSIGNED_SHORT,0);
}
function drawBill(center,right,up,size,col1,col2,kind,intensity){
  const u=UNI.bill;
  gl.uniform3fv(u.uCenter,center);
  gl.uniform3fv(u.uRight,right);
  gl.uniform3fv(u.uUpv,up);
  gl.uniform1f(u.uSize,size);
  gl.uniform3fv(u.uCol1,col1);
  gl.uniform3fv(u.uCol2,col2);
  gl.uniform1i(u.uKind,kind);
  gl.uniform1f(u.uInt,intensity);
  gl.bindVertexArray(GEO.bill);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function drawLine(vao,n,center,rot,radius,col,alpha){
  const u=UNI.line;
  gl.uniform3fv(u.uCenter,center);
  gl.uniformMatrix3fv(u.uRot,false,rot);
  gl.uniform1f(u.uRadius,radius);
  gl.uniform3fv(u.uColor,col);
  gl.uniform1f(u.uAlpha,alpha);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.LINE_STRIP,0,n);
}
function pxToWorld(px,dist){return 2*dist*Math.tan(FOV/2)*px/cv.clientHeight;}
function projRadiusPx(b){
  const d=vlen(vsub(cam.eye,b.pos));
  return b.curR/d/Math.tan(FOV/2)*cv.clientHeight/2;
}

function renderFrame(time){
  VP=m4mul(proj,m4lookAt(cam.eye,cam.tgt,[0,1,0]));
  const eye=cam.eye,t=time;
  gl.bindFramebuffer(gl.FRAMEBUFFER,FB.scene.fbo);
  gl.viewport(0,0,FB.scene.w,FB.scene.h);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);
  gl.disable(gl.BLEND);

  /* --- 银河天球 --- */
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
  if(OPT.milky){
    gl.useProgram(PR.sky);const u=UNI.sky;
    gl.uniformMatrix4fv(u.uVP,false,VP);
    gl.uniform1f(u.uLogC,LOGC);
    gl.uniform1f(u.uBoost,0.55);
    gl.blendFunc(gl.ONE,gl.ONE);gl.enable(gl.BLEND);
    gl.bindVertexArray(GEO.sphere);
    gl.drawElements(gl.TRIANGLES,GEO.sphereN,gl.UNSIGNED_SHORT,0);
    gl.disable(gl.BLEND);
  }
  /* --- 星场 --- */
  gl.useProgram(PR.star);const us=UNI.star;
  gl.uniformMatrix4fv(us.uVP,false,VP);
  gl.uniform1f(us.uLogC,LOGC);
  gl.uniform1f(us.uTime,t);
  gl.uniform1f(us.uPR,uPRf());
  gl.uniform1f(us.uAlpha,0.85);
  gl.blendFunc(gl.ONE,gl.ONE);gl.enable(gl.BLEND);
  gl.bindVertexArray(GEO.star);
  gl.drawArrays(gl.POINTS,0,GEO.starN);
  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);

  /* --- 不透明天体 --- */
  const uP=UNI.planet;
  gl.useProgram(PR.planet);
  gl.uniformMatrix4fv(uP.uVP,false,VP);
  gl.uniform1f(uP.uLogC,LOGC);
  gl.uniform3fv(uP.uEye,eye);
  gl.uniform1f(uP.uTime,t);
  for(const p of PLs){
    const rot=m3mul(p.fix,m3ry(p.spin));
    drawBodySphere(p,p.idx,0,p.curR,rot,()=>{
      gl.uniform3fv(uP.uColA,[0.5,0.5,0.5]);
      gl.uniform3fv(uP.uColB,[0.6,0.6,0.6]);
      gl.uniform1f(uP.uCraters,0.5);
      gl.uniform3fv(uP.uAtmoCol,p.atmoC);
      gl.uniform1f(uP.uAtmoStr,p.atmoS);
      gl.uniform1f(uP.uSpecStr,p.specS);
      gl.uniform3fv(uP.uAxis,m3col(p.fix,1));
    });
  }
  { /* 太阳 */
    gl.useProgram(PR.sun);const u=UNI.sun;
    gl.uniformMatrix4fv(u.uVP,false,VP);
    gl.uniform1f(u.uLogC,LOGC);
    gl.uniform3fv(u.uEye,eye);
    gl.uniform1f(u.uTime,t);
    gl.uniform3fv(u.uCenter,SU.pos);
    gl.uniformMatrix3fv(u.uRot,false,m3ry(SU.spin));
    gl.uniform1f(u.uRadius,SU.curR);
    gl.bindVertexArray(GEO.sphere);
    gl.drawElements(gl.TRIANGLES,GEO.sphereN,gl.UNSIGNED_SHORT,0);
  }
  gl.useProgram(PR.planet); /* 切回行星程序：卫星与彗核共用 */
  for(const m of MOs){ /* 卫星 */
    const par=PLs[m.p];
    if(vlen(vsub(eye,par.pos))>par.curR*260)continue;
    drawBodySphere(m,m.tid,0,m.curR,m.rot3,()=>{
      gl.uniform3fv(uP.uColA,m.colA);
      gl.uniform3fv(uP.uColB,m.colB);
      gl.uniform1f(uP.uCraters,m.cr);
      gl.uniform3fv(uP.uAtmoCol,m.tid===13?[0.95,0.72,0.35]:[0.5,0.6,0.8]);
      gl.uniform1f(uP.uAtmoStr,m.tid===13?1.2:0.05);
      gl.uniform1f(uP.uSpecStr,m.tid===10?0.5:0.03);
      gl.uniform3fv(uP.uAxis,m3col(m.rot3,1));
    });
  }
  { /* 彗核 */
    gl.uniform3fv(uP.uCenter,CO.pos);
    gl.uniformMatrix3fv(uP.uRot,false,m3ry(CO.spin));
    gl.uniform1f(uP.uRadius,CO.curR);
    gl.uniform1i(uP.uType,15);
    gl.uniform1i(uP.uMode,0);
    gl.uniform3fv(uP.uColA,[0.10,0.09,0.08]);
    gl.uniform3fv(uP.uColB,[0.24,0.21,0.18]);
    gl.uniform1f(uP.uCraters,0.6);
    gl.uniform3fv(uP.uAtmoCol,[0.5,0.7,1.0]);
    gl.uniform1f(uP.uAtmoStr,0.1);
    gl.uniform1f(uP.uSpecStr,0.02);
    gl.uniform3fv(uP.uAxis,[0,1,0]);
    gl.bindVertexArray(GEO.sphere);
    gl.drawElements(gl.TRIANGLES,GEO.sphereN,gl.UNSIGNED_SHORT,0);
  }
  /* --- 小行星带 --- */
  if(OPT.belt){
    gl.useProgram(PR.ast);const u=UNI.ast;
    gl.uniformMatrix4fv(u.uVP,false,VP);
    gl.uniform1f(u.uLogC,LOGC);
    gl.uniform1f(u.uTime,t*86400/40); /* 内部以“天”计 */
    gl.uniform1f(u.uAU,AU_U);
    gl.uniform3fv(u.uEye,eye);
    const j=PLs[4];
    gl.uniform1f(u.uJupAng,Math.atan2(-j.pos[2],j.pos[0]));
    gl.bindVertexArray(GEO.ast);
    gl.drawArraysInstanced(gl.TRIANGLES,0,GEO.rockN,GEO.astN);
  }
  /* --- 柯伊伯带 --- */
  if(OPT.kuiper){
    gl.useProgram(PR.star);const u=UNI.star;
    gl.uniform1f(u.uAlpha,0.5);
    gl.blendFunc(gl.ONE,gl.ONE);gl.enable(gl.BLEND);
    gl.depthMask(false);
    gl.bindVertexArray(GEO.kuiper);
    gl.drawArrays(gl.POINTS,0,GEO.kuiN);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }
  /* --- 轨道线 --- */
  if(OPT.orbits){
    gl.useProgram(PR.line);const u=UNI.line;
    gl.uniformMatrix4fv(u.uVP,false,VP);
    gl.uniform1f(u.uLogC,LOGC);
    gl.uniform3fv(u.uCenter,[0,0,0]);
    gl.uniformMatrix3fv(u.uRot,false,M3I);
    gl.uniform1f(u.uRadius,1);
    gl.depthMask(false);
    gl.blendFunc(gl.ONE,gl.ONE);gl.enable(gl.BLEND);
    for(let i=0;i<PLs.length;i++){
      const c=hexCol(PLs[i].dot).map(x=>x*1.35+0.08); /* 提亮，避免被太阳泛光淹没 */
      const al=(focus===PLs[i])?1.0:0.62;
      drawLine(ORBITS[i].vao,ORBITS[i].n,[0,0,0],M3I,1,c,al);
    }
    drawLine(ORBITS[8].vao,ORBITS[8].n,[0,0,0],M3I,1,[0.35,0.8,0.9],(focus===CO)?1.0:0.62);
    for(const m of MOs){
      const par=PLs[m.p];
      if(vlen(vsub(eye,par.pos))>par.curR*80)continue;
      drawLine(GEO.circle.vao,GEO.circleN,par.pos,m.orb3,m.curDist,hexCol(m.dot),0.55);
    }
    gl.disable(gl.BLEND);
    gl.depthMask(true);
  }
  /* --- 行星环 --- */
  gl.useProgram(PR.ring);const ur=UNI.ring;
  gl.uniformMatrix4fv(ur.uVP,false,VP);
  gl.uniform1f(ur.uLogC,LOGC);
  gl.uniform3fv(ur.uEye,eye);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.CULL_FACE);
  const ring=(b,geo,mode)=>{
    gl.uniform3fv(ur.uCenter,b.pos);
    gl.uniformMatrix3fv(ur.uRot,false,b.fix);
    gl.uniform1f(ur.uPR,b.curR);
    gl.uniform1i(ur.uRingMode,mode);
    gl.uniform1f(ur.uRingA,1.0);
    gl.bindVertexArray(geo.vao);
    gl.drawElements(gl.TRIANGLES,geo.n,gl.UNSIGNED_SHORT,0);
  };
  ring(PLs[5],GEO.ringS,0);
  ring(PLs[6],GEO.ringU,1);
  /* --- 地球云层 --- */
  {
    const e=PLs[2];
    const rot=m3mul(e.fix,m3ry(e.spin));
    gl.useProgram(PR.planet);
    drawBodySphere(e,2,2,e.curR*1.014,rot,()=>{
      gl.uniform3fv(uP.uColA,[1,1,1]);
      gl.uniform3fv(uP.uColB,[1,1,1]);
      gl.uniform1f(uP.uCraters,0);
      gl.uniform3fv(uP.uAtmoCol,[0.3,0.55,1.0]);
      gl.uniform1f(uP.uAtmoStr,0.0);
      gl.uniform1f(uP.uSpecStr,0);
      gl.uniform3fv(uP.uAxis,m3col(e.fix,1));
    });
  }
  /* --- 广告牌：日冕 / 彗发 / 远距标记 --- */
  gl.useProgram(PR.bill);const ub=UNI.bill;
  gl.uniformMatrix4fv(ub.uVP,false,VP);
  gl.uniform1f(ub.uLogC,LOGC);
  gl.uniform1f(ub.uTime,t);
  gl.blendFunc(gl.ONE,gl.ONE);
  { /* 日冕（朝相机偏移避免被日面遮挡；贴近时自动减弱） */
    const dSun=vlen(eye);
    const nearFade=clamp(dSun/(SU.curR*7),0.10,1.0);
    const off=vscl(vnorm(vsub(eye,SU.pos)),SU.curR*1.05);
    const c=vadd(SU.pos,off);
    drawBill(c,cam.right,cam.upv,SU.curR*3.1,[1.0,0.85,0.55],[1.0,0.45,0.12],0,1.0*nearFade);
    drawBill(c,cam.right,cam.upv,SU.curR*8.5,[1.0,0.62,0.25],[0.9,0.3,0.05],0,0.20*nearFade);
  }
  if(OPT.comet&&CO.str>0.02){
    const sz=clamp(0.22+0.5/CO.rAU,0.18,1.3)*(OPT.real?0.55:1);
    const off=vscl(vnorm(vsub(eye,CO.pos)),CO.curR+0.05);
    drawBill(vadd(CO.pos,off),cam.right,cam.upv,sz,[0.75,0.9,1.0],[0.45,0.65,1.0],1,clamp(CO.str*1.2,0,1.2));
  }
  if(OPT.markers){
    for(const b of LST){
      if(b===SU)continue;
      if(b.kind==='moon'&&vlen(vsub(eye,PLs[b.p].pos))>PLs[b.p].curR*40)continue;
      if(b.kind==='comet'&&!OPT.comet)continue;
      const rp=projRadiusPx(b);
      if(rp<1.9){
        const d=vlen(vsub(eye,b.pos));
        const sz=pxToWorld(2.6,d);
        const inten=clamp((1.9-rp)*0.9+0.35,0.3,1.5);
        drawBill(b.pos,cam.right,cam.upv,sz,hexCol(b.dot),hexCol(b.dot),2,inten);
      }
    }
  }
  /* --- 彗尾 --- */
  if(OPT.comet&&CO.str>0.02){
    gl.useProgram(PR.tail);const ut=UNI.tail;
    gl.uniformMatrix4fv(ut.uVP,false,VP);
    gl.uniform1f(ut.uLogC,LOGC);
    gl.uniform3fv(ut.uHead,CO.pos);
    gl.uniform3fv(ut.uAnti,vnorm(CO.pos));
    gl.uniform3fv(ut.uLag,CO.vel);
    gl.uniform1f(ut.uLen,Math.min(2.0,1.5/CO.rAU)*AU_U);
    gl.uniform1f(ut.uPR,uPRf());
    gl.uniform1f(ut.uTime,t);
    gl.uniform1f(ut.uSizeK,OPT.real?0.55:1);
    gl.uniform1f(ut.uStr,CO.str);
    gl.bindVertexArray(GEO.tail);
    gl.drawArrays(gl.POINTS,0,GEO.tailN);
  }
  gl.depthMask(true);
  gl.disable(gl.BLEND);

  /* --- 后期：亮度提取 → 双尺度泛光 → 合成 --- */
  gl.disable(gl.DEPTH_TEST);
  const postPass=(prog,uni,fbo,srcTex,w,h,extra)=>{
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
    gl.viewport(0,0,w,h);
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,srcTex);
    if(uni.uTex)gl.uniform1i(uni.uTex,0);
    if(extra)extra();
    gl.bindVertexArray(GEO.post);
    gl.drawArrays(gl.TRIANGLES,0,3);
  };
  postPass(PR.post,UNI.bright,FB.b1.fbo,FB.scene.tex,FB.b1.w,FB.b1.h,()=>gl.uniform1f(UNI.bright.uTh,1.15));
  const blurPass=(src,dst,w,h,k)=>{
    gl.bindFramebuffer(gl.FRAMEBUFFER,dst.fbo);
    gl.viewport(0,0,w,h);
    gl.useProgram(PR.blur);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,src.tex);
    gl.uniform1i(UNI.blur.uTex,0);
    gl.uniform2f(UNI.blur.uDir,1/src.w*k,0);
    gl.bindVertexArray(GEO.post);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.bindFramebuffer(gl.FRAMEBUFFER,src.fbo);
    gl.viewport(0,0,src.w,src.h);
    gl.bindTexture(gl.TEXTURE_2D,dst.tex);
    gl.uniform2f(UNI.blur.uDir,0,1/src.h*k);
    gl.drawArrays(gl.TRIANGLES,0,3);
  };
  blurPass(FB.b1,FB.b2,FB.b1.w,FB.b1.h,1.0);
  blurPass(FB.b1,FB.b2,FB.b1.w,FB.b1.h,2.2);
  postPass(PR.blur,UNI.blur,FB.b3.fbo,FB.b1.tex,FB.b3.w,FB.b3.h,()=>gl.uniform2f(UNI.blur.uDir,1/FB.b1.w,0));
  postPass(PR.blur,UNI.blur,FB.b4.fbo,FB.b3.tex,FB.b4.w,FB.b4.h,()=>gl.uniform2f(UNI.blur.uDir,0,1/FB.b4.h));
  blurPass(FB.b3,FB.b4,FB.b3.w,FB.b4.h,1.6);
  blurPass(FB.b3,FB.b4,FB.b3.w,FB.b4.h,3.4);
  /* 合成到屏幕 */
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight);
  gl.useProgram(PR.comp);const uc=UNI.comp;
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,FB.scene.tex);gl.uniform1i(uc.uScene,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,FB.b1.tex);gl.uniform1i(uc.uB1,1);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,FB.b3.tex);gl.uniform1i(uc.uB2,2);
  gl.uniform2f(uc.uRes,gl.drawingBufferWidth,gl.drawingBufferHeight);
  /* 太阳屏幕位置与光斑强度 */
  let flare=0,sunUv=[0.5,0.5];
  {
    const cp=VP!==null?[VP[3],VP[7],VP[11],VP[15]]:[0,0,0,1]; /* VP·(0,0,0,1) 的第四列即原点投影 */
    if(cp[3]>0.05){
      const sx=cp[0]/cp[3]*0.5+0.5,sy=cp[1]/cp[3]*0.5+0.5;
      sunUv=[sx,sy];
      const dSun=vlen(eye);
      const off=Math.hypot(sx-0.5,sy-0.5)*2;
      flare=sstep(1.25,0.45,off)*clamp(240/Math.max(dSun,1),0.25,1.5)*(dSun>SU.curR*2.8?1:0.0);
    }
  }
  gl.uniform2fv(uc.uSunUv,sunUv);
  gl.uniform1f(uc.uFlare,flare);
  gl.uniform1f(uc.uTime,t);
  gl.uniform1f(uc.uExpo,OPT.expo/100);
  gl.uniform1f(uc.uBloom,OPT.bloom/100);
  gl.bindVertexArray(GEO.post);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ============================================================
   标签 / HUD / UI
   ============================================================ */
const labelMap=new Map();
function buildLabels(){
  const box=$('#labels');
  for(const b of LST){
    const el=document.createElement('div');
    el.className='lbl';
    el.innerHTML=b.name+(b.kind==='planet'||b.kind==='comet'?'<span class="d"></span>':'');
    el.addEventListener('click',()=>focusOn(b));
    box.appendChild(el);
    labelMap.set(b,el);
  }
}
function updateLabels(){
  const W=cv.clientWidth,H=cv.clientHeight;
  for(const b of LST){
    const el=labelMap.get(b);
    if(!el)continue;
    let show=OPT.labels;
    if(b.kind==='moon'){
      const par=PLs[b.p];
      if(vlen(vsub(cam.eye,par.pos))>par.curR*30)show=false;
    }
    if(show){
      const x=b.pos[0],y=b.pos[1],z=b.pos[2];
      const w=VP[3]*x+VP[7]*y+VP[11]*z+VP[15];
      if(w>0.05){
        const sx=((VP[0]*x+VP[4]*y+VP[8]*z+VP[12])/w*0.5+0.5)*W;
        const sy=(-(VP[1]*x+VP[5]*y+VP[9]*z+VP[13])/w*0.5+0.5)*H;
        if(sx>-60&&sx<W+60&&sy>-40&&sy<H+40){
          el.style.display='block';
          el.style.left=sx+'px';el.style.top=sy+'px';
          el.classList.toggle('sel',focus===b);
          const dEl=el.querySelector('.d');
          if(dEl&&b.st)dEl.textContent=b.st.rAU.toFixed(2)+' AU';
          else if(dEl&&b.kind==='comet')dEl.textContent=CO.rAU.toFixed(2)+' AU';
          continue;
        }
      }
    }
    el.style.display='none';
  }
}
let liveRows={};
function showInfo(b){
  const card=$('#info');
  $('#iName').firstChild.textContent=b.name+' ';
  $('#iEn').textContent=b.en;
  const desc={sun:SUN.desc,comet:HALLEY.desc};
  $('#iDesc').textContent=b.desc||desc[b.kind]||'';
  const rows=[];
  const add=(k,v,live)=>{rows.push(`<tr><td>${k}</td><td class="v" ${live?`data-live="${live}"`:''}>${v}</td></tr>`);};
  if(b.kind==='sun'){
    add('半径','696,000 km');add('质量',SUN.mass);add('自转周期',SUN.dayTxt);
    add('表面温度','5,772 K');add('核心温度','1,570 万 K');add('光谱型','G2V');
  }else if(b.kind==='planet'){
    add('半径',b.Rkm.toLocaleString()+' km');add('质量',b.mass);
    add('自转周期',b.dayTxt);add('公转周期',b.perTxt);
    add('轨道半长轴',b.st.aAU.toFixed(3)+' AU');add('轨道偏心率',b.st.e.toFixed(4));
    add('轴倾角',b.tilt.toFixed(1)+'°');add('均温',b.temp);
    add('距太阳','—','dist');add('轨道速度','—','vel');
  }else if(b.kind==='moon'){
    add('半径',b.Rkm.toLocaleString()+' km');
    add('轨道半长轴',b.distKm.toLocaleString()+' km');
    add('公转周期',b.per.toFixed(2)+' 天');add('均温',b.temp);
    add('距母星','—','dist');add('轨道速度','—','vel');
  }else{
    add('彗核尺寸','约 15×8 km');add('轨道半长轴',HALLEY.a.toFixed(2)+' AU');
    add('偏心率',HALLEY.e.toFixed(4));add('回归周期',(HALLEY.Pd/365.25).toFixed(2)+' 年');
    add('上次近日点','1986-02-09');add('下次近日点','2061-07-28');
    add('近日点距','0.586 AU');add('远日点距','35.1 AU');
    add('距太阳','—','dist');add('轨道速度','—','vel');
  }
  $('#iTab').innerHTML=rows.join('');
  liveRows={};
  $('#iTab').querySelectorAll('[data-live]').forEach(td=>liveRows[td.dataset.live]=td);
  card.classList.add('show');
}
function updateLive(){
  if(!focus)return;
  const b=focus;
  if(b.kind==='planet'){
    if(liveRows.dist)liveRows.dist.textContent=b.st.rAU.toFixed(3)+' AU';
    if(liveRows.vel)liveRows.vel.textContent=orbSpeed(b.st.rAU,b.st.aAU).toFixed(2)+' km/s';
  }else if(b.kind==='moon'){
    const par=PLs[b.p];
    const dKm=vlen(vsub(b.pos,par.pos))/AU_U*AU_KM;
    const gm=GM_PARENT[b.p]||398600.44;
    if(liveRows.dist)liveRows.dist.textContent=(dKm/1e4).toFixed(1)+' 万 km';
    if(liveRows.vel)liveRows.vel.textContent=Math.sqrt(Math.max(0,gm*(2/dKm-1/b.distKm))).toFixed(2)+' km/s';
  }else if(b.kind==='comet'){
    if(liveRows.dist)liveRows.dist.textContent=CO.rAU.toFixed(2)+' AU';
    if(liveRows.vel)liveRows.vel.textContent=orbSpeed(CO.rAU,HALLEY.a).toFixed(2)+' km/s';
  }
}
function fmtSpeed(s){
  const pre=dirn<0?'−':'';
  if(s<1.5)return '实时';
  if(s<120)return pre+s.toFixed(0)+' 秒/秒';
  if(s<7200)return pre+(s/60).toFixed(1)+' 分/秒';
  if(s<172800)return pre+(s/3600).toFixed(1)+' 时/秒';
  if(s<2.63e6)return pre+(s/86400).toFixed(1)+' 天/秒';
  return pre+(s/3.156e7).toFixed(2)+' 年/秒';
}
function togglePlay(){
  paused=!paused;
  const b=$('#btnPlay');
  b.textContent=paused?'▶ 播放':'⏸ 暂停';
  b.classList.toggle('on',paused);
}
function toggleOpt(key){
  OPT[key]=!OPT[key];
  if(key==='real')setScale(OPT.real);
  document.querySelectorAll(`[data-opt="${key}"]`).forEach(el=>el.classList.toggle('on',OPT[key]));
  syncChips();
}
function buildUI(){
  const body=$('#setBody');
  const tgs=[['orbits','轨道线'],['labels','天体标签'],['markers','行星标记'],['belt','小行星带'],['kuiper','柯伊伯带'],['comet','哈雷彗星'],['milky','银河背景'],['real','真实比例']];
  for(const [k,label] of tgs){
    const el=document.createElement('div');
    el.className='tg'+(OPT[k]?' on':'');
    el.dataset.opt=k;
    el.innerHTML=`<span>${label}</span><span class="sw"></span>`;
    el.addEventListener('click',()=>toggleOpt(k));
    body.appendChild(el);
  }
  body.insertAdjacentHTML('beforeend','<div class="sep"></div>');
  const sliders=[['bloom','泛光强度',0,200],['expo','曝光',40,220]];
  for(const [k,label,mn,mx] of sliders){
    const row=document.createElement('div');
    row.className='srow';
    row.innerHTML=`<span>${label}</span><input class="slider" type="range" min="${mn}" max="${mx}" value="${OPT[k]}"><b>${OPT[k]}%</b>`;
    const sl=row.querySelector('input'),val=row.querySelector('b');
    sl.addEventListener('input',()=>{OPT[k]=+sl.value;val.textContent=sl.value+'%';});
    body.appendChild(row);
  }
  $('#setHead').addEventListener('click',()=>$('#set').classList.toggle('closed'));
  $('#btnPlay').addEventListener('click',togglePlay);
  $('#btnRev').addEventListener('click',()=>{dirn*=-1;$('#btnRev').classList.toggle('on',dirn<0);});
  $('#btnNow').addEventListener('click',()=>{simJD=nowJD();});
  $('#btnHalley').addEventListener('click',()=>{simJD=dateToJD(2061,7,28)+0.5;focusOn(CO);});
  $('#infoClose').addEventListener('click',()=>{$('#info').classList.remove('show');});
  const sl=$('#speed');
  const upd=()=>{speed=Math.pow(10,sl.value/10);$('#speedLbl').textContent=fmtSpeed(speed);};
  sl.addEventListener('input',upd);upd();
  /* 天体快捷聚焦 */
  const chips=$('#chips');
  const mkChip=(label,col,fn)=>{
    const el=document.createElement('div');
    el.className='chip';
    el.innerHTML=`<i style="color:${col}"></i>${label}`;
    el.addEventListener('click',fn);
    chips.appendChild(el);
    return el;
  };
  mkChip('太阳',SUN.dot,()=>focusOn(SU));
  for(const p of PLs)mkChip(p.name,p.dot,()=>focusOn(p));
  mkChip('月球',MO[0].dot,()=>focusOn(MOs[0]));
  mkChip('哈雷',HALLEY.dot,()=>focusOn(CO));
  window.syncChips=()=>{
    chips.querySelectorAll('.chip').forEach((el,i)=>{
      el.classList.toggle('sel',(focus===SU&&i===0)||(focus&&focus.kind==='planet'&&i===focus.idx+1)||(focus===MOs[0]&&i===9)||(focus===CO&&i===10));
    });
  };
  syncChips();
}
let fpsN=0,fpsT=0,fpsShow=0;
function updateHUD(dt){
  $('#dateBig').textContent=fmtJD(simJD);
  fpsN++;fpsT+=dt;
  if(fpsT>=0.5){
    fpsShow=Math.round(fpsN/fpsT);fpsN=0;fpsT=0;
    const el=$('#fps');
    if(el)el.textContent=`${fpsShow} FPS · ${gl.drawingBufferWidth}×${gl.drawingBufferHeight}`;
  }
}

/* ============================================================
   主循环 / 启动
   ============================================================ */
let last=0,acc=0,lastStepMs=0,booted=false;
function frame(now){
  if(!booted){requestAnimationFrame(frame);return;}
  lastStepMs=performance.now();
  const dt=Math.min((now-last)/1000,0.1)||0.016;last=now;
  if(!paused)simJD+=dt*speed*dirn/86400;
  updateCamera(dt);
  computeAll(simJD);
  /* 月球轨道面矩阵（绘制轨道线用） */
  for(const m of MOs)m.orb3=m3mul(PLs[m.p].fix,m.ecl?m3fix(0.5,m.incl):m3rx(m.incl*DEG));
  renderFrame(now/1000);
  updateLabels();
  updateHUD(dt);
  acc+=dt;
  if(acc>0.3){acc=0;updateLive();}
  requestAnimationFrame(frame);
}
/* 后台标签页 rAF 被节流时，用低频定时器兜底驱动 */
setInterval(()=>{if(performance.now()-lastStepMs>900)frame(performance.now());},300);
const tick=()=>new Promise(r=>setTimeout(r,33)); /* 后台标签页中 rAF 会被节流，初始化改用定时器 */
async function boot(){
  const st=async t=>{$('#loadSt').textContent=t;await tick();await tick();};
  try{
    await st('初始化渲染器…');
    resize();
    await st('编译着色器…');
    buildPrograms();
    await st('生成几何体…');
    buildGeometry();
    await st('生成星场与小行星带…');
    setScale(false);
    for(const p of PLs)p.atmoC={0:[0,0,0],1:[0.93,0.86,0.55],2:[0.30,0.55,1.0],3:[0.85,0.55,0.35],4:[0.92,0.80,0.58],5:[0.93,0.85,0.62],6:[0.62,0.90,0.92],7:[0.35,0.55,1.0]}[p.idx];
    for(const p of PLs)p.atmoS={0:0,1:1.6,2:1.6,3:0.45,4:0.7,5:0.55,6:1.1,7:1.1}[p.idx];
    for(const p of PLs)p.specS={0:0.02,1:0.05,2:1.0,3:0.05,4:0.03,5:0.03,6:0.03,7:0.03}[p.idx];
    for(const m of MOs)m.tid={0:8,1:9,2:10,3:11,4:12,5:13,6:14}[m.idx];
    buildOrbitVAOs();
    buildBodies();
    computeAll(simJD);
    await st('构建界面…');
    buildUI();
    buildLabels();
    setupInput();
    booted=true;
    last=performance.now();
    requestAnimationFrame(frame);
    setTimeout(()=>$('#load').classList.add('off'),500);
  }catch(err){
    fatal((err&&err.stack)||String(err));
  }
}
boot();
