<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b13">
<link rel="icon" href="data:,">
<title>太阳系轨道图谱</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f3f0ed;
    --muted: #a2a8bd;
    --subtle: #8089a4;
    --line: #a9b6e126;
    --glass: #101421dc;
    --warm: #f3be83;
    --cool: #b1bcf6;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
    --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden }
  body { background: #05060b; color: var(--ink); font: 13px/1.5 var(--sans) }
  button, input { font: inherit; color: inherit }
  button { cursor: pointer }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--cool); outline-offset: 3px;
  }
  [hidden] { display: none !important }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab }
  canvas:active { cursor: grabbing }
  #labels { position: fixed; inset: 0; overflow: hidden; pointer-events: none }
  .tag {
    position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px;
    color: #e1e6f7; font-size: 11px; letter-spacing: .08em; white-space: nowrap;
    text-shadow: 0 1px 4px #000, 0 0 7px #000, 0 0 10px #000;
  }
  .tag::before { content: ""; width: 8px; height: 1px; background: var(--object); opacity: .72 }
  .tag.active { color: #fff1d9 }
  .tag.active::before { width: 15px; background: var(--warm) }
  #chrome { position: fixed; inset: 0; pointer-events: none }
  #chrome > * { pointer-events: auto }
  .mast {
    position: absolute; inset: 0 0 auto; height: 75px; padding: 0 25px;
    display: flex; justify-content: space-between; align-items: center; gap: 15px;
    background: linear-gradient(180deg,#090c15f2,#0a0d17dc);
    border-bottom: 1px solid var(--line);
  }
  .brand, .actions { display: flex; align-items: center; gap: 12px; min-width: 0 }
  .mark { position: relative; width: 37px; height: 37px; flex: none; color: var(--warm) }
  .mark::before, .mark::after {
    content: ""; position: absolute; border: 1px solid currentColor; border-radius: 50%;
  }
  .mark::before { inset: 10px 0; transform: rotate(-34deg); opacity: .8 }
  .mark::after { inset: 4px 10px; transform: rotate(-34deg); opacity: .46 }
  .mark i, .mark b { position: absolute; border-radius: 50%; background: currentColor }
  .mark i { width: 6px; height: 6px; top: 15px; left: 15px; box-shadow: 0 0 11px #f3be8380 }
  .mark b { width: 3px; height: 3px; top: 8px; right: 6px }
  .brand h1 { margin: 0; font: 700 24px/1.15 var(--serif); letter-spacing: .095em; white-space: nowrap }
  .brand p { color: var(--muted); margin: 5px 0 0; font-size: 10px; letter-spacing: .18em }
  .coord {
    position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
    color: var(--muted); font: 11px/1.5 var(--mono); letter-spacing: .11em;
    display: flex; align-items: center; gap: 10px; pointer-events: none;
  }
  .coord::before { content: ""; width: 5px; height: 5px; border: 1px solid var(--cool); transform: rotate(45deg) }
  .action {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-height: 33px; padding: 4px 11px; border: 1px solid var(--line); border-radius: 6px;
    background: #121726c0; color: #d9deee; letter-spacing: .07em; white-space: nowrap; font-size: 11px;
  }
  .action:hover, .action[aria-expanded="true"] { background: #222943; border-color: #a3afe55e; color: white }
  .action .icon { color: var(--cool); font: 15px/1 var(--mono) }
  .panel {
    background: var(--glass); border: 1px solid var(--line); border-radius: 9px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 16px 40px #0003; overscroll-behavior: contain;
  }
  .panel-head {
    padding: 12px 15px; border-bottom: 1px solid var(--line); display: flex;
    align-items: center; justify-content: space-between; gap: 8px;
  }
  .panel-head h2, .panel-head h3 { margin: 0; font-weight: 550; font-size: 11px; letter-spacing: .16em }
  .panel-head .count { color: var(--subtle); font: 10px/1.2 var(--mono); letter-spacing: .045em }
  #catalog {
    position: absolute; top: 96px; left: 24px; width: 203px; max-height: calc(100% - 192px);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #object-list { overflow: auto; padding: 5px 8px 10px; scrollbar-width: thin; scrollbar-color: #a9b6e137 transparent }
  .group { margin: 9px 0 3px; padding: 0 8px; color: var(--subtle); font-size: 10px; letter-spacing: .14em }
  .object {
    position: relative; display: flex; align-items: center; gap: 9px; width: 100%; min-height: 27px;
    padding: 2px 8px; border: 1px solid transparent; border-radius: 4px;
    background: transparent; text-align: left; color: #dbddeb; font-size: 12px; white-space: nowrap;
  }
  .object:hover { background: #9caee218 }
  .object[aria-current="true"] { background: #c1a97a17; border-color: #f1b97b38; color: #ffe2bd }
  .object[aria-current="true"]::after { content: "›"; margin-left: auto; color: var(--warm); font: 14px/1 var(--mono) }
  .object.moon { padding-left: 25px; min-height: 23px; font-size: 11px; color: #aeb6cb }
  .object .name-latin { color: var(--subtle); font: 9px/1.2 var(--mono); overflow: hidden; text-overflow: ellipsis }
  .dot {
    width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--object);
    box-shadow: 0 0 7px color-mix(in srgb, var(--object), transparent 57%);
  }
  .moon .dot { width: 4px; height: 4px }
  #inspector {
    position: absolute; top: 96px; right: 24px; width: 283px;
    max-height: calc(100% - 292px); overflow: auto;
    scrollbar-width: thin; scrollbar-color: #a9b6e137 transparent;
  }
  .object-head { display: flex; justify-content: space-between; align-items: center; padding: 13px 15px 12px; gap: 10px }
  .object-head h2 { margin: 0; font: 700 30px/1.2 var(--serif); letter-spacing: .09em }
  .object-head p { margin: 4px 0 0; color: var(--muted); font: 10px/1.4 var(--mono); letter-spacing: .1em }
  #identity-mark {
    flex: none; position: relative; width: 33px; height: 33px; border-radius: 50%; margin-right: 2px;
    border: 1px solid color-mix(in srgb, var(--object), transparent 53%);
    background: radial-gradient(circle at 35% 30%,var(--object),#0002 52%,#0009 76%),#141722;
    box-shadow: 0 0 22px color-mix(in srgb, var(--object), transparent 82%);
  }
  #identity-mark.ringed::after {
    content: ""; position: absolute; inset: 11px -7px; border-radius: 50%; transform: rotate(-26deg);
    border: 1px solid color-mix(in srgb, var(--object), transparent 28%);
  }
  .metrics-title {
    display: flex; align-items: center; gap: 6px; padding: 0 15px 7px;
    font-size: 10px; color: #c3c9db; letter-spacing: .12em;
  }
  .metrics-title::after { content: ""; flex: 1; height: 1px; margin-left: 4px; background: var(--line) }
  #live-data {
    margin: 0 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 5px; overflow: hidden;
  }
  #live-data div { min-width: 0; padding: 6px 8px; background: #111626 }
  #live-data div.wide { grid-column: 1/-1 }
  dt { color: var(--muted); font-size: 10px; letter-spacing: .05em }
  dd { margin: 2px 0 0; color: #f0edf5; font: 11.5px/1.4 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
  #static-data { margin: 10px 15px 0; display: grid; gap: 0 }
  #static-data div { display: flex; justify-content: space-between; align-items: baseline; gap: 9px; border-bottom: 1px solid #a9b6e115; padding: 3px 0 }
  #static-data dd { margin: 0; color: #d6dbeb; font-size: 10.5px; text-align: right; white-space: normal }
  #static-data dt { flex: none }
  #description { margin: 9px 15px 13px; color: #b9c0d2; font-size: 11px; line-height: 1.7 }
  #settings { position: absolute; right: 24px; bottom: 21px; width: 283px }
  #settings summary {
    padding: 10px 14px; color: #dcdfef; cursor: pointer; font-size: 11px; letter-spacing: .13em;
    display: flex; justify-content: space-between; align-items: center; list-style: none;
  }
  #settings summary::-webkit-details-marker { display: none }
  #settings summary::after { content: "+"; color: var(--cool); font: 15px/1 var(--mono) }
  #settings[open] summary { border-bottom: 1px solid var(--line) }
  #settings[open] summary::after { content: "−" }
  #layer-grid { padding: 7px 11px 10px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 11px }
  .switch {
    display: flex; justify-content: space-between; align-items: center; gap: 4px; min-height: 26px;
    padding: 0 3px; color: #c0c6d9; cursor: pointer; white-space: nowrap; font-size: 11px;
  }
  .switch input { appearance: none; margin: 0; position: relative; width: 24px; height: 13px; border: 1px solid #a9b6e154; border-radius: 9px; background: #0a0e19; cursor: pointer; flex: none }
  .switch input::after { content: ""; width: 7px; height: 7px; position: absolute; top: 2px; left: 2px; border-radius: 50%; background: #939bb3; transition: transform .16s }
  .switch input:checked { background: #424e84; border-color: #8797d9 }
  .switch input:checked::after { transform: translateX(11px); background: #f0f1ff }
  .switch input:disabled { opacity: .48; cursor: default }
  #time-dock {
    position: absolute; left: calc(50% - 35px); bottom: 21px; transform: translateX(-50%);
    width: min(668px, calc(100% - 609px)); min-width: 415px; overflow: hidden;
  }
  .transport {
    display: grid; grid-template-columns: auto minmax(168px,1fr) auto minmax(133px,1.07fr);
    align-items: center; column-gap: 11px; padding: 10px 12px;
  }
  #play {
    display: grid; place-items: center; width: 33px; height: 33px; border: 1px solid #f4bc7670;
    border-radius: 50%; background: #f0b77121; color: #ffe0b4; padding: 0;
  }
  #play:hover { background: #f0b77140 }
  #play-icon { display: block; width: 10px; height: 10px; border: solid currentColor; border-width: 0 3px; }
  #play[aria-pressed="false"] #play-icon {
    width: 0; height: 0; margin-left: 2px; border: 0; border-left: 9px solid currentColor;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .time-control { min-width: 0; display: grid; gap: 2px }
  .time-control label, .speed-label { color: var(--muted); font-size: 10px; letter-spacing: .09em }
  #utc {
    min-width: 0; width: 100%; padding: 0; margin: 0; border: 0; background: transparent;
    color: #f2eee8; font: 12px/1.65 var(--mono); font-variant-numeric: tabular-nums;
  }
  #utc::-webkit-calendar-picker-indicator { opacity: .7; cursor: pointer }
  #now { min-height: 29px; padding-inline: 7px }
  .speed-control { border-left: 1px solid var(--line); padding-left: 11px; align-self: stretch; display: grid; align-content: center; gap: 5px }
  .speed-label { display: flex; justify-content: space-between; gap: 3px }
  #rate-text { color: var(--cool); font: 11px/1.45 var(--mono); white-space: nowrap }
  #rate {
    appearance: none; width: 100%; height: 5px; padding: 0; margin: 3px 0 4px;
    border: 0; border-radius: 8px; background:
      linear-gradient(90deg,transparent 49.5%,#a9b6e18a 49.5% 50.5%,transparent 50.5%),
      linear-gradient(90deg,#282f44 var(--from,50%),#8f9bd8 var(--from,50%) var(--to,77%),#282f44 var(--to,77%));
    cursor: ew-resize;
  }
  #rate::-webkit-slider-thumb { appearance: none; width: 11px; height: 11px; background: #d5dcff; border: 1px solid #adb8f3; border-radius: 50% }
  #rate::-moz-range-thumb { width: 10px; height: 10px; background: #d5dcff; border: 1px solid #adb8f3; border-radius: 50% }
  .dock-foot {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    min-height: 27px; padding: 5px 12px; background: #0b0e19a3; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 10px; letter-spacing: .035em;
  }
  .dock-foot kbd, .help kbd { font: 10px/1.1 var(--mono); color: #c0c8e6; padding: 1px 3px; border: 1px solid var(--line); border-radius: 3px }
  .dock-foot span:last-child { white-space: nowrap }
  #warning {
    position: absolute; left: 50%; top: 90px; transform: translateX(-50%);
    padding: 6px 12px; color: #ffe3b5; background: #2e2017ea; border: 1px solid #f3be8366;
    border-radius: 5px; text-align: center; font-size: 11px; letter-spacing: .06em; pointer-events: none;
  }
  .help { position: absolute; left: 25px; bottom: 24px; color: #a2aac2; font-size: 10px; letter-spacing: .055em; pointer-events: none !important }
  .help span + span::before { content: " / "; opacity: .6; margin: 0 2px }
  #return-ui {
    position: fixed; top: 14px; right: 14px; background: #101421de; z-index: 5;
  }
  #message {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 22px;
    background: #050711e8; z-index: 8;
  }
  #message div { width: min(430px, 100%); padding: 20px 23px; border: 1px solid var(--line); background: #111625; border-radius: 9px }
  #message strong { font: 700 19px/1.35 var(--serif); color: var(--warm) }
  #message p { margin: 8px 0 0; color: #cbd1e2; overflow-wrap: anywhere }
  .mobile-only { display: none }
  @media (min-height: 980px) {
    .object { min-height: 30px }
    .object.moon { min-height: 25px }
    .group { margin-top: 12px }
    #inspector { max-height: calc(100% - 307px) }
  }
  @media (max-width: 1090px) {
    #catalog { left: 14px; width: 168px }
    #inspector, #settings { right: 14px; width: 253px }
    #time-dock { left: calc(50% - 42px); width: calc(100% - 452px); min-width: 0 }
    .transport { column-gap: 7px; padding-inline: 9px }
    .help { left: 15px; font-size: 9px }
    .help span:last-child { display: none }
  }
  @media (max-width: 915px), (max-height: 610px) {
    .mast { height: 60px; padding-inline: 13px }
    .brand h1 { font-size: 20px }
    .brand p, .coord, .help, .dock-foot span:last-child { display: none }
    .mobile-only { display: inline-flex }
    #catalog, #inspector { top: 72px; max-height: calc(100% - 191px); z-index: 3; }
    #catalog:not(.opened), #inspector:not(.opened) { display: none }
    #catalog { width: min(235px, calc(100% - 28px)) }
    #inspector { width: min(286px, calc(100% - 28px)) }
    #settings { bottom: 114px; width: min(270px,calc(100% - 28px)); right: 14px }
    #time-dock { left: 50%; bottom: 13px; width: min(610px, calc(100% - 26px)); min-width: 0 }
    #warning { top: 65px; max-width: calc(100% - 28px); white-space: nowrap; z-index: 4 }
  }
  @media (max-width: 530px) {
    .brand { gap: 5px }
    .mark { transform: scale(.78); margin-inline: -4px; }
    .brand h1 { font-size: 17px; letter-spacing: .04em }
    .actions { gap: 5px }
    .action { padding-inline: 6px; letter-spacing: 0 }
    .action .icon { display: none }
    .transport { grid-template-columns: auto minmax(146px,1fr) auto; row-gap: 8px; column-gap: 8px }
    .speed-control { grid-column: 1/-1; border-left: 0; border-top: 1px solid var(--line); padding: 5px 0 0 }
    #settings { bottom: 148px }
    #catalog, #inspector { max-height: calc(100% - 230px) }
  }
  @media (max-width: 386px) {
    .mast { gap: 5px; padding-inline: 8px }
    .brand { gap: 3px }
    .brand h1 { font-size: 15px; letter-spacing: .02em }
    .mark { transform: scale(.68); margin-inline: -6px }
    .actions { gap: 4px }
    .actions .action { padding-inline: 5px; min-height: 32px }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>
<canvas id="space" aria-label="可拖动和缩放的三维太阳系"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="chrome">
  <header class="mast">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><b></b></span><div><h1>太阳系轨道图谱</h1><p>实时天体运动模型</p></div></div>
    <span class="coord">J2000 黄道坐标</span>
    <nav class="actions" aria-label="视角">
      <button class="action mobile-only" id="show-catalog" aria-controls="catalog" aria-expanded="false">天体</button>
      <button class="action mobile-only" id="show-inspector" aria-controls="inspector" aria-expanded="false">读数</button>
      <button class="action" id="overview" type="button"><span class="icon" aria-hidden="true">◎</span>全景</button>
      <button class="action" id="hide-ui" type="button" title="隐藏界面（H）"><span class="icon" aria-hidden="true">⛶</span>沉浸</button>
    </nav>
  </header>
  <nav id="catalog" class="panel" aria-label="天体索引">
    <div class="panel-head"><h2>天体索引</h2></div>
    <div id="object-list"></div>
  </nav>
  <aside id="inspector" class="panel" aria-label="选中天体信息">
    <div class="panel-head"><h2>观测对象</h2><span id="body-kind" class="count"></span></div>
    <div class="object-head"><div><h2 id="body-name"></h2><p id="body-latin"></p></div><div id="identity-mark" aria-hidden="true"></div></div>
    <div class="metrics-title">实时读数</div>
    <dl id="live-data"></dl>
    <dl id="static-data"></dl>
    <p id="description"></p>
  </aside>
  <details id="settings" class="panel" open>
    <summary>显示图层</summary>
    <div id="layer-grid">
      <label class="switch">轨道<input type="checkbox" data-layer="orbits" checked></label>
      <label class="switch">名称<input type="checkbox" data-layer="labels" checked></label>
      <label class="switch">卫星<input type="checkbox" data-layer="moons" checked></label>
      <label class="switch">小行星带<input type="checkbox" data-layer="belts" checked></label>
      <label class="switch">彗星<input type="checkbox" data-layer="comet" checked></label>
      <label class="switch">辉光<input type="checkbox" data-layer="glow" checked></label>
      <label class="switch">真实距离比例<input type="checkbox" data-layer="linear"></label>
    </div>
  </details>
  <section id="time-dock" class="panel" aria-label="时间控制">
    <div class="transport">
      <button id="play" type="button" aria-label="暂停" aria-pressed="true" title="播放或暂停（空格）"><span id="play-icon" aria-hidden="true"></span></button>
      <div class="time-control"><label for="utc">模拟时间 · UTC</label><input id="utc" type="datetime-local" step="1" min="0001-01-01T00:00:00" max="9999-12-31T23:59:59"></div>
      <button id="now" class="action" type="button">此刻</button>
      <div class="speed-control">
        <div class="speed-label"><label for="rate">时间倍率</label><output id="rate-text" for="rate"></output></div>
        <input id="rate" type="range" min="-100" max="100" step="1" value="52">
      </div>
    </div>
    <div class="dock-foot"><span id="scale-note">幂律缩距保留黄经与黄纬，天体尺寸已放大。</span><span><kbd>←</kbd> <kbd>→</kbd> 调速</span></div>
  </section>
  <div id="warning" role="status" hidden>已超出根数有效区间（外推）</div>
  <div class="help"><span>拖动旋转</span><span>滚轮缩放</span><span><kbd>H</kbd> 隐藏界面</span></div>
</div>
<button id="return-ui" class="action" type="button" hidden>显示界面</button>
<div id="message" role="status"><div><strong id="message-title">正在绘制太阳系</strong><p id="message-text">正在初始化 WebGL2 场景。</p></div></div>
<script>
(() => {
'use strict';

const PI = Math.PI;
const TAU = PI * 2;
const DEG = PI / 180;
const J2000 = 2451545.0;
const CENTURY = 36525;
const AU = 149597870.7;
const DAY_MS = 86400000;
const UNIX_JD = 2440587.5;
const SCALE = 34;
const COMPRESSED = 0.62;
const GALACTIC_POLE = [-0.8678, 0.4972, 0.0003];
const $ = id => document.getElementById(id);
const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
const mix = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const wrap = x => ((x % TAU) + TAU) % TAU;
const signedAngle = x => wrap(x + PI) - PI;
const toJD = ms => ms / DAY_MS + UNIX_JD;
const fromJD = jd => (jd - UNIX_JD) * DAY_MS;
const length = v => Math.hypot(...v);
const add = (a, b) => a.map((v, i) => v + b[i]);
const sub = (a, b) => a.map((v, i) => v - b[i]);
const times = (v, s) => v.map(x => x * s);
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
const unit = v => times(v, 1 / (length(v) || 1));
const eclToWorld = v => [v[0], v[2], -v[1]];
const displayRadius = km => 0.72 * (km / 6371) ** 0.42;

const sun = {
  id: 'sun', name: '太阳', latin: 'Sun', type: '恒星', kind: 0, color: '#ffbd75',

    gl.renderbufferStorageMultisample(gl.RENDERBUFFER,4,format,width,height);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,color);
    const target={width,height,fbo,color,depth:makeDepth(width,height,4),tex:null};
    if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE) return target;
    destroy(target);
    return null;
  }
  function destroy(target) {
    if(!target) return;
    gl.deleteFramebuffer(target.fbo);
    if(target.color) gl.deleteRenderbuffer(target.color);
    if(target.depth) gl.deleteRenderbuffer(target.depth);
    if(target.tex) gl.deleteTexture(target.tex);
  }
  function drawFull() { gl.drawArrays(gl.TRIANGLES,0,3); }
  const galaxy=makeTarget(1536,768,gl.RGBA8,true);
  if(!galaxy) throw new Error('无法创建银河背景缓冲。');
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.viewport(0,0,galaxy.width,galaxy.height);
  gl.bindVertexArray(empty);
  use('skyBake');
  drawFull();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.deleteFramebuffer(galaxy.fbo);

  function allocate(width,height,format) {
    const resolved=makeTarget(width,height,format);
    if(!resolved) return false;
    const multisample=makeMSAA(width,height,format);
    if(!multisample) {
      gl.bindFramebuffer(gl.FRAMEBUFFER,resolved.fbo);
      resolved.depth=makeDepth(width,height,0);
      if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE) {
        destroy(resolved);
        return false;
      }
    }
    scene=resolved; msaa=multisample;
    return true;
  }
  function size(view) {
    const native=Math.min(1.8,devicePixelRatio||1,Math.sqrt(6.72e6/(view.width*view.height)),samplerLimit/Math.max(view.width,view.height));
    const ratio=native*resolution;
    const width=Math.max(1,Math.round(view.width*ratio)),height=Math.max(1,Math.round(view.height*ratio));
    if(w===width && h===height) return;
    destroy(scene); destroy(msaa);
    for(const target of mip) destroy(target);
    scene=null; msaa=null; mip=[];
    canvas.width=w=width; canvas.height=h=height;
    dpr=height/view.height;
    hdr=hasHDR && allocate(w,h,gl.RGBA16F);
    if(!hdr && !allocate(w,h,gl.RGBA8)) throw new Error('无法创建可用的场景缓冲。');
    for(let i=1;i<=6;i++) {
      const target=makeTarget(Math.max(1,w>>i),Math.max(1,h>>i),hdr ? gl.RGBA16F : gl.RGBA8);
      if(!target) break;
      mip.push(target);
    }
    glowAvailable=mip.length===6;
  }
  function observe(now,seconds) {
    if(now<observeAfter || seconds<=0 || document.hidden) return;
    sampleFrames++; sampleSeconds+=Math.min(seconds,.50);
    if(sampleSeconds<.94 || sampleFrames<5) return;
    const fps=sampleFrames/sampleSeconds;
    if(fps<58.7 && resolution>.56) {
      maxQuality=resolution;
      resolution=Math.max(.56,resolution*clamp(Math.sqrt(fps/60),.81,.93));
      stableWindows=0;
      observeAfter=now+650;
    } else if (fps>=59 && resolution<maxQuality*.96) {
      if(++stableWindows>=4) {
        resolution=Math.min(maxQuality*.97,resolution*1.045);
        stableWindows=0;
        observeAfter=now+650;
      }
    } else {
      stableWindows=0;
    }
    sampleFrames=0; sampleSeconds=0;
  }
  function drawSphere(geometry) {
    gl.bindVertexArray(geometry.array);
    gl.drawElements(gl.TRIANGLES,geometry.count,gl.UNSIGNED_SHORT,0);
  }
  function drawBackground(view,t) {
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);
    let u=use('sky');
    gl.bindVertexArray(empty);
    bindTexture(galaxy.tex);
    gl.uniform1i(u.uSky,0);
    gl.uniformMatrix4fv(u.uInv,false,view.inv);
    gl.uniform3fv(u.uEye,view.eye);
    drawFull();
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE,gl.ONE);
    u=use('stars');
    gl.uniformMatrix4fv(u.uVP,false,view.vp);
    gl.uniform3fv(u.uEye,view.eye);
    gl.uniform1f(u.uTime,t);
    gl.uniform1f(u.uDpr,dpr);
    gl.bindVertexArray(stars.array);
    gl.drawArrays(gl.POINTS,0,stars.count);
  }
  function drawOpaque(view,projections,t) {
    gl.disable(gl.BLEND);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.enable(gl.CULL_FACE);
    const u=use('sphere');
    gl.uniformMatrix4fv(u.uVP,false,view.vp);
    gl.uniform3fv(u.uEye,view.eye);
    gl.uniform1f(u.uTime,t);
    for(const [body,p] of projections) {
      if(!onScreen(p,view) || p.r*dpr<.28) continue;
      const radius=body.display;
      gl.uniform3fv(u.uCenter,body.world);
      gl.uniformMatrix3fv(u.uBasis,false,spinBasis(body));
      gl.uniform1f(u.uRadius,radius);
      gl.uniform1f(u.uSunlight,body===sun ? 1 : bodyLight(body));
      gl.uniform1f(u.uDetail,p.r*dpr);
      gl.uniform1i(u.uKind,body.kind);
      const pixels=p.r*dpr;
      drawSphere(pixels>50 ? large : pixels>11 ? medium : small);
    }
  }
  function drawPaths(view,projections) {
    const u=use('path');
    gl.bindVertexArray(empty);
    gl.uniformMatrix4fv(u.uVP,false,view.vp);
    gl.uniform2f(u.uSize,w,h);
    for(const body of [...planets,halley,...moons]) {
      if(!isVisible(body)) continue;
      const local=Boolean(body.parent), p=projections.get(body.parent);
      if(local && (!p || !onScreen(p,view,p.r*8) || p.r<5.5)) continue;
      const {state}=body;
      const samples=local ? 180 : body===halley ? 780 : 480;
      const plane=local ? body.plane : state.plane;
      const tint=orbitTint[body.id];
      const chosen=selected===body;
      const strong=local ? (chosen ? .125 : .057) : chosen ? .225 : body===halley ? .075 : .137;
      const base=local ? (chosen ? .024 : .012) : chosen ? .047 : body===halley ? .009 : .017;
      gl.uniform3fv(u.uP,plane[0]);
      gl.uniform3fv(u.uQ,plane[1]);
      gl.uniform3fv(u.uCenter,local ? body.parent.world : sun.world);
      gl.uniform3fv(u.uColor,tint);
      gl.uniform4f(u.uStyle,wrap(state.anomaly)/TAU,(body.orbitDays<0 ? -1 : 1)*(rate<0 ? -1 : 1),base,strong);
      gl.uniform4f(u.uElements,local ? body.distance : state.a,local ? 0 : state.e,local ? 0 : exponent,(chosen ? 1.45 : local ? .92 : 1.09)*dpr);
      gl.uniform1i(u.uSamples,samples);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,(samples+1)*2);
    }
  }
  function drawParticles(view) {
    const u=use('particle');
    gl.uniformMatrix4fv(u.uVP,false,view.vp);
    gl.uniform1f(u.uExponent,exponent);
    gl.uniform1f(u.uDays,jd-J2000);
    gl.uniform1f(u.uDpr,dpr);
    gl.bindVertexArray(particles.array);
    gl.drawArrays(gl.POINTS,0,particles.count);
  }
  function drawAtmospheres(view,projections) {
    const u=use('atmosphere');
    gl.uniformMatrix4fv(u.uVP,false,view.vp);
    gl.uniformMatrix3fv(u.uBasis,false,[1,0,0,0,1,0,0,0,1]);
    gl.uniform3fv(u.uEye,view.eye);
    for(const [body,p] of projections) {
      if(!body.atmosphere || !onScreen(p,view,p.r*1.4) || p.r*dpr<1.9) continue;
      const [scaleHeight,tint,strength]=body.atmosphere;
      gl.uniform3fv(u.uCenter,body.world);
      gl.uniform3fv(u.uTint,tint);
      gl.uniform1f(u.uRadius,body.display*(1+scaleHeight*7.5));
      gl.uniform4f(u.uAir,body.display,scaleHeight,strength,bodyLight(body));
      drawSphere(p.r*dpr>48 ? large : medium);
    }
  }
  function drawRings(view,projections) {
    const u=use('ring');
    gl.uniformMatrix4fv(u.uVP,false,view.vp);
    gl.uniform3fv(u.uEye,view.eye);
    gl.bindVertexArray(ring.array);
    const ringed=[...projections].filter(([b,p])=>b.rings && onScreen(p,view,p.r*b.rings[1])).sort((a,b)=>b[1].depth-a[1].depth);
    for(const [body] of ringed) {
      gl.uniform3fv(u.uCenter,body.world);
      gl.uniform3fv(u.uX,body.basis[0]);
      gl.uniform3fv(u.uAxis,body.basis[1]);
      gl.uniform3fv(u.uZ,body.basis[2]);
      gl.uniform1f(u.uRadius,body.display);
      gl.uniform1f(u.uSunlight,bodyLight(body));
      gl.uniform2fv(u.uBounds,body.rings);
      gl.uniform1i(u.uKind,body.kind);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,ring.count);
    }
  }
  function billboard(u,view,body,radius) {
    gl.uniformMatrix4fv(u.uVP,false,view.vp);
    gl.uniform3fv(u.uRight,view.right);
    gl.uniform3fv(u.uUp,view.up);
    gl.uniform3fv(u.uCenter,body.world);
    gl.uniform1f(u.uSize,radius);
    gl.bindVertexArray(empty);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  function drawComet(view,t,p) {
    if(!layers.comet || !p) return;
    const {r,position,velocity}=halley.state;
    const activity=cometActivity();
    const visibility=cometTailVisibility();
    if(r<=6.5 && visibility>0) {
      const u=use('tail');
      gl.uniformMatrix4fv(u.uVP,false,view.vp);
      gl.uniform1f(u.uTime,t);
      gl.bindVertexArray(tail.array);
      gl.bindBuffer(gl.ARRAY_BUFFER,tail.buffer);
      const antiSolar=unit(position), trailing=unit(times(velocity,-1));
      for(let dust=0;dust<2;dust++) {
        const extent=activity*(dust ? 1.64 : 2.10);
        for(let i=0;i<=tailSamples;i++) {
          const f=i/tailSamples;
          const bend=dust ? f*.94 : 0;
          const direction=unit(add(times(antiSolar,1-bend*.56),times(trailing,bend*.56)));
          const p=add(halley.world,times(direction,extent*f));
          const normal=unit(cross(direction,sub(view.eye,p)));
          const width=.11+(dust ? .086 : .029)*extent*f**.70;
          for(let side=0;side<2;side++) {
            const lateral=side*2-1;
            tailData.set([...add(p,times(normal,width*lateral)),f,lateral],(i*2+side)*5);
          }
        }
        gl.bufferSubData(gl.ARRAY_BUFFER,0,tailData);
        gl.uniform3fv(u.uColor,dust ? [.96,.55,.23] : [.23,.60,1.]);
        gl.uniform1f(u.uPower,visibility*activity*(dust ? .023 : .028));
        gl.drawArrays(gl.TRIANGLE_STRIP,0,tail.count);
      }
    }
    if(onScreen(p,view,p.r*6)) {
      const u=use('coma');
      gl.uniform1f(u.uTime,t);
      gl.uniform1f(u.uActivity,Math.min(1.28,activity*.28+.036));
      billboard(u,view,halley,.37+Math.min(.96,activity*.046));
    }
  }
  function drawCorona(view,t,p) {
    if(!layers.glow || !p || !onScreen(p,view,p.r*9)) return;
    const u=use('corona');
    gl.uniform1f(u.uTime,t);
    for(const extent of [9,3.1]) {
      gl.uniform1f(u.uExtent,extent);
      billboard(u,view,sun,sun.display*extent);
    }
  }
  function post(view,projections,t) {
    if(msaa) {
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msaa.fbo);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,scene.fbo);
      gl.blitFramebuffer(0,0,w,h,0,0,w,h,gl.COLOR_BUFFER_BIT,gl.NEAREST);
    }
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    gl.bindVertexArray(empty);
    const bloom=layers.glow && glowAvailable;
    if(bloom) {
      let u=use('down'), source=scene;
      gl.uniform1i(u.uTexture,0);
      for(let i=0;i<mip.length;i++) {
        const target=mip[i];
        gl.bindFramebuffer(gl.FRAMEBUFFER,target.fbo);
        gl.viewport(0,0,target.width,target.height);
        bindTexture(source.tex);
        gl.uniform2f(u.uTexel,1/source.width,1/source.height);
        if(i===0) gl.uniform2f(u.uThreshold,hdr ? 1.25 : .64,hdr ? .60 : .28);
        else if(i===1) gl.uniform2f(u.uThreshold,0,0);
        drawFull();
        source=target;
      }
      u=use('up');
      gl.uniform1i(u.uTexture,0);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE,gl.ONE);
      for(let i=mip.length-1;i>0;i--) {
        const source=mip[i], target=mip[i-1];
        gl.bindFramebuffer(gl.FRAMEBUFFER,target.fbo);
        gl.viewport(0,0,target.width,target.height);
        bindTexture(source.tex);
        gl.uniform2f(u.uTexel,1/source.width,1/source.height);
        drawFull();
      }
      gl.disable(gl.BLEND);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,w,h);
    const u=use('composite');
    bindTexture(scene.tex,0);
    bindTexture(bloom ? mip[0].tex : galaxy.tex,1);
    gl.uniform1i(u.uTexture,0);
    gl.uniform1i(u.uBloom,1);
    gl.uniform2f(u.uTexel,1/w,1/h);
    gl.uniform1f(u.uTime,t);
    gl.uniform1f(u.uGlow,bloom ? 1 : 0);
    gl.uniform4fv(u.uFlare,layers.glow ? flareVisibility(view,projections) : [0,0,0,0]);
    drawFull();
  }
  function draw(view,projections,t,surfaceTime) {
    size(view);
    gl.bindFramebuffer(gl.FRAMEBUFFER,msaa?.fbo ?? scene.fbo);
    gl.viewport(0,0,w,h);
    gl.depthMask(true);
    gl.clearDepth(1);
    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.depthFunc(gl.LEQUAL);
    gl.cullFace(gl.BACK);
    drawBackground(view,t);
    drawOpaque(view,projections,surfaceTime);
    gl.depthMask(false);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE,gl.ONE);
    gl.disable(gl.CULL_FACE);
    if(layers.orbits) drawPaths(view,projections);
    if(layers.belts) drawParticles(view);
    gl.enable(gl.CULL_FACE);
    drawAtmospheres(view,projections);
    gl.disable(gl.CULL_FACE);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    drawRings(view,projections);
    gl.blendFunc(gl.ONE,gl.ONE);
    drawComet(view,surfaceTime,projections.get(halley));
    drawCorona(view,surfaceTime,projections.get(sun));
    post(view,projections,t);
  }
  return {draw,observe,gl};
}

let surfaceTime=0;
function frame(now) {
  const seconds=lastFrame ? Math.max(0,(now-lastFrame)/1000) : 0;
  lastFrame=now;
  const dt=playing ? seconds*rateDays() : 0;
  jd=clamp(jd+dt,dateMin,dateMax);
  if(dt!==0 && (jd===dateMin || jd===dateMax)) { playing=false; updatePlay(); }
  surfaceTime+=clamp(dt/.33,-.052,.052);
  if(scaleTransition) {
    const along=smooth((now-scaleTransition.start)/(reduced.matches ? 100 : 400));
    exponent=mix(scaleTransition.source,scaleTransition.dest,along);
    if(along>=1) scaleTransition=null;
  }
  updateBodies(jd,exponent,dt);
  updateCamera(now,seconds);
  const view=makeView();
  const projections=new Map();
  for(const body of bodies) {
    if(!isVisible(body)) continue;
    const p=project(view,body.world,body.display);
    if(p) projections.set(body,p);
  }
  if (now-lastUi>145) {
    if(document.activeElement!==$('utc')) $('utc').value=asUtcInput(jd);
    $('warning').hidden=jd>=validityStart && jd<validityEnd;
    refreshInspector(view);
    measureBlockers();
    lastUi=now;
  }
  if(!immersive) updateLabels(view,projections);
  renderer.draw(view,projections,now/1000,surfaceTime);
  renderer.observe(now,seconds);
  $('message').hidden=true;
  rafId=requestAnimationFrame(tick);
}
function showMessage(title,description) {
  $('message-title').textContent=title;
  $('message-text').textContent=description;
  $('message').hidden=false;
}
function tick(now) {
  if(!renderer || renderer.gl.isContextLost()) return;
  try { frame(now); }
  catch(error) {
    console.error(error);
    showMessage('太阳系场景暂停','浏览器无法完成当前帧的绘制。重新加载后可再次尝试。');
  }
}
function start() {
  const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
  if(!gl) {
    showMessage('此浏览器无法启动 WebGL2','请使用已启用硬件加速并支持 WebGL2 的浏览器打开本文件。');
    return;
  }
  try {
    renderer=createRenderer(gl);
    lastFrame=0;
    rafId=requestAnimationFrame(tick);
  } catch(error) {
    console.error(error);
    showMessage('无法初始化太阳系场景','当前图形驱动无法完成 WebGL2 初始化。启用浏览器硬件加速后可重新打开。');
  }
}
canvas.addEventListener('webglcontextlost',event => {
  event.preventDefault();
  cancelAnimationFrame(rafId);
  renderer=null;
  showMessage('图形上下文已断开','等待浏览器恢复绘制。');
});
canvas.addEventListener('webglcontextrestored',() => requestAnimationFrame(start));
document.addEventListener('visibilitychange',() => { lastFrame=0; });
setDate(jd);
makeCatalog();
bindUI();
selectBody(selected,false);
setRate(rate);
updatePlay();
requestAnimationFrame(start);
})();
</script>
</body>
</html>
