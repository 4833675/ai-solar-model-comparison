/* ============================================================
   工具
   ============================================================ */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

function meanAnomaly(L, longPeri, day) {
  const M = (L - longPeri) + (360 / periodFromL(L, longPeri, day)) * day;
  return M;
}

function solveKepler(Mdeg, e) {
  let M = ((Mdeg % 360) + 360) % 360 * DEG;
  if (M > Math.PI) M -= 2 * Math.PI;
  let E = e < 0.8 ? M : Math.PI;
  for (let k = 0; k < 8; k++) {
    const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= dE;
    if (Math.abs(dE) < 1e-8) break;
  }
  return E;
}

function orbitPosition(p, day) {
  // Mean anomaly from J2000-ish elements
  const n = 360 / p.period;
  const M = ((p.L - p.longPeri) + n * day) * DEG;
  const E = solveKepler(M / DEG, p.e);
  // Perifocal
  const xv = p.a * (Math.cos(E) - p.e);
  const yv = p.a * Math.sqrt(1 - p.e * p.e) * Math.sin(E);
  const v = Math.atan2(yv, xv);
  const r = Math.sqrt(xv * xv + yv * yv);

  // Rotate to ecliptic
  const w = (p.longPeri - p.longNode) * DEG;
  const om = p.longNode * DEG;
  const i = p.i * DEG;

  const xh = r * (Math.cos(om) * Math.cos(v + w) - Math.sin(om) * Math.sin(v + w) * Math.cos(i));
  const yh = r * (Math.sin(om) * Math.cos(v + w) + Math.cos(om) * Math.sin(v + w) * Math.cos(i));
  const zh = r * (Math.sin(v + w) * Math.sin(i));
  return new THREE.Vector3(xh, zh, -yh); // Three.js: Y up, Z toward viewer-ish
}

function buildOrbitCurve(p, scaleFn) {
  const pts = [];
  const n = 512;
  for (let k = 0; k <= n; k++) {
    const E = (k / n) * Math.PI * 2;
    const xv = p.a * (Math.cos(E) - p.e);
    const yv = p.a * Math.sqrt(1 - p.e * p.e) * Math.sin(E);
    const v = Math.atan2(yv, xv);
    const r = Math.sqrt(xv * xv + yv * yv);
    const w = (p.longPeri - p.longNode) * DEG;
    const om = p.longNode * DEG;
    const i = p.i * DEG;
    const xh = r * (Math.cos(om) * Math.cos(v + w) - Math.sin(om) * Math.sin(v + w) * Math.cos(i));
    const yh = r * (Math.sin(om) * Math.cos(v + w) + Math.cos(om) * Math.sin(v + w) * Math.cos(i));
    const zh = r * (Math.sin(v + w) * Math.sin(i));
    const v3 = new THREE.Vector3(xh, zh, -yh);
    v3.copy(scaleFn(v3));
    pts.push(v3);
  }
  const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
  return new THREE.BufferGeometry().setFromPoints(curve.getPoints(800));
}

/* ============================================================
   程序化贴图
   ============================================================ */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function noise2D(seed) {
  let s = seed >>> 0;
  return function (x, y) {
    const n = Math.sin(x * 127.1 + y * 311.7 + s * 0.001) * 43758.5453;
    return n - Math.floor(n);
  };
}

function fbm(nfunc, x, y, oct = 5) {
  let v = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) {
    v += a * nfunc(x * f, y * f);
    f *= 2.03; a *= 0.5;
  }
  return v;
}

function createRockyTexture(cfg, w = 1024, h = 512) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const n = noise2D(42);
  const img = ctx.createImageData(w, h);

  const dark = hexRgb(cfg.dark);
  const light = hexRgb(cfg.light);
  const crater = cfg.crater || 0.7;
  const noiseAmt = cfg.noise ?? 0.8;

  for (let y = 0; y < h; y++) {
    const lat = (y / h - 0.5) * Math.PI;
    for (let x = 0; x < w; x++) {
      const lon = (x / w) * Math.PI * 2;
      const nx = Math.cos(lat) * Math.cos(lon);
      const ny = Math.sin(lat);
      const nz = Math.cos(lat) * Math.sin(lon);
      let v = fbm(n, nx * 3.5 + 10, ny * 3.5 + nz * 2, 6);
      v = v * noiseAmt + (1 - noiseAmt) * 0.5;

      // craters
      let craterMod = 0;
      for (let ci = 0; ci < 18; ci++) {
        const cx = n(ci * 17.1, 3.3) * 2 - 1;
        const cy = n(ci * 9.7, 7.1) * 2 - 1;
        const cz = n(ci * 4.2, 11.5) * 2 - 1;
        const len = Math.hypot(cx, cy, cz) || 1;
        const dx = nx - cx / len, dy = ny - cy / len, dz = nz - cz / len;
        const d = Math.hypot(dx, dy, dz);
        const rad = 0.08 + n(ci, 5) * 0.18;
        if (d < rad) {
          const t = d / rad;
          craterMod += (1 - t) * (1 - t) * 0.35 * crater - (t > 0.7 ? 0.08 * crater : 0);
        }
      }
      v = clamp(v + craterMod, 0, 1);

      const r = lerp(dark[0], light[0], v) * (0.85 + 0.15 * (1 - Math.abs(ny)));
      const g = lerp(dark[1], light[1], v) * (0.85 + 0.15 * (1 - Math.abs(ny)));
      const b = lerp(dark[2], light[2], v) * (0.85 + 0.15 * (1 - Math.abs(ny)));
      // slight base mix
      const i = (y * w + x) * 4;
      img.data[i] = clamp(r * 0.3 + base[0] * 0.7 * (0.6 + 0.4 * v), 0, 255);
      img.data[i + 1] = clamp(g * 0.3 + base[1] * 0.7 * (0.6 + 0.4 * v), 0, 255);
      img.data[i + 2] = clamp(b * 0.3 + base[2] * 0.7 * (0.6 + 0.4 * v), 0, 255);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  if (cfg.ice) {
    // polar caps
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(240,245,255,0.55)');
    grad.addColorStop(0.12, 'rgba(240,245,255,0.0)');
    grad.addColorStop(0.88, 'rgba(240,245,255,0.0)');
    grad.addColorStop(1, 'rgba(240,245,255,0.55)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function createVenusTexture(cfg, w = 1024, h = 512) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const n = noise2D(99);
  const img = ctx.createImageData(w, h);
  const base = hexRgb(cfg.base);
  const dark = hexRgb(cfg.dark);
  const light = hexRgb(cfg.light);
  for (let y = 0; y < h; y++) {
    const lat = (y / h - 0.5) * Math.PI;
    for (let x = 0; x < w; x++) {
      const lon = (x / w) * Math.PI * 2;
      const swirl = Math.sin(lon * 3 + lat * 4 + fbm(n, lon * 2, lat * 2) * 4) * 0.15;
      const v = clamp(fbm(n, Math.cos(lat) * Math.cos(lon) * 2.5 + swirl, Math.sin(lat) * 2.5, 5) + 0.2, 0, 1);
      const i = (y * w + x) * 4;
      const shade = 0.7 + 0.3 * (1 - Math.abs(Math.sin(lat)));
      img.data[i] = lerp(dark[0], light[0], v) * shade;
      img.data[i + 1] = lerp(dark[1], light[1], v) * shade;
      img.data[i + 2] = lerp(dark[2], light[2], v) * shade * 0.85;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createMarsTexture(cfg, w = 1024, h = 512) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const n = noise2D(77);
  const img = ctx.createImageData(w, h);
  const base = hexRgb(cfg.base);
  const dark = hexRgb(cfg.dark);
  const light = hexRgb(cfg.light);
  for (let y = 0; y < h; y++) {
    const lat = (y / h - 0.5) * Math.PI;
    for (let x = 0; x < w; x++) {
      const lon = (x / w) * Math.PI * 2;
      const nx = Math.cos(lat) * Math.cos(lon);
      const ny = Math.sin(lat);
      const nz = Math.cos(lat) * Math.sin(lon);
      let v = fbm(n, nx * 3 + 5, ny * 3 + nz, 6);
      // dark maria
      if (v < 0.38) v *= 0.7;
      // olympus-like spots
      if (n(Math.floor(lon * 20), Math.floor(lat * 20)) > 0.97) v = clamp(v + 0.3, 0, 1);
      const i = (y * w + x) * 4;
      const polar = Math.abs(ny) > 0.78;
      if (polar) {
        img.data[i] = 230; img.data[i + 1] = 235; img.data[i + 2] = 240;
      } else {
        img.data[i] = lerp(dark[0], light[0], v) * 0.5 + base[0] * 0.5;
        img.data[i + 1] = lerp(dark[1], light[1], v) * 0.5 + base[1] * 0.5;
        img.data[i + 2] = lerp(dark[2], light[2], v) * 0.5 + base[2] * 0.5;
      }
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createEarthTexture(w = 1024, h = 512) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const n = noise2D(123);
  const img = ctx.createImageData(w, h);
  const ocean = [10, 47, 110];
  const shallow = [26, 107, 184];
  const land = [45, 107, 58];
  const desert = [196, 163, 90];
  const ice = [238, 246, 255];
  const forest = [20, 80, 40];

  for (let y = 0; y < h; y++) {
    const lat = (y / h - 0.5) * Math.PI;
    const latDeg = (y / h - 0.5) * 180;
    for (let x = 0; x < w; x++) {
      const lon = (x / w) * Math.PI * 2;
      const nx = Math.cos(lat) * Math.cos(lon);
      const ny = Math.sin(lat);
      const nz = Math.cos(lat) * Math.sin(lon);
      const elev = fbm(n, nx * 2.2, ny * 2.2 + nz * 0.5, 7);
      const detail = fbm(n, nx * 8 + 3, ny * 8, 4) * 0.15;
      const hgt = elev + detail;
      const i = (y * w + x) * 4;

      let r, g, b;
      if (hgt < 0.48) {
        // ocean
        const t = hgt / 0.48;
        r = lerp(ocean[0], shallow[0], t * t);
        g = lerp(ocean[1], shallow[1], t * t);
        b = lerp(ocean[2], shallow[2], t * t);
      } else {
        const t = (hgt - 0.48) / 0.52;
        const arid = fbm(n, nx * 3 + 40, ny * 3, 3);
        let baseLand;
        if (arid > 0.55 || (Math.abs(latDeg) < 30 && arid > 0.45)) baseLand = desert;
        else if (t < 0.35) baseLand = land;
        else if (t < 0.7) baseLand = forest;
        else baseLand = [140, 130, 110];
        r = lerp(baseLand[0], 200, t * 0.4);
        g = lerp(baseLand[1], 190, t * 0.35);
        b = lerp(baseLand[2], 170, t * 0.3);
      }
      // ice caps
      if (Math.abs(latDeg) > 68 + elev * 8) {
        const it = (Math.abs(latDeg) - (68 + elev * 8)) / 22;
        r = lerp(r, ice[0], clamp(it * 1.4, 0, 1));
        g = lerp(g, ice[1], clamp(it * 1.4, 0, 1));
        b = lerp(b, ice[2], clamp(it * 1.4, 0, 1));
      }
      img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function createCloudTexture(w = 1024, h = 512) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const n = noise2D(555);
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    const lat = (y / h - 0.5) * Math.PI;
    for (let x = 0; x < w; x++) {
      const lon = (x / w) * Math.PI * 2;
      const nx = Math.cos(lat) * Math.cos(lon);
      const ny = Math.sin(lat);
      const nz = Math.cos(lat) * Math.sin(lon);
      let v = fbm(n, nx * 3.5 + Math.sin(lat * 4) * 0.3, ny * 3.5 + nz * 0.8, 6);
      v = smoothstep(0.48, 0.72, v);
      // band bias
      v *= 0.7 + 0.3 * Math.abs(Math.sin(lat * 3));
      const i = (y * w + x) * 4;
      const a = v * 255;
      img.data[i] = 255; img.data[i + 1] = 255; img.data[i + 2] = 255; img.data[i + 3] = a;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

function createGasTexture(cfg, w = 1024, h = 512) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const n = noise2D(777);
  const img = ctx.createImageData(w, h);
  const bands = cfg.bands;

  function sampleBand(t) {
    t = ((t % 1) + 1) % 1;
    for (let i = 0; i < bands.length - 1; i++) {
      const [a0, c0] = bands[i];
      const [a1, c1] = bands[i + 1];
      if (t >= a0 && t <= a1) {
        const k = (t - a0) / (a1 - a0 || 1);
        return mixHex(c0, c1, k);
      }
    }
    return mixHex(bands[0][1], bands[bands.length - 1][1], t);
  }

  for (let y = 0; y < h; y++) {
    const latT = y / h;
    for (let x = 0; x < w; x++) {
      const lon = (x / w) * Math.PI * 2;
      const lat = (latT - 0.5) * Math.PI;
      // turbulence offset for bands
      const turb = (fbm(n, Math.cos(lon) * 2.5, Math.sin(lon) * 2.5 + latT * 6, 5) - 0.5) * cfg.turb * 0.12;
      const bandT = latT + turb + Math.sin(lat * 6) * 0.01;
      const [r, g, b] = sampleBand(bandT);
      // fine noise
      const fine = (fbm(n, x * 0.02, y * 0.04, 4) - 0.5) * 12;
      const i = (y * w + x) * 4;
      img.data[i] = clamp((r + fine) * 1.15, 0, 255);
      img.data[i + 1] = clamp((g + fine) * 1.15, 0, 255);
      img.data[i + 2] = clamp((b + fine * 0.8) * 1.15, 0, 255);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  // Great Red Spot
  if (cfg.storm) {
    const cx = w * 0.32, cy = h * 0.62, rx = w * 0.09, ry = h * 0.055;
    const grd = ctx.createRadialGradient(cx, cy, 2, cx, cy, Math.max(rx, ry));
    grd.addColorStop(0, 'rgba(200,80,40,0.95)');
    grd.addColorStop(0.45, 'rgba(180,90,50,0.75)');
    grd.addColorStop(0.8, 'rgba(200,140,90,0.25)');
    grd.addColorStop(1, 'rgba(200,140,90,0)');
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(rx / Math.max(rx, ry), ry / Math.max(rx, ry));
    ctx.translate(-cx, -cy);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(rx, ry), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function createIceTexture(cfg, w = 1024, h = 512) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const n = noise2D(321);
  const img = ctx.createImageData(w, h);
  const base = hexRgb(cfg.base);
  const dark = hexRgb(cfg.dark);
  const light = hexRgb(cfg.light);
  for (let y = 0; y < h; y++) {
    const latT = y / h;
    for (let x = 0; x < w; x++) {
      const lon = (x / w) * Math.PI * 2;
      const nx = Math.cos(latT * Math.PI - Math.PI / 2) * Math.cos(lon);
      const ny = Math.sin(latT * Math.PI - Math.PI / 2);
      let v = fbm(n, nx * 2, ny * 2 + (x * 0.01), 4) * (cfg.noise ?? 0.3) + 0.5;
      if (cfg.bands) {
        const band = 0.5 + 0.5 * Math.sin(latT * Math.PI * 8 + v);
        v = lerp(v, 0.35 + band * 0.5, 0.45);
      }
      // Neptune dark spot
      if (cfg.storm) {
        const dx = x / w - 0.42, dy = latT - 0.4;
        const d = Math.hypot(dx * 2, dy * 2.4);
        if (d < 0.12) v *= 0.55 + d * 2;
      }
      const i = (y * w + x) * 4;
      img.data[i] = lerp(dark[0], light[0], clamp(v, 0, 1)) * 0.35 + base[0] * 0.65;
      img.data[i + 1] = lerp(dark[1], light[1], clamp(v, 0, 1)) * 0.35 + base[1] * 0.65;
      img.data[i + 2] = lerp(dark[2], light[2], clamp(v, 0, 1)) * 0.35 + base[2] * 0.65;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createRingTexture(inner, outer, colors, w = 512, h = 64) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  for (let x = 0; x < w; x++) {
    const t = x / (w - 1);
    let alpha = 0.9;
    if (t > 0.28 && t < 0.34) alpha *= 0.1;
    if (t > 0.12 && t < 0.15) alpha *= 0.35;
    if (t > 0.55 && t < 0.58) alpha *= 0.4;
    if (t < 0.04 || t > 0.96) alpha *= 0.18;
    // soft bands
    alpha *= 0.7 + 0.3 * Math.sin(t * Math.PI * 28);
    const ci = Math.min(colors.length - 1, Math.floor(t * colors.length));
    const rgb = hexRgb(colors[ci]);
    const y0 = 0, y1 = h;
    const grd = ctx.createLinearGradient(x, y0, x, y1);
    const col = (a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
    grd.addColorStop(0, col(alpha * 0.4));
    grd.addColorStop(0.5, col(alpha));
    grd.addColorStop(1, col(alpha * 0.4));
    ctx.fillStyle = grd;
    ctx.fillRect(x, 0, 1, h);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.needsUpdate = true;
  return tex;
}

function createSunTexture(w = 512, h = 512) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const n = noise2D(1);
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const u = x / w, v = y / h;
      const val = fbm(n, Math.cos(u * Math.PI * 2) * 2 + Math.sin(v * Math.PI) * 1.5, Math.sin(u * Math.PI * 2) * 2 + v * 4, 6);
      const granule = fbm(n, x * 0.08, y * 0.08, 3);
      const t = clamp(val * 0.65 + granule * 0.35, 0, 1);
      const i = (y * w + x) * 4;
      img.data[i] = lerp(255, 255, t);
      img.data[i + 1] = lerp(140, 230, t);
      img.data[i + 2] = lerp(20, 160, t * t);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function hexRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixHex(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  const r = Math.round(lerp(A[0], B[0], t));
  const g = Math.round(lerp(A[1], B[1], t));
  const bl = Math.round(lerp(A[2], B[2], t));
  return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${bl.toString(16).padStart(2, '0')}`;
}

function createStars(count, radiusMin, radiusMax, size) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const siz = new Float32Array(count);
  const n = noise2D(2024);
  for (let i = 0; i < count; i++) {
    const u = Math.random() * 2 - 1;
    const th = Math.random() * Math.PI * 2;
    const r = radiusMin + Math.random() * (radiusMax - radiusMin);
    const s = Math.sqrt(1 - u * u);
    pos[i * 3] = r * s * Math.cos(th);
    pos[i * 3 + 1] = r * u;
    pos[i * 3 + 2] = r * s * Math.sin(th);
    const type = Math.random();
    let cr, cg, cb;
    if (type < 0.6) { cr = 1; cg = 1; cb = 1; }
    else if (type < 0.8) { cr = 0.75; cg = 0.85; cb = 1; }
    else if (type < 0.92) { cr = 1; cg = 0.9; cb = 0.7; }
    else { cr = 1; cg = 0.7; cb = 0.55; }
    const b = 0.35 + Math.random() * 0.65;
    col[i * 3] = cr * b; col[i * 3 + 1] = cg * b; col[i * 3 + 2] = cb * b;
    siz[i] = size * (0.4 + Math.random() * 1.8);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
    vertexShader: `
      attribute float aSize;
      attribute vec3 color;
      varying vec3 vColor;
      varying float vTw;
      uniform float uTime;
      uniform float uPixelRatio;
      void main() {
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        float tw = 0.75 + 0.25 * sin(uTime * 1.5 + position.x * 0.05 + position.y * 0.03);
        vTw = tw;
        gl_PointSize = aSize * uPixelRatio * tw * (180.0 / -mv.z);
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vTw;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        float alpha = smoothstep(0.5, 0.0, d);
        alpha *= alpha;
        gl_FragColor = vec4(vColor * vTw, alpha);
      }
    `
  });
  return new THREE.Points(g, m);
}

      gl_FragColor = vec4(col * 1.35, 1.0);

  `

// Visual radius: exaggerate planets so they're visible; orbits compressed with tunable curve
let realScaleMode = false;
let orbitScaleT = 0.72; // 0.55 compressed ... 1.0 more real

function mapOrbit(au, t = orbitScaleT) {
  // Soft compression of outer system so Neptune is visible
  // Offset keeps inner planets clear of the sun disc
  const k = lerp(2.8, 1.0, t);
  return Math.sign(au) * (Math.pow(Math.abs(au), 1 / k) * lerp(3.2, 4.6, t) + 2.1);
}

function mapVec(v, t = orbitScaleT) {
  const r = v.length();
  if (r < 1e-9) return v.clone();
  const nr = mapOrbit(r, t);
  return v.clone().multiplyScalar(nr / r);
}

function planetVisualRadius(p) {
  const base = realScaleMode ? 0.62 : 0.32;
  const r = base * Math.pow(p.radiusRe, 0.55);
  return clamp(r, 0.1, 1.7);
}

function makeLabel(text, color) {
  const c = makeCanvas(256, 64);

  ctx.font = '600 28px "SF Pro Display", "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = color || '#ffffff';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0.9 });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(1.6, 0.4, 1);
  return sp;
}

function makeAtmosphere(radius, color, intensity = 1) {
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide,
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uPower: { value: 2.8 },
      uIntensity: { value: intensity },
    },
    vertexShader: `
      varying vec3 vN;
      varying vec3 vP;
      void main() {
        vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vP = mv.xyz;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uPower;
      uniform float uIntensity;
      varying vec3 vN;
      varying vec3 vP;
      void main() {
        vec3 V = normalize(-vP);
        float f = 1.0 - abs(dot(normalize(vN), V));
        float a = pow(f, uPower) * uIntensity;
        gl_FragColor = vec4(uColor, a);
      }
    `
  });
  return new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 48), mat);
}

function buildPlanetMaterial(p) {
  let map;
  if (p.tex === 'earth') map = createEarthTexture();
  else if (p.tex === 'gas') map = createGasTexture(p.texCfg);
  else if (p.tex === 'ice') map = createIceTexture(p.texCfg);
  else if (p.tex === 'venus') map = createVenusTexture(p.texCfg);
  else if (p.tex === 'mars') map = createMarsTexture(p.texCfg);
  else map = createRockyTexture(p.texCfg);

  const mat = new THREE.MeshStandardMaterial({
    map,
    roughness: p.tex === 'gas' || p.tex === 'ice' ? 0.85 : 0.92,
    metalness: 0.0,
    color: 0xffffff,
    emissive: new THREE.Color(0xffffff),
    emissiveMap: map,
    emissiveIntensity: p.tex === 'gas' || p.tex === 'ice' ? 0.35 : 0.12,
  });
  return { mat, map };
}

  // clouds for earth (sibling of mesh so spin does not stack incorrectly)
  let clouds = null;
  if (p.id === 'earth') {
    clouds = new THREE.Mesh(

      new THREE.MeshStandardMaterial({
        map: createCloudTexture(),

        depthWrite: false,

      })
    );
    clouds.rotation.z = p.tilt * DEG;
    pivot.add(clouds);
    mesh.add(makeAtmosphere(r * 1.09, 0x4a90ff, 0.9));
  }
  if (p.id === 'venus') {

  }
  if (p.id === 'mars') {

  }
  if (p.id === 'jupiter' || p.id === 'saturn' || p.id === 'uranus' || p.id === 'neptune') {
    const atmCol = p.id === 'jupiter' ? 0xc8a880 : p.id === 'saturn' ? 0xe0d0a0 : p.id === 'uranus' ? 0x80d0e0 : 0x4060e0;
    mesh.add(makeAtmosphere(r * 1.04, atmCol, 0.15));
  }

  // rings
  if (p.rings) {
    const inner = r * p.rings.inner;
    const outer = r * p.rings.outer;
    const geo = new THREE.RingGeometry(inner, outer, 160, 1);
    const pos = geo.attributes.position;
    const uv = geo.attributes.uv;
    const v3 = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v3.fromBufferAttribute(pos, i);
      const rr = v3.length();
      const t = (rr - inner) / Math.max(outer - inner, 1e-6);
      uv.setXY(i, t, 0.5);
    }
    uv.needsUpdate = true;
    pos.needsUpdate = true;

    const ringTex = createRingTexture(p.rings.inner, p.rings.outer, p.rings.colors);
    const ringMat = new THREE.MeshBasicMaterial({
      map: ringTex, transparent: true, side: THREE.DoubleSide,
      opacity: p.rings.opacity, depthWrite: false,
      color: 0xffffff,
    });
    const ring = new THREE.Mesh(geo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.renderOrder = 2;
    // ring sits in mesh local frame; mesh already has axial tilt
    const ringGroup = new THREE.Group();
    ringGroup.add(ring);
    mesh.add(ringGroup);
    mesh.userData.ringGroup = ringGroup;
    mesh.userData.ringBase = r;
  }

  // moon (parented to pivot so spin does not drag the orbit)
  let moon = null;
  if (p.moon) {
    const mr = r * p.moon.radiusRe * 1.45;
    moon = new THREE.Mesh(
      new THREE.SphereGeometry(mr, 32, 32),
      new THREE.MeshStandardMaterial({
        map: createRockyTexture(p.moon.texCfg, 512, 256),
        roughness: 1, metalness: 0

  // orbit line
  const orbitGeo = buildOrbitCurve(p, (v) => mapVec(v));
  const orbitColor = new THREE.Color(p.accent).lerp(new THREE.Color(0xffffff), 0.15);
  const orbitMat = new THREE.LineBasicMaterial({
    color: orbitColor, transparent: true, opacity: 0.28, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
  scene.add(orbitLine);

  // label
  const label = makeLabel(p.name, p.accent);
  labelsGroup.add(label);

  planetObjs.push({
    def: p, pivot, mesh, clouds, moon, orbitLine, label,
    visualR: r,
    pos: new THREE.Vector3(),
  });
}

function createAsteroidBelt(count = 3500) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const data = [];
  for (let i = 0; i < count; i++) {
    const a = 2.1 + Math.random() * 1.3; // ~2.1–3.4 AU
    const e = Math.random() * 0.12;
    const iInc = (Math.random() - 0.5) * 12 * DEG;
    const omega = Math.random() * Math.PI * 2;
    const M0 = Math.random() * Math.PI * 2;
    data.push({ a, e, iInc, omega, M0 });
    const t = 0.5 + Math.random() * 0.5;
    colors[i * 3] = 0.55 * t;
    colors[i * 3 + 1] = 0.48 * t;
    colors[i * 3 + 2] = 0.4 * t;
    sizes[i] = 0.4 + Math.random() * 1.6;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, vertexColors: true,
    uniforms: { uPixelRatio: { value: renderer.getPixelRatio() } },
    vertexShader: `
      attribute float aSize;
      varying vec3 vColor;
      uniform float uPixelRatio;
      void main() {
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPixelRatio * (40.0 / -mv.z);
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        float a = smoothstep(0.5, 0.1, d);
        gl_FragColor = vec4(vColor, a * 0.85);
      }
    `
  });
  const points = new THREE.Points(g, m);
  scene.add(points);
  return { points, data, positions, geometry: g };
}

  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uStrength;
    varying vec2 vUv;
    void main() {
      vec2 uv = vUv;
      vec2 c = uv - 0.5;
      float r = length(c);
      // slight chromatic aberration at edges
      float ca = smoothstep(0.2, 0.75, r) * 0.004;
      vec2 dir = normalize(c + 1e-5);
      float cr = texture2D(tDiffuse, uv + dir * ca).r;
      float cg = texture2D(tDiffuse, uv).g;
      float cb = texture2D(tDiffuse, uv - dir * ca).b;
      vec3 col = vec3(cr, cg, cb);
      float vig = smoothstep(1.1, 0.35, r * 1.65);
      col *= mix(1.0 - uStrength, 1.0, vig);
      // subtle film grain
      float g = fract(sin(dot(uv * vec2(1234.0, 5678.0) + uStrength, vec2(12.9898,78.233))) * 43758.5453);
      col += (g - 0.5) * 0.015;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});

/* ---- 小行星带位置 ---- */
function updateBeltPositions(day, force = false) {
  const arr = belt.positions;
  const n = belt.data.length;
  // throttle full updates
  if (!force && (day % 0.5) > 0.05 && arr[0] !== 0) {
    // still update - cheap enough
  }
  for (let i = 0; i < n; i++) {
    const d = belt.data[i];
    const nmean = 360 / (365.25 * Math.pow(d.a, 1.5)); // deg/day
    const M = d.M0 + nmean * day;
    const E = solveKepler(M, d.e);
    const xv = d.a * (Math.cos(E) - d.e);
    const yv = d.a * Math.sqrt(1 - d.e * d.e) * Math.sin(E);
    // rotate by omega in orbital plane, then inclination
    const cosO = Math.cos(d.omega), sinO = Math.sin(d.omega);
    const cosI = Math.cos(d.iInc), sinI = Math.sin(d.iInc);
    const x1 = xv * cosO - yv * sinO;
    const y1 = xv * sinO + yv * cosO;
    const xh = x1;
    const zh = y1 * sinI;
    const yh = y1 * cosI;
    const v = new THREE.Vector3(xh, zh, -yh);
    const s = mapVec(v);
    arr[i * 3] = s.x; arr[i * 3 + 1] = s.y; arr[i * 3 + 2] = s.z;
  }
  belt.geometry.attributes.position.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (!paused) simDay += daysPerSecond * dt;

  sunUniforms.uTime.value = t;
  coronaMat.uniforms.uTime.value = t;
  stars.material.uniforms.uTime.value = t;
  sun.rotation.y = t * 0.02;

  // planets
  for (const po of planetObjs) {
    const p = po.def;
    const raw = orbitPosition(p, simDay);
    const mapped = mapVec(raw);
    po.pos.copy(mapped);
    po.pivot.position.copy(mapped);

    // label
    const labelPos = mapped.clone().add(new THREE.Vector3(0, po.visualR * 1.8 + 0.15, 0));
    po.label.position.copy(labelPos);
    const distCam = camera.position.distanceTo(labelPos);
    const ls = clamp(distCam * 0.028, 0.7, 5.5);
    po.label.scale.set(ls * 1.85, ls * 0.46, 1);

    // spin (sidereal)
    const rotPerDay = (Math.PI * 2) / (p.rotHours / 24);
    po.mesh.rotation.y = rotPerDay * simDay;

    if (po.clouds) po.clouds.rotation.y = rotPerDay * simDay * 1.12 + 0.4;

    // moon orbit
    if (po.moon) {
      const ma = (simDay / p.moon.period) * Math.PI * 2;
      const mr = Math.max(po.visualR * 3.2, 0.35);
      po.moon.position.set(Math.cos(ma) * mr, Math.sin(ma) * mr * 0.12, Math.sin(ma) * mr);
      po.moon.rotation.y = ma;
    }
  }

  // belt every few frames
  if (showBelt) {
    const frame = Math.floor(t * 30);
    if (frame % 2 === 0) updateBeltPositions(simDay);
  }

  // focus follow
  if (focusId === 'sun') focusTarget.set(0, 0, 0);
  else {
    const po = planetObjs.find(x => x.def.id === focusId);
    if (po) focusTarget.copy(po.pos);
  }
  smoothFocus.lerp(focusTarget, 1 - Math.pow(0.001, dt));
  controls.target.copy(smoothFocus);

  // if following, gently keep camera relative? only nudge if user not interacting hard
  controls.update();

  // date display
  const d = new Date(Date.UTC(2000, 0, 1, 12) + simDay * 86400000);
  el('stDate').textContent = d.toISOString().slice(0, 10);

  // fps
  fpsFrames++; fpsAcc += dt;
  if (fpsAcc >= 0.5) {
    el('stFps').textContent = `${Math.round(fpsFrames / fpsAcc)} FPS`;
    fpsFrames = 0; fpsAcc = 0;
  }

  if (bloomEnabled) composer.render();
  else renderer.render(scene, camera);
}
animate();

// keyboard: space pause, 1-8 focus
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  const map = { Digit0: 'sun', Digit1: 'mercury', Digit2: 'venus', Digit3: 'earth', Digit4: 'mars', Digit5: 'jupiter', Digit6: 'saturn', Digit7: 'uranus', Digit8: 'neptune' };
  if (map[e.code]) focusBody(map[e.code]);
});
</script>
