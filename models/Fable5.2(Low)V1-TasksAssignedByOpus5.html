<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>太阳系 · 实时轨道模型</title>
<style>
:root{--line:rgba(255,255,255,.09);--txt:#dfe6f2;--dim:#8793a8;--acc:#ffc46b;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--txt);font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;letter-spacing:.14em;color:#cfd8e8;text-shadow:0 0 6px #000,0 0 2px #000;will-change:transform,opacity;padding-left:12px}
.lb::before{content:"";position:absolute;left:-3px;top:50%;width:6px;height:6px;margin-top:-3px;border:1px solid currentColor;border-radius:50%;opacity:.7}
.lb.moon{font-size:10px;color:#9aa6ba}
.lb small{font-size:9px;color:var(--dim);margin-left:6px;letter-spacing:.1em}
.glass{position:fixed;background:linear-gradient(160deg,rgba(22,27,40,.62),rgba(8,10,18,.55));backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.cap{font-size:9.5px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
#title{position:fixed;left:22px;top:16px;pointer-events:none}
#title b{font-size:15px;font-weight:600;letter-spacing:.32em}
#title div{margin-top:2px}
#list{left:18px;top:66px;width:158px;padding:10px 6px;max-height:calc(100% - 170px);overflow:auto;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
#list .cap{padding:6px 10px 3px}
#list a{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:8px;cursor:pointer;letter-spacing:.08em;color:#c5cede;transition:background .15s}
#list a:hover{background:rgba(255,255,255,.06)}
#list a.on{background:rgba(255,196,107,.13);color:#ffe2b0}
#list a.m{padding-left:26px;font-size:12px;color:#97a2b6}
#list a i{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
#list a em{margin-left:auto;font:normal 9px var(--mono);color:#5f6a7e;letter-spacing:0}
#info{right:18px;top:16px;width:292px;padding:16px 16px 12px;max-height:calc(100% - 250px);overflow:auto;scrollbar-width:none}
#info::-webkit-scrollbar{display:none}
#info h2{margin:0;font-size:22px;font-weight:600;letter-spacing:.2em}
#info h2 span{font-size:10px;color:var(--dim);letter-spacing:.3em;margin-left:8px;font-weight:400}
#info .kind{margin:2px 0 10px}
#info table{width:100%;border-collapse:collapse}
#info td{padding:2.5px 0;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:top}
#info td:first-child{color:var(--dim);font-size:11.5px;letter-spacing:.06em;white-space:nowrap;padding-right:10px}
#info td:last-child{text-align:right;font:12px var(--mono);font-variant-numeric:tabular-nums;color:#e9eef8}
#info .sec{margin:12px 0 4px;display:flex;align-items:center;gap:8px}
#info .sec::after{content:"";flex:1;height:1px;background:var(--line)}
#info .live td:last-child{color:#ffd591}
#info p{margin:10px 0 2px;color:#aab4c6;font-size:12px;line-height:1.75;text-align:justify}
#bar{left:50%;bottom:18px;transform:translateX(-50%);padding:10px 16px;display:flex;align-items:center;gap:14px;white-space:nowrap}
button{font:inherit;color:var(--txt);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer;letter-spacing:.1em;transition:background .15s}
button:hover{background:rgba(255,255,255,.13)}
#play{width:38px;height:34px;padding:0;font-size:14px}
#clock{display:flex;flex-direction:column;min-width:178px}
#date{font:15px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.04em}
#warn{color:#ff9a6b;font-size:10px;letter-spacing:.06em;display:none}
#spd{display:flex;flex-direction:column;align-items:center;gap:1px}
#spdTxt{font:11px var(--mono);font-variant-numeric:tabular-nums;color:#ffd591;min-width:150px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:230px;height:18px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,#6f8cff,rgba(255,255,255,.25) 50%,#ffc46b)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-5.5px;box-shadow:0 0 10px rgba(255,220,160,.9)}
input[type=range]::-moz-range-track{height:2px;background:linear-gradient(90deg,#6f8cff,rgba(255,255,255,.25) 50%,#ffc46b)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
input[type=date]{font:11px var(--mono);color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:5px 6px;color-scheme:dark;width:118px}
#tog{right:18px;bottom:18px;width:292px;padding:12px 14px}
#tog .g{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:6px}
#tog label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;letter-spacing:.08em;color:#c5cede}
#tog input{display:none}
#tog label s{width:24px;height:13px;border-radius:7px;background:rgba(255,255,255,.12);position:relative;flex:none;transition:background .2s}
#tog label s::after{content:"";position:absolute;left:2px;top:2px;width:9px;height:9px;border-radius:50%;background:#8792a6;transition:all .2s}
#tog input:checked+s{background:rgba(255,196,107,.45)}
#tog input:checked+s::after{left:13px;background:#fff}
#tog .note{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.65;color:var(--dim)}
#tog .note b{color:#c9d3e4;font-weight:500}
#fps{position:fixed;left:22px;bottom:14px;font:10px var(--mono);color:#56607a;letter-spacing:.08em;pointer-events:none}
#help{position:fixed;left:22px;bottom:30px;font-size:10px;color:#56607a;letter-spacing:.1em;pointer-events:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:15px;letter-spacing:.1em;background:#000;z-index:9}
body.hide .glass,body.hide #title,body.hide #fps,body.hide #help{display:none}
@media(max-width:900px){#info{width:240px}#tog{display:none}#list{width:130px}input[type=range]{width:120px}#help{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="title"><b>太阳系</b><div class="cap">实时轨道模型 · JPL 开普勒根数 · WebGL2</div></div>
<nav id="list" class="glass"></nav>
<aside id="info" class="glass"></aside>
<div id="bar" class="glass">
  <button id="play" title="播放 / 暂停（空格）">❚❚</button>
  <div id="clock"><span class="cap">UTC</span><span id="date">—</span><span id="warn">已超出根数有效区间 1800–2050（外推）</span></div>
  <div id="spd"><span id="spdTxt"></span><input id="speed" type="range" min="-100" max="100" step="0.5" value="42"><span class="cap">◂ 倒放 · 时间流速 · 快进 ▸</span></div>
  <input id="dateIn" type="date" title="跳转到指定日期">
  <button id="now">此刻</button>
</div>
<div id="tog" class="glass">
  <div class="cap">显示</div>
  <div class="g">
    <label><input type="checkbox" id="tOrb" checked><s></s>轨道</label>
    <label><input type="checkbox" id="tLab" checked><s></s>名称</label>
    <label><input type="checkbox" id="tMoon" checked><s></s>卫星</label>
    <label><input type="checkbox" id="tBelt" checked><s></s>小行星带</label>
    <label><input type="checkbox" id="tCom" checked><s></s>彗星</label>
    <label><input type="checkbox" id="tGlow" checked><s></s>辉光</label>
    <label style="grid-column:1/3"><input type="checkbox" id="tReal"><s></s>真实距离比例（线性 AU）</label>
  </div>
  <div class="note"><b>关于比例：</b>日心距离按 r<sup>0.62</sup> 幂律压缩、天体半径被放大，否则同屏不可见。压缩只改变径向距离，<b>黄经、轨道相位、合冲关系等角位置完全精确</b>，由 JPL 轨道根数实时解开普勒方程得到。打开「真实距离比例」可看到线性距离下的太阳系。</div>
</div>
<div id="help">拖拽旋转 · 滚轮缩放 · 点击天体聚焦 · 空格暂停 · ←→ 调速 · H 隐藏界面</div>
<div id="fps"></div>
<div id="err">此浏览器不支持 WebGL2，无法运行。</div>
<script>
'use strict';
/* ====================================================================== GLSL */
const GL_NOISE=`
const float PI=3.14159265,TAU=6.2831853;
float sstep(float a,float b,float x){float t=clamp((x-a)/(b-a),0.,1.);return t*t*(3.-2.*t);}
float hash13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
vec3 hash33(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
float vnoise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z);}
const mat3 FROT=mat3(0.00,0.80,0.60,-0.80,0.36,-0.48,-0.60,-0.48,0.64);
float fbm(vec3 p,int oct){float a=.5,s=0.;for(int i=0;i<oct;i++){s+=a*vnoise(p);p=FROT*p*2.02+vec3(1.7,9.2,4.1);a*=.5;}return s;}
vec3 worley(vec3 p){vec3 i=floor(p),f=fract(p);float d1=9.,d2=9.,id=0.;
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){vec3 g=vec3(float(x),float(y),float(z));vec3 h=hash33(i+g);vec3 r=g+h-f;float d=dot(r,r);
  if(d<d1){d2=d1;d1=d;id=fract(dot(h,vec3(13.7,7.3,3.1)));}else if(d<d2)d2=d;}
 return vec3(sqrt(d1),sqrt(d2),id);}
vec3 rotY(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);}
`;
const GL_RING=`
uniform int uRing;
float gFw=0.;
float band(float a,float b,float w,float r){return sstep(a-w,a+w,r)*(1.-sstep(b-w,b+w,r));}
float gs(float r,float c,float s){float s2=max(s,gFw*.7);float t=(r-c)/s2;return exp(-t*t)*s/s2;}
float ringDensity(float r){
 if(uRing==1){
  if(r<1.22||r>2.36)return 0.;
  float d=max(.11*band(1.235,1.53,.004,r),1.2*band(1.525,2.03,.004,r));
  d*=1.-.87*band(1.95,2.03,.003,r);
  d=max(d,.58*band(2.025,2.27,.003,r));
  d*=1.-.92*gs(r,2.214,.0045);
  d*=1.-.80*gs(r,2.265,.0018);
  d+=.30*gs(r,2.324,.0055);
  float am=clamp(1.-gFw*120.,0.,1.);
  d*=mix(.98,.70+.60*fbm(vec3(r*230.,.37,.71),4),am);
  d*=.86+.28*fbm(vec3(r*31.,.5,.2),3);
  return d;}
 if(uRing==2){
  if(r<1.6||r>2.0)return 0.;
  return .55*gs(r,1.951,.0055)+.20*gs(r,1.909,.0025)+.17*gs(r,1.863,.0022)+.15*gs(r,1.823,.0020)+.12*gs(r,1.786,.0020)+.10*gs(r,1.751,.0018)+.07*gs(r,1.690,.0015);}
 if(uRing==3){return .016*band(1.40,1.81,.03,r);}
 return 0.;}
`;
const VS_BODY=`#version 300 es
layout(location=0) in vec3 aPos;
uniform mat4 uVP,uModel;out vec3 vObj,vWorld;
void main(){vObj=aPos;vec4 w=uModel*vec4(aPos,1.);vWorld=w.xyz;gl_Position=uVP*w;}`;

const FS_SUN=`#version 300 es
precision highp float;
in vec3 vObj,vWorld;out vec4 o;
uniform vec3 uCam;uniform float uTime;uniform mat3 uRot;
${GL_NOISE}
vec3 ramp(float v){v=clamp(v,0.,1.)*4.;
 vec3 c0=vec3(.45,.04,.0),c1=vec3(1.,.33,.04),c2=vec3(1.,.70,.22),c3=vec3(1.,.90,.58),c4=vec3(1.,1.,.92);
 return v<1.?mix(c0,c1,v):v<2.?mix(c1,c2,v-1.):v<3.?mix(c2,c3,v-2.):mix(c3,c4,v-3.);}
void main(){
 vec3 p=normalize(vObj);vec3 N=normalize(uRot*p);vec3 V=normalize(uCam-vWorld);
 float fw=length(fwidth(p));
 float t=uTime;
 vec3 w1=worley(p*76.+vec3(0.,t*.35,0.));vec3 w2=worley(p*31.+vec3(t*.16,0.,0.));
 float g1=sstep(0.,.20,w1.y-w1.x),g2=sstep(0.,.24,w2.y-w2.x);
 float gran=g1*.6+g2*.4;
 gran=mix(gran,.78,sstep(.004,.02,fw));
 float sg=fbm(p*6.5+vec3(t*.03),4);
 float sp=fbm(p*5.2+vec3(11.,3.,t*.006),5)-.16*sstep(.40,.70,abs(p.y))+.03;
 float pen=sstep(.69,.72,sp),umb=sstep(.735,.765,sp);
 float mu=max(dot(N,V),0.);
 float limb=.24+.76*pow(mu,.38);
 float fac=sstep(.60,.66,fbm(p*9.+vec3(4.,t*.01,2.),4))*(1.-mu)*.35;
 float v=.40+(gran-.78)*.40+(sg-.47)*.9+fac;
 v*=mix(.55,1.,limb);
 v-=pen*.18+umb*.30;
 vec3 c=ramp(v)*1.75*limb*limb*(.62+.6*v)*(1.-pen*.45)*(1.-umb*.72);
 o=vec4(c,1.);}`;

const FS_BODY=`#version 300 es
precision highp float;
in vec3 vObj,vWorld;out vec4 o;
uniform int uType;uniform vec3 uCam,uSun,uTint,uSeed;uniform vec4 uOcc;
uniform float uRadius,uLight,uTime,uBump;uniform mat3 uRot;
${GL_NOISE}
${GL_RING}
vec3 alb=vec3(.5);float hgt=0.;vec3 emi=vec3(0.);float ocean=0.;float soft=0.;
vec2 crater(vec3 p,float depth){vec3 w=worley(p);float rad=.13+.22*fract(w.z*7.31);float t=w.x/rad;
 float bowl=t<1.?-(1.-t*t):0.;float q=(t-1.)/.26;float rim=exp(-q*q);
 float ex=step(w.z,.74)*sstep(.60,.40,w.x);
 return vec2((bowl*.90+rim*.50)*depth*ex,(bowl*.55+rim*.32)*ex);}
vec2 craters(vec3 p,float k){vec2 c=crater(p*5.,1.)+crater(p*12.+vec3(3.),.52)+crater(p*28.+vec3(7.),.26)+crater(p*62.+vec3(11.),.13);return c*k;}
float rays(vec3 p){p*=2.2;vec3 i=floor(p),f=fract(p);float s=0.;
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){vec3 g=vec3(float(x),float(y),float(z));vec3 h=hash33(i+g);
  if(fract(dot(h,vec3(13.7,7.3,3.1)))>.80){vec3 r=g+h-f;float d=length(r);float st=vnoise(normalize(r)*7.+h*10.);s+=sstep(.55,.8,st)*exp(-d*d*12.)*sstep(.02,.08,d);}}
 return s;}
float lobe(vec2 u,vec2 c,vec2 d){vec2 v=u-c;float a=dot(v,d),b=dot(v,vec2(-d.y,d.x));return exp(-(a*a/.42+b*b/.08));}

void sRock(vec3 p){float n=fbm(p*3.+uSeed,5);vec2 c=craters(p+uSeed,1.);
 alb=uTint*(.72+.56*n)*(1.+clamp(c.y,-.7,.8));hgt=c.x+n*.3;}
void sMoon(vec3 p){
 float m=sstep(.50,.58,fbm(p*1.7+vec3(2.,5.,1.),5)+p.x*.06);
 vec2 c=craters(p,mix(1.,.3,m));float n=fbm(p*6.,4);
 vec3 hi=vec3(.215,.205,.19)*(.8+.4*n),ma=vec3(.07,.07,.076)*(.85+.3*n);
 alb=mix(hi,ma,m)*(1.+clamp(c.y,-.6,.8))+vec3(.10)*rays(p);
 hgt=c.x+n*.25-m*.3;}
void sEarth(vec3 p,vec3 N,vec3 L){
 float h=fbm(p*1.9+vec3(4.1,2.3,7.7),7);
 float m=fbm(p*4.3+vec3(9.,1.,3.),4);
 float land=sstep(.552,.556,h);
 float dep=sstep(.552,.42,h);
 vec3 sea=mix(vec3(.03,.15,.24),vec3(.008,.03,.10),dep)+vec3(.02,.13,.11)*sstep(.535,.552,h);
 float e=clamp((h-.552)/.16,0.,1.);
 float al=abs(p.y);
 float dry=sstep(.12,.30,al)*(1.-sstep(.42,.60,al));
 vec3 veg=mix(vec3(.04,.115,.028),vec3(.10,.15,.04),m);
 vec3 ld=mix(veg,vec3(.38,.29,.16),clamp(dry*1.1*sstep(.40,.56,m)+sstep(.55,.7,m)*.3,0.,1.));
 ld=mix(ld,vec3(.24,.22,.20),sstep(.45,.8,e));
 float ice=sstep(.80,.86,al+(m-.5)*.14+e*.10);
 ld=mix(ld,vec3(.82,.85,.9),ice);
 float sice=sstep(.90,.94,al+(m-.5)*.08);
 sea=mix(sea,vec3(.75,.80,.86),sice);
 alb=mix(sea,ld,land);ocean=(1.-land)*(1.-sice);
 hgt=land*e*(1.2+m);
 vec3 cp=rotY(p,uTime*.012*(1.-.55*p.y*p.y));
 float cn=fbm(cp*4.2+vec3(0.,uTime*.004,0.)+vec3((fbm(cp*2.1+vec3(5.),3)-.5)*1.6),6);
 float la=asin(clamp(p.y,-1.,1.));
 float thr=.50-.05*cos(la*7.2)+.04*al;
 float cloud=sstep(thr,thr+.20,cn);
 float ndl=dot(N,L);
 float pop=sstep(.45,.6,fbm(p*5.+vec3(7.),3))*(1.-ice)*(1.-dry*.7);
 float cty=pow(vnoise(p*110.)*vnoise(p*47.+vec3(3.))*1.9,3.);
 emi=vec3(1.,.62,.25)*land*pop*min(cty,2.)*.9*(1.-cloud)*sstep(.02,-.12,ndl);
 alb=mix(alb,vec3(.86),cloud*.95);ocean*=1.-cloud;hgt*=1.-cloud;}
void sVenus(vec3 p){vec3 q=rotY(p,p.y*p.y*2.2+uTime*.006);
 float w=fbm(q*2.5+vec3(3.),3);
 float n=fbm(q*vec3(2.2,6.5,2.2)+vec3(w*1.8,0.,w*1.2),5);
 alb=mix(vec3(.64,.52,.30),vec3(.80,.76,.64),sstep(.30,.68,n));soft=.5;}
void sMars(vec3 p){
 float n=fbm(p*2.3+vec3(8.,3.,1.),6),n2=fbm(p*7.+vec3(2.),4);
 float north=sstep(-.15,.30,p.y+(n-.5)*.7);
 vec2 c=craters(p+vec3(5.),.5*mix(1.,.22,north));
 vec3 a=mix(vec3(.40,.148,.064),vec3(.15,.062,.035),sstep(.50,.62,n)*.85);
 a=mix(a,vec3(.50,.24,.11),sstep(.52,.70,n2)*.35*north);
 a*=1.+clamp(c.y,-.5,.6);
 float lo=atan(p.z,p.x);
 float vm=gs(p.y,-.13+.03*sin(lo*3.+1.),.016)*sstep(-.2,.2,lo)*(1.-sstep(.9,1.3,lo));
 a*=1.-.55*vm;
 float cap=sstep(.925,.955,abs(p.y)+(n2-.5)*.07+(p.y>0.?.012:0.));
 a=mix(a,vec3(.80,.78,.76),cap);
 alb=a;hgt=c.x+n2*.35-vm*.1+cap*.1;}
void sGas(vec3 p,bool sat){
 float turb=sat?.42:1.;
 float lar=asin(clamp(p.y,-1.,1.));float la=lar*57.29578;
 vec3 q=rotY(p,uTime*.004);
 float w1=fbm(q*vec3(3.,7.,3.)+vec3(1.3),5),w2=fbm(q*vec3(9.,20.,9.)+vec3(7.1),4);
 float l=la+((w1-.5)*10.+(w2-.5)*4.5)*turb;
 float r=l*.0174533;
 float b=.42*sin(r*4.+.6)+.30*sin(r*9.+1.9)+.20*sin(r*17.+.4)+.12*sin(r*30.+2.7);
 float fade=1.-.94*sstep(46.,78.,abs(la));
 b*=fade;
