        float belt = exp(-pow(lat / 0.22, 2.0)) * (0.5 + 0.5 * sin(lon * 3.0));
        albedo *= 1.0 - 0.42 * belt;
        float heart = exp(-pow((lon - 0.45) / 0.33, 2.0) - pow((lat - 0.10) / 0.20, 2.0));
        heart += exp(-pow((lon - 0.12) / 0.25, 2.0) - pow((lat + 0.05) / 0.17, 2.0));
        albedo = mix(albedo, vec3(0.86,0.78,0.62), clamp(heart,0.0,1.0));
        bump = 0.035;
      } else if (uType == 10) {
        float ca; height = craterField(p, 0.55, ca);
        float maria = smoothstep(0.58, 0.78, fbm(p * 2.2 + 4.0)) * smoothstep(-0.30, 0.65, p.z);
        albedo = mix(vec3(0.56,0.54,0.49), vec3(0.23,0.24,0.25), maria);
        albedo += ca * vec3(0.17);
        float rays = pow(1.0 - abs(fbm(p * 24.0) - 0.5) * 2.0, 12.0) * 0.18;
        albedo += rays;
        bump = 0.085;
      } else if (uType == 11) {
        float n = fbm(p * 8.0);
        albedo = mix(vec3(0.88,0.56,0.04), vec3(1.0,0.86,0.18), n);
        float volc = smoothstep(0.82,0.95,fbm(p*22.0+3.0));
        albedo = mix(albedo, vec3(0.12,0.08,0.05), volc * 0.7);
        emission += vec3(1.0,0.18,0.02) * pow(volc, 5.0) * 0.25;
      } else if (uType == 12) {
        albedo = vec3(0.80,0.78,0.70);
        float lines = pow(1.0 - abs(fbm(p * 18.0) - 0.5) * 2.0, 10.0);
        lines += pow(1.0 - abs(fbm(p * 41.0 + 8.0) - 0.5) * 2.0, 14.0);
        albedo = mix(albedo, vec3(0.55,0.22,0.13), clamp(lines * 0.55, 0.0, 1.0));
      } else if (uType == 13) {
        float ca; height = craterField(p, 0.30, ca);
        albedo = mix(vec3(0.26,0.24,0.21), vec3(0.62,0.58,0.49), fbm(p*4.0));
        float grooves = pow(1.0 - abs(fbm(p*22.0)-0.5)*2.0, 11.0);
        albedo += grooves * vec3(0.20,0.18,0.14);
        bump = 0.045;
      } else if (uType == 14) {
        albedo = mix(vec3(0.78,0.34,0.10), vec3(1.0,0.63,0.25), fbm(p * 4.0));
      } else if (uType == 15) {
        float ca; height = craterField(p, 0.16, ca);
        float lat = asin(p.y);
        albedo = mix(vec3(0.60,0.72,0.74), vec3(0.86,0.84,0.76), fbm(p*5.0));
        albedo = mix(albedo, vec3(0.88,0.62,0.42), smoothstep(0.55,0.95,abs(lat)));
        bump = 0.03;
      } else {
        float ca; height = craterField(p, 0.48, ca);
        albedo = vec3(0.43,0.40,0.36) + ca * 0.12 + (fbm(p*7.0)-0.5)*0.12;
        bump = 0.055;
      }

      if (bump > 0.0) N = bumpNormal(N, height, bump);
      float ndlRaw = dot(N, L);
      float day = sstep(-0.08, 0.18, ndlRaw);
      float shadow = ringShadow(N, L);
      day *= shadow;
      float rim = pow(1.0 - max(dot(N, V), 0.0), 3.2);
      vec3 color = albedo * (0.018 + day * uLight);
      color += spec * vec3(1.0, 0.95, 0.82) * uLight;
      color += emission;
      color += albedo * rim * 0.035;
      outColor = vec4(color, 1.0);
    }
    `;

    const RING_VS = `#version 300 es
    precision highp float;
    layout(location=0) in vec3 aData;
    uniform mat4 uVP;
    uniform vec3 uCenter;
    uniform mat3 uBasis;
    uniform float uPlanetRadius;
    uniform vec2 uRange;
    out vec3 vWorld;
    out float vR;
    out vec3 vNormal;
    void main() {
      float thetaC = aData.x;
      float thetaS = aData.y;
      vR = mix(uRange.x, uRange.y, aData.z);
      vec3 local = vec3(thetaC * vR, 0.0, thetaS * vR) * uPlanetRadius;
      vWorld = uCenter + uBasis * local;
      vNormal = normalize(uBasis * vec3(0.0, 1.0, 0.0));
      gl_Position = uVP * vec4(vWorld, 1.0);
    }`;

    const RING_FS = `#version 300 es
    ${GLSL_NOISE}
    in vec3 vWorld;
    in float vR;
    in vec3 vNormal;
    uniform vec3 uCamera;
    uniform vec3 uCenter;
    uniform float uPlanetRadius;
    uniform int uRingType;
    uniform float uTime;
    out vec4 outColor;
    float ringDensity(float r) {
      if (uRingType == 2) {
        float d = 0.0;
        d += (sstep(1.235, 1.250, r) * (1.0 - sstep(1.515, 1.530, r))) * 0.11;
        d += (sstep(1.525, 1.545, r) * (1.0 - sstep(1.930, 1.950, r))) * 1.20;
        d *= 1.0 - 0.87 * exp(-pow((r - 1.990) / 0.040, 2.0));
        d += (sstep(2.025, 2.045, r) * (1.0 - sstep(2.250, 2.270, r))) * 0.58;
        d *= 1.0 - 0.92 * exp(-pow((r - 2.214) / 0.0045, 2.0));
        d *= 1.0 - 0.80 * exp(-pow((r - 2.265) / 0.0018, 2.0));
        d += 0.30 * exp(-pow((r - 2.324) / 0.0055, 2.0));
        d *= 0.70 + 0.60 * fbm(vec3(r * 230.0, 0.0, 1.7));
        return d;
      }
      if (uRingType == 3) {
        float d = 0.55 * exp(-pow((r - 1.951) / 0.0055, 2.0));
        d += 0.20 * exp(-pow((r - 1.909) / 0.0025, 2.0));
        d += 0.17 * exp(-pow((r - 1.863) / 0.0022, 2.0));
        d += 0.14 * exp(-pow((r - 1.823) / 0.0020, 2.0));
        d += 0.11 * exp(-pow((r - 1.786) / 0.0018, 2.0));
        d += 0.09 * exp(-pow((r - 1.751) / 0.0017, 2.0));
        d += 0.07 * exp(-pow((r - 1.690) / 0.0015, 2.0));
        return d;
      }
      return 0.016 * sstep(1.40, 1.43, r) * (1.0 - sstep(1.78, 1.81, r));
    }
    void main() {
      float d = ringDensity(vR);
      if (d < 0.002) discard;
      vec3 V = normalize(uCamera - vWorld);
      vec3 L = normalize(-vWorld);
      vec3 N = normalize(vNormal);
      float muV = max(abs(dot(N, V)), 0.10);
      float muS = max(abs(dot(N, L)), 0.10);
      float tauV = d * 1.45 / muV;
      float tauS = d * 1.45 / muS;
      float alpha = 1.0 - exp(-tauV);
      bool sameSide = dot(N, V) * dot(N, L) > 0.0;
      float lit = sameSide ? (1.0 - exp(-tauS)) * 0.85 : exp(-tauS * 0.42) * 1.15 * (1.0 - exp(-tauS * 0.75));
      vec3 oc = vWorld - uCenter;
      float tca = dot(-oc, L);
      float dmin = 99999.0;
      if (tca > 0.0) {
        vec3 closest = oc + L * tca;
        dmin = length(closest);
      }
      float shadow = sstep(uPlanetRadius * 0.97, uPlanetRadius * 1.09, dmin);
      vec3 col;
      if (uRingType == 2) col = mix(vec3(0.46,0.37,0.24), vec3(0.98,0.86,0.58), clamp(d,0.0,1.0));
      else if (uRingType == 3) col = vec3(0.035,0.038,0.042);
      else col = vec3(0.46,0.42,0.34);
      col *= lit * shadow;
      if (uRingType == 1) alpha *= 0.22;
      outColor = vec4(col, alpha * 0.86);
    }`;

    const ATMOS_VS = `#version 300 es
    precision highp float;
    layout(location=0) in vec3 aPos;
    layout(location=1) in vec3 aNormal;
    uniform mat4 uVP;
    uniform mat4 uModel;
    out vec3 vWorld;
    void main() {
      vec4 w = uModel * vec4(aPos, 1.0);
      vWorld = w.xyz;
      gl_Position = uVP * w;
    }`;

    const ATMOS_FS = `#version 300 es
    precision highp float;
    in vec3 vWorld;
    uniform vec3 uCamera;
    uniform vec3 uCenter;
    uniform vec3 uColor;
    uniform float uRadius;
    uniform float uScaleH;
    uniform float uStrength;
    out vec4 outColor;
    float sstep(float a, float b, float x) {
      float t = clamp((x - a) / (b - a), 0.0, 1.0);
      return t*t*(3.0-2.0*t);
    }
    void main() {
      vec3 rd = normalize(vWorld - uCamera);
      vec3 oc = uCenter - uCamera;
      float tca = dot(oc, rd);
      float b = sqrt(max(dot(oc, oc) - tca * tca, 0.0)) / uRadius;
      float dens = exp(-max(b - 1.0, 0.0) / uScaleH);
      dens *= 1.0 - sstep(0.960, 1.0, b) * 0.86;
      vec3 an = normalize(uCamera + rd * tca - uCenter);
      vec3 L = normalize(-uCenter);
      float day = sstep(-0.12, 0.18, dot(an, L));
      float mie = pow(clamp(dot(rd, L) * 0.5 + 0.5, 0.0, 1.0), 4.0);
      float alpha = dens * (0.18 + 0.85 * day + 0.75 * mie) * uStrength;
      outColor = vec4(uColor * alpha, alpha);
    }`;

    const ORBIT_VS = `#version 300 es
    precision highp float;
    layout(location=0) in vec3 aPos;
    layout(location=1) in vec3 aTangentPoint;
    layout(location=2) in float aSide;
    layout(location=3) in float aPhase;
    uniform mat4 uVP;
    uniform vec2 uViewport;
    uniform float uWidth;
    out float vSide;
    out float vPhase;
    void main() {
      vec4 c = uVP * vec4(aPos, 1.0);
      vec4 n = uVP * vec4(aTangentPoint, 1.0);
      vec2 p0 = c.xy / c.w;
      vec2 p1 = n.xy / n.w;
      vec2 t = normalize(p1 - p0 + vec2(1e-6, 0.0));
      vec2 normal = vec2(-t.y, t.x);
      vec2 onePixel = 2.0 / uViewport;
      c.xy += normal * aSide * uWidth * onePixel * c.w;
      gl_Position = c;
      vSide = aSide;
      vPhase = aPhase;
    }`;

    const ORBIT_FS = `#version 300 es
    precision highp float;
    in float vSide;
    in float vPhase;
    uniform vec3 uColor;
    uniform float uNow;
    uniform float uAlpha;
    out vec4 outColor;
    void main() {
      float edge = 1.0 - smoothstep(0.48, 1.0, abs(vSide));
      float lag = fract(uNow - vPhase + 1.0);
      float trail = pow(max(0.0, 1.0 - lag * 3.4), 3.2);
      float a = edge * uAlpha * (0.08 + 0.92 * trail);
      outColor = vec4(uColor * (0.40 + trail * 1.15), a);
    }`;

    const POINTS_VS = `#version 300 es
    precision highp float;
    layout(location=0) in float a;
    layout(location=1) in float e;
    layout(location=2) in float I;
    layout(location=3) in float O;
    layout(location=4) in float w;
    layout(location=5) in float M0;
    layout(location=6) in float n;
    layout(location=7) in float size;
    uniform mat4 uVP;
    uniform vec3 uCamera;
    uniform float uDays;
    uniform float uScale;
    uniform float uCompress;
    uniform float uDpr;
    uniform float uTime;
    out float vAlpha;
    out vec3 vColor;
    float solve(float M, float ecc) {
      M = mod(M + 3.14159265359, 6.28318530718) - 3.14159265359;
      float E = M + ecc * sin(M) * (1.0 + ecc * cos(M));
      for (int i = 0; i < 7; i++) E -= (E - ecc * sin(E) - M) / (1.0 - ecc * cos(E));
      return E;
    }
    void main() {
      float M = M0 + n * uDays;
      float E = solve(M, e);
      float xp = a * (cos(E) - e);
      float yp = a * sqrt(max(0.0, 1.0 - e*e)) * sin(E);
      float cw = cos(w), sw = sin(w), cO = cos(O), sO = sin(O), cI = cos(I), sI = sin(I);
      vec3 ecl;
      ecl.x = (cw*cO - sw*sO*cI) * xp + (-sw*cO - cw*sO*cI) * yp;
      ecl.y = (cw*sO + sw*cO*cI) * xp + (-sw*sO + cw*cO*cI) * yp;
      ecl.z = (sw*sI) * xp + (cw*sI) * yp;
      vec3 world = vec3(ecl.x, ecl.z, -ecl.y);
      float r = length(world);
      world *= uScale * pow(r, uCompress) / max(r, 1e-5);
      gl_Position = uVP * vec4(world, 1.0);
      float camD = length(world - uCamera);
      gl_PointSize = clamp(size * uDpr * 38.0 / max(camD, 8.0), 0.75 * uDpr, 4.5 * uDpr);
      float sun = clamp(pow(3.0 / max(r, 1.0), 0.75), 0.10, 1.25);
      vAlpha = sun * (0.22 + 0.12 * sin(uTime * 0.8 + M0 * 13.0));
      vColor = mix(vec3(0.56,0.50,0.43), vec3(0.70,0.84,1.0), smoothstep(30.0, 50.0, a));
    }`;

    const POINTS_FS = `#version 300 es
    precision highp float;
    in float vAlpha;
    in vec3 vColor;
    out vec4 outColor;
    void main() {
      vec2 p = gl_PointCoord * 2.0 - 1.0;
      float d = dot(p, p);
      if (d > 1.0) discard;
      float a = exp(-d * 2.8) * vAlpha;
      outColor = vec4(vColor * a, a);
    }`;

    const BILLBOARD_VS = `#version 300 es
    precision highp float;
    layout(location=0) in vec3 aPos;
    layout(location=1) in vec4 aColor;
    uniform mat4 uVP;
    uniform vec3 uCenter;
    uniform vec3 uCameraRight;
    uniform vec3 uCameraUp;
    uniform float uRadius;
    uniform float uMode;
    out vec2 vUv;
    out vec4 vColor;
    void main() {
      if (uMode < 0.5) {
        vec2 corner = aPos.xy;
        vec3 pos = uCenter + (uCameraRight * corner.x + uCameraUp * corner.y) * uRadius;
        gl_Position = uVP * vec4(pos, 1.0);
        vUv = corner;
        vColor = vec4(1.0);
      } else {
        gl_Position = uVP * vec4(aPos, 1.0);
        vUv = vec2(0.0);
        vColor = aColor;
      }
    }`;

    const BILLBOARD_FS = `#version 300 es
    ${GLSL_NOISE}
    in vec2 vUv;
    in vec4 vColor;
    uniform float uTime;
    uniform float uMode;
    out vec4 outColor;
    void main() {
      if (uMode > 0.5) {
        outColor = vColor;
        return;
      }
      float r = length(vUv);
      if (r > 1.0) discard;
      float ang = atan(vUv.y, vUv.x);
      float stream = 0.55 + 0.45 * fbm(vec3(cos(ang)*4.0, sin(ang)*4.0, r*3.0 + uTime*0.08));
      float core = exp(-r * 4.8);
      float outer = exp(-r * 1.25) * stream;
      vec3 col = vec3(1.0,0.60,0.18) * core * 0.55 + vec3(1.0,0.78,0.36) * outer * 0.055;
      outColor = vec4(col, max(core * 0.10, outer * 0.035));
    }`;

    const FULL_VS = `#version 300 es
    void main() {
      vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
      gl_Position = vec4(p, 0.0, 1.0);
    }`;

    const DOWN_FS = `#version 300 es
    precision highp float;
    uniform sampler2D uTex;
    uniform vec2 uTexel;
    uniform float uThreshold;
    out vec4 outColor;
    vec3 softThreshold(vec3 c) {
      float br = max(max(c.r, c.g), c.b);
      float knee = 0.6;
      float soft = clamp(br - uThreshold + knee, 0.0, 2.0 * knee);
      soft = soft * soft / (4.0 * knee + 1e-5);
      float contrib = max(soft, br - uThreshold) / max(br, 1e-5);
      return c * clamp(contrib, 0.0, 1.0);
    }
    void main() {
      vec2 uv = gl_FragCoord.xy * uTexel;
      vec3 c = texture(uTex, uv).rgb * 0.20;
      c += texture(uTex, uv + uTexel * vec2( 1, 0)).rgb * 0.10;
      c += texture(uTex, uv + uTexel * vec2(-1, 0)).rgb * 0.10;
      c += texture(uTex, uv + uTexel * vec2( 0, 1)).rgb * 0.10;
      c += texture(uTex, uv + uTexel * vec2( 0,-1)).rgb * 0.10;
      c += texture(uTex, uv + uTexel * vec2( 1, 1)).rgb * 0.075;
      c += texture(uTex, uv + uTexel * vec2(-1, 1)).rgb * 0.075;
      c += texture(uTex, uv + uTexel * vec2( 1,-1)).rgb * 0.075;
      c += texture(uTex, uv + uTexel * vec2(-1,-1)).rgb * 0.075;
      c += texture(uTex, uv + uTexel * vec2( 2, 0)).rgb * 0.035;
      c += texture(uTex, uv + uTexel * vec2(-2, 0)).rgb * 0.035;
      c += texture(uTex, uv + uTexel * vec2( 0, 2)).rgb * 0.035;
      c += texture(uTex, uv + uTexel * vec2( 0,-2)).rgb * 0.035;
      if (uThreshold > 0.0) c = softThreshold(c);
      outColor = vec4(c, 1.0);
    }`;

    const UP_FS = `#version 300 es
    precision highp float;
    uniform sampler2D uTex;
    uniform vec2 uTexel;
    out vec4 outColor;
    void main() {
      vec2 uv = gl_FragCoord.xy * uTexel;
      vec3 c = texture(uTex, uv).rgb * 0.36;
      c += texture(uTex, uv + uTexel * vec2( 1, 0)).rgb * 0.12;
      c += texture(uTex, uv + uTexel * vec2(-1, 0)).rgb * 0.12;
      c += texture(uTex, uv + uTexel * vec2( 0, 1)).rgb * 0.12;
      c += texture(uTex, uv + uTexel * vec2( 0,-1)).rgb * 0.12;
      c += texture(uTex, uv + uTexel * vec2( 1, 1)).rgb * 0.04;
      c += texture(uTex, uv + uTexel * vec2(-1, 1)).rgb * 0.04;
      c += texture(uTex, uv + uTexel * vec2( 1,-1)).rgb * 0.04;
      c += texture(uTex, uv + uTexel * vec2(-1,-1)).rgb * 0.04;
      outColor = vec4(c, 1.0);
    }`;

    const FINAL_FS = `#version 300 es
    precision highp float;
    uniform sampler2D uScene;
    uniform sampler2D uBloom;
    uniform vec2 uResolution;
    uniform vec3 uSunScreen;
    uniform float uTime;
    uniform float uGlow;
    out vec4 outColor;
    vec3 aces(vec3 x) {
      const float a = 2.51;
      const float b = 0.03;
      const float c = 2.43;
      const float d = 0.59;
      const float e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }
    float starRay(vec2 p, float a) {
      vec2 q = mat2(cos(a), -sin(a), sin(a), cos(a)) * p;
      return exp(-abs(q.y) * 520.0) * (1.0 - smoothstep(0.0, 0.95, abs(q.x)));
    }
    void main() {
      vec2 uv = gl_FragCoord.xy / uResolution;
      vec2 dir = uv - 0.5;
      vec2 off = dir * 0.0015;
      vec3 col;
      col.r = texture(uScene, uv + off).r;
      col.g = texture(uScene, uv).g;
      col.b = texture(uScene, uv - off).b;
      vec3 bloom = texture(uBloom, uv).rgb * 0.34 * uGlow;
      col += bloom;
      vec2 sp = uSunScreen.xy;
      float vis = uSunScreen.z * uGlow;
      if (vis > 0.001) {
        vec2 d = uv - sp;
        float r = length(d);
        float core = exp(-r * 58.0) * 0.20;
        float rays = 0.0;
        for (int i = 0; i < 6; i++) rays += starRay(d, float(i) * 0.5235987756);
        vec3 flare = vec3(1.0,0.72,0.32) * (core + rays * 0.010);
        vec2 axis = 0.5 - sp;
        for (int i = 1; i <= 4; i++) {
          vec2 gp = sp + axis * (float(i) * 0.34 + 0.18);
          float gr = length(uv - gp);
          flare += vec3(0.32,0.58,1.0) * exp(-gr * (28.0 + float(i)*4.0)) * 0.030 / float(i);
        }
        flare += vec3(1.0,0.58,0.20) * exp(-abs(d.y) * 420.0) * (1.0 - smoothstep(0.0, 0.62, abs(d.x))) * 0.018;
        col += flare * vis;
      }
      col *= 1.06;
      col = aces(col);
      col = pow(col, vec3(1.0 / 2.2));
      float vig = 1.0 - smoothstep(0.28, 0.94, length(uv - 0.5));
      col *= 0.72 + 0.28 * vig;
      float grain = fract(sin(dot(gl_FragCoord.xy + uTime, vec2(12.9898,78.233))) * 43758.5453);
      col += (grain - 0.5) * 0.018;
      outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }`;

    GL = initGL();
    sphere = createSphereMesh(56, 112);
    ringMesh = createRingMesh(288, 18);
    quad = createQuad();
    starField = createStarField(11000);
    smallBodies = createSmallBodies();
    orbitBuffer = gl.createBuffer();
    tailBuffer = gl.createBuffer();

    buildBodyList();
    focusBody("earth", true);
    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);

  })();
  </script>
