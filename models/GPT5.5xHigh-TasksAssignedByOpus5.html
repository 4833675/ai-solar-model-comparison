<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>太阳系实时运动模型</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(10, 17, 29, 0.58);
      --panel-strong: rgba(10, 17, 29, 0.78);
      --line: rgba(173, 208, 255, 0.18);
      --line-hot: rgba(255, 214, 133, 0.42);
      --text: rgba(238, 246, 255, 0.94);
      --muted: rgba(193, 211, 231, 0.68);
      --faint: rgba(193, 211, 231, 0.42);
      --accent: #ffc766;
      --blue: #77b7ff;
      --danger: #ff8a66;
      --ok: #8dffc0;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #01030a;
      color: var(--text);
      font-family: var(--sans);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
      background: #01030a;
      touch-action: none;
    }
    canvas:active { cursor: grabbing; }

    .ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    body.hide-ui .ui { opacity: 0; }
    body.hide-ui canvas { cursor: none; }

    .panel {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px) saturate(142%);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.30);
    }

    .left {
      position: absolute;
      left: 18px;
      top: 18px;
      bottom: 18px;
      width: min(286px, calc(100vw - 36px));
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .right {
      position: absolute;
      right: 18px;
      top: 18px;
      width: min(372px, calc(100vw - 36px));
      max-height: calc(100vh - 250px);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .bottom {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(760px, calc(100vw - 36px));
      border-radius: 8px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: auto minmax(190px, 1fr) minmax(160px, 260px) auto;
      gap: 12px;
      align-items: center;
    }

    .toggles {
      position: absolute;
      right: 18px;
      bottom: 18px;
      width: 252px;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      gap: 7px;
    }

    .title {
      padding: 14px 15px 10px;
      border-bottom: 1px solid var(--line);
    }
    .title h1, .title h2 {
      margin: 0;
      font-size: 13px;
      line-height: 1.1;
      letter-spacing: 0.18em;
      font-weight: 700;
      text-transform: uppercase;
    }
    .title p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .body-list {
      overflow: auto;
      padding: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(151, 189, 255, 0.34) transparent;
    }
    .body-button {
      width: 100%;
      min-height: 32px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      display: grid;
      grid-template-columns: 18px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      font: 500 12px/1.25 var(--sans);
      text-align: left;
      cursor: pointer;
    }
    .body-button:hover,
    .body-button:focus-visible {
      border-color: rgba(155, 199, 255, 0.26);
      background: rgba(91, 130, 190, 0.10);
      outline: none;
    }
    .body-button.active {
      border-color: rgba(255, 199, 102, 0.42);
      background: rgba(255, 199, 102, 0.12);
    }
    .body-button.moon { padding-left: 28px; color: rgba(232, 242, 255, 0.78); }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--c, #fff);
      box-shadow: 0 0 11px var(--c, #fff);
      justify-self: center;
    }
    .tag {
      font: 600 9px/1 var(--mono);
      letter-spacing: 0.12em;
      color: var(--faint);
      text-transform: uppercase;
    }

    .info {
      overflow: auto;
      padding: 12px 14px 15px;
      scrollbar-width: thin;
      scrollbar-color: rgba(151, 189, 255, 0.34) transparent;
    }
    .info h3 {
      margin: 0 0 7px;
      font-size: 25px;
      line-height: 1.05;
      font-weight: 750;
      letter-spacing: 0;
    }
    .info .sub {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .section-label {
      margin: 17px 0 8px;
      color: var(--accent);
      font: 700 10px/1 var(--mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .metric {
      border: 1px solid rgba(173, 208, 255, 0.12);
      border-radius: 6px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.035);
      min-width: 0;
    }
    .metric span {
      display: block;
      color: var(--faint);
      font-size: 10px;
      letter-spacing: 0.12em;
      margin-bottom: 5px;
    }
    .metric strong {
      display: block;
      font: 700 13px/1.2 var(--mono);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      color: rgba(235, 245, 255, 0.84);
    }
    td {
      border-bottom: 1px solid rgba(173, 208, 255, 0.10);
      padding: 7px 0;
      vertical-align: top;
    }
    td:first-child { color: var(--faint); width: 42%; }
    td:last-child {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      border: 1px solid rgba(255, 199, 102, 0.28);
      border-radius: 999px;
      padding: 0 8px;
      color: rgba(255, 222, 166, 0.94);
      background: rgba(255, 199, 102, 0.09);
      font: 700 10px/1 var(--mono);
      letter-spacing: 0.12em;
    }
    .warning {
      display: none;
      margin-top: 8px;
      border-color: rgba(255, 138, 102, 0.34);
      color: #ffb69f;
      background: rgba(255, 94, 65, 0.10);
    }
    .warning.on { display: inline-flex; }

    button, input {
      font-family: var(--sans);
    }
    .icon-button {
      width: 36px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border-radius: 6px;
      border: 1px solid rgba(173, 208, 255, 0.18);
      background: rgba(255, 255, 255, 0.055);
      color: var(--text);
      cursor: pointer;
    }
    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: rgba(255, 199, 102, 0.45);
      outline: none;
    }
    .icon {
      width: 15px;
      height: 15px;
      display: block;
    }
    .date-readout {
      font: 700 13px/1.2 var(--mono);
      font-variant-numeric: tabular-nums;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .speed-label {
      color: var(--muted);
      font: 650 11px/1.2 var(--mono);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-align: right;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .now-button {
      min-height: 34px;
      border-radius: 6px;
      border: 1px solid rgba(173, 208, 255, 0.18);
      background: rgba(255, 255, 255, 0.055);
      color: var(--text);
      padding: 0 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .now-button:hover,
    .now-button:focus-visible {
      border-color: rgba(255, 199, 102, 0.45);
      outline: none;
    }

    .switch {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      color: rgba(235, 245, 255, 0.84);
      font-size: 11px;
      line-height: 1.2;
      cursor: pointer;
      user-select: none;
    }
    .switch input {
      appearance: none;
      width: 35px;
      height: 18px;
      border-radius: 999px;
      border: 1px solid rgba(173, 208, 255, 0.24);
      background: rgba(255, 255, 255, 0.08);
      position: relative;
      margin: 0;
      cursor: pointer;
    }
    .switch input::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      top: 2px;
      left: 2px;
      border-radius: 50%;
      background: rgba(235, 245, 255, 0.78);
      transition: transform 150ms ease, background 150ms ease;
    }
    .switch input:checked {
      border-color: rgba(255, 199, 102, 0.50);
      background: rgba(255, 199, 102, 0.24);
    }
    .switch input:checked::after {
      transform: translateX(17px);
      background: var(--accent);
    }

    .labels {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .label {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid rgba(190, 218, 255, 0.19);
      background: rgba(3, 8, 17, 0.42);
      color: rgba(235, 245, 255, 0.84);
      backdrop-filter: blur(8px);
      font: 700 10px/1.25 var(--mono);
      letter-spacing: 0.10em;
      white-space: nowrap;
      text-shadow: 0 1px 7px rgba(0, 0, 0, 0.85);
      transition: opacity 100ms linear;
    }

    .error {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: #02040b;
      color: #fff;
      padding: 24px;
      text-align: center;
      font: 14px/1.6 var(--sans);
    }
    .error.show { display: grid; }

    @media (max-width: 980px) {
      .left { width: 222px; }
      .right { width: min(330px, calc(100vw - 36px)); }
      .toggles { width: 224px; }
    }
    @media (max-width: 760px) {
      .left {
        top: 12px;
        left: 12px;
        bottom: auto;
        height: 44vh;
        width: min(220px, calc(50vw - 18px));
      }
      .right {
        top: 12px;
        right: 12px;
        max-height: 44vh;
        width: min(268px, calc(50vw - 18px));
      }
      .bottom {
        bottom: 12px;
        width: calc(100vw - 24px);
        grid-template-columns: auto 1fr;
      }
      .bottom .speed-label { text-align: left; }
      .toggles {
        right: 12px;
        bottom: 90px;
        width: 214px;
      }
      .metric-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="globe" aria-label="太阳系实时运动模型"></canvas>
  <div class="labels" id="labels"></div>

  <main class="ui" id="ui">
    <section class="panel left" aria-label="天体列表">
      <div class="title">
        <h1>太阳系实时模型</h1>
        <p>轨道相位由 NASA/JPL 近似根数实时计算；距离可压缩，角位置保持真实。</p>
        <span class="pill warning" id="rangeWarning">已超出根数有效区间（外推）</span>
      </div>
      <div class="body-list" id="bodyList"></div>
    </section>

    <section class="panel right" aria-label="天体信息">
      <div class="title">
        <h2>实时数据</h2>
        <p>数字使用当前 UTC 时刻与选中天体计算。</p>
      </div>
      <div class="info" id="info"></div>
    </section>

    <section class="panel bottom" aria-label="时间控制">
      <button class="icon-button" id="playPause" title="播放/暂停（空格）" aria-label="播放或暂停">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path id="playIconA" d="M8 5v14l11-7z"/><path id="playIconB" d="" /></svg>
      </button>
      <div class="date-readout" id="dateReadout">--</div>
      <input id="speed" type="range" min="-100" max="100" value="38" step="1" aria-label="时间速度">
      <div class="speed-label" id="speedLabel">--</div>
      <button class="now-button" id="nowButton">此刻</button>
    </section>

    <section class="panel toggles" aria-label="显示开关">
      <label class="switch">轨道 <input id="toggleOrbits" type="checkbox" checked></label>
      <label class="switch">名称 <input id="toggleLabels" type="checkbox" checked></label>
      <label class="switch">卫星 <input id="toggleMoons" type="checkbox" checked></label>
      <label class="switch">小行星带 <input id="toggleAsteroids" type="checkbox" checked></label>
      <label class="switch">彗星 <input id="toggleComet" type="checkbox" checked></label>
      <label class="switch">真实距离比例 <input id="toggleTrueScale" type="checkbox"></label>
      <label class="switch">辉光 <input id="toggleGlow" type="checkbox" checked></label>
    </section>
  </main>

  <div class="error" id="error"></div>

      preserveDrawingBuffer: false,
      powerPreference: "high-performance"

    function shader(type, source) {
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        const msg = gl.getShaderInfoLog(s) || "未知着色器错误";
        throw new Error(msg);
      }
      return s;
    }

    function program(vs, fs) {
      const p = gl.createProgram();
      gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
      gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        const msg = gl.getProgramInfoLog(p) || "未知程序链接错误";
        throw new Error(msg);
      }
      return p;
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.8);
      const w = Math.max(2, Math.floor(innerWidth * dpr));
      const h = Math.max(2, Math.floor(innerHeight * dpr));
      if (canvas.width === w && canvas.height === h && GL.fbo) return;
      canvas.width = w;
      canvas.height = h;
      GL.width = w;
      GL.height = h;
      GL.dpr = dpr;
      createFramebuffers(w, h);

    function createFramebuffers(w, h) {
      const hdr = GL.hdr;
      const internal = hdr ? gl.RGBA16F : gl.RGBA8;
      const type = hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
      const filter = hdr && !GL.extLinear ? gl.NEAREST : gl.LINEAR;

      function makeTexture(width, height) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, internal, width, height, 0, gl.RGBA, type, null);
        return tex;
      }

      const sceneTex = makeTexture(w, h);
      const sceneFbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
      const depth = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
      let ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;

      let msaa = null;
      if (ok) {
        const samples = Math.min(4, gl.getParameter(gl.MAX_SAMPLES));
        if (samples > 1) {
          const mfbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, mfbo);
          const color = gl.createRenderbuffer();
          gl.bindRenderbuffer(gl.RENDERBUFFER, color);
          try {
            gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, internal, w, h);
            gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, color);
            const mdepth = gl.createRenderbuffer();
            gl.bindRenderbuffer(gl.RENDERBUFFER, mdepth);
            gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, gl.DEPTH_COMPONENT24, w, h);
            gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, mdepth);
            if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE) {
              msaa = { fbo: mfbo, color, depth: mdepth, samples };
            }
          } catch (_) {
            msaa = null;
          }
        }
      }

      if (!ok) {
        GL.hdr = false;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }

      GL.fbo = { fbo: sceneFbo, tex: sceneTex, depth, w, h };
      GL.msaa = msaa;
      GL.bloom = [];
      let bw = Math.max(2, Math.floor(w / 2));
      let bh = Math.max(2, Math.floor(h / 2));
      for (let i = 0; i < 6; i++) {
        const tex = makeTexture(bw, bh);
        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE) {
          GL.bloom.push({ tex, fbo, w: bw, h: bh });
        }
        bw = Math.max(2, Math.floor(bw / 2));
        bh = Math.max(2, Math.floor(bh / 2));
      }
      GL.canBloom = GL.bloom.length >= 3;
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }

    function createSphereMesh(lat, lon) {
      const positions = [];
      const normals = [];
      const indices = [];
      for (let y = 0; y <= lat; y++) {
        const v = y / lat;
        const theta = v * Math.PI;
        const st = Math.sin(theta);
        const ct = Math.cos(theta);
        for (let x = 0; x <= lon; x++) {
          const u = x / lon;
          const phi = u * TAU;
          const sp = Math.sin(phi);
          const cp = Math.cos(phi);
          const px = st * cp;
          const py = ct;
          const pz = st * sp;
          positions.push(px, py, pz);
          normals.push(px, py, pz);
        }
      }
      for (let y = 0; y < lat; y++) {
        for (let x = 0; x < lon; x++) {
          const a = y * (lon + 1) + x;
          const b = a + lon + 1;
          indices.push(a, b, a + 1, b, b + 1, a + 1);
        }
      }
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      const data = new Float32Array(positions.length + normals.length);
      for (let i = 0, j = 0; i < positions.length / 3; i++) {
        data[j++] = positions[i * 3];
        data[j++] = positions[i * 3 + 1];
        data[j++] = positions[i * 3 + 2];
        data[j++] = normals[i * 3];
        data[j++] = normals[i * 3 + 1];
        data[j++] = normals[i * 3 + 2];
      }
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
      const ibo = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(indices), gl.STATIC_DRAW);
      gl.bindVertexArray(null);
      return { vao, count: indices.length };
    }

    function createRingMesh(segments, radial) {
      const data = [];
      const indices = [];
      for (let r = 0; r <= radial; r++) {
        const rr = r / radial;
        for (let i = 0; i <= segments; i++) {
          const a = (i / segments) * TAU;
          data.push(Math.cos(a), Math.sin(a), rr);
        }
      }
      for (let r = 0; r < radial; r++) {
        for (let i = 0; i < segments; i++) {
          const a = r * (segments + 1) + i;
          const b = a + segments + 1;
          indices.push(a, b, a + 1, b, b + 1, a + 1);
        }
      }
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
      const ibo = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(indices), gl.STATIC_DRAW);
      gl.bindVertexArray(null);
      return { vao, count: indices.length };
    }

    function createQuad() {

    function createStarField(count) {
      const rng = mulberry32(0x5eed123);
      const basis = basisFromAxis(GAL_NORTH);
      const palette = [
        [1.00, 0.56, 0.32], [1.00, 0.72, 0.46], [1.00, 0.88, 0.66],
        [1.00, 0.96, 0.82], [0.86, 0.92, 1.00], [0.65, 0.76, 1.00], [0.48, 0.60, 1.00]
      ];
      const weights = [0.44, 0.18, 0.14, 0.12, 0.08, 0.03, 0.01];
      const data = new Float32Array(count * 8);
      for (let i = 0; i < count; i++) {
        let dir;
        if (rng() < 0.72) {
          const lon = rng() * TAU;
          const lat = clamp(gauss(rng) * 0.16, -0.55, 0.55);
          const cl = Math.cos(lat);
          dir = add(add(scale(basis.x, Math.cos(lon) * cl), scale(basis.z, Math.sin(lon) * cl)), scale(GAL_NORTH, Math.sin(lat)));
        } else {
          dir = randomUnit(rng);
        }
        const ci = weightedIndex(weights, rng());
        const b = Math.pow(rng(), 3.6);
        const size = 0.6 + Math.pow(b, 0.35) * 2.3;
        const tw = rng() * TAU;
        const k = i * 8;
        data[k] = dir[0]; data[k + 1] = dir[1]; data[k + 2] = dir[2];
        data[k + 3] = palette[ci][0]; data[k + 4] = palette[ci][1]; data[k + 5] = palette[ci][2];
        data[k + 6] = 0.12 + b * 1.8; data[k + 7] = size + tw * 0.01;
      }
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12);
      gl.enableVertexAttribArray(2);
      gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 32, 24);
      gl.bindVertexArray(null);
      return { vao, count };
    }

    function createSmallBodies() {
      const rng = mulberry32(0xA57E401D);
      const rows = [];
      function push(a, e, I, O, w, M0, n, size) {
        rows.push(a, e, I * DEG, O * DEG, w * DEG, M0 * DEG, n, size);
      }
      function meanMotion(a) { return TAU / (365.2568983 * Math.sqrt(a * a * a)); }
      function acceptMain(a) {
        const gaps = [
          [2.502, 0.022, 0.93], [2.825, 0.016, 0.85], [2.958, 0.012, 0.70],
          [3.279, 0.020, 0.90], [2.065, 0.010, 0.60]
        ];
        let p = Math.exp(-Math.pow((a - 2.72) / 0.55, 2) * 0.55);
        for (const g of gaps) p *= 1 - g[2] * Math.exp(-Math.pow((a - g[0]) / g[1], 2));
        return rng() < p;
      }
      let main = 0;
      while (main < 9000) {
        const a = lerp(2.06, 3.28, rng());
        if (!acceptMain(a)) continue;
        const e = Math.min(0.34, Math.abs(gauss(rng)) * 0.14);
        const I = Math.min(28, Math.abs(gauss(rng)) * 8);
        push(a, e, I, rng() * 360, rng() * 360, rng() * 360, meanMotion(a), 1.0 + rng() * 2.6);
        main++;
      }
      for (let i = 0; i < 900; i++) {
        const a = 3.90 + gauss(rng) * 0.09;
        const e = lerp(0.10, 0.30, rng());
        push(a, e, Math.abs(gauss(rng)) * 7, rng() * 360, rng() * 360, rng() * 360, meanMotion(a), 1.1 + rng() * 2.1);
      }
      const jN = PLANETS.find(p => p.key === "jupiter").rates[3] * DEG / 36525;
      for (let i = 0; i < 2000; i++) {
        const side = i % 2 === 0 ? 60 : -60;
        const M0 = 34.396 + side + gauss(rng) * 26;
        push(5.202 + gauss(rng) * 0.045, Math.abs(gauss(rng)) * 0.055, Math.abs(gauss(rng)) * 8, rng() * 10, rng() * 20, M0, jN, 1.2 + rng() * 2.8);
      }
      for (let i = 0; i < 6000; i++) {
        const q = rng();
        let a, e, I;
        if (q < 0.22) {
          a = 39.45 + gauss(rng) * 0.55; e = Math.min(0.28, Math.abs(gauss(rng)) * 0.08); I = Math.abs(gauss(rng)) * 10;
        } else if (q < 0.86) {
          a = lerp(42.5, 47.7, rng()); e = rng() * 0.11; I = Math.abs(gauss(rng)) * 7;
        } else {
          a = lerp(48, 80, rng()); e = lerp(0.15, 0.5, rng()); I = Math.abs(gauss(rng)) * 22;
        }
        push(a, e, Math.min(45, I), rng() * 360, rng() * 360, rng() * 360, meanMotion(a), 0.9 + rng() * 2.2);
      }
      const data = new Float32Array(rows);
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      const stride = 32;
      for (let i = 0; i < 8; i++) {
        gl.enableVertexAttribArray(i);
        gl.vertexAttribPointer(i, 1, gl.FLOAT, false, stride, i * 4);
      }
      gl.bindVertexArray(null);
      return { vao, count: data.length / 8 };
    }

    function frame(ms) {
      try {
        const t = ms * 0.001;
        const dt = state.lastT ? Math.min(0.05, t - state.lastT) : 0.016;
        state.lastT = t;
        updateTime(dt);
        updateScene(dt, t);
        render(t, dt);
        updateOverlay(t);
        const err = gl.getError();
        state.frameErr = err;
      } catch (err) {
        errorBox.textContent = "运行时错误：" + err.message;
        errorBox.classList.add("show");
        console.error(err);
        return;
      }
      requestAnimationFrame(frame);
    }

    function updateTime(dt) {
      state.speedSlider = Number(speedEl.value);
      if (state.playing) state.simJD += speedDaysPerSecond(state.speedSlider) * dt;
      state.targetCompress = controls.trueScale.checked ? TRUE_SCALE : COMPRESSED;
      const k = 1 - Math.exp(-dt / 0.16);
      state.compress = lerp(state.compress, state.targetCompress, k);
      const year = dateFromJD(state.simJD).getUTCFullYear();
      warningEl.classList.toggle("on", year < 1800 || year > 2050);
      dateReadoutEl.textContent = formatUTC(state.simJD);

    function updateScene(dt, t) {
      state.states.clear();
      const days = state.simJD - J2000;
      const sunBasis = basisFromAxis(axisWorld(SUN.tilt, SUN.poleLon));

      const T = (state.simJD - J2000) / 36525;
      for (const p of PLANETS) {
        const calc = planetPosition(p, T);
        const disp = compressPosition(eclToWorld(calc.pos), state.compress);
        const radius = displayRadius(p.radiusKm, false);
        const axis = axisWorld(p.tilt, p.poleLon);
        const basis = basisFromAxis(axis);
        const st = {
          ...p, realPos: calc.pos, displayPos: disp, radius, axis, basis,
          a: calc.a, e: calc.e, I: calc.I, M: calc.M, phase: normRad(calc.M) / TAU,
          lon: normDeg(Math.atan2(calc.pos[1], calc.pos[0]) * RAD),
          lat: Math.asin(calc.pos[2] / Math.max(1e-9, len(calc.pos))) * RAD,
          rAU: len(calc.pos),
          light: clamp(1.5 * Math.pow(1 / Math.max(0.08, len(calc.pos)), 0.40), 0.26, 2.1)
        };
        updateSpin(st, dt);
        state.states.set(p.key, st);
      }

      if (controls.moons.checked) {
        for (const m of MOONS) {
          const parent = state.states.get(m.parent);
          if (!parent) continue;
          const siblings = MOONS.filter(x => x.parent === m.parent);
          const inner = siblings.reduce((min, x) => Math.min(min, x.orbitKm), Infinity);
          const moonRadius = Math.max(0.15, displayRadius(m.radiusKm, false) * 0.72);
          const ringOuter = RINGS[m.parent]?.outer || 0;
          const base = Math.max(2.35, ringOuter + moonRadius / parent.radius + 0.55);
          const d = parent.radius * base * Math.pow(m.orbitKm / inner, 0.55);
          const phase0 = hashString(m.key) % 360;
          const theta = TAU * days / m.periodDays + phase0 * DEG;
          let local = [Math.cos(theta) * d, 0, Math.sin(theta) * d];
          local = rotX(local, m.inc * DEG);
          let offset;
          if (m.ref === "ecliptic") {
            offset = local;
          } else {
            offset = add(add(scale(parent.basis.x, local[0]), scale(parent.basis.y, local[1])), scale(parent.basis.z, local[2]));
          }
          const displayPos = add(parent.displayPos, offset);
          const realAU = m.orbitKm / AU_KM;
          const realLocal = rotX([Math.cos(theta) * realAU, 0, Math.sin(theta) * realAU], m.inc * DEG);
          const realPos = add(parent.realPos, m.ref === "ecliptic" ? worldToEcl(realLocal) : scale(normalize(parent.realPos), 0));
          const st = {
            ...m, tag: "moon", displayPos, radius: moonRadius, realPos, parentBody: parent,
            axis: parent.axis, basis: parent.basis, a: realAU, e: 0, I: m.inc,
            lon: normDeg(Math.atan2(displayPos[2], displayPos[0]) * RAD), lat: 0, rAU: parent.rAU,
            phase: normRad(theta) / TAU, light: parent.light,
            mass: "—", period: Math.abs(m.periodDays).toFixed(5) + " 天", moons: "—", temp: "—",
            atmosphere: m.type === 14 ? "浓厚 N₂、甲烷雾" : "无或极稀薄"
          };
          updateSpin(st, dt);
          state.states.set(m.key, st);
        }
      }

      if (controls.comet.checked) {
        const h = halleyPosition(state.simJD);
        const disp = compressPosition(eclToWorld(h.pos), state.compress);
        const axis = axisWorld(112.8, 137.4);
        const st = {
          ...HALLEY, tag: "comet", displayPos: disp, realPos: h.pos, radius: 0.23,
          axis, basis: basisFromAxis(axis), a: HALLEY.a, e: HALLEY.e, I: HALLEY.I,
          lon: normDeg(Math.atan2(h.pos[1], h.pos[0]) * RAD),
          lat: Math.asin(h.pos[2] / Math.max(1e-9, len(h.pos))) * RAD,
          rAU: len(h.pos), M: h.M, phase: normRad(h.M) / TAU,
          light: clamp(1.8 * Math.pow(1 / Math.max(0.08, len(h.pos)), 0.56), 0.08, 3.4),
          velocityDir: h.velocityDir, atmosphere: "彗发、离子尾、尘埃尾"
        };
        updateSpin(st, dt);
        state.states.set("halley", st);
      }

      const selected = state.states.get(state.selected) || state.states.get("earth");
      const desiredTarget = selected ? selected.displayPos : [0, 0, 0];
      state.cameraTarget = mix3(state.cameraTarget, desiredTarget, 1 - Math.exp(-dt * 4.2));
      state.distance = lerp(state.distance, state.desiredDistance, 1 - Math.exp(-dt * 3.2));
    }

    function updateSpin(st, dt) {
      const current = state.rotationPhase.get(st.key) || 0;
      const rotDays = (st.rotH || 24) / 24;
      const deltaDays = state.playing ? speedDaysPerSecond(state.speedSlider) * dt : 0;
      const raw = TAU * deltaDays / rotDays;
      const delta = clamp(raw, -0.22, 0.22);
      state.rotationPhase.set(st.key, current + delta);
      st.rotPhase = current + delta;
    }

    function render(t) {
      resize();
      const aspect = GL.width / GL.height;
      const selected = state.states.get(state.selected) || state.states.get("earth");
      const target = state.cameraTarget;
      const cp = Math.cos(state.pitch);
      const eye = [
        target[0] + Math.sin(state.yaw) * cp * state.distance,
        target[1] + Math.sin(state.pitch) * state.distance,
        target[2] + Math.cos(state.yaw) * cp * state.distance
      ];
      const near = Math.max(0.012, state.distance * 0.0035);
      const far = Math.max(state.distance * 14, controls.trueScale.checked ? 4700 : 4200);
      const proj = mat4Perspective(48 * DEG, aspect, near, far);
      const view = mat4LookAt(eye, target, [0, 1, 0]);
      const vp = mat4Mul(proj, view);
      const invVP = mat4Invert(vp);
      const cam = { eye, target, view, proj, vp, invVP, near, far };
      state.cam = cam;

      const drawFbo = GL.msaa ? GL.msaa.fbo : GL.fbo.fbo;
      gl.bindFramebuffer(gl.FRAMEBUFFER, drawFbo);
      gl.viewport(0, 0, GL.width, GL.height);
      gl.depthMask(true);
      gl.colorMask(true, true, true, true);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      drawBackground(cam, t);
      drawStars(cam, t);
      drawBodies(cam, t);
      if (controls.orbits.checked) drawOrbits(cam);
      if (controls.asteroids.checked) drawSmallBodies(cam, t);
      drawAtmospheres(cam, t);
      drawRings(cam, t);
      if (controls.comet.checked) drawCometTail(cam, t);
      drawCorona(cam, t);

      if (GL.msaa) {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, GL.msaa.fbo);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, GL.fbo.fbo);
        gl.blitFramebuffer(0, 0, GL.width, GL.height, 0, 0, GL.width, GL.height, gl.COLOR_BUFFER_BIT, gl.NEAREST);
      }
      if (controls.glow.checked && GL.canBloom) runBloom();
      drawFinal(cam, t);
    }

    function drawBackground(cam, t) {
      const p = GL.programs.background;
      gl.disable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.disable(gl.BLEND);
      gl.useProgram(p);
      uniformMat4(p, "uInvVP", cam.invVP);
      uniform3(p, "uCamera", cam.eye);
      uniform3(p, "uGalNorth", GAL_NORTH);
      gl.uniform2f(gl.getUniformLocation(p, "uResolution"), GL.width, GL.height);
      gl.uniform1f(gl.getUniformLocation(p, "uTime"), t);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    function drawStars(cam, t) {
      const p = GL.programs.stars;
      gl.disable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(p);
      uniformMat4(p, "uVP", cam.vp);
      uniform3(p, "uCamera", cam.eye);
      gl.uniform1f(gl.getUniformLocation(p, "uTime"), t);
      gl.uniform1f(gl.getUniformLocation(p, "uDpr"), GL.dpr);
      gl.bindVertexArray(starField.vao);
      gl.drawArrays(gl.POINTS, 0, starField.count);
      gl.bindVertexArray(null);
      gl.disable(gl.BLEND);
    }

    function drawBodies(cam, t) {
      const p = GL.programs.sphere;
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LEQUAL);
      gl.depthMask(true);
      gl.enable(gl.CULL_FACE);
      gl.disable(gl.BLEND);
      gl.useProgram(p);
      uniformMat4(p, "uVP", cam.vp);
      uniform3(p, "uCamera", cam.eye);
      gl.uniform1f(gl.getUniformLocation(p, "uTime"), t);
      gl.bindVertexArray(sphere.vao);
      state.renderObjects = [];
      const objects = [state.states.get("sun")];
      for (const pl of PLANETS) objects.push(state.states.get(pl.key));
      if (controls.moons.checked) for (const m of MOONS) objects.push(state.states.get(m.key));
      if (controls.comet.checked) objects.push(state.states.get("halley"));

      for (const o of objects) {
        if (!o) continue;
        const model = modelMatrix(o.displayPos, o.basis, o.rotPhase || 0, o.radius);
        uniformMat4(p, "uModel", model);
        uniformMat3(p, "uAxisBasis", basisMat3(o.basis));
        uniform3(p, "uCenter", o.displayPos);
        gl.uniform1f(gl.getUniformLocation(p, "uRadius"), o.radius);
        gl.uniform1f(gl.getUniformLocation(p, "uLight"), o.light || 1);
        gl.uniform1i(gl.getUniformLocation(p, "uType"), o.type);
        const ring = RINGS[o.key];
        gl.uniform1i(gl.getUniformLocation(p, "uRingType"), ring ? ring.type : 0);
        gl.uniform2f(gl.getUniformLocation(p, "uRingRange"), ring ? ring.inner : 0, ring ? ring.outer : 0);
        gl.drawElements(gl.TRIANGLES, sphere.count, gl.UNSIGNED_INT, 0);
        state.renderObjects.push(o);
      }
      gl.bindVertexArray(null);
    }

    function drawOrbits(cam) {
      const p = GL.programs.orbit;
      gl.enable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.disable(gl.CULL_FACE);
      gl.useProgram(p);
      uniformMat4(p, "uVP", cam.vp);
      gl.uniform2f(gl.getUniformLocation(p, "uViewport"), GL.width, GL.height);
      const T = (state.simJD - J2000) / 36525;
      for (const body of PLANETS) {
        const st = state.states.get(body.key);
        if (!st) continue;
        const data = orbitStrip(body, T, state.compress, 256);
        gl.bindBuffer(gl.ARRAY_BUFFER, orbitBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, data.vertices, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 32, 24);
        gl.enableVertexAttribArray(3);
        gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 32, 28);
        const c = hexToRgb(body.color);
        gl.uniform3f(gl.getUniformLocation(p, "uColor"), c[0], c[1], c[2]);
        gl.uniform1f(gl.getUniformLocation(p, "uNow"), st.phase);
        gl.uniform1f(gl.getUniformLocation(p, "uWidth"), body.key === state.selected ? 2.4 * GL.dpr : 1.45 * GL.dpr);
        gl.uniform1f(gl.getUniformLocation(p, "uAlpha"), body.key === state.selected ? 0.78 : 0.42);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, data.count);
      }
      if (controls.comet.checked) {
        const data = halleyOrbitStrip(state.compress, 384);
        const st = state.states.get("halley");
        gl.bindBuffer(gl.ARRAY_BUFFER, orbitBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, data.vertices, gl.DYNAMIC_DRAW);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12);
        gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 32, 24);
        gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 32, 28);
        gl.uniform3f(gl.getUniformLocation(p, "uColor"), 0.58, 0.84, 1.0);
        gl.uniform1f(gl.getUniformLocation(p, "uNow"), st ? st.phase : 0);
        gl.uniform1f(gl.getUniformLocation(p, "uWidth"), 1.3 * GL.dpr);
        gl.uniform1f(gl.getUniformLocation(p, "uAlpha"), 0.54);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, data.count);
      }
      gl.disable(gl.BLEND);
      gl.enable(gl.CULL_FACE);
      gl.depthMask(true);
    }

    function drawSmallBodies(cam, t) {
      const p = GL.programs.points;
      gl.enable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(p);
      uniformMat4(p, "uVP", cam.vp);
      uniform3(p, "uCamera", cam.eye);
      gl.uniform1f(gl.getUniformLocation(p, "uDays"), state.simJD - J2000);
      gl.uniform1f(gl.getUniformLocation(p, "uScale"), BASE_SCALE);
      gl.uniform1f(gl.getUniformLocation(p, "uCompress"), state.compress);
      gl.uniform1f(gl.getUniformLocation(p, "uDpr"), GL.dpr);
      gl.uniform1f(gl.getUniformLocation(p, "uTime"), t);
      gl.bindVertexArray(smallBodies.vao);
      gl.drawArrays(gl.POINTS, 0, smallBodies.count);
      gl.bindVertexArray(null);
      gl.disable(gl.BLEND);
      gl.depthMask(true);
    }

    function drawAtmospheres(cam, t) {
      const p = GL.programs.atmosphere;
      gl.enable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.disable(gl.CULL_FACE);
      gl.useProgram(p);
      uniformMat4(p, "uVP", cam.vp);
      uniform3(p, "uCamera", cam.eye);
      gl.uniform1f(gl.getUniformLocation(p, "uTime"), t);
      gl.bindVertexArray(sphere.vao);
      for (const key of ["earth", "mars", "venus", "titan", "uranus", "neptune"]) {
        const o = state.states.get(key);
        if (!o) continue;
        const scaleH = key === "venus" ? 0.045 : key === "titan" ? 0.055 : key === "mars" ? 0.026 : 0.035;
        const color = key === "mars" ? [0.85, 0.42, 0.22] :
          key === "venus" ? [1.0, 0.78, 0.45] :
          key === "titan" ? [1.0, 0.46, 0.16] :
          key === "uranus" ? [0.35, 0.95, 1.0] :
          key === "neptune" ? [0.30, 0.48, 1.0] : [0.28, 0.55, 1.0];
        const radius = o.radius * (1 + scaleH * 7.5);
        uniformMat4(p, "uModel", modelMatrix(o.displayPos, o.basis, o.rotPhase || 0, radius));
        uniform3(p, "uCenter", o.displayPos);
        uniform3(p, "uColor", color);
        gl.uniform1f(gl.getUniformLocation(p, "uRadius"), o.radius);
        gl.uniform1f(gl.getUniformLocation(p, "uScaleH"), scaleH);
        gl.uniform1f(gl.getUniformLocation(p, "uStrength"), key === "venus" ? 0.42 : key === "mars" ? 0.12 : 0.22);
        gl.drawElements(gl.TRIANGLES, sphere.count, gl.UNSIGNED_INT, 0);
      }
      gl.enable(gl.CULL_FACE);
      gl.disable(gl.BLEND);
      gl.depthMask(true);
    }

    function drawRings(cam, t) {
      const p = GL.programs.ring;
      gl.enable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.disable(gl.CULL_FACE);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(p);
      uniformMat4(p, "uVP", cam.vp);
      uniform3(p, "uCamera", cam.eye);
      gl.uniform1f(gl.getUniformLocation(p, "uTime"), t);
      gl.bindVertexArray(ringMesh.vao);
      for (const [key, ring] of Object.entries(RINGS)) {
        const o = state.states.get(key);
        if (!o) continue;
        uniform3(p, "uCenter", o.displayPos);
        uniformMat3(p, "uBasis", basisMat3(o.basis));
        gl.uniform1f(gl.getUniformLocation(p, "uPlanetRadius"), o.radius);
        gl.uniform2f(gl.getUniformLocation(p, "uRange"), ring.inner, ring.outer);
        gl.uniform1i(gl.getUniformLocation(p, "uRingType"), ring.type);
        gl.drawElements(gl.TRIANGLES, ringMesh.count, gl.UNSIGNED_INT, 0);
      }
      gl.bindVertexArray(null);
      gl.enable(gl.CULL_FACE);
      gl.disable(gl.BLEND);
      gl.depthMask(true);
    }

    function drawCometTail(cam, t) {
      const h = state.states.get("halley");
      if (!h || h.rAU > 6.5) return;
      const data = cometTailVertices(h, cam);
      if (!data.count) return;
      const p = GL.programs.billboard;
      gl.enable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.disable(gl.CULL_FACE);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(p);
      uniformMat4(p, "uVP", cam.vp);
      gl.uniform1f(gl.getUniformLocation(p, "uMode"), 1);
      gl.bindBuffer(gl.ARRAY_BUFFER, tailBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, data.vertices, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 28, 0);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 28, 12);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, data.count);
      gl.disable(gl.BLEND);
      gl.enable(gl.CULL_FACE);
      gl.depthMask(true);
    }

    function drawCorona(cam, t) {
      const sun = state.states.get("sun");
      const p = GL.programs.billboard;
      gl.enable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.disable(gl.CULL_FACE);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(p);
      uniformMat4(p, "uVP", cam.vp);
      uniform3(p, "uCenter", sun.displayPos);
      uniform3(p, "uCameraRight", cameraRight(cam.view));
      uniform3(p, "uCameraUp", cameraUp(cam.view));
      gl.uniform1f(gl.getUniformLocation(p, "uTime"), t);
      gl.uniform1f(gl.getUniformLocation(p, "uMode"), 0);
      gl.uniform1f(gl.getUniformLocation(p, "uRadius"), sun.radius * 9.0);
      gl.bindVertexArray(quad.vao);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.uniform1f(gl.getUniformLocation(p, "uRadius"), sun.radius * 3.1);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.bindVertexArray(null);
      gl.disable(gl.BLEND);
      gl.enable(gl.CULL_FACE);
      gl.depthMask(true);
    }

    function runBloom() {
      const pDown = GL.programs.down;
      const pUp = GL.programs.up;
      gl.disable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.disable(gl.BLEND);
      gl.useProgram(pDown);
      for (let i = 0; i < GL.bloom.length; i++) {
        const target = GL.bloom[i];
        gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
        gl.viewport(0, 0, target.w, target.h);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, i === 0 ? GL.fbo.tex : GL.bloom[i - 1].tex);
        gl.uniform1i(gl.getUniformLocation(pDown, "uTex"), 0);
        gl.uniform2f(gl.getUniformLocation(pDown, "uTexel"), 1 / (i === 0 ? GL.width : GL.bloom[i - 1].w), 1 / (i === 0 ? GL.height : GL.bloom[i - 1].h));
        gl.uniform1f(gl.getUniformLocation(pDown, "uThreshold"), i === 0 ? 1.25 : -1.0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      gl.useProgram(pUp);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      for (let i = GL.bloom.length - 1; i > 0; i--) {
        const source = GL.bloom[i];
        const target = GL.bloom[i - 1];
        gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
        gl.viewport(0, 0, target.w, target.h);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, source.tex);
        gl.uniform1i(gl.getUniformLocation(pUp, "uTex"), 0);
        gl.uniform2f(gl.getUniformLocation(pUp, "uTexel"), 1 / source.w, 1 / source.h);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      gl.disable(gl.BLEND);
    }

    function drawFinal(cam, t) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, GL.width, GL.height);
      gl.disable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.disable(gl.BLEND);
      const p = GL.programs.final;
      gl.useProgram(p);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, GL.fbo.tex);
      gl.uniform1i(gl.getUniformLocation(p, "uScene"), 0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, GL.canBloom ? GL.bloom[0].tex : GL.fbo.tex);
      gl.uniform1i(gl.getUniformLocation(p, "uBloom"), 1);
      gl.uniform2f(gl.getUniformLocation(p, "uResolution"), GL.width, GL.height);
      gl.uniform1f(gl.getUniformLocation(p, "uTime"), t);
      gl.uniform1f(gl.getUniformLocation(p, "uGlow"), controls.glow.checked && GL.canBloom ? 1 : 0);
      const sun = state.states.get("sun");
      const ss = projectPoint(sun.displayPos, cam.vp, GL.width, GL.height);
      const visible = sunVisibility(cam, ss);
      gl.uniform3f(gl.getUniformLocation(p, "uSunScreen"), ss.x / GL.width, 1 - ss.y / GL.height, visible);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    function sunVisibility(cam, ss) {
      if (!ss.visible) return 0;
      let vis = 1;
      const sx = ss.x / GL.width;
      const sy = ss.y / GL.height;
      for (const o of state.renderObjects) {
        if (!o || o.key === "sun") continue;
        const p = projectPoint(o.displayPos, cam.vp, GL.width, GL.height);
        if (!p.visible || p.ndcZ > ss.ndcZ) continue;
        const dx = p.x / GL.width - sx;
        const dy = p.y / GL.height - sy;
        const sr = screenRadius(o, cam) / Math.max(GL.width, GL.height);
        const d = Math.hypot(dx, dy);
        vis *= smoothstep(sr * 1.05, sr * 0.65, d);
      }
      return clamp(vis, 0, 1);
    }

    function updateOverlay(t) {
      for (const [key, el] of state.labels) {
        if (!state.states.has(key)) {
          el.style.opacity = "0";
        }
      }
      if (!state.cam || !controls.labels.checked || state.hiddenUI) {
        labelsEl.style.display = "none";
      } else {
        labelsEl.style.display = "block";
        for (const o of state.renderObjects) {
          if (!o || (o.tag === "moon" && !controls.moons.checked)) continue;
          const p = projectPoint(o.displayPos, state.cam.vp, GL.width, GL.height);
          let el = state.labels.get(o.key);
          if (!el) {
            el = document.createElement("div");
            el.className = "label";
            el.textContent = o.name;
            labelsEl.appendChild(el);
            state.labels.set(o.key, el);
          }
          if (!p.visible) {
            el.style.opacity = "0";
            continue;
          }
          const cssX = p.x / GL.dpr;
          const cssY = p.y / GL.dpr;
          const sr = screenRadius(o, state.cam);
          const fade = clamp((sr - 0.9) / 8, 0.18, 0.95);
          el.style.transform = `translate(${cssX}px, ${cssY - Math.max(13, sr * 0.62)}px) translate(-50%, -50%)`;
          el.style.opacity = String(fade);
        }
      }
      updateInfo();
      document.querySelectorAll(".body-button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.key === state.selected);
      });
    }

    function updateInfo() {
      const o = state.states.get(state.selected) || state.states.get("earth");
      const earth = state.states.get("earth");
      if (!o || !earth) return;
      const earthDist = o.key === "sun" ? earth.rAU : len(sub(o.realPos || [0,0,0], earth.realPos || [0,0,0]));
      const lightMin = earthDist * 8.316746;
      const speed = orbitalSpeed(o);
      const peri = o.a ? o.a * (1 - o.e) : 0;
      const apo = o.a ? o.a * (1 + o.e) : 0;
      const typeName = o.tag === "moon" ? "卫星" : o.tag === "dwarf" ? "矮行星" : o.tag === "comet" ? "彗星" : o.tag === "star" ? "恒星" : "行星";
      infoEl.innerHTML = `
        <h3>${o.name}</h3>
        <p class="sub">${typeName} · ${o.atmosphere || "—"}<br>${o.copy || ""}</p>
        <span class="pill">${state.compress > 0.95 ? "真实距离比例" : "距离幂律压缩 · 角位置精确"}</span>
        <div class="section-label">实时</div>
        <div class="metric-grid">
          ${metric("日心距离", o.key === "sun" ? "0 AU" : fmt(o.rAU, 3) + " AU")}
          ${metric("日心黄经", fmt(o.lon || 0, 2) + "°")}
          ${metric("日心黄纬", fmt(o.lat || 0, 2) + "°")}
          ${metric("与地球距离", fmt(earthDist, 3) + " AU")}
          ${metric("光行时", formatMinutes(lightMin))}
          ${metric("轨道速度", speed)}
          ${metric("近日点", o.a ? fmt(peri, 3) + " AU" : "—")}
          ${metric("远日点", o.a ? fmt(apo, 3) + " AU" : "—")}
        </div>
        <div class="section-label">静态参数</div>
        <table>
          <tr><td>半径</td><td>${Number(o.radiusKm).toLocaleString("zh-CN")} km</td></tr>
          <tr><td>质量</td><td>${o.mass || "—"} kg</td></tr>
          <tr><td>公转周期</td><td>${o.period || "—"}</td></tr>
          <tr><td>卫星数</td><td>${o.moons || "—"}</td></tr>
          <tr><td>表面/云顶温度</td><td>${o.temp || "—"}</td></tr>
          <tr><td>偏心率</td><td>${o.e ? fmt(o.e, 5) : "—"}</td></tr>
          <tr><td>轨道倾角</td><td>${o.I ? fmt(o.I, 3) + "°" : "—"}</td></tr>
          <tr><td>转轴倾角</td><td>${o.textbookTilt || (o.tilt ? fmt(o.tilt, 2) + "°" : "—")}</td></tr>
        </table>
      `;
    }

    function metric(label, value) {
      return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
    }

    function buildBodyList() {
      const entries = [SUN];
      for (const p of PLANETS) {
        entries.push(p);
        for (const m of MOONS.filter(x => x.parent === p.key)) entries.push(m);
      }
      entries.push(HALLEY);
      bodyListEl.innerHTML = "";
      for (const o of entries) {
        const b = document.createElement("button");
        b.className = "body-button" + (o.parent ? " moon" : "");
        b.dataset.key = o.key;
        b.innerHTML = `<span class="dot" style="--c:${o.color || "#fff"}"></span><span>${o.name}</span><span class="tag">${o.parent ? "moon" : o.tag}</span>`;
        b.addEventListener("click", () => focusBody(o.key));
        bodyListEl.appendChild(b);
      }
    }

    function focusBody(key, instant = false) {
      state.selected = key;
      const o = state.states.get(key);
      if (o) {
        const outer = RINGS[o.key]?.outer || 1;
        state.desiredDistance = clamp(o.radius * (key === "sun" ? 12 : 13 + outer * 3.2), 4.5, key === "sun" ? 86 : 180);
        if (key === "earth") state.desiredDistance = 15;
        if (key === "saturn") state.desiredDistance = 28;
        if (key === "jupiter") state.desiredDistance = 25;
        if (key === "halley") state.desiredDistance = 10;
        if (instant) {
          state.cameraTarget = o.displayPos.slice();
          state.distance = state.desiredDistance;
        }
      }
    }

    playPauseEl.addEventListener("click", () => { state.playing = !state.playing; });
    $("nowButton").addEventListener("click", () => { state.simJD = Date.now() / 86400000 + 2440587.5; });
    controls.trueScale.addEventListener("change", () => {
      if (controls.trueScale.checked) state.desiredDistance = Math.max(state.desiredDistance, 140);
    });
    window.addEventListener("keydown", (e) => {
      if (e.target && ["INPUT", "BUTTON"].includes(e.target.tagName)) return;
      if (e.code === "Space") { e.preventDefault(); state.playing = !state.playing; }
      if (e.code === "ArrowLeft") speedEl.value = String(Math.max(-100, Number(speedEl.value) - 5));
      if (e.code === "ArrowRight") speedEl.value = String(Math.min(100, Number(speedEl.value) + 5));
      if (e.code === "KeyH") { state.hiddenUI = !state.hiddenUI; document.body.classList.toggle("hide-ui", state.hiddenUI); }
    });

    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture(e.pointerId);
      state.pointer = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false };
    });
    canvas.addEventListener("pointermove", (e) => {
      const p = state.pointer;
      if (!p || p.id !== e.pointerId) return;
      const dx = e.clientX - p.x;
      const dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 4) p.moved = true;
      state.yaw -= dx * 0.0045;
      state.pitch = clamp(state.pitch - dy * 0.0045, -1.38, 1.38);
    });
    canvas.addEventListener("pointerup", (e) => {
      const p = state.pointer;
      if (!p || p.id !== e.pointerId) return;
      canvas.releasePointerCapture(e.pointerId);
      if (!p.moved) pickBody(e.clientX, e.clientY);
      state.pointer = null;
    });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const f = Math.exp(e.deltaY * 0.0012);
      state.desiredDistance = clamp(state.desiredDistance * f, 2.2, controls.trueScale.checked ? 2400 : 900);
    }, { passive: false });

    let lastTouchDist = 0;
    canvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const a = e.touches[0], b = e.touches[1];
        const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (lastTouchDist) state.desiredDistance = clamp(state.desiredDistance * (lastTouchDist / d), 2.2, 2400);
        lastTouchDist = d;
      }
    }, { passive: false });
    canvas.addEventListener("touchend", () => { lastTouchDist = 0; });

    function pickBody(clientX, clientY) {
      if (!state.cam) return;
      const x = clientX * GL.dpr;
      const y = clientY * GL.dpr;
      let best = null;
      let bestD = Infinity;
      for (const o of state.renderObjects) {
        if (!o) continue;
        const p = projectPoint(o.displayPos, state.cam.vp, GL.width, GL.height);
        if (!p.visible) continue;
        const r = Math.max(12 * GL.dpr, screenRadius(o, state.cam) + 8 * GL.dpr);
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < r && d < bestD) { best = o; bestD = d; }
      }
      if (best) focusBody(best.key);
    }

    function planetPosition(p, T) {
      const e0 = p.elements;
      const r = p.rates;
      const a = e0[0] + r[0] * T;
      const e = e0[1] + r[1] * T;
      const I = (e0[2] + r[2] * T) * DEG;
      const L = (e0[3] + r[3] * T) * DEG;
      const longPeri = (e0[4] + r[4] * T) * DEG;
      const O = (e0[5] + r[5] * T) * DEG;
      const w = longPeri - O;
      const M = normRad(L - longPeri);
      return elementsToPosition(a, e, I, O, w, M);
    }

    function elementsToPosition(a, e, I, O, w, M) {
      const E = solveKepler(M, e);
      const xp = a * (Math.cos(E) - e);
      const yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
      const cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(O), sO = Math.sin(O), cI = Math.cos(I), sI = Math.sin(I);
      const x = (cw * cO - sw * sO * cI) * xp + (-sw * cO - cw * sO * cI) * yp;
      const y = (cw * sO + sw * cO * cI) * xp + (-sw * sO + cw * cO * cI) * yp;
      const z = (sw * sI) * xp + (cw * sI) * yp;
      return { pos: [x, y, z], a, e, I: I * RAD, O, w, M, E };
    }

    function halleyPosition(jd) {
      const M = normRad(TAU * (jd - HALLEY.Tp) / HALLEY.P);
      const cur = elementsToPosition(HALLEY.a, HALLEY.e, HALLEY.I * DEG, HALLEY.O * DEG, HALLEY.w * DEG, M);
      const next = elementsToPosition(HALLEY.a, HALLEY.e, HALLEY.I * DEG, HALLEY.O * DEG, HALLEY.w * DEG, M + 0.002);
      cur.velocityDir = normalize(sub(eclToWorld(next.pos), eclToWorld(cur.pos)));
      return cur;
    }

    function solveKepler(M, e) {
      M = normRad(M);
      let E = M + e * Math.sin(M) * (1 + e * Math.cos(M));
      for (let i = 0; i < 10; i++) {
        const d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
        E -= d;
        if (Math.abs(d) < 1e-13) break;
      }
      return E;
    }

    function orbitStrip(body, T, compress, samples) {
      const e0 = body.elements, r = body.rates;
      const a = e0[0] + r[0] * T;
      const e = e0[1] + r[1] * T;
      const I = (e0[2] + r[2] * T) * DEG;
      const O = (e0[5] + r[5] * T) * DEG;
      const longPeri = (e0[4] + r[4] * T) * DEG;
      const w = longPeri - O;
      const pts = [];
      for (let i = 0; i < samples; i++) {
        const M = i / samples * TAU;
        pts.push(compressPosition(eclToWorld(elementsToPosition(a, e, I, O, w, M).pos), compress));
      }
      return stripFromPoints(pts, samples);
    }

    function halleyOrbitStrip(compress, samples) {
      const pts = [];
      for (let i = 0; i < samples; i++) {
        const M = i / samples * TAU;
        pts.push(compressPosition(eclToWorld(elementsToPosition(HALLEY.a, HALLEY.e, HALLEY.I * DEG, HALLEY.O * DEG, HALLEY.w * DEG, M).pos), compress));
      }
      return stripFromPoints(pts, samples);
    }

    function stripFromPoints(pts, samples) {
      const out = new Float32Array((samples + 1) * 2 * 8);
      let k = 0;
      for (let i = 0; i <= samples; i++) {
        const idx = i % samples;
        const prev = pts[(idx - 1 + samples) % samples];
        const next = pts[(idx + 1) % samples];
        const pos = pts[idx];
        const phase = idx / samples;
        for (const side of [-1, 1]) {
          out[k++] = pos[0]; out[k++] = pos[1]; out[k++] = pos[2];
          out[k++] = prev[0] + next[0] - pos[0]; out[k++] = prev[1] + next[1] - pos[1]; out[k++] = prev[2] + next[2] - pos[2];
          out[k++] = side; out[k++] = phase;
        }
      }
      return { vertices: out, count: out.length / 8 };
    }

    function cometTailVertices(h, cam) {
      const strength = Math.pow(3 / Math.max(0.4, h.rAU), 2);
      const lenIon = clamp(24 * strength, 4, 58);
      const lenDust = clamp(14 * strength, 3, 42);
      const away = normalize(h.displayPos);
      const velBack = scale(h.velocityDir || [0,0,1], -1);
      const rows = [];
      function addTail(length, width, color, curve) {
        const segs = 32;
        for (let i = 0; i <= segs; i++) {
          const q = i / segs;
          const center = add(h.displayPos, add(scale(away, length * q), scale(curve, length * q * q * 0.38)));
          const tangent = normalize(add(away, scale(curve, q * 0.76)));
          const toCam = normalize(sub(cam.eye, center));
          const side = normalize(cross(tangent, toCam));
          const w = width * (0.25 + q * 1.2);
          const a = (1 - q) * (1 - q) * color[3];
          for (const s of [-1, 1]) {
            const pos = add(center, scale(side, w * s));
            rows.push(pos[0], pos[1], pos[2], color[0], color[1], color[2], a);
          }
        }
      }
      addTail(lenIon, 0.20 + h.radius * 0.7, [0.34, 0.72, 1.0, 0.23], [0,0,0]);
      addTail(lenDust, 0.36 + h.radius * 0.9, [1.0, 0.72, 0.32, 0.16], velBack);
      return { vertices: new Float32Array(rows), count: rows.length / 7 };
    }

    function orbitalSpeed(o) {
      if (o.tag === "moon") {
        const v = TAU * o.orbitKm / (Math.abs(o.periodDays) * 86400);
        return fmt(v, 2) + " km/s";
      }
      if (!o.a || !o.rAU) return "—";
      const v = 29.7847 * Math.sqrt(Math.max(0, 2 / o.rAU - 1 / o.a));
      return fmt(v, 2) + " km/s";
    }

    function speedDaysPerSecond(v) {
      const abs = Math.abs(v);
      if (abs < 0.5) return 1 / 86400;
      return Math.sign(v) * 1.157407e-5 * Math.pow(10, abs / 100 * 8.55);
    }

    function formatSpeed(daysPerSec) {
      const sign = daysPerSec < 0 ? "-" : "";
      const sec = Math.abs(daysPerSec) * 86400;
      if (sec < 90) return `${sign}${fmt(sec, 1)} 秒/秒`;
      if (sec < 5400) return `${sign}${fmt(sec / 60, 1)} 分/秒`;
      if (sec < 172800) return `${sign}${fmt(sec / 3600, 1)} 小时/秒`;
      if (Math.abs(daysPerSec) < 730) return `${sign}${fmt(Math.abs(daysPerSec), 2)} 天/秒`;
      return `${sign}${fmt(Math.abs(daysPerSec) / 365.256, 2)} 年/秒`;
    }

    function displayRadius(km, sun) {
      if (sun) return 4.6;
      return 0.72 * Math.pow(km / 6371, 0.42);
    }

    function compressPosition(world, compress) {
      const r = len(world);
      if (r < 1e-9) return [0, 0, 0];
      return scale(world, BASE_SCALE * Math.pow(r, compress) / r);
    }

    function axisWorld(tilt, poleLon) {
      const t = tilt * DEG, p = poleLon * DEG;
      return eclToWorld([Math.sin(t) * Math.cos(p), Math.sin(t) * Math.sin(p), Math.cos(t)]);
    }

    function eclToWorld(v) { return [v[0], v[2], -v[1]]; }
    function worldToEcl(v) { return [v[0], -v[2], v[1]]; }

    function screenRadius(o, cam) {
      const right = cameraRight(cam.view);
      const p1 = projectPoint(o.displayPos, cam.vp, GL.width, GL.height);
      const p2 = projectPoint(add(o.displayPos, scale(right, o.radius)), cam.vp, GL.width, GL.height);
      return Math.hypot(p2.x - p1.x, p2.y - p1.y);
    }

    function projectPoint(v, m, width, height) {
      const x = v[0], y = v[1], z = v[2];
      const cx = m[0]*x + m[4]*y + m[8]*z + m[12];
      const cy = m[1]*x + m[5]*y + m[9]*z + m[13];
      const cz = m[2]*x + m[6]*y + m[10]*z + m[14];
      const cw = m[3]*x + m[7]*y + m[11]*z + m[15];
      if (cw <= 0) return { visible: false, x: 0, y: 0, ndcZ: 9 };
      const nx = cx / cw, ny = cy / cw, nz = cz / cw;
      return { visible: nx > -1.25 && nx < 1.25 && ny > -1.25 && ny < 1.25 && nz > -1 && nz < 1, x: (nx * 0.5 + 0.5) * width, y: (1 - (ny * 0.5 + 0.5)) * height, ndcZ: nz };
    }

    function formatUTC(jd) {
      const d = dateFromJD(jd);
      const pad = (n, w = 2) => String(n).padStart(w, "0");
      return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;
    }
    function dateFromJD(jd) { return new Date((jd - 2440587.5) * 86400000); }
    function formatMinutes(m) {
      if (!isFinite(m)) return "—";
      if (m < 90) return fmt(m, 1) + " 分";
      if (m < 60 * 36) return fmt(m / 60, 2) + " 小时";
      return fmt(m / 1440, 2) + " 天";
    }
    function fmt(n, d) { return Number(n).toLocaleString("zh-CN", { minimumFractionDigits: d, maximumFractionDigits: d }); }

    function uniformMat4(p, name, mat) { gl.uniformMatrix4fv(gl.getUniformLocation(p, name), false, mat); }
    function uniformMat3(p, name, mat) { gl.uniformMatrix3fv(gl.getUniformLocation(p, name), false, mat); }
    function uniform3(p, name, v) { gl.uniform3f(gl.getUniformLocation(p, name), v[0], v[1], v[2]); }

    function modelMatrix(center, basis, phase, radius) {
      const c = Math.cos(phase), s = Math.sin(phase);
      const bx = basis.x, by = basis.y, bz = basis.z;
      const col0 = add(scale(bx, c), scale(bz, s));
      const col1 = by;
      const col2 = add(scale(bx, -s), scale(bz, c));
      return new Float32Array([
        col0[0]*radius, col0[1]*radius, col0[2]*radius, 0,
        col1[0]*radius, col1[1]*radius, col1[2]*radius, 0,
        col2[0]*radius, col2[1]*radius, col2[2]*radius, 0,
        center[0], center[1], center[2], 1
      ]);
    }

    function basisMat3(b) {
      return new Float32Array([
        b.x[0], b.x[1], b.x[2],
        b.y[0], b.y[1], b.y[2],
        b.z[0], b.z[1], b.z[2]
      ]);
    }

    function mat4Perspective(fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2);
      const nf = 1 / (near - far);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, 2 * far * near * nf, 0
      ]);
    }

    function mat4LookAt(eye, center, up) {
      const z = normalize(sub(eye, center));
      const x = normalize(cross(up, z));
      const y = cross(z, x);
      return new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
        -dot(x, eye), -dot(y, eye), -dot(z, eye), 1
      ]);
    }

    function mat4Mul(a, b) {
      const out = new Float32Array(16);
      for (let c = 0; c < 4; c++) {
        for (let r = 0; r < 4; r++) {
          out[c*4+r] = a[0*4+r]*b[c*4+0] + a[1*4+r]*b[c*4+1] + a[2*4+r]*b[c*4+2] + a[3*4+r]*b[c*4+3];
        }
      }
      return out;
    }

    function mat4Invert(a) {
      const out = new Float32Array(16);
      const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
      const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
      const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
      const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
      const b00 = a00 * a11 - a01 * a10;
      const b01 = a00 * a12 - a02 * a10;
      const b02 = a00 * a13 - a03 * a10;
      const b03 = a01 * a12 - a02 * a11;
      const b04 = a01 * a13 - a03 * a11;
      const b05 = a02 * a13 - a03 * a12;
      const b06 = a20 * a31 - a21 * a30;
      const b07 = a20 * a32 - a22 * a30;
      const b08 = a20 * a33 - a23 * a30;
      const b09 = a21 * a32 - a22 * a31;
      const b10 = a21 * a33 - a23 * a31;
      const b11 = a22 * a33 - a23 * a32;
      let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
      if (!det) return new Float32Array(16);
      det = 1.0 / det;
      out[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det;
      out[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
      out[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det;
      out[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
      out[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det;
      out[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
      out[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det;
      out[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
      out[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det;
      out[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
      out[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
      out[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
      out[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
      out[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
      out[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
      out[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
