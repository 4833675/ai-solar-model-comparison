// INPUT
// ============================================================
let mouseDown=false,lastMX=0,lastMY=0;
let touchCount=0,touchDist0=0,touchMid=v3(0,0,0);

function onMouseDown(e){mouseDown=true;lastMX=e.clientX;lastMY=e.clientY}
function onMouseMove(e){
  if(!mouseDown)return;
  const dx=e.clientX-lastMX,dy=e.clientY-lastMY;
  lastMX=e.clientX;lastMY=e.clientY;
  camera.targetYaw-=dx*0.005;
  camera.targetPitch-=dy*0.005;
  camera.targetPitch=clamp(camera.targetPitch,-1.5,1.5);
}
function onMouseUp(e){mouseDown=false}
function onWheel(e){
  e.preventDefault();
  camera.targetDist*=1+Math.sign(e.deltaY)*0.1;
  camera.targetDist=clamp(camera.targetDist,0.5,2000);
}
function onTouchStart(e){
  e.preventDefault();
  touchCount=e.touches.length;
  if(touchCount===1){
    lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;
    mouseDown=true;
  }else if(touchCount===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    touchDist0=Math.sqrt(dx*dx+dy*dy);
    touchMid=v3((e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2,0);
  }
}
function onTouchMove(e){
  e.preventDefault();
  if(e.touches.length===1&&mouseDown){
    const dx=e.touches[0].clientX-lastMX,dy=e.touches[0].clientY-lastMY;
    lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;
    camera.targetYaw-=dx*0.005;
    camera.targetPitch-=dy*0.005;
    camera.targetPitch=clamp(camera.targetPitch,-1.5,1.5);
  }else if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(touchDist0>0){camera.targetDist*=touchDist0/dist;camera.targetDist=clamp(camera.targetDist,0.5,2000)}
    touchDist0=dist;
  }
}
function onTouchEnd(e){mouseDown=false;touchCount=e.touches.length}

function onClick(e){
  if(mouseDown)return;
  // Check if we clicked near a body label
  const rect=canvas.getBoundingClientRect();
  const cx=e.clientX-rect.left,cy=e.clientY-rect.top;
  const dpr=canvas.width/rect.width;
  const sx=cx*dpr,sy=cy*dpr;

  let closest=null,closestDist=25;
  for(const b of bodies){
    const st=bodyState[b.key];if(!st||!st.screenPos)continue;
    const dx=st.screenPos.x-sx,dy=st.screenPos.y-sy;
    const d=Math.sqrt(dx*dx+dy*dy);
    const threshold=Math.max(st.screenR,15);
    if(d<threshold&&d<closestDist){closest=b.key;closestDist=d}
  }
  // Check moons
  for(const b of bodies){
    for(const md of (b.moons||[])){
      const mst=bodyState[md.key];if(!mst||!mst.screenPos)continue;
      const dx=mst.screenPos.x-sx,dy=mst.screenPos.y-sy;
      const d=Math.sqrt(dx*dx+dy*dy);
      const threshold=Math.max(mst.screenR||10,12);
      if(d<threshold&&d<closestDist){closest=md.key;closestDist=d}
    }
  }
  if(closest){focusBody(closest);selectBody(closest)}
}

function onKeyDown(e){
  switch(e.key){
    case ' ':e.preventDefault();playing=!playing;break;
    case 'ArrowLeft':speedVal=Math.max(-100,speedVal-5);updateSpeedUI();break;
    case 'ArrowRight':speedVal=Math.min(100,speedVal+5);updateSpeedUI();break;
    case 'h':case 'H':uiHidden=!uiHidden;document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('hidden',uiHidden));break;
    case '0':focusBody('sun');selectBody('sun');break;
  }
}
function updateSpeedUI(){
  document.getElementById('speed-slider').value=speedVal;
  document.getElementById('speed-label').textContent=formatSpeed(getTimeSpeed());
}

// ============================================================
// MAIN LOOP
// ============================================================
function loop(timestamp){
  requestAnimationFrame(loop);
  const dt=Math.min((timestamp-lastFrameTime)/1000,0.1);lastFrameTime=timestamp;
  updateTime(dt);
  updateScene();
  const cam=updateCamera(dt);
  resize();

  // Date warning
  const y=simTime.getUTCFullYear();
  const warnEl=document.getElementById('info-warning');
  if(y<1800||y>2050){warnEl.style.display='block';warnEl.textContent='⚠ 已超出轨道根数有效区间（1800–2050，外推）'}
  else warnEl.style.display='none';

  // Update time display
  document.getElementById('time-display').textContent=formatTime(simTime);

  // Update play button
  document.getElementById('btn-play').textContent=playing?'⏸':'▶';

  render(cam.view,cam.proj,cam.eye);
}

// ============================================================
// START
// ============================================================
init();
</script>
</body>
