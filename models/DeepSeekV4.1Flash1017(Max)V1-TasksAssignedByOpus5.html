<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>太阳系 · 实时轨道模型</title>
<style>
:root{
  --bg:#04060a;
  --ink:#e8edf5;
  --muted:#8b95a7;
  --dim:#5f6979;
  --hair:rgba(255,255,255,.085);
  --hair2:rgba(255,255,255,.045);
  --glass:rgba(9,13,21,.58);
  --glass2:rgba(9,13,21,.78);
  --accent:#ffcf94;
  --accent-soft:rgba(255,207,148,.16);
  --cool:#9cc8ff;
  --warn:#ffb16d;
  --shadow:0 24px 70px rgba(0,0,0,.55);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab;touch-action:none}
#gl.dragging{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.lbl{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:7px;white-space:nowrap;
  font-size:10.5px;letter-spacing:.12em;color:rgba(235,242,252,.92);
  text-shadow:0 1px 8px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.6);
  will-change:transform,opacity;pointer-events:auto;cursor:pointer;
  padding:5px 7px;border-radius:20px;transition:background .2s;
}
.lbl:hover{background:rgba(255,255,255,.07)}
.lbl .ld{width:4px;height:4px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;flex:none}
.lbl small{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:rgba(160,175,195,.7);margin-left:-2px}
.lbl.moon{font-size:9px;letter-spacing:.08em;opacity:.8}
.lbl.sel{background:rgba(255,255,255,.08);border:1px solid rgba(255,207,148,.28)}

.panel{
  background:linear-gradient(155deg,rgba(17,23,34,.72),rgba(6,9,14,.62));
  border:1px solid var(--hair);
  border-radius:16px;
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);
  position:relative;
}
.panel::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.045),transparent 55%);
}

/* ---------------- left ---------------- */
.left{
  position:fixed;left:20px;top:20px;bottom:20px;width:252px;z-index:5;
  display:flex;flex-direction:column;overflow:hidden;
}
.brand{display:flex;gap:12px;align-items:center;padding:20px 20px 16px}
.brand .mark{
  width:34px;height:34px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 36% 32%,#fff6df,#ffc978 38%,#c8672c 68%,#3a1408 100%);
  box-shadow:0 0 22px rgba(255,170,80,.35),inset -6px -6px 12px rgba(0,0,0,.5);
}
.brand .mark::after{
  content:"";position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(255,207,148,.20);
  border-left-color:rgba(255,207,148,.62);transform:rotate(-28deg) scaleY(.34);
}
.brand h1{font-size:17px;font-weight:600;letter-spacing:.30em;line-height:1.15}
.brand p{font-family:var(--mono);font-size:7.5px;letter-spacing:.26em;color:var(--dim);margin-top:5px;white-space:nowrap}
.panel-rule{height:1px;background:linear-gradient(90deg,transparent,var(--hair) 16%,var(--hair) 84%,transparent);margin:0 0 14px}
.list-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 20px 10px}
.list-head span:first-child{font-size:10px;letter-spacing:.24em;color:var(--muted)}
.list-head span:last-child{font-family:var(--mono);font-size:6.5px;letter-spacing:.18em;color:var(--dim)}
.obj-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 10px 12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
.obj-list::-webkit-scrollbar{width:5px}
.obj-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:3px}
.grp{font-family:var(--mono);font-size:7.5px;letter-spacing:.22em;color:var(--dim);padding:13px 10px 6px;text-transform:uppercase}
.obj{
  width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;
  border:1px solid transparent;background:transparent;color:var(--ink);font-family:var(--font);
  cursor:pointer;text-align:left;position:relative;transition:background .18s,border-color .18s;
}
.obj:hover{background:rgba(255,255,255,.045)}
.obj.active{background:linear-gradient(90deg,rgba(255,207,148,.13),rgba(255,207,148,.025));border-color:rgba(255,207,148,.18)}
.obj.active::before{content:"";position:absolute;left:-10px;top:50%;width:2px;height:16px;transform:translateY(-50%);background:var(--accent);border-radius:2px;box-shadow:0 0 12px var(--accent)}
.obj .dot{width:5px;height:5px;border-radius:50%;flex:none;background:var(--c,#ccc);box-shadow:0 0 9px var(--c,#ccc)}
.obj .nm{flex:1;min-width:0;font-size:12px;letter-spacing:.08em;display:flex;flex-direction:column;line-height:1.25}
.obj .nm em{font-style:normal;font-family:var(--mono);font-size:7px;letter-spacing:.12em;color:var(--dim);margin-top:1px}
.obj .tag{font-family:var(--mono);font-size:7.5px;color:var(--dim);letter-spacing:.06em;white-space:nowrap}
.obj.moon{padding-left:28px}
.obj.moon .nm{font-size:11px;color:rgba(228,236,246,.86)}
.obj.moon::after{content:"";position:absolute;left:17px;top:0;bottom:0;width:1px;background:var(--hair2)}
.obj.moon .dot{width:3px;height:3px}
.left-foot{padding:12px 20px 16px;border-top:1px solid var(--hair2);display:flex;justify-content:space-between;align-items:center}
.left-foot div{font-family:var(--mono);font-size:7px;letter-spacing:.12em;color:var(--dim);line-height:1.5}
#fps{color:rgba(255,207,148,.65)}

/* ---------------- right ---------------- */
.rightcol{position:fixed;right:20px;top:20px;bottom:20px;width:348px;z-index:5;display:flex;flex-direction:column;gap:14px;pointer-events:none}
.rightcol>*{pointer-events:auto}
.info{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.info-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 22px 24px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
.info-scroll::-webkit-scrollbar{width:5px}
.info-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:3px}
.hero{display:flex;gap:15px;align-items:center;margin-bottom:19px}
.orb{
  width:62px;height:62px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 34% 30%,var(--oa,#fff),var(--ob,#888) 46%,var(--oc,#222) 100%);
  box-shadow:inset -12px -12px 24px rgba(0,0,0,.62),0 0 30px -4px var(--ob,#888);
  transform:rotate(-14deg);
}
.orb::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,255,255,.10);transform:scaleY(.26) rotate(-18deg)}
.orb.ringed::before{content:"";position:absolute;left:-17px;right:-17px;top:47%;height:13px;border-radius:50%;transform:rotate(-16deg) scaleY(.55);border-top:2px solid rgba(255,224,180,.55);border-bottom:2px solid rgba(255,224,180,.32);box-shadow:0 0 14px rgba(255,210,150,.25)}
.chip{display:inline-block;font-family:var(--mono);font-size:7px;letter-spacing:.20em;color:var(--accent);border:1px solid rgba(255,207,148,.25);background:rgba(255,207,148,.06);padding:3px 7px;border-radius:4px;margin-bottom:7px}
.hero h2{font-size:24px;font-weight:500;letter-spacing:.13em;line-height:1.1}
.hero h2 span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;color:var(--dim);font-weight:400;margin-top:6px;text-transform:uppercase}
.sec{margin-top:20px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--hair2);margin-bottom:11px}
.sec-h h3{font-size:9.5px;font-weight:500;letter-spacing:.24em;color:var(--muted)}
.sec-h span{font-family:var(--mono);font-size:6.5px;letter-spacing:.18em;color:var(--dim)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(255,255,255,.028);border:1px solid var(--hair2);border-radius:8px;padding:9px 10px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:12.5px;font-weight:400;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f0f4fb}
.stat b i{font-style:normal;font-size:8px;color:var(--dim);letter-spacing:.05em;margin-left:2px}
.stat span{display:block;font-size:8px;letter-spacing:.13em;color:var(--dim);margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6.5px 0;border-bottom:1px solid rgba(255,255,255,.032);font-size:10px;letter-spacing:.06em}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);white-space:nowrap}
.kv b{font-weight:400;text-align:right;font-family:var(--mono);font-size:9.5px;font-variant-numeric:tabular-nums;color:#dde6f2}
.desc{font-size:10.5px;line-height:1.85;color:rgba(196,207,222,.82);letter-spacing:.04em;text-align:justify}
.desc em{color:var(--accent);font-style:normal}
.footnote{margin-top:20px;padding-top:12px;border-top:1px solid var(--hair2);font-family:var(--mono);font-size:7px;letter-spacing:.09em;line-height:1.8;color:var(--dim)}
.footnote a{color:rgba(156,200,255,.7);text-decoration:none}
.info-empty{display:flex;height:100%;align-items:center;justify-content:center;color:var(--dim);font-size:10px;letter-spacing:.2em}
.info-empty .orb{width:36px;height:36px;opacity:.4;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(120,160,255,.05)}50%{box-shadow:0 0 34px rgba(120,160,255,.22)}}

/* ---------------- toggles ---------------- */
.toggles{flex:none;padding:15px 18px 16px}
.tg-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;margin-bottom:11px;border-bottom:1px solid var(--hair2)}
.tg-head span:first-child{font-size:9.5px;letter-spacing:.24em;color:var(--muted)}
.tg-head span:last-child{font-family:var(--mono);font-size:6.5px;letter-spacing:.18em;color:var(--dim)}
.tg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:9.5px;letter-spacing:.09em;color:rgba(210,221,235,.8);position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:24px;height:13px;border-radius:8px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.10);position:relative;flex:none;transition:background .22s,border-color .22s}
.sw i::after{content:"";position:absolute;left:2px;top:1.5px;width:8px;height:8px;border-radius:50%;background:#7c8798;transition:transform .22s,background .22s;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.sw input:checked+i{background:rgba(255,207,148,.24);border-color:rgba(255,207,148,.4)}
.sw input:checked+i::after{transform:translateX(10px);background:var(--accent);box-shadow:0 0 8px rgba(255,207,148,.7)}
.sw:hover{color:#fff}

/* ---------------- bottom ---------------- */
.bottombar{
  position:fixed;left:288px;right:384px;bottom:20px;margin:0 auto;transform:none;z-index:6;
  width:auto;max-width:700px;min-width:500px;
  display:flex;align-items:center;gap:16px;padding:14px 18px;
}
.play{
  width:44px;height:44px;border-radius:50%;flex:none;border:1px solid rgba(255,207,148,.32);
  background:radial-gradient(circle at 34% 28%,rgba(255,220,170,.2),rgba(255,207,148,.06));
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;position:relative;
}
.play:hover{background:rgba(255,207,148,.2);box-shadow:0 0 22px rgba(255,190,120,.25)}
.play svg{width:14px;height:14px;fill:var(--accent);filter:drop-shadow(0 0 4px rgba(255,190,120,.5))}
.play .i-pause{display:none}
.play.playing .i-pause{display:block}
.play.playing .i-play{display:none}
.time-readout{min-width:176px;padding-right:14px;border-right:1px solid var(--hair)}
.lbl{font-family:var(--mono);font-size:6.5px;letter-spacing:.19em;color:var(--dim)}
.date{font-family:var(--mono);font-size:14px;letter-spacing:.035em;color:#f1f5fb;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.jd{font-family:var(--mono);font-size:7px;letter-spacing:.11em;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.speed{flex:1;min-width:0}
.speed-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
#speedText{font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;display:block;
}
input[type=range]::-webkit-slider-runnable-track{
  height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,.15),rgba(255,207,148,.55) 50%,rgba(255,255,255,.15));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff3df;
  border:1px solid rgba(255,190,120,.9);margin-top:-4px;
  box-shadow:0 0 10px rgba(255,190,120,.75),0 1px 3px rgba(0,0,0,.6);
}
input[type=range]::-moz-range-track{height:2px;background:rgba(255,255,255,.18);border-radius:2px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border:none;border-radius:50%;background:#fff3df;box-shadow:0 0 10px rgba(255,190,120,.7)}
.speed-scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:6px;letter-spacing:.08em;color:var(--dim);margin-top:-1px}
.now{
  flex:none;font-family:var(--font);font-size:9.5px;letter-spacing:.16em;color:var(--ink);
  background:rgba(255,255,255,.055);border:1px solid var(--hair);border-radius:7px;padding:9px 12px;cursor:pointer;transition:all .2s;
}
.now:hover{background:rgba(255,207,148,.14);border-color:rgba(255,207,148,.3);color:#fff5e6}

/* ---------------- overlays ---------------- */
.warn-badge{
  position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:7;
  font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:#ffd0a0;
  border:1px solid rgba(255,160,90,.3);background:rgba(60,28,10,.55);
  backdrop-filter:blur(12px);padding:7px 12px;border-radius:20px;
  box-shadow:0 6px 30px rgba(0,0,0,.4);transition:opacity .4s,transform .4s;white-space:nowrap;
}
.warn-badge.hidden{opacity:0;transform:translate(-50%,-8px);pointer-events:none}
.hint{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:4;
  font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:rgba(180,193,210,.55);
  background:rgba(5,8,13,.42);border:1px solid rgba(255,255,255,.055);border-radius:20px;padding:7px 14px;
  backdrop-filter:blur(10px);transition:opacity 1.2s;pointer-events:none;white-space:nowrap;
}
.hint.out{opacity:0}
#loading{
  position:fixed;inset:0;z-index:50;background:#04060a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  transition:opacity 1s ease,visibility 1s;
}
#loading.done{opacity:0;visibility:hidden}
.load-orb{width:62px;height:62px;border-radius:50%;position:relative;margin-bottom:26px;
  background:radial-gradient(circle at 36% 32%,#fff8e8,#ffca82 34%,#bf5e24 66%,#2c0e05 100%);
  box-shadow:0 0 70px rgba(255,160,70,.3);animation:breathe 3s ease-in-out infinite;
}
.load-orb::after{content:"";position:absolute;inset:-17px;border-radius:50%;border:1px solid rgba(255,207,148,.15);border-top-color:rgba(255,207,148,.65);animation:spin 2.4s linear infinite}
@keyframes breathe{0%,100%{transform:scale(.97)}50%{transform:scale(1.03)}}
@keyframes spin{to{transform:rotate(360deg)}}
.load-title{font-size:15px;letter-spacing:.42em;font-weight:500;margin-left:.42em}
.load-sub{font-family:var(--mono);font-size:7px;letter-spacing:.3em;color:var(--dim);margin-top:10px;margin-left:.3em}
.load-track{width:190px;height:1px;background:rgba(255,255,255,.08);margin-top:32px;position:relative;overflow:hidden}
.load-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(255,207,148,0),var(--accent));transition:width .4s}
.load-status{font-family:var(--mono);font-size:7px;letter-spacing:.13em;color:var(--dim);margin-top:12px;height:12px}
.load-error{max-width:640px;margin-top:20px;font-family:var(--mono);font-size:9px;line-height:1.6;color:#ff9b7a;white-space:pre-wrap;text-align:left;max-height:180px;overflow:auto;display:none;border:1px solid rgba(255,100,70,.2);padding:12px;border-radius:6px;background:rgba(40,10,6,.4)}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,10px);z-index:20;font-size:10px;letter-spacing:.1em;color:#fff3df;background:rgba(20,26,36,.85);border:1px solid rgba(255,207,148,.25);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:all .3s;backdrop-filter:blur(12px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

.hide-ui .panel,.hide-ui .bottombar,.hide-ui #labels,.hide-ui .warn-badge,.hide-ui .hint{opacity:0!important;pointer-events:none!important;transition:opacity .35s}

@media (max-height:820px){
  .left{top:14px;bottom:14px;left:14px}
  .rightcol{top:14px;bottom:14px;right:14px}
  .bottombar{bottom:14px;padding:11px 15px;gap:13px}
  .brand{padding:16px 18px 13px}
  .hero{margin-bottom:15px}
  .info-scroll{padding:18px}
  .toggles{padding:12px 16px 13px}
  .hint{bottom:88px}
}
@media (max-width:1280px){
  .left{width:232px}
  .rightcol{width:316px}
  .bottombar{left:268px;right:352px;width:auto;max-width:620px;min-width:470px;gap:12px}
  .time-readout{min-width:158px}
  .date{font-size:12.5px}
}
@media (max-width:1120px){
  .left{width:214px}
  .rightcol{width:296px}
  .bottombar{left:250px;right:332px;width:auto;max-width:540px;min-width:440px}
  .brand h1{font-size:15px}
  .obj .tag{display:none}
  .tg-grid{grid-template-columns:1fr}
}
@media (max-width:980px){
  .left{display:none}
  .bottombar{left:20px;right:332px;width:auto;max-width:600px;min-width:420px}
}
@media (max-width:780px){
  .rightcol{display:none}
  .bottombar{width:auto;max-width:none;min-width:0;left:14px;right:14px;margin:0;transform:none}
  .time-readout{min-width:0;flex:1}
  .speed{display:none}
  .hint{bottom:92px;font-size:7px}
}
@media (max-width:520px){
  .bottombar{flex-wrap:wrap}
  .date{font-size:11px}
  .now{padding:7px 9px;font-size:8px}
}
</style>
</head>
<body>
<canvas id="gl" aria-label="太阳系三维实时模型"></canvas>
<div id="labels"></div>

<aside class="panel left" id="leftPanel">
  <div class="brand">
    <div class="mark"></div>
    <div><h1>太阳系</h1><p>SOLAR SYSTEM · REAL TIME</p></div>
  </div>
  <div class="panel-rule"></div>
  <div class="list-head"><span>天体目录</span><span>ORBITAL BODIES</span></div>
  <div class="obj-list" id="objectList"></div>
  <div class="left-foot">
    <div id="fps">— FPS</div>
    <div>WEBGL2 · KEPLER</div>
  </div>
</aside>

<div class="rightcol">
  <section class="panel info" id="infoPanel">
    <div class="info-scroll" id="infoScroll">
      <div class="info-empty"><div class="orb" style="--oa:#dbe7ff;--ob:#5e7ea8;--oc:#0a1018"></div></div>
    </div>
  </section>
  <section class="panel toggles">
    <div class="tg-head"><span>显示</span><span>DISPLAY</span></div>
    <div class="tg-grid">
      <label class="sw"><input type="checkbox" id="tgOrbit" checked><i></i><span>轨道</span></label>
      <label class="sw"><input type="checkbox" id="tgNames" checked><i></i><span>名称</span></label>
      <label class="sw"><input type="checkbox" id="tgMoons" checked><i></i><span>卫星</span></label>
      <label class="sw"><input type="checkbox" id="tgBelt" checked><i></i><span>小行星带</span></label>

/* =========================================================================
   2. 轨道力学
   ========================================================================= */
function solveKepler(M, e) {
  M = ((M + PI) % TAU + TAU) % TAU - PI;
  let E = M + e * Math.sin(M) * (1 + e * Math.cos(M));
  for (let i = 0; i < 14; i++) {
    const d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= d;
    if (Math.abs(d) < 1e-13) break;
  }
  return E;
}

function elementsAt(def, T, out) {
  const o = out || {};
  const el = def.el, rt = def.rate;
  o.a = el[0] + rt[0] * T;
  o.e = el[1] + rt[1] * T;
  o.I = (el[2] + rt[2] * T) * D2R;
  o.L = (el[3] + rt[3] * T) * D2R;
  o.pi = (el[4] + rt[4] * T) * D2R;
  o.O = (el[5] + rt[5] * T) * D2R;
  o.w = o.pi - o.O;
  o.M = ((o.L - o.pi + PI) % TAU + TAU) % TAU - PI;
  o.T = T;
  return o;
}

function orbitPoint(a, e, I, w, O, E, out) {
  const cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(O), sO = Math.sin(O), cI = Math.cos(I), sI = Math.sin(I);
  const xp = a * (Math.cos(E) - e);
  const yp = a * Math.sqrt(Math.max(0, 1 - e * e)) * Math.sin(E);
  out = out || {};
  out.x = (cw * cO - sw * sO * cI) * xp + (-sw * cO - cw * sO * cI) * yp;
  out.y = (cw * sO + sw * cO * cI) * xp + (-sw * sO + cw * cO * cI) * yp;
  out.z = (sw * sI) * xp + (cw * sI) * yp;
  return out;
}

function planetState(def, jd, out) {
  const T = (jd - J2000) / 36525;
  const o = elementsAt(def, T);
  const E = solveKepler(o.M, o.e);
  orbitPoint(o.a, o.e, o.I, o.w, o.O, E, o);
  o.r = Math.hypot(o.x, o.y, o.z);
  o.lon = (Math.atan2(o.y, o.x) * R2D + 360) % 360;
  o.lat = Math.asin(o.z / (o.r || 1)) * R2D;
  o.E = E;
  o.vel = 29.7847 * Math.sqrt(Math.max(0, 2 / o.r - 1 / o.a));
  o.jd = jd;
  return Object.assign(out || {}, o);
}

function halleyState(jd, out) {
  const H = HALLEY;
  const M = ((2 * PI * (jd - H.Tp) / H.P + PI) % TAU + TAU) % TAU - PI;
  const e = H.e, a = H.a;
  const E = solveKepler(M, e);
  const o = orbitPoint(a, e, H.I * D2R, H.w * D2R, H.O * D2R, E);
  o.E = E; o.M = M; o.e = e; o.a = a; o.I = H.I * D2R; o.w = H.w * D2R; o.O = H.O * D2R;
  o.r = Math.hypot(o.x, o.y, o.z);
  o.lon = (Math.atan2(o.y, o.x) * R2D + 360) % 360;
  o.lat = Math.asin(o.z / (o.r || 1)) * R2D;
  o.vel = 29.7847 * Math.sqrt(Math.max(0, 2 / o.r - 1 / a));
  o.jd = jd;
  return Object.assign(out || {}, o);
}

function eclToWorld(x, y, z) { return [x, z, -y]; }
function worldDirFromEcl(x, y, z) { return vnorm([x, z, -y]); }

function compressWorld(x, y, z, comp) {
  // 输入为黄道 AU 坐标，输出 world 显示坐标（径向幂律压缩）
  const r = Math.hypot(x, y, z);
  if (r < 1e-9) return [0, 0, 0];
  const rd = SCALE * Math.pow(r, comp);
  const k = rd / r;
  return [x * k, z * k, -y * k];
}
function worldLenFromAU(rAU, comp) { return SCALE * Math.pow(rAU, comp); }

function displayRadius(radiusKm) {
  return 0.72 * Math.pow(radiusKm / 6371, 0.42);
}
const SUN_RADIUS = 4.6;

function spinAxisWorld(id) {
  const r = ROT[id];
  const t = (r ? r.tilt : 0) * D2R, l = (r ? r.poleLon : 0) * D2R;
  const ax = [Math.sin(t) * Math.cos(l), Math.sin(t) * Math.sin(l), Math.cos(t)];
  return vnorm(eclToWorld(ax[0], ax[1], ax[2]));
}
function axisBasis(axis) {
  axis = vnorm(axis);
  const ref = Math.abs(axis[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
  const x = vnorm(vcross(ref, axis));
  const z = vcross(x, axis);
  return { x, y: axis, z };
}

/* 轨道显示半径相关 ------------------------------------------------------- */
function ringOuterRadii(id) {
  return id === 'saturn' ? 2.34 : id === 'uranus' ? 2.00 : id === 'jupiter' ? 1.81 : 0;
}
function moonDisplayDistance(moon) {
  const pd = moon.parentDef;
  const parentR = displayRadius(pd.radiusKm);
  const siblings = MOONS.filter(m => m.parent === pd.id).sort((a, b) => a.aKm - b.aKm);
  const a0 = siblings[0].aKm;
  const innerDispR = displayRadius(siblings[0].radiusKm) / parentR;
  const base = Math.max(2.35, ringOuterRadii(pd.id) + innerDispR + 0.55);
  return parentR * base * Math.pow(Math.abs(moon.aKm) / a0, 0.55);
}

/* =========================================================================
   3. 时间
   ========================================================================= */
function jdFromUnix(ms) { return ms / 86400000 + 2440587.5; }
function unixFromJD(jd) { return (jd - 2440587.5) * 86400000; }
function nowJD() { return jdFromUnix(Date.now()); }
function pad2(n, w) { n = Math.floor(Math.abs(n)); return String(n).padStart(w || 2, '0'); }
function formatDateUTC(jd) {
  const d = new Date(unixFromJD(jd));
  if (!isFinite(d.getTime())) return '——';
  const y = d.getUTCFullYear();
  const ys = y < 0 ? '−' + pad2(y, 4) : pad2(y, 4);
  return `${ys}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}  ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`;
}
function formatJD(jd) { return jd.toFixed(5); }
function daysPerSecond(slider) {
  const s = Math.abs(slider) / 100;
  return Math.sign(slider || 1) * 1.157407e-5 * Math.pow(10, s * 8.55);
}
function formatRate(dps) {
  const a = Math.abs(dps) * 86400; // seconds per second
  const dir = dps < 0 ? '倒放 · ' : '';
  if (a < 1.2) return dir + '实时 ×' + a.toFixed(2);
  const yr = 31557600;
  if (a >= yr * 0.6) return dir + (a / yr).toFixed(a / yr < 10 ? 1 : 0) + ' 年/秒';
  if (a >= 86400 * 0.6) return dir + (a / 86400).toFixed(a / 86400 < 10 ? 1 : 0) + ' 天/秒';
  if (a >= 3600 * 0.6) return dir + (a / 3600).toFixed(a / 3600 < 10 ? 1 : 0) + ' 小时/秒';
  if (a >= 60 * 0.6) return dir + (a / 60).toFixed(a / 60 < 10 ? 1 : 0) + ' 分/秒';
  return dir + a.toFixed(1) + ' 秒/秒';
}

/* =========================================================================
   4. 程序化小天体生成
   ========================================================================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeGauss(rng) {
  let spare = null;
  return function () {
    if (spare !== null) { const v = spare; spare = null; return v; }
    let u, v, s;
    do { u = rng() * 2 - 1; v = rng() * 2 - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
    const m = Math.sqrt(-2 * Math.log(s) / s);
    spare = v * m; return u * m;
  };
}
function halfNormal(rng, sigma, cap) {
  return Math.min(cap, Math.abs(rng()) * sigma);
}

const JUP_N = (3034.74612775 / 36525) * D2R; // 木星平均运动 rad/day
const JUP_L0 = 34.39644051 * D2R;

function generateAsteroids() {
  const rng = mulberry32(0x5EED51A7);
  const gauss = makeGauss(rng);
  const groups = [
    { n: 9000, kind: 0 }, { n: 900, kind: 1 }, { n: 2000, kind: 2 }, { n: 6000, kind: 3 }
  ];
  const total = groups.reduce((s, g) => s + g.n, 0);
  const data = new Float32Array(total * 8);
  const gaps = [
    [2.502, 0.022, 0.93], [2.825, 0.016, 0.85], [2.958, 0.012, 0.70],
    [3.279, 0.020, 0.90], [2.065, 0.010, 0.60]
  ];
  let p = 0;
  const push = (a, e, I, O, w, M0, n, size) => {
    const o = p * 8;
    data[o] = a; data[o + 1] = e; data[o + 2] = I; data[o + 3] = O;
    data[o + 4] = w; data[o + 5] = M0; data[o + 6] = n; data[o + 7] = size;
    p++;
  };
  // 主带
  for (let i = 0; i < 9000; i++) {
    let a = 0, tries = 0;
    while (tries++ < 64) {
      a = 2.06 + rng() * (3.28 - 2.06);
      let keep = Math.exp(-Math.pow((a - 2.72) / 0.55, 2));
      for (const [pos, sig, st] of gaps) keep *= 1 - st * Math.exp(-Math.pow((a - pos) / sig, 2));
      if (rng() < keep) break;
    }
    const e = Math.min(0.34, halfNormal(rng, 0.175, 0.34));
    const I = halfNormal(rng, 10.0, 30.0) * D2R;
    const O = rng() * TAU, w = rng() * TAU, M0 = rng() * TAU;
    const n = 0.01720209895 * Math.pow(a, -1.5);
    push(a, e, I, O, w, M0, n, 0.55 + rng() * rng() * 1.6);
  }
  // 希尔达族 3:2
  for (let i = 0; i < 900; i++) {
    const a = 3.90 + gauss() * 0.09;
    const e = 0.10 + rng() * 0.20;
    const I = halfNormal(rng, 9.0, 24.0) * D2R;
    push(a, e, I, rng() * TAU, rng() * TAU, rng() * TAU,
      0.01720209895 * Math.pow(a, -1.5), 0.65 + rng() * 1.6);
  }
  // 木星特洛伊群：平黄经锁定在木星 ±60°
  for (let i = 0; i < 2000; i++) {
    const a = 5.202 + gauss() * 0.13;
    const e = halfNormal(rng, 0.07, 0.16);
    const I = halfNormal(rng, 13.0, 36.0) * D2R;
    const O = rng() * TAU, w = rng() * TAU;
    const camp = (i & 1) ? 1 : -1;
    const Ltar = JUP_L0 + camp * 60 * D2R + gauss() * 26 * D2R;
    const M0 = ((Ltar - w - O + PI) % TAU + TAU) % TAU - PI;
    push(a, e, I, O, w, M0, JUP_N, 0.8 + rng() * rng() * 2.4);
  }
  // 柯伊伯带
  for (let i = 0; i < 6000; i++) {
    const r = rng();
    let a, e, I;
    if (r < 0.22) { // 冥族，3:2 共振
      a = 39.45 + gauss() * 0.55;
      e = halfNormal(rng, 0.24, 0.38);
      I = halfNormal(rng, 20.0, 42.0) * D2R;
    } else if (r < 0.86) { // 经典带
      a = 42.5 + rng() * 5.2;
      e = halfNormal(rng, 0.09, 0.11);
      I = halfNormal(rng, 8.0, 26.0) * D2R;
    } else { // 离散盘
      a = 48 + rng() * 32;
      e = 0.15 + rng() * 0.35;
      I = halfNormal(rng, 24.0, 55.0) * D2R;
    }
    push(a, e, I, rng() * TAU, rng() * TAU, rng() * TAU,
      0.01720209895 * Math.pow(a, -1.5), 0.65 + rng() * rng() * 2.6);
  }
  return { data, count: total };
}

/* 恒星：向银道面聚集 ------------------------------------------------ */
const GAL_NORTH = [-0.8678, 0.4972, 0.0003];
function generateStars(n) {
  const rng = mulberry32(0xC0FFEE11);
  const N = vnorm(GAL_NORTH);
  // 银道系正交基
  const ref = Math.abs(N[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
  const GX = vnorm(vcross(ref, N));
  const GZ = vcross(GX, N);
  const dirs = new Float32Array(n * 3);
  const cols = new Float32Array(n * 3);
  const attrs = new Float32Array(n * 3); // brightness, size, phase
  const palette = [
    [0.62, 0.72, 1.00], [0.78, 0.85, 1.00], [1.00, 0.98, 0.92],
    [1.00, 0.90, 0.74], [1.00, 0.77, 0.54], [1.00, 0.62, 0.41], [1.00, 0.52, 0.34]
  ];
  const weights = [0.004, 0.012, 0.030, 0.075, 0.170, 0.45, 0.259];
  // 累计权重抽样
  const cw = []; let acc = 0; for (const w of weights) { acc += w; cw.push(acc); }
  let k = 0;
  while (k < n) {
    // 银河坐标方向
    const lon = rng() * TAU;
    let lat = Math.asin(rng() * 2 - 1);
    const bandP = 0.14 + 0.86 * Math.exp(-Math.pow(lat / 0.20, 2));
    if (rng() > bandP) continue;
    const cl = Math.cos(lat);
    const gdir = [cl * Math.cos(lon), Math.sin(lat), cl * Math.sin(lon)];
    const d = [
      GX[0] * gdir[0] + N[0] * gdir[1] + GZ[0] * gdir[2],
      GX[1] * gdir[0] + N[1] * gdir[1] + GZ[1] * gdir[2],
      GX[2] * gdir[0] + N[2] * gdir[1] + GZ[2] * gdir[2]
    ];
    dirs[k * 3] = d[0]; dirs[k * 3 + 1] = d[1]; dirs[k * 3 + 2] = d[2];
    const b = Math.pow(rng(), 3.6);
    const r = rng();
    let ci = 3; for (let j = 0; j < cw.length; j++) { if (r < cw[j]) { ci = j; break; } }
    const c = palette[ci];
    cols[k * 3] = c[0]; cols[k * 3 + 1] = c[1]; cols[k * 3 + 2] = c[2];
    attrs[k * 3] = 0.22 + b * 2.3;
    attrs[k * 3 + 1] = 0.75 + b * 3.8;
    attrs[k * 3 + 2] = rng() * TAU;
    k++;
  }
  return { dirs, cols, attrs, count: n };
}

function updateEphemeris(jd) {
  const states = new Array(PLANETS.length);
  sim.earth = null;
  for (const p of PLANETS) {
    const s = planetState(p, jd, states[p.index] || {});
    states[p.index] = s;
    const w = compressWorld(s.x, s.y, s.z, sim.comp);
    p._hx = s.x; p._hy = s.y; p._hz = s.z;
    p._r = s.r; p._lon = s.lon; p._lat = s.lat;
    p._a = s.a; p._e = s.e; p._I = s.I;
    p._vel = s.vel; p._peri = s.a * (1 - s.e); p._apo = s.a * (1 + s.e);
    p._world = w;
    p._displayR = displayRadius(p.radiusKm);
    p._axis = spinAxisWorld(p.id);
    p._basis = axisBasis(p._axis);
    if (p.id === 'earth') sim.earth = p;
  }
  sim.planets = states;
  // 卫星世界位置
  for (const m of MOONS) {
    const pd = m.parentDef;
    const dist = moonDisplayDistance(m);
    const theta = TAU * ((jd - J2000) / m.period) + m.phase;
    const local0 = [Math.cos(theta) * dist, 0, Math.sin(theta) * dist];
    const ci = Math.cos(m.inc * D2R), si = Math.sin(m.inc * D2R);
    const local = [local0[0], -local0[2] * si, local0[2] * ci];
    let basis;
    if (m.ref === 'ecliptic') basis = { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] };
    else basis = pd._basis;
    const w = [
      pd._world[0] + basis.x[0] * local[0] + basis.y[0] * local[1] + basis.z[0] * local[2],
      pd._world[1] + basis.x[1] * local[0] + basis.y[1] * local[1] + basis.z[1] * local[2],
      pd._world[2] + basis.x[2] * local[0] + basis.y[2] * local[1] + basis.z[2] * local[2]
    ];

const AST_VS = VS_HEAD + `
#define API 3.141592653589793
#define ATAU 6.283185307179586
layout(location = 0) in vec4 aA; // a, e, I, O
layout(location = 1) in vec4 aB; // w, M0, n, size
uniform mat4 uVP;
uniform vec3 uCamPos;
uniform float uDays;
uniform float uScale;
uniform float uCompress;
uniform float uPixelRatio;
out vec3 vColor;
out float vAlpha;
void main(){
  float a = aA.x, e = aA.y, I = aA.z, O = aA.w;
  float w = aB.x, M0 = aB.y, n = aB.z, size = aB.w;
  float M = M0 + n * uDays;
  M = mod(M + API, ATAU) - API;
  float E = M + e * sin(M) * (1.0 + e * cos(M));
  for(int i = 0; i < 5; i++){
    E -= (E - e * sin(E) - M) / (1.0 - e * cos(E));
  }
  float cw = cos(w), sw = sin(w), cO = cos(O), sO = sin(O), cI = cos(I), sI = sin(I);
  float xp = a * (cos(E) - e);
  float yp = a * sqrt(max(0.0, 1.0 - e * e)) * sin(E);
  float x = (cw * cO - sw * sO * cI) * xp + (-sw * cO - cw * sO * cI) * yp;
  float y = (cw * sO + sw * cO * cI) * xp + (-sw * sO + cw * cO * cI) * yp;
  float z = (sw * sI) * xp + (cw * sI) * yp;

  vec3 world = vec3(x, z, -y) * (rd / max(r, 0.0001));
  gl_Position = uVP * vec4(world, 1.0);
  float dist = max(distance(world, uCamPos), 0.8);
  gl_PointSize = clamp(size * 300.0 / dist * uPixelRatio, 0.75, 4.5);
  vec3 col;
  if(a > 30.0) col = vec3(0.40, 0.53, 0.72);
  else if(a > 4.5) col = vec3(0.66, 0.42, 0.27);
  else if(a > 3.5) col = vec3(0.55, 0.48, 0.34);
  else col = vec3(0.56, 0.49, 0.40);
  float sunBoost = clamp(pow(1.0 / max(r, 0.3), 0.35), 0.45, 1.35);
  vAlpha = mix(0.040, 0.155, clamp(size * 0.5, 0.0, 1.0)) * sunBoost;
  vColor = col;
}`;

/* 岩质天体：水星 / 月球 / 火星 / 木卫四 / 木卫一 ---------------------- */
const ROCKY_FS = FS_HEAD + GLSL_COMMON + `
in vec3 vWorld;
in vec3 vNormal;
in vec3 vObj;
uniform int uType;      // 0 mercury 1 moon 2 mars 3 callisto/charon 4 io
uniform vec3 uColorA;
uniform vec3 uColorB;
uniform vec3 uColorC;
uniform vec3 uSeed;
uniform float uBump;
uniform float uRadius;
uniform float uAlbedo;
out vec4 fragColor;

void main(){
  vec3 p = normalize(vObj);
  vec3 q = p + uSeed;
  float n1 = fbm(q * 2.6 + 3.1, 5);
  float n2 = fbm(q * 7.3 + 13.7, 4);
  float north = sstep(-0.10, 0.40, p.y);

  float mare = 0.0;
  float craterDepth = 1.0;
  float craterAmount = 1.0;
  if(uType == 1){
    mare = sstep(0.485, 0.600, fbm(q * 1.55 + 7.1, 5));
    craterAmount *= 1.0 - 0.82 * mare;
  }
  if(uType == 2){
    craterDepth *= 0.65;
    craterAmount *= mix(1.0, 0.26, north);
  }
  if(uType == 4){
    craterAmount *= 0.22;
  }
  if(uType == 3){
    craterAmount *= 0.85;
  }

  float h = 0.0, a = 0.0;
  craterLayer(q,        5.0, 1.00 * craterDepth, h, a);
  craterLayer(q + 5.7, 12.0, 0.52 * craterDepth, h, a);
  craterLayer(q + 13.1, 28.0, 0.26 * craterDepth, h, a);
  craterLayer(q + 21.3, 62.0, 0.13 * craterDepth, h, a);
  h *= craterAmount;
  a *= craterAmount;

  vec3 base = mix(uColorA, uColorB, sstep(0.34, 0.68, n1));
  base = mix(base, uColorC, pow(sstep(0.54, 0.86, n2), 2.0) * 0.55);

  if(uType == 1){
    base = mix(base, vec3(0.030, 0.032, 0.035), mare * 0.85);
    float ray = pow(max(0.0, vnoise(q * 52.0 + 4.0)), 7.0);
    base += vec3(0.085, 0.083, 0.078) * ray * (1.0 - mare) * (0.4 + 0.6 * n2);
  }
  if(uType == 2){
    float lat = asin(clamp(p.y, -1.0, 1.0));
    float lon = atan(p.z, p.x);
    float capN = sstep(0.915, 0.970, p.y + (n2 - 0.5) * 0.07);
    float capS = sstep(0.925, 0.975, -p.y + (n1 - 0.5) * 0.07);
    base = mix(base, vec3(0.38, 0.41, 0.45), max(capN, capS));
    float valles = exp(-pow((p.y + 0.03) / 0.055, 2.0)) * exp(-pow(angDiff(lon, -0.35) / 0.62, 2.0));
    base = mix(base, vec3(0.038, 0.023, 0.015), valles * 0.80);
    float syrtis = exp(-pow((p.y - 0.16) / 0.22, 2.0)) * exp(-pow(angDiff(lon, 0.95) / 0.55, 2.0));
    base = mix(base, vec3(0.045, 0.024, 0.014), syrtis * 0.72);
    // 北方低地较暗、较平滑
    base *= mix(1.0, 0.84, north * 0.55);
  }
  if(uType == 4){
    vec4 vw = worleyId(q * 9.0 + 3.3);
    float vol = sstep(0.80, 0.95, vw.z) * (1.0 - sstep(0.10, 0.30, vw.x));
    base = mix(base, vec3(0.055, 0.032, 0.020), vol);
    base = mix(base, vec3(0.46, 0.33, 0.10), sstep(0.55, 0.80, n2) * 0.4);
    a = a * 0.45;
    vec3 col = base * uAlbedo;
    vec3 N = normalize(vNormal);
    float hWorld = h * uRadius * 0.020 + n2 * uRadius * 0.0015;
    N = perturbNormal(N, vWorld, hWorld, clamp(uBump, 0.0, 2.0));
    vec3 L = normalize(uSunPos - vWorld);
    float lam = sstep(-0.055, 0.14, dot(N, L));
    vec3 lit = col * uSunColor * (uSunI * lam) + col * 0.0025;
    lit += vec3(1.0, 0.24, 0.035) * vol * 0.16 * (0.4 + 0.6 * lam);
    fragColor = vec4(lit, 1.0);
    return;
  }

  base *= (1.0 + a * (uType == 2 ? 1.40 : 0.66));
  base = max(base, vec3(0.0));
  vec3 col = base * uAlbedo;

  vec3 N = normalize(vNormal);
  float hWorld = h * uRadius * 0.022 + (n2 - 0.5) * uRadius * 0.003;
  N = perturbNormal(N, vWorld, hWorld, clamp(uBump, 0.0, 2.0));

  vec3 L = normalize(uSunPos - vWorld);
  float ndl = dot(N, L);
  float lam = sstep(-0.055, 0.14, ndl);
  vec3 lit = col * uSunColor * (uSunI * lam);
  lit += col * 0.0028;

  // 月球表面的地球反照微光
  lit += col * vec3(0.20, 0.28, 0.42) * 0.006 * (uType == 1 ? 1.0 : 0.0);
  fragColor = vec4(lit, 1.0);
}`;

  cov += 0.10 * exp(-pow((alat - 0.95) / 0.30, 2.0));

  vec3 L = normalize(uSunPos - vWorld);
  vec3 V = normalize(uCamPos - vWorld);

  float spec = pow(max(dot(N, H), 0.0), 420.0) * 0.85;
  surf += uSunColor * spec * uSunI * ocean * (1.0 - cloud) * sstep(-0.02, 0.12, ndl);

  vec3 cloudLit = cloudCol * uSunColor * (uSunI * lam) * (0.92 + 0.12 * c1);

  surf += albedo * 0.0025;

  float night = sstep(0.03, -0.10, ndl);
  float cn1 = vnoise(p * 58.0 + uSeed + 3.7);
  float cn2 = vnoise(p * 147.0 + uSeed + 9.1);
  float city = sstep(0.80, 0.965, cn1) * sstep(0.50, 0.92, cn2);
  city += 0.12 * pow(max(cn1 - 0.66, 0.0), 4.0);
  float lights = city * (1.0 - ocean) * (1.0 - cloud * 0.96) * night;
  surf += vec3(1.0, 0.54, 0.24) * lights * 0.085;

  surf += vec3(0.012, 0.028, 0.050) * pow(max(0.0, 1.0 - cloud), 2.0) * lam * (1.0 - ocean) * 0.4;

}`;

const GIANT_FS = FS_HEAD + GLSL_COMMON + `
in vec3 vWorld;
in vec3 vNormal;
in vec3 vObj;
uniform int uKind;       // 1 jupiter 2 saturn 3 uranus 4 neptune
uniform float uTurb;
uniform vec3 uSeed;
uniform vec3 uSunDirObj;
uniform int uRingType;
uniform vec3 uSpot;      // lon, lat, size
uniform int uSpotKind;   // 0 none, 1 red spot, 2 dark spot

vec3 gasRampJupiter(float t){
  t = clamp(t, 0.0, 1.0);
  vec3 c0 = vec3(0.050, 0.030, 0.019);
  vec3 c1 = vec3(0.145, 0.082, 0.042);
  vec3 c2 = vec3(0.330, 0.218, 0.118);
  vec3 c3 = vec3(0.545, 0.420, 0.258);
  vec3 c4 = vec3(0.720, 0.620, 0.445);

  if(t < 0.50) return mix(c1, c2, (t - 0.25) / 0.25);
  if(t < 0.75) return mix(c2, c3, (t - 0.50) / 0.25);
  return mix(c3, c4, (t - 0.75) / 0.25);
}
vec3 gasRampSaturn(float t){
  t = clamp(t, 0.0, 1.0);
  vec3 c0 = vec3(0.085, 0.070, 0.045);
  vec3 c1 = vec3(0.190, 0.160, 0.100);
  vec3 c2 = vec3(0.360, 0.305, 0.195);
  vec3 c3 = vec3(0.530, 0.455, 0.305);
  vec3 c4 = vec3(0.665, 0.590, 0.430);

  if(t < 0.50) return mix(c1, c2, (t - 0.25) / 0.25);
  if(t < 0.75) return mix(c2, c3, (t - 0.50) / 0.25);
  return mix(c3, c4, (t - 0.75) / 0.25);

void main(){
  vec3 p = normalize(vObj);
  float lat = asin(clamp(p.y, -1.0, 1.0));
  float lon = atan(p.z, p.x);
  float warp1 = fbm(p * vec3(2.4, 7.0, 2.4) + uSeed, 5) - 0.5;
  float warp2 = fbm(p * vec3(6.0, 18.0, 6.0) + uSeed + 7.0, 4) - 0.5;

  vec3 albedo;

    float b = 0.5;
    b += 0.355 * sin(latw * 4.0 + 0.7);
    b += 0.220 * sin(latw * 9.0 + 2.0);
    b += 0.120 * sin(latw * 17.0 - 1.3);
    b += 0.070 * sin(latw * 30.0 + 4.2);

  } else {
    float b = 0.5 + 0.26 * sin(latw * 10.0 + 0.7) * polar + 0.12 * sin(latw * 22.0 + 2.2) * polar;
    b += 0.06 * (fbm(p * vec3(4.0, 14.0, 4.0) + uSeed, 3) - 0.5) * polar;
    if(uKind == 3){

  if(uSpotKind > 0){

    float dx = dl * cos(lat) / uSpot.z;
    float dy = (lat - uSpot.y) / (uSpot.z * 0.465);

        vec3 spotCol = mix(vec3(0.40, 0.115, 0.032), vec3(0.70, 0.300, 0.100), sw);
        spotCol = mix(spotCol, vec3(0.80, 0.55, 0.30), 0.22 * sw);
        albedo = mix(albedo, spotCol, mask * 0.94);
        float halo = sstep(0.92, 1.10, d) * (1.0 - sstep(1.10, 1.38, d));

  float ringShade = ringShadow(p, sunDirObj, uRingType);

  vec3 V = normalize(uCamPos - vWorld);
  vec3 L = normalize(uSunPos - vWorld);

  float mu = max(dot(N, V), 0.0);

  vec3 col = albedo * uSunColor * (uSunI * lam) * limb + albedo * 0.0022;
  fragColor = vec4(col, 1.0);

  col = mix(vec3(luma), col, 1.06);
  col = aces(col);
  col = pow(max(col, vec3(0.0)), vec3(1.0 / 2.2));

  float vig = 1.0 - 0.30 * pow(clamp(length(dir * vec2(uAspect * 0.72, 1.0)) * 1.18, 0.0, 1.0), 2.3);
  col *= vig;

  float grain = (hash21(uv * uRes + fract(uTime) * 137.0) - 0.5) * uGrain;
  col += grain;
  fragColor = vec4(max(col, vec3(0.0)), 1.0);
}`;

/* =========================================================================
   11. 几何体
   ========================================================================= */
function sphereGeometry(latSeg, lonSeg) {
  const pos = new Float32Array((latSeg + 1) * (lonSeg + 1) * 3);
  let o = 0;
  for (let y = 0; y <= latSeg; y++) {
    const theta = y / latSeg * PI, st = Math.sin(theta), ct = Math.cos(theta);
    for (let x = 0; x <= lonSeg; x++) {
      const phi = x / lonSeg * TAU;
      pos[o++] = st * Math.cos(phi);
      pos[o++] = ct;
      pos[o++] = st * Math.sin(phi);
    }
  }
  const idx = new Uint16Array(latSeg * lonSeg * 6);
  let k = 0;
  for (let y = 0; y < latSeg; y++) {
    for (let x = 0; x < lonSeg; x++) {
      const a = y * (lonSeg + 1) + x;
      const b = a + lonSeg + 1;
      idx[k++] = a; idx[k++] = a + 1; idx[k++] = b;
      idx[k++] = a + 1; idx[k++] = b + 1; idx[k++] = b;
    }
  }
  return { pos, idx };
}

function buildSphereVAO(latSeg, lonSeg) {
  const g = sphereGeometry(latSeg, lonSeg);
  const vao = makeVAO();
  const vbo = bufferFrom(g.pos);
  attrib(vao, vbo, 0, 3);
  const ibo = indexBuffer(g.idx);
  gl.bindVertexArray(null);
  return { vao, vbo, ibo, indexCount: g.idx.length, vertCount: g.pos.length / 3 };
}

function buildRingGeometry() {
  const seg = 512;
  const verts = new Float32Array((seg + 1) * 2 * 3);
  const idx = new Uint16Array(seg * 6);
  let o = 0, k = 0;
  for (let i = 0; i <= seg; i++) {
    const a = i / seg * TAU, c = Math.cos(a), s = Math.sin(a);
    verts[o++] = c * 1.0; verts[o++] = 0; verts[o++] = s * 1.0;
    verts[o++] = c * 2.36; verts[o++] = 0; verts[o++] = s * 2.36;
  }
  for (let i = 0; i < seg; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    idx[k++] = a; idx[k++] = c; idx[k++] = b;
    idx[k++] = b; idx[k++] = c; idx[k++] = d;
  }
  const vao = makeVAO();
  const vbo = bufferFrom(verts);
  attrib(vao, vbo, 0, 3);
  indexBuffer(idx);
  gl.bindVertexArray(null);
  return { vao, vbo, indexCount: idx.length };
}

function buildQuad() {
  const vao = makeVAO();
  const buf = bufferFrom(new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]));
  attrib(vao, buf, 0, 2);
  gl.bindVertexArray(null);
  return { vao, buf, count: 4 };
}

function destroyBloom() {
  for (const t of RENDER.bloom) {
    if (!t) continue;
    gl.deleteFramebuffer(t.fbo);
    gl.deleteTexture(t.tex);
  }
  RENDER.bloom = [];
}

function createBloom(w, h) {
  destroyBloom();
  let ww = Math.max(1, Math.floor(w / 4));
  let hh = Math.max(1, Math.floor(h / 4));
  for (let i = 0; i < 6; i++) {
    const t = createColorTarget(ww, hh);
    if (!t) break;
    RENDER.bloom.push(t);
    ww = Math.max(1, Math.floor(ww / 2));
    hh = Math.max(1, Math.floor(hh / 2));
  }
}

function resizeTargets() {
  const cssW = Math.max(2, window.innerWidth);
  const cssH = Math.max(2, window.innerHeight);
  const scale = Math.min(window.devicePixelRatio || 1, 2.0) * RENDER.quality;
  const w = Math.max(2, Math.floor(cssW * scale));
  const h = Math.max(2, Math.floor(cssH * scale));
  if (w === RENDER.w && h === RENDER.h && RENDER.scene) return;
  canvas.width = w; canvas.height = h;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  if (RENDER.scene) destroySceneTarget(RENDER.scene);
  RENDER.scene = createSceneTarget(w, h);
  createBloom(w, h);
  RENDER.w = w; RENDER.h = h;
  RENDER.cssW = cssW; RENDER.cssH = cssH;
  RENDER.viewport = [w, h];
}

function mat4MulVec4(m, v) {
  return [
    m[0] * v[0] + m[4] * v[1] + m[8] * v[2] + m[12] * v[3],
    m[1] * v[0] + m[5] * v[1] + m[9] * v[2] + m[13] * v[3],
    m[2] * v[0] + m[6] * v[1] + m[10] * v[2] + m[14] * v[3],
    m[3] * v[0] + m[7] * v[1] + m[11] * v[2] + m[15] * v[3]
  ];
}

function projectWorld(world) {
  const clip = mat4MulVec4(CAM.vp, [world[0], world[1], world[2], 1]);
  if (clip[3] <= 0.0001) return null;
  const nx = clip[0] / clip[3], ny = clip[1] / clip[3], nz = clip[2] / clip[3];
  return {
    ndcX: nx, ndcY: ny, ndcZ: nz,
    x: (nx * 0.5 + 0.5) * RENDER.cssW,
    y: (1 - (ny * 0.5 + 0.5)) * RENDER.cssH,
    w: clip[3]
  };
}
function screenRadius(world, radius) {
  const dx = world[0] - CAM.pos[0], dy = world[1] - CAM.pos[1], dz = world[2] - CAM.pos[2];
  const d = Math.max(0.001, Math.hypot(dx, dy, dz));
  return radius / (d * Math.tan(CAM.fov * 0.5)) * (RENDER.cssH * 0.5);
}

function maybeAutoOrient(id) {
  if (id === 'sun') return;
  const W = bodyWorldPos(id);
  if (vlen(W) < 1e-5) return;
  const S = vnorm(vmul(W, -1));
  const cp = Math.cos(CAM.pitch);
  const offset = [cp * Math.sin(CAM.yaw), Math.sin(CAM.pitch), cp * Math.cos(CAM.yaw)];
  const planet = PLANET_BY_ID[id];
  const ringed = RING_CFG[id] ? 1 : 0;
  if (!ringed && vdot(S, offset) > 0.68) return; // 已经以昼面为主，不打扰视角
  const pole = planet && planet._basis ? planet._basis.y : [0, 1, 0];
  const poleSign = vdot(S, pole) >= 0 ? 1 : -1;
  let P = vcross(S, pole);
  if (vlen(P) < 0.08) {
    P = vcross(pole, [1, 0, 0]);
    if (vlen(P) < 0.08) P = vcross(pole, [0, 0, 1]);
  }
  P = vnorm(P);
  // 相机贴近太阳方向：相位的亮面最充分；再沿赤道面偏转一点，
  // 这样环的张角会随太阳的赤纬自然变化，也能看见投在环上的行星阴影。
  const build = (sgn) => vnorm(vadd(vadd(vmul(S, 0.92), vmul(P, 0.40 * sgn)), vmul(pole, (ringed ? 0.06 : 0.12) * poleSign)));
  const c1 = build(1), c2 = build(-1);
  const C = vdot(c1, offset) > vdot(c2, offset) ? c1 : c2;
  const toPitch = Math.asin(clamp(C[1], -1, 1));
  const toYaw = Math.atan2(C[0], C[2]);
  const dy = ((toYaw - CAM.yaw + PI) % TAU + TAU) % TAU - PI;
  CAM.autoRot = { fromYaw: CAM.yaw, toYaw: CAM.yaw + dy, fromPitch: CAM.pitch, toPitch, t: 0, dur: 1.15 };
}

function updateCamera(dt) {
  if (CAM.autoRot) {
    CAM.autoRot.t += dt;
    const u = smooth(clamp(CAM.autoRot.t / CAM.autoRot.dur, 0, 1));
    CAM.yaw = lerp(CAM.autoRot.fromYaw, CAM.autoRot.toYaw, u);
    CAM.pitch = lerp(CAM.autoRot.fromPitch, CAM.autoRot.toPitch, u);
    if (u >= 1) CAM.autoRot = null;
  }
  CAM.targetGoal = bodyWorldPos(APP.focus);
  const kt = 1 - Math.exp(-dt * 7.0);
  CAM.target = mixv(CAM.target, CAM.targetGoal, kt);
  const kd = 1 - Math.exp(-dt * 9.0);
  CAM.dist = lerp(CAM.dist, CAM.distGoal, kd);
  CAM.dist = clamp(CAM.dist, CAM.minDist, CAM.maxDist);
  CAM.pitch = clamp(CAM.pitch, -1.48, 1.48);

  const cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
  CAM.pos = [
    CAM.target[0] + CAM.dist * cp * Math.sin(CAM.yaw),
    CAM.target[1] + CAM.dist * sp,
    CAM.target[2] + CAM.dist * cp * Math.cos(CAM.yaw)
  ];
  CAM.near = Math.max(0.012, CAM.dist * 0.0035);
  CAM.far = Math.max(CAM.dist * 14, 4200);
  const aspect = Math.max(0.2, RENDER.w / RENDER.h);
  CAM.view = M4.lookAt(CAM.pos, CAM.target, [0, 1, 0]);
  CAM.proj = M4.perspective(CAM.fov, aspect, CAM.near, CAM.far);
  CAM.vp = M4.mul(CAM.proj, CAM.view);
  CAM.invVP = M4.invert(CAM.vp);

  CAM.fwd = vnorm(vsub(CAM.target, CAM.pos));
  CAM.right = vnorm(vcross(CAM.fwd, [0, 1, 0]));
  if (!isFinite(CAM.right[0]) || vlen(CAM.right) < 0.1) CAM.right = [1, 0, 0];
  CAM.up = vcross(CAM.right, CAM.fwd);
}

/* 自转相位（限速，避免高倍速频闪） ---------------------------------- */
function initSpin(jd) {
  for (const p of PLANETS) {
    const rotDays = Math.abs(ROT[p.id].rotH) / 24;
    p._spin = TAU * ((jd - J2000) / rotDays);
  }
  const sunDays = Math.abs(ROT.sun.rotH) / 24;
  APP.spin.sun = TAU * ((jd - J2000) / sunDays);
  APP.spinJD = jd;
}
function updateSpins(jd) {
  const djd = jd - APP.spinJD;
  APP.spinJD = jd;
  const clampedDays = clamp(djd, -0.02, 0.02); // 相位增量 clamp 的来源
  for (const p of PLANETS) {
    const rotDays = Math.abs(ROT[p.id].rotH) / 24;
    let d = TAU * clampedDays / rotDays;
    d = clamp(d, -0.22, 0.22);
    if (!isFinite(p._spin)) p._spin = 0;
    p._spin = (p._spin + d) % TAU;
  }
  const sd = Math.abs(ROT.sun.rotH) / 24;
  APP.spin.sun = (APP.spin.sun + clamp(TAU * clampedDays / sd, -0.22, 0.22)) % TAU;
  for (const m of MOONS) {
    if (!isFinite(m._spin)) m._spin = 0;
    m._spin = (m._spin + clamp(TAU * clampedDays / Math.abs(m.period), -0.22, 0.22)) % TAU;
  }
}

/* =========================================================================
   15. 绘制工具
   ========================================================================= */
function u1(p, n, v) { const l = p.u[n]; if (l) gl.uniform1f(l, v); }
function u2(p, n, a, b) { const l = p.u[n]; if (l) gl.uniform2f(l, a, b); }
function u3(p, n, a, b, c) { const l = p.u[n]; if (l) gl.uniform3f(l, a, b, c); }
function u3v(p, n, v) { const l = p.u[n]; if (l) gl.uniform3fv(l, v); }
function u4(p, n, a, b, c, d) { const l = p.u[n]; if (l) gl.uniform4f(l, a, b, c, d); }
function ui(p, n, v) { const l = p.u[n]; if (l) gl.uniform1i(l, v); }
function umat(p, n, m) { const l = p.u[n]; if (l) gl.uniformMatrix4fv(l, false, m); }

function setCommon(p, sunI) {
  gl.useProgram(p.prog);
  u3(p, 'uSunPos', 0, 0, 0);
  u3v(p, 'uCamPos', CAM.pos);
  u1(p, 'uSunI', sunI === undefined ? 1 : sunI);
  u3(p, 'uSunColor', 1.0, 0.97, 0.92);
  u1(p, 'uTime', APP.visualTime);
}

function bindTex(unit, tex, p, name) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (p && name) ui(p, name, unit);
}

function fullscreen() {
  gl.bindVertexArray(GEO.empty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function modelFor(center, basis, spin, radius) {
  const c = Math.cos(spin), s = Math.sin(spin);
  const x = [
    basis.x[0] * c - basis.z[0] * s,
    basis.x[1] * c - basis.z[1] * s,
    basis.x[2] * c - basis.z[2] * s
  ];
  const z = [
    basis.x[0] * s + basis.z[0] * c,
    basis.x[1] * s + basis.z[1] * c,
    basis.x[2] * s + basis.z[2] * c
  ];
  return M4.fromBasis(center, x, basis.y, z, radius);
}

function drawSphere(prog, mesh, model) {
  gl.useProgram(prog.prog);
  umat(prog, 'uVP', CAM.vp);
  umat(prog, 'uModel', model);
  gl.bindVertexArray(mesh.vao);
  gl.drawElements(gl.TRIANGLES, mesh.indexCount, gl.UNSIGNED_SHORT, 0);
}

  umat(p, 'uInvVP', CAM.invVP);

}

function drawStars() {
  const p = PROG.stars;

  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.disable(gl.CULL_FACE);
  umat(p, 'uVP', CAM.vp);
  u3v(p, 'uCamPos', CAM.pos);
  u1(p, 'uTime', APP.visualTime);
  u1(p, 'uPixelRatio', RENDER.w / Math.max(1, RENDER.cssW));
  gl.bindVertexArray(GEO.stars);
  gl.drawArrays(gl.POINTS, 0, STAR_DATA.count);
}

function planetSunI(p) {
  return clamp(1.5 * Math.pow(1 / Math.max(0.01, p._r), 0.40), 0.26, 2.1);
}

function drawSunBody() {
  const p = PROG.sun;

function drawPlanetBody(p) {
  const id = p.id;
  const c = p._world;
  const basis = p._basis;
  const spin = p._spin || 0;
  const sunI = planetSunI(p);
  const model = modelFor(c, basis, spin, p._displayR);

  if (id === 'earth') {
    const pr = PROG.earth;
    setCommon(pr, sunI);
    u3v(pr, 'uSeed', [1.3, 2.7, -0.9]);
    u1(pr, 'uRadius', p._displayR);
    u1(pr, 'uTime', APP.visualTime);
    drawSphere(pr, GEO.sphereHigh, model);
    return;
  }
  if (id === 'venus') {
    const pr = PROG.cloud;
    setCommon(pr, sunI);
    ui(pr, 'uKind', 1);
    u3v(pr, 'uSeed', [-1.4, 2.2, 0.6]);
    u1(pr, 'uTime', APP.visualTime);
    drawSphere(pr, GEO.sphereHigh, model);
    return;
  }
  if (id === 'jupiter' || id === 'saturn' || id === 'uranus' || id === 'neptune') {
    drawGiant(p, model, sunI);
    return;
  }
  if (id === 'pluto') {
    const pr = PROG.pluto;
    setCommon(pr, sunI);
    u3v(pr, 'uSeed', [0.5, -2.2, 1.8]);
    u1(pr, 'uRadius', p._displayR);
    drawSphere(pr, GEO.sphereHigh, model);
    return;
  }
  // 岩质
  const mat = ROCKY_MAT[id];
  if (!mat) return;
  const pr = PROG.rocky;
  setCommon(pr, sunI);
  ui(pr, 'uType', mat.type);
  u3v(pr, 'uColorA', mat.A);
  u3v(pr, 'uColorB', mat.B);
  u3v(pr, 'uColorC', mat.C);
  u3v(pr, 'uSeed', mat.seed);
  u1(pr, 'uBump', mat.bump);
  u1(pr, 'uRadius', p._displayR);
  u1(pr, 'uAlbedo', mat.albedo);
  drawSphere(pr, GEO.sphereHigh, model);
}

function drawGiant(p, model, sunI) {
  const pr = PROG.giant;
  setCommon(pr, sunI);
  const kind = p.id === 'jupiter' ? 1 : p.id === 'saturn' ? 2 : p.id === 'uranus' ? 3 : 4;
  ui(pr, 'uKind', kind);
  u1(pr, 'uTurb', kind === 1 ? 1.0 : kind === 2 ? 0.42 : kind === 3 ? 0.24 : 0.30);
  u3v(pr, 'uSeed', kind === 1 ? [0.4, 1.2, -0.8] : kind === 2 ? [-1.3, 0.7, 2.2] : kind === 3 ? [2.0, -0.5, 1.1] : [-0.6, 2.1, 0.3]);
  const L = vnorm(vmul(p._world, -1));
  const b = p._basis;
  u3(pr, 'uSunDirObj', vdot(L, b.x), vdot(L, b.y), vdot(L, b.z));
  ui(pr, 'uRingType', p.id === 'saturn' ? 1 : p.id === 'uranus' ? 2 : p.id === 'jupiter' ? 3 : 0);
  let spot = [0, 0, 0], spotKind = 0;
  if (p.id === 'jupiter') { spot = [0.38, -0.39, 0.165]; spotKind = 1; }
  if (p.id === 'neptune') { spot = [1.05, -0.40, 0.20]; spotKind = 2; }
  u3(pr, 'uSpot', spot[0], spot[1], spot[2]);
  ui(pr, 'uSpotKind', spotKind);
  drawSphere(pr, GEO.sphereHigh, model);
}

function drawMoonBody(m) {
  const sunI = planetSunI(m.parentDef);
  const model = modelFor(m._world, m._basis, m._spin || 0, m._displayR);
  if (m.id === 'titan') {
    const pr = PROG.cloud;
    setCommon(pr, sunI);
    ui(pr, 'uKind', 2);
    u3v(pr, 'uSeed', [2.4, -1.1, 0.5]);
    u1(pr, 'uTime', APP.visualTime);
    drawSphere(pr, GEO.sphereMid, model);
    return;
  }
  if (m.id === 'europa' || m.id === 'ganymede') {
    const pr = PROG.icy;
    setCommon(pr, sunI);
    ui(pr, 'uKind', m.id === 'europa' ? 1 : 2);
    u3v(pr, 'uSeed', m.id === 'europa' ? [1.1, -2.0, 0.3] : [-0.7, 1.8, 2.5]);
    u1(pr, 'uRadius', m._displayR);
    drawSphere(pr, GEO.sphereMid, model);
    return;
  }
  const mat = ROCKY_MAT[m.id];
  if (!mat) return;
  const pr = PROG.rocky;
  setCommon(pr, sunI);
  ui(pr, 'uType', mat.type);
  u3v(pr, 'uColorA', mat.A);
  u3v(pr, 'uColorB', mat.B);
  u3v(pr, 'uColorC', mat.C);
  u3v(pr, 'uSeed', mat.seed);
  u1(pr, 'uBump', mat.bump);
  u1(pr, 'uRadius', m._displayR);
  u1(pr, 'uAlbedo', mat.albedo);
  drawSphere(pr, GEO.sphereMid, model);
}

/* 轨道曲线 -------------------------------------------------------------- */
const ORBIT_COLORS = {};
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
}
for (const p of PLANETS) ORBIT_COLORS[p.id] = hexToRgb(p.color);
ORBIT_COLORS.halley = [0.55, 0.85, 0.82];

function writeOrbit(buf, a, e, I, w, O, Mcur, color, comp) {
  const N = 256;
  const pxW = RENDER.w, pxH = RENDER.h;
  const points = new Array(N);
  const tmp = { x: 0, y: 0, z: 0 };
  for (let i = 0; i < N; i++) {
    const E = (i / N) * TAU;
    orbitPoint(a, e, I, w, O, E, tmp);
    const wpos = compressWorld(tmp.x, tmp.y, tmp.z, comp);
    const clip = mat4MulVec4(CAM.vp, [wpos[0], wpos[1], wpos[2], 1]);
    const cw = clip[3];
    let valid = cw > 0.04 && isFinite(clip[0]) && isFinite(clip[1]);
    let ndc = [0, 0, 0];
    if (valid) {
      ndc[0] = clip[0] / cw; ndc[1] = clip[1] / cw; ndc[2] = clip[2] / cw;
      if (Math.abs(ndc[0]) > 24 || Math.abs(ndc[1]) > 24) valid = false;
    }
    const Mj = E - e * Math.sin(E);
    const lag = ((Mcur - Mj) % TAU + TAU) % TAU / TAU;
    points[i] = { ndc, valid, lag };
  }

  let runs = [];
  const allValid = points.every(p => p.valid);
  if (allValid) {
    runs.push({ start: 0, count: N, loop: true });
  } else {
    let start = -1;
    for (let i = 0; i < N; i++) {
      if (!points[i].valid && points[(i + 1) % N].valid) { start = (i + 1) % N; break; }
    }
    if (start >= 0) {
      let runStart = -1;
      for (let k = 0; k < N; k++) {
        const idx = (start + k) % N;
        if (points[idx].valid) {
          if (runStart < 0) runStart = k;
        } else if (runStart >= 0) {
          runs.push({ start: (start + runStart) % N, count: k - runStart, loop: false });
          runStart = -1;
        }
      }
      if (runStart >= 0) runs.push({ start: (start + runStart) % N, count: N - runStart, loop: false });
    }
  }

  if (!buf.data) buf.data = new Float32Array(buf.verts * 8);
  const data = buf.data;
  let o = 0;
  buf.runs = [];
  const halfW = 0.55 * (RENDER.w / Math.max(1, RENDER.cssW));
  for (const run of runs) {
    const len = run.loop ? N + 1 : run.count;
    if (len < 2) continue;
    const firstVert = o / 8;
    for (let k = 0; k < len; k++) {
      const rel = run.loop ? (k % N) : k;
      const idx = (run.start + rel) % N;
      const p = points[idx];
      if (!p.valid) continue;
      let prevIdx, nextIdx;
      if (run.loop) {
        prevIdx = (idx - 1 + N) % N;
        nextIdx = (idx + 1) % N;
      } else if (k === 0) {
        prevIdx = idx;
        nextIdx = (run.start + Math.min(1, run.count - 1)) % N;
      } else if (k === len - 1) {
        prevIdx = (run.start + len - 2) % N;
        nextIdx = idx;
      } else {
        prevIdx = (run.start + k - 1) % N;
        nextIdx = (run.start + k + 1) % N;
      }
      const pp = points[prevIdx], pn = points[nextIdx];
      let dx = (pn.ndc[0] - pp.ndc[0]) * pxW;
      let dy = (pn.ndc[1] - pp.ndc[1]) * pxH;
      const dl = Math.hypot(dx, dy);
      if (dl < 1e-8) { dx = 1; dy = 0; } else { dx /= dl; dy /= dl; }
      const nx = -dy, ny = dx;
      const ox = nx * halfW * 2 / pxW, oy = ny * halfW * 2 / pxH;
      for (let s = -1; s <= 1; s += 2) {
        data[o++] = p.ndc[0] + ox * s;
        data[o++] = p.ndc[1] + oy * s;
        data[o++] = p.ndc[2];
        data[o++] = s;
        data[o++] = p.lag;
        data[o++] = color[0];
        data[o++] = color[1];
        data[o++] = color[2];
      }
    }
    const count = o / 8 - firstVert;
    if (count >= 4) buf.runs.push({ start: firstVert, count });
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, buf.buf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, data.subarray(0, o));
}

function drawOrbits() {
  if (!APP.showOrbit) return;
  const pr = PROG.orbit;
  gl.useProgram(pr.prog);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.disable(gl.CULL_FACE);
  u1(pr, 'uBaseAlpha', 0.026);
  u1(pr, 'uPeakAlpha', 0.17);
  u1(pr, 'uOpacity', APP.focus === 'sun' ? 1.0 : 0.45);
  for (const p of PLANETS) {
    const st = planetState(p, sim.jd);
    const buf = ORBIT_BUF[p.index];
    let col = ORBIT_COLORS[p.id].slice();
    const sel = APP.focus === p.id || APP.selected === p.id;
    col = col.map(v => Math.min(1, v * 0.50 + 0.04 + (sel ? 0.10 : 0)));
    writeOrbit(buf, st.a, st.e, st.I, st.w, st.O, st.M, col, sim.comp);
    gl.bindVertexArray(buf.vao);
    for (const r of buf.runs) gl.drawArrays(gl.TRIANGLE_STRIP, r.start, r.count);
  }
  if (APP.showComet) {
    const h = sim.comet;
    const buf = ORBIT_BUF[ORBIT_BUF.length - 1];
    const sel = APP.focus === 'halley' || APP.selected === 'halley';
    const col = sel ? [0.48, 0.72, 0.70] : [0.20, 0.32, 0.32];
    writeOrbit(buf, h.a, h.e, h.I, h.w, h.O, h.M, col, sim.comp);
    gl.bindVertexArray(buf.vao);
    for (const r of buf.runs) gl.drawArrays(gl.TRIANGLE_STRIP, r.start, r.count);
  }
}

/* 彗星 ------------------------------------------------------------------ */
function buildCometTail() {
  const h = sim.comet;
  const rAU = h.r;
  if (!APP.showComet || rAU > 6.5) return null;
  const act = clamp(Math.pow(3.0 / Math.max(0.32, rAU), 2.0), 0, 6.5);
  const w0 = h._world;
  const h2 = halleyState(sim.jd + 0.4);
  const w1 = compressWorld(h2.x, h2.y, h2.z, sim.comp);
  const vel = vnorm(vsub(w1, w0));
  const antiSun = vnorm(vmul(w0, -1));
  const lenIon = clamp(4.2 * act, 1.4, 26);
  const lenDust = lenIon * 0.76;
  const data = GEO.tailData;
  data.fill(0);
  let o = 0;
  const buildTail = (length, width, isDust, off) => {
    let oo = off;
    for (let i = 0; i < 26; i++) {
      const t = i / 25;
      let dir;
      if (!isDust) {
        dir = antiSun;
      } else {
        const d0 = vnorm(mixv(antiSun, vmul(vel, -1), 0.15 + 0.55 * t));
        dir = vnorm(vadd(d0, [0, -0.06 * t, 0]));
      }
      let p = vadd(w0, vmul(dir, length * t));
      if (isDust) {
        const side = vnorm(vcross(antiSun, vel));
        p = vadd(p, vmul(side, length * 0.10 * t * t));
      }
      const view = vnorm(vsub(CAM.pos, p));
      let across = vcross(dir, view);
      if (vlen(across) < 0.01) across = CAM.right;
      across = vnorm(across);
      const wd = width * (0.22 + 0.95 * t);
      for (let s = -1; s <= 1; s += 2) {
        data[oo++] = p[0] + across[0] * wd * s;
        data[oo++] = p[1] + across[1] * wd * s;
        data[oo++] = p[2] + across[2] * wd * s;
        data[oo++] = s;
        data[oo++] = t;
      }
    }
  };
  buildTail(lenIon, 0.28 + 0.65 * clamp(act / 4, 0, 1), false, 0);
  buildTail(lenDust, 0.55 + 1.15 * clamp(act / 4, 0, 1), true, 52 * 5);
  return { data, act, offsetDust: 52 * 5, count: 52 };
}

function drawComet() {
  if (!APP.showComet) return;
  const h = sim.comet;
  const tail = buildCometTail();
  const pr = PROG.tail;
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.disable(gl.CULL_FACE);
  if (tail) {
    gl.useProgram(pr.prog);
    umat(pr, 'uVP', CAM.vp);
    gl.bindVertexArray(GEO.tail.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, GEO.tail.buf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, tail.data.subarray(0, 520));
    gl.blendFunc(gl.ONE, gl.ONE);
    u3(pr, 'uColor', 0.48, 0.70, 1.0);
    u1(pr, 'uIntensity', 0.26 * clamp(tail.act / 4, 0.15, 1.2));
    u1(pr, 'uSunI', 1.0);
    u3(pr, 'uSunColor', 1, 1, 1);
    u1(pr, 'uTime', APP.visualTime);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 52);
    u3(pr, 'uColor', 1.0, 0.66, 0.38);
    u1(pr, 'uIntensity', 0.17 * clamp(tail.act / 4, 0.1, 1.1));
    gl.drawArrays(gl.TRIANGLE_STRIP, 52, 52);
  }
  // 彗发
  const prc = PROG.coma;
  gl.useProgram(prc.prog);
  gl.blendFunc(gl.ONE, gl.ONE);
  umat(prc, 'uVP', CAM.vp);
  u3v(prc, 'uCenter', h._world);
  u3v(prc, 'uRight', CAM.right);
  u3v(prc, 'uUp', CAM.up);
  const act = clamp(Math.pow(3.0 / Math.max(0.32, h.r), 2.0), 0, 5.0);
  u1(prc, 'uSize', 0.32 + 0.65 * Math.pow(clamp(act / 6, 0, 1), 0.7));
  u3(prc, 'uColor', 0.62, 0.86, 0.92);
  u1(prc, 'uIntensity', 0.10 + 0.22 * clamp(act / 5, 0, 1));
  u1(prc, 'uTime', APP.visualTime);
  gl.bindVertexArray(GEO.quad.vao);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* 太阳屏幕坐标与遮挡 ---------------------------------------------------- */
function updateSunScreen(dt) {
  const sp = projectWorld([0, 0, 0]);
  let vis = 0;
  if (sp && sp.ndcX > -1.0 && sp.ndcX < 1.0 && sp.ndcY > -1.0 && sp.ndcY < 1.0 && sp.ndcZ < 1.0) {
    vis = 1.0;
    const edge = Math.min(1 - Math.abs(sp.ndcX), 1 - Math.abs(sp.ndcY));
    vis *= smooth(edge / 0.12);
    const sunDist = vlen(CAM.pos);
    const bodies = [];
    for (const p of PLANETS) bodies.push([p._world, p._displayR]);
    for (const m of MOONS) bodies.push([m._world, m._displayR]);
    for (const b of bodies) {
      const d = vlen(vsub(b[0], CAM.pos));
      if (d < sunDist * 0.99) {
        const bp = projectWorld(b[0]);
        if (bp) {
          const rr = screenRadius(b[0], b[1]) * 1.05;
          const dd = Math.hypot(bp.x - sp.x, bp.y - sp.y);
          if (dd < rr) vis *= clamp(dd / Math.max(rr, 0.001), 0, 1) * 0.9;
        }
      }
    }
  }
  APP.sunVis = damp(APP.sunVis, vis, 7.0, dt);
  APP.sunUV = sp ? [sp.x / Math.max(1, RENDER.cssW), 1 - sp.y / Math.max(1, RENDER.cssH)] : [0.5, 0.5];
}

function drawOpaqueBodies() {
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.frontFace(gl.CCW);
  gl.disable(gl.BLEND);

  drawSunBody();
  for (const p of PLANETS) drawPlanetBody(p);
  if (APP.showMoons) {
    for (const m of MOONS) drawMoonBody(m);
  }
}

function drawTransparentPasses() {
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  drawAsteroids();

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  if (APP.showAtmo) {
    for (const p of PLANETS) {
      const cfg = ATMO_CFG[p.id];
      if (!cfg) continue;
      drawAtmosphere(p._world, p._displayR, p._basis, cfg, planetSunI(p));
    }
    if (APP.showMoons) {
      for (const m of MOONS) {
        if (m.id !== 'titan') continue;
        drawAtmosphere(m._world, m._displayR, m._basis,
          { color: [1.0, 0.55, 0.22], h: 0.045, s: 0.16 }, planetSunI(m.parentDef));
      }
    }
  }

  // 环系：普通 alpha 混合
  gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  for (const p of PLANETS) {
    const cfg = RING_CFG[p.id];
    if (cfg) drawRing(p, cfg);
  }

  drawComet();
  drawCorona();
  gl.disable(gl.BLEND);
}

function renderBloom() {
  const scene = RENDER.scene;
  if (!RENDER.bloom.length) return;
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.BLEND);
  let srcTex = scene.resolve.tex;
  let srcW = RENDER.w, srcH = RENDER.h;
  const p = PROG.down;
  gl.useProgram(p.prog);
  gl.bindVertexArray(GEO.empty);
  for (let i = 0; i < RENDER.bloom.length; i++) {
    const t = RENDER.bloom[i];
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
    gl.viewport(0, 0, t.w, t.h);
    bindTex(0, srcTex, p, 'uTex');
    u2(p, 'uTexel', (i === 0 ? 2.0 : 1.0) / srcW, (i === 0 ? 2.0 : 1.0) / srcH);
    ui(p, 'uPrefilter', i === 0 ? 1 : 0);
    u1(p, 'uThreshold', HDR ? 1.25 : 0.82);
    u1(p, 'uKnee', HDR ? 0.60 : 0.35);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    srcTex = t.tex; srcW = t.w; srcH = t.h;
  }
  const pu = PROG.up;
  gl.useProgram(pu.prog);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = RENDER.bloom.length - 1; i > 0; i--) {
    const src = RENDER.bloom[i];
    const dst = RENDER.bloom[i - 1];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0, 0, dst.w, dst.h);
    bindTex(0, src.tex, pu, 'uTex');
    u2(pu, 'uTexel', 1 / src.w, 1 / src.h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.disable(gl.BLEND);
}

function renderComposite() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, RENDER.w, RENDER.h);
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.disable(gl.CULL_FACE);
  const p = PROG.composite;
  gl.useProgram(p.prog);
  bindTex(0, RENDER.scene.resolve.tex, p, 'uScene');
  bindTex(1, RENDER.bloom.length ? RENDER.bloom[0].tex : RENDER.scene.resolve.tex, p, 'uBloom');
  u2(p, 'uRes', RENDER.w, RENDER.h);
  const sunUV = APP.sunUV || [0.5, 0.5];
  u2(p, 'uSunScreen', sunUV[0], sunUV[1]);
  u1(p, 'uSunVis', APP.showBloom ? APP.sunVis : 0);
  u1(p, 'uBloomStrength', APP.showBloom ? 0.28 : 0.0);
  u1(p, 'uExposure', 1.02);
  u1(p, 'uAspect', RENDER.w / Math.max(1, RENDER.h));
  u1(p, 'uTime', APP.visualTime);
  u1(p, 'uGrain', 0.012);
  gl.bindVertexArray(GEO.empty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function renderFrame(dt) {
  if (!RENDER.scene) resizeTargets();
  updateCamera(dt);
  updateSunScreen(dt);

  const scene = RENDER.scene;
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.msFBO);
  gl.viewport(0, 0, RENDER.w, RENDER.h);
  gl.depthMask(true);
  gl.clearColor(0, 0, 0, 1);
  gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  drawBackground();
  drawStars();
  drawOrbits();
  drawOpaqueBodies();
  drawTransparentPasses();

  if (scene.msaa) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, scene.msFBO);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, scene.resolve.fbo);
    gl.blitFramebuffer(0, 0, RENDER.w, RENDER.h, 0, 0, RENDER.w, RENDER.h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  if (APP.showBloom) renderBloom();
  renderComposite();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
/* =========================================================================
   18. 界面：目录、信息卡、标签

const AU_KM = 149597870.7;
const $ = id => document.getElementById(id);
const panelEl = $('infoScroll');
let panelId = null;
let lastLive = 0, lastTimeUI = 0, lastFpsUI = 0;

function fmtKm(km) {
  return Math.round(km).toLocaleString('en-US') + ' km';
}
function fmtAU(x) { return x.toFixed(4) + ' AU'; }
function fmtDeg(x) { return x.toFixed(2) + '°'; }
function fmtLight(au) {
  const s = au * 499.004784;
  if (s < 60) return s.toFixed(1) + ' 秒';
  if (s < 3600) {
    const m = Math.floor(s / 60), ss = Math.round(s - m * 60);
    return `${m} 分 ${ss} 秒`;
  }
  const h = Math.floor(s / 3600), m = Math.round((s - h * 3600) / 60);
  return `${h} 小时 ${m} 分`;
}
function fmtRot(h) {
  if (!h) return '—';
  const abs = Math.abs(h);
  const body = abs >= 48 ? (abs / 24).toFixed(2) + ' 天' : abs.toFixed(abs < 100 ? 1 : 0) + ' 小时';
  return body + (h < 0 ? ' · 逆行' : '');
}
function fmtPeriod(days) {
  if (days < 0) return Math.abs(days).toFixed(3) + ' 天 · 逆行';
  return days.toFixed(3) + ' 天';
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function childMoons(id) { return MOONS.filter(m => m.parent === id); }
function bodyKindEn(b) {
  if (b.kind === 'sun') return 'STAR';
  if (b.kind === 'moon') return 'MOON';
  if (b.kind === 'comet') return 'COMET';
  return b.type === '矮行星' ? 'DWARF PLANET' : 'PLANET';
}
function subtitleOf(b) {
  if (b.kind === 'sun') return 'G2V 主序星 · 太阳系质心';
  if (b.kind === 'moon') return `${b.parentDef.cn} 的卫星 · ${b.parentDef.en}`;
  if (b.kind === 'comet') return `周期彗星 · 约每 75.3 年回归`;
  if (b.id === 'pluto') return '柯伊伯带 · 3 : 2 海王星共振';
  return `轨道半长轴 ${b.el[0].toFixed(3)} AU · ${b.moonCount} 颗卫星`;
}
function orbVars(b) {
  if (b.orb) return `--oa:${b.orb[0]};--ob:${b.orb[1]};--oc:${b.orb[2]}`;
  if (b.kind === 'moon') {
    return `--oa:#f4f2ec;--ob:${b.color || '#b6b3aa'};--oc:#17181b`;
  }
  return `--oa:#e8f3ff;--ob:${b.color || '#7fa7c9'};--oc:#0a1018`;
}

function buildObjectList() {

function buildLabels() {
  const layer = $('labels');
  layer.innerHTML = '';
  const entries = [];
  const add = (id, small) => {
    const b = BODY_INDEX.get(id);
    if (!b) return;
    const el = document.createElement('div');
    el.className = 'lbl' + (small ? ' moon' : '');
    el.dataset.id = id;
    const col = b.color || '#dfe8f6';
    el.innerHTML = `<span class="ld" style="color:${col}"></span><span>${esc(b.cn)}</span>` +
      (small ? '' : `<small>${esc(b.en.toUpperCase())}</small>`);
    el.addEventListener('click', (e) => { e.stopPropagation(); selectBody(id, true); });
    layer.appendChild(el);
    entries.push({ id, el, small });
  };
  add('sun', false);
  for (const p of PLANETS) add(p.id, false);
  for (const m of MOONS) add(m.id, true);
  add('halley', false);
  APP.labelEls = entries;
  for (const e of entries) {
    const r = e.el.getBoundingClientRect();
    e.w = r.width || (e.small ? 50 : 80);
    e.h = r.height || 16;
  }
}

function updateLabels() {
  if (!APP.showNames) {
    for (const e of APP.labelEls) e.el.style.display = 'none';
    return;
  }
  const placed = [];
  const order = [];
  const elById = {};
  for (const e of APP.labelEls) elById[e.id] = e;
  if (elById[APP.selected]) order.push(elById[APP.selected]);
  const primary = ['sun', 'jupiter', 'saturn', 'earth', 'venus', 'mars', 'mercury', 'uranus', 'neptune', 'pluto', 'halley'];
  for (const id of primary) if (elById[id] && !order.includes(elById[id])) order.push(elById[id]);
  for (const e of APP.labelEls) if (!order.includes(e)) order.push(e);

  for (const e of order) {
    const b = BODY_INDEX.get(e.id);
    if (e.small && !APP.showMoons) { e.el.style.display = 'none'; continue; }
    if (e.id === 'halley' && !APP.showComet) { e.el.style.display = 'none'; continue; }
    const world = bodyWorldPos(e.id);
    const sp = projectWorld(world);
    if (!sp || sp.ndcX < -1.08 || sp.ndcX > 1.08 || sp.ndcY < -1.08 || sp.ndcY > 1.08) {
      e.el.style.display = 'none';
      continue;
    }
    const sr = screenRadius(world, bodyDisplayRadius(e.id));
    if (e.small && sr < 0.30) { e.el.style.display = 'none'; continue; }
    if (!e.w) { e.w = e.el.offsetWidth || 70; e.h = e.el.offsetHeight || 16; }
    const off = Math.min(64, sr + (e.small ? 11 : 16));
    const x = clamp(sp.x, e.w * 0.5 + 6, window.innerWidth - e.w * 0.5 - 6);
    const baseY = clamp(sp.y - off, e.h * 0.5 + 4, window.innerHeight - e.h * 0.5 - 4);
    const shifts = e.small ? [0] : [0, -17, 17, -34, 34, -51, 51];
    let chosen = null;
    for (const sh of shifts) {
      const y = clamp(baseY + sh, e.h * 0.5 + 4, window.innerHeight - e.h * 0.5 - 4);
      const box = { l: x - e.w * 0.5, r: x + e.w * 0.5, t: y - e.h * 0.5, b: y + e.h * 0.5 };
      let overlap = false;
      for (const p of placed) {
        if (box.l < p.r + 4 && box.r > p.l - 4 && box.t < p.b + 2 && box.b > p.t - 2) { overlap = true; break; }
      }
      if (!overlap || APP.selected === e.id) { chosen = { x, y, box }; break; }
    }
    if (!chosen) { e.el.style.display = 'none'; continue; }
    placed.push(chosen.box);
    const alpha = e.small ? clamp(0.22 + sr / 7, 0.18, 0.82) : clamp(0.36 + sr / 9, 0.30, 1.0);
    e.el.style.display = 'flex';
    e.el.style.opacity = (APP.selected === e.id ? Math.min(1, alpha + 0.2) : alpha).toFixed(3);
    e.el.style.transform = `translate3d(${chosen.x.toFixed(1)}px,${chosen.y.toFixed(1)}px,0) translate(-50%,-50%)`;
    e.el.classList.toggle('sel', APP.selected === e.id);
  }
}
