function setK(k, text) {
  const el = panelEl.querySelector(`[data-k="${k}"]`);
  if (el) el.textContent = text;
}

function updateInfoLive(force) {
  if (!panelId) return;
  const t = performance.now();
  if (!force && t - lastLive < 95) return;
  lastLive = t;
  const b = BODY_INDEX.get(panelId);
  if (!b) return;
  const e = sim.earth;
  if (b.kind === 'planet') {
    const p = b;
    const dx = p._hx - e._hx, dy = p._hy - e._hy, dz = p._hz - e._hz;
    const ed = Math.hypot(dx, dy, dz);
    setK('dist', fmtAU(p._r));
    setK('lon', fmtDeg(p._lon));
    setK('lat', fmtDeg(p._lat));
    setK('edist', p.id === 'earth' ? '本体' : fmtAU(ed));
    setK('light', p.id === 'earth' ? '—' : fmtLight(ed));
    setK('speed', p._vel.toFixed(2) + ' km/s');
    setK('peri', p._a * (1 - p._e) > 0 ? (p._a * (1 - p._e)).toFixed(3) + ' AU' : '—');
    setK('apo', (p._a * (1 + p._e)).toFixed(3) + ' AU');
    setK('ecc', p._e.toFixed(5));
    setK('inc', (p._I * R2D).toFixed(3) + '°');
    return;
  }
  if (b.kind === 'sun') {
    const ed = e._r;
    setK('edist', fmtAU(ed));
    setK('light', fmtLight(ed));
    setK('slon', fmtDeg((e._lon + 180) % 360));
    const ang = 2 * Math.atan(696340 / (ed * AU_KM)) * R2D * 60;
    setK('diam', ang.toFixed(1) + '′');
    return;
  }
  if (b.kind === 'moon') {
    const pd = b.parentDef;
    const ed = pd._r;
    setK('parent', pd.cn);
    setK('aorb', fmtKm(b.aKm));
    setK('period', fmtPeriod(b.period));
    setK('inc', b.inc.toFixed(3) + '°');
    setK('edist', fmtAU(ed) + '（母星）');
    setK('light', fmtLight(ed));
    return;
  }
  if (b.kind === 'comet') {
    const h = sim.comet;
    const dx = h.x - e._hx, dy = h.y - e._hy, dz = h.z - e._hz;
    const ed = Math.hypot(dx, dy, dz);
    setK('dist', fmtAU(h.r));
    setK('lon', fmtDeg(h.lon));
    setK('lat', fmtDeg(h.lat));
    setK('edist', fmtAU(ed));
    setK('light', fmtLight(ed));
    setK('speed', h.vel.toFixed(2) + ' km/s');
    setK('peri', (b.a * (1 - b.e)).toFixed(3) + ' AU');
    setK('apo', (b.a * (1 + b.e)).toFixed(3) + ' AU');
    return;
  }
}

/* =========================================================================
   19. 选择、聚焦与拾取
   ========================================================================= */
function selectBody(id, zoom) {
  if (!BODY_INDEX.get(id)) return;
  APP.selected = id;
  APP.focus = id;
  const r = bodyDisplayRadius(id);
  if (zoom) {
    let d;
    if (id === 'sun') d = 58;
    else if (id === 'halley') d = 24;
    else if (MOON_BY_ID[id]) d = Math.max(0.75, r * 9.5);
    else d = Math.max(1.7, r * 8.2);
    CAM.distGoal = d;
  }
  CAM.minDist = Math.max(0.055, r * 1.15);
  if (zoom) maybeAutoOrient(id);
  buildInfo(id);
  refreshListActive();
  refreshLabelActive();
  hideHint();
}

function pickBodyAt(cx, cy) {
  const candidates = [];
  const add = (id) => {
    const world = bodyWorldPos(id);
    const sp = projectWorld(world);
    if (!sp) return;
    if (sp.ndcX < -1 || sp.ndcX > 1 || sp.ndcY < -1 || sp.ndcY > 1) return;
    const sr = screenRadius(world, bodyDisplayRadius(id));
    const d = Math.hypot(sp.x - cx, sp.y - cy);
    const thr = Math.max(11, sr * 1.08 + 4);
    if (d < thr) candidates.push({ id, score: d / thr, sr });
  };
  add('sun');
  for (const p of PLANETS) add(p.id);
  if (APP.showMoons) for (const m of MOONS) add(m.id);
  if (APP.showComet) add('halley');
  candidates.sort((a, b) => a.score - b.score || b.sr - a.sr);
  return candidates.length ? candidates[0].id : null;
}

/* =========================================================================
   20. 事件绑定
   ========================================================================= */
let hintHidden = false;
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  const h = $('hint');
  if (h) h.classList.add('out');
}
let toastTimer = 0;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2100);
}

function bindEvents() {
  const slider = $('speedSlider');
  slider.addEventListener('input', () => {
    sim.rateSlider = parseFloat(slider.value);
    updateSpeedText();
    hideHint();
  });
  $('playBtn').addEventListener('click', togglePlay);
  $('nowBtn').addEventListener('click', () => {
    sim.jd = nowJD();
    initSpin(sim.jd);
    updateEphemeris(sim.jd);
    updateDateUI(true);
    updateInfoLive(true);
    toast('已跳回当前时刻');
    hideHint();
  });

  const toggles = [
    ['tgOrbit', 'showOrbit'], ['tgNames', 'showNames'], ['tgMoons', 'showMoons'],
    ['tgBelt', 'showBelt'], ['tgComet', 'showComet'], ['tgBloom', 'showBloom'],
    ['tgAtmo', 'showAtmo']
  ];
  for (const [elId, key] of toggles) {
    const el = $(elId);
    el.checked = APP[key];
    el.addEventListener('change', () => {
      APP[key] = el.checked;
      if (key === 'showNames' && !el.checked) {
        // 隐藏后仍然保留标签，但 updateLabels 会处理显示
      }
      hideHint();
    });
  }
  const real = $('tgReal');
  real.checked = APP.realDist;
  real.addEventListener('change', () => {
    APP.realDist = real.checked;
    sim.compTarget = APP.realDist ? COMPRESS_REAL : COMPRESS_BASE;
    if (APP.focus === 'sun') {
      if (APP.realDist) {
        APP.preRealDist = CAM.distGoal;
        CAM.distGoal = Math.max(CAM.distGoal, 1080);
      } else if (APP.preRealDist) {
        CAM.distGoal = APP.preRealDist;
        APP.preRealDist = 0;
      }
    }
    toast(APP.realDist ? '真实距离比例 · 0.4 秒过渡 · 角位置不变' : '压缩距离比例 · 角位置不变');
    hideHint();
  });

  // 指针拖拽 / 拾取 / 缩放
  const pointers = new Map();
  let drag = null;
  let pinch = null;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      CAM.autoRot = null;
      drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: 0, t: performance.now() };
      canvas.classList.add('dragging');
    } else if (pointers.size === 2) {
      const pts = [...pointers.values()];
      pinch = { d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), dist: CAM.distGoal };
      drag = null;
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && pinch) {
      const pts = [...pointers.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (d > 1) {
        CAM.distGoal = clamp(pinch.dist * pinch.d / d, CAM.minDist, CAM.maxDist);
      }
      return;
    }
    if (drag) {
      const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      drag.moved += Math.abs(dx) + Math.abs(dy);
      CAM.yaw -= dx * 0.0048;
      CAM.pitch = clamp(CAM.pitch + dy * 0.0042, -1.48, 1.48);
      hideHint();
    }
  });
  const endPointer = (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) canvas.classList.remove('dragging');
    if (drag && e.type === 'pointerup' && drag.moved < 6 && performance.now() - drag.t < 520) {
      const id = pickBodyAt(e.clientX, e.clientY);
      if (id) selectBody(id, true);
    }
    if (pointers.size === 0) drag = null;
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const k = Math.exp(clamp(e.deltaY, -120, 120) * 0.0012);
    CAM.distGoal = clamp(CAM.distGoal * k, CAM.minDist, CAM.maxDist);
    hideHint();
  }, { passive: false });

  canvas.addEventListener('dblclick', () => {
    selectBody('sun', false);
    const targetYaw = 3.086;
    const dy = ((targetYaw - CAM.yaw + Math.PI) % TAU + TAU) % TAU - Math.PI;
    CAM.autoRot = { fromYaw: CAM.yaw, toYaw: CAM.yaw + dy, fromPitch: CAM.pitch, toPitch: 0.18, t: 0, dur: 1.25 };
    CAM.distGoal = 250;
    UI.toast('全景视角');
  });

  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.code === 'Space') {
      e.preventDefault(); togglePlay();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      const d = e.key === 'ArrowLeft' ? -3 : 3;
      const v = clamp(sim.rateSlider + d, -100, 100);
      sim.rateSlider = v;
      $('speedSlider').value = String(v);
      updateSpeedText();
      toast('时间流速 · ' + formatRate(daysPerSecond(v)));
    } else if (e.key === 'h' || e.key === 'H') {
      document.body.classList.toggle('hide-ui');
    } else if (e.key === 'Escape') {
      document.body.classList.remove('hide-ui');
    }
  });

  window.addEventListener('resize', () => {
    resizeTargets();
  });

  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    reportError('WebGL 上下文丢失，请刷新页面。');
    $('loadStatus').textContent = 'WebGL 上下文丢失';
    $('loading').classList.remove('done');
  });
}

function togglePlay() {
  sim.playing = !sim.playing;
  const btn = $('playBtn');
  btn.classList.toggle('playing', sim.playing);
  toast(sim.playing ? '继续播放' : '已暂停');
  hideHint();
}

function updateSpeedText() {
  const dps = daysPerSecond(sim.rateSlider);
  $('speedText').textContent = formatRate(dps);
}

/* =========================================================================
   21. 时间与状态刷新
   ========================================================================= */
function outOfRange(jd) {
  const y = new Date(unixFromJD(jd)).getUTCFullYear();
  return y < 1800 || y > 2050;
}
function updateDateUI(force) {
  const now = performance.now();
  if (!force && now - lastTimeUI < 90) return;
  lastTimeUI = now;
  $('dateText').textContent = formatDateUTC(sim.jd);
  const T = (sim.jd - J2000) / 36525;
  $('jdText').textContent = `JD ${formatJD(sim.jd)} · T ${T >= 0 ? '+' : ''}${T.toFixed(4)} 世纪`;
  const warn = $('warnBadge');
  if (outOfRange(sim.jd)) warn.classList.remove('hidden');
  else warn.classList.add('hidden');
}

const UI = { toast };

function updateFpsUI() {
  const el = $('fps');
  if (el) el.textContent = `${Math.round(APP.fps)} FPS · ${RENDER.w}×${RENDER.h}`;
}

/* =========================================================================
   22. 主循环
   ========================================================================= */
let lastFrame = 0;
let perfAcc = 0, perfN = 0, perfTime = 0, startedAt = 0, lastQualityAt = 0;
let ADAPTIVE = true;

function adaptQuality(dt, now) {
  if (!ADAPTIVE) return;
  if (!startedAt) startedAt = now;
  if (now - startedAt < 2400) return;
  perfAcc += dt * 1000;
  perfN++;
  perfTime += dt;
  if (perfTime < 1.2) return;
  const avg = perfAcc / Math.max(1, perfN);
  perfAcc = 0; perfN = 0; perfTime = 0;
  if (now - lastQualityAt < 1600) return;
  if (avg > 19.5 && RENDER.quality > 0.58) {
    RENDER.quality = Math.max(0.58, RENDER.quality - 0.075);
    lastQualityAt = now;
    resizeTargets();
  } else if (avg > 23 && RENDER.quality <= 0.59 && RENDER.samples > 2) {
    RENDER.samples = 2;
    if (RENDER.scene) { destroySceneTarget(RENDER.scene); RENDER.scene = null; }
    lastQualityAt = now;
    resizeTargets();
  } else if (avg < 13.4 && RENDER.quality < 1.0) {
    RENDER.quality = Math.min(1.0, RENDER.quality + 0.04);
    lastQualityAt = now;
    resizeTargets();
  }
}

function loop(now) {
  requestAnimationFrame(loop);
  if (!lastFrame) lastFrame = now;
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);

  if (sim.playing) {
    const dps = daysPerSecond(sim.rateSlider);
    sim.jd += dps * dt;
    APP.visualTime += dt;
  }
  // 真实距离比例动画
  sim.comp = damp(sim.comp, sim.compTarget, 10.5, dt);
  if (Math.abs(sim.comp - sim.compTarget) < 2e-4) sim.comp = sim.compTarget;

  if (window.innerWidth !== RENDER.cssW || window.innerHeight !== RENDER.cssH) resizeTargets();
  updateSpins(sim.jd);
  updateEphemeris(sim.jd);

  renderFrame(dt);
  updateLabels();
  updateInfoLive(false);
  updateDateUI(false);

  const inst = dt > 0 ? 1 / dt : 60;
  APP.fps = APP.fps * 0.92 + inst * 0.08;
  APP.frameMs = APP.frameMs * 0.9 + dt * 1000 * 0.1;
  if (now - lastFpsUI > 500) {
    lastFpsUI = now;
    updateFpsUI();
  }
  adaptQuality(dt, now);
}

/* =========================================================================
   23. 启动
   ========================================================================= */
async function boot() {
  try {
    updateStatus('计算初始星历…', 4);
    sim.jd = nowJD();
    sim.compTarget = COMPRESS_BASE;
    sim.comp = COMPRESS_BASE;
    initSpin(sim.jd);
    updateEphemeris(sim.jd);

    const dpr0 = Math.max(1, window.devicePixelRatio || 1);
    const basePx = Math.max(1, window.innerWidth * window.innerHeight) * dpr0 * dpr0;
    const targetPx = window.innerWidth * window.innerHeight > 1200 * 800 ? 2.55e6 : 1.9e6;
    RENDER.quality = clamp(Math.sqrt(targetPx / basePx), 0.58, 1.0);
    await initResources();
    resizeTargets();

    buildObjectList();
    buildLabels();
    bindEvents();
    selectBody('sun', false);
    updateSpeedText();
    updateDateUI(true);
    updateInfoLive(true);
    updateFpsUI();

    requestAnimationFrame((t) => {
      lastFrame = 0;
      loop(t);
      setTimeout(() => {
        $('loadFill').style.width = '100%';
        $('loading').classList.add('done');
      }, 520);
      setTimeout(() => $('hint').classList.add('out'), 9000);
    });
  } catch (e) {
    reportError('初始化失败：' + (e && e.stack ? e.stack : e));
    $('loadStatus').textContent = '初始化失败 · 请查看下方错误';
  }
}

/* 调试 / 验收 API ------------------------------------------------------- */
function readScenePixel(cssX, cssY) {
  const fx = clamp(Math.floor(cssX * RENDER.w / Math.max(1, RENDER.cssW)), 0, RENDER.w - 1);
  const fy = clamp(Math.floor(cssY * RENDER.h / Math.max(1, RENDER.cssH)), 0, RENDER.h - 1);
  const buf = HDR ? new Float32Array(4) : new Uint8Array(4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, RENDER.scene.resolve.fbo);
  gl.readPixels(fx, RENDER.h - 1 - fy, 1, 1, gl.RGBA, HDR ? gl.FLOAT : gl.UNSIGNED_BYTE, buf);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return Array.from(buf);
}

window.__solar = {
  sim, APP, CAM, PLANETS, MOONS, HALLEY, BODY_INDEX, RENDER, PROG,
  setJD(jd) {
    sim.jd = jd;
    initSpin(jd);
    updateEphemeris(jd);
    updateDateUI(true);
    updateInfoLive(true);
  },
  setDate(iso) {
    const ms = Date.parse(iso);
    if (isFinite(ms)) this.setJD(jdFromUnix(ms));
    return formatDateUTC(sim.jd);
  },
  setQuality(q) {
    RENDER.quality = clamp(q, 0.35, 1.25);
    resizeTargets();
    return [RENDER.w, RENDER.h];
  },
  setMSAA(n) {
    RENDER.samples = Math.max(1, Math.min(4, n | 0));
    if (RENDER.scene) { destroySceneTarget(RENDER.scene); RENDER.scene = null; }
    resizeTargets();
    return RENDER.scene ? RENDER.scene.samples : 0;
  },
  setAdaptive(on) { ADAPTIVE = !!on; },
  setPaused(p) { sim.playing = !p; $('playBtn').classList.toggle('playing', sim.playing); },
  setRate(v) { sim.rateSlider = clamp(v, -100, 100); $('speedSlider').value = String(sim.rateSlider); updateSpeedText(); },
  select: (id) => selectBody(id, true),
  readPixel: readScenePixel,
  glError() { return gl.getError(); },
  errors: APP_ERRORS,
  check() {
    const e = sim.earth;
    const sat = PLANET_BY_ID.saturn;
    const tilt = ROT.saturn.tilt * D2R, pl = ROT.saturn.poleLon * D2R;
    const axis = vnorm(eclToWorld(Math.sin(tilt) * Math.cos(pl), Math.sin(tilt) * Math.sin(pl), Math.cos(tilt)));
    const sunDir = vnorm(vmul(sat._world, -1));
    const ringElev = Math.asin(clamp(vdot(sunDir, axis), -1, 1)) * R2D;
    return {
      date: formatDateUTC(sim.jd),
      earthR: e._r, earthLon: e._lon, earthLat: e._lat, earthSpeed: e._vel,
      earthToSunLightMin: e._r * 499.004784 / 60,
      saturnR: sat._r, saturnSpeed: sat._vel, saturnRingSunElev: ringElev,
      neptuneR: PLANET_BY_ID.neptune._r,
      comp: sim.comp,
      sunVis: APP.sunVis,
      fps: APP.fps,
      glError: gl.getError()
    };
  },
  bodyScreen(id) {
    const world = bodyWorldPos(id);
    const sp = projectWorld(world);
    return sp ? { ...sp, r: bodyDisplayRadius(id), sr: screenRadius(world, bodyDisplayRadius(id)), world } : null;
  }
};

boot();
</script>
