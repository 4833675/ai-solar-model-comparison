<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>太阳系 · 实时轨道模型</title>
<style>
  :root {
    --ink: #f2f6ff;
    --muted: #8996aa;
    --line: rgba(174, 207, 255, .15);
    --glass: rgba(6, 12, 25, .64);
    --glass-strong: rgba(7, 14, 29, .84);
    --cyan: #78dff7;
    --gold: #ffc86b;
    --violet: #9d93ff;
    --danger: #ff9a91;
    --panel-blur: 22px;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #010207; color: var(--ink); }
  body {
    font-family: "Avenir Next", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: .01em;
  }
  button, input { font: inherit; color: inherit; }
  button { border: 0; }
  #app { position: relative; width: 100%; height: 100%; isolation: isolate; background: #010207; }
  #glCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #glCanvas:active { cursor: grabbing; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .body-label {
    position: absolute;
    transform: translate(10px, -50%);
    color: rgba(232, 242, 255, .84);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .14em;
    text-shadow: 0 1px 8px #000, 0 0 12px rgba(89, 190, 255, .35);
    white-space: nowrap;
    transition: opacity .18s ease;
  }
  .body-label::before {
    content: "";
    position: absolute;
    width: 5px; height: 5px; border-radius: 50%;
    left: -10px; top: 50%; transform: translateY(-50%);
    border: 1px solid currentColor;
    opacity: .62;
  }
  .body-label.selected { color: #fff5d7; text-shadow: 0 0 12px rgba(255, 202, 99, .9); }
  .glass {
    background: linear-gradient(135deg, rgba(15, 27, 50, .76), var(--glass));
    border: 1px solid var(--line);
    box-shadow: 0 18px 55px rgba(0, 0, 0, .26), inset 0 1px 0 rgba(255,255,255,.025);
    backdrop-filter: blur(var(--panel-blur)) saturate(125%);
    -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(125%);
  }
  .eyebrow {
    color: var(--cyan);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .28em;
    text-transform: uppercase;
  }
  .brand {
    position: absolute;
    left: 26px; top: 22px;
    display: flex; align-items: center; gap: 12px;
    z-index: 5; pointer-events: none;
  }
  .brand-mark {
    width: 30px; height: 30px; position: relative;
    border: 1px solid rgba(255, 210, 119, .4); border-radius: 50%;
    box-shadow: inset 0 0 14px rgba(255, 180, 55, .12);
  }
  .brand-mark::before {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: #ffd27e; box-shadow: 0 0 14px #ffb43d, 0 0 32px rgba(255, 148, 35, .46);
  }
  .brand-mark::after {
    content: ""; position: absolute; left: -6px; right: -6px; top: 14px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(137, 220, 255, .55), transparent);
    transform: rotate(-17deg);
  }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: .18em; }
  .brand p { margin: 3px 0 0; color: var(--muted); font: 9px/1.2 ui-monospace, "SFMono-Regular", monospace; letter-spacing: .16em; }
  #bodyPanel {
    position: absolute; z-index: 6; left: 20px; top: 78px; bottom: 96px; width: 206px;
    border-radius: 14px; padding: 14px 9px 12px; overflow: auto; scrollbar-width: thin;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 11px; }
  .panel-head small { color: var(--muted); font: 9px ui-monospace, monospace; }
  .body-group { margin-top: 4px; }
  .group-title {
    padding: 9px 9px 5px;
    color: rgba(149, 170, 200, .72);
    font-size: 8px; font-weight: 500; letter-spacing: .24em;
  }
  .body-button {
    width: 100%; min-height: 31px; padding: 5px 9px;
    display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 8px;
    color: #bbc6d7; background: transparent; border-radius: 8px;
    text-align: left; font-size: 11px; letter-spacing: .08em; cursor: pointer;
    transition: background .16s ease, color .16s ease, transform .16s ease;
  }
  .body-button:hover { background: rgba(125, 181, 239, .08); color: #edf5ff; }
  .body-button:focus-visible { outline: 1px solid var(--cyan); outline-offset: -1px; }
  .body-button.active { background: linear-gradient(90deg, rgba(102, 199, 240, .16), rgba(102, 199, 240, .035)); color: #fff; }
  .body-button.moon { padding-left: 24px; color: #8e9aac; font-size: 10px; }
  .body-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot, #a8b8cb); box-shadow: 0 0 8px color-mix(in srgb, var(--dot) 70%, transparent); }
  .body-distance { font: 8px ui-monospace, monospace; color: #6e7d92; letter-spacing: .02em; }
  #infoPanel {
    position: absolute; z-index: 6; right: 20px; top: 20px; width: 306px; max-height: calc(100% - 156px);
    border-radius: 16px; overflow: auto; padding: 18px 18px 16px; scrollbar-width: thin;
  }
  .info-kicker { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #infoClass { color: #74859b; font: 9px ui-monospace, monospace; letter-spacing: .13em; }
  #infoName {
    margin: 8px 0 1px; font-family: "Iowan Old Style", "Songti SC", serif;
    font-size: 34px; font-weight: 400; letter-spacing: .09em;
  }
  #infoLatin { margin: 0; color: #77879b; font: 10px ui-monospace, monospace; letter-spacing: .16em; }
  .live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 18px; margin: 18px 0 14px; }
  .metric { padding: 9px 0; border-top: 1px solid rgba(161, 194, 233, .1); min-width: 0; }
  .metric-label { color: #718196; font-size: 8px; letter-spacing: .18em; }
  .metric-value {
    margin-top: 4px; color: #e8f4ff; font: 12px/1.25 ui-monospace, "SFMono-Regular", monospace;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .data-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 10px; }
  .data-table td { border-top: 1px solid rgba(161, 194, 233, .09); padding: 7px 0; vertical-align: top; }
  .data-table td:first-child { color: #6f8097; width: 43%; letter-spacing: .08em; }
  .data-table td:last-child { color: #c7d1df; text-align: right; font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  #infoText { margin: 15px 0 0; color: #9aa8ba; font-size: 10px; line-height: 1.75; text-align: justify; }
  .section-label { margin: 14px 0 6px; color: var(--cyan); font-size: 8px; letter-spacing: .22em; }
  #timeDock {
    position: absolute; z-index: 7; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(620px, calc(100% - 520px)); min-width: 420px; border-radius: 15px;
    display: grid; grid-template-columns: auto minmax(160px, 1fr) auto; align-items: center; gap: 12px;
    padding: 10px 12px;
  }
  .icon-button, .quiet-button {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 32px; border-radius: 9px; cursor: pointer;
    background: rgba(139, 184, 231, .075); border: 1px solid rgba(158, 196, 239, .12);
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .icon-button { width: 34px; font-size: 13px; }
  .quiet-button { padding: 0 11px; color: #aab8c9; font-size: 9px; letter-spacing: .12em; }
  .icon-button:hover, .quiet-button:hover { background: rgba(139, 197, 247, .14); border-color: rgba(158, 213, 255, .24); }
  .icon-button:active, .quiet-button:active { transform: scale(.97); }
  button:focus-visible, input:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
  .time-main { min-width: 0; }
  .time-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #dateInput {
    width: 184px; max-width: 55%; padding: 0; border: 0; background: transparent;
    color: #e6eef9; font: 11px ui-monospace, monospace; font-variant-numeric: tabular-nums;
    color-scheme: dark;
  }
  #speedReadout { color: var(--gold); font: 9px ui-monospace, monospace; white-space: nowrap; }
  #speedRange { width: 100%; height: 18px; margin: 3px 0 0; accent-color: #9bdcf5; }
  #viewDock {
    position: absolute; z-index: 7; right: 20px; bottom: 18px; width: 306px; border-radius: 14px;
    padding: 11px 13px;
  }
  .toggle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; margin-top: 9px; }
  .toggle { display: flex; align-items: center; gap: 6px; color: #99a7ba; font-size: 9px; letter-spacing: .06em; cursor: pointer; white-space: nowrap; }
  .toggle input { appearance: none; width: 22px; height: 12px; border-radius: 8px; background: rgba(126, 148, 178, .22); border: 1px solid rgba(168, 198, 235, .16); position: relative; transition: .18s ease; }
  .toggle input::after { content: ""; position: absolute; width: 6px; height: 6px; left: 2px; top: 2px; border-radius: 50%; background: #8695a7; transition: .18s ease; }
  .toggle input:checked { background: rgba(92, 197, 232, .3); border-color: rgba(111, 215, 248, .44); }
  .toggle input:checked::after { left: 12px; background: #c5f4ff; box-shadow: 0 0 7px #72ddfa; }
  #scaleNotice {
    position: absolute; z-index: 4; left: 50%; top: 22px; transform: translateX(-50%);
    color: rgba(175, 192, 213, .62); font-size: 9px; letter-spacing: .09em; text-align: center;
    pointer-events: none;
  }
  #validityWarning { color: var(--danger); display: none; margin-left: 8px; }
  #status {
    position: absolute; left: 24px; bottom: 24px; z-index: 5;
    color: rgba(130, 149, 174, .66); font: 8px ui-monospace, monospace; letter-spacing: .09em;
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  #help {
    position: absolute; left: 241px; bottom: 100px; z-index: 4;
    color: rgba(142, 157, 181, .55); font-size: 8px; letter-spacing: .08em; pointer-events: none;
  }
  #webglError {
    display: none; position: absolute; inset: 0; z-index: 20; place-items: center; padding: 30px;
    background: radial-gradient(circle, #111a2b, #02040a 65%); text-align: center;
  }
  #webglError strong { display: block; font-size: 22px; margin-bottom: 10px; }
  .mobile-tab { display: none; position: absolute; top: 18px; z-index: 9; }
  #mobileBodies { left: 18px; }
  #mobileInfo { right: 18px; }
  .ui-hidden .ui-layer { opacity: 0 !important; pointer-events: none !important; }
  .ui-layer { transition: opacity .2s ease; }
  @media (max-width: 1120px) {
    #timeDock { width: min(520px, calc(100% - 468px)); }
    #infoPanel, #viewDock { width: 278px; }
    #bodyPanel { width: 184px; }
  }
  @media (max-width: 850px) {
    .brand { left: 64px; top: 20px; }
    .mobile-tab { display: inline-flex; width: auto; padding: 0 10px; }
    #bodyPanel { left: 12px; top: 58px; bottom: 220px; transform: translateX(calc(-100% - 20px)); transition: transform .2s ease; }
    #infoPanel { right: 12px; top: 58px; bottom: 220px; max-height: none; transform: translateX(calc(100% + 20px)); transition: transform .2s ease; }
    body.show-bodies #bodyPanel { transform: translateX(0); }
    body.show-info #infoPanel { transform: translateX(0); }
    #viewDock { right: 12px; bottom: 98px; width: min(320px, calc(100% - 24px)); }
    #timeDock { left: 12px; right: 12px; bottom: 12px; width: auto; min-width: 0; transform: none; }
    #status { display: none; }
    #help { display: none; }
    #scaleNotice { top: 62px; max-width: calc(100% - 40px); }
  }
  @media (max-width: 520px) {
    .brand h1 { font-size: 13px; }
    .brand p { display: none; }
    .brand-mark { width: 26px; height: 26px; }
    .brand-mark::before { inset: 8px; }
    #viewDock { padding: 9px 11px; }
    .toggle-grid { grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 7px; }
    .toggle { flex-direction: column; gap: 3px; font-size: 8px; }
    #timeDock { grid-template-columns: auto 1fr auto; gap: 7px; }
    #dateInput { width: 152px; max-width: 66%; font-size: 9px; }
    .quiet-button { padding: 0 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<main id="app">
  <canvas id="glCanvas" aria-label="可交互太阳系三维实时模型"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <div class="brand ui-layer">
    <div class="brand-mark"></div>
    <div><h1>太阳系</h1><p>HELIOCENTRIC LIVE MODEL</p></div>
  </div>

  <button id="mobileBodies" class="mobile-tab quiet-button glass ui-layer" type="button">天体</button>
  <button id="mobileInfo" class="mobile-tab quiet-button glass ui-layer" type="button">数据</button>

  <aside id="bodyPanel" class="glass ui-layer" aria-label="天体列表">
    <div class="panel-head"><span class="eyebrow">天体导航</span><small>选择聚焦</small></div>
    <div id="bodyList"></div>
  </aside>

  <aside id="infoPanel" class="glass ui-layer" aria-live="polite">
    <div class="info-kicker"><span class="eyebrow">观测档案</span><span id="infoClass"></span></div>
    <h2 id="infoName">太阳</h2>
    <p id="infoLatin">SOL</p>
    <div class="section-label">实时轨道数据</div>
    <div class="live-grid">
      <div class="metric"><div class="metric-label">日心距离</div><div class="metric-value" id="mHelio">—</div></div>
      <div class="metric"><div class="metric-label">与地球距离</div><div class="metric-value" id="mEarth">—</div></div>
      <div class="metric"><div class="metric-label">黄经 / 黄纬</div><div class="metric-value" id="mLonLat">—</div></div>
      <div class="metric"><div class="metric-label">光行时间</div><div class="metric-value" id="mLight">—</div></div>
      <div class="metric"><div class="metric-label">近日点 / 远日点</div><div class="metric-value" id="mApsides">—</div></div>
      <div class="metric"><div class="metric-label">轨道速度</div><div class="metric-value" id="mVelocity">—</div></div>
    </div>
    <div class="section-label">物理参数</div>
    <table class="data-table"><tbody id="staticData"></tbody></table>
    <p id="infoText"></p>
  </aside>

  <div id="scaleNotice" class="ui-layer">径向距离采用幂律压缩 · 角位置与轨道相位保持真实 <span id="validityWarning">已超出根数有效区间（外推）</span></div>

  <section id="timeDock" class="glass ui-layer" aria-label="时间控制">
    <button id="playButton" class="icon-button" type="button" aria-label="暂停">Ⅱ</button>
    <div class="time-main">
      <div class="time-row">
        <input id="dateInput" type="datetime-local" step="1" aria-label="UTC 日期时间">
        <output id="speedReadout">实时 · 1 秒/秒</output>
      </div>
      <input id="speedRange" type="range" min="-100" max="100" step="1" value="0" aria-label="时间速度">
    </div>
    <button id="nowButton" class="quiet-button" type="button">此刻 UTC</button>
  </section>

  <section id="viewDock" class="glass ui-layer" aria-label="显示设置">
    <div class="eyebrow">显示图层</div>
    <div class="toggle-grid">
      <label class="toggle"><input id="toggleOrbits" type="checkbox" checked>轨道</label>
      <label class="toggle"><input id="toggleLabels" type="checkbox" checked>名称</label>
      <label class="toggle"><input id="toggleMoons" type="checkbox" checked>卫星</label>
      <label class="toggle"><input id="toggleBelts" type="checkbox" checked>小天体</label>
      <label class="toggle"><input id="toggleComet" type="checkbox" checked>彗星</label>
      <label class="toggle"><input id="toggleReal" type="checkbox">真实距离</label>
      <label class="toggle"><input id="toggleBloom" type="checkbox" checked>辉光</label>
    </div>
  </section>

  <div id="status" class="ui-layer">WEBGL2 · 初始化中</div>
  <div id="help" class="ui-layer">拖拽旋转 · 滚轮缩放 · 点击天体聚焦 · 空格暂停 · ← → 调速 · H 隐藏界面</div>
  <div id="webglError"><div><strong>此浏览器无法启动 WebGL2</strong><span>请使用支持 WebGL2 的新版浏览器，并确认硬件加速已开启。</span></div></div>
</main>

<script id="vs-bg" type="x-shader/x-vertex">#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.99999, 1.0);
}</script>
<script id="fs-bg" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform mat4 uInvVP;
uniform vec3 uCamera;
uniform float uTime;
float hash31(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453123); }
float noise3(vec3 p){
  vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm(vec3 p){ float s=0.0,a=.5; mat3 r=mat3(.00,.80,.60,-.80,.36,-.48,-.60,-.48,.64); for(int i=0;i<5;i++){s+=a*noise3(p);p=r*p*2.03+1.7;a*=.5;}return s; }
void main(){
  vec2 ndc=vUv*2.0-1.0;
  vec4 q=uInvVP*vec4(ndc,1.0,1.0);
  vec3 rd=normalize(q.xyz/q.w-uCamera);
  vec3 pole=normalize(vec3(-.8678,.4972,.0003));
  float gp=abs(dot(rd,pole));
  float band=exp(-gp*gp*24.0);
  float filament=fbm(rd*5.2+vec3(1.3,3.1,.2))+0.45*fbm(rd*13.0);
  float dust=fbm(rd*21.0-vec3(2.1,.2,4.0));
  float split=1.0-smoothstep(.49,.68,dust)*exp(-gp*gp*85.0);
  vec3 base=vec3(.0012,.0017,.0034);
  vec3 milky=mix(vec3(.014,.019,.040),vec3(.045,.036,.070),filament)*band*split*.55;
  float faint=pow(max(noise3(floor(rd*760.0)),0.0),18.0)*.018;
  outColor=vec4(base+milky+faint,1.0);
}</script>

<script id="vs-star" type="x-shader/x-vertex">#version 300 es
precision highp float;
layout(location=0) in vec3 aDir;
layout(location=1) in float aSize;
layout(location=2) in vec3 aColor;
layout(location=3) in float aPhase;
uniform mat4 uVP;
uniform vec3 uCamera;
uniform float uTime;
out vec3 vColor;
out float vAlpha;
void main(){
  gl_Position=uVP*vec4(uCamera+aDir*3600.0,1.0);
  gl_PointSize=clamp(aSize*(1.0+.11*sin(uTime*.0015+aPhase)),.75,3.8);
  vColor=aColor;
  vAlpha=clamp(aSize*.34,.16,1.0);
}</script>
<script id="fs-star" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec3 vColor; in float vAlpha; out vec4 outColor;
void main(){ vec2 p=gl_PointCoord-.5; float d=length(p); if(d>.5)discard; float a=exp(-d*d*22.0)*vAlpha; outColor=vec4(vColor*a,a); }</script>

<script id="vs-body" type="x-shader/x-vertex">#version 300 es
precision highp float;
layout(location=0) in vec3 aPosition;
layout(location=1) in vec3 aNormal;
uniform mat4 uModel;
uniform mat4 uVP;
out vec3 vObj;
out vec3 vWorld;
out vec3 vNormal;
void main(){
  vec4 w=uModel*vec4(aPosition,1.0);
  vObj=aPosition; vWorld=w.xyz; vNormal=normalize(mat3(uModel)*aNormal);
  gl_Position=uVP*w;
}</script>
<script id="fs-body" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec3 vObj; in vec3 vWorld; in vec3 vNormal;
out vec4 outColor;
uniform int uKind;
uniform float uTime;
uniform float uDistAU;
uniform vec3 uCamera;
uniform vec3 uSunObj;
uniform int uRingType;
float hash13(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453123); }
vec3 hash33(vec3 p){ p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return fract(sin(p)*43758.5453); }
float sstep(float a,float b,float x){float t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
float noise3(vec3 p){
  vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
  mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z);
}
