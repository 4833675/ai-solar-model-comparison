<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>太阳系实时运动模型 · WebGL2</title>
<style>
:root{
  --glass:rgba(9,13,22,.58); --hair:rgba(255,255,255,.085);
  --ink:#c8d2e4; --ink-dim:#6f7d95; --accent:#7fb4ff; --warm:#ffcf8f;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.dragging{cursor:grabbing}
.hidden{display:none!important}
.uiOff #left,.uiOff #right,.uiOff #bottom,.uiOff #toggles,.uiOff #note,.uiOff #labels{opacity:0;pointer-events:none}

.panel{position:fixed;background:var(--glass);border:1px solid var(--hair);border-radius:12px;
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 8px 40px rgba(0,0,0,.45);transition:opacity .35s}

/* ---- left ---- */
#left{left:14px;top:14px;width:198px;padding:12px 8px 10px;max-height:calc(100vh - 28px);overflow:hidden auto;scrollbar-width:none}
#left::-webkit-scrollbar{display:none}
#left h1{font-size:13px;font-weight:600;letter-spacing:.34em;color:#e6edf8;padding:2px 8px 8px}
#left h1 small{display:block;font-size:9px;letter-spacing:.24em;color:var(--ink-dim);font-weight:400;margin-top:4px}
.grp{font-size:9px;letter-spacing:.22em;color:var(--ink-dim);padding:9px 8px 3px}
.item{display:flex;align-items:center;gap:8px;padding:4.5px 8px;border-radius:7px;font-size:12px;letter-spacing:.06em;cursor:pointer;color:#aeb9cf}
.item:hover{background:rgba(255,255,255,.05);color:#e6edf8}
.item.sel{background:rgba(127,180,255,.13);color:#eaf2ff}
.item.moon{padding-left:24px;font-size:11px;color:#8b96ab}
.item.moon::before{content:"";width:7px;height:1px;background:#3d4a61}
.dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 6px rgba(255,255,255,.15)}
.hint{font-size:9.5px;line-height:1.9;letter-spacing:.1em;color:var(--ink-dim);padding:10px 8px 2px;border-top:1px solid var(--hair);margin-top:10px}
kbd{font-family:var(--mono);font-size:9px;border:1px solid var(--hair);border-radius:3px;padding:0 3px;color:#9fb0c8}

/* ---- right info ---- */
#right{right:14px;top:14px;width:302px;padding:15px 16px 13px;max-height:calc(100vh - 240px);overflow:auto;scrollbar-width:thin;scrollbar-color:#2a3648 transparent}
#right::-webkit-scrollbar{width:4px}#right::-webkit-scrollbar-thumb{background:#2a3648;border-radius:2px}
#right h2{font-size:16px;letter-spacing:.18em;color:#f0f5fc;font-weight:600}
#right .sub{font-size:9.5px;letter-spacing:.3em;color:var(--ink-dim);margin:3px 0 10px}
.sect{font-size:9px;letter-spacing:.26em;color:var(--ink-dim);margin:12px 0 5px;padding-top:9px;border-top:1px solid var(--hair)}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;padding:2.5px 0;color:#96a3ba;letter-spacing:.05em}
.row b{font-family:var(--mono);font-weight:500;font-size:11.5px;color:#dfe8f5;font-variant-numeric:tabular-nums}
.row b.hot{color:var(--warm)}
#blurb{font-size:11.5px;line-height:1.85;color:#8fa0b8;letter-spacing:.03em;margin-top:6px}
#blurb em{color:#b9c8de;font-style:normal}

/* ---- bottom ---- */
#bottom{left:50%;transform:translateX(-50%);bottom:16px;display:flex;align-items:center;gap:12px;padding:9px 14px}
#bottom button{background:rgba(255,255,255,.06);border:1px solid var(--hair);color:#d7e2f2;border-radius:7px;
  font-size:12px;padding:5px 10px;cursor:pointer;letter-spacing:.08em;font-family:inherit}
#bottom button:hover{background:rgba(255,255,255,.12)}
#playBtn{width:34px;font-size:13px;padding:5px 0}
#dateBox{text-align:center;min-width:158px}
#dateStr{font-family:var(--mono);font-size:13.5px;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:#e8eef8}
#timeStr{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-dim);font-variant-numeric:tabular-nums;margin-top:2px}
#speed{-webkit-appearance:none;appearance:none;width:190px;height:2px;background:linear-gradient(90deg,#2c3e58,#5b7ea8);border-radius:2px;outline:none}
#speed::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#bcd6ff;box-shadow:0 0 10px rgba(140,180,255,.7);cursor:pointer}
#speed::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#bcd6ff;cursor:pointer}
#spdStr{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:#9db0cc;font-variant-numeric:tabular-nums;min-width:104px;text-align:right}
#validWarn{font-size:10px;color:#e8a24f;letter-spacing:.12em;white-space:nowrap}

/* ---- toggles ---- */
#toggles{right:14px;bottom:16px;padding:11px 13px;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.tg{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;color:#9fb0c8;cursor:pointer;user-select:none;padding:2px 0}
.tg input{display:none}
.tg i{width:22px;height:12px;border-radius:6px;background:#232f42;border:1px solid var(--hair);position:relative;flex:none;transition:.2s}
.tg i::after{content:"";position:absolute;left:1px;top:1px;width:8px;height:8px;border-radius:50%;background:#5c6b82;transition:.2s}
.tg input:checked+i{background:rgba(110,160,255,.35);border-color:rgba(140,180,255,.4)}
.tg input:checked+i::after{left:11px;background:#bcd6ff;box-shadow:0 0 6px rgba(150,190,255,.8)}
.tg:hover{color:#dbe6f5}

#note{left:14px;bottom:16px;font-size:10px;letter-spacing:.1em;line-height:1.8;color:var(--ink-dim);padding:9px 12px;max-width:198px}
#note b{color:#93a7c4;font-weight:500}

/* ---- labels ---- */
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;font-size:10.5px;letter-spacing:.16em;color:#c5d3e8;text-shadow:0 1px 5px #000,0 0 12px #000;white-space:nowrap;transform:translate(-50%,-215%)}
.lbl.sel{color:#ffd9a0}
#fps{position:fixed;left:50%;transform:translateX(-50%);top:12px;font-family:var(--mono);font-size:10px;color:#3d4c63;letter-spacing:.1em;pointer-events:none}
@media (max-width:860px){#left{display:none}#right{width:250px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<div id="fps"></div>

<aside id="left" class="panel">
  <h1>太阳系模型<small>SOLAR SYSTEM · 实时轨道根数</small></h1>
  <div id="bodyList"></div>
  <div class="hint">拖拽旋转 · 滚轮/双指缩放<br>点击天体可聚焦<br><kbd>空格</kbd>暂停 <kbd>←→</kbd>速度 <kbd>H</kbd>界面</div>
</aside>

<aside id="right" class="panel hidden"><div id="infoBody"></div></aside>

<div id="bottom" class="panel">
  <button id="playBtn" title="空格 暂停/继续">❚❚</button>
  <div id="dateBox"><div id="dateStr">—</div><div id="timeStr">— —</div></div>
  <button id="nowBtn">此刻</button>
  <input id="speed" type="range" min="-100" max="100" step="0.5" value="60">
  <div id="spdStr"></div>
  <div id="validWarn" class="hidden">已超出根数有效区间（外推）</div>
</div>

<div id="toggles" class="panel">
  <label class="tg"><input type="checkbox" id="tgOrbit" checked><i></i>轨道</label>
  <label class="tg"><input type="checkbox" id="tgLabel" checked><i></i>名称</label>
  <label class="tg"><input type="checkbox" id="tgMoon" checked><i></i>卫星</label>
  <label class="tg"><input type="checkbox" id="tgBelt" checked><i></i>小天体</label>
  <label class="tg"><input type="checkbox" id="tgComet" checked><i></i>彗星</label>
  <label class="tg"><input type="checkbox" id="tgBloom" checked><i></i>辉光</label>
  <label class="tg" style="grid-column:1/-1"><input type="checkbox" id="tgReal"><i></i>真实距离比例</label>
</div>

<div id="note" class="panel"><b>距离已按幂律压缩</b>（r<sup>0.62</sup>），天体半径另行放大；<b>角位置、相位、周期均为真实值</b>。</div>

const HALLEY = {a:17.834, e:0.96714, i:162.26*DEG, om:111.33*DEG, node:58.42*DEG, Tp:2446470.96, P:27512.6};

/* ---- 时间 ---- */
function jdFromUnix(ms){ return ms/86400000 + 2440587.5; }
function jdToUnix(jd){ return (jd - 2440587.5)*86400000; }
function centuries(jd){ return (jd - 2451545.0)/36525.0; }

/* ---- 开普勒方程: E - e·sinE = M ---- */
function solveKepler(M, e){
  M = wrapPi(M);
  let E = M + e*Math.sin(M)*(1 + e*Math.cos(M));
  for(let k=0;k<10;k++){
    const dE = (E - e*Math.sin(E) - M)/(1 - e*Math.cos(E));
    E -= dE;
    if(Math.abs(dE) < 1e-13) break;
  }
  return E;
}
/* 轨道面坐标 -> 黄道直角坐标(AU) — 3.3 节公式 */
function orbToEcl(xp, yp, inc, node, om){
  const co=Math.cos(om), so=Math.sin(om), cn=Math.cos(node), sn=Math.sin(node), ci=Math.cos(inc), si=Math.sin(inc);
  return [ (co*cn - so*sn*ci)*xp + (-so*cn - co*sn*ci)*yp,
           (co*sn + so*cn*ci)*xp + (-so*sn + co*cn*ci)*yp,
           so*si*xp + co*si*yp ];
}
/* 行星在时刻 jd 的日心黄道坐标(AU) + 当前根数 */
function planetStateAU(idx, jd){
  const p=PLANETS[idx], T=centuries(jd), e0=p.el, rt=p.rate;
  const a =e0[0]+rt[0]*T, e=e0[1]+rt[1]*T,
        i =(e0[2]+rt[2]*T)*DEG,
        L =wrapPi((e0[3]+rt[3]*T)*DEG),
        pri=(e0[4]+rt[4]*T)*DEG,
        node=e0[5]+rt[5]*DEG;
  const om=pri-node, M=wrapPi(L-pri);
  const E=solveKepler(M,e);
  const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(1-e*e)*Math.sin(E);
  const pos=orbToEcl(xp,yp,i,node,om);
  return {pos, a, e, i, node, om, L, pri, M, r:Math.hypot(pos[0],pos[1],pos[2])};
}
/* 哈雷彗星 */
function halleyState(jd){
  const M=wrapPi(TAU*(jd-HALLEY.Tp)/HALLEY.P);
  const E=solveKepler(M,HALLEY.e);
  const xp=HALLEY.a*(Math.cos(E)-HALLEY.e), yp=HALLEY.a*Math.sqrt(1-HALLEY.e*HALLEY.e)*Math.sin(E);
  const pos=orbToEcl(xp,yp,HALLEY.i,HALLEY.node,HALLEY.om);
  return {pos, a:HALLEY.a, e:HALLEY.e, M, E, r:Math.hypot(pos[0],pos[1],pos[2])};
}
/* 黄道 -> 世界系 (右手, y 朝上=黄北极): (x, z, -y) */
function eclToWorld(p){ return [p[0], p[2], -p[1]]; }
/* 活力公式 v(km/s), r,a 单位 AU */
function orbSpeed(rAU,a){ return 29.7847*Math.sqrt(Math.max(0, 2/rAU - 1/a)); }
/* 径向幂律压缩: rAU -> 显示单位 (方向不变) */
const DISP_SCALE=34.0;
function compressR(rAU, c){ return DISP_SCALE*Math.pow(rAU, c); }
/* 天体显示半径 (幂律放大) */
function dispRadius(rkm){ return rkm>=1e5 ? 4.6 : 0.72*Math.pow(rkm/6371.0, 0.42); }
/* 自转轴方向 (世界系) */
function rotAxis(tiltDeg, plonDeg){
  const t=tiltDeg*DEG, l=plonDeg*DEG;
  const ex=Math.sin(t)*Math.cos(l), ey=Math.sin(t)*Math.sin(l), ez=Math.cos(t);
  return eclToWorld([ex,ey,ez]);
}

    col+=vec3(0.26,0.14,0.07)*exp(-pow((rr-0.95)/0.10,2.0));
   }
  }else{

   col+=st*vec3(0.10,0.08,0.05);
   /* 北极六边形 */
   if(latD>66.0){
    float dd=length(vec2(cos(lat)*wrapA(lon),1.5708-lat));
    float m=mod(wrapA(lon)*57.29578,60.0)-30.0;
    float he=0.115/cos(m*0.0174533);

    col*=1.0-0.45*hexm;
    col*=1.0-0.22*sstep(he+0.03,he+0.28,dd);
   }
  }
 } else if(ty==7||ty==8){ /* ---- 天王星/海王星 ---- */
  float lat=asin(clamp(p.y,-1.0,1.0)),latD=lat/DEG,lon=atan(p.z,p.x);
  float turb=(fbm3(p*2.8)-0.5)*3.0;
  float t=(latD+turb*6.0)/180.0;
  float b=0.5*sin(t*4.0*PI)+0.3*sin(t*9.0*PI+1.2);
  b*=1.0-0.9*sstep(50.0,80.0,abs(latD));
  if(ty==7) col=mix(vec3(0.185,0.40,0.43),vec3(0.30,0.565,0.585),clamp(b*0.42+0.5,0.0,1.0));
  else{
   col=mix(vec3(0.075,0.175,0.46),vec3(0.16,0.32,0.66),clamp(b*0.4+0.5,0.0,1.0));
   float dx=wrapA(lon-1.7)*57.29578*cos(lat),dy=latD+24.0;
   float rr=sqrt((dx/11.0)*(dx/11.0)+(dy/5.0)*(dy/5.0));
   col=mix(col,vec3(0.035,0.085,0.26),sstep(1.0,0.6,rr));
   float sp=fbm3(vec3(cos(atan(dy/5.0,dx/11.0)+rr*2.0)*2.0,sin(atan(dy/5.0,dx/11.0)+rr*2.0)*2.0,rr*4.0));
   col+=sstep(1.0,0.6,rr)*sp*0.03;
  }
  float st=pow(max(0.0,fbm3(p*vec3(2.4,13.0,2.4))-0.60),3.0)*10.0; /* 甲烷云条纹(只进反照率,7.10) */
  col+=st*(ty==7?vec3(0.10,0.17,0.18):vec3(0.16,0.20,0.30));
 } else if(ty==9){ /* ---- 冥王星 ---- */
  vec2 c=(craters(p,5.0,0.8)+craters(p,14.0,0.4)+craters(p,40.0,0.2))*0.7;
  hgt=c.x*0.5; alb=c.y;
  float lat=asin(clamp(p.y,-1.0,1.0)),latD=lat/DEG,lon=atan(p.z,p.x);
  col=mix(vec3(0.26,0.20,0.17),vec3(0.52,0.47,0.42),fbm(p*2.6));
  float th=exp(-pow((latD+1.5)/8.0,2.0))*exp(-pow(wrapA(lon-3.1)/0.95,2.0))*sstep(0.35,0.55,fbm3(p*3.0+7.0));
  col=mix(col,vec3(0.115,0.075,0.058),clamp(th,0.0,1.0)); /* 克苏鲁暗带 */
  float hx1=length(vec2(wrapA(lon+1.9)*cos(lat),(latD-16.0)*1.5)/0.30);
  float hx2=length(vec2(wrapA(lon+1.05)*cos(lat),(latD-24.0)*1.5)/0.24);

  col=mix(col,vec3(0.88,0.42,0.08),sstep(0.5,0.75,f2)*0.7);

 } else if(ty==13){ /* ---- 木卫三 ---- */
  float dk=fbm(p*2.1+3.0);

  col+=vec3(0.28,0.17,0.05)*pow(max(0.0,fbm3(p*5.5+2.0)-0.5),2.0)*1.6;
 } else if(ty==16){ /* ---- 海卫一 ---- */

  vec2 c=craters(p,6.0,0.35); hgt=c.x*0.25;
 }
 /* ---- 统一光照 ---- */
 vec3 Lw=normalize(-vWorld);
 vec3 Nw=normalize(vN);
 if(uBump>0.001) Nw=bumpFromH(Nw,vWorld,hgt,uBump);
 float nl=dot(Nw,Lw);
 float diff=clamp((nl+uWrap)/(1.0+uWrap),0.0,1.0);
 diff=pow(diff,1.45);
 vec3 outc=col*uSunI*diff+col*0.006+emis;
 if(spec>0.0){
  vec3 V=normalize(uCam-vWorld); vec3 H=normalize(Lw+V);
  outc+=vec3(1.0,0.965,0.88)*pow(max(dot(Nw,H),0.0),420.0)*uSunI*spec*9.0;
 }
 if(uRingOn>0&&nl>0.0){
  vec3 Lo=transpose(uRot)*Lw;
  if(Lo.y<0.0){
   float t0=-vObj.y/Lo.y;
   float rx=vObj.x+Lo.x*t0, rz=vObj.z+Lo.z*t0;
   float ru=sqrt(rx*rx+rz*rz);
   float inn=uRingOn==1?1.20:1.55, outr=uRingOn==1?2.40:2.05;
   if(ru>inn&&ru<outr){
    float tau=uRingOn==1?saturnTau(ru):uranusTau(ru);

   }
  }

 oCol=vec4(outc,1.0);
}`;

   const l2=x*x+y*y+z*z;if(l2>0.0001&&l2<1)break;}

 for(let k2=0;k2<900;k2++){

  const d=compressR(r,S.compress);

  const pr=w[(k+n-1)%n],nx=w[(k+1)%n];
  let tx=nx[0]-pr[0],ty=nx[1]-pr[1],tz=nx[2]-pr[2];const tl=Math.hypot(tx,ty,tz)||1;
  const p=w[k],M=k/n*TAU;
  for(let sgn=-1;sgn<2;sgn+=2){
   GEO.ribData[o]=p[0];GEO.ribData[o+1]=p[1];GEO.ribData[o+2]=p[2];
   GEO.ribData[o+3]=tx/tl;GEO.ribData[o+4]=ty/tl;GEO.ribData[o+5]=tz/tl;
   GEO.ribData[o+6]=M;GEO.ribData[o+7]=col[0];GEO.ribData[o+8]=col[1];GEO.ribData[o+9]=col[2];
   GEO.ribData[o+10]=sgn;GEO.ribData[o+11]=0;GEO.ribData[o+12]=0;GEO.ribData[o+13]=0;o+=14;}

 /* 相机基向量 (右/上): f=朝向目标, up 取世界 Y */
 let fx=CAM.cur[0]-CAM.eye[0],fy=CAM.cur[1]-CAM.eye[1],fz=CAM.cur[2]-CAM.eye[2];
 const fl=Math.hypot(fx,fy,fz)||1;fx/=fl;fy/=fl;fz/=fl;

 let sx=fz, sy=0, sz=-fx;

 const sll=Math.hypot(sx,sy,sz)||1;sx/=sll;sy/=sll;sz/=sll;

function sunFlare(){
 const sp=project([0,0,0]);
 if(!sp)return {vis:0,sx:[0,0]};
 const dEye=Math.hypot(CAM.eye[0],CAM.eye[1],CAM.eye[2]);
 const rSun=4.6/dEye*(cssH*0.5)/Math.tan(FOVY/2);
 let vis=1;
 for(const k of PICKLIST()){if(k==="sun")continue;const b=bodies[k];
  const db=Math.hypot(b.pos[0]-CAM.eye[0],b.pos[1]-CAM.eye[1],b.pos[2]-CAM.eye[2]);
  if(db>=dEye)continue;
  const s2=project(b.pos);if(!s2)continue;
  const rb=screenR(b.pos,b.R);
  if(Math.hypot(s2.x-sp.x,s2.y-sp.y)<Math.max(rSun,rb)*0.9){vis=0;break;}}
 /* 屏坐标 -> uv01 */
 return {vis, sx:[sp.x/cssW, 1-sp.y/cssH]};
}

function updateCam(dt){
 if(CAM.follow){const b=bodies[CAM.follow];
  CAM.tgt=[b.pos[0],b.pos[1],b.pos[2]];}
 const k=1-Math.exp(-dt*2.6);
 for(let i=0;i<3;i++)CAM.cur[i]+=(CAM.tgt[i]-CAM.cur[i])*k;
 CAM.cdist+=(CAM.wantDist-CAM.cdist)*(1-Math.exp(-dt*3.2));
 CAM.eye=[CAM.cur[0]+CAM.cdist*Math.cos(CAM.pitch)*Math.sin(CAM.yaw),
          CAM.cur[1]+CAM.cdist*Math.sin(CAM.pitch),
          CAM.cur[2]+CAM.cdist*Math.cos(CAM.pitch)*Math.cos(CAM.yaw)];
 const dTgt=CAM.cdist;
 const near=Math.max(0.012,dTgt*0.0035), far=Math.max(dTgt*14,4200);
 m4persp(PROJ,FOVY,cssW/cssH,near,far);
 m4look(VIEW,CAM.eye[0],CAM.eye[1],CAM.eye[2],CAM.cur[0],CAM.cur[1],CAM.cur[2],0,1,0);
 m4mul(VP,PROJ,VIEW); m4inv(INVVP,VP);
}

  const kk=1-Math.exp(-dt*9.5);

 } else S.compress=S.cTarget;
 const dDays=S.playing? dps()*dt : 0;
 S.jd+=dDays;
 updateSpin(dDays);

 buildTail();

 updateLabels(); S.nFrames++;
 const e=gl.getError(); if(e){errLog.push(performance.now()+":GL"+e); if(errLog.length<40&&now%2000<50)console.error("GL error",e);}

}

function fmtSpeed(){
 const v=S.spd; const d=dps();
 const sign=v<0?"-":""; const ad=Math.abs(d);
 let txt;
 if(ad<1/86400*1.5) txt="实时 ×1";
 else {
  const sec=ad*86400;
  if(sec<90)txt=sign+sec.toFixed(sec<10?2:1)+" 秒/秒";
  else if(sec<5400)txt=sign+(sec/60).toFixed(1)+" 分/秒";
  else if(sec<130000)txt=sign+(sec/3600).toFixed(1)+" 时/秒";
  else if(sec<2.2e6)txt=sign+ad.toFixed(ad<100?1:0)+" 天/秒";
  else txt=sign+(ad/365.25).toFixed(2)+" 年/秒";
 }
 return txt;
}

  if(!s){el.style.display="none";continue;}
  const rpx=screenR(b.pos,b.R);
  let op=Math.min(1,Math.max(0,(rpx-1)/26))*0.9+0.1;
  if(rpx<0.9&&k.length>3){el.style.display="none";continue;}
  el.style.display="";
  el.style.left=s.x+"px"; el.style.top=s.y+"px"; el.style.opacity=op;
  el.classList.toggle("sel",S.focus===k);
 }
}
/* ================= UI 构建 ================= */
function markList(){
 document.querySelectorAll("#bodyList .item").forEach(n=>n.classList.toggle("sel",n.dataset.k===S.focus));
}
function buildUI(){
 const list=$("bodyList");
 const mk=(k,n,cls,dotc)=>{
  const d=document.createElement("div");d.className="item "+(cls||"");d.dataset.k=k;
  d.innerHTML='<span class="dot" style="background:rgb('+(dotc||[180,190,210]).map(v=>(v*255)|0).join(",")+')"></span>'+n;
  d.onclick=()=>focusBody(k);list.appendChild(d);return d;};
 const grp=t=>{const g=document.createElement("div");g.className="grp";g.textContent=t;list.appendChild(g);};
 mk("overview","◉ 太阳系总览","",[120,140,170]);
 grp("恒星");
 mk("sun","太阳","",[255,190,90]);
 grp("行星");
 for(const p of PLANETS){if(p.key==="pluto")continue;mk(p.key,p.name,"",UICOLO[p.key].map(v=>Math.min(1,v+0.25)));
  for(const m of MOONS)if(m.parent===p.key)mk(m.key,m.name,"moon",UICOLO[m.key].map(v=>Math.min(1,v*0.8)));}
 grp("矮行星 / 彗星");
 mk("pluto","冥王星","");
 mk("halley","哈雷彗星","",[140,200,255]);
 $("playBtn").onclick=()=>{S.playing=!S.playing;$("playBtn").textContent=S.playing?"❚❚":"▶";};
 $("nowBtn").onclick=()=>{S.jd=jdFromUnix(Date.now());};
 const sp=$("speed");
 sp.value=S.spd;
 sp.oninput=()=>{S.spd=parseFloat(sp.value);};
 const tg=(id,fn)=>{const el=$(id);el.onchange=()=>fn(el.checked);};
 tg("tgOrbit",v=>S.showOrbit=v); tg("tgLabel",v=>S.showLabel=v);
 tg("tgMoon",v=>S.showMoon=v); tg("tgBelt",v=>S.showBelt=v);
 tg("tgComet",v=>S.showComet=v); tg("tgBloom",v=>S.showBloom=v);
 tg("tgReal",v=>{S.cTarget=v?1.0:0.62; $("note").innerHTML=v?
  "<b>真实距离比例</b> r<sup>1.0</sup>——内行星塌缩成一团，注意观察小行星带变成一条密环。角位置始终精确。":
  "<b>距离已按幂律压缩</b>（r<sup>0.62</sup>），天体半径另行放大；<b>角位置、相位、周期均为真实值</b>。";});
}
/* ================= 输入 ================= */
function bindInput(){
 let down=null,moved=0,pinch=null;
 const pointers=new Map();
 canvas.addEventListener("pointerdown",ev=>{
  canvas.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pointers.size===2){const[a,b]=[...pointers.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),dist:CAM.wantDist};}
  down={x:ev.clientX,y:ev.clientY};moved=0;canvas.classList.add("dragging");});
 canvas.addEventListener("pointermove",ev=>{
  if(!pointers.has(ev.pointerId))return;
  const prev=pointers.get(ev.pointerId);
  pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pointers.size===2&&pinch){const[a,b]=[...pointers.values()];
   const nd=Math.hypot(a.x-b.x,a.y-b.y);
   CAM.wantDist=Math.min(2600,Math.max(1.2,pinch.dist*Math.pow(pinch.d/Math.max(nd,1),1)));return;}
  if(!down)return;
  const dx=ev.clientX-prev.x,dy=ev.clientY-prev.y;
  moved+=Math.abs(dx)+Math.abs(dy);
  CAM.yaw-=dx*0.0052; CAM.pitch+=dy*0.0052;
  CAM.pitch=Math.max(-1.54,Math.min(1.54,CAM.pitch));});
 const up=ev=>{
  pointers.delete(ev.pointerId);if(pointers.size<2)pinch=null;
  if(down&&moved<5){const r=canvas.getBoundingClientRect();
   const k=pick(ev.clientX-r.left,ev.clientY-r.top); if(k)focusBody(k);}
  down=null;canvas.classList.remove("dragging");};
 canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
 canvas.addEventListener("wheel",ev=>{ev.preventDefault();
  CAM.wantDist=Math.min(2600,Math.max(1.2,CAM.wantDist*Math.exp(ev.deltaY*0.0012)));},{passive:false});
 window.addEventListener("keydown",ev=>{
  if(ev.target.tagName==="INPUT")return;
  if(ev.code==="Space"){ev.preventDefault();$("playBtn").click();}
  else if(ev.key==="ArrowRight"){S.spd=Math.min(100,S.spd+4);$("speed").value=S.spd;}
  else if(ev.key==="ArrowLeft"){S.spd=Math.max(-100,S.spd-4);$("speed").value=S.spd;}
  else if(ev.key==="h"||ev.key==="H"){S.hidden=!S.hidden;document.body.classList.toggle("uiOff",S.hidden);}
  else if(ev.key==="Escape"){focusBody("overview");}});
}
/* ================= 尺寸 / 启动 ================= */
function resize(){
 cssW=window.innerWidth; cssH=window.innerHeight;
 canvas.width=Math.round(cssW*S.dpr*S.scale); canvas.height=Math.round(cssH*S.dpr*S.scale);
 resizeFBOs(); makeFBOsFull();
}
function boot(){
 initBodies();
 initGL();
 buildUI();
 bindInput();
 window.addEventListener("resize",resize);
 resize();
 S.last=performance.now();
 updateSpin(0); computeBodies();
 requestAnimationFrame(frame);
 /* 默认聚焦总览 */
 CAM.wantDist=520;
}
/* 调试钩子 */
window.__solar={S,CAM,bodies,gl:null,errors:errLog,
 setSpeed(v){S.spd=v;}, pause(){S.playing=false;}, play(){S.playing=true;},
 setJD(jd){S.jd=jd;}, setDate(str){S.jd=jdFromUnix(Date.parse(str));},
 compress(v){S.cTarget=v;}, real(v){S.cTarget=v?1:0.62;S.compress=S.cTarget;},
 focus(k){focusBody(k);},
 earthInfo(){const st=bodies.earth._st;return {r:st.r,lon:normDeg(Math.atan2(st.pos[1],st.pos[0])/DEG),v:orbSpeed(st.r,st.a)};},
 sample(x,y){ /* 读 HDR 场景缓冲线性值 (7.15: 读自己的 FBO) */
  const px=Math.round(x*S.dpr*S.scale),py=Math.round((cssH-y)*S.dpr*S.scale);
  if(px<0||py<0||px>=FB.scene.w||py>=FB.scene.h)return null;
  gl.bindFramebuffer(gl.FRAMEBUFFER,FB.scene.fb);
  const buf2=new Float32Array(4);
  try{gl.readPixels(px,py,1,1,gl.RGBA,gl.FLOAT,buf2);}catch(e){return null;}
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);return Array.from(buf2);},
 stats(){return {fps:S.fps,glErr:errLog.length,frames:S.nFrames};}};
try{boot();}catch(err){
 document.body.insertAdjacentHTML("beforeend",
  '<div style="position:fixed;inset:0;background:#0a0d14;color:#f88;font:12px monospace;padding:24px;overflow:auto;white-space:pre-wrap">启动失败：\n'+
  (err.message||err)+'\n\n'+(err.stack||"")+'</div>');
 console.error(err);
}
</script>
