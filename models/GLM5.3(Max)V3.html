<style>
*{margin:0;padding:0;box-sizing:border-box}

<script>
'use strict';
/* ============================================================
   太阳系运动模型 · WebGL2 · 全程序化着色器(无外部资源)
   真实性: JPL J2000 轨道六要素+世纪变率, 开普勒方程数值解,
           真实自转/轴倾角/卫星, 环系, 小行星带/柯伊伯带, 双彗星
   ============================================================ */
window.__frames = 0;
window.addEventListener('error', function(e){
  var el = document.getElementById('loading');
  el.classList.remove('hide');
  el.innerHTML = '<div style="max-width:82vw;font-size:12px;color:#f89090;line-height:1.8;letter-spacing:1px">' +
    '初始化失败: ' + (e.message||'未知错误') + '</div>';
});

const $ = id => document.getElementById(id);
const D2R = Math.PI/180, TAU = Math.PI*2;
const clamp = (x,a,b)=>x<a?a:(x>b?b:x);
const lerp = (a,b,t)=>a+(b-a)*t;

/* ---------- 距离非线性压缩 (尺寸压缩后便于观察全系统) ---------- */
const DIST_K = 28.0, DIST_P = 0.62;
function mapAU(x,y,z){
  const r = Math.sqrt(x*x+y*y+z*z);
  if(r < 1e-9) return [0,0,0];
  const s = DIST_K * Math.pow(r, DIST_P-1.0);
  return [x*s, y*s, z*s];
}

/* ---------------------- 向量 / 矩阵 ---------------------- */
const v3 = {
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  scale:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm(a){const l=v3.len(a)||1;return [a[0]/l,a[1]/l,a[2]/l]}
};
function m3rotX(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([1,0,0, 0,c,s, 0,-s,c]);}
function m3rotY(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([c,0,-s, 0,1,0, s,0,c]);}
function m3rotZ(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([c,s,0, -s,c,0, 0,0,1]);}
function m3mul(a,b){ // column-major 3x3
  const o=new Float32Array(9);
  for(let c=0;c<3;c++)for(let r=0;r<3;r++)
    o[c*3+r]=a[r]*b[c*3]+a[3+r]*b[c*3+1]+a[6+r]*b[c*3+2];
  return o;
}
function m3t(a){return new Float32Array([a[0],a[3],a[6], a[1],a[4],a[7], a[2],a[5],a[8]]);}
function m3v(m,v){return [m[0]*v[0]+m[3]*v[1]+m[6]*v[2], m[1]*v[0]+m[4]*v[1]+m[7]*v[2], m[2]*v[0]+m[5]*v[1]+m[8]*v[2]];}
function m4fromTR(rot,pos){
  return new Float32Array([
    rot[0],rot[1],rot[2],0,
    rot[3],rot[4],rot[5],0,
    rot[6],rot[7],rot[8],0,
    pos[0],pos[1],pos[2],1]);
}
function m4persp(fov,asp,n,f){
  const t=1/Math.tan(fov/2), o=new Float32Array(16);
  o[0]=t/asp; o[5]=t; o[10]=(f+n)/(n-f); o[11]=-1; o[14]=2*f*n/(n-f);
  return o;
}
function m4lookAt(e,c,up){
  const z=v3.norm(v3.sub(e,c)), x=v3.norm(v3.cross(up,z)), y=v3.cross(z,x);
  return new Float32Array([
    x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -v3.dot(x,e),-v3.dot(y,e),-v3.dot(z,e),1]);
}
function m4mul(a,b){
  const o=new Float32Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++){
    let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k];
    o[c*4+r]=s;
  }
  return o;
}

/* ---------------------- 开普勒轨道 ---------------------- */
function solveKepler(M,e){
  M = M % TAU; if(M> Math.PI) M-=TAU; if(M<-Math.PI) M+=TAU;
  let E = M + e*Math.sin(M);
  for(let i=0;i<10;i++){
    const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
    E-=d; if(Math.abs(d)<1e-9) break;
  }
  return E;
}
/* 轨道要素(JPL近似式) → 场景坐标. Tc=儒略世纪数 */
function elToScene(el, Tc, out){
  const a =el.a[0]+el.a[1]*Tc, e =el.e[0]+el.e[1]*Tc;
  const i =(el.i[0]+el.i[1]*Tc)*D2R;
  const L =el.L[0]+el.L[1]*Tc, lp=el.lp[0]+el.lp[1]*Tc;
  const N =(el.N[0]+el.N[1]*Tc)*D2R;
  const w = lp*D2R - N;
  const M = (L-lp)*D2R;
  return keplerToScene(a,e,i,N,w,solveKepler(M,e),out);
}
/* 由(a,e,i,Ω,ω,E)直接给场景坐标(黄道→Y-up, 径向压缩) */
function keplerToScene(a,e,inc,N,w,E,out){
  const cE=Math.cos(E), sE=Math.sin(E);
  const r = a*(1-e*cE);
  const nu = Math.atan2(Math.sqrt(Math.max(1-e*e,0))*sE, cE-e);
  const u = w+nu;
  const ci=Math.cos(inc), si=Math.sin(inc), cO=Math.cos(N), sO=Math.sin(N);
  const ex=r*(cO*Math.cos(u)-sO*Math.sin(u)*ci);
  const ey=r*(sO*Math.cos(u)+cO*Math.sin(u)*ci);
  const ez=r*si*Math.sin(u);
  const p = mapAU(ex, ez, -ey);           // 黄道→场景: y=eclZ, z=-eclY
  if(out){out[0]=p[0];out[1]=p[1];out[2]=p[2];return out;}
  return p;
}

/* ---------------------- 时间 ---------------------- */
function nowJD(){ return Date.now()/86400000 + 2440587.5; }
const J2000 = 2451545.0;
function jdToString(jd){
  const d=new Date((jd-2440587.5)*86400000);
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'年'+p(d.getMonth()+1)+'月'+p(d.getDate())+'日 '+p(d.getHours())+':'+p(d.getMinutes());
}

/* 彗星: a, e, i°, Ω°, ω°, 近日点儒略日, 周期(日) */
const COMET_EL = {

/* type: 着色器分支; R:显示半径; tilt:轴倾角°; rotH:自转小时(负=逆行) */

/* ---------------------- WebGL 基础 ---------------------- */
let gl, canvas;
function compile(type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const log=gl.getShaderInfoLog(s);
    console.error(log, src.split('\n').map((x,i)=>(i+1)+': '+x).join('\n'));
    throw new Error('着色器编译失败: '+log);
  }
  return s;
}
function makeProg(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error('链接失败: '+gl.getProgramInfoLog(p));
  const u={}, n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const inf=gl.getActiveUniform(p,i);u[inf.name.replace('[0]','')]=gl.getUniformLocation(p,inf.name);}
  return {p,u};
}
const SAMPLER_UNIFS = new Set(['uTex','uScene','uB1','uB2','uB3']);
function useP(P,o){ gl.useProgram(P.p); if(o) setU(P,o); }
function setU(P,o){
  for(const k in o){
    const l=P.u[k]; if(l==null) continue;
    const v=o[k];
    if(typeof v==='number'){
      if(SAMPLER_UNIFS.has(k)) gl.uniform1i(l,v); else gl.uniform1f(l,v);
    }
    else if(v.length===16) gl.uniformMatrix4fv(l,false,v);
    else if(v.length===9) gl.uniformMatrix3fv(l,false,v);
    else if(v.length===2) gl.uniform2fv(l,v);
    else if(v.length===3) gl.uniform3fv(l,v);
    else if(v.length===4) gl.uniform4fv(l,v);
  }
}

/* ============================ GLSL 公共块 ============================ */
const NOISE_GLSL = `
float hash13(vec3 p3){ p3=fract(p3*0.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
vec3 hash33(vec3 p3){ p3=fract(p3*vec3(0.1031,0.1030,0.0973)); p3+=dot(p3,p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }
float vnoise(vec3 x){
  vec3 p=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
  float a=hash13(p),            b=hash13(p+vec3(1.0,0.0,0.0)), c=hash13(p+vec3(0.0,1.0,0.0)), d=hash13(p+vec3(1.0,1.0,0.0));
  float e=hash13(p+vec3(0.0,0.0,1.0)), g=hash13(p+vec3(1.0,0.0,1.0)), h=hash13(p+vec3(0.0,1.0,1.0)), i=hash13(p+vec3(1.0,1.0,1.0));
  return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y), mix(mix(e,g,f.x),mix(h,i,f.x),f.y), f.z);
}
float fbm(vec3 p, int oct){
  float v=0.0; float a=0.5;
  for(int i=0;i<7;i++){ if(i>=oct) break; v+=a*vnoise(p); p=p*2.02+vec3(13.7,7.1,3.9); a*=0.5; }
  return v;
}
vec2 voro(vec3 p){
  vec3 pi=floor(p); vec3 pf=fract(p); float f1=8.0; float f2=8.0;
  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec3 o=vec3(float(i),float(j),float(k));
    vec3 h=hash33(pi+o);
    vec3 c=o+h-pf;
    float d=dot(c,c);
    if(d<f1){ f2=f1; f1=d; } else if(d<f2){ f2=d; }
  }
  return vec2(sqrt(f1),sqrt(f2));
}
vec3 rotY(vec3 p, float a){ float c=cos(a),s=sin(a); return vec3(c*p.x+s*p.z, p.y, -s*p.x+c*p.z); }
`;
/* 距离非线性压缩(与 JS mapAU 一致) */
const MAP_GLSL = `
#define DIST_K ${DIST_K.toFixed(2)}
#define DIST_P ${DIST_P.toFixed(3)}
vec3 mapPos(vec3 p){ float r=length(p); if(r<1e-8) return p; return p*(DIST_K*pow(r,DIST_P-1.0)); }
`;
/* 开普勒轨道位置: 输入(a,e,i,Ω,ω,E) → 场景坐标(AU, y-up) */
const ORBIT_GLSL = `
vec3 orbitPosAU(float a, float e, float inc, float node, float peri, float E){
  float cE=cos(E), sE=sin(E);
  float rv=a*(1.0-e*cE);
  float nu=atan(sqrt(max(1.0-e*e,0.0))*sE, cE-e);
  float u=peri+nu;
  float ci=cos(inc), si=sin(inc), cO=cos(node), sO=sin(node);
  vec3 ecl=vec3(cO*cos(u)-sO*sin(u)*ci, si*sin(u), sO*cos(u)+cO*sin(u)*ci)*rv;
  return vec3(ecl.x, ecl.y, -ecl.z);
}
`;
/* 球体投影阴影(软边界) */
const SHADOW_GLSL = `
float sphereShadow(vec3 p, vec4 sc, vec3 sunPos){
  if(sc.w<=0.0) return 1.0;
  vec3 L=sunPos-p; float len=length(L); vec3 d=L/max(len,1e-8);
  vec3 pc=sc.xyz-p; float tca=dot(pc,d);
  if(tca<0.05 || tca>len) return 1.0;
  float dd=dot(pc,pc)-tca*tca;
  return smoothstep(sc.w*0.97, sc.w*1.05, sqrt(max(dd,0.0)));
}`;
/* 土星/天王星环纹理: t∈[0,1] (内→外) */
const RING_GLSL = `
float ringAlpha(float t, float ty){
  float n1=vnoise(vec3(t*42.0,4.7,8.2));
  float n2=vnoise(vec3(t*110.0,9.3,2.7));
  float a=0.0;
  if(ty<0.5){
    a=0.52+0.42*n1+0.20*(n2-0.5);
    a*=mix(0.22,1.0,smoothstep(0.0,0.12,t));
    float g1=smoothstep(0.575,0.60,t)*(1.0-smoothstep(0.65,0.675,t));
    a*=1.0-0.92*g1;
    float g2=smoothstep(0.876,0.884,t)*(1.0-smoothstep(0.902,0.91,t));
    a*=1.0-0.82*g2;
    a*=1.0-smoothstep(0.93,1.0,t)*0.9;
  }else{
    a=0.10+0.55*pow(n1,3.0)+0.25*pow(n2,2.0);
    a*=0.4+0.6*smoothstep(0.0,0.2,t);
    a*=1.0-smoothstep(0.88,1.0,t);
    float g=smoothstep(0.965,0.975,t)*(1.0-smoothstep(0.99,1.0,t));
    a+=g*0.5;
  }
  return clamp(a,0.0,1.0);
}
vec3 ringColor(float t, float ty){
  float n=vnoise(vec3(t*60.0,7.7,1.3));
  if(ty<0.5) return mix(vec3(0.50,0.44,0.37),vec3(0.93,0.86,0.74),n);
  return mix(vec3(0.38,0.44,0.52),vec3(0.55,0.64,0.74),n);
}`;

vec3 starLayer(vec3 rd, float scale, float seed, float boost){

  for(int k=-1;k<=1;k++)

    vec3 sp=g+h;
    float d=length(f-sp);
    float mag=hash13(cid+seed+3.3);
    float size=0.030+0.10*pow(mag,14.0);
    float b=exp(-(d*d)/(size*size));

const FS_CLOUD = `#version 300 es
precision highp float;
in vec3 vPos; in vec3 vNor; in vec3 vObj;
uniform vec3 uCamPos,uSunPos;
uniform float uAng,uSeed;
out vec4 oCol;
${NOISE_GLSL}
void main(){
  vec3 N=normalize(vNor);
  vec3 L=normalize(uSunPos-vPos);
  float dl=dot(N,L);
  vec3 pr=rotY(vObj,uAng);
  float c=fbm(pr*2.4+uSeed,6)+0.25*fbm(pr*7.0+uSeed+3.0,4)-0.62;
  float a=smoothstep(0.02,0.45,c)*0.92;
  float day=smoothstep(-0.08,0.25,dl);
  vec3 col=vec3(0.90,0.93,0.97)*(0.06+max(dl,0.0)*1.9);
  oCol=vec4(col, a*day+0.035);
}`;

/* ---------------------- 大气边缘散射壳 ---------------------- */
const FS_ATMO = `#version 300 es
precision highp float;
in vec3 vPos; in vec3 vNor;
uniform vec3 uCamPos,uSunPos,uColor;
uniform float uStr,uTerm;
out vec4 oCol;
void main(){
  vec3 N=normalize(vNor);
  vec3 V=normalize(uCamPos-vPos);
  vec3 L=normalize(uSunPos-vPos);
  float ndv=clamp(dot(N,V),0.0,1.0);
  float rim=pow(1.0-ndv,2.4);
  float lit=clamp(dot(N,L)*0.7+0.3,0.0,1.0); lit*=lit;
  float term=exp(-pow(dot(N,L)*1.35,2.0));
  vec3 col=uColor*lit*0.9 + vec3(1.0,0.42,0.15)*term*uTerm*0.9*(0.35+0.65*lit);
  float a=rim*lit*uStr + rim*term*uTerm*0.55 + rim*0.05;
  oCol=vec4(col*a,1.0);
}`;

/* ---------------------- 小行星带 / 柯伊伯带 (GPU 开普勒) ---------------------- */
const VS_BELT = `#version 300 es
precision highp float;
layout(location=0) in vec3 aEl;    /* a, e, M0 */
layout(location=1) in vec3 aEl2;   /* i, Ω, ω */
layout(location=2) in vec2 aMeta;  /* 尺寸, 色相参数 */
uniform mat4 uVP;
uniform vec3 uCam;
uniform float uT, uPix;
uniform vec3 uColA, uColB;
out vec3 vCol; out float vA;
${MAP_GLSL}
${ORBIT_GLSL}
void main(){
  float a=aEl.x, e=aEl.y;
  float n=6.2831853/(365.25*pow(a,1.5));
  float M=mod(aEl.z+n*uT+3.14159265,6.2831853)-3.14159265;
  float E=M+e*sin(M);
  for(int k=0;k<6;k++){ E-=(E-e*sin(E)-M)/(1.0-e*cos(E)); }
  vec3 p=mapPos(orbitPosAU(a,e,aEl2.x,aEl2.y,aEl2.z,E));
  float d=distance(p,uCam);
  gl_Position=uVP*vec4(p,1.0);
  gl_PointSize=clamp(aMeta.x*uPix/d,1.0,7.0);
  vCol=mix(uColA,uColB,aMeta.y);
  vA=clamp(300.0/d,0.12,1.0);
}`;
const FS_BELT = `#version 300 es
precision highp float;
in vec3 vCol; in float vA;
uniform float uGA;
out vec4 oCol;
void main(){

  float r2=dot(q,q);
  if(r2>1.0) discard;
  float a=exp(-r2*3.5)*(1.0-r2);
  oCol=vec4(vCol*a*vA*uGA,1.0);
}`;

/* ---------------------- 后处理: 亮部提取 / 高斯模糊 / 合成 ---------------------- */
const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 oCol;
uniform sampler2D uTex;
uniform float uTh;
void main(){

  float l=dot(c,vec3(0.2126,0.7152,0.0722));

const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 oCol;
uniform sampler2D uTex;
uniform vec2 uDir;
void main(){
  vec3 s=texture(uTex,vUV).rgb*0.227027;
  s+=(texture(uTex,vUV+uDir*1.3846).rgb+texture(uTex,vUV-uDir*1.3846).rgb)*0.316216;
  s+=(texture(uTex,vUV+uDir*3.2308).rgb+texture(uTex,vUV-uDir*3.2308).rgb)*0.070270;

const FS_FINAL = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 oCol;
uniform sampler2D uScene,uB1,uB2,uB3;
uniform float uBloom,uExposure,uSunI,uTime,uCA;
uniform vec2 uSunUV,uRes;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
vec3 flare(vec2 uv){
  if(uSunI<=0.002) return vec3(0.0);
  float asp=uRes.x/uRes.y;
  vec2 uvn=vec2((uv.x-0.5)*asp,uv.y-0.5);
  vec2 s=vec2((uSunUV.x-0.5)*asp,uSunUV.y-0.5);
  vec3 acc=vec3(0.0);
  for(int i=0;i<5;i++){
    float fi=float(i);
    vec2 p=s*(1.0-(0.55+fi*0.42));
    float r=0.016+0.020*fi;
    float dd=length(uvn-p);
    acc+=exp(-dd*dd/(r*r))*0.10*mix(vec3(1.0,0.55,0.25),vec3(0.35,0.65,1.0),fract(fi*0.37+0.2));

  vec2 dv=uvn-s;
  acc+=vec3(0.65,0.75,1.0)*exp(-abs(dv.y)*80.0)*exp(-length(dv)*4.0)*0.30;

}
void main(){
  vec2 off=(vUV-0.5)*abs(vUV-0.5)*uCA*0.01;

  sc.g=texture(uScene,vUV).g;
  sc.b=texture(uScene,vUV-off).b;
  vec3 bl=texture(uB1,vUV).rgb*0.5+texture(uB2,vUV).rgb*0.35+texture(uB3,vUV).rgb*0.30;
  vec3 col=sc+bl*uBloom;

  col*=uExposure;
  col=aces(col);

  float vg=1.0-0.32*pow(length(vUV-0.5)*1.35,2.6);
  col*=vg;
  col+=(fract(sin(dot(vUV*uRes+uTime,vec2(12.9898,78.233)))*43758.5453)-0.5)*0.012;
  oCol=vec4(col,1.0);
}`;
/* ============================ 几何与缓冲 ============================ */
let vaSphere, sphereCount, vaRingGeo, ringCount, vaQuad, vaOrbit, orbitCount, vaCircle, circleCount, vaEmpty;
let vaBelt, beltCount, vaKuiper, kuiperCount;
let vaPts, ptsVBO;
let galX, galY, galZ, coreDir;

function makeVAO(build){
  const vao=gl.createVertexArray();
  gl.bindVertexArray(vao);
  build();
  gl.bindVertexArray(null);
  return vao;
}
function buildSphere(seg, rings){
  const pos=[];
  for(let y=0;y<=rings;y++){
    const th=(y/rings)*Math.PI;
    for(let x=0;x<=seg;x++){
      const ph=(x/seg)*TAU;
      pos.push(Math.sin(th)*Math.cos(ph), Math.cos(th), Math.sin(th)*Math.sin(ph));
    }
  }
  const idx=[];
  for(let y=0;y<rings;y++)for(let x=0;x<seg;x++){
    const a=y*(seg+1)+x, b=a+1, c=a+seg+1, d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  const count=idx.length;
  const vao=makeVAO(()=>{
    const vb=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,vb);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0,3,gl.FLOAT,false,12,0);
    const ib=gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(idx),gl.STATIC_DRAW);
  });
  return {vao,count};
}
function buildGeometry(){
  const s=buildSphere(72,48);
  vaSphere=s.vao; sphereCount=s.count;
  /* 环带三角带 */
  const RSEG=180, rv=[];
  for(let i=0;i<=RSEG;i++){const a=(i/RSEG)*TAU; rv.push(0,a, 1,a);}
  ringCount=(RSEG+1)*2;
  vaRingGeo=makeVAO(()=>{
    const vb=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,vb);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(rv),gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0,2,gl.FLOAT,false,8,0);
  });
  /* 面片 quad */
  vaQuad=makeVAO(()=>{
    const vb=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,vb);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0,2,gl.FLOAT,false,8,0);
  });
  /* 轨道线: 离心角采样 0..2π */
  const OSEG=360, ov=new Float32Array(OSEG+1);
  for(let i=0;i<=OSEG;i++) ov[i]=(i/OSEG)*TAU;
  orbitCount=OSEG+1;
  vaOrbit=makeVAO(()=>{
    const vb=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,vb);
    gl.bufferData(gl.ARRAY_BUFFER,ov,gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0,1,gl.FLOAT,false,4,0);
  });
  vaCircle=vaOrbit; circleCount=orbitCount;
  /* 小行星带 + 柯伊伯带 */
  const belt=genBelt(2800, 2.12, 3.32, 0.16, 9, 0.05, 0.17);
  beltCount=2800;
  vaBelt=makeBeltVAO(belt);
  const kuiper=genBelt(1700, 33.5, 48.5, 0.12, 14, 0.14, 0.42);
  kuiperCount=1700;
  vaKuiper=makeBeltVAO(kuiper);
  /* 彗尾动态缓冲 */
  vaPts=makeVAO(()=>{
    ptsVBO=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,ptsVBO);
    gl.bufferData(gl.ARRAY_BUFFER,512*5*4,gl.STREAM_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1,2,gl.FLOAT,false,20,12);
  });
  vaEmpty=gl.createVertexArray();
  /* 银河坐标基 (黄道→场景) */
  galY=v3.norm([-0.8675,0.4974,-0.0003]);         /* 银北极 */
  galX=v3.norm(v3.cross([0,0,1],galY));
  galZ=v3.cross(galX,galY);
  coreDir=v3.norm([-0.0544,-0.0965,0.9938]);      /* 银心方向(人马座) */
}
function gaussRand(rnd){ return (rnd()+rnd()+rnd()+rnd()-2)*0.7071; }
function genBelt(n, aMin, aMax, eMax, incMax, sizeMin, sizeMax){
  const arr=new Float32Array(n*8), rnd=Math.random;
  for(let i=0;i<n;i++){
    const o=i*8;
    arr[o]  =lerp(aMin,aMax,rnd());
    arr[o+1]=rnd()*eMax;
    arr[o+2]=rnd()*TAU;
    arr[o+3]=gaussRand(rnd)*incMax*D2R;
    arr[o+4]=rnd()*TAU;
    arr[o+5]=rnd()*TAU;
    arr[o+6]=lerp(sizeMin,sizeMax,Math.pow(rnd(),2.2));
    arr[o+7]=rnd();
  }
  return arr;
}
function makeBeltVAO(arr){
  const vao=gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vb=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,vb);
  gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,32,0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,3,gl.FLOAT,false,32,12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,2,gl.FLOAT,false,32,24);
  gl.bindVertexArray(null);
  return vao;
}

function makeRT(w,h){
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,fmtInt,w,h,0,gl.RGBA,fmtType,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const rt={fbo,tex,w,h};
  rtAll.push(rt);
  return rt;
}
function destroyPost(){
  for(const rt of rtAll){ gl.deleteTexture(rt.tex); gl.deleteFramebuffer(rt.fbo); }
  rtAll=[]; rtScene=rtBright=null; rtPing=[]; rtPong=[];
}
function initPost(){
  const w=Math.max(2,canvas.width), h=Math.max(2,canvas.height);
  rtScene=makeRT(w,h);
  rtBright=makeRT(w>>1,h>>1);

  for(let i=0;i<3;i++){
    rtPing.push(makeRT(Math.max(2,bw),Math.max(2,bh)));
    rtPong.push(makeRT(Math.max(2,bw),Math.max(2,bh)));

function bindTex(unit,tex){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,tex); return unit; }
function drawFS(){ gl.bindVertexArray(vaEmpty); gl.drawArrays(gl.TRIANGLES,0,3); }

/* ---------------------- 天体位置解算 ---------------------- */
function updatePositions(){
  const Tc=(simJD-J2000)/36525.0;
  for(const b of bodies){
    if(b.kindIdx==='planet'){
      const el=PLANET_EL[b.el];
      const a=el.a[0]+el.a[1]*Tc, e=el.e[0]+el.e[1]*Tc;
      const inc=(el.i[0]+el.i[1]*Tc)*D2R;
      const L=el.L[0]+el.L[1]*Tc, lp=el.lp[0]+el.lp[1]*Tc;
      const N=(el.N[0]+el.N[1]*Tc)*D2R;
      const w=lp*D2R-N;
      const E=solveKepler((L-lp)*D2R,e);
      keplerToScene(a,e,inc,N,w,E,b.pos);
      b.curEl={a,e,inc,N,w,E};
      b.rAU=a*(1-e*Math.cos(E));
    } else if(b.kindIdx==='comet'){
      const c=COMET_EL[b.cel];
      const E=solveKepler(TAU*(simJD-c.Tp)/c.P, c.e);
      keplerToScene(c.a,c.e,c.i*D2R,c.N*D2R,c.w*D2R,E,b.pos);
      b.curEl={a:c.a,e:c.e,inc:c.i*D2R,N:c.N*D2R,w:c.w*D2R,E};
      b.rAU=c.a*(1-c.e*Math.cos(E));
    } else if(b.kindIdx==='moon'){
      const par=bodies[b.parent];
      const ang=TAU*(simDays/b.T)+b.ph;
      const basis=m3mul(m3rotZ(par.tilt*D2R), m3rotX((b.tiltX||0)*D2R));
      const X=m3v(basis,[1,0,0]), Y=m3v(basis,[0,0,1]);
      const c=Math.cos(ang)*b.r, s=Math.sin(ang)*b.r;
      b.pos=[par.pos[0]+X[0]*c+Y[0]*s, par.pos[1]+X[1]*c+Y[1]*s, par.pos[2]+X[2]*c+Y[2]*s];
      b.spin=ang+Math.PI;                        /* 潮汐锁定 */
      b.X=X; b.Y=Y;
    }
  }
  for(const b of bodies){ if(b.rotH) b.spin=TAU*simDays/(b.rotH/24); }
}

/* ---------------------- 矩阵 ---------------------- */
function buildMatrices(){
  view=m4lookAt(camPos,cam.target,[0,1,0]);
  proj=m4persp(fovRad,W/H,0.05,9000);
  VP=m4mul(proj,view);
  camF=v3.norm(v3.sub(cam.target,camPos));
  camR=v3.norm(v3.cross(camF,[0,1,0]));
  camU=v3.cross(camR,camF);
}

function drawSunBody(){
  const b=bodies[SUN];

function drawRing(b){

function drawClouds(b){

function drawAtmo(b){

/* ---------------------- 彗尾 ---------------------- */
const gasBuf=new Float32Array(88*5), dustBuf=new Float32Array(64*5);
const jit1=new Float32Array(88), jit2=new Float32Array(64);
{ const r=(s=>()=> (s=(s*16807)%2147483647)/2147483647)(1234567);
  for(let i=0;i<88;i++) jit1[i]=(r()*2-1);
  for(let i=0;i<64;i++) jit2[i]=(r()*2-1);
}
function ptsDraw(arr,n,color,ga){
  gl.bindBuffer(gl.ARRAY_BUFFER,ptsVBO);
  gl.bufferData(gl.ARRAY_BUFFER,arr.subarray(0,n*5),gl.STREAM_DRAW);
  useP(P.pts,{uVP:VP,uCam:camPos,uPix:pixScale,uColor:color,uGA:ga});
  gl.drawArrays(gl.POINTS,0,n);
}
function drawComet(b){
  const r=Math.max(b.rAU,0.2);
  const act=clamp((10.0-r)/5.0,0,1);
  if(act<=0.01) return;
  const sp=b.pos;
  const anti=v3.norm(sp);
  const c=COMET_EL[b.cel];
  const E2=solveKepler(TAU*((simJD+0.4)-c.Tp)/c.P, c.e);
  const p2=keplerToScene(c.a,c.e,c.i*D2R,c.N*D2R,c.w*D2R,E2);
  const vel=v3.norm(v3.sub(p2,sp));
  const side=v3.norm(v3.cross(anti,vel));
  const len=clamp(50.0/Math.pow(r,1.2),3,46)*act;
  /* 气尾: 反日方向, 蓝白 */
  let n=88;
  for(let i=0;i<n;i++){
    const s=i/(n-1), o=i*5;
    const lat=jit1[i]*s*len*0.16;
    gasBuf[o]  =sp[0]+anti[0]*s*len+side[0]*lat;
    gasBuf[o+1]=sp[1]+anti[1]*s*len+side[1]*lat;
    gasBuf[o+2]=sp[2]+anti[2]*s*len+side[2]*lat;
    gasBuf[o+3]=len*0.042*(1.0-s*0.70)+0.05;
    gasBuf[o+4]=Math.pow(1.0-s,2.4)*0.42*act;
  }
  /* 尘尾: 略弯向轨道后方, 暖色 */
  n=64;
  for(let i=0;i<n;i++){
    const s=i/(n-1), o=i*5;
    const d=v3.norm(v3.add(anti,v3.scale(vel,0.7*s)));
    const lat=jit2[i]*s*len*0.06;
    dustBuf[o]  =sp[0]+d[0]*s*len*0.75+side[0]*lat;
    dustBuf[o+1]=sp[1]+d[1]*s*len*0.75+side[1]*lat;
    dustBuf[o+2]=sp[2]+d[2]*s*len*0.75+side[2]*lat;
    dustBuf[o+3]=len*0.036*(1.0-s*0.55)+0.04;
    dustBuf[o+4]=Math.pow(1.0-s,1.8)*0.36*act;
  }
  ptsDraw(gasBuf,88,[0.55,0.75,1.0],1.0);
  ptsDraw(dustBuf,64,[1.0,0.82,0.55],1.0);
  drawGlow(sp,0.55+2.4/r,[0.60,0.78,1.0],act*0.7,0.0);
  drawGlow(sp,0.20,[1.0,0.95,0.85],act*1.1,0.0);
}

/* ---------------------- 主场景 ---------------------- */
function drawScene(){
  gl.bindFramebuffer(gl.FRAMEBUFFER,rtScene.fbo);
  gl.viewport(0,0,rtScene.w,rtScene.h);
  gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
  gl.depthMask(true);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  drawSky();
  drawSunBody();
  /* 日冕 (加色, 受深度遮挡) */
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
  drawGlow(bodies[SUN].pos,bodies[SUN].R*7.5,[1.0,0.55,0.22],0.55,1.0);
  drawGlow(bodies[SUN].pos,bodies[SUN].R*2.7,[1.0,0.85,0.55],1.15,0.25);
  gl.disable(gl.BLEND); gl.depthMask(true);
  /* 行星 / 卫星 / 彗核 (不透明) */
  for(const b of bodies){ if(b.kindIdx==='planet') drawBody(b); }
  for(const b of bodies){ if(b.kindIdx==='moon') drawBody(b); }
  for(const b of bodies){ if(b.kindIdx==='comet') drawBody(b); }
  /* 环系 (半透明, 写深度) */
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(true);
  for(const b of bodies){ if(b.ring) drawRing(b); }
  /* 云层与大气 */
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  for(const b of bodies){ if(b.clouds) drawClouds(b); }
  gl.blendFunc(gl.ONE,gl.ONE);
  for(const b of bodies){ if(b.atmo) drawAtmo(b); }
  /* 轨道 / 星带 / 彗尾 (加色) */
  if(opts.orbits) drawOrbits();
  if(opts.belt) drawBelts();
  for(const b of bodies){ if(b.kindIdx==='comet') drawComet(b); }
  gl.depthMask(true);
  gl.disable(gl.BLEND);
}

/* ---------------------- 太阳屏幕位置 (镜头光晕) ---------------------- */
function computeSunUV(){
  const s=bodies[SUN].pos;
  const m=VP;
  const cw=m[3]*s[0]+m[7]*s[1]+m[11]*s[2]+m[15];
  if(cw<=0.001){ sunI=0; return; }
  const cx=(m[0]*s[0]+m[4]*s[1]+m[8]*s[2]+m[12])/cw;
  const cy=(m[1]*s[0]+m[5]*s[1]+m[9]*s[2]+m[13])/cw;
  let vis=clamp(1.25-Math.abs(cx)*0.85,0,1)*clamp(1.25-Math.abs(cy)*0.85,0,1);
  const ro=camPos, rd=v3.norm(v3.sub(s,camPos)), dsun=v3.len(v3.sub(s,camPos));
  for(const b of bodies){
    if(b.kindIdx!=='planet') continue;
    const to=v3.sub(b.pos,ro);
    const t=v3.dot(to,rd);
    if(t>0 && t<dsun){
      const cl=v3.sub(to,v3.scale(rd,t));
      if(v3.len(cl)<b.R*1.05) vis=0;
    }
  }
  sunUV=[cx*0.5+0.5, cy*0.5+0.5];
  sunI=vis;
}

/* ---------------------- 后处理 ---------------------- */
function postProcess(){
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER,rtBright.fbo);
  gl.viewport(0,0,rtBright.w,rtBright.h);
  useP(P.bright,{uTex:bindTex(0,rtScene.tex),uTh:1.02});
  drawFS();
  if(opts.bloom){
    let src=rtBright;
    for(let i=0;i<3;i++){
      const p=rtPing[i], q=rtPong[i];
      gl.bindFramebuffer(gl.FRAMEBUFFER,p.fbo);
      gl.viewport(0,0,p.w,p.h);
      useP(P.blur,{uTex:bindTex(0,src.tex),uDir:[1.0/p.w,0]});
      drawFS();
      gl.bindFramebuffer(gl.FRAMEBUFFER,q.fbo);
      gl.viewport(0,0,q.w,q.h);
      useP(P.blur,{uTex:bindTex(0,p.tex),uDir:[0,1.0/q.h]});
      drawFS();
      src=q;
    }
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,canvas.width,canvas.height);
  useP(P.final,{
    uScene:bindTex(0,rtScene.tex),
    uB1:bindTex(1,rtPong[0].tex),
    uB2:bindTex(2,rtPong[1].tex),
    uB3:bindTex(3,rtPong[2].tex),
    uBloom:opts.bloom?0.95:0.0,
    uExposure:1.12,uSunUV:sunUV,uSunI:sunI,uTime:realtime,uCA:1.2,uRes:[canvas.width,canvas.height]
  });
  drawFS();
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
}
function render(){
  computeSunUV();
  drawScene();
  postProcess();
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(2,Math.floor(innerWidth*DPR)), h=Math.max(2,Math.floor(innerHeight*DPR));
  if(canvas.width!==w||canvas.height!==h){
    canvas.width=w; canvas.height=h;
    canvas.style.width=innerWidth+'px';
    canvas.style.height=innerHeight+'px';
    W=w; H=h;
    if(rtScene) destroyPost();
    initPost();
  }
  pixScale=H/(2*Math.tan(fovRad/2));
}

function minDist(){ return Math.max(bodies[cam.follow].R*1.35,0.25); }

/* 屏幕坐标拾取天体 */
function pickAt(px,py){
  const nx=(px/innerWidth)*2-1, ny=1-(py/innerHeight)*2;
  const tanF=Math.tan(fovRad/2), asp=innerWidth/innerHeight;
  const dir=v3.norm(v3.add(v3.add(camF,v3.scale(camR,nx*tanF*asp)),v3.scale(camU,ny*tanF)));
  let best=-1, bt=1e18;
  for(let i=0;i<bodies.length;i++){
    const b=bodies[i];
    const to=v3.sub(b.pos,camPos);
    const t=v3.dot(to,dir);
    if(t<=0) continue;
    const d=v3.len(v3.sub(to,v3.scale(dir,t)));
    const pr=Math.max(b.R*1.7,t*0.02);
    if(d<pr&&t<bt){ bt=t; best=i; }
  }
  return best;
}

function bindEvents(){
  const cv=$('cv');
  const ptrs=new Map();
  let moved=0, pinchD=0, pinchDist0=0;
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    moved=0;
    cv.classList.add('drag');
    if(ptrs.size===2){
      const a=[...ptrs.values()];
      pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      pinchDist0=cam.tdist;
    }
  });
  cv.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);
    if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    p.x=e.clientX; p.y=e.clientY;
    if(ptrs.size===1){
      cam.yaw-=dx*0.005;
      cam.pitch=clamp(cam.pitch+dy*0.005,-1.53,1.53);
      moved+=Math.abs(dx)+Math.abs(dy);
    } else if(ptrs.size===2){
      const a=[...ptrs.values()];
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinchD>0) cam.tdist=clamp(pinchDist0*pinchD/Math.max(d,10),minDist(),3000);
      moved=99;
    }
  });
  const up=e=>{
    if(!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    cv.classList.remove('drag');
    if(moved<6){
      const hit=pickAt(e.clientX,e.clientY);
      if(hit>=0) focusBody(hit);
    }
  };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',e=>{ ptrs.delete(e.pointerId); cv.classList.remove('drag'); });
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    cam.tdist=clamp(cam.tdist*Math.exp(e.deltaY*0.0012),minDist(),3000);
  },{passive:false});
  cv.addEventListener('dblclick',()=>{
    selected=-1; cam.follow=SUN; cam.tdist=340;
    $('info').style.display='none';
    syncNav();
  });
  window.addEventListener('keydown',e=>{
    if(e.code==='Space'){ e.preventDefault(); setPaused(!paused); }
  });
  window.addEventListener('resize',resize);

  const slider=$('speed');
  slider.addEventListener('input',()=>{
    speedDPS=Math.pow(10,lerp(E_MIN,E_MAX,(+slider.value)/1000));
    refreshSpeed();
  });
  $('btnSlow').addEventListener('click',()=>{ speedDPS=Math.max(speedDPS/10,RT); syncSlider(); });
  $('btnFast').addEventListener('click',()=>{ speedDPS=Math.min(speedDPS*10,Math.pow(10,E_MAX)); syncSlider(); });
  $('btnPause').addEventListener('click',()=>setPaused(!paused));
  $('btnToday').addEventListener('click',()=>{ simJD=nowJD(); });
  $('tOrbits').addEventListener('change',e=>opts.orbits=e.target.checked);
  $('tLabels').addEventListener('change',e=>opts.labels=e.target.checked);
  $('tBelt').addEventListener('change',e=>opts.belt=e.target.checked);
  $('tBloom').addEventListener('change',e=>opts.bloom=e.target.checked);
  $('infoClose').addEventListener('click',()=>$('info').style.display='none');
  syncSlider();
}
function syncSlider(){
  $('speed').value=String(Math.round(clamp((Math.log10(speedDPS)-E_MIN)/(E_MAX-E_MIN),0,1)*1000));
  refreshSpeed();
}
function formatSpeed(dps){
  if(dps>=365.25) return (dps/365.25).toFixed(1)+' 年/秒';
  if(dps>=1) return (dps<10?dps.toFixed(1):String(Math.round(dps)))+' 天/秒';
  if(dps>=1/24) return (dps*24).toFixed(1)+' 小时/秒';
  const fac=dps*86400;
  return fac<1.15?'实时':'×'+(fac>=100?String(Math.round(fac)):fac.toFixed(1));
}
function refreshSpeed(){ $('speedtxt').textContent=formatSpeed(speedDPS); }
function setPaused(v){ paused=v; $('btnPause').textContent=v?'▶':'⏸'; }

/* ---------------------- 标签投影 ---------------------- */
function updateLabels(){
  const show=opts.labels;
  const iw=innerWidth, ih=innerHeight;
  const pixCss=ih/(2*Math.tan(fovRad/2));
  for(let i=0;i<bodies.length;i++){
    const b=bodies[i], el=b.lblEl;
    let vis=show;
    if(vis&&b.kindIdx==='moon'){
      vis=v3.len(v3.sub(camPos,bodies[b.parent].pos))<b.r*9;
    }
    if(vis){
      const s=b.pos;
      const cw=VP[3]*s[0]+VP[7]*s[1]+VP[11]*s[2]+VP[15];
      if(cw<=0.01) vis=false;
      else{
        const cx=(VP[0]*s[0]+VP[4]*s[1]+VP[8]*s[2]+VP[12])/cw;
        const cy=(VP[1]*s[0]+VP[5]*s[1]+VP[9]*s[2]+VP[13])/cw;
        if(cx<-1.05||cx>1.05||cy<-1.05||cy>1.05) vis=false;
        else{
          const rPix=b.R/v3.len(v3.sub(s,camPos))*pixCss;
          if(rPix>110) vis=false;                 /* 特写时隐藏标签 */
          el.style.left=((cx*0.5+0.5)*iw)+'px';
          el.style.top=((1-(cy*0.5+0.5))*ih-rPix-8)+'px';
        }
      }
    }
    el.style.display=vis?'block':'none';
    el.classList.toggle('sel',selected===i);
  }
}

/* ============================ 主循环 ============================ */
function updateCamera(dt){
  const b=bodies[cam.follow];
  const k=1-Math.exp(-dt*6);
  cam.target[0]+=(b.pos[0]-cam.target[0])*k;
  cam.target[1]+=(b.pos[1]-cam.target[1])*k;
  cam.target[2]+=(b.pos[2]-cam.target[2])*k;
  cam.dist+=(cam.tdist-cam.dist)*(1-Math.exp(-dt*5));
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  camPos[0]=cam.target[0]+cp*Math.sin(cam.yaw)*cam.dist;
  camPos[1]=cam.target[1]+sp*cam.dist;
  camPos[2]=cam.target[2]+cp*Math.cos(cam.yaw)*cam.dist;
}
let lastT=0, bootShown=false;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05, lastT?((t-lastT)/1000):0.016);
  lastT=t;
  realtime+=dt;
  window.__frames++;
  if(!paused) simJD+=speedDPS*dt;
  simDays=simJD-J2000;
  resize();
  updatePositions();
  updateCamera(dt);
  buildMatrices();
  render();
  updateLabels();
  updateHUD();
  if(!bootShown){ bootShown=true; $('loading').classList.add('hide'); }
}
function boot(){
  canvas=$('cv');
  gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:true,powerPreference:'high-performance'});
  if(!gl){
    $('loading').innerHTML='<div style="max-width:80vw;font-size:13px;color:#f8b0b0;text-align:center;line-height:1.8">当前浏览器不支持 WebGL2<br>请使用新版 Chrome / Edge / Safari / Firefox 打开</div>';
    return;
  }
  if(gl.getExtension('EXT_color_buffer_float')){ fmtInt=gl.RGBA16F; fmtType=gl.HALF_FLOAT; }
  else { fmtInt=gl.RGBA8; fmtType=gl.UNSIGNED_BYTE; }
  buildGeometry();
  buildPrograms();
  resize();
  buildUI();
  bindEvents();
  updatePositions();
  requestAnimationFrame(loop);
}
boot();
</script>
