<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>太阳系实时运动模型</title>
<style>
:root{
  --bg:#03050a;
  --glass:rgba(11,17,29,.55);
  --glass2:rgba(11,17,29,.72);
  --line:rgba(150,190,255,.13);
  --line2:rgba(150,190,255,.26);
  --txt:rgba(216,232,255,.93);
  --dim:rgba(148,174,210,.60);
  --dim2:rgba(148,174,210,.40);
  --acc:#7fc4ff;
  --acc2:#ffca7a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:var(--bg);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;font-size:12px;}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
canvas#gl.drag{cursor:grabbing;}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2;}
.lbl{position:absolute;left:0;top:0;font-size:11px;letter-spacing:.16em;white-space:nowrap;color:rgba(224,239,255,.92);
     text-shadow:0 0 9px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,1);will-change:transform,opacity;}
.lbl.star{color:rgba(255,231,180,.95);letter-spacing:.34em;font-size:12px;}
.lbl.moon{font-size:10px;letter-spacing:.1em;color:rgba(196,216,244,.82);}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5;}
.panel{position:absolute;background:var(--glass);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--line);border-radius:13px;pointer-events:auto;box-shadow:0 14px 46px rgba(0,0,0,.5);}
.ph{display:flex;align-items:baseline;gap:9px;padding:11px 14px 9px;border-bottom:1px solid rgba(150,190,255,.10);
  font-size:12px;letter-spacing:.22em;color:rgba(226,240,255,.88);}
.ph2{font-size:9px;letter-spacing:.28em;color:var(--dim2);font-weight:400;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}

/* ---------- left catalog ---------- */
#left{left:16px;top:16px;width:214px;max-height:calc(100% - 32px);display:flex;flex-direction:column;}
#tree{overflow-y:auto;padding:6px 6px 10px;}
#tree::-webkit-scrollbar{width:6px}
#tree::-webkit-scrollbar-thumb{background:rgba(150,190,255,.16);border-radius:3px}
.grp{padding:9px 9px 4px;font-size:9.5px;letter-spacing:.3em;color:var(--dim2);}
.it{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;color:rgba(206,224,250,.82);
  transition:background .13s,color .13s;user-select:none;}
.it:hover{background:rgba(120,170,235,.11);color:#eaf3ff;}
.it.on{background:rgba(120,175,240,.17);color:#fff;box-shadow:inset 0 0 0 1px rgba(140,190,255,.18);}
.it .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 7px currentColor;background:currentColor;}
.it.moon{margin-left:14px;font-size:11px;color:rgba(178,200,232,.72);padding:3.5px 8px;}
.it.moon .dot{width:5px;height:5px;}

/* ---------- right info card ---------- */
#right{right:16px;top:16px;width:296px;max-height:calc(100% - 380px);display:flex;flex-direction:column;}
#card{overflow-y:auto;padding:0 0 12px;}
#card::-webkit-scrollbar{width:6px}
#card::-webkit-scrollbar-thumb{background:rgba(150,190,255,.16);border-radius:3px}
.ch{padding:13px 15px 11px;border-bottom:1px solid rgba(150,190,255,.09);}
.ct{font-size:19px;letter-spacing:.09em;font-weight:500;display:flex;align-items:center;gap:8px;}
.ct .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor;}
.cs{font-size:9.5px;letter-spacing:.3em;color:var(--dim2);margin-top:3px;}
.lv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 15px;}
.lv .k{font-size:11px;color:var(--dim);letter-spacing:.05em;}
.lv .v{font-size:12px;text-align:right;color:rgba(232,242,255,.95);font-variant-numeric:tabular-nums;}
.grpH{padding:12px 15px 4px;font-size:9.5px;letter-spacing:.3em;color:var(--dim2);}
.tb{padding:2px 15px;}
.tb .r{display:flex;justify-content:space-between;gap:12px;padding:3.5px 0;border-bottom:1px dashed rgba(150,190,255,.07);}
.tb .r span:first-child{color:var(--dim);font-size:11px;letter-spacing:.04em;flex:0 0 auto;}
.tb .r span:last-child{color:rgba(226,238,255,.9);font-size:11px;text-align:right;font-variant-numeric:tabular-nums;}
.dsc{padding:10px 15px 2px;font-size:11.5px;line-height:1.85;color:rgba(190,209,236,.80);letter-spacing:.02em;}

/* ---------- bottom bar ---------- */
#bar{left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:13px;padding:9px 13px;}
.ic{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:rgba(120,170,235,.10);color:var(--acc);
  cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.14s;font-family:inherit;}
.ic:hover{background:rgba(120,170,235,.22);border-color:rgba(150,200,255,.45);}
.txtb{height:30px;padding:0 13px;border-radius:8px;border:1px solid var(--line2);background:rgba(120,170,235,.10);color:rgba(226,240,255,.9);
  cursor:pointer;font-size:11.5px;letter-spacing:.14em;transition:.14s;font-family:inherit;}
.txtb:hover{background:rgba(120,170,235,.22);}
.bcol{min-width:188px;}
#clock{font-size:13px;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:rgba(232,242,255,.96);}
#rate{font-size:10px;letter-spacing:.12em;color:var(--acc2);margin-top:2px;font-variant-numeric:tabular-nums;}
#spd{-webkit-appearance:none;appearance:none;width:172px;height:3px;border-radius:2px;background:rgba(150,190,255,.18);outline:none;}
#spd::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:linear-gradient(180deg,#bfe2ff,#5aa6e8);
  cursor:pointer;box-shadow:0 0 9px rgba(120,190,255,.6);}
#spd::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:#8cc8f5;cursor:pointer;}

/* ---------- toggles ---------- */
#tog{right:16px;bottom:18px;width:196px;padding-bottom:8px;}
#togs{padding:8px 12px 4px;display:flex;flex-direction:column;gap:1px;}
.tg{display:flex;align-items:center;gap:9px;padding:4.5px 3px;cursor:pointer;user-select:none;transition:.13s;}
.tg:hover .tn{color:#eaf3ff;}
.tg .box{width:13px;height:13px;border-radius:4px;border:1px solid rgba(150,190,255,.34);background:rgba(120,170,235,.07);
  position:relative;flex:0 0 auto;transition:.14s;}
.tg.on .box{background:rgba(120,180,250,.55);border-color:rgba(160,210,255,.75);box-shadow:0 0 10px rgba(120,185,255,.42);}
.tg.on .box::after{content:"";position:absolute;left:3.6px;top:.6px;width:4px;height:8px;border:solid #04101e;border-width:0 2px 2px 0;transform:rotate(42deg);}
.tg .tn{font-size:11.5px;color:rgba(198,216,242,.82);letter-spacing:.05em;flex:1 1 auto;}
.tg .tk{font-size:9px;color:var(--dim2);letter-spacing:.1em;}
.fnote{margin:6px 12px 2px;padding-top:8px;border-top:1px solid rgba(150,190,255,.10);font-size:9.5px;line-height:1.75;
  color:rgba(132,158,196,.62);letter-spacing:.02em;}
.fnote b{color:rgba(160,200,245,.82);font-weight:500;}

/* ---------- warning / hints ---------- */
#warn{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:5px 14px;border-radius:20px;
  background:rgba(80,45,15,.42);border:1px solid rgba(255,180,90,.32);color:rgba(255,214,160,.95);font-size:11px;letter-spacing:.12em;
  opacity:0;transition:opacity .4s;pointer-events:none;backdrop-filter:blur(10px);}
#warn.show{opacity:1;}
#help{position:absolute;left:16px;bottom:18px;font-size:9.5px;letter-spacing:.13em;color:var(--dim2);line-height:1.9;pointer-events:none;}
#help b{color:rgba(150,180,220,.6);font-weight:500;}
#fps{position:absolute;left:16px;bottom:18px;}

#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:40px;
  color:#cfe0f5;background:#03050a;font-size:13px;line-height:2;letter-spacing:.05em;z-index:99;}

@media (max-width:900px){
  #right{width:250px;max-height:calc(100% - 360px);}
  #left{width:180px;}
  #tog{width:172px;}
}
@media (max-width:680px){
  #right{display:none;}
  #help{display:none;}
  #spd{width:110px;}
  .bcol{min-width:140px;}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="ui">
  <div id="left" class="panel">
    <div class="ph"><span>天体目录</span><span class="ph2">CATALOG</span></div>
    <div id="tree"></div>
  </div>
  <div id="right" class="panel">
    <div id="card"></div>
  </div>
  <div id="bar" class="panel">
    <button id="btnPlay" class="ic" title="播放 / 暂停（空格）">❚❚</button>
    <div class="bcol">
      <div id="clock" class="num">—</div>
      <div id="rate" class="num">—</div>
    </div>
    <input id="spd" type="range" min="-100" max="100" step="0.5" value="0">
    <button id="btnNow" class="txtb" title="回到当前真实时刻">此刻</button>
  </div>
  <div id="tog" class="panel">
    <div class="ph"><span>显示</span><span class="ph2">DISPLAY</span></div>
    <div id="togs"></div>
    <div class="fnote">距离采用<b>幂律压缩</b>以适配同屏显示，<b>角位置、轨道相位、周期、偏心率与倾角均为真实值</b>。行星与小天体位置由 JPL 近似轨道根数实时解算。</div>
  </div>
  <div id="warn">已超出根数有效区间（1800–2050），当前为外推值</div>
  <div id="help"><b>拖拽</b> 旋转　<b>滚轮</b> 缩放　<b>点击天体</b> 聚焦<br><b>空格</b> 暂停　<b>← →</b> 调速　<b>H</b> 隐藏界面</div>
</div>
<div id="fatal"></div>

<script>
"use strict";
(function(){
/* =========================================================================
   太阳系实时运动模型 — 单文件 WebGL2 实现
   轨道根数: NASA/JPL《主要行星近似位置》(1800-2050)
   ========================================================================= */

/* ------------------------------ 基础常量 ------------------------------ */
const PI = Math.PI, TAU = PI*2, D2R = PI/180, R2D = 180/PI;
const J2000 = 2451545.0;
const AU_KM = 149597870.7;
const C_KMS = 29.7847;                 // 地球平均轨道速度 km/s
const EARTH_R_KM = 6371.0;
const SCALE = 34.0;                    // 显示半径总缩放
const COMPRESS_N = 0.62;               // 正常显示压缩指数
const COMPRESS_T = 1.00;               // 真实距离比例
const SUN_DISP = 4.6;

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const norm360=d=>{d=d%360;return d<0?d+360:d;};
const normPi=a=>{a=a%TAU;if(a>PI)a-=TAU;if(a<-PI)a+=TAU;return a;};

/* ------------------------------ 向量 / 矩阵 ------------------------------ */
function v3(x,y,z){return [x,y,z];}
function vadd(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function vsub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function vscale(a,s){return [a[0]*s,a[1]*s,a[2]*s];}
function vdot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function vcross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function vlen(a){return Math.hypot(a[0],a[1],a[2]);}
function vnorm(a){const l=vlen(a)||1;return [a[0]/l,a[1]/l,a[2]/l];}
function vlerp(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}

function m4(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;}
function m4ident(o){o.fill(0);o[0]=o[5]=o[10]=o[15]=1;return o;}
function m4mul(o,a,b){
  const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],
        a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
  for(let i=0;i<4;i++){
    const b0=b[i*4],b1=b[i*4+1],b2=b[i*4+2],b3=b[i*4+3];
    o[i*4  ]=a00*b0+a10*b1+a20*b2+a30*b3;
    o[i*4+1]=a01*b0+a11*b1+a21*b2+a31*b3;
    o[i*4+2]=a02*b0+a12*b1+a22*b2+a32*b3;
    o[i*4+3]=a03*b0+a13*b1+a23*b2+a33*b3;
  }
  return o;
}
function m4persp(o,fovy,aspect,n,f){
  const t=1/Math.tan(fovy/2);
  o.fill(0);
  o[0]=t/aspect;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);
  return o;
}
function m4look(o,eye,ctr,up){
  let zx=eye[0]-ctr[0],zy=eye[1]-ctr[1],zz=eye[2]-ctr[2];
  let l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
  let xx=up[1]*zz-up[2]*zy,xy=up[2]*zx-up[0]*zz,xz=up[0]*zy-up[1]*zx;
  l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;
  o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;
  o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  o[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  o[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
  o[15]=1;return o;
}
function m4invert(o,m){
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],
        a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,
        b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,
        b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if(!det)return m4ident(o);
  det=1/det;
  o[0]=(a11*b11-a12*b10+a13*b09)*det; o[1]=(a02*b10-a01*b11-a03*b09)*det;
  o[2]=(a31*b05-a32*b04+a33*b03)*det; o[3]=(a22*b04-a21*b05-a23*b03)*det;
  o[4]=(a12*b08-a10*b11-a13*b07)*det; o[5]=(a00*b11-a02*b08+a03*b07)*det;
  o[6]=(a32*b02-a30*b05-a33*b01)*det; o[7]=(a20*b05-a22*b02+a23*b01)*det;
  o[8]=(a10*b10-a11*b08+a13*b06)*det; o[9]=(a01*b08-a00*b10-a03*b06)*det;
  o[10]=(a30*b04-a31*b02+a33*b00)*det;o[11]=(a21*b02-a20*b04-a23*b00)*det;
  o[12]=(a11*b07-a10*b09-a12*b06)*det;o[13]=(a00*b09-a01*b07+a02*b06)*det;
  o[14]=(a31*b01-a30*b03-a32*b00)*det;o[15]=(a20*b03-a21*b01+a22*b00)*det;
  return o;
}
/* 由正交基 + 平移 + 缩放构造模型矩阵 */
function m4trs(o,X,Y,Z,t,s){
  o[0]=X[0]*s;o[1]=X[1]*s;o[2]=X[2]*s;o[3]=0;
  o[4]=Y[0]*s;o[5]=Y[1]*s;o[6]=Y[2]*s;o[7]=0;
  o[8]=Z[0]*s;o[9]=Z[1]*s;o[10]=Z[2]*s;o[11]=0;
  o[12]=t[0];o[13]=t[1];o[14]=t[2];o[15]=1;return o;
}
function m4rotY(o,a){
  const c=Math.cos(a),s=Math.sin(a);
  m4ident(o);o[0]=c;o[2]=-s;o[8]=s;o[10]=c;return o;
}
function m4fromM3(o,m3){
  o[0]=m3[0];o[1]=m3[1];o[2]=m3[2];o[3]=0;
  o[4]=m3[3];o[5]=m3[4];o[6]=m3[5];o[7]=0;
  o[8]=m3[6];o[9]=m3[7];o[10]=m3[8];o[11]=0;
  o[12]=0;o[13]=0;o[14]=0;o[15]=1;return o;
}
function m3fromM4(o,m){
  o[0]=m[0];o[1]=m[1];o[2]=m[2];
  o[3]=m[4];o[4]=m[5];o[5]=m[6];
  o[6]=m[8];o[7]=m[9];o[8]=m[10];return o;
}
/* 以 axis 为 Y 轴构造右手正交基 [X,Y,Z] */
function orthoBasis(axis){
  const ref = Math.abs(axis[1])<0.9 ? [0,1,0] : [1,0,0];
  const X = vnorm(vcross(ref,axis));
  const Z = vcross(X,axis);
  return [X,axis,Z];
}

/* ------------------------------ 开普勒与轨道根数 ------------------------------ */
/* 解 E - e sinE = M */
function kepler(M,e){
  M = normPi(M);
  let E = M + e*Math.sin(M)*(1+e*Math.cos(M));
  for(let i=0;i<12;i++){
    const d = (E - e*Math.sin(E) - M)/(1 - e*Math.cos(E));
    E -= d;
    if(Math.abs(d)<1e-13) break;
  }
  return E;
}
/* 由根数与偏近点角求黄道直角坐标 */
function orbitalToEcl(el,E){
  const a=el.a, e=el.e;
  const I=el.I*D2R, Om=el.Om*D2R, w=(el.varpi-el.Om)*D2R;
  const xp = a*(Math.cos(E)-e);
  const yp = a*Math.sqrt(Math.max(0,1-e*e))*Math.sin(E);
  const cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I),sI=Math.sin(I),cw=Math.cos(w),sw=Math.sin(w);
  const x = (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp;
  const y = (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp;
  const z = (sw*sI)*xp + (cw*sI)*yp;
  return [x,y,z];
}
/* 黄道坐标 → 世界坐标 (x, z, -y) */
function eclToWorld(e){return [e[0],e[2],-e[1]];}

/* ------------------------------ 显示比例压缩 ------------------------------ */
let COMPRESS = COMPRESS_N;
function compressRadius(rAU){ return SCALE*Math.pow(Math.max(rAU,1e-6), COMPRESS); }
function compressPos(p, rAU){
  const l = Math.hypot(p[0],p[1],p[2]);
  if(l<1e-9) return [0,0,0];
  const k = compressRadius(rAU)/l;
  return [p[0]*k,p[1]*k,p[2]*k];
}
/* 阳光强度（压缩过的 1/r 衰减，避免外行星全黑） */
function sunIntensity(rAU){ return clamp(1.5*Math.pow(1/Math.max(rAU,0.05),0.40),0.26,2.1); }

/* =========================== 天体数据（照抄规格书） =========================== */

/* =========================== 场景对象构建 =========================== */
const ALL = [];             // 全部可渲染/可选取天体
const BY_ID = {};
function displayRadius(km){ return 0.72*Math.pow(km/EARTH_R_KM,0.42); }

function makeBody(def, kind){
  const b = Object.assign({},def);
  b.kind = kind;
  b.dispR = (kind==='star') ? SUN_DISP : displayRadius(def.radiusKm);
  b.world = [0,0,0];       // 世界坐标位置
  b.ecl  = [0,0,0];        // 黄道坐标位置
  b.rAU  = 0;              // 日心距 (AU)
  b.lon  = 0;              // 日心黄经
  b.lat  = 0;              // 日心黄纬
  b.vel  = 0;              // 轨道速度 km/s
  b.E    = 0;              // 当前偏近点角
  b.phase= 0;              // 自转相位
  b.occ  = 0;              // 遮挡标记
  ALL.push(b); BY_ID[b.id]=b;
  return b;
}
const sunObj = makeBody(SUN,'star');
const planetObjs = PLANETS.map(p=>makeBody(p,'planet'));
const dwarfObjs  = DWARFS.map(p=>makeBody(p,'dwarf'));
const moonObjs   = MOONS.map(m=>{
  const b = makeBody(m,'moon');
  b.parent = BY_ID[m.parent];
  return b;
});

/* 卫星显示距离基准：环外缘 + 最内层卫星显示半径比 + 余量 */
function moonBaseFactor(parent){
  const rg = RINGS[parent.id];
  const ringOuter = rg ? rg.outer : 0;
  let a0=0, r0=0;
  for(const m of moonObjs){ if(m.parent!==parent) continue; if(!a0||m.orbitKm<a0){a0=m.orbitKm;r0=m.radiusKm;} }
  const ratio = a0 ? displayRadius(r0)/parent.dispR : 0;
  return Math.max(2.35, ringOuter + ratio + 0.55);
}
moonObjs.forEach(b=>{
  let a0=0;
  for(const x of moonObjs){ if(x.parent===b.parent && (!a0||x.orbitKm<a0)) a0=x.orbitKm; }
  b.a0Ref = a0;
  b.base = moonBaseFactor(b.parent);
});

function speedToDaysPerSec(v){
  const s = v<0?-1:1, a = Math.abs(v);
  return s*1.157407e-5*Math.pow(10, a/100*8.55);
}
function formatRate(dps){
  const a = Math.abs(dps);
  const sgn = dps<0 ? '−' : '';
  if(a < 1/86400) return sgn+(a*86400*60).toFixed(1)+' 秒/秒';
  if(a < 1/1440)  return sgn+(a*1440*60).toFixed(1)+' 分/秒';
  if(a < 1/24)    return sgn+(a*24*60).toFixed(1)+' 时/秒';
  if(a < 1)       return sgn+(a*24).toFixed(2)+' 小时/秒';
  if(a < 60)      return sgn+a.toFixed(2)+' 天/秒';
  if(a < 365.25*0.5) return sgn+(a*24).toFixed(1)+' 小时/秒';
  return sgn+(a/365.25).toFixed(2)+' 年/秒';
}
function formatJD(jd){
  const ms = (jd-2440587.5)*86400000;
  const d = new Date(ms);
  const p=(n,w)=>(n<10?'0':'')+n;
  const wd = ['日','一','二','三','四','五','六'][d.getUTCDay()];
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())+' UTC 周'+wd;
}
function jdYear(jd){
  const ms=(jd-2440587.5)*86400000, d=new Date(ms);
  return d.getUTCFullYear() + (d.getUTCMonth()+(d.getUTCDate()-1)/30)/12;
}

/* =========================== 轨道根数推进 =========================== */
function elementsAt(b,T){
  const e=b.el, r=b.rate;
  return { a:e[0]+r[0]*T, e:e[1]+r[1]*T, I:e[2]+r[2]*T,
           L:e[3]+r[3]*T, varpi:e[4]+r[4]*T, Om:e[5]+r[5]*T };
}
const ORBIT_PLANETS = planetObjs.concat(dwarfObjs);
const rotDays = b => (b.rot ? b.rot.rotH/24 : 1);
const rotAxisWorld = b => {
  const t = b.rot.tilt*D2R, p = b.rot.poleLon*D2R;
  const ax = [Math.sin(t)*Math.cos(p), Math.sin(t)*Math.sin(p), Math.cos(t)];
  return [ax[0], ax[2], -ax[1]];              // 黄道 → 世界
};

function updateBodies(dDays){
  const jd = nowJD(), T = (jd-J2000)/36525;
  for(const b of ORBIT_PLANETS){
    const el = elementsAt(b,T); b.cur = el;
    const M = normPi((el.L-el.varpi)*D2R);
    const E = kepler(M, el.e); b.E = E;
    const ecl = orbitalToEcl(el,E);
    b.ecl = ecl;
    b.rAU = Math.hypot(ecl[0],ecl[1],ecl[2]);
    b.lon = norm360(Math.atan2(ecl[1],ecl[0])*R2D);
    b.lat = Math.asin(clamp(ecl[2]/b.rAU,-1,1))*R2D;
    b.vel = C_KMS*Math.sqrt(Math.max(2/b.rAU-1/el.a,1e-9));
    b.peri = el.a*(1-el.e); b.aphe = el.a*(1+el.e);
    b.world = compressPos(eclToWorld(ecl), b.rAU);
  }
  // 自转相位（每帧增量限速，避免高倍速频闪）
  for(const b of ALL){
    if(b.kind==='comet') continue;
    const rd = rotDays(b);
    b.phase = normPi(b.phase + clamp(TAU*dDays/rd, -0.22, 0.22));
  }
  // 卫星
  for(const m of moonObjs){
    const p = m.parent;
    const th = TAU*(jd-J2000)/m.period + m.phase0;
    const d = p.dispR*m.base*Math.pow(m.orbitKm/m.a0Ref, 0.55);
    m.dispD = d;
    const ci=Math.cos(m.inc*D2R), si=Math.sin(m.inc*D2R);
    const lx=Math.cos(th)*d, lz=Math.sin(th)*d;
    const ly2 = -lz*si, lz2 = lz*ci;
    if(m.plane==='ecl'){
      // 局部系 = 黄道系：world = (x, z, -y)
      m.world = [p.world[0]+lx, p.world[1]+lz2, p.world[2]-ly2];
    }else{
      const B = p.basis;
      m.world = [
        p.world[0] + B[0][0]*lx + B[1][0]*ly2 + B[2][0]*lz2,
        p.world[1] + B[0][1]*lx + B[1][1]*ly2 + B[2][1]*lz2,
        p.world[2] + B[0][2]*lx + B[1][2]*ly2 + B[2][2]*lz2
      ];
    }
    const off=[m.world[0]-p.world[0],m.world[1]-p.world[1],m.world[2]-p.world[2]];
    m.rAU = Math.hypot(m.world[0],m.world[1],m.world[2]);
    m.lon = norm360(Math.atan2(off[1],off[0])*R2D);
    m.lat = 0;
    m.vel = 0; m.peri=0; m.aphe=0;
  }
  // 哈雷彗星
  const h = halleyObj;
  const Mh = normPi(TAU*(jd-HALLEY.Tp)/HALLEY.P);
  h.E = kepler(Mh, HALLEY.e);
  const elh = {a:HALLEY.a, e:HALLEY.e, I:HALLEY.I, L:HALLEY.L||0, varpi:HALLEY.Om+HALLEY.w, Om:HALLEY.Om};
  elh.L = elh.varpi + Mh*R2D;
  const eh = orbitalToEcl(elh, h.E);
  h.ecl = eh;
  h.rAU = Math.hypot(eh[0],eh[1],eh[2]);
  h.lon = norm360(Math.atan2(eh[1],eh[0])*R2D);
  h.lat = Math.asin(clamp(eh[2]/h.rAU,-1,1))*R2D;
  h.world = compressPos(eclToWorld(eh), h.rAU);
  h.peri = HALLEY.a*(1-HALLEY.e); h.aphe = HALLEY.a*(1+HALLEY.e);
  h.vel = C_KMS*Math.sqrt(Math.max(2/h.rAU-1/HALLEY.a,1e-9));
  h.visible = h.rAU < 6.5;
  // 彗尾方向
  if(h.visible){
    const dE=0.002, a=h.E+dE;
    const el2={a:elh.a,e:elh.e,I:elh.I,L:elh.L,varpi:elh.varpi,Om:elh.Om};
    const e2=orbitalToEcl(el2,a);
    const v=[e2[0]-eh[0],e2[1]-eh[1],e2[2]-eh[2]];
    h.velDir = vnorm(compressPos(eclToWorld(v), 1e-9));
  }
}

/* =========================== 相机 =========================== */
function focusDistance(b){
  if(b.kind==='star') return 20;
  if(b.kind==='comet') return 2.2;
  if(b.kind==='moon') return Math.max(2.4, b.dispR*11);
  return Math.max(5.5, b.dispR*7.2);
}
function updateCamera(dt){
  const f = state.focus;
  if(f){
    cam.tgtGoal = f.world.slice();
    cam.distGoal = focusDistance(f);
  }else{
    cam.tgtGoal = [0,0,0];
    cam.distGoal = 330;
  }
  const k = 1-Math.exp(-dt*3.0);
  cam.tgt = vlerp(cam.tgt, cam.tgtGoal, k);
  cam.dist = lerp(cam.dist, cam.distGoal, k);
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const dir=[cp*Math.cos(cam.yaw), sp, cp*Math.sin(cam.yaw)];
  cam.eye = vadd(cam.tgt, vscale(dir, cam.dist));
  cam.fwd = vnorm(vsub(cam.tgt, cam.eye));
  let r = vcross(cam.fwd,[0,1,0]);
  if(vlen(r)<1e-5) r=[1,0,0];
  cam.right = vnorm(r);
  cam.up = vnorm(vcross(cam.right, cam.fwd));
  const aspect = canvas.width/canvas.height;
  m4persp(projM, cam.fov, aspect, nearPlane(), farPlane());
  m4look(viewM, cam.eye, cam.tgt, [0,1,0]);
  m4mul(viewProjM, projM, viewM);
  m4invert(invViewProjM, viewProjM);
}
function targetDist(){ return Math.max(vlen(vsub(cam.eye,cam.tgt)), 1e-4); }
function nearPlane(){ return Math.max(0.012, targetDist()*0.0035); }
function farPlane(){ return Math.max(targetDist()*14, 4200); }

/* =========================== 轨道曲线 =========================== */
const ORBIT_N = 420;
const orbitCache = new Map();
let ORBIT_VER = 0;
function buildOrbit(b, T){
  const key = b.id;
  const prev = orbitCache.get(key);
  if(prev && Math.abs(prev.T-T)<1e-7 && prev.c===COMPRESS) return prev;
  const el = elementsAt(b,T);
  const pts = new Float32Array(ORBIT_N*3);
  for(let i=0;i<ORBIT_N;i++){
    const E = i/ORBIT_N*TAU;
    const e = orbitalToEcl(el,E);
    const r = Math.hypot(e[0],e[1],e[2]);
    const w = compressPos(eclToWorld(e), r);
    pts[i*3]=w[0]; pts[i*3+1]=w[1]; pts[i*3+2]=w[2];
  }
  const rec = {T, c:COMPRESS, pts, ver:++ORBIT_VER};
  orbitCache.set(key, rec);
  return rec;
}
function rebuildAllOrbits(T){
  orbitCache.clear();
  for(const b of ORBIT_PLANETS) buildOrbit(b,T);
}

const extCBF = gl.getExtension('EXT_color_buffer_float');
gl.getExtension('EXT_float_blend');
gl.getExtension('OES_texture_float_linear');
const HDR = !!extCBF;
const CFMT = HDR ? gl.RGBA16F : gl.RGBA8;
const CTYPE = HDR ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

function numbered(src){
  return src.split('\n').map((l,i)=>String(i+1).padStart(4,' ')+' | '+l).join('\n');
}
function compile(type,src,name){
  const s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    console.error('★ 着色器编译失败 ['+name+']\n'+gl.getShaderInfoLog(s)+'\n'+numbered(src));
    throw new Error('shader '+name);
  }
  return s;
}
function makeProgram(vs,fs,name){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs,name+'.vert'));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs,name+'.frag'));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){
    console.error('★ 程序链接失败 ['+name+']\n'+gl.getProgramInfoLog(p));
    throw new Error('link '+name);
  }
  const u={}, n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const info=gl.getActiveUniform(p,i); u[info.name.replace('[0]','')]=gl.getUniformLocation(p,info.name); }
  return {p: p, u: u, name: name};
}
function buf(data,usage){
  const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,data,usage||gl.STATIC_DRAW); return b;
}

/* =========================== 公共 GLSL：噪声库 =========================== */
const GLSL_NOISE = `
#define PI 3.141592653589793
float sstep(float a,float b,float x){ float t=clamp((x-a)/(b-a),0.0,1.0); return t*t*(3.0-2.0*t); }
float hash11(float n){ n=fract(n*0.1031); n*=n+33.33; n*=n+n; return fract(n); }
float hash13(vec3 p3){ p3=fract(p3*0.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
vec3 hash33(vec3 p3){ p3=fract(p3*vec3(0.1031,0.1030,0.0973)); p3+=dot(p3,p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }
float vnoise(vec3 x){
  vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  float n000=hash13(i), n100=hash13(i+vec3(1,0,0)), n010=hash13(i+vec3(0,1,0)), n110=hash13(i+vec3(1,1,0));
  float n001=hash13(i+vec3(0,0,1)), n101=hash13(i+vec3(1,0,1)), n011=hash13(i+vec3(0,1,1)), n111=hash13(i+vec3(1,1,1));
  return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y), mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y), f.z);
}
const mat3 M3 = mat3( 0.00, 0.80, 0.60, -0.80, 0.36,-0.48, -0.60,-0.48, 0.64);
float fbm(vec3 p,int oct){
  float a=0.5,s=0.0,n=0.0;
  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*vnoise(p); n+=a; a*=0.5; p=M3*p*2.03; }
  return s/max(n,1e-5);
}
float fbm2(vec3 p,int oct){ return fbm(p,oct)*2.0-1.0; }
float n1d(float x){ float i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f); return mix(hash11(i),hash11(i+1.0),f); }
float fbm1(float x){ float a=0.5,s=0.0,n=0.0; for(int i=0;i<5;i++){ s+=a*n1d(x); n+=a; a*=0.5; x*=2.07; } return s/n; }
/* Worley: 返回 (F1, F2, 胞随机 id) —— 细胞结构必须用 F2-F1 */
vec3 worley(vec3 p){
  vec3 ip=floor(p), fp=fract(p);
  float f1=9.0,f2=9.0,id=0.0;
  for(int x=-1;x<=1;x++) for(int y=-1;y<=1;y++) for(int z=-1;z<=1;z++){
    vec3 g=vec3(float(x),float(y),float(z));
    vec3 o=hash33(ip+g);
    vec3 r=g+o-fp;
    float d=dot(r,r);
    if(d<f1){ f2=f1; f1=d; id=hash13(ip+g+vec3(17.3,5.1,9.7)); }
    else if(d<f2){ f2=d; }
  }
  return vec3(sqrt(f1),sqrt(f2),id);
}
`;

/* =========================== 小行星带（顶点着色器解普勒） =========================== */
const VS_BELT = `#version 300 es
#define PI 3.141592653589793
in float aA, aE, aI, aO, aW, aM0, aN, aSize;
uniform mat4 uViewProj; uniform vec3 uCamPos; uniform float uDays, uCompress, uScale, uPx, uDpr;
out float vB;
void main(){
  float M = mod(aM0 + aN*uDays + PI, 2.0*PI) - PI;
  float E = M + aE*sin(M)*(1.0+aE*cos(M));
  for(int i=0;i<6;i++){
    float d = (E - aE*sin(E) - M)/(1.0 - aE*cos(E));
    E -= d; if(abs(d)<1e-7) break;
  }
  float a=aA, e=aE, I=aI, O=aO, w=aW;
  float xp = a*(cos(E)-e), yp = a*sqrt(max(1.0-e*e,0.0))*sin(E);
  float cO=cos(O), sO=sin(O), cI=cos(I), sI=sin(I), cw=cos(w), sw=sin(w);
  float x = (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp;
  float y = (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp;
  float z = (sw*sI)*xp + (cw*sI)*yp;
  vec3 ecl = vec3(x,y,z);
  float rAU = length(ecl);
  vec3 pw = vec3(x, z, -y);
  float rd = uScale*pow(max(rAU,1e-5), uCompress);
  vec3 pos = pw*(rd/rAU);
  gl_Position = uViewProj*vec4(pos,1.0);
  float dist = length(pos-uCamPos);
  gl_PointSize = clamp(aSize*uPx/dist, 0.75*uDpr, 4.5*uDpr);
  float sunI = clamp(1.5*pow(1.0/max(rAU,0.05),0.40),0.26,2.1);
  vB = sunI*0.42*(0.55+0.45*aSize);
}`;

${GLSL_NOISE}

/* ---------- 环密度函数（光学厚度直接建模） ---------- */
float saturnRingDensity(float r){
  float d = 0.11*(sstep(1.235,1.262,r)-sstep(1.505,1.530,r));
  d += 1.20*(sstep(1.525,1.560,r)-sstep(1.925,1.950,r));

float uranusRingDensity(float r){

  d += 0.20*exp(-pow((r-1.909)/0.0022,2.0));
  d += 0.17*exp(-pow((r-1.863)/0.0020,2.0));
  d += 0.14*exp(-pow((r-1.823)/0.0018,2.0));
  d += 0.11*exp(-pow((r-1.786)/0.0016,2.0));
  d += 0.09*exp(-pow((r-1.751)/0.0015,2.0));
  d += 0.07*exp(-pow((r-1.690)/0.0025,2.0));
  return d;
}
float jupiterRingDensity(float r){ return 0.016*(sstep(1.40,1.45,r)-sstep(1.77,1.81,r)); }
float neptuneRingDensity(float r){ return 0.010*(sstep(1.69,1.75,r)-sstep(2.48,2.54,r)); }
float ringDensity(int t, float r){
  if(t==1) return saturnRingDensity(r);
  if(t==2) return uranusRingDensity(r);
  if(t==3) return jupiterRingDensity(r);
  if(t==4) return neptuneRingDensity(r);
  return 0.0;
}
float groove(vec3 p, float w){ float v = abs(fbm(p,4)-0.5); return 1.0-sstep(0.0,w,v); }

vec3 sunRamp(float t){
  t = clamp(t,0.0,1.0);
  vec3 c0=vec3(0.34,0.020,0.000);
  vec3 c1=vec3(1.00,0.245,0.020);
  vec3 c2=vec3(1.00,0.600,0.100);
  vec3 c3=vec3(1.00,0.905,0.600);
  vec3 c4=vec3(1.00,1.00,0.965);
  if(t<0.25) return mix(c0,c1,t/0.25);
  if(t<0.50) return mix(c1,c2,(t-0.25)/0.25);
  if(t<0.75) return mix(c2,c3,(t-0.50)/0.25);
  return mix(c3,c4,(t-0.75)/0.25);
}
/* 撞击坑：每胞独立半径 + 碗状凹陷 + 环形坑缘，边界前衰减到 0 */
vec2 craterLayer(vec3 p, float depth, float exThresh){
  vec3 w = worley(p);
  float d1 = w.x, id = w.z;
  float rad = 0.13+0.22*fract(id*7.31);
  float t = d1/rad;
  float bowl = (t<1.0) ? -(1.0-t*t) : 0.0;
  float rim = exp(-pow((t-1.0)/0.26,2.0));
  float ex = step(id, exThresh)*sstep(0.60,0.40,d1);
  return vec2((bowl*0.90+rim*0.50)*depth*ex, (bowl*0.55+rim*0.32)*ex);
}
vec2 craters(vec3 p, int oct, float depth, float exThresh){
  float fr[4] = float[4](5.0,12.0,28.0,62.0);
  float dp[4] = float[4](1.0,0.52,0.26,0.13);
  float h=0.0, a=0.0;
  for(int i=0;i<4;i++){
    if(i>=oct) break;
    vec2 c = craterLayer(p*fr[i], dp[i]*depth, exThresh);
    h += c.x; a += c.y;
  }
  return vec2(h,a);
}

void main(){
  vec3 p = normalize(vObj);
  vec3 N = normalize(vN);
  vec3 V = normalize(uCamPos - vWorld);
  vec3 L = uSunDirW;
  float ndl = dot(N,L);
  float latDeg = degrees(asin(clamp(p.y,-1.0,1.0)));
  float lonDeg = degrees(atan(p.z,p.x));

  /* ================= 太阳 ================= */
  if(uType==1){
    vec3 flow = vec3(uTime*0.010, uTime*0.005, -uTime*0.008);
    vec3 g1 = worley(p*76.0 + flow*4.0);
    vec3 g2 = worley(p*31.0 + flow*2.0);
    float w1 = 1.0-sstep(0.0,0.17,g1.y-g1.x);
    float w2 = 1.0-sstep(0.0,0.22,g2.y-g2.x);
    float gran = 1.0-0.46*w1-0.22*w2;
    float sg = 0.78+0.44*fbm(p*6.5+flow*0.6, 4);
    float sp = fbm(p*2.4+flow*0.3, 4);
    float pen = sstep(0.735,0.792,sp);
    float umb = sstep(0.792,0.848,sp);
    float heat = gran*sg*(1.0-0.72*pen)*(1.0-0.55*umb);
    float mu = max(dot(N,V),0.0);
    float limb = 0.24+0.76*pow(mu,0.38);
    float t = clamp((heat-0.42)/0.68, 0.0, 1.0);
    t *= (0.55+0.45*limb);
    vec3 col = sunRamp(t)*(0.34+0.66*limb)*1.80;
    col *= (1.0-0.70*umb);
    fragColor = vec4(col,1.0);
    return;
  }

  vec3 albedo = uAlbedo;
  float height = 0.0;
  float specMask = 0.0;
  vec3 emissive = vec3(0.0);
  float wrapF = 0.04;

  /* ================= 岩质 / 卫星 ================= */
  if(uType==2){
    vec2 cr = craters(p, uCraterOct, uCraterDepth, uCraterEx);
    height = cr.x;
    albedo = uAlbedo*(1.0+0.55*cr.y);
    if(uVariant==1){                       /* 月球：月海 + 辐射纹 */
      float m = fbm(p*2.3, 5);
      float mare = sstep(0.575,0.495,m);
      albedo = mix(albedo, uAlbedo*0.40, mare*0.88);
      height *= (1.0-0.55*mare);
      float rays = pow(sstep(0.70,0.93, fbm(p*10.0+3.0,4)), 3.0)*(1.0-mare);
      albedo += vec3(0.14)*rays;
    } else if(uVariant==2){                /* 木卫四：暗色 + 亮辐射纹 */
      float rays = pow(sstep(0.72,0.95, fbm(p*12.0+7.0,4)), 4.0);
      albedo += vec3(0.22,0.21,0.19)*rays;
    } else if(uVariant==3){                /* 木卫一：硫磺 + 火山口 */
      vec3 w = worley(p*15.0);
      float d1=w.x, id=w.z;
      float rad = 0.09+0.15*fract(id*5.77);
      float t1 = d1/rad;
      float bowl = (t1<1.0) ? -(1.0-t1*t1) : 0.0;
      float rim = exp(-pow((t1-1.0)/0.30,2.0));
      float ex = step(id,0.30)*sstep(0.55,0.35,d1);
      height += (bowl*0.95+rim*0.65)*1.1*ex;
      albedo = mix(albedo, vec3(0.26,0.10,0.015), clamp(-bowl*2.4,0.0,1.0)*ex);
      emissive += vec3(1.0,0.34,0.06)*pow(clamp(-bowl*3.2,0.0,1.0),3.0)*ex*0.9;
      albedo = mix(albedo, vec3(0.72,0.50,0.10), 0.30);
    } else if(uVariant==4){                /* 木卫二：冰壳 + 红褐线纹 */
      float l1 = groove(p*5.5,0.030), l2 = groove(p*11.0,0.022), l3 = groove(p*22.0,0.016);
      float lines = clamp(l1*0.80+l2*0.50+l3*0.30,0.0,1.0);
      albedo = mix(uAlbedo, vec3(0.42,0.16,0.08), lines*0.62);
      height += lines*0.05;
    } else if(uVariant==5){                /* 木卫三：暗区 + 亮沟槽 */
      float dark = sstep(0.46,0.60, fbm(p*2.6+2.0,5));
      albedo = mix(uAlbedo, uAlbedo*0.55, dark*0.80);
      float g1 = groove(p*7.0,0.024), g2 = groove(p*15.0,0.018);
      float gr = clamp(g1*0.7+g2*0.4,0.0,1.0);
      albedo = mix(albedo, vec3(0.42,0.41,0.39), gr*0.60);
      height += gr*0.06;
    } else if(uVariant==6){                /* 冥卫一：红色极冠 + 暗带 */
      float cap = sstep(0.32,0.78,p.y);
      albedo = mix(albedo, vec3(0.36,0.22,0.17), cap*0.55);
      float band = sstep(0.40,0.12,abs(p.y))*sstep(0.34,0.54, fbm(p*3.4,4));
      albedo = mix(albedo, vec3(0.13,0.10,0.10), band*0.70);
    }
  }
  /* ================= 气态巨行星 ================= */
  else if(uType==3){
    vec3 fp = p*2.4 + vec3(0.0,uTime*0.004,0.0);
    float w1 = fbm2(fp,5);
    float w2 = fbm2(p*7.0 + vec3(uTime*0.020,0.0,0.0),4);
    float lat = latDeg + (w1*4.5 + w2*1.4)*uTurb;
    float s = 0.40*sin(radians(lat)*4.0) + 0.32*sin(radians(lat)*9.0)
            + 0.20*sin(radians(lat)*17.0) + 0.12*sin(radians(lat)*30.0);
    float band = clamp(s*0.9+0.5, 0.0, 1.0);
    float polar = sstep(46.0,94.0, abs(lat));
    band = mix(band, 0.5, polar*0.94);
    vec3 col = mix(uColB, uColA, sstep(0.30,0.70,band));
    col = mix(col, uColC, sstep(0.58,0.06,band)*0.80);
    /* 涡旋斑点：沿经度拉长的椭圆 */
    vec3 wq = vec3(p.x, p.z, p.y*5.0)*2.2;
    vec3 ww = worley(wq);
    float spot = sstep(0.34,0.10, ww.x);
    col = mix(col, col*vec3(0.70,0.63,0.58), spot*0.70*uTurb);
    /* 大红斑 */
    if(uGRS>0.0){
      float dlon = atan(sin(radians(lonDeg-120.0)), cos(radians(lonDeg-120.0)));
      float dlat = radians(lat)-radians(-21.0);
      vec2 e = vec2(dlon*cos(radians(-21.0))/2.15, dlat);
      float rr = length(e)/0.15;
      if(rr<1.5){
        float ang = atan(e.y,e.x) + rr*7.0 + uTime*0.05;
        float spn = fbm(vec3(cos(ang)*1.6, sin(ang)*1.6, rr*3.2), 4);
        float m = sstep(1.0,0.55,rr);
        col = mix(col, vec3(0.58,0.155,0.055)*(0.72+0.52*spn), m*uGRS);
        col = mix(col, vec3(0.90,0.80,0.66), sstep(1.10,0.92,rr)*0.14*uGRS);
      }
    }
    /* 土星北极六边形 */
    if(uHex>0.0){
      float v = (90.0-abs(latDeg))/90.0;
      float rhex = 0.115/cos(radians(mod(lonDeg,60.0)-30.0));
      float line = 1.0-sstep(0.0,0.014, abs(v-rhex));
      col = mix(col, col*0.68, line*uHex);
      col = mix(col, col*0.93, sstep(rhex, rhex-0.03, v)*uHex);
      col = mix(col, vec3(0.55,0.62,0.70), sstep(80.0,90.0,abs(latDeg))*0.35*uHex);
    }
    albedo = col;
    wrapF = 0.24;
  }
  /* ================= 冰巨行星 ================= */
  else if(uType==4){
    float lat = latDeg + fbm2(p*2.0+vec3(uTime*0.003,0.0,0.0),4)*2.4;
    float band = 0.5+0.5*sin(radians(lat)*3.0);
    vec3 col = mix(uColB, uColA, band);
    col = mix(col, uColC, sstep(0.55,0.95,1.0-band)*0.35);
    /* 明亮甲烷云条纹（不进高度场） */
    float m1 = exp(-pow((lat-28.0)/3.2,2.0));
    float m2 = exp(-pow((lat+18.0)/2.6,2.0));
    float m3 = exp(-pow((lat-46.0)/4.0,2.0));
    col += vec3(0.30,0.36,0.42)*(m1*0.55+m2*0.45+m3*0.35);
    if(uVariant==1){  /* 海王星暗斑 */
      float dlon = atan(sin(radians(lonDeg+40.0)), cos(radians(lonDeg+40.0)));
      float dlat = lat+25.0;
      float rr = length(vec2(dlon*cos(radians(-25.0))/1.7, dlat))/0.28;
      col = mix(col, col*vec3(0.42,0.46,0.62), sstep(1.0,0.35,rr)*0.85);
    }
    albedo = col;
    wrapF = 0.20;
  }
  /* ================= 地球 ================= */
  else if(uType==5){
    float h = fbm(p*2.6, 7);
    float terr = (h-0.552)*3.2;
    float land = sstep(0.546,0.560,h);
    float lat = asin(clamp(p.y,-1.0,1.0));
    float cl = 0.0;
    /* 海洋 */
    vec3 deepSea = vec3(0.007,0.026,0.108);
    vec3 shallow = vec3(0.030,0.130,0.215);
    float shelf = sstep(0.20,0.0,-terr);
    vec3 sea = mix(deepSea, shallow, shelf);
    /* 陆地 */
    float veg = fbm(p*5.5+3.0, 4);
    float dryness = sstep(0.46,0.66,veg)*(0.30+0.70*sstep(40.0,18.0,abs(latDeg)));
    vec3 landCol = mix(vec3(0.050,0.108,0.038), vec3(0.300,0.232,0.120), dryness);
    landCol = mix(landCol, vec3(0.190,0.170,0.150), sstep(0.0,0.40,terr));
    float icy = sstep(64.0,73.0, abs(latDeg)+12.0*(fbm(p*8.0,3)-0.5));
    landCol = mix(landCol, vec3(0.76,0.80,0.85), icy);
    albedo = mix(sea, landCol, land);
    /* 云：随纬度变化的纬向漂移 */
    float drift = uTime*0.020*(1.0-0.65*abs(sin(lat)));
    float ca=cos(drift), sa=sin(drift);
    vec3 cq = vec3(p.x*ca-p.z*sa, p.y, p.x*sa+p.z*ca);
    float cn = fbm(cq*3.4 + vec3(0.0,uTime*0.004,0.0), 5);
    float amt = 0.46 + 0.30*exp(-pow(latDeg/13.0,2.0)) + 0.26*exp(-pow((abs(latDeg)-50.0)/15.0,2.0))
               - 0.26*exp(-pow((abs(latDeg)-25.0)/9.0,2.0));
    cl = sstep(0.62-amt*0.30, 0.76-amt*0.30, cn);
    albedo = mix(albedo, vec3(0.84,0.87,0.92), cl*0.94);
    /* 凹凸只在陆地 */
    float detail = fbm2(p*18.0,4)*0.055 + fbm2(p*46.0,3)*0.018;
    height = land*(max(terr,0.0)*0.85 + detail);
    specMask = (1.0-land)*(1.0-cl);
    /* 夜面城市灯光 */
    float pop = sstep(0.44,0.66, fbm(p*6.0+9.0,4));
    float pts = pow(sstep(0.76,0.93, vnoise(p*230.0)), 2.0);
    float night = sstep(0.06,-0.06,ndl);
    emissive += vec3(1.0,0.66,0.28)*land*(1.0-cl)*pop*pts*night*2.8;
  }
  /* ================= 金星 ================= */
  else if(uType==6){
    float lat = latDeg + fbm2(p*1.6+vec3(uTime*0.010,0.0,0.0),4)*11.0;
    float v = 0.5+0.5*sin(radians(lat)*3.0);
    float swirl = fbm(vec3(p.x*4.0,p.y*9.0,p.z*4.0)+vec3(uTime*0.020,0.0,0.0),5);
    vec3 col = mix(vec3(0.66,0.56,0.34), vec3(0.97,0.92,0.78), clamp(v*0.55+swirl*0.60,0.0,1.0));
    albedo = col*0.74;
    wrapF = 0.22;
  }
  /* ================= 火星 ================= */
  else if(uType==7){
    float north = sstep(-0.15,0.30,p.y);
    vec2 cr = craters(p, uCraterOct, uCraterDepth*mix(1.0,0.22,north), uCraterEx*mix(1.0,0.42,north));
    height = cr.x;
    vec3 base = vec3(0.235,0.087,0.038);
    albedo = base*(0.80+0.40*fbm(p*4.0,5));
    albedo *= (1.0+0.50*cr.y);
    float dark = sstep(0.60,0.42, fbm(p*2.4+11.0,4));
    albedo = mix(albedo, base*0.52, dark*0.55);
    float polar = sstep(76.0,87.0, abs(latDeg)+9.0*(fbm(p*6.0,3)-0.5));
    albedo = mix(albedo, vec3(0.78,0.80,0.84), polar);
    float vm = exp(-pow((latDeg+9.0)/2.4,2.0))*exp(-pow((lonDeg+55.0)/26.0,2.0));
    albedo = mix(albedo, base*0.42, vm*0.85);
    wrapF = 0.08;
  }
  /* ================= 土卫六 ================= */
  else if(uType==8){
    float h = fbm(p*2.0,5);
    vec3 col = mix(vec3(0.52,0.28,0.08), vec3(0.82,0.52,0.17), h);
    col = mix(col, vec3(0.90,0.66,0.30), sstep(0.50,0.80, fbm(p*5.0+3.0,4))*0.40);
    albedo = col;
    wrapF = 0.45;
  }
  /* ================= 冥王星 ================= */
  else if(uType==9){
    vec3 base = vec3(0.335,0.255,0.215);
    float cth = sstep(0.34,0.10,abs(p.y))*sstep(0.34,0.56, fbm(p*3.0,4));
    base = mix(base, vec3(0.155,0.075,0.055), cth*0.85);
    vec2 a1 = vec2((lonDeg-176.0)/30.0, (latDeg+11.0)/25.0);
    vec2 a2 = vec2((lonDeg-196.0)/30.0, (latDeg-7.0)/25.0);
    float heart = max(exp(-dot(a1,a1)*1.30), exp(-dot(a2,a2)*1.30));
    base = mix(base, vec3(0.86,0.83,0.76), sstep(0.34,0.78,heart));
    albedo = base;
    wrapF = 0.12;
  }

  /* ---------- 环在行星上的投影 ---------- */
  float sunLight = 1.0;
  if(uRingType>0){
    vec3 dObj = normalize(transpose(uRot)*L);
    if(abs(dObj.y)>1e-3){
      float tt = -p.y/dObj.y;
      if(tt>0.0){
        vec3 X = p + dObj*tt;
        float d = ringDensity(uRingType, length(X.xz));
        if(d>0.0) sunLight *= exp(-d*1.45/max(abs(dObj.y),0.02));
      }
    }
  }

  /* ---------- 凹凸映射（屏幕空间导数） ---------- */
  if(uBump>0.0 && height!=0.0){
    float hs = height*uRadius;
    vec3 dpx = dFdx(vWorld), dpy = dFdy(vWorld);
    float dhx = dFdx(hs), dhy = dFdy(hs);
    vec3 r1 = cross(dpy,N), r2 = cross(N,dpx);
    float det = dot(dpx,r1);
    if(abs(det)>1e-16){
      vec3 grad = (r1*dhx + r2*dhy)/det;
      N = normalize(N - uBump*grad);
    }
  }

  /* ---------- 光照 ---------- */
  float diff = clamp((ndl+wrapF)/(1.0+wrapF), 0.0, 1.0);
  diff = diff*diff*(3.0-2.0*diff);
  vec3 col = albedo*diff*uSunInt*sunLight;
  if(specMask>0.0){
    vec3 H = normalize(L+V);
    float sp = pow(max(dot(N,H),0.0), 420.0);
    col += vec3(1.0,0.96,0.88)*sp*specMask*uSunInt*0.85;
  }
  col += emissive;
  col += albedo*0.010;
  fragColor = vec4(col,1.0);
}`;

/* =========================== 大气壳层 =========================== */
const VS_ATMO = `#version 300 es
in vec3 aPos;
uniform mat4 uModel, uViewProj;
out vec3 vWorld;
void main(){ vec4 wp = uModel*vec4(aPos,1.0); vWorld = wp.xyz; gl_Position = uViewProj*wp; }`;
const FS_ATMO = `#version 300 es
precision highp float;
in vec3 vWorld; out vec4 fragColor;
uniform vec3 uCamPos, uCenter, uSunDirW, uCol;
uniform float uRadius, uScaleH, uGain;
float sstep(float a,float b,float x){ float t=clamp((x-a)/(b-a),0.0,1.0); return t*t*(3.0-2.0*t); }
void main(){
  vec3 rd = normalize(vWorld-uCamPos);
  vec3 oc = uCenter-uCamPos;
  float tca = dot(oc,rd);
  float dd = dot(oc,oc)-tca*tca;
  if(dd<0.0) discard;
  float b = sqrt(dd)/uRadius;
  float dens = exp(-max(b-1.0,0.0)/uScaleH);
  dens *= 1.0 - sstep(1.0,0.960,b)*0.86;
  vec3 an = normalize(uCamPos + rd*tca - uCenter);
  float sunA = max(dot(an,uSunDirW),0.0);
  sunA = sunA*sunA*(3.0-2.0*sunA);
  float mie = pow(max(dot(rd,uSunDirW)*0.5+0.5,0.0),4.0);
  vec3 col = uCol*dens*(0.09+0.91*sunA)*(0.62+0.78*mie)*uGain;
  fragColor = vec4(col,1.0);
}`;

/* =========================== 环系 =========================== */
const VS_RING = `#version 300 es
in vec3 aPos;
uniform mat4 uModel, uViewProj;
out vec3 vLocal, vWorld;
void main(){ vLocal = aPos; vec4 wp = uModel*vec4(aPos,1.0); vWorld = wp.xyz; gl_Position = uViewProj*wp; }`;
const FS_RING = `#version 300 es
precision highp float;
in vec3 vLocal, vWorld; out vec4 fragColor;
uniform vec3 uCamPos, uSunDirW, uCol, uNormal, uCenter;
uniform float uRadius, uGain;
uniform int uRingType;
float sstep(float a,float b,float x){ float t=clamp((x-a)/(b-a),0.0,1.0); return t*t*(3.0-2.0*t); }
float hash11(float n){ n=fract(n*0.1031); n*=n+33.33; n*=n+n; return fract(n); }
float n1d(float x){ float i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f); return mix(hash11(i),hash11(i+1.0),f); }
float fbm1(float x){ float a=0.5,s=0.0,n=0.0; for(int i=0;i<5;i++){ s+=a*n1d(x); n+=a; a*=0.5; x*=2.07; } return s/n; }
float saturnRingDensity(float r){
  float d = 0.11*(sstep(1.235,1.262,r)-sstep(1.505,1.530,r));
  d += 1.20*(sstep(1.525,1.560,r)-sstep(1.925,1.950,r));
  d += 0.58*(sstep(2.025,2.055,r)-sstep(2.245,2.270,r));
  d *= 1.0-0.87*(sstep(1.950,1.958,r)-sstep(2.014,2.025,r));
  d *= 1.0-0.92*exp(-pow((r-2.214)/0.0045,2.0));
  d *= 1.0-0.80*exp(-pow((r-2.265)/0.0018,2.0));
  d += 0.30*exp(-pow((r-2.324)/0.0055,2.0));
  d *= 0.70+0.60*fbm1(r*230.0);
  return max(d,0.0);
}
float uranusRingDensity(float r){
  float d = 0.55*exp(-pow((r-1.951)/0.0055,2.0));
  d += 0.20*exp(-pow((r-1.909)/0.0022,2.0));
  d += 0.17*exp(-pow((r-1.863)/0.0020,2.0));
  d += 0.14*exp(-pow((r-1.823)/0.0018,2.0));
  d += 0.11*exp(-pow((r-1.786)/0.0016,2.0));
  d += 0.09*exp(-pow((r-1.751)/0.0015,2.0));
  d += 0.07*exp(-pow((r-1.690)/0.0025,2.0));
  return d;
}
float jupiterRingDensity(float r){ return 0.016*(sstep(1.40,1.45,r)-sstep(1.77,1.81,r)); }
float neptuneRingDensity(float r){ return 0.010*(sstep(1.69,1.75,r)-sstep(2.48,2.54,r)); }
float ringDensity(int t, float r){
  if(t==1) return saturnRingDensity(r);
  if(t==2) return uranusRingDensity(r);
  if(t==3) return jupiterRingDensity(r);
  if(t==4) return neptuneRingDensity(r);
  return 0.0;
}
void main(){
  float r = length(vLocal.xz);
  float d = ringDensity(uRingType, r);
  if(d<=0.0004) discard;
  vec3 V = normalize(vWorld-uCamPos);
  float muv = max(abs(dot(uNormal,V)), 0.10);
  float mus = max(abs(dot(uNormal,uSunDirW)), 0.10);
  float tauV = d*1.45/muv;
  float alpha = 1.0-exp(-tauV);
  float tauS = d*1.45/mus;
  float lit;
  if(dot(uNormal,V)*dot(uNormal,uSunDirW) > 0.0) lit = (1.0-exp(-tauS))*0.85;
  else lit = exp(-tauS*0.42)*1.15*(1.0-exp(-tauS*0.75));
  vec3 oc = vWorld-uCenter;
  float bb = dot(oc,uSunDirW);
  float sh = 1.0;
  if(bb<0.0){
    float dmin = sqrt(max(dot(oc,oc)-bb*bb,0.0));
    sh = sstep(uRadius*0.97, uRadius*1.09, dmin);
  }
  vec3 col = uCol*lit*sh*uGain;
  fragColor = vec4(col, alpha);
}`;

in vec2 vNdc; out vec4 fragColor;

const FS_UP = `#version 300 es
precision highp float;
in vec2 vNdc; out vec4 fragColor;
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec2 uv = vNdc*0.5+0.5; vec2 t = uTexel;
  vec3 s = texture(uTex, uv+t*vec2(-1.0,-1.0)).rgb + texture(uTex, uv+t*vec2( 0.0,-1.0)).rgb*2.0

         + texture(uTex, uv+t*vec2( 1.0, 0.0)).rgb*2.0
         + texture(uTex, uv+t*vec2(-1.0, 1.0)).rgb + texture(uTex, uv+t*vec2( 0.0, 1.0)).rgb*2.0

const FS_COMP = `#version 300 es
precision highp float;
in vec2 vNdc; out vec4 fragColor;
uniform sampler2D uScene, uBloom;
uniform vec2 uRes;
uniform float uExposure, uBloomK, uAberr, uGrain, uTime, uVig, uFlareGain;
uniform vec4 uFlare;      /* x,y=太阳屏幕像素坐标  z=可见度  w=太阳视半径(px) */
uniform vec3 uFlareCol;
float h21(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
vec3 aces(vec3 x){
  const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;
  return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);
}
void main(){
  vec2 uv = vNdc*0.5+0.5;
  vec2 d = uv-0.5;
  float r2 = dot(d,d);
  float ab = uAberr*r2;
  vec3 col;
  col.r = texture(uScene, uv-d*ab).r;
  col.g = texture(uScene, uv).g;
  col.b = texture(uScene, uv+d*ab).b;
  col += texture(uBloom, uv).rgb*uBloomK;

  /* 镜头眩光 */
  if(uFlare.z>0.002){
    vec2 asp = vec2(uRes.x/uRes.y, 1.0);
    vec2 sp = uFlare.xy/uRes;
    vec2 dv = (uv-sp)*asp;
    float dr = length(dv);
    float glow = exp(-dr*dr*420.0)*0.55 + exp(-dr*9.0)*0.022;
    float ang = atan(dv.y,dv.x);
    float spikes = 0.0;
    for(int i=0;i<6;i++){
      float a0 = float(i)*0.5235988;
      spikes += pow(abs(sin((ang-a0)*3.0)), 22.0)*exp(-dr*5.5);
    }
    float streak = exp(-abs(dv.y)*80.0)*exp(-abs(dv.x)*3.2);
    vec3 fl = uFlareCol*(glow + spikes*0.055 + streak*0.045);
    /* 鬼影：沿 太阳→屏幕中心 连线 */
    vec2 dir = (vec2(0.5)-sp)*asp;
    for(int i=0;i<4;i++){
      float tt = 0.28+float(i)*0.40;
      vec2 gp = sp + dir*tt*2.0;
      float gd = length((uv-gp)*asp);
      float ring = exp(-pow((gd-0.052)*26.0,2.0));
      float core = exp(-gd*gd*700.0);
      vec3 gc = mix(vec3(0.35,0.55,1.0), vec3(1.0,0.65,0.30), float(i)/3.0);
      fl += gc*(ring*0.045+core*0.05);
    }
    col += fl*uFlare.z*uFlareGain;
  }

  col *= uExposure;
  col = aces(col);
  col = pow(col, vec3(1.0/2.2));
  float v = 1.0-uVig*r2*2.4;
  col *= clamp(v,0.0,1.0);
  col += (h21(uv*uRes+vec2(uTime*61.0,uTime*37.0))-0.5)*uGrain;
  fragColor = vec4(col,1.0);
}`;

function makeSphere(stacks,slices){
  const v = new Float32Array((stacks+1)*(slices+1)*3);
  let k=0;
  for(let i=0;i<=stacks;i++){
    const th = i/stacks*PI, st=Math.sin(th), ct=Math.cos(th);
    for(let j=0;j<=slices;j++){
      const ph=j/slices*TAU;
      v[k++]=st*Math.cos(ph); v[k++]=ct; v[k++]=st*Math.sin(ph);
    }
  }
  const idx = new Uint32Array(stacks*slices*6);
  let m=0;
  for(let i=0;i<stacks;i++) for(let j=0;j<slices;j++){
    const a=i*(slices+1)+j, b=a+(slices+1);
    /* 绕序：法线朝外（赤道点手算叉积验证） */
    idx[m++]=a; idx[m++]=a+1; idx[m++]=b;
    idx[m++]=a+1; idx[m++]=b+1; idx[m++]=b;
  }
  return {v,idx};
}
function makeAnnulus(inner,outer,angSeg,radSeg){
  const v=[],idx=[];
  for(let i=0;i<=radSeg;i++){
    const r = inner+(outer-inner)*i/radSeg;
    for(let j=0;j<=angSeg;j++){
      const a=j/angSeg*TAU;
      v.push(Math.cos(a)*r, 0, Math.sin(a)*r);
    }
  }
  for(let i=0;i<radSeg;i++) for(let j=0;j<angSeg;j++){
    const a=i*(angSeg+1)+j, b=a+(angSeg+1);
    idx.push(a,b,a+1, a+1,b,b+1);
  }
  return {v:new Float32Array(v), idx:new Uint32Array(idx)};
}

function makeStars(){

        col=new Float32Array(STAR_N*3), pha=new Float32Array(STAR_N);
  for(let i=0;i<STAR_N;i++){
    let x=0,y=0,z=0,ok=false;
    for(let t=0;t<40 && !ok;t++){
      const u=Math.random()*2-1, th=Math.random()*TAU, s=Math.sqrt(Math.max(0,1-u*u));

    const mag = Math.pow(Math.random(),3.6);

    col[i*3]=STAR_PAL[ci][0]*b; col[i*3+1]=STAR_PAL[ci][1]*b; col[i*3+2]=STAR_PAL[ci][2]*b;

const KIRKWOOD = [[2.502,0.022,0.93],[2.825,0.016,0.85],[2.958,0.012,0.70],[3.279,0.020,0.90],[2.065,0.010,0.60]];
function beltKeep(a){
  let p = Math.exp(-Math.pow((a-2.72)/0.55,2)/2);
  for(const g of KIRKWOOD) p *= (1-g[2]*Math.exp(-Math.pow((a-g[0])/g[1],2)));
  return p;
}
function gauss(){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v); }
function halfNorm(sig){ return Math.abs(gauss()*sig); }
function meanMotion(a){ return 360/(Math.pow(a,1.5)*365.25); }
function makeBelt(){
  const data=[];
  const push=(a,e,I,Om,w,M0,n,size)=>data.push(a,e,I*D2R,Om*D2R,w*D2R,M0*D2R,n*D2R,size);
  /* --- 主带（挖柯克伍德空隙） --- */
  for(let i=0;i<9000;){
    const a = 2.06+Math.random()*(3.28-2.06);
    if(Math.random() > beltKeep(a)) continue;
    const e = Math.min(halfNorm(0.1121), 0.34);
    const I = Math.min(halfNorm(6.383), 32);
    const Om = Math.random()*360, w = Math.random()*360;
    push(a,e,I,Om,w,Math.random()*360, meanMotion(a), 0.010+Math.random()*0.030);
    i++;
  }
  /* --- 希尔达族 --- */
  for(let i=0;i<900;i++){
    const a = 3.90+gauss()*0.09;
    const e = 0.10+Math.random()*0.20;
    const I = Math.min(halfNorm(6.383), 25);
    push(a,e,I,Math.random()*360,Math.random()*360,Math.random()*360, meanMotion(a), 0.010+Math.random()*0.022);
  }
  /* --- 木星特洛伊群：M₀ 锁在木星前后 60°，n 用木星的平均运动 --- */
  const LJ0 = 34.39644051;
  const nJup = 3034.74612775/36525;      // 木星平黄经变化率 (deg/day)
  for(let i=0;i<2000;i++){
    const lead = (i%2===0)?1:-1;
    const M0 = LJ0 + lead*60 + gauss()*26;
    const a = 5.202887+gauss()*0.006;
    const e = 0.02+Math.random()*0.12;
    const I = (Math.random()-0.5)*22;
    push(a,e,I,0,0,M0, nJup, 0.010+Math.random()*0.026);
  }
  /* --- 柯伊伯带 --- */
  for(let i=0;i<6000;i++){
    const r=Math.random(); let a,e,I;
    if(r<0.22){ a = 39.45+gauss()*0.55; e=Math.min(halfNorm(0.06),0.22); I=Math.min(halfNorm(8),25); }
    else if(r<0.86){ a = 42.5+Math.random()*(47.7-42.5); e=Math.random()*0.11; I=Math.min(halfNorm(4.5),22); }
    else { a = 48+Math.random()*(80-48); e=0.15+Math.random()*0.35; I=Math.min(halfNorm(9),38); }
    push(a,e,I,Math.random()*360,Math.random()*360,Math.random()*360, meanMotion(a), 0.012+Math.random()*0.040);

let W=1, H=1, DPR=Math.min(window.devicePixelRatio||1, 1.75), MSAA_OK=true;

function makeTex(w,h){

function initTargets(w,h){

  if(!MSAA_OK) console.warn('MSAA 帧缓冲不完整，退回非 MSAA 路径');

  let bw=Math.max(1,w>>1), bh=Math.max(1,h>>1);
  for(let i=0;i<6;i++){
    const t=makeTex(bw,bh), f=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
    FB.bloom.push({tex:t,fbo:f,w:bw,h:bh});
    bw=Math.max(1,bw>>1); bh=Math.max(1,bh>>1);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
/* 自适应渲染分辨率：以 1.75 倍像素密度为上限，按实测帧时间动态升降，
   保证 1080p / 高 DPR 下仍能维持 60fps（弱机自动降采样）。 */
const DPR_CAP = Math.min(window.devicePixelRatio||1, 1.75);
function resize(){
  const w = Math.max(2, Math.round(canvas.clientWidth*DPR));
  const h = Math.max(2, Math.round(canvas.clientHeight*DPR));
  if(w===W && h===H) return;
  W=w; H=h; canvas.width=W; canvas.height=H;
  initTargets(W,H);
}
let qAcc=0, qN=0, qLast=performance.now();
function adaptQuality(){
  const t=performance.now();
  const real=(t-qLast)/1000; qLast=t;
  if(real<=0) return;
  qAcc+=real; qN++;
  if(qAcc<0.5 && qN<4) return;
  const avg=qAcc/Math.max(qN,1);
  qAcc=0; qN=0;
  let ns=DPR;
  if(avg>0.024 && DPR>0.5){
    /* 像素数 ∝ 帧时间，按比例一步到位 */
    const f=Math.sqrt(0.0167/Math.max(avg,1e-4));
    ns=Math.max(0.5, DPR*Math.max(0.40,Math.min(0.95,f)));
  } else if(avg<0.0135 && DPR<DPR_CAP){
    ns=Math.min(DPR_CAP, DPR*1.08);
  }
  if(Math.abs(ns-DPR)>0.02){ DPR=ns; W=0; H=0; resize(); }
}

/* =========================== 轨道缎带缓冲 =========================== */
const orbitGeo = new Map();
function updateOrbitGeometry(){
  const T = (nowJD()-J2000)/36525;
  for(const b of ORBIT_PLANETS){
    const rec = buildOrbit(b,T);
    const N = ORBIT_N;
    const need = (N+1)*2*11;
    let g = orbitGeo.get(b.id);
    if(!g){
      const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
      const vb=gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER,vb);
      gl.bufferData(gl.ARRAY_BUFFER, need*4, gl.DYNAMIC_DRAW);
      const STR=44;
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,STR,0);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,3,gl.FLOAT,false,STR,12);
      gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,3,gl.FLOAT,false,STR,24);
      gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,1,gl.FLOAT,false,STR,36);
      gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4,1,gl.FLOAT,false,STR,40);
      g={vao, vb, arr:new Float32Array(need), ver:-1};
      orbitGeo.set(b.id,g);
    }
    if(g.ver===rec.ver) continue;
    g.ver = rec.ver;
    const P = rec.pts, A = g.arr;
    let k=0;
    for(let i=0;i<=N;i++){
      const ii = i%N;
      const ip = (ii-1+N)%N, inx=(ii+1)%N;
      const px=P[ii*3],py=P[ii*3+1],pz=P[ii*3+2];
      const ax=P[ip*3],ay=P[ip*3+1],az=P[ip*3+2];
      const bx=P[inx*3],by=P[inx*3+1],bz=P[inx*3+2];
      const par = i/N;
      for(let s=0;s<2;s++){
        A[k++]=px;A[k++]=py;A[k++]=pz;
        A[k++]=ax;A[k++]=ay;A[k++]=az;
        A[k++]=bx;A[k++]=by;A[k++]=bz;
        A[k++]=s===0?-1:1; A[k++]=par;
      }
    }
    gl.bindBuffer(gl.ARRAY_BUFFER,g.vb);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,A);
  }
  gl.bindVertexArray(null);
}

/* =========================== 绘制辅助 =========================== */
const mModel=m4(), mRot=m4(), mBasisM=m4(), mRotY=m4(), mTmp=m4(), mAtmo=m4();
const m3 = new Float32Array(9);
const ROCKY_ALB = {
  mercury:[0.145,0.138,0.128], moon:[0.128,0.124,0.117], callisto:[0.130,0.120,0.105],
  io:[0.700,0.500,0.120], europa:[0.660,0.630,0.580], ganymede:[0.190,0.180,0.160],
  triton:[0.440,0.420,0.400], charon:[0.360,0.330,0.300], halley:[0.320,0.300,0.280]
};
const BAND_COL = {
  jupiter:[[0.82,0.76,0.66],[0.44,0.27,0.145],[0.27,0.16,0.105]],
  saturn:[[0.86,0.79,0.62],[0.70,0.60,0.42],[0.52,0.44,0.32]],
  uranus:[[0.52,0.80,0.84],[0.44,0.72,0.78],[0.38,0.66,0.74]],
  neptune:[[0.24,0.38,0.82],[0.19,0.31,0.72],[0.14,0.24,0.58]]
};
function initBodies(){
  sunObj.rot = {tilt:7.49, poleLon:346.47, rotH:609.12, textbook:7.25};
  BY_ID.neptune.var = 1;                        /* 海王星暗斑 */
  moonObjs.forEach(m=>{
    const p = m.parent;
    if(m.id==='moon') m.rot = {tilt:6.68, poleLon:268.3, rotH:m.period*24, textbook:6.68};
    else m.rot = {tilt:p.rot.tilt, poleLon:p.rot.poleLon, rotH:m.period*24, textbook:0};
  });
  for(const b of ALL){
    if(b.kind==='comet'){ b.axisW=[0,1,0]; b.basis=orthoBasis(b.axisW); continue; }
    b.axisW = rotAxisWorld(b);
    b.basis = orthoBasis(b.axisW);
  }
}
function bodyMatrix(b, scale){
  const B=b.basis;
  m4trs(mBasisM,B[0],B[1],B[2],[0,0,0],1);
  m4rotY(mRotY,b.phase);
  m4mul(mRot,mBasisM,mRotY);
  m4trs(mModel,B[0],B[1],B[2],b.world,b.dispR*(scale||1));
  m4mul(mModel,mModel,mRotY);
  m3fromM4(m3,mRot);
  return m3;
}
function projectPoint(p){
  const m=viewProjM;
  const x=m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12];
  const y=m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13];
  const w=m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15];
  if(w<=1e-6) return null;
  return {x:(x/w*0.5+0.5)*W, y:(1-(y/w*0.5+0.5))*H, w:w};
}
function pixelRadius(dist, r){ return Math.atan(r/Math.max(dist,1e-4))*(H/2/Math.tan(cam.fov/2)); }

/* =========================== 彗尾几何 =========================== */
const TAIL_SEG=44;
const tailArr = new Float32Array(TAIL_SEG*40);
const tailVBO = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,tailVBO);
gl.bufferData(gl.ARRAY_BUFFER,tailArr.byteLength, gl.DYNAMIC_DRAW);
const tailVAO = gl.createVertexArray();
gl.bindVertexArray(tailVAO);
gl.bindBuffer(gl.ARRAY_BUFFER,tailVBO);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,1,gl.FLOAT,false,20,12);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,1,gl.FLOAT,false,20,16);
gl.bindVertexArray(null);

function buildTailGeom(h){
  const anti = vnorm(vscale(h.world,-1));
  const vdir = h.velDir || anti;
  const sc = Math.pow(3/Math.max(h.rAU,0.2),2);
  const L = Math.min(42, 1.3*sc);
  const D = Math.min(36, 1.0*sc);
  let k=0;
  function pushQuad(p0,p1,w0,w1,t0,t1){
    const tan = vnorm(vsub(p1,p0));
    const toCam = vnorm(vsub(cam.eye,p0));
    let off = vcross(tan,toCam);
    const ol=vlen(off);
    off = ol>1e-6 ? vscale(off,1/ol) : [1,0,0];
    const A=vadd(p0,vscale(off,-w0)), C=vadd(p0,vscale(off,w0));
    const B2=vadd(p1,vscale(off,-w1)), D2=vadd(p1,vscale(off,w1));
    tailArr[k++]=A[0];tailArr[k++]=A[1];tailArr[k++]=A[2];tailArr[k++]=-1;tailArr[k++]=t0;
    tailArr[k++]=C[0];tailArr[k++]=C[1];tailArr[k++]=C[2];tailArr[k++]= 1;tailArr[k++]=t0;
    tailArr[k++]=B2[0];tailArr[k++]=B2[1];tailArr[k++]=B2[2];tailArr[k++]=-1;tailArr[k++]=t1;
    tailArr[k++]=D2[0];tailArr[k++]=D2[1];tailArr[k++]=D2[2];tailArr[k++]= 1;tailArr[k++]=t1;
  }
  for(let i=0;i<TAIL_SEG;i++){
    const t0=i/TAIL_SEG, t1=(i+1)/TAIL_SEG;
    /* 离子尾：笔直背日、窄、偏蓝 */
    const p0=vadd(h.world,vscale(anti,L*t0)), p1=vadd(h.world,vscale(anti,L*t1));
    pushQuad(p0,p1, 0.05+0.16*t0, 0.05+0.16*t1, t0,t1);
  }
  for(let i=0;i<TAIL_SEG;i++){
    const t0=i/TAIL_SEG, t1=(i+1)/TAIL_SEG;
    /* 尘埃尾：沿速度反方向滞后、渐弯向背日、宽、偏暖 */
    const q0=vadd(vadd(h.world,vscale(vdir,-D*t0)),vscale(anti,D*0.55*t0*t0));
    const q1=vadd(vadd(h.world,vscale(vdir,-D*t1)),vscale(anti,D*0.55*t1*t1));
    pushQuad(q0,q1, 0.12+0.55*t0, 0.12+0.55*t1, t0,t1);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,tailVBO);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,tailArr);
}

/* =========================== 渲染 =========================== */
let uTime = 0;
function drawSphere(b, lo){
  const B=b.basis;
  const rot = bodyMatrix(b,1);
  gl.uniformMatrix4fv(pPlanet.u.uModel,false,mModel);
  gl.uniformMatrix4fv(pPlanet.u.uViewProj,false,viewProjM);
  gl.uniformMatrix3fv(pPlanet.u.uRot,false,rot);
  gl.uniform3fv(pPlanet.u.uCamPos,cam.eye);
  const sd = vlen(b.world)>1e-6 ? vnorm(vscale(b.world,-1)) : [1,0,0];
  gl.uniform3fv(pPlanet.u.uSunDirW,sd);
  gl.uniform1f(pPlanet.u.uTime,uTime);
  gl.uniform1f(pPlanet.u.uRadius,b.dispR);
  gl.uniform1f(pPlanet.u.uSunInt, sunIntensity(Math.max(b.rAU,0.05)));
  gl.uniform1i(pPlanet.u.uType,b.typ);
  gl.uniform1i(pPlanet.u.uVariant, b.var||0);
  gl.uniform1i(pPlanet.u.uCraterOct, b.cratOct||3);
  gl.uniform1f(pPlanet.u.uCraterDepth, b.cratD||0);
  gl.uniform1f(pPlanet.u.uCraterEx, b.cratEx||0.5);
  gl.uniform1f(pPlanet.u.uBump, b.bump||0);
  gl.uniform1f(pPlanet.u.uTurb, b.turb||0);
  gl.uniform1f(pPlanet.u.uHex, b.hex||0);
  gl.uniform1f(pPlanet.u.uGRS, b.grs||0);
  const al = ROCKY_ALB[b.id] || [b.albedo||0.2,b.albedo||0.2,b.albedo||0.2];
  gl.uniform3fv(pPlanet.u.uAlbedo, al);
  const bc = BAND_COL[b.id] || [[0.85,0.80,0.70],[0.55,0.45,0.35],[0.40,0.32,0.26]];
  gl.uniform3fv(pPlanet.u.uColA,bc[0]); gl.uniform3fv(pPlanet.u.uColB,bc[1]); gl.uniform3fv(pPlanet.u.uColC,bc[2]);
  const rg = RINGS[b.id];
  gl.uniform1i(pPlanet.u.uRingType, rg?rg.type:0);
  gl.bindVertexArray(lo?sphereLoVAO:sphereVAO);
  if(lo) gl.drawElements(gl.TRIANGLES,SPHERE_LO.idx.length,gl.UNSIGNED_INT,0);
  else   gl.drawElements(gl.TRIANGLES,SPHERE.idx.length,gl.UNSIGNED_INT,0);
}

function renderFrame(){
  resize();
  updateOrbitGeometry();

  gl.bindFramebuffer(gl.FRAMEBUFFER, MSAA_OK?FB.msaa:FB.resolve);
  gl.viewport(0,0,W,H);
  gl.depthMask(true);                       /* ★ 7.1 clear 前必须显式恢复 */
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.BLEND); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);

  /* ---- 背景银河 ---- */
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.useProgram(pBG.p);
  gl.uniformMatrix4fv(pBG.u.uInvVP,false,invViewProjM);
  gl.uniform3fv(pBG.u.uCamPos,cam.eye);
  gl.uniform3fv(pBG.u.uGalN,GAL_N);
  gl.uniform1f(pBG.u.uTime,uTime);
  gl.bindVertexArray(emptyVAO);
  gl.drawArrays(gl.TRIANGLES,0,3);

  /* ---- 恒星 ---- */
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(pStar.p);
  gl.uniformMatrix4fv(pStar.u.uViewProj,false,viewProjM);
  gl.uniform3fv(pStar.u.uCamPos,cam.eye);
  gl.uniform1f(pStar.u.uDpr,DPR);
  gl.uniform1f(pStar.u.uTime,uTime);
  gl.bindVertexArray(STARS.vao);
  gl.drawArrays(gl.POINTS,0,STARS.n);

  /* ---- 不透明天体 ---- */
  gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.useProgram(pPlanet.p);
  drawSphere(sunObj,false);
  for(const b of ORBIT_PLANETS) drawSphere(b,false);
  if(state.show.moons) for(const m of moonObjs) drawSphere(m,true);
  if(state.show.comet && halleyObj.visible) drawSphere(halleyObj,true);

  /* ---- 日冕 ---- */
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  gl.depthMask(false); gl.disable(gl.CULL_FACE);
  gl.useProgram(pCorona.p);
  gl.uniformMatrix4fv(pCorona.u.uViewProj,false,viewProjM);
  gl.uniform3fv(pCorona.u.uCenter,[0,0,0]);
  gl.uniform3fv(pCorona.u.uRight,cam.right);
  gl.uniform3fv(pCorona.u.uUp,cam.up);
  gl.uniform1f(pCorona.u.uTime,uTime);
  gl.uniform3fv(pCorona.u.uCol,[1.0,0.72,0.38]);
  gl.bindVertexArray(quadVAO);
  gl.uniform1f(pCorona.u.uRadius,SUN_DISP*3.1);
  gl.uniform1f(pCorona.u.uInner,1.0/3.1);
  gl.uniform1f(pCorona.u.uGain,0.40);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.uniform1f(pCorona.u.uRadius,SUN_DISP*9.0);
  gl.uniform1f(pCorona.u.uInner,1.0/9.0);
  gl.uniform1f(pCorona.u.uGain,0.15);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  /* ---- 轨道缎带 ---- */
  if(state.show.orbits){
    gl.useProgram(pOrbit.p);
    gl.uniformMatrix4fv(pOrbit.u.uViewProj,false,viewProjM);
    gl.uniform2f(pOrbit.u.uRes,W,H);
    gl.uniform1f(pOrbit.u.uHalfW,0.85);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
    gl.depthMask(false);
    for(const b of ORBIT_PLANETS){
      const g=orbitGeo.get(b.id); if(!g) continue;
      gl.uniform3fv(pOrbit.u.uCol,b.orbCol);
      gl.uniform1f(pOrbit.u.uCur, ((b.E/TAU)%1+1)%1);
      gl.uniform1f(pOrbit.u.uGain, (state.focus===b)?1.0:0.72);
      gl.bindVertexArray(g.vao);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,(ORBIT_N+1)*2);
    }
  }

  /* ---- 小行星带 ---- */
  if(state.show.belt){
    gl.useProgram(pBelt.p);
    gl.uniformMatrix4fv(pBelt.u.uViewProj,false,viewProjM);
    gl.uniform3fv(pBelt.u.uCamPos,cam.eye);
    gl.uniform1f(pBelt.u.uDays, nowJD()-J2000);
    gl.uniform1f(pBelt.u.uCompress,COMPRESS);
    gl.uniform1f(pBelt.u.uScale,SCALE);
    gl.uniform1f(pBelt.u.uPx,H/(2*Math.tan(cam.fov/2)));
    gl.uniform1f(pBelt.u.uDpr,DPR);
    gl.bindVertexArray(BELT.vao);
    gl.drawArrays(gl.POINTS,0,BELT.n);
  }

  /* ---- 彗星 ---- */
  if(state.show.comet && halleyObj.visible){
    buildTailGeom(halleyObj);
    gl.useProgram(pTail.p);
    gl.uniformMatrix4fv(pTail.u.uViewProj,false,viewProjM);
    const sc=Math.pow(3/Math.max(halleyObj.rAU,0.2),2);
    gl.uniform1f(pTail.u.uGain,0.85*Math.min(sc,40));
    gl.bindVertexArray(tailVAO);
    gl.useProgram(pTail.p);
    gl.uniform3fv(pTail.u.uCol,[0.55,0.72,1.0]);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,TAIL_SEG*4);
    gl.uniform3fv(pTail.u.uCol,[1.0,0.80,0.48]);
    gl.uniform1f(pTail.u.uGain,0.55*Math.min(sc,40));
    gl.drawArrays(gl.TRIANGLE_STRIP,TAIL_SEG*4,TAIL_SEG*4);
    /* 彗发 */
    gl.useProgram(pCorona.p);
    gl.uniform3fv(pCorona.u.uCenter,halleyObj.world);
    gl.uniform3fv(pCorona.u.uCol,[0.72,0.95,0.90]);
    gl.uniform1f(pCorona.u.uRadius,Math.max(0.25,0.9*Math.min(sc,12)));
    gl.uniform1f(pCorona.u.uInner,0.02);
    gl.uniform1f(pCorona.u.uGain,1.4*Math.min(sc,12));
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  /* ---- 环系 ---- */
  gl.disable(gl.CULL_FACE);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(pRing.p);
  gl.uniformMatrix4fv(pRing.u.uViewProj,false,viewProjM);
  gl.uniform3fv(pRing.u.uCamPos,cam.eye);
  for(const b of ORBIT_PLANETS){
    const rg=RINGS[b.id]; if(!rg) continue;
    const B=b.basis;
    m4trs(mModel,B[0],B[1],B[2],b.world,b.dispR);
    gl.uniformMatrix4fv(pRing.u.uModel,false,mModel);
    gl.uniform3fv(pRing.u.uSunDirW,vnorm(vscale(b.world,-1)));
    gl.uniform3fv(pRing.u.uCol,rg.col);
    gl.uniform3fv(pRing.u.uNormal,b.axisW);
    gl.uniform3fv(pRing.u.uCenter,b.world);
    gl.uniform1f(pRing.u.uRadius,b.dispR);
    gl.uniform1f(pRing.u.uGain,sunIntensity(Math.max(b.rAU,0.05))*1.15);
    gl.uniform1i(pRing.u.uRingType,rg.type);
    gl.bindVertexArray(ringVAO);
    gl.drawElements(gl.TRIANGLES,RING_GEO.idx.length,gl.UNSIGNED_INT,0);
  }

  /* ---- 大气壳层 ---- */
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.useProgram(pAtmo.p);
  gl.uniformMatrix4fv(pAtmo.u.uViewProj,false,viewProjM);
  gl.uniform3fv(pAtmo.u.uCamPos,cam.eye);
  for(const b of ORBIT_PLANETS.concat(state.show.moons?moonObjs:[])){
    if(!b.atmo) continue;
    const B=b.basis;
    const shellR = b.dispR*(1+b.atmoH*7.5);
    m4trs(mAtmo,B[0],B[1],B[2],b.world,shellR);
    gl.uniformMatrix4fv(pAtmo.u.uModel,false,mAtmo);
    gl.uniform3fv(pAtmo.u.uCenter,b.world);
    gl.uniform3fv(pAtmo.u.uSunDirW,vnorm(vscale(b.world,-1)));
    gl.uniform3fv(pAtmo.u.uCol,b.atmoCol);
    gl.uniform1f(pAtmo.u.uRadius,b.dispR);
    gl.uniform1f(pAtmo.u.uScaleH,b.atmoH);
    gl.uniform1f(pAtmo.u.uGain,b.atmo*0.17);
    gl.bindVertexArray(sphereVAO);
    gl.drawElements(gl.TRIANGLES,SPHERE.idx.length,gl.UNSIGNED_INT,0);
  }

  postProcess();
}

function postProcess(){
  if(MSAA_OK){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, FB.msaa);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, FB.resolve);
    gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  }
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
  gl.bindVertexArray(emptyVAO);

  /* 亮度阈值提取 */
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.bloom[0].fbo);
  gl.viewport(0,0,FB.bloom[0].w,FB.bloom[0].h);
  gl.useProgram(pBright.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,FB.resolveTex);
  gl.uniform1i(pBright.u.uTex,0);
  gl.uniform1f(pBright.u.uThresh, HDR?1.25:0.78);
  gl.uniform1f(pBright.u.uKnee,0.6);
  gl.drawArrays(gl.TRIANGLES,0,3);

  /* 6 级降采样（13-tap） */
  for(let i=1;i<FB.bloom.length;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.bloom[i].fbo);
    gl.viewport(0,0,FB.bloom[i].w,FB.bloom[i].h);
    gl.useProgram(pDown.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,FB.bloom[i-1].tex);
    gl.uniform1i(pDown.u.uTex,0);
    gl.uniform2f(pDown.u.uTexel,1/FB.bloom[i-1].w,1/FB.bloom[i-1].h);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  /* 升采样：加法混合累加，绝不同时读写同一张纹理（7.3） */
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  for(let i=FB.bloom.length-1;i>0;i--){
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.bloom[i-1].fbo);
    gl.viewport(0,0,FB.bloom[i-1].w,FB.bloom[i-1].h);
    gl.useProgram(pUp.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,FB.bloom[i].tex);
    gl.uniform1i(pUp.u.uTex,0);
    gl.uniform2f(pUp.u.uTexel,1/FB.bloom[i].w,1/FB.bloom[i].h);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  gl.disable(gl.BLEND);

  /* 合成 */
  const fl = flareInfo();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.useProgram(pComp.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,FB.resolveTex);
  gl.uniform1i(pComp.u.uScene,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,FB.bloom[0].tex);
  gl.uniform1i(pComp.u.uBloom,1);
  gl.uniform2f(pComp.u.uRes,W,H);
  gl.uniform1f(pComp.u.uExposure,1.0);
  gl.uniform1f(pComp.u.uBloomK, state.show.bloom?0.34:0.0);
  gl.uniform1f(pComp.u.uAberr,0.0032);
  gl.uniform1f(pComp.u.uGrain,0.016);
  gl.uniform1f(pComp.u.uVig,0.42);
  gl.uniform1f(pComp.u.uTime,uTime);
  gl.uniform4f(pComp.u.uFlare,fl[0],fl[1],fl[2],fl[3]);
  gl.uniform3f(pComp.u.uFlareCol,1.0,0.80,0.55);
  gl.uniform1f(pComp.u.uFlareGain,0.30);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.activeTexture(gl.TEXTURE0);
}

function flareInfo(){
  const sp = projectPoint([0,0,0]);
  if(!sp) return [0,0,0,0];
  const dist = vlen(cam.eye);
  const rpx = pixelRadius(dist, SUN_DISP);
  let vis = 1;
  const off = Math.max(0, Math.max(-sp.x, sp.x-W), Math.max(-sp.y, sp.y-H));
  if(off>0) vis = Math.max(0, 1-off/(H*0.6));
  for(const b of ORBIT_PLANETS){
    const bp = projectPoint(b.world); if(!bp) continue;
    const bd = vlen(vsub(b.world,cam.eye));
    if(bd>=dist) continue;
    const brp = pixelRadius(bd,b.dispR);
    const d = Math.hypot(bp.x-sp.x,bp.y-sp.y);
    if(d < (rpx+brp)*0.85){ vis=0; break; }
  }
  return [sp.x,sp.y,vis,rpx];
}

let drag=null, pointers=new Map(), pinchD=0, moved=0;
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pointers.size===1){ drag={x:e.clientX,y:e.clientY}; moved=0; canvas.classList.add('drag'); }
  else if(pointers.size===2){
    const p=[...pointers.values()];
    pinchD=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pointers.size===2){
    const p=[...pointers.values()];
    const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    if(pinchD>0){ cam.dist=clamp(cam.dist*(pinchD/Math.max(d,1)),0.05,6000); }
    pinchD=d; return;
  }
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.x=e.clientX; drag.y=e.clientY;
  moved+=Math.abs(dx)+Math.abs(dy);
  if(moved>3){
    cam.yaw-=dx*0.005;
    cam.pitch=clamp(cam.pitch+dy*0.005,-1.52,1.52);
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchD=0;
  if(pointers.size===0){
    canvas.classList.remove('drag');
    if(drag && moved<=3){
      const r=canvas.getBoundingClientRect();
      const x=(e.clientX-r.left)*DPR, y=(e.clientY-r.top)*DPR;
      const b=pick(x,y);
      if(b){ select(b,true); }
      else { state.focus=null; }
    }
    drag=null;
  }
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',e=>{ pointers.delete(e.pointerId); drag=null; canvas.classList.remove('drag'); });
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.dist=clamp(cam.dist*Math.exp(e.deltaY*0.0011),0.05,6000);
},{passive:false});

function pick(x,y){
  let best=null, bestScore=1e9;
  for(const b of ALL){
    if(b.kind==='comet' && !(state.show.comet && halleyObj.visible)) continue;
    if(b.kind==='moon' && !state.show.moons) continue;
    const p=projectPoint(b.world); if(!p) continue;
    const d=Math.hypot(p.x-x,p.y-y);
    const rpx=pixelRadius(vlen(vsub(b.world,cam.eye)),b.dispR);
    if(d>Math.max(18,rpx*1.6+8)) continue;
    const score=d-rpx*0.85;
    if(score<bestScore){ bestScore=score; best=b; }
  }
  return best;
}
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); setPlaying(!state.playing); updateClock(); }
  else if(e.code==='ArrowRight'){ state.speedParam=clamp(state.speedParam+2,-100,100); el('spd').value=state.speedParam; updateClock(); }
  else if(e.code==='ArrowLeft'){ state.speedParam=clamp(state.speedParam-2,-100,100); el('spd').value=state.speedParam; updateClock(); }
  else if(e.key==='h'||e.key==='H'){ el('ui').style.display = el('ui').style.display==='none'?'':'none'; }
});

el('btnPlay').addEventListener('click',()=>{ setPlaying(!state.playing); updateClock(); });
el('btnNow').addEventListener('click',()=>{ setTime(Date.now(),true); updateClock(); });
el('spd').addEventListener('input',e=>{ state.speedParam=parseFloat(e.target.value); updateClock(); });

/* =========================== 启动 =========================== */
initBodies();
buildTree();
buildToggles();
resize();
setTime(Date.now(),true);
state.sel=BY_ID.earth; state.focus=null;
renderCard(state.sel); markTree();
setPlaying(true);
updateClock();

let lastNow=performance.now(), uiAcc=0, fpsAcc=0, fpsN=0;
const fpsEl=document.createElement('div');
fpsEl.id='fps'; fpsEl.style.cssText='position:absolute;left:16px;bottom:44px;font-size:9.5px;letter-spacing:.16em;color:rgba(148,174,210,.45)';
el('ui').appendChild(fpsEl);

function loop(){
  requestAnimationFrame(loop);
  /* 统一用 performance.now() 取帧间隔：部分内嵌环境里 rAF 时间戳与 performance.now() 原点不同，
     混用会得到负的 dt，导致时间倒流与界面刷新失效 */
  const t=performance.now();
  let dt=(t-lastNow)/1000; lastNow=t;
  if(dt>0.12) dt=0.12;
  if(dt<0) dt=0;
  adaptQuality();
  const dps=speedToDaysPerSec(state.speedParam);
  const dDays = state.playing?dps*dt:0;
  if(state.playing) state.simMs += dt*1000*dps*86400000;
  updateBodies(dDays);
  if(state.cT<1){
    state.cT=Math.min(1,state.cT+dt/0.4);
    const e=state.cT<0.5?2*state.cT*state.cT:1-Math.pow(-2*state.cT+2,2)/2;
    COMPRESS=lerp(state.cFrom,state.cTo,e);
  } else COMPRESS=state.cTo;
  updateCamera(dt);
  renderFrame();
  updateLabels();
  uiAcc+=dt; fpsAcc+=dt; fpsN++;
  if(uiAcc>0.12){ uiAcc=0; updateLive(); updateClock(); }
  if(fpsAcc>0.5){ fpsEl.textContent=Math.round(fpsN/fpsAcc)+' FPS'; fpsAcc=0; fpsN=0; }
}
requestAnimationFrame(loop);

})();
</script>
