<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系实时运动模型 - Solar System Real-time Simulation</title>
    <style>
        :root {
            --bg-glass: rgba(10, 14, 24, 0.82);
            --border-glass: rgba(255, 255, 255, 0.14);
            --border-glow: rgba(0, 210, 255, 0.35);
            --text-main: #f0f4f8;
            --text-sub: #8a99ad;
            --accent-cyan: #00d2ff;
            --accent-gold: #ffb703;
            --accent-red: #ff4d6d;
            --panel-radius: 12px;
            --font-mono: "SF Mono", "Roboto Mono", "Cascadia Code", Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010204;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        #webgl-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: grab;
        }

        #webgl-canvas:active {
            cursor: grabbing;
        }

        /* Glassmorphism Panel Base */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--panel-radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Left Navigation Sidebar */
        #left-sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 290px;
            max-height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tree-container {
            padding: 10px;
            overflow-y: auto;
            flex: 1;
        }

        .tree-container::-webkit-scrollbar {
            width: 4px;
        }
        .tree-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .tree-group-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 0.8px;
            margin: 10px 8px 4px 8px;
            text-transform: uppercase;
        }

        .tree-item {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s ease, color 0.15s ease;
            margin-bottom: 2px;
        }

        .tree-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .tree-item.active {
            background: rgba(0, 210, 255, 0.18);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: #fff;
            font-weight: 600;
        }

        .tree-item.indent {
            padding-left: 28px;
            font-size: 12px;
            color: var(--text-sub);
        }

        /* Right Detail Card */
        #right-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 350px;
            max-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #right-sidebar::-webkit-scrollbar {
            width: 4px;
        }
        #right-sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .detail-body {
            padding: 16px;
        }

        .body-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .body-name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .body-type {
            font-size: 12px;
            color: var(--accent-cyan);
            font-weight: 500;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 8px 10px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-sub);
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            color: #fff;
        }

        .stat-value.highlight {
            color: var(--accent-gold);
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
            margin: 14px 0 6px 0;
            text-transform: uppercase;
        }

        .body-description {
            font-size: 12px;
            line-height: 1.6;
            color: #c0cedc;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid var(--accent-cyan);
        }

        /* Bottom Controls Bar */
        #bottom-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 22px;
            height: 62px;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-icon:hover {
            background: rgba(0, 210, 255, 0.25);
            border-color: var(--accent-cyan);
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
        }

        .time-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 175px;
        }

        .date-text {
            font-size: 15px;
            font-weight: 700;
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .speed-text {
            font-size: 11px;
            color: var(--text-sub);
            font-family: var(--font-mono);
            margin-top: 2px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 140px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* Toggles Panel (Bottom Right) */
        #toggles-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 210px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-round {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.15);
            transition: .3s;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider-round:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider-round {
            background-color: rgba(0, 210, 255, 0.5);
            border-color: var(--accent-cyan);
        }

        input:checked + .slider-round:before {
            transform: translateX(16px);
            background-color: var(--accent-cyan);
        }

        /* 2D Planet Labels Layer */
        #labels-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .planet-label {
            position: absolute;
            transform: translate(-50%, -100%);
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(4, 8, 16, 0.82);
            border: 1px solid rgba(0, 210, 255, 0.3);
            white-space: nowrap;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            cursor: pointer;
        }

        .planet-label:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 210, 255, 0.25);
        }

        .label-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
        }

        /* Warning Banner */
        #banner-notice {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 77, 109, 0.22);
            border: 1px solid rgba(255, 77, 109, 0.55);
            color: #ff9ebb;
            display: none;
            z-index: 100;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; box-shadow: 0 0 15px rgba(255, 77, 109, 0.4); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div id="banner-notice">已超出轨道根数有效区间 (1800–2050年外推)</div>

    <!-- Left Sidebar: Planet Selector Tree -->
    <div id="left-sidebar" class="glass-panel">
        <div class="panel-header">
            <div class="panel-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a7 7 0 1 0 7 7"/></svg>
                太阳系天体列表
            </div>
        </div>
        <div class="tree-container" id="tree-root"></div>
    </div>

    <!-- Right Sidebar: Detailed Info Card -->
    <div id="right-sidebar" class="glass-panel">
        <div class="panel-header">
            <div class="panel-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M3 12h3m12 0h3M12 3v3m0 12v3"/></svg>
                天体实时参数
            </div>
        </div>
        <div class="detail-body" id="detail-card-body"></div>
    </div>

    <!-- Bottom Controls Bar -->
    <div id="bottom-bar" class="glass-panel">
        <button class="btn-icon" id="btn-now" title="重置到当前时刻">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        </button>
        <button class="btn-icon" id="btn-reverse" title="倒放/减速">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11 19V5l-9 7 9 7zm11 0V5l-9 7 9 7z"/></svg>
        </button>
        <button class="btn-icon" id="btn-play" title="播放/暂停">
            <svg id="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="btn-icon" id="btn-forward" title="快进">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l9-7-9-5zm-11 0v12l9-7-9-5z"/></svg>
        </button>

        <div class="time-display">
            <div class="date-text" id="time-text">2026-08-07 00:00:00</div>
            <div class="speed-text" id="speed-text">速度: 1.0 秒 / 秒</div>
        </div>

        <div class="slider-container">
            <input type="range" id="speed-slider" min="-100" max="100" value="0" step="1">
        </div>
    </div>

    <!-- Toggles Panel (Bottom Right) -->
    <div id="toggles-panel" class="glass-panel">
        <div class="toggle-row">
            <span>轨道缎带</span>
            <label class="switch"><input type="checkbox" id="chk-orbits" checked><span class="slider-round"></span></label>
        </div>
        <div class="toggle-row">
            <span>天体名称</span>
            <label class="switch"><input type="checkbox" id="chk-names" checked><span class="slider-round"></span></label>
        </div>
        <div class="toggle-row">
            <span>卫星显示</span>
            <label class="switch"><input type="checkbox" id="chk-moons" checked><span class="slider-round"></span></label>
        </div>
        <div class="toggle-row">
            <span>小行星带/柯伊伯带</span>
            <label class="switch"><input type="checkbox" id="chk-asteroids" checked><span class="slider-round"></span></label>
        </div>
        <div class="toggle-row">
            <span>哈雷彗星</span>
            <label class="switch"><input type="checkbox" id="chk-comet" checked><span class="slider-round"></span></label>
        </div>
        <div class="toggle-row">
            <span>真实1:1距离</span>
            <label class="switch"><input type="checkbox" id="chk-scale"><span class="slider-round"></span></label>
        </div>
        <div class="toggle-row">
            <span>HDR / 泛光</span>
            <label class="switch"><input type="checkbox" id="chk-bloom" checked><span class="slider-round"></span></label>
        </div>
    </div>

    <!-- HTML 2D Overlay Labels -->
    <div id="labels-container"></div>

        /* ========================================================================
           3. ORBITAL SOLVER (KEPLER EQUATION) & POSITION CALCULATIONS
           ======================================================================== */
        function solveKepler(M, e) {
            M = Math.atan2(Math.sin(M), Math.cos(M));
            let E = M + e * Math.sin(M) * (1.0 + e * Math.cos(M));
            for (let i = 0; i < 10; i++) {
                let f = E - e * Math.sin(E) - M;
                let fPrime = 1.0 - e * Math.cos(E);
                let delta = f / fPrime;
                E -= delta;
                if (Math.abs(delta) < 1e-13) break;
            }
            return E;
        }

        function calculatePlanetPosition(key, JulianCentury) {
            const data = PLANET_ORBITS[key];
            const T = JulianCentury;

            const a = data.a0 + data.da * T;
            const e = data.e0 + data.de * T;
            const I = (data.I0 + data.dI * T) * DEG2RAD;
            const L = (data.L0 + data.dL * T) * DEG2RAD;
            const wBar = (data.wBar0 + data.dwBar * T) * DEG2RAD;
            const Omega = (data.Omega0 + data.dOmega * T) * DEG2RAD;

            const w = wBar - Omega;
            const M = L - wBar;

            const E = solveKepler(M, e);

            const xPrime = a * (Math.cos(E) - e);
            const yPrime = a * Math.sqrt(1.0 - e * e) * Math.sin(E);

            const cosW = Math.cos(w), sinW = Math.sin(w);
            const cosO = Math.cos(Omega), sinO = Math.sin(Omega);
            const cosI = Math.cos(I), sinI = Math.sin(I);

            const xEcl = (cosW * cosO - sinW * sinO * cosI) * xPrime + (-sinW * cosO - cosW * sinO * cosI) * yPrime;
            const yEcl = (cosW * sinO + sinW * cosO * cosI) * xPrime + (-sinW * sinO + cosW * cosO * cosI) * yPrime;
            const zEcl = (sinW * sinI) * xPrime + (cosW * sinI) * yPrime;

            const worldPos = Vec3.create(xEcl, zEcl, -yEcl);
            const rAU = Math.hypot(xEcl, yEcl, zEcl);
            const eclLon = Math.atan2(yEcl, xEcl) * RAD2DEG;
            const eclLat = Math.asin(zEcl / rAU) * RAD2DEG;
            const vKmS = 29.7847 * Math.sqrt(2.0 / rAU - 1.0 / a);

            return {
                pos: worldPos,
                rAU: rAU,
                eclLon: (eclLon + 360) % 360,
                eclLat: eclLat,
                vKmS: vKmS,
                a: a, e: e, I: I * RAD2DEG, L: (L * RAD2DEG + 360) % 360,
                w: w, Omega: Omega
            };
        }

        function calculateHalleyPosition(JD) {
            const h = HALLEY_COMET;
            const Pdays = h.periodDays;
            const M = 2.0 * Math.PI * (JD - h.TpJD) / Pdays;
            const E = solveKepler(M, h.e);

            const xPrime = h.a * (Math.cos(E) - h.e);
            const yPrime = h.a * Math.sqrt(1.0 - h.e * h.e) * Math.sin(E);

            const w = h.w * DEG2RAD;
            const Omega = h.Omega * DEG2RAD;
            const I = h.I * DEG2RAD;

            const cosW = Math.cos(w), sinW = Math.sin(w);
            const cosO = Math.cos(Omega), sinO = Math.sin(Omega);
            const cosI = Math.cos(I), sinI = Math.sin(I);

            const xEcl = (cosW * cosO - sinW * sinO * cosI) * xPrime + (-sinW * cosO - cosW * sinO * cosI) * yPrime;
            const yEcl = (cosW * sinO + sinW * cosO * cosI) * xPrime + (-sinW * sinO + cosW * cosO * cosI) * yPrime;
            const zEcl = (sinW * sinI) * xPrime + (cosW * sinI) * yPrime;

            const rAU = Math.hypot(xEcl, yEcl, zEcl);
            return {
                pos: Vec3.create(xEcl, zEcl, -yEcl),
                rAU: rAU
            };

        /* ========================================================================

        const COMMON_NOISE_GLSL = `#version 300 es
        precision highp float;

        float hash13(vec3 p) {
            p = fract(p * 0.1031);
            p += dot(p, p.zyx + 31.32);
            return fract((p.x + p.y) * p.z);
        }

        vec3 hash33(vec3 p) {
            p = vec3(dot(p, vec3(127.1, 311.7, 74.7)),
                     dot(p, vec3(269.5, 183.3, 246.1)),
                     dot(p, vec3(113.5, 271.9, 124.6)));
            return fract(sin(p) * 43758.5453123);
        }

        float valueNoise(vec3 p) {
            vec3 i = floor(p);
            vec3 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);

            return mix(
                mix(mix(hash13(i + vec3(0,0,0)), hash13(i + vec3(1,0,0)), f.x),
                    mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.x),
                mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x),
                    mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.x), f.z);
        }

        float fbm(vec3 p, int octaves) {
            float v = 0.0;
            float a = 0.5;
            mat3 rot = mat3(0.8, 0.6, 0.0, -0.6, 0.8, 0.0, 0.0, 0.0, 1.0);
            for(int i=0; i<octaves; i++) {
                v += a * valueNoise(p);
                p = rot * p * 2.02;
                a *= 0.5;
            }
            return v;
        }

        vec2 worley3D(vec3 p) {
            vec3 n = floor(p);
            vec3 f = fract(p);
            float d1 = 8.0;
            float d2 = 8.0;

            for(int k=-1; k<=1; k++) {
                for(int j=-1; j<=1; j++) {
                    for(int i=-1; i<=1; i++) {
                        vec3 g = vec3(float(i), float(j), float(k));
                        vec3 o = hash33(n + g);
                        vec3 delta = g + o - f;
                        float d = dot(delta, delta);
                        if(d < d1) {
                            d2 = d1;
                            d1 = d;
                        } else if(d < d2) {
                            d2 = d;
                        }
                    }
                }
            }
            return vec2(sqrt(d1), sqrt(d2));
        }

        float sstep(float a, float b, float x) {
            float t = clamp((x - a) / (b - a), 0.0, 1.0);
            return t * t * (3.0 - 2.0 * t);
        }
        `;

                if(uCustomParams.y > 0.5) {
                    vec2 spotCenter = vec2(0.3, -0.22);
                    vec2 currentPos = vec2(atan(p.z, p.x) / 6.28318, p.y);
                    vec2 diff = currentPos - spotCenter;
                    diff.x = fract(diff.x + 0.5) - 0.5;
                    float distEll = length(diff * vec2(1.0, 2.15));
                    if(distEll < 0.08) {
                        float grsSpiral = fbm(vec3(diff * 45.0, uTime * 0.05), 3);
                        vec3 grsColor = mix(vec3(0.75, 0.22, 0.08), vec3(0.9, 0.4, 0.15), grsSpiral);
                        color = mix(color, grsColor, sstep(0.08, 0.04, distEll));
                    }
                }

                if(uCustomParams.x > 0.5 && p.y > 0.82) {
                    float lon = atan(p.z, p.x);
                    float hex = 0.115 / cos(mod(lon, 1.0472) - 0.5236);
                    if(abs(p.y - 0.88) < hex * 0.2) color *= 0.7;
                }
            }
            else if(uBodyType == 6) { // 冰巨行星
                float band = fbm(p * vec3(2.0, 8.0, 2.0), 3);
                color = mix(uBaseColor * 0.85, uBaseColor * 1.1, band * 0.3);

                if(uCustomParams.z > 0.5) {
                    float spot = length((p.xy - vec2(0.4, -0.3)) * vec2(1.0, 1.8));
                    if(spot < 0.12) color *= mix(0.5, 1.0, sstep(0.0, 0.12, spot));
                }
            }
            else { // 特殊卫星
                if(uCustomParams.w == 1.0) { // 木卫二
                    float cracks = abs(fbm(p * 15.0, 5) - 0.5);
                    color = mix(vec3(0.92, 0.94, 0.96), vec3(0.45, 0.22, 0.12), sstep(0.02, 0.0, cracks));
                } else if(uCustomParams.w == 2.0) { // 木卫一
                    float sulfur = fbm(p * 9.0, 4);
                    color = mix(vec3(0.9, 0.8, 0.2), vec3(0.85, 0.35, 0.05), sulfur);
                    float volcano = worley3D(p * 12.0).x;
                    if(volcano < 0.08) color = vec3(0.1);
                } else {
                    color = uBaseColor;
                }
            }

            if(uBodyType != 0) {
                float NdotL = max(dot(N, L), 0.0);
                float shadow = 1.0;

                if(uHasRingShadow && NdotL > 0.0) {
                    vec3 rayDir = -L;
                    if(abs(rayDir.y) > 0.001) {
                        float tPlane = -vWorldPos.y / rayDir.y;
                        if(tPlane > 0.0) {
                            vec3 hitP = vWorldPos + rayDir * tPlane;
                            float rHit = length(hitP.xz);
                            if(rHit >= uRingInnerR && rHit <= uRingOuterR) {
                                shadow = 0.25;
                            }
                        }
                    }
                }

                vec3 ambient = color * 0.05;
                vec3 diffuse = color * NdotL * shadow * 1.35;
                vec3 specular = vec3(spec) * shadow;

                color = ambient + diffuse + specular;
            }

            fragColor = vec4(color, 1.0);
        }
        `;

        // 2. Atmosphere Shell Shader
        const ATMOSPHERE_VS = `#version 300 es
        layout(location = 0) in vec3 aPosition;
        uniform mat4 uModel;
        uniform mat4 uViewProj;
        out vec3 vWorldPos;
        void main() {
            vec4 wp = uModel * vec4(aPosition, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = uViewProj * wp;
        }
        `;

        const ATMOSPHERE_FS = `#version 300 es
        precision highp float;
        in vec3 vWorldPos;
        uniform vec3 uCameraPos;
        uniform vec3 uSunPos;
        uniform vec3 uPlanetCenter;
        uniform float uPlanetRadius;
        uniform vec3 uAtmoColor;
        out vec4 fragColor;

        void main() {
            vec3 rd = normalize(vWorldPos - uCameraPos);
            vec3 oc = uPlanetCenter - uCameraPos;
            float tca = dot(oc, rd);
            if(tca < 0.0) discard;

            float d2 = dot(oc, oc) - tca * tca;
            float b = sqrt(max(0.0, d2)) / uPlanetRadius;

            float scaleHeight = 0.035;
            float dens = exp(-max(b - 1.0, 0.0) / scaleHeight);
            dens *= 1.0 - smoothstep(1.0, 0.96, b) * 0.86;

            vec3 L = normalize(uSunPos - uPlanetCenter);
            vec3 an = normalize(uCameraPos + rd * tca - uPlanetCenter);
            float lightFacing = max(dot(an, L), 0.0);

            float mie = pow(dot(rd, L) * 0.5 + 0.5, 4.0);
            float alpha = dens * (lightFacing * 0.85 + 0.15 + mie * 0.5);

            alpha = clamp(alpha * 0.45, 0.0, 0.85);
            fragColor = vec4(uAtmoColor * 1.5, alpha);
        }
        `;

        // 3. Ring Shader with Mutual Planet Shadow
        const RING_VS = `#version 300 es
        layout(location = 0) in vec3 aPosition;
        layout(location = 2) in vec2 aTexCoord;

        uniform mat4 uModel;
        uniform mat4 uViewProj;

        out vec3 vWorldPos;
        out vec2 vTexCoord;
        out vec3 vLocalPos;

        void main() {
            vLocalPos = aPosition;
            vTexCoord = aTexCoord;
            vec4 wp = uModel * vec4(aPosition, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = uViewProj * wp;
        }
        `;

        const RING_FS = COMMON_NOISE_GLSL + `
        in vec3 vWorldPos;
        in vec2 vTexCoord;
        in vec3 vLocalPos;

        uniform vec3 uCameraPos;
        uniform vec3 uSunPos;
        uniform vec3 uPlanetCenter;
        uniform float uPlanetRadius;
        uniform int uRingType;

        out vec4 fragColor;

        float saturnRingDensity(float r) {
            if(r < 1.235 || r > 2.34) return 0.0;
            float d = 0.0;
            if(r < 1.53) d = 0.11;
            else if(r < 1.95) d = 1.20;
            else if(r < 2.025) d = 1.20 * 0.13;
            else if(r < 2.27) {
                d = 0.58;
                if(abs(r - 2.214) < 0.0045) d *= 0.08;
                if(abs(r - 2.265) < 0.0018) d *= 0.20;
            }
            else if(abs(r - 2.324) < 0.0055) d = 0.30;

            float noise = 0.70 + 0.60 * fbm(vec3(r * 230.0, 0.0, 0.0), 3);
            return d * noise;
        }

        void main() {
            float r = length(vLocalPos.xz);
            float d = 0.0;
            vec3 ringCol = vec3(0.9, 0.82, 0.7);

            if(uRingType == 0) {
                d = saturnRingDensity(r);
            } else if(uRingType == 1) {
                if(abs(r - 1.951) < 0.0055) d = 0.55;
                else if(abs(r - 1.909) < 0.0025) d = 0.20;
                else if(abs(r - 1.863) < 0.002) d = 0.15;
                else if(abs(r - 1.751) < 0.0015) d = 0.07;
                ringCol = vec3(0.08);
            } else {
                if(r >= 1.40 && r <= 1.81) d = 0.016;
                ringCol = vec3(0.6, 0.5, 0.4);
            }

            if(d <= 0.001) discard;

            vec3 N = vec3(0.0, 1.0, 0.0);
            vec3 V = normalize(uCameraPos - vWorldPos);
            vec3 L = normalize(uSunPos - vWorldPos);

            float muView = max(abs(dot(N, V)), 0.10);
            float muSun = max(abs(dot(N, L)), 0.10);

            float tauView = d * 1.45 / muView;
            float tauSun = d * 1.45 / muSun;
            float alpha = 1.0 - exp(-tauView);

            bool sameSide = (dot(N, V) * dot(N, L)) > 0.0;
            float brightness = 0.0;
            if(sameSide) {
                brightness = (1.0 - exp(-tauSun)) * 0.85;
            } else {
                brightness = exp(-tauSun * 0.42) * 1.15 * (1.0 - exp(-tauSun * 0.75));
            }

            vec3 oc = vWorldPos - uPlanetCenter;
            float bb = dot(oc, L);
            if(bb < 0.0) {
                float dmin2 = dot(oc, oc) - bb * bb;
                float rPlan = uPlanetRadius;
                if(dmin2 < rPlan * rPlan) {
                    float shadowPenumbra = sstep(rPlan * 0.95, rPlan * 1.05, sqrt(dmin2));
                    brightness *= shadowPenumbra;
                }
            }

            fragColor = vec4(ringCol * brightness, alpha);
        }
        `;

        // 4. Asteroids GPU Shader
        const ASTEROID_VS = `#version 300 es
        layout(location = 0) in vec4 aOrbitalElem1;
        layout(location = 1) in vec4 aOrbitalElem2;

        uniform mat4 uViewProj;
        uniform float uTimeDays;
        uniform float uScaleFactor;
        uniform float uCompressPow;

        out float vBrightness;

        float solveKeplerGPU(float M, float e) {
            float E = M + e * sin(M) * (1.0 + e * cos(M));
            for(int i=0; i<6; i++) {
                float f = E - e * sin(E) - M;
                float fP = 1.0 - e * cos(E);
                E -= f / fP;
            }
            return E;
        }

        void main() {
            float a = aOrbitalElem1.x;
            float e = aOrbitalElem1.y;
            float I = aOrbitalElem1.z;
            float Omega = aOrbitalElem1.w;

            float w = aOrbitalElem2.x;
            float M0 = aOrbitalElem2.y;
            float n = aOrbitalElem2.z;
            float pSize = aOrbitalElem2.w;

            float M = M0 + n * uTimeDays;
            float E = solveKeplerGPU(M, e);

            float xP = a * (cos(E) - e);
            float yP = a * sqrt(1.0 - e * e) * sin(E);

            float cosW = cos(w), sinW = sin(w);
            float cosO = cos(Omega), sinO = sin(Omega);
            float cosI = cos(I), sinI = sin(I);

            float xEcl = (cosW * cosO - sinW * sinO * cosI) * xP + (-sinW * cosO - cosW * sinO * cosI) * yP;
            float yEcl = (cosW * sinO + sinW * cosO * cosI) * xP + (-sinW * sinO + cosW * cosO * cosI) * yP;
            float zEcl = (sinW * sinI) * xP + (cosW * sinI) * yP;

            float rAU = length(vec3(xEcl, yEcl, zEcl));
            float rDisp = uScaleFactor * pow(rAU, uCompressPow);
            vec3 dir = normalize(vec3(xEcl, zEcl, -yEcl));

            vec3 worldPos = dir * rDisp;
            gl_Position = uViewProj * vec4(worldPos, 1.0);

            gl_PointSize = clamp(pSize * (30.0 / gl_Position.w), 0.75, 4.5);
            vBrightness = clamp(1.5 / (rAU * rAU), 0.15, 1.0);
        }
        `;

        const ASTEROID_FS = `#version 300 es
        precision highp float;
        in float vBrightness;
        out vec4 fragColor;
        void main() {
            vec2 pt = gl_PointCoord - vec2(0.5);
            if(dot(pt, pt) > 0.25) discard;
            fragColor = vec4(vec3(0.85, 0.88, 0.92) * vBrightness, 0.75);
        }
        `;

        // 5. Orbit Line Shader
        const ORBIT_VS = `#version 300 es
        layout(location = 0) in vec3 aPosition;
        uniform mat4 uViewProj;
        void main() {
            gl_Position = uViewProj * vec4(aPosition, 1.0);
        }
        `;

        const ORBIT_FS = `#version 300 es
        precision highp float;
        uniform vec4 uOrbitColor;
        out vec4 fragColor;
        void main() {
            fragColor = uOrbitColor;
        }
        `;

        // 6. Post-processing Composite Shader
        const QUAD_VS = `#version 300 es
        layout(location = 0) in vec2 aPosition;
        out vec2 vUV;
        void main() {
            vUV = aPosition * 0.5 + 0.5;
            gl_Position = vec4(aPosition, 0.0, 1.0);
        }
        `;

        const POST_COMPOSITE_FS = `#version 300 es
        precision highp float;
        in vec2 vUV;
        uniform sampler2D uSceneTex;
        uniform bool uBloomEnabled;

        out vec4 fragColor;

        vec3 ACESFilm(vec3 x) {
            float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
            return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);
        }

        void main() {
            vec3 color = texture(uSceneTex, vUV).rgb;
            color = ACESFilm(color);
            color = pow(color, vec3(1.0 / 2.2));

            vec2 uv = vUV * (1.0 - vUV.yx);
            float vig = uv.x * uv.y * 15.0;
            color *= pow(vig, 0.15);

            fragColor = vec4(color, 1.0);
        }
        `;

        /* ========================================================================
           5. RENDERER ENGINE CLASS & PROCEDURAL MESH CREATORS
           ======================================================================== */
        class WebGLRenderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.gl = canvas.getContext("webgl2", { antialias: true, alpha: false, preserveDrawingBuffer: true });
                if(!this.gl) alert("无法初始化 WebGL2 上下文！");

                this.gl.getExtension("EXT_color_buffer_float");

                this.initShaders();
                this.initMeshes();
                this.initFBOs();
                this.initAsteroidData();
            }

            compileShader(src, type) {
                const gl = this.gl;
                const shader = gl.createShader(type);
                gl.shaderSource(shader, src);
                gl.compileShader(shader);
                if(!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error("Shader compile error:", gl.getShaderInfoLog(shader));
                }
                return shader;
            }

            createProgram(vsSrc, fsSrc) {
                const gl = this.gl;
                const vs = this.compileShader(vsSrc, gl.VERTEX_SHADER);
                const fs = this.compileShader(fsSrc, gl.FRAGMENT_SHADER);
                const prog = gl.createProgram();
                gl.attachShader(prog, vs);
                gl.attachShader(prog, fs);
                gl.linkProgram(prog);
                if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                    console.error("Program link error:", gl.getProgramInfoLog(prog));
                }
                return prog;
            }

            initShaders() {
                this.planetProg = this.createProgram(PLANET_VS, PLANET_FS);
                this.atmoProg = this.createProgram(ATMOSPHERE_VS, ATMOSPHERE_FS);
                this.ringProg = this.createProgram(RING_VS, RING_FS);
                this.asteroidProg = this.createProgram(ASTEROID_VS, ASTEROID_FS);
                this.orbitProg = this.createProgram(ORBIT_VS, ORBIT_FS);
                this.postProg = this.createProgram(QUAD_VS, POST_COMPOSITE_FS);
            }

            createSphereMesh(latBands = 48, longBands = 48) {
                const gl = this.gl;
                let positions = [], normals = [], texCoords = [], indices = [];

                for (let lat = 0; lat <= latBands; lat++) {
                    let theta = lat * Math.PI / latBands;
                    let sinTheta = Math.sin(theta);
                    let cosTheta = Math.cos(theta);

                    for (let lon = 0; lon <= longBands; lon++) {
                        let phi = lon * 2 * Math.PI / longBands;
                        let sinPhi = Math.sin(phi);
                        let cosPhi = Math.cos(phi);

                        let x = cosPhi * sinTheta;
                        let y = cosTheta;
                        let z = sinPhi * sinTheta;

                        positions.push(x, y, z);
                        normals.push(x, y, z);
                        texCoords.push(lon / longBands, lat / latBands);
                    }
                }

                for (let lat = 0; lat < latBands; lat++) {
                    for (let lon = 0; lon < longBands; lon++) {
                        let first = (lat * (longBands + 1)) + lon;
                        let second = first + longBands + 1;
                        indices.push(first, second, first + 1);
                        indices.push(second, second + 1, first + 1);
                    }
                }

                const vao = gl.createVertexArray();
                gl.bindVertexArray(vao);

                const posBuf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
                gl.enableVertexAttribArray(0);
                gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

                const normBuf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(normals), gl.STATIC_DRAW);
                gl.enableVertexAttribArray(1);
                gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);

                const uvBuf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(texCoords), gl.STATIC_DRAW);
                gl.enableVertexAttribArray(2);
                gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);

                const idxBuf = gl.createBuffer();
                gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
                gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

                gl.bindVertexArray(null);
                return { vao, count: indices.length };
            }

            createRingMesh(innerR, outerR, segments = 96) {
                const gl = this.gl;
                let positions = [], texCoords = [], indices = [];

                for (let i = 0; i <= segments; i++) {
                    let theta = i * 2 * Math.PI / segments;
                    let cosT = Math.cos(theta), sinT = Math.sin(theta);

                    positions.push(cosT * innerR, 0, sinT * innerR);
                    texCoords.push(0, i / segments);

                    positions.push(cosT * outerR, 0, sinT * outerR);
                    texCoords.push(1, i / segments);
                }

                for (let i = 0; i < segments; i++) {
                    let idx = i * 2;
                    indices.push(idx, idx + 1, idx + 2);
                    indices.push(idx + 1, idx + 3, idx + 2);
                }

                const vao = gl.createVertexArray();
                gl.bindVertexArray(vao);

                const posBuf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
                gl.enableVertexAttribArray(0);
                gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

                const uvBuf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(texCoords), gl.STATIC_DRAW);
                gl.enableVertexAttribArray(2);
                gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);

                const idxBuf = gl.createBuffer();
                gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
                gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

                gl.bindVertexArray(null);
                return { vao, count: indices.length };
            }

            createDynamicLineMesh() {
                const gl = this.gl;
                const vao = gl.createVertexArray();
                gl.bindVertexArray(vao);

                const buf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                gl.enableVertexAttribArray(0);
                gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

                gl.bindVertexArray(null);
                return { vao, buf };
            }

            createQuadMesh() {
                const gl = this.gl;
                const verts = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
                const vao = gl.createVertexArray();
                gl.bindVertexArray(vao);
                const buf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
                gl.enableVertexAttribArray(0);
                gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
                gl.bindVertexArray(null);
                return { vao, count: 4 };
            }

            initMeshes() {
                this.sphere = this.createSphereMesh(48, 48);
                this.quad = this.createQuadMesh();
                this.saturnRingMesh = this.createRingMesh(1.235, 2.34);
                this.uranusRingMesh = this.createRingMesh(1.60, 2.00);
                this.dynamicLine = this.createDynamicLineMesh();
            }

            initAsteroidData() {
                const gl = this.gl;
                let data1 = [], data2 = [];

                let count = 0;
                while(count < 9000) {
                    let a = 2.06 + Math.random() * (3.28 - 2.06);
                    let pGap = (1.0 - 0.93 * Math.exp(-Math.pow((a - 2.502)/0.022, 2.0)))
                             * (1.0 - 0.85 * Math.exp(-Math.pow((a - 2.825)/0.016, 2.0)))
                             * (1.0 - 0.70 * Math.exp(-Math.pow((a - 2.958)/0.012, 2.0)))
                             * (1.0 - 0.90 * Math.exp(-Math.pow((a - 3.279)/0.020, 2.0)));
                    let pEnvelope = Math.exp(-Math.pow((a - 2.72)/0.55, 2.0));

                    if(Math.random() < pGap * pEnvelope) {
                        let e = Math.abs(Math.random() * 0.2);
                        let I = Math.abs(Math.random() * 12.0) * DEG2RAD;
                        let Omega = Math.random() * 360.0 * DEG2RAD;
                        let w = Math.random() * 360.0 * DEG2RAD;
                        let M0 = Math.random() * 360.0 * DEG2RAD;
                        let n = (2.0 * Math.PI) / (Math.pow(a, 1.5) * 365.25);
                        let sz = 1.0 + Math.random() * 2.0;

                        data1.push(a, e, I, Omega);
                        data2.push(w, M0, n, sz);
                        count++;
                    }
                }

                // 木星特洛伊群
                const jupL0 = 34.396 * DEG2RAD;
                const jupN = (2.0 * Math.PI) / (Math.pow(5.202, 1.5) * 365.25);
                for(let i=0; i<2000; i++) {
                    let a = 5.202 + (Math.random() - 0.5) * 0.15;
                    let e = Math.abs(Math.random() * 0.12);
                    let I = Math.abs(Math.random() * 10.0) * DEG2RAD;
                    let Omega = Math.random() * 360.0 * DEG2RAD;
                    let w = Math.random() * 360.0 * DEG2RAD;
                    let sign = (i % 2 === 0) ? 1.0 : -1.0;
                    let M0 = jupL0 + sign * 60.0 * DEG2RAD + (Math.random() - 0.5) * 0.45;

                    data1.push(a, e, I, Omega);
                    data2.push(w, M0, jupN, 1.8);
                }

                this.asteroidCount = data1.length / 4;
                this.asteroidVAO = gl.createVertexArray();
                gl.bindVertexArray(this.asteroidVAO);

                const b1 = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, b1);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data1), gl.STATIC_DRAW);
                gl.enableVertexAttribArray(0);
                gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);

                const b2 = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, b2);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data2), gl.STATIC_DRAW);
                gl.enableVertexAttribArray(1);
                gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);

                gl.bindVertexArray(null);
            }

            initFBOs() {
                const gl = this.gl;
                const w = this.canvas.width;
                const h = this.canvas.height;

                this.sceneTex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, this.sceneTex);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.FLOAT, null);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

                this.depthBuffer = gl.createRenderbuffer();
                gl.bindRenderbuffer(gl.RENDERBUFFER, this.depthBuffer);
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);

                this.hdrFBO = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, this.hdrFBO);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.sceneTex, 0);
                gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, this.depthBuffer);

                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            }

            resize(w, h) {
                this.canvas.width = w;
                this.canvas.height = h;
                this.initFBOs();
            }
        }

        /* ========================================================================

                this.canvas = document.getElementById("webgl-canvas");

                this.showAsteroids = true;
                this.showComet = true;

                this.scaleCompress = 0.62;
                this.targetCompress = 0.62;

                this.focusTarget = "sun";
                this.camYaw = 0.5;
                this.camPitch = 0.4;
                this.camDistance = 60.0;
                this.targetCamDistance = 60.0;

                this.targetCamCenter = Vec3.create(0, 0, 0);
                this.currentCamCenter = Vec3.create(0, 0, 0);

                this.isMouseDown = false;
                this.lastMouseX = 0;
                this.lastMouseY = 0;

                this.planetStates = {};
                this.moonStates = {};
                this.labelsMap = {};

                this.setupUI();
                this.setupEvents();
                this.resizeCanvas();
                this.initHTMLLabels();
                this.animate();
            }

            resizeCanvas() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                this.renderer.resize(w, h);
            }

            setupEvents() {
                window.addEventListener("resize", () => this.resizeCanvas());

                this.canvas.addEventListener("mousedown", (e) => {
                    this.isMouseDown = true;
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;
                });

                window.addEventListener("mouseup", () => this.isMouseDown = false);

                window.addEventListener("mousemove", (e) => {
                    if(!this.isMouseDown) return;
                    let dx = e.clientX - this.lastMouseX;
                    let dy = e.clientY - this.lastMouseY;
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;

                    this.camYaw -= dx * 0.005;
                    this.camPitch += dy * 0.005;
                    this.camPitch = Math.max(-1.5, Math.min(1.5, this.camPitch));
                });

                this.canvas.addEventListener("wheel", (e) => {
                    this.camDistance *= (e.deltaY > 0 ? 1.1 : 0.9);
                    this.camDistance = Math.max(1.0, Math.min(2800.0, this.camDistance));
                    this.targetCamDistance = this.camDistance;
                });

                // Canvas Raycast Click to Focus Celestial Bodies
                this.canvas.addEventListener("click", (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const clickY = e.clientY - rect.top;

                    let closestKey = null;
                    let minDist = 35.0; // 30px 屏幕拾取阈值

                    // Check Planets & Sun & Halley
                    const allBodies = { sun: { posDisp: Vec3.create(0,0,0) }, ...this.planetStates, ...this.moonStates };

                    for(let key in allBodies) {
                        let st = allBodies[key];
                        if(!st || !st.posDisp) continue;

                        let screenPos = this.project3DToScreen(st.posDisp);
                        if(screenPos) {
                            let dist = Math.hypot(screenPos.x - clickX, screenPos.y - clickY);
                            if(dist < minDist) {
                                minDist = dist;
                                closestKey = key;
                            }
                        }
                    }

                    if(closestKey) {
                        this.setFocusTarget(closestKey);
                    }
                });

                window.addEventListener("keydown", (e) => {
                    if(e.code === "Space") {
                        this.togglePlay();
                    } else if(e.key === "h" || e.key === "H") {
                        document.getElementById("left-sidebar").classList.toggle("hidden");
                        document.getElementById("right-sidebar").classList.toggle("hidden");
                        document.getElementById("bottom-bar").classList.toggle("hidden");
                        document.getElementById("toggles-panel").classList.toggle("hidden");
                        this.labelsContainer.classList.toggle("hidden");
                    }
                });
            }

            initHTMLLabels() {
                this.labelsContainer.innerHTML = "";

                else if(absV < 3600) speedText = `${(this.speedFactor / 60).toFixed(1)} 分 / 秒`;
                else if(absV < 86400) speedText = `${(this.speedFactor / 3600).toFixed(1)} 小时 / 秒`;
                else if(absV < 31536000) speedText = `${(this.speedFactor / 86400).toFixed(1)} 天 / 秒`;
                else speedText = `${(this.speedFactor / 31536000).toFixed(1)} 年 / 秒`;

            julianToDateString(JD) {
                let z = Math.floor(JD + 0.5);
                let f = (JD + 0.5) - z;
                let a = z;
                if (z >= 2299161) {
                    let alpha = Math.floor((z - 1867216.25) / 36524.25);
                    a += 1 + alpha - Math.floor(alpha / 4);
                }
                let b = a + 1524;
                let c = Math.floor((b - 122.1) / 365.25);
                let d = Math.floor(365.25 * c);
                let e = Math.floor((b - d) / 30.6001);

                let day = Math.floor(b - d - Math.floor(30.6001 * e) + f);
                let month = (e < 14) ? e - 1 : e - 13;
                let year = (month > 2) ? c - 4716 : c - 4715;

                let dayFrac = (JD + 0.5) - Math.floor(JD + 0.5);
                let hours = Math.floor(dayFrac * 24);
                let mins = Math.floor((dayFrac * 24 - hours) * 60);
                let secs = Math.floor(((dayFrac * 24 - hours) * 60 - mins) * 60);

                let pad = (n) => n.toString().padStart(2, '0');
                return `${year}-${pad(month)}-${pad(day)} ${pad(hours)}:${pad(mins)}:${pad(secs)}`;
            }

            project3DToScreen(worldPos) {
                if(!this.lastViewProj) return null;
                const w = this.canvas.width;
                const h = this.canvas.height;

                let clipX = worldPos[0] * this.lastViewProj[0] + worldPos[1] * this.lastViewProj[4] + worldPos[2] * this.lastViewProj[8] + this.lastViewProj[12];
                let clipY = worldPos[0] * this.lastViewProj[1] + worldPos[1] * this.lastViewProj[5] + worldPos[2] * this.lastViewProj[9] + this.lastViewProj[13];
                let clipW = worldPos[0] * this.lastViewProj[3] + worldPos[1] * this.lastViewProj[7] + worldPos[2] * this.lastViewProj[11] + this.lastViewProj[15];

                if(clipW <= 0.0) return null;

                let ndcX = clipX / clipW;
                let ndcY = clipY / clipW;

                let sx = (ndcX * 0.5 + 0.5) * w;
                let sy = (1.0 - (ndcY * 0.5 + 0.5)) * h;

                return { x: sx, y: sy };
            }

            updateHTMLLabels() {
                const allBodies = { sun: { posDisp: Vec3.create(0,0,0) }, ...this.planetStates, ...this.moonStates };

                for(let key in this.labelsMap) {
                    const labelEl = this.labelsMap[key];
                    const st = allBodies[key];

                    if(!this.showNames || !st || !st.posDisp) {
                        labelEl.style.display = "none";
                        continue;
                    }

                    // Hide moons if showMoons is off
                    if(MOONS.some(m=>m.id === key) && !this.showMoons) {
                        labelEl.style.display = "none";
                        continue;
                    }

                    const screenPos = this.project3DToScreen(st.posDisp);
                    if(screenPos && screenPos.x >= 0 && screenPos.x <= this.canvas.width && screenPos.y >= 0 && screenPos.y <= this.canvas.height) {
                        labelEl.style.display = "flex";
                        labelEl.style.left = `${screenPos.x}px`;
                        labelEl.style.top = `${screenPos.y}px`;
                    } else {
                        labelEl.style.display = "none";
                    }
                }
            }

            animate() {
                const now = performance.now();
                const deltaSec = (now - this.lastTimestamp) / 1000.0;
                this.lastTimestamp = now;

                if(this.isPlaying) {
                    this.currentJD += (deltaSec * this.speedFactor) / 86400.0;
                }

                this.scaleCompress += (this.targetCompress - this.scaleCompress) * 0.1;

                let year = 2000 + (this.currentJD - 2451545.0) / 365.25;
                const banner = document.getElementById("banner-notice");
                if(year < 1800 || year > 2050) banner.style.display = "block";
                else banner.style.display = "none";

                document.getElementById("time-text").innerText = this.julianToDateString(this.currentJD);

                const T = (this.currentJD - 2451545.0) / 36525.0;
                const SCALE = 34.0;

                // 1. Calculate Planet Positions
                for(let k in PLANET_ORBITS) {
                    let st = calculatePlanetPosition(k, T);
                    st.rDisp = SCALE * Math.pow(st.rAU, this.scaleCompress);
                    st.posDisp = Vec3.scale(Vec3.create(), Vec3.normalize(Vec3.create(), st.pos), st.rDisp);
                    this.planetStates[k] = st;
                }

                // 2. Calculate Moon Positions (Section 3.7)
                for(let m of MOONS) {
                    let parentSt = this.planetStates[m.parent];
                    let parentData = PLANET_ORBITS[m.parent];
                    if(!parentSt || !parentData) continue;

                    let parentRDisp = 0.72 * Math.pow(parentData.radiusKm / 6371.0, 0.42);

                    // 基准距离公式
                    let ringOuter = (m.parent === "saturn") ? 2.34 : 1.0;
                    let base = Math.max(2.35, ringOuter + 0.35 + 0.55);
                    let a0 = (m.parent === "jupiter") ? 421700 : (m.parent === "saturn" ? 1221870 : m.aKm);

                    let dDisp = parentRDisp * base * Math.pow(m.aKm / a0, 0.55);
                    let theta = 2.0 * Math.PI * (this.currentJD - 2451545.0) / m.periodDays;

                    let localX = Math.cos(theta) * dDisp;
                    let localZ = Math.sin(theta) * dDisp;
                    let incRad = m.incDeg * DEG2RAD;

                    // 倾斜坐标
                    let localY = localZ * Math.sin(incRad);
                    localZ = localZ * Math.cos(incRad);

                    let moonWorldPos = Vec3.add(Vec3.create(), parentSt.posDisp, Vec3.create(localX, localY, localZ));
                    this.moonStates[m.id] = { posDisp: moonWorldPos, radiusKm: m.radiusKm, parentKey: m.parent, dDisp: dDisp };
                }

                // 3. Halley Comet
                let halleySt = calculateHalleyPosition(this.currentJD);
                halleySt.rDisp = SCALE * Math.pow(halleySt.rAU, this.scaleCompress);
                halleySt.posDisp = Vec3.scale(Vec3.create(), Vec3.normalize(Vec3.create(), halleySt.pos), halleySt.rDisp);
                this.planetStates["halley"] = halleySt;

                // 4. Camera Focus Interpolation
                const allTargetPositions = { sun: Vec3.create(0,0,0), ...this.planetStates, ...this.moonStates };
                let targetPos = Vec3.create(0,0,0);
                if(allTargetPositions[this.focusTarget] && allTargetPositions[this.focusTarget].posDisp) {
                    targetPos = allTargetPositions[this.focusTarget].posDisp;
                }

                // Smooth camera center lerp
                Vec3.add(this.currentCamCenter, this.currentCamCenter, Vec3.scale(Vec3.create(), Vec3.sub(Vec3.create(), targetPos, this.currentCamCenter), 0.08));

                // Smooth camera distance lerp
                this.camDistance += (this.targetCamDistance - this.camDistance) * 0.08;

                this.updateInfoCard();
                this.render();
                this.updateHTMLLabels();

                requestAnimationFrame(() => this.animate());
            }

            drawOrbitRibbons(viewProj) {
                const gl = this.renderer.gl;
                const SCALE = 34.0;
                gl.useProgram(this.renderer.orbitProg);
                gl.bindVertexArray(this.renderer.dynamicLine.vao);

                // 绘制 9 大行星轨道
                for(let k in PLANET_ORBITS) {
                    let st = this.planetStates[k];
                    if(!st) continue;

                    let orbitVerts = [];
                    const numSegs = 128;
                    for(let i=0; i<=numSegs; i++) {
                        let E = (i / numSegs) * 2.0 * Math.PI;
                        let xPrime = st.a * (Math.cos(E) - st.e);
                        let yPrime = st.a * Math.sqrt(1.0 - st.e * st.e) * Math.sin(E);

                        const cosW = Math.cos(st.w), sinW = Math.sin(st.w);
                        const cosO = Math.cos(st.Omega), sinO = Math.sin(st.Omega);
                        const I_rad = st.I * DEG2RAD;
                        const cosI = Math.cos(I_rad), sinI = Math.sin(I_rad);

                        const xEcl = (cosW * cosO - sinW * sinO * cosI) * xPrime + (-sinW * cosO - cosW * sinO * cosI) * yPrime;
                        const yEcl = (cosW * sinO + sinW * cosO * cosI) * xPrime + (-sinW * sinO + cosW * cosO * cosI) * yPrime;
                        const zEcl = (sinW * sinI) * xPrime + (cosW * sinI) * yPrime;

                        let rAU = Math.hypot(xEcl, yEcl, zEcl);
                        let rDisp = SCALE * Math.pow(rAU, this.scaleCompress);
                        let dir = Vec3.normalize(Vec3.create(), Vec3.create(xEcl, zEcl, -yEcl));
                        let p = Vec3.scale(Vec3.create(), dir, rDisp);

                        orbitVerts.push(p[0], p[1], p[2]);
                    }

                    gl.bindBuffer(gl.ARRAY_BUFFER, this.renderer.dynamicLine.buf);
                    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(orbitVerts), gl.DYNAMIC_DRAW);

                    gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.orbitProg, "uViewProj"), false, viewProj);
                    gl.uniform4f(gl.getUniformLocation(this.renderer.orbitProg, "uOrbitColor"), 0.0, 0.75, 1.0, 0.45);

                    gl.drawArrays(gl.LINE_STRIP, 0, (numSegs + 1));
                }

                // 绘制哈雷彗星轨道
                if(this.showComet) {
                    let hVerts = [];
                    const h = HALLEY_COMET;
                    for(let i=0; i<=128; i++) {
                        let E = (i / 128.0) * 2.0 * Math.PI;
                        let xP = h.a * (Math.cos(E) - h.e);
                        let yP = h.a * Math.sqrt(1.0 - h.e * h.e) * Math.sin(E);

                        const cosW = Math.cos(h.w * DEG2RAD), sinW = Math.sin(h.w * DEG2RAD);
                        const cosO = Math.cos(h.Omega * DEG2RAD), sinO = Math.sin(h.Omega * DEG2RAD);
                        const cosI = Math.cos(h.I * DEG2RAD), sinI = Math.sin(h.I * DEG2RAD);

                        const xEcl = (cosW * cosO - sinW * sinO * cosI) * xP + (-sinW * cosO - cosW * sinO * cosI) * yP;
                        const yEcl = (cosW * sinO + sinW * cosO * cosI) * xP + (-sinW * sinO + cosW * cosO * cosI) * yP;
                        const zEcl = (sinW * sinI) * xP + (cosW * sinI) * yP;

                        let rAU = Math.hypot(xEcl, yEcl, zEcl);
                        let rDisp = SCALE * Math.pow(rAU, this.scaleCompress);
                        let dir = Vec3.normalize(Vec3.create(), Vec3.create(xEcl, zEcl, -yEcl));
                        let p = Vec3.scale(Vec3.create(), dir, rDisp);

                        hVerts.push(p[0], p[1], p[2]);
                    }

                    gl.bindBuffer(gl.ARRAY_BUFFER, this.renderer.dynamicLine.buf);
                    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(hVerts), gl.DYNAMIC_DRAW);
                    gl.uniform4f(gl.getUniformLocation(this.renderer.orbitProg, "uOrbitColor"), 1.0, 0.4, 0.2, 0.6);
                    gl.drawArrays(gl.LINE_STRIP, 0, 129);
                }

                // 绘制卫星轨道
                if(this.showMoons) {
                    for(let m of MOONS) {
                        let mst = this.moonStates[m.id];
                        let parentSt = this.planetStates[m.parent];
                        if(!mst || !parentSt) continue;

                        let mVerts = [];
                        let incRad = m.incDeg * DEG2RAD;
                        for(let i=0; i<=48; i++) {
                            let theta = (i / 48.0) * 2.0 * Math.PI;
                            let lx = Math.cos(theta) * mst.dDisp;
                            let lz = Math.sin(theta) * mst.dDisp;
                            let ly = lz * Math.sin(incRad);
                            lz = lz * Math.cos(incRad);

                            let wp = Vec3.add(Vec3.create(), parentSt.posDisp, Vec3.create(lx, ly, lz));
                            mVerts.push(wp[0], wp[1], wp[2]);
                        }

                        gl.bindBuffer(gl.ARRAY_BUFFER, this.renderer.dynamicLine.buf);
                        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(mVerts), gl.DYNAMIC_DRAW);
                        gl.uniform4f(gl.getUniformLocation(this.renderer.orbitProg, "uOrbitColor"), 0.8, 0.8, 0.8, 0.25);
                        gl.drawArrays(gl.LINE_STRIP, 0, 49);
                    }
                }

                gl.bindVertexArray(null);
            }

            render() {
                const gl = this.renderer.gl;
                const w = this.canvas.width;
                const h = this.canvas.height;

                gl.depthMask(true);
                gl.bindFramebuffer(gl.FRAMEBUFFER, this.renderer.hdrFBO);
                gl.viewport(0, 0, w, h);
                gl.clearColor(0.002, 0.002, 0.003, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                let cx = this.currentCamCenter[0] + this.camDistance * Math.cos(this.camPitch) * Math.sin(this.camYaw);
                let cy = this.currentCamCenter[1] + this.camDistance * Math.sin(this.camPitch);
                let cz = this.currentCamCenter[2] + this.camDistance * Math.cos(this.camPitch) * Math.cos(this.camYaw);
                let eye = Vec3.create(cx, cy, cz);

                let viewMat = Mat4.lookAt(Mat4.create(), eye, this.currentCamCenter, Vec3.create(0, 1, 0));

                let distToTarget = Vec3.length(Vec3.sub(Vec3.create(), eye, this.currentCamCenter));
                let near = Math.max(0.012, distToTarget * 0.0035);
                let far = Math.max(distToTarget * 14.0, 4200.0);
                let projMat = Mat4.perspective(Mat4.create(), 45.0 * DEG2RAD, w / h, near, far);
                let viewProj = Mat4.multiply(Mat4.create(), projMat, viewMat);
                this.lastViewProj = viewProj;

                gl.enable(gl.DEPTH_TEST);
                gl.enable(gl.CULL_FACE);

                // 1. 绘制轨道 Satin Lines
                if(this.showOrbits) {
                    gl.enable(gl.BLEND);
                    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
                    this.drawOrbitRibbons(viewProj);
                    gl.disable(gl.BLEND);
                }

                // 2. 绘制太阳
                const sunR = 4.6;
                let sunModel = Mat4.create();
                sunModel[0] = sunR; sunModel[5] = sunR; sunModel[10] = sunR;
                sunModel[12] = 0; sunModel[13] = 0; sunModel[14] = 0;

                gl.useProgram(this.renderer.planetProg);
                gl.bindVertexArray(this.renderer.sphere.vao);
                gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.planetProg, "uModel"), false, sunModel);
                gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.planetProg, "uViewProj"), false, viewProj);
                gl.uniformMatrix3fv(gl.getUniformLocation(this.renderer.planetProg, "uNormalMatrix"), false, new Float32Array([1,0,0, 0,1,0, 0,0,1]));
                gl.uniform1i(gl.getUniformLocation(this.renderer.planetProg, "uBodyType"), 0);
                gl.uniform3fv(gl.getUniformLocation(this.renderer.planetProg, "uCameraPos"), eye);
                gl.uniform1f(gl.getUniformLocation(this.renderer.planetProg, "uTime"), performance.now() * 0.001);

                gl.drawElements(gl.TRIANGLES, this.renderer.sphere.count, gl.UNSIGNED_SHORT, 0);

                // 3. 绘制行星
                for(let k in PLANET_ORBITS) {
                    let st = this.planetStates[k];
                    let data = PLANET_ORBITS[k];

                    let pRadiusDisp = 0.72 * Math.pow(data.radiusKm / 6371.0, 0.42);

                    let pModel = Mat4.create();
                    pModel[0] = pRadiusDisp; pModel[5] = pRadiusDisp; pModel[10] = pRadiusDisp;
                    pModel[12] = st.posDisp[0]; pModel[13] = st.posDisp[1]; pModel[14] = st.posDisp[2];

                    let normMat = new Float32Array([1,0,0, 0,1,0, 0,0,1]);

                    gl.useProgram(this.renderer.planetProg);
                    gl.bindVertexArray(this.renderer.sphere.vao);

                    gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.planetProg, "uModel"), false, pModel);
                    gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.planetProg, "uViewProj"), false, viewProj);
                    gl.uniformMatrix3fv(gl.getUniformLocation(this.renderer.planetProg, "uNormalMatrix"), false, normMat);
                    gl.uniform3fv(gl.getUniformLocation(this.renderer.planetProg, "uSunPos"), Vec3.create(0,0,0));
                    gl.uniform3fv(gl.getUniformLocation(this.renderer.planetProg, "uCameraPos"), eye);

                    let bType = 1;
                    if(k === "earth") bType = 2;
                    else if(k === "venus") bType = 3;
                    else if(k === "mars") bType = 4;
                    else if(k === "jupiter" || k === "saturn") bType = 5;
                    else if(k === "uranus" || k === "neptune") bType = 6;

                    gl.uniform1i(gl.getUniformLocation(this.renderer.planetProg, "uBodyType"), bType);
                    gl.uniform4f(gl.getUniformLocation(this.renderer.planetProg, "uCustomParams"),
                        k==="saturn"?1.0:0.0, k==="jupiter"?1.0:0.0, k==="neptune"?1.0:0.0, 0.0);

                    let col = Vec3.create(0.7, 0.7, 0.7);
                    if(k === "jupiter") col = Vec3.create(0.82, 0.68, 0.52);
                    else if(k === "saturn") col = Vec3.create(0.9, 0.82, 0.6);
                    else if(k === "uranus") col = Vec3.create(0.4, 0.8, 0.85);
                    else if(k === "neptune") col = Vec3.create(0.2, 0.4, 0.9);
                    gl.uniform3fv(gl.getUniformLocation(this.renderer.planetProg, "uBaseColor"), col);

                    gl.drawElements(gl.TRIANGLES, this.renderer.sphere.count, gl.UNSIGNED_SHORT, 0);

                    // 大气壳层
                    if(k === "earth" || k === "venus") {
                        gl.enable(gl.BLEND);
                        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
                        gl.useProgram(this.renderer.atmoProg);
                        gl.bindVertexArray(this.renderer.sphere.vao);

                        let atmoR = pRadiusDisp * 1.08;
                        let atmoModel = Mat4.create();
                        atmoModel[0] = atmoR; atmoModel[5] = atmoR; atmoModel[10] = atmoR;
                        atmoModel[12] = st.posDisp[0]; atmoModel[13] = st.posDisp[1]; atmoModel[14] = st.posDisp[2];

                        gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.atmoProg, "uModel"), false, atmoModel);
                        gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.atmoProg, "uViewProj"), false, viewProj);
                        gl.uniform3fv(gl.getUniformLocation(this.renderer.atmoProg, "uCameraPos"), eye);
                        gl.uniform3fv(gl.getUniformLocation(this.renderer.atmoProg, "uSunPos"), Vec3.create(0,0,0));
                        gl.uniform3fv(gl.getUniformLocation(this.renderer.atmoProg, "uPlanetCenter"), st.posDisp);
                        gl.uniform1f(gl.getUniformLocation(this.renderer.atmoProg, "uPlanetRadius"), pRadiusDisp);
                        gl.uniform3fv(gl.getUniformLocation(this.renderer.atmoProg, "uAtmoColor"), k==="earth"?Vec3.create(0.3, 0.6, 1.0):Vec3.create(0.9, 0.7, 0.4));

                        gl.drawElements(gl.TRIANGLES, this.renderer.sphere.count, gl.UNSIGNED_SHORT, 0);
                        gl.disable(gl.BLEND);
                    }

                    // 土星环
                    if(k === "saturn") {
                        gl.disable(gl.CULL_FACE);
                        gl.enable(gl.BLEND);
                        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
                        gl.useProgram(this.renderer.ringProg);

                        let rScale = pRadiusDisp;
                        let rModel = Mat4.create();
                        rModel[0] = rScale; rModel[5] = rScale; rModel[10] = rScale;
                        rModel[12] = st.posDisp[0]; rModel[13] = st.posDisp[1]; rModel[14] = st.posDisp[2];

                        gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.ringProg, "uModel"), false, rModel);
                        gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.ringProg, "uViewProj"), false, viewProj);
                        gl.uniform3fv(gl.getUniformLocation(this.renderer.ringProg, "uCameraPos"), eye);
                        gl.uniform3fv(gl.getUniformLocation(this.renderer.ringProg, "uSunPos"), Vec3.create(0,0,0));
                        gl.uniform3fv(gl.getUniformLocation(this.renderer.ringProg, "uPlanetCenter"), st.posDisp);
                        gl.uniform1f(gl.getUniformLocation(this.renderer.ringProg, "uPlanetRadius"), pRadiusDisp);
                        gl.uniform1i(gl.getUniformLocation(this.renderer.ringProg, "uRingType"), 0);

                        gl.bindVertexArray(this.renderer.saturnRingMesh.vao);
                        gl.drawElements(gl.TRIANGLES, this.renderer.saturnRingMesh.count, gl.UNSIGNED_SHORT, 0);

                        gl.disable(gl.BLEND);
                        gl.enable(gl.CULL_FACE);
                    }
                }

                // 4. 绘制卫星
                if(this.showMoons) {
                    gl.useProgram(this.renderer.planetProg);
                    gl.bindVertexArray(this.renderer.sphere.vao);

                    for(let m of MOONS) {
                        let mst = this.moonStates[m.id];
                        if(!mst) continue;

                        let mRadiusDisp = Math.max(0.08, 0.72 * Math.pow(m.radiusKm / 6371.0, 0.42));
                        let mModel = Mat4.create();
                        mModel[0] = mRadiusDisp; mModel[5] = mRadiusDisp; mModel[10] = mRadiusDisp;
                        mModel[12] = mst.posDisp[0]; mModel[13] = mst.posDisp[1]; mModel[14] = mst.posDisp[2];

                        gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.planetProg, "uModel"), false, mModel);
                        gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.planetProg, "uViewProj"), false, viewProj);
                        gl.uniformMatrix3fv(gl.getUniformLocation(this.renderer.planetProg, "uNormalMatrix"), false, new Float32Array([1,0,0, 0,1,0, 0,0,1]));
                        gl.uniform3fv(gl.getUniformLocation(this.renderer.planetProg, "uSunPos"), Vec3.create(0,0,0));
                        gl.uniform3fv(gl.getUniformLocation(this.renderer.planetProg, "uCameraPos"), eye);

                        let specVal = 0.0;
                        if(m.id === "europa") specVal = 1.0;
                        else if(m.id === "io") specVal = 2.0;

                        gl.uniform1i(gl.getUniformLocation(this.renderer.planetProg, "uBodyType"), 7);
                        gl.uniform4f(gl.getUniformLocation(this.renderer.planetProg, "uCustomParams"), 0.0, 0.0, 0.0, specVal);
                        gl.uniform3fv(gl.getUniformLocation(this.renderer.planetProg, "uBaseColor"), Vec3.create(0.75, 0.75, 0.75));

                        gl.drawElements(gl.TRIANGLES, this.renderer.sphere.count, gl.UNSIGNED_SHORT, 0);
                    }
                }

                // 5. 绘制哈雷彗星
                if(this.showComet && this.planetStates["halley"]) {
                    let hSt = this.planetStates["halley"];
                    let hModel = Mat4.create();
                    let hRad = 0.25;
                    hModel[0] = hRad; hModel[5] = hRad; hModel[10] = hRad;
                    hModel[12] = hSt.posDisp[0]; hModel[13] = hSt.posDisp[1]; hModel[14] = hSt.posDisp[2];

                    gl.useProgram(this.renderer.planetProg);
                    gl.bindVertexArray(this.renderer.sphere.vao);
                    gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.planetProg, "uModel"), false, hModel);
                    gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.planetProg, "uViewProj"), false, viewProj);
                    gl.uniformMatrix3fv(gl.getUniformLocation(this.renderer.planetProg, "uNormalMatrix"), false, new Float32Array([1,0,0, 0,1,0, 0,0,1]));
                    gl.uniform1i(gl.getUniformLocation(this.renderer.planetProg, "uBodyType"), 1);
                    gl.uniform4f(gl.getUniformLocation(this.renderer.planetProg, "uCustomParams"), 0,0,0,0);
                    gl.uniform3fv(gl.getUniformLocation(this.renderer.planetProg, "uBaseColor"), Vec3.create(0.9, 0.95, 1.0));

                    gl.drawElements(gl.TRIANGLES, this.renderer.sphere.count, gl.UNSIGNED_SHORT, 0);
                }

                // 6. 绘制小行星带与柯伊伯带
                if(this.showAsteroids) {
                    gl.useProgram(this.renderer.asteroidProg);
                    gl.uniformMatrix4fv(gl.getUniformLocation(this.renderer.asteroidProg, "uViewProj"), false, viewProj);
                    gl.uniform1f(gl.getUniformLocation(this.renderer.asteroidProg, "uTimeDays"), (this.currentJD - 2451545.0));
                    gl.uniform1f(gl.getUniformLocation(this.renderer.asteroidProg, "uScaleFactor"), 34.0);
                    gl.uniform1f(gl.getUniformLocation(this.renderer.asteroidProg, "uCompressPow"), this.scaleCompress);

                    gl.bindVertexArray(this.renderer.asteroidVAO);
                    gl.drawArrays(gl.POINTS, 0, this.renderer.asteroidCount);
                }

                // 7. 后期合成
                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                gl.viewport(0, 0, w, h);
                gl.disable(gl.DEPTH_TEST);

                gl.useProgram(this.renderer.postProg);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, this.renderer.sceneTex);
                gl.uniform1i(gl.getUniformLocation(this.renderer.postProg, "uSceneTex"), 0);
                gl.uniform1i(gl.getUniformLocation(this.renderer.postProg, "uBloomEnabled"), this.bloomEnabled ? 1 : 0);

                gl.bindVertexArray(this.renderer.quad.vao);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            window.app = new SolarSystemApp();
        });
    </script>
</body>
