<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太阳系运动模型 · Solar System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* 加载层 */
  #loader {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, #0a0a1a, #000);
    color: #cfe3ff; transition: opacity .8s ease;
  }
  #loader h1 { font-size: 22px; font-weight: 600; letter-spacing: 2px; margin-bottom: 18px;
    background: linear-gradient(90deg,#7ec8ff,#fff,#ffd27e); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .bar { width: 220px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#5aa9ff,#ffcf6b); transition: width .2s; }
  #loader p { margin-top: 12px; font-size: 12px; color: #6f86b0; }

  /* 控制面板 */
  #ui {
    position: fixed; top: 16px; left: 16px; z-index: 20; width: 250px;
    padding: 16px 16px 14px; border-radius: 16px;
    background: rgba(14,18,32,.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.10); color: #dce6f5; box-shadow: 0 10px 40px rgba(0,0,0,.5);
    user-select: none;
  }
  #ui h2 { font-size: 13px; font-weight: 600; letter-spacing: 1px; color: #9fb6dd; margin-bottom: 12px; display:flex; align-items:center; gap:8px;}
  #ui h2 .dot { width:8px; height:8px; border-radius:50%; background:#ffcf6b; box-shadow:0 0 10px #ffcf6b;}
  .row { display: flex; align-items: center; justify-content: space-between; margin: 11px 0; font-size: 12px; color:#b9c8e2;}
  .row label { flex: 0 0 auto; }
  input[type=range] { -webkit-appearance: none; width: 120px; height: 4px; border-radius: 4px;
    background: rgba(255,255,255,.18); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: #7ec8ff; cursor: pointer; box-shadow: 0 0 8px rgba(126,200,255,.8); }
  select { background: rgba(255,255,255,.08); color: #dce6f5; border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; padding: 4px 8px; font-size: 12px; outline: none; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btns button { flex: 1; cursor: pointer; font-size: 12px; padding: 7px 0; border-radius: 9px;
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: #dce6f5; transition: .2s; }
  .btns button:hover { background: rgba(126,200,255,.22); border-color: rgba(126,200,255,.5); }
  .btns button.active { background: rgba(126,200,255,.30); border-color: #7ec8ff; color:#fff;}
  .hint { margin-top: 12px; font-size: 10.5px; line-height: 1.6; color: #6f86b0; }

  /* 标签 */
  .label { color: #cfe3ff; font-size: 11px; letter-spacing: .5px; padding: 2px 7px; border-radius: 20px;
    background: rgba(10,14,26,.55); border: 1px solid rgba(255,255,255,.14); white-space: nowrap;
    text-shadow: 0 0 6px rgba(0,0,0,.8); pointer-events: none; transform: translateY(-4px); }
  .label.sun { color: #ffe6a8; border-color: rgba(255,207,107,.5); }

  #title { position: fixed; bottom: 14px; right: 18px; z-index: 20; text-align: right; }
  #title .t { font-size: 13px; color: #8aa0c8; letter-spacing: 2px; }
  #title .s { font-size: 10px; color: #4a5b80; margin-top: 3px; }
</style>
</head>
<body>
<div id="app"></div>

<div id="loader">
  <h1>太阳系运动模型</h1>
  <div class="bar"><i id="barFill"></i></div>
  <p id="loadTip">正在生成行星纹理…</p>
</div>

<div id="ui">
  <h2><span class="dot"></span>控制台 CONTROLS</h2>
  <div class="row"><label>时间速度</label><input id="speed" type="range" min="0" max="10" step="0.1" value="1"></div>
  <div class="row"><label>聚焦天体</label>
    <select id="focus">
      <option value="free">自由视角</option>
      <option value="Sun">太阳</option>
      <option value="水星">水星</option>
      <option value="金星">金星</option>
      <option value="地球">地球</option>
      <option value="火星">火星</option>
      <option value="木星">木星</option>
      <option value="土星">土星</option>
      <option value="天王星">天王星</option>
      <option value="海王星">海王星</option>
    </select>
  </div>
  <div class="btns">
    <button id="btnPause">暂停</button>
    <button id="btnOrbit" class="active">轨道</button>
    <button id="btnLabel" class="active">标签</button>
  </div>
  <div class="btns">
    <button id="btnReset">重置视角</button>
  </div>
  <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移<br>相对轨道周期与现实一致（地球=1年）</div>
</div>

<div id="title">
  <div class="t">SOLAR SYSTEM</div>
  <div class="s">程序化渲染 · Three.js</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 基础场景 ============ */
const app = document.getElementById('app');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 5000);
camera.position.set(0, 70, 185);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
app.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 12;
controls.maxDistance = 900;

/* 光照：太阳点光源 + 微弱环境光 */
scene.add(new THREE.AmbientLight(0x223344, 0.35));
const sunLight = new THREE.PointLight(0xfff2dd, 4.0, 0, 0.0);
scene.add(sunLight);

/* ============ 程序化噪声 ============ */
function hash2(x, y, s){ let n = x*374761393 + y*668265263 + s*982451653; n = (n ^ (n>>13)) * 1274126177; return ((n ^ (n>>16)) >>> 0) / 4294967295; }
function vnoise(x, y, s){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x-xi, yf = y-yi;
  const tl = hash2(xi,yi,s), tr = hash2(xi+1,yi,s), bl = hash2(xi,yi+1,s), br = hash2(xi+1,yi+1,s);
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  return (tl+(tr-tl)*u) + ((bl+(br-bl)*u)-(tl+(tr-tl)*u))*v;
}
function fbm(x, y, s, oct=4){
  let a=0, amp=0.5, f=1;
  for(let i=0;i<oct;i++){ a += amp*vnoise(x*f, y*f, s + i*31); f*=2; amp*=0.5; }
  return a;
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function lerp(a,b,t){ return a+(b-a)*t; }

/* ============ 行星纹理生成 ============ */
function makeTexture(type, conf, seed){
  const w = 1024, h = 512;
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w,h);
  const d = img.data;
  const band = conf.bands;
  function palette(t){ // t in [0,1] -> color across band array
    t = clamp(t,0,1);
    const n = band.length-1; const f = t*n; const i = Math.floor(f); const fr = f-i;
    const c0 = band[i], c1 = band[Math.min(i+1,n)];
    return [lerp(c0[0],c1[0],fr), lerp(c0[1],c1[1],fr), lerp(c0[2],c1[2],fr)];
  }
  for(let y=0;y<h;y++){
    const v = y/h;
    for(let x=0;x<w;x++){
      const u = x/w;
      let r,g,b;
      if(type==='earth'){
        const n = fbm(u*5, v*3, seed, 5);
        const land = n > 0.52;
        if(land){ const t=fbm(u*9+5,v*9,seed+3,4); r=55+t*70; g=95+t*80; b=45+t*35; }
        else { const t=n; r=18+t*28; g=46+t*60; b=105+t*95; }
        const lat = Math.abs(v-0.5)*2;
        if(lat>0.80){ const ice=clamp((lat-0.80)/0.20,0,1); const m=clamp(ice+0.25*fbm(u*8,v*8,seed,2),0,1);
          r=lerp(r,255,m); g=lerp(g,255,m); b=lerp(b,255,m); }
      }
      else if(type==='gas'){
        const turb = fbm(u*4, v*2, seed, 4);
        const vv = v + (turb-0.5)*0.10;
        const bands = Math.sin(vv*Math.PI*(conf.bandCount||12));
        const t = bands*0.5+0.5;
        const c = palette(t);
        const sh = fbm(u*9, v*4, seed+9, 4);
        r = c[0]*(0.82+sh*0.32); g = c[1]*(0.82+sh*0.32); b = c[2]*(0.82+sh*0.32);
        if(conf.spot){ // 大红斑 / 大暗斑
          const cx=0.72, cy=0.62, dx=(u-cx), dy=(v-cy)*1.7;
          const dd = dx*dx+dy*dy;
          if(dd < 0.0016){ const m=clamp(1-dd/0.0016,0,1);
            r=lerp(r,conf.spotColor[0],m); g=lerp(g,conf.spotColor[1],m); b=lerp(b,conf.spotColor[2],m);
            // 上面用 lerp 修正
          }
        }
      }
      else if(type==='ice'){
        const base = conf.base;
        const f = fbm(u*4, v*2, seed, 4);
        const bands = Math.sin((v + (f-0.5)*0.05)*Math.PI*6)*0.5+0.5;
        const t = 0.7 + bands*0.3*0.5 + (f-0.5)*0.15;
        r = base[0]*t; g = base[1]*t; b = base[2]*t;
        if(conf.spot){ const cx=0.4, cy=0.55, dx=(u-cx), dy=(v-cy)*1.5;
          const dd=dx*dx+dy*dy; if(dd<0.0012){ const m=clamp(1-dd/0.0012,0,1);
            r=lerp(r,conf.spotColor[0],m); g=lerp(g,conf.spotColor[1],m); b=lerp(b,conf.spotColor[2],m);} }
      }
      else if(type==='venus'){
        const base = conf.base;
        const f = fbm(u*3, v*1.6, seed, 5);
        const sw = fbm(u*7+3, v*4, seed+5, 4);
        const t = 0.8 + (f-0.5)*0.35 + (sw-0.5)*0.12;
        r = base[0]*t; g = base[1]*t; b = base[2]*t;
      }
      else { // rocky (水星/火星)
        const base = conf.base;
        const n = fbm(u*6, v*3, seed, 5);
        const m = fbm(u*2.5, v*1.5, seed+7, 3);
        let b2 = 0.55 + n*0.7;
        if(m > 0.62){ b2 *= 0.7; } // 暗斑/平原
        r = base[0]*b2; g = base[1]*b2; b = base[2]*b2;
        const lat = Math.abs(v-0.5)*2;
        if(lat>0.90){ const ice=clamp((lat-0.90)/0.10,0,1); r=lerp(r,235,ice*0.5); g=lerp(g,235,ice*0.5); b=lerp(b,235,ice*0.5);}
      }
      const idx = (y*w+x)*4;
      d[idx]=clamp(r,0,255); d[idx+1]=clamp(g,0,255); d[idx+2]=clamp(b,0,255); d[idx+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function makeCloudTexture(seed){
  const w=1024,h=512; const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d'); const img=ctx.createImageData(w,h); const d=img.data;
  for(let y=0;y<h;y++){ const v=y/h;
    for(let x=0;x<w;x++){ const u=x/w;
      const n=fbm(u*5, v*3, seed, 5);
      const a=clamp((n-0.52)/0.3,0,1);
      const idx=(y*w+x)*4; d[idx]=255; d[idx+1]=255; d[idx+2]=255; d[idx+3]=a*235;
    }
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace; return tex;
}

/* ============ 星空 ============ */
function makeStarTexture(){
  const s=64; const cv=document.createElement('canvas'); cv.width=cv.height=s;
  const ctx=cv.getContext('2d'); const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.3,'rgba(255,255,255,0.8)');
  g.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(cv);
}
function addStars(){
  const N=14000; const pos=new Float32Array(N*3); const col=new Float32Array(N*3); const siz=new Float32Array(N);
  const c=new THREE.Color();
  for(let i=0;i<N;i++){
    const r=900+Math.random()*1600;
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph); pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    const t=Math.random(); c.setHSL(0.55+Math.random()*0.12, 0.5, 0.7+Math.random()*0.3);
    if(t>0.92){ c.setRGB(1,0.85,0.6); } else if(t<0.08){ c.setRGB(0.7,0.8,1); }
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; siz[i]=Math.random()*2.2+0.4;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.setAttribute('size', new THREE.BufferAttribute(siz,1));
  const m=new THREE.PointsMaterial({ size:2.2, map:makeStarTexture(), vertexColors:true, transparent:true,
    depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true });
  scene.add(new THREE.Points(g,m));
}
addStars();

/* ============ 太阳 ============ */
const SUN_R = 8;
const sunGroup = new THREE.Group(); scene.add(sunGroup);
const sunMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.0, 0.78, 0.38) });
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 64, 64), sunMat);
sunGroup.add(sunMesh);
// 太阳表面动态着色（使用纹理扰动）
(function(){
  const w=512,h=256; const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d'); const img=ctx.createImageData(w,h); const d=img.data;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const u=x/w,v=y/h; const n=fbm(u*8,v*4,11,5); const n2=fbm(u*20,v*10,33,4);
    const t=clamp(0.6+n*0.5,0,1); const idx=(y*w+x)*4;
    d[idx]=255*t+20*n2; d[idx+1]=180*t+10; d[idx+2]=70*t; d[idx+3]=255;
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
  sunMat.map=tex; sunMat.needsUpdate=true;
})();
// 辉光 sprite
function glowSprite(size, color, opacity){
  const cv=document.createElement('canvas'); cv.width=cv.height=256; const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,color); g.addColorStop(0.2,color); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,256,256);
  const tex=new THREE.CanvasTexture(cv);
  const mat=new THREE.SpriteMaterial({ map:tex, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false });
  const sp=new THREE.Sprite(mat); sp.scale.set(size,size,1); return sp;
}
const corona = glowSprite(SUN_R*7, 'rgba(255,180,80,0.9)', 0.9); sunGroup.add(corona);
const corona2 = glowSprite(SUN_R*12, 'rgba(255,120,40,0.5)', 0.5); sunGroup.add(corona2);

// 太阳标签
const sunLabel = document.createElement('div'); sunLabel.className='label sun'; sunLabel.textContent='太阳 Sun';
const sunLabelObj = new CSS2DObject(sunLabel); sunLabelObj.position.set(0, SUN_R+2, 0); sunGroup.add(sunLabelObj);

/* ============ 行星数据 ============ */
const PLANETS = [
  { name:'水星', size:1.0, dist:16,  period:0.241,  rot:58.6,  tilt:0.03,  type:'rocky', base:[150,142,132], seed:1 },
  { name:'金星', size:1.6, dist:23,  period:0.615,  rot:-243,  tilt:177.4, type:'venus', base:[226,196,128], seed:2 },
  { name:'地球', size:1.7, dist:31,  period:1.0,    rot:1.0,   tilt:23.4,  type:'earth', base:[40,90,160], seed:3, moon:true, atmo:true },
  { name:'火星', size:1.3, dist:39,  period:1.881,  rot:1.03,  tilt:25.2,  type:'rocky', base:[184,86,52], seed:4 },
  { name:'木星', size:5.0, dist:62,  period:11.86,  rot:0.41,  tilt:3.1,   type:'gas', bands:[[205,165,125],[232,208,172],[168,118,82],[214,184,152]], bandCount:15, spot:true, spotColor:[196,72,46], seed:5 },
  { name:'土星', size:4.3, dist:84,  period:29.46,  rot:0.45,  tilt:26.7,  type:'gas', bands:[[226,206,150],[240,226,182],[202,182,132],[222,202,160]], bandCount:13, ring:true, seed:6 },
  { name:'天王星', size:2.8, dist:104, period:84.0,  rot:-0.72, tilt:97.8,  type:'ice', base:[158,224,228], seed:7 },
  { name:'海王星', size:2.7, dist:124, period:164.8, rot:0.67,  tilt:28.3,  type:'ice', base:[62,92,214], spot:true, spotColor:[38,58,150], seed:8 },
];

const planetObjs = []; // {conf, pivot, group, mesh, angle, spin, label}
const orbitLines = [];

function makeOrbit(radius){
  const seg=256; const pts=[];
  for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*radius,0,Math.sin(a)*radius)); }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  const m=new THREE.LineBasicMaterial({ color:0x4a6da0, transparent:true, opacity:0.32 });
  const line=new THREE.LineLoop(g,m); return line;
}

PLANETS.forEach((p, idx)=>{
  // 公转枢轴
  const pivot = new THREE.Group(); scene.add(pivot);
  // 行星组（含轴倾角）
  const group = new THREE.Group();
  group.position.set(p.dist, 0, 0);
  group.rotation.z = THREE.MathUtils.degToRad(p.tilt);
  pivot.add(group);

  // 纹理
  const tex = makeTexture(p.type, p, p.seed);
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 1.0, metalness: 0.0 });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.size, 48, 48), mat);
  group.add(mesh);

  // 地球云层
  if(p.type==='earth'){
    const cloud = new THREE.Mesh(new THREE.SphereGeometry(p.size*1.02, 48, 48),
      new THREE.MeshStandardMaterial({ map: makeCloudTexture(p.seed+50), transparent:true, opacity:0.55, depthWrite:false }));
    group.add(cloud); p._cloud = cloud;
  }
  // 大气辉光
  if(p.atmo){
    const atm = new THREE.Mesh(new THREE.SphereGeometry(p.size*1.13, 48, 48),
      new THREE.ShaderMaterial({
        vertexShader:`varying vec3 vN; varying vec3 vP; void main(){ vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.0); vP=mv.xyz; gl_Position=projectionMatrix*mv; }`,
        fragmentShader:`varying vec3 vN; varying vec3 vP; void main(){ vec3 vd=normalize(-vP); float f=pow(1.0-max(dot(vN,vd),0.0),3.0); gl_FragColor=vec4(0.35,0.6,1.0,1.0)*f; }`,
        transparent:true, blending:THREE.AdditiveBlending, side:THREE.BackSide, depthWrite:false
      }));
    group.add(atm);
  }
  // 土星环
  if(p.ring){
    const inner=p.size*1.35, outer=p.size*2.4;
    const ring = new THREE.Mesh(new THREE.RingGeometry(inner, outer, 160),
      new THREE.ShaderMaterial({
        uniforms:{ innerR:{value:inner}, outerR:{value:outer} },
        vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader:`varying vec3 vP; uniform float innerR; uniform float outerR;
          void main(){ float r=length(vP.xy); float t=(r-innerR)/(outerR-innerR);
            float bands=0.5+0.5*sin(t*46.0); float a=0.55*bands+0.22;
            a*= smoothstep(0.0,0.04,t)*smoothstep(1.0,0.96,t);
            a*= 0.3+0.7*step(0.04,abs(t-0.52)); // 卡西尼缝
            vec3 col=mix(vec3(0.78,0.72,0.58),vec3(0.95,0.90,0.76),bands);
            gl_FragColor=vec4(col, a); }`,
        transparent:true, side:THREE.DoubleSide, depthWrite:false
      }));
    ring.rotation.x = -Math.PI/2;
    group.add(ring);
  }
  // 月球
  if(p.moon){
    const moonPivot = new THREE.Group(); group.add(moonPivot);
    const moon = new THREE.Mesh(new THREE.SphereGeometry(0.45, 24, 24),
      new THREE.MeshStandardMaterial({ map: makeTexture('rocky',{base:[150,150,150],seed:99}, 99), roughness:1 }));
    moon.position.set(3.0, 0, 0);
    moonPivot.add(moon); p._moonPivot = moonPivot;
  }

  // 轨道线
  const orbit = makeOrbit(p.dist); scene.add(orbit); orbitLines.push(orbit);

  // 标签
  const div = document.createElement('div'); div.className='label'; div.textContent=p.name;
  const label = new CSS2DObject(div); label.position.set(0, p.size+1.2, 0); group.add(label);

  planetObjs.push({
    conf:p, pivot, group, mesh,
    angle: Math.random()*Math.PI*2,
    spin: 0.5 * (1/Math.abs(p.rot)) * (p.rot<0?-1:1),
    labelDiv: div
  });
});

/* ============ 后期：辉光 ============ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.95, 0.5, 0.55);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============ 交互 ============ */
let speed = 1, paused = false;
const speedEl = document.getElementById('speed');
speedEl.addEventListener('input', ()=> speed = parseFloat(speedEl.value));

const btnPause = document.getElementById('btnPause');
btnPause.addEventListener('click', ()=>{ paused=!paused; btnPause.textContent = paused?'继续':'暂停'; btnPause.classList.toggle('active', paused); });

const btnOrbit = document.getElementById('btnOrbit');
btnOrbit.addEventListener('click', ()=>{ const v=!btnOrbit.classList.contains('active'); btnOrbit.classList.toggle('active',v);
  orbitLines.forEach(o=> o.visible=v); });

const btnLabel = document.getElementById('btnLabel');
btnLabel.addEventListener('click', ()=>{ const v=!btnLabel.classList.contains('active'); btnLabel.classList.toggle('active',v);
  labelRenderer.domElement.style.display = v?'block':'none'; });

const btnReset = document.getElementById('btnReset');
btnReset.addEventListener('click', ()=>{ focusSel.value='free'; focusTarget=null; camera.position.set(0,70,185); controls.target.set(0,0,0); });

const focusSel = document.getElementById('focus');
let focusTarget = null; // planetObj
let lastFocusPos = new THREE.Vector3();
focusSel.addEventListener('change', ()=>{
  const v = focusSel.value;
  if(v==='free'){ focusTarget=null; return; }
  if(v==='Sun'){ focusTarget='sun'; lastFocusPos.set(0,0,0); return; }
  focusTarget = planetObjs.find(o=>o.conf.name===v) || null;
  if(focusTarget){ const wp=new THREE.Vector3(); focusTarget.group.getWorldPosition(wp); lastFocusPos.copy(wp); }
});

/* ============ 动画循环 ============ */
const clock = new THREE.Clock();
const REV_K = 0.045; // 地球角速度基准（rad/s 在速度=1）
const tmp = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const sdt = paused ? 0 : dt * speed;

  // 太阳自转 & 辉光呼吸
  sunMesh.rotation.y += dt*0.05;
  const pulse = 1 + Math.sin(performance.now()*0.0006)*0.04;
  corona.scale.set(SUN_R*7*pulse, SUN_R*7*pulse, 1);
  corona2.scale.set(SUN_R*12*pulse, SUN_R*12*pulse, 1);

  // 行星运动
  planetObjs.forEach(o=>{
    o.angle += (2*Math.PI*REV_K / o.conf.period) * sdt;
    o.pivot.rotation.y = o.angle;
    o.mesh.rotation.y += o.spin * sdt * 6;
    if(o.conf._cloud) o.conf._cloud.rotation.y += o.spin * sdt * 4.5;
    if(o.conf._moonPivot) o.conf._moonPivot.rotation.y += (2*Math.PI*REV_K/0.0748) * sdt;
  });

  // 聚焦跟随
  if(focusTarget){
    let wp = new THREE.Vector3();
    if(focusTarget==='sun'){ wp.set(0,0,0); }
    else { focusTarget.group.getWorldPosition(wp); }
    const delta = wp.clone().sub(lastFocusPos);
    camera.position.add(delta);
    controls.target.add(delta);
    lastFocusPos.copy(wp);
  }

  controls.update();
  composer.render();
  labelRenderer.render(scene, camera);
}

/* ============ 自适应 ============ */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ============ 启动 ============ */
const loader = document.getElementById('loader');
const barFill = document.getElementById('barFill');
let prog = 0;
const t = setInterval(()=>{ prog = Math.min(100, prog + Math.random()*22); barFill.style.width = prog+'%';
  if(prog>=100){ clearInterval(t); loader.style.opacity='0'; setTimeout(()=>loader.remove(), 800); } }, 90);

animate();
</script>
</body>
</html>
