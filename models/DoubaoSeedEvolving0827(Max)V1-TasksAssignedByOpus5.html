 for(let id=1;id<=9;id++){

   const st=positions[id];
   // 找最近采样点
   let k0=0,bd=1e30;

     if(d<bd){bd=d;k0=i;}
   }
   const al=[];
   for(let i=0;i<N;i++){
     let lag=(k0-i+N)%N; if(lag>N/2)lag-=N;
     const dN=Math.abs(lag)/(N/2);
     al.push(0.10+0.9*Math.pow(Math.max(0,1-dN*3.5),3.2));
   }
   pushOrbit(pts,al);
 }
 // 哈雷
 if(state.show.comet){

     if(d<bd){bd=d;k0=i;}
   }
   const al=[];
   for(let i=0;i<N;i++){
     let lag=(k0-i+N)%N;if(lag>N/2)lag-=N;
     const dN=Math.abs(lag)/(N/2);
     al.push(0.06+0.8*Math.pow(Math.max(0,1-dN*3.0),3.2));
   }
   pushOrbit(pts,al);
 }
 // 卫星轨道
 if(state.show.moons){

const tailBuf=gl.createBuffer();
const TAIL_SEG=24;
function buildTails(st,camEye){
 const v=[];
 if(st.r<6.5){
   const pos=st.pos;
   // 长度/亮度按 (3/r)^2 缩放
   const f=Math.pow(3/st.r,2);
   const len=Math.max(compR(st.r+2.0,state.compress)-compR(st.r,state.compress),2)*1.4*f;
   const baseW=Math.max(0.12, compR(st.r+0.15,state.compress)-compR(st.r,state.compress))*1.2;
   function tail(axis,wTip,wScale){
     const ax=norm3(axis);
     let side=cross3(ax,norm3(sub3(camEye,pos)));
     if(len3(side)<0.01)side=[1,0,0];
     side=norm3(side);
     for(let i=0;i<TAIL_SEG;i++){
       const u0=i/TAIL_SEG,u1=(i+1)/TAIL_SEG;
       const pA=add3(pos,scale3(ax,u0*len)),pB=add3(pos,scale3(ax,u1*len));
       const wA=baseW*wScale*(0.25+0.75*u0)+wTip*u0;
       const wB=baseW*wScale*(0.25+0.75*u1)+wTip*u1;
       const al=add3(pA,scale3(side,wA)),ar=sub3(pA,scale3(side,wA));
       const bl=add3(pB,scale3(side,wB)),br=sub3(pB,scale3(side,wB));
       // 三角形1：al, ar, bl；三角形2：bl, ar, br（uv.x: 沿尾 0核->1尖）
       v.push(al[0],al[1],al[2], u0, 1,
              ar[0],ar[1],ar[2], u0,-1,
              bl[0],bl[1],bl[2], u1, 1,
              bl[0],bl[1],bl[2], u1, 1,
              ar[0],ar[1],ar[2], u0,-1,
              br[0],br[1],br[2], u1,-1);
     }
   }
   tail(st.toSunW,0.05,0.5);                          // 离子尾：笔直反日、窄、蓝
   const dust=norm3(add3(scale3(st.toSunW,0.55),scale3(st.velW,-0.45)));
   tail(dust,0.9,1.8);                                // 尘埃尾：更宽、弯曲、暖黄
 }
 return new Float32Array(v);
}

 const k=Math.min(1,dt/0.55);
 state.camYaw+=(state.tgYaw-state.camYaw)*k;
 state.camPitch+=(state.tgPitch-state.camPitch)*k;
 state.camDist+=(state.tgDist-state.camDist)*k;
 // 焦点目标
 let tgt=[0,0,0];
 if(state.focus!=null&&POS[state.focus])tgt=POS[state.focus].pos;
 else tgt=[0,0,0];
 cam.target=[cam.target[0]+(tgt[0]-cam.target[0])*k,
            cam.target[1]+(tgt[1]-cam.target[1])*k,
            cam.target[2]+(tgt[2]-cam.target[2])*k];
 cam.eye=camPos(state.camYaw,state.camPitch,state.camDist,cam.target);

 POS=computePositions(state.jd);
 // 自转相位（限速 7.11）
 const dayStep=daysPerSec(state.speed)*dt;
 for(const b of BODIES){
   const periodDays=b.rotH/24;
   let dph=TAU*dayStep/periodDays;
   dph=Math.max(-0.22,Math.min(0.22,dph));
   spinPhase[b.id]=(spinPhase[b.id]+dph)%TAU;
 }

 const W=fb.w,H=fb.h;
 gl.bindFramebuffer(gl.FRAMEBUFFER,fb.useMS?fb.ms:fb.scene);
 gl.viewport(0,0,W,H);
 gl.depthMask(true); // 7.1：清深度前必须打开
 gl.clearColor(0,0,0,1);
 gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.enable(gl.DEPTH_TEST);
 gl.depthFunc(gl.LEQUAL);

 // 投影（动态近远 4.4）
 const dist2target=len3(sub3(cam.eye,cam.target));
 const near=Math.max(0.012,dist2target*0.0035);
 const far=Math.max(dist2target*14,4200);
 const proj=m4persp(50*DEG,W/H,near,far);
 const view=m4lookAt(cam.eye,cam.target,[0,1,0]);
 const vp=m4mul(proj,view);
 const invVP=m4invAffine(vp);
 lastVP=vp;lastCamEye=cam.eye;
 const time=now/1000;

 // 1. 背景
 gl.disable(gl.DEPTH_TEST);
 gl.depthMask(false);
 gl.disable(gl.BLEND);
 gl.useProgram(progBG);
 gl.uniformMatrix4fv(progBG.u.uInvVP,false,invVP);
 gl.uniform3f(progBG.u.uCam,cam.eye[0],cam.eye[1],cam.eye[2]);
 gl.uniform1f(progBG.u.uTime,time);
 gl.drawArrays(gl.TRIANGLES,0,3);

 // 2. 恒星（加法）
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
 gl.useProgram(progStar);
 gl.uniformMatrix4fv(progStar.u.uVP,false,vp);
 gl.uniform3f(progStar.u.uCam,cam.eye[0],cam.eye[1],cam.eye[2]);
 gl.uniform1f(progStar.u.uTime,time);
 gl.bindBuffer(gl.ARRAY_BUFFER,starDirBuf);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,starInfoBuf);
 gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
 gl.drawArrays(gl.POINTS,0,STAR_N);

 // 3/4. 球体
 gl.enable(gl.DEPTH_TEST);
 gl.depthMask(true);
 gl.disable(gl.BLEND);
 gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);
 const fwd=norm3(sub3(cam.target,cam.eye));
 const right=norm3(cross3([0,1,0],fwd));
 const upV=cross3(fwd,right);

 function drawSphere(mesh,model,prog,unif){
   gl.useProgram(prog);
   gl.uniformMatrix4fv(prog.u.uVP,false,vp);
   gl.uniformMatrix4fv(prog.u.uModel,false,model);
   if(unif)unif(prog);
   gl.bindBuffer(gl.ARRAY_BUFFER,mesh.pb);
   gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
   gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.ib);
   gl.drawElements(gl.TRIANGLES,mesh.count,gl.UNSIGNED_SHORT,0);
 }
 // 太阳
 {
   const b=BODIES[0],m=m4model([0,0,0],b.basis,spinPhase[0],b.dispR);
   drawSphere(meshHi,m,progSun,p=>{
     gl.uniform3f(p.u.uCam,cam.eye[0],cam.eye[1],cam.eye[2]);
     gl.uniform1f(p.u.uTime,time);
   });
 }
 // 行星 / 卫星 / 彗核
 for(const b of BODIES){
   if(b.id===0)continue;
   const st=POS[b.id];if(!st)continue;
   if(!bodyVisible(b.id))continue;
   const mesh=b.id<=9||b.id===15?meshHi:meshLo;
   const m=m4model(st.pos,b.basis,spinPhase[b.id],b.dispR);
   const isMoon = b.parent!==undefined && b.parent>=0;
   const parentPos = isMoon ? POS[b.parent].pos : [0,0,0];
   const rAu = isMoon ? len3(POS[b.parent].ecl) : st.r;
   const sunI=Math.max(0.26,Math.min(2.1,1.5*Math.pow(1/Math.max(rAu,0.05),0.40)));
   const lw=norm3(sub3(parentPos,st.pos));
   // 物体空间太阳方向（rotation^T * Lw）
   const c0=[m[0],m[1],m[2]],c1=[m[4],m[5],m[6]],c2=[m[8],m[9],m[10]];
   const objSun=[dot3(c0,lw)/b.dispR,dot3(c1,lw)/b.dispR,dot3(c2,lw)/b.dispR];
   const ringId=RING_FOR[b.id]||0;
   drawSphere(mesh,m,progPlanet,p=>{
     gl.uniform1i(p.u.uId,b.id);
     gl.uniform1f(p.u.uTime,time);
     gl.uniform3f(p.u.uCam,cam.eye[0],cam.eye[1],cam.eye[2]);
     gl.uniform3f(p.u.uSunDir,lw[0],lw[1],lw[2]);
     gl.uniform1f(p.u.uSunI,sunI);
     gl.uniform3f(p.u.uObjSun,objSun[0],objSun[1],objSun[2]);
     gl.uniform1i(p.u.uRing,ringId);
   });
 }

 // 5. 轨道缎带
 if(state.show.orbits){
   gl.disable(gl.CULL_FACE);
   gl.depthMask(false);
   gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
   const rb=buildRibbonData(POS,state.jd);
   gl.bindBuffer(gl.ARRAY_BUFFER,ribbonBuf);
   gl.bufferData(gl.ARRAY_BUFFER,rb.data,gl.DYNAMIC_DRAW);
   const stride=8*4;
   gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,stride,0);
   gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,stride,12);
   gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,1,gl.FLOAT,false,stride,24);
   gl.enableVertexAttribArray(3);gl.vertexAttribPointer(3,1,gl.FLOAT,false,stride,28);
   gl.useProgram(progRibbon);
   gl.uniformMatrix4fv(progRibbon.u.uVP,false,vp);
   gl.uniformMatrix4fv(progRibbon.u.uModel?progRibbon.u.uModel:progRibbon.u.uVP,false,m4ident());
   gl.uniform2f(progRibbon.u.uRes,W,H);
   let off=0;
   function drawSeg(count,color,halfW,boost){
     if(!count)return;
     gl.uniform1f(progRibbon.u.uHalfW,halfW);
     gl.uniform3f(progRibbon.u.uColor,color[0],color[1],color[2]);
     gl.uniform1f(progRibbon.u.uBoost,boost);
     gl.drawArrays(gl.TRIANGLE_STRIP,off,count);
     off+=count;
   }
   // 行星 9 条
   for(let id=1;id<=9;id++)drawSeg(256*2,ORB_COLORS[id],1.3,0.85);
   drawSeg(state.show.comet?384*2:0,ORB_COLORS[18],1.1,0.7);
   // 卫星：用各自模型矩阵重画
   if(state.show.moons){
     for(const m of MOONS){
       const pb=BODIES[m.id];
       const pst=POS[pb.parent];
       const model = m.ref===0
         ? (()=>{const t=m4ident();t[12]=pst.pos[0];t[13]=pst.pos[1];t[14]=pst.pos[2];return t;})()
         : m4model(pst.pos,BODIES[pb.parent].basis,0,1);
       gl.uniformMatrix4fv(progRibbon.u.uModel,false,model);
       drawSeg(80*2,ORB_COLORS.moon,0.9,0.5);
     }
   }
   gl.uniformMatrix4fv(progRibbon.u.uModel,false,m4ident());
 }

 // 6. 小行星带
 if(state.show.belt){
   gl.depthMask(false);
   gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
   gl.useProgram(progBelt);
   gl.uniformMatrix4fv(progBelt.u.uVP,false,vp);
   gl.uniform1f(progBelt.u.uDays,state.jd-J2000);
   gl.uniform1f(progBelt.u.uComp,state.compress);
   gl.uniform3f(progBelt.u.uCam,cam.eye[0],cam.eye[1],cam.eye[2]);
   gl.bindBuffer(gl.ARRAY_BUFFER,beltBuf);
   gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,4,gl.FLOAT,false,9*4,0);
   gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,9*4,16);
   gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,1,gl.FLOAT,false,9*4,32);
   gl.drawArrays(gl.POINTS,0,BELT_COUNT);
 }

 // 7. 大气
 gl.disable(gl.CULL_FACE);
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
 gl.depthMask(false);
 for(const id in ATMO){
   const b=BODIES[id],st=POS[id];if(!st)continue;
   if(!bodyVisible(b.id))continue;
   const a=ATMO[id];
   const shell=1+a.h*7.5;
   const m=m4model(st.pos,b.basis,0,b.dispR*shell);
   gl.useProgram(progAtmo);
   gl.uniformMatrix4fv(progAtmo.u.uVP,false,vp);
   gl.uniformMatrix4fv(progAtmo.u.uModel,false,m);
   gl.uniform3f(progAtmo.u.uCam,cam.eye[0],cam.eye[1],cam.eye[2]);
   gl.uniform3f(progAtmo.u.uCenter,st.pos[0],st.pos[1],st.pos[2]);
   gl.uniform3f(progAtmo.u.uSunDir,-st.pos[0],-st.pos[1],-st.pos[2]);
   gl.uniform1f(progAtmo.u.uPR,b.dispR);
   gl.uniform1f(progAtmo.u.uShell,b.dispR*shell);
   gl.uniform1f(progAtmo.u.uH,a.h);
   gl.uniform1f(progAtmo.u.uStr,a.s);
   gl.uniform3f(progAtmo.u.uCol,a.col[0],a.col[1],a.col[2]);
   gl.bindBuffer(gl.ARRAY_BUFFER,meshHi.pb);
   gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
   gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,meshHi.ib);
   gl.drawElements(gl.TRIANGLES,meshHi.count,gl.UNSIGNED_SHORT,0);
 }

 // 8. 环系（正常 alpha 混合，不剔除）
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
 gl.depthMask(false);
 gl.disable(gl.CULL_FACE);
 const ringMesh={1:ringSat,2:ringUra,3:ringJup};
 for(const id of[5,6,7]){
   const b=BODIES[id],st=POS[id];
   const ringId=RING_FOR[id];
   const m=m4model(st.pos,b.basis,0,b.dispR);
   gl.useProgram(progRing);
   gl.uniformMatrix4fv(progRing.u.uVP,false,vp);
   gl.uniformMatrix4fv(progRing.u.uModel,false,m);
   gl.uniform3f(progRing.u.uCam,cam.eye[0],cam.eye[1],cam.eye[2]);
   gl.uniform3f(progRing.u.uSun,0,0,0);
   gl.uniform3f(progRing.u.uAxis,b.axisW[0],b.axisW[1],b.axisW[2]);
   const c0=[m[0],m[1],m[2]],c1=[m[4],m[5],m[6]],c2=[m[8],m[9],m[10]];
   const lw=norm3(scale3(st.pos,-1));
   const os=[dot3(c0,lw),dot3(c1,lw),dot3(c2,lw)];
   gl.uniform3f(progRing.u.uObjSun,os[0],os[1],os[2]);
   gl.uniform1i(progRing.u.uRing,ringId);
   const mesh=ringMesh[ringId];
   gl.bindBuffer(gl.ARRAY_BUFFER,mesh.pb);
   gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
   gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.ib);
   gl.drawElements(gl.TRIANGLES,mesh.count,gl.UNSIGNED_SHORT,0);
 }

 // 9. 彗尾 + 彗发
 if(state.show.comet&&POS[18]){
   const st=POS[18];
   gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
   gl.depthMask(false);
   const td=buildTails(st,cam.eye);
   if(td.length){
   gl.bindBuffer(gl.ARRAY_BUFFER,tailBuf);
   gl.bufferData(gl.ARRAY_BUFFER,td,gl.DYNAMIC_DRAW);
   gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,5*4,0);
   gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,2,gl.FLOAT,false,5*4,12);
   gl.useProgram(progTail);
   gl.uniformMatrix4fv(progTail.u.uVP,false,vp);
   const nVerts=TAIL_SEG*6;
   // 离子尾（蓝）
   gl.uniform3f(progTail.u.uCol,0.40,0.60,1.0);
   gl.uniform1f(progTail.u.uAlpha,0.45);
   gl.drawArrays(gl.TRIANGLES,0,nVerts);
   // 尘埃尾（暖黄）
   gl.uniform3f(progTail.u.uCol,1.0,0.72,0.42);
   gl.uniform1f(progTail.u.uAlpha,0.30);
   gl.drawArrays(gl.TRIANGLES,nVerts,nVerts);
   }
   // 彗发
   gl.useProgram(progComa);
   gl.uniformMatrix4fv(progComa.u.uVP,false,vp);
   gl.uniform3f(progComa.u.uC,st.pos[0],st.pos[1],st.pos[2]);
   gl.uniform3f(progComa.u.uRight,right[0],right[1],right[2]);
   gl.uniform3f(progComa.u.uUp,upV[0],upV[1],upV[2]);
   const comaR=Math.max(BODIES[18].dispR*7, compR(0.3,state.compress)-compR(0.1,state.compress));
   gl.uniform1f(progComa.u.uR,Math.max(1.4,comaR));
   gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
   gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
   gl.drawArrays(gl.TRIANGLES,0,6);
 }

 // 10. 日冕
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
 gl.depthMask(false);
 gl.enable(gl.DEPTH_TEST);
 {
   const sr=BODIES[0].dispR;
   gl.useProgram(progCorona);
   gl.uniformMatrix4fv(progCorona.u.uVP,false,vp);
   gl.uniform3f(progCorona.u.uC,0,0,0);
   gl.uniform3f(progCorona.u.uRight,right[0],right[1],right[2]);
   gl.uniform3f(progCorona.u.uUp,upV[0],upV[1],upV[2]);
   gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
   gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
   gl.uniform1f(progCorona.u.uR,sr*6.0);
   gl.drawArrays(gl.TRIANGLES,0,6);
   gl.uniform1f(progCorona.u.uR,sr*2.3);
   gl.drawArrays(gl.TRIANGLES,0,6);
 }

 // ---- 解析 MSAA ----
 if(fb.useMS){
   gl.bindFramebuffer(gl.READ_FRAMEBUFFER,fb.ms);
   gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,fb.scene);
   gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.NEAREST);
 }

 // ---- 泛光 ----
 gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.BLEND);
 gl.disable(gl.CULL_FACE);
 // 亮部提取 -> mip0
 gl.bindFramebuffer(gl.FRAMEBUFFER,fb.dF[0]);
 gl.viewport(0,0,fb.dT[0].width||W>>1,fb.dT[0].height||H>>1);
 gl.useProgram(progBright);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,fb.sceneTex);
 gl.uniform1i(progBright.u.uTex,0);
 gl.drawArrays(gl.TRIANGLES,0,3);
 // 降采样
 for(let i=1;i<fb.MIPS;i++){
   const tw=Math.max(2,W>>1>>i),th=Math.max(2,H>>1>>i);
   gl.bindFramebuffer(gl.FRAMEBUFFER,fb.dF[i]);
   gl.viewport(0,0,tw,th);
   gl.useProgram(progDown);
   gl.bindTexture(gl.TEXTURE_2D,fb.dT[i-1]);
   gl.uniform1i(progDown.u.uTex,0);
   gl.uniform2f(progDown.u.uTexel,1/(tw*2),1/(th*2));
   gl.drawArrays(gl.TRIANGLES,0,3);
 }
 // 最深层：升采样目标 = 降采样结果
 gl.disable(gl.BLEND);
 gl.bindFramebuffer(gl.READ_FRAMEBUFFER,fb.dF[fb.MIPS-1]);
 gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,fb.uF[fb.MIPS-1]);
 gl.blitFramebuffer(0,0,fb.uT[fb.MIPS-1].width,fb.uT[fb.MIPS-1].height,
                     0,0,fb.uT[fb.MIPS-1].width,fb.uT[fb.MIPS-1].height,
                     gl.COLOR_BUFFER_BIT,gl.NEAREST);
 // 升采样：先把本级降采样结果写入目标，再用加法混合累加更模糊层（无反馈环 7.3）
 for(let i=fb.MIPS-2;i>=0;i--){
   gl.disable(gl.BLEND);
   gl.bindFramebuffer(gl.READ_FRAMEBUFFER,fb.dF[i]);
   gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,fb.uF[i]);
   gl.viewport(0,0,fb.uT[i].width,fb.uT[i].height);
   gl.blitFramebuffer(0,0,fb.dT[i].width,fb.dT[i].height,
                       0,0,fb.uT[i].width,fb.uT[i].height,
                       gl.COLOR_BUFFER_BIT,gl.NEAREST);
   gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
   gl.bindFramebuffer(gl.FRAMEBUFFER,fb.uF[i]);
   gl.useProgram(progUp);
   gl.bindTexture(gl.TEXTURE_2D,fb.uT[i+1]);
   gl.uniform1i(progUp.u.uHi,0);
   gl.uniform2f(progUp.u.uTexel,1/fb.dT[i+1].width,1/fb.dT[i+1].height);
   gl.drawArrays(gl.TRIANGLES,0,3);
 }
 gl.disable(gl.BLEND);

 // ---- 合成 ----
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);
 gl.viewport(0,0,canvas.width,canvas.height);
 gl.useProgram(progComp);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,fb.sceneTex);
 gl.uniform1i(progComp.u.uScene,0);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,fb.uT[0]);
 gl.uniform1i(progComp.u.uBloom,1);
 // 太阳屏幕位置 + 可见度
 const sp=project([0,0,0],vp);
 let vis=0;
 if(sp.ndcZ>=-1&&sp.ndcZ<=1){
   vis=1;
   // 被行星遮挡判定
   for(let id=1;id<=9;id++){
     const b=BODIES[id],p2=POS[id];
     const pp=project(p2.pos,vp);
     const screenD=Math.hypot(pp.sx-sp.sx,pp.sy-sp.sy);
     const angR=b.dispR/Math.max(len3(p2.pos),0.01);
     const sunAng=BODIES[0].dispR/Math.max(len3(cam.eye),0.01);
     if(screenD<angR && pp.ndcZ<sp.ndcZ)vis*=0.15;
   }
 }
 gl.uniform2f(progComp.u.uSun,sp.sx*0.5+0.5,sp.sy*0.5+0.5);
 gl.uniform1f(progComp.u.uVis,vis);
 gl.uniform1f(progComp.u.uTime,time);
 gl.uniform1f(progComp.u.uBloomOn,state.show.bloom?1:0);
 gl.drawArrays(gl.TRIANGLES,0,3);

 // 标签 & UI
 updateLabels();
 infoTimer+=dt;
 if(infoTimer>0.25){infoTimer=0;updateInfo();}
 document.getElementById('dateStr').textContent=jdToDate(state.jd);
 document.getElementById('speedVal').textContent=speedLabel(daysPerSec(state.speed));
 const ge=gl.getError();
 if(ge&&!window.__glErr){window.__glErr=ge;console.warn('GL error 0x'+ge.toString(16));}
}
// 纹理宽高记录
function trackTexSize(){
 for(let i=0;i<6;i++){
   gl.bindTexture(gl.TEXTURE_2D,fb.dT[i]);
 }
}
requestAnimationFrame(frame);
</script>
</body>
