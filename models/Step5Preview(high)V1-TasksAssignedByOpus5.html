<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<title>太阳系实时运动模型 · 真实轨道根数 · WebGL2</title>
<style>
:root{
  --fg:#e3e9f5; --dim:#8d96aa; --dim2:#5f6879; --acc:#9fd3ff; --warm:#ffd39a;
  --line:rgba(255,255,255,.085);
  --panel:linear-gradient(180deg,rgba(19,24,36,.78),rgba(8,11,18,.70));
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
.panel{position:fixed;z-index:6;background:var(--panel);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid var(--line);border-radius:14px;
  box-shadow:0 16px 50px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.06)}
/* ---------- 左侧天体列表 ---------- */
#listp{left:12px;top:12px;width:198px;padding:11px 6px 11px 11px;max-height:calc(100% - 24px);
  overflow-y:auto;overscroll-behavior:contain}
#listp::-webkit-scrollbar,#infop::-webkit-scrollbar{width:6px}
#listp::-webkit-scrollbar-thumb,#infop::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:3px}
.ttl{font-size:10px;letter-spacing:.26em;color:var(--dim2);padding:0 5px 8px;text-transform:uppercase}
.grp{font-size:9.5px;letter-spacing:.2em;color:#4d566a;padding:9px 5px 3px}
.item{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:8px;cursor:pointer;
  font-size:12.5px;color:#c2cbdb;transition:background .16s,color .16s;user-select:none}
.item:hover{background:rgba(255,255,255,.06);color:#fff}
.item.sel{background:linear-gradient(90deg,rgba(130,185,255,.22),rgba(130,185,255,.05));color:#fff;
  box-shadow:inset 0 0 0 1px rgba(150,200,255,.20)}
.item .dt{width:7px;height:7px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 9px currentColor}
.item.sub{padding-left:19px;font-size:11.5px;color:#98a3b6}
.item.sub .dt{width:5px;height:5px}
/* ---------- 右侧信息卡 ---------- */
#infop{right:12px;top:12px;width:330px;padding:13px 15px 15px;max-height:calc(100% - 210px);
  overflow-y:auto;overscroll-behavior:contain}
.rhd{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.rname{font-size:19px;letter-spacing:.06em;font-weight:600}
.rtag{font-size:10px;letter-spacing:.2em;color:var(--dim2);padding:2px 7px;border:1px solid var(--line);border-radius:20px}
.rsec{font-size:9.5px;letter-spacing:.2em;color:#4d566a;margin:13px 0 6px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.06)}
.rg{display:grid;grid-template-columns:auto 1fr;gap:3.5px 10px;font-size:11.5px}
.rg .k{color:var(--dim2);white-space:nowrap;letter-spacing:.03em}
.rg .v{color:#d0d9e9;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.rg .v.hi{color:var(--acc)}
.rdesc{font-size:11.5px;line-height:1.72;color:#aab4c6}
.rwarn{margin-top:12px;font-size:10.5px;line-height:1.6;color:#ffcf8a;background:rgba(255,180,80,.10);
  border:1px solid rgba(255,190,110,.25);border-radius:8px;padding:7px 9px}
/* ---------- 底部时间条 ---------- */
#barp{left:50%;transform:translateX(-50%);bottom:12px;padding:8px 11px;display:flex;align-items:center;gap:11px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.ic{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .15s}
.ic:hover{background:rgba(255,255,255,.12)}
.btn{padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  font-size:11.5px;letter-spacing:.08em;transition:background .15s}
.btn:hover{background:rgba(255,255,255,.12)}
.dbox{min-width:186px}
.dt{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:#e6ecf7}
.jd{font-size:9.5px;letter-spacing:.14em;color:var(--dim2);margin-top:2px;font-family:var(--mono)}
.sdbx{display:flex;align-items:center;gap:8px}
.slb{font-size:9.5px;letter-spacing:.16em;color:var(--dim2)}
#speed{-webkit-appearance:none;appearance:none;width:170px;height:3px;border-radius:2px;
  background:#2a3243;outline:none}
#speed::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:#cfe4ff;box-shadow:0 0 10px rgba(150,200,255,.75);cursor:pointer}
#speed::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#cfe4ff;cursor:pointer}
.sv{font-family:var(--mono);font-size:11px;color:#cfd8e8;min-width:96px;font-variant-numeric:tabular-nums}
#dateset{width:132px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;
  padding:7px 9px;font-family:var(--mono);font-size:11px;color:#cfd8e8;outline:none}
#dateset:focus{border-color:rgba(150,200,255,.4)}
/* ---------- 开关 ---------- */
#swp{right:12px;bottom:12px;width:330px;padding:9px 11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  font-size:11px;letter-spacing:.06em;color:#9aa5b8;transition:all .15s}
.chip:hover{background:rgba(255,255,255,.1)}
.chip.on{background:rgba(120,180,255,.16);border-color:rgba(140,195,255,.4);color:#dcecff;
  box-shadow:0 0 14px rgba(110,175,255,.16) inset}
/* ---------- 其它 ---------- */
#notep{left:12px;bottom:12px;max-width:352px;padding:9px 12px;font-size:10.5px;line-height:1.62;color:#93a0b4}
#notep b{color:#b9c6da;font-weight:500}
#hud{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:6;text-align:center;pointer-events:none}
#hud .t{font-size:12.5px;letter-spacing:.34em;color:#b6c2d4;text-shadow:0 2px 16px #000}
#hud .s{font-size:10px;letter-spacing:.2em;color:var(--dim2);margin-top:4px;text-shadow:0 2px 10px #000}
#hud .f{font-size:10px;letter-spacing:.08em;color:#4f586a;margin-top:2px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;text-shadow:0 2px 10px #000}
#labels{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;white-space:nowrap;
  font-size:11px;letter-spacing:.15em;color:#dfe7f4;text-shadow:0 1px 6px #000,0 0 16px #000;will-change:transform,opacity}
.lb .ld{width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;flex:0 0 auto}
.lb.moon{font-size:9.5px;letter-spacing:.12em;color:#a9b4c6}
#err{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
  background:#05070b;padding:30px;text-align:center;font-size:13px;line-height:1.8;color:#c8d2e2}
.hideui .panel,.hideui #hud{opacity:0;pointer-events:none;transition:opacity .25s}
@media (max-width:900px){
  #infop{width:280px;max-height:52%}#notep{display:none}#hud .s{display:none}
  #barp{gap:8px;padding:7px 9px}.dbox{min-width:150px}#speed{width:110px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<div id="hud">
  <div class="t">太阳系实时运动模型</div>
  <div class="s">真实轨道根数 · 程序化表面 · 零外部依赖</div>
  <div class="f" id="hudf">—</div>
</div>

<div id="listp" class="panel">
  <div class="ttl">天体导航</div>
  <div id="list"></div>
</div>

<div id="infop" class="panel">
  <div class="rhd"><div class="rname" id="rname">太阳</div><div class="rtag" id="rtag">恒星</div></div>
  <div class="rsec">实时数据</div>
  <div class="rg" id="rt"></div>
  <div class="rsec">物理与轨道参数</div>
  <div class="rg" id="rs"></div>
  <div class="rsec">大气 / 成分</div>
  <div class="rdesc" id="ra"></div>
  <div class="rsec">简介</div>
  <div class="rdesc" id="rd"></div>
  <div class="rwarn" id="rw" style="display:none">⚠ 日期已超出根数有效区间（1800–2050 年），此时的位置由根数线性外推得到。</div>
</div>

<div id="barp" class="panel">
  <button class="ic" id="play" title="播放 / 暂停（空格）">❚❚</button>
  <div class="dbox">
    <div class="dt" id="dt">————-——-—— ——:——:—— UTC</div>
    <div class="jd">JD <span id="jd">—</span></div>
  </div>
  <input id="dateset" type="text" placeholder="YYYY-MM-DD HH:MM" spellcheck="false"/>
  <div class="sdbx">
    <span class="slb">速度</span>
    <input id="speed" type="range" min="-100" max="100" value="0" step="0.25"/>
    <span class="sv" id="sv">1.00 秒/秒</span>
  </div>
  <button class="btn" id="now">此刻</button>
</div>

<div id="swp" class="panel"><div class="chips" id="chips">
  <button class="chip on" data-k="orbits">轨道</button>
  <button class="chip on" data-k="labels">名称</button>
  <button class="chip on" data-k="moons">卫星</button>
  <button class="chip on" data-k="belts">小行星带</button>
  <button class="chip on" data-k="comet">彗星</button>
  <button class="chip" data-k="real">真实距离比例</button>
  <button class="chip on" data-k="bloom">辉光</button>
</div></div>

<div id="notep" class="panel">
  <b>关于比例：</b>距离显示经过幂律压缩 <b>r<sub>显示</sub> = 34 · r<sub>AU</sub><sup>0.62</sup></b>（方向不变），
  因此内行星不会被压成一个点；<b>角位置、轨道相位、周期、偏心率、倾角全部为真实值</b>。
  点右下「真实距离比例」可看到压缩与真实比例的区别。
</div>

<div id="err"></div>

<script>
"use strict";
(function(){
/* =====================================================================
   太阳系实时运动模型 — 单文件 / WebGL2 / 零依赖
   ===================================================================== */
const DEG=Math.PI/180, TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function sstep(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
const $=id=>document.getElementById(id);
function gid(s){return document.getElementById(s);}

/* ------------------------- 4x4 / 3x3 数学 ------------------------- */
function m4(){return new Float32Array(16);}
function mIdent(o){o.fill(0);o[0]=o[5]=o[10]=o[15]=1;return o;}
function mMul(o,a,b){
  const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],
        a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
  for(let i=0;i<4;i++){
    const b0=b[i*4],b1=b[i*4+1],b2=b[i*4+2],b3=b[i*4+3];
    o[i*4  ]=a00*b0+a10*b1+a20*b2+a30*b3;
    o[i*4+1]=a01*b0+a11*b1+a21*b2+a31*b3;
    o[i*4+2]=a02*b0+a12*b1+a22*b2+a32*b3;
    o[i*4+3]=a03*b0+a13*b1+a23*b2+a33*b3;
  }
  return o;
}
function mPersp(o,fovy,asp,n,f){
  const t=1/Math.tan(fovy*0.5), nf=1/(n-f);
  o.fill(0);
  o[0]=t/asp; o[5]=t; o[10]=(f+n)*nf; o[11]=-1; o[14]=2*f*n*nf;
  return o;
}
function mLook(o,ex,ey,ez,cx,cy,cz,ux,uy,uz){
  let zx=ex-cx, zy=ey-cy, zz=ez-cz;
  let l=Math.hypot(zx,zy,zz)||1; zx/=l; zy/=l; zz/=l;
  let xx=uy*zz-uz*zy, xy=uz*zx-ux*zz, xz=ux*zy-uy*zx;
  l=Math.hypot(xx,xy,xz)||1; xx/=l; xy/=l; xz/=l;
  const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0;
  o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0;
  o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
  o[12]=-(xx*ex+xy*ey+xz*ez);
  o[13]=-(yx*ex+yy*ey+yz*ez);
  o[14]=-(zx*ex+zy*ey+zz*ez);
  o[15]=1;
  return o;
}
function mInv(o,m){
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],
        a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10,
        b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12,
        b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30,
        b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
  let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if(!det) return mIdent(o);
  det=1/det;
  o[0]=(a11*b11-a12*b10+a13*b09)*det;  o[1]=(a02*b10-a01*b11-a03*b09)*det;
  o[2]=(a31*b05-a32*b04+a33*b03)*det;  o[3]=(a22*b04-a21*b05-a23*b03)*det;
  o[4]=(a12*b08-a10*b11-a13*b07)*det;  o[5]=(a00*b11-a02*b08+a03*b07)*det;
  o[6]=(a32*b02-a30*b05-a33*b01)*det;  o[7]=(a20*b05-a22*b02+a23*b01)*det;
  o[8]=(a10*b10-a11*b08+a13*b06)*det;  o[9]=(a01*b08-a00*b10-a03*b06)*det;
  o[10]=(a30*b04-a31*b02+a33*b00)*det; o[11]=(a21*b02-a20*b04-a23*b00)*det;
  o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det;
  o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;
  return o;
}
/* 正交基（B = [X|Y|Z] 列主序 9 浮点，Y = 自转轴）→ 模型矩阵。
   phase 给定时再绕 Y 轴旋转（B·Ry），S 为统一缩放。 */
function mModelBasis(o,tx,ty,tz,B,S,phase){
  const X0=B[0],X1=B[1],X2=B[2],Y0=B[3],Y1=B[4],Y2=B[5],Z0=B[6],Z1=B[7],Z2=B[8];
  let c=1,s=0;
  if(phase!==undefined){c=Math.cos(phase);s=Math.sin(phase);}
  o[0]=(X0*c-Z0*s)*S; o[1]=(X1*c-Z1*s)*S; o[2]=(X2*c-Z2*s)*S; o[3]=0;
  o[4]=Y0*S; o[5]=Y1*S; o[6]=Y2*S; o[7]=0;
  o[8]=(X0*s+Z0*c)*S; o[9]=(X1*s+Z1*c)*S; o[10]=(X2*s+Z2*c)*S; o[11]=0;
  o[12]=tx;o[13]=ty;o[14]=tz;o[15]=1;
  return o;
}
function v3(x,y,z){return new Float32Array([x,y,z]);}
function vnorm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return v3(a[0]/l,a[1]/l,a[2]/l);}
function vcross(a,b){return v3(a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]);}
function vdot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}

/* ------------------------- 日期 / 时间 ------------------------- */
const JD_UNIX_EPOCH=2440587.5;
function jdNow(){return Date.now()/86400000+JD_UNIX_EPOCH;}
function jdToUTC(jd){
  const ms=(jd-JD_UNIX_EPOCH)*86400000;
  if(!isFinite(ms)||Math.abs(ms)>8.64e15) return '超出可显示范围';
  const d=new Date(ms);
  const p=n=>String(n).padStart(2,'0');
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+
         p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());
}
function parseDate(str){
  const m=str.trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?$/);
  if(!m) return null;
  const t=Date.UTC(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  if(!isFinite(t)) return null;
  return t/86400000+JD_UNIX_EPOCH;
}
function fmt(v,d){ if(!isFinite(v)) return '—';
  const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toFixed(d-2)+'e6';
  return v.toFixed(d);
}
function fmtDateStr(days){ // 天 → “N 天 / N 年”
  const a=Math.abs(days);
  if(a<2) return days.toFixed(3)+' 天';
  if(a<730) return days.toFixed(1)+' 天';
  if(a<100000) return (days/365.25).toFixed(2)+' 年';
  return (days/365.25).toFixed(0)+' 年';
}
function fmtSpeed(dps){
  const a=Math.abs(dps);
  if(a<1.1e-5) return (dps*86400).toFixed(2)+' 秒/秒';
  if(a<6e-4)  return (dps*1440).toFixed(2)+' 分/秒';
  if(a<0.036) return (dps*24).toFixed(2)+' 小时/秒';
  if(a<365)   return dps.toFixed(2)+' 天/秒';
  return (dps/365.25).toFixed(2)+' 年/秒';
}
/* =====================================================================
   1. 天文数据（NASA/JPL《主要行星近似位置》，有效区间 1800–2050）
   ===================================================================== */
const J2000=2451545.0;
const AU_KM=149597870.7;
const C_KMS=299792.458;

const PLANETS=[
{id:'mercury',name:'水星',en:'Mercury',kind:'rock',tag:'行星',col:'#b8a99b',
 a:0.38709927,e:0.20563593,I:7.00497902,L:252.25032350,wb:77.45779628,om:48.33076593,
 da:0.00000037,de:0.00001906,dI:-0.00594749,dL:149472.67411175,dwb:0.16047689,dom:-0.12534081,
 radius:2439.7,mass:'3.30×10²³ kg',period:'87.97 天',nmoon:'0',temp:'−173 ~ 427 ℃',
 tilt:7.0,poleLon:318.4,rotH:1407.6,tiltTxt:'0.03°',
 alb:0.16,c1:[0.44,0.41,0.37],c2:[0.26,0.23,0.20],bump:1.0,amb:0.020,
 atmo:'几乎没有大气，仅由太阳风与微陨石轰击维持一层极稀薄的钠、氢、氧、氦外气层。',

/* =====================================================================
   2. 轨道力学
   ===================================================================== */
function kepler(M,e){
  let m=M%TAU; if(m>PI)m-=TAU; if(m<-PI)m+=TAU;
  let E=m+e*Math.sin(m)*(1+e*Math.cos(m));
  for(let i=0;i<14;i++){
    const d=(E-e*Math.sin(E)-m)/(1-e*Math.cos(E));
    E-=d;
    if(Math.abs(d)<1e-13) break;
  }
  return E;
}
const ORB={};
function orbitEcl(d,T,out){
  const a=d.a+d.da*T, e=d.e+d.de*T;
  const I=(d.I+d.dI*T)*DEG, L=(d.L+d.dL*T)*DEG, wb=(d.wb+d.dwb*T)*DEG, om=(d.om+d.dom*T)*DEG;
  const w=wb-om;
  let M=L-wb;
  M=M%TAU; if(M>PI)M-=TAU; if(M<-PI)M+=TAU;
  const E=kepler(M,e);
  const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(1-e*e)*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(om),sO=Math.sin(om),
        cI=Math.cos(I),sI=Math.sin(I);
  const x=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp;
  const y=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp;
  const z=(sw*sI)*xp+(cw*sI)*yp;
  out.x=x; out.y=y; out.z=z; out.r=Math.hypot(x,y,z);
  out.a=a; out.e=e; out.E=E; out.M=M; out.w=w; out.om=om; out.I=I;
  return out;
}
/* 哈雷：固定根数，M 由过近日点时刻给出 */
function halleyEcl(jd,out){
  const M=TAU*(jd-HALLEY.tp)/HALLEY.P;
  const e=HALLEY.e,a=HALLEY.a;
  const E=kepler(M,e);
  const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(1-e*e)*Math.sin(E);
  const w=HALLEY.omg*DEG, om=HALLEY.om*DEG, I=HALLEY.I*DEG;
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(om),sO=Math.sin(om),
        cI=Math.cos(I),sI=Math.sin(I);
  const x=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp;
  const y=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp;
  const z=(sw*sI)*xp+(cw*sI)*yp;
  out.x=x;out.y=y;out.z=z;out.r=Math.hypot(x,y,z);
  out.a=a;out.e=e;out.E=E;out.M=M;
  out.w=HALLEY.omg*DEG; out.om=HALLEY.om*DEG; out.I=HALLEY.I*DEG;
  return out;
}
/* 黄道 → 世界（y 上，保持右手性） */
function eclToWorld(x,y,z,o){o[0]=x;o[1]=z;o[2]=-y;return o;}

float hash13(vec3 p3){p3=fract(p3*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec3 hash33(vec3 p3){

float vnoise(vec3 x){

  vec3 col=mix(uC1,uC2,b*0.55+0.22)*fade;
  col+=uC2*0.22;
  /* 明亮甲烷云条纹 */
  float cs=abs(fbm(vec3(p.x*4.5,p.y*34.0,p.z*4.5),4)-0.5);
  col+=vec3(0.55,0.78,0.74)*sstep(0.055,0.008,cs)*0.30*fade;
  float cs2=abs(fbm(vec3(p.x*9.0,p.y*60.0,p.z*9.0),3)-0.5);
  col+=vec3(0.45,0.70,0.72)*sstep(0.035,0.006,cs2)*0.22*fade;
#ifdef SPOT
  {
    float lon=atan(p.z,p.x);
    float dl=lon-2.2; dl=atan(sin(dl),cos(dl));
    float dy=latD+24.0;
    vec2 dp=vec2(dl*cos(24.0*DEG2),dy);
    float rr=length(vec2(dp.x/13.0,dp.y/6.5));
    col=mix(col,vec3(0.05,0.11,0.30),sstep(1.0,0.72,rr)*0.85);
  }
#endif
  height=0.0;
  emis=vec3(0.0); sAmt=0.0; sPow=40.0; sCol=vec3(1.0);
  float limb=sstep(-0.05,0.55,ndl);
  col*=0.80+0.20*limb;
  return col*uAlb;
}`;
SURF.europa=`
vec3 SURF(vec3 p,float ndl,out float height,out vec3 emis,out float sAmt,out float sPow,out vec3 sCol){

const PLANET_HEAD=`
in vec3 vW,vN,vO;
uniform vec3 uCam,uSunDir;
uniform float uSunI,uTime,uRadius,uBump,uAmb;
uniform vec3 uC1,uC2,uC3;
uniform float uSeed,uTwist,uHex,uSpot,uMaria,uAlb;
#ifdef RINGED
uniform mat4 uRingInv;
uniform float uRingKind;
#endif
float gCloud=0.0,gCThin=0.0;
out vec4 outColor;
`;
const PLANET_MAIN=`
void main(){
  vec3 p=normalize(vO);
  vec3 N=normalize(vN);
  vec3 L=normalize(uSunDir);
  float ndl=dot(N,L);
  float hgt=0.0;
  vec3 emis=vec3(0.0);
  float sAmt=0.0,sPow=40.0;
  vec3 sCol=vec3(1.0);
  vec3 alb=SURF(p,ndl,hgt,emis,sAmt,sPow,sCol);
  if(uBump>0.0){
    vec3 dpx=dFdx(vW),dpy=dFdy(vW);
    float dhx=dFdx(hgt),dhy=dFdy(hgt);
    vec3 r1=cross(dpy,N),r2=cross(N,dpx);
    float det=dot(dpx,r1);
    if(abs(det)>1e-9){
      vec3 grad=(r1*dhx+r2*dhy)/det;
      N=normalize(N-uBump*grad);
    }
    ndl=dot(N,L);
  }
  float diff=sstep(-0.05,0.24,ndl);
  vec3 col=alb*diff*uSunI+alb*uAmb;
  if(sAmt>0.0){
    vec3 V=normalize(uCam-vW);
    vec3 H=normalize(L+V);
    float sp=pow(max(dot(N,H),0.0),sPow)*sAmt*sstep(-0.02,0.30,ndl);
    col+=sCol*sp*uSunI*0.55;
  }
#ifdef EARTH_CLOUDS
  col=mix(col,vec3(uSunI)*1.15,gCloud*0.85);
#endif
#ifdef RINGED
  {
    vec4 rp=uRingInv*vec4(vW,1.0);
    vec4 rl=uRingInv*vec4(L,0.0);
    if(abs(rl.y)>1e-4){
      float t=-rp.y/rl.y;
      if(t>0.0){
        float hr=length((rp.xyz+rl.xyz*t).xz);
        col*=exp(-ringDensity(hr,int(uRingKind))*1.45/max(abs(rl.y),0.10));
      }
    }
  }
#endif
  col+=emis;
  outColor=vec4(max(col,0.0),1.0);
}`;
const RINGDENS=`
float ringDensity(float r,int k){
  if(k==0){
    float d=0.0;
    if(r>1.235&&r<1.530) d=0.11;
    if(r>1.525&&r<1.950) d=1.20;
    if(r>2.025&&r<2.270) d=0.58;
    d*=1.0-0.87*(step(1.950,r)*step(r,2.030));
    d*=1.0-0.92*exp(-pow((r-2.214)/0.0045,2.0));
    d*=1.0-0.80*exp(-pow((r-2.265)/0.0018,2.0));
    d+=0.30*exp(-pow((r-2.324)/0.0055,2.0));
    d*=0.70+0.60*fbm(vec3(r*230.0,0.0,0.0),4);
    return max(d,0.0);
  } else if(k==1){
    float d=0.0;
    d+=0.55*exp(-pow((r-1.951)/0.0055,2.0));
    d+=0.20*exp(-pow((r-1.909)/0.0022,2.0));
    d+=0.17*exp(-pow((r-1.863)/0.0020,2.0));
    d+=0.14*exp(-pow((r-1.823)/0.0018,2.0));
    d+=0.11*exp(-pow((r-1.786)/0.0017,2.0));
    d+=0.09*exp(-pow((r-1.751)/0.0016,2.0));
    d+=0.07*exp(-pow((r-1.690)/0.0015,2.0));
    d*=0.72+0.56*fbm(vec3(r*170.0,0.0,0.0),3);
    return d;
  }
  return 0.016*sstep(1.40,1.47,r)*(1.0-sstep(1.74,1.81,r));
}`;
const PLANET_KINDS=['rock','earth','venus','mars','gas','ice','europa','io','gany','titan','pluto','comet'];
function planetProg(kind,opt){
  opt=opt||{};
  let def='';
  if(kind==='earth') def+='#define EARTH_CLOUDS\n';
  if(opt.maria) def+='#define MARIA\n';
  if(opt.grs) def+='#define GRS\n';
  if(opt.hex) def+='#define HEX\n';
  if(opt.spot) def+='#define SPOT\n';
  if(opt.ring) def+='#define RINGED\n';
  const nm='pl_'+kind+(opt.maria?'_m':'')+(opt.grs?'_g':'')+(opt.hex?'_h':'')+(opt.spot?'_s':'')+(opt.ring?'_r':'');
  if(PROGS[nm]) return PROGS[nm];
  return mkProg(nm,SPH_VS,
    '#version 300 es\nprecision highp float;\n#define DEG2 0.017453292519943295\n'+def
    +NOISE+(opt.ring?RINGDENS:'')+PLANET_HEAD+SURF[kind]+PLANET_MAIN);
}

const SUN_FS=`#version 300 es
precision highp float;
#define DEG2 0.017453292519943295
${NOISE}
in vec3 vW,vN,vO;
uniform vec3 uCam;
uniform float uTime,uRadius;
out vec4 outColor;
vec3 rampT(float x){
  vec3 c0=vec3(0.30,0.030,0.000),c1=vec3(0.85,0.160,0.010),c2=vec3(1.00,0.520,0.100),
       c3=vec3(1.00,0.830,0.420),c4=vec3(1.00,0.970,0.880);
  if(x<0.25) return mix(c0,c1,x*4.0);
  if(x<0.50) return mix(c1,c2,(x-0.25)*4.0);
  if(x<0.75) return mix(c2,c3,(x-0.50)*4.0);
  return mix(c3,c4,(x-0.75)*4.0);
}
float rampL(float x){
  float l0=0.09,l1=0.32,l2=0.52,l3=0.75,l4=0.95;
  if(x<0.25) return mix(l0,l1,x*4.0);
  if(x<0.50) return mix(l1,l2,(x-0.25)*4.0);
  if(x<0.75) return mix(l2,l3,(x-0.50)*4.0);
  return mix(l3,l4,(x-0.75)*4.0);
}
void main(){
  vec3 p=normalize(vO);
  vec3 N=normalize(vN);
  vec3 V=normalize(uCam-vW);
  float t=uTime*0.02;
  float limb=0.18+0.82*pow(max(dot(N,V),0.0),0.42);
  float sg=fbm(p*6.5+vec3(0.0,0.0,t),4);
  float f2a,ida; float f1a=worley(p*26.0+vec3(t*0.9,0.0,0.0),f2a,ida);
  float gau=f2a-f1a;
  float f2b,idb; float f1b=worley(p*76.0+vec3(t*1.5,3.0,0.0),f2b,idb);
  float gbu=f2b-f1b;
  float gran=0.55*gau+0.85*gbu;
  float bright=0.56+0.30*(sg-0.5)*2.0+0.52*(gran-0.45);
  float sp=fbm(p*2.6+vec3(31.0,7.0,t*0.06),3);
  float spot=sstep(0.655,0.715,sp);
  float inner=sstep(0.715,0.780,sp);
  float lum=clamp(bright,0.0,1.05)*limb*(1.0-0.52*spot*(0.62+0.38*inner));
  float tmp=clamp(0.62+0.55*(bright-0.56),0.02,0.99);
  tmp*=(0.52+0.48*limb);
  tmp=mix(tmp,tmp*0.45,spot);
  vec3 c=rampT(tmp);
  float cl=rampL(tmp);
  vec3 col=c*(lum/max(cl,0.06))*1.05;
  outColor=vec4(max(col,0.0),1.0);
}`;

const ATMO_FS=`#version 300 es
precision highp float;
float sstep(float a,float b,float x){float t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
in vec3 vW;
uniform vec3 uCam,uCenter,uSunDir,uCol;
uniform float uR,uH,uI,uSunI;
out vec4 outColor;
void main(){
  vec3 rd=normalize(vW-uCam);
  vec3 oc=uCenter-uCam;
  float tca=dot(oc,rd);
  float b=sqrt(max(dot(oc,oc)-tca*tca,0.0))/uR;
  float dens=exp(-max(b-1.0,0.0)/uH);
  dens*=1.0-sstep(1.0,0.960,b)*0.86;
  vec3 an=normalize(uCam+rd*tca-uCenter);
  float ndl=dot(an,normalize(uSunDir));
  float day=sstep(-0.28,0.30,ndl);
  float fwd=pow(max(dot(rd,normalize(uSunDir))*0.5+0.5,0.0),4.0);
  vec3 col=uCol*(day*0.90+0.10)*(0.55+0.90*fwd);
  float a=clamp(dens*uI,0.0,1.0);
  outColor=vec4(max(col*uSunI,0.0),a);
}`;

const RING_VS=`#version 300 es
layout(location=0) in vec3 aPos;
uniform mat4 uVP,uModel;
out vec3 vW; out float vR;

const RING_FS=`#version 300 es
precision highp float;
#define DEG2 0.017453292519943295
${NOISE}
${RINGDENS}
in vec3 vW; in float vR;
uniform vec3 uCam,uN,uL,uCenter,uC1,uC2,uC3;
uniform float uR,uSunI,uRK;
out vec4 outColor;
vec3 ringColor(float r){
  float t=clamp((r-1.20)/1.30,0.0,1.0);
  vec3 c=mix(uC1,uC2,t);
  return mix(c,uC3,sstep(0.55,1.0,t)*0.7);
}
void main(){
  float r=vR;
  float d=ringDensity(r,int(uRK));
  if(d<=0.0008) discard;
  vec3 nrm=normalize(uN);
  vec3 V=normalize(uCam-vW);
  vec3 L=normalize(uL);
  float muv=max(abs(dot(nrm,V)),0.10);
  float mus=max(abs(dot(nrm,L)),0.10);
  float tv=d*1.45/muv;
  float ts=d*1.45/mus;
  float alpha=1.0-exp(-tv);
  float lum;
  if(dot(nrm,V)*dot(nrm,L)>0.0) lum=(1.0-exp(-ts))*0.85;
  else lum=exp(-ts*0.42)*1.15*(1.0-exp(-ts*0.75));
  vec3 oc=vW-uCenter;
  float bb=dot(oc,L);
  float sh=1.0;
  if(bb<0.0){
    float dm=sqrt(max(dot(oc,oc)-bb*bb,0.0));
    sh=sstep(uR*0.97,uR*1.09,dm);
  }
  vec3 base=ringColor(r);
  if(uRK>1.5) base=vec3(0.30,0.30,0.33);
  outColor=vec4(max(base*lum*sh*uSunI,0.0),clamp(alpha,0.0,1.0));
}`;

const RIB_VS=`#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aTan;
layout(location=2) in vec4 aPS;   // side, d(落后量), 宽度系数, 0
uniform mat4 uVP;
uniform vec2 uVp;
uniform float uLW;
out float vS,vD;
void main(){
  vec4 cp=uVP*vec4(aPos,1.0);
  vec4 tp=uVP*vec4(aPos+aTan*0.02,1.0);
  vec2 n0=cp.xy/cp.w;
  vec2 n1=tp.xy/tp.w;
  vec2 sc=(n1-n0)*0.5*uVp;
  vec2 np=vec2(-sc.y,sc.x);
  float ln=length(np);
  np=(ln>1e-6)?np/ln:vec2(1.0,0.0);
  vec2 off=np*(uLW*aPS.x*aPS.z)/(0.5*uVp);
  cp.xy+=off*cp.w;
  gl_Position=cp;
  vS=aPS.x; vD=aPS.y;
}`;

float sstep(float a,float b,float x){float t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}

const BELT_VS=`#version 300 es
layout(location=0) in vec4 aA;   // a, e, I, Om
layout(location=1) in vec4 aB;   // om, M0, n, size
layout(location=2) in vec4 aC;   // rgb, 亮度
uniform mat4 uVP;
uniform float uT,uComp,uScale,uProj;
out vec3 vCol;
void main(){
  float a=aA.x,e=aA.y,I=aA.z,Om=aA.w;
  float om=aB.x,M=aB.y+aB.z*uT;
  M=mod(M,6.283185307);
  if(M>3.141592653) M-=6.283185307;
  if(M<-3.141592653) M+=6.283185307;
  float E=M+e*sin(M)*(1.0+e*cos(M));
  for(int i=0;i<6;i++) E-=(E-e*sin(E)-M)/(1.0-e*cos(E));
  float xp=a*(cos(E)-e);
  float yp=a*sqrt(max(1.0-e*e,0.0))*sin(E);
  float cw=cos(om),sw=sin(om),cO=cos(Om),sO=sin(Om),cI=cos(I),sI=sin(I);
  float x=(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp;
  float y=(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp;
  float z=(sw*sI)*xp+(cw*sI)*yp;
  float r=sqrt(x*x+y*y+z*z);
  vec3 p=vec3(x,z,-y)/r*(uScale*pow(max(r,1e-4),uComp));
  vec4 mv=uVP*vec4(p,1.0);
  gl_Position=mv;
  float dim=aC.w*(0.22+0.78*pow(clamp(1.0/r,0.0,1.0),0.35));
  vCol=aC.rgb*clamp(dim,0.0,1.4);
  gl_PointSize=clamp(aB.w*uProj/max(mv.w,0.001),0.75,4.5);
}`;

function buildSphere(lb,sb){
  const nv=(lb+1)*(sb+1), verts=new Float32Array(nv*6);
  let k=0;
  for(let i=0;i<=lb;i++){
    const th=i*PI/lb, st=Math.sin(th), ct=Math.cos(th);
    for(let j=0;j<=sb;j++){
      const ph=j*TAU/sb;
      const x=st*Math.cos(ph), y=ct, z=st*Math.sin(ph);
      verts[k++]=x;verts[k++]=y;verts[k++]=z;
      verts[k++]=x;verts[k++]=y;verts[k++]=z;
    }
  }
  const idx=new Uint16Array(lb*sb*6);
  let m=0;
  for(let i=0;i<lb;i++)for(let j=0;j<sb;j++){
    const a=i*(sb+1)+j,b=a+1,c=(i+1)*(sb+1)+j,d=c+1;
    idx[m++]=a;idx[m++]=b;idx[m++]=c;
    idx[m++]=b;idx[m++]=d;idx[m++]=c;
  }
  const vao=gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vb=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,vb);
  gl.bufferData(gl.ARRAY_BUFFER,verts,gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,24,0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,3,gl.FLOAT,false,24,12);
  const ib=gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return {vao,count:idx.length};
}
function buildRingGeo(r0,r1,seg){

let gaussSpare=null;
function gauss(){
  if(gaussSpare!==null){const v=gaussSpare;gaussSpare=null;return v;}
  let u,v,s;
  do{u=Math.random()*2-1;v=Math.random()*2-1;s=u*u+v*v;}while(s===0||s>=1);
  const m=Math.sqrt(-2*Math.log(s)/s);
  gaussSpare=v*m; return u*m;
}
const GAPS=[[2.502,0.022,0.93],[2.825,0.016,0.85],[2.958,0.012,0.70],[3.279,0.020,0.90],[2.065,0.010,0.60]];
function mainBeltProb(a){
  let p=1;
  for(const g of GAPS){const d=(a-g[0])/g[1]; p*=1-g[2]*Math.exp(-d*d);}
  const e=(a-2.72)/0.55; p*=Math.exp(-0.5*e*e);
  return p;
}
function meanMotion(aAU){ return TAU/(365.256*Math.pow(aAU,1.5)); }

function genBelt(){
  const arr=[];

    arr.push(a,e,I*DEG,Om*DEG,om*DEG,M0,n,size,c[0],c[1],c[2],b);
  };
  // 主带（拒绝采样挖出柯克伍德空隙）
  let n=0,guard=0;
  while(n<9000&&guard<900000){
    guard++;
    const a=2.06+Math.random()*(3.28-2.06);
    if(Math.random()>mainBeltProb(a)) continue;
    const e=Math.min(0.34,Math.abs(gauss())*0.1117);
    const I=Math.min(26,Math.abs(gauss())*6.38);
    push(a,e,I,Math.random()*360,Math.random()*360,Math.random()*TAU,meanMotion(a),
      0.25+Math.pow(Math.random(),2.2)*1.30,[0.42+0.10*gauss(),0.37+0.09*gauss(),0.33+0.09*gauss()],
      0.50+0.50*Math.random());
    n++;
  }
  // 希尔达族（3:2 共振，三团）
  for(let i=0;i<900;i++){
    const a=3.90+gauss()*0.09;
    const e=0.10+Math.random()*0.20;
    const I=Math.min(20,Math.abs(gauss())*5.5);
    const k=i%3;
    const M0=(240+k*120+gauss()*20)*DEG;
    push(a,e,I,Math.random()*360,Math.random()*360,M0,meanMotion(5.202887)*2/3,
      0.25+Math.pow(Math.random(),2.2)*1.10,[0.44+0.10*gauss(),0.33+0.09*gauss(),0.25+0.08*gauss()],
      0.55+0.45*Math.random());

  // 木星特洛伊群（L4 / L5）
  for(let i=0;i<2000;i++){

    const I=Math.min(30,Math.abs(gauss())*9.0);

    push(a,e,I,Math.random()*360,Math.random()*360,M0,meanMotion(5.202887),
      0.25+Math.pow(Math.random(),2.2)*1.15,[0.46+0.10*gauss(),0.35+0.09*gauss(),0.27+0.08*gauss()],

    else { a=48+Math.random()*32; e=0.15+Math.random()*0.35; I=Math.min(40,Math.abs(gauss())*17.0); }
    push(a,e,I,Math.random()*360,Math.random()*360,Math.random()*TAU,meanMotion(a),
      0.25+Math.pow(Math.random(),2.2)*1.35,[0.40+0.10*gauss(),0.46+0.10*gauss(),0.56+0.10*gauss()],
      0.50+0.50*Math.random());

  const data=new Float32Array(arr);

  const vao=gl.createVertexArray();

function update(dt){

    if(b.isSun){ b.pos[0]=0;b.pos[1]=0;b.pos[2]=0; continue; }

function computeFlare(){
  const sp=SUN.pos;

  const cy=VP[1]*sp[0]+VP[5]*sp[1]+VP[9]*sp[2]+VP[13];
  const cw=VP[3]*sp[0]+VP[7]*sp[1]+VP[11]*sp[2]+VP[15];

  const nx=cx/cw, ny=cy/cw;

  let vis=(Math.abs(nx)<=1&&Math.abs(ny)<=1)?1:0;
  if(vis>0){
    const sd=Math.hypot(camPos[0]-sp[0],camPos[1]-sp[1],camPos[2]-sp[2]);
    for(const b of BODIES){
      if(b.isSun) continue;
      const bd=Math.hypot(camPos[0]-b.pos[0],camPos[1]-b.pos[1],camPos[2]-b.pos[2]);
      if(bd>=sd) continue;
      const bx=VP[0]*b.pos[0]+VP[4]*b.pos[1]+VP[8]*b.pos[2]+VP[12];
      const by=VP[1]*b.pos[0]+VP[5]*b.pos[1]+VP[9]*b.pos[2]+VP[13];
      const bw=VP[3]*b.pos[0]+VP[7]*b.pos[1]+VP[11]*b.pos[2]+VP[15];

    u1(pr,'uTime',S.jd-J2000); u1(pr,'uRadius',b.rDisp);
    u1(pr,'uBump',b.su.bump); u1(pr,'uAmb',b.su.amb);
    u3v(pr,'uC1',b.su.c1); u3v(pr,'uC2',b.su.c2); u3v(pr,'uC3',b.su.c3);
    u1(pr,'uSeed',b.su.seed); u1(pr,'uTwist',b.su.twist); u1(pr,'uHex',0);
    u1(pr,'uSpot',0); u1(pr,'uMaria',0); u1(pr,'uAlb',b.su.alb);
    if(b.def.ring){ uM4(pr,'uRingInv',b.ringInv); u1(pr,'uRingKind',b.def.ring.kind); }
    gl.drawElements(gl.TRIANGLES,sphereG.count,gl.UNSIGNED_SHORT,0);
  }

  /* 5. 轨道缎带 + 彗尾 */
  buildOrbits();
  buildComet();
  const wantRib=S.show.orbits||(S.show.comet&&cometRanges);
  if(wantRib){
    depthState(true,false); blendMode('add');
    gl.bindVertexArray(ribVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER,ribVB);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,ribData.subarray(0,RIB.n*RIBV));
    const pr=P.rib;
    gl.useProgram(pr.p);
    uM4(pr,'uVP',VP); u2v(pr,'uVp',[W,H]); u1(pr,'uLW',1.2);
    if(S.show.orbits){
      for(const r of ribRanges){
        let col,base,peak,k;
        if(r.moon){ col=[0.30,0.38,0.52]; base=0.0; peak=0.12; k=1.0; }
        else if(r.comet){ col=[0.30,0.72,0.85]; base=0.05; peak=0.55; k=2.6; }
        else { col=hexRGB(r.b.col); base=0.055; peak=0.34; k=2.2; }
        u3v(pr,'uCol',col); u1(pr,'uBase',base); u1(pr,'uPeak',peak); u1(pr,'uK',k);
        gl.drawArrays(gl.TRIANGLE_STRIP,r.start,r.count);
      }
    }
    /* 5b. 彗尾 */
    if(S.show.comet&&cometRanges){
      for(const c of cometRanges){
        u3v(pr,'uCol',c.ion?[0.42,0.66,1.0]:[1.0,0.82,0.48]);
        u1(pr,'uBase',0.0); u1(pr,'uPeak',c.ion?0.95:0.72); u1(pr,'uK',1.0);
        gl.drawArrays(gl.TRIANGLE_STRIP,c.r.start,c.r.count);
      }
    }
  }

  /* 6. 小行星带 */
  if(S.show.belts){
    depthState(true,false); blendMode('add');
    gl.useProgram(P.belt.p);
    uM4(P.belt,'uVP',VP); u1(P.belt,'uT',S.jd-J2000); u1(P.belt,'uComp',S.compress);
    u1(P.belt,'uScale',SCALE); u1(P.belt,'uProj',H/(2*Math.tan(FOV/2)));
    gl.bindVertexArray(BELT.vao);
    gl.drawArrays(gl.POINTS,0,BELT.count);
  }

  /* 7. 环系 */
  depthState(true,false); blendMode('alpha'); gl.disable(gl.CULL_FACE);
  for(const b of BODIES){
    if(!b.def.ring) continue;
    const rg=b.ringGeo;
    const pr=P.ring;
    gl.useProgram(pr.p);
    uM4(pr,'uVP',VP); uM4(pr,'uModel',b.ringModel);
    u3v(pr,'uCam',camPos); u3v(pr,'uN',b.axis);
    u3(pr,'uL',-b.pos[0],-b.pos[1],-b.pos[2]);
    u3v(pr,'uCenter',b.pos);
    u3v(pr,'uC1',b.def.ring.c1); u3v(pr,'uC2',b.def.ring.c2); u3v(pr,'uC3',b.def.ring.c3);
    u1(pr,'uR',b.rDisp); u1(pr,'uSunI',sunIntensity(b)); u1(pr,'uRK',b.def.ring.kind);
    gl.bindVertexArray(rg.vao);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,rg.count);
  }

  /* 8. 彗发 */
  if(S.show.comet&&cometRanges){
    blendMode('add'); depthState(true,false);
    const h=BODYMAP.halley;
    const sc=(3/h.rAU)*(3/h.rAU);
    drawBB(h.pos,0.55+0.5*sc,camRight,camUp,1,0,clamp(0.9*sc,0.10,1.8),[0.55,0.80,0.75],1);
  }

  /* 9. 大气 */
  depthState(true,false); blendMode('alpha'); gl.enable(gl.CULL_FACE);
  for(const b of BODIES){
    if(!b.def.atm) continue;
    const a=b.def.atm;
    const pr=P.atmo;
    gl.useProgram(pr.p);
    uM4(pr,'uVP',VP); uM4(pr,'uModel',b.atmModel);
    u3v(pr,'uCam',camPos); u3v(pr,'uCenter',b.pos);
    u3(pr,'uSunDir',-b.pos[0],-b.pos[1],-b.pos[2]);
    u1(pr,'uR',b.rDisp); u1(pr,'uH',a.h); u1(pr,'uI',a.i); u1(pr,'uSunI',sunIntensity(b));
    u3v(pr,'uCol',a.col);
    gl.bindVertexArray(sphereG.vao);
    gl.drawElements(gl.TRIANGLES,sphereG.count,gl.UNSIGNED_SHORT,0);
  }

  /* 10. 日冕 */
  depthState(true,false); blendMode('add'); gl.disable(gl.CULL_FACE);
  drawBB(SUN.pos,SUN.rDisp*3.1,camRight,camUp,0,1/3.1,1.0,[1.0,0.82,0.55],1.0);
  drawBB(SUN.pos,SUN.rDisp*9.0,camRight,camUp,0,1/9.0,0.32,[1.0,0.72,0.42],1.0);

  /* MSAA 解析 */
  if(RT.msaaFB){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,RT.msaaFB);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,RT.sceneFB);
    gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  depthState(false,false); blendMode(null);
  gl.disable(gl.CULL_FACE);          // 全屏三角形：NDC 逆时针在窗口坐标下是背面

  /* 泛光 */
  if(S.show.bloom){
    gl.useProgram(P.pre.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,RT.sceneTex);
    ui1(P.pre,'uSrc',0);
    u1(P.pre,'uThr',RT.hdr?1.25:0.72); u1(P.pre,'uKnee',RT.hdr?0.6:0.35);
    gl.bindFramebuffer(gl.FRAMEBUFFER,RT.bloom[0].fb);
    gl.viewport(0,0,RT.bloom[0].w,RT.bloom[0].h);
    u2v(P.pre,'uTS',[1/W,1/H]);
    gl.bindVertexArray(quadG.vao);
    gl.drawArrays(gl.TRIANGLES,0,3);
    for(let i=1;i<6;i++){
      const src=RT.bloom[i-1];
      gl.bindFramebuffer(gl.FRAMEBUFFER,RT.bloom[i].fb);
      gl.viewport(0,0,RT.bloom[i].w,RT.bloom[i].h);
      gl.bindTexture(gl.TEXTURE_2D,src.t);
      u2v(P.pre,'uTS',[1/src.w,1/src.h]);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
    gl.useProgram(P.up.p);
    for(let i=5;i>=1;i--){
      const src=RT.bloom[i];
      gl.bindFramebuffer(gl.FRAMEBUFFER,RT.bloom[i-1].fb);
      gl.viewport(0,0,RT.bloom[i-1].w,RT.bloom[i-1].h);
      gl.bindTexture(gl.TEXTURE_2D,src.t);
      u2v(P.up,'uTS',[1/src.w,1/src.h]);
      ui1(P.up,'uSrc',0);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }
    gl.disable(gl.BLEND);
  }
  /* 合成 */
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.disable(gl.CULL_FACE);
  gl.useProgram(P.comp.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,RT.sceneTex); ui1(P.comp,'uScene',0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,RT.bloom[0].t); ui1(P.comp,'uBloom',1);
  u1(P.comp,'uExp',1.0);
  u1(P.comp,'uBloomStr',S.show.bloom?(RT.hdr?0.34:0.22):0.0);
  u1(P.comp,'uTime',S.jd);
  u1(P.comp,'uHDR',RT.hdr?1:0);
  u1(P.comp,'uCA',0.0075);
  u2(P.comp,'uFlare',FLARE.x,FLARE.y);
  u1(P.comp,'uFlareVis',FLARE.vis*0.9);
  u1(P.comp,'uFlareR',FLARE.r);
  gl.bindVertexArray(quadG.vao);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.activeTexture(gl.TEXTURE0);
}

const labelEls={};
function buildList(){

    return d;
  };
  grp('恒星');

  grp('行星');
  for(const id of ['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune']){
    item(BODYMAP[id]);
    for(const m of BODYMAP[id].moons) item(m,true);
  }
  grp('矮行星 / 彗星');

  item(BODYMAP.halley);
}
function refreshList(){
  const items=$('list').querySelectorAll('.item');
  for(const it of items) it.classList.toggle('sel',it.dataset.id===S.focus);
}
function buildLabels(){
  const c=$('labels');
  for(const b of BODIES){
    const d=document.createElement('div');
    d.className='lb'+(b.parent?' moon':'');
    d.innerHTML='<span class="ld"></span><span>'+b.name+'</span>';
    c.appendChild(d);
    labelEls[b.id]=d;
  }
}
function updateLabels(){
  const sx=window.innerWidth/Math.max(RT.w,1), sy=window.innerHeight/Math.max(RT.h,1);
  if(!S.show.labels){
    for(const k in labelEls) labelEls[k].style.opacity='0';
    return;
  }
  const cands=[];
  for(const b of BODIES){
    const el=labelEls[b.id];
    const w=VP[3]*b.pos[0]+VP[7]*b.pos[1]+VP[11]*b.pos[2]+VP[15];
    if(w<=1e-4){ el.style.opacity='0'; continue; }
    const nx=(VP[0]*b.pos[0]+VP[4]*b.pos[1]+VP[8]*b.pos[2]+VP[12])/w;
    const ny=(VP[1]*b.pos[0]+VP[5]*b.pos[1]+VP[9]*b.pos[2]+VP[13])/w;
    if(nx<-1.1||nx>1.1||ny<-1.1||ny>1.1){ el.style.opacity='0'; continue; }
    const dcam=Math.hypot(camPos[0]-b.pos[0],camPos[1]-b.pos[1],camPos[2]-b.pos[2]);
    const pr=b.rDisp/Math.max(dcam,0.001)/Math.tan(FOV/2)*Math.min(sx,sy);
    let a=sstep(3.0,10.0,pr*Math.min(RT.w,RT.h));
    if(b.parent&&!S.show.moons) a=0;
    if(a<=0.015){ el.style.opacity='0'; continue; }
    cands.push({b,el,x:nx*0.5*window.innerWidth+window.innerWidth*0.5,
                y:(0.5-ny*0.5)*window.innerHeight,
                a,pr,w:el.offsetWidth||44,h:el.offsetHeight||14});
  }
  cands.sort((p,q)=>{
    const pf=(p.b.id===S.focus)?2:(p.b.parent?0:1);
    const qf=(q.b.id===S.focus)?2:(q.b.parent?0:1);
    if(qf!==pf) return qf-pf;
    return q.pr-p.pr;
  });
  const placed=[];
  for(const c of cands){
    let ok=true;
    for(const p of placed){
      if(Math.abs(c.x-p.x)<(c.w+p.w)*0.5+5 && Math.abs(c.y-p.y)<(c.h+p.h)*0.5+2){ ok=false; break; }
    }
    if(!ok){ c.el.style.opacity='0'; continue; }
    placed.push(c);
    c.el.style.opacity=c.a.toFixed(2);
    c.el.style.transform='translate(-4px,-50%) translate('+c.x.toFixed(1)+'px,'+c.y.toFixed(1)+'px)';
  }
}
/* ---------- 信息面板 ---------- */
function num(v,d){ return (v===undefined||!isFinite(v))?'—':v.toFixed(d); }
function infoPanel(){
  const b=BODYMAP[S.focus];
  if(!b) return;
  $('rname').textContent=b.name;
  $('rtag').textContent=b.def.tag||'';
  const rt=[],rs=[];
  const e=BODYMAP.earth;
  const dEarth=Math.hypot(b.pos[0]-e.pos[0],b.pos[1]-e.pos[1],b.pos[2]-e.pos[2]);
  const lt=dEarth/C_KMS/86400;
  if(b.isSun){
    rt.push(['自转周期','25.38 天（赤道）']);
    rt.push(['与地球距离',num(dEarth,3)+' AU']);
    rt.push(['光行时',num(lt*60,1)+' 分钟']);
    rt.push(['黄道坐标','—']);
  } else if(b.parent){
    const dp=Math.hypot(b.pos[0]-b.parent.pos[0],b.pos[1]-b.parent.pos[1],b.pos[2]-b.parent.pos[2]);
    rt.push(['与母行星距离',num(b.def.a,0)+' km（显示 '+num(dp,2)+'）']);
    rt.push(['与地球距离',num(dEarth,3)+' AU / '+num(dEarth*AU_KM/1e6,2)+' 百万 km']);
    rt.push(['光行时',num(lt*3600,1)+' 秒']);
    rt.push(['公转周期',b.def.period<0?Math.abs(b.def.period).toFixed(4)+' 天（逆行）':b.def.period.toFixed(4)+' 天']);
  } else {
    rt.push(['日心距离',num(b.rAU,4)+' AU / '+num(b.rAU*AU_KM/1e6,3)+' 百万 km']);
    rt.push(['日心黄经',num(b.lon,3)+'°']);
    rt.push(['日心黄纬',num(b.lat,3)+'°']);
    rt.push(['与地球距离',num(dEarth,3)+' AU / '+num(dEarth*AU_KM/1e6,2)+' 百万 km']);
    rt.push(['光行时',num(lt*3600,1)+' 秒']);
    rt.push(['近心点 / 远心点',num(b.aAU*(1-b.ecc),3)+' / '+num(b.aAU*(1+b.ecc),3)+' AU']);
    rt.push(['当前轨道速度',num(b.speed,3)+' km/s']);
  }
  const d=b.def;
  rs.push(['赤道半径',(d.radius>=1000?Math.round(d.radius).toLocaleString('en-US'):d.radius)+' km']);
  if(d.mass) rs.push(['质量',d.mass]);
  rs.push(['公转周期',d.period]);
  if(d.nmoon&&d.nmoon!=='0') rs.push(['卫星数',d.nmoon]);
  if(d.temp) rs.push(['表面 / 云顶温度',d.temp]);
  if(!b.isSun){
    if(b.parent){
      rs.push(['轨道倾角（母行星赤道）',num(Math.abs(d.inc),3)+'°'+(d.period<0?' · 逆行公转':'')]);
    }else{
      rs.push(['轨道偏心率',num(b.ecc,5)]);
      rs.push(['轨道倾角（黄道）',num(Math.abs(d.I),3)+'°']);
      rs.push(['轨道半长轴',num(b.aAU,4)+' AU']);
    }
  }
  if(d.rotH!==undefined&&isFinite(d.rotH)) rs.push(['自转周期',b.isSun?'25.38 天':(Math.abs(d.rotH)<48?Math.abs(d.rotH).toFixed(3)+' 小时':(Math.abs(d.rotH)/24).toFixed(2)+' 天')+(d.rotH<0?'（逆行）':'')]);
  if(d.tiltTxt&&d.tiltTxt!=='—') rs.push(['转轴倾角',d.tiltTxt]);
  rs.push(['反照率',num(d.alb,2)]);
  const grid=(arr)=>'<div class="rg">'+arr.map(r=>'<div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div>').join('')+'</div>';
  $('rt').innerHTML=grid(rt);
  $('rs').innerHTML=grid(rs);
  $('ra').textContent=d.atmo||'—';
  $('rd').textContent=d.desc||'';
  $('rw').style.display=(S.jd<2378495.5||S.jd>2469819.5)?'block':'none';
}

function setSpeedV(v){
  S.speedV=clamp(v,-100,100);
  const a=Math.abs(S.speedV)/100;
  S.dps=Math.sign(S.speedV)*1.157407e-5*Math.pow(10,a*8.55);
  $('speed').value=S.speedV;
  $('sv').textContent=fmtSpeed(S.dps);
}
function updateHUD(){

  const yr=(S.jd-2451545)/365.25+2000;
  $('hudf').textContent='帧率 '+FPS.toFixed(0)+' fps · 分辨率 '+RT.w+'×'+RT.h+
    ' · 模拟年份 '+yr.toFixed(2)+' · 比例 r^'+S.compress.toFixed(3);
}
function setupUI(){
  buildList(); buildLabels();
  $('play').addEventListener('click',()=>{
    S.paused=!S.paused;
    $('play').textContent=S.paused?'▶':'❚❚';
  });
  $('now').addEventListener('click',()=>{ S.jd=jdNow(); });
  $('speed').addEventListener('input',e=>setSpeedV(parseFloat(e.target.value)));
  $('dateset').addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const jd=parseDate(e.target.value);
      if(jd!==null){ S.jd=jd; e.target.blur(); }
      else e.target.value='';
    }
  });
  $('chips').addEventListener('click',e=>{
    const t=e.target.closest('.chip'); if(!t) return;
    const k=t.dataset.k;
    if(k==='real'){
      S.show.real=!S.show.real;
      S.compressT=S.show.real?1.0:0.62;
    } else S.show[k]=!S.show[k];
    t.classList.toggle('on',!!S.show[k=== 'real'?'real':k]);
  });
  setSpeedV(0);
  // 指针交互
  const ptrs=new Map();
  let pinchD=0, downX=0, downY=0, moved=0, downT=0;
  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){ downX=e.clientX; downY=e.clientY; moved=0; downT=performance.now(); canvas.classList.add('drag'); }
    if(ptrs.size===2){
      const a=[...ptrs.values()];
      pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    }
  });
  canvas.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);
    if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    p.x=e.clientX; p.y=e.clientY;
    moved+=Math.abs(dx)+Math.abs(dy);
    if(ptrs.size===1){
      S.yaw-=dx*0.0052;
      S.pitch=clamp(S.pitch+dy*0.0052,-1.52,1.52);
    } else if(ptrs.size===2){
      const a=[...ptrs.values()];
      const nd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinchD>0) S.distT=clamp(S.distT*(pinchD/Math.max(nd,1)),0.35,6000);
      pinchD=nd;
    }
  });
  const up=e=>{
    if(ptrs.has(e.pointerId)){
      ptrs.delete(e.pointerId);
      if(ptrs.size===0) canvas.classList.remove('drag');
      if(ptrs.size<2) pinchD=0;
    }
  };
  canvas.addEventListener('pointerup',e=>{
    if(ptrs.size===1&&moved<6&&performance.now()-downT<500){
      const nx=(e.clientX/window.innerWidth)*2-1;
      const ny=1-(e.clientY/window.innerHeight)*2;
      const b=pick(nx,ny);
      if(b){ focusBody(b.id); refreshList(); }
    }
    up(e);
  });
  canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    S.distT=clamp(S.distT*Math.exp(e.deltaY*0.0011),0.35,6000);
  },{passive:false});
  window.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT') return;
    if(e.code==='Space'){ e.preventDefault(); $('play').click(); }
    else if(e.key==='ArrowRight') setSpeedV(S.speedV+ (e.shiftKey?10:4));
    else if(e.key==='ArrowLeft') setSpeedV(S.speedV- (e.shiftKey?10:4));
    else if(e.key==='h'||e.key==='H') document.body.classList.toggle('hideui');
  });
}
function pick(cx,cy){
  let best=null,bestD=1e9;
  for(const b of BODIES){
    const w=VP[3]*b.pos[0]+VP[7]*b.pos[1]+VP[11]*b.pos[2]+VP[15];
    if(w<=1e-4) continue;
    const nx=(VP[0]*b.pos[0]+VP[4]*b.pos[1]+VP[8]*b.pos[2]+VP[12])/w;
    const ny=(VP[1]*b.pos[0]+VP[5]*b.pos[1]+VP[9]*b.pos[2]+VP[13])/w;
    const dcam=Math.hypot(camPos[0]-b.pos[0],camPos[1]-b.pos[1],camPos[2]-b.pos[2]);
    const pr=b.rDisp/Math.max(dcam,0.001)/Math.tan(FOV/2);
    const px=(nx-cx)*RT.w*0.5, py=(ny-cy)*RT.h*0.5;
    const thr=Math.max(24,pr*RT.h*0.5*1.7);
    if(Math.hypot(px,py)<thr&&dcam<bestD){ best=b; bestD=dcam; }
  }
  return best;
}

let FPS=60,lastUI=0;
function init(){
  buildBodies();
  setupMoonDistances();
  for(const m of BODIES) if(m.parent) m.ph0=Math.random()*TAU;
  for(const b of BODIES){
    if(!b.isSun&&!b.parent){
      const rotDays=b.def.rotH/24;
      b.phase=((S.jd-J2000)/rotDays*TAU)%TAU;
    } else if(b.isSun){
      b.phase=((S.jd-J2000)/(SUN_DEF.rotH/24)*TAU)%TAU;
    }
  }
  RT.msaa=MAXS;
  RT.w=Math.max(2,Math.round(window.innerWidth*Math.min(window.devicePixelRatio||1,2)));
  RT.h=Math.max(2,Math.round(window.innerHeight*Math.min(window.devicePixelRatio||1,2)));
  canvas.width=RT.w; canvas.height=RT.h;
  buildRT();
  buildPrograms();
  sphereG=buildSphere(44,72);
  quadG=buildQuad();
  bbG=buildBBQuad();
  for(const b of BODIES) if(b.def.ring) b.ringGeo=buildRingGeo(b.def.ring.r0,b.def.ring.r1,192);
  genBelt();
  genStars(11000);
  setupUI();
  focusBody('sun');
  S.dist=360; S.distT=360;
  update(0);
  render();
  updateHUD();
  requestAnimationFrame(frame);
}
let lastT=performance.now(),fAcc=0,fN=0,fCool=0;
function frame(now){
  requestAnimationFrame(frame);
  const dtRaw=(now-lastT)/1000;
  lastT=now;
  const dt=Math.min(dtRaw,0.1);
  update(dt);
  render();
  updateLabels();
  if(now-lastUI>90){ lastUI=now; updateHUD(); }
  FPS=FPS*0.9+(1/Math.max(dtRaw,1e-4))*0.1;
  fAcc+=dtRaw; fN++;
  if(fN>=50&&fCool<=0){
    const avg=fAcc/fN;
    if(avg>0.0215&&RT.scale>0.6){ RT.scale=Math.max(0.6,RT.scale*0.87); fCool=140; }
    else if(avg<0.0155&&RT.scale<1){ RT.scale=Math.min(1,RT.scale+0.03); fCool=140; }
    fAcc=0; fN=0;
  }
  if(fCool>0) fCool--;
}
init();
})();
</script>
