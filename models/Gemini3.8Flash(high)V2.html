    // --- 开普勒动力学解算器 ---
    function solveKepler(M, e) {
      M = M % (Math.PI * 2);
      if (M < -Math.PI) M += Math.PI * 2;
      if (M > Math.PI) M -= Math.PI * 2;
      
      let E = e > 0.8 ? Math.PI : M;
      for (let iter = 0; iter < 15; iter++) {
        const dE = (M - (E - e * Math.sin(E))) / (1.0 - e * Math.cos(E));
        E += dE;
        if (Math.abs(dE) < 1e-7) break;
      }
      return E;
    }

    function getHeliocentricPositionByE(data, E) {
      const a = data.a;
      const e = data.e;
      const xp = a * (Math.cos(E) - e);
      const yp = a * Math.sqrt(1.0 - e * e) * Math.sin(E);

      const Om = data.Om * DEG2RAD;
      const inc = data.i * DEG2RAD;
      const w = data.w * DEG2RAD;

      const cosOm = Math.cos(Om), sinOm = Math.sin(Om);
      const cosi = Math.cos(inc), sini = Math.sin(inc);
      const cosw = Math.cos(w), sinw = Math.sin(w);

      const Px = cosOm * cosw - sinOm * sinw * cosi;
      const Py = sinOm * cosw + cosOm * sinw * cosi;
      const Pz = sinw * sini;

      const Qx = -cosOm * sinw - sinOm * cosw * cosi;
      const Qy = -sinOm * sinw + cosOm * cosw * cosi;
      const Qz = cosw * sini;

      const x = xp * Px + yp * Qx;
      const y = xp * Py + yp * Qy;
      const z = xp * Pz + yp * Qz;

      return new THREE.Vector3(x, z, -y);
    }

    function getKeplerPosition(data, tDays) {
      if (!data.a) return new THREE.Vector3(0, 0, 0);
      const M = (data.M0 * DEG2RAD) + (2 * Math.PI / data.period) * tDays;
      const E = solveKepler(M, data.e);
      return getHeliocentricPositionByE(data, E);

    function mapDistance(au, isTrueScale) {

      const r = posAU.length();
      if (r < 1e-6) return new THREE.Vector3(0, 0, 0);
      const mappedR = mapDistance(r, isTrueScale);
      return posAU.clone().normalize().multiplyScalar(mappedR);

    // --- 二维插值 Value Noise 与 FBM 发生器 ---
    function hash2d(x, y) {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function noise2d(x, y) {
      const i = Math.floor(x);
      const j = Math.floor(y);
      const fx = x - i;
      const fy = y - j;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);

      const a = hash2d(i, j);
      const b = hash2d(i + 1, j);
      const c = hash2d(i, j + 1);
      const d = hash2d(i + 1, j + 1);

      return a * (1.0 - ux) * (1.0 - uy) +
             b * ux * (1.0 - uy) +
             c * (1.0 - ux) * uy +
             d * ux * uy;
    }

    function fbm(x, y, oct = 5) {
      let val = 0.0;
      let amp = 0.5;
      let freq = 1.0;
      for (let i = 0; i < oct; i++) {
        val += noise2d(x * freq, y * freq) * amp;
        freq *= 2.02;
        amp *= 0.5;
      }
      return val;
    }

    function createProceduralTexture(width, height, fn) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;
      for (let y = 0; y < height; y++) {
        const ny = y / height;
        for (let x = 0; x < width; x++) {
          const nx = x / width;
          const [r, g, b, a] = fn(nx, ny, x, y);
          const idx = (y * width + x) * 4;
          data[idx] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;
          data[idx + 3] = a !== undefined ? a : 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // 1. 地球地表与海洋

      const coast = Math.max(0, 0.48 - continent) / 0.12;
      const seaR = Math.floor(10 + coast * 15);
      const seaG = Math.floor(45 + coast * 35);
      const seaB = Math.floor(125 + coast * 25);
      return [seaR, seaG, seaB];

    // 5. 土星光环纹理
    function createSaturnRingTexture() {

        d[idx + 1] = Math.floor(lum * 0.91);
        d[idx + 2] = Math.floor(lum * 0.77);

    // --- 太阳多层耀斑着色器 ---
    const SunShader = {
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vPosition;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vPosition = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);

      `,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vPosition;

        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        float snoise(vec3 v) {
          const vec2 C = vec2(1.0/6.0, 1.0/3.0);
          const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
          vec3 i  = floor(v + dot(v, C.yyy) );
          vec3 x0 = v - i + dot(i, C.xxx) ;
          vec3 g = step(x0.yzx, x0.xyz);
          vec3 l = 1.0 - g;
          vec3 i1 = min( g.xyz, l.zxy );
          vec3 i2 = max( g.xyz, l.zxy );
          vec3 x1 = x0 - i1 + C.xxx;
          vec3 x2 = x0 - i2 + C.yyy;
          vec3 x3 = x0 - D.yyy;
          i = mod289(i);
          vec4 p = permute( permute( permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                  + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                  + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
          float n_ = 0.142857142857;
          vec3  ns = n_ * D.wyz - D.xzx;
          vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
          vec4 x_ = floor(j * ns.z);
          vec4 y_ = floor(j - 7.0 * x_ );
          vec4 x = x_ *ns.x + ns.yyyy;
          vec4 y = y_ *ns.x + ns.yyyy;
          vec4 h = 1.0 - abs(x) - abs(y);
          vec4 b0 = vec4( x.xy, y.xy );
          vec4 b1 = vec4( x.zw, y.zw );
          vec4 s0 = floor(b0)*2.0 + 1.0;
          vec4 s1 = floor(b1)*2.0 + 1.0;
          vec4 sh = -step(h, vec4(0.0));
          vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
          vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
          vec3 p0 = vec3(a0.xy,h.x);
          vec3 p1 = vec3(a0.zw,h.y);
          vec3 p2 = vec3(a1.xy,h.z);
          vec3 p3 = vec3(a1.zw,h.w);
          vec4 norm = inversesqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
          p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
          vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
          m = m * m;
          return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
        }

        void main() {
          vec3 normal = normalize(vNormal);
          vec3 viewDir = vec3(0.0, 0.0, 1.0);
          float rim = 1.0 - max(dot(normal, viewDir), 0.0);

          vec3 pos = vPosition * 0.15;
          float n1 = snoise(pos + vec3(uTime * 0.08, 0.0, 0.0));
          float n2 = snoise(pos * 2.5 - vec3(0.0, uTime * 0.12, 0.0));
          float turb = n1 * 0.65 + n2 * 0.35;

          vec3 colCore = vec3(1.0, 0.98, 0.9);
          vec3 colMid  = vec3(1.0, 0.68, 0.15);
          vec3 colDark = vec3(0.9, 0.25, 0.02);

          vec3 color = mix(colCore, colMid, turb * 0.6 + rim * 0.4);
          color = mix(color, colDark, clamp(pow(rim, 2.0) * 1.2, 0.0, 1.0));
          color += vec3(1.0, 0.55, 0.1) * pow(rim, 3.0) * 1.2;

          gl_FragColor = vec4(color * 1.45, 1.0);
        }
      `
    };

    const CoronaShader = {

    const EarthShader = {

        varying vec3 vNormal;
        varying vec3 vWorldPosition;

        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        varying vec3 vViewDir;

        void main() {
          vec3 sunDir = normalize(uSunPos - vWorldPosition);
          float NdotL = dot(vNormal, sunDir);
          float dayFactor = smoothstep(-0.08, 0.25, NdotL);

          vec3 dayColor = texture2D(tDay, vUv).rgb;
          vec3 nightColor = texture2D(tNight, vUv).rgb * 1.8;

          vec3 reflectDir = reflect(-sunDir, vNormal);
          float spec = pow(max(dot(vViewDir, reflectDir), 0.0), 32.0);
          bool isOcean = (dayColor.b > dayColor.r && dayColor.b > dayColor.g);

          gl_FragColor = vec4(finalColor, 1.0);

    const SaturnRingShader = {

    function createCometTail() {
      const particleCount = 420;

      geom.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));

        uniforms: {
          uSunPos: { value: new THREE.Vector3(0, 0, 0) },

        vertexShader: `
          attribute float aSeed;
          uniform vec3 uSunPos;
          uniform vec3 uHeadPos;
          varying float vLife;

          void main() {
            vec3 sunDir = normalize(uHeadPos - uSunPos);
            float distFromHead = aSeed * 55.0;
            vec3 offset = sunDir * distFromHead;

            float spread = pow(aSeed, 1.45) * 4.2;
            offset += vec3(sin(aSeed * 35.0), cos(aSeed * 25.0), sin(aSeed * 18.0)) * spread;

            vec3 worldP = uHeadPos + offset;

        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      geom.setAttribute('color', new THREE.BufferAttribute(col, 3));

      const mat = new THREE.PointsMaterial({
        size: 2.2,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        sizeAttenuation: false
      });
      group.add(new THREE.Points(geom, mat));

      const mwCount = 4000;
      const mwGeom = new THREE.BufferGeometry();
      const mwPos = new Float32Array(mwCount * 3);
      const mwCol = new Float32Array(mwCount * 3);

      for (let i = 0; i < mwCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = 95000 + (Math.random() - 0.5) * 16000;
        const h = (Math.random() - 0.5) * 14000;

        const x = r * Math.cos(angle);
        const y = h;
        const z = r * Math.sin(angle);

        const rad = 60 * DEG2RAD;
        mwPos[i * 3] = x;
        mwPos[i * 3 + 1] = y * Math.cos(rad) - z * Math.sin(rad);
        mwPos[i * 3 + 2] = y * Math.sin(rad) + z * Math.cos(rad);

        mwCol[i * 3] = 0.38 + Math.random() * 0.25;
        mwCol[i * 3 + 1] = 0.48 + Math.random() * 0.25;
        mwCol[i * 3 + 2] = 0.82 + Math.random() * 0.25;
      }

      mwGeom.setAttribute('position', new THREE.BufferAttribute(mwPos, 3));
      mwGeom.setAttribute('color', new THREE.BufferAttribute(mwCol, 3));

      const mwMat = new THREE.PointsMaterial({
        size: 3.6,
        vertexColors: true,
        transparent: true,
        opacity: 0.38,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: false
      });
      group.add(new THREE.Points(mwGeom, mwMat));

      return group;
    }
    scene.add(createDeepSpaceStarfield());

    function createAsteroidBelt(count, innerAU, outerAU, colorHex, size) {
      const geom = new THREE.DodecahedronGeometry(size, 0);
      const mat = new THREE.MeshStandardMaterial({
        color: colorHex,
        roughness: 0.9,
        metalness: 0.1
      });
      const instancedMesh = new THREE.InstancedMesh(geom, mat, count);
      const dummy = new THREE.Object3D();
      const asteroids = [];

      for (let i = 0; i < count; i++) {
        const a = innerAU + Math.random() * (outerAU - innerAU);
        const e = Math.random() * 0.12;
        const inc = (Math.random() - 0.5) * 7.0 * DEG2RAD;
        const Om = Math.random() * 360.0 * DEG2RAD;
        const w = Math.random() * 360.0 * DEG2RAD;
        const M0 = Math.random() * 360.0 * DEG2RAD;
        const period = Math.pow(a, 1.5) * 365.25;
        const scale = 0.45 + Math.random() * 0.7;

        asteroids.push({ a, e, inc, Om, w, M0, period, scale });
      }

      instancedMesh.userData = { asteroids, dummy };
      return instancedMesh;
    }

    const asteroidBelt = createAsteroidBelt(1800, 2.15, 3.25, 0x8a7e72, 0.22);
    scene.add(asteroidBelt);

    const kuiperBelt = createAsteroidBelt(2200, 30.0, 48.0, 0x5a6d7c, 0.32);
    scene.add(kuiperBelt);

    const celestialObjects = {};
    const orbitLines = new THREE.Group();
    scene.add(orbitLines);

    // 1. 太阳
    const sunGeom = new THREE.SphereGeometry(CELESTIAL_DATA.sun.size, 64, 64);
    const sunMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }
      },
      vertexShader: SunShader.vertexShader,
      fragmentShader: SunShader.fragmentShader
    });
    const sunMesh = new THREE.Mesh(sunGeom, sunMat);
    scene.add(sunMesh);

    const coronaGeom = new THREE.SphereGeometry(CELESTIAL_DATA.sun.size * 1.28, 32, 32);
    const coronaMat = new THREE.ShaderMaterial({
      uniforms: {
        uCamDist: { value: 500.0 },
        uSize: { value: CELESTIAL_DATA.sun.size * 1.28 }
      },
      vertexShader: CoronaShader.vertexShader,
      fragmentShader: CoronaShader.fragmentShader,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false
    });
    const coronaMesh = new THREE.Mesh(coronaGeom, coronaMat);
    sunMesh.add(coronaMesh);

    celestialObjects['sun'] = {
      mesh: sunMesh,
      data: CELESTIAL_DATA.sun,
      posAU: new THREE.Vector3(0, 0, 0)
    };

    // 2. 行星
    Object.keys(CELESTIAL_DATA).forEach((key) => {
      if (key === 'sun') return;
      const data = CELESTIAL_DATA[key];

      const group = new THREE.Group();
      scene.add(group);

      let mainMesh;
      let cloudMesh = null;

      if (key === 'earth') {
        const earthGeom = new THREE.SphereGeometry(data.size, 48, 48);
        const earthCustomMat = new THREE.ShaderMaterial({
          uniforms: {
            tDay: { value: earthDayTex },
            tNight: { value: earthNightTex },
            uSunPos: { value: new THREE.Vector3(0, 0, 0) }
          },
          vertexShader: EarthShader.vertexShader,
          fragmentShader: EarthShader.fragmentShader
        });
        mainMesh = new THREE.Mesh(earthGeom, earthCustomMat);

        const cloudGeom = new THREE.SphereGeometry(data.size * 1.018, 48, 48);
        const cloudCustomMat = new THREE.MeshStandardMaterial({
          map: earthCloudTex,
          transparent: true,
          opacity: 0.88,
          blending: THREE.NormalBlending,
          depthWrite: false
        });
        cloudMesh = new THREE.Mesh(cloudGeom, cloudCustomMat);
        mainMesh.add(cloudMesh);

        const atmoGeom = new THREE.SphereGeometry(data.size * 1.075, 32, 32);
        const atmoMat = new THREE.ShaderMaterial({
          uniforms: {
            uColor: { value: new THREE.Vector3(0.2, 0.65, 1.0) },
            uIntensity: { value: 0.95 }
          },
          vertexShader: AtmosphereShader.vertexShader,
          fragmentShader: AtmosphereShader.fragmentShader,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthWrite: false
        });
        mainMesh.add(new THREE.Mesh(atmoGeom, atmoMat));

      } else if (key === 'venus') {
        const venusGeom = new THREE.SphereGeometry(data.size, 32, 32);
        const venusMat = new THREE.MeshStandardMaterial({
          color: 0xdfc08b,
          roughness: 0.72,
          metalness: 0.05
        });
        mainMesh = new THREE.Mesh(venusGeom, venusMat);

        const atmoGeom = new THREE.SphereGeometry(data.size * 1.065, 32, 32);
        const atmoMat = new THREE.ShaderMaterial({
          uniforms: {
            uColor: { value: new THREE.Vector3(0.95, 0.75, 0.32) },
            uIntensity: { value: 0.85 }
          },
          vertexShader: AtmosphereShader.vertexShader,
          fragmentShader: AtmosphereShader.fragmentShader,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthWrite: false
        });
        mainMesh.add(new THREE.Mesh(atmoGeom, atmoMat));

      } else if (key === 'jupiter') {
        const jupGeom = new THREE.SphereGeometry(data.size, 48, 48);
        const jupMat = new THREE.MeshStandardMaterial({
          map: jupiterTex,
          roughness: 0.78,
          metalness: 0.02
        });
        mainMesh = new THREE.Mesh(jupGeom, jupMat);

      } else if (key === 'saturn') {
        const satGeom = new THREE.SphereGeometry(data.size, 48, 48);
        const satMat = new THREE.MeshStandardMaterial({
          map: saturnTex,
          roughness: 0.82
        });
        mainMesh = new THREE.Mesh(satGeom, satMat);

        const innerR = data.size * 1.35;
        const outerR = data.size * 2.55;
        const ringGeom = new THREE.RingGeometry(innerR, outerR, 64);
        ringGeom.rotateX(Math.PI / 2);

        const ringMat = new THREE.ShaderMaterial({
          uniforms: {
            tRing: { value: saturnRingTex },
            uInnerRadius: { value: innerR },
            uOuterRadius: { value: outerR },
            uPlanetPos: { value: new THREE.Vector3() },
            uPlanetRadius: { value: data.size },
            uSunPos: { value: new THREE.Vector3(0, 0, 0) }
          },
          vertexShader: SaturnRingShader.vertexShader,
          fragmentShader: SaturnRingShader.fragmentShader,
          side: THREE.DoubleSide,
          transparent: true,
          depthWrite: false
        });
        const ringMesh = new THREE.Mesh(ringGeom, ringMat);
        mainMesh.add(ringMesh);

      } else if (key === 'mars') {
        const marsGeom = new THREE.SphereGeometry(data.size, 32, 32);
        const marsMat = new THREE.MeshStandardMaterial({
          map: marsTex,
          roughness: 0.9
        });
        mainMesh = new THREE.Mesh(marsGeom, marsMat);

      } else if (key === 'halley') {
        const cometGeom = new THREE.SphereGeometry(data.size, 16, 16);
        const cometMat = new THREE.MeshStandardMaterial({ color: 0x88ccdd, roughness: 0.88 });
        mainMesh = new THREE.Mesh(cometGeom, cometMat);

        const tail = createCometTail();
        scene.add(tail);
        group.userData.tail = tail;

      } else {
        const geom = new THREE.SphereGeometry(data.size, 32, 32);
        const mat = new THREE.MeshStandardMaterial({
          color: data.color,
          roughness: 0.85
        });
        mainMesh = new THREE.Mesh(geom, mat);
      }

      mainMesh.rotation.z = (data.tilt || 0) * DEG2RAD;
      group.add(mainMesh);

      celestialObjects[key] = {
        group,
        mainMesh,
        cloudMesh,
        data,
        posAU: new THREE.Vector3()
      };
    });

    // 3. 卫星群
    const moonObjects = [];
    MOONS_DATA.forEach((m) => {
      const geom = new THREE.SphereGeometry(m.size, 16, 16);
      const mat = new THREE.MeshStandardMaterial({ color: m.color, roughness: 0.85 });
      const mesh = new THREE.Mesh(geom, mat);
      scene.add(mesh);
      moonObjects.push({ data: m, mesh });
    });

    // --- 开普勒轨道线 ---
    function buildOrbitLines(isTrueScale) {
      while (orbitLines.children.length > 0) {
        const obj = orbitLines.children[0];
        orbitLines.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
      }

      Object.keys(CELESTIAL_DATA).forEach((key) => {
        if (key === 'sun' || key === 'moon') return;
        const data = CELESTIAL_DATA[key];
        if (!data.a) return;

        const segments = data.e > 0.8 ? 512 : 128;
        const points = [];

        for (let i = 0; i <= segments; i++) {
          const E = (i / segments) * Math.PI * 2;
          const posAU = getHeliocentricPositionByE(data, E);
          const p = transformCoord(posAU, isTrueScale);
          points.push(p);
        }

        const geom = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({
          color: data.isComet ? 0x00ffff : data.color,
          transparent: true,
          opacity: data.isComet ? 0.48 : 0.28,
          blending: THREE.AdditiveBlending
        });
        const line = new THREE.Line(geom, mat);
        orbitLines.add(line);
      });
    }

    buildOrbitLines(false);

    // --- 状态控制 ---
    let simDays = 0.0;
    let timeScale = 1.0;
    let isPaused = false;
    let isTrueScale = false;
    let selectedKey = 'sun';
    let targetCameraPos = new THREE.Vector3();
    let targetLookAt = new THREE.Vector3();
    let isTransitioningCamera = false;

    function updateCelestialPositions(tDays, isTrue) {
      Object.keys(celestialObjects).forEach((key) => {
        if (key === 'sun') return;
        const obj = celestialObjects[key];
        const posAU = getKeplerPosition(obj.data, tDays);
        obj.posAU.copy(posAU);

        const scenePos = transformCoord(posAU, isTrue);
        obj.group.position.copy(scenePos);

        const rotSpeed = (Math.PI * 2) / (obj.data.rotPeriod || 1.0);
        obj.mainMesh.rotation.y += rotSpeed * (timeScale * 0.016);

        if (obj.cloudMesh) {
          obj.cloudMesh.rotation.y += rotSpeed * 1.15 * (timeScale * 0.016);
        }

        if (key === 'saturn') {
          const ringMesh = obj.mainMesh.children.find(c => c.material && c.material.uniforms && c.material.uniforms.uPlanetPos);
          if (ringMesh) {
            ringMesh.material.uniforms.uPlanetPos.value.copy(scenePos);
          }
        }

        if (obj.group.userData.tail) {
          const tail = obj.group.userData.tail;
          tail.material.uniforms.uHeadPos.value.copy(scenePos);
        }
      });

      const earthObj = celestialObjects['earth'];
      const moonObj = celestialObjects['moon'];
      if (earthObj && moonObj) {
        const moonPosAU = getKeplerPosition(moonObj.data, tDays);
        moonObj.posAU.copy(moonPosAU);
        const moonOffsetScale = isTrue ? 90.0 : 18.0;
        const moonRelPos = moonPosAU.clone().multiplyScalar(moonOffsetScale);
        moonObj.group.position.copy(earthObj.group.position).add(moonRelPos);
      }

      moonObjects.forEach((m) => {
        const parentObj = celestialObjects[m.data.parent];
        if (parentObj) {
          const angle = (simDays / m.data.period) * Math.PI * 2;
          const orbitR = isTrue ? (m.data.rAU * 9000.0) : (parentObj.data.size * 1.8 + m.data.rAU * 380.0);
          const x = Math.cos(angle) * orbitR;
          const z = Math.sin(angle) * orbitR;
          m.mesh.position.set(
            parentObj.group.position.x + x,
            parentObj.group.position.y,
            parentObj.group.position.z + z
          );
        }
      });

      [asteroidBelt, kuiperBelt].forEach((belt) => {
        const { asteroids, dummy } = belt.userData;
        for (let i = 0; i < asteroids.length; i++) {
          const ast = asteroids[i];
          const M = ast.M0 + (Math.PI * 2 / ast.period) * tDays;
          const E = solveKepler(M, ast.e);
          const rAU = ast.a * (1.0 - ast.e * Math.cos(E));
          const v = Math.atan2(Math.sqrt(1.0 - ast.e * ast.e) * Math.sin(E), Math.cos(E) - ast.e);
          const theta = ast.w + v;

          const xp = rAU * Math.cos(theta);
          const yp = rAU * Math.sin(theta);

          const x = xp * Math.cos(ast.Om) - yp * Math.sin(ast.Om) * Math.cos(ast.inc);
          const z = -(xp * Math.sin(ast.Om) + yp * Math.cos(ast.Om) * Math.cos(ast.inc));
          const y = yp * Math.sin(ast.inc);

          const posAU = new THREE.Vector3(x, y, z);
          const scenePos = transformCoord(posAU, isTrue);

          dummy.position.copy(scenePos);
          dummy.scale.setScalar(ast.scale);
          dummy.updateMatrix();
          belt.setMatrixAt(i, dummy.matrix);
        }
        belt.instanceMatrix.needsUpdate = true;
      });
    }

    updateCelestialPositions(0, false);

    // --- 电影级摄影机智能晨昏线构图聚焦 (向阳面黄金视角) ---
    function focusOnBody(key, immediate = false) {
      selectedKey = key;
      const targetObj = celestialObjects[key];
      if (!targetObj) return;

      const targetPos = targetObj.mesh ? targetObj.mesh.position : targetObj.group.position;
      const bodyRadius = targetObj.data.size;

      const outerR = targetObj.data.hasRings ? bodyRadius * 2.55 : bodyRadius;
      const viewDist = isTrueScale ? (outerR * 4.5 + 10.0) : (outerR * 2.8 + 14.0);

      let offset;
      if (key === 'sun') {
        offset = new THREE.Vector3(0, viewDist * 0.45, viewDist * 0.9);
      } else {
        const toSunDir = targetPos.clone().negate().normalize();
        const up = new THREE.Vector3(0, 1, 0);
        const side = new THREE.Vector3().crossVectors(toSunDir, up).normalize();

        offset = toSunDir.clone().multiplyScalar(0.75)
          .add(side.clone().multiplyScalar(0.55))
          .add(up.clone().multiplyScalar(0.38))
          .normalize()
          .multiplyScalar(viewDist);
      }

      targetCameraPos.copy(targetPos).add(offset);
      targetLookAt.copy(targetPos);

      if (immediate) {
        camera.position.copy(targetCameraPos);
        controls.target.copy(targetLookAt);
        controls.update();
      } else {
        isTransitioningCamera = true;
      }

      updateNavHighlight(key);
      showPlanetInfo(key);

      document.getElementById('sim-target').innerText = targetObj.data.name;
    }

    // --- UI 初始化 ---
    function initUI() {
      const navSunComet = document.getElementById('nav-sun-comet');
      const navInner = document.getElementById('nav-inner');
      const navOuter = document.getElementById('nav-outer');

      const createNavBtn = (key, data) => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.id = `nav-${key}`;
        btn.innerHTML = `
          <div style="display: flex; align-items: center;">
            <span class="nav-dot" style="background: #${new THREE.Color(data.color).getHexString()}; color: #${new THREE.Color(data.color).getHexString()};"></span>
            <span>${data.name}</span>
          </div>
          <span style="font-size: 10px; color: var(--text-sub);">${data.latin.split('/')[0]}</span>
        `;
        btn.onclick = () => focusOnBody(key);
        return btn;
      };

      ['sun', 'halley'].forEach(k => navSunComet.appendChild(createNavBtn(k, CELESTIAL_DATA[k])));
      ['mercury', 'venus', 'earth', 'moon', 'mars'].forEach(k => navInner.appendChild(createNavBtn(k, CELESTIAL_DATA[k])));
      ['jupiter', 'saturn', 'uranus', 'neptune', 'pluto'].forEach(k => navOuter.appendChild(createNavBtn(k, CELESTIAL_DATA[k])));

      const setSpeed = (scale, activeBtnId) => {
        timeScale = scale;
        isPaused = false;
        document.querySelectorAll('.time-ctrl .ctrl-btn').forEach(b => b.classList.remove('active'));
        if (activeBtnId) document.getElementById(activeBtnId).classList.add('active');
        document.getElementById('sim-rate').innerText = `${scale.toFixed(1)} 天/秒`;
      };

      document.getElementById('btn-reverse').onclick = () => setSpeed(-Math.abs(timeScale === 0 ? 1 : timeScale), 'btn-reverse');
      document.getElementById('btn-pause').onclick = () => {
        isPaused = !isPaused;
        document.getElementById('btn-pause').classList.toggle('active', isPaused);
        document.getElementById('sim-rate').innerText = isPaused ? '已暂停' : `${timeScale.toFixed(1)} 天/秒`;
      };
      document.getElementById('btn-play').onclick = () => setSpeed(1.0, 'btn-play');
      document.getElementById('btn-fast').onclick = () => setSpeed(30.0, 'btn-fast');
      document.getElementById('btn-warp').onclick = () => setSpeed(365.25, 'btn-warp');
      document.getElementById('btn-reset-time').onclick = () => {
        simDays = 0;
        setSpeed(1.0, 'btn-play');
      };

      document.getElementById('chk-orbits').onchange = (e) => {
        orbitLines.visible = e.target.checked;
      };
      document.getElementById('chk-moons').onchange = (e) => {
        moonObjects.forEach(m => m.mesh.visible = e.target.checked);
      };
      document.getElementById('chk-belts').onchange = (e) => {
        asteroidBelt.visible = e.target.checked;
        kuiperBelt.visible = e.target.checked;
      };
      document.getElementById('chk-true-scale').onchange = (e) => {
        isTrueScale = e.target.checked;
        buildOrbitLines(isTrueScale);
        updateCelestialPositions(simDays, isTrueScale);
        focusOnBody(selectedKey, true);
      };

      document.getElementById('info-close-btn').onclick = () => {
        document.getElementById('planet-info-panel').style.display = 'none';
      };

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          document.getElementById('btn-pause').click();
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function updateNavHighlight(key) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`nav-${key}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function showPlanetInfo(key) {
      const data = CELESTIAL_DATA[key];
      if (!data) return;

      const panel = document.getElementById('planet-info-panel');
      panel.style.display = 'flex';
      document.getElementById('info-name').innerText = data.name;
      document.getElementById('info-latin').innerText = data.latin;
      document.getElementById('info-summary').innerText = data.desc;

      const specs = document.getElementById('info-specs');
      specs.innerHTML = `
        <div class="data-card">
          <div class="data-label">真实赤道半径</div>
          <div class="data-val">${data.trueRadiusKm.toLocaleString()} km</div>
        </div>
        <div class="data-card">
          <div class="data-label">半长轴 / 距离</div>
          <div class="data-val">${data.a ? data.a.toFixed(3) + ' AU' : '太阳系中心'}</div>
        </div>
        <div class="data-card">
          <div class="data-label">公转轨道周期</div>
          <div class="data-val">${data.period ? (data.period > 365 ? (data.period / 365.25).toFixed(2) + ' 年' : data.period.toFixed(1) + ' 天') : '—'}</div>
        </div>
        <div class="data-card">
          <div class="data-label">自转周期</div>
          <div class="data-val">${Math.abs(data.rotPeriod)} ${data.rotPeriod > 2 ? '天' : '小时'} ${data.tilt > 90 ? '(逆行)' : ''}</div>
        </div>
        <div class="data-card">
          <div class="data-label">自转轴倾角</div>
          <div class="data-val">${data.tilt}°</div>
        </div>
        <div class="data-card">
          <div class="data-label">轨道偏心率</div>
          <div class="data-val">${data.e !== undefined ? data.e.toFixed(4) : '0.0000'}</div>
        </div>
      `;
    }

    initUI();

    function applyHashParams() {
      const hash = window.location.hash.substring(1);
      if (!hash) return;
      const params = new URLSearchParams(hash);

      const focus = params.get('focus');
      const snap = params.get('snap') === '1';
      const trueScale = params.get('true') === '1';
      const speed = parseFloat(params.get('speed'));
      const jd = parseFloat(params.get('jd'));

      if (trueScale) {
        document.getElementById('chk-true-scale').checked = true;
        isTrueScale = true;
        buildOrbitLines(true);
      }
      if (!isNaN(jd)) {
        simDays = jd;
      }
      if (!isNaN(speed)) {
        timeScale = speed;
      }

      updateCelestialPositions(simDays, isTrueScale);

      if (focus && CELESTIAL_DATA[focus.toLowerCase()]) {
        focusOnBody(focus.toLowerCase(), snap);
      }
    }
    applyHashParams();

    const clock = new THREE.Clock();
    let frameCount = 0;

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      if (!isPaused) {
        simDays += dt * timeScale;
        updateCelestialPositions(simDays, isTrueScale);

        const date = new Date(2000, 0, 1);
        date.setDate(date.getDate() + simDays);
        document.getElementById('sim-date').innerText = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      }

      sunMat.uniforms.uTime.value = elapsed;
      coronaMat.uniforms.uCamDist.value = camera.position.length();

      const activeObj = celestialObjects[selectedKey];
      if (activeObj) {
        const curTargetPos = activeObj.mesh ? activeObj.mesh.position : activeObj.group.position;

        if (isTransitioningCamera) {
          controls.target.lerp(curTargetPos, 0.08);
          camera.position.lerp(targetCameraPos, 0.08);
          if (camera.position.distanceTo(targetCameraPos) < 0.6) {
            isTransitioningCamera = false;
          }
        } else {
          controls.target.copy(curTargetPos);
        }
      }

      controls.update();
      composer.render();

      frameCount++;
      if (frameCount >= 1) {
        const errCount = window.__errLog.length;
        document.title = `SS_OK[12 bodies, d=${simDays.toFixed(1)}, errs=${errCount}] - 太阳系物理仿真`;
      }
    }

    animate();
  </script>
