<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="太阳系实时运动模型：行星与卫星位置由 JPL 近似轨道根数实时计算，WebGL2 程序化渲染，单文件离线运行。">
<title>太阳系实时运动模型</title>
<style>
:root {
  color-scheme: dark;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", monospace;
  --text: #e8eefc;
  --dim: #97a4c2;
  --faint: #66738f;
  --line: rgba(180, 200, 255, 0.14);
  --line-2: rgba(180, 200, 255, 0.28);
  --glass-a: rgba(20, 26, 44, 0.64);
  --glass-b: rgba(7, 10, 19, 0.6);
  --accent: #ffd27a;
  --sky: #8fd8ff;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: #02030a;
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
#gl {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  outline: none;
}
#gl:active { cursor: grabbing; }

/* HTML labels over the canvas */
#labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.label {
  position: absolute;
  left: 0;
  top: 0;
  white-space: nowrap;
  font: 500 11px/1.2 var(--sans);
  letter-spacing: .08em;
  color: #eaf1ff;
  text-shadow: 0 0 6px #000, 0 0 2px #000;
  will-change: transform;
}
.label i {
  display: inline-block;
  width: 12px;
  height: 1px;
  margin-right: 6px;
  vertical-align: middle;
  background: currentColor;
  opacity: .55;
}
.label.on { color: var(--accent); }

/* HUD layout: wide = three columns, middle = list/side on top and dock below, phone = one column */
#hud {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: grid;
  gap: 12px;
  padding: 14px;
  pointer-events: none;
  grid-template-columns: 232px minmax(0, 1fr) 300px;
  grid-template-rows: minmax(0, 1fr) auto;
}
#list {
  grid-column: 1;
  grid-row: 1 / span 2;
  align-self: stretch;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#banner {
  grid-column: 2;
  grid-row: 1;
  justify-self: center;
  align-self: start;
  max-width: 100%;
  min-width: 0;
  pointer-events: auto;
}
#side {
  grid-column: 3;
  grid-row: 1 / span 2;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  pointer-events: none;
}
#dock {
  grid-column: 2;
  grid-row: 2;
  justify-self: center;
  width: 100%;
  max-width: 680px;
  min-width: 0;
  pointer-events: none;
}

.glass {
  background: linear-gradient(180deg, var(--glass-a), var(--glass-b));
  border: 1px solid var(--line);
  border-radius: 14px;
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .05);
  pointer-events: auto;
}

/* left list */
.brand {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 13px 12px 9px 14px;
  border-bottom: 1px solid var(--line);
}
.brand .t1 { font-size: 14px; font-weight: 600; letter-spacing: .14em; }
.brand .t2 { margin-top: 3px; font-size: 10px; color: var(--dim); letter-spacing: .1em; }
.brand .meta { margin-left: auto; text-align: right; }
.fps {
  font: 500 10px/1 var(--mono);
  letter-spacing: .06em;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.list-body {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 4px 6px 8px;
  scrollbar-width: thin;
}
.grp {
  padding: 10px 8px 4px;
  font-size: 10px;
  letter-spacing: .2em;
  color: var(--faint);
  text-transform: uppercase;
}
.item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin: 1px 0;
  padding: 6px 8px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--text);
  font: 500 13px/1.3 var(--sans);
  text-align: left;
  cursor: pointer;
}
.item:hover { background: rgba(255, 255, 255, .06); }
.item.on { background: rgba(143, 216, 255, .12); box-shadow: inset 0 0 0 1px rgba(143, 216, 255, .36); }
.item.sub { padding-left: 26px; font-size: 12px; color: #c4cee6; }
.item .dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c, #9fb3d9);
  box-shadow: 0 0 8px var(--c, #9fb3d9);
}
.item.sub .dot { width: 5px; height: 5px; }
.item .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .en {
  margin-left: auto;
  padding-left: 6px;
  font: 400 10px/1 var(--mono);
  color: var(--faint);
  white-space: nowrap;
}
.list-foot {
  padding: 8px 14px 11px;
  border-top: 1px solid var(--line);
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--faint);
}

/* shared small controls */
.mini, .btn, .x, .sec-h {
  font-family: var(--sans);
  cursor: pointer;
}
.mini {
  margin-top: 6px;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, .06);
  color: var(--dim);
  font-size: 11px;
  line-height: 1.4;
}
.btn {
  padding: 7px 12px;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  background: rgba(255, 255, 255, .07);
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}
.btn:hover { background: rgba(255, 255, 255, .13); }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--sky);
  outline-offset: 2px;
}

/* info card */
.card {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 14px 14px 16px;
  user-select: text;
  -webkit-user-select: text;
  scrollbar-width: thin;
}
.card-h { display: flex; align-items: flex-start; gap: 10px; }
.card-h .nm { font-size: 20px; font-weight: 600; letter-spacing: .04em; line-height: 1.25; }
.card-h .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 7px; }
.card-h .x {
  margin-left: auto;
  flex: none;
  width: 28px;
  height: 28px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: none;
  color: var(--dim);
  font-size: 16px;
  line-height: 1;
}
.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px 3px 7px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--dim);
  white-space: nowrap;
}
.tag::before {
  content: "";
  width: 6px;
  height: 6px;
  margin-right: 6px;
  border-radius: 50%;
  background: var(--c, #9fb3d9);
}
.en { font: 400 11px/1.4 var(--mono); color: var(--faint); letter-spacing: .03em; }
.sec {
  margin: 16px 0 7px;
  font-size: 10px;
  letter-spacing: .2em;
  color: var(--faint);
  text-transform: uppercase;
}
.kv {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 7px 14px;
  margin: 0;
  font-size: 12px;
}
.kv dt { color: var(--dim); white-space: nowrap; }
.kv dd {
  min-width: 0;
  margin: 0;
  text-align: right;
  font: 500 12px/1.4 var(--mono);
  font-variant-numeric: tabular-nums;
  color: var(--text);
  overflow-wrap: anywhere;
}
.kv dd em {
  display: block;
  font: 400 10.5px/1.4 var(--sans);
  font-style: normal;
  color: var(--faint);
}
.lnk {
  padding: 0;
  border: 0;
  background: none;
  color: var(--sky);
  font: inherit;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.blurb {
  margin: 14px 0 0;
  font-size: 12.5px;
  line-height: 1.75;
  color: #c3cde3;
}
.ph-t { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
.ph ul {
  margin: 12px 0 0;
  padding: 0 0 0 16px;
  font-size: 12.5px;
  line-height: 1.9;
  color: var(--dim);
}
.ph p {
  margin: 12px 0 0;
  font-size: 11.5px;
  line-height: 1.7;
  color: var(--faint);
}

/* display toggles */
.toggles { flex: none; padding: 12px 14px 14px; }
.sec-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin: 0 0 8px;
  padding: 2px 0;
  border: 0;
  background: none;
  color: var(--faint);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
}
.chev { display: inline-block; transition: transform .2s; }
.toggles.collapsed { padding-bottom: 8px; }
.toggles.collapsed .sec-h { margin: 0; }
.toggles.collapsed .chev { transform: rotate(-90deg); }
.toggles.collapsed .tg-grid { display: none; }
.tg-grid { display: grid; grid-template-columns: repeat(2, max-content); justify-content: space-between; gap: 4px 12px; }
.tg {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 5px 2px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
}
.tg input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}
.tg .track {
  position: relative;
  flex: none;
  width: 28px;
  height: 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, .12);
  transition: background .2s;
}
.tg .track i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #cfd8ee;
  transition: transform .2s;
}
.tg input:checked + .track { background: rgba(255, 210, 122, .5); border-color: rgba(255, 210, 122, .6); }
.tg input:checked + .track i { transform: translateX(12px); background: #fff; }
.tg input:focus-visible + .track { outline: 2px solid var(--sky); outline-offset: 2px; }
.tl { min-width: 0; white-space: nowrap; }

/* time bar */
.timebar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 10px 14px;
  border-radius: 16px;
}
.date {
  font: 500 13px/1.2 var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
  white-space: nowrap;
  color: var(--text);
}
.speed {
  display: flex;
  flex: 1 1 150px;
  align-items: center;
  gap: 8px;
  min-width: 120px;
}
.speed .sl {
  flex: none;
  font-size: 10px;
  letter-spacing: .16em;
  color: var(--faint);
  text-transform: uppercase;
}
.rate {
  flex: none;
  min-width: 96px;
  text-align: right;
  font: 500 12px/1.2 var(--mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--accent);
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1 1 auto;
  width: 100%;
  min-width: 60px;
  height: 18px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px;
  border-radius: 3px;
  background: linear-gradient(90deg, rgba(255, 255, 255, .14), rgba(255, 210, 122, .6));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  margin-top: -5.5px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(255, 210, 122, .25);
}
input[type="range"]::-moz-range-track {
  height: 3px;
  border-radius: 3px;
  background: rgba(255, 255, 255, .16);
}
input[type="range"]::-moz-range-progress {
  height: 3px;
  border-radius: 3px;
  background: rgba(255, 210, 122, .6);
}
input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: 0;
  border-radius: 50%;
  background: #fff;
}
.note {
  margin: 8px 6px 0;
  font-size: 11px;
  line-height: 1.6;
  text-align: center;
  color: var(--faint);
}

/* banner for extrapolated dates */
.banner {
  padding: 7px 14px;
  border: 1px solid rgba(255, 150, 110, .42);
  border-radius: 14px;
  background: rgba(120, 40, 20, .46);
  color: #ffd9ca;
  font-size: 12px;
  line-height: 1.5;
  text-align: center;
  letter-spacing: .02em;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* hide-all state and the button that brings the UI back */
.show-ui {
  position: fixed;
  left: 14px;
  bottom: 14px;
  z-index: 6;
  display: none;
  background: rgba(10, 14, 24, .7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
body.ui-hidden #hud,
body.ui-hidden #labels { display: none; }
body.ui-hidden .show-ui { display: inline-block; }

/* fatal message */
#fatal {
  position: fixed;
  inset: 0;
  z-index: 9;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  pointer-events: none;
}
.fatal-box {
  max-width: 420px;
  padding: 22px 24px;
  text-align: center;
  pointer-events: auto;
}
.fatal-t { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
#fatal-msg { margin: 0; font-size: 13.5px; line-height: 1.8; color: var(--dim); }

/* medium widths: the dock moves below both side panels */
@media (min-width: 720px) and (max-width: 1099px) {
  #hud { grid-template-columns: 220px minmax(0, 1fr) 260px; }
  #list { grid-row: 1; }
  #side { grid-row: 1; }
  #dock { grid-column: 1 / -1; grid-row: 2; max-width: 760px; }
}

/* phone: everything stacks in one column, panels collapse */
@media (max-width: 719px) {
  #hud {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto auto;
    gap: 8px;
    padding: 10px 16px;
  }
  #list { grid-column: 1; grid-row: 1; align-self: start; width: 100%; }
  #banner { grid-column: 1; grid-row: 2; max-width: 100%; }
  #side { grid-column: 1; grid-row: 4; gap: 8px; }
  #dock { grid-column: 1; grid-row: 5; max-width: none; width: 100%; }
  #list .list-body { flex: 0 1 auto; max-height: 42vh; }
  #list .list-foot { display: none; }
  #list:not(.collapsed) ~ #side #card { display: none; }
  #side #card { flex: 0 1 auto; max-height: 26vh; }
  #card.is-empty { display: none; }
  .tg-grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
  .timebar { padding: 8px 10px; }
  .banner { font-size: 11px; padding: 6px 10px; }
  .note { font-size: 10.5px; }
}

/* collapsed list: only the header row remains */
#list.collapsed { align-self: start; }
#list.collapsed .list-body,
#list.collapsed .list-foot { display: none; }
</style>
</head>
<body>
<canvas id="gl" aria-label="太阳系三维视图"></canvas>
<div id="labels" aria-hidden="true"></div>

<div id="hud">
  <aside id="list" class="glass" aria-label="天体列表">
    <div class="brand">
      <div>
        <div class="t1">太阳系模型</div>
        <div class="t2">实时运动 · 真实轨道根数</div>
      </div>
      <div class="meta">
        <div id="fps" class="fps">-- FPS</div>
        <button id="list-toggle" class="mini" type="button" aria-expanded="true" aria-controls="list-body">收起</button>
      </div>
    </div>
    <div id="list-body" class="list-body"></div>
    <div class="list-foot">拖拽旋转 · 滚轮或双指缩放 · 点击天体聚焦</div>
  </aside>

  <div id="banner" class="banner glass-banner" hidden>已超出根数有效区间（外推）· 标称有效期 1800–2050 年</div>

  <div id="side">
    <section id="card" class="glass card is-empty" aria-label="天体信息"></section>
    <section id="toggles" class="glass toggles" aria-label="显示开关">
      <button id="toggles-toggle" class="sec-h" type="button" aria-expanded="true" aria-controls="toggles-body"><span>显示</span><span class="chev" aria-hidden="true">▾</span></button>
      <div id="toggles-body" class="tg-grid">
        <label class="tg"><input type="checkbox" data-flag="orbits" checked><span class="track"><i></i></span><span class="tl">轨道</span></label>
        <label class="tg"><input type="checkbox" data-flag="names" checked><span class="track"><i></i></span><span class="tl">名称</span></label>
        <label class="tg"><input type="checkbox" data-flag="moons" checked><span class="track"><i></i></span><span class="tl">卫星</span></label>
        <label class="tg" title="包括希尔达族、木星特洛伊群与柯伊伯带"><input type="checkbox" data-flag="asteroids" checked><span class="track"><i></i></span><span class="tl">小行星带</span></label>
        <label class="tg"><input type="checkbox" data-flag="comets" checked><span class="track"><i></i></span><span class="tl">彗星</span></label>
        <label class="tg" title="距离按真实比例显示，内行星会挤成一团"><input type="checkbox" data-flag="realScale"><span class="track"><i></i></span><span class="tl">真实距离比例</span></label>
        <label class="tg"><input type="checkbox" data-flag="glow" checked><span class="track"><i></i></span><span class="tl">辉光</span></label>
      </div>
    </section>
  </div>

  <div id="dock">
    <div id="timebar" class="glass timebar">
      <button id="play" class="btn" type="button" aria-label="播放或暂停">❚❚ 暂停</button>
      <div id="date" class="date">—</div>
      <div class="speed">
        <span class="sl">速度</span>
        <input id="speed" type="range" min="-100" max="100" step="1" value="0" aria-label="时间速度">
        <span id="speed-val" class="rate">1.00 秒/秒</span>
      </div>
      <button id="now" class="btn" type="button">此刻</button>
    </div>
    <p id="note" class="note"></p>
  </div>
</div>

<button id="show-ui" class="btn show-ui" type="button">显示界面（H）</button>

<div id="fatal" hidden>
  <div class="glass fatal-box">
    <p class="fatal-t">无法启动三维渲染</p>
    <p id="fatal-msg"></p>
  </div>
</div>

<script>
// 01_ephem.js: VM (vector/matrix helpers) and EPH (ephemerides and body data).
// Implements CONTRACT sections 3 and 4. Plain script fragment: no DOM, no import/export.
// Internal angles are radians. Fields named *Deg and the data tables are degrees.

const VM = (function () {
  const TWO_PI = 2 * Math.PI;
  const DEG = Math.PI / 180;

  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function deg(x) { return x * DEG; }
  function rad2deg(x) { return x / DEG; }

  // Hand-written smoothstep. Safe for a > b (decreasing ramp).
  function sstep(a, b, x) {
    if (a === b) return x < a ? 0 : 1;
    let t = (x - a) / (b - a);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return t * t * (3 - 2 * t);
  }

  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function scale(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }

  float f = 0.30 * exp(-sq((r - 2.324) / 0.0055));
  return base * hf + f;
}
float ringDens2(float r) {
  float d = 0.55 * exp(-sq((r - 1.951) / 0.0055));
  d += 0.20 * exp(-sq((r - 1.909) / 0.0025));
  d += 0.17 * exp(-sq((r - 1.863) / 0.0020));
  d += 0.14 * exp(-sq((r - 1.823) / 0.0020));
  d += 0.11 * exp(-sq((r - 1.786) / 0.0015));
  d += 0.09 * exp(-sq((r - 1.751) / 0.0015));
  d += 0.07 * exp(-sq((r - 1.690) / 0.0018));
  return d;
}
float ringDens3(float r) {
  return 0.016 * boxE(r, 1.40, 1.81);
}
float ringDensityK(float r, int kind) {
  if (kind == 1) return ringDens1(r);
  if (kind == 2) return ringDens2(r);
  return ringDens3(r);
}
`;

  // 撞击坑：返回 vec2(高度, 反照率调制)（规格 5.2，含存在标志与 7.5 的淡出）
  const CRATER_GLSL = `
vec2 craters(vec3 p, float freq, float depth) {
  vec4 w = worley(p * freq);
  float d1 = w.x;
  float id = w.z;
  float rad = 0.13 + 0.22 * fract(id * 7.31);
  float t = d1 / rad;
  float bowl = t < 1.0 ? -(1.0 - t * t) : 0.0;
  float rim = exp(-sq((t - 1.0) / 0.26));
  // 胞界处 F2-F1 = 0：坑在获胜胞切换前已淡出，避免直线接缝（规格 7.5）
  float present = step(id, 0.74) * sstep(0.60, 0.40, d1) * sstep(0.0, 0.12, w.y - w.x);
  float h = (bowl * 0.90 + rim * 0.50) * depth * present;
  float a = (bowl * 0.55 + rim * 0.32) * present;
  return vec2(h, a);
}
vec2 craterStack(vec3 p, float amp) {
  vec2 c = craters(p, 5.0, 1.00);
  c += craters(p + vec3(11.3), 12.0, 0.52);
  c += craters(p + vec3(23.9), 28.0, 0.26);
  c += craters(p + vec3(37.1), 62.0, 0.13);
  return vec2(c.x * amp, c.y);
}
// 屏幕空间导数凹凸（规格 5 的 bump 块）；只对陆地与岩石使用，k=0 时返回原法线
vec3 bumpN(vec3 N, vec3 wp, float h, float k) {
  vec3 dpx = dFdx(wp);
  vec3 dpy = dFdy(wp);
  float dhx = dFdx(h);
  float dhy = dFdy(h);
  vec3 r1 = cross(dpy, N);
  vec3 r2 = cross(N, dpx);
  float det = dot(dpx, r1);
  if (abs(det) < 1e-12) return N;
  vec3 grad = (r1 * dhx + r2 * dhy) / det;
  return normalize(N - k * grad);
}
// 经纬度（弧度）→ 物体空间单位向量，Y 为自转轴
vec3 llDir(float lon, float lat) {
  return vec3(cos(lat) * cos(lon), sin(lat), cos(lat) * sin(lon));
}
`;

  // 主表面着色器（uber）。uSurf 编码见 03_render.js 的 SURF 表。
  const bodyFS = `
uniform int uSurf;
uniform vec3 uEye;
uniform vec3 uSunPos;
uniform float uSunI;
uniform float uTime;
uniform float uSeed;
uniform float uTurb;
uniform mat4 uModel;
uniform int uRingKind;
uniform float uRingInner;
uniform float uRingOuter;
in vec3 vObj;
in vec3 vWorld;
in vec3 vN;
out vec4 oColor;
const int S_MERCURY = 1;
const int S_MOON = 2;
const int S_MARS = 3;
const int S_CALLISTO = 4;
const int S_GANYMEDE = 5;
const int S_CHARON = 6;
const int S_PLUTO = 7;
const int S_EARTH = 8;
const int S_VENUS = 9;
const int S_JUPITER = 10;
const int S_SATURN = 11;
const int S_URANUS = 12;
const int S_NEPTUNE = 13;
const int S_IO = 14;
const int S_EUROPA = 15;
const int S_TITAN = 16;
const int S_TRITON = 17;
const int S_HALLEY = 18;
${RING_GLSL}
${CRATER_GLSL}
// 环在行星上的投影（规格 5.10 之二）：物体空间沿太阳方向求与 y=0 环面的交点
float ringShadow(vec3 Q, vec3 Ld) {
  if (uRingKind == 0) return 1.0;
  if (abs(Ld.y) < 1e-4) return 1.0;
  float t = -Q.y / Ld.y;
  if (t <= 0.0) return 1.0;
  vec3 q = Q + t * Ld;
  float rr = length(q.xz);
  if (rr < uRingInner || rr > uRingOuter) return 1.0;
  float d = ringDensityK(rr, uRingKind);
  return exp(-d * 1.45 / max(abs(Ld.y), 0.10));   // 下限与环的 mu 钳制相同（0.10）
}
void main() {
  vec3 P = normalize(vObj);
  vec3 N0 = normalize(vN);
  vec3 L = normalize(uSunPos - vWorld);
  vec3 V = normalize(uEye - vWorld);
  vec3 SO = vec3(uSeed * 17.3, uSeed * 9.1, uSeed * 5.7);
  float lon = atan(P.z + 1e-8, P.x);   // 极点处 atan(0,0) 未定义，加微小量
  float lat = asin(clamp(P.y, -1.0, 1.0));

  vec3 alb = vec3(0.12);
  float h = 0.0;          // 凹凸高度
  float bk = 0.0;         // 凹凸强度，0 表示不加凹凸
  float wrapK = 0.08;     // 软晨昏线
  float limbK = 0.0;      // 临边昏暗强度（气态/冰巨/金星）
  float specK = 0.0;
  float specPow = 1.0;
  vec3 emit = vec3(0.0);

  if (uSurf == S_MERCURY || uSurf == S_CALLISTO || uSurf == S_CHARON) {
    // 岩质：撞击坑
    vec2 cs = craterStack(P + SO, uSurf == S_CHARON ? 0.5 : 0.7);
    float base = uSurf == S_MERCURY ? 0.135 : (uSurf == S_CALLISTO ? 0.165 : 0.200);
    alb = vec3(base) * (0.82 + 0.36 * fbm(P * 3.0 + SO, 4));
    if (uSurf == S_CALLISTO) alb *= vec3(1.0, 0.92, 0.82);
    if (uSurf == S_CHARON) {
      float cap = sstep(0.82, 0.94, P.y);      // 暗红色北极区（Mordor）
      alb = mix(alb, vec3(0.13, 0.10, 0.08), cap * 0.7);
    }
    alb *= 1.0 + 0.55 * cs.y;
    h = cs.x;
    bk = 0.012;
  } else if (uSurf == S_MOON) {
    float mare = sstep(0.56, 0.62, fbm(P * 2.2 + SO + 1.7, 5));
    vec2 cs = craterStack(P + SO, mix(1.0, 0.35, mare));
    alb = mix(vec3(0.125, 0.122, 0.118), vec3(0.065, 0.064, 0.068), mare);
    alb *= 0.9 + 0.2 * fbm(P * 5.0 + SO, 4);
    alb *= 1.0 + 0.55 * cs.y;
    // 亮色辐射纹（自某撞击点向外放射）
    vec3 rc = normalize(vec3(0.35, 0.55, 0.75));
    float dr = acos(clamp(dot(P, rc), -1.0, 1.0));
    float rays = exp(-dr * 7.0) * pow(vnoise(P * 18.0 + SO), 2.5);
    alb += vec3(0.16, 0.16, 0.17) * rays;
    h = cs.x;
    bk = 0.012;
  } else if (uSurf == S_GANYMEDE) {
    // 暗色古老区 + 亮色沟槽地形（规格 5.8）
    float ter = fbm(P * 2.4 + SO + 3.3, 5);
    float brightM = sstep(0.48, 0.58, ter);
    float g = abs(fbm(P * 6.0 + SO + 1.0, 5) - 0.5);
    float groove = sstep(0.05, 0.0, g) * brightM;
    alb = mix(vec3(0.13, 0.12, 0.11), vec3(0.36, 0.35, 0.33), brightM);
    alb *= 1.0 - 0.25 * groove;
    h = fbm(P * 10.0 + SO, 4) * 0.25 - groove * 0.05;
    bk = 0.006;
  } else if (uSurf == S_PLUTO) {
    // 暗色赤道带 + 心形亮区（两个高斯斑拼出心形，斯普特尼克平原）
    vec3 c1 = llDir(0.32, 0.20);
    vec3 c2 = llDir(-0.24, 0.12);
    vec3 c3 = llDir(0.04, -0.22);
    float heart = max(exp(-(1.0 - dot(P, c1)) / 0.035), exp(-(1.0 - dot(P, c2)) / 0.035));
    heart = max(heart, 0.6 * exp(-(1.0 - dot(P, c3)) / 0.03));
    float db = exp(-sq(P.y / 0.22));
    alb = vec3(0.42, 0.33, 0.27) * (0.8 + 0.4 * fbm(P * 4.0 + SO, 4));
    alb = mix(alb, vec3(0.72, 0.66, 0.58), heart * 0.9);
    alb = mix(alb, vec3(0.15, 0.10, 0.08), db * 0.75);
    h = fbm(P * 5.0 + SO, 4) * 0.1;
    bk = 0.004;
  } else if (uSurf == S_MARS) {
    // 南北二分性：北半球年轻平原坑减少 78%（规格 5.5）
    float yb = P.y + 0.25 * (fbm(P * 2.5 + SO + 3.0, 4) - 0.5);
    float north = sstep(-0.05, 0.15, yb);
    vec2 cs = craterStack(P + SO, mix(0.7, 0.154, north));
    float dust = fbm(P * 3.3 + SO, 5);
    alb = vec3(0.17, 0.063, 0.027) * (0.80 + 0.5 * dust);
    alb = mix(alb, vec3(0.10, 0.040, 0.020), sstep(0.62, 0.72, fbm(P * 2.0 + SO, 4)));
    alb *= 1.0 + 0.5 * cs.y;
    // 水手谷：赤道附近的暗色长沟
    float vm = exp(-sq((P.y + 0.03) / 0.022)) * (1.0 - sstep(0.7, 1.1, lon)) * sstep(-1.3, -0.9, lon);
    alb *= 1.0 - 0.35 * vm;
    float cap = sstep(0.90, 0.96, abs(P.y) + 0.05 * (fbm(P * 6.0 + SO, 3) - 0.5));
    alb = mix(alb, vec3(0.42, 0.40, 0.38), cap);
    h = cs.x * 0.9;
    bk = 0.012;
  } else if (uSurf == S_EARTH) {
    float hL = fbm(P * 2.1 + SO, 7);                 // 海陆高度场
    float landM = sstep(0.548, 0.566, hL);           // 海平面 0.552
    float shallow = sstep(0.520, 0.548, hL) * (1.0 - landM);
    vec3 ocean = mix(vec3(0.010, 0.035, 0.095), vec3(0.030, 0.120, 0.160), shallow);
    float vg = fbm(P * 5.0 + SO * 2.0, 5);
    vec3 green = vec3(0.060, 0.110, 0.035);
    vec3 desert = vec3(0.260, 0.190, 0.100);
    vec3 rockC = vec3(0.170, 0.160, 0.150);
    vec3 land = mix(green, desert, sstep(0.45, 0.60, vg));
    land = mix(land, rockC, sstep(0.60, 0.70, hL));
    float iceM = sstep(0.80, 0.92, abs(P.y) + 0.04 * (vg - 0.5));
    land = mix(land, vec3(0.80, 0.84, 0.88), iceM);
    vec3 surfC = mix(ocean, land, landM);
    // 云：随纬度的纬向漂移（低纬快、高纬慢），云量随纬度调制
    vec3 cp = rotY(P, uTime * 0.020 * (1.0 - 0.55 * P.y * P.y));
    float cn = fbm(cp * 2.4 + SO * 3.0, 6);
    float cov = 0.55 + 0.25 * exp(-sq((abs(P.y) - 0.10) / 0.22)) - 0.20 * exp(-sq((abs(P.y) - 0.45) / 0.12));
    float thr = 0.70 - 0.28 * cov;
    float cl = sstep(thr - 0.06, thr + 0.06, cn);
    vec3 cloudC = vec3(0.85, 0.87, 0.90) * (0.92 + 0.16 * fbm(cp * 7.0, 3));
    alb = mix(surfC, cloudC, cl * 0.92);
    specK = (1.0 - landM) * (1.0 - cl) * 0.9;
    specPow = 420.0;
    // 夜面灯光：陆地、无云、背光
    float nlv = vnoise(P * 150.0 + SO) * vnoise(P * 37.0 + SO + 3.0);
    float nightM = landM * (1.0 - cl) * sstep(0.02, -0.12, dot(N0, L));
    emit = vec3(1.0, 0.70, 0.35) * pow(nlv, 4.0) * 5.0 * nightM;
    // 凹凸只加在陆地上（规格 5.3）
    h = landM * (0.3 + 0.3 * fbm(P * 40.0 + SO, 4));
    bk = 0.010 * landM;
  } else if (uSurf == S_VENUS) {
    float ww = fbm(P * 3.0 + SO, 4);
    float yw = P.y + 0.12 * (ww - 0.5) * 2.0;
    float bands = 0.5 + 0.5 * sin(yw * 18.0 + fbm(P * 5.0 + SO, 4) * 6.0);
    float sw = fbm(rotY(P, uTime * 0.02) * 4.0 + SO, 5);
    alb = mix(vec3(0.78, 0.68, 0.45), vec3(0.92, 0.86, 0.70), clamp(bands * 0.6 + sw * 0.4, 0.0, 1.0));
    limbK = 1.0;
  } else if (uSurf == S_JUPITER || uSurf == S_SATURN) {
    // 纬向带：纬度（度）上 4 个正弦，经 fbm 横向扭曲（规格 5.6）
    float warp = (fbm(P * vec3(2.0, 5.0, 2.0) + SO, 5) - 0.5) * 0.9
               + (fbm(P * 6.0 + SO * 2.0, 4) - 0.5) * 0.5;
    float ld = degrees(lat) + warp * uTurb * 22.0;
    float sCen = 0.22 * sin(6.2831853 * ld / 45.0 + 0.4)
               + 0.16 * sin(6.2831853 * ld / 20.0 + 1.1)
               + 0.10 * sin(6.2831853 * ld / 10.6 + 2.3)
               + 0.06 * sin(6.2831853 * ld / 6.0 + 0.7);
    // 极区淡出带纹（规格 5.6：避免同心靶环）
    float fadeAmp = mix(1.0, 0.06, sstep(0.72, 0.94, abs(P.y)));
    sCen *= fadeAmp;
    vec3 zone = uSurf == S_JUPITER ? vec3(0.78, 0.66, 0.50) : vec3(0.86, 0.79, 0.61);
    vec3 belt = uSurf == S_JUPITER ? vec3(0.42, 0.24, 0.13) : vec3(0.66, 0.56, 0.40);
    alb = mix(belt, zone, clamp(0.5 + sCen * 2.0, 0.0, 1.0));
    // 涡旋斑点：纬向压扁的 Worley
    vec4 wv = worley(vec3(lon * 3.0, lat * 14.0, uSeed * 40.0));
    float ov = sstep(0.16, 0.04, wv.x);
    alb = mix(alb, vec3(0.92, 0.88, 0.80), ov * 0.25);
    if (uSurf == S_JUPITER) {
      // 大红斑：椭圆（长短轴 2.15:1），螺旋纹理
      float lonC = -0.55;
      float latC = -0.38;
      float dl = atan(sin(lon - lonC), cos(lon - lonC));
      float dx = dl * cos(latC);
      float dy = lat - latC;
      float rr = sqrt(sq(dx / 0.40) + sq(dy / 0.186));
      float ang = atan(dy + 1e-8, dx) + rr * 2.5 - uTime * 0.07;
      float sn = fbm(vec3(cos(ang) * rr * 2.0, sin(ang) * rr * 2.0, rr) + SO, 4);
      float spot = 1.0 - sstep(0.85, 1.0, rr);
      vec3 spotC = vec3(0.62, 0.28, 0.16) * (0.75 + 0.5 * sn);
      alb = mix(alb, spotC, spot);
      alb += vec3(0.10, 0.06, 0.04) * exp(-sq((rr - 1.08) / 0.06));
    } else {
      // 土星北极六边形（规格 5.6）
      float capM = sstep(0.80, 0.90, P.y);
      float rho = length(P.xz);
      float m = mod(degrees(lon), 60.0) - 30.0;
      float hexE = 0.115 / cos(radians(m));
      float hexLine = exp(-sq((rho - hexE) / 0.012));
      alb = mix(alb, alb * 0.72, hexLine * capM);
    }
    limbK = 1.0;
  } else if (uSurf == S_URANUS || uSurf == S_NEPTUNE) {
    vec3 base = uSurf == S_URANUS ? vec3(0.25, 0.56, 0.62) : vec3(0.12, 0.26, 0.60);
    alb = base * (1.0 + 0.04 * sin(P.y * 9.0 + fbm(P * 2.0 + SO, 3) * 2.0));
    // 明亮甲烷云条纹：只影响反照率，不进高度场（规格 7.10）
    float st = sstep(0.78, 0.92, fbm(vec3(lon * 2.5, P.y * 6.0, uSeed * 30.0), 4));
    alb += vec3(0.22, 0.26, 0.28) * st * 0.6;
    if (uSurf == S_NEPTUNE) {
      vec3 cdk = llDir(0.9, -0.35);
      float g = exp(-(1.0 - dot(P, cdk)) / 0.02);
      alb *= 1.0 - 0.5 * g;
    }
    limbK = 1.0;
  } else if (uSurf == S_IO) {
    alb = vec3(0.52, 0.38, 0.12) * (0.75 + 0.5 * fbm(P * 4.0 + SO, 5));
    vec4 wv = worley(P * 9.0 + SO);
    float pit = sstep(0.22, 0.05, wv.x);
    alb = mix(alb, vec3(0.07, 0.05, 0.03), pit * 0.8);
    float hot = sstep(0.07, 0.0, wv.x) * step(0.6, wv.z);
    emit = vec3(1.0, 0.45, 0.12) * hot * 0.35;
    float frost = sstep(0.80, 0.95, abs(P.y));
    alb = mix(alb, vec3(0.70, 0.68, 0.60), frost * 0.4);
    h = fbm(P * 10.0 + SO, 4) * 0.3;
    bk = 0.004;
  } else if (uSurf == S_EUROPA) {
    float l1 = abs(fbm(P * 7.0 + SO, 5) - 0.5);
    float l2 = abs(fbm(P * 15.0 + SO + 4.0, 5) - 0.5);
    float l3 = abs(fbm(P * 33.0 + SO + 9.0, 4) - 0.5);
    float lines = max(sstep(0.035, 0.0, l1), max(sstep(0.028, 0.0, l2) * 0.8, sstep(0.020, 0.0, l3) * 0.5));
    alb = vec3(0.62, 0.60, 0.56) * (0.9 + 0.2 * fbm(P * 3.0 + SO, 3));
    alb = mix(alb, vec3(0.55, 0.30, 0.18), lines * 0.6);
    h = fbm(P * 6.0 + SO, 4) * 0.05;
    bk = 0.003;
  } else if (uSurf == S_TITAN) {
    alb = vec3(0.40, 0.25, 0.10) * (0.93 + 0.14 * fbm(P * 3.0 + SO, 4));
    wrapK = 0.40;     // 晨昏线特别柔和
  } else if (uSurf == S_TRITON) {
    vec2 cs = craterStack(P + SO, 0.25);
    alb = vec3(0.62, 0.58, 0.56) * (0.9 + 0.2 * fbm(P * 4.0 + SO, 4));
    alb = mix(alb, vec3(0.70, 0.50, 0.45), sstep(0.7, 0.9, -P.y));
    alb *= 1.0 + 0.2 * cs.y;
    h = cs.x * 0.25;
    bk = 0.004;
  } else if (uSurf == S_HALLEY) {
    alb = vec3(0.035, 0.030, 0.028) * (0.6 + 0.8 * fbm(P * 4.0 + SO, 5));
    h = fbm(P * 7.0 + SO, 5) * 0.6;
    bk = 0.05;
  }

  // ---- 光照 ----
  // 凹凸：无条件调用（dFdx 必须在一致的控制流中）；bk=0 时等同于原法线
  vec3 N = bumpN(N0, vWorld, h, bk);
  float ndl = dot(N, L);
  float diff = clamp((ndl + wrapK) / (1.0 + wrapK), 0.0, 1.0);
  vec3 Ld = normalize(transpose(mat3(uModel)) * L);   // 太阳方向（物体空间）
  float rs = ringShadow(P, Ld);
  vec3 col = alb * uSunI * diff * rs;
  if (specK > 0.0) {
    vec3 H = normalize(L + V);
    col += vec3(0.9) * specK * pow(max(dot(N, H), 0.0), specPow) * uSunI * diff;
  }
  if (limbK > 0.0) {
    float mu = max(dot(N0, V), 0.0);
    col *= mix(1.0, 0.45 + 0.55 * pow(mu, 0.5), limbK);
  }
  col += emit;
  oColor = vec4(col, 1.0);
}
`;

  // ---------- 大气壳层（规格 5.9）：按视线撞击参数积分 ----------
  // uniforms: uModel(壳层), uViewProj, uEye, uCenter, uRadius(世界), uH(标高), uCol, uStrength, uSunPos
  const atmoVS = `
uniform mat4 uModel;
uniform mat4 uViewProj;
in vec3 aPos;
out vec3 vWorld;
void main() {
  vec4 w = uModel * vec4(aPos, 1.0);
  vWorld = w.xyz;
  gl_Position = uViewProj * w;
}
`;
  const atmoFS = `
uniform vec3 uEye;
uniform vec3 uCenter;
uniform float uRadius;
uniform float uH;
uniform vec3 uCol;
uniform float uStrength;
uniform vec3 uSunPos;
in vec3 vWorld;
out vec4 oColor;
void main() {
  vec3 rd = normalize(vWorld - uEye);
  vec3 oc = uCenter - uEye;
  float tca = dot(oc, rd);
  float b = sqrt(max(dot(oc, oc) - tca * tca, 0.0)) / uRadius;
  float dens = exp(-max(b - 1.0, 0.0) / uH);
  dens *= 1.0 - sstep(1.0, 0.960, b) * 0.86;          // 盘面内只穿过半层大气
  vec3 pc = uEye + rd * tca - uCenter;                 // 视线离球心最近点
  float pl = length(pc);
  vec3 an = pl > 1e-4 ? pc / pl : -rd;

    const h = String(hex || '#808080').replace('#', '');
    const v = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return [srgbToLin(((v >> 16) & 255) / 255), srgbToLin(((v >> 8) & 255) / 255), srgbToLin((v & 255) / 255)];
  }

  // 小行星颜色：按 pops 的 [start, start+count) 填充（每粒子 3 float，线性）
  function buildAsteroidColors(n, pops) {
    const col = new Float32Array(n * 3);
    col.fill(0.5);
    if (pops && pops.length) {
      for (const p of pops) {
        const c = hexToLin(p.color);
        const end = Math.min(n, p.start + p.count);
        for (let i = p.start; i < end; i++) {
          col[i * 3] = c[0];
          col[i * 3 + 1] = c[1];
          col[i * 3 + 2] = c[2];
        }
      }
    }
    return col;
  }

  // ---------- GL 辅助 ----------
  function compile(gl, type, src, label) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh) || '';
      gl.deleteShader(sh);
      throw new Error('[GLR] 着色器编译失败 ' + label + ': ' + log);
    }
    return sh;
  }

  function makeProgram(gl, vsSrc, fsSrc, label) {
    const vs = compile(gl, gl.VERTEX_SHADER, vsSrc, label + '.vert');
    const fs = compile(gl, gl.FRAGMENT_SHADER, fsSrc, label + '.frag');
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    for (const name of Object.keys(ATTR)) gl.bindAttribLocation(p, ATTR[name], name);
    gl.linkProgram(p);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(p) || '';
      gl.deleteProgram(p);
      throw new Error('[GLR] 程序链接失败 ' + label + ': ' + log);
    }
    return { p, u: Object.create(null) };
  }

  function loc(prog, name) {
    let l = prog.u[name];
    if (l === undefined) {
      l = prog.gl.getUniformLocation(prog.p, name);
      prog.u[name] = l;
    }
    return l;
  }

  // ---------- 程序与静态资源 ----------
  let lastError = null;

  function makePrograms(gl) {
    const P = {};
    const mk = (name, key, defs) => {
      const pair = SH.programs[key];
      const vs = SH.expand(pair[0], null);
      const fs = SH.expand(pair[1], defs || null);
      const prog = makeProgram(gl, vs, fs, name);
      prog.gl = gl;
      P[name] = prog;
    };
    mk('bg', 'bg');
    mk('star', 'star');
    mk('sun', 'sun');
    mk('body', 'body');
    mk('ribbon', 'ribbon');
    mk('asteroid', 'asteroid');
    mk('atmo', 'atmo');
    mk('ring1', 'ring', { RING_KIND: 1 });   // 土星
    mk('ring2', 'ring', { RING_KIND: 2 });   // 天王星
    mk('ring3', 'ring', { RING_KIND: 3 });   // 木星
    mk('tail', 'tail');
    mk('sprite', 'sprite');
    mk('corona', 'corona');
    mk('thresh', 'thresh');
    mk('down', 'down');
    mk('up', 'up');
    mk('comp', 'comp');
    return P;
  }

  function attr(gl, loc, size, stride, offset) {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, offset);
  }

  function makeIndexedVAO(gl, verts, idx) {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
    attr(gl, ATTR.aPos, 3, 12, 0);
    const ibo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    return { vao, count: idx.length };
  }

  function setupStatic(r, asteroidData) {
    const gl = r.gl;
    const cbf = gl.getExtension('EXT_color_buffer_float');
    const fb = gl.getExtension('EXT_float_blend');
    r.floatBlend = !!fb;
    r.hdrCap = !!(cbf && fb);
    const maxS = gl.getParameter(gl.MAX_SAMPLES) || 0;
    r.samplesWanted = Math.min(4, maxS);
    r.P = makePrograms(gl);

    r.emptyVao = gl.createVertexArray();

    const sph = buildSphereMesh(SPHERE_SEG, SPHERE_RING);
    r.sphere = makeIndexedVAO(gl, sph.verts, sph.idx);

    const rm = buildRingMesh(RING_R0, RING_R1, RING_NR, RING_NA);
    r.ring = makeIndexedVAO(gl, rm.verts, rm.idx);

    // 恒星：8 float 交错
    const stars = buildStars(STAR_N, 20240607);
    r.starVao = gl.createVertexArray();
    gl.bindVertexArray(r.starVao);
    r.starVbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, r.starVbo);
    gl.bufferData(gl.ARRAY_BUFFER, stars, gl.STATIC_DRAW);
    attr(gl, ATTR.aPos, 3, 32, 0);
    attr(gl, ATTR.aColor, 3, 32, 12);
    attr(gl, ATTR.aMag, 1, 32, 24);
    attr(gl, ATTR.aSeed, 1, 32, 28);
    gl.bindVertexArray(null);
    r.starCount = STAR_N;

    // 小行星：data 为 EPH 提供的 Float32Array(N*8)，只上传一次
    const ad = asteroidData && asteroidData.data ? asteroidData.data : null;
    if (!ad) throw new Error('[GLR] asteroidData 缺失');
    const data = ad instanceof Float32Array ? ad : Float32Array.from(ad);
    r.astCount = Math.floor(data.length / 8);
    const colors = buildAsteroidColors(r.astCount, asteroidData.pops);
    r.astVao = gl.createVertexArray();
    gl.bindVertexArray(r.astVao);
    r.astVbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, r.astVbo);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    attr(gl, ATTR.aA, 4, 32, 0);
    attr(gl, ATTR.aB, 4, 32, 16);
    r.astColVbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, r.astColVbo);
    gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
    attr(gl, ATTR.aCol, 3, 12, 0);
    gl.bindVertexArray(null);

    // 日冕 / 彗发 的广告牌四边形
    r.quadVao = gl.createVertexArray();
    gl.bindVertexArray(r.quadVao);
    r.quadVbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, r.quadVbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    attr(gl, ATTR.aCorner, 2, 8, 0);
    gl.bindVertexArray(null);

    // 轨道缎带与彗尾：每条一个动态 VBO + VAO（按需创建）
    r.ribbonBufs = new Map();
    r.tailVao = gl.createVertexArray();
    gl.bindVertexArray(r.tailVao);
    r.tailVbo = gl.createBuffer();
    r.tailCap = 0;
    gl.bindBuffer(gl.ARRAY_BUFFER, r.tailVbo);
    attr(gl, ATTR.aPos, 3, 44, 0);
    attr(gl, ATTR.aTan, 3, 44, 12);
    attr(gl, ATTR.aSide, 1, 44, 24);
    attr(gl, ATTR.aAlong, 1, 44, 28);
    attr(gl, ATTR.aAlpha, 1, 44, 32);
    attr(gl, ATTR.aKind, 1, 44, 36);
    attr(gl, ATTR.aHalf, 1, 44, 40);
    gl.bindVertexArray(null);

    r.shellM = [];
    for (let i = 0; i < 32; i++) r.shellM.push(new Float32Array(16));
    r.nucM = new Float32Array(16);
    r.ringCache = null;
  }

  function ribbonBuf(r, key) {
    let b = r.ribbonBufs.get(key);
    if (b) return b;
    const gl = r.gl;
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    attr(gl, ATTR.aPos, 3, 44, 0);
    attr(gl, ATTR.aPrev, 3, 44, 12);
    attr(gl, ATTR.aNext, 3, 44, 24);
    attr(gl, ATTR.aSide, 1, 44, 36);
    attr(gl, ATTR.aAlpha, 1, 44, 40);
    gl.bindVertexArray(null);
    b = { vao, vbo, cap: 0 };
    r.ribbonBufs.set(key, b);
    return b;
  }

  // 动态上传：容量不足时 bufferData 扩容，否则 bufferSubData
  function uploadDyn(gl, vbo, cap, arr) {
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    if (arr.byteLength > cap) {
      gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
      return arr.byteLength;
    }
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr);
    return cap;
  }

  // ---------- 帧缓冲（规格 4.1）----------
  function setTexParams(gl, filter) {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  function fbOK(gl) {
    return gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  }

  function freeTargets(r) {
    const gl = r.gl;
    const t = r.t;
    if (!t) return;
    if (t.sceneTex) gl.deleteTexture(t.sceneTex);
    if (t.sceneFbo) gl.deleteFramebuffer(t.sceneFbo);
    if (t.sceneDepth) gl.deleteRenderbuffer(t.sceneDepth);
    if (t.msaaFbo) gl.deleteFramebuffer(t.msaaFbo);
    if (t.msaaRb) gl.deleteRenderbuffer(t.msaaRb);
    if (t.msaaDepth) gl.deleteRenderbuffer(t.msaaDepth);
    for (const x of t.bloomTex) gl.deleteTexture(x);
    for (const x of t.bloomFbo) gl.deleteFramebuffer(x);
    r.t = null;
  }

  // 尝试构建一组目标：返回 null 表示场景 FBO 不完整。MSAA 不完整时在内部退回非 MSAA。
  function tryTargets(r, w, h, hdr, samples) {
    const gl = r.gl;
    const fmt = hdr ? gl.RGBA16F : gl.RGBA8;
    const t = {
      hdr, samples: 0,
      sceneTex: null, sceneFbo: null, sceneDepth: null,
      msaaFbo: null, msaaRb: null, msaaDepth: null,
      bloomTex: [], bloomFbo: [], bloomW: [], bloomH: [],
    };
    // 解析用场景纹理 + 带深度的 FBO
    t.sceneTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t.sceneTex);
    gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, w, h);
    setTexParams(gl, gl.LINEAR);
    t.sceneFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.sceneFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.sceneTex, 0);
    t.sceneDepth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, t.sceneDepth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH24_STENCIL8, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.RENDERBUFFER, t.sceneDepth);
    if (!fbOK(gl)) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      t.hdr = hdr;
      freeTargets({ gl, t });
      return null;
    }
    // 多重采样 FBO（失败则退回 0）
    if (samples > 0) {
      t.msaaFbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, t.msaaFbo);
      t.msaaRb = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, t.msaaRb);
      gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, fmt, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, t.msaaRb);
      t.msaaDepth = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, t.msaaDepth);
      gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, gl.DEPTH24_STENCIL8, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.RENDERBUFFER, t.msaaDepth);
      if (fbOK(gl)) {
        t.samples = samples;
      } else {
        gl.deleteFramebuffer(t.msaaFbo); t.msaaFbo = null;
        gl.deleteRenderbuffer(t.msaaRb); t.msaaRb = null;
        gl.deleteRenderbuffer(t.msaaDepth); t.msaaDepth = null;
        while (gl.getError() !== gl.NO_ERROR) { /* 清除 MSAA 尝试留下的错误标志 */ }
      }
    }
    // 泛光链：6 级，level i 尺寸 = 场景 >> (i+1)
    let bw = w;
    let bh = h;
    for (let i = 0; i < 6; i++) {
      bw = Math.max(1, bw >> 1);
      bh = Math.max(1, bh >> 1);
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, bw, bh);
      setTexParams(gl, gl.LINEAR);
      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      t.bloomTex.push(tex);
      t.bloomFbo.push(fbo);
      t.bloomW.push(bw);
      t.bloomH.push(bh);
      if (!fbOK(gl)) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        freeTargets({ gl, t });
        return null;
      }
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.bindRenderbuffer(gl.RENDERBUFFER, null);
    gl.bindTexture(gl.TEXTURE_2D, null);
    return t;
  }

  // 构建目标：先 HDR，失败则 RGBA8；MSAA 在 tryTargets 内部退回
  function buildTargets(r, w, h) {
    freeTargets(r);
    let hdr = r.hdrCap;
    let t = tryTargets(r, w, h, hdr, r.samplesWanted);
    if (!t && hdr) {
      hdr = false;
      t = tryTargets(r, w, h, false, r.samplesWanted);
    }
    if (!t) throw new Error('[GLR] 帧缓冲不完整');
    r.t = t;
    r.hdr = t.hdr;
    r.msaa = t.samples;
    r.w = w;
    r.h = h;
  }

  // ---------- 每帧绘制 ----------
  function setF(prog, name, v) {
    const l = loc(prog, name);
    if (l) prog.gl.uniform1f(l, v);
  }
  function setI(prog, name, v) {
    const l = loc(prog, name);
    if (l) prog.gl.uniform1i(l, v);
  }
  function setV2(prog, name, a, b) {
    const l = loc(prog, name);
    if (l) prog.gl.uniform2f(l, a, b);
  }
  function setV3(prog, name, a) {
    const l = loc(prog, name);
    if (l) prog.gl.uniform3f(l, a[0], a[1], a[2]);
  }
  function setM4(prog, name, m) {
    const l = loc(prog, name);
    if (l) prog.gl.uniformMatrix4fv(l, false, m);
  }
  function blendAdd(gl) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
  }
  function blendAlpha(gl) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  }
  // 像素比例：以 1080 行为基准（ribbon 的 halfWidthPx 另行按绘图缓冲像素解释）
  function pxScale(f) {
    return Math.max(0.5, f.height / 1080);
  }
  function normUnit(v) {
    const l = Math.hypot(v[0], v[1], v[2]) || 1;
    return [v[0] / l, v[1] / l, v[2] / l];
  }

  function beginScene(r) {
    const gl = r.gl;
    const t = r.t;
    gl.bindFramebuffer(gl.FRAMEBUFFER, r.msaa ? t.msaaFbo : t.sceneFbo);
    gl.viewport(0, 0, r.w, r.h);
    gl.depthMask(true);                       // 规格 7.1：清除前必须开启深度写
    gl.colorMask(true, true, true, true);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
    gl.disable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);
  }

  function drawBackground(r) {
    const gl = r.gl;
    const pr = r.P.bg;
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.disable(gl.BLEND);
    gl.useProgram(pr.p);
    setM4(pr, 'uInvViewProj', r.cam.invViewProj);
    setV3(pr, 'uEye', r.cam.eye);
    setV3(pr, 'uGalN', r.galN);
    gl.bindVertexArray(r.emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function drawStars(r, f) {
    const gl = r.gl;
    const pr = r.P.star;
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    blendAdd(gl);
    gl.useProgram(pr.p);
    setM4(pr, 'uView', r.cam.view);
    setM4(pr, 'uProj', r.cam.proj);
    setF(pr, 'uTime', f.nowSec);
    setF(pr, 'uPx', pxScale(f));
    gl.bindVertexArray(r.starVao);
    gl.drawArrays(gl.POINTS, 0, r.starCount);
  }

  // 球体系（太阳 + 行星 + 卫星）。哈雷彗星核由 drawComets 绘制。
  function drawBodies(r, f) {
    const gl = r.gl;
    const cam = r.cam;
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.depthMask(true);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.frontFace(gl.CCW);
    gl.disable(gl.BLEND);
    gl.bindVertexArray(r.sphere.vao);
    const bodies = f.bodies;
    // 太阳
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.surface !== 'sun') continue;
      const ps = r.P.sun;
      gl.useProgram(ps.p);
      setM4(ps, 'uModel', b.model);
      setM4(ps, 'uViewProj', cam.viewProj);
      setV3(ps, 'uEye', cam.eye);
      setF(ps, 'uTime', f.nowSec);
      gl.drawElements(gl.TRIANGLES, r.sphere.count, gl.UNSIGNED_INT, 0);
    }
    // 行星、卫星、矮行星
    const pr = r.P.body;
    gl.useProgram(pr.p);
    setM4(pr, 'uViewProj', cam.viewProj);
    setV3(pr, 'uEye', cam.eye);
    setV3(pr, 'uSunPos', f.sunPos);
    setF(pr, 'uTime', f.nowSec);
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.surface === 'sun' || b.surface === 'halley') continue;
      if (b.group === 'moon' && !(f.flags && f.flags.moons)) continue;   // 卫星开关关闭时隐藏卫星球体
      drawBodySphere(r, pr, b, f, b.model);
    }
  }

  // 单个程式化表面（body 程序已绑定）
  function drawBodySphere(r, pr, b, f, model) {
    const gl = r.gl;
    const rings = b.rings;
    setM4(pr, 'uModel', model);
    setF(pr, 'uSunI', b.sunIntensity);
    setF(pr, 'uSeed', b.seed);
    setI(pr, 'uSurf', SURF[b.surface] || 0);
    setF(pr, 'uTurb', b.surface === 'jupiter' ? 1.0 : (b.surface === 'saturn' ? 0.42 : 0.0));
    setI(pr, 'uRingKind', rings ? rings.kind : 0);
    setF(pr, 'uRingInner', rings ? rings.inner : 0);
    setF(pr, 'uRingOuter', rings ? rings.outer : 0);
    setV3(pr, 'uCenter', b.center);
    setF(pr, 'uRadius', b.radius);
    gl.drawElements(gl.TRIANGLES, r.sphere.count, gl.UNSIGNED_INT, 0);
  }

  function drawRibbons(r, f) {
    const gl = r.gl;
    if (!f.ribbons || f.ribbons.length === 0) return;
    const pr = r.P.ribbon;
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    blendAdd(gl);
    gl.useProgram(pr.p);
    setM4(pr, 'uViewProj', r.cam.viewProj);
    setV2(pr, 'uViewport', r.w, r.h);
    for (let i = 0; i < f.ribbons.length; i++) {
      const rb = f.ribbons[i];
      const buf = ribbonBuf(r, rb.key);
      buf.cap = uploadDyn(gl, buf.vbo, buf.cap, rb.data);
      gl.bindVertexArray(buf.vao);
      setF(pr, 'uHalfPx', rb.halfWidthPx);
      setV3(pr, 'uColor', rb.color);
      setF(pr, 'uBright', rb.brightness);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, rb.vertexCount);
    }
  }

  function drawAsteroids(r, f) {
    const gl = r.gl;
    if (!f.flags || !f.flags.asteroids) return;
    const pr = r.P.asteroid;
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    blendAdd(gl);
    gl.useProgram(pr.p);
    setF(pr, 'uJd', f.jdRel);
    setF(pr, 'uCompress', f.compress);
    setF(pr, 'uScale', f.displayScale);
    setM4(pr, 'uViewProj', r.cam.viewProj);
    setV3(pr, 'uEye', r.cam.eye);
    setF(pr, 'uPx', pxScale(f));
    setF(pr, 'uPtK', GLR_ASTEROID_PT_K);
    gl.bindVertexArray(r.astVao);
    gl.drawArrays(gl.POINTS, 0, r.astCount);
  }

  function drawAtmospheres(r, f) {
    const gl = r.gl;
    const pr = r.P.atmo;
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.depthMask(false);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);                     // 只画前表面：每个像素射线只积分一次
    blendAdd(gl);
    gl.useProgram(pr.p);
    setM4(pr, 'uViewProj', r.cam.viewProj);
    setV3(pr, 'uEye', r.cam.eye);
    setV3(pr, 'uSunPos', f.sunPos);
    gl.bindVertexArray(r.sphere.vao);

    for (let i = 0; i < bodies.length; i++) {

      setV3(pr, 'uCenter', b.center);
      setF(pr, 'uRadius', b.radius);
      setF(pr, 'uH', at.height);
      setV3(pr, 'uCol', at.color);
      setF(pr, 'uStrength', at.strength);

  }

    const gl = r.gl;
    const bodies = f.bodies;
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    blendAlpha(gl);
    gl.bindVertexArray(r.ring.vao);
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      const rg = b.rings;
      if (!rg) continue;
      const pr = r.P['ring' + rg.kind];
      gl.useProgram(pr.p);
      setM4(pr, 'uModel', b.model);
      setM4(pr, 'uViewProj', r.cam.viewProj);
      setV3(pr, 'uEye', r.cam.eye);
      setV3(pr, 'uSunPos', f.sunPos);
      setF(pr, 'uSunI', b.sunIntensity);
      setV3(pr, 'uCenter', b.center);
      setF(pr, 'uRadius', b.radius);
      setV3(pr, 'uRingCol', RING_COL[rg.kind]);
      setF(pr, 'uRingInner', rg.inner);
      setF(pr, 'uRingOuter', rg.outer);
      gl.drawElements(gl.TRIANGLES, r.ring.count, gl.UNSIGNED_INT, 0);
    }
  }

      const pu = r.P.up;

        gl.viewport(0, 0, t.bloomW[i], t.bloomH[i]);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, t.bloomTex[i + 1]);
        setI(pu, 'uSrc', 0);
        setV2(pu, 'uTexel', 1.0 / t.bloomW[i + 1], 1.0 / t.bloomH[i + 1]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      gl.disable(gl.BLEND);
    }

    // 合成 → 默认帧缓冲
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, w, h);
    const pc = r.P.comp;
    gl.useProgram(pc.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, t.sceneTex);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, t.bloomTex[0]);
    setI(pc, 'uScene', 0);
    setI(pc, 'uBloom', 1);
    setF(pc, 'uBloomK', glow ? 0.22 : 0.0);
    setF(pc, 'uTime', f.nowSec);
    const fl = f.flare || { sunNdc: [0, 0], visibility: 0 };
    setV2(pc, 'uSunUV', fl.sunNdc[0] * 0.5 + 0.5, fl.sunNdc[1] * 0.5 + 0.5);
    setF(pc, 'uFlareVis', fl.visibility);
    setF(pc, 'uAspect', w / h);
    setF(pc, 'uExposure', 1.0);
    gl.bindVertexArray(r.emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.activeTexture(gl.TEXTURE0);
  }

  const GLR_ASTEROID_PT_K = ASTEROID_PT_K;

  // ---------- 公共 API ----------
  function create(canvas, asteroidData) {
    let gl = null;
    try {
      gl = canvas.getContext('webgl2', {
        alpha: false,
        antialias: false,
        depth: false,
        stencil: false,
        premultipliedAlpha: false,
        preserveDrawingBuffer: false,
        powerPreference: 'high-performance',
      });
    } catch (e) {
      gl = null;
    }

      gl, P: null, t: null, w: 0, h: 0, hdr: false, hdrCap: false, floatBlend: false, msaa: 0,
      samplesWanted: 0, cam: null, galN: normUnit(GAL_N),

      console.error(e);
      return null;

  }

  function render(r, f) {
    if (!r || !f) return;
    if (!(f.width > 0 && f.height > 0)) return;
    if (!r.t || f.width !== r.w || f.height !== r.h) {
      buildTargets(r, f.width, f.height);
    }
    r.cam = f.camera;
    beginScene(r);
    drawBackground(r);
    drawStars(r, f);
    drawBodies(r, f);
    drawRibbons(r, f);
    drawAsteroids(r, f);
    drawAtmospheres(r, f);
    drawRings(r, f);
    drawComets(r, f);
    drawCorona(r, f);
    postProcess(r, f);
  }

  function info(r) {
    return { hdr: !!(r && r.hdr), msaa: (r && r.msaa) | 0, floatBlend: !!(r && r.floatBlend) };
  }

  function readCenterHDR(r) {
    if (!r || !r.t) return [0, 0, 0, 0];
    const gl = r.gl;
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, r.t.sceneFbo);
    const x = r.w >> 1;
    const y = r.h >> 1;
    let out;
    if (r.hdr) {
      const buf = new Float32Array(4);
      gl.readPixels(x, y, 1, 1, gl.RGBA, gl.FLOAT, buf);
      out = [buf[0], buf[1], buf[2], buf[3]];
    } else {
      const buf = new Uint8Array(4);
      gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      out = [buf[0] / 255, buf[1] / 255, buf[2] / 255, buf[3] / 255];
    }
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    return out;
  }

  return {
    create,
    render,
    info,
    readCenterHDR,
    // 以下为测试与调试用的纯函数导出
    SURF, ATTR, RING_COL, STAR_N, SPHERE_SEG, SPHERE_RING, RING_NR, RING_NA, ASTEROID_PT_K, GAL_N,

        role: role,
        K: K,
        pos: new Float64Array(3 * K),
        alpha: new Float64Array(K),
        data: new Float32Array(2 * (K + 1) * STRIDE),
        color: VM.hexToLinear(b.color),
        halfWidthBase: RIBBON_PX[role],
        brightness: RIBBON_BRIGHT[role],
      });
    });
    return defs;
  }

  // ---- scene ----

  function create() {
    return {
      clock: { jd: EPH.jdFromUnixMs(Date.now()), speedV: 0, paused: false },
      nowSec: 0,
      flags: { orbits: true, names: true, moons: true, asteroids: true, comets: true, glow: true, realScale: false },
      compress: C_MIN, compressFrom: C_MIN, compressTo: C_MIN, compressT: 1,
      focusId: null,
      camera: {
        yaw: YAW0, pitch: PITCH0,
        dist: DIST0, distSm: DIST0,          // desired and smoothed distance
        target: [0, 0, 0],                   // displayed target (last frame)
        offset: [0, 0, 0],                   // displayed target minus desired target
        focusDirty: false,
      },
      spinPhase: new Float64Array(N),
      cen: new Float64Array(3 * N),          // world centres of the current frame
      rAU: new Float64Array(N),              // heliocentric distance (parent's for moons)
      tail: new Float32Array(TAIL_VERTS * STRIDE),
      ribbonDefs: makeRibbonDefs(),
      nowMsLast: 0,
    };
  }

  function setRealScale(scene, on) {
    const want = !!on;
    if (scene.flags.realScale === want) return;
    scene.flags.realScale = want;
    scene.compressFrom = scene.compress;
    scene.compressTo = want ? C_MAX : C_MIN;
    scene.compressT = 0;
  }

  function advanceCompress(scene, dt) {
    if (scene.compressT >= 1) { scene.compress = scene.compressTo; return; }
    scene.compressT = Math.min(1, scene.compressT + dt / COMPRESS_TIME);
    if (scene.compressT >= 1) {
      scene.compress = scene.compressTo;
    } else {
      const e = VM.sstep(0, 1, scene.compressT);
      scene.compress = scene.compressFrom + (scene.compressTo - scene.compressFrom) * e;
    }
  }

  function setSpeedSlider(scene, v) {
    const x = Number(v);
    if (Number.isFinite(x)) scene.clock.speedV = clamp(x, -100, 100);
  }

  function setPaused(scene, p) { scene.clock.paused = !!p; }

  function togglePaused(scene) {
    scene.clock.paused = !scene.clock.paused;
    return scene.clock.paused;
  }

  function resetToNow(scene, nowMs) {
    const jd = EPH.jdFromUnixMs(nowMs);
    if (Number.isFinite(jd)) scene.clock.jd = jd;
  }

  function setJd(scene, jd) {
    if (Number.isFinite(jd)) scene.clock.jd = jd;
  }

  function clockInfo(scene) {
    const c = scene.clock;
    return {
      jd: c.jd,
      speedV: c.speedV,
      speedDaysPerSec: speedDaysPerSec(c.speedV),
      paused: c.paused,
      inRange: EPH.inValidRange(c.jd),
    };
  }

  function bodyIndex(scene, id) { return EPH.indexOf(id); }

  // id = null returns to the global view (sun, distance 750). Otherwise the distance is 6 radii, clamped.
  function focus(scene, id) {
    const cam = scene.camera;
    if (id === null || id === undefined) {
      scene.focusId = null;
      cam.dist = DIST0;
    } else {
      const i = EPH.indexOf(id);   // throws on an unknown id
      scene.focusId = id;
      cam.dist = clamp(FOCUS_RADIUS_MULT * RADIUS[i], FOCUS_DIST_MIN, FOCUS_DIST_MAX);
    }
    cam.focusDirty = true;
  }

  function wrapYaw(y) { return wrapPi(y); }

  function orbit(scene, dYaw, dPitch) {
    const cam = scene.camera;
    if (Number.isFinite(dYaw)) cam.yaw = wrapYaw(cam.yaw + dYaw);
    if (Number.isFinite(dPitch)) cam.pitch = clamp(cam.pitch + dPitch, -PITCH_LIMIT, PITCH_LIMIT);
  }

  function zoom(scene, factor) {
    if (!Number.isFinite(factor) || factor <= 0) return;
    scene.camera.dist = clamp(scene.camera.dist * factor, DIST_MIN, DIST_MAX);
  }

  // ---- per-frame geometry ----

  function computeCentres(scene, jd, c) {
    const cen = scene.cen, rAU = scene.rAU;
    for (let i = 0; i < N; i++) {
      const b = EPH.BODIES[i];
      if (i === SUN_I) {
        cen[3 * i] = 0; cen[3 * i + 1] = 0; cen[3 * i + 2] = 0;
        rAU[i] = 0;
      } else if (b.group === 'moon') {
        // Parents precede their moons in EPH.BODIES, so the parent centre is already current.
        const p = PARENT[i];
        const d = EPH.moonDirEcl(b.id, jd);
        const dd = MOON_DIST[i];
        cen[3 * i] = cen[3 * p] + dd * d[0];
        cen[3 * i + 1] = cen[3 * p + 1] + dd * d[2];
        cen[3 * i + 2] = cen[3 * p + 2] - dd * d[1];
        rAU[i] = rAU[p];
      } else {
        const p = EPH.helioPosEcl(b.id, jd);
        const w = dispWorld(p, c);
        cen[3 * i] = w[0]; cen[3 * i + 1] = w[1]; cen[3 * i + 2] = w[2];
        rAU[i] = Math.hypot(p[0], p[1], p[2]);
      }
    }
  }

  // Model = T * [X', Y, Z'] * S, where X' and Z' are the basis rotated about Y by spinPhase.
  // RotY(phi) maps X -> cos*X - sin*Z and Z -> sin*X + cos*Z.
  function modelMatrix(i, center, phase) {
    const cs = Math.cos(phase), sn = Math.sin(phase);
    const X = BASIS_X[i], Y = BASIS_Y[i], Z = BASIS_Z[i];
    const X2 = [cs * X[0] - sn * Z[0], cs * X[1] - sn * Z[1], cs * X[2] - sn * Z[2]];
    const Z2 = [sn * X[0] + cs * Z[0], sn * X[1] + cs * Z[1], sn * X[2] + cs * Z[2]];
    return VM.mat4FromBasisOrigin(center, X2, Y, Z2, RADIUS[i]);
  }

  function buildBodies(scene, c) {
    const out = new Array(N);
    const cen = scene.cen;
    for (let i = 0; i < N; i++) {
      const b = EPH.BODIES[i];
      const center = [cen[3 * i], cen[3 * i + 1], cen[3 * i + 2]];
      const phase = wrap2pi(scene.spinPhase[i]);
      const r = scene.rAU[i];
      const sunI = i === SUN_I ? 0 : clamp(1.5 * Math.pow(1 / r, 0.4), 0.26, 2.1);
      const atmo = ATMO[i];
      const rings = RINGS[i];
      out[i] = {
        id: b.id,
        index: i,
        group: b.group,
        parentIndex: PARENT[i],
        surface: b.id,
        center: center,
        radius: RADIUS[i],
        axis: AXIS[i],
        spinPhase: phase,
        model: modelMatrix(i, center, phase),
        sunIntensity: sunI,
        rAU: r,
        atmosphere: atmo ? { height: atmo.height, color: atmo.color, strength: atmo.strength } : null,
        rings: rings ? { kind: rings.kind, inner: rings.inner, outer: rings.outer } : null,
        seed: SEED[i],
      };
    }
    return out;
  }

  // Writes the triangle-strip vertices for one ribbon (2 per sample, K+1 samples, closed loop).
  function writeStrip(def) {
    const K = def.K, P = def.pos, A = def.alpha, D = def.data;
    for (let k = 0; k <= K; k++) {
      const i0 = k % K;
      const ip = (i0 + K - 1) % K;
      const inx = (i0 + 1) % K;
      for (let sd = 0; sd < 2; sd++) {
        const o = (2 * k + sd) * STRIDE;
        D[o] = P[3 * i0]; D[o + 1] = P[3 * i0 + 1]; D[o + 2] = P[3 * i0 + 2];
        D[o + 3] = P[3 * ip]; D[o + 4] = P[3 * ip + 1]; D[o + 5] = P[3 * ip + 2];
        D[o + 6] = P[3 * inx]; D[o + 7] = P[3 * inx + 1]; D[o + 8] = P[3 * inx + 2];
        D[o + 9] = sd === 0 ? -1 : 1;
        D[o + 10] = A[i0];
      }
    }
  }

  function fillRibbon(scene, def, jd, c) {
    const K = def.K, P = def.pos, A = def.alpha;
    if (!def.moon) {
      // Heliocentric orbit sampled uniformly in eccentric anomaly. EPH.ellipsePointEcl is linear in
      // (cos E, sin E): p(E) = U cos E + V sin E + W. Three EPH calls give U, V, W exactly, which avoids
      // K allocations and trig calls per sample.
      const el = EPH.planetElements(def.key, jd);
      const e = el.e, Mb = el.M;
      const p0 = EPH.ellipsePointEcl(el, 0);
      const pPi = EPH.ellipsePointEcl(el, Math.PI);
      const pHalf = EPH.ellipsePointEcl(el, Math.PI / 2);
      const U = [(p0[0] - pPi[0]) / 2, (p0[1] - pPi[1]) / 2, (p0[2] - pPi[2]) / 2];
      const W = [(p0[0] + pPi[0]) / 2, (p0[1] + pPi[1]) / 2, (p0[2] + pPi[2]) / 2];
      const V = [pHalf[0] - W[0], pHalf[1] - W[1], pHalf[2] - W[2]];
      for (let k = 0; k < K; k++) {
        const E = TWO_PI * k / K;
        const cs = Math.cos(E), sn = Math.sin(E);
        const x = U[0] * cs + V[0] * sn + W[0];
        const y = U[1] * cs + V[1] * sn + W[1];
        const z = U[2] * cs + V[2] * sn + W[2];
        const s = dispScale(Math.hypot(x, y, z), c);
        P[3 * k] = s * x; P[3 * k + 1] = s * z; P[3 * k + 2] = -s * y;
        const Mk = E - e * sn;
        A[k] = alphaOfLag(wrap2pi(Mb - Mk) / TWO_PI);
      }
    } else {
      // Circle around the parent's display centre, radius = moon display distance.
      // EPH.moonOrbitPoint(id, th) = X cos th + V sin th with X = (th=0) and V = (th=pi/2).
      const bi = def.bodyIndex;
      const pi = PARENT[bi];
      const cx = scene.cen[3 * pi], cy = scene.cen[3 * pi + 1], cz = scene.cen[3 * pi + 2];
      const d = MOON_DIST[bi];
      const thB = EPH.moonPhase(def.key, jd);
      const X = EPH.moonOrbitPoint(def.key, 0);
      const V = EPH.moonOrbitPoint(def.key, Math.PI / 2);
      for (let k = 0; k < K; k++) {
        const th = TWO_PI * k / K;
        const cs = Math.cos(th), sn = Math.sin(th);
        const qx = X[0] * cs + V[0] * sn;
        const qy = X[1] * cs + V[1] * sn;
        const qz = X[2] * cs + V[2] * sn;
        P[3 * k] = cx + d * qx; P[3 * k + 1] = cy + d * qz; P[3 * k + 2] = cz - d * qy;
        A[k] = alphaOfLag(wrap2pi(thB - th) / TWO_PI);
      }
    }
    writeStrip(def);
  }

  function buildRibbons(scene, jd, c, height) {
    const out = [];
    const hscale = Math.max(1, height / 1080);
    const defs = scene.ribbonDefs;
    for (let q = 0; q < defs.length; q++) {
      const def = defs[q];
      if (def.moon && !scene.flags.moons) continue;
      fillRibbon(scene, def, jd, c);
      out.push({
        key: def.key,
        data: def.data,
        vertexCount: 2 * (def.K + 1),
        color: def.color,
        halfWidthPx: def.halfWidthBase * hscale,
        brightness: def.brightness,
      });
    }
    return out;
  }

  function putVertex(buf, n, p, t, side, along, alpha, kind, hw) {
    const o = n * STRIDE;
    buf[o] = p[0]; buf[o + 1] = p[1]; buf[o + 2] = p[2];
    buf[o + 3] = t[0]; buf[o + 4] = t[1]; buf[o + 5] = t[2];
    buf[o + 6] = side; buf[o + 7] = along; buf[o + 8] = alpha;
    buf[o + 9] = kind; buf[o + 10] = hw;
  }

  function copyVertex(buf, dst, src) {
    const d = dst * STRIDE, s = src * STRIDE;
    for (let k = 0; k < STRIDE; k++) buf[d + k] = buf[s + k];
  }

  // Halley coma and tails. Both scale with (3/r)^2, the ion length is capped at ION_LEN_MAX, and the
  // coma and tail strength fade to 0 between COMET_TAPER_AU and COMET_CUT_AU (no pop at the cutoff).
  // The ion strip and the dust strip share one buffer. Two duplicate vertices at the join make the
  // bridging triangles degenerate, so a single TRIANGLE_STRIP draw is safe.
  function buildComet(scene, jd, c) {
    const h = HALLEY_I;
    const cen = scene.cen;
    const C = [cen[3 * h], cen[3 * h + 1], cen[3 * h + 2]];
    const r = scene.rAU[h];
    if (!(r > 0) || r > COMET_CUT_AU) {
      return {
        id: 'halley',
        center: C,
        nucleusRadius: NUCLEUS_RADIUS,
        comaRadius: 0,
        comaStrength: 0,
        tailStrength: 0,
        tailData: scene.tail.subarray(0, 0),
        tailVertexCount: 0,
      };
    }
    const q = COMET_REF_AU / r;
    const g = q * q;
    const T = VM.sstep(COMET_CUT_AU, COMET_TAPER_AU, r);       // 1 at r <= 5.5 AU, 0 at r >= 6.5 AU
    const B = clamp(g, 0, 1) * T;                              // coma and tail strength; also the vertex alpha
    const Li = clamp(ION_LEN_K * g, 0, ION_LEN_MAX) * T;
    const Ld = DUST_LEN_FRAC * Li;
    // Anti-sun direction (the sun is at the world origin).
    const A = unitOr(C, [0, 1, 0]);
    // Velocity direction from a 0.01 d finite difference, using the same display transform.
    const d1 = dispWorld(EPH.helioPosEcl('halley', jd), c);
    const d2 = dispWorld(EPH.helioPosEcl('halley', jd + 0.01), c);
    const v = unitOr([d2[0] - d1[0], d2[1] - d1[1], d2[2] - d1[2]], [0, 0, 0]);
    // Dust bends toward -v, taken perpendicular to the anti-sun direction.
    const nv = [-v[0], -v[1], -v[2]];
    const alongA = nv[0] * A[0] + nv[1] * A[1] + nv[2] * A[2];
    let Bd = unitOr([nv[0] - A[0] * alongA, nv[1] - A[1] * alongA, nv[2] - A[2] * alongA], null);
    if (!Bd) {
      const ref = Math.abs(A[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
      Bd = VM.norm(VM.cross(A, ref));
    }

    const buf = scene.tail;
    let n = 0;
    // Ion tail: straight, along the anti-sun direction.
    for (let i = 0; i < TAIL_N; i++) {
      const s = i / (TAIL_N - 1);
      const p = [C[0] + Li * s * A[0], C[1] + Li * s * A[1], C[2] + Li * s * A[2]];
      const hw = Li * (0.004 + 0.010 * s);
      const al = B * Math.pow(1 - s, 1.6);
      putVertex(buf, n++, p, A, -1, s, al, 0, hw);
      putVertex(buf, n++, p, A, 1, s, al, 0, hw);
    }
    // Join: repeat the last ion vertex, then the first dust vertex.
    copyVertex(buf, n, n - 1); n++;
    putVertex(buf, n++, C, A, -1, 0, 0.8 * B, 1, Ld * 0.02);
    // Dust tail: curves toward -v, wider and warmer.
    for (let i = 0; i < TAIL_N; i++) {
      const s = i / (TAIL_N - 1);
      const bend = DUST_BEND * s * s;
      const p = [
        C[0] + Ld * (s * A[0] + bend * Bd[0]),
        C[1] + Ld * (s * A[1] + bend * Bd[1]),
        C[2] + Ld * (s * A[2] + bend * Bd[2]),
      ];
      const tv = unitOr([
        A[0] + 2 * DUST_BEND * s * Bd[0],
        A[1] + 2 * DUST_BEND * s * Bd[1],
        A[2] + 2 * DUST_BEND * s * Bd[2],
      ], A);
      const hw = Ld * (0.02 + 0.05 * s);
      const al = 0.8 * B * Math.pow(1 - s, 1.3);
      putVertex(buf, n++, p, tv, -1, s, al, 1, hw);
      putVertex(buf, n++, p, tv, 1, s, al, 1, hw);
    }

    return {
      id: 'halley',
      center: C,
      nucleusRadius: NUCLEUS_RADIUS,
      comaRadius: Math.min(3.5, 0.25 + 0.45 * g),
      comaStrength: B,
      tailStrength: B,
      tailData: buf.subarray(0, n * STRIDE),
      tailVertexCount: n,
    };
  }

  // Camera: exponential approach. The target uses an offset that decays, so a moving focus body is
  // tracked without steady-state lag.
  function updateCamera(scene, dt, width, height) {
    const cam = scene.camera;
    const cen = scene.cen;
    const fi = scene.focusId === null ? SUN_I : BODY_INDEX.get(scene.focusId);
    const desired = [cen[3 * fi], cen[3 * fi + 1], cen[3 * fi + 2]];
    if (cam.focusDirty) {
      cam.offset = [cam.target[0] - desired[0], cam.target[1] - desired[1], cam.target[2] - desired[2]];
      cam.focusDirty = false;
    } else {
      const k = Math.exp(-dt / TAU_TARGET);
      cam.offset = [cam.offset[0] * k, cam.offset[1] * k, cam.offset[2] * k];
    }
    const tgt = [desired[0] + cam.offset[0], desired[1] + cam.offset[1], desired[2] + cam.offset[2]];
    cam.target = tgt;

    const kd = Math.exp(-dt / TAU_DIST);
    cam.distSm = cam.dist + (cam.distSm - cam.dist) * kd;
    const dist = cam.distSm;

    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const eye = [
      tgt[0] + dist * cp * Math.sin(cam.yaw),
      tgt[1] + dist * sp,
      tgt[2] + dist * cp * Math.cos(cam.yaw),
    ];
    const up = [0, 1, 0];
    const view = VM.mat4LookAt(eye, tgt, up);
    const near = Math.max(NEAR_MIN, dist * NEAR_K);
    const far = Math.max(dist * FAR_K, FAR_MIN);
    const aspect = height > 0 ? width / height : 1;
    const proj = VM.mat4Persp(FOVY, aspect, near, far);
    const viewProj = VM.mat4Mul(proj, view);
    const invViewProj = VM.mat4Inverse(viewProj) || VM.mat4Identity();
    const zv = VM.norm(VM.sub(eye, tgt));
    const xv = VM.norm(VM.cross(up, zv));
    const yv = VM.cross(zv, xv);
    return {
      view: view,
      proj: proj,
      viewProj: viewProj,
      invViewProj: invViewProj,
      eye: eye,
      forward: [-zv[0], -zv[1], -zv[2]],
      right: xv,
      up: yv,
      fovy: FOVY,
      near: near,
      far: far,
      aspect: aspect,
    };
  }

  // Contract 6.2 point 10: sun visibility for the lens flare.
  function computeFlare(scene, camera) {
    const s4 = VM.mat4TransformVec4(camera.viewProj, [0, 0, 0, 1]);
    const w = s4[3];
    if (!(w > 0)) return { sunNdc: [0, 0], visibility: 0 };
    const nx = s4[0] / w, ny = s4[1] / w;
    const rr = Math.hypot(nx, ny);
    const sunNdc = [nx, ny];
    if (rr > FLARE_OUT) return { sunNdc: sunNdc, visibility: 0 };

    // Eye -> sun (origin) segment. Any non-sun body that sits between them, within 1.02 radii, occludes.
    const E = camera.eye;
    const dx = -E[0], dy = -E[1], dz = -E[2];
    const L2 = dx * dx + dy * dy + dz * dz;
    if (L2 > 0) {
      const cen = scene.cen;
      for (let i = 0; i < N; i++) {
        if (i === SUN_I) continue;
        const cx = cen[3 * i] - E[0], cy = cen[3 * i + 1] - E[1], cz = cen[3 * i + 2] - E[2];
        const t = (cx * dx + cy * dy + cz * dz) / L2;
        if (!(t > 0 && t < 1)) continue;
        const ox = cx - t * dx, oy = cy - t * dy, oz = cz - t * dz;
        const dist = Math.sqrt(ox * ox + oy * oy + oz * oz);
        if (dist < OCCLUDE_SCALE * RADIUS[i]) return { sunNdc: sunNdc, visibility: 0 };
      }
    }
    const vis = rr <= FLARE_FULL ? 1 : clamp((FLARE_OUT - rr) / (FLARE_OUT - FLARE_FULL), 0, 1);
    return { sunNdc: sunNdc, visibility: vis };
  }

  // Advances the scene by dtSec (clamped to 0.25 s) and returns a new frame. nowMs is accepted for
  // interface compatibility; time is driven by the clock and dtSec.
  function update(scene, dtSecIn, nowMs, widthIn, heightIn) {
    scene.nowMsLast = nowMs;
    const dt = Number.isFinite(dtSecIn) ? clamp(dtSecIn, 0, DT_MAX) : 0;
    const width = Math.max(1, Math.round(finiteOr(widthIn, 1)));
    const height = Math.max(1, Math.round(finiteOr(heightIn, 1)));
    const clock = scene.clock;

    // Clock. stepDays is the simulated time of this frame and drives the spin.
    let stepDays = 0;
    if (!clock.paused) {
      stepDays = dt * speedDaysPerSec(clock.speedV);
      clock.jd += stepDays;
    }
    scene.nowSec += dt;

    advanceCompress(scene, dt);
    const c = scene.compress;
    const jd = clock.jd;

    // Spin, with the per-frame increment clamped (spec 7.11). The clamp limits increments, not speed.
    if (stepDays !== 0) {
      for (let i = 0; i < N; i++) {
        scene.spinPhase[i] += clamp(TWO_PI * stepDays / SPIN_DAYS[i], -SPIN_STEP_MAX, SPIN_STEP_MAX);
      }
    }

    computeCentres(scene, jd, c);
    const bodies = buildBodies(scene, c);
    const camera = updateCamera(scene, dt, width, height);
    const flare = computeFlare(scene, camera);
    const ribbons = scene.flags.orbits ? buildRibbons(scene, jd, c, height) : [];
    const comets = scene.flags.comets ? [buildComet(scene, jd, c)] : [];

    return {
      width: width,
      height: height,
      aspect: camera.aspect,
      nowSec: scene.nowSec,
      dtSec: dt,
      jdRel: jd - EPH.J2000,
      compress: c,
      displayScale: DISPLAY_SCALE,
      camera: camera,
      sunPos: [0, 0, 0],
      bodies: bodies,
      ribbons: ribbons,
      comets: comets,
      flare: flare,
      flags: { ...scene.flags },
      focusId: scene.focusId,
    };
  }

  // Projects a world point to CSS pixels. Points behind the camera return NaN coordinates, inFront false.
  function project(frame, p, cssW, cssH) {
    const v = VM.mat4TransformVec4(frame.camera.viewProj, [p[0], p[1], p[2], 1]);
    const w = v[3];
    if (!(w > 0)) return { x: NaN, y: NaN, depth: NaN, inFront: false };
    const nx = v[0] / w, ny = v[1] / w;
    return {
      x: (nx * 0.5 + 0.5) * cssW,
      y: (1 - (ny * 0.5 + 0.5)) * cssH,
      depth: v[2] / w,
      inFront: true,
    };
  }

  return {
    create: create,
    setRealScale: setRealScale,
    setSpeedSlider: setSpeedSlider,
    speedDaysPerSec: speedDaysPerSec,
    setPaused: setPaused,
    togglePaused: togglePaused,
    resetToNow: resetToNow,
    setJd: setJd,
    focus: focus,
    orbit: orbit,
    zoom: zoom,
    clockInfo: clockInfo,
    bodyIndex: bodyIndex,
    update: update,
    project: project,
    // Read-only helpers, used by tests.
