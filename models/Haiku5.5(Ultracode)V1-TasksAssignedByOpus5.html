    moonDisplayDistance: function (id) { return MOON_DIST[BODY_INDEX.get(id)]; },
  };
})();
// UI: DOM panels, HTML labels, info card, time bar, display toggles, pointer and keyboard input.
// Every DOM lookup is null-checked. Ephemeris and scene functions are called through EPH / SCN only.
const UI = (function () {
  const PI = Math.PI;
  const R2D = 180 / Math.PI;
  const LT_PER_AU = 499.00478383615;     // light travel time per AU, seconds
  const ORBIT_K = 0.005;                 // radians per pixel of drag
  const CLICK_PX = 5;                    // pointer travel below this counts as a click
  const DASH = '—';
  const MINUS = '−';
  const NARROW_Q = '(max-width: 719px)';
  const GROUP_ORDER = [['star', '恒星'], ['planet', '行星'], ['dwarf', '矮行星'], ['comet', '彗星']];
  const GROUP_ZH = { star: '恒星', planet: '行星', dwarf: '矮行星', moon: '卫星', comet: '彗星' };
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  // ---------- small helpers ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  const fin = (x) => typeof x === 'number' && isFinite(x);
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const sstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const fx = (x, d) => (fin(x) ? x.toFixed(d) : DASH);
  const deg = (x, d) => (fin(x) ? x.toFixed(d) + '°' : DASH);

  function commas(n) {
    if (!fin(n)) return DASH;
    const r = Math.round(n);
    return (r < 0 ? MINUS : '') + String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function setText(el, s) {
    if (el && el.textContent !== s) el.textContent = s;
  }

  function byId(id) {
    const list = EPH.BODIES || [];
    for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function fmtAU(x) {
    return fin(x) ? x.toFixed(4) + ' AU' : DASH;
  }

  function fmtKms(v) {
    if (!fin(v)) return DASH;
    return (Math.abs(v) >= 10 ? v.toFixed(2) : v.toFixed(3)) + ' km/s';
  }

  function kmText(n) {
    return fin(n) ? commas(n) + ' km' : DASH;
  }

  function fmtLight(sec) {
    if (!fin(sec)) return DASH;
    if (sec < 60) return sec.toFixed(1) + ' 秒';
    const s = Math.round(sec);
    if (s < 3600) return Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时 ' + Math.floor((s % 3600) / 60) + ' 分';
    return (sec / 86400).toFixed(1) + ' 天';
  }

  function fmtUTC(jd) {
    const ms = EPH.unixMsFromJd(jd);
    const d = fin(ms) ? new Date(ms) : null;
    if (!d || isNaN(d.getTime())) return DASH;
    const p = (n, w) => String(n).padStart(w || 2, '0');
    return p(d.getUTCFullYear(), 4) + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) + ' ' +
      p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds()) + ' UTC';
  }

  // dps = days per real second; shown as seconds/minutes/hours/days/years per second
  function speedText(dps) {
    if (!fin(dps)) return DASH;
    const sgn = dps < 0 ? MINUS : '';
    const s = Math.abs(dps) * 86400;
    let v;
    let u;
    if (s < 60) { v = s; u = '秒'; }
    else if (s < 3600) { v = s / 60; u = '分'; }
    else if (s < 86400) { v = s / 3600; u = '小时'; }
    else if (s < 365.25 * 86400) { v = s / 86400; u = '天'; }
    else { v = s / (365.25 * 86400); u = '年'; }
    const t = v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0);
    return sgn + t + ' ' + u + '/秒';
  }

  function rotText(h) {
    if (!fin(h)) return DASH;
    const a = Math.abs(h);
    const hs = a < 100 ? a.toFixed(2) : a.toFixed(1);
    return (h < 0 ? MINUS : '') + hs + ' 小时（' + (h < 0 ? '逆行，' : '') + '约 ' + (a / 24).toFixed(2) + ' 天）';
  }

  function noteText(c) {
    if (Math.abs(c - 1) < 1e-4) {
      return '当前为真实距离比例（不压缩）。天体尺寸仍为示意放大。角位置、相位、周期、偏心率、倾角均为真实值。';
    }
    return '距离已压缩（显示距离 = ' + (EPH.SCALE || 34) + ' × 日心距离^' + c.toFixed(2) +
      '），天体尺寸为示意放大。角位置、相位、周期、偏心率、倾角均为真实值；可打开「真实距离比例」对照。';
  }

  function guard(st, name, fn) {
    try {
      fn();
    } catch (err) {
      if (!st.failed[name]) {
        st.failed[name] = true;
        console.error('[UI] ' + name + ':', err);
      }
    }
  }

  // ---------- body data for the info card ----------

  // Values that change with time. Keys match the data-k slots rendered by cardHTML.
  function liveValues(b, jd) {
    const out = {};
    if (b.id === 'sun') return out;
    const isMoon = b.group === 'moon';
    const pos = EPH.bodyHelioPosEcl(b.id, jd);
    const ep = EPH.bodyHelioPosEcl('earth', jd);
    const dx = pos[0] - ep[0];
    const dy = pos[1] - ep[1];
    const dz = pos[2] - ep[2];
    const dE = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (b.id === 'earth') {
      out.de = DASH;
      out.dekm = '本体';
      out.lt = DASH;
    } else {
      out.de = fmtAU(dE);
      out.dekm = kmText(dE * EPH.AU_KM);
      out.lt = fmtLight(dE * LT_PER_AU);
    }
    if (isMoon) {
      // circular-orbit speed: 2*PI*a / P
      out.v = fmtKms(2 * PI * b.aKm / (Math.abs(b.periodDays) * 86400));
      return out;
    }
    const r = Math.sqrt(pos[0] * pos[0] + pos[1] * pos[1] + pos[2] * pos[2]);
    out.rh = fmtAU(r);
    let lon = Math.atan2(pos[1], pos[0]) * R2D;
    lon = ((lon % 360) + 360) % 360;
    out.lon = deg(lon, 2);
    const lat = r > 0 ? Math.asin(clamp(pos[2] / r, -1, 1)) * R2D : 0;
    out.lat = (lat < 0 ? MINUS : '+') + deg(Math.abs(lat), 2);
    out.v = fmtKms(EPH.speedKms(b.id, jd));
    let a = b.aAU;
    let e = b.ecc;
    if (b.group !== 'comet') {
      const el = EPH.planetElements(b.id, jd);
      if (el && fin(el.a) && fin(el.e)) { a = el.a; e = el.e; }
    }
    if (fin(a) && fin(e)) {
      out.peri = fmtAU(a * (1 - e));
      out.aph = fmtAU(a * (1 + e));
    }
    return out;
  }

  function liveSlots(b) {
    const s = [];
    if (b.group !== 'moon') s.push(['日心距离', 'rh'], ['黄经 λ', 'lon'], ['黄纬 β', 'lat']);
    s.push(['与地球距离', 'de'], ['光行时', 'lt']);
    if (b.group !== 'moon') s.push(['近日点', 'peri'], ['远日点', 'aph']);
    s.push(['轨道速度', 'v']);
    return s;
  }

  // Static parameter rows: [label, html value]. Text from data goes through esc().
  function staticRows(b) {
    const R = [];
    const add = (k, v) => R.push([k, v]);
    const t = (s) => esc(s == null || s === '' ? DASH : s);
    if (b.id === 'sun') {
      add('半径', esc(kmText(b.radiusKm)));
      add('质量', t(b.massText));
      add('表面温度', t(b.tempText));
      add('自转周期', esc(rotText(b.rotH)));
      return R;
    }
    if (b.group === 'moon') {
      const par = byId(b.parent);
      const ref = b.refFrame === 'ecliptic' ? '相对黄道面' : '相对母行星赤道面';
      add('半径', esc(kmText(b.radiusKm)));
      add('质量', t(b.massText));
      add('母行星', par
        ? '<button class="lnk" type="button" data-focus="' + esc(par.id) + '">' + esc(par.nameZh) + '</button>'
        : DASH);
      add('轨道半径', esc(kmText(b.aKm)));
      add('公转周期', t(b.periodText));
      add('轨道倾角', deg(b.incDeg, 2) + (b.incDeg > 90 ? '（逆行）' : '') + '<em>' + ref + '</em>');
      add('自转', '同步自转');
      return R;
    }
    if (b.group === 'comet') {
      add('半径', b.radiusKm == null ? DASH : esc(kmText(b.radiusKm)));
      add('质量', t(b.massText));
      add('公转周期', t(b.periodText));
      add('轨道偏心率', fx(b.ecc, 5));
      add('轨道倾角', deg(b.incDeg, 2) + (b.incDeg > 90 ? '（逆行）' : ''));
      return R;
    }
    add('半径', esc(kmText(b.radiusKm)));
    add('质量', t(b.massText));
    add('公转周期', t(b.periodText));
    if (typeof b.moonCount === 'number') add('卫星数', b.moonCount + ' 颗');
    add('表面温度', t(b.tempText));
    add('轨道偏心率', fx(b.ecc, 5));
    add('轨道倾角', deg(b.incDeg, 2) + '<em>相对黄道面</em>');
    add('转轴倾角', deg(b.tiltTextbook, 2) + '<em>相对自身轨道面</em>');
    add('自转周期', esc(rotText(b.rotH)));
    add('大气成分', t(b.atmosphereZh));
    return R;
  }

  function cardHTML(b) {
    const par = b.group === 'moon' ? byId(b.parent) : null;
    const tag = b.group === 'moon' ? ('卫星 · ' + (par ? par.nameZh : '')) : (GROUP_ZH[b.group] || '');
    let h = '<header class="card-h"><div class="card-t">' +
      '<div class="nm">' + esc(b.nameZh) + '</div>' +
      '<div class="sub"><span class="tag" style="--c:' + esc(b.color || '#9fb3d9') + '">' + esc(tag) + '</span>' +
      '<span class="en">' + esc(b.nameEn) + '</span></div></div>' +
      '<button class="x" type="button" data-act="close" aria-label="取消聚焦">×</button></header>';
    if (b.id !== 'sun') {
      h += '<div class="sec">实时数据</div><dl class="kv">';
      for (const [label, key] of liveSlots(b)) {
        h += '<dt>' + esc(label) + '</dt><dd><span data-k="' + key + '">' + DASH + '</span>' +
          (key === 'de' ? '<em data-k="dekm"></em>' : '') + '</dd>';
      }
      h += '</dl>';
    }
    h += '<div class="sec">静态参数</div><dl class="kv">';
    for (const [k, v] of staticRows(b)) h += '<dt>' + esc(k) + '</dt><dd>' + v + '</dd>';
    h += '</dl>';
    h += '<p class="blurb">' + esc(b.blurbZh || '') + '</p>';
    return h;
  }

  function placeholderHTML() {
    return '<div class="ph"><div class="ph-t">点击天体查看详情</div>' +
      '<ul><li>拖拽：旋转视角</li><li>滚轮或双指：缩放</li><li>点击天体或左侧列表：聚焦</li>' +
      '<li>空格：暂停 / 继续，← →：调速，「此刻」回到现在</li><li>H：隐藏界面，Esc：取消聚焦</li></ul>' +
      '<p>轨道位置由 JPL 近似根数实时计算。角位置、相位、周期、偏心率、倾角均为真实值；' +
      '距离经幂律压缩以便同屏显示，天体尺寸为示意放大。</p></div>';
  }

  function collectLive(card) {
    const map = {};
    const nodes = card.querySelectorAll('[data-k]');
    for (let i = 0; i < nodes.length; i++) map[nodes[i].dataset.k] = nodes[i];
    return map;
  }

  function updateLive(st, b, jd) {
    const L = st.live;
    if (!L || !b) return;
    const v = liveValues(b, jd);
    for (const k in v) {
      const el = L[k];
      if (el) setText(el, v[k]);
    }
  }

  // ---------- list, labels and focus ----------

  function buildList(st) {
    const box = st.els.listBody;
    if (!box) return;
    const bodies = EPH.BODIES || [];
    const placed = {};
    const html = [];
    const item = (b, sub) => '<button class="item' + (sub ? ' sub' : '') + '" type="button" data-id="' +
      esc(b.id) + '" style="--c:' + esc(b.color || '#9fb3d9') + '"><i class="dot"></i><span class="nm">' +
      esc(b.nameZh) + '</span><span class="en">' + esc(b.nameEn) + '</span></button>';
    for (const [g, zh] of GROUP_ORDER) {
      const members = bodies.filter((b) => b.group === g);
      if (!members.length) continue;
      html.push('<div class="grp">' + esc(zh) + '</div>');
      for (const b of members) {
        html.push(item(b, false));
        placed[b.id] = true;
        for (const m of bodies) {
          if (m.group === 'moon' && m.parent === b.id) {
            html.push(item(m, true));
            placed[m.id] = true;
          }
        }
      }
    }
    const rest = bodies.filter((m) => m.group === 'moon' && !placed[m.id]);
    if (rest.length) {
      html.push('<div class="grp">卫星</div>');
      for (const m of rest) html.push(item(m, true));
    }
    box.innerHTML = html.join('');
    const nodes = box.querySelectorAll('button.item');
    st.items = [];
    for (let i = 0; i < nodes.length; i++) st.items.push({ id: nodes[i].dataset.id, el: nodes[i] });
  }

  function buildLabels(st) {
    const host = st.els.labels;
    st.labels = (EPH.BODIES || []).map((b, i) => {
      const el = document.createElement('div');
      el.className = 'label';
      const tick = document.createElement('i');
      const span = document.createElement('span');
      span.textContent = b.nameZh;
      el.appendChild(tick);
      el.appendChild(span);
      if (host) host.appendChild(el);
      return { b: b, id: b.id, idx: st.idx[i], el: el, shown: undefined, op: -1, on: false, tx: NaN, ty: NaN };
    });
  }

  function scrollListTo(st, id) {
    const box = st.els.listBody;
    let it = null;
    for (const x of st.items) if (x.id === id) { it = x; break; }
    if (!box || !it || box.clientHeight === 0) return;
    const top = it.el.offsetTop;
    const h = it.el.offsetHeight;
    if (top < box.scrollTop) box.scrollTop = Math.max(0, top - 8);
    else if (top + h > box.scrollTop + box.clientHeight) box.scrollTop = top + h - box.clientHeight + 8;
  }

  function setFocus(st, fid) {
    const b = fid ? byId(fid) : null;
    const card = st.els.card;
    st.focusBody = b;
    st.live = null;
    if (card) {
      if (b) {
        card.innerHTML = cardHTML(b);
        card.classList.remove('is-empty');
        st.live = collectLive(card);
      } else {
        card.innerHTML = placeholderHTML();
        card.classList.add('is-empty');
      }
    }

      const on = !!b && it.id === b.id;

      else it.el.removeAttribute('aria-current');
    }

      scrollListTo(st, b.id);
      const info = SCN.clockInfo(st.scene) || {};
      updateLive(st, b, fin(info.jd) ? info.jd : EPH.J2000);
    }
  }

  // Scratch result reused by updateLabels so the per-frame label loop does not allocate
  // a result object per label. Each use overwrites it before reading.
  const labelScratch = { x: 0, y: 0, inFront: false, rpx: 0 };

  // Screen position (CSS px, relative to the canvas) and apparent radius (CSS px) of a body.
  // Fills `out` when given; otherwise returns a fresh object.
  function screenInfo(fr, bf, cw, ch, out) {
    const p = SCN.project(fr, bf.center, cw, ch);
    if (!p) return null;
    let rpx = 0;
    const cam = fr.camera;
    if (cam && cam.eye && cam.forward) {
      const c = bf.center;
      const e = cam.eye;
      const f = cam.forward;
      const dz = (c[0] - e[0]) * f[0] + (c[1] - e[1]) * f[1] + (c[2] - e[2]) * f[2];
      let fy = cam.fovy;
      if (fy > 3) fy = fy * PI / 180;     // tolerate degrees
      const t = Math.tan(fy * 0.5);
      if (dz > 1e-6 && t > 1e-6) rpx = bf.radius * (ch * 0.5) / (t * dz);
    }
    const r = out || {};
    r.x = p.x;
    r.y = p.y;
    r.inFront = !!p.inFront;
    r.rpx = fin(rpx) ? rpx : 0;
    return r;
  }

  function updateLabels(st, scene, fr) {
    const cw = st.cssW;
    const ch = st.cssH;
    const flags = scene.flags || {};
    const names = !!flags.names;
    const focusId = fr.focusId || null;
    for (const L of st.labels) {
      const b = L.b;
      let want = names && !(b.group === 'moon' && !flags.moons) && !(b.group === 'comet' && !flags.comets);
      let info = null;
      if (want) {
        const bf = fr.bodies ? fr.bodies[L.idx] : null;
        info = bf ? screenInfo(fr, bf, cw, ch, labelScratch) : null;
        if (!info || !info.inFront || !fin(info.x) || !fin(info.y) ||
            info.x < -60 || info.x > cw + 60 || info.y < -30 || info.y > ch + 30) {
          want = false;
        }
      }
      if (!want) {
        if (L.shown !== false) {
          L.el.style.display = 'none';
          L.shown = false;
        }
        continue;
      }
      if (L.shown !== true) {
        L.el.style.display = '';
        L.shown = true;
      }
      // Position in tenths of a CSS px; the style is written only when the rounded value changes.
      const off = Math.max(6, info.rpx + 4);
      const tx = Math.round((info.x + off) * 10);
      const ty = Math.round((info.y - 7) * 10);
      if (tx !== L.tx || ty !== L.ty) {
        L.el.style.transform = 'translate3d(' + (tx / 10).toFixed(1) + 'px,' + (ty / 10).toFixed(1) + 'px,0)';
        L.tx = tx;
        L.ty = ty;
      }
      // faint labels for tiny bodies, brighter for large ones
      const op = 0.4 + 0.5 * sstep(1.2, 12, info.rpx);
      if (Math.abs(op - L.op) > 0.01) {
        L.el.style.opacity = op.toFixed(2);
        L.op = op;
      }
      const on = focusId === b.id;
      if (on !== L.on) {
        L.el.classList.toggle('on', on);
        L.on = on;
      }
    }
  }

  // Click picking: nearest visible body within max(16, projected radius) px.
  function pick(st, clientX, clientY) {
    const fr = st.lastFrame;
    const cv = st.canvas;
    if (!fr || !cv || !fr.bodies) return;
    const rect = cv.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const flags = st.scene.flags || {};
    const bodies = EPH.BODIES || [];
    let best = null;
    let bestD = Infinity;
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.group === 'moon' && !flags.moons) continue;
      if (b.group === 'comet' && !flags.comets) continue;
      const bf = fr.bodies[st.idx[i]];
      if (!bf) continue;
      const s = screenInfo(fr, bf, st.cssW, st.cssH);
      if (!s || !s.inFront || !fin(s.x) || !fin(s.y)) continue;
      const d = Math.hypot(s.x - x, s.y - y);
      const thr = Math.max(16, s.rpx);
      if (d <= thr && d < bestD) {
        best = b;
        bestD = d;
      }
    }
    if (best) SCN.focus(st.scene, best.id);
  }

  // ---------- time bar, banner, toggles ----------

  function syncToggles(st, scene) {
    const f = scene.flags || {};
    for (const inp of st.flagInputs) {
      const want = !!f[inp.dataset.flag];
      if (inp.checked !== want) inp.checked = want;
    }
  }

  function setFlag(st, key, on) {
    const scene = st.scene;
    if (!scene || !key) return;
    if (!scene.flags) scene.flags = {};
    if (key === 'realScale') SCN.setRealScale(scene, on);
    scene.flags[key] = on;
  }

  function setSpeed(st, v) {
    const vv = clamp(Math.round(v), -100, 100);
    SCN.setSpeedSlider(st.scene, vv);
    if (st.els.speed) st.els.speed.value = String(vv);
    setText(st.els.speedVal, speedText(SCN.speedDaysPerSec(vv)));
  }

  function stepSpeed(st, delta) {
    const info = SCN.clockInfo(st.scene) || {};
    setSpeed(st, (fin(info.speedV) ? info.speedV : 0) + delta);
  }

  function setHidden(st, hidden) {
    st.hidden = !!hidden;
    if (document.body) document.body.classList.toggle('ui-hidden', st.hidden);
  }

  function setCollapsed(panel, btn, collapsed, closedText, openText) {
    if (!panel) return;
    panel.classList.toggle('collapsed', !!collapsed);
    if (btn) {
      btn.setAttribute('aria-expanded', String(!collapsed));
      if (closedText) btn.textContent = collapsed ? closedText : openText;
    }
  }

  function tick(st, scene, fr) {
    const els = st.els;
    const info = SCN.clockInfo(scene) || {};
    const jd = fin(info.jd) ? info.jd : EPH.J2000;
    setText(els.date, fmtUTC(jd));
    setText(els.play, info.paused ? '▶ 播放' : '❚❚ 暂停');
    if (els.speed && !st.draggingSpeed && document.activeElement !== els.speed && fin(info.speedV)) {
      if (Number(els.speed.value) !== info.speedV) els.speed.value = String(info.speedV);
    }
    const dps = fin(info.speedDaysPerSec) ? info.speedDaysPerSec : SCN.speedDaysPerSec(info.speedV);
    setText(els.speedVal, speedText(dps));
    if (els.banner) els.banner.hidden = EPH.inValidRange(jd);
    const c = fin(fr.compress) ? fr.compress : 0.62;
    const key = Math.abs(c - 1) < 1e-4 ? 'real' : c.toFixed(3);
    if (key !== st.noteKey) {
      st.noteKey = key;
      setText(els.note, noteText(c));
    }
    syncToggles(st, scene);
    updateLive(st, st.focusBody, jd);
  }

  // ---------- public: mount / frame / showFatal ----------

  function mount(scene, canvas) {
    const els = {
      list: $('list'),
      listToggle: $('list-toggle'),
      listBody: $('list-body'),
      fps: $('fps'),
      banner: $('banner'),
      card: $('card'),
      toggles: $('toggles'),
      togglesToggle: $('toggles-toggle'),
      play: $('play'),
      date: $('date'),
      speed: $('speed'),
      speedVal: $('speed-val'),
      now: $('now'),
      note: $('note'),
      labels: $('labels'),
      showUi: $('show-ui')
    };
    const narrow = !!(window.matchMedia && window.matchMedia(NARROW_Q).matches);
    const st = {
      scene: scene,
      canvas: canvas,
      els: els,
      idx: [],
      items: [],
      labels: [],
      flagInputs: [],
      focusKey: undefined,
      focusBody: null,
      live: null,
      lastTick: -1e9,
      lastFps: -1e9,
      noteKey: '',
      hidden: false,
      narrow: narrow,
      draggingSpeed: false,
      cssW: 1,
      cssH: 1,
      lastFrame: null,
      pts: new Map(),
      gest: null,
      failed: {}
    };

    st.idx = (EPH.BODIES || []).map((b, i) => {
      try {
        const k = SCN.bodyIndex(scene, b.id);
        return fin(k) ? k : i;
      } catch (_) {
        return i;
      }
    });
    buildList(st);
    buildLabels(st);
    st.flagInputs = Array.from(document.querySelectorAll('input[data-flag]'));

    // list: click to focus, collapse toggle
    if (els.listBody) {
      els.listBody.addEventListener('click', (e) => {
        const btn = e.target && e.target.closest ? e.target.closest('button.item') : null;
        if (!btn || !btn.dataset.id) return;
        SCN.focus(scene, btn.dataset.id);
        // on phone the list covers the card, so fold it away after a pick
        if (st.narrow) setCollapsed(els.list, els.listToggle, true, '展开', '收起');
      });
    }
    if (els.listToggle && els.list) {
      els.listToggle.addEventListener('click', () => {
        const c = !els.list.classList.contains('collapsed');
        setCollapsed(els.list, els.listToggle, c, '展开', '收起');
      });
    }

    // info card: close button and links to the parent body
    if (els.card) {
      els.card.addEventListener('click', (e) => {
        const t = e.target && e.target.closest ? e.target.closest('[data-act],[data-focus]') : null;
        if (!t) return;
        if (t.dataset.act === 'close') SCN.focus(scene, null);
        else if (t.dataset.focus) SCN.focus(scene, t.dataset.focus);
      });
    }

    // display toggles
    if (els.togglesToggle && els.toggles) {
      els.togglesToggle.addEventListener('click', () => {
        const c = !els.toggles.classList.contains('collapsed');
        setCollapsed(els.toggles, els.togglesToggle, c);
      });
    }
    for (const inp of st.flagInputs) {
      inp.addEventListener('change', () => setFlag(st, inp.dataset.flag, inp.checked));
    }

    // time bar
    if (els.play) els.play.addEventListener('click', () => SCN.togglePaused(scene));
    if (els.now) els.now.addEventListener('click', () => SCN.resetToNow(scene, Date.now()));
    if (els.speed) {
      els.speed.addEventListener('pointerdown', () => { st.draggingSpeed = true; });
      els.speed.addEventListener('input', () => setSpeed(st, Number(els.speed.value)));
      els.speed.addEventListener('change', () => { st.draggingSpeed = false; });
    }
    window.addEventListener('pointerup', () => { st.draggingSpeed = false; });
    window.addEventListener('pointercancel', () => { st.draggingSpeed = false; });
    if (els.showUi) els.showUi.addEventListener('click', () => setHidden(st, false));

    // keyboard
    window.addEventListener('keydown', (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const t = e.target;
      if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' ||
          (t.tagName === 'INPUT' && t.type === 'text'))) return;
      const k = e.key;
      if (k === ' ' || k === 'Spacebar') {
        e.preventDefault();
        if (t && (t.tagName === 'BUTTON' || (t.tagName === 'INPUT' && t.type !== 'range'))) t.blur();
        if (!e.repeat) SCN.togglePaused(scene);
      } else if (k === 'ArrowLeft' || k === 'ArrowRight') {
        e.preventDefault();
        stepSpeed(st, k === 'ArrowRight' ? 5 : -5);
      } else if (k === 'h' || k === 'H') {
        if (!e.repeat) setHidden(st, !st.hidden);
      } else if (k === 'Escape') {
        SCN.focus(scene, null);
      }
    });

    // canvas: orbit, zoom, pick
    if (canvas) {
      const pts = st.pts;
      const pinchDist = () => {
        const it = pts.values();
        const a = it.next().value;
        const b2 = it.next().value;
        return a && b2 ? Math.hypot(a.x - b2.x, a.y - b2.y) : 0;
      };
      canvas.addEventListener('pointerdown', (e) => {
        try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* unsupported */ }
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pts.size === 1) {
          st.gest = { x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, maxMove: 0, multi: false, pinch: 0 };
        } else {
          if (!st.gest) st.gest = { x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, maxMove: Infinity, multi: true, pinch: 0 };
          st.gest.multi = true;
          st.gest.maxMove = Infinity;
          st.gest.pinch = pinchDist();
        }
        e.preventDefault();
      });
      canvas.addEventListener('pointermove', (e) => {
        const p = pts.get(e.pointerId);
        if (!p) return;
        p.x = e.clientX;
        p.y = e.clientY;
        const g = st.gest;
        if (!g) return;
        if (pts.size === 1) {
          const dx = e.clientX - g.lx;
          const dy = e.clientY - g.ly;
          g.lx = e.clientX;
          g.ly = e.clientY;
          if (!g.multi) g.maxMove = Math.max(g.maxMove, Math.hypot(e.clientX - g.x0, e.clientY - g.y0));
          if (dx !== 0 || dy !== 0) SCN.orbit(scene, -dx * ORBIT_K, dy * ORBIT_K);
        } else {
          const d = pinchDist();
          if (d > 1 && g.pinch > 1) SCN.zoom(scene, g.pinch / d);
          if (d > 1) g.pinch = d;
        }
      });
      const endPointer = (e) => {
        if (!pts.has(e.pointerId)) return;
        const g = st.gest;
        const clean = !!g && pts.size === 1 && !g.multi;
        pts.delete(e.pointerId);
        if (clean && e.type === 'pointerup' && g.maxMove < CLICK_PX) pick(st, e.clientX, e.clientY);
        if (pts.size === 1) {
          const r = pts.values().next().value;
          st.gest = { x0: r.x, y0: r.y, lx: r.x, ly: r.y, maxMove: Infinity, multi: true, pinch: 0 };
        } else if (pts.size === 0) {
          st.gest = null;
        }
      };
      canvas.addEventListener('pointerup', endPointer);
      canvas.addEventListener('pointercancel', endPointer);
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        let dy = e.deltaY;
        if (e.deltaMode === 1) dy *= 16;
        else if (e.deltaMode === 2) dy *= 400;
        dy = clamp(dy, -240, 240);
        if (dy !== 0) SCN.zoom(scene, Math.exp(dy * 0.0015));
      }, { passive: false });
      canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    }
    document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });

    // default collapse state follows the width; re-applied when the window crosses the breakpoint
    const applyDefaults = (isNarrow) => {
      st.narrow = !!isNarrow;
      setCollapsed(els.list, els.listToggle, isNarrow, '展开', '收起');
      setCollapsed(els.toggles, els.togglesToggle, isNarrow);
    };
    applyDefaults(narrow);
    if (window.matchMedia) {
      const mq = window.matchMedia(NARROW_Q);
      const onChange = (ev) => applyDefaults(!!(ev && ev.matches));
      if (mq && mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq && mq.addListener) mq.addListener(onChange);
    }
    return st;
  }

  // Called once per rAF frame by APP. Labels every frame; card, time bar and banner at about 10 Hz.
  function frame(st, scene, fr, fps) {
    if (!st || !scene || !fr) return;
    st.lastFrame = fr;
    const cv = st.canvas;
    st.cssW = (cv && cv.clientWidth) || window.innerWidth || 1;
    st.cssH = (cv && cv.clientHeight) || window.innerHeight || 1;
    const fid = fr.focusId || null;
    if (fid !== st.focusKey) {
      st.focusKey = fid;
      guard(st, 'focus', () => setFocus(st, fid));
    }
    guard(st, 'labels', () => updateLabels(st, scene, fr));
    const now = performance.now();
    if (now - st.lastTick >= 100) {
      st.lastTick = now;
      guard(st, 'tick', () => tick(st, scene, fr));
    }
    if (now - st.lastFps >= 250) {
      st.lastFps = now;
      const v = fin(fps) ? fps : 0;
      setText(st.els.fps, v > 0 ? Math.round(v) + ' FPS' : '-- FPS');
    }
  }

  function showFatal(message) {
    const el = $('fatal');
    if (!el) return;
    const m = $('fatal-msg');
    if (m) m.textContent = message || '';
    el.hidden = false;
  }

  return { mount: mount, frame: frame, showFatal: showFatal };
})();
// APP: startup, canvas sizing, main loop. The last statement of the page starts the app.
const APP = (function () {
  let canvas = null;
  let scene = null;
  let renderer = null;
  let uiState = null;
  let lastFrame = null;
  let last = 0;
  let fps = 0;
  const logged = {};

  function logOnce(key, err) {
    if (logged[key]) return;
    logged[key] = true;
    console.error(err);
  }

  // backing store = CSS size * min(devicePixelRatio, 2)
  function resize() {
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = canvas.clientWidth || window.innerWidth || 1;
    const cssH = canvas.clientHeight || window.innerHeight || 1;
    const w = Math.max(1, Math.round(cssW * dpr));
    const h = Math.max(1, Math.round(cssH * dpr));
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
  }

  function loop(t) {
    requestAnimationFrame(loop);
    const now = typeof t === 'number' ? t : performance.now();
    let dt = last > 0 ? (now - last) / 1000 : 0;
    last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0) {
      const inst = 1 / dt;
      fps = fps > 0 ? fps * 0.9 + inst * 0.1 : inst;
    }
    if (!scene || !canvas) return;
    dt = Math.min(0.25, dt);

    let fr = null;
    try {
      fr = SCN.update(scene, dt, Date.now(), canvas.width, canvas.height);
    } catch (err) {
      logOnce('update', err);
      return;
    }
    lastFrame = fr;

    if (renderer) {
      try {
        GLR.render(renderer, fr);
      } catch (err) {
        logOnce('render', err);
      }
    }
    if (uiState) {
      try {
        UI.frame(uiState, scene, fr, Math.round(fps));
      } catch (err) {
        logOnce('ui', err);
      }
    }
  }

  function start() {
    canvas = document.getElementById('gl');
    if (!canvas) {
      console.error('canvas#gl not found');
      return;
    }
    resize();
    window.addEventListener('resize', resize);

    scene = SCN.create();
    try {
      renderer = GLR.create(canvas, EPH.asteroidData());
    } catch (err) {
      logOnce('create', err);
      renderer = null;
    }
    try {
      uiState = UI.mount(scene, canvas);
    } catch (err) {
      logOnce('mount', err);
      uiState = null;
    }
    if (!renderer) {
      UI.showFatal('无法初始化 WebGL2 渲染。当前浏览器或设备不支持 WebGL2，请换用较新版本的 Chrome、Edge、Firefox 或 Safari 打开。');
    }

    window.__SS = {
      scene: scene,
      renderer: renderer,
      get frame() { return lastFrame; }
    };
    requestAnimationFrame(loop);
  }

  return { start: start };
})();
APP.start();
</script>
</body>
