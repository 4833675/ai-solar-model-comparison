function kepler(M,e){
  M=((M+Math.PI)%TAU+TAU)%TAU-Math.PI;
  let E=M+e*Math.sin(M)*(1+e*Math.cos(M));
  for(let i=0;i<10;i++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-13)break;}
  return E;}

  const E=kepler(M,e);
  const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(Math.max(0,1-e*e))*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),co=Math.cos(om),so=Math.sin(om),ci=Math.cos(I),si=Math.sin(I);
  return[(cw*co-sw*so*ci)*xp+(-sw*co-cw*so*ci)*yp,
         (cw*so+sw*co*ci)*xp+(-sw*so+cw*co*ci)*yp,
         (sw*si)*xp+(cw*si)*yp];}

function makeSphere(LA,LO){
  const pos=[],idx=[];
  for(let i=0;i<=LA;i++){const th=i/LA*Math.PI,st=Math.sin(th),ct=Math.cos(th);
    for(let j=0;j<=LO;j++){const ph=j/LO*TAU;pos.push(Math.cos(ph)*st,ct,Math.sin(ph)*st);}}
  for(let i=0;i<LA;i++)for(let j=0;j<LO;j++){
    const a=i*(LO+1)+j,b=a+LO+1;
    idx.push(a,b,a+1, b,b+1,a+1);}
  // 绕序自检：取一个三角形，确认几何法向朝外
  const g=(k)=>[pos[k*3],pos[k*3+1],pos[k*3+2]];
  let t=Math.floor(idx.length/6)*3; // 中部某三角形
  const A=g(idx[t]),B=g(idx[t+1]),C=g(idx[t+2]);
  const n=crs([B[0]-A[0],B[1]-A[1],B[2]-A[2]],[C[0]-A[0],C[1]-A[1],C[2]-A[2]]);
  if(dot3(n,A)<0){ for(let i=0;i<idx.length;i+=3){const s=idx[i+1];idx[i+1]=idx[i+2];idx[i+2]=s;} }
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);
  const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(idx),gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return{vao,n:idx.length};}

function fmtLT(au){const s=au*499.004784;
  if(s<90)return s.toFixed(2)+' 秒';
  if(s<5400)return (s/60).toFixed(2)+' 分';
  return (s/3600).toFixed(3)+' 小时';}

/* ===================== 位置计算 ===================== */
function dispOf(ecl){
  const r=Math.hypot(ecl[0],ecl[1],ecl[2])||1e-9;
  const k=SCALE*Math.pow(r,compress)/r;
  const w=ecl2world(ecl); return[w[0]*k,w[1]*k,w[2]*k];}
function basisOf(axis){
  const Y=axis;const ref=Math.abs(Y[1])>0.92?[1,0,0]:[0,1,0];
  const X=nrm(crs(ref,Y));const Z=crs(X,Y);return[X,Y,Z];}
const tmpM=m4();
function modelOf(pos,axis,phase,R,out){
  const[X,Y,Z]=basisOf(axis);const c=Math.cos(phase),s=Math.sin(phase);
  out[0]=(X[0]*c-Z[0]*s)*R;out[1]=(X[1]*c-Z[1]*s)*R;out[2]=(X[2]*c-Z[2]*s)*R;out[3]=0;
  out[4]=Y[0]*R;out[5]=Y[1]*R;out[6]=Y[2]*R;out[7]=0;
  out[8]=(X[0]*s+Z[0]*c)*R;out[9]=(X[1]*s+Z[1]*c)*R;out[10]=(X[2]*s+Z[2]*c)*R;out[11]=0;
  out[12]=pos[0];out[13]=pos[1];out[14]=pos[2];out[15]=1;
  return out;}
function invRot3(m,R,out){ // 从模型矩阵取旋转的转置
  out[0]=m[0]/R;out[1]=m[4]/R;out[2]=m[8]/R;
  out[3]=m[1]/R;out[4]=m[5]/R;out[5]=m[9]/R;
  out[6]=m[2]/R;out[7]=m[6]/R;out[8]=m[10]/R;return out;}
const mdl=m4(),mdl2=m4(),ir3=new Float32Array(9);

let JD=J2000,Tcen=0,lastJD=jdOf(simMs);
function updatePositions(dt){
  JD=jdOf(simMs); Tcen=(JD-J2000)/36525;
  const dJD=JD-lastJD; lastJD=JD;
  bSun.pos=[0,0,0];
  for(const p of bPl){
    const E=planetElems(p,Tcen);
    const ecl=orbXYZ(E.a,E.e,E.I,E.w,E.om,E.M);
    p.ecl=ecl; p.pos=dispOf(ecl);
    const r=Math.hypot(ecl[0],ecl[1],ecl[2]);
    p.rtd={r,lon:((Math.atan2(ecl[1],ecl[0])*R2D)%360+360)%360,
      lat:Math.asin(ecl[2]/r)*R2D,
      v:29.7847*Math.sqrt(Math.max(0,2/r-1/E.a)),
      q:E.a*(1-E.e),Q:E.a*(1+E.e),a:E.a,e:E.e};
    p.elemsNow=E;
  }
  // 彗星
  {const M=TAU*(JD-HALLEY.Tp)/HALLEY.P;
   const ecl=orbXYZ(HALLEY.a,HALLEY.e,HALLEY.I*D2R,HALLEY.w*D2R,HALLEY.om*D2R,M);
   const M2=TAU*(JD+0.5-HALLEY.Tp)/HALLEY.P;
   const ecl2=orbXYZ(HALLEY.a,HALLEY.e,HALLEY.I*D2R,HALLEY.w*D2R,HALLEY.om*D2R,M2);
   bCom.ecl=ecl;bCom.pos=dispOf(ecl);
   bCom.vel=nrm([ecl2[0]-ecl[0],ecl2[1]-ecl[1],ecl2[2]-ecl[2]]);
   const r=Math.hypot(ecl[0],ecl[1],ecl[2]);
   bCom.rtd={r,lon:((Math.atan2(ecl[1],ecl[0])*R2D)%360+360)%360,lat:Math.asin(ecl[2]/r)*R2D,
     v:29.7847*Math.sqrt(Math.max(0,2/r-1/HALLEY.a)),q:HALLEY.a*(1-HALLEY.e),Q:HALLEY.a*(1+HALLEY.e)};}
  // 卫星
  for(const m of bMo){
    const P=m.parent;
    const th=TAU*(JD-J2000)/m.per+m.ph;
    const ci=Math.cos(m.inc*D2R),si=Math.sin(m.inc*D2R);
    const d=m.dDist;
    let lx=Math.cos(th)*d, ly=0, lz=Math.sin(th)*d;
    // 绕 X 轴倾斜
    const y2=ly*ci-lz*si, z2=ly*si+lz*ci;
    let off;
    if(m.ref==='ecl'){ off=[lx,y2,z2]; }
    else{ const[X,Y,Z]=basisOf(P.axis);
      off=[X[0]*lx+Y[0]*y2+Z[0]*z2, X[1]*lx+Y[1]*y2+Z[1]*z2, X[2]*lx+Y[2]*y2+Z[2]*z2]; }
    m.pos=[P.pos[0]+off[0],P.pos[1]+off[1],P.pos[2]+off[2]];
    const pe=P.ecl, rr=Math.hypot(pe[0],pe[1],pe[2]);
    m.rtd={r:rr,lon:((Math.atan2(pe[1],pe[0])*R2D)%360+360)%360,lat:Math.asin(pe[2]/rr)*R2D};
  }
  // 自转相位（限速）
  const allRot=[bSun].concat(bPl);
  for(const b of allRot){
    const per=(b.rotH!==undefined?b.rotH:609.12)/24;
    let dp=TAU*dJD/per; dp=clamp(dp,-0.22,0.22); b.phase+=dp;}
  for(const m of bMo){ let dp=TAU*dJD/m.per; dp=clamp(dp,-0.22,0.22); m.phase+=dp; }
  // 与地球距离
  const eE=bPl[2].ecl;
  for(const b of bodies){
    if(b===bPl[2]){b.rtd.de=0;continue;}
    let e=b.ecl||(b.parent?b.parent.ecl:[0,0,0]);
    if(!b.rtd)b.rtd={};
    b.rtd.de=Math.hypot(e[0]-eE[0],e[1]-eE[1],e[2]-eE[2]);}
}
/* ===================== 轨道缎带 ===================== */
let orbSegs=[];
function buildOrbits(){
  let o=0; orbSegs=[];
  const put=(pos,tan,side,par)=>{orbData[o++]=pos[0];orbData[o++]=pos[1];orbData[o++]=pos[2];
    orbData[o++]=tan[0];orbData[o++]=tan[1];orbData[o++]=tan[2];orbData[o++]=side;orbData[o++]=par;};
  const list=bPl.map(p=>({b:p,el:p.elemsNow})).concat(
    TOG.comet?[{b:bCom,el:{a:HALLEY.a,e:HALLEY.e,I:HALLEY.I*D2R,w:HALLEY.w*D2R,om:HALLEY.om*D2R,
      M:TAU*(JD-HALLEY.Tp)/HALLEY.P}}]:[]);
  for(const it of list){
    const E=it.el,start=o/8;
    const pts=[];
    for(let i=0;i<=ORB_N;i++){
      const M=E.M-i/ORB_N*TAU;
      pts.push(dispOf(orbXYZ(E.a,E.e,E.I,E.w,E.om,M)));}
    for(let i=0;i<=ORB_N;i++){
      const p=pts[i],q=pts[Math.min(i+1,ORB_N)],pp=pts[Math.max(i-1,0)];
      const t=[q[0]-pp[0],q[1]-pp[1],q[2]-pp[2]];
      const par=i/ORB_N;
      put(p,t,1,par);put(p,t,-1,par);}
    orbSegs.push({b:it.b,start,count:(ORB_N+1)*2});
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,orbGeo.buf);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,orbData,0,o);}

const ATMOS={earth:{c:[0.30,0.52,1.00],h:0.030,s:0.62},

function sunI(r){return clamp(1.5*Math.pow(1/Math.max(r,0.02),0.40),0.26,2.1);}

/* ===================== 渲染 ===================== */
const VP=m4(),PM=m4(),VM=m4(),IVP=m4();
let camPos=[0,0,0];
let fps=60,frames=0,fpsT=0;
const labelLayer=document.getElementById('labels');
const labelEls=new Map();
for(const b of bodies){const d=document.createElement('div');d.className='lab';d.textContent=b.n;
  d.style.color=colStr(b.col);labelLayer.appendChild(d);labelEls.set(b,d);}

function proj(p){ // 世界->屏幕(px) 与 clip.w
  const x=VP[0]*p[0]+VP[4]*p[1]+VP[8]*p[2]+VP[12];
  const y=VP[1]*p[0]+VP[5]*p[1]+VP[9]*p[2]+VP[13];
  const w=VP[3]*p[0]+VP[7]*p[1]+VP[11]*p[2]+VP[15];
  if(w<=0)return null;
  return[(x/w*0.5+0.5)*cv.clientWidth,(1-(y/w*0.5+0.5))*cv.clientHeight,w];}

function drawSphere(b,mesh,type,R,ringHost){
  modelOf(b.pos,b.axis,b.phase,R,mdl);
  invRot3(mdl,R,ir3);
  const u=P_SPH.u;
  gl.uniformMatrix4fv(u.uM,false,mdl);
  gl.uniformMatrix3fv(u.uInvRot,false,ir3);
  gl.uniform3fv(u.uTint,b.col);
  gl.uniform1f(u.uRadius,R);
  gl.uniform1i(u.uType,type);
  gl.uniform1i(u.uRingHost,ringHost||0);
  const rr=(b.rtd&&b.rtd.r)||1;
  gl.uniform1f(u.uSunI,type===0?1.0:sunI(rr));
  gl.bindVertexArray(mesh.vao);
  gl.drawElements(gl.TRIANGLES,mesh.n,gl.UNSIGNED_INT,0);}

function buildTails(){
  const r=bCom.rtd.r;
  if(r>6.5)return null;
  const strength=Math.pow(3.0/r,2.0);
  const sunDir=nrm([-bCom.pos[0],-bCom.pos[1],-bCom.pos[2]]); // 指向太阳
  const anti=[-sunDir[0],-sunDir[1],-sunDir[2]];
  const vw=nrm(ecl2world(bCom.vel));
  const camDir=nrm([bCom.pos[0]-camPos[0],bCom.pos[1]-camPos[1],bCom.pos[2]-camPos[2]]);
  const segs=[];
  const L1=Math.min(60,10*strength), L2=Math.min(40,7*strength);
  let o=0;const N=48;
  const push=(p,s,t)=>{tailData[o++]=p[0];tailData[o++]=p[1];tailData[o++]=p[2];tailData[o++]=s;tailData[o++]=t;};
  function ribbon(dirFn,len,w0,w1){
    const start=o/5;
    for(let i=0;i<=N;i++){const t=i/N;
      const p=dirFn(t,len);
      let ax=nrm([p[0]-bCom.pos[0]||1e-6,p[1]-bCom.pos[1],p[2]-bCom.pos[2]]);
      let rt=crs(ax,camDir);const rl=Math.hypot(rt[0],rt[1],rt[2]);
      if(rl<1e-5)rt=[1,0,0];else rt=[rt[0]/rl,rt[1]/rl,rt[2]/rl];
      const w=lerp(w0,w1,t);
      push([p[0]+rt[0]*w,p[1]+rt[1]*w,p[2]+rt[2]*w],1,t);
      push([p[0]-rt[0]*w,p[1]-rt[1]*w,p[2]-rt[2]*w],-1,t);}
    segs.push({start,count:(N+1)*2});}
  ribbon((t,len)=>[bCom.pos[0]+anti[0]*len*t,bCom.pos[1]+anti[1]*len*t,bCom.pos[2]+anti[2]*len*t],
    L1,0.25,1.6);
  ribbon((t,len)=>{const bend=t*t*0.55;
    const d=nrm([anti[0]-vw[0]*bend,anti[1]-vw[1]*bend,anti[2]-vw[2]*bend]);
    return[bCom.pos[0]+d[0]*len*t,bCom.pos[1]+d[1]*len*t,bCom.pos[2]+d[2]*len*t];},
    L2,0.35,3.4);
  gl.bindBuffer(gl.ARRAY_BUFFER,tailGeo.buf);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,tailData,0,o);
  return{segs,strength:clamp(strength*0.25,0.02,1.0)};}

function render(now){
  requestAnimationFrame(render);
  const dt=Math.min(0.05,(now-(render.last||now))/1000);render.last=now;
  frames++;if(now-fpsT>1000){fps=frames*1000/(now-fpsT);frames=0;fpsT=now;}
  if(playing)simMs+=daysPerSec(speedV)*86400000*dt;
  compress+=(compressTarget-compress)*clamp(dt/0.4*2.5,0,1);
  if(Math.abs(compress-compressTarget)<1e-4)compress=compressTarget;
  updatePositions(dt);
  // 相机
  const f=cam.focus;
  cam.ftx+=(f.pos[0]-cam.ftx)*clamp(dt*4.5,0,1);
  cam.fty+=(f.pos[1]-cam.fty)*clamp(dt*4.5,0,1);
  cam.ftz+=(f.pos[2]-cam.ftz)*clamp(dt*4.5,0,1);
  cam.dist+=(cam.tDist-cam.dist)*clamp(dt*4.5,0,1);
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  camPos=[cam.ftx+Math.cos(cam.yaw)*cp*cam.dist, cam.fty+sp*cam.dist, cam.ftz+Math.sin(cam.yaw)*cp*cam.dist];
  const near=Math.max(0.012,cam.dist*0.0035), far=Math.max(cam.dist*14,4200);
  persp(PM,45*D2R,cv.clientWidth/cv.clientHeight,near,far);
  lookAt(VM,camPos,[cam.ftx,cam.fty,cam.ftz],[0,1,0]);
  mul(VP,PM,VM); inv(IVP,VP);
  buildOrbits();
  const tails=TOG.comet?buildTails():null;

  /* ---- 场景 pass ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER,useMSAA?msFB:scFB);
  gl.viewport(0,0,W,H);
  gl.depthMask(true);                        // 关键：clear 受 depthMask 约束
  gl.clearColor(0,0,0,1);gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);gl.depthMask(false);
  // 1 背景
  gl.useProgram(P_BG.p);
  gl.uniformMatrix4fv(P_BG.u.uInvVP,false,IVP);
  gl.uniform3fv(P_BG.u.uCam,camPos);gl.uniform3fv(P_BG.u.uGalN,GALN);
  gl.bindVertexArray(quadVAO);gl.drawArrays(gl.TRIANGLES,0,3);
  // 2 恒星
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(P_STAR.p);
  gl.uniformMatrix4fv(P_STAR.u.uVP,false,VP);
  gl.uniform3fv(P_STAR.u.uCam,camPos);
  gl.uniform1f(P_STAR.u.uTime,now*0.001);gl.uniform1f(P_STAR.u.uPx,DPR);
  gl.bindVertexArray(STARS.vao);gl.drawArrays(gl.POINTS,0,STARS.n);
  // 3-4 球体
  gl.disable(gl.BLEND);gl.enable(gl.DEPTH_TEST);gl.depthMask(true);
  gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);gl.frontFace(gl.CCW);
  gl.useProgram(P_SPH.p);
  gl.uniformMatrix4fv(P_SPH.u.uVP,false,VP);
  gl.uniform3fv(P_SPH.u.uCam,camPos);
  gl.uniform3fv(P_SPH.u.uSunW,[0,0,0]);
  gl.uniform1f(P_SPH.u.uTime,((JD-J2000)*0.6)%1000.0);
  drawSphere(bSun,SPH_HI,0,SUN_R,0);
  for(const p of bPl){
    const sr=proj(p.pos); let mesh=SPH_MD;
    if(sr){const px=p.dR/sr[2]*cv.clientHeight; mesh=px>90?SPH_HI:(px>18?SPH_MD:SPH_LO);}
    drawSphere(p,mesh,p.t,p.dR,RING_MESH[p.t]?p.t:0);}
  if(TOG.moon)for(const m of bMo){
    const sr=proj(m.pos);let mesh=SPH_LO;
    if(sr){const px=m.dR/sr[2]*cv.clientHeight;mesh=px>90?SPH_HI:(px>16?SPH_MD:SPH_LO);}
    drawSphere(m,mesh,m.t,m.dR,0);}
  gl.disable(gl.CULL_FACE);
  // 5 轨道
  if(TOG.orbit){
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);
    gl.useProgram(P_ORB.p);
    gl.uniformMatrix4fv(P_ORB.u.uVP,false,VP);
    gl.uniform2f(P_ORB.u.uHalfVp,cv.clientWidth*0.5,cv.clientHeight*0.5);
    gl.uniform1f(P_ORB.u.uWidth,1.15);
    gl.bindVertexArray(orbGeo.vao);
    for(const s of orbSegs){
      gl.uniform3fv(P_ORB.u.uCol,s.b.col);
      gl.uniform1f(P_ORB.u.uOpacity,s.b===bCom?0.30:(s.b===sel?0.62:0.34));
      gl.drawArrays(gl.TRIANGLE_STRIP,s.start,s.count);}
  }
  // 6 小行星带
  if(TOG.belt){
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);
    gl.useProgram(P_AST.p);
    gl.uniformMatrix4fv(P_AST.u.uVP,false,VP);
    gl.uniform3fv(P_AST.u.uCam,camPos);
    gl.uniform1f(P_AST.u.uDays,JD-J2000);
    gl.uniform1f(P_AST.u.uScale,SCALE);
    gl.uniform1f(P_AST.u.uCompress,compress);
    gl.uniform1f(P_AST.u.uPxScale,90*DPR);
    gl.bindVertexArray(BELTS.vao);gl.drawArrays(gl.POINTS,0,BELTS.n);}
  // 7 大气
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);
  gl.useProgram(P_ATM.p);
  gl.uniformMatrix4fv(P_ATM.u.uVP,false,VP);
  gl.uniform3fv(P_ATM.u.uCam,camPos);
  gl.uniform3fv(P_ATM.u.uSunW,[0,0,0]);
  for(const b of bPl.concat(TOG.moon?bMo:[])){
    const cfg=ATMOS[b.k];if(!cfg)continue;
    const R=b.dR*(1+cfg.h*7.5);
    modelOf(b.pos,[0,1,0],0,R,mdl2);
    gl.uniformMatrix4fv(P_ATM.u.uM,false,mdl2);
    gl.uniform3fv(P_ATM.u.uCenter,b.pos);
    gl.uniform3fv(P_ATM.u.uAtmCol,cfg.c);
    gl.uniform1f(P_ATM.u.uRadius,b.dR);
    gl.uniform1f(P_ATM.u.uScaleH,cfg.h);
    gl.uniform1f(P_ATM.u.uStrength,cfg.s);
    gl.uniform1f(P_ATM.u.uSunI,sunI((b.rtd&&b.rtd.r)||1));
    gl.bindVertexArray(SPH_MD.vao);gl.drawElements(gl.TRIANGLES,SPH_MD.n,gl.UNSIGNED_INT,0);}
  // 8 环系
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
  gl.useProgram(P_RING.p);
  gl.uniformMatrix4fv(P_RING.u.uVP,false,VP);
  gl.uniform3fv(P_RING.u.uCam,camPos);
  gl.uniform3fv(P_RING.u.uSunW,[0,0,0]);
  for(const p of bPl){
    const rm=RING_MESH[p.t];if(!rm)continue;
    modelOf(p.pos,p.axis,p.phase,p.dR,mdl2);
    invRot3(mdl2,p.dR,ir3);
    gl.uniformMatrix4fv(P_RING.u.uM,false,mdl2);
    gl.uniformMatrix3fv(P_RING.u.uInvRot,false,ir3);
    gl.uniform3fv(P_RING.u.uCenter,p.pos);
    gl.uniform3fv(P_RING.u.uAxis,p.axis);
    gl.uniform1i(P_RING.u.uHost,p.t);
    gl.uniform1f(P_RING.u.uSunI,sunI(p.rtd.r));
    gl.bindVertexArray(rm.vao);gl.drawElements(gl.TRIANGLES,rm.n,gl.UNSIGNED_INT,0);}
  // 9 彗尾
  if(tails){
    gl.blendFunc(gl.ONE,gl.ONE);
    gl.useProgram(P_TAIL.p);
    gl.uniformMatrix4fv(P_TAIL.u.uVP,false,VP);
    gl.bindVertexArray(tailGeo.vao);
    gl.uniform3fv(P_TAIL.u.uCol,[0.42,0.72,1.0]);
    gl.uniform1f(P_TAIL.u.uI,tails.strength*0.9);
    gl.drawArrays(gl.TRIANGLE_STRIP,tails.segs[0].start,tails.segs[0].count);
    gl.uniform3fv(P_TAIL.u.uCol,[1.0,0.85,0.55]);
    gl.uniform1f(P_TAIL.u.uI,tails.strength*0.55);
    gl.drawArrays(gl.TRIANGLE_STRIP,tails.segs[1].start,tails.segs[1].count);
  }
  // 10 日冕 / 彗发
  {
    gl.blendFunc(gl.ONE,gl.ONE);gl.enable(gl.DEPTH_TEST);gl.depthMask(false);
    gl.useProgram(P_COR.p);
    gl.uniformMatrix4fv(P_COR.u.uVP,false,VP);
    const fwd=nrm([cam.ftx-camPos[0],cam.fty-camPos[1],cam.ftz-camPos[2]]);
    let R=nrm(crs(fwd,[0,1,0]));if(!isFinite(R[0]))R=[1,0,0];
    const U=crs(R,fwd);
    gl.uniform3fv(P_COR.u.uRight,R);gl.uniform3fv(P_COR.u.uUp,U);
    gl.uniform1f(P_COR.u.uTime,now*0.001);
    gl.bindVertexArray(quadVAO);
    gl.uniform3fv(P_COR.u.uCenter,[0,0,0]);
    gl.uniform1f(P_COR.u.uInner,0.0);
    gl.uniform3fv(P_COR.u.uCol,[1.0,0.72,0.34]);
    gl.uniform1f(P_COR.u.uSize,SUN_R*3.1);gl.uniform1f(P_COR.u.uIntens,0.30);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.uniform1f(P_COR.u.uSize,SUN_R*9.0);gl.uniform1f(P_COR.u.uIntens,0.055);
    gl.uniform3fv(P_COR.u.uCol,[1.0,0.85,0.60]);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(tails){
      gl.uniform3fv(P_COR.u.uCenter,bCom.pos);
      gl.uniform3fv(P_COR.u.uCol,[0.55,0.85,0.95]);
      gl.uniform1f(P_COR.u.uSize,2.2+3.0*tails.strength);
      gl.uniform1f(P_COR.u.uIntens,0.55*tails.strength+0.05);
      gl.drawArrays(gl.TRIANGLES,0,3);}
  }
  // 解析 MSAA
  if(useMSAA){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msFB);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,scFB);
    gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.NEAREST);}
  postFX(now);
  updateOverlay();
}
/* ===================== 后期 ===================== */
function sunScreen(){
  const s=proj([0,0,0]);
  if(!s)return{uv:[0.5,0.5],vis:0};
  const sx=s[0],sy=s[1],sd=Math.hypot(camPos[0],camPos[1],camPos[2]);
  let vis=1;
  if(sx<-cv.clientWidth*0.4||sx>cv.clientWidth*1.4||sy<-cv.clientHeight*0.4||sy>cv.clientHeight*1.4)vis=0;
  if(vis>0){
    for(const p of bPl.concat(bMo)){
      const q=proj(p.pos);if(!q)continue;
      const pd=Math.hypot(p.pos[0]-camPos[0],p.pos[1]-camPos[1],p.pos[2]-camPos[2]);
      if(pd>=sd)continue;
      const rpx=p.dR/q[2]*cv.clientHeight*0.5;
      const d=Math.hypot(q[0]-sx,q[1]-sy);
      const sunPx=SUN_R/s[2]*cv.clientHeight*0.5;
      vis*=clamp((d-rpx*0.55)/Math.max(rpx+sunPx,1),0,1);
    }}
  return{uv:[sx/cv.clientWidth,1-sy/cv.clientHeight],vis:clamp(vis,0,1)};}

function fsDraw(){gl.bindVertexArray(quadVAO);gl.drawArrays(gl.TRIANGLES,0,3);}
function postFX(now){
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.BLEND);gl.disable(gl.CULL_FACE);
  if(TOG.glow){
    gl.useProgram(P_PRE.p);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,scTex);
    gl.uniform1i(P_PRE.u.uT,0);gl.uniform2f(P_PRE.u.uTexel,1/W,1/H);
    gl.bindFramebuffer(gl.FRAMEBUFFER,bloom[0].f);gl.viewport(0,0,bloom[0].w,bloom[0].h);fsDraw();
    gl.useProgram(P_DOWN.p);gl.uniform1i(P_DOWN.u.uT,0);
    for(let i=1;i<bloom.length;i++){
      gl.bindTexture(gl.TEXTURE_2D,bloom[i-1].t);
      gl.uniform2f(P_DOWN.u.uTexel,1/bloom[i-1].w,1/bloom[i-1].h);
      gl.bindFramebuffer(gl.FRAMEBUFFER,bloom[i].f);gl.viewport(0,0,bloom[i].w,bloom[i].h);fsDraw();}
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);   // 加法累加，避免读写同一纹理
    gl.useProgram(P_UP.p);gl.uniform1i(P_UP.u.uT,0);gl.uniform1f(P_UP.u.uK,1.0);
    for(let i=bloom.length-1;i>0;i--){
      gl.bindTexture(gl.TEXTURE_2D,bloom[i].t);
      gl.uniform2f(P_UP.u.uTexel,1/bloom[i].w,1/bloom[i].h);
      gl.bindFramebuffer(gl.FRAMEBUFFER,bloom[i-1].f);gl.viewport(0,0,bloom[i-1].w,bloom[i-1].h);fsDraw();}
    gl.disable(gl.BLEND);
  }else{
    gl.bindFramebuffer(gl.FRAMEBUFFER,bloom[0].f);gl.viewport(0,0,bloom[0].w,bloom[0].h);
    gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);}
  const ss=sunScreen();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
  gl.useProgram(P_COMP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,scTex);gl.uniform1i(P_COMP.u.uScene,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,bloom[0].t);gl.uniform1i(P_COMP.u.uBloom,1);
  gl.uniform2f(P_COMP.u.uRes,W,H);
  gl.uniform1f(P_COMP.u.uTime,now*0.001);
  gl.uniform1f(P_COMP.u.uBloomI,TOG.glow?0.34:0.0);
  gl.uniform1f(P_COMP.u.uExposure,1.0);
  gl.uniform1f(P_COMP.u.uFlareI,TOG.glow?1.0:0.0);
  gl.uniform2fv(P_COMP.u.uSunUV,ss.uv);
  gl.uniform1f(P_COMP.u.uSunVis,ss.vis);
  fsDraw();
  gl.activeTexture(gl.TEXTURE0);
}

/* ===================== 覆盖层 / 界面刷新 ===================== */
const dateEl=document.getElementById('date'),rateEl=document.getElementById('rateLbl');
let infoT=0;
function pad(n,w){return String(n).padStart(w||2,'0');}
function updateOverlay(){
  // 标签
  for(const b of bodies){
    const el=labelEls.get(b);
    if(!TOG.label||(b.kind==='moon'&&!TOG.moon)||(b.kind==='comet'&&!TOG.comet)){el.style.display='none';continue;}
    const s=proj(b.pos);
    if(!s||s[0]<-80||s[0]>cv.clientWidth+80||s[1]<-40||s[1]>cv.clientHeight+40){el.style.display='none';continue;}
    const px=(b.dR||1)/s[2]*cv.clientHeight;
    const a=clamp(1.25-px/90,0,1)*clamp(px*6,0,1);
    if(a<0.03){el.style.display='none';continue;}
    el.style.display='block';el.style.opacity=a.toFixed(3);
    el.style.left=s[0].toFixed(1)+'px';el.style.top=s[1].toFixed(1)+'px';}
  // 日期
  const d=new Date(simMs);
  dateEl.textContent=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+
    ' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds())+' UTC';
  rateEl.textContent=playing?fmtRate(daysPerSec(speedV)):'已暂停';
  if(performance.now()-infoT>110){infoT=performance.now();renderInfo();}
}

/* ===================== 交互 ===================== */
let downX=0,downY=0,downT=0;
cv.addEventListener('mousedown',e=>{downX=e.clientX;downY=e.clientY;downT=performance.now();});
cv.addEventListener('click',e=>{
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>5)return;
  let best=null,bd=48;
  for(const b of bodies){
    if(b.kind==='moon'&&!TOG.moon)continue;
    if(b.kind==='comet'&&!TOG.comet)continue;
    const s=proj(b.pos);if(!s)continue;
    const d=Math.hypot(s[0]-e.clientX,s[1]-e.clientY);
    const r=Math.max(14,(b.dR||1)/s[2]*cv.clientHeight*0.5);
    if(d<Math.max(bd,r)&&d<r*1.6+34){if(!best||d<bd){best=b;bd=d;}}}
  if(best)focusOn(best);});
const playBtn=document.getElementById('play');
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'❚❚':'▶';};
document.getElementById('now').onclick=()=>{simMs=Date.now();lastJD=jdOf(simMs);};
const spEl=document.getElementById('speed');
spEl.oninput=()=>{speedV=parseFloat(spEl.value);};
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playBtn.click();}
  else if(e.code==='ArrowRight'){speedV=clamp(speedV+2,-100,100);spEl.value=speedV;}
  else if(e.code==='ArrowLeft'){speedV=clamp(speedV-2,-100,100);spEl.value=speedV;}
  else if(e.key==='h'||e.key==='H'){document.getElementById('ui').classList.toggle('hidden');
    labelLayer.style.display=labelLayer.style.display==='none'?'':'none';
    document.getElementById('hint').style.display=document.getElementById('hint').style.display==='none'?'':'none';}
});

/* ===================== 启动 ===================== */
updatePositions(0);
renderInfo();
const ld=document.getElementById('loading');
ld.style.opacity='0';setTimeout(()=>ld.remove(),700);
requestAnimationFrame(render);
const e0=gl.getError();if(e0!==0)console.warn('gl error at init',e0);
</script>
