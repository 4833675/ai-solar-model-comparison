<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>太阳系 · 实时轨道模型 Hy4 V2</title>
<style>
  :root{
    --bg:#04060d;
    --acc:#6fd3ff;
    --acc2:#ffb86b;
    --line:rgba(140,180,255,.14);
    --panel:rgba(9,13,24,.56);
    --txt:#dbe4f4;
    --dim:#8b98b4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    color:var(--txt);-webkit-font-smoothing:antialiased}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  /* 统一网格编排：面板不再各自绝对定位，结构上不可能重叠 */
  #layout{position:absolute;inset:14px;display:grid;
    grid-template-columns:280px minmax(0,1fr) 292px;
    grid-template-rows:minmax(0,1fr) auto;
    column-gap:12px;row-gap:10px;pointer-events:none}
  #leftcol{grid-area:1/1;display:flex;flex-direction:column;gap:10px;min-height:0}
  #rightcol{grid-area:1/3;display:flex;flex-direction:column;gap:10px;min-height:0}
  #bottombar{grid-area:2/1/3/4;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 10px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    pointer-events:auto;overflow:hidden;flex:none}
  .ttl{font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin:0 0 8px}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.06em}
  h1 small{display:block;font-size:10px;font-weight:400;color:var(--dim);letter-spacing:.18em;margin-top:3px}

  /* ---------- 顶部 ---------- */
  #top{padding:13px 16px}
  #date{font-size:18px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin-top:8px;white-space:nowrap}
  #date span{color:var(--acc)}
  #meta{margin-top:7px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;line-height:1.7}
  #meta b{color:var(--acc2);font-weight:500}

  /* ---------- 左侧列表 ---------- */
  #left{padding:11px;flex:0 1 auto;min-height:0;overflow-y:auto}
  #left::-webkit-scrollbar{width:4px}
  #left::-webkit-scrollbar-thumb{background:rgba(140,180,255,.2);border-radius:4px}
  .it{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;
    font-size:12.5px;transition:background .16s,color .16s;user-select:none}
  .it:hover{background:rgba(111,211,255,.1)}
  .it.on{background:rgba(111,211,255,.17);color:#fff}
  .it .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 9px currentColor}
  .it .sub{margin-left:auto;font-size:9.5px;color:var(--dim);letter-spacing:.04em}

  /* ---------- 右侧信息 ---------- */
  #right{padding:14px 16px;flex:0 1 auto;min-height:0;overflow-y:auto}
  #right::-webkit-scrollbar{width:4px}
  #right::-webkit-scrollbar-thumb{background:rgba(140,180,255,.2);border-radius:4px}
  #rname{font-size:20px;font-weight:600;letter-spacing:.04em}
  #ren{font-size:10.5px;color:var(--dim);letter-spacing:.2em;margin-top:2px;text-transform:uppercase}
  #rdesc{font-size:11.5px;line-height:1.85;color:#a9b6cd;margin:11px 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:4px 0;line-height:1.5}
  .kv .k{color:var(--dim);flex:none}
  .kv .v{text-align:right;font-variant-numeric:tabular-nums;color:#e6edf9}
  .sect{margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
  .sect .ttl{margin-bottom:6px}
  .live .v{color:var(--acc)}
  #tag{display:inline-block;font-size:9.5px;letter-spacing:.14em;padding:2px 7px;border-radius:5px;
    background:rgba(255,184,107,.14);color:var(--acc2);border:1px solid rgba(255,184,107,.22);margin-left:7px;vertical-align:2px}

  /* ---------- 开关 ---------- */
  #toggles{padding:12px 14px;margin-top:auto}
  .tggrid{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
  .tg{display:flex;align-items:center;gap:8px;padding:3.5px 0;font-size:11.5px;cursor:pointer;user-select:none}
  .tg .box{width:14px;height:14px;border-radius:4px;border:1px solid rgba(140,180,255,.3);flex:none;
    display:flex;align-items:center;justify-content:center;transition:.15s}
  .tg.on .box{background:var(--acc);border-color:var(--acc);box-shadow:0 0 10px rgba(111,211,255,.5)}
  .tg .box:after{content:"";width:7px;height:4px;border-left:1.6px solid #04101c;border-bottom:1.6px solid #04101c;
    transform:rotate(-45deg) scale(0);transition:.15s;margin-top:-2px}
  .tg.on .box:after{transform:rotate(-45deg) scale(1)}
  .sel{margin-top:8px;display:flex;gap:4px}
  .sel div{flex:1;text-align:center;font-size:10.5px;padding:5px 0;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);color:var(--dim);transition:.15s}
  .sel div.on{background:rgba(111,211,255,.16);color:#fff;border-color:rgba(111,211,255,.45)}

  /* ---------- 底部控制 ---------- */
  #bottom{padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
  .btn{pointer-events:auto;background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:6px 11px;font-size:11.5px;cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit}
  .btn:hover{background:rgba(111,211,255,.15);border-color:rgba(111,211,255,.4)}
  .btn.act{background:rgba(111,211,255,.2);border-color:rgba(111,211,255,.55);color:#fff}
  .btn.wide{padding:6px 13px}
  #spd{width:172px;accent-color:var(--acc);cursor:pointer}
  #spdv{font-size:11.5px;color:var(--acc2);min-width:78px;font-variant-numeric:tabular-nums}
  .sep{width:1px;height:22px;background:var(--line)}

  /* ---------- 标签 ---------- */
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lb{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity .2s}
  .lb .ring{width:7px;height:7px;border:1px solid rgba(255,255,255,.65);border-radius:50%;flex:none;margin-left:-3.5px}
  .lb .nm{font-size:11px;letter-spacing:.05em;color:#dce6f7;text-shadow:0 0 10px #000,0 0 3px #000;padding-left:2px}
  .lb.on .nm{color:#fff;font-weight:600}
  .lb.on .ring{border-color:var(--acc);box-shadow:0 0 10px var(--acc)}

  #hint{font-size:10.5px;color:rgba(139,152,180,.65);
    letter-spacing:.08em;pointer-events:none;text-align:center;line-height:1.7}

  /* ---------- 载入 ---------- */
  #load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,#0b1524 0%,#04060d 68%);transition:opacity .8s}
  #load.off{opacity:0;pointer-events:none}
  .sunl{width:74px;height:74px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 38% 34%,#fff6d8,#ffb545 38%,#ff6a1e 68%,#c02c00);
    box-shadow:0 0 60px rgba(255,150,40,.75),0 0 140px rgba(255,90,20,.35);animation:bp 2.6s ease-in-out infinite}
  @keyframes bp{0%,100%{transform:scale(1);filter:hue-rotate(0deg)}50%{transform:scale(1.06);filter:hue-rotate(-8deg)}}
  .sunl:after{content:"";position:absolute;inset:-26px;border-radius:50%;border:1px solid rgba(255,180,90,.22);
    animation:sp 7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #ltext{margin-top:26px;font-size:11px;letter-spacing:.34em;color:#7d8ba6}
  #lsub{margin-top:9px;font-size:10px;color:#5b6780;letter-spacing:.1em}
  #err{max-width:430px;text-align:center;line-height:2;font-size:12px;color:#9fb0cc;display:none}
  #err a{color:var(--acc);cursor:pointer;text-decoration:underline;margin:0 6px}

  /* 窄屏：先压缩列宽，再逐步隐藏次要面板 */
  @media (max-width:1180px){
    #layout{grid-template-columns:240px minmax(0,1fr) 258px;column-gap:9px}
    #date{font-size:16px}
    #spd{width:126px}
    #spdv{min-width:66px}
    #bottom{gap:8px}
  }
  @media (max-width:900px){
    #layout{grid-template-columns:196px minmax(0,1fr) 224px;column-gap:8px}
    .tggrid{grid-template-columns:1fr}
    #spd{width:96px}
  }
  @media (max-width:700px){
    #layout{grid-template-columns:minmax(0,1fr) 210px;grid-template-rows:minmax(0,1fr) auto}
    #leftcol{grid-area:1/1}
    #rightcol{grid-area:1/2}
    #bottombar{grid-area:2/1/3/3}
    #left{display:none}
  }
</style>
</head>
<body>

<div id="load">
  <div class="sunl"></div>
  <div id="ltext">SOLAR SYSTEM</div>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';

/* ==========================================================================
   0. 常量与工具
   ========================================================================== */
const TAU   = Math.PI * 2;
const D2R   = Math.PI / 180;
const DAY   = 86400000;                         // ms
const J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);   // 儒略历元 J2000.0
const AU_KM = 149597870.7;                      // km
const GM_SUN = 1.32712440018e11;                // km^3/s^2
const C_KMS  = 299792.458;                      // km/s

const daysFromJ2000 = ms => (ms - J2000) / DAY;
const centuries     = d  => d / 36525;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// 距离显示比例：显示距离 = DIST_K * a^distExp （a 以 AU 计，1 AU → 100 单位）
const DIST_K = 100;
let   distExp = 0.6;
const distScale = a => DIST_K * Math.pow(a, distExp);

// 天体显示半径（视觉压缩，非真实比例）
const dispRadius = km => 1.9 * Math.pow(km / 6371.0, 0.44);
const SUN_R = 22;

/* ==========================================================================
   1. 轨道根数（JPL 近似要素，历元 J2000.0，含每世纪变化率）
   a(AU) e i(deg) L(平黄经) w̄(近日点黄经) Ω(升交点黄经)
   ========================================================================== */
const EL = {
  mercury:{a:0.38709927,e:0.20563593,i:7.00497902,L:252.25032350,w:77.45779628,o:48.33076593,
           da:0.00000037,de:0.00001906,di:-0.00594749,dL:149472.67411175,dw:0.16047689,do:-0.12534081},
  venus  :{a:0.72333566,e:0.00677672,i:3.39467605,L:181.97909950,w:131.60246718,o:76.67984255,
           da:0.00000390,de:-0.00004107,di:-0.00078890,dL:58517.81538729,dw:0.00268329,do:-0.27769418},
  earth  :{a:1.00000261,e:0.01671123,i:-0.00001531,L:100.46457166,w:102.93768193,o:0.0,
           da:0.00000562,de:-0.00004392,di:-0.01294668,dL:35999.37244981,dw:0.32327364,do:0.0},
  mars   :{a:1.52371034,e:0.09339410,i:1.84969142,L:-4.55343205,w:-23.94362959,o:49.55953891,
           da:0.00001847,de:0.00007882,di:-0.00813131,dL:19140.30268499,dw:0.44441088,do:-0.29257343},
  jupiter:{a:5.20288700,e:0.04838624,i:1.30439695,L:34.39644051,w:14.72847983,o:100.47390909,
           da:-0.00011607,de:-0.00013253,di:-0.00183714,dL:3034.74612775,dw:0.21252668,do:0.20469106},
  saturn :{a:9.53667594,e:0.05386179,i:2.48599187,L:49.95424423,w:92.59887831,o:113.66242448,
           da:-0.00125060,de:-0.00050991,di:0.00193609,dL:1222.49362201,dw:-0.41897216,do:-0.28867794},
  uranus :{a:19.18916464,e:0.04725744,i:0.77263783,L:313.23810451,w:170.95427630,o:74.01692503,
           da:-0.00196176,de:-0.00004397,di:-0.00242939,dL:428.48202785,dw:0.40805281,do:0.04240589},
  neptune:{a:30.06992276,e:0.00859048,i:1.77004347,L:-55.12002969,w:44.96476227,o:131.78422574,
           da:0.00026291,de:0.00005105,di:0.00035372,dL:218.45945325,dw:-0.32241464,do:-0.00508664},
  pluto  :{a:39.48211675,e:0.24882730,i:17.14001206,L:238.92903833,w:224.06891629,o:110.30393684,
           da:-0.00031596,de:0.00005170,di:0.00004818,dL:145.20780515,dw:-0.04062942,do:-0.01183482},
  halley :{a:17.834,e:0.96714,i:162.26269,L:38.38,w:111.33249 + 58.42008,o:58.42008,
           da:0,de:0,di:0,dL:0,dw:0,do:0, peri: Date.UTC(1986,1,9,0,0,0)}
};

/* 稳健求解开普勒方程（Danby 初值 + 三阶迭代，可处理 e→0.97） */
function solveKepler(M, e){
  M = M % TAU; if (M > Math.PI) M -= TAU; if (M < -Math.PI) M += TAU;
  let E = M + 0.85 * e * Math.sign(Math.sin(M) || 1);
  for (let k = 0; k < 60; k++){
    const s = e * Math.sin(E), c = e * Math.cos(E);
    const f = E - s - M, fp = 1 - c, fpp = s, fppp = c;
    const d1 = -f / fp;
    const d2 = -f / (fp + 0.5 * d1 * fpp);
    const d3 = -f / (fp + 0.5 * d2 * fpp + d2 * d2 * fppp / 6);
    E += d3;
    if (Math.abs(d3) < 1e-12) break;
  }
  return E;
}

/* 由根数求日心黄道直角坐标（AU）。out = [x,y,z] */
function keplerXYZ(el, days, out){
  const T = centuries(days);
  let a, e, i, L, w, o, M;
  if (el.peri !== undefined){                       // 彗星：以过近日点时刻推算
    a = el.a; e = el.e; i = el.i * D2R; w = el.w * D2R - el.o * D2R; o = el.o * D2R;
    const P = 365.256363 * Math.pow(el.a, 1.5);
    M = TAU * ((days - daysFromJ2000(el.peri)) / P);
  } else {
    a = el.a + el.da * T; e = el.e + el.de * T; i = (el.i + el.di * T) * D2R;
    L = (el.L + el.dL * T) * D2R;
    const wb = (el.w + el.dw * T) * D2R; o = (el.o + el.do * T) * D2R;
    w = wb - o; M = L - wb;
  }
  const E = solveKepler(M, e);
  const xv = a * (Math.cos(E) - e);
  const yv = a * Math.sqrt(1 - e * e) * Math.sin(E);
  const cw = Math.cos(w), sw = Math.sin(w), co = Math.cos(o), so = Math.sin(o),
        ci = Math.cos(i), si = Math.sin(i);
  out[0] = (cw * co - sw * so * ci) * xv + (-sw * co - cw * so * ci) * yv;
  out[1] = (cw * so + sw * co * ci) * xv + (-sw * so + cw * co * ci) * yv;
  out[2] = (sw * si) * xv + (cw * si) * yv;
  return out;
}

/* 采样一整条开普勒轨道（AU 黄道坐标，供画轨道线用） */
function sampleOrbit(el, n, atDays){
  const arr = new Float32Array(n * 3), tmp = [0, 0, 0], d = atDays || 0;
  const T = centuries(d);
  const a = el.a + (el.da || 0) * T, e = el.e + (el.de || 0) * T, i = (el.i + (el.di || 0) * T) * D2R;
  const L = el.L !== undefined ? (el.L + (el.dL || 0) * T) * D2R : 0;
  const wb = el.w !== undefined ? (el.w + (el.dw || 0) * T) * D2R : el.wb;
  const o = (el.o + (el.do || 0) * T) * D2R;
  const w = wb - o, M0 = L - wb;
  const cw = Math.cos(w), sw = Math.sin(w), co = Math.cos(o), so = Math.sin(o),
        ci = Math.cos(i), si = Math.sin(i);
  const P = el.peri !== undefined ? 365.256363 * Math.pow(el.a, 1.5) : null;
  for (let k = 0; k < n; k++){
    const M = P ? TAU * ((d - daysFromJ2000(el.peri)) / P) + (k / n) * TAU : M0 + (k / n) * TAU;
    const E = solveKepler(M, e);
    const xv = a * (Math.cos(E) - e), yv = a * Math.sqrt(1 - e * e) * Math.sin(E);
    arr[k*3  ] = (cw*co - sw*so*ci) * xv + (-sw*co - cw*so*ci) * yv;
    arr[k*3+1] = (cw*so + sw*co*ci) * xv + (-sw*so + cw*co*ci) * yv;
    arr[k*3+2] = (sw*si) * xv + (cw*si) * yv;
  }
  return arr;
}

/* ==========================================================================
   3. GLSL：公共噪声库
   ========================================================================== */
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))
        +i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));

uniform vec3 uSunDirLocal; uniform vec3 uCamLocal; uniform float uAtten; uniform vec2 uRingInfo;
float ringShadow(vec3 P){
  if(uRingInfo.y <= 0.0) return 1.0;
  vec3 L = normalize(uSunDirLocal);
  if(abs(L.y) < 1e-4) return 1.0;
  float t = -P.y / L.y;
  if(t <= 0.0) return 1.0;
  vec3 X = P + L*t;
  float rr = length(X.xz);
  if(rr < uRingInfo.x || rr > uRingInfo.y) return 1.0;
  float mid = (rr - uRingInfo.x)/(uRingInfo.y - uRingInfo.x);
  float dens = 1.0 - 0.55*exp(-pow((rr-(uRingInfo.x+(uRingInfo.y-uRingInfo.x)*0.62))/0.045,2.0));
  return mix(1.0, 1.0 - 0.72*dens, smoothstep(0.0,0.04,mid)*(1.0-smoothstep(0.96,1.0,mid)));
}
`;

    d *= mix(1.0, 0.66, smoothstep(1.98,2.07,rr));         // A 环中等
    d *= 0.78 + 0.22*fbm3(vec3(rr*180.0, 3.7, 1.3));
    d *= 0.88 + 0.12*sin(rr*410.0);
    d *= 1.0 - 0.35*smoothstep(1.45,1.55,rr)*(1.0-smoothstep(1.60,1.72,rr));
  } else {
    d  = smoothstep(1.58,1.63,rr)*(1.0-smoothstep(1.96,2.00,rr));
    d *= 0.10 + 0.55*exp(-pow((rr-1.90)/0.020,2.0)) + 0.30*exp(-pow((rr-1.75)/0.016,2.0));
    d *= 0.85 + 0.15*fbm3(vec3(rr*90.0, 1.7, 5.3));
  }
  if(d <= 0.002) discard;
  // 行星在环上的投影（世界空间）
  vec3 Lw = normalize(uSunPos - uPlanetPos);
  vec3 v = vWorld - uPlanetPos;
  float t = dot(v,Lw);
  float perp = length(v - Lw*t);
  float sh = 1.0;
  if(t < 0.0) sh = smoothstep(uPlanetR*0.90, uPlanetR*1.12, perp);
  sh = mix(0.10, 1.0, sh);
  // 光照（物体局部空间：薄盘，太阳越接近环面越暗）
  vec3 N = normalize(vNrm);
  vec3 L = normalize(uSunDirLocal);
  float mu = abs(dot(N,L));
  float lit = mix(0.10, 1.0, pow(mu,0.55));
  float trans = 0.0;
  vec3 V = normalize(uCamLocal - vRing);
  if(dot(V,N)*dot(L,N) < 0.0) trans = 0.42*pow(1.0-mu,2.2);
  vec3 col = mix(uC2,uC1, smoothstep(1.2,2.3,rr));
  col = mix(col, uC3, 0.35*(1.0-smoothstep(1.5,1.9,rr)));
  float a = clamp(d,0.0,1.0)*0.95;
  vec3 outc = col*(lit + trans)*sh*uAtten;
  gl_FragColor = vec4(outc*a, a);
}`;

/* ---------------- 恒星 ---------------- */
const V_STAR = `
attribute float aSize; attribute float aPhase; attribute vec3 aColor;
uniform float uTime; varying vec3 vC; varying float vTw;
void main(){
  vC = aColor;
  vTw = 0.72 + 0.28*sin(uTime*1.7 + aPhase*23.0);
  vec4 mv = modelViewMatrix * vec4(position,1.0);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = aSize * (0.85 + 0.3*vTw);
}`;
const F_STAR = `
varying vec3 vC; varying float vTw;
void main(){
  vec2 c = gl_PointCoord - 0.5;
  float d = length(c);
  float a = smoothstep(0.5,0.02,d);
  float core = smoothstep(0.20,0.0,d);
  float flare = pow(max(0.0,1.0-abs(c.x)*14.0),3.0)*smoothstep(0.5,0.0,abs(c.y)) +
                pow(max(0.0,1.0-abs(c.y)*14.0),3.0)*smoothstep(0.5,0.0,abs(c.x));
  vec3 col = vC*(a*0.85 + core*0.9) + vec3(1.0)*core*0.35*vTw + vC*flare*0.5;
  gl_FragColor = vec4(col*vTw, 1.0);
}`;

/* ---------------- 深空背景（星云 + 银河尘埃） ---------------- */
const V_BG = `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const F_BG = NOISE + `
uniform float uTime; varying vec3 vDir;
void main(){
  vec3 d = normalize(vDir);
  float band = exp(-pow(d.y*3.4,2.0));                  // 银道面
  float n1 = fbm(d*2.2 + vec3(0.0,0.0,3.0));
  float n2 = fbm(d*5.5 + vec3(7.0,1.0,0.0));
  float neb = smoothstep(0.05,0.75, n1*0.6 + n2*0.4);
  vec3 c1 = vec3(0.055,0.075,0.20);
  vec3 c2 = vec3(0.16,0.055,0.20);
  vec3 c3 = vec3(0.02,0.10,0.13);
  vec3 col = mix(c1,c2, smoothstep(0.2,0.8,n2*0.5+0.5));
  col = mix(col, c3, smoothstep(0.4,0.9,n1*0.5+0.5));
  col *= neb*0.55;
  col += vec3(0.10,0.11,0.14)*band*0.30*(0.55+0.45*neb);
  col += vec3(0.05,0.07,0.11)*band*band*0.20;
  gl_FragColor = vec4(col*0.9, 1.0);
}`;

/* ---------------- 小行星带（实例化） ---------------- */
const V_AST = NOISE + `
attribute float aSeed; attribute float aAU; attribute float aPhase;
attribute float aInc; attribute float aNode; attribute float aSize;
uniform float uK,uExp,uDays,uClock;
varying vec3 vWorld,vNrm; varying float vAtten,vSeed;
void main(){
  vec3 p = position*aSize;
  float n = snoise(position*2.3 + vec3(aSeed*17.0));
  p *= 1.0 + 0.55*n;
  p += normalize(position)*0.22*n*aSize;
  float ang = uClock*(0.12+0.55*fract(aSeed*7.3)) + aSeed*37.0;   // 自转用真实时间，避免高速时闪烁
  vec3 axis = normalize(vec3(sin(aSeed*23.0),0.85,cos(aSeed*11.0)));
  float c=cos(ang), s=sin(ang);
  p = p*c + cross(axis,p)*s + axis*dot(axis,p)*(1.0-c);
  float dOrb = uK*pow(aAU,uExp);
  float th = aPhase + uDays*TAU/(365.256363*pow(aAU,1.5));
  vec3 U = vec3(cos(aNode),0.0,sin(aNode));
  vec3 V = vec3(-sin(aNode)*cos(aInc), sin(aInc), cos(aNode)*cos(aInc));
  vec3 local = p + dOrb*(cos(th)*U + sin(th)*V);
  vSeed = aSeed;
  vAtten = pow(1.0/aAU, 0.32);
  vNrm = normalize(normal);
  vec4 wp = modelMatrix * instanceMatrix * vec4(local,1.0);
  vWorld = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const F_AST = NOISE + `
varying vec3 vWorld,vNrm; varying float vAtten,vSeed;
void main(){
  vec3 N = normalize(vNrm);
  vec3 L = normalize(-vWorld);
  vec3 V = normalize(cameraPosition - vWorld);
  float ndl = dot(N,L);
  float diff = max(ndl,0.0);
  vec3 base = mix(vec3(0.30,0.25,0.21), vec3(0.58,0.53,0.46), fract(vSeed*3.7)*0.5 + 0.5*smoothstep(0.1,0.5,fbm(vWorld*0.4)));
  vec3 col = base*(diff*0.95+0.05)*vAtten;
  col += base*0.05;
  gl_FragColor = vec4(col,1.0);
}`;

/* ---------------- 柯伊伯带 / 彗尾 点精灵 ---------------- */
const V_PT = `
attribute float aSize; attribute float aAlpha; attribute vec3 aColor;
varying vec3 vC; varying float vA;
void main(){
  vC = aColor; vA = aAlpha;
  vec4 mv = modelViewMatrix * vec4(position,1.0);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = aSize * (420.0 / max(-mv.z, 1.0));
  gl_PointSize = clamp(gl_PointSize, 1.0, 42.0);
}`;
const F_PT = `
varying vec3 vC; varying float vA;
void main(){
  float d = length(gl_PointCoord - 0.5);
  float a = smoothstep(0.5,0.03,d);
  a *= a;
  gl_FragColor = vec4(vC, a*vA);          // 加色混合：贡献 = vC * a * vA
}`;

/* ---------------- 轨迹线 ---------------- */
const V_TRAIL = `
attribute float aAlpha; varying float vA;
void main(){ vA = aAlpha; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const F_TRAIL = `
varying float vA; uniform vec3 uColor;
void main(){ gl_FragColor = vec4(uColor*vA, vA); }`;

/* ---------------- 日冕 / 镜头光晕 ---------------- */
const V_BB = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const F_CORONA = NOISE + `
uniform float uTime; uniform vec3 uC1,uC2; uniform float uI;
varying vec2 vUv;
void main(){
  vec2 p = vUv*2.0-1.0;
  float r = length(p);
  // 圆形窗口：必须在抵达方形平面边界（r>=1）之前完全归零。
  // 否则残留的极小亮度（约 0.02 线性）经 sRGB 编码会被提亮到 0.19，露出可见的方框边。
  float mask = 1.0 - smoothstep(0.55, 0.95, r);
  if (mask <= 0.0) discard;
  float a = atan(p.y,p.x);
  float glow = (2.2*exp(-r*9.5) + 4.5*exp(-r*20.0)) * 1.7;
  float n = fbm(vec3(cos(a)*2.2, sin(a)*2.2, uTime*0.035));
  float rays = pow(max(0.0, n*0.5+0.5), 3.2) * exp(-r*6.5) *
               smoothstep(0.15,0.22,r) * (1.0-smoothstep(0.40,0.70,r)) * 0.33;
  float streak = exp(-abs(p.y)*95.0)*exp(-abs(p.x)*7.5)*0.22
               + exp(-abs(p.x)*150.0)*exp(-abs(p.y)*9.0)*0.12;
  vec3 col = (uC1*glow + uC2*rays*1.6 + uC1*streak*1.1) * uI * mask;
  gl_FragColor = vec4(col,1.0);
}`;

/* ---------------- 后期：暗角 + 色差 + 颗粒 ---------------- */
const FinalShader = {
  uniforms:{ tDiffuse:{value:null}, uTime:{value:0}, uAmt:{value:1} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uTime,uAmt; varying vec2 vUv;
    float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec2 uv = vUv; vec2 c = uv - 0.5; float r2 = dot(c,c);
      float ca = 0.0026*uAmt*r2*4.0;
      vec3 col;
      col.r = texture2D(tDiffuse, uv + c*ca).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - c*ca).b;
      float vig = smoothstep(1.15,0.30,length(c)*1.32);
      col *= mix(1.0, vig, 0.80*uAmt);
      float g = h21(uv*vec2(1024.0,1024.0) + fract(uTime)*97.0) - 0.5;
      col += g*0.030*uAmt;
      gl_FragColor = vec4(col,1.0);
    }`
};

      vec3 p = normalize(vLocal); vec3 q = rotY(p,-uSpin*0.4);

/* ---------- 行星 ---------- */
function buildPlanet(def){
  const r = dispRadius(def.R);
  const u = {
    uTime:{value:0}, uSpin:{value:0}, uSeed:{value:def.seed||0}, uAtten:{value:1},
    uSunPos:{value:new THREE.Vector3(0,0,0)}, uSunDirLocal:{value:new THREE.Vector3(1,0,0)},
    uCamLocal:{value:new THREE.Vector3(0,0,100)},
    uRingInfo:{value:new THREE.Vector2(0,0)},
    uC1:{value:C(def.col[0])}, uC2:{value:C(def.col[1])},
    uC3:{value:C(def.col[2])}, uC4:{value:C(def.col[3])}
  };
  let fs = F_ROCKY;
  if (def.style === 'earth'){
    fs = F_EARTH; u.uNight = {value:1.0};
  } else if (def.style === 'gas'){
    fs = F_GAS;
    u.uBand = {value:def.band||8.0};
    u.uSpot = {value:def.spot||0};
    u.uSpotLat = {value:def.spotLat||0};
    u.uSpotLon = {value:def.spotLon||0};
  } else if (def.style === 'ice'){
    fs = F_ICE;
    u.uBand = {value:def.band||3.0};
    u.uSpot = {value:def.spot||0};
    u.uSpotLat = {value:def.spotLat||0};
    u.uSpotLon = {value:def.spotLon||0};
  } else if (def.style === 'venus'){
    fs = F_VENUS;
  } else {
    u.uBump = {value:def.bump!==undefined?def.bump:0.9};
    u.uCapLat = {value:def.cap!==undefined?def.cap:0.86};
    u.uCapStr = {value:def.cap!==undefined?1.0:0.0};
    u.uMaria = {value:def.maria||0};
    u.uPatch = {value:def.patch||0};
    u.uHaze = {value:def.hazeAmt||0.0};
    u.uHazeCol = {value:C(def.haze||'#8899ff')};
  }
  const mat = new THREE.ShaderMaterial({ vertexShader:V_BODY, fragmentShader:fs, uniforms:u });
  const mesh = new THREE.Mesh(def.key==='earth'||def.key==='jupiter'||def.key==='saturn' ? GEO_HI : GEO_MD, mat);
  mesh.scale.setScalar(r);

  const group = new THREE.Group();          // 位置（世界）
  const tilt  = new THREE.Group();          // 轴倾角（自转极方向固定于惯性系）
  tilt.rotation.z = def.tilt * D2R;
  tilt.rotation.y = (def.pole||0) * D2R;
  tilt.add(mesh);
  group.add(tilt);
  scene.add(group);

  // 云层
  let cloudMesh = null, cloudMat = null;
  if (def.style === 'earth'){
    cloudMat = new THREE.ShaderMaterial({
      vertexShader:V_BODY, fragmentShader:F_CLOUD,
      uniforms:{
        uTime:{value:0}, uSpin:{value:0}, uSeed:{value:11.3}, uAtten:{value:1},
        uSunPos:{value:new THREE.Vector3(0,0,0)}, uSunDirLocal:{value:new THREE.Vector3(1,0,0)},
        uCamLocal:{value:new THREE.Vector3(0,0,100)}, uRingInfo:{value:new THREE.Vector2(0,0)}
      },
      transparent:true, depthWrite:false, blending:THREE.NormalBlending
    });
    cloudMesh = new THREE.Mesh(GEO_MD, cloudMat);
    cloudMesh.scale.setScalar(r*1.013);
    cloudMesh.renderOrder = 2;
    tilt.add(cloudMesh);
  }

  // 大气光晕
  let atmo = null, atmoMat = null;
  const atmoCfg = {
    earth:{col:'#4a8dff', p:3.0, i:1.15, s:1.030},
    venus:{col:'#ffd9a0', p:2.6, i:1.05, s:1.055},
    mars :{col:'#c98a5a', p:3.4, i:0.40, s:1.030},
    jupiter:{col:'#e8c9a0', p:3.2, i:0.55, s:1.022},
    saturn:{col:'#f0dcb0', p:3.2, i:0.45, s:1.022},
    uranus:{col:'#8ff0ea', p:3.0, i:0.75, s:1.030},
    neptune:{col:'#4d7fe8', p:3.0, i:0.85, s:1.030},
    titan:{col:'#ffb04a', p:2.8, i:0.95, s:1.055}
  }[def.key];
  if (atmoCfg){
    atmoMat = new THREE.ShaderMaterial({
      vertexShader:V_ATMO, fragmentShader:F_ATMO,
      uniforms:{ uSunDirLocal:{value:new THREE.Vector3(1,0,0)},
                 uCamLocal:{value:new THREE.Vector3(0,0,100)},
                 uColor:{value:C(atmoCfg.col)}, uPower:{value:atmoCfg.p}, uIntensity:{value:atmoCfg.i} },
      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.FrontSide
    });
    atmo = new THREE.Mesh(GEO_MD, atmoMat);
    atmo.scale.setScalar(r*atmoCfg.s);
    atmo.renderOrder = 3;
    tilt.add(atmo);
  }

  // 行星环
  let ring = null, ringMat = null;
  if (def.ring){
    const ri = def.ring.inner*r, ro = def.ring.outer*r;
    ringMat = new THREE.ShaderMaterial({
      vertexShader:V_RING, fragmentShader:F_RING,
      uniforms:{
        uSunPos:{value:new THREE.Vector3(0,0,0)}, uPlanetPos:{value:new THREE.Vector3()},
        uSunDirLocal:{value:new THREE.Vector3(0,1,0)}, uCamLocal:{value:new THREE.Vector3(0,0,100)},
        uC1:{value:C(def.ring.col[0])}, uC2:{value:C(def.ring.col[1])}, uC3:{value:C(def.ring.col[2])},
        uInner:{value:ri}, uOuter:{value:ro}, uPlanetR:{value:r},
        uStyle:{value:def.ring.style}, uAtten:{value:1}
      },
      transparent:true, side:THREE.DoubleSide, depthWrite:false, blending:THREE.NormalBlending
    });
    ring = new THREE.Mesh(new THREE.RingGeometry(ri, ro, 256, 8), ringMat);
    ring.rotation.x = -Math.PI/2;
    ring.renderOrder = 1;
    tilt.add(ring);
    mat.uniforms.uRingInfo.value.set(def.ring.inner, def.ring.outer);
  }

  const el = EL[def.key];
  const orbitAU = sampleOrbit(el, def.key==='pluto'?720:512);
  const b = {
    key:def.key, cn:def.cn, en:def.en, def, el, group, tilt, mesh, mat, cloudMat, atmoMat, ringMat,
    atmo, cloudMesh,
    r, worldPos:new THREE.Vector3(), dAU:1, spin:0, orbitAU,
    isPlanet:true, a:el.a, ring:ring||null
  };

  // 轨道线
  const og = new THREE.BufferGeometry();
  og.setAttribute('position', new THREE.BufferAttribute(new Float32Array(orbitAU.length), 3));
  const ol = new THREE.LineLoop(og, new THREE.LineBasicMaterial({
    color:new THREE.Color(def.col[1]).lerp(new THREE.Color('#8fb4ff'), 0.55),
    transparent:true, opacity:0.34, depthWrite:false
  }));
  ol.renderOrder = 0;
  scene.add(ol);
  b.orbitLine = ol;
  updateOrbitLine(b);

  // 轨迹
  const TN = 220;
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TN*3), 3));
  tg.setAttribute('aAlpha',   new THREE.BufferAttribute(new Float32Array(TN), 1));
  tg.setDrawRange(0,0);
  const tl = new THREE.Line(tg, new THREE.ShaderMaterial({
    vertexShader:V_TRAIL, fragmentShader:F_TRAIL,

    const mr = Math.max(dispRadius(md.R), 0.22);
    const mu = {
      uTime:{value:0}, uSpin:{value:0}, uSeed:{value:md.seed||0}, uAtten:{value:1},
      uSunPos:{value:new THREE.Vector3(0,0,0)}, uSunDirLocal:{value:new THREE.Vector3(1,0,0)},

      uCapStr:{value:md.cap?1.0:0.0}, uMaria:{value:md.maria||0}, uPatch:{value:0},

    };

    mmesh.scale.setScalar(mr);

    let matmo = null, am = null;

        transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
      });

    }

    const mo = {
      key:md.key, cn:md.cn, en:md.en, def:md, group:mgrp, mesh:mmesh, mat:mmat, atmoMat:matmo, atmoMesh:matmo?am:null,
      r:mr, dist, inc:(md.inc||0)*D2R, node:(md.key.length*1.7)%TAU,

  }

  planets.push(b);
  bodies.push(b);
  pickables.push({ mesh, body:b });
  makeLabel(b);
  return b;
}

function updateOrbitLine(b){
  const pos = b.orbitLine.geometry.attributes.position;
  const k = distScale(b.a) / b.a;   // 该天体统一的距离缩放
  const src = b.orbitAU;
  for (let i = 0; i < src.length/3; i++){
    pos.array[i*3  ] =  src[i*3  ] * k;
    pos.array[i*3+1] =  src[i*3+2] * k;
    pos.array[i*3+2] = -src[i*3+1] * k;
  }
  pos.needsUpdate = true;
  b.orbitLine.geometry.computeBoundingSphere();
}

/* 逐点径向压缩（用于高偏心率轨道，避免近日点被压缩进太阳内部） */
function fillOrbitLine(line, src){
  const arr = line.geometry.attributes.position.array;
  for (let i = 0; i < src.length/3; i++){
    const x = src[i*3], y = src[i*3+1], z = src[i*3+2];
    const r = Math.sqrt(x*x + y*y + z*z) || 1e-6;
    const k = distScale(r) / r;
    arr[i*3] = x*k; arr[i*3+1] = z*k; arr[i*3+2] = -y*k;
  }
  line.geometry.attributes.position.needsUpdate = true;
  line.geometry.computeBoundingSphere();
}

function makeTail(color, n, spread, curveAmt){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(n*3), size = new Float32Array(n),
        alpha = new Float32Array(n), col = new Float32Array(n*3);
  const c = new THREE.Color(color);
  const rnd = [];
  for (let i = 0; i < n; i++){
    rnd.push([Math.random()*2-1, Math.random()*2-1, Math.random()*2-1]);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(size,1));
  g.setAttribute('aAlpha',   new THREE.BufferAttribute(alpha,1));
  g.setAttribute('aColor',   new THREE.BufferAttribute(col,3));
  const m = new THREE.ShaderMaterial({
    vertexShader:V_PT, fragmentShader:F_PT, transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
  return { pts, geo:g, n, rnd, spread, curveAmt };
}

function makeKuiper(){
  const N = 3200;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3), sz = new Float32Array(N),
        al = new Float32Array(N), co = new Float32Array(N*3), auArr = new Float32Array(N);
  const base = new THREE.Color('#9fb4d8');
  for (let i = 0; i < N; i++){
    const a = 30 + Math.pow(Math.random(), 0.7)*22;
    const th = Math.random()*TAU;
    const inc = (Math.random()+Math.random()-1)*0.09;
    auArr[i] = a;
    const k = distScale(a);
    pos[i*3]   = Math.cos(th)*k;
    pos[i*3+1] = Math.sin(inc)*k*0.6;
    pos[i*3+2] = Math.sin(th)*k;
    sz[i] = 0.55 + Math.random()*1.5;
    al[i] = 0.22 + Math.random()*0.42;
    const t = Math.random();
    const c = base.clone().lerp(new THREE.Color('#c8d8f0'), t);
    co[i*3] = c.r; co[i*3+1] = c.g; co[i*3+2] = c.b;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(sz,1));
  g.setAttribute('aAlpha',   new THREE.BufferAttribute(al,1));
  g.setAttribute('aColor',   new THREE.BufferAttribute(co,3));
  const m = new THREE.ShaderMaterial({
    vertexShader:V_PT, fragmentShader:F_PT, transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  scene.add(p);
  return { pts:p, geo:g, au:auArr };
}

}

let fly = null;
function flyTo(b){
  const tgt = b.worldPos.clone();
  const dist = Math.max(b.r * 4.6, b.isSun ? SUN_R*5.2 : 2.4);
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1e-6) dir.set(0,0.5,1);
  dir.normalize();
  if (dir.y < 0.12){ dir.y = 0.12; dir.normalize(); }
  fly = { t:0, dur:1.5, fromT:controls.target.clone(), toT:tgt,
          fromP:camera.position.clone(), toP:tgt.clone().add(dir.multiplyScalar(dist)), b };
  focus = b;
  controls.minDistance = Math.max(0.5, b.r*1.45);
  select(b);
}
function flyToOrigin(){
  const dist = 1770;
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1e-6) dir.set(0,0.4,1);
  dir.normalize(); dir.y = Math.max(dir.y, 0.25); dir.normalize();
  fly = { t:0, dur:1.8, fromT:controls.target.clone(), toT:new THREE.Vector3(),
          fromP:camera.position.clone(), toP:dir.multiplyScalar(dist), b:null };
  controls.minDistance = 1.2;
}

/* ==========================================================================
   7. 主循环
   ========================================================================== */
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpV3 = new THREE.Vector3();
const tmpV4 = new THREE.Vector3();
const UPV = new THREE.Vector3(0,1,0);
const tmpM3 = new THREE.Matrix3();
const ecl = [0,0,0];
let frame = 0, fpsAcc = 0, fpsN = 0, lastT = performance.now();

/* 把太阳方向与相机位置换算到物体局部空间（片元着色器无 modelMatrix） */
const tmpM4 = new THREE.Matrix4();
function setLocalLight(mesh, mat, worldPos){
  mesh.updateWorldMatrix(true, false);
  tmpM3.setFromMatrix4(mesh.matrixWorld).invert();
  tmpV.set(0,0,0).sub(worldPos);
  if (tmpV.lengthSq() < 1e-9) tmpV.set(1,0,0);
  tmpV.normalize();
  if (mat.uniforms.uSunDirLocal) mat.uniforms.uSunDirLocal.value.copy(tmpV).applyMatrix3(tmpM3).normalize();
  tmpM4.copy(mesh.matrixWorld).invert();
  tmpV4.copy(camera.position).applyMatrix4(tmpM4);
  if (mat.uniforms.uCamLocal) mat.uniforms.uCamLocal.value.copy(tmpV4);
}

function isoDate(days){
  const d = new Date(J2000 + days*DAY);
  const wk = ['日','一','二','三','四','五','六'][d.getUTCDay()];
  return d.getUTCFullYear() + ' 年 ' + (d.getUTCMonth()+1) + ' 月 ' + d.getUTCDate() + ' 日' +
         ' <span>周' + wk + '</span>';
}

function updateBodies(dt, t){
  // 太阳
  sun.spin = TAU * (simDays / sunDef.rot);
  sunMat.uniforms.uSpin.value = sun.spin;
  sunMat.uniforms.uTime.value = t;
  chromoMat.uniforms.uSpin.value = sun.spin;
  chromoMat.uniforms.uTime.value = t;
  coronaMat.uniforms.uTime.value = t;
  corona.quaternion.copy(camera.quaternion);
  setLocalLight(sunMesh, sunMat, SUN_POS);
  chromoMat.uniforms.uCamLocal.value.copy(sunMat.uniforms.uCamLocal.value);

  // 行星
  for (const b of planets){
    keplerXYZ(b.el, simDays, ecl);
    const x = ecl[0], y = ecl[1], z = ecl[2];
    b.dAU = Math.sqrt(x*x + y*y + z*z);
    const k = distScale(b.a) / b.a;
    b.worldPos.set(x*k, z*k, -y*k);
    b.group.position.copy(b.worldPos);

    const att = Math.pow(1/Math.max(b.dAU, 0.05), 0.32);
    b.mat.uniforms.uAtten.value = att;
    b.mat.uniforms.uTime.value = t;
    b.mat.uniforms.uSpin.value = TAU * (simDays / b.def.rot);
    b.spin = b.mat.uniforms.uSpin.value;
    if (b.cloudMat){ b.cloudMat.uniforms.uAtten.value = att; b.cloudMat.uniforms.uTime.value = t;
                     b.cloudMat.uniforms.uSpin.value = TAU*(simDays/(b.def.rot*0.93)); }
    if (b.atmoMat) b.atmoMat.uniforms.uIntensity.value =
      (b.key==='earth'?1.15:0.75) * (0.9 + 0.1*Math.sin(t*0.7));
    if (b.ringMat){
      b.ringMat.uniforms.uPlanetPos.value.copy(b.worldPos);
      b.ringMat.uniforms.uAtten.value = att;
    }
    // 局部光向 / 相机（光照、环影均在物体局部空间求解）
    setLocalLight(b.mesh, b.mat, b.worldPos);
    if (b.cloudMat){
      b.cloudMat.uniforms.uSunDirLocal.value.copy(b.mat.uniforms.uSunDirLocal.value);
      b.cloudMat.uniforms.uCamLocal.value.copy(b.mat.uniforms.uCamLocal.value);
    }
    if (b.atmoMat){
      b.atmoMat.uniforms.uSunDirLocal.value.copy(b.mat.uniforms.uSunDirLocal.value);
      b.atmoMat.uniforms.uCamLocal.value.copy(b.mat.uniforms.uCamLocal.value);
    }
    if (b.ringMat) setLocalLight(b.ring, b.ringMat, b.worldPos);
    if (b.key === 'jupiter' && b.def.spot) b.mat.uniforms.uSpotLon.value = b.def.spotLon - simDays*0.00006;
    if (b.key === 'neptune' && b.def.spot) b.mat.uniforms.uSpotLon.value = b.def.spotLon + simDays*0.00012;

    // 卫星
    for (const m of b.moons){
      const ang = m.phase + TAU * (simDays / m.per);
      let rr = m.dist;
      if (m.e > 0.0005){
        const M = ang;
        const nu = M + 2*m.e*Math.sin(M) + 1.25*m.e*m.e*Math.sin(2*M);
        rr = m.dist * (1 - m.e*m.e) / (1 + m.e*Math.cos(nu));
      }
      const cy = Math.cos(m.inc), sy = Math.sin(m.inc);
      const co = Math.cos(m.node), so = Math.sin(m.node);
      const Ux = co, Uz = so;
      const Vx = -so*cy, Vy = sy, Vz = co*cy;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      m.group.position.set(rr*(ca*Ux + sa*Vx), rr*(sa*Vy), rr*(ca*Uz + sa*Vz));
      m.group.getWorldPosition(m.worldPos);
      m.mat.uniforms.uAtten.value = att;
      m.mat.uniforms.uTime.value = t;
      m.mat.uniforms.uSpin.value = TAU * (simDays / m.rot);
      setLocalLight(m.mesh, m.mat, m.worldPos);
      if (m.atmoMat){
        m.atmoMat.uniforms.uIntensity.value = 0.9;
        m.atmoMat.uniforms.uSunDirLocal.value.copy(m.mat.uniforms.uSunDirLocal.value);
        m.atmoMat.uniforms.uCamLocal.value.copy(m.mat.uniforms.uCamLocal.value);
      }
    }
  }

  // 哈雷彗星
  keplerXYZ(cometEl, simDays, ecl);
  {
    const x = ecl[0], y = ecl[1], z = ecl[2];
    comet.dAU = Math.sqrt(x*x+y*y+z*z) || 1e-6;
    const k = distScale(comet.dAU)/comet.dAU;
    comet.worldPos.set(x*k, z*k, -y*k);
    cometGroup.position.copy(comet.worldPos);
    const att = Math.pow(1/Math.max(comet.dAU,0.4), 0.32);
    cometMat.uniforms.uAtten.value = att;
    cometMat.uniforms.uTime.value = t;
    cometMat.uniforms.uSpin.value = simDays*0.7;
    setLocalLight(cometMesh, cometMat, comet.worldPos);
    comaMat.uniforms.uSunDirLocal.value.copy(cometMat.uniforms.uSunDirLocal.value);
    comaMat.uniforms.uCamLocal.value.copy(cometMat.uniforms.uCamLocal.value);
    // 彗尾强度：近日点附近最强
    const act = clamp((4.2 - comet.dAU) / 3.4, 0, 1);
    comaMat.uniforms.uIntensity.value = 0.35 + act*2.6;
    coma.scale.setScalar(1.6 + act*2.4);
    // 反日方向
    tmpV.copy(comet.worldPos).normalize();               // 由太阳指向彗星
    tmpV2.copy(comet.worldPos).normalize().cross(UPV);   // 侧向（用于尘埃尾弯曲）
    if (tmpV2.lengthSq() < 1e-6) tmpV2.set(1,0,0); else tmpV2.normalize();
    const L = (6 + 62*act);
    for (const [tail, isDust] of [[dustTail, true], [ionTail, false]]){
      const g = tail.geo, P = g.attributes.position.array, S = g.attributes.aSize.array, A = g.attributes.aAlpha.array;
      for (let i = 0; i < tail.n; i++){
        const s = (i / tail.n);
        const [r1, r2, r3] = tail.rnd[i];
        const len = L * s;
        const spread = tail.spread * (0.4 + 2.6*s) * (isDust ? 1.0 : 0.55);
        const curve = isDust ? tail.curveAmt * s * s * 7.0 : 0;
        P[i*3]   = comet.worldPos.x + tmpV.x*len + tmpV2.x*curve + r1*spread;
        P[i*3+1] = comet.worldPos.y + tmpV.y*len + r2*spread*0.7;
        P[i*3+2] = comet.worldPos.z + tmpV.z*len + tmpV2.z*curve + r3*spread;
        S[i] = (isDust ? 1.1 : 0.85) * (0.35 + 2.6*s) * (0.4 + act);
        A[i] = act * (1.0 - s) * (1.0 - s) * (isDust ? 0.55 : 0.42);
      }
      g.attributes.position.needsUpdate = true;
      g.attributes.aSize.needsUpdate = true;
      g.attributes.aAlpha.needsUpdate = true;
      tail.pts.visible = cfg.comet && act > 0.02;
    }
  }

  // 小行星带 & 柯伊伯带
  astMat.uniforms.uDays.value = simDays;
  astMat.uniforms.uClock.value = t;
}

/* 轨迹更新 */
function updateTrail(b){
  if (!b.trail) return;
  const pts = b.trailPts;
  const last = pts[pts.length-1];
  if (!last || last.distanceToSquared(b.worldPos) > Math.pow(Math.max(b.r*0.5, distScale(b.a||1)*0.0016), 2)){
    pts.push(b.worldPos.clone());
    if (pts.length > b.trailMax) pts.shift();
  } else if (pts.length){
    pts[pts.length-1].copy(b.worldPos);
  }
  const n = pts.length;
  const pos = b.trail.geometry.attributes.position.array;
  const al = b.trail.geometry.attributes.aAlpha.array;
  for (let i = 0; i < n; i++){
    pos[i*3] = pts[i].x; pos[i*3+1] = pts[i].y; pos[i*3+2] = pts[i].z;
    const t = i/Math.max(n-1,1);
    al[i] = Math.pow(t, 2.0) * 0.75;
  }
  b.trail.geometry.attributes.position.needsUpdate = true;
  b.trail.geometry.attributes.aAlpha.needsUpdate = true;
  b.trail.geometry.setDrawRange(0, n);
}

/* 标签更新 */
const projV = new THREE.Vector3();
function updateLabels(){
  if (!cfg.labels) return;
  const camDist = camera.position.length();
  for (const b of bodies){
    if (!b.label) continue;
    if (b.key === 'halley' && (!cfg.comet || comet.dAU > 12)) { b.label.style.opacity = '0'; continue; }
    projV.copy(b.worldPos).project(camera);
    const vis = projV.z > -1 && projV.z < 1;
    let op = 0;
    if (vis){
      const x = (projV.x*0.5+0.5)*innerWidth, y = (-projV.y*0.5+0.5)*innerHeight;
      b.label.style.transform = 'translate(-50%,-50%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
      const d = camera.position.distanceTo(b.worldPos);
      const ang = b.r / Math.max(d, 0.001);
      op = clamp((ang*140 - 0.06)*2.2, 0, 1) * 0.95 + (selected === b ? 0.05 : 0);
      if (selected === b) op = 1;
      if (b.isSun) op = Math.max(op, 0.9);
      b.label.style.opacity = op.toFixed(2);
    } else b.label.style.opacity = '0';
  }
  // 卫星标签：仅当母星被选中
  for (const p of planets){
    for (const m of p.moons){
      if (!m.label) continue;
      const show = (selected === p || selected === m) && cfg.moons;
      if (!show){ m.label.style.opacity = '0'; continue; }
      projV.copy(m.worldPos).project(camera);
      if (projV.z > -1 && projV.z < 1){
        const x = (projV.x*0.5+0.5)*innerWidth, y = (-projV.y*0.5+0.5)*innerHeight;
        m.label.style.transform = 'translate(-50%,-50%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
        m.label.style.opacity = '0.92';
      } else m.label.style.opacity = '0';
    }
  }
}

/* 相机 */
function updateCamera(dt){
  if (intro.active){
    intro.t += dt;
    const u = Math.min(intro.t/intro.dur, 1);
    const e = 1 - Math.pow(1-u, 3);
    camera.position.lerpVectors(intro.from, intro.to, e);
    controls.target.set(0,0,0);
    if (u >= 1) intro.active = false;
    return;
  }
  if (fly){
    fly.t += dt;
    const u = Math.min(fly.t/fly.dur, 1);
    const e = u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u+2, 3)/2;
    // 目标天体在飞行途中持续移动 —— 每帧取最新位置
    const tgt = fly.b ? fly.b.worldPos : fly.toT;
    const curT = tmpV.copy(fly.fromT).lerp(tgt, e);          // 当前视点中心
    const off0 = tmpV2.copy(fly.fromP).sub(fly.fromT);       // 起始相机偏移
    const off1 = tmpV3.copy(fly.toP).sub(fly.toT);           // 目标相机偏移
    off0.lerp(off1, e);
    controls.target.copy(curT);
    camera.position.copy(curT).add(off0);
    if (u >= 1) fly = null;
    return;
  }
  if (focus){
    const delta = tmpV.copy(focus.worldPos).sub(controls.target);
    controls.target.add(delta);
    camera.position.add(delta);
  }
  if (tour){
    tourT += dt;
    if (tourT > 7.5){
      tourT = 0;
      tourIdx = (tourIdx + 1) % planets.length;
      flyTo(planets[tourIdx]);
    }
  }
}

/* 自适应画质 */
function autoQuality(dt){
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 2.0){
    const fps = fpsN/fpsAcc;
    if (fps < 32 && renderer.getPixelRatio() > 1.0){
      renderer.setPixelRatio(1.0);
      composer.setPixelRatio(1.0);          // 必须同步，否则 composer 仍按旧比例分配缓冲
    }
    fpsAcc = 0; fpsN = 0;
  }
}

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t  = clock.elapsedTime;
  frame++;

  if (!paused && !intro.active) simDays += dt * speed * (reverse ? -1 : 1);

  updateBodies(dt, t);
  if (cfg.trails && !paused) for (const b of planets) updateTrail(b);
  updateCamera(dt);
  controls.update();
  updateLabels();

  starField.mat.uniforms.uTime.value = t;
  bgSphere.material.uniforms.uTime.value = t*0.02;
  finalPass.uniforms.uTime.value = t;

  if (frame % 6 === 0 && selected) updateLive(selected);
  if (frame % 6 === 0) {
    const d = new Date(J2000 + simDays*DAY);
    const hh = String(d.getUTCHours()).padStart(2,'0'), mm = String(d.getUTCMinutes()).padStart(2,'0');
    document.getElementById('date').innerHTML = isoDate(simDays);
    const spd = Math.abs(speed);
    document.getElementById('meta').innerHTML =
      '<b>' + hh + ':' + mm + ' UTC</b> · 模拟速率 <b>' +
      (spd < 0.9 ? fmt(spd*24,1)+' 小时/秒' : spd < 400 ? fmt(spd,1)+' 天/秒' : fmt(spd/365.256363,2)+' 年/秒') +
      (reverse ? ' 倒放' : '') + (paused ? ' 已暂停' : '') + '</b><br>' +
      '轨道：JPL 近似要素 + 开普勒方程求解<br>' +
      '距离与天体半径已做视觉压缩';
  }

  composer.render();
  autoQuality(dt);

  if (!window.__boot){
    window.__boot = true;
    setTimeout(() => document.getElementById('load').classList.add('off'), 260);
  }
}
loop();
</script>
</body>
</html>
