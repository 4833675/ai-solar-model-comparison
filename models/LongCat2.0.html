<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #controls {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    background: rgba(10,10,30,0.85); border: 1px solid rgba(100,140,255,0.3);
    border-radius: 12px; padding: 16px 20px; color: #c8d8ff;
    backdrop-filter: blur(8px); min-width: 220px;
  }
  #controls h2 { font-size: 14px; margin-bottom: 12px; color: #7ab8ff; letter-spacing: 1px; }
  #controls label { display: block; font-size: 12px; margin: 8px 0 4px; opacity: 0.8; }
  #controls input[type=range] { width: 100%; accent-color: #5090ff; }
  #controls button {
    margin-top: 10px; padding: 6px 14px; border: 1px solid rgba(100,140,255,0.4);
    background: rgba(60,100,200,0.2); color: #a0c0ff; border-radius: 6px;
    cursor: pointer; font-size: 12px; transition: all 0.2s;
  }
  #controls button:hover { background: rgba(60,100,200,0.5); }
  #info {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(150,180,255,0.6); font-size: 12px; z-index: 10;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="controls">
  <h2>SOLAR SYSTEM</h2>
  <label>Time Speed: <span id="speedVal">1.0</span>x</label>
  <input type="range" id="speed" min="0" max="20" step="0.1" value="1">
  <label>Zoom: <span id="zoomVal">1.0</span>x</label>
  <input type="range" id="zoom" min="0.2" max="3" step="0.05" value="1">
  <label>Orbit Lines</label>
  <input type="range" id="orbitOpacity" min="0" max="1" step="0.05" value="0.3">
  <button id="reset">Reset View</button>
  <button id="toggleLabels">Toggle Labels</button>
</div>
<div id="info">Scroll to zoom | Drag to pan | Double-click to focus planet</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// --- State ---
let timeScale = 1;
let zoom = 1;
let orbitOpacity = 0.3;
let showLabels = true;
let panX = 0, panY = 0;
let dragging = false, dragStartX, dragStartY;
let focusedPlanet = null;
let time = 0;

// --- Stars background ---
const stars = Array.from({length: 600}, () => ({
  x: Math.random() * 2000 - 1000,
  y: Math.random() * 2000 - 1000,
  r: Math.random() * 1.5 + 0.3,
  brightness: Math.random(),
  twinkleSpeed: Math.random() * 0.02 + 0.005
}));

// --- Planet data (scaled for visibility, not real proportions) ---
// orbital period ratios roughly accurate, sizes exaggerated
const planets = [
  { name: 'Mercury', color: '#b0b0b0', size: 4,  orbit: 60,  speed: 4.15, angle: Math.random()*Math.PI*2, rings: false },
  { name: 'Venus',   color: '#e8c070', size: 7,  orbit: 90,  speed: 1.62, angle: Math.random()*Math.PI*2, rings: false },
  { name: 'Earth',   color: '#4488ff', size: 7.5, orbit: 120, speed: 1.0,  angle: Math.random()*Math.PI*2, rings: false, moon: true },
  { name: 'Mars',    color: '#dd5533', size: 5,  orbit: 155, speed: 0.53, angle: Math.random()*Math.PI*2, rings: false },
  { name: 'Jupiter', color: '#d4a76a', size: 18, orbit: 220, speed: 0.084, angle: Math.random()*Math.PI*2, rings: false, bands: true },
  { name: 'Saturn',  color: '#e8d088', size: 15, orbit: 290, speed: 0.034, angle: Math.random()*Math.PI*2, rings: true,  bands: true },
  { name: 'Uranus',  color: '#72b5c4', size: 10, orbit: 350, speed: 0.012, angle: Math.random()*Math.PI*2, rings: false },
  { name: 'Neptune', color: '#3366cc', size: 10, orbit: 400, speed: 0.006, angle: Math.random()*Math.PI*2, rings: false }
];

// --- Asteroid belt ---
const asteroids = Array.from({length: 120}, () => {
  const r = 175 + Math.random() * 25;
  return { orbit: r, speed: 0.3 + Math.random() * 0.2, angle: Math.random() * Math.PI * 2, size: Math.random() * 1.5 + 0.5 };
});

// --- Comets ---
const comets = Array.from({length: 3}, () => ({
  angle: Math.random() * Math.PI * 2,
  dist: 100 + Math.random() * 300,
  speed: 0.2 + Math.random() * 0.3,
  tail: [],
  size: 2 + Math.random() * 2
}));

// --- Controls ---
document.getElementById('speed').addEventListener('input', e => {
  timeScale = parseFloat(e.target.value);
  document.getElementById('speedVal').textContent = timeScale.toFixed(1);
});
document.getElementById('zoom').addEventListener('input', e => {
  zoom = parseFloat(e.target.value);
  document.getElementById('zoomVal').textContent = zoom.toFixed(2);
});
document.getElementById('orbitOpacity').addEventListener('input', e => {
  orbitOpacity = parseFloat(e.target.value);
});
document.getElementById('reset').addEventListener('click', () => {
  panX = 0; panY = 0; zoom = 1; focusedPlanet = null;
  document.getElementById('zoom').value = 1;
  document.getElementById('zoomVal').textContent = '1.00';
});
document.getElementById('toggleLabels').addEventListener('click', () => {
  showLabels = !showLabels;
});

// --- Mouse / Touch ---
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.95 : 1.05;
  zoom = Math.max(0.2, Math.min(3, zoom));
  document.getElementById('zoom').value = zoom;
  document.getElementById('zoomVal').textContent = zoom.toFixed(2);
}, { passive: false });

canvas.addEventListener('mousedown', e => { dragging = true; dragStartX = e.clientX - panX; dragStartY = e.clientY - panY; });
canvas.addEventListener('mousemove', e => { if (dragging) { panX = e.clientX - dragStartX; panY = e.clientY - dragStartY; } });
canvas.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('dblclick', e => {
  const mx = (e.clientX - cx - panX) / zoom;
  const my = (e.clientY - cy - panY) / zoom;
  let closest = null, minD = 30;
  for (const p of planets) {
    const px = Math.cos(p.angle) * p.zoomOrbit();
    const py = Math.sin(p.angle) * p.zoomOrbit() * 0.4;
    const d = Math.hypot(mx - px, my - py);
    if (d < minD) { minD = d; closest = p; }
  }
  focusedPlanet = closest;
});

// --- Helpers ---
function zoomOrbit(orbit) { return orbit; }
// Attach to planet objects
planets.forEach(p => p.zoomOrbit = function() { return this.orbit; });

// --- Drawing ---
function drawStars(t) {
  for (const s of stars) {
    const alpha = 0.4 + 0.6 * Math.sin(t * s.twinkleSpeed + s.brightness * 10) * 0.5 + 0.5;
    ctx.beginPath();
    ctx.arc(cx + s.x * 0.3 + panX * 0.1, cy + s.y * 0.3 + panY * 0.1, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,220,255,${alpha * s.brightness})`;
    ctx.fill();
  }
}

function drawSun(t) {
  const sx = cx + panX, sy = cy + panY;
  // Outer glow layers
  for (let i = 5; i >= 0; i--) {
    const r = 25 + i * 18 + Math.sin(t * 0.5) * 3;
    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
    grad.addColorStop(0, `rgba(255,200,50,${0.05 + i * 0.01})`);
    grad.addColorStop(0.5, `rgba(255,150,20,${0.02 + i * 0.005})`);
    grad.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
  // Sun body
  const sunGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 25);
  sunGrad.addColorStop(0, '#fff8e0');
  sunGrad.addColorStop(0.3, '#ffdd44');
  sunGrad.addColorStop(0.7, '#ff9900');
  sunGrad.addColorStop(1, '#ff5500');
  ctx.beginPath();
  ctx.arc(sx, sy, 25, 0, Math.PI * 2);
  ctx.fillStyle = sunGrad;
  ctx.fill();
  // Corona rays
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(t * 0.1);
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    const rayLen = 35 + Math.sin(t * 2 + i) * 10;
    const grad = ctx.createLinearGradient(25, 0, rayLen, 0);
    grad.addColorStop(0, 'rgba(255,200,50,0.3)');
    grad.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.beginPath();
    ctx.moveTo(25, -2);
    ctx.lineTo(rayLen, 0);
    ctx.lineTo(25, 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
  ctx.restore();
}

function drawOrbit(orbit) {
  ctx.beginPath();
  ctx.ellipse(cx + panX, cy + panY, orbit * zoom, orbit * zoom * 0.4, 0, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(100,140,255,${orbitOpacity * 0.3})`;
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

function drawAsteroidBelt() {
  for (const a of asteroids) {
    const x = cx + panX + Math.cos(a.angle) * a.orbit * zoom;
    const y = cy + panY + Math.sin(a.angle) * a.orbit * zoom * 0.4;
    ctx.beginPath();
    ctx.arc(x, y, a.size, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(160,140,120,0.6)';
    ctx.fill();
  }
}

function drawPlanet(p, t) {
  const x = cx + panX + Math.cos(p.angle) * p.orbit * zoom;
  const y = cy + panY + Math.sin(p.angle) * p.orbit * zoom * 0.4;
  const s = p.size * Math.max(0.5, zoom * 0.7);

  // Planet glow
  const glow = ctx.createRadialGradient(x, y, s * 0.5, x, y, s * 3);
  glow.addColorStop(0, p.color + '30');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(x, y, s * 3, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();

  // Planet body
  const bodyGrad = ctx.createRadialGradient(x - s * 0.3, y - s * 0.3, 0, x, y, s);
  bodyGrad.addColorStop(0, lightenColor(p.color, 40));
  bodyGrad.addColorStop(0.6, p.color);
  bodyGrad.addColorStop(1, darkenColor(p.color, 50));
  ctx.beginPath();
  ctx.arc(x, y, s, 0, Math.PI * 2);
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  // Bands for gas giants
  if (p.bands) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI * 2);
    ctx.clip();
    for (let i = 0; i < 4; i++) {
      const by = y - s + (i + 0.5) * (2 * s / 4);
      ctx.fillStyle = `rgba(0,0,0,${0.05 + i * 0.02})`;
      ctx.fillRect(x - s, by - s * 0.08, s * 2, s * 0.16);
    }
    ctx.restore();
  }

  // Saturn rings
  if (p.rings) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1, 0.3);
    for (let r = s * 1.4; r < s * 2.5; r += 2) {
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(210,190,150,${0.4 - (r - s * 1.4) / (s * 1.1) * 0.3})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Earth's moon
  if (p.moon) {
    const moonAngle = t * 3;
    const moonDist = s * 2.2;
    const mx = x + Math.cos(moonAngle) * moonDist;
    const my = y + Math.sin(moonAngle) * moonDist * 0.4;
    ctx.beginPath();
    ctx.arc(mx, my, s * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = '#ccc';
    ctx.fill();
  }

  // Label
  if (showLabels) {
    ctx.font = '11px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(180,200,255,0.8)';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, x, y + s + 14);
  }

  return { x, y };
}

function drawComets(t) {
  for (const c of comets) {
    c.angle += c.speed * 0.01 * timeScale;
    c.dist = 80 + Math.sin(c.angle * 0.5) * 150 + 100;
    const x = cx + panX + Math.cos(c.angle) * c.dist * zoom;
    const y = cy + panY + Math.sin(c.angle) * c.dist * zoom * 0.4;

    // Tail
    const tailAngle = c.angle + Math.PI;
    const tailLen = 30 + Math.sin(t) * 10;
    const grad = ctx.createLinearGradient(x, y, x + Math.cos(tailAngle) * tailLen, y + Math.sin(tailAngle) * tailLen * 0.4);
    grad.addColorStop(0, 'rgba(150,220,255,0.8)');
    grad.addColorStop(1, 'rgba(100,180,255,0)');
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(tailAngle - 0.1) * tailLen, y + Math.sin(tailAngle - 0.1) * tailLen * 0.4);
    ctx.lineTo(x + Math.cos(tailAngle + 0.1) * tailLen, y + Math.sin(tailAngle + 0.1) * tailLen * 0.4);
    ctx.fillStyle = grad;
    ctx.fill();

    // Head
    ctx.beginPath();
    ctx.arc(x, y, c.size, 0, Math.PI * 2);
    ctx.fillStyle = '#aaddff';
    ctx.fill();
  }
}

// --- Color utilities ---
function lightenColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
  return `rgb(${r},${g},${b})`;
}
function darkenColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, r - amt); g = Math.max(0, g - amt); b = Math.max(0, b - amt);
  return `rgb(${r},${g},${b})`;
}

// --- Main loop ---
let lastTime = 0;
function animate(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  time += dt * timeScale;

  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);

  // Stars
  drawStars(time);

  // Orbits
  ctx.save();
  for (const p of planets) {
    drawOrbit(p.orbit * zoom);
  }
  ctx.restore();

  // Asteroid belt
  drawAsteroidBelt();

  // Comets
  drawComets(time);

  // Sun
  drawSun(time);

  // Update & draw planets
  for (const p of planets) {
    p.angle += p.speed * 0.02 * timeScale;
    drawPlanet(p, time);
  }

  // Focus indicator
  if (focusedPlanet) {
    const fx = cx + panX + Math.cos(focusedPlanet.angle) * focusedPlanet.orbit * zoom;
    const fy = cy + panY + Math.sin(focusedPlanet.angle) * focusedPlanet.orbit * zoom * 0.4;
    ctx.beginPath();
    ctx.arc(fx, fy, focusedPlanet.size * Math.max(0.5, zoom * 0.7) + 8, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(100,180,255,0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
