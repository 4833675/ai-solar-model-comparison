updateSim=function(dt){compress+=(compressGoal-compress)*(1-Math.exp(-dt*2.6));if(playing)simJD+=dt*speedDaysPerSecond();const deltaDays=playing?dt*speedDaysPerSecond():0;for(const b of ALLBODIES){if(b.id==="sun"||b.rotH==null)continue;spinPhases.set(b.id,(spinPhases.get(b.id)||0)+clamp(TAU*deltaDays/(b.rotH/24),-.22,.22))}planetState.clear();for(const b of [...PLANETS,PLUTO])planetState.set(b.id,positionAt(b,simJD,compress));moonState.clear();for(const m of MOONS){const parent=bodyById.get(m.parent),pc=planetState.get(m.parent)||[0,0,0],pr=displayRadius(parent),smallest=MOONS.filter(x=>x.parent===m.parent).reduce((v,x)=>Math.min(v,x.a),Infinity),smallestMoon=MOONS.find(x=>x.parent===m.parent&&x.a===smallest),ringOuter=parent.ring===0?2.34:(parent.ring===1?2.0:(parent.ring===2?1.81:0)),base=Math.max(2.35,ringOuter+(smallestMoon?displayRadius(smallestMoon)/pr:0)+.55),dist=pr*base*Math.pow(m.a/smallest,.55),theta=TAU*(simJD-J2000)/m.period+(m.phase||0);let pos;if(m.plane==="ecliptic"){const pe=[Math.cos(theta)*dist,Math.sin(theta)*dist*Math.cos(m.inc*DEG),Math.sin(theta)*dist*Math.sin(m.inc*DEG)];pos=add(pc,eclWorld(pe))}else{const basis=basisForAxis(axisWorld(parent)),local=[Math.cos(theta)*dist,-Math.sin(theta)*dist*Math.sin(m.inc*DEG),Math.sin(theta)*dist*Math.cos(m.inc*DEG)];pos=add(pc,add(add(muls(basis.x,local[0]),muls(basis.y,local[1])),muls(basis.z,local[2])))}moonState.set(m.id,pos)}if(camera.follow){const followPos=camera.follow==="halley"?halleyWorld(simJD).world:(planetState.get(camera.follow)||moonState.get(camera.follow));if(followPos)camera.goalTarget=followPos.slice()}camera.target=add(camera.target,muls(sub(camera.goalTarget,camera.target),1-Math.exp(-dt*4.6)));camera.distance=mix(camera.distance,camera.goalDistance,1-Math.exp(-dt*3.8))};
updateLiveInfo=function(){const b=bodyById.get(selectedId)||PLANETS[2],raw=selectedRawPosition(b),rAU=Math.hypot(...raw),[lon,lat]=eclLonLat(raw),earthRaw=selectedRawPosition(PLANETS[2]),earthDist=b.id==="sun"?1:Math.hypot(raw[0]-earthRaw[0],raw[1]-earthRaw[1],raw[2]-earthRaw[2]);let a=b.a||0,e=b.e||0;if(b.parent){const parent=bodyById.get(b.parent),q=rootAt(parent,(simJD-J2000)/36525);a=q.a;e=q.e}const v=b.id==="sun"?0:(29.7847*Math.sqrt(Math.max(0,2/Math.max(rAU,.0001)-1/Math.max(a,.0001)))),peri=a*(1-e),aphe=a*(1+e),lightMin=earthDist*8.316746;const light=b.id==="sun"?"8.32 分":lightMin<1?fmt(lightMin*60,1)+" 秒":fmt(lightMin,2)+" 分";const data=b.id==="sun"?[["日心距离","0.000 AU"],["黄经 / 黄纬","—"],["地球距离","1.000 AU"],["光行时",light],["近日 / 远日点","—"],["轨道速度","—"]]:[["日心距离",fmtDistance(rAU)],["黄经 / 黄纬",fmt(lon,2)+"° / "+fmt(lat,2)+"°"],["地球距离",fmtDistance(earthDist)],["光行时",light],["近日 / 远日点",fmt(peri,3)+" / "+fmt(aphe,3)+" AU"],["轨道速度",fmt(v,2)+" km/s"]];$("liveGrid").textContent="";for(const [label,value] of data){const cell=document.createElement("div"),s=document.createElement("span"),vEl=document.createElement("b");cell.className="live-cell";s.textContent=label;vEl.textContent=value;cell.append(s,vEl);$("liveGrid").append(cell)}const year=new Date((simJD-2440587.5)*DAY).getUTCFullYear();$("validity").hidden=year>=1800&&year<=2050;if(document.activeElement!==$("dateInput")){const wanted=normDateInput((simJD-2440587.5)*DAY);if($("dateInput").value!==wanted)$("dateInput").value=wanted}};
const baseUpdateLabels=updateLabels;updateLabels=function(){baseUpdateLabels();if(!showMoons)pickPoints=pickPoints.filter(q=>!bodyById.get(q.id)?.parent);const el=labels.get("halley");if(el&&!showComet)el.hidden=true};
const baseDrawCorona=drawCorona;drawCorona=function(vp){if(!showGlow)return;const p=programs.corona;gl.useProgram(p);setMat(gl,loc(p,"uVP"),vp);vec3Uniform(gl,loc(p,"uCenter"),muls(norm(cameraEye),4.3));vec3Uniform(gl,loc(p,"uRight"),cameraRight);vec3Uniform(gl,loc(p,"uUp"),cameraUp);set1(gl,loc(p,"uSize"),4.6*9);set1(gl,loc(p,"uTime"),(simJD-J2000)/10);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);gl.bindVertexArray(coronaQuad.vao);gl.drawArrays(gl.TRIANGLE_STRIP,0,coronaQuad.count);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(true)};
