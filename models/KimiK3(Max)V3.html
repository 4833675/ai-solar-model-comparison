// ============================================================

const DEG = Math.PI / 180;
const AU  = 20;              // 1 天文单位 = 20 场景单位
const SUN_R = 6.5;
const J2000 = Date.UTC(2000, 0, 1, 12);

// a:半长轴(AU) e:偏心率 i:倾角(°) L:平黄经 p:近日点黄经 O:升交点黄经
// period:公转周期(天) rot:自转周期(天,取绝对值,逆行由>90°倾角体现) tilt:自转轴倾角
const PLANETS = [

  { name:'地球', en:'Earth',   a:1.00000, e:0.01671, i:0.00002, L:100.46457, p:102.93768, O:0.0,       period:365.256,  rot:0.9973,  tilt:23.44,  r:1.0,  color:0x6aa4ff, tex:'earth',  atmo:[0x5599ff,3.4,1.35],

  { name:'火星', en:'Mars',    a:1.52371, e:0.09339, i:1.84969, L:-4.55343,  p:-23.94363, O:49.55954,  period:686.9796, rot:1.0260,  tilt:25.19,  r:0.65, color:0xd56b43, tex:'mars',   atmo:[0xd88a55,4.0,0.45],
    realR:'3,390 km', periodStr:'687 天',   rotStr:'24.6 小时',    moons:2,   desc:'红色的荒漠世界，拥有太阳系最高的火山——奥林帕斯山。' },
  { name:'木星', en:'Jupiter', a:5.20289, e:0.04839, i:1.30440, L:34.39644,  p:14.72848,  O:100.47391, period:4332.589, rot:0.41354, tilt:3.13,   r:4.4,  color:0xdcbf9d, tex:'jupiter',atmo:[0xdcc6a2,4.0,0.55], gas:true,
    realR:'69,911 km',periodStr:'11.86 年', rotStr:'9.9 小时',     moons:95,  desc:'太阳系最大的行星，大红斑是一场持续了数百年的巨型风暴。' },

    realR:'58,232 km',periodStr:'29.45 年', rotStr:'10.7 小时',    moons:146, desc:'以壮观的冰质光环闻名，环的宽度可排下十多个地球。' },
  { name:'天王星', en:'Uranus', a:19.18916,e:0.04726, i:0.77264, L:313.23810, p:170.95428, O:74.01693,  period:30688.5,  rot:0.71833, tilt:97.77,  r:1.9,  color:0xa5dde2, tex:'uranus', atmo:[0x9fd6db,3.6,0.8], gas:true, urings:true,
    realR:'25,362 km',periodStr:'84.02 年', rotStr:'17.2 小时（逆向）', moons:28, desc:'自转轴几乎躺在轨道平面上，像一颗侧着滚动的行星。' },
  { name:'海王星', en:'Neptune',a:30.06992,e:0.00859, i:1.77004, L:-55.12003, p:44.96476,  O:131.78423, period:60182,    rot:0.67125, tilt:28.32,  r:1.85, color:0x4a6fe0, tex:'neptune',atmo:[0x5577ee,3.4,1.0], gas:true,
    realR:'24,622 km',periodStr:'164.8 年', rotStr:'16.1 小时',    moons:16,  desc:'太阳系最遥远的行星，风速可达 2,100 km/h。' },
  { name:'冥王星', en:'Pluto',  a:39.48212,e:0.24883, i:17.14001,L:238.92904, p:224.06892, O:110.30394, period:90560,    rot:6.3872,  tilt:122.53, r:0.32, color:0xc9ab84, tex:'pluto',
    realR:'1,188 km', periodStr:'248 年',   rotStr:'6.4 天（逆向）', moons:5,   desc:'曾经的第九大行星，2006 年被重新归类为矮行星。', dwarf:true },
];

// 哈雷彗星（逆行轨道，周期约 75.3 年）
const HALLEY = { name:'哈雷彗星', en:'Halley', a:17.8341, e:0.96714, i:162.26269, L:236.55, p:169.75257, O:58.42008, period:27511.6, r:0.15, color:0x9fdcff,
  desc:'最著名的短周期彗星，每约 76 年回归一次，下次近日点在 2061 年。' };

const SUN_INFO = { name:'太阳', en:'Sun', color:0xffd27a, desc:'太阳系的中心恒星，占整个太阳系总质量的 99.86%。', realR:'696,000 km', periodStr:'—', rotStr:'约 27 天', moons:'—', a:0, e:0 };

// ============================================================
// 程序化噪声 & 行星纹理绘制（Canvas 2D 逐像素生成）
// ============================================================
function mulberry(seed){ let s = seed >>> 0; return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function lerp(a,b,t){ return a + (b - a) * t; }
function clamp(x,a,b){ return x < a ? a : x > b ? b : x; }
function smoothstep(a,b,x){ const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

function makeNoise(seed){
  const rng = mulberry(seed);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--){ const j = (rng() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  function g(h,x,y){ switch(h & 3){ case 0: return x + y; case 1: return -x + y; case 2: return x - y; default: return -x - y; } }
  function noise(x,y){
    const X = Math.floor(x), Y = Math.floor(y);
    const xi = X & 255, yi = Y & 255;
    const xf = x - X, yf = y - Y;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const aa = perm[xi + perm[yi]], ba = perm[xi + 1 + perm[yi]];
    const ab = perm[xi + perm[yi + 1]], bb = perm[xi + 1 + perm[yi + 1]];
    return lerp(lerp(g(aa,xf,yf), g(ba,xf-1,yf), u), lerp(g(ab,xf,yf-1), g(bb,xf-1,yf-1), u), v) * 0.5 + 0.5;
  }
  function fbm(x,y,oct=4,lac=2.0,gain=0.5){
    let a = 0.5, f = 1, sum = 0, norm = 0;
    for (let i = 0; i < oct; i++){ sum += a * noise(x*f, y*f); norm += a; a *= gain; f *= lac; }
    return sum / norm;
  }
  return { noise, fbm };
}

function paintTexture(w,h,fn){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w,h);
  const d = img.data;
  const out = [0,0,0,255];
  for (let y = 0; y < h; y++){
    const v = (y + 0.5) / h;
    for (let x = 0; x < w; x++){
      fn((x + 0.5) / w, v, out);
      const k = (y * w + x) * 4;
      d[k] = out[0]; d[k+1] = out[1]; d[k+2] = out[2]; d[k+3] = out[3];
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}
function setMix(out,a,b,t){ out[0] = a[0]+(b[0]-a[0])*t; out[1] = a[1]+(b[1]-a[1])*t; out[2] = a[2]+(b[2]-a[2])*t; }

// 各行星表面绘制器：u∈[0,1) 沿经度（用 cos/sin 采样保证横向无缝），v∈[0,1] 从北极到南极
const TEX = {
  mercury(w,h){
    const N = makeNoise(101);
    return paintTexture(w,h,(u,v,out)=>{
      const cx = Math.cos(u*TAU), cy = Math.sin(u*TAU);
      const n = N.fbm(cx*2.5+7,  cy*2.5+v*5, 5);
      const c = N.fbm(cx*10+40,  cy*10+v*20+40, 4);
      let b = 105 + n * 75;
      if (c > 0.74) b *= 0.68; else if (c > 0.67) b *= 0.87;
      out[0] = b*1.04; out[1] = b*0.98; out[2] = b*0.92;
    });
  },
  moon(w,h){
    const N = makeNoise(303);
    return paintTexture(w,h,(u,v,out)=>{
      const cx = Math.cos(u*TAU), cy = Math.sin(u*TAU);
      const n = N.fbm(cx*2.2+3,  cy*2.2+v*4.4, 5);
      const m = N.fbm(cx*1.2+21, cy*1.2+v*2.4+21, 3);
      const c = N.fbm(cx*11+9,   cy*11+v*22+9, 4);
      let b = 118 + n * 70;
      if (m > 0.60) b *= 0.62;                       // 月海
      if (c > 0.75) b *= 0.7; else if (c > 0.68) b *= 0.88;
      out[0] = b; out[1] = b; out[2] = b*1.02;
    });
  },
  venus(w,h){
    const N = makeNoise(202);
    const c1=[231,207,160], c2=[212,182,133], c3=[246,232,196];
    return paintTexture(w,h,(u,v,out)=>{
      const cx = Math.cos(u*TAU), cy = Math.sin(u*TAU);
      const wn = N.fbm(cx*1.8+3, cy*1.8+v*3.6, 4);
      const n  = N.fbm(cx*3+wn*1.6+11, cy*3+v*6+wn*1.6, 5);
      setMix(out, c1, c2, smoothstep(0.32, 0.68, n));
      const hi = smoothstep(0.56, 0.85, N.fbm(cx*6+21, cy*6+v*12, 4));
      setMix(out, [out[0],out[1],out[2]], c3, hi * 0.55);
    });
  },
  mars(w,h){
    const N = makeNoise(404);
    return paintTexture(w,h,(u,v,out)=>{
      const cx = Math.cos(u*TAU), cy = Math.sin(u*TAU);
      const lat = Math.abs(v - 0.5) * 180;
      const n = N.fbm(cx*2+5,  cy*2+v*4, 5);
      const m = N.fbm(cx*4+17, cy*4+v*8, 4);
      setMix(out, [148,68,44], [208,122,80], n);
      const dark = smoothstep(0.60, 0.75, m);
      setMix(out, [out[0],out[1],out[2]], [108,48,33], dark * 0.8);
      const ice = smoothstep(76, 84, lat + (n - 0.5) * 8);
      setMix(out, [out[0],out[1],out[2]], [238,236,232], ice);
    });
  },
  jupiter(w,h){
    const N = makeNoise(505);
    return paintTexture(w,h,(u,v,out)=>{
      const cx = Math.cos(u*TAU), cy = Math.sin(u*TAU);
      const turb = N.fbm(cx*2.5, cy*2.5+v*5, 4) - 0.5;
      const band = Math.sin((v*11 + turb*1.7) * Math.PI);
      setMix(out, [163,122,82], [233,221,193], band*0.5+0.5);
      const streak = N.fbm(cx*5+13, cy*5+v*38+13, 4);
      out[0] += (streak-0.5)*46; out[1] += (streak-0.5)*40; out[2] += (streak-0.5)*30;
      const pol = smoothstep(0.10, 0.02, Math.min(v, 1-v));
      setMix(out, [out[0],out[1],out[2]], [128,110,92], pol*0.55);
      // 大红斑
      const du = u - 0.68, dv = (v - 0.615) * 2.4;
      const d = Math.sqrt(du*du + dv*dv);
      if (d < 0.10){
        setMix(out, [out[0],out[1],out[2]], [222,200,170], smoothstep(0.10, 0.065, d) * 0.8);
        setMix(out, [out[0],out[1],out[2]], [198,80,48],  smoothstep(0.058, 0.028, d));
      }
    });
  },
  saturn(w,h){
    const N = makeNoise(606);
    return paintTexture(w,h,(u,v,out)=>{
      const cx = Math.cos(u*TAU), cy = Math.sin(u*TAU);
      const turb = N.fbm(cx*2, cy*2+v*4, 4) - 0.5;
      const band = Math.sin((v*8 + turb*1.1) * Math.PI);
      setMix(out, [207,186,146], [238,228,198], band*0.5+0.5);
      const fine = N.fbm(cx*4+31, cy*4+v*26+31, 3);
      out[0] += (fine-0.5)*20; out[1] += (fine-0.5)*18; out[2] += (fine-0.5)*14;
      const pol = smoothstep(0.09, 0.02, Math.min(v, 1-v));
      setMix(out, [out[0],out[1],out[2]], [176,154,112], pol*0.6);
    });
  },
  uranus(w,h){
    const N = makeNoise(707);
    return paintTexture(w,h,(u,v,out)=>{
      const cx = Math.cos(u*TAU), cy = Math.sin(u*TAU);
      const n = N.fbm(cx*2.5, cy*2.5+v*5, 4);
      const band = Math.sin((v*4 + (n-0.5)*0.5) * Math.PI);
      const b = 0.94 + band*0.035 + (n-0.5)*0.07;
      out[0] = 150*b; out[1] = 213*b; out[2] = 219*b;
      const pol = smoothstep(0.12, 0.02, Math.min(v, 1-v));
      out[0] *= 1-pol*0.12; out[1] *= 1-pol*0.06; out[2] *= 1-pol*0.04;
    });
  },
  neptune(w,h){
    const N = makeNoise(808);
    return paintTexture(w,h,(u,v,out)=>{
      const cx = Math.cos(u*TAU), cy = Math.sin(u*TAU);
      const turb = N.fbm(cx*2.2, cy*2.2+v*4.4, 4) - 0.5;
      const band = Math.sin((v*6.5 + turb*1.2) * Math.PI);
      setMix(out, [40,68,168], [86,128,214], band*0.5+0.5);
      const s = N.fbm(cx*6+3, cy*6+v*22+3, 4);
      const streak = smoothstep(0.70, 0.82, s);
      out[0] += streak*70; out[1] += streak*75; out[2] += streak*70;
      // 大暗斑
      const du = u - 0.32, dv = (v - 0.55) * 2.6;
      const d = Math.sqrt(du*du + dv*dv);
      if (d < 0.07) setMix(out, [out[0],out[1],out[2]], [24,38,96], smoothstep(0.07, 0.03, d));
      const pol = smoothstep(0.10, 0.02, Math.min(v, 1-v));
      setMix(out, [out[0],out[1],out[2]], [52,80,160], pol*0.4);
    });
  },
  pluto(w,h){
    const N = makeNoise(909);
    return paintTexture(w,h,(u,v,out)=>{
      const cx = Math.cos(u*TAU), cy = Math.sin(u*TAU);
      const n = N.fbm(cx*2.4+13, cy*2.4+v*4.8, 5);
      setMix(out, [138,102,74], [196,168,132], n);
      const dark = smoothstep(0.62, 0.72, N.fbm(cx*3.5+29, cy*3.5+v*7+29, 4));
      setMix(out, [out[0],out[1],out[2]], [92,64,46], dark*0.7);
      const light = smoothstep(0.12, 0.02, Math.min(v, 1-v));
      setMix(out, [out[0],out[1],out[2]], [216,198,172], light*0.5);
    });
  },
  comet(w,h){
    const N = makeNoise(111);
    return paintTexture(w,h,(u,v,out)=>{
      const cx = Math.cos(u*TAU), cy = Math.sin(u*TAU);
      const n = N.fbm(cx*3, cy*3+v*6, 4);
      const b = 120 + n*60;
      out[0] = b*0.95; out[1] = b*0.95; out[2] = b;
    });
  },
};

// 地球一次过生成三张图：彩色地图 / 云层(带alpha) / 粗糙度(海洋低粗糙)
function earthTextures(){
  const N = makeNoise(42), NC = makeNoise(88);
  const W = 1024, H = 512;
  const cvMap = document.createElement('canvas'); cvMap.width = W; cvMap.height = H;
  const cvCld = document.createElement('canvas'); cvCld.width = 512; cvCld.height = 256;
  const cvRgh = document.createElement('canvas'); cvRgh.width = 512; cvRgh.height = 256;
  const cxMap = cvMap.getContext('2d'), cxCld = cvCld.getContext('2d'), cxRgh = cvRgh.getContext('2d');
  const imgM = cxMap.createImageData(W,H), imgC = cxCld.createImageData(512,256), imgR = cxRgh.createImageData(512,256);
  for (let y = 0; y < H; y++){
    const v = (y + 0.5) / H;
    const lat = Math.abs(v - 0.5) * 180;
    for (let x = 0; x < W; x++){
      const u = (x + 0.5) / W;
      const cx = Math.cos(u*TAU), cy = Math.sin(u*TAU);
      const warp = N.fbm(cx*2+50, cy*2+v*4+50, 4);
      const hh = N.fbm(cx*1.6+warp*1.3, cy*1.6+v*2.8+warp*1.3, 6);
      const land = hh > 0.54;
      let r,g,b;
      if (land){
        const t = smoothstep(0.54, 0.74, hh);
        r = lerp(62, 168, t); g = lerp(118, 148, t); b = lerp(58, 94, t);
        const mtn = smoothstep(0.72, 0.85, hh);
        r = lerp(r, 128, mtn); g = lerp(g, 116, mtn); b = lerp(b, 104, mtn);
        const dry = smoothstep(0.6, 0.75, N.fbm(cx*3+77, cy*3+v*6+77, 3));
        r = lerp(r, 190, dry*0.45); g = lerp(g, 165, dry*0.45); b = lerp(b, 110, dry*0.45);
      } else {
        const t = smoothstep(0.34, 0.54, hh);
        r = lerp(7, 22, t); g = lerp(30, 78, t); b = lerp(84, 142, t);
      }
      const ice = smoothstep(64, 72, lat + (hh - 0.5) * 14);
      r = lerp(r, 236, ice); g = lerp(g, 240, ice); b = lerp(b, 244, ice);
      const k = (y*W + x) * 4;
      imgM.data[k] = r; imgM.data[k+1] = g; imgM.data[k+2] = b; imgM.data[k+3] = 255;
      if (x < 512 && y < 256){
        const k2 = (y*512 + x) * 4;
        imgR.data[k2] = imgR.data[k2+1] = imgR.data[k2+2] = land ? 225 : 62;
        imgR.data[k2+3] = 255;
        const cn = NC.fbm(cx*2.2+9, cy*2.2+v*4.4, 5);
        const cm = NC.fbm(cx*5+31, cy*5+v*9, 4);
        const ca = smoothstep(0.55, 0.74, cn*0.72 + cm*0.28) * 235;
        imgC.data[k2] = 255; imgC.data[k2+1] = 255; imgC.data[k2+2] = 255; imgC.data[k2+3] = ca;
      }
    }
  }
  cxMap.putImageData(imgM, 0, 0);
  cxCld.putImageData(imgC, 0, 0);
  cxRgh.putImageData(imgR, 0, 0);
  return { map: cvMap, clouds: cvCld, rough: cvRgh };
}

// 土星环（径向条纹 + 卡西尼缝 + 恩克缝）
function saturnRingCanvas(){
  const W = 1024, H = 4;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W,H);
  const N = makeNoise(77);
  for (let x = 0; x < W; x++){
    const f = (x + 0.5) / W;
    let a;
    if (f < 0.015 || f > 0.995) a = 0;
    else if (f < 0.28)  a = 0.30 * (0.55 + 0.45 * N.noise(f*70, 3));    // C 环
    else if (f < 0.585) a = 0.96 * (0.72 + 0.28 * N.noise(f*95, 7));    // B 环
    else if (f < 0.66)  a = 0.05;                                        // 卡西尼缝
    else if (f < 0.885) a = 0.62 * (0.68 + 0.32 * N.noise(f*115, 11));  // A 环
    else if (f < 0.905) a = 0.07;                                        // 恩克缝
    else                a = 0.40 * (0.7 + 0.3 * N.noise(f*130, 13));
    const bb = 0.86 + 0.28 * (N.noise(f*46, 5) - 0.5);
    for (let y = 0; y < H; y++){
      const k = (y*W + x) * 4;
      img.data[k] = 232*bb; img.data[k+1] = 219*bb; img.data[k+2] = 191*bb; img.data[k+3] = a*255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

function gauss(){ return (Math.random() + Math.random() + Math.random()) / 1.5 - 1; }

function makeStars(count, size, colorFn, band){
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const c = new THREE.Color();
  // 银河带平面的法线（倾斜约 60°）
  const nrm = new THREE.Vector3(0.32, 1, 0.45).normalize();
  const b1 = new THREE.Vector3().crossVectors(nrm, new THREE.Vector3(1,0,0)).normalize();
  const b2 = new THREE.Vector3().crossVectors(nrm, b1).normalize();
  for (let i = 0; i < count; i++){
    let v;
    if (band){
      const th = Math.random() * TAU;
      v = new THREE.Vector3()
        .addScaledVector(b1, Math.cos(th))
        .addScaledVector(b2, Math.sin(th))
        .addScaledVector(nrm, gauss() * 0.10)
        .normalize();
    } else {
      v = new THREE.Vector3(gauss(), gauss(), gauss());
      if (v.lengthSq() < 0.04) v.set(0, 1, 0); else v.normalize();
    }
    const r = band ? 7200 + gauss() * 1400 : 4600 + Math.random() * 4200;
    pos[i*3]   = v.x * r;
    pos[i*3+1] = v.y * r;
    pos[i*3+2] = v.z * r;
    c.set(colorFn());
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size, sizeAttenuation:false, vertexColors:true, transparent:true,
    opacity: band ? 0.5 : 0.9, blending:THREE.AdditiveBlending, depthWrite:false,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);
  return pts;
}

function buildSky(){
  const starColors = ['#ffffff','#ffffff','#cfe0ff','#ffe9c8','#ffc9c9','#c9fff2'];
  makeStars(2600, 1.6, ()=> starColors[(Math.random()*starColors.length)|0], false);
  makeStars(220,  3.2, ()=> starColors[(Math.random()*starColors.length)|0], false);

  // 淡淡星云
  const nebCols = ['#1a2a5a','#3a1a4a','#0d3a3a','#2a1a3a','#122a4a'];

    g.addColorStop(0, nebCols[i] + 'aa');
    g.addColorStop(1, 'rgba(0,0,0,0)');

    scene.add(sp);
  }
}

// 太阳：动画颗粒感着色器 + 多层日冕辉光
// ============================================================
const SUN_VERT = `
varying vec3 vObj;
varying vec3 vN;
varying vec3 vW;
void main(){
  vObj = position;
  vN = normalize(mat3(modelMatrix) * normal);
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vW = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const SUN_FRAG = `
uniform float uTime;
varying vec3 vObj;
varying vec3 vN;
varying vec3 vW;
float hash(vec3 p){
  p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float noise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)), f.x),
                 mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                 mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){ v += a * noise(p); p *= 2.03; a *= 0.5; }
  return v;
}
void main(){
  vec3 p = normalize(vObj);
  float t = uTime * 0.05;
  float n1 = fbm(p * 3.0 + vec3(t, -t*0.7, t*0.4));
  float n2 = fbm(p * 7.5 - vec3(t*1.2, t*0.5, 0.0));
  float gran = fbm(p * 22.0 + vec3(0.0, t*1.8, 0.0));
  vec3 deep = vec3(0.82, 0.24, 0.02);
  vec3 mid  = vec3(1.04, 0.55, 0.08);
  vec3 hot  = vec3(1.18, 0.98, 0.58);
  vec3 col = mix(deep, mid, smoothstep(0.28, 0.72, n1));
  col = mix(col, hot, smoothstep(0.55, 0.9, n2) * 0.75);
  col += (gran - 0.5) * 0.20;
  vec3 V = normalize(cameraPosition - vW);
  float limb = clamp(dot(normalize(vN), V), 0.0, 1.0);
  col *= 0.55 + 0.65 * pow(limb, 0.55);   // 边缘昏暗
  col *= 1.9;                              // 推入泛光区
  gl_FragColor = vec4(col, 1.0);
}`;

function makeGlowSprite(size, stops, opacity){

}

const ATMO_VERT = `
varying vec3 vN;
varying vec3 vW;
void main(){
  vN = normalize(mat3(modelMatrix) * normal);
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vW = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const ATMO_FRAG = `
uniform vec3 uColor;
uniform float uPow;
uniform float uInt;
varying vec3 vN;
varying vec3 vW;
void main(){
  vec3 V = normalize(cameraPosition - vW);
  float rim = pow(1.0 - abs(dot(normalize(vN), V)), uPow);
  gl_FragColor = vec4(uColor * rim * uInt, rim * 0.9);
}`;

function makeAtmosphere(r, colorHex, pow_, int_){
  const mat = new THREE.ShaderMaterial({
    uniforms:{ uColor:{ value:new THREE.Color(colorHex) }, uPow:{ value:pow_ }, uInt:{ value:int_ } },
    vertexShader: ATMO_VERT, fragmentShader: ATMO_FRAG,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent:true, depthWrite:false,
  });
  return new THREE.Mesh(new THREE.SphereGeometry(r * 1.14, 48, 36), mat);
}

// ============================================================
// 轨道计算（开普勒方程）
// ============================================================
function solveKepler(M, e){
  M = ((M % TAU) + TAU) % TAU;
  let E = e < 0.8 ? M : Math.PI;
  for (let i = 0; i < 16; i++){
    E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  }
  return E;
}

// 由轨道根数与平近点角 M(弧度) 求日心坐标（场景单位，黄道面为 XZ）
function elementsToPos(el, M, out){
  const E = solveKepler(M, el.e);
  const x = el.a * (Math.cos(E) - el.e);
  const y = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
  const w = (el.p - el.O) * DEG, O = el.O * DEG, i = el.i * DEG;
  const cw = Math.cos(w), sw = Math.sin(w);
  const cO = Math.cos(O), sO = Math.sin(O);
  const ci = Math.cos(i), si = Math.sin(i);
  const xe = x * (cw*cO - sw*sO*ci) - y * (sw*cO + cw*sO*ci);
  const ye = x * (cw*sO + sw*cO*ci) + y * (cw*cO*ci - sw*sO);
  const ze = x * sw*si + y * cw*si;
  return out.set(xe * AU, ze * AU, ye * AU);
}

function buildOrbitLine(el, color, opacity){
  const pts = [];
  const v = new THREE.Vector3();
  for (let k = 0; k <= 360; k++){
    elementsToPos(el, k * DEG, v);
    pts.push(v.x, v.y, v.z);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent:true, opacity }));
  scene.add(line);
  orbitLines.push(line);
  return line;
}

  t.anisotropy = 4;
  return t;
}

function buildRing(inner, outer, canvas){
  const geo = new THREE.RingGeometry(inner, outer, 180, 1);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let k = 0; k < pos.count; k++){
    const r = Math.hypot(pos.getX(k), pos.getY(k));
    uv.setXY(k, (r - inner) / (outer - inner), 0.5);
  }
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    map: colorTex(canvas), side: THREE.DoubleSide, transparent:true, depthWrite:false,
  }));
  mesh.rotation.x = -Math.PI / 2;
  return mesh;
}

function buildPlanet(p, canvases){
  const group = new THREE.Group();
  scene.add(group);
  const tiltG = new THREE.Group();
  tiltG.rotation.z = p.tilt * DEG;
  group.add(tiltG);

  const mat = new THREE.MeshStandardMaterial({
    map: colorTex(canvases[p.tex]),
    roughness: p.gas ? 1.0 : 0.9,
    metalness: 0.0,
  });
  if (p.tex === 'earth'){
    mat.roughnessMap = new THREE.CanvasTexture(canvases.earthRough);
  }
  if (!p.gas && p.tex !== 'earth'){
    mat.bumpMap = new THREE.CanvasTexture(canvases[p.tex]);
    mat.bumpScale = 0.035;
  }
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.r, 64, 48), mat);
  tiltG.add(mesh);

  if (p.tex === 'earth'){
    earthClouds = new THREE.Mesh(
      new THREE.SphereGeometry(p.r * 1.02, 48, 36),
      new THREE.MeshStandardMaterial({ map: colorTex(canvases.earthClouds), transparent:true, depthWrite:false, opacity:0.85 })
    );
    tiltG.add(earthClouds);
  }
  if (p.atmo) group.add(makeAtmosphere(p.r, p.atmo[0], p.atmo[1], p.atmo[2]));
  if (p.rings)  tiltG.add(buildRing(p.r * 1.24, p.r * 2.32, canvases.saturnRing));
  if (p.urings){
    const ur = buildRing(p.r * 1.6, p.r * 2.0, canvases.uranusRing);
    ur.material.opacity = 0.35;
    tiltG.add(ur);
  }

  const body = { data:p, group, tiltG, mesh, anchor:group, r:p.r, spin0: Math.random() * TAU };
  addHitSphere(body, Math.max(p.r * 4, 2.4));
  addLabel(body);
  buildOrbitLine(p, p.color, p.dwarf ? 0.16 : 0.26);
  bodies.push(body);
  return body;
}

// 月球
let moonPivot, moonMesh;
function buildMoon(earthBody, canvases){
  moonPivot = new THREE.Group();
  moonPivot.rotation.z = 5.14 * DEG;
  earthBody.group.add(moonPivot);
  const mat = new THREE.MeshStandardMaterial({ map: colorTex(canvases.moon), roughness: 0.95 });
  mat.bumpMap = new THREE.CanvasTexture(canvases.moon);
  mat.bumpScale = 0.03;
  moonMesh = new THREE.Mesh(new THREE.SphereGeometry(0.27, 40, 30), mat);
  moonMesh.position.set(2.7, 0, 0);
  moonPivot.add(moonMesh);
}

// ============================================================
// 小行星带（火星与木星之间）与柯伊伯带
// ============================================================
function buildBelt(){
  const COUNT = 1300;
  const rng = mulberry(2024);
  belt = new THREE.InstancedMesh(
    new THREE.IcosahedronGeometry(1, 0),
    new THREE.MeshStandardMaterial({ color:0x8a7f72, roughness:1, metalness:0 }),
    COUNT
  );
  belt.frustumCulled = false;
  beltData = [];
  for (let i = 0; i < COUNT; i++){
    const a = (2.1 + Math.pow(rng(), 0.75) * 1.25);   // AU
    beltData.push({
      r: a * AU * (1 + (rng() - 0.5) * 0.05),
      y: (rng() - 0.5) * 3.2,
      ang: rng() * TAU,
      n: TAU / (Math.pow(a, 1.5) * 365.25),
      s: 0.05 + rng() * 0.15,
      rx: rng() * TAU, ry: rng() * TAU,
    });
  }
  scene.add(belt);

  // 柯伊伯带
  const N2 = 900;
  const pos = new Float32Array(N2 * 3);
  for (let i = 0; i < N2; i++){
    const a = (31 + rng() * 22) * AU;
    const th = rng() * TAU;
    pos[i*3]   = Math.cos(th) * a;
    pos[i*3+1] = (rng() + rng() - 1) * 9;
    pos[i*3+2] = Math.sin(th) * a;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  kuiper = new THREE.Points(geo, new THREE.PointsMaterial({
    color:0x8fa8cf, size:1.6, sizeAttenuation:false, transparent:true,
    opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false,
  }));
  kuiper.frustumCulled = false;
  scene.add(kuiper);
}

// ============================================================
// 哈雷彗星：彗核 + 彗发辉光 + 尾迹
// ============================================================
const TRAIL_N = 170;
function buildComet(canvases){
  const g = new THREE.Group();
  scene.add(g);
  const mat = new THREE.MeshStandardMaterial({ map: colorTex(canvases.comet), roughness: 1 });
  g.add(new THREE.Mesh(new THREE.SphereGeometry(HALLEY.r, 24, 18), mat));
  cometGlow = makeGlowSprite(1.6, [[0,'rgba(220,240,255,0.9)'],[0.3,'rgba(160,210,255,0.35)'],[1,'rgba(120,180,255,0)']], 1);
  g.add(cometGlow);
  buildOrbitLine(HALLEY, 0x7fd4ff, 0.18);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
  cometTrail = new THREE.Points(geo, new THREE.PointsMaterial({
    size:2.4, sizeAttenuation:false, vertexColors:true, transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false,
  }));
  cometTrail.frustumCulled = false;
  scene.add(cometTrail);

  cometBody = { data:{ name:HALLEY.name, en:HALLEY.en, color:HALLEY.color, desc:HALLEY.desc,
    realR:'约 15 × 8 km', periodStr:'约 75.3 年', rotStr:'约 2.2 天', moons:0, a:HALLEY.a, e:HALLEY.e },
    group:g, anchor:g, r:HALLEY.r, trailPts:[] };
  addHitSphere(cometBody, 2.2);
  addLabel(cometBody);
  bodies.push(cometBody);
}


// ============================================================
// 相机聚焦 / 全景切换
// ============================================================
let focused = null;
let tween = null;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function startTween(toTarget, toCam, dur = 950){
  tween = {
    t0: performance.now(), dur,
    fromT: controls.target.clone(), toT: toTarget.clone(),
    fromC: camera.position.clone(), toC: toCam.clone(),
  };
}

function focusBody(body){
  focused = body;
  showInfo(body.data);
  document.getElementById('jump').value = body.data.en;
  const wp = body.anchor.getWorldPosition(new THREE.Vector3());
  const dir = camera.position.clone().sub(wp);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0.4, 1);
  dir.normalize();
  const dist = Math.max(body.r * 6.5, body.r + 1.6);
  startTween(wp, wp.clone().addScaledVector(dir, dist));
}

function goOverview(){
  focused = null;
  hideInfo();
  document.getElementById('jump').value = '';
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0.35, 1);
  dir.normalize();
  const camPos = dir.multiplyScalar(980);
  camPos.y = Math.max(camPos.y, 260);
  startTween(new THREE.Vector3(0, 0, 0), camPos, 1100);
}

// ============================================================
// UI：信息卡 / 速度 / 开关 / 下拉 / 点击拾取
// ============================================================
const infoEl = document.getElementById('info');
function showInfo(d){
  infoEl.classList.add('show');
    infoEl.querySelector('.iname').innerHTML = `${d.name} <small>${d.en}${d.dwarf ? ' · 矮行星' : ''}</small>`;
  infoEl.querySelector('.idesc').textContent = d.desc || '';
  infoEl.querySelector('.igrid').innerHTML = `
    <div>半径<em>${d.realR}</em></div>
    <div>半长轴<em>${d.a ? d.a.toFixed(3) + ' AU' : '—'}</em></div>
    <div>公转周期<em>${d.periodStr}</em></div>
    <div>自转周期<em>${d.rotStr}</em></div>
    <div>轨道偏心率<em>${d.e ? d.e.toFixed(3) : '—'}</em></div>
    <div>卫星<em>${typeof d.moons === 'number' ? d.moons + ' 颗' : '—'}</em></div>`;
}
function hideInfo(){ infoEl.classList.remove('show'); }
document.getElementById('infoClose').addEventListener('click', goOverview);

let speed = 3;            // 模拟天/秒
let simDays = 0;          // 相对 J2000 的天数
const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
const speedHud = document.getElementById('speedHud');
const dateEl = document.getElementById('date');
const elapsedEl = document.getElementById('elapsed');

function fmtSpeed(s){
  if (s === 0) return '已暂停';
  return (s < 1 ? s.toFixed(1) : s < 10 ? s.toFixed(1) : Math.round(s)) + ' 天/秒';
}
function applySpeed(){
  const v = +speedSlider.value;
  speed = Math.pow(v / 100, 2) * 120;
  if (speed < 0.01) speed = 0;
  speedVal.textContent = fmtSpeed(speed);
  speedHud.textContent = fmtSpeed(speed);
  document.querySelectorAll('.btn[data-s]').forEach(b=>{
    b.classList.toggle('on', Math.abs(+b.dataset.s - speed) < Math.max(0.06, speed * 0.06));
  });
}
speedSlider.addEventListener('input', applySpeed);
document.querySelectorAll('.btn[data-s]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const s = +b.dataset.s;
    speedSlider.value = s === 0 ? 0 : 100 * Math.sqrt(s / 120);
    applySpeed();
  });
});

let speedBeforePause = 3;
window.addEventListener('keydown', (e)=>{
  if (e.code === 'Space'){ e.preventDefault();
    if (speed > 0){ speedBeforePause = speed; speedSlider.value = 0; }
    else speedSlider.value = 100 * Math.sqrt(speedBeforePause / 120);
    applySpeed();
  }
  if (e.code === 'Escape') goOverview();
});

const tgLabels = document.getElementById('tgLabels');
const tgOrbits = document.getElementById('tgOrbits');
const tgBelt = document.getElementById('tgBelt');
tgOrbits.addEventListener('change', ()=> orbitLines.forEach(l => l.visible = tgOrbits.checked));
tgBelt.addEventListener('change', ()=>{ belt.visible = kuiper.visible = tgBelt.checked; });

const jumpSel = document.getElementById('jump');
function fillJump(){
  for (const b of bodies){
    const o = document.createElement('option');
    o.value = b.data.en;
    o.textContent = b.data.name + ' · ' + b.data.en;
    jumpSel.appendChild(o);
  }
  jumpSel.addEventListener('change', ()=>{
    const b = bodies.find(x => x.data.en === jumpSel.value);
    if (b) focusBody(b); else goOverview();
  });
}

// 点击拾取（区分拖动）
let downX = 0, downY = 0;
let lastInteract = 0;
function markInteract(){ lastInteract = performance.now(); }
window.addEventListener('pointerdown', (e)=>{ markInteract(); downX = e.clientX; downY = e.clientY; });
window.addEventListener('wheel', markInteract, { passive:true });
window.addEventListener('pointerup', (e)=>{
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  if (e.target.closest && e.target.closest('.label')) return; // 标签自带点击事件
  if (e.target !== renderer.domElement) return;
  pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(hitMeshes, false);
  if (hits.length) focusBody(hits[0].object.userData.body);
});
window.addEventListener('dblclick', (e)=>{
  if (e.target !== renderer.domElement) return;
  pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  if (!raycaster.intersectObjects(hitMeshes, false).length) goOverview();
});

// ============================================================
// 主循环
// ============================================================
const clock = new THREE.Clock();
const dateFmt = new Intl.DateTimeFormat('zh-CN', { year:'numeric', month:'long', day:'numeric' });

function updateBodies(){
  for (const b of bodies){
    if (b.isSun) continue;
    const d = b.data === cometBody?.data ? HALLEY : b.data;
    const nDeg = 360 / d.period;
    const Mdeg = d.L + nDeg * simDays - d.p;
    elementsToPos(d, Mdeg * DEG, b.group.position);
    if (b.mesh) b.mesh.rotation.y = (simDays / d.rot) * TAU + b.spin0;
  }
  // 月球
  const mang = (simDays / 27.3217) * TAU;
  moonPivot.rotation.y = -mang;
  moonMesh.rotation.y = -mang + Math.PI;
  // 地球云层缓慢漂移
  if (earthClouds) earthClouds.rotation.y += 0.00012;
  // 小行星带
  if (belt.visible){
    for (let i = 0; i < beltData.length; i++){
      const bd = beltData[i];
      const a = bd.ang + bd.n * simDays;
      dummy.position.set(Math.cos(a) * bd.r, bd.y, Math.sin(a) * bd.r);
      dummy.scale.setScalar(bd.s);
      dummy.rotation.set(bd.rx, bd.ry, 0);
      dummy.updateMatrix();
      belt.setMatrixAt(i, dummy.matrix);
    }
    belt.instanceMatrix.needsUpdate = true;
  }
  kuiper.rotation.y = -simDays * TAU / (300 * 365.25);
  // 彗星尾迹
  const cp = cometBody.group.position;
  const rAU = cp.length() / AU;
  const bright = clamp(3.2 / (rAU * rAU), 0.04, 1.15);
  cometGlow.material.opacity = clamp(bright, 0.25, 1);
  cometGlow.scale.setScalar(lerp(0.7, 4.2, clamp(bright, 0, 1)));
  const pts = cometBody.trailPts;
  if (!pts.length || pts[pts.length - 1].distanceToSquared(cp) > 0.04){
    pts.push(cp.clone());
    if (pts.length > TRAIL_N) pts.shift();
  }
  const pa = cometTrail.geometry.attributes.position.array;
  const ca = cometTrail.geometry.attributes.color.array;
  for (let i = 0; i < TRAIL_N; i++){
    const p = pts[Math.max(0, pts.length - TRAIL_N + i)] || cp;
    pa[i*3] = p.x; pa[i*3+1] = p.y; pa[i*3+2] = p.z;
    const f = (i / TRAIL_N) * bright;
    ca[i*3] = f * 0.55; ca[i*3+1] = f * 0.8; ca[i*3+2] = f;
  }
  cometTrail.geometry.attributes.position.needsUpdate = true;
  cometTrail.geometry.attributes.color.needsUpdate = true;
}

function updateLabels(){
  const show = tgLabels.checked;
  const w = window.innerWidth, h = window.innerHeight;
  for (const b of bodies){
    const el = b.labelEl;
    if (!show){ el.style.display = 'none'; continue; }
    b.anchor.getWorldPosition(tmpV);
    tmpV.y += b.r * 1.1;
    tmpV.project(camera);
    if (tmpV.z > 1){ el.style.display = 'none'; continue; }
    el.style.display = 'flex';
    el.style.left = (tmpV.x * 0.5 + 0.5) * w + 'px';
    el.style.top = (-tmpV.y * 0.5 + 0.5) * h + 'px';
  }
}

function updateHud(){
  const date = new Date(J2000 + simDays * 86400000);
  dateEl.textContent = dateFmt.format(date);
  const days = Math.abs(simDays);
  elapsedEl.textContent = days < 1096 ? Math.round(days) + ' 天' : (days / 365.25).toFixed(1) + ' 年';
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  simDays += speed * dt;
  const t = clock.elapsedTime;

  if (sunMat) sunMat.uniforms.uTime.value = t;
  updateBodies();
  updateHud();

  // 相机补间 / 跟随
  const now = performance.now();
  if (tween){
    const k = Math.min(1, (now - tween.t0) / tween.dur);
    const e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
    controls.target.lerpVectors(tween.fromT, tween.toT, e);
    camera.position.lerpVectors(tween.fromC, tween.toC, e);
    controls.enabled = false;
    if (k >= 1){ tween = null; controls.enabled = true; }
  } else if (focused){
    focused.anchor.getWorldPosition(tmpV);
    const dx = tmpV.x - controls.target.x, dy = tmpV.y - controls.target.y, dz = tmpV.z - controls.target.z;
    controls.target.set(tmpV.x, tmpV.y, tmpV.z);
    camera.position.x += dx; camera.position.y += dy; camera.position.z += dz;
  }
  controls.autoRotate = !focused && !tween && (now - lastInteract > 9000);
  controls.update();

  updateLabels();
  composer.render();
}

// ============================================================
// 初始化
// ============================================================
function init(){
  initRenderer();
  buildSky();
  buildSun();

  // 生成全部纹理
  const canvases = {};
  const earthTex = earthTextures();
  canvases.earth = earthTex.map;
  canvases.earthClouds = earthTex.clouds;
  canvases.earthRough = earthTex.rough;
  canvases.mercury = TEX.mercury(512, 256);
  canvases.moon = TEX.moon(512, 256);
  canvases.venus = TEX.venus(512, 256);
  canvases.mars = TEX.mars(512, 256);
  canvases.jupiter = TEX.jupiter(1024, 512);
  canvases.saturn = TEX.saturn(1024, 512);
  canvases.uranus = TEX.uranus(512, 256);
  canvases.neptune = TEX.neptune(512, 256);
  canvases.pluto = TEX.pluto(512, 256);
  canvases.comet = TEX.comet(256, 128);
  canvases.saturnRing = saturnRingCanvas();
  const urCv = document.createElement('canvas'); urCv.width = 64; urCv.height = 2;
  const urCtx = urCv.getContext('2d');
  urCtx.fillStyle = 'rgba(190,215,220,0.5)'; urCtx.fillRect(0,0,64,2);
  canvases.uranusRing = urCv;

  const planetBodies = {};
  for (const p of PLANETS) planetBodies[p.en] = buildPlanet(p, canvases);
  buildMoon(planetBodies.Earth, canvases);
  buildBelt();
  buildComet(canvases);
  scene.add(new THREE.AmbientLight(0x2a3850, 0.5));

  // 以真实当前日期为起点（J2000 起算）
  simDays = (Date.now() - J2000) / 86400000;

  fillJump();
  applySpeed();
  animate();
  document.getElementById('loading').classList.add('hide');
}

setTimeout(init, 60);
</script>
