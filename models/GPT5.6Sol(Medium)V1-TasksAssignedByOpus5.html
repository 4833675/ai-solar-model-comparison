function updateInfo(){let moon=focus>=100;if(moon){let m=moons[focus-100],d=Math.hypot(...sub(moonPositions[focus-100],positions[m[2]]));q('#live').innerHTML=`<div class="datum"><b>${(m[4]/1000).toFixed(0)}k</b><span>真实轨道半径 km</span></div><div class="datum"><b>${Math.abs(m[5]).toFixed(4)}</b><span>周期 天</span></div>`;return}let b=B[focus],raw=orbitPos(b),r=Math.hypot(raw[0],raw[1],raw[2]),lon=norm(Math.atan2(-raw[2],raw[0]))/D,lat=Math.asin(raw[1]/(r||1))/D,earth=orbitPos(B[3]),de=Math.hypot(raw[0]-earth[0],raw[1]-earth[1],raw[2]-earth[2]),el=elements(b),v=focus?29.7847*Math.sqrt(2/r-1/el[0]):0,peri=focus?el[0]*(1-el[1]):0,aph=focus?el[0]*(1+el[1]):0;q('#live').innerHTML=`<div class="datum"><b>${focus?r.toFixed(3):'0.000'} AU</b><span>日心距离</span></div><div class="datum"><b>${lon.toFixed(2)}°</b><span>黄经</span></div><div class="datum"><b>${lat.toFixed(2)}°</b><span>黄纬</span></div><div class="datum"><b>${focus?v.toFixed(2):'—'} km/s</b><span>轨道速度</span></div><div class="datum"><b>${focus?de.toFixed(3):'—'} AU</b><span>与地球距离</span></div><div class="datum"><b>${focus?(de*499/60).toFixed(1):'—'} min</b><span>光行时</span></div><div class="datum"><b>${focus?peri.toFixed(3):'—'} AU</b><span>近日点</span></div><div class="datum"><b>${focus?aph.toFixed(3):'—'} AU</b><span>远日点</span></div>`}
function updateUI(){let d=new Date((jd-2440587.5)*86400000),year=d.getUTCFullYear();q('#date').textContent=d.toISOString().replace('T','  ').slice(0,19)+' UTC';q('#date').classList.toggle('warn',year<1800||year>2050);q('#rate').textContent=(year<1800||year>2050?'已超出根数有效区间（外推） · ':'')+fmtRate(rate());updateInfo();let box=q('#labels');if(!state.labels){box.innerHTML='';return}let arr=B.map((b,i)=>({name:b[0],p:positions[i],c:colors[i]}));if(state.moons)arr.push(...moons.map((m,i)=>({name:m[0],p:moonPositions[i],c:'#a9bdc5'})));box.innerHTML=arr.map(o=>{let s=project(o.p);if(s[2]<0||Math.abs(s[0])>1.2||Math.abs(s[1])>1.2)return'';return`<div class="label" style="left:${(s[0]*.5+.5)*innerWidth}px;top:${(-s[1]*.5+.5)*innerHeight}px;--c:${o.c}">${o.name}</div>`}).join('')}
function buildToggles(){let names={orbits:'轨道',labels:'名称',moons:'卫星',belts:'小天体',comet:'彗星',real:'真实比例',glow:'辉光'};q('#toggles').innerHTML=Object.keys(names).map(k=>`<button class="toggle ${state[k]?'on':''}" data-k="${k}">${names[k]}</button>`).join('');q('#toggles').onclick=e=>{let b=e.target.closest('button');if(!b)return;let k=b.dataset.k;state[k]=!state[k];b.classList.toggle('on',state[k]);if(k==='real'){targetCompress=state.real?1:.62;q('#scale-note').innerHTML=state.real?'真实径向距离比例<br>内行星在当前尺度下高度聚集':'径向距离采用幂律压缩<br>角位置、相位与轨道倾角保持真实'}}}
canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;yaw-=dx*.005;pitch+=dy*.005});canvas.addEventListener('pointerup',e=>{let moved=Math.hypot(e.clientX-px,e.clientY-py);drag=false;if(moved<4)pick(e.clientX,e.clientY)});canvas.addEventListener('wheel',e=>{e.preventDefault();distDest=clamp(distDest*Math.exp(e.deltaY*.001),3,1800)},{passive:false});
function pick(x,y){let best=[1e9,-1,false];B.forEach((b,i)=>{let s=project(positions[i]),sx=(s[0]*.5+.5)*innerWidth,sy=(-s[1]*.5+.5)*innerHeight,d=Math.hypot(x-sx,y-sy);if(s[2]>0&&d<best[0])best=[d,i,false]});if(state.moons)moons.forEach((m,i)=>{let s=project(moonPositions[i]),d=Math.hypot(x-(s[0]*.5+.5)*innerWidth,y-(-s[1]*.5+.5)*innerHeight);if(s[2]>0&&d<best[0])best=[d,i,true]});if(best[0]<32)focusBody(best[1],best[2])}
q('#play').onclick=()=>{paused=!paused;q('#play').textContent=paused?'▶':'Ⅱ';q('#play').ariaLabel=paused?'播放':'暂停'};q('#now').onclick=()=>{jd=jdNow()};q('#speed').oninput=e=>speedVal=+e.target.value;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();q('#play').click()}if(e.key==='ArrowRight'){speedVal=clamp(+speedVal+3,-100,100);q('#speed').value=speedVal}if(e.key==='ArrowLeft'){speedVal=clamp(+speedVal-3,-100,100);q('#speed').value=speedVal}if(e.key.toLowerCase()==='h'){hideUI=!hideUI;['#top','#nav','#info','#controls','#toggles','#scale-note'].forEach(s=>q(s).classList.toggle('hidden',hideUI))}});
try{buildNav();buildInfo();buildToggles();rebuildOrbits();gl.clearColor(0,0,0,1);requestAnimationFrame(render)}catch(err){console.error(err);let e=q('#error');e.style.display='grid';e.innerHTML='<div><h2>渲染器初始化失败</h2><p>'+String(err.message).replace(/[<>]/g,'')+'</p></div>'}
})();
</script>
</body>
