    }
    if (toggles.comet && halleyBody.orbitMesh){
      drawOrbit(halleyBody, halleyBody.orbitMesh, halleyBody.orbitPhase, [0.55, 0.85, 1.0], 1.3, 0.035, 0.55, true, null);
    }
    if (toggles.moons){
      for (const b of moonBodies){
        const d = b.moonDist;
        const parentScreenR = d / Math.max(0.001, V3.len(V3.sub(cam.eye, b.parent.world))) / TAN_HALF * (cssH / 2);
        if (parentScreenR < 4) continue;
        const model = b.def.frame === 'eq'
          ? M4.basis(b.parent.world, b.parent.basis.x, b.parent.basis.y, b.parent.basis.z, 0, d)
          : M4.basis(b.parent.world, [1,0,0], [0,1,0], [0,0,1], 0, d);
        const c = hexRGB(b.def.color);
        drawOrbit(b, b.moonOrbitMesh, b.orbitPhase, [c[0]*0.5, c[1]*0.5, c[2]*0.5], 0.8, 0.05, 0.30, false, model);
      }
    }
  }
  glTrace('orbits');

  /* 5. 小行星 / 柯伊伯带 */
  if (toggles.asteroids){
    PROG.ast.use();
    gl.uniformMatrix4fv(PROG.ast.u('uVP'), false, cam.vp);
    gl.uniform3f(PROG.ast.u('uCamPos'), cam.eye[0], cam.eye[1], cam.eye[2]);
    gl.uniform1f(PROG.ast.u('uDays'), simJD - J2000);
    gl.uniform1f(PROG.ast.u('uCompress'), compress);
    gl.uniform1f(PROG.ast.u('uDpr'), DPR);
    for (const g of asteroidGroups){
      gl.uniform3fv(PROG.ast.u('uColor'), g.color);
      gl.uniform1f(PROG.ast.u('uBright'), g.bright);
      gl.bindVertexArray(g.mesh.vao);
      gl.drawArrays(gl.POINTS, 0, g.mesh.count);
    }
  }

  /* 6. 大气壳层 */
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  PROG.atmo.use();
  gl.uniformMatrix4fv(PROG.atmo.u('uVP'), false, cam.vp);
  gl.uniform3f(PROG.atmo.u('uCamPos'), cam.eye[0], cam.eye[1], cam.eye[2]);
  gl.bindVertexArray(sphereMesh.vao);

  const drawAtmo = (b) => {
    const a = ATMO_BY_KEY[b.key];
    if (!a) return;
    const shellR = b.displayR * (1 + a.sh * 7.5);
    const model = M4.basis(b.world, b.basis.x, b.basis.y, b.basis.z, 0, shellR);
    gl.uniformMatrix4fv(PROG.atmo.u('uModel'), false, model);
    gl.uniform3f(PROG.atmo.u('uCenter'), b.world[0], b.world[1], b.world[2]);
    gl.uniform1f(PROG.atmo.u('uPR'), b.displayR);
    gl.uniform1f(PROG.atmo.u('uSH'), a.sh);
    gl.uniform3fv(PROG.atmo.u('uColor'), a.color);
    gl.uniform1f(PROG.atmo.u('uIntensity'), a.intensity);
    gl.uniform1f(PROG.atmo.u('uLightI'), b.lightI);
    gl.uniform3f(PROG.atmo.u('uSunDirW'), b.sunDirW[0], b.sunDirW[1], b.sunDirW[2]);
    gl.drawElements(gl.TRIANGLES, sphereMesh.count, gl.UNSIGNED_INT, 0);
  };
  for (const b of planetBodies) drawAtmo(b);
  if (toggles.moons) for (const b of moonBodies) drawAtmo(b);
  glTrace('atmo');

  /* 7. 环系 */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.CULL_FACE);
  PROG.ring.use();
  gl.uniformMatrix4fv(PROG.ring.u('uVP'), false, cam.vp);
  gl.uniform3f(PROG.ring.u('uCamPos'), cam.eye[0], cam.eye[1], cam.eye[2]);
  gl.bindVertexArray(ringMesh.vao);
  for (const b of bodies){
    if (!b.ring) continue;
    const model = M4.basis(b.world, b.basis.x, b.basis.y, b.basis.z, 0, b.displayR);
    gl.uniformMatrix4fv(PROG.ring.u('uModel'), false, model);
    gl.uniform3f(PROG.ring.u('uAxis'), b.basis.y[0], b.basis.y[1], b.basis.y[2]);
    gl.uniform3f(PROG.ring.u('uSunDirW'), b.sunDirW[0], b.sunDirW[1], b.sunDirW[2]);
    gl.uniform3f(PROG.ring.u('uSunObj'), b.sunObj[0], b.sunObj[1], b.sunObj[2]);
    gl.uniform1f(PROG.ring.u('uLightI'), b.lightI);
    gl.uniform1i(PROG.ring.u('uRingType'), b.ring.type);
    gl.drawElements(gl.TRIANGLES, ringMesh.count, gl.UNSIGNED_INT, 0);
  }
  glTrace('rings');

  /* 8. 彗尾 / 彗发 */
  if (toggles.comet) drawComet(cam);
  glTrace('comet');

  /* 9. 日冕 */
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.disable(gl.CULL_FACE);
  PROG.corona.use();
  gl.uniformMatrix4fv(PROG.corona.u('uView'), false, cam.view);
  gl.uniformMatrix4fv(PROG.corona.u('uProj'), false, cam.proj);
  gl.uniform3f(PROG.corona.u('uCenter'), 0, 0, 0);
  gl.uniform1f(PROG.corona.u('uTime'), performance.now() * 0.001);
  gl.bindVertexArray(billboardVAO);

  gl.uniform1f(PROG.corona.u('uRadius'), 14.26);
  gl.uniform1f(PROG.corona.u('uInner'), 0.3225);
  gl.uniform1f(PROG.corona.u('uPow'), 3.6);
  gl.uniform1f(PROG.corona.u('uIntensity'), 0.75);
  gl.uniform3f(PROG.corona.u('uColor'), 1.0, 0.62, 0.28);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  gl.uniform1f(PROG.corona.u('uRadius'), 41.4);
  gl.uniform1f(PROG.corona.u('uInner'), 0.111);
  gl.uniform1f(PROG.corona.u('uPow'), 6.0);
  gl.uniform1f(PROG.corona.u('uIntensity'), 0.10);
  gl.uniform3f(PROG.corona.u('uColor'), 1.0, 0.68, 0.38);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  glTrace('corona');

  /* resolve MSAA */
  if (useMSAA){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, msaaFBO);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, resolveFBO);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  }
  glTrace('resolve');
  gl.bindVertexArray(null);
}

/* ----------------------------- 彗星 ----------------------------- */
let tailVAO = null, tailVBO = null;
const tailVerts = new Float32Array(28 * 2 * 5);

function initTailBuffers(){
  tailVAO = gl.createVertexArray();
  gl.bindVertexArray(tailVAO);
  tailVBO = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, tailVBO);
  gl.bufferData(gl.ARRAY_BUFFER, tailVerts.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 12);
  gl.bindVertexArray(null);
}
initTailBuffers();

function drawComet(cam){
  const b = halleyBody;
  const r = Math.max(b.rAU, 0.05);
  const intensity = clamp(0.85 * Math.pow(1.5 / r, 2.0), 0.0, 1.55);
  const showTail = r < 6.5 && intensity > 0.004;
  const anti = V3.norm(b.world);
  const vel = b.velWorld || [0, 0, 1];

  const dustLag = V3.norm(V3.sub(V3.scale(vel, -1), V3.scale(anti, V3.dot(V3.scale(vel, -1), anti))));

  const drawOne = (dust) => {
    const n = 28;
    const L = clamp(17.0 / Math.pow(r, 0.78), 2.0, 46.0) * (dust ? 1.15 : 1.0);
    const pts = [];
    for (let i = 0; i < n; i++){
      const t = i / (n - 1);
      const base = dust
        ? V3.norm(V3.add(V3.scale(anti, 0.62), V3.scale(vel, -0.55)))
        : anti;
      let p = V3.add(b.world, V3.scale(base, L * t));
      if (dust) p = V3.add(p, V3.scale(dustLag, L * 0.55 * t * t));
      pts.push(p);
    }
    for (let i = 0; i < n; i++){
      const p = pts[i];
      const pPrev = pts[Math.max(0, i - 1)];
      const pNext = pts[Math.min(n - 1, i + 1)];
      let tang = V3.sub(pNext, pPrev);
      if (V3.len(tang) < 1e-6) tang = anti;
      const toCam = V3.norm(V3.sub(cam.eye, p));
      let side = V3.cross(tang, toCam);
      if (V3.len(side) < 1e-6) side = [1, 0, 0];
      side = V3.norm(side);
      const t = i / (n - 1);
      const w = (dust ? 0.28 + 2.9 * t : 0.12 + 1.45 * t) * clamp(1.6 / Math.pow(r, 0.3), 0.7, 2.2);
      for (let k = 0; k < 2; k++){
        const sgn = k === 0 ? -1 : 1;
        const idx = (i * 2 + k) * 5;
        tailVerts[idx  ] = p[0] + side[0] * w * sgn;
        tailVerts[idx+1] = p[1] + side[1] * w * sgn;
        tailVerts[idx+2] = p[2] + side[2] * w * sgn;
        tailVerts[idx+3] = t;
        tailVerts[idx+4] = sgn;
      }
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, tailVBO);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, tailVerts);

    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.disable(gl.CULL_FACE);
    PROG.tail.use();
    gl.uniformMatrix4fv(PROG.tail.u('uVP'), false, cam.vp);
    if (dust){
      gl.uniform3f(PROG.tail.u('uColor'), 1.0, 0.68, 0.34);
      gl.uniform1f(PROG.tail.u('uIntensity'), intensity * 0.70);
    } else {
      gl.uniform3f(PROG.tail.u('uColor'), 0.42, 0.70, 1.0);
      gl.uniform1f(PROG.tail.u('uIntensity'), intensity * 0.85);
    }
    gl.uniform1f(PROG.tail.u('uTime'), performance.now() * 0.001);
    gl.bindVertexArray(tailVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, n * 2);
  };

  if (showTail){
    drawOne(false);
    drawOne(true);
  }

  /* 彗发 */
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.disable(gl.CULL_FACE);
  PROG.coma.use();
  gl.uniformMatrix4fv(PROG.coma.u('uView'), false, cam.view);
  gl.uniformMatrix4fv(PROG.coma.u('uProj'), false, cam.proj);
  gl.uniform3f(PROG.coma.u('uCenter'), b.world[0], b.world[1], b.world[2]);
  gl.uniform1f(PROG.coma.u('uRadius'), 0.45 + 0.85 * intensity);
  gl.uniform3f(PROG.coma.u('uColor'), 0.62, 0.82, 1.0);
  gl.uniform1f(PROG.coma.u('uIntensity'), 0.16 + intensity * 0.30);
  gl.bindVertexArray(billboardVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}

/* ----------------------------- 泛光 ----------------------------- */
function renderBloom(){
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.disable(gl.BLEND);
  gl.disable(gl.CULL_FACE);
  gl.bindVertexArray(emptyVAO);

  let srcTex = sceneTex;
  let srcW = W, srcH = H;
  const threshold = extFloat ? 1.25 : 0.72;
  const knee = extFloat ? 0.60 : 0.35;

  PROG.down.use();
  gl.uniform1i(PROG.down.u('uSrc'), 0);
  for (let i = 0; i < 6; i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBO[i]);
    gl.viewport(0, 0, bloomW[i], bloomH[i]);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.uniform2f(PROG.down.u('uTexel'), 1 / srcW, 1 / srcH);
    gl.uniform1f(PROG.down.u('uPrefilter'), i === 0 ? 1 : 0);
    gl.uniform1f(PROG.down.u('uThreshold'), threshold);
    gl.uniform1f(PROG.down.u('uKnee'), knee);
    drawFullscreen();
    srcTex = bloomTex[i];
    srcW = bloomW[i];
    srcH = bloomH[i];
  }

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  PROG.up.use();
  gl.uniform1i(PROG.up.u('uSrc'), 0);
  for (let i = 5; i >= 1; i--){
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBO[i - 1]);
    gl.viewport(0, 0, bloomW[i - 1], bloomH[i - 1]);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, bloomTex[i]);
    gl.uniform2f(PROG.up.u('uTexel'), 1 / bloomW[i], 1 / bloomH[i]);
    drawFullscreen();
  }
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/* ----------------------------- 合成 ----------------------------- */
function sunVisibility(cam){
  const p = projectPoint(cam.vp, [0, 0, 0]);
  if (p.w <= 1e-6) return 0;
  let vis = sstep(-0.18, 0.06, Math.min(p.x + 1, 1 - p.x, p.y + 1, 1 - p.y));
  if (vis <= 0) return 0;
  const aspect = W / H;
  const distSun = V3.len(cam.eye);
  for (const b of planetBodies){
    const q = projectPoint(cam.vp, b.world);
    if (q.w <= 1e-6) continue;
    const distB = V3.len(V3.sub(cam.eye, b.world));
    if (distB >= distSun) continue;
    const rr = b.displayR / (distB * TAN_HALF);
    const dx = (p.x - q.x) * aspect;
    const dy = p.y - q.y;
    if (Math.hypot(dx, dy) < rr * 1.05){
      vis = 0;
      break;
    }
  }
  return vis;
}

function renderPost(cam, sunVis){
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.disable(gl.BLEND);
  gl.disable(gl.CULL_FACE);
  PROG.post.use();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, bloomTex[0]);
  gl.uniform1i(PROG.post.u('uScene'), 0);
  gl.uniform1i(PROG.post.u('uBloom'), 1);
  gl.uniform2f(PROG.post.u('uRes'), W, H);
  gl.uniform1f(PROG.post.u('uBloomOn'), toggles.bloom ? 1 : 0);
  gl.uniform1f(PROG.post.u('uBloomStr'), 0.34);
  gl.uniform1f(PROG.post.u('uExposure'), 1.0);
  gl.uniform1f(PROG.post.u('uTime'), performance.now() * 0.001);
  gl.uniform2f(PROG.post.u('uSunUV'), 0.5, 0.5);
  gl.uniform1f(PROG.post.u('uSunVis'), 0);

  /* 太阳屏幕坐标 */
  const sp = projectPoint(cam.vp, [0, 0, 0]);
  if (sp.w > 1e-6){
    gl.uniform2f(PROG.post.u('uSunUV'), sp.x * 0.5 + 0.5, sp.y * 0.5 + 0.5);
  }
  gl.uniform1f(PROG.post.u('uSunVis'), sunVis);
  drawFullscreen();
  gl.activeTexture(gl.TEXTURE0);
}

function render(cam){
  renderScene(cam);
  glTrace('scene');
  if (toggles.bloom) renderBloom();
  glTrace('bloom');
  renderPost(cam, sunVisibility(cam));
  glTrace('post');
}

   标签 / 屏幕投影

function updateOverlays(cam){
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  const earth = bodyByKey.earth;
  for (const b of bodies){
    const q = projectToScreen(cam.vp, b.world, cssW, cssH);
    if (!q){
      b.screen = null;
      continue;
    }
    const dist = Math.max(0.0001, V3.len(V3.sub(cam.eye, b.world)));
    const px = b.displayR / (dist * TAN_HALF) * (cssH / 2);
    b.screen = { x: q.x, y: q.y, px, ndcX: q.ndcX, ndcY: q.ndcY };
  }

  for (const b of bodies){
    const el = lblEls[b.key];
    if (!el) continue;
    const s = b.screen;
    let op = 0;
    if (s && !uiHidden && toggles.labels){
      const visible = b.kind !== 'moon' || toggles.moons;
      const cometVisible = b.key !== 'halley' || toggles.comet;
      if (visible && cometVisible && s.x > -80 && s.x < cssW + 80 && s.y > -40 && s.y < cssH + 40){
        const distB = V3.len(V3.sub(cam.eye, b.world));
        let occluded = false;
        for (const o of bodies){
          if (o === b || !o.screen || o.screen.px < 1.2) continue;
          if (V3.len(V3.sub(cam.eye, o.world)) >= distB - 1e-4) continue;
          const dd = Math.hypot(o.screen.x - s.x, o.screen.y - s.y);
          if (dd < o.screen.px * 0.94){ occluded = true; break; }
        }
        if (!occluded) op = clamp(0.32 + s.px * 0.060, 0.32, 0.95);
        if (b.kind === 'moon'){
          op *= 0.72;
          const ps = b.parent ? b.parent.screen : null;
          if (ps){
            const sep = Math.hypot(ps.x - s.x, ps.y - s.y);
            if (sep < 13) op = 0;
          }
        }
        if (b.key === camState.focus) op = Math.min(1, op + 0.2);
      }
    }
    if (op <= 0.01){
      el.style.opacity = '0';
      continue;
    }
    el.style.opacity = op.toFixed(3);
    el.style.transform = `translate(${s.x.toFixed(1)}px, ${(s.y - Math.max(s.px, 2) - 8).toFixed(1)}px) translate(-50%, -100%)`;
  }

  /* 太阳眩光可见度缓存 */
  camState.sunVis = sunVisibility(cam);
}

function pickBody(cx, cy){
  let best = null;
  let bestScore = 1e9;
  for (const b of bodies){
    if (b.kind === 'moon' && !toggles.moons) continue;
    if (b.key === 'halley' && !toggles.comet) continue;
    const s = b.screen;
    if (!s) continue;
    const d = Math.hypot(cx - s.x, cy - s.y);
    const thresh = Math.max(16, Math.min(70, s.px + 9));
    if (d > thresh) continue;
    const score = d / Math.max(4, s.px + 6);
    if (score < bestScore){
      bestScore = score;
      best = b;
    }
  }
  return best;
}

function fmtAU(x){
  if (!isFinite(x)) return '—';
  if (x >= 100) return x.toFixed(2) + ' AU';
  if (x >= 10) return x.toFixed(3) + ' AU';
  return x.toFixed(4) + ' AU';
}
function fmtLight(au){
  const sec = au * LIGHT_S_PER_AU;
  if (sec < 90) return sec.toFixed(1) + ' 秒';
  return (sec / 60).toFixed(2) + ' 分';
}
function fmtNum(n){
  return n.toLocaleString('en-US');
}

/* ---------------- 左侧天体列表 ---------------- */
function addSection(title){
  const d = document.createElement('div');
  d.className = 'sec';
  d.textContent = title;
  bodyListEl.appendChild(d);
}
function addItem(b, isMoon){
  const d = document.createElement('div');
  d.className = 'item' + (isMoon ? ' moon' : '') + (b.key === selectedKey ? ' active' : '');
  d.dataset.key = b.key;
  d.innerHTML = `<span class="swatch" style="color:${b.def.color};background:${b.def.color}"></span>` +
                `<span class="nm">${b.def.cn}</span><span class="en">${b.def.en}</span>`;
  bodyListEl.appendChild(d);
}

function buildList(){
  bodyListEl.innerHTML = '';
  addSection('恒星');
  addItem(sunBody, false);
  addSection('行星');
  for (const b of planetBodies){
    if (b.kind === 'dwarf') continue;
    addItem(b, false);
    for (const m of moonBodies){
      if (m.parentKey === b.key) addItem(m, true);
    }
  }
  addSection('矮行星');
  for (const b of planetBodies){
    if (b.kind !== 'dwarf') continue;
    addItem(b, false);
    for (const m of moonBodies){
      if (m.parentKey === b.key) addItem(m, true);
    }
  }
  addSection('彗星');
  addItem(halleyBody, false);
}

function staticRowsFor(b){
  const d = b.def;
  const rows = [];
  rows.push(['赤道半径', fmtNum(d.radiusKm) + ' km']);
  rows.push(['质量', d.mass]);
  if (b.kind === 'moon') rows.push(['母星', b.parent.def.cn]);
  if (b.kind === 'moon'){
    rows.push(['公转周期', d.P + ' 天' + (d.P < 0 ? '（逆行）' : '')]);
  } else if (b.kind === 'comet'){
    rows.push(['公转周期', '75.32 年']);
  } else {
    rows.push(['公转周期', d.period]);
  }
  if (d.moons !== undefined) rows.push(['卫星数', d.moons]);
  rows.push(['表面温度', d.temp]);

  if (b.kind === 'moon'){
    rows.push(['轨道偏心率', '≈ 0（按圆轨道）']);
    rows.push(['轨道倾角', d.inc + '°']);
  } else if (b.kind === 'comet'){
    rows.push(['轨道偏心率', d.e.toFixed(5)]);
    rows.push(['轨道倾角', d.inc.toFixed(2) + '°（逆行）']);
  } else if (b.kind === 'star'){
    rows.push(['轨道偏心率', '—']);
    rows.push(['轨道倾角', '—']);
  } else {
    rows.push(['轨道偏心率', d.el[1].toFixed(5)]);
    const inc = Math.abs(d.el[2]) < 0.005 ? 0 : d.el[2];
    rows.push(['轨道倾角', inc.toFixed(2) + '°']);
  }
  rows.push(['转轴倾角', d.tiltText || '—']);
  rows.push(['大气', d.atmo]);
  return rows;
}

function liveRowsFor(b){
  if (b.kind === 'star'){
    return [
      ['与地球距离', 'lv0'],
      ['光行时', 'lv1'],
      ['自转周期', '25.38 天'],
      ['恒星质量', '1.989×10³⁰ kg']
    ];
  }
  if (b.kind === 'moon'){
    return [
      ['日心距离', 'lv0'],
      ['黄经 / 黄纬', 'lv1'],
      ['与地球距离', 'lv2'],
      ['光行时', 'lv3'],
      ['距母星', 'lv4'],
      ['轨道速度', 'lv5']
    ];
  }
  return [
    ['日心距离', 'lv0'],
    ['黄经 / 黄纬', 'lv1'],
    ['与地球距离', 'lv2'],
    ['光行时', 'lv3'],
    ['近日点 / 远日点', 'lv4'],
    ['当前轨道速度', 'lv5']
  ];
}

function renderInfoPanel(){
  const b = bodyByKey[selectedKey];
  if (!b) return;
  const d = b.def;
  let tag = KEY_TAGS[b.kind] || '天体';
  if (b.kind === 'moon') tag = b.parent.def.cn + ' · 卫星';

  let html = `<div class="info-head">
    <div class="info-orb" style="background:radial-gradient(circle at 34% 32%, #ffffff, ${d.color} 34%, #05070c 88%)"></div>
    <div>
      <div class="info-title">${d.cn}</div>
      <div class="info-en">${d.en}</div>
      <div class="info-tag">${tag}</div>
    </div>
  </div>`;

  html += `<div class="sect"><div class="sect-t">实时数据</div>`;
  for (const [k, id] of liveRowsFor(b)){
    if (id.startsWith('lv')){
      html += `<div class="row"><span class="k">${k}</span><span class="v" id="${id}">—</span></div>`;
    } else {
      html += rowHTML(k, id);
    }
  }
  html += `</div>`;

  html += `<div class="sect"><div class="sect-t">物理参数</div>`;
  for (const [k, v] of staticRowsFor(b)) html += rowHTML(k, v);
  html += `</div>`;

  html += `<div class="sect"><div class="sect-t">简介</div><div class="desc">${d.desc}</div></div>`;
  html += `<div class="warn-chip" id="extrapChip">已超出根数有效区间（1800–2050 年，外推结果）</div>`;
  html += `<div class="foot-note" id="scaleNote">距离按 r<sup>0.62</sup> 的径向幂律压缩显示，以便同屏观察内外行星；黄经、黄纬、轨道相位与周期均由开普勒方程实时解算，角位置未作近似。</div>`;
  infoEl.innerHTML = html;
  updateInfoValues();
}

let lastInfoUpdate = 0;
function updateInfoValues(){
  const b = bodyByKey[selectedKey];
  if (!b) return;
  const set = (i, t) => {
    const el = document.getElementById('lv' + i);
    if (el) el.textContent = t;
  };

  if (b.kind === 'star'){
    const dist = b.distanceToEarth;
    set(0, fmtAU(dist));
    set(1, fmtLight(dist));
  } else {
    const r = Math.max(b.rAU, 1e-9);
    set(0, fmtAU(r));
    const lon = ((Math.atan2(b.au[1], b.au[0]) / DEG) + 360) % 360;
    const lat = Math.asin(clamp(b.au[2] / r, -1, 1)) / DEG;
    set(1, lon.toFixed(2) + '° / ' + (lat >= 0 ? '+' : '') + lat.toFixed(2) + '°');
    const dist = b.distanceToEarth;
    set(2, fmtAU(dist));
    set(3, fmtLight(dist));

    if (b.kind === 'moon'){
      set(4, fmtNum(b.def.aKm) + ' km');
      const v = TAU * b.def.aKm / (Math.abs(b.def.P) * 86400);
      set(5, v.toFixed(2) + ' km/s');
    } else {
      const peri = b.a * (1 - b.e);
      const apo = b.a * (1 + b.e);
      set(4, peri.toFixed(3) + ' / ' + apo.toFixed(3) + ' AU');
      const v = 29.7847 * Math.sqrt(Math.max(0, 2 / r - 1 / b.a));
      set(5, v.toFixed(2) + ' km/s');
    }
  }

  const chip = document.getElementById('extrapChip');
  if (chip){
    const y = jdToDate(simJD).getUTCFullYear();
    chip.classList.toggle('on', y < 1800 || y > 2050);
  }
  const note = document.getElementById('scaleNote');
  if (note){
    note.innerHTML = toggles.real
      ? '当前为<b>真实距离比例</b>（1 AU = 34 显示单位），内外行星的相对距离不再压缩。角位置与轨道相位仍为开普勒方程实时求解的真值。'
      : '距离按 r<sup>0.62</sup> 的径向幂律压缩显示，以便同屏观察内外行星；黄经、黄纬、轨道相位与周期均由开普勒方程实时解算，角位置未作近似。';
  }
}

function setSelected(key){
  selectedKey = key;
  updateListActive();
  renderInfoPanel();
}

/* ---------------- 日期 / 速度 ---------------- */
function updateDateUI(){
  const y = jdToDate(simJD).getUTCFullYear();
  const out = (y < 1800 || y > 2050);
  dateEl.innerHTML = fmtDate(simJD) + '<span class="utc">UTC</span>' +
    (out ? '<span class="extrap">外推</span>' : '');
  dateEl.style.color = out ? '#ffcf9a' : '#eef4ff';
  speedLabelEl.textContent = fmtSpeed(speedFromSlider(speedV)) + (playing ? '' : ' · 已暂停');
}

/* ---------------- 交互 ---------------- */
const pointers = new Map();
let dragging = false;
let movedPx = 0;
let lastX = 0, lastY = 0;
let pinchStart = 0;
let pinchStartDist = 0;
let pinchMode = false;

function minDistForFocus(){
  if (camState.focus === 'sun') return 6.8;
  const b = bodyByKey[camState.focus] || sunBody;
  return Math.max(b.displayR * 1.55, 0.30);
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1){
    dragging = true;
    movedPx = 0;
    lastX = e.clientX;
    lastY = e.clientY;
    pinchMode = false;
    canvas.classList.add('dragging');
  } else if (pointers.size === 2){
    const arr = [...pointers.values()];
    pinchStart = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
    pinchStartDist = camState.targetDist;
    pinchMode = true;
    movedPx = 999;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size >= 2){
    const arr = [...pointers.values()];
    const d = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
    if (pinchStart > 0){
      camState.targetDist = clamp(pinchStartDist * (pinchStart / Math.max(d, 1)), minDistForFocus(), 2400);
    }
    return;
  }

  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  movedPx += Math.abs(dx) + Math.abs(dy);
  camState.yaw -= dx * 0.0048;
  camState.pitch = clamp(camState.pitch - dy * 0.0042, -1.45, 1.45);
  camState.targetYaw = camState.yaw;
  camState.targetPitch = camState.pitch;
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size === 0){
    dragging = false;
    pinchMode = false;
    canvas.classList.remove('dragging');
  }
}
canvas.addEventListener('pointerup', (e) => {
  const wasSingle = pointers.size === 1;
  endPointer(e);
  if (wasSingle && movedPx < 7 && !pinchMode){
    const b = pickBody(e.clientX, e.clientY);
    if (b) focusBody(b.key);
  }
});
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = Math.exp(e.deltaY * 0.00115);
  camState.targetDist = clamp(camState.targetDist * factor, minDistForFocus(), 2400);
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space'){
    e.preventDefault();
    togglePlay();
  } else if (e.code === 'ArrowLeft'){
    e.preventDefault();
    speedV = clamp(speedV - 3, -100, 100);
    speedEl.value = speedV;
    updateDateUI();
  } else if (e.code === 'ArrowRight'){
    e.preventDefault();
    speedV = clamp(speedV + 3, -100, 100);
    speedEl.value = speedV;
    updateDateUI();
  } else if (e.key === 'h' || e.key === 'H'){
    uiHidden = !uiHidden;
    document.body.classList.toggle('hidden-ui', uiHidden);
  }
});

function togglePlay(){
  playing = !playing;
  playBtn.textContent = playing ? '❚❚' : '▶';
  updateDateUI();
}
playBtn.addEventListener('click', togglePlay);

speedEl.addEventListener('input', () => {
  speedV = parseFloat(speedEl.value);
  updateDateUI();
});

document.getElementById('nowBtn').addEventListener('click', () => {
  simJD = jdNow();
  updateDateUI();
});

for (const el of document.querySelectorAll('.tgl')){
  el.addEventListener('click', () => {
    const k = el.dataset.k;
    if (k === 'real'){
      toggles.real = !toggles.real;
      compressTarget = toggles.real ? COMPRESS_TRUE : COMPRESS_BASE;
      el.classList.toggle('on', toggles.real);
      updateInfoValues();
      return;
    }
    toggles[k] = !toggles[k];
    el.classList.toggle('on', toggles[k]);
    if (k === 'labels' && !toggles.labels){
      for (const b of bodies) if (lblEls[b.key]) lblEls[b.key].style.opacity = '0';
    }
  });
}

/* =========================================================================
   主循环
   ========================================================================= */
let lastFrame = performance.now();
let lastDateUI = 0;
let lastInfoUI = 0;
let booted = false;
let fpsAvg = 60;

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.06, Math.max(0.0005, (now - lastFrame) / 1000));
  lastFrame = now;
  if (dt > 0) fpsAvg = fpsAvg * 0.94 + (1/dt) * 0.06;

  const daysPerSec = speedFromSlider(speedV);
  const dtDays = playing ? dt * daysPerSec : 0;
  simJD += dtDays;

  compress += (compressTarget - compress) * (1 - Math.exp(-dt * 9));
  if (Math.abs(compressTarget - compress) < 2e-4) compress = compressTarget;

  updateBodies(dtDays);
  const cam = computeCamera(dt);
  render(cam);
  updateOverlays(cam);

  if (now - lastDateUI > 80){
    updateDateUI();
    lastDateUI = now;
  }
  if (now - lastInfoUI > 120){
    updateInfoValues();
    lastInfoUI = now;
  }

  if (!booted){
    booted = true;
    setTimeout(fadeBoot, 220);
  }
}

/* =========================================================================
   初始化
   ========================================================================= */
buildList();
buildLabels();
setSelected('sun');
speedEl.value = speedV;
playBtn.textContent = '❚❚';
updateDateUI();
function fadeBoot(){
  const b = document.getElementById('boot');
  if (!b || b.classList.contains('gone')) return;
  b.classList.add('gone');
  setTimeout(() => { b.style.display = 'none'; }, 1300);
}
updateBodies(0);
setTimeout(fadeBoot, 1400);
requestAnimationFrame(frame);

/* =========================================================================
   调试接口（不影响正常使用）
   ========================================================================= */
window.__solar = {
  gl,
  canvas,
  bodies: bodyByKey,
  camera: camState,
  toggles,
  get jd(){ return simJD; },
  get fps(){ return fpsAvg; },
  get compress(){ return compress; },
  get selected(){ return selectedKey; },
  setJD(jd){
    simJD = jd;
    updateBodies(0);
    updateDateUI();
    updateInfoValues();
  },
  setIso(iso){
    const ms = Date.parse(iso);
    if (!isNaN(ms)) this.setJD(ms / 86400000 + 2440587.5);
  },
  setPlaying(v){
    playing = !!v;
    playBtn.textContent = playing ? '❚❚' : '▶';
    updateDateUI();
  },
  setSpeed(v){
    speedV = clamp(v, -100, 100);
    speedEl.value = speedV;
    updateDateUI();
  },
  setFocus(k){ focusBody(k); },
  setCompress(c){ compress = c; compressTarget = c; },
  setToggle(k, v){
    toggles[k] = !!v;
    const el = document.querySelector(`.tgl[data-k="${k}"]`);
    if (el) el.classList.toggle('on', !!v);
    if (k === 'real') compressTarget = v ? COMPRESS_TRUE : COMPRESS_BASE;
  },
  setCamera(yaw, pitch, dist){
    if (yaw !== undefined){ camState.yaw = yaw; camState.targetYaw = yaw; }
    if (pitch !== undefined){ camState.pitch = pitch; camState.targetPitch = pitch; }
    if (dist !== undefined){ camState.dist = dist; camState.targetDist = dist; }
  },
  renderOnce(){
    updateBodies(0);
    const cam = computeCamera(0.016);
    render(cam);
    updateOverlays(cam);
    updateInfoValues();
    updateDateUI();
  },
  readPixel(x, y){
    this.renderOnce();
    const px = gl.drawingBufferWidth;
    const py = gl.drawingBufferHeight;
    const xx = clamp(Math.round(x * (px / window.innerWidth)), 0, px - 1);
    const yy = clamp(py - 1 - Math.round(y * (py / window.innerHeight)), 0, py - 1);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const b = new Uint8Array(4);
    gl.readPixels(xx, yy, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
    return Array.from(b, v => +(v / 255).toFixed(4));
  },
  snapshot(){
    this.renderOnce();
    return canvas.toDataURL('image/png');
  }
};
</script>
