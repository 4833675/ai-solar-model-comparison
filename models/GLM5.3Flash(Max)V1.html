<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太阳系 · Solar System —— 开普勒运动模型</title>
<style>
  :root{
    --glass: rgba(8,12,20,.55);
    --line: rgba(255,255,255,.09);
    --txt: rgba(235,240,250,.92);
    --dim: rgba(160,175,200,.66);
    --acc: #ffd9a0;
    --mono: "SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  canvas#gl.drag{cursor:grabbing}
  .hud{position:fixed;z-index:5;pointer-events:none}
  .panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(16px) saturate(1.35);-webkit-backdrop-filter:blur(16px) saturate(1.35);
    box-shadow:0 8px 32px rgba(0,0,0,.45)}
  #brand{top:18px;left:20px;padding:14px 18px 13px}
  #brand h1{font-size:17px;font-weight:600;letter-spacing:.14em}
  #brand h1 b{color:var(--acc);font-weight:700}
  #brand p{margin-top:5px;font-size:11px;color:var(--dim);letter-spacing:.08em}
  #timebox{top:18px;right:20px;padding:12px 18px;text-align:right}
  #simdate{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  #simsub{margin-top:3px;font-size:10.5px;color:var(--dim);font-family:var(--mono)}
  #focusbox{left:20px;bottom:96px;width:256px;padding:14px 16px;opacity:0;transform:translateY(8px);
    transition:opacity .45s ease,transform .45s ease}
  #focusbox.show{opacity:1;transform:translateY(0)}
  #fname{font-size:16px;font-weight:650}
  #fname span{color:var(--dim);font-size:11.5px;margin-left:7px;letter-spacing:.1em;font-weight:500}
  #ftype{margin-top:2px;font-size:10.5px;color:var(--acc);letter-spacing:.22em}
  #fstats{margin-top:9px;border-top:1px solid var(--line);padding-top:9px;display:grid;gap:4px}
  .frow{display:flex;justify-content:space-between;font-size:11.5px}
  .frow i{font-style:normal;color:var(--dim)}
  .frow em{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums}
  #dock{bottom:18px;left:50%;transform:translateX(-50%);padding:10px 14px;display:flex;align-items:center;gap:10px;pointer-events:auto}
  .btn{pointer-events:auto;height:34px;min-width:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--txt);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;
    transition:background .18s,border-color .18s,transform .12s;letter-spacing:.04em}
  .btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}
  .btn:active{transform:scale(.94)}
  .btn.on{border-color:rgba(255,217,160,.55);color:var(--acc);background:rgba(255,217,160,.10)}
  #speed{-webkit-appearance:none;appearance:none;width:150px;height:3px;border-radius:2px;background:rgba(255,255,255,.16);outline:none;cursor:pointer}
  #speed::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 10px rgba(255,217,160,.85)}
  #speed::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--acc);border:none}
  #speedval{font-family:var(--mono);font-size:11px;color:var(--acc);min-width:78px;font-variant-numeric:tabular-nums}
  .sep{width:1px;height:22px;background:var(--line)}
  .tg{height:28px;padding:0 10px;font-size:11px;min-width:0}
  #rail{right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;pointer-events:auto}
  .chip{pointer-events:auto;padding:6px 11px;border-radius:9px;border:1px solid transparent;background:rgba(8,12,20,.42);
    backdrop-filter:blur(8px);color:var(--dim);font-size:11.5px;cursor:pointer;text-align:right;letter-spacing:.08em;
    transition:all .2s;line-height:1}
  .chip:hover{color:var(--txt);background:rgba(30,40,60,.65);transform:translateX(-4px)}
  .chip.on{color:var(--acc);border-color:rgba(255,217,160,.45);background:rgba(60,48,26,.5)}
  #hint{bottom:76px;left:50%;transform:translateX(-50%);font-size:10.5px;color:rgba(160,175,200,.5);
    letter-spacing:.12em;white-space:nowrap}
  .lbl{position:fixed;z-index:4;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;
    text-shadow:0 0 8px rgba(0,0,0,.95);will-change:transform,opacity}
  .lbl::after{content:"";width:1px;height:10px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.5))}
  .lbl b{font-size:11px;font-weight:500;letter-spacing:.18em;color:rgba(240,245,255,.92);white-space:nowrap}
  .lbl s{text-decoration:none;font-family:var(--mono);font-size:8.5px;color:rgba(170,185,210,.6);white-space:nowrap}
  .lbl:hover b{color:var(--acc)}
  #fps{position:fixed;bottom:20px;right:20px;z-index:5;font-family:var(--mono);font-size:10px;
    color:rgba(160,175,200,.38);pointer-events:none}
  #veil{position:fixed;inset:0;z-index:50;background:#010208;display:flex;flex-direction:column;align-items:center;
    justify-content:center;transition:opacity 1s ease;gap:18px}
  #veil.hide{opacity:0;pointer-events:none}
  #veil h2{font-size:15px;font-weight:300;letter-spacing:.55em;color:#cfe0ff;padding-left:.55em;animation:pulse 2.2s ease-in-out infinite}
  #veil p{font-size:11px;color:rgba(140,160,195,.5);letter-spacing:.2em}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  #errcard{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(2,4,10,.93)}
  #errcard .inner{max-width:560px;max-height:80vh;padding:28px 32px;background:#0c111d;border:1px solid rgba(255,80,80,.35);border-radius:16px;overflow:auto}
  #errcard h3{color:#ff9a8a;font-size:15px;margin-bottom:10px;letter-spacing:.1em}
  #errcard pre{font-size:11px;color:#c9d4e8;white-space:pre-wrap;font-family:var(--mono)}
  @media(max-width:900px){#focusbox,#hint,#fps{display:none}#speed{width:90px}}

<body>
<canvas id="gl"></canvas>

<div class="hud panel" id="brand"><h1>太阳系 <b>SOLAR SYSTEM</b></h1><p>基于 J2000 开普勒轨道根数 · WebGL2 实时渲染</p></div>
<div class="hud panel" id="timebox"><div id="simdate">----.--.-- --:--:--</div><div id="simsub">JD ——</div></div>
<div class="hud panel" id="focusbox"><div id="fname"></div><div id="ftype"></div><div id="fstats"></div></div>
<div class="hud" id="hint">左键拖动旋转 · 滚轮缩放 · 点击天体聚焦 · 空格 暂停 · ←/→ 调速 · R 复位视角 · O 轨道 / L 标签 / B 带 / G 网格</div>

<div class="hud panel" id="dock">
  <button class="btn" id="bToday" title="时间回到现在">⟲ 今日</button>
  <button class="btn" id="bRev" title="时间反向">◀ 反向</button>
  <button class="btn" id="bPlay" title="暂停 / 继续">
    <svg id="icPlay" width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="3.4" height="10" rx="1" fill="currentColor"/><rect x="7.6" y="1" width="3.4" height="10" rx="1" fill="currentColor"/></svg>
    <svg id="icPause" width="12" height="12" viewBox="0 0 12 12" style="display:none"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>
  </button>
  <input type="range" id="speed" min="0" max="1000" value="430">
  <span id="speedval">1 天/秒</span>
  <div class="sep"></div>
  <button class="btn tg on" id="tOrbit">轨道</button>
  <button class="btn tg on" id="tLabel">标签</button>
  <button class="btn tg on" id="tBelt">带</button>
  <button class="btn tg" id="tGrid">网格</button>
</div>

<div id="rail"></div>
<div id="fps">-- FPS</div>
<div id="veil"><h2>SOLAR SYSTEM</h2><p>正在编译着色器 · 构建行星系统</p></div>
<div id="errcard"><div class="inner"><h3>初始化失败</h3><pre id="errmsg"></pre></div></div>

<script>
"use strict";
/* ============================================================================
   太阳系运动模型（单文件 · 纯 WebGL2）
   物理：JPL J2000 近似轨道根数（含世纪变化率），牛顿迭代解开普勒方程；
        行星自转/轴倾角、主要卫星、哈雷彗星逆行轨道。
   渲染：HDR RGBA16F 场景 → 提亮 → 双尺度高斯泛光 → ACES 色调映射合成，
        对数深度缓冲跨越巨大尺度；程序化 3D 噪声表面、大气边缘散射、
        光环双向阴影（环影落球/球影落环）、日冕、银河背景、彗尾、粒子带、镜头光晕。
   ============================================================================ */

const TAU=Math.PI*2, D2R=Math.PI/180;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;

function fatal(msg){
  document.getElementById('errmsg').textContent=msg;
  document.getElementById('errcard').style.display='flex';
  throw new Error(msg);
}
window.addEventListener('error',e=>{
  try{document.getElementById('errmsg').textContent='运行时错误：'+e.message+'\n'+(e.error&&e.error.stack||'');
      document.getElementById('errcard').style.display='flex';}catch(_){}
});
window.addEventListener('unhandledrejection',e=>{
  try{document.getElementById('errmsg').textContent='未处理拒绝：'+(e.reason&&e.reason.message||e.reason);
      document.getElementById('errcard').style.display='flex';}catch(_){}
});

/* ---------------- 数学：mat4(col-major) 与 mat3 ---------------- */
function mPersp(fovy,aspect,n,f){
  const t=1/Math.tan(fovy/2), o=new Float32Array(16);
  o[0]=t/aspect;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;
}
function mLook(e,c,up){
  let fx=c[0]-e[0],fy=c[1]-e[1],fz=c[2]-e[2];
  const fl=Math.hypot(fx,fy,fz)||1e-9;fx/=fl;fy/=fl;fz/=fl;
  let rx=fy*up[2]-fz*up[1],ry=fz*up[0]-fx*up[2],rz=fx*up[1]-fy*up[0];
  const rl=Math.hypot(rx,ry,rz)||1e-9;rx/=rl;ry/=rl;rz/=rl;
  const ux=ry*fz-rz*fy,uy=rz*fx-rx*fz,uz=rx*fy-ry*fx;
  return new Float32Array([rx,ux,-fx,0, ry,uy,-fy,0, rz,uz,-fz,0,
    -(rx*e[0]+ry*e[1]+rz*e[2]), -(ux*e[0]+uy*e[1]+uz*e[2]), fx*e[0]+fy*e[1]+fz*e[2], 1]);
}
function rotX(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([1,0,0, 0,c,s, 0,-s,c]);}
function rotY(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([c,0,-s, 0,1,0, s,0,c]);}
function m3mul(a,b){return new Float32Array([
  a[0]*b[0]+a[3]*b[1]+a[6]*b[2], a[1]*b[0]+a[4]*b[1]+a[7]*b[2], a[2]*b[0]+a[5]*b[1]+a[8]*b[2],
  a[0]*b[3]+a[3]*b[4]+a[6]*b[5], a[1]*b[3]+a[4]*b[4]+a[7]*b[5], a[2]*b[3]+a[5]*b[4]+a[8]*b[5],
  a[0]*b[6]+a[3]*b[7]+a[6]*b[8], a[1]*b[6]+a[4]*b[7]+a[7]*b[8], a[2]*b[6]+a[5]*b[7]+a[8]*b[8]]);}
function m3v(m,v){return [m[0]*v[0]+m[3]*v[1]+m[6]*v[2], m[1]*v[0]+m[4]*v[1]+m[7]*v[2], m[2]*v[0]+m[5]*v[1]+m[8]*v[2]];}

/* ---------------- 天文计算 ---------------- */
const AU_W=62.0;
const jdFromUnix=ms=>ms/86400000+2440587.5;

/* JPL 近似根数：a(AU) e i(deg) L(deg) ϖ(deg) Ω(deg)，各带世纪变化率 */
const EL={
 mercury:[0.38709927,0.00000037, 0.20563593,0.00001906, 7.00497902,-0.00594749, 252.25032350,149472.67411175, 77.45779628,0.16047689, 48.33076593,-0.12534081],
 venus:  [0.72333566,0.00000390, 0.00677672,-0.00004107, 3.39467605,-0.00078890, 181.97909950,58517.81538729, 131.60246718,0.00268329, 76.67984255,-0.27769418],
 earth:  [1.00000261,0.00000562, 0.01671123,-0.00004392, -0.00001531,-0.01294668, 100.46457166,35999.37244981, 102.93768193,0.32327364, 0,0],
 mars:   [1.52371034,0.00001847, 0.09339410,0.00007882, 1.84969142,-0.00813131, -4.55343205,19140.30268499, -23.94362959,0.44441088, 49.55953891,-0.29257343],
 jupiter:[5.20288700,-0.00011607, 0.04838624,-0.00013253, 1.30439695,-0.00183714, 34.39644051,3034.74612775, 14.72847983,0.21252668, 100.47390909,0.20469106],
 saturn: [9.53667594,-0.00125060, 0.05386179,-0.00050991, 2.48599187,0.00193609, 49.95424423,1222.49362201, 92.59887831,-0.41897216, 113.66242448,-0.28867794],
 uranus: [19.18916464,-0.00196176, 0.04725744,-0.00004397, 0.77263783,-0.00242939, 313.23810451,428.48202785, 170.95427630,0.40805281, 74.01692503,0.04240589],
 neptune:[30.06992276,0.00026291, 0.00859048,0.00005105, 1.77004347,0.00035372, -55.12002969,218.45945325, 44.96476227,-0.32241464, 131.78422574,-0.00508664]
};
/* 根数随时间演化（仅提取标量，不旋转） */
function elemsAt(el,days){
  const T=days/36525;
  return [el[0]+el[1]*T, el[2]+el[3]*T, (el[4]+el[5]*T)*D2R,
          (el[6]+el[7]*T)*D2R, (el[8]+el[9]*T)*D2R, (el[10]+el[11]*T)*D2R];
  /* 依次：a, e, i(rad), L(rad), ϖ(rad), Ω(rad) */
}
function solveKepler(M,e){
  M=M%TAU; if(M<0)M+=TAU;
  let E=M+(e*Math.sin(M))*(1+e*Math.cos(M));
  for(let k=0;k<28;k++){
    const f=E-e*Math.sin(E)-M;
    if(Math.abs(f)<1e-9)break;
    E-=clamp(f/(1-e*Math.cos(E)),-.85,.85);
  }
  return E;
}
/* 轨道平面坐标 → 黄道坐标（含 ω,i,Ω），映射到世界系 y-up */
function orbToEcl(xp,yp,a_,e_,i_,L_,wb_,O_,out){
  const argp=wb_-O_;
  const cw=Math.cos(argp),sw=Math.sin(argp),cO=Math.cos(O_),sO=Math.sin(O_),ci=Math.cos(i_),si=Math.sin(i_);
  const X=(cw*cO-sw*sO*ci)*xp+(-sw*cO-cw*sO*ci)*yp;
  const Y=(cw*sO+sw*cO*ci)*xp+(-sw*sO+cw*cO*ci)*yp;
  const Z=(sw*si)*xp+(cw*si)*yp;
  out[0]=X*AU_W;out[1]=Z*AU_W;out[2]=-Y*AU_W;
}
/* 行星位置：写入 wp[xyz]，并返回黄道距离 r(AU) */
function keplerPos(el,days,wp){
  const [a,e,i,L,wb,O]=elemsAt(el,days);
  const M=L-wb, E=solveKepler(M,e);
  const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(Math.max(1-e*e,0))*Math.sin(E);
  orbToEcl(xp,yp,a,e,i,L,wb,O,wp);
  return Math.hypot(wp[0]/AU_W,wp[1]/AU_W,wp[2]/AU_W);
}
/* 轨道线上一点（E 直接给定） */
function ellipsePoint(el,days,E,wp){
  const [a,e,i,L,wb,O]=elemsAt(el,days);
  const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(Math.max(1-e*e,0))*Math.sin(E);
  orbToEcl(xp,yp,a,e,i,L,wb,O,wp);
}
const MU_SUN=1.32712440018e11, AU_KM=1.495978707e8;
const visViva=(rAU,aAU)=>Math.sqrt(MU_SUN*(2/(rAU*AU_KM)-1/(aAU*AU_KM)));

/* ---------------- 天体定义 ---------------- */
const SUN={key:'sun',name:'太阳',en:'SOL',type:'G 型主序星 · YELLOW DWARF',r:6.4,spin:25.4,
  facts:{半径:'696,340 km',质量:'1.989×10³⁰ kg',表面:'约 5,505 °C',自转:'25.4 天'}};
const BODIES=[
 {key:'mercury',name:'水星',en:'MERCURY',type:'岩质行星 · TERRESTRIAL',kind:0,r:.52,spin:58.646,tilt:.03,
  facts:{半径:'2,439 km',公转:'87.97 天',自转:'58.6 天',轨倾角:'7.00°'}},
 {key:'venus',name:'金星',en:'VENUS',type:'岩质行星 · GREENHOUSE WORLD',kind:1,r:.80,spin:-243.02,tilt:177.4,
  facts:{半径:'6,051 km',公转:'224.7 天',自转:'243 天（逆行）',大气:'CO₂ · 96%'},atmo:{col:[.95,.82,.55],pw:2.4,it:1.3,ss:.5}},
 {key:'earth',name:'地球',en:'EARTH',type:'宜居行星 · PALE BLUE DOT',kind:2,r:.86,spin:.99727,tilt:23.44,
  facts:{半径:'6,371 km',公转:'365.26 天',自转:'23.93 小时',卫星:'1 颗'},atmo:{col:[.28,.52,1.],pw:2.6,it:1.5,ss:1},cloud:true},
 {key:'mars',name:'火星',en:'MARS',type:'岩质行星 · RED PLANET',kind:3,r:.63,spin:1.026,tilt:25.19,
  facts:{半径:'3,390 km',公转:'687 天',卫星:'2 颗',特征:'奥林帕斯山 21km'},atmo:{col:[.85,.6,.45],pw:3.,it:.55,ss:.6}},
 {key:'jupiter',name:'木星',en:'JUPITER',type:'气态巨行星 · GAS GIANT',kind:4,r:3.3,spin:.41354,tilt:3.13,
  facts:{半径:'69,911 km',公转:'11.86 年',卫星:'95 颗',大红斑:'约 350 年历史'},
  atmo:{col:[.9,.75,.55],pw:3.4,it:.5,ss:0}},
 {key:'saturn',name:'土星',en:'SATURN',type:'气态巨行星 · RINGED GIANT',kind:5,r:2.85,spin:.4440,tilt:26.73,ring:[3.6,6.3],
  facts:{半径:'58,232 km',公转:'29.46 年',卫星:'146 颗',光环:'厚仅数十米'},
  atmo:{col:[.92,.8,.58],pw:3.4,it:.45,ss:0}},
 {key:'uranus',name:'天王星',en:'URANUS',type:'冰巨星 · SIDEWAYS ICE GIANT',kind:6,r:1.5,spin:-.71833,tilt:97.77,ring:[2.05,2.72],
  facts:{半径:'25,362 km',公转:'84.01 年',自转:'17.2 时（逆行）',倾角:'97.8°'},
  atmo:{col:[.6,.88,.9],pw:3.4,it:.5,ss:0}},
 {key:'neptune',name:'海王星',en:'NEPTUNE',type:'冰巨星 · WINDY BLUE',kind:7,r:1.46,spin:.6713,tilt:28.32,
  facts:{半径:'24,622 km',公转:'164.8 年',风速:'2,100 km/h',卫星:'16 颗'},
  atmo:{col:[.4,.55,1.],pw:3.2,it:.6,ss:0}}
];
for(const b of BODIES){b.el=EL[b.key];b.wp=new Float32Array(3);b.rAU=1;b.aAU=EL[b.key][0];
  b.spinAng=0;b.tiltM=rotX(b.tilt*D2R);}

const MOONS=[
 {parent:'earth',key:'moon',name:'月球',en:'MOON',kind:8,r:.23,dist:2.7,P:27.3217,incl:5.1,ph:2.2,eq:false,seed:7.7,realR:'1,737 km'},
 {parent:'jupiter',key:'io',name:'木卫一',en:'IO',kind:9,r:.22,dist:5.2,P:1.769,incl:.04,ph:.5,seed:1.7,tint:[.92,.82,.36],eq:true,realR:'1,822 km'},

const COMET={key:'halley',a:17.834,e:.96714,i:162.26*D2R,O:58.42*D2R,w:111.33*D2R,tp:2446470.95,
  wp:[0,0,0],rAU:17.834,aAU:17.834,r:0,name:'哈雷彗星',en:'HALLEY'};
function cometUpdate(days){
  const nD=360/Math.pow(COMET.a,1.5)/365.256/D2R;
  const E=solveKepler(nD*(days+2451545.-COMET.tp),COMET.e);
  const xp=COMET.a*(Math.cos(E)-COMET.e), yp=COMET.a*Math.sqrt(1-COMET.e*COMET.e)*Math.sin(E);
  const cw=Math.cos(COMET.w),sw=Math.sin(COMET.w),cO=Math.cos(COMET.O),sO=Math.sin(COMET.O),
        ci=Math.cos(COMET.i),si=Math.sin(COMET.i);
  const X=(cw*cO-sw*sO*ci)*xp+(-sw*cO-cw*sO*ci)*yp;
  const Y=(cw*sO+sw*cO*ci)*xp+(-sw*sO+cw*cO*ci)*yp;
  const Z=(sw*si)*xp+(cw*si)*yp;
  COMET.wp[0]=X*AU_W;COMET.wp[1]=Z*AU_W;COMET.wp[2]=-Y*AU_W;
  COMET.r=COMET.rAU=Math.hypot(X,Y,Z);
}

const NOISE=`
vec3 hash33(vec3 p){ p=fract(p*vec3(.1031,.1030,.0973)); p+=dot(p,p.yxz+33.33); return fract((p.xxy+p.yxx)*p.zyx)-.5; }
float vnoise(vec3 p){

  vec3 u=f*f*(3.-2.*f);
  float a=dot(hash33(i+vec3(0.,0.,0.)),f-vec3(0.,0.,0.));
  float b=dot(hash33(i+vec3(1.,0.,0.)),f-vec3(1.,0.,0.));
  float c=dot(hash33(i+vec3(0.,1.,0.)),f-vec3(0.,1.,0.));
  float d=dot(hash33(i+vec3(1.,1.,0.)),f-vec3(1.,1.,0.));
  float e=dot(hash33(i+vec3(0.,0.,1.)),f-vec3(0.,0.,1.));
  float f1=dot(hash33(i+vec3(1.,0.,1.)),f-vec3(1.,0.,1.));
  float g=dot(hash33(i+vec3(0.,1.,1.)),f-vec3(0.,1.,1.));
  float h=dot(hash33(i+vec3(1.,1.,1.)),f-vec3(1.,1.,1.));
  return mix(mix(mix(a,b,u.x),mix(c,d,u.x),u.y),mix(mix(e,f1,u.x),mix(g,h,u.x),u.y),u.z)*1.4;
}
float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec3(11.7); a*=.5; } return s; }
float fbm3(vec3 p){ float a=.5,s=0.; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=p*2.11+vec3(5.3); a*=.5; } return s; }
float ridge(vec3 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*(1.-abs(vnoise(p))); p=p*2.13+vec3(3.1); a*=.5; } return s; }
`;

const POST_FS=`
uniform sampler2D uTexA;uniform sampler2D uTexB;uniform sampler2D uTexC;
uniform int uMode;uniform vec2 uDir;uniform vec2 uRes;
uniform float uThresh;uniform vec2 uSunUV;uniform float uFlareStr;uniform float uAspect;
uniform float uTimeS;uniform float uExp;
in vec2 vUV;out vec4 fc;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
void main(){
  vec2 uv=vUV;
  if(uMode==0){
    vec3 c=texture(uTexA,uv).rgb;
    float l=dot(c,vec3(.2126,.7152,.0722));
    fc=vec4(c*smoothstep(uThresh,uThresh+.9,l),1.);
  }else if(uMode==1){
    vec3 s=texture(uTexA,uv).rgb*.227;
    vec2 o1=uDir*1.3846/uRes,o2=uDir*3.2308/uRes;
    s+=(texture(uTexA,uv+o1).rgb+texture(uTexA,uv-o1).rgb)*.3162;

    fc=vec4(s,1.);
  }else if(uMode==2){ fc=texture(uTexA,uv); }
  else{
    vec2 cv=uv-.5;
    float ca=dot(cv,cv)*.006;
    vec3 base=vec3(texture(uTexA,uv-cv*ca).r,texture(uTexA,uv).g,texture(uTexA,uv+cv*ca).b);
    vec3 bloom=texture(uTexB,uv).rgb+texture(uTexC,uv).rgb;
    vec3 col=base+bloom*.52;
    if(uFlareStr>.001){
      vec2 sun=uSunUV-.5;
      vec2 sv=cv-sun;
      float anis=exp(-abs(sv.y)*160./max(uAspect*.7,.5))*exp(-abs(sv.x)*9.)*uFlareStr;
      col+=vec3(1.,.85,.62)*anis*.7;
      for(int i=0;i<4;i++){
        float fi=float(i)*.38+.34;

        float gh=smoothstep(sz,sz*.22,length(gp*vec2(uAspect,1.)));

        col+=gc*gh*uFlareStr*(.13-fi*.026);

    col*=uExp;
    col=aces(col);
    col=pow(col,vec3(1./2.2));
    col*=1.-dot(cv,cv)*.72;
    col+=(h21(uv*uRes+fract(uTimeS*13.7)*571.)-.5)*.013;
    fc=vec4(col,1.);

function mkBelt(n,minA,maxA,incMax,eccMax,trojanFrac,kb){

    d[o]=a;d[o+1]=ph;d[o+2]=inc;d[o+3]=node;

function camStep(dt){
  if(CAM.idle&&!CAM.dragging)CAM.yawG+=dt*.018;
  const k=1-Math.exp(-dt*6.2);
  CAM.yaw+=(CAM.yawG-CAM.yaw)*k;
  CAM.pitch+=(CAM.pitchG-CAM.pitch)*k;
  CAM.dist+=(CAM.distG-CAM.dist)*(1-Math.exp(-dt*4.2));
  /* 目标跟随（聚焦天体平滑追踪） */
  const tp=CAM.focus===null?[0,0,0]:getWP(CAM.focus);
  CAM.tgtGoal=tp;
  const kt=1-Math.exp(-dt*5.);
  for(let i=0;i<3;i++)CAM.target[i]+=(CAM.tgtGoal[i]-CAM.target[i])*kt;
  const cp=Math.cos(CAM.pitch);
  CAM.eye=[
    CAM.target[0]+cp*Math.sin(CAM.yaw)*CAM.dist,
    CAM.target[1]+Math.sin(CAM.pitch)*CAM.dist,
    CAM.target[2]+cp*Math.cos(CAM.yaw)*CAM.dist];
}
function getWP(ref){ /* ref: SUN | BODY | MOON | COMET */
  if(ref===SUN)return [0,0,0];
  if(ref===COMET)return COMET.wp.slice();
  if(ref.parent!==undefined&&typeof ref.P==='number')return ref.wp.slice();
  return Array.from(ref.wp);
}

function dpsVal(){ return Math.pow(10,lerp(Math.log10(2e-5),Math.log10(3650),S.speedIdx)); }
function dpsText(){
  const v=dpsVal()*S.dir;
  const av=Math.abs(v);
  if(av<=3.5e-5)return '实时';
  if(av<1/1440)return (av*86400).toFixed(0)+' 秒/秒';
  if(av<1/24)return (av*1440).toFixed(1)+' 分/秒';
  if(av<1)return (av*24).toFixed(1)+' 时/秒';
  if(av<365.25)return av.toFixed(av<10?(av<3?2:1):0)+' 天/秒';
  return (av/365.25).toFixed(av/365.25<10?1:0)+' 年/秒';
}

function minZoom(){ return CAM.focus&&(CAM.focus.r||SUN.r)?(CAM.focus===SUN?SUN.r*2.1:(CAM.focus.r||.3)*2.2):.5; }

/* 屏幕投影拾取 */
const _pv=new Float32Array(16);
function tryPick(mx,my){
  const vw=cvs.clientWidth,vh=cvs.clientHeight;
  let best=null,bestD=1e9;
  const cand=[{ref:SUN,pos:[0,0,0],rad:SUN.r},
    ...BODIES.map(b=>({ref:b,pos:getWP(b),rad:b.r})),
    ...MOONS.filter(m=>true).map(m=>({ref:m,pos:m.wp.slice(),rad:m.r})),
    {ref:COMET,pos:COMET.wp.slice(),rad:1.2}];
  for(const c of cand){
    const[p,ok]=project(c.pos,vw,vh);
    if(!ok)continue;
    const d=Math.hypot(p[0]-mx,p[1]-my);
    const pxRad=c.rad/Math.max(camDist(c.pos),.01)*vh/(2*Math.tan(CAM.fov/2));
    const thr=Math.max(15,pxRad*1.3+5);
    if(d<thr&&d<bestD){bestD=d;best=c;}
  }
  if(best)setFocus(best.ref);
}
function camDist(pos){return Math.hypot(CAM.eye[0]-pos[0],CAM.eye[1]-pos[1],CAM.eye[2]-pos[2]);}
function project(p,vw,vh){
  const v=_view,o=_proj,vp=_vp;
  const x=p[0],y=p[1],z=p[2];
  const cx=vp[0]*x+vp[4]*y+vp[8]*z+vp[12];
  const cy=vp[1]*x+vp[5]*y+vp[9]*z+vp[13];
  const cw=vp[3]*x+vp[7]*y+vp[11]*z+vp[15];
  if(cw<=.01)return [[0,0],false];
  return [[(cx/cw*.5+.5)*vw,(1-(cy/cw*.5+.5))*vh],cx>-cw*1.2&&cx<cw*2.2];
}

let _view=null,_proj=null,_vp=null,_logFC=1;
function refreshVP(){
  const near=Math.max(clamp(CAM.dist*.004,.004,4.),CAM.focus&&CAM.focus.r?CAM.focus.r*.02:.05);
  const far=40000.;
  _view=mLook(CAM.eye,CAM.target,[0,1,0]);
  _proj=mPersp(CAM.fov,cvs.width/cvs.height,near,far);
  _vp=mMul(_proj,_view);
  _logFC=2./Math.log2(far+1.);
}
const tmp=[0,0,0];

function mulPV(a,b){return mMul(a,b);}
function mMul(a,b,out){
  out=out||new Float32Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++)
    out[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
  return out;
}

/* ---------------- 物理步进 ---------------- */
function stepPhysics(dtDays){
  S.jd+=dtDays*S.dir;
  const days=S.jd-2451545.;
  for(const b of BODIES){
    b.rAU=keplerPos(b.el,days,b.wp);
    b.spinAng+=dtDays*(TAU/b.spin);
  }
  for(const m of MOONS){
    const p=BODIES.find(b=>b.key===m.parent);
    const th=m.ph+m.incl*0+TAU*(days/m.P);
    const loc=[Math.cos(th)*m.dist,m.incl*D2R*Math.sin(th)*m.dist,Math.sin(th)*m.dist];
    const basis=m.eq?p.tiltM:[1,0,0,0,1,0,0,0,1];
    const w=m3v(basis,loc);
    m.wp=[p.wp[0]+w[0],p.wp[1]+w[1],p.wp[2]+w[2]];
    m.spinAng=th;
  }
  cometUpdate(days);
}

/* ---------------- 绘制辅助 ---------------- */
function bindCommon(pr){
  gl.uniformMatrix4fv(pr.u('uVP'),false,_vp);
  gl.uniform3f(pr.u('uCamPos'),CAM.eye[0],CAM.eye[1],CAM.eye[2]);
  gl.uniform1f(pr.u('uLogFC'),_logFC);
}
function drawSphere(pr,wp,rot,scale){
  gl.uniform3f(pr.u('uWorldPos'),wp[0],wp[1],wp[2]);
  gl.uniformMatrix3fv(pr.u('uRot'),false,rot);
  gl.uniform1f(pr.u('uScale'),scale);
  gl.drawElements(gl.TRIANGLES,SPH.n,gl.UNSIGNED_SHORT,0);
}

/* ---------------- 渲染一帧 ---------------- */
let sunScreen=[.5,.5],sunVis=0;
function render(){
  resize();
  stepPhysicsPausedIfNeeded();
  camStep(lastDt);
  refreshVP();

  /* 计算太阳屏幕位置（光晕用） */
  {
    const p=project([0,0,0],RT.W,RT.H);
    sunScreen=[p[0][0]/RT.W,1-p[0][1]/RT.H];
    const toSun=Math.hypot(CAM.eye[0],CAM.eye[1],CAM.eye[2]);
    const fwd=norm3([CAM.target[0]-CAM.eye[0],CAM.target[1]-CAM.eye[1],CAM.target[2]-CAM.eye[2]]);
    sunVis=clamp((-fwd[0]*CAM.eye[0]-fwd[1]*CAM.eye[1]-fwd[2]*CAM.eye[2])/toSun,0,1);
    sunVis*=clamp(1.6-Math.abs(sunScreen[0]-.5)*2-Math.abs(sunScreen[1]-.5)*2,0,1);
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.scene.fb);
  gl.viewport(0,0,RT.W,RT.H);
  gl.clearColor(0,0,0,1);gl.clearDepth(1);
  gl.disable(gl.BLEND);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  /* --- 天空 --- */
  gl.disable(gl.CULL_FACE);gl.disable(gl.DEPTH_TEST);gl.depthMask(false);
  { const pr=PROGS.sky;gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u('uVP'),false,_vp);
    gl.uniform3f(pr.u('uCamPos'),CAM.eye[0],CAM.eye[1],CAM.eye[2]);
    gl.uniform1f(pr.u('uTimeS'),S.timeSec);
    gl.bindVertexArray(SPH.vao);drawSphereRaw(pr);}
  /* --- 星空 --- */
  { const pr=PROGS.star;gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u('uVP'),false,_vp);
    gl.uniform3f(pr.u('uCamPos'),CAM.eye[0],CAM.eye[1],CAM.eye[2]);
    gl.uniform1f(pr.u('uTimeS'),S.timeSec);
    gl.uniform1f(pr.u('uPx'),Math.min(devicePixelRatio,2));
    gl.bindVertexArray(starVAO);
    gl.blendFunc(gl.ONE,gl.ONE);gl.enable(gl.BLEND);
    gl.drawArrays(gl.POINTS,0,STAR_N);
    gl.disable(gl.BLEND);}

  /* --- 不透明行星 + 卫星 --- */
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);

  { const pr=PROGS.sun;gl.useProgram(pr.p);bindCommon(pr);
    gl.uniform1f(pr.u('uTimeS'),S.timeSec);
    gl.bindVertexArray(SPH.vao);
    gl.uniform3f(pr.u('uWorldPos'),0,0,0);
    gl.uniformMatrix3fv(pr.u('uRot'),false,mul3(IDENT3,rotY(S.jd*TAU/SUN.spin)));
    gl.uniform1f(pr.u('uScale'),SUN.r);
    gl.drawElements(gl.TRIANGLES,SPH.n,gl.UNSIGNED_SHORT,0); }

  { const pr=PROGS.main;gl.useProgram(pr.p);bindCommon(pr);
    gl.uniform1f(pr.u('uTimeS'),S.timeSec);
    gl.uniform1f(pr.u('uDays'),S.jd-2451545.);
    gl.bindVertexArray(SPH.vao);
    for(const b of BODIES){
      const spinM=mul3(IDENT3,rotY(b.spinAng));
      const rot=m3mul(b.tiltM,spinM);
      gl.uniform1i(pr.u('uKind'),b.kind);
      gl.uniform1f(pr.u('uSeed'),1.5);
      gl.uniform3f(pr.u('uTint'),1,1,1);
      /* 环信息（供球面接收环影） */
      const rn=b.tiltM?[b.tiltM[1],b.tiltM[4],b.tiltM[7]]:[0,1,0];
      gl.uniform3f(pr.u('uRingN'),rn[0],rn[1],rn[2]);
      gl.uniform3f(pr.u('uRingC'),b.wp[0],b.wp[1],b.wp[2]);
      gl.uniform1f(pr.u('uRingIn'),b.ring?b.ring[0]*.98:-1);
      gl.uniform1f(pr.u('uRingOut'),b.ring?b.ring[1]*1.02:-1);
      drawSphere(pr,b.wp,rot,b.r);
      /* 云层 */
      if(b.cloud){
        const pc=PROGS.cloud;gl.useProgram(pc.p);bindCommon(pc);
        gl.uniform1f(pc.u('uTimeS'),S.timeSec);
        const rc=m3mul(b.tiltM,mul3(IDENT3,rotY(b.spinAng*.94)));
        gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
        gl.depthMask(false);
        drawSphere(pc,b.wp,rc,b.r*1.018);
        gl.disable(gl.BLEND);gl.depthMask(true);
        gl.useProgram(pr.p);
      }
      /* 卫星 */
      gl.uniform1i(pr.u('uKind'),b.kind);
      gl.uniform3f(pr.u('uTint'),1,1,1);
      for(const m of MOONS){
        if(m.parent!==b.key)continue;
        gl.uniform1i(pr.u('uKind'),m.kind);
        gl.uniform1f(pr.u('uSeed'),m.seed);
        if(m.tint)gl.uniform3f(pr.u('uTint'),m.tint[0],m.tint[1],m.tint[2]);
        drawSphere(pr,m.wp,mul3(IDENT3,rotY(m.spinAng)),m.r);
        if(m.tint)gl.uniform3f(pr.u('uTint'),1,1,1);
      }
      gl.uniform1i(pr.u('uKind'),b.kind);
    }
  }

  /* --- 光环（半透明）--- */
  { const pr=PROGS.orb; /* 占位避免警告？实际使用独立 ring FS */
  }
  drawRingsPass();

  /* --- 大气（加色壳，剔除正面画内壁紧贴轮廓）--- */
  { const pr=PROGS.atmo;gl.useProgram(pr.p);bindCommon(pr);
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
    gl.depthMask(false);gl.cullFace(gl.FRONT);
    gl.bindVertexArray(SPH.vao);
    const list=[...BODIES.filter(b=>b.atmo)];
    for(const m of MOONS)if(m.atmo)list.push(m);
    for(const b of list){
      gl.uniform3f(pr.u('uWorldPos'),b.wp[0],b.wp[1],b.wp[2]);
      gl.uniformMatrix3fv(pr.u('uRot'),false,b.tiltM||IDENT3);
      gl.uniform1f(pr.u('uScale'),b.r*(b===earthRef()?1.055:1.06));
      gl.uniform3f(pr.u('uColor'),b.atmo.col[0],b.atmo.col[1],b.atmo.col[2]);
      gl.uniform1f(pr.u('uPower'),b.atmo.pw);
      gl.uniform1f(pr.u('uIntensity'),b.atmo.it);
      gl.uniform1f(pr.u('uSunsetMix'),b.atmo.ss);
      gl.drawElements(gl.TRIANGLES,SPH.n,gl.UNSIGNED_SHORT,0);
    }
    gl.cullFace(gl.BACK);gl.depthMask(true);gl.disable(gl.BLEND);
  }

  /* --- 日冕 --- */
  { const pr=PROGS.corona;gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u('uVP'),false,_vp);
    gl.uniform1f(pr.u('uLogFC'),_logFC);
    gl.uniform1f(pr.u('uTimeS'),S.timeSec);
    gl.uniform3f(pr.u('uCenter'),0,0,0);
    gl.uniform3f(pr.u('uRight'),_view[0],_view[4],_view[8]);
    gl.uniform3f(pr.u('uUp'),_view[1],_view[5],_view[9]);
    gl.uniform1f(pr.u('uSize'),SUN.r*8.2);
    gl.bindVertexArray(quadVAO);
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    gl.drawArrays(gl.TRIANGLES,0,6);
    gl.depthMask(true);gl.disable(gl.BLEND);
  }

  /* --- 粒子带 --- */
  if(S.showBelt){
    const pr=PROGS.belt;gl.useProgram(pr.p);bindCommon(pr);
    gl.uniform1f(pr.u('uDays'),S.jd-2451545.);
    gl.uniform1f(pr.u('uPx'),Math.min(devicePixelRatio,2));
    gl.uniform1f(pr.u('uTrojPh'),jupTrojPh());
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    gl.bindVertexArray(beltVAO);gl.drawArrays(gl.POINTS,0,4200);
    gl.bindVertexArray(kuiperVAO);gl.drawArrays(gl.POINTS,0,1700);
    /* 彗尾 */
    const pt=PROGS.tail;gl.useProgram(pt.p);bindCommon(pt);
    const act=Math.pow(clamp(3.2/Math.max(COMET.r,.5),0,1),1.6);
    const cp=COMET.wp;
    const cs=Math.hypot(cp[0],cp[1],cp[2])||1;
    const ion=[-cp[0]/cs,-cp[1]/cs,-cp[2]/cs];
    const dust=norm3([ion[0]*.7-ionTailVel()[0]*.3,ion[1]*.7-ionTailVel()[1]*.3,ion[2]*.7-ionTailVel()[2]*.3]);
    gl.uniform3f(pt.u('uCP'),cp[0],cp[1],cp[2]);
    gl.uniform3f(pt.u('uCIon'),ion[0],ion[1],ion[2]);
    gl.uniform3f(pt.u('uCDust'),dust[0],dust[1],dust[2]);
    gl.uniform1f(pt.u('uLen'),Math.max(act,0.0001)*60.*clamp(30./camDist(cp),.25,4.));
    gl.uniform1f(pt.u('uAct'),act*1.2);
    gl.uniform1f(pt.u('uPx'),Math.min(devicePixelRatio,2));
    gl.bindVertexArray(tailVAO);
    gl.drawArrays(gl.POINTS,0,TAIL_N);
    gl.depthMask(true);gl.disable(gl.BLEND);
  }

  /* --- 轨道线 --- */
  if(S.showOrbit){
    gl.useProgram(PROGS.orb.p);
    const pr=PROGS.orb;bindCommon(pr);
    gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    const days=S.jd-2451545.;
    for(const b of BODIES){

    gl.uniform4f(pr.u('uColor'),.65,.85,1.,.65);
    gl.bindBuffer(gl.ARRAY_BUFFER,orbVAOs.c.buf);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,cbuf);
    gl.bindVertexArray(orbVAOs.c.vao);
    gl.drawArrays(gl.LINE_LOOP,0,ORBN_C);
    gl.depthMask(true);gl.disable(gl.BLEND);
  }

  /* --- 黄道网格 --- */
  if(S.showGrid){
    const pr=PROGS.grid;gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u('uVP'),false,_vp);
    gl.uniform1f(pr.u('uLogFC'),_logFC);
    gl.uniform4f(pr.u('uColor'),.4,.6,1.,.045);
    gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.depthMask(false);
    gl.bindVertexArray(gridVAO);
    gl.drawArrays(gl.LINES,0,gridArr.length/3);
    gl.depthMask(true);gl.disable(gl.BLEND);
  }

  /* ================= 后处理 ================= */
  gl.disable(gl.DEPTH_TEST);
  gl.bindVertexArray(EMPTY_VAO);
  const post=PROGS.post;
  gl.useProgram(post.p);
  /* 采样器槽位固定：0=源 / 1,2=备用（中间通道一律指向黑纹理，杜绝 feedback loop） */
  gl.uniform1i(post.u('uTexA'),0);
  gl.uniform1i(post.u('uTexB'),1);
  gl.uniform1i(post.u('uTexC'),2);
  /* 提亮（半分辨率 A）*/
  setTexUnits(RT.scene.tex,null,null);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.halfA.fb);
  gl.viewport(0,0,RT.halfA.w,RT.halfA.h);
  gl.disable(gl.BLEND);
  gl.uniform1i(post.u('uMode'),0);
  gl.uniform1f(post.u('uThresh'),HDR?1.:72);
  gl.drawArrays(gl.TRIANGLES,0,3);
  /* 半分辨率模糊 A↔B */
  gl.uniform1i(post.u('uMode'),1);
  gl.uniform2f(post.u('uRes'),RT.halfA.w,RT.halfA.h);
  for(let i=0;i<2;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER,RT.halfB.fb);
    setTexUnits(RT.halfA.tex,null,null);
    gl.uniform2f(post.u('uDir'),1,0);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.bindFramebuffer(gl.FRAMEBUFFER,RT.halfA.fb);
    setTexUnits(RT.halfB.tex,null,null);
    gl.uniform2f(post.u('uDir'),0,1);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  /* 四分之一分辨率降采样 + 宽模糊 */
  gl.uniform1i(post.u('uMode'),2);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.quartA.fb);
  gl.viewport(0,0,RT.quartA.w,RT.quartA.h);
  setTexUnits(RT.halfA.tex,null,null);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.uniform1i(post.u('uMode'),1);
  gl.uniform2f(post.u('uRes'),RT.quartA.w,RT.quartA.h);
  for(let i=0;i<2;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER,RT.quartB.fb);
    setTexUnits(RT.quartA.tex,null,null);
    gl.uniform2f(post.u('uDir'),1,0);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.bindFramebuffer(gl.FRAMEBUFFER,RT.quartA.fb);
    setTexUnits(RT.quartB.tex,null,null);
    gl.uniform2f(post.u('uDir'),0,1);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  /* 合成到屏幕（默认帧缓冲，读取三张已完成纹理安全无环） */
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,RT.W,RT.H);
  setTexUnits(RT.scene.tex,RT.halfA.tex,RT.quartA.tex);
  gl.uniform1i(post.u('uMode'),3);
  gl.uniform1f(post.u('uAspect'),RT.W/RT.H);
  gl.uniform2f(post.u('uSunUV'),sunScreen[0],sunScreen[1]);
  gl.uniform1f(post.u('uFlareStr'),sunVis*.9);
  gl.uniform1f(post.u('uTimeS'),S.timeSec);
  gl.uniform1f(post.u('uExp'),HDR?1.15:1.);
  gl.uniform1f(post.u('uThresh'),1);
  gl.uniform2f(post.u('uRes'),RT.W,RT.H);
  gl.uniform2f(post.u('uDir'),1,0);
  gl.drawArrays(gl.TRIANGLES,0,3);

  window.__SIM_OK__=true;
}

function norm3(v){const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];}
function earthRef(){return BODIES[2];}
const IDENT3=new Float32Array([1,0,0,0,1,0,0,0,1]);

function jupTrojPh(){
  const days=S.jd-2451545.;
  const T=days/36525;
  return ((34.39644051+3034.74612775*T)%360)*D2R;

let _prevComet=COMET.wp.slice();
function ionTailVel(){
  const v=[COMET.wp[0]-_prevComet[0],COMET.wp[1]-_prevComet[1],COMET.wp[2]-_prevComet[2]];
  _prevComet=COMET.wp.slice();
  const l=Math.hypot(...v)||1;
  return[v[0]/l,v[1]/l,v[2]/l];
}
/* 填充轨道椭圆缓冲：返回[当前相位0-1, 缓冲数组] */
const _orbTmp=new Float32Array(3);
function orbitFill(el,days,N,isComet){
  const buf=isComet?cometOrbData:orbData;
  let head=0;
  if(isComet){
    const nD=360/Math.pow(COMET.a,1.5)/365.256/D2R;
    let M=nD*(days+2451545.-COMET.tp);M%=TAU;if(M<0)M+=TAU;
    const E=solveKepler(M,COMET.e);
    head=E/TAU;
    const ci=Math.cos(COMET.i),si=Math.sin(COMET.i),cO=Math.cos(COMET.O),sO=Math.sin(COMET.O),
          cw=Math.cos(COMET.w),sw=Math.sin(COMET.w);
    for(let i=0;i<N;i++){
      const t=i/N*2-1;
      const E2=Math.sign(t)*Math.PI*Math.pow(Math.abs(t),3.2);
      const xp=COMET.a*(Math.cos(E2)-COMET.e),yp=COMET.a*Math.sqrt(1-COMET.e*COMET.e)*Math.sin(E2);
      const X=(cw*cO-sw*sO*ci)*xp+(-sw*cO-cw*sO*ci)*yp;
      const Y=(cw*sO+sw*cO*ci)*xp+(-sw*sO+cw*cO*ci)*yp;
      const Z=(sw*si)*xp+(cw*si)*yp;
      const o=i*4;
      buf[o]=X*AU_W;buf[o+1]=Z*AU_W;buf[o+2]=-Y*AU_W;buf[o+3]=(E2/TAU+1)%1;
    }
  }else{
    const[a,e,i,L,wb,O]=elemsAt(el,days);
    const M=L-wb;
    const Ec=solveKepler(M,e);
    head=((Ec%TAU)+TAU)%TAU/TAU;
    const argp=wb-O;
    const cw=Math.cos(argp),sw=Math.sin(argp),cO=Math.cos(O),sO=Math.sin(O),ci=Math.cos(i),si=Math.sin(i);
    for(let k=0;k<N;k++){
      const E=k/N*TAU;
      const xp=a*(Math.cos(E)-e),yp=a*Math.sqrt(Math.max(1-e*e,0))*Math.sin(E);
      const X=(cw*cO-sw*sO*ci)*xp+(-sw*cO-cw*sO*ci)*yp;
      const Y=(cw*sO+sw*cO*ci)*xp+(-sw*sO+cw*cO*ci)*yp;
      const Z=(sw*si)*xp+(cw*si)*yp;
      const o=k*4;
      buf[o]=X*AU_W;buf[o+1]=Z*AU_W;buf[o+2]=-Y*AU_W;buf[o+3]=E/TAU;
    }
  }
  return[head,buf];
}

}

/* ---------------- HUD 刷新 ---------------- */
function fmtDate(jd){
  const d=new Date((jd-2440587.5)*86400000);
  const p=n=>String(n).padStart(2,'0');
  if(isNaN(d.getTime()))return '--';
  return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
let hudAccum=0;
function hudTick(dt){
  hudAccum+=dt;
  if(hudAccum<.12)return;
  hudAccum=0;
  $('simdate').textContent=fmtDate(S.jd);
  $('simsub').textContent='JD '+S.jd.toFixed(1)+' · '+(S.playing?dpsText():'已暂停');
  updateFocusCard(false);
  /* FPS */
  S.frames++;
  const now=performance.now();
  if(now-S.fpsT>600){
    $('fps').textContent=Math.round(S.frames*1000/(now-S.fpsT))+' FPS';
    S.fpsT=now;S.frames=0;
  }
  /* 标签投影 */
  const vw=cvs.clientWidth,vh=cvs.clientHeight;
  for(const lb of labels){
    if(!S.showLabel){lb.el.style.opacity='0';lb.el.style.pointerEvents='none';continue;}
    const p=getWP(lb.ref);
    const[[sx,sy],ok]=project(p,vw,vh);
    const dst=camDist(p);
    let op=0;
    if(ok&&sx>-60&&sx<vw+60&&sy>-30&&sy<vh+40){
      /* 与太阳贴近时隐藏内侧行星标签，防重叠 */
      if(lb.ref!==SUN){
        const[[sxs,sys]]=project([0,0,0],vw,vh);
        const sd=Math.hypot(sx-sxs,sy-sys);
        if(sd<34&&dst>AU_W*3.2)op=0;
        else op=clamp(1.6-AU_W*.00022*Math.log(dst/AU_W+.5),.35,.95);
        if(dst<AU_W*.4)op=Math.min(op,clamp((dst/(AU_W*.4))*1.2,.3,1));
      }else op=.9;
      if(CAM.focus===lb.ref)op=1;
    }
    if(CAM.focus&&CAM.focus!==SUN&&lb.ref===SUN&&dst<AU_W*.7)op=0;
    lb.el.style.opacity=op.toFixed(2);
    lb.el.style.pointerEvents=op>.25?'auto':'none';
    lb.el.style.transform='translate('+sx.toFixed(1)+'px,'+(sy-14-(lb.ref.r||1)/vh*900).toFixed(1)+'px) translate(-50%,-100%)';
  }
}

/* ---------------- 主循环 ---------------- */
let lastT=performance.now(),lastDt=.016;
function stepPhysicsPausedIfNeeded(){ /* 由 animate 中调用前已积分 */ }
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastT)/1000,.1)||.016;
  lastT=now;lastDt=dt;
  S.timeSec+=dt;
  if(S.playing){
    const dd=dt*dpsVal();
    if(dd!==0)stepPhysics(dd);
  }
  render();
  hudTick(dt);
}
