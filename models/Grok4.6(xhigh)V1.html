function keplerE(M, e) {
  let E = e < 0.8 ? M : Math.PI;
  for (let n = 0; n < 12; n++) {
    const f = E - e * Math.sin(E) - M;
    const fp = 1 - e * Math.cos(E);
    const d = f / fp;
    E -= d;
    if (Math.abs(d) < 1e-8) break;
  }
  return E;
}

function elementsToPosition(el, days, scaleA = AU) {
  const n = Math.PI * 2 / el.period;
  const M = n * days;
  const e = el.e || 0;
  const E = keplerE(M, e);
  const cosE = Math.cos(E), sinE = Math.sin(E);
  const xv = scaleA * el.a * (cosE - e);
  const yv = scaleA * el.a * Math.sqrt(1 - e * e) * sinE;
  const r = Math.hypot(xv, yv);
  const trueA = Math.atan2(yv, xv);
  const cw = Math.cos(deg(el.w || 0)), sw = Math.sin(deg(el.w || 0));
  const cO = Math.cos(deg(el.O || 0)), sO = Math.sin(deg(el.O || 0));
  const ci = Math.cos(deg(el.i || 0)), si = Math.sin(deg(el.i || 0));
  const x = r * (cO * (cw * Math.cos(trueA) - sw * Math.sin(trueA)) - sO * (sw * Math.cos(trueA) + cw * Math.sin(trueA)) * ci);
  const y = r * (sO * (cw * Math.cos(trueA) - sw * Math.sin(trueA)) + cO * (sw * Math.cos(trueA) + cw * Math.sin(trueA)) * ci);
  const z = r * (sw * Math.cos(trueA) + cw * Math.sin(trueA)) * si;
  return new THREE.Vector3(x, z, -y);
}

function orbitCurve(el, scaleA = AU, segs = 256) {
  const pts = [];
  for (let k = 0; k <= segs; k++) {
    const nu = (k / segs) * Math.PI * 2;
    const e = el.e || 0;
    const r = scaleA * el.a * (1 - e * e) / (1 + e * Math.cos(nu));
    const cw = Math.cos(deg(el.w || 0)), sw = Math.sin(deg(el.w || 0));
    const cO = Math.cos(deg(el.O || 0)), sO = Math.sin(deg(el.O || 0));
    const ci = Math.cos(deg(el.i || 0)), si = Math.sin(deg(el.i || 0));
    const x = r * (cO * (cw * Math.cos(nu) - sw * Math.sin(nu)) - sO * (sw * Math.cos(nu) + cw * Math.sin(nu)) * ci);
    const y = r * (sO * (cw * Math.cos(nu) - sw * Math.sin(nu)) + cO * (sw * Math.cos(nu) + cw * Math.sin(nu)) * ci);
    const z = r * (sw * Math.cos(nu) + cw * Math.sin(nu)) * si;
    pts.push(new THREE.Vector3(x, z, -y));
  }
  return pts;
}

function hash21(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return (
    hash21(ix, iy) * (1 - ux) * (1 - uy) +
    hash21(ix + 1, iy) * ux * (1 - uy) +
    hash21(ix, iy + 1) * (1 - ux) * uy +
    hash21(ix + 1, iy + 1) * ux * uy
  );
}
function fbm(x, y, oct = 5) {
  let v = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { v += a * noise2(x * f, y * f); f *= 2; a *= 0.5; }
  return v;
}

function canvasTex(w, h, draw, wrap = true) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  t.wrapS = t.wrapT = wrap ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  return t;
}

function genEarth() {
  const day = canvasTex(1024, 512, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const lat = (y / h - 0.5) * Math.PI;
      const n = fbm(x * 0.018, y * 0.036, 6);
      const polar = Math.pow(Math.abs(Math.sin(lat)), 8);
      let land = n > 0.52 + 0.06 * Math.cos(x * 0.04);
      if (polar > 0.72) land = n > 0.4;
      const i = (y * w + x) * 4;
      if (land) {
        const g = 70 + n * 90;
        img.data[i] = 48 + n * 70; img.data[i + 1] = g; img.data[i + 2] = 36 + n * 30;
        if (polar > 0.55) { img.data[i] = img.data[i + 1] = img.data[i + 2] = 230; }
      } else {
        const d = 0.75 + n * 0.25;
        img.data[i] = 12 * d; img.data[i + 1] = 62 * d; img.data[i + 2] = 148 * d;
      }
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const blobs = [
      [280, 210, 90, 55], [430, 180, 70, 80], [620, 240, 110, 40],
      [780, 280, 50, 70], [200, 320, 40, 80], [860, 160, 55, 35]
    ];
    ctx.fillStyle = "#3d6b38";
    blobs.forEach(([x, y, rx, ry]) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); });
    ctx.fillStyle = "#e8eef2";
    ctx.beginPath(); ctx.ellipse(512, 18, 280, 28, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(512, 494, 260, 26, 0, 0, 7); ctx.fill();
  });
  const night = canvasTex(1024, 512, (ctx, w, h) => {
    ctx.fillStyle = "#02040a"; ctx.fillRect(0, 0, w, h);
    for (let k = 0; k < 1400; k++) {
      const x = Math.random() * w, y = 40 + Math.random() * (h - 80);
      if (fbm(x * 0.018, y * 0.036, 4) < 0.54) continue;
      ctx.fillStyle = `rgba(255,210,140,${0.25 + Math.random() * 0.7})`;
      ctx.fillRect(x, y, 1 + (Math.random() > 0.85 ? 1 : 0), 1);
    }
  });
  const spec = canvasTex(1024, 512, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const n = fbm(x * 0.018, y * 0.036, 5);
      const land = n > 0.52;
      const i = (y * w + x) * 4;
      const v = land ? 12 : 210;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  });
  const clouds = canvasTex(1024, 512, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const n = fbm(x * 0.02 + 20, y * 0.04, 6);
      const a = clamp((n - 0.52) * 3.2, 0, 0.85);
      const i = (y * w + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
      img.data[i + 3] = a * 255;
    }
    ctx.putImageData(img, 0, 0);
  }, true);
  return { day, night, spec, clouds };
}

function genMars() {
  return canvasTex(1024, 512, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const lat = y / h;
      const n = fbm(x * 0.015, y * 0.03, 6);
      const i = (y * w + x) * 4;
      img.data[i] = 140 + n * 80; img.data[i + 1] = 60 + n * 40; img.data[i + 2] = 32 + n * 20;
      if (lat < 0.08 || lat > 0.92) {
        const ice = 200 + n * 55;
        img.data[i] = ice; img.data[i + 1] = ice; img.data[i + 2] = 230;
      }
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    ctx.strokeStyle = "rgba(70,30,20,0.55)"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(200, 240); ctx.bezierCurveTo(320, 280, 480, 220, 700, 260); ctx.stroke();
  });
}

function genGas(palette, spot) {
  return canvasTex(1024, 512, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const bands = Math.sin(y * 0.085 + fbm(x * 0.01, y * 0.04, 4) * 3.5);
      const t = 0.5 + 0.5 * bands;
      const n = fbm(x * 0.03, y * 0.08, 5);
      const i = (y * w + x) * 4;
      const c0 = palette[0], c1 = palette[1];
      img.data[i] = c0[0] + (c1[0] - c0[0]) * t + n * 30;
      img.data[i + 1] = c0[1] + (c1[1] - c0[1]) * t + n * 20;
      img.data[i + 2] = c0[2] + (c1[2] - c0[2]) * t + n * 12;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    if (spot) {
      const g = ctx.createRadialGradient(spot.x, spot.y, 4, spot.x, spot.y, spot.r);
      g.addColorStop(0, spot.inner); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(spot.x, spot.y, spot.r, spot.r * 0.62, 0.2, 0, 7); ctx.fill();
    }
  });
}

function genIce(base) {

      const n = fbm(x * 0.02, y * 0.05, 5);
      const i = (y * w + x) * 4;
      img.data[i] = base[0] * (0.75 + n * 0.35);
      img.data[i + 1] = base[1] * (0.75 + n * 0.35);
      img.data[i + 2] = base[2] * (0.8 + n * 0.25);
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  });
}

function genPluto() {
  return canvasTex(512, 256, (ctx, w, h) => {

    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const n = fbm(x * 0.03, y * 0.06, 5);

      if (heart < 1) {

function genMoonRock(tint) {

      img.data[i] = tint[0] * (0.55 + n * 0.55);
      img.data[i + 1] = tint[1] * (0.55 + n * 0.55);

function genRings() {
  return canvasTex(1024, 64, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let x = 0; x < w; x++) {
      const u = x / (w - 1);
      let a = 0;
      if (u > 0.04 && u < 0.22) a = 0.22 + 0.18 * u;
      if (u >= 0.22 && u < 0.52) a = 0.78 + 0.18 * noise2(u * 90, 0.2);
      if (u >= 0.52 && u < 0.58) a = 0.03;
      if (u >= 0.58 && u < 0.88) a = 0.55 + 0.2 * noise2(u * 70, 1.1);
      if (u >= 0.73 && u < 0.745) a *= 0.12;
      if (u >= 0.88 && u < 0.97) a = 0.18;
      const warm = 210 + noise2(u * 40, 2.2) * 28;
      for (let y = 0; y < h; y++) {
        const grain = 0.9 + 0.1 * noise2(u * 80, y * 0.35);
        const i = (y * w + x) * 4;
        img.data[i] = warm * grain;
        img.data[i + 1] = warm * 0.88 * grain;
        img.data[i + 2] = warm * 0.68 * grain;
        img.data[i + 3] = a * 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }, true);
}

function ringGeometry(inner, outer, segs = 160) {
  const g = new THREE.RingGeometry(inner, outer, segs, 6);
  const pos = g.attributes.position;
  const uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const r = Math.hypot(pos.getX(i), pos.getY(i));
    const ang = Math.atan2(pos.getY(i), pos.getX(i));
    uv.setXY(i, (r - inner) / (outer - inner), (ang / Math.PI + 1) * 0.5);
  }
  uv.needsUpdate = true;
  return g;
}

function genMilky() {
  return canvasTex(2048, 1024, (ctx, w, h) => {
    ctx.fillStyle = "#05030b"; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 7000; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      const m = Math.random();
      const cool = m > 0.7;
      ctx.fillStyle = cool
        ? `rgba(190,210,255,${0.18 + m * 0.45})`
        : `rgba(230,228,240,${0.12 + m * 0.4})`;
      ctx.fillRect(x, y, m > 0.985 ? 2 : 1, m > 0.985 ? 2 : 1);
    }
    for (let i = 0; i < 900; i++) {
      const x = Math.random() * w;
      const y = h * 0.5 + (Math.random() - 0.5) * h * 0.16 * (0.25 + noise2(x * 0.01, 2));
      ctx.fillStyle = `rgba(90,110,170,${0.018 + Math.random() * 0.03})`;
      ctx.beginPath(); ctx.arc(x, y, 10 + Math.random() * 22, 0, 7); ctx.fill();
    }
    for (let i = 0; i < 2800; i++) {
      const x = Math.random() * w;
      const y = h * 0.5 + (Math.random() - 0.5) * h * 0.12;
      ctx.fillStyle = `rgba(210,220,255,${0.08 + Math.random() * 0.22})`;
      ctx.fillRect(x, y, 1, 1);
    }
  }, true);
}

function softSprite(inner, mid, outer) {

    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, inner);
    g.addColorStop(0.28, mid);
    g.addColorStop(1, outer);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }, false);
}

const sunVert = `
varying vec3 vN; varying vec3 vP;
void main() {

const sunFrag = `
uniform float uTime;
varying vec3 vN; varying vec3 vP;
float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453); }
float n3(vec3 p){
  vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),
                 mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                 mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<6;i++){ v+=a*n3(p); p*=2.03; a*=0.52; } return v; }
void main(){
  vec3 p = normalize(vP);
  float t = uTime * 0.08;
  float n = fbm(p * 2.4 + vec3(t, -t*0.6, t*0.3));
  n = fbm(p * 3.0 + n * 1.6 + vec3(-t, t*0.4, 0.2));
  vec3 hot = vec3(1.0, 0.92, 0.62);
  vec3 mid = vec3(1.0, 0.55, 0.12);
  vec3 deep = vec3(0.55, 0.08, 0.02);
  vec3 col = mix(deep, mid, smoothstep(0.28, 0.55, n));
  col = mix(col, hot, smoothstep(0.62, 0.88, n));
  float limb = pow(abs(dot(normalize(vN), vec3(0.0,0.0,1.0))), 0.35);
  col *= 0.62 + 0.5 * limb;
  float spots = smoothstep(0.72, 0.9, fbm(p * 5.0 + 8.0));
  col *= 1.0 - spots * 0.45;
  gl_FragColor = vec4(col * 1.05, 1.0);
}`;

const coronaFrag = `
uniform float uTime;
varying vec3 vN; varying vec3 vP;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float n2(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}
void main(){
  float fres = pow(1.0 - abs(dot(normalize(vN), vec3(0.0,0.0,1.0))), 2.2);
  vec3 p = normalize(vP);
  float rays = 0.0;
  for (int k=0;k<4;k++){
    float fi = float(k);
    rays += n2(vec2(atan(p.z,p.x)*1.8 + fi, p.y*3.0 + uTime*0.05 + fi));
  }
  rays *= 0.25;
  float a = fres * (0.10 + rays * 0.32);
  vec3 col = mix(vec3(1.0,0.52,0.16), vec3(1.0,0.88,0.58), rays);
  gl_FragColor = vec4(col, a);
}`;

const atmoVert = `

const earthVert = `

const earthFrag = `
uniform sampler2D uDay, uNight, uSpec, uCloud;
uniform vec3 uSun; uniform float uCloudShift;
varying vec2 vUv; varying vec3 vN; varying vec3 vW;
void main(){
  vec3 N = normalize(vN);
  vec3 L = normalize(uSun - vW);
  vec3 V = normalize(cameraPosition - vW);
  float ndl = max(dot(N, L), 0.0);
  float twilight = smoothstep(-0.12, 0.18, dot(N, L));
  vec3 day = texture2D(uDay, vUv).rgb * 0.74;
  vec3 night = texture2D(uNight, vUv).rgb * 1.05;
  vec2 cuv = vec2(fract(vUv.x + uCloudShift), vUv.y);
  float clouds = texture2D(uCloud, cuv).a;
  vec3 H = normalize(L + V);
  float spec = pow(max(dot(N, H), 0.0), 56.0) * texture2D(uSpec, vUv).r * ndl;
  vec3 col = mix(night, day, twilight);
  col = mix(col, vec3(0.78,0.84,0.92), clouds * twilight * 0.55);
  col += spec * vec3(0.45,0.62,0.85) * 0.55;
  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.4) * twilight;
  col += vec3(0.18,0.38,0.85) * rim * 0.28;
  gl_FragColor = vec4(col, 1.0);
}`;

function spawnBelt(count, r0, r1, iMax, size, color, opacity) {

  const meta = [];
  for (let i = 0; i < count; i++) {
    const a = r0 + Math.random() * (r1 - r0);
    const e = Math.random() * 0.08;
    const O = Math.random() * 360;
    const w = Math.random() * 360;
    const inc = (Math.random() - 0.5) * 2 * iMax;
    const period = Math.sqrt(Math.pow(a, 3)) * 365.25;
    const phase = Math.random() * period;
    const s = size * (0.45 + Math.random());
    meta.push({ a, e, i: inc, O, w, period, phase, s });
    dummy.position.set(0, 0, 0);
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.userData.meta = meta;
  mesh.userData.dummy = dummy;
  scene.add(mesh);
  return mesh;
}

const LABEL_RANK = { sun: 0, jupiter: 1, saturn: 2, earth: 3, neptune: 4, uranus: 5, mars: 6, venus: 7, mercury: 8, pluto: 9, ceres: 10, halley: 11 };

function layoutLabels() {
  const placed = [];
  const ids = ["sun", ...bodies.map((b) => b.id)].sort((a, b) => {
    const pa = a === focusId ? -1 : (LABEL_RANK[a] ?? 20);
    const pb = b === focusId ? -1 : (LABEL_RANK[b] ?? 20);
    return pa - pb;
  });
  ids.forEach((id) => {
    const el = labelEls[id];
    const rec = id === "sun" ? sunBody : bodies.find((b) => b.id === id);
    const pos = id === "sun"
      ? new THREE.Vector3(0, -DATA.sun.radius * 1.45, 0)
      : rec.pivot.position.clone().add(new THREE.Vector3(0, rec.data.radius * 1.35 + 0.4, 0));
    const v = pos.clone().project(camera);
    const on = v.z > -1 && v.z < 1 && Math.abs(v.x) < 1.08 && Math.abs(v.y) < 1.08;
    if (!on || !showLabels) { el.style.opacity = 0; return; }
    let x = (v.x * 0.5 + 0.5) * innerWidth;
    let y = (-v.y * 0.5 + 0.5) * innerHeight;
    const dist = camera.position.distanceTo(pos);
    let op = dist > 320 ? 0 : clamp(1.2 - dist / 280, 0, 1);
    if (id !== focusId && id !== "sun" && dist < rec.data.radius * 6) op *= 0.15;
    if (id === "halley" && rec.pivot.position.length() < 16) op = 0;
    for (const p of placed) {
      if (Math.hypot(x - p.x, y - p.y) < 58) {
        if (id === focusId) { p.el.style.opacity = 0; }
        else { op = 0; break; }
      }
    }
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    el.style.opacity = op;
    if (op > 0.08) placed.push({ x, y, el });
  });
}

function updateBodies() {
  bodies.forEach((b) => {
    const p = elementsToPosition(b.data, timeDays);
    b.pivot.position.copy(p);
    b.mesh.rotation.y = (timeDays / b.data.rot) * Math.PI * 2;
    if (b.clouds) b.clouds.rotation.y = (timeDays / b.data.rot) * Math.PI * 2 * 1.08;
    if (b.atmo) b.atmo.material.uniforms.uSun.value.set(0, 0, 0);
    if (b.id === "earth") {
      earthMat.uniforms.uSun.value.set(0, 0, 0);
      earthMat.uniforms.uCloudShift.value = (timeDays * 0.002) % 1;
    }
  });
  moons.forEach((m) => {
    const vis = showMoons;
    m.mesh.visible = vis;
    m.line.visible = vis && showOrbits;
    if (!vis) return;
    const local = elementsToPosition(m.orbitEl, timeDays, 1);
    m.mesh.position.copy(m.parent.pivot.position).add(local);
    m.line.position.copy(m.parent.pivot.position);
  });
  const hp = cometRec.pivot.position;
  const away = hp.clone().normalize();
  const velGuess = elementsToPosition(cometRec.data, timeDays + 0.4).sub(hp).normalize();
  const ionPos = ionTail.geometry.attributes.position;
  const dustPos = dustTail.geometry.attributes.position;
  for (let i = 0; i < ionPos.count; i++) {
    const u = Math.pow((i + 0.5) / ionPos.count, 1.65);
    const spread = u * 2.4;
    const jitter = new THREE.Vector3(
      Math.sin(i * 19.7 + 1.3),
      Math.cos(i * 13.1 + 0.4) * 0.55,
      Math.sin(i * 8.4 + 2.1)
    ).multiplyScalar(spread);
    const q = hp.clone().add(away.clone().multiplyScalar(u * 28)).add(jitter);
    ionPos.setXYZ(i, q.x, q.y, q.z);
  }
  const side = new THREE.Vector3().crossVectors(away, new THREE.Vector3(0, 1, 0)).normalize();
  if (!isFinite(side.x)) side.set(1, 0, 0);
  for (let i = 0; i < dustPos.count; i++) {
    const u = Math.pow((i + 0.5) / dustPos.count, 1.35);
    const curve = velGuess.clone().multiplyScalar(u * 7.5).add(side.clone().multiplyScalar(Math.sin(u * 1.8) * u * 3.2));
    const jitter = new THREE.Vector3(
      Math.sin(i * 7.3),
      Math.cos(i * 5.9) * 0.35,
      Math.cos(i * 4.1)
    ).multiplyScalar(u * 2.8);
    const q = hp.clone().add(away.clone().multiplyScalar(u * 18)).add(curve).add(jitter);
    dustPos.setXYZ(i, q.x, q.y, q.z);
  }
  ionPos.needsUpdate = true;
  dustPos.needsUpdate = true;
  const nearSun = Math.max(hp.length(), 1);
  ionTail.material.opacity = clamp(14 / nearSun, 0.06, 0.72);
  dustTail.material.opacity = clamp(10 / nearSun, 0.04, 0.42);

  const dummy = mainBelt.userData.dummy;
  [mainBelt, kuiper].forEach((belt) => {
    belt.userData.meta.forEach((m, i) => {
      const p = elementsToPosition({ a: m.a, e: m.e, i: m.i, O: m.O, w: m.w, period: m.period }, timeDays + m.phase);
      dummy.position.copy(p);
      dummy.scale.setScalar(m.s);
      dummy.rotation.set(m.O, timeDays * 0.01, m.w);
      dummy.updateMatrix();
      belt.setMatrixAt(i, dummy.matrix);
    });
    belt.instanceMatrix.needsUpdate = true;
  });
}

function updateFlares() {
  const sunNdc = sunMesh.position.clone().project(camera);
  const visible = sunNdc.z < 1;
  flareGroup.visible = visible;
  if (!visible) return;
  const camDir = camera.position.clone().normalize();
  flareGroup.children.forEach((s) => {
    const along = camera.position.clone().lerp(new THREE.Vector3(0, 0, 0), s.userData.k);
    s.position.copy(along);
  });
  glow.quaternion.copy(camera.quaternion);
  void camDir;
}

function updateClock() {
  const years = timeDays / 365.256;
  $("dateLine").textContent = `J2000.0 ${years >= 0 ? "+" : "−"} ${Math.abs(years).toFixed(3)} y`;
  $("speedLine").textContent = `${paused ? "已冻结" : "运行中"} · × ${speed.toFixed(1)} 日 / 秒`;
}

function cineStep(dt) {
  cineT += dt * 0.08;
  const ids = ["earth", "jupiter", "saturn", "halley", "neptune", "sun", "mars"];
  const i = Math.floor(cineT) % ids.length;
  const f = cineT - Math.floor(cineT);
  const a = getBody(ids[i]);
  const b = getBody(ids[(i + 1) % ids.length]);
  const pa = a.pivot.position.clone();
  const pb = b.pivot.position.clone();
  if (a.id === "sun") pa.set(0, 0, 0);
  if (b.id === "sun") pb.set(0, 0, 0);
  const tgt = pa.lerp(pb, f * f * (3 - 2 * f));
  const dist = 28 + 40 * Math.sin(cineT * 0.7) ** 2;
  const ang = cineT * 0.35;
  const pos = tgt.clone().add(new THREE.Vector3(Math.cos(ang) * dist, 10 + 8 * Math.sin(cineT * 0.25), Math.sin(ang) * dist));
  camera.position.lerp(pos, 0.04);
  controls.target.lerp(tgt, 0.06);
}

let last = 0;
function tick(now) {
  if (!last) last = now;
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  if (!paused) timeDays += speed * dt;
  sunMat.uniforms.uTime.value = now * 0.001;
  coronaMat.uniforms.uTime.value = now * 0.001;
  grade.uniforms.uTime.value = now * 0.0004;
  sunMesh.rotation.y += dt * 0.04;
  corona.rotation.y -= dt * 0.01;
  sky.rotation.y += dt * 0.0012;
  dust.rotation.y += dt * 0.002;
  const windPos = solarWind.geometry.attributes.position;
  solarWind.userData.seed.forEach((s, i) => {
    s.r += s.s * dt;
    if (s.r > 110) s.r = 8;
    windPos.setXYZ(i, s.dir.x * s.r, s.dir.y * s.r, s.dir.z * s.r);
  });
  windPos.needsUpdate = true;

  updateBodies();
  updateFlares();
  updateClock();

  if (cine) cineStep(dt);
  else {
    const want = desiredCam(focusId);
    controls.target.lerp(want.target, 0.035);
    if (focusId !== "sun" && camera.position.distanceTo(want.target) > focusDistance(focusId) * 3.2) {
      camera.position.lerp(want.pos, 0.02);
    }
  }
  controls.update();

  layoutLabels();

  composer.render();
  requestAnimationFrame(tick);
}

function bindUI() {
  $("btnPause").onclick = () => {
    paused = !paused;
    $("btnPause").textContent = paused ? "继续" : "暂停";
    $("btnPause").classList.toggle("active", paused);
  };
  $("btnCine").onclick = () => {
    cine = !cine;
    $("btnCine").classList.toggle("active", cine);
  };
  $("btnOrbits").onclick = () => {
    showOrbits = !showOrbits;
    $("btnOrbits").classList.toggle("active", showOrbits);
    scene.traverse((o) => { if (o.userData.isOrbit) o.visible = showOrbits; });
  };
  $("btnLabels").onclick = () => {
    showLabels = !showLabels;
    $("btnLabels").classList.toggle("active", showLabels);
  };
  $("btnMoons").onclick = () => {
    showMoons = !showMoons;
    $("btnMoons").classList.toggle("active", showMoons);
  };
  $("spd").oninput = (e) => { speed = parseFloat(e.target.value); };
  $("fov").oninput = (e) => { camera.fov = parseFloat(e.target.value); camera.updateProjectionMatrix(); };
  $("focus").onchange = (e) => { focusId = e.target.value; setStats(focusId); cine = false; $("btnCine").classList.remove("active"); };
  $("btnReset").onclick = () => {
    cine = false; $("btnCine").classList.remove("active");
    const w = desiredCam(focusId);
    camera.position.copy(w.pos);
    controls.target.copy(w.target);
  };
  addEventListener("keydown", (e) => {
    const map = { "1": "mercury", "2": "venus", "3": "earth", "4": "mars", "5": "jupiter", "6": "saturn", "7": "uranus", "8": "neptune", "0": "sun", "9": "pluto" };
    if (e.code === "Space") { e.preventDefault(); $("btnPause").click(); }
    if (e.key === "[") { speed = clamp(speed / 1.25, 0.2, 220); $("spd").value = speed; }
    if (e.key === "]") { speed = clamp(speed * 1.25, 0.2, 220); $("spd").value = speed; }
    if (e.key.toLowerCase() === "c") $("btnCine").click();
    if (map[e.key]) {
      focusId = map[e.key];
      $("focus").value = focusId;
      setStats(focusId);
      cine = false; $("btnCine").classList.remove("active");
    }
  });
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  grade.uniforms.uRes.value.set(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

(function ticks() {
  const ret = $("ret");
  for (let i = 0; i < 72; i++) {
    const t = document.createElement("i");
    t.className = "tick";
    const long = i % 6 === 0;
    t.style.height = long ? "18px" : "9px";
    t.style.opacity = long ? 0.55 : 0.28;
    t.style.transform = `rotate(${i * 5}deg) translateY(calc(min(39vmin, 410px) * -1))`;
    ret.appendChild(t);
  }
})();

try {
  updateBodies();
  const home = desiredCam("sun");
  camera.position.copy(home.pos);
  controls.target.copy(home.target);
  bindUI();
  $("boot").classList.add("hide");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) speed = 4;
  requestAnimationFrame(tick);
} catch (err) {
  $("boot").querySelector("p").textContent = "此浏览器无法创建星图画布";
  console.error(err);
}
</script>
</body>
</html>
