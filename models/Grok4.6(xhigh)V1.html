<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOLARIS · 太阳系运动模型</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --gold: #e4c36a;
      --gold-dim: rgba(228, 195, 106, 0.18);
      --ice: #8fd4ee;
      --ink: #07080f;
      --panel: rgba(8, 10, 18, 0.55);
      --line: rgba(228, 195, 106, 0.22);
      --text: #e7e3d6;
      --muted: #8b8a97;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--text); font-family: "Rajdhani", "Noto Sans SC", sans-serif; }
    #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    #hud * { pointer-events: auto; }
    #hud .ghost { pointer-events: none; }

    header {
      position: absolute; top: 22px; left: 28px;
      text-shadow: 0 2px 18px rgba(0,0,0,0.7);
    }
    header .eyebrow {
      font-size: 11px; letter-spacing: 0.42em; color: var(--gold);
      text-transform: uppercase; margin-bottom: 6px;
    }
    header h1 {
      font-family: "Cinzel", serif; font-weight: 700; font-size: 34px;
      letter-spacing: 0.18em; line-height: 1;
    }
    header h1 span { color: var(--gold); }
    header p { margin-top: 8px; color: var(--muted); font-size: 13px; letter-spacing: 0.12em; }

    #date-chip {
      position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
      padding: 8px 18px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--panel); backdrop-filter: blur(16px);
      font-variant-numeric: tabular-nums; letter-spacing: 0.16em; font-size: 13px;
      color: var(--ice);
    }

    #planet-rail {
      position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 6px;
      padding: 12px 10px; border: 1px solid var(--line); border-radius: 18px;
      background: var(--panel); backdrop-filter: blur(18px);
      max-height: 72vh; overflow: auto;
    }
    #planet-rail button {
      appearance: none; border: 0; background: transparent; color: var(--text);
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      padding: 7px 10px; border-radius: 10px; font: 600 13px/1 "Rajdhani", "Noto Sans SC", sans-serif;
      letter-spacing: 0.08em; text-align: left; transition: background .25s, transform .25s;
    }
    #planet-rail button:hover { background: var(--gold-dim); }
    #planet-rail button.active { background: rgba(228,195,106,0.22); color: var(--gold); }
    #planet-rail i {
      width: 9px; height: 9px; border-radius: 50%; display: inline-block;
      box-shadow: 0 0 10px currentColor;
    }

    #dossier {
      position: absolute; left: 24px; bottom: 108px; width: min(360px, calc(100vw - 48px));
      padding: 18px 20px 16px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--panel); backdrop-filter: blur(20px);
      transform: translateY(8px); opacity: 0; transition: opacity .4s, transform .4s;
    }
    #dossier.show { opacity: 1; transform: none; }
    #dossier .kicker { color: var(--gold); font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; }
    #dossier h2 { font-family: "Cinzel", serif; font-size: 26px; letter-spacing: 0.12em; margin: 4px 0 2px; }
    #dossier .latin { color: var(--ice); font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; }
    #dossier .blurb { margin: 12px 0 14px; color: #c8c4b8; font-size: 13px; line-height: 1.65; }
    #dossier dl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
    #dossier dt { color: var(--muted); font-size: 11px; letter-spacing: 0.14em; }
    #dossier dd { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

    footer {
      position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 14px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--panel); backdrop-filter: blur(18px);
      white-space: nowrap;
    }
    footer button, #tour-btn {
      appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.03);
      color: var(--text); border-radius: 999px; padding: 6px 12px; cursor: pointer;
      font: 600 12px/1 "Rajdhani", "Noto Sans SC", sans-serif; letter-spacing: 0.12em;
    }
    footer button:hover { border-color: var(--gold); color: var(--gold); }
    footer .sep { width: 1px; height: 18px; background: var(--line); }
    footer input[type="range"] {
      width: 140px; accent-color: var(--gold); cursor: pointer;
    }
    #speed-readout { min-width: 92px; color: var(--gold); font-variant-numeric: tabular-nums; font-size: 13px; letter-spacing: 0.08em; }
    #hint {
      position: absolute; right: 24px; bottom: 26px; color: var(--muted);
      font-size: 12px; letter-spacing: 0.1em; text-align: right; line-height: 1.7;
    }

    #loader {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
      background: radial-gradient(ellipse at center, #14131c 0%, #000 70%);
      transition: opacity .9s ease, visibility .9s;
    }
    #loader.hide { opacity: 0; visibility: hidden; }
    #loader .sun {
      width: 86px; height: 86px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7d1, #ffb000 35%, #ff6a00 70%, #3a1000 100%);
      box-shadow: 0 0 40px 12px rgba(255, 170, 40, 0.55), 0 0 120px 30px rgba(255, 100, 0, 0.25);
      animation: pulse 1.6s ease-in-out infinite;
    }
    #loader p {
      margin-top: 22px; letter-spacing: 0.38em; font-size: 12px; color: var(--gold);
      text-transform: uppercase;
    }
    @keyframes pulse { 50% { transform: scale(1.06); filter: brightness(1.15); } }

    #cross { position: absolute; inset: 0; pointer-events: none; }
    #cross::before, #cross::after {
      content: ""; position: absolute; left: 50%; top: 50%; background: rgba(228,195,106,0.35);
    }
    #cross::before { width: 12px; height: 1px; transform: translate(-50%, -50%); }
    #cross::after { width: 1px; height: 12px; transform: translate(-50%, -50%); }

    @media (max-width: 860px) {
      header h1 { font-size: 22px; }
      #date-chip { top: 86px; }
      #planet-rail { right: 8px; padding: 8px 6px; }
      #hint { display: none; }
      footer { width: calc(100vw - 24px); justify-content: center; flex-wrap: wrap; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <header class="ghost">
      <div class="eyebrow">Heliospheric Atlas</div>
      <h1>SOLAR<span>IS</span></h1>
      <p>开普勒轨道 · 真实倾角 / 偏心率 / 自转</p>
    </header>
    <div id="date-chip">J2000 + 0.0 日</div>
    <nav id="planet-rail"></nav>
    <section id="dossier">
      <div class="kicker">观测档案</div>
      <h2 id="d-name">太阳</h2>
      <div class="latin" id="d-latin">Sol</div>
      <p class="blurb" id="d-blurb"></p>
      <dl id="d-stats"></dl>
    </section>
    <footer>
      <button id="pause-btn">暂停</button>
      <button id="tour-btn">巡游</button>
      <button id="reset-btn">总览</button>
      <span class="sep"></span>
      <span style="color:#8b8a97;font-size:12px;letter-spacing:0.14em;">时间倍率</span>
      <input id="speed" type="range" min="0" max="1000" value="220" />
      <span id="speed-readout">12.0 日/秒</span>
    </footer>
    <div id="hint" class="ghost">
      拖拽环视 · 滚轮推进 · 单击聚焦<br />
      1–8 行星 · 0 太阳 · 空格暂停
    </div>
    <div id="cross"></div>
  </div>
  <div id="loader">
    <div>
      <div class="sun"></div>
      <p>正在点燃日核</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const DEG = Math.PI / 180;
    const canvas = document.getElementById("c");

    const renderer = new THREE.WebGLRenderer({
      canvas, antialias: true, powerPreference: "high-performance", alpha: false
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = false;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010105);
    scene.fog = new THREE.FogExp2(0x02030a, 0.00055);

    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.08, 6000);
    camera.position.set(38, 22, 58);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 2.2;
    controls.maxDistance = 520;
    controls.target.set(0, 0, 0);
    controls.zoomToCursor = true;

    const clock = new THREE.Clock();
    const texLoaderBusy = [];

    /* -------------------- noise -------------------- */
    const perm = new Uint8Array(512);
    (function seed(s = 1337) {
      const p = new Uint8Array(256);
      for (let i = 0; i < 256; i++) p[i] = i;
      for (let i = 255; i > 0; i--) {
        s = (s * 16807) % 2147483647;
        const j = s % (i + 1);
        [p[i], p[j]] = [p[j], p[i]];
      }
      for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
    })();
    const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      const xf = x - Math.floor(x), yf = y - Math.floor(y), zf = z - Math.floor(z);
      const u = fade(xf), v = fade(yf), w = fade(zf);
      const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
      const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
      const g = (h, x, y, z) => {
        const hh = h & 15;
        const u = hh < 8 ? x : y;
        const v = hh < 4 ? y : hh === 12 || hh === 14 ? x : z;
        return ((hh & 1) ? -u : u) + ((hh & 2) ? -v : v);
      };
      return lerp(
        lerp(lerp(g(perm[AA], xf, yf, zf), g(perm[BA], xf - 1, yf, zf), u),
             lerp(g(perm[AB], xf, yf - 1, zf), g(perm[BB], xf - 1, yf - 1, zf), u), v),
        lerp(lerp(g(perm[AA + 1], xf, yf, zf - 1), g(perm[BA + 1], xf - 1, yf, zf - 1), u),
             lerp(g(perm[AB + 1], xf, yf - 1, zf - 1), g(perm[BB + 1], xf - 1, yf - 1, zf - 1), u), v), w
      );
    }
    function fbm3(x, y, z, oct = 5) {
      let v = 0, a = 0.5, f = 1, n = 0;
      for (let i = 0; i < oct; i++) {
        v += a * n3(x * f, y * f, z * f);
        n += a; a *= 0.5; f *= 2.02;
      }
      return v / n;
    }
    function sph(lat, lon, freq) {
      return fbm3(
        Math.cos(lat) * Math.cos(lon) * freq,
        Math.sin(lat) * freq,
        Math.cos(lat) * Math.sin(lon) * freq,
        6
      );
    }

    function canvasTex(size, fn, extra = {}) {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      const img = ctx.createImageData(size, size);
      const d = img.data;
      for (let y = 0; y < size; y++) {
        const lat = (0.5 - y / size) * Math.PI;
        for (let x = 0; x < size; x++) {
          const lon = (x / size) * Math.PI * 2 - Math.PI;
          const i = (y * size + x) * 4;
          const col = fn(lat, lon, x / size, y / size);
          d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = col[3] ?? 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      tex.wrapS = THREE.RepeatWrapping;
      Object.assign(tex, extra);
      return tex;
    }

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const mix = (a, b, t) => a + (b - a) * t;
    const rgb = (r, g, b, a = 255) => [
      clamp(r, 0, 255) | 0, clamp(g, 0, 255) | 0, clamp(b, 0, 255) | 0, a
    ];

    /* -------------------- textures -------------------- */
    function earthMaps(size = 1024) {
      const map = canvasTex(size, (lat, lon) => {
        const n = sph(lat, lon, 2.4);
        const n2 = sph(lat + 1.7, lon + 2.1, 6.0);
        const rid = Math.abs(sph(lat, lon + 3, 3.2));
        const ice = Math.pow(Math.abs(Math.sin(lat)), 8) + Math.max(0, Math.abs(lat) / (Math.PI / 2) - 0.78) * 2;
        const elev = n * 0.75 + n2 * 0.25 + 0.08;
        const land = elev > 0.04;
        if (ice > 0.72) return rgb(236 + n2 * 20, 242, 248);
        if (!land) {
          const deep = clamp(0.25 - elev, 0, 1);
          return rgb(8 + deep * 10, 42 + n2 * 20, 98 + n * 40);
        }
        const desert = Math.exp(-Math.pow((lat * 180 / Math.PI + 18) / 22, 2)) * (0.5 + n);
        const green = 70 + n2 * 50 - desert * 40;
        const r = 62 + desert * 110 + rid * 20;
        const g = green + rid * 18;
        const b = 38 + n * 20;
        return rgb(r, g, b);
      });
      const spec = canvasTex(size, (lat, lon) => {
        const n = sph(lat, lon, 2.4);
        const ice = Math.pow(Math.abs(Math.sin(lat)), 8);
        const land = n * 0.75 + 0.08 > 0.04 && ice < 0.72;
        return land ? rgb(168, 168, 168) : rgb(22, 28, 40);
      });
      spec.colorSpace = THREE.NoColorSpace;
      const bump = canvasTex(size, (lat, lon) => {
        const n = sph(lat, lon, 2.4);
        const n2 = sph(lat, lon, 10);
        const v = clamp((n * 0.7 + n2 * 0.3 + 0.2) * 255, 0, 255);
        return rgb(v, v, v);
      });
      bump.colorSpace = THREE.NoColorSpace;
      const lights = canvasTex(size, (lat, lon) => {
        const n = sph(lat, lon, 2.4);
        const land = n * 0.75 + 0.08 > 0.04 && Math.abs(lat) < 1.2;
        if (!land) return rgb(0, 0, 0);
        const cities = sph(lat * 1.2, lon * 1.4, 18);
        const pop = sph(lat, lon, 5);
        if (cities > 0.38 && pop > 0.05) {
          const g = (cities - 0.38) * 420;
          return rgb(255, 210, 140, clamp(g, 0, 255));
        }
        return rgb(0, 0, 0);
      });
      const clouds = canvasTex(size, (lat, lon) => {
        const n = sph(lat, lon + 0.4, 3.6);
        const n2 = sph(lat * 1.4, lon, 9);
        const v = clamp((n * 0.65 + n2 * 0.35 - 0.08) * 2.1, 0, 1);
        const a = Math.pow(v, 1.25) * 220;
        return rgb(245, 248, 255, a);
      });
      return { map, spec, bump, lights, clouds };
    }

    function gasTex(size, base, bands, spot) {
      return canvasTex(size, (lat, lon, u, v) => {
        const y = v * 2 - 1;
        const warp = sph(lat, lon, 3.5) * 0.12;
        const band = Math.sin((y + warp) * bands * Math.PI);
        const turb = sph(lat, lon * 1.2, 8);
        const r = base[0] + band * 28 + turb * 18;
        const g = base[1] + band * 18 + turb * 10;
        const b = base[2] + band * 12;
        if (spot) {
          const dx = (u - spot.u) * 2.1;
          const dy = (v - spot.v) * 4.4;
          const d = dx * dx + dy * dy;
          if (d < spot.r) {
            const k = 1 - d / spot.r;
            return rgb(r + k * 70, g - k * 20, b - k * 30);
          }
        }
        return rgb(r, g, b);
      });
    }

    function rockyTex(size, a, b, freq = 4) {
      return canvasTex(size, (lat, lon) => {
        const n = sph(lat, lon, freq);
        const c = sph(lat, lon, freq * 2.4);
        const crater = Math.pow(Math.max(0, sph(lat + 2, lon, 10) - 0.35), 2);
        return rgb(
          mix(a[0], b[0], n * 0.5 + 0.5) - crater * 50,
          mix(a[1], b[1], n * 0.5 + 0.5) - crater * 45,
          mix(a[2], b[2], c * 0.5 + 0.5) - crater * 40
        );
      });
    }

    function iceTex(size, a, b) {
      return canvasTex(size, (lat, lon) => {
        const n = sph(lat, lon, 3.2);
        const storm = Math.sin(lat * 8 + n * 4);
        return rgb(
          mix(a[0], b[0], n * 0.5 + 0.5) + storm * 8,
          mix(a[1], b[1], n * 0.5 + 0.5) + storm * 10,
          mix(a[2], b[2], n * 0.5 + 0.5) + storm * 14
        );
      });
    }

    function ringTex(inner, outer) {
      const w = 1024, h = 64;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      const img = ctx.createImageData(w, h);
      for (let x = 0; x < w; x++) {
        const t = x / w;
        const gaps = [
          [0.33, 0.015, 0.05],
          [0.47, 0.055, 0.02],
          [0.71, 0.012, 0.08],
          [0.88, 0.01, 0.15]
        ];
        let a = 210 * (0.55 + 0.45 * Math.sin(t * 80) * Math.sin(t * 17));
        for (const [c0, w0, cut] of gaps) {
          if (Math.abs(t - c0) < w0) a *= cut;
        }
        a *= 0.55 + 0.45 * (1 - Math.abs(t - 0.5) * 1.4);
        const r = 214 + Math.sin(t * 40) * 10;
        const g = 196 + Math.sin(t * 23) * 8;
        const b = 150 + Math.sin(t * 11) * 10;
        for (let y = 0; y < h; y++) {
          const i = (y * w + x) * 4;
          const edge = Math.sin((y / h) * Math.PI);
          img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b;
          img.data[i + 3] = clamp(a * edge, 0, 255);
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      tex.wrapS = THREE.ClampToEdgeWrapping;
      return tex;
    }

    /* -------------------- shaders -------------------- */
    const NOISE_GLSL = `
      float hash(vec3 p){
        p = fract(p*0.3183099+vec3(.1,.2,.3));
        p *= 17.0;
        return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
      }
      float vn(vec3 x){
        vec3 i=floor(x), f=fract(x);
        f=f*f*(3.0-2.0*f);
        return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),
                       mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                       mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
      }
      float fbm(vec3 p){
        float v=0.0,a=0.5;
        for(int i=0;i<6;i++){ v+=a*vn(p); p*=2.11; a*=0.5; }
        return v;
      }
    `;

    const sunMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec3 vPos; varying vec3 vN;
        void main(){
          vPos = position; vN = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
        }`,
      fragmentShader: `
        uniform float uTime; varying vec3 vPos; varying vec3 vN;
        ${NOISE_GLSL}
        void main(){
          vec3 p = normalize(vPos);
          float t = uTime * 0.08;
          float g = fbm(p * 3.2 + vec3(t, t*0.6, -t*0.4));
          float g2 = fbm(p * 8.0 - vec3(t*1.4, -t, t*0.7));
          float spot = smoothstep(0.62, 0.78, fbm(p*2.0+9.0));
          vec3 hot = vec3(1.0, 0.92, 0.62);
          vec3 mid = vec3(1.0, 0.55, 0.12);
          vec3 deep = vec3(0.55, 0.08, 0.01);
          vec3 col = mix(deep, mid, g);
          col = mix(col, hot, pow(g2, 1.6));
          col *= 1.0 - spot * 0.45;
          float rim = pow(1.0 - max(dot(vN, vec3(0,0,1)), 0.0), 1.4);

    function eccentricAnomaly(M, e) {
      let E = M;
      for (let i = 0; i < 10; i++) {
        E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      }
      return E;
    }
    function keplerXYZ(a, e, i, Omega, omega, M) {
      const E = eccentricAnomaly(M, e);
      const xv = a * (Math.cos(E) - e);
      const yv = a * Math.sqrt(1 - e * e) * Math.sin(E);
      const cosO = Math.cos(Omega), sinO = Math.sin(Omega);
      const cosi = Math.cos(i), sini = Math.sin(i);
      const cosw = Math.cos(omega), sinw = Math.sin(omega);
      const xh = xv * (cosO * cosw - sinO * sinw * cosi) - yv * (cosO * sinw + sinO * cosw * cosi);
      const yh = xv * (sinO * cosw + cosO * sinw * cosi) - yv * (sinO * sinw - cosO * cosw * cosi);
      const zh = xv * (sinw * sini) + yv * (cosw * sini);
      return new THREE.Vector3(xh, zh, yh);
    }
    function orbitCurve(a, e, i, Omega, omega, segs = 256) {
      const pts = [];
      for (let k = 0; k <= segs; k++) {
        const M = (k / segs) * Math.PI * 2;
        pts.push(keplerXYZ(a, e, i, Omega, omega, M));
      }
      return new THREE.BufferGeometry().setFromPoints(pts);
    }

          mat.onBeforeCompile = shader => {
            shader.vertexShader = shader.vertexShader
              .replace("#include <common>", "#include <common>\nvarying vec3 vWorldPos;\nvarying vec3 vWorldN;")
              .replace("#include <defaultnormal_vertex>", "#include <defaultnormal_vertex>\nvWorldN = normalize(mat3(modelMatrix) * objectNormal);")
              .replace("#include <project_vertex>", "#include <project_vertex>\nvWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;");
            shader.fragmentShader = shader.fragmentShader
              .replace("#include <common>", "#include <common>\nvarying vec3 vWorldPos;\nvarying vec3 vWorldN;")
              .replace(
                "#include <emissivemap_fragment>",
                `#include <emissivemap_fragment>
                float daySide = dot(normalize(vWorldN), normalize(-vWorldPos));
                totalEmissiveRadiance *= 1.0 - smoothstep(-0.08, 0.18, daySide);`
              );
          };
        }
        if (def.id === "jupiter" || def.id === "saturn") {
          mat.roughness = 0.45; mat.metalness = 0.08;
        }
        if (def.id === "uranus" || def.id === "neptune") {
          mat.roughness = 0.35; mat.metalness = 0.12;
        }
        mesh = new THREE.Mesh(new THREE.SphereGeometry(def.radius, 72, 56), mat);
        mesh.castShadow = false;
        mesh.receiveShadow = false;

        if (def.id === "earth") {
          const clouds = new THREE.Mesh(
            new THREE.SphereGeometry(def.radius * 1.018, 72, 56),
            new THREE.MeshStandardMaterial({
              map: earthMapsReady.clouds, transparent: true, depthWrite: false,
              roughness: 1, metalness: 0, opacity: 0.9
            })
          );
          clouds.userData.cloudSpin = true;
          spin.add(clouds);
          addGlow(root, def.radius, 0x4ea2ff, 1.26);
        }
        if (def.id === "venus") addGlow(root, def.radius, 0xffd9a0, 1.2);
        if (def.id === "mars") addGlow(root, def.radius, 0xff6a3a, 1.16);
        if (def.id === "titan") addGlow(root, def.radius, 0xffb060, 1.18);

        if (def.id === "saturn") {
          const rg = new THREE.RingGeometry(def.radius * 1.35, def.radius * 2.45, 192, 4);
          const pos = rg.attributes.position;
          const uv = rg.attributes.uv;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), y = pos.getY(i);
            const r = Math.hypot(x, y);
            uv.setXY(i, (r - def.radius * 1.35) / (def.radius * 1.1), 0.5);
          }
          const rm = new THREE.MeshStandardMaterial({
            map: saturnRingMap, transparent: true, side: THREE.DoubleSide,
            roughness: 0.55, metalness: 0.15, depthWrite: false
          });
          const rings = new THREE.Mesh(rg, rm);
          rings.rotation.x = Math.PI / 2;
          rings.castShadow = false;
          rings.receiveShadow = false;
          tilt.add(rings);
        }
        if (def.id === "uranus" || def.id === "jupiter" || def.id === "neptune") {
          const inner = def.radius * (def.id === "jupiter" ? 1.4 : 1.3);
          const outer = def.radius * (def.id === "jupiter" ? 1.7 : 1.7);
          const rg = new THREE.RingGeometry(inner, outer, 96);
          const rm = new THREE.MeshBasicMaterial({
            color: def.id === "uranus" ? 0x9ad0d4 : def.id === "neptune" ? 0x6a8cff : 0xc8b48a,
            transparent: true, opacity: def.id === "jupiter" ? 0.08 : 0.18,
            side: THREE.DoubleSide, depthWrite: false
          });
          const rings = new THREE.Mesh(rg, rm);
          rings.rotation.x = Math.PI / 2;
          tilt.add(rings);
        }
      }

      mesh.userData.bodyId = def.id;
      spin.add(mesh);
      scene.add(root);

      const body = {
        def, root, tilt, spin, mesh,
        orbit: makeOrbitLine(def),
        moons: [],
        a: def.au ? visualA(def.au) : 0
      };
      bodies.push(body);
      pickables.push(mesh);
      return body;
    }

    const catalog = {};
    for (const def of PLANETS) catalog[def.id] = createPlanet(def);

    function moonTexKey(name) {
      if (name.includes("月")) return "moon";
      if (name.includes("一") && name.startsWith("木")) return "io";
      if (name.includes("二") && name.startsWith("木")) return "europa";
      if (name.includes("三")) return "ganymede";
      if (name.includes("四")) return "callisto";
      if (name.includes("六")) return "titan";
      return "moon";
    }

    for (const [hostId, list] of Object.entries(MOONS)) {
      const host = catalog[hostId];
      for (const m of list) {
        const g = new THREE.Group();
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(m.radius, 32, 24),
          new THREE.MeshStandardMaterial({
            map: texCache[moonTexKey(m.name)],
            roughness: 0.85, metalness: 0.02
          })
        );
        mesh.castShadow = false;
        mesh.userData.bodyId = hostId;
        g.add(mesh);
        if (m.name.includes("六")) addGlow(g, m.radius, 0xffb060, 1.22);
        host.root.add(g);
        const pts = [];
        for (let k = 0; k <= 128; k++) {
          const th = (k / 128) * Math.PI * 2;
          pts.push(new THREE.Vector3(Math.cos(th) * m.a, 0, Math.sin(th) * m.a));
        }
        const ol = new THREE.LineLoop(
          new THREE.BufferGeometry().setFromPoints(pts),
          new THREE.LineBasicMaterial({ color: m.color, transparent: true, opacity: 0.18 })
        );
        ol.rotation.x = m.i * DEG;
        host.root.add(ol);
        host.moons.push({ def: m, group: g, mesh });
        pickables.push(mesh);
      }
    }

    /* -------------------- belts / comet / meteors -------------------- */
    function makeBelt(count, r0, r1, ySpread, color, size, scale = 1) {
      const g = new THREE.IcosahedronGeometry(size, 0);
      const m = new THREE.MeshStandardMaterial({
        color, roughness: 0.9, metalness: 0.05, flatShading: true
      });
      const inst = new THREE.InstancedMesh(g, m, count);
      inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      const dummy = new THREE.Object3D();
      const meta = [];
      for (let i = 0; i < count; i++) {
        const a = mix(r0, r1, Math.random());
        const e = Math.random() * 0.08;
        const th = Math.random() * Math.PI * 2;
        const inc = (Math.random() - 0.5) * ySpread;
        meta.push({ a, e, th, inc, spin: Math.random() * Math.PI * 2, spd: 0.12 + Math.random() * 0.25 });
        dummy.position.set(Math.cos(th) * a, Math.sin(inc) * a * 0.08, Math.sin(th) * a);
        dummy.scale.setScalar(scale * (0.4 + Math.random() * 1.3));
        dummy.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
        dummy.updateMatrix();
        inst.setMatrixAt(i, dummy.matrix);
      }
      inst.userData.meta = meta;
      inst.userData.dummy = dummy;
      inst.castShadow = false;
      scene.add(inst);
      return inst;
    }
    const asteroids = makeBelt(1400, visualA(2.1), visualA(3.3), 0.28, 0x8a8176, 0.07, 1);
    const kuiper = makeBelt(1800, visualA(32), visualA(48), 0.55, 0x7d8899, 0.055, 0.85);

    const comet = {
      a: visualA(17.8), e: 0.967, i: 162.3 * DEG, O: 58.4 * DEG, w: 111.3 * DEG,
      period: 27797, L0: 40
    };
    const cometGroup = new THREE.Group();
    const cometCore = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 16, 12),
      new THREE.MeshStandardMaterial({ color: 0xddeeff, emissive: 0x88bbff, emissiveIntensity: 0.6, roughness: 0.4 })
    );
    cometGroup.add(cometCore);
    const tailGeo = new THREE.BufferGeometry();
    const tailN = 180;
    tailGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(tailN * 3), 3));
    tailGeo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(tailN * 3), 3));
    const tail = new THREE.Points(tailGeo, new THREE.PointsMaterial({
      size: 0.28, vertexColors: true, transparent: true, opacity: 0.85,
      depthWrite: false, blending: THREE.AdditiveBlending
    }));
    scene.add(cometGroup);
    scene.add(tail);

    const meteorGeo = new THREE.BufferGeometry();
    const meteorN = 40;
    meteorGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(meteorN * 3), 3));
    const meteors = new THREE.Line(meteorGeo, new THREE.LineBasicMaterial({
      color: 0xfff4d2, transparent: true, opacity: 0.0
    }));
    scene.add(meteors);
    let meteorT = 0, meteorOrigin = new THREE.Vector3(), meteorDir = new THREE.Vector3();

    /* -------------------- solar wind -------------------- */
    const windN = 600;
    const windGeo = new THREE.BufferGeometry();
    const windPos = new Float32Array(windN * 3);
    const windMeta = [];
    for (let i = 0; i < windN; i++) {
      const dir = new THREE.Vector3().randomDirection();
      const r = 6 + Math.random() * 160;
      windPos[i * 3] = dir.x * r; windPos[i * 3 + 1] = dir.y * r; windPos[i * 3 + 2] = dir.z * r;
      windMeta.push({ dir, r, v: 8 + Math.random() * 18 });
    }
    windGeo.setAttribute("position", new THREE.BufferAttribute(windPos, 3));
    const wind = new THREE.Points(windGeo, new THREE.PointsMaterial({
      color: 0xffc878, size: 0.18, transparent: true, opacity: 0.35,
      depthWrite: false, blending: THREE.AdditiveBlending
    }));
    scene.add(wind);

    /* -------------------- post -------------------- */
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.86, 0.72, 0.72);
    composer.addPass(bloom);
    const cine = new ShaderPass(CinematicShader);
    composer.addPass(cine);
    composer.addPass(new OutputPass());

    /* -------------------- ui / camera state -------------------- */
    const rail = document.getElementById("planet-rail");
    const dossier = document.getElementById("dossier");
    PLANETS.forEach((p, idx) => {
      const b = document.createElement("button");
      b.dataset.id = p.id;
      b.innerHTML = `<i style="background:#${p.color.toString(16).padStart(6, "0")};color:#${p.color.toString(16).padStart(6, "0")}"></i>${p.name}`;
      b.addEventListener("click", () => focusBody(p.id, true));
      rail.appendChild(b);
    });

    function fillDossier(def) {
      document.getElementById("d-name").textContent = def.name;
      document.getElementById("d-latin").textContent = def.latin;
      document.getElementById("d-blurb").textContent = def.blurb;
      document.getElementById("d-stats").innerHTML = def.stats.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
      dossier.classList.add("show");
      rail.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.id === def.id));
    }
    fillDossier(PLANETS[0]);

    let focusId = "sun";
    let follow = false;
    let lastFocusPos = new THREE.Vector3();
    let intro = 1;
    let paused = false;
    let simDays = 0;
    let rotDays = 0;
    let timeScale = 12;
    let touring = false;
    let tourIndex = 0;
    let tourWait = 0;
    const tourOrder = ["sun", "mercury", "venus", "earth", "mars", "jupiter", "saturn", "uranus", "neptune", "pluto"];

    function bodyWorld(id, out = new THREE.Vector3()) {
      catalog[id].root.getWorldPosition(out);
      return out;
    }

    function focusBody(id, user = false) {
      focusId = id;
      follow = id !== "sun";
      if (user) touring = false;
      fillDossier(PLANETS.find(p => p.id === id));
    }

    function desiredCamOffset(id) {
      const r = catalog[id].def.radius;
      const d = Math.max(r * 7.2, 6.5) + (id === "sun" ? 18 : 0);
      if (id === "sun") return new THREE.Vector3(d * 0.55, d * 0.28, d);
      return new THREE.Vector3(d * 0.72, d * 0.38, d * 0.78);
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    canvas.addEventListener("pointerdown", e => {
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(pickables, false);
      if (hits.length) focusBody(hits[0].object.userData.bodyId, true);
    });

    document.getElementById("pause-btn").onclick = togglePause;
    document.getElementById("reset-btn").onclick = () => { touring = false; focusBody("sun", true); follow = false; };
    document.getElementById("tour-btn").onclick = () => {
      touring = !touring;
      tourIndex = 0; tourWait = 0;
      if (touring) focusBody(tourOrder[0]);
      document.getElementById("tour-btn").textContent = touring ? "停止巡游" : "巡游";
    };
    const speedEl = document.getElementById("speed");
    const speedRead = document.getElementById("speed-readout");
    function syncSpeed() {
      const t = speedEl.value / 1000;
      timeScale = Math.pow(t, 1.7) * 180;
      speedRead.textContent = timeScale < 1 ? `${timeScale.toFixed(2)} 日/秒` : `${timeScale.toFixed(1)} 日/秒`;
    }
    speedEl.addEventListener("input", syncSpeed);
    syncSpeed();

    function togglePause() {
      paused = !paused;
      document.getElementById("pause-btn").textContent = paused ? "继续" : "暂停";
    }
    addEventListener("keydown", e => {
      if (e.code === "Space") { e.preventDefault(); togglePause(); }
      if (e.key === "0") focusBody("sun", true);
      const map = { 1: "mercury", 2: "venus", 3: "earth", 4: "mars", 5: "jupiter", 6: "saturn", 7: "uranus", 8: "neptune", 9: "pluto" };
      if (map[e.key]) focusBody(map[e.key], true);
      if (e.key === "[") { speedEl.value = Math.max(0, +speedEl.value - 40); syncSpeed(); }
      if (e.key === "]") { speedEl.value = Math.min(1000, +speedEl.value + 40); syncSpeed(); }
    });

    /* -------------------- animation -------------------- */
    function updateBodies(days, rDays) {
      for (const b of bodies) {
        const d = b.def;
        if (d.au) {
          const n = Math.PI * 2 / d.period;
          const M0 = (d.L0 - d.O - d.w) * DEG;
          const M = M0 + n * days;
          const p = keplerXYZ(b.a, d.e, d.i * DEG, d.O * DEG, d.w * DEG, M);
          b.root.position.copy(p);
        }
        const spin = (rDays / d.rot) * Math.PI * 2;
        b.spin.rotation.y = spin;
        for (const moon of b.moons) {
          const md = moon.def;
          const ang = (days / md.period) * Math.PI * 2;
          const r = md.a * (1 - md.e * md.e) / (1 + md.e * Math.cos(ang));
          const x = Math.cos(ang) * r;
          const z = Math.sin(ang) * r;
          const inc = md.i * DEG;
          moon.group.position.set(x, z * Math.sin(inc), z * Math.cos(inc));
          moon.mesh.rotation.y = (rDays / md.rot) * Math.PI * 2;
        }
        const clouds = b.spin.children.find(c => c.userData.cloudSpin);
        if (clouds) clouds.rotation.y = rDays * 0.35;
      }

      const cpos = keplerXYZ(comet.a, comet.e, comet.i, comet.O, comet.w, (comet.L0 * DEG) + (Math.PI * 2 / comet.period) * days);
      cometGroup.position.copy(cpos);
      const away = cpos.clone().normalize();
      const tp = tailGeo.attributes.position;
      const tc = tailGeo.attributes.color;
      const dist = cpos.length();
      const bright = clamp(28 / dist, 0.05, 1.4);
      for (let i = 0; i < tailN; i++) {
        const t = i / tailN;
        const jitter = new THREE.Vector3(
          Math.sin(i * 1.7 + days) * t * 0.35,
          Math.cos(i * 2.1 + days * 0.7) * t * 0.28,
          Math.sin(i * 1.3) * t * 0.3
        );
        const p = cpos.clone().add(away.clone().multiplyScalar(t * 7.5 * bright)).add(jitter);
        tp.setXYZ(i, p.x, p.y, p.z);
        tc.setXYZ(i, 0.55 + (1 - t) * 0.45, 0.75, 1.0);
      }
      tp.needsUpdate = true; tc.needsUpdate = true;
      tail.material.opacity = 0.25 + bright * 0.6;
      cometCore.material.emissiveIntensity = 0.3 + bright;

      const dummy = asteroids.userData.dummy;
      const upd = (mesh, rate) => {
        const meta = mesh.userData.meta;
        for (let i = 0; i < meta.length; i += 1) {
          const m = meta[i];
          m.th += rate * m.spd * 0.002;
          const rr = m.a * (1 - m.e * Math.cos(m.th));
          dummy.position.set(Math.cos(m.th) * rr, Math.sin(m.th * 0.7 + m.inc) * m.a * 0.045, Math.sin(m.th) * rr);
          dummy.rotation.set(m.spin + days * 0.1, m.spin * 0.4, m.inc);
          dummy.scale.setScalar(dummy.scale.x || 1);
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);
        }
        mesh.instanceMatrix.needsUpdate = true;
      };
      if ((days * 10 | 0) % 2 === 0) {
        /* lighter: rotate whole belts */
      }
      asteroids.rotation.y = days * 0.0016;
      kuiper.rotation.y = days * 0.00045;
    }

    function updateWind(dt) {
      const arr = windGeo.attributes.position.array;
      for (let i = 0; i < windN; i++) {
        const m = windMeta[i];
        m.r += m.v * dt;
        if (m.r > 170) m.r = 6 + Math.random() * 4;
        arr[i * 3] = m.dir.x * m.r;
        arr[i * 3 + 1] = m.dir.y * m.r;
        arr[i * 3 + 2] = m.dir.z * m.r;
      }
      windGeo.attributes.position.needsUpdate = true;
    }

    function updateMeteors(dt) {
      meteorT -= dt;
      if (meteorT < 0) {
        meteorT = 4 + Math.random() * 8;
        meteorOrigin.set((Math.random() - 0.5) * 80, 10 + Math.random() * 30, (Math.random() - 0.5) * 80);
        meteorDir.set(-0.6 - Math.random(), -0.35, 0.2 + Math.random() * 0.3).normalize();
      }
      const life = 1 - Math.abs(meteorT - 0.35) / 0.55;
      const op = clamp(life, 0, 1);
      meteors.material.opacity = op * 0.85;
      const arr = meteorGeo.attributes.position.array;
      const t = clamp(0.7 - meteorT, 0, 1.4);
      for (let i = 0; i < meteorN; i++) {
        const s = t - i * 0.012;
        arr[i * 3] = meteorOrigin.x + meteorDir.x * s * 28;
        arr[i * 3 + 1] = meteorOrigin.y + meteorDir.y * s * 28;
        arr[i * 3 + 2] = meteorOrigin.z + meteorDir.z * s * 28;
      }
      meteorGeo.attributes.position.needsUpdate = true;
    }

    const tmp = new THREE.Vector3();
    const sunNdc = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      if (!paused) {
        simDays += dt * timeScale;
        rotDays += dt * Math.min(timeScale, 2.8);
        updateBodies(simDays, rotDays);
        updateWind(dt);
        updateMeteors(dt);
      }

      sunMat.uniforms.uTime.value = t;
      coronaMat.uniforms.uTime.value = t;
      nebulaMat.uniforms.uTime.value = t;
      cine.uniforms.uTime.value = t;

      if (intro > 0) {
        intro = Math.max(0, intro - dt * 0.18);
        const k = 1 - Math.pow(intro, 2);
        camera.position.lerpVectors(new THREE.Vector3(7, 2.4, 9), new THREE.Vector3(42, 24, 64), k);
        controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.1);
      }

      const fp = bodyWorld(focusId, tmp);
      lastFocusPos.copy(fp);
      controls.target.lerp(fp, 1 - Math.pow(0.0008, dt));

      if (follow) {
        const off = desiredCamOffset(focusId);
        const goal = fp.clone().add(off);
        if (!controls.userRotated) camera.position.lerp(goal, 1 - Math.pow(0.02, dt));
      } else if (focusId === "sun" && intro <= 0 && !touring) {
        /* free */
      }

      if (touring && intro <= 0) {
        tourWait += dt;
        const hold = tourOrder[tourIndex] === "sun" ? 5.5 : 7.2;
        const off = desiredCamOffset(focusId);
        camera.position.lerp(fp.clone().add(off), 1 - Math.pow(0.04, dt));
        if (tourWait > hold) {
          tourWait = 0;
          tourIndex = (tourIndex + 1) % tourOrder.length;
          focusBody(tourOrder[tourIndex]);
        }
      }

      controls.update();

      sunNdc.copy(catalog.sun.root.position).project(camera);
      const on = sunNdc.z < 1 && sunNdc.x > -1.2 && sunNdc.x < 1.2 && sunNdc.y > -1.2 && sunNdc.y < 1.2;
      cine.uniforms.uSun.value.set(sunNdc.x * 0.5 + 0.5, sunNdc.y * 0.5 + 0.5);
      cine.uniforms.uSunOn.value = on ? 1 : 0;

      const date = document.getElementById("date-chip");
      const years = simDays / 365.256;
      date.textContent = `J2000 + ${simDays.toFixed(1)} 日  ·  ${years.toFixed(3)} 年`;

      composer.render();
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
      composer.setSize(innerWidth, innerHeight);
      cine.uniforms.uRes.value.set(innerWidth, innerHeight);
      bloom.setSize(innerWidth, innerHeight);
    });

    let drag = false;
    canvas.addEventListener("pointerdown", () => { drag = false; });
    canvas.addEventListener("pointermove", e => { if (e.buttons) drag = true; });
    controls.addEventListener("start", () => { controls.userRotated = true; });
    controls.addEventListener("end", () => { setTimeout(() => controls.userRotated = false, 2500); });

    requestAnimationFrame(() => {
      updateBodies(0, 0);
      composer.render();
      document.getElementById("loader").classList.add("hide");
      animate();
    });
  </script>
</body>
</html>
