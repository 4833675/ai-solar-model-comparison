  inv[0]=m[5]*m[10]*m[15]-m[5]*m[11]*m[14]-m[9]*m[6]*m[15]+m[9]*m[7]*m[14]+m[13]*m[6]*m[11]-m[13]*m[7]*m[10];
  inv[4]=-m[4]*m[10]*m[15]+m[4]*m[11]*m[14]+m[8]*m[6]*m[15]-m[8]*m[7]*m[14]-m[12]*m[6]*m[11]+m[12]*m[7]*m[10];
  inv[8]=m[4]*m[9]*m[15]-m[4]*m[11]*m[13]-m[8]*m[5]*m[15]+m[8]*m[7]*m[13]+m[12]*m[5]*m[11]-m[12]*m[7]*m[9];
  inv[12]=-m[4]*m[9]*m[14]+m[4]*m[10]*m[13]+m[8]*m[5]*m[14]-m[8]*m[6]*m[13]-m[12]*m[5]*m[10]+m[12]*m[6]*m[9];
  inv[1]=-m[1]*m[10]*m[15]+m[1]*m[11]*m[14]+m[9]*m[2]*m[15]-m[9]*m[3]*m[14]-m[13]*m[2]*m[11]+m[13]*m[3]*m[10];
  inv[5]=m[0]*m[10]*m[15]-m[0]*m[11]*m[14]-m[8]*m[2]*m[15]+m[8]*m[3]*m[14]+m[12]*m[2]*m[11]-m[12]*m[3]*m[10];
  inv[9]=-m[0]*m[9]*m[15]+m[0]*m[11]*m[13]+m[8]*m[1]*m[15]-m[8]*m[3]*m[13]-m[12]*m[1]*m[11]+m[12]*m[3]*m[9];
  inv[13]=m[0]*m[9]*m[14]-m[0]*m[10]*m[13]-m[8]*m[1]*m[14]+m[8]*m[2]*m[13]+m[12]*m[1]*m[10]-m[12]*m[2]*m[9];
  inv[2]=m[1]*m[6]*m[15]-m[1]*m[7]*m[14]-m[5]*m[2]*m[15]+m[5]*m[3]*m[14]+m[13]*m[2]*m[7]-m[13]*m[3]*m[6];
  inv[6]=-m[0]*m[6]*m[15]+m[0]*m[7]*m[14]+m[4]*m[2]*m[15]-m[4]*m[3]*m[14]-m[12]*m[2]*m[7]+m[12]*m[3]*m[6];
  inv[10]=m[0]*m[5]*m[15]-m[0]*m[7]*m[13]-m[4]*m[1]*m[15]+m[4]*m[3]*m[13]+m[12]*m[1]*m[7]-m[12]*m[3]*m[5];
  inv[14]=-m[0]*m[5]*m[14]+m[0]*m[6]*m[13]+m[4]*m[1]*m[14]-m[4]*m[2]*m[13]-m[12]*m[1]*m[6]+m[12]*m[2]*m[5];
  inv[3]=-m[1]*m[6]*m[11]+m[1]*m[7]*m[10]+m[5]*m[2]*m[11]-m[5]*m[3]*m[10]-m[9]*m[2]*m[7]+m[9]*m[3]*m[6];
  inv[7]=m[0]*m[6]*m[11]-m[0]*m[7]*m[10]-m[4]*m[2]*m[11]+m[4]*m[3]*m[10]+m[8]*m[2]*m[7]-m[8]*m[3]*m[6];
  inv[11]=-m[0]*m[5]*m[11]+m[0]*m[7]*m[9]+m[4]*m[1]*m[11]-m[4]*m[3]*m[9]-m[8]*m[1]*m[7]+m[8]*m[3]*m[5];
  inv[15]=m[0]*m[5]*m[10]-m[0]*m[6]*m[9]-m[4]*m[1]*m[10]+m[4]*m[2]*m[9]+m[8]*m[1]*m[6]-m[8]*m[2]*m[5];
  let det = m[0]*inv[0]+m[1]*inv[4]+m[2]*inv[8]+m[3]*inv[12];
  if(!det) return mat4Identity();
  det = 1/det;
  for(let i=0;i<16;i++) inv[i]*=det;
  return inv;
}
function mat4FromBasis(xAxis, yAxis, zAxis){
  return new Float32Array([
    xAxis[0], xAxis[1], xAxis[2], 0,
    yAxis[0], yAxis[1], yAxis[2], 0,
    zAxis[0], zAxis[1], zAxis[2], 0,
    0,0,0,1
  ]);
}
function transformPoint(m, p){
  const x=p[0],y=p[1],z=p[2];
  return [
    m[0]*x+m[4]*y+m[8]*z+m[12],
    m[1]*x+m[5]*y+m[9]*z+m[13],
    m[2]*x+m[6]*y+m[10]*z+m[14],
  ];
}
function mat3Identity(){
  return new Float32Array([1,0,0, 0,1,0, 0,0,1]);
}
function mat3FromBasis(xAxis, yAxis, zAxis){
  return new Float32Array([
    xAxis[0], xAxis[1], xAxis[2],

  ]);
}
function projectPoint(vp, p, w, h){
  const x=p[0],y=p[1],z=p[2];
  const cx=vp[0]*x+vp[4]*y+vp[8]*z+vp[12];
  const cy=vp[1]*x+vp[5]*y+vp[9]*z+vp[13];
  const cz=vp[2]*x+vp[6]*y+vp[10]*z+vp[14];
  const cw=vp[3]*x+vp[7]*y+vp[11]*z+vp[15];
  if(cw <= 0.001) return null;
  const ndcX = cx/cw, ndcY = cy/cw, ndcZ = cz/cw;
  return {
    x: (ndcX*0.5+0.5)*w,
    y: (1-(ndcY*0.5+0.5))*h,
    z: ndcZ, w: cw
  };
}

function dateToJD(date){
  return date.getTime()/DAY_MS + 2440587.5;
}
function jdToDate(jd){
  return new Date((jd - 2440587.5) * DAY_MS);
}
function centuriesT(jd){
  return (jd - J2000) / 36525;
}
function wrapPi(m){
  m = m % (2*Math.PI);
  if(m > Math.PI) m -= 2*Math.PI;
  if(m < -Math.PI) m += 2*Math.PI;
  return m;
}
function wrapDeg(d){
  d = d % 360;
  if(d < 0) d += 360;
  return d;
}

// 开普勒方程
function solveKepler(M, e){
  M = wrapPi(M);
  let E = M + e*Math.sin(M)*(1 + e*Math.cos(M));
  for(let i=0;i<12;i++){
    const dE = (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E));
    E -= dE;
    if(Math.abs(dE) < 1e-13) break;
  }
  return E;
}

// 轨道根数 → 黄道坐标（AU）
function elementsToEcliptic(a,e,I,L,wbar,Om, T){
  a = a + 0*T; // rates applied outside if needed
  // callers pass rates already applied
  const w = (wbar - Om) * DEG;
  const OmR = Om * DEG;
  const Ir = I * DEG;
  const M = wrapPi((L - wbar) * DEG);
  const E = solveKepler(M, e);
  const xp = a * (Math.cos(E) - e);
  const yp = a * Math.sqrt(1 - e*e) * Math.sin(E);
  const cw = Math.cos(w), sw = Math.sin(w);
  const cO = Math.cos(OmR), sO = Math.sin(OmR);
  const cI = Math.cos(Ir), sI = Math.sin(Ir);
  const x = (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp;
  const y = (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp;
  const z = (sw*sI)*xp + (cw*sI)*yp;
  return [x,y,z]; // ecliptic
}

function planetState(body, jd){
  const T = centuriesT(jd);
  const a = body.a + body.da*T;
  const e = body.e + body.de*T;
  const I = body.I + body.dI*T;
  const L = body.L + body.dL*T;
  const wbar = body.wbar + body.dwbar*T;
  const Om = body.Om + body.dOm*T;
  const ecl = elementsToEcliptic(a,e,I,L,wbar,Om,T);
  // world = (x_ecl, z_ecl, -y_ecl)
  const world = [ecl[0], ecl[2], -ecl[1]];
  return {a,e,I,L,wbar,Om, ecl, world, rAU: Math.hypot(ecl[0],ecl[1],ecl[2])};
}

function meanMotionJupiter(jd){
  // from dL/dt per century
  const T = centuriesT(jd);
  // n ≈ dL/dt in deg/day = dL_century / 36525
  return PLANETS[4].dL / 36525 * DEG; // rad/day
}

function halleystate(jd){
  const P = HALLEY.periodDays;
  const M = 2*Math.PI*(jd - HALLEY.TpJD) / P;
  const e = HALLEY.e, a = HALLEY.a;
  const E = solveKepler(M, e);
  const xp = a * (Math.cos(E) - e);
  const yp = a * Math.sqrt(1 - e*e) * Math.sin(E);
  const w = HALLEY.omega * DEG;
  const OmR = HALLEY.Om * DEG;
  const Ir = HALLEY.I * DEG;
  const cw = Math.cos(w), sw = Math.sin(w);
  const cO = Math.cos(OmR), sO = Math.sin(OmR);
  const cI = Math.cos(Ir), sI = Math.sin(Ir);
  const x = (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp;
  const y = (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp;
  const z = (sw*sI)*xp + (cw*sI)*yp;
  const world = [x, z, -y];
  return {ecl:[x,y,z], world, rAU: Math.hypot(x,y,z), M, E};
}

  const abs = Math.abs(daysPerSec);

  const secPerSec = abs * 86400;
  if(secPerSec < 0.9) return sign + secPerSec.toFixed(3) + ' 秒/秒';
  if(secPerSec < 60) return sign + secPerSec.toFixed(1) + ' 秒/秒';
  const minPerSec = secPerSec / 60;

function compileShader(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(sh);
    console.error(log, src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));
    throw new Error('shader: '+log);
  }
  return sh;
}
function createProgram(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    throw new Error('link: '+gl.getProgramInfoLog(p));
  }
  return p;
}
function getUniforms(prog){
  const u = {};
  const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){
    const info = gl.getActiveUniform(prog, i);
    const name = info.name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(prog, info.name);
  }
  return u;
}

// ---------- 几何：UV 球（右手、外向法线） ----------
function createSphere(radius, widthSeg, heightSeg){
  // 确保外向：参数 u→lon, v→lat
  const positions = [], normals = [], uvs = [], indices = [];
  for(let y=0;y<=heightSeg;y++){
    const v = y/heightSeg;
    const phi = v * Math.PI; // 0..pi 从北极
    for(let x=0;x<=widthSeg;x++){
      const u = x/widthSeg;
      const theta = u * Math.PI * 2;
      const nx = Math.sin(phi) * Math.cos(theta);
      const ny = Math.cos(phi);
      const nz = Math.sin(phi) * Math.sin(theta);
      positions.push(nx*radius, ny*radius, nz*radius);
      normals.push(nx, ny, nz);
      uvs.push(u, v);
    }
  }
  const stride = widthSeg + 1;
  for(let y=0;y<heightSeg;y++){
    for(let x=0;x<widthSeg;x++){
      const a = y*stride + x;
      const b = a + 1;
      const c = a + stride;
      const d = c + 1;
      // 外向（CCW from outside）：equator 上手算叉积朝外
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
  }
  return {positions:new Float32Array(positions), normals:new Float32Array(normals), uvs:new Float32Array(uvs), indices:new Uint32Array(indices)};
}

function createRingMesh(r0, r1, segs){
  const positions = [], normals = [], uvs = [], indices = [];
  for(let i=0;i<=segs;i++){
    const t = i/segs;
    const ang = t * Math.PI * 2;
    const c = Math.cos(ang), s = Math.sin(ang);
    // 两个顶点：内、外
    positions.push(c*r0, 0, s*r0,  c*r1, 0, s*r1);
    normals.push(0,1,0,  0,1,0);
    uvs.push(t, 0,  t, 1);
  }
  for(let i=0;i<segs;i++){
    const a = i*2, b = a+1, c = a+2, d = a+3;
    // 双面绘制时绕序不敏感，但保持一致
    indices.push(a, c, b);
    indices.push(b, c, d);
  }
  return {positions:new Float32Array(positions), normals:new Float32Array(normals), uvs:new Float32Array(uvs), indices:new Uint32Array(indices)};
}

function createMeshBuffer(mesh){
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const pb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, pb);
  gl.bufferData(gl.ARRAY_BUFFER, mesh.positions, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const nb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, nb);
  gl.bufferData(gl.ARRAY_BUFFER, mesh.normals, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
  const ub = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ub);
  gl.bufferData(gl.ARRAY_BUFFER, mesh.uvs, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.indices, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return {vao, count: mesh.indices.length};
}

// ---------- 着色器公共 ----------
const GLSL_NOISE = `
float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }
float hash13(vec3 p){
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yzx + 33.33);
  return fract((p.x + p.y) * p.z);
}
vec3 hash33(vec3 p){
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yxz + 33.33);
  return fract((p.xxy + p.yxx) * p.zyx);
}
float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f*f*(3.0-2.0*f);
  return mix(
    mix(mix(hash13(i+vec3(0,0,0)), hash13(i+vec3(1,0,0)), f.x),
        mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), f.x), f.y),
    mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), f.x),
        mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), f.x), f.y),
    f.z);
}
mat3 rotY3(float a){ float c=cos(a),s=sin(a); return mat3(c,0,-s, 0,1,0, s,0,c); }
mat3 rotX3(float a){ float c=cos(a),s=sin(a); return mat3(1,0,0, 0,c,s, 0,-s,c); }
float fbm(vec3 p, int oct){
  float a=0.5, s=0.0;
  mat3 m = rotY3(0.7) * rotX3(0.3);
  for(int i=0;i<8;i++){
    if(i>=oct) break;
    s += a * vnoise(p);
    p = m * p * 2.02;
    a *= 0.5;
  }
  return s;
}
// Worley: 返回 F1, F2 以及最近胞 id
vec3 worley(vec3 p){
  vec3 ip = floor(p);
  vec3 fp = fract(p);
  float f1 = 8.0, f2 = 8.0;
  float id = 0.0;
  for(int k=-1;k<=1;k++)
  for(int j=-1;j<=1;j++)
  for(int i=-1;i<=1;i++){
    vec3 g = vec3(float(i),float(j),float(k));
    vec3 o = hash33(ip+g);
    vec3 r = g + o - fp;
    float d = dot(r,r);
    if(d < f1){ f2=f1; f1=d; id=hash13(ip+g+0.5); }
    else if(d < f2){ f2=d; }
  }
  return vec3(sqrt(f1), sqrt(f2), id);
}
float sstep(float a, float b, float x){
  float t = clamp((x-a)/(b-a), 0.0, 1.0);
  return t*t*(3.0-2.0*t);
}
vec3 aces(vec3 x){
  const float a=2.51, b=0.03, c=2.43, d=0.59, e=0.14;
  return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);
}
`;

uniform float uRingType; // 1 saturn, 2 uranus, 3 jupiter
out vec4 fragColor;
${GLSL_NOISE}

// 环密度（母行星半径单位）
float ringDensity(float r, float type){
  float d = 0.0;
  if(type < 1.5){
    // 土星
    float dens = 0.0;
    dens += 0.11 * sstep(1.235, 1.28, r) * sstep(1.53, 1.48, r);
    dens += 1.20 * sstep(1.525, 1.56, r) * sstep(1.95, 1.91, r);
    dens += 0.58 * sstep(2.025, 2.06, r) * sstep(2.27, 2.23, r);
    // 卡西尼缝
    dens *= 1.0 - 0.93 * sstep(1.93, 1.96, r) * sstep(2.05, 2.02, r);
    // 恩克缝
    dens *= 1.0 - 0.92 * exp(-pow((r-2.214)/0.0045, 2.0));
    // 基勒缝
    dens *= 1.0 - 0.80 * exp(-pow((r-2.265)/0.0018, 2.0));
    // F 环
    dens += 0.30 * exp(-pow((r-2.324)/0.0055, 2.0));
    dens *= 0.70 + 0.60 * fbm(vec3(r*230.0, 3.3, 7.1), 3);
    return max(dens, 0.0);
  } else if(type < 2.5){
    // 天王星窄环
    float dens = 0.0;
    dens += 0.55 * exp(-pow((r-1.951)/0.0055, 2.0));
    dens += 0.20 * exp(-pow((r-1.909)/0.0022, 2.0));
    dens += 0.16 * exp(-pow((r-1.863)/0.0020, 2.0));
    dens += 0.14 * exp(-pow((r-1.823)/0.0018, 2.0));
    dens += 0.11 * exp(-pow((r-1.786)/0.0017, 2.0));
    dens += 0.09 * exp(-pow((r-1.751)/0.0016, 2.0));
    dens += 0.07 * exp(-pow((r-1.690)/0.0025, 2.0));
    return dens;
  } else {
    // 木星尘埃环 — 必须极淡
    return 0.016 * sstep(1.40, 1.45, r) * sstep(1.81, 1.76, r);
  }
}

vec3 sunColor(float t){
  // 5 档：深红 → 橙 → 黄 → 白黄 → 白
  t = clamp(t, 0.0, 1.0);
  vec3 c0 = vec3(0.35, 0.04, 0.01);
  vec3 c1 = vec3(0.95, 0.28, 0.04);
  vec3 c2 = vec3(1.15, 0.72, 0.12);
  vec3 c3 = vec3(1.25, 1.05, 0.55);
  vec3 c4 = vec3(1.35, 1.28, 1.15);
  if(t < 0.25) return mix(c0, c1, t/0.25);
  if(t < 0.5) return mix(c1, c2, (t-0.25)/0.25);
  if(t < 0.75) return mix(c2, c3, (t-0.5)/0.25);
  return mix(c3, c4, (t-0.75)/0.25);
}

// 撞击坑高度
void craterLayer(vec3 p, float freq, float depth, inout float height, inout float alb, inout float craterMask){
  vec3 w = worley(p * freq);
  float d1 = w.x;
  float id = w.z;
  float rad = 0.13 + 0.22 * fract(id * 7.31);
  float t = d1 / rad;
  float bowl = (t < 1.0) ? -(1.0 - t*t) : 0.0;
  float rim = exp(-pow((t-1.0)/0.26, 2.0));
  float exist = step(id, 0.74) * sstep(0.60, 0.40, d1);
  height += (bowl * 0.90 + rim * 0.50) * depth * exist;
  alb += (bowl * 0.55 + rim * 0.32) * exist * 0.35;
  craterMask = max(craterMask, exist);
}

vec3 shadeRock(vec3 p, vec3 N, vec3 V, vec3 L, float NdL, float sunF){
  float height = 0.0;
  float alb = 0.0;
  float cm = 0.0;
  float depthMul = (uBodyType == 15) ? 0.5 : 1.0; // 火星
  float reduceN = (uBodyType == 15 && p.y > 0.0) ? 0.22 : 1.0; // 火星北半球少坑
  craterLayer(p, 5.0, 1.00*depthMul*reduceN, height, alb, cm);
  craterLayer(p + 11.3, 12.0, 0.52*depthMul*reduceN, height, alb, cm);
  craterLayer(p + 23.7, 28.0, 0.26*depthMul*reduceN, height, alb, cm);
  craterLayer(p + 41.1, 62.0, 0.13*depthMul*reduceN, height, alb, cm);
  float rough = fbm(p * 8.0, 4);
  height += rough * 0.15;

  vec3 base;
  if(uBodyType == 2){ // 月球
    float maria = sstep(0.55, 0.48, fbm(p*2.2, 4));
    base = mix(vec3(0.22,0.21,0.20), vec3(0.08,0.08,0.09), maria);
    // 辐射纹
    float rays = sstep(0.75, 0.95, fbm(p*6.0, 3)) * 0.15;
    base += rays;
    // 海内少坑
    height *= mix(1.0, 0.35, maria);
  } else if(uBodyType == 15){ // 火星
    base = vec3(0.28, 0.104, 0.045) * (0.85 + 0.3*rough);
    // 极冠
    float lat = abs(p.y);
    float ice = sstep(0.78, 0.92, lat + 0.06*fbm(p*5.0, 3));
    base = mix(base, vec3(0.75, 0.78, 0.80), ice);
    // 水手谷
    float eq = exp(-pow(p.y/0.06, 2.0));
    float lonBand = sstep(0.2, 0.5, fbm(vec3(p.x*3.0, p.z*3.0, 0.5), 3));
    float valles = eq * lonBand * sstep(0.1, 0.4, abs(p.x)) * 0.5;
    base *= 1.0 - valles*0.45;
  } else if(uBodyType == 18){ // 冥王星
    base = vec3(0.22, 0.18, 0.16);
    // 克苏鲁赤道带
    float belt = exp(-pow(p.y/0.18, 2.0)) * sstep(0.3, 0.6, fbm(p*2.0, 3));
    base = mix(base, vec3(0.06, 0.04, 0.03), belt*0.7);
    // 心形亮区（斯普特尼克）
    vec3 h1 = normalize(vec3(0.3, -0.05, 0.85));
    vec3 h2 = normalize(vec3(0.3, 0.15, 0.7));
    float g1 = exp(-pow(length(p-h1)*2.2, 2.0));
    float g2 = exp(-pow(length(p-h2)*2.4, 2.0));
    float heart = clamp(g1+g2, 0.0, 1.0);
    base = mix(base, vec3(0.78, 0.74, 0.70), heart*0.85);
  } else {
    base = vec3(0.28, 0.27, 0.26) * (0.8 + 0.3*rough);
    if(uBodyType == 1){ // 水星
      base = vec3(0.22, 0.21, 0.20) * (0.8 + 0.25*rough);
    }
    if(uBodyType == 7){ // 冥卫一 / callisto 共用
      base = vec3(0.16, 0.15, 0.14) * (0.8 + 0.3*rough);
    }
  }
  base *= (1.0 + alb);

  // 凹凸
  vec3 dpx = dFdx(vWorld), dpy = dFdy(vWorld);
  float dhx = dFdx(height), dhy = dFdy(height);
  vec3 r1 = cross(dpy, N), r2 = cross(N, dpx);
  float det = dot(dpx, r1);
  if(abs(det) > 1e-8){
    vec3 grad = (r1*dhx + r2*dhy) / det;
    N = normalize(N - 0.55 * grad);
    NdL = max(dot(N, L), 0.0);
  }

  float diff = NdL;
  vec3 amb = vec3(0.012, 0.013, 0.016);
  // base 已是反照率色，不再乘 uAlbedo（避免双重衰减）
  return base * (diff * sunF + amb) * 1.35;
}

vec3 shadeEarth(vec3 p, vec3 N, vec3 V, vec3 L, float NdL, float sunF, vec3 sunDir){
  float h = fbm(p * 2.4, 7);
  h = clamp((h - 0.5)*1.6 + 0.5, 0.0, 1.0);
  float seaLevel = 0.552;
  float land = sstep(seaLevel-0.01, seaLevel+0.01, h);
  float height = 0.0;
  if(land > 0.5) height = (h - seaLevel) * 1.2;

  // 海洋
  float depth = clamp((seaLevel - h) / seaLevel, 0.0, 1.0);
  vec3 deep = vec3(0.01, 0.04, 0.12);
  vec3 shallow = vec3(0.03, 0.16, 0.28);
  vec3 coast = vec3(0.08, 0.35, 0.38);
  vec3 ocean = mix(shallow, deep, sstep(0.0, 0.35, depth));
  ocean = mix(coast, ocean, sstep(0.0, 0.08, depth));

  // 陆地
  float moist = fbm(p*3.7 + 5.0, 4);
  vec3 green = vec3(0.08, 0.18, 0.06);
  vec3 desert = vec3(0.32, 0.24, 0.10);
  vec3 rock = vec3(0.18, 0.16, 0.14);
  vec3 landC = mix(desert, green, sstep(0.35, 0.6, moist));
  float elev = sstep(0.65, 0.8, h);
  landC = mix(landC, rock, elev);
  float lat = abs(p.y);
  float ice = sstep(0.78, 0.9, lat + 0.05*fbm(p*4.0, 3));
  landC = mix(landC, vec3(0.85, 0.88, 0.92), ice);
  // 海冰
  float seaIce = sstep(0.82, 0.92, lat + 0.04*fbm(p*3.0, 3)) * (1.0-land);
  ocean = mix(ocean, vec3(0.8, 0.85, 0.9), seaIce);

  vec3 base = mix(ocean, landC, land);

  // 云 — 不进高度
  float latRad = asin(clamp(p.y, -1.0, 1.0));
  float drift = uTime * 0.002 * cos(latRad*2.0);
  vec3 cp = p;
  cp.xz = mat2(cos(drift), -sin(drift), sin(drift), cos(drift)) * cp.xz;
  float cloud = fbm(cp * 3.2 + vec3(0.0, 0.0, uTime*0.01), 5);
  // 纬度云量：赤道辐合 + 中纬多云 + 副热带少云
  float latDeg = latRad * 57.2958;
  float band = 0.55
    + 0.25 * exp(-pow(latDeg/8.0, 2.0))
    + 0.18 * exp(-pow((latDeg-50.0)/18.0, 2.0))
    + 0.18 * exp(-pow((latDeg+50.0)/18.0, 2.0))
    - 0.15 * exp(-pow((latDeg-25.0)/12.0, 2.0))
    - 0.15 * exp(-pow((latDeg+25.0)/12.0, 2.0));
  float cloudA = sstep(0.48, 0.62, cloud * (0.7+0.5*band));
  cloudA = clamp(cloudA * band * 1.2, 0.0, 0.92);

  // 凹凸仅陆地
  if(land > 0.5){
    vec3 dpx = dFdx(vWorld), dpy = dFdy(vWorld);
    float dhx = dFdx(height), dhy = dFdy(height);
    vec3 r1 = cross(dpy, N), r2 = cross(N, dpx);
    float det = dot(dpx, r1);
    if(abs(det) > 1e-8){
      vec3 grad = (r1*dhx + r2*dhy) / det;
      N = normalize(N - 0.35 * grad);
      NdL = max(dot(N, L), 0.0);
    }
  }

  float diff = NdL;
  vec3 amb = vec3(0.012, 0.014, 0.018);
  vec3 col = base * (diff * sunF + amb) * 1.35;

  // 海面高光（仅无云）
  float specMask = (1.0 - land) * (1.0 - cloudA);
  vec3 H = normalize(L + V);
  float spec = pow(max(dot(N, H), 0.0), 420.0) * 0.55 * specMask * sunF;
  col += vec3(1.0, 0.95, 0.85) * spec;

  // 云叠加
  vec3 cloudCol = vec3(0.9, 0.92, 0.95) * (diff * sunF * 0.95 + amb);
  col = mix(col, cloudCol, cloudA);

  // 夜面灯光
  if(diff < 0.05 && land > 0.5 && cloudA < 0.25){
    float city = fbm(p * 40.0, 3);
    city = pow(sstep(0.62, 0.85, city), 3.0);
    float coastBias = sstep(0.3, 0.55, moist) * (1.0 - elev*0.5);
    col += vec3(1.0, 0.75, 0.35) * city * coastBias * 0.55 * (1.0-sstep(0.0, 0.08, NdL));
  }
  return col;
}

vec3 shadeVenus(vec3 p, vec3 N, vec3 V, vec3 L, float NdL, float sunF){
  float lat = asin(clamp(p.y,-1.0,1.0));
  vec3 q = p;
  float warp = fbm(p*2.5, 3) * 1.4;
  q.xz = mat2(cos(warp),-sin(warp),sin(warp),cos(warp)) * q.xz;
  float band = fbm(vec3(q.x*3.0, q.z*3.0, lat*4.0 + uTime*0.004), 5);
  float swirl = fbm(p*5.0 + vec3(uTime*0.01, 0, 0), 4);
  float t = clamp(band*0.65 + swirl*0.35, 0.0, 1.0);
  vec3 c = mix(vec3(0.72, 0.65, 0.42), vec3(0.92, 0.88, 0.78), t);
  float diff = NdL * 0.85 + 0.15;
  return c * (diff * sunF + 0.01) * 1.2;
}

vec3 shadeGas(vec3 p, vec3 N, vec3 V, vec3 L, float NdL, float sunF){
  float lat = asin(clamp(p.y, -1.0, 1.0));
  float latDeg = lat * 57.2958;
  float lon = atan(p.z, p.x);
  float turb = (uBodyType == 10) ? 1.0 : 0.42; // 木星:土星
  float w1 = fbm(vec3(lon*2.0, lat*3.0, uTime*0.003), 4) - 0.5;
  float w2 = fbm(vec3(lon*5.0 + 3.0, lat*6.0, uTime*0.002), 3) - 0.5;
  float latW = latDeg + (w1*8.0 + w2*3.0) * turb;

  float bands =
      0.35 * sin(latW * 360.0/4.0 * 0.08 + 0.5)
    + 0.28 * sin(latW * 360.0/9.0 * 0.08 + 1.7)
    + 0.18 * sin(latW * 360.0/17.0 * 0.08 + 3.1)
    + 0.12 * sin(latW * 360.0/30.0 * 0.08 + 4.2);
  bands = bands * 0.5 + 0.5;

  // 极区淡出
  float polar = sstep(46.0, 78.0, abs(latDeg));
  bands = mix(bands, 0.5, polar * 0.94);

  vec3 cLight = (uBodyType==10) ? vec3(0.62, 0.52, 0.38) : vec3(0.72, 0.62, 0.42);
  vec3 cDark  = (uBodyType==10) ? vec3(0.28, 0.18, 0.10) : vec3(0.32, 0.24, 0.14);
  vec3 c = mix(cDark, cLight, bands);

  // 大红斑（木星）
  if(uBodyType == 10){
    vec2 spot = vec2(0.35, -0.25); // lon ~ 0.35 rad, lat ~ -0.25 rad approx via dir
    vec3 sdir = normalize(vec3(0.4, -0.22, 0.88));
    // 椭圆距离
    vec3 dp = p - sdir;
    // 拉伸经度方向
    vec3 t1 = normalize(cross(vec3(0,1,0), sdir));
    vec3 t2 = cross(sdir, t1);
    float u = dot(p - sdir, t1);
    float v = dot(p - sdir, t2);
    float el = length(vec2(u/2.15, v/1.0));
    if(el < 0.55){
      float ang = atan(v, u);
      float rad = el / 0.55;
      float spiral = ang * 2.0 + rad * 4.0 + uTime*0.05;
      float n = fbm(vec3(cos(spiral)*2.0, sin(spiral)*2.0, rad*3.0), 4);
      float edge = sstep(0.55, 0.40, el);
      vec3 spotC = mix(vec3(0.55, 0.18, 0.08), vec3(0.72, 0.32, 0.14), n);
      c = mix(c, spotC, edge);
      // 亮晕
      float halo = exp(-pow((el-0.50)/0.08, 2.0));
      c += vec3(0.2, 0.08, 0.04) * halo * 0.35;
    }
  }

  // 土星北极六边形
  if(uBodyType == 11 && p.y > 0.80){
    float lon2 = atan(p.z, p.x);
    float m = mod(lon2, 1.04719755) - 0.52359878;
    float hexEdge = 0.115 / max(cos(m), 0.2);
    // 在 lat 对应的圆上
    float rlat = 0.80;
    // 用 y 近似纬度半径
    float yr = sqrt(max(0.0, 1.0 - p.y*p.y));
    // 边界在 y~0.82
    float distY = abs(p.y - 0.82);
    float ringBand = exp(-pow(distY/0.02, 2.0));
    // 六边形边界在经度方向
    float hexR = hexEdge;
    float boundary = exp(-pow((hexR - 0.115)/0.01, 2.0));
    c *= 1.0 - 0.25 * ringBand;
  }

  // 涡旋斑点
  vec3 w = worley(vec3(p.x*4.0, p.y*8.0, p.z*4.0));
  float spots = sstep(0.15, 0.05, w.x) * (1.0-polar);
  c = mix(c, cDark*0.85, spots*0.25);

  float diff = NdL;
  vec3 amb = vec3(0.012, 0.012, 0.014);
  return c * (diff * sunF + amb) * 1.3;
}

vec3 shadeIce(vec3 p, vec3 N, vec3 V, vec3 L, float NdL, float sunF){
  float lat = asin(clamp(p.y,-1.0,1.0));
  float latDeg = lat * 57.2958;
  float band = 0.5 + 0.2 * sin(latDeg * 0.15);
  float w = (fbm(p*3.0, 4) - 0.5) * 2.0;
  band += w * 0.08;
  vec3 cBase, cLight;
  if(uBodyType == 12){ // 天王星
    cBase = vec3(0.12, 0.28, 0.32);
    cLight = vec3(0.35, 0.55, 0.58);
  } else {
    cBase = vec3(0.05, 0.12, 0.35);
    cLight = vec3(0.15, 0.30, 0.55);
    // 海王星暗斑
    vec3 sdir = normalize(vec3(0.5, -0.15, 0.75));
    float el = length(p - sdir) * 1.3;
    if(el < 0.35){
      cBase *= 1.0 - 0.55 * sstep(0.35, 0.1, el);
    }
  }
  vec3 c = mix(cBase, cLight, clamp(band, 0.0, 1.0));
  // 甲烷云条纹 — 不进高度（7.10）
  float cl = sstep(0.65, 0.8, fbm(p*5.0 + vec3(uTime*0.01), 3));
  c = mix(c, vec3(0.7, 0.8, 0.85), cl * 0.25);

  float diff = NdL;
  vec3 amb = vec3(0.01, 0.012, 0.015);
  return c * (diff * sunF + amb) * 1.3;
}

vec3 shadeEuropa(vec3 p, vec3 N, vec3 V, vec3 L, float NdL, float sunF){
  vec3 base = vec3(0.72, 0.74, 0.76);
  float line1 = 1.0 - sstep(0.0, 0.04, abs(fbm(p*4.0, 3) - 0.5));
  float line2 = 1.0 - sstep(0.0, 0.03, abs(fbm(p*8.0 + 3.0, 3) - 0.5));
  float line3 = 1.0 - sstep(0.0, 0.025, abs(fbm(p*14.0 + 7.0, 3) - 0.5));
  float lines = clamp(line1*0.5 + line2*0.35 + line3*0.3, 0.0, 1.0);
  base = mix(base, vec3(0.35, 0.18, 0.12), lines * 0.55);
  float diff = NdL;
  vec3 amb = vec3(0.012, 0.012, 0.014);
  return base * (diff * sunF + amb) * 1.3;
}

vec3 shadeIo(vec3 p, vec3 N, vec3 V, vec3 L, float NdL, float sunF){
  vec3 base = mix(vec3(0.75, 0.55, 0.10), vec3(0.85, 0.70, 0.25), fbm(p*3.0, 4));
  // 火山口
  vec3 w = worley(p * 8.0);
  float d1 = w.x;
  float id = w.z;
  float exist = step(id, 0.35);
  float cr = sstep(0.12, 0.02, d1) * exist;
  base = mix(base, vec3(0.08, 0.04, 0.02), cr*0.8);
  float diff = NdL;
  vec3 amb = vec3(0.012, 0.012, 0.014);
  vec3 col = base * (diff * sunF + amb) * 1.35;
  // 微弱自发光
  col += vec3(0.4, 0.15, 0.02) * cr * 0.08;
  return col;
}

vec3 shadeGanymede(vec3 p, vec3 N, vec3 V, vec3 L, float NdL, float sunF){
  float old = sstep(0.4, 0.6, fbm(p*2.5, 4));
  vec3 dark = vec3(0.12, 0.11, 0.10);
  vec3 light = vec3(0.45, 0.44, 0.42);
  vec3 base = mix(light, dark, old);
  float grooves = 1.0 - sstep(0.0, 0.05, abs(fbm(p*6.0, 3) - 0.5));
  base = mix(base, vec3(0.55, 0.55, 0.55), grooves*0.35*(1.0-old));
  float height = grooves * 0.1;
  vec3 dpx = dFdx(vWorld), dpy = dFdy(vWorld);
  float dhx = dFdx(height), dhy = dFdy(height);
  vec3 r1 = cross(dpy, N), r2 = cross(N, dpx);
  float det = dot(dpx, r1);
  if(abs(det) > 1e-8){
    N = normalize(N - 0.3 * (r1*dhx + r2*dhy)/det);
    NdL = max(dot(N, L), 0.0);
  }
  float diff = NdL;
  vec3 amb = vec3(0.012, 0.012, 0.014);
  return base * (diff * sunF + amb) * 1.3;
}

vec3 shadeTitan(vec3 p, vec3 N, vec3 V, vec3 L, float NdL, float sunF){
  vec3 base = mix(vec3(0.55, 0.28, 0.10), vec3(0.75, 0.45, 0.18), fbm(p*2.0, 4));
  // 柔和晨昏线
  float wrap = pow(clamp(NdL*0.5+0.5, 0.0, 1.0), 0.6);
  return base * (wrap * sunF + 0.01) * 1.25;
}

vec3 shadeSun(vec3 p, vec3 N, vec3 V){
  vec3 q = p;
  q += vec3(uTime*0.005, uTime*0.003, uTime*0.004);
  // 米粒组织：F2-F1 胞界暗网
  vec3 w1 = worley(q * 76.0);
  vec3 w2 = worley(q * 31.0);
  float grain = 1.0 - clamp((w1.y - w1.x) * 3.5, 0.0, 1.0);
  float grain2 = 1.0 - clamp((w2.y - w2.x) * 2.8, 0.0, 1.0);
  float cells = grain * 0.55 + grain2 * 0.45;
  // 超米粒
  float super = fbm(q * 6.5, 4);
  // 重新居中（7.14）
  float t = 0.5 + (cells - 0.55)*0.55 + (super - 0.5)*0.35;
  t = clamp(t, 0.0, 1.0);

  // 黑子
  float sp = fbm(q * 3.2 + 2.0, 3);
  float spotU = sstep(0.72, 0.78, sp);
  float spotP = sstep(0.62, 0.72, sp);
  float dim = 1.0 - spotU*0.85 - (spotP-spotU)*0.45;
  t = t * dim + spotU*0.08;

  vec3 col = sunColor(t) * dim;

  // 临边昏暗：亮度和色温
  float ndv = max(dot(N, V), 0.0);
  float limb = 0.24 + 0.76 * pow(ndv, 0.38);
  float cool = 0.35 + 0.65 * pow(ndv, 0.38);
  col *= limb * 1.15;
  col = mix(col * vec3(0.9, 0.55, 0.35), col, cool);
  return col;
}

void main(){
  vec3 N = normalize(vNor);
  vec3 V = normalize(uCamPos - vWorld);
  vec3 sunDir = normalize(uSunPos - vWorld);
  vec3 L = sunDir;
  vec3 p = normalize(vObj);

  // 环对行星的阴影（物体空间：环在 y=0，半径以行星半径为单位）
  float ringShadow = 1.0;
  if(uHasRings > 0.5){
    vec3 sunObj = vec3(dot(uAxisX, L), dot(uAxisY, L), dot(uAxisZ, L));
    if(abs(sunObj.y) > 1e-4){
      float t = -vObj.y / sunObj.y;
      if(t > 0.0){
        vec3 hit = vObj + sunObj * t;
        float rr = length(hit.xz); // vObj 在单位球上，环 mesh 同尺度
        if(rr > uRingInner && rr < uRingOuter){
          float dens = ringDensity(rr, uRingType);
          ringShadow = exp(-dens * 2.2 / max(abs(sunObj.y), 0.10));
        }
      }
    }
  }

  float NdL = max(dot(N, L), 0.0);
  // 太阳强度：压缩的 1/r^0.4
  float rFromSun = length(uSunPos - vWorld);
  // 显示空间距离 → 用均匀近似：传入 uSunBright 已算好
  float sunF = uSunBright * ringShadow;

  vec3 col;
  if(uBodyType == 0){
    col = shadeSun(p, N, V);
    fragColor = vec4(col, 1.0);
    return;
  } else if(uBodyType == 3){
    col = shadeEarth(p, N, V, L, NdL, sunF, L);
  } else if(uBodyType == 4){
    col = shadeVenus(p, N, V, L, NdL, sunF);
  } else if(uBodyType == 10 || uBodyType == 11){
    col = shadeGas(p, N, V, L, NdL, sunF);
  } else if(uBodyType == 12 || uBodyType == 13){
    col = shadeIce(p, N, V, L, NdL, sunF);
  } else if(uBodyType == 20){
    col = shadeEuropa(p, N, V, L, NdL, sunF);
  } else if(uBodyType == 21){
    col = shadeIo(p, N, V, L, NdL, sunF);
  } else if(uBodyType == 22){
    col = shadeGanymede(p, N, V, L, NdL, sunF);
  } else if(uBodyType == 23){
    col = shadeTitan(p, N, V, L, NdL, sunF);
  } else if(uBodyType == 15){
    col = shadeRock(p, N, V, L, NdL, sunF); // 火星 in rock with type 15
  } else if(uBodyType == 18){
    col = shadeRock(p, N, V, L, NdL, sunF);
  } else {
    col = shadeRock(p, N, V, L, NdL, sunF);
  }
  fragColor = vec4(col, 1.0);
}
`;

const FS_ATM_FULL = `#version 300 es

in vec3 vNor;
in vec3 vWorld;
in vec3 vObj;
in vec2 vUV;
uniform vec3 uCamPos;
uniform vec3 uSunPos;
uniform vec3 uPlanetPos;

uniform vec3 uAtmColor;
uniform float uHeight;
uniform float uSunBright;
uniform float uIntensity;
out vec4 fragColor;
float sstep(float a, float b, float x){
  float t = clamp((x-a)/(b-a), 0.0, 1.0);

}
void main(){

  dens *= 1.0 - sstep(1.0, 0.960, b) * 0.86;

const VS_AST = `#version 300 es
layout(location=0) in vec3 aOrb; // a, e, I
layout(location=1) in vec3 aAng; // Om, w, M0
layout(location=2) in vec2 aMisc; // n, size
uniform mat4 uViewProj;
uniform vec3 uCamPos;
uniform float uTimeJD;
uniform float uCompress;
uniform float uScale;
uniform float uPixelRatio;
out float vBright;
out vec3 vColor;
${GLSL_NOISE}
float solveK(float M, float e){
  M = mod(M + 3.14159265, 6.2831853) - 3.14159265;
  float E = M + e * sin(M) * (1.0 + e * cos(M));
  for(int i=0;i<6;i++){
    float dE = (E - e*sin(E) - M) / (1.0 - e*cos(E));
    E -= dE;
  }
  return E;
}
void main(){
  float a = aOrb.x, e = aOrb.y, I = aOrb.z * 0.017453292;
  float Om = aAng.x * 0.017453292;
  float w = aAng.y * 0.017453292;
  float M = aAng.z * 0.017453292 + aMisc.x * (uTimeJD - 2451545.0);
  float E = solveK(M, e);
  float xp = a * (cos(E) - e);
  float yp = a * sqrt(1.0 - e*e) * sin(E);
  float cw = cos(w), sw = sin(w);
  float cO = cos(Om), sO = sin(Om);
  float cI = cos(I), sI = sin(I);
  float x = (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp;
  float y = (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp;
  float z = (sw*sI)*xp + (cw*sI)*yp;
  // world = (x, z, -y)
  vec3 world = vec3(x, z, -y);
  float r = length(vec3(x,y,z));
  float rd = uScale * pow(max(r, 1e-5), uCompress);
  world = normalize(world) * rd;
  vec4 clip = uViewProj * vec4(world, 1.0);
  gl_Position = clip;
  float dist = length(world - uCamPos);
  float ps = aMisc.y * uPixelRatio * 55.0 / max(dist, 0.1);
  gl_PointSize = clamp(ps, 0.9, 5.5);

  vBright = clamp(vBright, 0.15, 1.0);
  vColor = mix(vec3(0.55,0.5,0.45), vec3(0.7,0.65,0.55), fract(a*13.7));
}

// ---------- 合成 ----------
const FS_COMPOSITE = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform sampler2D uBlur1;
uniform sampler2D uBlur2;
uniform float uBloomStrength;
uniform float uTime;
uniform vec2 uSunScreen; // ndc or uv
uniform float uSunVis;
uniform float uSunSize;
uniform vec2 uViewport;
out vec4 fragColor;
${GLSL_NOISE}
void main(){
  vec2 uv = vUV;
  // 色散
  vec2 c = uv - 0.5;
  float dist = length(c);
  float dis = 0.0015 * dist;
  vec3 col;
  col.r = texture(uScene, uv + c*dis).r;
  col.g = texture(uScene, uv).g;
  col.b = texture(uScene, uv - c*dis).b;
  if(uSunSize < 0.0){ // debug: raw scene
    fragColor = vec4(pow(clamp(col*1.2, 0.0, 1.0), vec3(1.0/2.2)), 1.0);
    return;
  }

  // 泛光
  vec3 bloom = texture(uBloom, uv).rgb * 0.55
             + texture(uBlur1, uv).rgb * 0.30
             + texture(uBlur2, uv).rgb * 0.25;
  bloom = max(bloom, vec3(0.0));
  col = max(col, vec3(0.0));
  col += bloom * uBloomStrength;

  // 镜头眩光
  if(uSunVis > 0.001){
    vec2 suv = uSunScreen;
    vec2 toC = vec2(0.5) - suv;
    // 核心辉光
    float d = length((uv - suv) * vec2(uViewport.x/uViewport.y, 1.0));
    float core = exp(-d*d*180.0) * 0.55 + exp(-d*d*40.0) * 0.15;
    // 星芒
    vec2 r = (uv - suv) * vec2(uViewport.x/uViewport.y, 1.0);
    float ang = atan(r.y, r.x);
    float ray = pow(abs(cos(ang*3.0)), 24.0) * exp(-d*8.0) * 0.35;
    // 水平光条
    float streak = exp(-abs(r.y)*120.0) * exp(-abs(r.x)*3.5) * 0.2;
    // 鬼影
    float ghost = 0.0;
    for(int i=1;i<=4;i++){
      vec2 gp = suv + toC * (float(i)*0.45);
      float gd = length((uv - gp) * vec2(uViewport.x/uViewport.y, 1.0));
      float gsize = 0.03 + float(i)*0.015;
      ghost += exp(-gd*gd/(gsize*gsize)) * (0.04 / float(i));
    }
    // 克制的强度
    float flare = (core + ray + streak + ghost) * uSunVis * 0.28;
    col += vec3(1.0, 0.85, 0.6) * flare;
  }

  // 曝光 + ACES
  col = max(col, vec3(0.0));
  col *= 1.55;
  col = aces(clamp(col, 0.0, 20.0));
  // gamma
  col = pow(col, vec3(1.0/2.2));

  // 暗角
  float vig = 1.0 - dist*dist*0.55;
  col *= clamp(vig, 0.0, 1.0);

  // 颗粒
  float g = hash13(vec3(uv*uViewport, uTime)) - 0.5;
  col += g * 0.015;

  fragColor = vec4(col, 1.0);
}
`;

const FS_CORONA = `#version 300 es
precision highp float;
in vec2 vUV;
uniform float uTime;
uniform float uIntensity;
out vec4 fragColor;
${GLSL_NOISE}
void main(){
  float r = length(vUV);
  if(r > 1.0) discard;
  float ang = atan(vUV.y, vUV.x);
  float stream = fbm(vec3(cos(ang)*2.5, sin(ang)*2.5, uTime*0.05), 4);
  float rad = exp(-r*r*2.2) * 0.35;
  float outer = exp(-r*2.8) * 0.2 * (0.6 + 0.5*stream);
  float rays = pow(max(stream, 0.0), 2.0) * exp(-r*1.8) * 0.25;
  float a = (rad + outer + rays) * uIntensity;

const VS_RING = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNor;
layout(location=2) in vec2 aUV;
uniform mat4 uModel;
uniform mat4 uViewProj;
out vec2 vUV;
out vec3 vWorld;
out vec3 vObj;
void main(){
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorld = wp.xyz;
  vObj = aPos;
  vUV = aUV;
  gl_Position = uViewProj * wp;
}
`;
const FS_RING = `#version 300 es
precision highp float;
in vec2 vUV;
in vec3 vWorld;
in vec3 vObj;
uniform vec3 uCamPos;
uniform vec3 uSunPos;
uniform vec3 uPlanetPos;
uniform float uPlanetRadius;
uniform float uInner;
uniform float uOuter;
uniform float uType;
uniform float uSunBright;
uniform vec3 uRingColor;
out vec4 fragColor;
${GLSL_NOISE}

float ringDensity(float r, float type){
  if(type < 1.5){
    float dens = 0.0;
    dens += 0.11 * sstep(1.235, 1.28, r) * sstep(1.53, 1.48, r);
    dens += 1.20 * sstep(1.525, 1.56, r) * sstep(1.95, 1.91, r);
    dens += 0.58 * sstep(2.025, 2.06, r) * sstep(2.27, 2.23, r);
    dens *= 1.0 - 0.93 * sstep(1.93, 1.96, r) * sstep(2.05, 2.02, r);
    dens *= 1.0 - 0.92 * exp(-pow((r-2.214)/0.0045, 2.0));
    dens *= 1.0 - 0.80 * exp(-pow((r-2.265)/0.0018, 2.0));
    dens += 0.30 * exp(-pow((r-2.324)/0.0055, 2.0));
    dens *= 0.70 + 0.60 * fbm(vec3(r*230.0, 3.3, 7.1), 3);
    return max(dens, 0.0);
  } else if(type < 2.5){
    float dens = 0.0;
    dens += 0.55 * exp(-pow((r-1.951)/0.0055, 2.0));
    dens += 0.20 * exp(-pow((r-1.909)/0.0022, 2.0));
    dens += 0.16 * exp(-pow((r-1.863)/0.0020, 2.0));
    dens += 0.14 * exp(-pow((r-1.823)/0.0018, 2.0));
    dens += 0.11 * exp(-pow((r-1.786)/0.0017, 2.0));
    dens += 0.09 * exp(-pow((r-1.751)/0.0016, 2.0));
    dens += 0.07 * exp(-pow((r-1.690)/0.0025, 2.0));
    return dens;
  } else {
    return 0.016 * sstep(1.40, 1.45, r) * sstep(1.81, 1.76, r);
  }
}

void main(){
  float r = length(vObj.xz); // 已是显示半径单位 / planetR?
  // vObj 来自 ring mesh，mesh 用 1.0 = 母行星显示半径
  // 但 mesh 生成时 r 是相对行星半径的
  float rr = vUV.y; // 0..1 from inner to outer? 我们用长度
  // 实际 vObj 长度是 1.0 的倍数
  float rad = length(vObj.xz);
  // mesh 的 r0 r1 是以行星半径为单位
  // 归一化到 uInner..uOuter 对应实际 rad
  // rad 已经是 1.0 单位 = 行星半径
  float d = ringDensity(rad, uType);

  vec3 toCam = normalize(uCamPos - vWorld);
  vec3 toSun = normalize(uSunPos - vWorld);
  vec3 ringN = vec3(0.0, 1.0, 0.0); // 物体 y，模型矩阵已含倾斜
  // 用模型旋转后的法向：vObj 在 xz 平面，世界 y 是旋转后的
  // 简化：用 dFdx/dFdy 或直接用 uPlanetPos 与 axis
  // 用叉乘从两个切向
  vec3 n = normalize(cross(normalize(vec3(vObj.x, 0.0, vObj.z)), vec3(0,1,0)));
  // 更稳：物体空间 y 轴法向变换到世界 — 由 uModel 的 y 列
  // 这里假设 uModel 的旋转部分 y 列即环法向（世界）
  // 我们通过 dFdx 得到
  vec3 dx = dFdx(vWorld), dy = dFdy(vWorld);
  vec3 wn = normalize(cross(dx, dy));
  if(wn.y < 0.0) wn = -wn;

  float mu_view = max(abs(dot(wn, toCam)), 0.10);
  float mu_sun  = max(abs(dot(wn, toSun)), 0.10);
  float tau_view = d * 1.45 / mu_view;
  float tau_sun  = d * 1.45 / mu_sun;
  float alpha = 1.0 - exp(-tau_view);

  float sameSide = sign(dot(wn, toCam)) * sign(dot(wn, toSun));
  float bright;
  if(sameSide > 0.0){
    bright = (1.0 - exp(-tau_sun)) * 0.85;
  } else {
    bright = exp(-tau_sun * 0.42) * 1.15 * (1.0 - exp(-tau_sun * 0.75));
  }

  // 行星在环上的阴影
  vec3 oc = vWorld - uPlanetPos;
  vec3 L = normalize(uSunPos - uPlanetPos);
  float bb = dot(oc, L);
  float shadow = 1.0;
  if(bb < 0.0){
    float dmin = sqrt(max(dot(oc,oc) - bb*bb, 0.0));
    shadow = sstep(uPlanetRadius*0.97, uPlanetRadius*1.09, dmin);
  }

  vec3 col = uRingColor * bright * shadow * uSunBright * 1.45;
  fragColor = vec4(col, alpha * shadow * 0.95);
}
`;

function createStars(count){
  const dirs = new Float32Array(count*3);
  const br = new Float32Array(count*2);
  // 银道面聚集
  const galN = [-0.8678, 0.4972, 0.0003]; // world
  // 与银道面的基
  const up = galN;
  const ref = Math.abs(up[0])<0.9?[1,0,0]:[0,1,0];
  const x = norm3(cross3(ref, up));
  const y = cross3(up, x);
  let i=0, guard=0;
  while(i<count && guard<count*20){
    guard++;
    // 随机方向，向银道面聚集
    let dx,dy,dz;
    if(Math.random()<0.72){
      // 银道面附近
      const ang = Math.random()*Math.PI*2;
      const h = (Math.random()*2-1);
      const hh = Math.pow(Math.abs(h), 1.8) * Math.sign(h) * 0.45;
      const rr = Math.sqrt(Math.max(0,1-hh*hh));
      dx = x[0]*Math.cos(ang)*rr + y[0]*Math.sin(ang)*rr + up[0]*hh;
      dy = x[1]*Math.cos(ang)*rr + y[1]*Math.sin(ang)*rr + up[1]*hh;
      dz = x[2]*Math.cos(ang)*rr + y[2]*Math.sin(ang)*rr + up[2]*hh;
    } else {
      const u = Math.random()*2-1;
      const t = Math.random()*Math.PI*2;
      const s = Math.sqrt(1-u*u);
      dx = s*Math.cos(t); dy = u; dz = s*Math.sin(t);
    }
    const n = Math.hypot(dx,dy,dz);
    dirs[i*3]=dx/n; dirs[i*3+1]=dy/n; dirs[i*3+2]=dz/n;
    br[i*2] = Math.pow(Math.random(), 3.6);

    if(r<0.76) ct = Math.random()*0.15;

    else if(r<0.956) ct = 0.30+Math.random()*0.20;

    else ct = 0.92+Math.random()*0.08;
    br[i*2+1] = ct;
    i++;

  return {dirs, br, count};
}

function createTex(w,h, float16){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  const ifmt = float16 ? gl.RGBA16F : gl.RGBA8;
  const type = float16 ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function initFBOs(w, h){

    if(gl.getError() !== gl.NO_ERROR) throw new Error('msaa');
  } catch(e) {

    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.RGBA8, w, h);
  }
  sceneDepthMS = gl.createRenderbuffer();

  gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.DEPTH_COMPONENT24, w, h);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, sceneColorMS);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, sceneDepthMS);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE){
    useMSAA = false;

    sceneMSAA = null;

  // resolve / scene
  sceneFBO = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
  sceneTex = createTex(w, h, useFloat);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
  sceneDepth = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, sceneDepth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, sceneDepth);
  // bloom mips
  bloomTex = [];
  bloomFBO = [];
  let bw = Math.max(1, w>>1), bh = Math.max(1, h>>1);
  for(let i=0;i<6;i++){
    const t = createTex(bw, bh, useFloat);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.viewport(0, 0, bw, bh);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    bloomTex.push(t);
    bloomFBO.push(f);
    bw = Math.max(1, bw>>1); bh = Math.max(1, bh>>1);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(canvas.clientWidth * DPR);
  const h = Math.floor(canvas.clientHeight * DPR);
  if(canvas.width === w && canvas.height === h && sceneFBO) return;
  canvas.width = w; canvas.height = h;
  initFBOs(w, h);
}
window.addEventListener('resize', resize);

// ---------- 轨道采样 ----------
function orbitSamplesFor(body, jd, samples){
  // 对行星用根数扫平近点角
  const T = centuriesT(jd);
  const a = body.a + body.da*T;
  const e = body.e + body.de*T;
  const I = body.I + body.dI*T;
  const wbar = body.wbar + body.dwbar*T;
  const Om = body.Om + body.dOm*T;
  const pts = [];
  // 近期点方向：从 ω
  const w = (wbar - Om) * DEG;
  for(let i=0;i<samples;i++){
    const f = i/(samples-1);
    // 用偏近点角扫一圈
    const E = f * Math.PI * 2;
    const xp = a * (Math.cos(E) - e);
    const yp = a * Math.sqrt(Math.max(0,1-e*e)) * Math.sin(E);
    const cw = Math.cos(w), sw = Math.sin(w);
    const cO = Math.cos(Om*DEG), sO = Math.sin(Om*DEG);
    const cI = Math.cos(I*DEG), sI = Math.sin(I*DEG);
    const x = (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp;
    const y = (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp;
    const z = (sw*sI)*xp + (cw*sI)*yp;
    const rAU = Math.hypot(x,y,z);
    const rd = distDisplay(rAU);
    const inv = rAU > 1e-9 ? rd / rAU : 0;
    pts.push([x*inv, z*inv, -y*inv]);
  }
  return pts;
}

function halleOrbitSamples(jd, samples){
  const pts = [];
  for(let i=0;i<samples;i++){
    const f = i/(samples-1);
    const E = f * Math.PI * 2;
    const e = HALLEY.e, a = HALLEY.a;
    const xp = a * (Math.cos(E) - e);
    const yp = a * Math.sqrt(1-e*e) * Math.sin(E);
    const w = HALLEY.omega * DEG;
    const OmR = HALLEY.Om * DEG;
    const Ir = HALLEY.I * DEG;
    const cw = Math.cos(w), sw = Math.sin(w);
    const cO = Math.cos(OmR), sO = Math.sin(OmR);
    const cI = Math.cos(Ir), sI = Math.sin(Ir);
    const x = (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp;
    const y = (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp;
    const z = (sw*sI)*xp + (cw*sI)*yp;
    const rAU = Math.hypot(x,y,z);
    const rd = distDisplay(rAU);
    const inv = rAU > 1e-9 ? rd / rAU : 0;
    pts.push([x*inv, z*inv, -y*inv]);
  }
  return pts;
}

function moonOrbitPoints(parentPos, parentRadiusDisp, moon, samples){
  const pts = [];
  // 基准
  const siblings = MOONS.filter(m=>m.parent===moon.parent);
  const a0 = Math.min(...siblings.map(m=>m.orbitKm));
  // 环外缘
  let ringOut = 0;
  if(moon.parent==='saturn') ringOut = 2.34;
  if(moon.parent==='uranus') ringOut = 2.00;
  if(moon.parent==='jupiter') ringOut = 1.81;
  const moonDispR = radiusDisplay(moon.radiusKm);
  const base = Math.max(2.35, ringOut + moonDispR/Math.max(parentRadiusDisp,0.001) + 0.55);
  for(let i=0;i<samples;i++){
    const th = i/(samples-1) * Math.PI * 2;
    const aMoon = moon.orbitKm;
    const d = parentRadiusDisp * base * Math.pow(aMoon/a0, 0.55);
    // 在参考面
    let x = Math.cos(th)*d, y = 0, z = Math.sin(th)*d;
    // 倾角绕 X
    const inc = moon.incDeg * DEG;
    const y2 = y*Math.cos(inc) - z*Math.sin(inc);
    const z2 = y*Math.sin(inc) + z*Math.cos(inc);
    y = y2; z = z2;
    if(moon.ref === 'equator'){
      const body = PLANETS.find(p=>p.id===moon.parent);
      const ax = axisWorld(axisEcl(body.tilt, body.poleLon));
      const B = basisFromAxis(ax);
      const wx = B.x[0]*x + B.y[0]*y + B.z[0]*z;
      const wy = B.x[1]*x + B.y[1]*y + B.z[1]*z;
      const wz = B.x[2]*x + B.y[2]*y + B.z[2]*z;
      x=wx; y=wy; z=wz;
    }
    pts.push([parentPos[0]+x, parentPos[1]+y, parentPos[2]+z]);
  }
  return pts;
}

// 构建轨道 strip
function buildOrbitStrip(pts, headFrac, camPos){
  // headFrac: 当前天体在轨道上的参数位置 0..1
  const n = pts.length;
  const arr = new Float32Array(n * 2 * ORBIT_FLOATS);
  for(let i=0;i<n;i++){
    const p = pts[i];
    const p2 = pts[Math.min(i+1, n-1)];
    // trail：沿运动反方向拖尾，天体在 headFrac
    // 参数距离（向前）
    let d = headFrac - (i/(n-1));
    if(d < 0) d += 1;
    // 我们要的是天体身后（落后量）
    let back = (i/(n-1)) - headFrac;
    if(back < 0) back += 1;
    // 越接近天体越亮，向反方向衰减
    const trail = 0.15 + 0.85 * Math.pow(Math.max(0, 1 - back*1.1), 3.2);
    for(let s=0;s<2;s++){
      const vi = (i*2+s) * ORBIT_FLOATS;
      arr[vi+0]=p[0]; arr[vi+1]=p[1]; arr[vi+2]=p[2];
      arr[vi+3]=p2[0]; arr[vi+4]=p2[1]; arr[vi+5]=p2[2];
      arr[vi+6]= s===0 ? -1 : 1;
      arr[vi+7]= trail;
    }
  }
  return arr;
}

// 卫星相位状态
function moonWorldPos(moon, jd, parentPos, parentRadiusDisp){
  const siblings = MOONS.filter(m=>m.parent===moon.parent);
  const a0 = Math.min(...siblings.map(m=>m.orbitKm));
  let ringOut = 0;
  if(moon.parent==='saturn') ringOut = 2.34;
  if(moon.parent==='uranus') ringOut = 2.00;
  if(moon.parent==='jupiter') ringOut = 1.81;
  const moonDispR = radiusDisplay(moon.radiusKm);
  const base = Math.max(2.35, ringOut + moonDispR/Math.max(parentRadiusDisp,0.001) + 0.55);
  const d = parentRadiusDisp * base * Math.pow(moon.orbitKm/a0, 0.55);
  const period = moon.periodDays;
  const th = 2*Math.PI * (jd - J2000) / Math.abs(period) * (period<0?-1:1) + moon.phase0;
  // 负周期 → 逆行，上面已处理方向
  let x = Math.cos(th)*d, y = 0, z = Math.sin(th)*d;
  const inc = moon.incDeg * DEG;
  // 倾角绕 X 轴
  const y2 = y*Math.cos(inc) - z*Math.sin(inc);
  const z2 = y*Math.sin(inc) + z*Math.cos(inc);
  y = y2; z = z2;
  // 注意：局部坐标 (cos θ · d, 0, sin θ · d)，绕 X 倾斜
  if(moon.ref === 'equator'){
    const body = PLANETS.find(p=>p.id===moon.parent);
    const ax = axisWorld(axisEcl(body.tilt, body.poleLon));
    const B = basisFromAxis(ax);
    const wx = B.x[0]*x + B.y[0]*y + B.z[0]*z;
    const wy = B.x[1]*x + B.y[1]*y + B.z[1]*z;
    const wz = B.x[2]*x + B.y[2]*y + B.z[2]*z;
    x=wx; y=wy; z=wz;
  }
  return [parentPos[0]+x, parentPos[1]+y, parentPos[2]+z];
}

          ['日心黄纬', lat.toFixed(2) + '°'],
          ['与地球距离', dE.toFixed(3) + ' AU'],
          ['光行时', (dE*499.0).toFixed(1) + ' 秒'],

          ['远日点', '35.08 AU'],

      },

        ['半长径 a', '17.834 AU'],
        ['偏心率 e', '0.96714'],
        ['轨道倾角 I', '162.26°'],
        ['近日点幅角 ω', '111.33°'],
        ['升交点黄经 Ω', '58.42°'],
        ['过近日点 Tp', '1986-02-09'],
        ['公转周期', '75.32 年'],
      ]

  }
  const moon = MOONS.find(m=>m.id===id);
  if(moon){
    const parent = PLANETS.find(p=>p.id===moon.parent);
    return {
      name: moon.name, sub: '卫星 · ' + parent.name,
      body: moon,

      live: () => {
        const ps = planetState(parent, state.simJD);
        const rd = distDisplay(ps.rAU);
        const pos = moonWorldPos(moon, state.simJD, ps.world, radiusDisplay(parent.radiusKm));
        // 相对母行星
        const rel = [pos[0]-ps.world[0], pos[1]-ps.world[1], pos[2]-ps.world[2]];
        const dDisp = Math.hypot(rel[0],rel[1],rel[2]);
        // 估算真实轨道距离（显示压缩）：直接用 moon.orbitKm
        const dKm = moon.orbitKm;
        const earth = planetState(PLANETS[2], state.simJD);
        const dx = pos[0]-earth.world[0], dy=pos[1]-earth.world[1], dz=pos[2]-earth.world[2];
        const dE = Math.hypot(dx,dy,dz);
        return [
          ['轨道半径', (dKm/1000).toFixed(0) + '×10³ km'],
          ['公转周期', Math.abs(moon.periodDays).toFixed(3) + ' 天' + (moon.periodDays<0?'（逆行）':'')],
          ['与母行星距', (dKm/1000).toFixed(0) + '×10³ km'],
          ['光行时', (dKm/299792.458).toFixed(2) + ' 秒'],
          ['显示轨道距', dDisp.toFixed(2)],

      },
      static: [
        ['半径', moon.radiusKm.toLocaleString() + ' km'],
        ['轨道倾角', moon.incDeg + '°'],

      name: p.name,
      sub: (['jupiter','saturn'].includes(p.id)?'气态巨行星':(['uranus','neptune'].includes(p.id)?'冰巨行星':(p.id==='pluto'?'矮行星':'行星'))),

        const lat = Math.asin(clamp(s.ecl[2]/Math.max(s.rAU,1e-9),-1,1)) / DEG;
        const dx = s.world[0]-earth.world[0], dy=s.world[1]-earth.world[1], dz=s.world[2]-earth.world[2];
        const dE = Math.hypot(dx,dy,dz);
        const v = orbitalSpeed(s.rAU, s.a);
        // 近远日点
        const q = s.a * (1-s.e);
        const Q = s.a * (1+s.e);
        return [
          ['日心距离', s.rAU.toFixed(4) + ' AU'],
          ['日心黄经', lon.toFixed(2) + '°'],

          ['远日点', Q.toFixed(4) + ' AU'],
          ['轨道速度', v.toFixed(2) + ' km/s'],
        ];
      },
      static: [
        ['半径', p.radiusKm.toLocaleString() + ' km'],
        ['质量', p.mass],
        ['公转周期', p.periodStr],

        ['温度', p.temp],
        ['轨道偏心率', (p.e).toFixed(6)],
        ['轨道倾角', p.I.toFixed(4) + '°'],
        ['转轴倾角', p.textbookTilt],
        ['自转周期', Math.abs(p.rotH).toFixed(2) + ' 时' + (p.rotH<0?'（逆行）':'')],
      ],
      blurb: p.blurb
    };
  }
  return {name:id, sub:'', body:{}, live:()=>[], static:[], blurb:''};
}

function updateInfoPanel(){
  const info = getBodyInfo(state.selected);
  let html = `<div class="card-title">${info.name}</div>`;
  html += `<div class="card-sub">${info.sub || ''}</div>`;
  html += `<div class="sec">实时数据</div><div class="kv">`;
  for(const [k,v] of info.live()){
    html += `<div class="k">${k}</div><div class="v">${v}</div>`;
  }
  html += `</div>`;
  if(info.static && info.static.length){
    html += `<div class="sec">物理参数</div><div class="kv">`;
    for(const [k,v] of info.static){
      html += `<div class="k">${k}</div><div class="v">${v}</div>`;
    }
    html += `</div>`;
  }
  if(info.blurb){
    html += `<div class="blurb">${info.blurb}</div>`;
  }
  const y = jdToDate(state.simJD).getUTCFullYear();
  if(y < 1800 || y > 2050){
    html += `<div class="note warn">已超出根数有效区间（外推）</div>`;
  }
  html += `<div class="note">距离比例已径向压缩（幂律），角位置/黄经关系精确。</div>`;
  infoEl.innerHTML = html;
}

// 标签
const labelNodes = {};
function updateLabels(positions){
  // positions: id -> {pos, radiusDisp, name}
  if(!state.showLabel){
    labelsEl.innerHTML = '';
    return;
  }
  const seen = new Set();
  for(const [id, o] of positions){
    const proj = projectPoint(state._vp, o.pos, W/DPR, H/DPR);
    if(!proj) continue;
    // 视半径
    const dist = Math.hypot(o.pos[0]-state.cam._eye[0], o.pos[1]-state.cam._eye[1], o.pos[2]-state.cam._eye[2]);
    const viewR = o.radiusDisp / Math.max(dist, 0.01);
    const px = viewR * H * 0.5; // approx
    const opacity = clamp(0.25 + px/12, 0.15, 0.9);
    let el = labelNodes[id];
    if(!el){
      el = document.createElement('div');
      el.className = 'lbl';
      labelsEl.appendChild(el);
      labelNodes[id] = el;
    }
    el.textContent = o.name;
    el.style.left = proj.x + 'px';
    el.style.top = (proj.y - Math.max(14, px+12)) + 'px';
    el.style.opacity = opacity;
    seen.add(id);
  }
  for(const id of Object.keys(labelNodes)){
    if(!seen.has(id)){
      labelNodes[id].remove();
      delete labelNodes[id];
    }
  }
}

const cam = state.cam;
function bodyWorld(id){
  if(id === 'sun') return [0,0,0];
  if(id === 'halley'){
    const ch = halleystate(state.simJD);
    const rd = distDisplay(ch.rAU);
    const inv = ch.rAU > 1e-9 ? rd / ch.rAU : 0;
    return [ch.ecl[0]*inv, ch.ecl[2]*inv, -ch.ecl[1]*inv];
  }
  const moon = MOONS.find(m=>m.id===id);
  if(moon){
    const parent = PLANETS.find(p=>p.id===moon.parent);
    const ps = planetState(parent, state.simJD);
    const rd = distDisplay(ps.rAU);
    const inv = ps.rAU > 1e-9 ? rd / ps.rAU : 0;
    const pw = [ps.ecl[0]*inv, ps.ecl[2]*inv, -ps.ecl[1]*inv];
    return moonWorldPos(moon, state.simJD, pw, radiusDisplay(parent.radiusKm));
  }
  const p = PLANETS.find(x=>x.id===id);
  if(p){
    const s = planetState(p, state.simJD);
    const rd = distDisplay(s.rAU);
    const inv = s.rAU > 1e-9 ? rd / s.rAU : 0;
    return [s.ecl[0]*inv, s.ecl[2]*inv, -s.ecl[1]*inv];
  }
  return [0,0,0];
}

canvas.addEventListener('pointerdown', e => {
  state.mouse.down = true;
  state.mouse.x = state.mouse.px = e.clientX;
  state.mouse.y = state.mouse.py = e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', e => {
  state.mouse.down = false;
  canvas.classList.remove('dragging');
  // 点击选择
  const dx = e.clientX - state.mouse.px;
  const dy = e.clientY - state.mouse.py;
  if(Math.hypot(dx,dy) < 5){
    pickBody(e.clientX, e.clientY);
  }
});
canvas.addEventListener('pointermove', e => {
  if(!state.mouse.down) return;
  const dx = e.clientX - state.mouse.x;
  const dy = e.clientY - state.mouse.y;
  state.mouse.x = e.clientX; state.mouse.y = e.clientY;
  cam.yaw -= dx * 0.005;
  cam.pitch = clamp(cam.pitch + dy * 0.005, -1.45, 1.45);
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(e.deltaY * 0.001);
  cam.distGoal = clamp(cam.distGoal * f, 0.05, 5000);
}, {passive:false});
// 双指缩放
let touchDist = 0;
canvas.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    touchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
  }
}, {passive:true});
canvas.addEventListener('touchmove', e => {
  if(e.touches.length === 2){
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    if(touchDist > 0){
      cam.distGoal = clamp(cam.distGoal * (touchDist/d), 0.05, 5000);
    }
    touchDist = d;
    e.preventDefault();
  }
}, {passive:false});

function pickBody(sx, sy){
  const labels = [];
  const add = (id, name, pos, radiusDisp) => {
    const proj = projectPoint(state._vp, pos, W/DPR, H/DPR);
    if(!proj) return;
    const d = Math.hypot(proj.x - sx, proj.y - sy);
    const dist = Math.hypot(pos[0]-state.cam._eye[0], pos[1]-state.cam._eye[1], pos[2]-state.cam._eye[2]);
    const viewR = (radiusDisp / Math.max(dist, 0.01)) * (H/DPR) * 0.5;
    const thresh = Math.max(12, viewR * 1.3);
    if(d < thresh) labels.push({id, d});
  };
  add('sun','太阳',[0,0,0], 3.9);
  for(const p of PLANETS){
    const pos = bodyWorld(p.id);
    add(p.id, p.name, pos, radiusDisplay(p.radiusKm));
    if(state.showMoon){
      for(const m of MOONS.filter(x=>x.parent===p.id)){
        const mp = bodyWorld(m.id);
        add(m.id, m.name, mp, radiusDisplay(m.radiusKm));
      }
    }
  }
  if(state.showComet){
    add('halley','哈雷', bodyWorld('halley'), 0.4);
  }
  labels.sort((a,b)=>a.d-b.d);
  if(labels[0]) selectBody(labels[0].id);
}

// ---------- 主循环 ----------
let lastT = performance.now();
let fps = 60, fpsAcc = 0, fpsN = 0;
buildTree();
selectBody('sun');
cam.dist = 95;
cam.distGoal = 95;
cam.yaw = 0.55;
cam.pitch = 0.42;
resize();
slider.oninput();

// 自转相位增量限速
const rotPhase = {};
for(const p of PLANETS) rotPhase[p.id] = Math.random()*Math.PI*2;
for(const m of MOONS) rotPhase[m.id] = Math.random()*Math.PI*2;
rotPhase['sun'] = 0;

function draw(){
  const now = performance.now();
  let dt = Math.min((now - lastT)/1000, 0.1);
  lastT = now;

  // 时间推进
  if(state.playing){
    state.simJD += state.timeDaysPerSec * dt;
  }
  // 压缩过渡
  if(compressAnimT < 1){
    compressAnimT = Math.min(1, compressAnimT + dt/0.4);
    const t = sstep(0, 1, compressAnimT);
    compressCur = lerp(COMPRESS_SOFT, COMPRESS_HARD, t);
  }

  // 相机目标平滑
  const targetPos = bodyWorld(cam.targetBody);
  // ensure bodyWorld uses display coords (fixed)
  // 平滑 target
  const k = 1 - Math.exp(-dt*3);
  cam.target[0] += (targetPos[0]-cam.target[0])*k;
  cam.target[1] += (targetPos[1]-cam.target[1])*k;
  cam.target[2] += (targetPos[2]-cam.target[2])*k;
  const kd = 1 - Math.exp(-dt*3);
  cam.dist += (cam.distGoal - cam.dist) * kd;

  const eye = [
    cam.target[0] + cam.dist * Math.cos(cam.pitch) * Math.sin(cam.yaw),
    cam.target[1] + cam.dist * Math.sin(cam.pitch),
    cam.target[2] + cam.dist * Math.cos(cam.pitch) * Math.cos(cam.yaw),
  ];
  cam._eye = eye;

  resize();

  const aspect = W/H;
  const distToTarget = Math.hypot(eye[0]-cam.target[0], eye[1]-cam.target[1], eye[2]-cam.target[2]);
  const near = Math.max(0.012, distToTarget * 0.0035);
  const far = Math.max(distToTarget * 14, 4200);
  const proj = mat4Perspective(50*DEG, aspect, near, far);
  const view = mat4LookAt(eye, cam.target, [0,1,0]);
  const vp = mat4Multiply(proj, view);
  state._vp = vp;
  const invVP = mat4Invert(vp);

  // 天体位置
  const sunPos = [0,0,0];
  const sunBrightGlobal = 1.0; // 太阳自身

  const positions = new Map();
  positions.set('sun', {pos:[0,0,0], radiusDisp: 3.9, name:'太阳'});

  const planetData = [];
  for(const p of PLANETS){
    const s = planetState(p, state.simJD);
    const rd = distDisplay(s.rAU);
    const inv = s.rAU > 1e-9 ? rd / s.rAU : 0;
    const world = [s.ecl[0]*inv, s.ecl[2]*inv, -s.ecl[1]*inv];
    const radiusDisp = radiusDisplay(p.radiusKm);
    // 自转增量限速
    const rotPeriodDays = Math.abs(p.rotH)/24 * (p.rotH<0?-1:1);
    let dphase = 2*Math.PI * (state.playing ? state.timeDaysPerSec*dt : 0) / (Math.abs(p.rotH)/24);
    if(p.rotH < 0) dphase = -dphase;
    dphase = clamp(dphase, -0.22, 0.22);
    if(state.playing) rotPhase[p.id] += dphase;

    const axE = axisEcl(p.tilt, p.poleLon);
    const axW = axisWorld(axE);
    const B = basisFromAxis(axW);

    planetData.push({p, s, world, radiusDisp, B, phase: rotPhase[p.id]});
    positions.set(p.id, {pos: world, radiusDisp, name: p.name});
  }

  // 卫星
  const moonData = [];
  if(state.showMoon){
    for(const m of MOONS){
      const parent = planetData.find(x=>x.p.id === m.parent);
      if(!parent) continue;
      const pos = moonWorldPos(m, state.simJD, parent.world, parent.radiusDisp);
      const radiusDisp = radiusDisplay(m.radiusKm);
      let dphase = 2*Math.PI * (state.playing ? state.timeDaysPerSec*dt : 0) / (Math.abs(m.radiusKm/ m.radiusKm * 1)); // moons tidally locked-ish: use period
      // 用周期近似自转
      dphase = 2*Math.PI * (state.playing ? state.timeDaysPerSec*dt : 0) / Math.abs(m.periodDays);
      if(m.periodDays < 0) dphase = -dphase;
      dphase = clamp(dphase, -0.22, 0.22);
      if(state.playing) rotPhase[m.id] = (rotPhase[m.id]||0) + dphase;
      const axW = [0,1,0]; // 简化：卫星轴用黄道北极附近
      // 更好：用母行星或自己的 — 简化用固定倾斜
      const B = basisFromAxis([0,1,0]);
      moonData.push({m, pos, radiusDisp, B, phase: rotPhase[m.id]||0, parent});
      positions.set(m.id, {pos, radiusDisp, name: m.name});
    }
  }

  // 彗星
  let cometPos = null;
  if(state.showComet){
    const ch = halleystate(state.simJD);
    const rd = distDisplay(ch.rAU);
    const inv = ch.rAU > 1e-9 ? rd / ch.rAU : 0;
    cometPos = [ch.ecl[0]*inv, ch.ecl[2]*inv, -ch.ecl[1]*inv];
    positions.set('halley', {pos: cometPos, radiusDisp: 0.35, name:'哈雷'});
  }

  // ---- 绘制到 HDR ----
  const fbo = useMSAA ? sceneMSAA : sceneFBO;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, W, H);
  // 7.1: clear 前恢复 depthMask
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // 1. 背景
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.useProgram(progBg);
  gl.uniformMatrix4fv(uBg.uInvVP, false, invVP);
  gl.uniform3f(uBg.uGalN, -0.8678, 0.4972, 0.0003);
  gl.uniform1f(uBg.uTime, state.simJD);
  gl.bindVertexArray(fsVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 2. 星空
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(progStar);
  gl.uniformMatrix4fv(uStar.uViewProj, false, vp);
  gl.uniform3fv(uStar.uCamPos, eye);
  gl.uniform1f(uStar.uStarDist, 4000);
  gl.uniform1f(uStar.uTime, state.simJD);
  gl.uniform1f(uStar.uPixelRatio, DPR);
  gl.bindVertexArray(starVAO);
  gl.drawArrays(gl.POINTS, 0, stars.count);
  gl.disable(gl.BLEND);

  // 3-4 太阳与行星球体
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  function drawBody(mesh, model, normalMat, typeCode, albedo, sunBright, hasRings, ringIn, ringOut, ringType, axisB, selfLit){
    gl.useProgram(progBody);
    gl.uniformMatrix4fv(uBody.uModel, false, model);
    gl.uniformMatrix4fv(uBody.uViewProj, false, vp);
    gl.uniformMatrix3fv(uBody.uNormalMat, false, normalMat);
    gl.uniform3fv(uBody.uCamPos, eye);
    gl.uniform3fv(uBody.uSunPos, sunPos);
    gl.uniform1f(uBody.uSunRadius, 3.9);
    gl.uniform1i(uBody.uBodyType, typeCode);
    gl.uniform1f(uBody.uTime, state.simJD);
    gl.uniform1f(uBody.uAlbedo, albedo);
    gl.uniform1f(uBody.uSunBright, sunBright);
    gl.uniform1f(uBody.uSelfLit, selfLit || 0);
    gl.uniform3fv(uBody.uAxisX, axisB.x);
    gl.uniform3fv(uBody.uAxisY, axisB.y);
    gl.uniform3fv(uBody.uAxisZ, axisB.z);
    gl.uniform1f(uBody.uHasRings, hasRings);
    gl.uniform1f(uBody.uRingInner, ringIn);
    gl.uniform1f(uBody.uRingOuter, ringOut);
    gl.uniform1f(uBody.uRingType, ringType);
    gl.bindVertexArray(mesh.vao);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_INT, 0);
  }

  // 太阳
  {
    const model = mat4Multiply(mat4Translate(0,0,0), mat4Scale(4.6,4.6,4.6));
    // 自转：以轴
    const axW = axisWorld(axisEcl(7.25, 0));
    const B = basisFromAxis(axW);
    const rot = mat4RotateY(rotPhase['sun']);
    const basisM = mat4FromBasis(B.x, B.y, B.z);
    const M = mat4Multiply(mat4Multiply(mat4Multiply(mat4Translate(0,0,0), basisM), rot), mat4Scale(4.6,4.6,4.6));
    const nrm = mat3FromBasis(B.x, B.y, B.z);
    drawBody(sphereHi, M, nrm, 0, 1, 1, 0, 0, 0, 0, B, 1);
  }

  for(const pd of planetData){
    const {p, world, radiusDisp, B, phase} = pd;
    const basisM = mat4FromBasis(B.x, B.y, B.z);
    const rot = mat4RotateY(phase);
    const M = mat4Multiply(mat4Multiply(mat4Multiply(mat4Translate(world[0], world[1], world[2]), basisM), rot), mat4Scale(radiusDisp, radiusDisp, radiusDisp));
    const nrm = mat3FromBasis(B.x, B.y, B.z);
    // 日心显示距 → sunBright 用真实 AU
    const sb = computeSunBright(pd.s.rAU);
    const typeCode = bodyTypeCode(p.id, p.body);
    const hasR = p.id==='saturn' ? 1 : (p.id==='uranus' ? 1 : (p.id==='jupiter' ? 1 : 0));
    let rIn=0,rOut=0,rTy=0;
    if(p.id==='saturn'){rIn=1.235;rOut=2.34;rTy=1;}
    if(p.id==='uranus'){rIn=1.60;rOut=2.00;rTy=2;}
    if(p.id==='jupiter'){rIn=1.40;rOut=1.81;rTy=3;}
    const mesh = radiusDisp > 1.2 ? sphereHi : sphereMid;
    drawBody(mesh, M, nrm, typeCode, p.albedo, sb, hasR, rIn, rOut, rTy, B, 0);
  }

  for(const md of moonData){
    const {m, pos, radiusDisp, B, phase} = md;
    const basisM = mat4FromBasis(B.x, B.y, B.z);
    const rot = mat4RotateY(phase);
    const M = mat4Multiply(mat4Multiply(mat4Multiply(mat4Translate(pos[0], pos[1], pos[2]), basisM), rot), mat4Scale(radiusDisp, radiusDisp, radiusDisp));
    const nrm = mat3FromBasis(B.x, B.y, B.z);
    // 距太阳真实距离近似：用母行星 r + 显示
    const sb = computeSunBright(md.parent.s.rAU);
    const typeCode = bodyTypeCode(m.id, m.body);
    drawBody(sphereLo, M, nrm, typeCode, m.albedo, sb, 0, 0, 0, 0, B, 0);
  }

  // 彗星星点（小球）
  if(cometPos){
    const M = mat4Multiply(mat4Translate(cometPos[0],cometPos[1],cometPos[2]), mat4Scale(0.35,0.35,0.35));
    const B = basisFromAxis([0,1,0]);
    const nrm = mat3Identity();
    const sb = computeSunBright(halleystate(state.simJD).rAU);
    // 自发光感
    gl.useProgram(progBody);
    drawBody(sphereLo, M, nrm, 7, 0.4, sb*1.5, 0,0,0,0, B, 1);
  }

  // 环系
  function drawRings(pd, mesh, rIn, rOut, rTy, color){
    // ring mesh 半径以母行星显示半径为 1.0
    const {world, radiusDisp, B, phase} = pd;
    const basisM = mat4FromBasis(B.x, B.y, B.z);
    // 环在赤道面 = 物体 xz，模型已有自转轴基
    const M = mat4Multiply(mat4Multiply(mat4Translate(world[0], world[1], world[2]), basisM), mat4Scale(radiusDisp, radiusDisp, radiusDisp));
    gl.useProgram(progRing);
    gl.uniformMatrix4fv(uRing.uModel, false, M);
    gl.uniformMatrix4fv(uRing.uViewProj, false, vp);
    gl.uniform3fv(uRing.uCamPos, eye);
    gl.uniform3fv(uRing.uSunPos, sunPos);
    gl.uniform3fv(uRing.uPlanetPos, world);
    gl.uniform1f(uRing.uPlanetRadius, radiusDisp);
    gl.uniform1f(uRing.uInner, rIn);
    gl.uniform1f(uRing.uOuter, rOut);
    gl.uniform1f(uRing.uType, rTy);
    gl.uniform1f(uRing.uSunBright, computeSunBright(pd.s.rAU));
    gl.uniform3fv(uRing.uRingColor, color);
    gl.bindVertexArray(mesh.vao);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_INT, 0);
  }

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);

  const sat = planetData.find(x=>x.p.id==='saturn');
  if(sat) drawRings(sat, ringSaturn, 1.235, 2.34, 1, [0.85, 0.78, 0.62]);
  const ura = planetData.find(x=>x.p.id==='uranus');
  if(ura) drawRings(ura, ringUranus, 1.60, 2.00, 2, [0.12, 0.11, 0.10]);
  const jup = planetData.find(x=>x.p.id==='jupiter');
  if(jup) drawRings(jup, ringJupiter, 1.40, 1.81, 3, [0.35, 0.32, 0.28]);

  // 轨道缎带
  if(state.showOrbit){
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(progOrbit);
    gl.uniformMatrix4fv(uOrbit.uViewProj, false, vp);
    gl.uniform2f(uOrbit.uViewport, W, H);
    gl.uniform1f(uOrbit.uWidthPx, 1.4 * DPR);
    gl.bindVertexArray(orbitVAO);
    function drawOrbitArr(arr, nVerts, color, alpha){
      gl.bindBuffer(gl.ARRAY_BUFFER, orbitVBO);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr, 0, nVerts * ORBIT_FLOATS);
      gl.uniform3fv(uOrbit.uColor, color);
      gl.uniform1f(uOrbit.uAlpha, alpha);
      gl.drawElements(gl.TRIANGLES, (nVerts/2 - 1)*6, gl.UNSIGNED_INT, 0);
    }
    for(const pd of planetData){
      // 轨道采样按偏近点角 E 扫一圈，头部也用 E
      const M = wrapPi((pd.s.L - pd.s.wbar) * DEG);
      const E = solveKepler(M, pd.s.e);
      const head = (E + Math.PI) / (Math.PI * 2);
      const pts = orbitSamplesFor(pd.p, state.simJD, MAX_ORBIT_SAMPLES);
      const arr = buildOrbitStrip(pts, head, eye);
      const color = pd.p.id===state.selected ? [0.55, 0.7, 1.1] : [0.22, 0.32, 0.55];
      drawOrbitArr(arr, MAX_ORBIT_SAMPLES*2, color, pd.p.id===state.selected ? 0.95 : 0.55);
    }
    if(state.showComet && cometPos){
      const pts = halleOrbitSamples(state.simJD, MAX_ORBIT_SAMPLES);
      const ch = halleystate(state.simJD);
      const head = (ch.E + Math.PI) / (Math.PI * 2);
      const arr = buildOrbitStrip(pts, head, eye);
      drawOrbitArr(arr, MAX_ORBIT_SAMPLES*2, [0.5, 0.55, 0.7], 0.4);
    }
  }

  // 小行星带
  if(state.showAsteroid){
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(progAst);
    gl.uniformMatrix4fv(uAst.uViewProj, false, vp);
    gl.uniform3fv(uAst.uCamPos, eye);
    gl.uniform1f(uAst.uTimeJD, state.simJD);
    gl.uniform1f(uAst.uCompress, compressCur);
    gl.uniform1f(uAst.uScale, SCALE_BASE);
    gl.uniform1f(uAst.uPixelRatio, DPR);
    for(const bb of beltBuffers){
      gl.bindVertexArray(bb.vao);
      gl.drawArrays(gl.POINTS, 0, bb.count);
    }
  }

  // 大气
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.FRONT); // 只画背面（远侧）？ 实际大气壳画整个壳，用 front cull 画 far side 或两边都画
  // 用双面：禁用 cull
  gl.disable(gl.CULL_FACE);

  function drawAtmosphere(pos, radiusDisp, heightFrac, color, intensity){
    const shellR = radiusDisp * (1 + heightFrac*7.5);
    const M = mat4Multiply(mat4Translate(pos[0],pos[1],pos[2]), mat4Scale(shellR, shellR, shellR));
    gl.useProgram(progAtm);
    gl.uniformMatrix4fv(uAtm.uModel, false, M);
    gl.uniformMatrix4fv(uAtm.uViewProj, false, vp);
    gl.uniformMatrix3fv(uAtm.uNormalMat, false, mat3Identity());
    gl.uniform3fv(uAtm.uCamPos, eye);
    gl.uniform3fv(uAtm.uSunPos, sunPos);
    gl.uniform3fv(uAtm.uPlanetPos, pos);
    gl.uniform1f(uAtm.uPlanetRadius, radiusDisp);
    gl.uniform3fv(uAtm.uAtmColor, color);
    gl.uniform1f(uAtm.uHeight, heightFrac);
    gl.uniform1f(uAtm.uSunBright, 1.0);
    gl.uniform1f(uAtm.uIntensity, intensity);
    gl.uniform1i(uAtm.uBodyType, 0);
    gl.uniform1f(uAtm.uTime, 0);
    gl.uniform1f(uAtm.uAlbedo, 1);
    gl.uniform1f(uAtm.uSelfLit, 0);
    gl.uniform3f(uAtm.uAxisX, 1,0,0);
    gl.uniform3f(uAtm.uAxisY, 0,1,0);
    gl.uniform3f(uAtm.uAxisZ, 0,0,1);
    gl.uniform1f(uAtm.uHasRings, 0);
    gl.uniform1f(uAtm.uRingInner, 0);
    gl.uniform1f(uAtm.uRingOuter, 0);
    gl.uniform1f(uAtm.uRingType, 0);
    gl.bindVertexArray(sphereMid.vao);
    gl.drawElements(gl.TRIANGLES, sphereMid.count, gl.UNSIGNED_INT, 0);
  }

  const earth = planetData.find(x=>x.p.id==='earth');
  if(earth) drawAtmosphere(earth.world, earth.radiusDisp, 0.035, [0.25, 0.45, 0.9], 0.55);
  const ven = planetData.find(x=>x.p.id==='venus');
  if(ven) drawAtmosphere(ven.world, ven.radiusDisp, 0.04, [0.85, 0.75, 0.55], 0.35);
  const mar = planetData.find(x=>x.p.id==='mars');
  if(mar) drawAtmosphere(mar.world, mar.radiusDisp, 0.025, [0.55, 0.3, 0.2], 0.25);
  const tit = moonData.find(x=>x.m.id==='titan');
  if(tit) drawAtmosphere(tit.pos, tit.radiusDisp, 0.05, [0.8, 0.45, 0.15], 0.5);

  // 彗尾
  if(state.showComet && cometPos){
    const ch = halleystate(state.simJD);
    const r = ch.rAU;
    if(r < 6.5){
      const scale = Math.pow(3/r, 2);
      const sunDir = norm3([cometPos[0]-sunPos[0], cometPos[1]-sunPos[1], cometPos[2]-sunPos[2]]);
      // 反日方向
      const anti = [-sunDir[0], -sunDir[1], -sunDir[2]];
      // 速度方向近似：轨道切向
      const ch2 = halleystate(state.simJD + 0.05);
      const vel = norm3([ch2.world[0]-ch.world[0], ch2.world[1]-ch.world[1], ch2.world[2]-ch.world[2]]);
      const lenI = 8 * scale;
      const lenD = 5 * scale;
      // 离子尾
      let arr = new Float32Array(32*2*5);
      for(let i=0;i<32;i++){
        const t = i/31;
        const p = [
          cometPos[0] + anti[0]*lenI*t,
          cometPos[1] + anti[1]*lenI*t,
          cometPos[2] + anti[2]*lenI*t,
        ];
        const wdt = (0.2 + t*0.8) * 0.5 * scale;
        // billboard 侧
        const toCam = norm3([eye[0]-p[0], eye[1]-p[1], eye[2]-p[2]]);
        const side = norm3(cross3(anti, toCam));
        for(let s=0;s<2;s++){
          const vi = (i*2+s)*5;
          const sgn = s===0?-1:1;
          arr[vi]=p[0]+side[0]*wdt*sgn;
          arr[vi+1]=p[1]+side[1]*wdt*sgn;
          arr[vi+2]=p[2]+side[2]*wdt*sgn;
          arr[vi+3]=sgn;
          arr[vi+4]=t;
        }
      }
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(progTail);
      gl.uniformMatrix4fv(uTail.uViewProj, false, vp);
      gl.bindVertexArray(tailVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER, tailVBO);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr);
      gl.uniform3f(uTail.uColor, 0.35, 0.55, 1.0);
      gl.uniform1f(uTail.uAlpha, 0.55*clamp(scale,0,1.5));
      gl.drawElements(gl.TRIANGLES, 31*6, gl.UNSIGNED_INT, 0);

      // 尘埃尾：弯曲
      arr = new Float32Array(32*2*5);
      for(let i=0;i<32;i++){
        const t = i/31;
        // 沿速度反方向 + 弯曲
        const bend = t*t*0.35;
        const dir = norm3([
          -vel[0] + anti[0]*bend*0.3,
          -vel[1] + anti[1]*bend*0.3,
          -vel[2] + anti[2]*bend*0.3,
        ]);
        const p = [
          cometPos[0] + dir[0]*lenD*t,
          cometPos[1] + dir[1]*lenD*t,
          cometPos[2] + dir[2]*lenD*t,
        ];
        const wdt = (0.35 + t*1.4) * 0.6 * scale;
        const toCam = norm3([eye[0]-p[0], eye[1]-p[1], eye[2]-p[2]]);
        const side = norm3(cross3(dir, toCam));
        for(let s=0;s<2;s++){
          const vi = (i*2+s)*5;
          const sgn = s===0?-1:1;
          arr[vi]=p[0]+side[0]*wdt*sgn;
          arr[vi+1]=p[1]+side[1]*wdt*sgn;
          arr[vi+2]=p[2]+side[2]*wdt*sgn;
          arr[vi+3]=sgn;
          arr[vi+4]=t;
        }
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, tailVBO);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr);
      gl.uniform3f(uTail.uColor, 1.0, 0.75, 0.35);
      gl.uniform1f(uTail.uAlpha, 0.35*clamp(scale,0,1.5));
      gl.drawElements(gl.TRIANGLES, 31*6, gl.UNSIGNED_INT, 0);
    }
  }

  // 日冕
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(progCorona);
  gl.uniformMatrix4fv(uCorona.uViewProj, false, vp);
  gl.uniform3fv(uCorona.uCamPos, eye);
  gl.uniform3f(uCorona.uCenter, 0, 0, 0);
  gl.uniform1f(uCorona.uSize, 3.9*3.1);
  gl.uniform1f(uCorona.uTime, state.simJD);
  gl.uniform1f(uCorona.uIntensity, 0.38);
  gl.bindVertexArray(coronaVAO);
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  gl.uniform1f(uCorona.uSize, 3.9*9.0);
  gl.uniform1f(uCorona.uIntensity, 0.18);
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);

  gl.depthMask(true);

  // ---- resolve MSAA ----
  if(useMSAA && sceneMSAA){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, sceneMSAA);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, sceneFBO);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // ---- bloom ----
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.depthMask(false);
  gl.bindVertexArray(fsVAO);

  // threshold → bloomTex[0] which is half res
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBO[0]);
  gl.viewport(0, 0, Math.max(1,W>>1), Math.max(1,H>>1));
  gl.useProgram(progThresh);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(uThresh.uTex, 0);
  gl.uniform1f(uThresh.uThreshold, hasFloat ? 1.25 : 0.55);
  gl.uniform1f(uThresh.uKnee, 0.6);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // downsample 1..5
  for(let i=1;i<6;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBO[i]);
    const bw = bloomTex[i] ? Math.max(1, W>>(i+1)) : 1;
    const bh = Math.max(1, H>>(i+1));
    gl.viewport(0, 0, Math.max(1, W>>(i+1)), Math.max(1, H>>(i+1)));
    gl.useProgram(progDown);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, bloomTex[i-1]);
    gl.uniform1i(uDown.uTex, 0);
    gl.uniform2f(uDown.uTexel, 1/Math.max(1,W>>i), 1/Math.max(1,H>>i));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  // upsample accumulate (no feedback: additive into larger, sample only smaller)
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  for(let i=5;i>0;i--){
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBO[i-1]);
    gl.viewport(0, 0, Math.max(1, W>>i), Math.max(1, H>>i));
    gl.useProgram(progUp);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, bloomTex[i]);
    gl.uniform1i(uUp.uTex, 0);
    gl.uniform2f(uUp.uTexel, 1/Math.max(1,W>>(i+1)), 1/Math.max(1,H>>(i+1)));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.disable(gl.BLEND);

  // ---- composite ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(uComp.uScene, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, bloomTex[0]);
  gl.uniform1i(uComp.uBloom, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, bloomTex[1]);
  gl.uniform1i(uComp.uBlur1, 2);
  gl.activeTexture(gl.TEXTURE3);
  gl.bindTexture(gl.TEXTURE_2D, bloomTex[2]);
  gl.uniform1i(uComp.uBlur2, 3);
  gl.uniform1f(uComp.uBloomStrength, state.showBloom ? (hasFloat ? 0.55 : 0.7) : 0.0);
  gl.uniform1f(uComp.uTime, state.simJD * 1000 % 100000);
  // 太阳屏幕坐标
  const sunProj = projectPoint(vp, [0,0,0], W/DPR, H/DPR);
  let sunVis = 0;
  if(sunProj){
    const sunUV = [sunProj.x/(W/DPR), 1 - sunProj.y/(H/DPR)];
    gl.uniform2f(uComp.uSunScreen, sunUV[0], sunUV[1]);
    // 可见度：太阳在前方，且未被行星遮挡
    sunVis = 1;
    const toSun = norm3([-eye[0], -eye[1], -eye[2]]);
    const viewDir = norm3([cam.target[0]-eye[0], cam.target[1]-eye[1], cam.target[2]-eye[2]]);
    if(dot3(viewDir, toSun) < 0) sunVis = 0;
    // 屏幕内
    if(sunUV[0] < -0.2 || sunUV[0] > 1.2 || sunUV[1] < -0.2 || sunUV[1] > 1.2) sunVis *= 0.15;
    // 行星遮挡：屏幕距离与深度
    for(const pd of planetData){
      const pp = projectPoint(vp, pd.world, W/DPR, H/DPR);
      if(!pp) continue;
      const ds = Math.hypot(pp.x - sunProj.x, pp.y - sunProj.y);
      const dist = Math.hypot(pd.world[0]-eye[0], pd.world[1]-eye[1], pd.world[2]-eye[2]);
      const sunDist = Math.hypot(eye[0], eye[1], eye[2]);
      const viewR = (pd.radiusDisp / Math.max(dist, 0.01)) * (H/DPR) * 0.5;
      if(ds < viewR * 1.1 && dist < sunDist + pd.radiusDisp) {
        sunVis *= 0.15;
      }
    }
  } else {
    gl.uniform2f(uComp.uSunScreen, -1, -1);
    sunVis = 0;
  }
  gl.uniform1f(uComp.uSunVis, sunVis);
  gl.uniform1f(uComp.uSunSize, window.__solarDebugRaw ? -1.0 : 1.0);
  gl.uniform2f(uComp.uViewport, W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 标签
  updateLabels(positions);

  // UI 更新
  document.getElementById('dateDisplay').textContent = formatJD(state.simJD);
  const y = jdToDate(state.simJD).getUTCFullYear();
  document.getElementById('status').style.display = (y<1800||y>2050) ? 'block' : 'none';
  // 信息面板节流
  if(!draw._ui || now - draw._ui > 250){
    draw._ui = now;
    updateInfoPanel();
  }

  gl.getError(); // keep quiet
  requestAnimationFrame(draw);
}

window.__solar = {
  state, gl,
  get W(){return W}, get H(){return H},
  get useMSAA(){return useMSAA},
  get sceneTex(){return sceneTex},
  get sceneFBO(){return sceneFBO},
  get hasFloat(){return hasFloat},
  readScene(){
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
    const px = new Float32Array(4);
    try {
      gl.readPixels(W>>1, H>>1, 1, 1, gl.RGBA, gl.FLOAT, px);
      return {f32:[...px], status: gl.checkFramebufferStatus(gl.FRAMEBUFFER)};
    } catch(e) {
      const p8 = new Uint8Array(4);
      gl.readPixels(W>>1, H>>1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p8);
      return {u8:[...p8], err:String(e)};
    }
  },
  readDefault(){
    const p8 = new Uint8Array(4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.readPixels(W>>1, H>>1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p8);
    return [...p8];
  }
};
requestAnimationFrame(draw);
</script>
</body>
</html>
