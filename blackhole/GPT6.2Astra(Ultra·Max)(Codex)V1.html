<script>
'use strict';

const geoAUkm = 1.495978707e8;
const geoRad = Math.PI / 180;
const geoTau = 2 * Math.PI;

function radii(spin) {
  const a = Math.min(0.998, Math.max(0, Number(spin)));

  function plotBase(canvas) {
    const surface=sizeCanvas(canvas);if(!surface)return null;
    const {c,w,h}=surface;c.clearRect(0,0,w,h);
    c.save();c.strokeStyle='#282f2a';c.lineWidth=.65;c.beginPath();
    for(let j=1;j<5;j++){const x=8+(w-16)*j/5;c.moveTo(x,9);c.lineTo(x,h-16);}
    for(let j=1;j<4;j++){const y=9+(h-25)*j/4;c.moveTo(8,y);c.lineTo(w-8,y);}
    c.stroke();c.restore();
    c.font='10px ui-monospace, monospace';c.fillStyle='#8b958b';return surface;
  }
  function chartOrbit(p) {
    const bounds=plotBase(refs('[data-orbit]'));if(!bounds||!p)return;
    const {c,w,h}=bounds,npoints=newton&&p.newtonian?p.newtonian.points:[];
    let limit=1;for(const v of [...p.trail,...npoints])limit=Math.max(limit,Math.abs(v[0]),Math.abs(v[1]));
    const scale=.43*Math.min(w,h)/limit,project=v=>[w*.5+v[0]*scale,h*.50-v[1]*scale];
    dot(c,project([0,0]),'#726c60',Math.max(1.8,scale*radii(p.o.spin).horizon));
    line(c,p.trail,project,p.color,.94);line(c,npoints,project,'#bec1bb',.78,[3,4]);
    dot(c,project(pointOf(p.y,p.o.spin)),'#fff2cc',3);
    c.fillText('±'+display(limit,0)+' M',8,h-4);
  }
  function chartPotential(p) {
    const bounds=plotBase(refs('[data-potential]'));if(!bounds||!p)return;
    const {c,w,h}=bounds,{E,L,spin:a}=p.o, th=p.initial[1],pt=p.initial[5];
    const Q=pt*pt+Math.cos(th)**2*(a*a*(1-E*E)+L*L/Math.sin(th)**2);
    const rL=radii(a).horizon+.01,rR=Math.max(12,1.22*p.sum.rMax), points=[];
    const rel=1-E*E,emin=E*E-Math.max(.035,Math.abs(rel)*2.1),emax=Math.max(1.01,E*E+.035);
    const top=10,base=h-19,left=22,right=w-8;
    const project=([r,v])=>[left+(right-left)*(r-rL)/(rR-rL),base-(base-top)*(v-emin)/(emax-emin)];
    // The positive root of R(r; E, Lz, Q) = 0 reduces to the Schwarzschild effective potential.
    for(let j=0;j<=240;j++){
      const r=rL+(rR-rL)*j/240,rr=r*r,aa=a*a,D=rr-2*r+aa;
      const A=(rr+aa)**2-aa*D,B=-4*a*r*L,C=aa*L*L-D*(rr+L*L+Q);
      points.push([r,((-B+Math.sqrt(Math.max(0,B*B-4*A*C)))/(2*A))**2]);
    }
    c.save();c.beginPath();c.rect(left,top,right-left,base-top);c.clip();
    line(c,points,project,'#8cd2bf');line(c,[[rL,E*E],[rR,E*E]],project,'#e3af79',.85,[4,3]);
    dot(c,project([p.y[0],E*E]),'#f7cea1',3);c.restore();
    c.fillText(display(rL,1),left,base+14);c.fillText(display(rR,1)+' M',Math.max(left,right-48),base+14);
    c.fillStyle='#d4ad82';c.fillText('E² '+display(E*E,3),left+4,top+9);
  }
  function starChart() {
    const canvas=refs('.lab-sky');if(!canvas)return;
    const size=plotBase(canvas);if(!size)return;
    const {c,w,h}=size, shown=stars.slice(0,group?stars.length:1);
    let x0=0,x1=0,y0=0,y1=0;
    for(const star of shown)for(const p of star.path){
      x0=Math.min(x0,-p.east_mas);x1=Math.max(x1,-p.east_mas);
      y0=Math.min(y0,p.north_mas);y1=Math.max(y1,p.north_mas);
    }
    const scale=Math.min((w-48)/(x1-x0),(h-35)/(y1-y0));
    const cx=w/2-(x0+x1)*scale/2, cy=h/2+(y0+y1)*scale/2;
    const project=p=>[cx-p.east_mas*scale,cy-p.north_mas*scale];
    dot(c,[cx,cy],'#c0c9bd',2.7,'Sgr A*');
    for(const star of shown){
      line(c,star.path,project,star.color,star.name==='S2'?.95:.57);
      dot(c,project(skyOrbit(star.elements,year,star.scale)),star.color,star.name==='S2'?3.3:2.3,star.name);

    c.fillStyle='#939b91';c.fillText('← 东　 ↑ 北',7,12);
    const length=group?200:25;c.beginPath();c.moveTo(8,h-12);c.lineTo(8+length*scale,h-12);
    c.strokeStyle='#798076';c.stroke();c.fillText(length+' mas',8,h-18);
  }
  function updateStarNumbers() {

      metric('近心距 / 远心距',display(aAU*(1-el.e),0)+' / '+display(aAU*(1+el.e),0)+' AU')+
      metric('下次过近心点',(el.epoch+(Math.floor((year-el.epoch)/el.period)+1)*el.period).toFixed(3));

  function s2UI() {
    container.innerHTML=`<div class="lab-shell">
      <div class="lab-chartbox"><header><span>银心恒星轨道 · 天球投影</span><span>ΔRA / ΔDec</span></header><canvas class="lab-sky">银心恒星投影轨道</canvas></div>

    </div>`;
    const slider=refs('.lab-date');
    slider.oninput=()=>{year=Number(slider.value);updateStarNumbers();};

    refs('[data-sky]').onclick=()=>{

      const camR=group?500000:100000;
      const aspect=Math.max(.25,overlay.clientWidth/Math.max(1,overlay.clientHeight));
      let extent=.1;
      for(const star of stars.slice(0,group?stars.length:1)) for(const p of star.path) {
        const [x,y,z]=worldStar(star,p),depth=camR-x;
        extent=Math.max(extent,Math.abs(z)/depth,Math.abs(y)/(depth*aspect));
      }
      const fovY=2*Math.atan(1.55*extent)/geoRad;
      setState({preset:'sgra',spin:0,camR,camIncl:90,camAz:0,fovY,autoRotate:false,view:'physical'});
      onRequestClose?.();
    };
    refs('[data-return]').onclick=()=>{
      setState(cameraBookmark||{camR:30,camIncl:80,camAz:0,fovY:55,spin:.9});cameraBookmark=null;onRequestClose?.();

  function paintLab() {
    if(mode==='orbit'){chartOrbit(activeChart);chartPotential(activeChart);}
    if(mode==='s2')starChart();
  }
  function open(which){mode=which;lastPaint=0;if(which==='s2')s2UI();else orbitUI();}
  function close(){mode=null;activeChart=null;}
  function update(state,dt) {
    for(const p of particles)advance(p,state.time-p.epoch);

    const now=performance.now();
    if(mode && now-lastPaint>130){
      lastPaint=now;paintLab();if(mode==='orbit')updateReadout(activeChart);
    }
  }
  return {open,close,update,remove,select};

// Reference values are the reference table's rounded measurements. The measured
// column comes from the active GPU trace pass or the live timelike integrator.
function measureChecks(renderer,current) {
  const out=[],deg=180/Math.PI,base={...current,spin:0,camAz:0,camIncl:90,camR:30,disk:false,lensing:true,rOut:20};
  function test(name,expected,actual,tolerance) {
    out.push({name,expected,measured:actual,pass:typeof expected==='number'?
      Number.isFinite(actual)&&Math.abs(actual-expected)<=tolerance:actual===expected});
  }
  function horizontalEdges(cfg) {
    let sides=[[0,10],[0,10]];
    for(let j=0;j<3;j++) {
      const samples=[];
      sides.forEach(([lo,hi],s)=>{for(let k=0;k<=24;k++) samples.push([(s?1:-1)*(lo+(hi-lo)*k/24)/cfg.camR,0])});
      const hits=renderer.trace(cfg,samples);
      sides=sides.map(([lo,hi],s)=>{
        const index=hits.slice(s*25,s*25+25).findIndex(h=>h.fate==='escape');
        if(index<1)return [lo,hi];
        return [lo+(hi-lo)*(index-1)/24,lo+(hi-lo)*index/24];
      });
    }
    return sides.map(([lo,hi],s)=>(s?1:-1)*(lo+hi)/2);
  }
  for(const [camR,expect] of [[30,.16973],[6,1],[1000,.005191]]) {
    const edge=horizontalEdges({...base,camR});
    test('A · 阴影角正切  R = '+camR+' M',expect,edge[1]/camR,expect*.004);
  }
  const distant={...base,camR:100000};
  const bs=[6,10,100],targets=bs.map(b=>Math.tan(Math.asin(b*Math.sqrt(1-2/distant.camR)/distant.camR)));
  renderer.trace(distant,targets.map(x=>[x,0])).forEach((ray,j)=>{
    const x=targets[j],cos=ray.out&&(-ray.out[0]+x*ray.out[1])/Math.hypot(1,x);
    test('B · 偏折角  b = '+bs[j]+' M（°）',[98.51,33.83,2.362][j],
      cos==null?null:Math.acos(Math.max(-1,Math.min(1,cos)))*deg,j===2?.06:.22);
  });
  for(const [spin,camIncl,left,right] of [[.9,90,-2.842,6.825],[.9,60,-3.094,6.582],[.998,90,-2.110,6.989]]) {
    const e=horizontalEdges({...base,camR:1000,spin,camIncl});
    test('C · 左界  a='+spin+'，i='+camIncl+'°（M）',left,e[0],spin>.99?.15:.06);
    test('C · 右界  a='+spin+'，i='+camIncl+'°（M）',right,e[1],.06);
  }
  const rays=[[-.22,.20],[.22,.08],[0,.08],[-.45,.40]];
  for(const [spin,camIncl,k,r,g,lon] of [[0,80,'K1',14.030,.5376,-169.26],[.9,75,'K2',14.461,.4485,-169.02]]) {
    const h=renderer.trace({...base,spin,camIncl,disk:true},rays);
    test('D · '+k+' 盘面半径（M）',r,h[0].rHit??null,.045);
    test('D · '+k+' 红移因子',g,h[1].g??null,.008);
    test('D · '+k+' 中心附近光线','horizon',h[2].fate);
    test('D · '+k+' 出射经度（°）',lon,h[3].out?Math.atan2(h[3].out[1],h[3].out[0])*deg:null,.3);
  }
  const secondary=renderer.trace({...base,camIncl:85,rOut:12,disk:true},[[0,-.22]])[0];
  test('D · 次级像穿越赤道次数',2,secondary.nCross,0);
  test('D · 次级像半径（M）',7.929,secondary.rHit??null,.045);
  let low=18, high=30;
  for(let pass=0;pass<3;pass++) {
    const rays=Array.from({length:19},(_,i)=>[Math.tan((low+(high-low)*i/18)/deg),0]);
    const ys=renderer.trace(base,rays).map(h=>h.out?.[1]);
    const j=ys.findIndex((y,i)=>i>0 && Number.isFinite(y) && y*ys[i-1]<=0);
    if(j<1){low=high=NaN;break;}
    const increment=(high-low)/18;
    high=low+j*increment;low=high-increment;
  }
  test('E · 爱因斯坦环角半径（°）',23.71,(low+high)/2,.15);
  const p=orbit({spin:0,E:.966092,L:3.849002,r0:10}),k=orbit({spin:.9,E:.95,L:3,r0:10});
  test('F · 史瓦西每圈进动（°）',216.12,p.dphiDeg-360,.12);
  test('F · 克尔径向坐标周期（M）',252.23,k.tCoord,.15);
  const drop=orbit({spin:0,E:.8944272,L:0,r0:10,prSign:-1});
  test('F · 自由落入固有时（M）',33.68,drop.tauPlunge,.05);
  for(const [key,name,d] of [['sgra','Sgr A*',53.3],['m87','M87*',39.7]])
    test('G · '+name+' 阴影角直径（μas）',d,units(key).shadow_uas,.15);
  test('G · S2 近心点进动（′）',12.17,s2Advance(),.08);
  test('G · S2 北向位置  2026.0（mas）',177.71,s2(2026).north_mas,.04);
  test('G · Sgr A* 史瓦西 ISCO 周期（分）',32.6,units('sgra').iscoPeriod_s/60,.1);
  return out;
}

 const waveFrequency=t=>1/Math.PI*(5/(256*t))**(.375)/((1+z)*chirp*solarT)**.625;
 const remaining=f=>5/256*(Math.PI*f)**(-8/3)*((1+z)*chirp*solarT)**(-5/3);
 body.innerHTML='<p>GW150914 的两个源参考系质量为 35.6 与 30.6 M☉。采用规格给出的源参考系啁啾质量 28.6 M☉。下图按最低阶旋近公式计算，演化在非自转总质量的 ISCO 频率估计处截止。</p><canvas id="chirp-wave" aria-label="旋近波形，横轴为距并合秒数" style="display:block;width:100%;height:160px;margin:12px 0;background:#0b1016;border-radius:6px"></canvas><label class="control"><span>距并合时间 τ <output id="chirp-t"></output></span><input type="range" id="chirp-range" max=".8" step=".001" value=".1"></label><label class="switchrow">地球观察者参考系（z = 0.09）<input type="checkbox" id="chirp-z"></label><p id="chirp-info"></p><div class="dialog-actions"><button id="listen">试听旋近波形</button><button id="see-remnant">观测并合产物</button></div><p style="margin-top:11px">源参考系参考值为 τ = 0.1 s 时 44.0 Hz，35 Hz 时剩余 0.185 s。地球参考系的对应值为 41.7 Hz 和 0.160 s。实测约 150 Hz 的峰值及约 250 Hz 的铃宕发生在后续阶段。</p>';
 const stop=()=>{try{voice?.stop()}catch{}voice=null;if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null;}};
 function paint(){const end=remaining(1/(6**1.5*Math.PI*(m1+m2)*(1+z)*solarT));
   id('chirp-range').min=end.toFixed(4);tau=Math.max(end,tau);id('chirp-range').value=tau;id('chirp-t').textContent=simple(tau,3)+' s';
   id('chirp-info').textContent='啁啾质量 '+simple(chirp*(1+z),2)+' M☉　·　当前 '+simple(waveFrequency(tau),2)+' Hz　·　35 Hz 时剩余 '+simple(remaining(35),3)+' s';
   const cv=id('chirp-wave'),w=cv.clientWidth,h=cv.clientHeight,d=devicePixelRatio;if(!w)return;cv.width=w*d;cv.height=h*d;
   const c=cv.getContext('2d');c.scale(d,d);const X=t=>9+(w-18)*(.8-t)/(.8-end),phase=t=>2*Math.PI*waveFrequency(t)*t*8/5;
   c.font='10px monospace';c.fillStyle='#a7b0b5';c.strokeStyle='#27343b';for(let t=.8;t>end;t-=.2){c.beginPath();c.moveTo(X(t),8);c.lineTo(X(t),h-22);c.stroke();c.fillText(t.toFixed(1)+' s',X(t)+2,h-7)}
   c.strokeStyle='#a1d5d2';c.beginPath();for(let i=0;i<=w*2;i++){const t=.8-(.8-end)*i/(w*2),xx=X(t),yy=(h-16)/2+Math.sin(phase(t))*(end/t)**.25*h*.36;i?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.stroke();c.strokeStyle='#edba80';c.beginPath();c.moveTo(X(tau),4);c.lineTo(X(tau),h-20);c.stroke();
 }
 id('chirp-range').oninput=e=>{tau=+e.target.value;paint()};id('chirp-z').onchange=e=>{z=e.target.checked ? .09 : 0;stop();paint()};
 id('listen').onclick=async()=>{stop();try{audioCtx=new AudioContext();await audioCtx.resume();if(dialogPage!=='gw'){stop();return;}
   const stopT=+id('chirp-range').min,span=.8-stopT,rate=audioCtx.sampleRate,buf=audioCtx.createBuffer(1,Math.ceil(span*rate),rate),x=buf.getChannelData(0);let phase=0;
   for(let j=0;j<x.length;j++){const t=.8-j/rate;phase+=2*Math.PI*waveFrequency(t)/rate;x[j]=.48*(stopT/t)**.25*Math.sin(phase)*Math.min(1,j/(.015*rate),(x.length-1-j)/(.015*rate));}
   voice=audioCtx.createBufferSource();voice.buffer=buf;voice.connect(audioCtx.destination);voice.start();
 }catch{if(id('listen'))id('listen').textContent='当前浏览器无法播放音频'}};
 id('see-remnant').onclick=()=>{setState({preset:'gw150914',spin:.69,camIncl:75,camR:30,fovY:framingFov(),view:'physical'});finishDialog()};
 chirpCleanup=stop;paint();
}
function catalogExpanded(expanded){id('catalog').hidden=!expanded;id('catalog-button').setAttribute('aria-expanded',expanded)}
function responsive(){catalogExpanded(!mobile.matches);id('right').dataset.fold=mobile.matches;id('tele-head').tabIndex=mobile.matches?0:-1;id('tele-head').setAttribute('role',mobile.matches?'button':'heading');id('tele-head').setAttribute('aria-expanded',!mobile.matches)}
function tabSettings(on){id('settings-tab').setAttribute('aria-selected',on);id('read-tab').setAttribute('aria-selected',!on);id('controls').hidden=!on;id('readings').hidden=on}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>openPage(b.dataset.nav));
id('dialog-close').onclick=finishDialog;dlg.addEventListener('cancel',e=>{e.preventDefault();finishDialog()});
dlg.addEventListener('click',e=>{if(e.target!==dlg)return;const b=dlg.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)finishDialog()});
id('direct-s2').onclick=()=>openPage('s2');
id('catalog-button').onclick=()=>catalogExpanded(id('catalog').hidden);
id('tele-head').onclick=()=>{if(mobile.matches){const expand=id('right').dataset.fold==='true';id('right').dataset.fold=!expand;id('tele-head').setAttribute('aria-expanded',expand)}};
id('tele-head').onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();id('tele-head').click()}};
id('read-tab').onclick=()=>tabSettings(false);id('settings-tab').onclick=()=>tabSettings(true);
document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{setState({preset:b.dataset.target});if(mobile.matches)catalogExpanded(false)});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setState({view:b.dataset.view}));
document.querySelectorAll('[data-param]').forEach(el=>el.oninput=()=>setState({[el.dataset.param]:el.type==='checkbox'?el.checked:+el.value}));
id('speed').oninput=e=>setState({speed:Math.sign(state.speed||1)*10**Number(e.target.value)});id('reverse').onclick=()=>setState({speed:-state.speed||-1});id('play').onclick=()=>setState({paused:!state.paused});
id('probe').onclick=()=>setProbe(!probeMode);id('auto-rotate').onclick=()=>{if(probeMode)setProbe(false);setState({autoRotate:!state.autoRotate})};
id('reset').onclick=()=>setState({camR:30,camIncl:subjects[state.preset].incl,camAz:0,fovY:framingFov()});
function clean(){document.body.classList.toggle('ui-hidden');clearProbe()}
id('clean').onclick=clean;id('restore').onclick=clean;
addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,button')||dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.code==='Space'){e.preventDefault();setState({paused:!state.paused})}
 if(e.key.toLowerCase()==='h')clean();if(e.key.toLowerCase()==='p')setProbe(!probeMode);
 if(e.key==='Escape'){document.body.classList.remove('ui-hidden');if(probeMode)setProbe(false)}
});
const inputCanvas=id('space'),pointers=new Map();let baseline=null,moved=false;
function pointerBaseline(){const p=[...pointers.values()];baseline=p.length?{start:p[0],incl:state.camIncl,az:state.camAz,r:state.camR,distance:p[1]?Math.max(1,Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1])):0}:null}
inputCanvas.onpointerdown=e=>{if(e.button!==0)return;inputCanvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1)moved=false;else moved=true;pointerBaseline()};
inputCanvas.onpointermove=e=>{if(!pointers.has(e.pointerId)||!baseline)return;pointers.set(e.pointerId,[e.clientX,e.clientY]);const p=[...pointers.values()];
 if(p.length>=2){const d=Math.max(1,Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1]));setState({camR:baseline.r*baseline.distance/d,autoRotate:false});moved=true;return;}
 const dx=p[0][0]-baseline.start[0],dy=p[0][1]-baseline.start[1];if(Math.hypot(dx,dy)>3)moved=true;
 if(moved)setState({camAz:baseline.az-dx*.23,camIncl:clamp(baseline.incl-dy*.23,.03,179.97),autoRotate:false});
};
function releasePointer(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(!pointers.size&&!moved&&probeMode&&e.type==='pointerup')sampleProbe(e.clientX,e.clientY);pointerBaseline()}
inputCanvas.onpointerup=releasePointer;inputCanvas.onpointercancel=releasePointer;
inputCanvas.addEventListener('wheel',e=>{e.preventDefault();const delta=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*innerHeight:e.deltaY;setState({camR:state.camR*Math.exp(clamp(delta,-1000,1000)*.0017)})},{passive:false});
responsive();mobile.addEventListener('change',responsive);
addEventListener('resize',()=>{
 clearProbe();const f=framingFov();if(Math.abs(state.fovY-lastFrameFov)<1e-6)setState({fovY:f});lastFrameFov=f;
});
function listParticles(rows){
 id('particle-list').replaceChildren(...rows.map(p=>{const b=document.createElement('button'),dot=document.createElement('i');dot.style.background=p.color;b.append(dot,document.createTextNode(p.name));b.onclick=()=>{lab.select(p.id);openPage('orbit')};return b}));
}
function tick(stamp){
 if(document.hidden)return;
 const dt=lastStamp?Math.min(.1,Math.max(0,(stamp-lastStamp)/1000)):0;lastStamp=stamp;
 if(!state.paused){state.time+=dt*state.speed;}
 if(state.autoRotate&&!state.paused)state.camAz=(state.camAz+.6*dt)%360;
 renderer.draw(state);lab.update(state,dt);
 if(stamp-lastUI>=100){id('time-m').textContent=simple(state.time,1)+' M';id('time-s').textContent=duration(state.time*units(state.preset).tg_s);clockRead?.();lastUI=stamp;
   const stats=renderer.stats(false);id('stats').textContent='WebGL 2　·　'+stats.renderW+' × '+stats.renderH+'　·　'+(stats.fps?stats.fps.toFixed(0)+' FPS':'测量帧率中');}
 raf=requestAnimationFrame(tick);
}
function resumeLoop(){cancelAnimationFrame(raf);lastStamp=0;if(!document.hidden)raf=requestAnimationFrame(tick)}
function init(){
 try{
   renderer=createRenderer(inputCanvas);lab=createLab({getState,setState,overlay:id('overlay'),container:body,onListChange:listParticles,onRequestClose:finishDialog});
   window.BH={version:'1.0.0',info:{traceBackend:'gpu',diskModel:'NT',particlesLensed:false},get:getState,
     set(obj){const s=setState(obj);renderer.draw(state);lab.update(state,0);return s},trace:rays=>renderer.trace(state,rays),radii,disk:r=>diskAt(r,state.spin,state.Tmax),orbit,units,s2,
     stats:()=>renderer.stats(),selfCheck:()=>measureChecks(renderer,state)};
   refreshControls();renderer.draw(state);id('splash').hidden=true;resumeLoop();
 }catch(err){id('splash').innerHTML='<b>无法启动 WebGL 2</b><span id="error-msg"></span>';id('error-msg').textContent=err.message;console.error(err)}
}
document.addEventListener('visibilitychange',()=>{if(renderer)resumeLoop()});
inputCanvas.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(raf);id('splash').innerHTML='<b>图形上下文已中断</b><span>等待浏览器恢复渲染…</span>';id('splash').hidden=false});
inputCanvas.addEventListener('webglcontextrestored',()=>{renderer=createRenderer(inputCanvas);id('splash').hidden=true;resumeLoop()});
requestAnimationFrame(()=>requestAnimationFrame(init));

</script></body></html>
