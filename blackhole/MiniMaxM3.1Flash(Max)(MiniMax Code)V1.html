<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>克尔黑洞与吸积盘实时模型</title>
<style>
:root{
  --bg:#05070c; --panel:rgba(13,16,24,.74); --line:rgba(255,255,255,.085);
  --fg:#dde5f2; --dim:#8c97ab; --acc:#79c0ff; --acc2:#ffb35c; --ok:#69d68a; --bad:#ff7b72;
  --r:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
.pan{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 12px 40px rgba(0,0,0,.45)}
.pan h3{font-size:12px;font-weight:600;color:var(--acc);letter-spacing:.06em;padding:9px 12px 7px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.pan h3 .x{margin-left:auto;cursor:pointer;color:var(--dim);font-weight:400;font-size:15px;line-height:1;padding:2px 4px;border-radius:6px}
.pan h3 .x:hover{color:var(--fg);background:rgba(255,255,255,.08)}
.sc{border-radius:var(--r);overflow:hidden;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.sc .bd{overflow-y:auto;overscroll-behavior:contain}
.sc .bd::-webkit-scrollbar{width:7px}
.sc .bd::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:4px}

/* 左侧 */
#left{position:fixed;left:14px;top:14px;bottom:14px;width:216px;display:flex;flex-direction:column;gap:10px;
  overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
#left::-webkit-scrollbar{width:6px}
#left::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:3px}
#left .grp{padding:6px}
#left .pan{flex:none}
.btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;margin:3px 0;border:1px solid transparent;
  border-radius:8px;background:rgba(255,255,255,.035);color:var(--fg);cursor:pointer;font:inherit;font-size:12.5px;text-align:left;
  transition:.13s}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.13)}
.btn.on{background:rgba(121,192,255,.16);border-color:rgba(121,192,255,.42);color:#cfe8ff}
.btn .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.btn.on .dot{background:var(--acc);box-shadow:0 0 7px var(--acc)}
.btn .ms{margin-left:auto;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.btn.on .ms{color:#9fd0f5}

/* 右侧信息卡 */
#right{position:fixed;right:14px;top:14px;width:250px;max-height:calc(100vh - 360px)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 12px;font-variant-numeric:tabular-nums}
.kv .k{color:var(--dim);font-size:11.5px;white-space:nowrap}
.kv .v{font-size:12px;text-align:right}
.kv .v small{color:var(--dim);font-size:10.5px;margin-left:3px}
.sec{padding:7px 12px 3px;font-size:10.5px;color:var(--acc2);letter-spacing:.08em;opacity:.85}
.note{padding:7px 12px 10px;font-size:11px;color:var(--dim);line-height:1.55}

/* 底部中央 */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;display:flex;align-items:center;gap:12px;padding:8px 14px;z-index:20}
#bar .t{font-variant-numeric:tabular-nums;font-size:13px;min-width:168px;text-align:center}
#bar .t b{color:var(--acc);font-weight:600}
#bar .t span{color:var(--dim);font-size:11px}
.ico{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.ico:hover{background:rgba(255,255,255,.11)}
.ico.on{background:rgba(121,192,255,.18);border-color:rgba(121,192,255,.4);color:#cfe8ff}

/* 右下参数 */
#par{position:fixed;right:14px;bottom:14px;width:250px}
.row{padding:6px 12px 8px}
.row label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:5px}
.row label b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.16);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--acc);cursor:pointer;box-shadow:0 0 0 3px rgba(121,192,255,.18)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
.sw{display:flex;flex-wrap:wrap;gap:5px;padding:2px 10px 10px}
.sw .b{padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  cursor:pointer;font-size:11px;color:var(--dim);user-select:none}
.sw .b.on{background:rgba(121,192,255,.17);border-color:rgba(121,192,255,.45);color:#cfe8ff}
.sw .b.warn.on{background:rgba(255,179,92,.17);border-color:rgba(255,179,92,.45);color:#ffd7a8}

/* 浮层 */
.ov{position:fixed;inset:0;background:rgba(3,5,9,.72);backdrop-filter:blur(5px);display:none;
  align-items:center;justify-content:center;z-index:50}
.ov.on{display:flex}
.dlg{width:min(920px,94vw);max-height:88vh;display:flex;flex-direction:column}
.dlg .bd{padding:12px 14px}
.dlg h3{border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:11.8px}
th,td{padding:4px 7px;text-align:right;border-bottom:1px solid rgba(255,255,255,.055)}
th{color:var(--dim);font-weight:500;text-align:right;position:sticky;top:0;background:#0e1119}
td:first-child,th:first-child{text-align:left}
tr.ok td:nth-child(3){color:var(--ok)} tr.no td:nth-child(3){color:var(--bad)}
.pill{padding:1px 6px;border-radius:5px;font-size:10.5px}
.pill.y{background:rgba(105,214,138,.16);color:var(--ok)}
.pill.n{background:rgba(255,123,114,.16);color:var(--bad)}
.fld{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px}
.fld label{color:var(--dim);width:88px;flex:none;font-size:11.5px}
.fld input[type=text],.fld input[type=number]{width:92px;background:rgba(0,0,0,.35);border:1px solid var(--line);
  color:var(--fg);border-radius:6px;padding:4px 7px;font:inherit;font-size:12px;font-variant-numeric:tabular-nums}
.fld input:focus{outline:0;border-color:rgba(121,192,255,.5)}
.fld select{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 7px;font:inherit;font-size:12px}
.fld .btn{width:auto;margin:0;padding:4px 10px}
canvas.mini{background:#070a10;border:1px solid var(--line);border-radius:8px;display:block;width:100%;max-width:360px;height:auto}
.hint{font-size:11px;color:var(--dim);line-height:1.6}
.hint b{color:var(--acc2);font-weight:500}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;background:rgba(121,192,255,.14);color:#bfe0ff;font-size:10.5px;margin-right:4px}
.flex2{display:flex;gap:16px;flex-wrap:wrap}
.flex2>div{flex:1;min-width:250px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99;
  color:var(--dim);font-size:13px;transition:opacity .5s}
.hide{opacity:0;pointer-events:none}
@media (max-width:980px){
  #left,#right{width:180px} #par{width:180px}
  .kv{font-size:11px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="left">
  <div class="pan">
    <h3>真实天体</h3>
    <div class="grp" id="presets"></div>
  </div>
  <div class="pan">
    <h3>轨道实验室</h3>
    <div class="grp" id="plist"></div>
    <div class="note" style="padding-top:0">点击粒子可查看其轨道；「+ 新粒子」打开放置面板。</div>
  </div>
</div>

<div class="pan sc" id="right">
  <h3>实时数据</h3>
  <div class="bd">
    <div class="sec">黑洞</div>
    <div id="infoMain"></div>
    <div class="sec">相机</div>
    <div id="infoCam"></div>
    <div class="sec">观测</div>
    <div id="infoObs"></div>
    <div class="note" id="infoNote"></div>
  </div>
</div>

<div class="pan" id="bar">
  <div class="ico" id="bPlay" title="播放 / 暂停">⏸</div>
  <div class="t" id="tDisp"></div>
  <div class="ico" id="bRot" title="相机自动环绕">⟳</div>
  <div style="width:132px">
    <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:3px">
      <span>时间速度</span><span id="vSpeed">×1</span>
    </div>
    <input type="range" id="sSpeed" min="-2.5" max="2.5" step="0.05" value="0.9">
  </div>
</div>

<div class="pan" id="par">
  <h3>参数</h3>
  <div class="row"><label>自转 a<b id="vSpin">0.90</b></label><input type="range" id="sSpin" min="0" max="0.998" step="0.001" value="0.9"></div>
  <div class="row"><label>盘外缘 r_out<b id="vRout">20 M</b></label><input type="range" id="sRout" min="8" max="40" step="0.5" value="20"></div>
  <div class="row"><label>盘峰值温度 T_max<b id="vTmax">7000 K</b></label><input type="range" id="sTmax" min="3000" max="20000" step="100" value="7000"></div>
  <div class="row"><label>曝光补偿<b id="vExp">0.0 EV</b></label><input type="range" id="sExp" min="-4" max="4" step="0.1" value="0"></div>
  <div class="row" id="s2Row" style="display:none"><label>S2 年份<b id="vS2">2018.4</b></label><input type="range" id="sS2" min="2000" max="2040" step="0.001" value="2018.379"></div>
  <div class="sw" id="switches"></div>
  <div class="sw" id="models"></div>
  <div class="sw" id="views"></div>
</div>

<div class="ov" id="ovExtra"><div class="pan sc dlg"><h3>自由发挥区<span class="x">✕</span></h3><div class="bd" id="extraBody"></div></div></div>
<div class="ov" id="ovOrbit"><div class="pan sc dlg"><h3>轨道实验室<span class="x">✕</span></h3><div class="bd" id="orbitBody"></div></div></div>
<div class="ov" id="ovCheck"><div class="pan sc dlg"><h3>自检面板<span class="x">✕</span></h3><div class="bd" id="checkBody"></div></div></div>
<div class="ov" id="ovAbout"><div class="pan sc dlg"><h3>关于与近似说明<span class="x">✕</span></h3><div class="bd" id="aboutBody"></div></div></div>

<div id="loading">正在编译着色器…</div>

<script>
"use strict";
//=== BH.CORE.BEGIN ===
/* 克尔黑洞与吸积盘实时模型 —— 物理核心
 * 与 WebGL 片元着色器共用同一套公式；GLSL 版本由本文件的常量表生成。
 * 几何单位：G = c = 1，黑洞质量 M = 1（长度单位 M = GM/c²，时间单位 GM/c³）。
 */
(function (root) {
'use strict';

const D2R = Math.PI / 180, R2D = 180 / Math.PI;

/* ---------------- 2.1 常数与换算 ---------------- */
const C = {
  GM_SUN : 1.32712440018e20,     // m^3 s^-2
  CLIGHT : 299792458,            // m s^-1
  PC     : 3.0856775814913673e16,// m
  AU     : 1.495978707e11,       // m
  YEAR   : 31557600,             // s
  UAS    : 4.848136811e-12,      // rad
  RSUN   : 6.957e8,              // m
  RG_KM  : 1.476625,             // km  per solar mass
  TG_US  : 4.925491              // us  per solar mass
};

/* ---------------- 2.2 克尔特征半径 ---------------- */
function kerrRadii(a) {
  a = Math.min(Math.abs(a), 0.998);
  const a2 = a * a;
  const horizon   = 1 + Math.sqrt(Math.max(0, 1 - a2));
  const c1 = Math.cbrt(1 + a), c2 = Math.cbrt(1 - a);
  const c3 = Math.cbrt(Math.max(0, 1 - a2));
  const Z1 = 1 + c3 * (c1 + c2);
  const Z2 = Math.sqrt(3 * a2 + Z1 * Z1);
  const rt = Math.sqrt(Math.max(0, (3 - Z1) * (3 + Z1 + 2 * Z2)));
  return {
    horizon    : horizon,
    photonPro  : 2 * (1 + Math.cos((2 / 3) * Math.acos(-a))),
    photonRetro: 2 * (1 + Math.cos((2 / 3) * Math.acos(a))),
    iscoPro    : 3 + Z2 - rt,
    iscoRetro  : 3 + Z2 + rt
  };
}

/* ---------------- 2.5 黑体色表（线性 sRGB，最大分量归一） ---------------- */
const BB_TABLE = [
  [1000,1.0000,0.0286,0.0000,-9.054],[1500,1.0000,0.1451,0.0000,-5.597],
  [2000,1.0000,0.2663,0.0077,-3.820],[2500,1.0000,0.3803,0.0677,-2.737],
  [3000,1.0000,0.4839,0.1545,-2.007],[3500,1.0000,0.5767,0.2606,-1.481],
  [4000,1.0000,0.6590,0.3789,-1.084],[4500,1.0000,0.7315,0.5035,-0.774],
  [5000,1.0000,0.7954,0.6300,-0.524],[5500,1.0000,0.8516,0.7551,-0.319],
  [6000,1.0000,0.9010,0.8766,-0.147],[6500,1.0000,0.9445,0.9931,0.000],
  [7000,0.9061,0.8905,1.0000,0.127],[8000,0.7656,0.8016,1.0000,0.335],
  [9000,0.6739,0.7399,1.0000,0.500],[10000,0.6102,0.6950,1.0000,0.635],
  [12000,0.5286,0.6344,1.0000,0.844],[15000,0.4616,0.5815,1.0000,1.065],
  [20000,0.4069,0.5358,1.0000,1.308],[30000,0.3627,0.4969,1.0000,1.597],
  [40000,0.3440,0.4798,1.0000,1.776]
];

/* 返回 { r,g,b, logY }：颜色分量在相邻表项间线性插值，logY 线性插值 */
function blackbody(T) {
  const T0 = BB_TABLE[0], T1 = BB_TABLE[BB_TABLE.length - 1];
  let t = T;
  if (!(t > 0)) t = 1e-3;
  if (t <= T0[0]) {
    // 1000 K 以下：颜色取 1000 K，亮度按 logY ≈ 1.32 − 10370/T 外推
    const logY = Math.min(T0[4], 1.32 - 10370 / t);
    return { r: T0[1], g: T0[2], b: T0[3], logY: logY };
  }
  if (t >= T1[0]) {
    return { r: T1[1], g: T1[2], b: T1[3], logY: T1[4] };
  }
  let i = 0;
  while (i < BB_TABLE.length - 2 && BB_TABLE[i + 1][0] < t) i++;
  const A = BB_TABLE[i], B = BB_TABLE[i + 1];
  const f = (t - A[0]) / (B[0] - A[0]);
  return {
    r: A[1] + (B[1] - A[1]) * f,
    g: A[2] + (B[2] - A[2]) * f,
    b: A[3] + (B[3] - A[3]) * f,
    logY: A[4] + (B[4] - A[4]) * f
  };
}

/* ---------------- 2.6 吸积盘温度剖面 ---------------- */
const _ntCache = new Map();
function ntRoots(a) {
  const key = a.toFixed(6);
  let v = _ntCache.get(key);
  if (v) return v;
  const ac = Math.acos(Math.max(-1, Math.min(1, a)));
  v = {
    x1: 2 * Math.cos(ac / 3 - Math.PI / 3),
    x2: 2 * Math.cos(ac / 3 + Math.PI / 3),
    x3: -2 * Math.cos(ac / 3)
  };
  _ntCache.set(key, v);
  return v;
}

/* Novikov–Thorne / Page–Thorne 辐射通量形状函数（未归一） */
function ntFlux(r, a, roots) {
  const x = Math.sqrt(r);
  const rin = kerrRadii(a).iscoPro;
  const x0 = Math.sqrt(rin);
  if (!(x > x0)) return 0;
  const R = roots || ntRoots(a);
  const { x1, x2, x3 } = R;
  let br = x - x0 - 1.5 * a * Math.log(x / x0);
  const terms = [
    [x1, x2, x3],
    [x2, x1, x3],
    [x3, x1, x2]
  ];
  for (const [xi, xj, xk] of terms) {
    if (Math.abs(xi) < 1e-9) continue;               // a = 0 时 x2 = 0，跳过该 0/0 项
    const coef = 3 * (xi - a) * (xi - a) / (xi * (xi - xj) * (xi - xk));
    const arg = (x - xi) / (x0 - xi);
    if (!(arg > 0)) return 0;
    br -= coef * Math.log(arg);
  }
  const poly = x * x * x - 3 * x + 2 * a;
  const den = Math.pow(x, 4) * poly;
  if (den === 0) return 0;
  return br / den;
}

const _fmaxCache = new Map();
function ntFmax(a) {
  const key = a.toFixed(6);
  let v = _fmaxCache.get(key);
  if (v !== undefined) return v;
  const rin = kerrRadii(a).iscoPro;
  let best = 0;
  const N = 4000;
  for (let i = 0; i <= N; i++) {
    const r = rin * Math.pow(400 / rin, i / N);   // 对数扫描 r_isco → 400
    const f = ntFlux(r, a);
    if (f > best) best = f;
  }
  v = best;
  _fmaxCache.set(key, v);
  return v;
}

function ntPeakRadius(a) {
  const rin = kerrRadii(a).iscoPro;
  let best = rin, bf = -1;
  const N = 6000;
  for (let i = 0; i <= N; i++) {
    const r = rin * Math.pow(60 / rin, i / N);
    const f = ntFlux(r, a);
    if (f > bf) { bf = f; best = r; }
  }
  return best;
}

/* 盘温度。model: 'NT' 相对论剖面 / 'SS' 简化剖面 */
function diskTemp(r, a, Tmax, model) {
  const rin = kerrRadii(a).iscoPro;
  if (!(r > rin)) return 0;
  if (model === 'SS') {
    const x = r / rin;
    if (!(x > 1)) return 0;
    const v = Math.pow(x, -0.75) * Math.pow(Math.max(0, 1 - 1 / Math.sqrt(x)), 0.25) / 0.48787;
    return Tmax * v;
  }
  const F = ntFlux(r, a);
  if (!(F > 0)) return 0;
  return Tmax * Math.pow(F / ntFmax(a), 0.25);
}

/* 赤道面顺行圆轨道量（2.2 节） */
function circular(r, a) {
  const r15 = Math.pow(r, 1.5);
  const den = Math.sqrt(Math.max(1e-12, 1 - 3 / r + 2 * a / r15));
  return {
    omega: 1 / (r15 + a),
    ut   : (1 + a / r15) / den,
    E    : (1 - 2 / r + a / r15) / den,
    L    : Math.sqrt(r) * (1 - 2 * a / r15 + a * a / (r * r)) / den,
    clock: den / (1 + a / r15)          // dτ/dt
  };
}

/* ---------------- 向量工具 ---------------- */
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function vlen(a) { return Math.sqrt(dot(a, a)); }
function vscale(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function vadd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function vsub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }

/* ================= 3.2 史瓦西光线 ================= */
function traceSchwarz(ray, S) {
  const res = { fate: 'budget', rHit: 0, phiHit: 0, g: 1, nCross: 0, out: [0, 0, 0], xi: 0, steps: 0 };
  let x = ray.pos.slice();
  const Rc = vlen(x);
  const rh = 2.0;
  const dir = ray.dir;
  let v, xi = 0, vInf = 1;

  if (!S.lensing) {
    v = dir.slice();
    xi = -(x[0] * v[1] - x[1] * v[0]);
  } else {
    const rhat = vscale(x, 1 / Rc);
    const s = Math.sqrt(Math.max(1e-12, 1 - 2 / Rc));
    const cd = dot(dir, rhat);
    v = [dir[0] + (s - 1) * cd * rhat[0],
         dir[1] + (s - 1) * cd * rhat[1],
         dir[2] + (s - 1) * cd * rhat[2]];
    const cx = cross(x, v);
    const h2 = dot(cx, cx);

    0.5 * Phi * Phi * gfx + f * Phi * glx,
    0.5 * Phi * Phi * gfy + f * Phi * gly,
    0.5 * Phi * Phi * gfz + f * Phi * glz

      else if (att === 1) { out[i].out = [buf[i*4], buf[i*4+1], buf[i*4+2]]; out[i].steps = buf[i*4+3]; }
      else { out[i].fate = buf[i*4]; out[i].xi = buf[i*4+1]; }    }

  const w = [p[0]-S.camPos[0], p[1]-S.camPos[1], p[2]-S.camPos[2]];
  const fw = w[0]*S.camF[0] + w[1]*S.camF[1] + w[2]*S.camF[2];
  if (fw <= 1e-4) return null;
  const tx = (w[0]*S.camRight[0] + w[1]*S.camRight[1] + w[2]*S.camRight[2]) / fw;
  const ty = (w[0]*S.camU[0] + w[1]*S.camU[1] + w[2]*S.camU[2]) / fw;
  return [tx, ty];
}

  S.camR = Math.min(1e5, Math.max(3, S.camR * Math.exp(e.deltaY * 0.0012)));
  syncUI();
}, { passive: false });
let pinch = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    pinch = { d: d, r: S.camR };
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch) {
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    S.camR = Math.min(1e5, Math.max(3, pinch.r * pinch.d / Math.max(d, 1)));
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { pinch = null; }, { passive: true });

/* ---------------- 时间显示 ---------------- */
function updateTimeDisp() {
  const u = C.units(S.preset);
  let phys = '';
  if (u) {
    const t = S.time * u.tg_s;
    if (t < 3600) phys = t.toFixed(1) + ' s';
    else if (t < 86400) phys = (t / 60).toFixed(1) + ' min';
    else if (t < 3.15e7) phys = (t / 86400).toFixed(2) + ' d';
    else phys = (t / 3.15576e7).toFixed(3) + ' yr';
  }
  $('tDisp').innerHTML = '<b>' + S.time.toFixed(1) + '</b> M <span>| ' + phys + '</span>';
}

/* ---------------- 主循环 ---------------- */
const ROT_RATE = 0.5;          // 自动环绕角速度（度/秒），要慢，才敢做时间累积
let lastT = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
let frameCount = 0, lastAdjust = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.4) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }

  if (!S.paused) S.time += dt * S.timeSpeed;
  if (S.autoRotate && !drag) S.camAz += dt * ROT_RATE;
  updateDive(dt);

  // 分辨率自适应（EHT 模式下不调整）
  if (now - lastAdjust > 700 && !S.eht) {
    lastAdjust = now;
    if (fps < 50 && Engine.getRenderScale() > 0.5) { Engine.setRenderScale(Math.max(0.5, Engine.getRenderScale() - 0.12)); Engine.resize(); }
    else if (fps > 58 && Engine.getRenderScale() < 1.0) { Engine.setRenderScale(Math.min(1.0, Engine.getRenderScale() + 0.06)); Engine.resize(); }
  }

  Engine.updateCamera();
  /* 时间累积抗锯齿（7.15）：跨帧累积会把上一帧的像素留在缓冲里，
     所以只有在"这一帧和上一帧几乎一模一样"时才累积，否则会出现拖影。
     这里按相机自动环绕的速度 + 当前帧时长估算拖影像素数，超过 ~1.5 px 就退回单帧。 */
  const diagView = S.view !== 'physical';
  const camMoving = drag || S.autoRotate;
  const timeMoving = (!S.paused && S.timeSpeed !== 0);
  let maxAcc = diagView ? 1 : (camMoving ? (S.autoRotate ? 4 : 1) : (timeMoving ? 4 : 16));
  if (maxAcc > 1 && S.autoRotate && !drag) {
    const sz = Engine.getSize();
    const pxPerDeg = sz[1] / Math.max(1, S.fovY);
    const smearPx = ROT_RATE * dt * (maxAcc - 1) * pxPerDeg;
    if (smearPx > 1.5) maxAcc = 1;
  }
  Engine.setJitter(maxAcc > 1);
  let an = Engine.getAccumN();
  if (an >= maxAcc) an = 0;
  an += 1;
  Engine.setAccumN(an);


  Engine.renderScene();

  Engine.renderBloom();
  Engine.composite();
  drawOverlay();
  Engine.pollGlError();

  if (++frameCount % 12 === 0) {
    updateInfo(); updateTimeDisp();
    if (S.dive) { const d = $('diveInfo'); if (d) d.innerHTML = diveInfoHTML(); }
    if (selParticle >= 0 && $('ovOrbit').classList.contains('on')) updateOrbitStats();
  }
}

/* ---------------- 叠加层绘制 ---------------- */
function drawOverlay() {
  if (S.view !== 'physical') return;
  const gl = Engine.gl;
  if (!S.showOverlay) return;
  // 轨道实验室：粒子轨迹
  for (const p of particles) {
    if (!p.path || !p.path.length) continue;
    const sel = (particles.indexOf(p) === selParticle);
    Engine.drawPolyline(p.path, [p.color[0], p.color[1], p.color[2], sel ? 0.95 : 0.5], sel ? 2 : 1);
    const last = p.path[p.path.length - 1];
    Engine.drawPoint(last, [p.color[0], p.color[1], p.color[2], 1], sel ? 6 : 4);
  }
  // S2 轨道
  if (S.preset === 'sgra' && S.camR > 3000) {
    const pts = [];
    const els = C.S2_ELEMENTS;
    for (let i = 0; i <= 240; i++) {
      const yr = els.tP + els.P * i / 240;
      pts.push(s2World(yr).pos);
    }
    Engine.drawPolyline(pts, [0.55, 0.85, 1.0, 0.75], 1);
    Engine.drawPoint(s2World(S.s2Year).pos, [1.0, 0.85, 0.4, 1], 6);
  }
  gl.flush();
}

function openOrbitPanel() {
  $('orbitBody').innerHTML = orbitPanelHTML();
  const p = selParticle >= 0 ? particles[selParticle] : null;
  $('pAdd').onclick = () => {
    const o = {
      type: $('pType').value, spin: +$('pSpin').value || 0,
      r: +$('pR').value || 10, pro: $('pPro').value === '1',
      p: +$('pP').value || 10, e: +$('pE').value || 0,
      E: +$('pE2').value || 0.95, L: +$('pL').value || 0,
      r0: +$('pR0').value || 10, theta0: +$('pTh').value || 90,
      pTheta: +$('pPth').value || 0, prSign: +$('pSign').value
    };
    o.name = 'P' + (particles.length + 1);
    o.color = [[0.5,0.82,1],[1,0.72,0.45],[0.7,1,0.6],[1,0.6,0.8],[0.9,0.9,0.55]][particles.length % 5];
    const np = addParticle(o);
    selParticle = particles.indexOf(np);
    computeParticle(np);
    buildParticleList(); openOrbitPanel();
  };
  $('pNewton').onclick = () => {
    if (!p) return;
    const np = newtonPath(p);
    if (np.length) { p.newton = np; }
    drawPot();
  };
  $('pDel').onclick = () => {
    if (p) { particles.splice(selParticle, 1); selParticle = Math.min(selParticle, particles.length - 1); }
    buildParticleList(); openOrbitPanel();
  };
  drawPot();
}

function drawPot() {
  const cv = $('pPot');
  if (!cv) return;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  const p = selParticle >= 0 ? particles[selParticle] : null;
  if (!p || !p.lastOpts) {
    g.fillStyle = '#8c97ab'; g.font = '12px sans-serif';
    g.fillText('放置一个粒子以查看有效势', 16, 30);
    return;
  }
  const o = p.lastOpts;
  const L2 = o.L * o.L;
  const rMin = 2.2, rMax = 60;
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const x = 40 + (cv.width - 56) * i / 5;
    g.beginPath(); g.moveTo(x, 12); g.lineTo(x, cv.height - 24); g.stroke();
  }
  g.fillStyle = '#8c97ab'; g.font = '10px sans-serif';
  g.fillText('r (M)', cv.width - 60, cv.height - 8);
  // V²(r) = (1-2/r)(1 + L²/r²)
  const f = r => (1 - 2/r) * (1 + L2 / (r*r));
  let vmax = 0;
  for (let i = 0; i <= 200; i++) { const r = rMin + (rMax - rMin) * i / 200; vmax = Math.max(vmax, f(r)); }
  vmax = Math.max(vmax, o.E * o.E * 1.2);
  const px = r => 40 + (cv.width - 56) * (Math.log(r / rMin) / Math.log(rMax / rMin));
  const py = v => cv.height - 24 - (cv.height - 40) * (v / vmax);
  g.strokeStyle = '#79c0ff'; g.lineWidth = 1.6; g.beginPath();
  for (let i = 0; i <= 200; i++) {
    const r = rMin + (rMax - rMin) * i / 200;
    const X = px(r), Y = py(f(r));
    i ? g.lineTo(X, Y) : g.moveTo(X, Y);
  }
  g.stroke();
  g.strokeStyle = '#ffb35c'; g.setLineDash([4, 3]); g.beginPath();
  g.moveTo(px(rMin), py(o.E * o.E)); g.lineTo(px(rMax), py(o.E * o.E)); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#ffb35c'; g.fillText('E² = ' + (o.E * o.E).toFixed(4), px(rMin) + 6, py(o.E * o.E) - 6);
  // 当前粒子位置
  if (p.stats) {
    g.fillStyle = '#69d68a';
    g.beginPath(); g.arc(px(Math.max(rMin, p.stats.rMin)), py(f(Math.max(rMin, p.stats.rMin))), 3, 0, 7); g.fill();
  }
  g.fillStyle = '#8c97ab';
  g.fillText('V²(r) = (1−2/r)(1+L²/r²)', 44, 24);
}

/* 1) 跳进视界：径向自由落体 */
function toggleDive() {
  S.dive = !S.dive;
  if (S.dive) {
    S.diveR0 = 60; S.diveR = 60; S.diveV = 0; S.diveTau = 0; S.diveHorizonTau = 0; S.divePassed = false;
    S.camR = 60; S.camIncl = 90; S.camAz = 0; S.autoRotate = false; S.paused = false;
  }

}
/* 史瓦西径向自由落体（从 r₀ 静止释放）：
   dr/dτ = −√(2M(1/r − 1/r₀))。直接对这个式子做显式积分会在起点卡住
   （初始 dr/dτ = 0），所以改积分二阶方程 r'' = −M/r²（等价，且能真正起步）。 */
function updateDive(dt) {
  if (!S.dive) return;
  const dtau = Math.abs(dt * S.timeSpeed);
  let r = S.diveR, v = S.diveV;
  const n = Math.max(1, Math.min(400, Math.ceil(dtau / 0.05)));
  const h = dtau / n;
  const acc = rr => -1 / (rr * rr);
  for (let i = 0; i < n; i++) {
    const k1r = v,                 k1v = acc(r);
    const k2r = v + 0.5 * h * k1v,  k2v = acc(r + 0.5 * h * k1r);
    const k3r = v + 0.5 * h * k2v,  k3v = acc(r + 0.5 * h * k2r);
    const k4r = v + h * k3v,        k4v = acc(r + h * k3r);
    r = Math.max(0.05, r + h / 6 * (k1r + 2 * k2r + 2 * k3r + k4r));
    v = v + h / 6 * (k1v + 2 * k2v + 2 * k3v + k4v);
  }
  S.diveR = r; S.diveV = v;
  S.diveTau += dtau;
  if (!S.divePassed && r <= 2.0) { S.divePassed = true; S.diveHorizonTau = S.diveTau; }
  S.camR = r; S.camIncl = 90; S.camAz = 0;
}
function diveInfoHTML() {
  const u = C.units(S.preset);
  const tg = u ? u.tg_s : 1;                 // t_g（秒）；1 M 的固有时 = t_g 秒
  const r = S.diveR;
  const tidal = 2 / (r * r * r);
  const tidalPhys = u ? 2 * 6.674e-11 * u.massSun / Math.pow(r * u.rg_km * 1000, 2) : 0;
  /* 单位统一用 M（= GM/c³）：视界到奇点的固有时上限是 π·t_g，即 π M；
     π·tg 秒只是它换算成物理秒后的写法。 */
  const afterH = S.divePassed ? (S.diveTau - S.diveHorizonTau) : 0;
  const remain = Math.PI - afterH;          // 剩余固有时（单位 M）
  let h = '';
  h += '<div class="kv"><span class="k">当前半径 r</span><span class="v">' + r.toFixed(3) + ' M</span></div>';
  h += '<div class="kv"><span class="k">已过固有时 τ</span><span class="v">' + S.diveTau.toFixed(2) + ' M = ' + (S.diveTau * tg).toFixed(1) + ' s</span></div>';
  h += '<div class="kv"><span class="k">越过视界后 τ</span><span class="v">' + afterH.toFixed(2) + ' M = ' + (afterH * tg).toFixed(1) + ' s</span></div>';
  h += '<div class="kv"><span class="k">到奇点剩余 τ（至多）</span><span class="v">' + (S.divePassed ? remain.toFixed(2) + ' M = ' + (remain * tg).toFixed(1) + ' s' : '尚未越过视界') + '</span></div>';
  h += '<div class="kv"><span class="k">π·t_g 上界</span><span class="v">π M = ' + (Math.PI * tg).toFixed(1) + ' s</span></div>';
  h += '<div class="kv"><span class="k">潮汐加速度 2M/r³</span><span class="v">' + tidal.toExponential(2) + ' /M</span></div>';
  h += '<div class="kv"><span class="k">　　物理值</span><span class="v">' + tidalPhys.toExponential(2) + ' m/s²</span></div>';
  return h;
}
/* 2) 微引力透镜放大率 A(u) = (u²+2)/(u√(u²+4)) */
function microLensA(u) { return (u * u + 2) / (u * Math.sqrt(u * u + 4)); }
function drawMicroLens() {
  const cv = $('mlCanvas'); if (!cv) return;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  const W = cv.width, H = cv.height;
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const y = 12 + (H - 34) * i / 4; g.beginPath(); g.moveTo(34, y); g.lineTo(W - 10, y); g.stroke(); }
  g.strokeStyle = '#79c0ff'; g.lineWidth = 1.8; g.beginPath();
  for (let i = 0; i <= 240; i++) {
    const u = 0.05 + 5.95 * i / 240;
    const A = microLensA(u);
    const X = 34 + (W - 46) * i / 240;
    const Y = H - 22 - (H - 44) * (A - 1) / 3;
    i ? g.lineTo(X, Y) : g.moveTo(X, Y);
  }
  g.stroke();
  g.fillStyle = '#8c97ab'; g.font = '11px sans-serif';
  g.fillText('A(u) = (u²+2)/(u√(u²+4))，u = θ_S/θ_E', 40, 14);
  g.fillText('u →', W - 24, H - 8);
  g.fillStyle = '#ffb35c';
  const x1 = 34 + (W - 46) * (1 - 0.05) / 5.95;
  g.fillText('u=1 → A=2', x1 - 6, H - 22 - (H - 44) / 3 - 5);
}
/* 3) 引力波啁啾 */
function chirpFreq(tau, McSolar) {
  const tGM = 4.925491e-6 * McSolar;
  return (1 / Math.PI) * Math.pow(5 / (256 * tau), 0.375) * Math.pow(tGM, -0.625);
}
/* 由 f 反解 τ：
   f = (1/π)(5/(256τ))^(3/8)·(G M_c/c³)^(-5/8)
   ⇒ (π·f·(G M_c/c³)^(5/8))^(8/3) = 5/(256τ)
   ⇒ τ = 5 / ( 256·(π·f·(G M_c/c³)^(5/8))^(8/3) ) */
function chirpTauAt(f, McSolar) {
  const tGM = 4.925491e-6 * McSolar;
  return 5 / (256 * Math.pow(Math.PI * f * Math.pow(tGM, 0.625), 8 / 3));
}
function drawGW() {
  const cv = $('gwCanvas'); if (!cv) return;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, cv.height ? cv.width : 0, cv.height);
  const W = cv.width, H = cv.height;
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const y = 12 + (H - 40) * i / 4; g.beginPath(); g.moveTo(34, y); g.lineTo(W - 10, y); g.stroke(); }
  [[28.6, '#79c0ff'], [31.2, '#ffb35c']].forEach(([Mc, col], k) => {
    g.strokeStyle = col; g.lineWidth = 1.8; g.beginPath();
    for (let i = 0; i <= 200; i++) {
      const tau = 0.02 + 0.48 * i / 200;
      const f = chirpFreq(tau, Mc);
      const X = 34 + (W - 46) * i / 200;
      const Y = H - 22 - (H - 46) * Math.min(1, Math.max(0, Math.log(f / 10) / Math.log(300 / 10)));
      i ? g.lineTo(X, Y) : g.moveTo(X, Y);
    }
    g.stroke();
    g.fillStyle = col; g.fillText(k === 0 ? '源参考系 M_c=28.6 M☉' : '红移后 (1+z)M_c=31.2 M☉', 40, 14 + k * 13);
  });
  g.fillStyle = '#8c97ab'; g.font = '11px sans-serif';
  g.fillText('f(τ) = (1/π)(5/256τ)^{3/8}(GM_c/c³)^{-5/8}', 40, 42);
}
let gwAudio = null;
function playChirp() {
  try {
    if (gwAudio) { gwAudio.stop(); gwAudio = null; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    osc.connect(gain); gain.connect(ctx.destination);
    const t0 = ctx.currentTime, N = 600, dur = 0.7;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const tau = 0.30 * (1 - t) + 0.002;
      osc.frequency.setValueAtTime(Math.max(20, Math.min(1200, chirpFreq(tau, 28.6))), t0 + t * dur);
    }
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
    gwAudio = { stop: () => { try { osc.stop(); ctx.close(); } catch (e) {} } };
  } catch (e) { console.warn('音频不可用', e); }
}
function extraPanelHTML() {
  const u = C.units(S.preset);
  const ring = u && u.shadow_uas !== null ? u.shadow_uas : null;
  let h = '<div class="flex2">';
  h += '<div><div class="sec" style="padding-left:0">① EHT 模式（事件视界望远镜）</div>';
  h += '<div class="hint">把画面按望远镜的角分辨率模糊，模拟 EHT 观测量。</div>';
  h += '<div class="kv"><span class="k">EHT 角分辨率</span><span class="v">~20 μas</span></div>';
  h += '<div class="kv"><span class="k">本模型阴影角直径 (a=0)</span><span class="v">' + (ring ? ring.toFixed(1) + ' μas' : '—') + '</span></div>';
  if (S.preset === 'sgra') h += '<div class="kv"><span class="k">EHT 实测亮环直径</span><span class="v">51.8 ± 2.3 μas</span></div>';
  if (S.preset === 'm87') h += '<div class="kv"><span class="k">EHT 实测亮环直径</span><span class="v">42 ± 3 μas</span></div>';
  h += '<div class="hint" style="margin-top:6px">「亮环」与「几何阴影」不是同一个观测量：EHT 看到的是毫米波发射区形成的亮环，本模型给出的是几何阴影直径。两者接近值得注意，但不等同。</div>';
  h += '<div style="margin-top:6px"><button class="btn" id="xEHT" style="width:auto;display:inline-block;padding:5px 12px">' + (S.eht ? '关闭 EHT 模糊' : '开启 EHT 模糊') + '</button></div></div>';
  h += '<div><div class="sec">② 跳进视界</div><div id="diveInfo">' + diveInfoHTML() + '</div>';
  h += '<div style="margin-top:6px"><button class="btn" id="xDive" style="width:auto;display:inline-block;padding:5px 12px">' + (S.dive ? '停止下落' : '开始下落') + '</button></div>';
  h += '<div class="hint" style="margin-top:6px">从 r=60 M 静止释放（史瓦西径向自由落体方程 dr/dτ = −√(2(1/r − 1/r₀))，视界取 r=2 M；自转只影响画面，不改变这条落体曲线）。视界到奇点的固有时上限是 π·t_g，任何轨道都超不过它；坐标时在此发散。</div></div>';
  h += '<div><div class="sec">③ 微引力透镜</div><canvas class="mini" id="mlCanvas" width="360" height="180"></canvas>';
  h += '<div class="kv"><span class="k">峰值放大率</span><span class="v">2.00 @ u=1</span></div>';
  h += '<div class="hint">A(u) = (u²+2)/(u√(u²+4))，u 为背景源到透镜的角距离除以爱因斯坦角（点质量薄透镜近似）。</div></div>';
  h += '<div><div class="sec">④ 引力波啁啾（GW150914）</div><canvas class="mini" id="gwCanvas" width="360" height="180"></canvas>';
  h += '<div class="kv"><span class="k">τ=0.1 s, M_c=28.6 M☉</span><span class="v">' + chirpFreq(0.1, 28.6).toFixed(1) + ' Hz</span></div>';
  h += '<div class="kv"><span class="k">τ=0.1 s, (1+z)M_c=31.2</span><span class="v">' + chirpFreq(0.1, 31.2).toFixed(1) + ' Hz</span></div>';
  h += '<div class="kv"><span class="k">f=35 Hz 对应 τ（源系）</span><span class="v">' + chirpTauAt(35, 28.6).toFixed(3) + ' s</span></div>';
  h += '<div class="kv"><span class="k">f=35 Hz 对应 τ（红移后）</span><span class="v">' + chirpTauAt(35, 31.2).toFixed(3) + ' s</span></div>';
  h += '<div style="margin-top:6px"><button class="btn" id="xGW" style="width:auto;display:inline-block;padding:5px 12px">播放啁啾声</button></div>';
  h += '<div class="hint" style="margin-top:6px">最低阶旋近公式，不能一直用到并合；实测信号在约 0.2 秒内从 35 Hz 升到约 150 Hz 峰值，随后在约 250 Hz 处铃宕。</div></div>';
  h += '</div>';
  return h;
}
function openExtra() {
  $('extraBody').innerHTML = extraPanelHTML();
  drawMicroLens(); drawGW();
  $('xEHT').onclick = () => { S.eht = !S.eht; Engine.setRenderScale(S.eht ? 0.085 : 1.0); Engine.resize(); syncUI(); openExtra(); };
  $('xDive').onclick = () => { toggleDive(); openExtra(); };
  $('xGW').onclick = () => playChirp();
}

/* ---------------- 验收接口 ---------------- */
window.BH = {
  version: '1.0.0',
  get info() {
    return {
      traceBackend: 'gpu',
      diskModel: S.model === 'SS' ? 'SS' : 'NT',
      particlesLensed: false
    };
  },
  set(obj) {
    if (!obj) return this.get();
    const map = {
      spin: 'spin', camR: 'camR', camIncl: 'camIncl', camAz: 'camAz', fovY: 'fovY',
      disk: 'disk', rOut: 'rOut', doppler: 'doppler', lensing: 'lensing',
      preset: 'preset', paused: 'paused', time: 'time', autoRotate: 'autoRotate'
    };
    for (const k in obj) {
      if (k === 'view') { S.view = obj.view; continue; }
      if (k in map) S[map[k]] = obj[k];
    }
    if (obj.preset && C.PRESETS[obj.preset]) applyPreset(obj.preset);
    syncUI();
    Engine.updateCamera();
    return this.get();
  },
  get() {
    return {
      spin: S.spin, camR: S.camR, camIncl: S.camIncl, camAz: S.camAz, fovY: S.fovY,
      disk: S.disk, rOut: S.rOut, doppler: S.doppler, lensing: S.lensing,
      preset: S.preset, paused: S.paused, time: S.time, autoRotate: S.autoRotate,
      view: S.view
    };
  },
  trace(rays) {
    const list = (rays || []).map(r => [r[0], r[1]]);
    return Engine.gpuTrace(list);
  },
  radii(spin) {
    const a = Math.min(Math.abs(spin === undefined ? S.spin : spin), 0.998);
    return C.kerrRadii(a);
  },
  disk(r) {
    const a = S.spin;
    const c = C.circular(r, a);
    const T = C.diskTemp(r, a, S.tmax, S.model);
    return { omega: c.omega, ut: c.ut, T: T, Tmax: S.tmax };
  },
  orbit(opts) {
    opts = opts || {};
    const o = {
      spin: opts.spin === undefined ? S.spin : opts.spin,
      E: opts.E, L: opts.L, r0: opts.r0,
      theta0: opts.theta0 === undefined ? 90 : opts.theta0,
      pTheta: opts.pTheta || 0,
      prSign: opts.prSign === undefined ? 1 : opts.prSign,
      stepEta: 0.0015, maxSteps: 2000000
    };
    const res = C.integrateOrbit(o);
    return {
      ok: res.ok, plunge: res.plunge, tauPlunge: res.tauPlunge,
      rMin: res.rMin, rMax: res.rMax, dphiDeg: res.dphiDeg,
      tCoord: res.tCoord, tau: res.tau, nodalDeg: res.nodalDeg
    };
  },
  units(key) { return C.units(key); },
  s2(year) {
    const p = C.s2Kepler(year === undefined ? S.s2Year : year);
    return { east_mas: p.east_mas, north_mas: p.north_mas, los_mas: p.los_mas, r_AU: s2DistAU(year === undefined ? S.s2Year : year) };
  },
  stats() {
    const [rw, rh, ow, oh] = Engine.getSize();
    return {
      fps: Math.round(fps), cssW: canvas.clientWidth, cssH: canvas.clientHeight,
      renderW: rw, renderH: rh, stepsAvg: stepsAvg, stepsMax: stepsMax,
      glError: Engine.getLastGlError ? Engine.getLastGlError() : (Engine.gl ? Engine.gl.getError() : -1),
      glErrorCount: Engine.getGlErrorCount ? Engine.getGlErrorCount() : 0
    };
  },
  selfCheck() {
    runSelfCheck();
    return (lastSelfCheck || []).map(([name, expected, measured, tol, unit]) => ({
      name: name, expected: expected, measured: measured,
      pass: Math.abs(measured - expected) <= tol * Math.max(Math.abs(expected), 1e-9),
      unit: unit || '', tol: tol
    }));
  }
};

/* ---------------- 启动 ---------------- */
function boot() {
  const cv = $('c');
  if (!Engine.init(cv)) {
    $('loading').textContent = '此浏览器不支持 WebGL2';
    return;
  }
  Engine.initTraceFBO(64);
  Engine.resize();
  buildPresets();
  buildSwitches();
  buildParticleList();
  Object.assign(S, DEFAULTS);
  applyPreset(S.preset);
  syncUI();
  $('aboutBody').innerHTML = aboutHTML();
  $('loading').classList.add('hide');
  setTimeout(() => { $('loading').style.display = 'none'; }, 600);

  // 默认放两个粒子做示例
  const p1 = addParticle({ name: '顺行圆轨道', type: 'circle', r: 10, pro: true, spin: 0, color: [0.5, 0.82, 1] });
  computeParticle(p1);
  const p2 = addParticle({ name: '偏心轨道 p=12', type: 'kepler', p: 12, e: 0.5, spin: 0, color: [1, 0.72, 0.45] });
  computeParticle(p2);
  buildParticleList();

  window.addEventListener('resize', () => Engine.resize());
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { S.paused = !S.paused; syncUI(); e.preventDefault(); }
    else if (e.key === 'r' || e.key === 'R') { Object.assign(S, DEFAULTS); applyPreset(S.preset); syncUI(); }
    else if (e.key === 'g' || e.key === 'G') openOv('ovCheck');
    else if (e.key === 'a' || e.key === 'A') openOv('ovAbout');
    else if (e.key >= '1' && e.key <= '5') {
      S.view = ['physical','grid','checker','gmap','steps'][+e.key - 1]; syncUI();
    }
  });
  requestAnimationFrame(loop);
}

/* 步骤统计（供 stats 用） */
let stepsAvg = 0, stepsMax = 0;
(function patchStats() {
  const orig = Engine.gpuTrace;
  Engine.gpuTrace = function (rays) {
    const r = orig(rays);
    let s = 0, mx = 0;
    r.forEach(o => { s += o.steps; mx = Math.max(mx, o.steps); });
    stepsAvg = r.length ? Math.round(s / r.length) : 0;
    stepsMax = mx;
    return r;
  };
})();

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => {
  try { boot(); } catch (e) {
    const l = $('loading'); l.style.display = 'flex'; l.classList.remove('hide');
    l.innerHTML = '<div style="max-width:640px;text-align:center;color:#ff7b72">初始化失败：' + (e && e.message ? e.message : e) + '</div>';
    console.error(e);
  }
});
else { try { boot(); } catch (e) { const l = $('loading'); l.classList.remove('hide'); l.textContent = '初始化失败：' + e.message; console.error(e); } }
})();
