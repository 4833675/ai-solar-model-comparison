<script>
(function () {
'use strict';
/* ---- physics.js ---- */
/* ===================================================================
 *  physics.js — 纯 CPU 物理库（双精度）：常数、克尔特征半径、薄盘、
 *  有质量粒子积分器、S2 恒星、真实天体单位换算。
 *  几何单位 G = c = 1, 黑洞质量 M = 1。
 * =================================================================== */
const Phys = (() => {
'use strict';
const PI = Math.PI, TAU = 2 * Math.PI;
const rad = d => d * PI / 180, deg = r => r * 180 / PI;

/* ---------- 2.1 常数 ---------- */
const K = {
  GMsun: 1.32712440018e20, c: 299792458, pc: 3.0856775814913673e16,
  AU: 1.495978707e11, yr: 31557600, uas: 4.848136811e-12, Rsun: 6.957e8
};
K.rg1 = K.GMsun / (K.c * K.c);          // 每个太阳质量的引力半径 (m)  = 1476.625 m
K.tg1 = K.GMsun / (K.c * K.c * K.c);    // 每个太阳质量的引力时间 (s)  = 4.925491 μs

/* ---------- 2.3 预设 ---------- */
const PRESETS = {
  sgra:      { key: 'sgra', name: '银河系中心 Sgr A*', short: 'Sgr A*', mass: 4.297e6, distPc: 8277, angDistPc: 8277,
               note: 'GRAVITY 2022 质量；EHT 2022 亮环直径 51.8 ± 2.3 μas', ehtUas: 51.8, ehtErr: 2.3 },
  m87:       { key: 'm87', name: 'M87*', short: 'M87*', mass: 6.5e9, distPc: 16.8e6, angDistPc: 16.8e6,
               note: 'EHT 2019；亮环直径 42 ± 3 μas；喷流与视线夹角约 17°', ehtUas: 42, ehtErr: 3 },
  cygx1:     { key: 'cygx1', name: '天鹅座 X-1', short: 'Cyg X-1', mass: 21.2, distPc: 2220, angDistPc: 2220,
               note: '恒星级黑洞，高自转（Miller-Jones 等 2021）' },
  gw150914:  { key: 'gw150914', name: 'GW150914 并合产物', short: 'GW150914', mass: 63.1, distPc: 440e6, angDistPc: 370e6,
               note: '自转 0.69；并合前 35.6 + 30.6 M☉；光度距离 440 Mpc，角直径距离 ≈ 370 Mpc（z ≈ 0.09）' },
  ton618:    { key: 'ton618', name: 'TON 618', short: 'TON 618', mass: 6.6e10, distPc: null, angDistPc: null,
               note: '已知最大的黑洞之一；质量为单次谱线估计' },
  gargantua: { key: 'gargantua', name: '卡冈图雅（虚构）', short: 'Gargantua', mass: 1e8, distPc: null, angDistPc: null,
               note: '《星际穿越》中的虚构黑洞；电影成像用的自转是 0.6' }
};
const PRESET_KEYS = ['sgra', 'm87', 'cygx1', 'gw150914', 'ton618', 'gargantua'];

const rg_m = M => K.rg1 * M;       // 米
const tg_s = M => K.tg1 * M;       // 秒

function units(key) {
  const p = PRESETS[key]; if (!p) return null;
  const M = p.mass, rg_km = rg_m(M) / 1000;
  const out = {
    massSun: M, rg_km, rs_km: 2 * rg_km, rs_AU: 2 * rg_km * 1000 / K.AU,
    tg_s: tg_s(M), shadow_uas: null, iscoPeriod_s: TAU * Math.pow(6, 1.5) * tg_s(M)
  };
  if (p.angDistPc) out.shadow_uas = 2 * Math.sqrt(27) * rg_m(M) / (p.angDistPc * K.pc) / K.uas;
  return out;
}

/* ---------- 2.2 克尔特征半径 ---------- */
function radii(a) {
  a = Math.min(Math.max(a, 0), 1);
  const rh = 1 + Math.sqrt(Math.max(0, 1 - a * a));
  const rphP = 2 * (1 + Math.cos(2 / 3 * Math.acos(-a)));
  const rphR = 2 * (1 + Math.cos(2 / 3 * Math.acos(a)));
  const Z1 = 1 + Math.cbrt(1 - a * a) * (Math.cbrt(1 + a) + Math.cbrt(1 - a));
  const Z2 = Math.sqrt(3 * a * a + Z1 * Z1);
  const q = Math.sqrt(Math.max(0, (3 - Z1) * (3 + Z1 + 2 * Z2)));
  return { horizon: rh, photonPro: rphP, photonRetro: rphR, iscoPro: 3 + Z2 - q, iscoRetro: 3 + Z2 + q };
}

/* ---------- 赤道面圆轨道 (sgn=+1 顺行, -1 逆行) ---------- */
function circular(r, a, sgn = 1) {
  const A = sgn * a, r15 = Math.pow(r, 1.5);
  const den = 1 - 3 / r + 2 * A / r15;
  const sq = Math.sqrt(den);
  const omega = sgn / (r15 + A);
  return {
    omega, ut: den > 0 ? (1 + A / r15) / sq : NaN,
    E: den > 0 ? (1 - 2 / r + A / r15) / sq : NaN,
    L: den > 0 ? sgn * Math.sqrt(r) * (1 - 2 * A / r15 + a * a / (r * r)) / sq : NaN,
    period: TAU * (r15 + A)
  };
}

/* ---------- 2.6 Novikov–Thorne 薄盘 ---------- */
function ntRoots(a) {
  const ac = Math.acos(Math.min(1, Math.max(-1, a)));
  return [2 * Math.cos(ac / 3 - PI / 3), 2 * Math.cos(ac / 3 + PI / 3), -2 * Math.cos(ac / 3)];
}
function ntFlux(r, a, risco, roots) {
  const rt = roots || ntRoots(a), x0 = Math.sqrt(risco), x = Math.sqrt(r);
  const x1 = rt[0], x2 = rt[1], x3 = rt[2];
  const term = (xi, xj, xk) => 3 * (xi - a) * (xi - a) / (xi * (xi - xj) * (xi - xk)) * Math.log(Math.max((x - xi) / (x0 - xi), 1e-300));
  let br = x - x0 - 1.5 * a * Math.log(x / x0) - term(x1, x2, x3);
  if (Math.abs(x2) > 1e-9) br -= term(x2, x1, x3);
  br -= term(x3, x1, x2);
  const F = br / (Math.pow(x, 4) * (x * x * x - 3 * x + 2 * a));
  return F > 0 ? F : 0;
}
const _fmaxCache = new Map();
function ntFmax(a) {
  const key = Math.round(a * 1e9);
  if (_fmaxCache.has(key)) return _fmaxCache.get(key);
  const ri = radii(a).iscoPro, rt = ntRoots(a);
  let best = 0, rb = ri;
  const N = 4000, rmax = Math.max(4 * ri, 30);
  for (let i = 1; i <= N; i++) {
    const r = ri + (rmax - ri) * (i / N) * (i / N);
    const F = ntFlux(r, a, ri, rt);
    if (F > best) { best = F; rb = r; }
  }
  // 黄金分割细化
  let lo = Math.max(ri * (1 + 1e-9), rb - (rmax - ri) * 0.01), hi = rb + (rmax - ri) * 0.01;
  const gr = (Math.sqrt(5) - 1) / 2;
  let c = hi - gr * (hi - lo), d = lo + gr * (hi - lo);
  let fc = ntFlux(c, a, ri, rt), fd = ntFlux(d, a, ri, rt);
  for (let it = 0; it < 80; it++) {
    if (fc > fd) { hi = d; d = c; fd = fc; c = hi - gr * (hi - lo); fc = ntFlux(c, a, ri, rt); }
    else { lo = c; c = d; fc = fd; d = lo + gr * (hi - lo); fd = ntFlux(d, a, ri, rt); }
  }
  const rp = (lo + hi) / 2, Fm = Math.max(ntFlux(rp, a, ri, rt), best);

  ivec2 t = ivec2((c.x * 97 + c.y * 41 + face * 59 + salt * 13) & 255, (c.x * 31 + c.y * 113 + face * 187 + salt * 71) & 255);
  return texelFetch(uNoise, t, 0);
}

// 一层恒星：立方体贴图格子，每格决定有没有星、多亮、什么颜色
vec3 starLayer(vec3 d, float N, int salt, float pEx, float bMin, float bMax, float bPow, float sigma0, float foot) {
  vec3 ad = abs(d);
  int face; vec2 uv;
  if (ad.x >= ad.y && ad.x >= ad.z) { face = d.x > 0.0 ? 0 : 1; uv = d.yz / ad.x; }
  else if (ad.y >= ad.z)            { face = d.y > 0.0 ? 2 : 3; uv = d.zx / ad.y; }
  else                              { face = d.z > 0.0 ? 4 : 5; uv = d.xy / ad.z; }
  vec2 g = (uv * 0.5 + 0.5) * N;
  vec2 id = floor(g);
  vec4 q1 = rndCell(id, face, salt);
  float hEx = q1.x;
  float cf = pow(1.0 + dot(uv, uv), -1.5);          // 让立体角密度均匀
  if (hEx > pEx * cf) return vec3(0.0);
  vec4 q2 = rndCell(id + vec2(5.0, 3.0), face, salt + 7);
  float hx = q1.z, hy = q1.w, hb = q2.x, hc = q2.z;
  vec2 pos = (id + 0.2 + 0.6 * vec2(hx, hy)) / N * 2.0 - 1.0;
  vec3 sd = normalize(faceDir(face, pos));
  float dist = length(d - sd);
  float sig = max(sigma0, 0.7 * foot);
  float e = dist / sig;
  if (e > 4.0) return vec3(0.0);
  float amp = (bMin + (bMax - bMin) * pow(hb, bPow)) * (sigma0 * sigma0) / (sig * sig);
  vec3 col = mix(vec3(1.0, 0.70, 0.46), vec3(0.64, 0.77, 1.0), smoothstep(0.0, 1.0, hc));
  col = mix(col, vec3(1.0), 0.35);
  return col * amp * exp(-0.5 * e * e);
}

vec3 milkyWay(vec3 d) {
  vec3 gN = normalize(vec3(0.34, -0.62, 0.71));
  vec3 ex = normalize(cross(gN, vec3(0.0, 0.0, 1.0)));
  vec3 ey = cross(gN, ex);
  float lat = dot(d, gN);
  float lon = atan(dot(d, ey), dot(d, ex));
  float band = exp(-lat * lat / (2.0 * 0.10 * 0.10));
  float wide = exp(-lat * lat / (2.0 * 0.28 * 0.28));
  vec3 cen = cos(1.0) * ex + sin(1.0) * ey;
  float ang = acos(clamp(dot(d, cen), -1.0, 1.0));
  float bulge = exp(-ang * ang / (2.0 * 0.38 * 0.38));
  float n1 = fbm4(d * 3.2 + vec3(3.1, 1.7, 9.2));
  float n2 = fbm4(d * 9.0 + vec3(5.3, 8.1, 2.7));
  float dust = smoothstep(0.52, 0.80, fbm4(d * 5.5 + vec3(1.9, 6.2, 4.4))) * band;
  float inten = (0.55 * band + 0.25 * wide) * (0.45 + 1.1 * n1) * (0.6 + 0.8 * n2) * (1.0 - 0.75 * dust);
  inten += 1.4 * bulge * band * (0.7 + 0.6 * n2);
  vec3 col = mix(vec3(0.62, 0.72, 0.95), vec3(1.0, 0.82, 0.62), clamp(0.35 + 1.3 * bulge, 0.0, 1.0));
  return col * inten * 0.022;
}

vec3 skyRadiance(vec3 d, float foot) {
  vec3 col = vec3(0.0020, 0.0021, 0.0024);
  if (uStars == 0) return col;
  vec3 mw = milkyWay(d);
  col += mw;
  float dens = 1.0 + 3.0 * clamp(length(mw) / 0.03, 0.0, 1.0);
  float s0 = max(0.55 * uPixAng, 3.0e-4);
  col += starLayer(d, 26.0, 1, 0.55, 0.25, 9.0, 7.0, s0, foot);
  col += starLayer(d, 80.0, 2, 0.55, 0.05, 1.8, 6.0, s0, foot);
  col += starLayer(d, 200.0, 3, min(0.42 * dens, 0.9), 0.012, 0.32, 4.0, s0, foot);
  // 当一个像素覆盖很多恒星时（强透镜压缩），用平均星光代替单个格子
  float cell = 0.012;
  float mixf = smoothstep(0.6 * cell, 2.5 * cell, foot);
  vec3 meanStars = vec3(0.004, 0.0042, 0.0046) * (1.0 + 2.0 * dens);
  col = mix(col, vec3(0.0020, 0.0021, 0.0024) + mw + meanStars, mixf);
  return col;
}
`;

uniform float uTmax;
uniform float uTime;
uniform sampler2D uProf;     // R32F：T(r)/Tmax，按 s = sqrt(r - r_isco) 均匀采样
uniform float uProfInv;      // (N-1)/s_max
uniform int   uProfN;
uniform int   uDoppler;
uniform float uCamGain;      // 1/sqrt(1-f_cam)
uniform int   uSpotOn;       // 热斑（扩展演示）
uniform vec4  uSpot;         // (r_s, φ_s, σ, ΔT/T_max)

const float BB_T[21] = float[21](1000.,1500.,2000.,2500.,3000.,3500.,4000.,4500.,5000.,5500.,6000.,6500.,7000.,8000.,9000.,10000.,12000.,15000.,20000.,30000.,40000.);
const vec4 BB_C[21] = vec4[21](
  vec4(1.0000,0.0286,0.0000,-9.054), vec4(1.0000,0.1451,0.0000,-5.597), vec4(1.0000,0.2663,0.0077,-3.820),
  vec4(1.0000,0.3803,0.0677,-2.737), vec4(1.0000,0.4839,0.1545,-2.007), vec4(1.0000,0.5767,0.2606,-1.481),
  vec4(1.0000,0.6590,0.3789,-1.084), vec4(1.0000,0.7315,0.5035,-0.774), vec4(1.0000,0.7954,0.6300,-0.524),
  vec4(1.0000,0.8516,0.7551,-0.319), vec4(1.0000,0.9010,0.8766,-0.147), vec4(1.0000,0.9445,0.9931,0.000),
  vec4(0.9061,0.8905,1.0000,0.127), vec4(0.7656,0.8016,1.0000,0.335), vec4(0.6739,0.7399,1.0000,0.500),
  vec4(0.6102,0.6950,1.0000,0.635), vec4(0.5286,0.6344,1.0000,0.844), vec4(0.4616,0.5815,1.0000,1.065),
  vec4(0.4069,0.5358,1.0000,1.308), vec4(0.3627,0.4969,1.0000,1.597), vec4(0.3440,0.4798,1.0000,1.776));

// 返回 (R, G, B, logY)；温度之间线性插值（对 logY 插值）
vec4 blackbody(float T) {
  if (T <= 1000.0) {
    vec4 c = BB_C[0];
    c.w = 1.32 - 10370.0 / max(T, 1.0);
    return c;
  }
  if (T >= 40000.0) return BB_C[20];
  int i = 0;
  for (int k = 1; k < 20; k++) { if (T >= BB_T[k]) i = k; }
  float f = (T - BB_T[i]) / (BB_T[i + 1] - BB_T[i]);
  return mix(BB_C[i], BB_C[i + 1], f);
}

float profileT(float r) {
  float s = sqrt(max(r - uRisco, 0.0)) * uProfInv;
  s = min(s, float(uProfN - 1) - 1.001);
  int i0 = int(s);
  float f = s - float(i0);
  float a = texelFetch(uProf, ivec2(i0, 0), 0).r;
  float b = texelFetch(uProf, ivec2(i0 + 1, 0), 0).r;
  return mix(a, b, f);
}

// 盘面纹理：在 (log r, φ) 上的 fbm，条纹状；φ 用 (cos φ, sin φ) 避免 ±π 接缝
float diskNoise(float r, float phi, float seed) {
  vec3 p = vec3(2.4 * cos(phi), 2.4 * sin(phi), 12.0 * log(r)) + vec3(seed * 17.31, seed * 5.77, seed * 9.13);
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + vec3(4.7, 2.3, 8.1); a *= 0.5; }
  return s / 0.96875;
}
// 两套相位错开半个周期的纹理，各自只存活一个周期，按三角波权重交替淡入淡出（避免差速自转把纹理缠成细丝）
float diskTexture(float r, float phi, float t) {
  const float LIFE = 60.0;
  float Om = 1.0 / (r * sqrt(r) + uA);
  float u0 = t / LIFE, u1 = t / LIFE + 0.5;
  float k0 = floor(u0), k1 = floor(u1);
  float f0 = u0 - k0, f1 = u1 - k1;
  float w0 = 1.0 - abs(2.0 * f0 - 1.0), w1 = 1.0 - abs(2.0 * f1 - 1.0);
  float n0 = diskNoise(r, phi - Om * f0 * LIFE, mod(k0, 97.0) + 1.0);
  float n1 = diskNoise(r, phi - Om * f1 * LIFE, mod(k1, 97.0) + 51.5);
  float n = ((n0 - 0.5) * w0 + (n1 - 0.5) * w1) / sqrt(w0 * w0 + w1 * w1 + 1.0e-4) + 0.5;
  return exp(4.2 * (n - 0.5)) * 0.93;
}

// 盘面辐亮度（线性 HDR）
vec3 diskShade(float r, float phi, float g) {
  float Tn = profileT(r) * uTmax;
  if (uSpotOn != 0) {
    float d2 = r * r + uSpot.x * uSpot.x - 2.0 * r * uSpot.x * cos(phi - uSpot.y);
    Tn += uSpot.w * uTmax * exp(-0.5 * d2 / (uSpot.z * uSpot.z));
  }
  float gE = (uDoppler != 0) ? g * uCamGain : 1.0;
  float Tobs = max(Tn * gE, 1.0);
  vec4 bb = blackbody(Tobs);
  float lum = max(dot(bb.rgb, vec3(0.2126, 0.7152, 0.0722)), 1.0e-6);
  vec3 col = bb.rgb / lum * exp2(bb.w * 3.321928);
  return col * diskTexture(r, phi, uTime);
}
`;

/* ---------------------------------------------------------------
 *  光线追踪核心（共享：画面 / 验收接口 trace 用的是同一段代码）
 * --------------------------------------------------------------- */
SH.rtCore = `
struct Ray {
  vec3 x; vec3 q;            // 位置；动量（克尔）或方向（史瓦西）
  int steps; int nCross; int fate;   // fate: 0 视界 1 盘 2 逃逸 3 步数用尽
  float rHit; float phiHit; float g; float xi;
  float h2; float vinf; float resc;
  vec3 outDir;
};

vec3 camToWorld(vec3 c) { return c.x * uCamR + c.y * uCamU + c.z * uCamF; }

float gOf(float r, float xi) {
  float r15 = 1.0 / (r * sqrt(r));
  float num = sqrt(max(1.0 - 3.0 / r + 2.0 * uA * r15, 1.0e-12));
  return num / max(1.0 + (uA - xi) * r15, 1.0e-6);
}

#if KERR
void kerrGeom(vec3 x, out float r, out float f, out vec3 l) {
  float A = -uA, A2 = uA * uA;
  float w = dot(x, x) - A2;
  float r2 = 0.5 * (w + sqrt(w * w + 4.0 * A2 * x.z * x.z));
  r = sqrt(max(r2, 1.0e-10));
  float den = r2 * r2 + A2 * x.z * x.z;
  f = 2.0 * r * r2 / den;
  float q = r2 + A2;
  l = vec3((r * x.x + A * x.y) / q, (r * x.y - A * x.x) / q, x.z / r);
}
vec3 kerrStartP(float f, vec3 l, vec3 d) {
  float s = sqrt(1.0 - f), c = dot(l, d);
  return (d + l * ((s - 1.0) * c + f * (1.0 + c) / s)) / s;
}
// 3.3 的运动方程（A = -a）。除法已换成倒数乘法（性能）
void kerrRHS(vec3 x, vec3 p, out vec3 dx, out vec3 dp, out float r) {
  float A = -uA, A2 = uA * uA;
  float z = x.z;
  float w = dot(x, x) - A2;
  float r2 = 0.5 * (w + sqrt(w * w + 4.0 * A2 * z * z));
  float ir = inversesqrt(max(r2, 1.0e-10));
  r = r2 * ir;
  float ir2 = ir * ir;
  float r3 = r * r2;
  float den = r2 * r2 + A2 * z * z;
  float iden = 1.0 / den;
  float f = 2.0 * r3 * iden;
  float q = r2 + A2;
  float iq = 1.0 / q;

  float Phi = 1.0 + dot(l, p);
  vec3 gr = vec3(x.x * r3, x.y * r3, z * r * q) * iden;
  float iden2 = iden * iden;
  float dfdr = (6.0 * r2 * den - 8.0 * r3 * r3) * iden2;
  float dfdz = -4.0 * r3 * A2 * z * iden2;
  vec3 gf = dfdr * gr + vec3(0.0, 0.0, dfdz);
  float N = (r * x.x + A * x.y) * p.x + (r * x.y - A * x.x) * p.y;
  vec3 gN = gr * (x.x * p.x + x.y * p.y) + vec3(r * p.x - A * p.y, r * p.y + A * p.x, 0.0);
  vec3 glp = gN * iq - (2.0 * r * N * iq * iq) * gr + vec3(0.0, 0.0, p.z * ir) - (z * p.z * ir2) * gr;

  dx = p - fP * l;
  dp = (0.5 * Phi * Phi) * gf + fP * glp;
}

vec3 accSch(vec3 x, float h2) {
  float r2 = dot(x, x);
  float ir = inversesqrt(r2);
  float ir2 = ir * ir;
  return (-3.0 * h2 * ir2 * ir2 * ir) * x;
}

// 5.2 关闭引力透镜：直线
void flatRay(vec3 d, inout Ray R) {
  float rh = uRh;
  vec3 pos = uCamPos;
  float tcl = -dot(pos, d);
  float b2 = dot(pos, pos) - tcl * tcl;
  float tBH = 1.0e30;
  if (b2 < rh * rh && tcl > 0.0) tBH = tcl - sqrt(rh * rh - b2);
  float tDisk = 1.0e30;
  if (d.z != 0.0) { float t = -pos.z / d.z; if (t > 0.0) tDisk = t; }
  if (tDisk < 1.0e29) R.nCross = 1;
  R.xi = -(pos.x * d.y - pos.y * d.x);
  if (tDisk < tBH && uDiskOn != 0) {
    vec2 xh = pos.xy + tDisk * d.xy;
    float rr = length(xh);
    if (rr >= uRisco && rr <= uROut) {
      R.fate = 1; R.rHit = rr; R.phiHit = atan(xh.y, xh.x); R.g = gOf(rr, R.xi);

void march(inout Ray R) {
  vec3 x = R.x, q = R.q;
  int steps = R.steps;
  float resc = R.resc;
  R.fate = 3;
#if KERR
  for (int i = 0; i < MAXSTEPS; i++) {

    kerrRHS(x, q, k1x, k1p, r);
    if (r < uRh) { R.fate = 0; break; }
    if (r > resc && dot(x, k1x) > 0.0) { R.fate = 2; R.outDir = normalize(k1x); break; }
    float h = min(uK * (1.0 + uKFar * clamp((r - 12.0) * 0.026, 0.0, 1.0)) * r, 0.5 * max(r - uRh, uMinStep));

    kerrRHS(x + (0.5 * h) * k1x, q + (0.5 * h) * k1p, k2x, k2p, rr);
    kerrRHS(x + (0.5 * h) * k2x, q + (0.5 * h) * k2p, k3x, k3p, rr);
    kerrRHS(x + h * k3x, q + h * k3p, k4x, k4p, rr);

    x += (h / 6.0) * (k1x + 2.0 * k2x + 2.0 * k3x + k4x);
    q += (h / 6.0) * (k1p + 2.0 * k2p + 2.0 * k3p + k4p);
    steps++;
    if (x0.z * x.z < 0.0) {
      R.nCross++;
      if (uDiskOn != 0) {
        float t = x0.z / (x0.z - x.z);
        vec2 xh = mix(x0.xy, x.xy, t);
        float r2h = sqrt(max(dot(xh, xh) - uA * uA, 0.0));
        if (r2h >= uRisco && r2h <= uROut) {

    }
  }
  if (R.fate == 3) {   // 步数用尽：给一个尽量合理的出射方向
    vec3 k1x, k1p; float r;
    kerrRHS(x, q, k1x, k1p, r);
    R.outDir = normalize(k1x);
  }
#else
  float h2 = R.h2;
  for (int i = 0; i < MAXSTEPS; i++) {
    if (steps >= uMaxSteps) break;
    float r = length(x);
    if (r < 2.0) { R.fate = 0; break; }
    if (r > resc && dot(x, q) > 0.0) { R.fate = 2; R.outDir = normalize(q); break; }
    float hs = min(uK * (1.0 + uKFar * clamp((r - 12.0) * 0.026, 0.0, 1.0)) * r, 0.5 * max(r - 2.0, uMinStep));

    vec3 a2 = accSch(x2, h2);
    vec3 x3 = x + (0.5 * dt) * v2;     vec3 v3 = q + (0.5 * dt) * a2;
    vec3 a3 = accSch(x3, h2);
    vec3 x4 = x + dt * v3;             vec3 v4 = q + dt * a3;
    vec3 a4 = accSch(x4, h2);
    vec3 x0 = x;

SH.mainBeauty = `
uniform vec2  uRenderRes;
uniform vec2  uJitter;
uniform int   uView;       // 0 物理 1 grid 2 checker 3 gmap 4 steps
uniform int   uSoft;       // 盘外缘软边（透射继续追踪）

float edgeW(float r) {
  float w = 0.07 * uROut;
  return 1.0 - smoothstep(uROut - w, uROut, r);
}

vec3 gridSky(vec3 o, float foot) {
  float lonD = degrees(atan(o.y, o.x));
  float latD = degrees(asin(clamp(o.z, -1.0, 1.0)));
  vec3 base;
  if (o.z >= 0.0) base = (o.y >= 0.0) ? vec3(0.52, 0.17, 0.17) : vec3(0.17, 0.45, 0.20);
  else            base = (o.y >= 0.0) ? vec3(0.17, 0.27, 0.58) : vec3(0.50, 0.44, 0.14);
  float cl = max(cos(radians(latD)), 0.02);
  float dlon = abs(fract(lonD / 15.0 + 0.5) - 0.5) * 15.0 * cl;
  float dlat = abs(fract(latD / 15.0 + 0.5) - 0.5) * 15.0;
  float hw = max(degrees(foot) * 0.6, 0.06);
  float line = max(1.0 - smoothstep(0.5 * hw, hw, dlon), 1.0 - smoothstep(0.5 * hw, hw, dlat));
  return mix(base, vec3(0.93, 0.93, 0.93), line);
}

void main() {
  vec2 uv = (gl_FragCoord.xy + uJitter) / uRenderRes;
  vec2 tn = vec2((2.0 * uv.x - 1.0) * uTanHalf * uAspect, (2.0 * uv.y - 1.0) * uTanHalf);
  Ray R; bool done;
  initRay(tn, R, done);

  vec3 acc = vec3(0.0);
  float trans = 1.0;
  bool physical = (uView == 0);
  if (done) {
    if (R.fate == 1) {
      if (physical) { acc = diskShade(R.rHit, R.phiHit, R.g); trans = 0.0; }
    }
  } else {
    for (int pass = 0; pass < 2; pass++) {
      march(R);
      if (R.fate != 1) break;
      float w = (uSoft != 0 && physical) ? edgeW(R.rHit) : 1.0;
      if (physical) acc += trans * w * diskShade(R.rHit, R.phiHit, R.g);
      trans *= 1.0 - w;
      if (w > 0.995 || pass == 1) { trans = (w > 0.995) ? 0.0 : 0.0; break; }
    }
  }

  // 出射方向的变化率 → 天空滤波半径（在统一控制流里用导数）
  float escMask = (R.fate == 2 || R.fate == 3) ? 1.0 : 0.0;
  vec3 od = (escMask > 0.5) ? R.outDir : vec3(0.0);
  vec3 ddx = dFdx(od), ddy = dFdy(od);
  float mx = dFdx(escMask), my = dFdy(escMask);
  float foot = uPixAng;
  if (mx == 0.0 && my == 0.0) foot = clamp(max(length(ddx), length(ddy)), 0.5 * uPixAng, 0.2);
  foot = max(foot, 0.5 * uPixAng);

  vec3 col;
  if (uView == 0) {
    col = acc;
    if (R.fate == 2 || R.fate == 3) col += trans * skyRadiance(R.outDir, foot);
    else if (R.fate == 1 && trans > 0.0) col += trans * vec3(0.0);
  } else if (uView == 1) {          // grid
    if (R.fate == 0) col = vec3(0.0);
    else if (R.fate == 1) col = vec3(0.95, 0.62, 0.20);
    else col = gridSky(R.outDir, foot);
  } else if (uView == 2) {          // checker
    if (R.fate == 0) col = vec3(0.0);
    else if (R.fate == 1) {
      float ph = degrees(R.phiHit);
      if (ph <= -180.0) ph += 360.0;
      float par = mod(floor(R.rHit) + floor(ph / 30.0), 2.0);
      col = (par < 0.5) ? vec3(0.90, 0.90, 0.92) : vec3(0.16, 0.16, 0.20);

    if (R.fate == 0) col = vec3(0.0);
    else if (R.fate == 1) {
      float t = min(1.0, abs(R.g - 1.0) / 0.5);
      col = (R.g >= 1.0) ? mix(vec3(1.0), vec3(0.1, 0.3, 1.0), t) : mix(vec3(1.0), vec3(1.0, 0.15, 0.05), t);

/* ===================================================================

  stars: true, bloom: true, tmax: 7000, exposure: 0, autoExposure: true, timeSpeed: 6, bloomStrength: 0.32

function sanitize(k, v) {

    case 'camR': return clamp(+v, 3, 3e7);
    case 'camIncl': return clamp(+v, 0.05, 179.95);
    case 'camAz': { v = +v % 360; return v < 0 ? v + 360 : v; }
    case 'fovY': return clamp(+v, 5, 120);
    case 'preset': return Phys.PRESETS[v] ? v : undefined;
    case 'view': return VIEWS.includes(v) ? v : undefined;
    case 'rOut': return clamp(+v, 3, 400);
    case 'time': return +v;
    case 'tmax': return clamp(+v, 1000, 60000);
    case 'exposure': return clamp(+v, -8, 8);
    case 'timeSpeed': return clamp(+v, -5000, 5000);
    case 'bloomStrength': return clamp(+v, 0, 2);

}
const IMAGE_KEYS = new Set(['spin', 'camR', 'camIncl', 'camAz', 'fovY', 'view', 'disk', 'rOut', 'doppler', 'lensing', 'stars', 'tmax', 'preset', 'bloom', 'bloomStrength']);
function setState(obj, source) {

/* ---------- 相机 ---------- */
function getCam(st) {
  st = st || S;

/** 世界坐标点 → 屏幕像素（平直空间投影，叠加层用） */
function projectToScreen(p, cam, W, H, fovY) {
  const th = Math.tan(fovY * DEG / 2);
  const rx = p[0] - cam.pos[0], ry = p[1] - cam.pos[1], rz = p[2] - cam.pos[2];
  const zf = rx * cam.F[0] + ry * cam.F[1] + rz * cam.F[2];

  const tx = (rx * cam.R[0] + ry * cam.R[1] + rz * cam.R[2]) / zf;
  const ty = (rx * cam.U[0] + ry * cam.U[1] + rz * cam.U[2]) / zf;

/* ---------- 主渲染 ---------- */

/* ---------- 动态分辨率 ---------- */
// 目标：1080p 下 60 fps，内部分辨率不低于 0.5×。有 GPU 计时（EXT_disjoint_timer_query）就用它判断真实的 GPU 负载，
// 否则退回用帧间隔：显示器本身的刷新率可能略低于 60 Hz，此时 GPU 还有余量就不该继续降分辨率。
function adaptScale(now) {
  RN.fpsBuf.push(now);
  if (RN.fpsBuf.length > 31) RN.fpsBuf.shift();
  if (RN.fpsBuf.length >= 2) RN.fps = 1000 * (RN.fpsBuf.length - 1) / (RN.fpsBuf[RN.fpsBuf.length - 1] - RN.fpsBuf[0]);
  if (RN.quality !== 'auto') { RN.scale = RN.quality; return; }
  if (S.view !== 'physical' || document.hidden) return;
  if (RN.frame < 24 || RN.frame % 12 !== 0 || RN.fpsBuf.length < 24) return;
  const intervalMs = (RN.fpsBuf[RN.fpsBuf.length - 1] - RN.fpsBuf[0]) / (RN.fpsBuf.length - 1);
  const gpu = FT.valid ? FT.ms : null;
  let want = RN.scale;
  if (intervalMs > 17.3 && (gpu === null || gpu > 15)) {
    want = RN.scale * (gpu !== null ? clamp(Math.sqrt(13.5 / gpu), 0.8, 0.97) : (intervalMs > 26 ? 0.86 : 0.94));
  } else if (RN.scale < 1 && RN.frame - RN.lastScaleChange > RN.upBlock && (gpu !== null ? gpu < 11.5 : intervalMs < 16.95)) {

    RN.fpsBuf.length = 0;

    RN.kBoost = Math.max(1, RN.kBoost / 1.1); RN.fpsBuf.length = 0;
  }
}

/* ---------- 帧循环 ---------- */
let rafId = 0;

  rafId = requestAnimationFrame(frameLoop);
  frameBody(now);
}
function frameBody(now) {

  const dtReal = RN.lastNow ? clamp((now - RN.lastNow) / 1000, 0, 0.1) : 0.016;
  const gap = RN.lastNow ? (now - RN.lastNow) : 16;
  RN.lastNow = now;
  RN.frame++;
  if (gap > 500) { RN.fpsBuf.length = 0; }     // 刚从后台切回来
  if (!S.paused && S.timeSpeed !== 0 && RN.frame > 1) S.time += dtReal * S.timeSpeed;
  if (S.autoRotate && !RN.dragging) { S.camAz = (S.camAz + 2.2 * dtReal) % 360; stateVersion++; }
  if (typeof tickModules === 'function') tickModules(dtReal, now);
  if (!RN.ready) { updateLoader(); return; }
  const ok = renderFrame(dtReal, now);
  if (PROF.on) profCollect();
  if (ok) {
    adaptScale(now);
    if (typeof drawOverlay === 'function') drawOverlay(dtReal);
  }

}

function bhDisk(r) {
  const a = S.spin, r15 = Math.pow(r, 1.5);
  const den = 1 - 3 / r + 2 * a / r15;
  return {
    omega: 1 / (r15 + a),
    ut: den > 0 ? (1 + a / r15) / Math.sqrt(den) : NaN,
    T: Phys.diskTemp(r, a, S.tmax),
    Tmax: S.tmax

}

function stepStats() {
  const now = performance.now();
  if (RN.stepsT && now - RN.stepsT < 800) return { avg: RN.stepsAvg, max: RN.stepsMax };
  RN.stepsT = now;
  if (!gl || traceBackend !== 'gpu') { RN.stepsAvg = 0; RN.stepsMax = 0; return { avg: 0, max: 0 }; }
  try {
    const th = Math.tan(S.fovY * DEG / 2), asp = RN.cw / RN.ch, rays = [];
    const nx = 48, ny = 27;
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) rays.push([((i + 0.5) / nx * 2 - 1) * th * asp, ((j + 0.5) / ny * 2 - 1) * th]);
    const res = gpuTrace(rays, S, beautyOpt());
    let sum = 0, mx = 0;
    for (const r of res) { sum += r.steps; if (r.steps > mx) mx = r.steps; }
    RN.stepsAvg = sum / res.length; RN.stepsMax = mx;

/* ===================================================================
 *  60_selfcheck.js — 自检：把本页当场算出的结果与 8.2 节的期望值并排比较

function stFor(over) { return Object.assign({}, getState(), { disk: false, lensing: true, rOut: 20, camAz: 0 }, over); }

/** 在 tanY = 0 线上找阴影边界（从中心向外，第一个不是视界的位置）：分批扫描 + 逐级细化 */
function findShadowEdge(st, sign, hi, opt) {
  let lo = 0, up = hi;
  for (let it = 0; it < 4; it++) {
    const M = 32, rays = [];
    for (let i = 0; i <= M; i++) rays.push([sign * (lo + (up - lo) * i / M), 0]);
    const res = traceRays(rays, st, opt);
    let k = 0;
    while (k < res.length && res[k].fate === 'horizon') k++;
    if (k === 0 || k === res.length) return NaN;
    const nlo = lo + (up - lo) * (k - 1) / M, nup = lo + (up - lo) * k / M;
    lo = nlo; up = nup;

/** 光线偏折角（度）：相机在 1e5 M 处，瞄准距离 b */

/** 爱因斯坦环：找出射方向恰好等于“相机正后方”的那条光线对应的屏幕角 */
function einsteinRingAngle(Rc, guess) {
  const st = stFor({ spin: 0, camR: Rc, camIncl: 90 });
  const cam = getCam(st);
  const beta = res => {
    if (res.fate !== 'escape') return NaN;
    const o = res.out;
    return Math.atan2(o[0] * cam.R[0] + o[1] * cam.R[1] + o[2] * cam.R[2], o[0] * cam.F[0] + o[1] * cam.F[1] + o[2] * cam.F[2]);

const UI = { widgets: [], lastInfo: 0, toastT: 0 };

function toast(msg, ms = 2200) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(UI.toastT); UI.toastT = setTimeout(() => t.classList.remove('show'), ms);

/* ---------- 控件工厂 ---------- */
function addSlider(parent, label, o) {
  // o: {min,max,step,get,set,fmt, toSlider, fromSlider}
  const row = el('div', { class: 'row' });
  const lab = el('label', { text: label, title: o.title || '' });
  const inp = el('input', { type: 'range', min: o.min, max: o.max, step: o.step || 'any' });
  const val = el('span', { class: 'val' });
  row.append(lab, inp, val); parent.append(row);
  const w = {
    update() {
      const v = o.get();
      if (document.activeElement !== inp) inp.value = o.toSlider ? o.toSlider(v) : v;
      val.textContent = o.fmt ? o.fmt(v) : String(v);
    }
  };
  inp.addEventListener('input', () => { const raw = +inp.value; o.set(o.fromSlider ? o.fromSlider(raw) : raw); w.update(); });
  UI.widgets.push(w);
  return w;
}
function addToggle(parent, label, key, extra) {
  const lb = el('label');
  const cb = el('input', { type: 'checkbox' });
  lb.append(cb, label);
  if (extra) { const chip = el('span', { class: 'chip', text: extra, style: 'display:none' }); lb.append(chip); lb.chip = chip; }
  parent.append(lb);
  cb.addEventListener('change', () => setState({ [key]: cb.checked }, 'ui'));
  UI.widgets.push({ update() { cb.checked = !!S[key]; if (lb.chip) lb.chip.style.display = S[key] ? 'none' : ''; } });
  return cb;
}

/* ---------- 信息卡 ---------- */
function renderInfo() {
  const p = Phys.PRESETS[S.preset], u = Phys.units(S.preset), rad = Phys.radii(S.spin);
  const km = M => fmtLenKm(M * u.rg_km);

  const cam = getCam(S);
  const rows = [];
  const hd = t => rows.push('<tr class="hd"><td colspan="3">' + t + '</td></tr>');
  const r3 = (a, b, c) => rows.push('<tr><td>' + a + '</td><td class="v">' + b + '</td><td class="v2">' + (c || '') + '</td></tr>');
  const distTxt = p.distPc ? (p.distPc >= 1e6 ? fmtNum(p.distPc / 1e6, 3) + ' Mpc' : p.distPc >= 1e3 ? fmtNum(p.distPc / 1e3, 3) + ' kpc' : p.distPc + ' pc') : '距离未知';
  hd('天体 · ' + p.short);
  r3('质量', sci(p.mass, 4) + ' M☉', distTxt);
  r3('r<sub>g</sub> = GM/c²', '1 M', fmtLenKm(u.rg_km));
  r3('t<sub>g</sub> = GM/c³', '1 M', fmtTimeS(u.tg_s));
  hd('当前自转 a = ' + S.spin.toFixed(3));
  r3('视界 r<sub>h</sub>', fmtNum(rad.horizon, 5) + ' M', km(rad.horizon));
  r3('光子轨道 顺/逆', fmtNum(rad.photonPro, 4) + ' / ' + fmtNum(rad.photonRetro, 4) + ' M', km(rad.photonPro));
  r3('ISCO（顺行）', fmtNum(rad.iscoPro, 5) + ' M', km(rad.iscoPro));
  const Tisco = 2 * PI * (Math.pow(rad.iscoPro, 1.5) + S.spin);
  r3('ISCO 公转周期', fmtNum(Tisco, 4) + ' M', sec(Tisco));
  r3('盘外缘 r<sub>out</sub>', fmtNum(S.rOut, 3) + ' M', km(S.rOut));
  hd('对照（a = 0）');
  r3('阴影角直径', p.angDistPc ? fmtAng(u.shadow_uas) : '—', p.ehtUas ? 'EHT 亮环 ' + p.ehtUas + '±' + p.ehtErr : (p.angDistPc ? '' : '无距离'));
  const T6 = 2 * PI * Math.pow(6, 1.5);
  r3('ISCO 周期 (r=6M)', fmtNum(T6, 5) + ' M', sec(T6));
  r3('史瓦西半径 r<sub>s</sub>', '2 M', fmtLenKm(u.rs_km));
  hd('相机');
  r3('距离 R<sub>c</sub>', fmtNum(cam.Rc, 4) + ' M', km(cam.Rc));
  r3('时间膨胀 dτ/dt', fmtNum(cam.sc, 5), S.spin > 1e-4 ? '√(1−f)' : '√(1−2/R<sub>c</sub>)');
  rows.push('<tr><td colspan="3" class="sub" style="padding-top:5px">' + RN.fps.toFixed(0) + ' fps · ' + RN.rw + '×' + RN.rh + '（' + (RN.rw / RN.cw * 100).toFixed(0) + '%）</td></tr>');
  $('infoTable').innerHTML = rows.join('');
}

function speedFromSlider(v) { const a = Math.abs(v); if (a < 2) return 0; return Math.sign(v) * Math.pow(10, -2 + 5.5 * (a - 2) / 98); }

/* ---------- 相机交互 ---------- */
function bindCamera() {
  const cv = $('gl');
  const pts = new Map();
  let pinch0 = 0, r0 = 0;
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    RN.dragging = true; cv.classList.add('drag');

/* ---------- 有效势曲线 ---------- */
function drawPotential() {
  const cv = $('labPlot'); if (!cv) return;
  const ctx = cv.getContext('2d'), W = cv.clientWidth * (window.devicePixelRatio || 1), H = cv.clientHeight * (window.devicePixelRatio || 1);
  if (cv.width !== W) cv.width = W; if (cv.height !== H) cv.height = H;
  ctx.clearRect(0, 0, W, H);
  const dpr = window.devicePixelRatio || 1;
  const p = LAB.list[LAB.sel];
  ctx.font = (10.5 * dpr) + 'px sans-serif'; ctx.fillStyle = '#8e9ab0';
  if (!p || !p.ok) { ctx.fillText('选中一个粒子以显示有效势', 10 * dpr, 20 * dpr); return; }
  const a = p.a, E = p.E, Lz = p.L, Q = p.Q || 0;
  const rh = 1 + Math.sqrt(Math.max(0, 1 - a * a));
  const info = p.info();
  // 范围：近心点/远心点的 1.4 倍
  let rmax = Math.max(14, 1.5 * (p.spec.kind === 'pe' ? p.spec.p / (1 - p.spec.e) : p.spec.r0), 1.2 * (isFinite(info.r) ? info.r : 10));
  rmax = Math.min(rmax, 400);
  const rmin = rh * 1.02;
  const N = 400, vs = [];
  let vmax = E * E * 1.25 + 0.02;
  for (let i = 0; i <= N; i++) {
    const r = rmin + (rmax - rmin) * Math.pow(i / N, 1.6), V = Phys.effectivePotentialE(r, a, Lz, Q);
    vs.push([r, V * V]);
  }
  const vmin = Math.max(0, Math.min(E * E, ...vs.map(v => v[1])) - 0.05);
  vmax = Math.min(vmax, 1.6); const y0 = Math.min(vmin, 0.6);
  const px = r => 34 * dpr + (r - rmin) / (rmax - rmin) * (W - 44 * dpr), py = v => H - 18 * dpr - (v - y0) / (vmax - y0) * (H - 30 * dpr);
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(34 * dpr, 8 * dpr); ctx.lineTo(34 * dpr, H - 18 * dpr); ctx.lineTo(W - 8 * dpr, H - 18 * dpr); ctx.stroke();
  ctx.strokeStyle = '#6fd3ff'; ctx.lineWidth = 1.6 * dpr; ctx.beginPath();
  let started = false;
  for (const [r, v] of vs) { if (!isFinite(v)) continue; const x = px(r), y = Math.max(4 * dpr, Math.min(H - 18 * dpr, py(v))); if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y); }
  ctx.stroke();
  // 能量线
  ctx.strokeStyle = p.color; ctx.setLineDash([5 * dpr, 4 * dpr]); ctx.beginPath(); ctx.moveTo(34 * dpr, py(E * E)); ctx.lineTo(W - 8 * dpr, py(E * E)); ctx.stroke(); ctx.setLineDash([]);
  // 粒子当前位置
  if (isFinite(info.r)) { const x = px(Math.min(Math.max(info.r, rmin), rmax)), y = py(E * E); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, y, 4.5 * dpr, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, py(Phys.effectivePotentialE(info.r, a, Lz, Q) ** 2)); ctx.stroke(); }
  ctx.fillStyle = '#8e9ab0';
  ctx.fillText('r (M)', W - 40 * dpr, H - 4 * dpr); ctx.fillText('E², V²', 2 * dpr, 12 * dpr);
  ctx.fillText(rmin.toFixed(1), 30 * dpr, H - 4 * dpr); ctx.fillText(rmax.toFixed(0), W - 30 * dpr, H - 18 * dpr + 12 * dpr);
  ctx.fillStyle = p.color; ctx.fillText('E² = ' + (E * E).toFixed(5), 40 * dpr, 12 * dpr);
}

  const thE = einsteinRingAngle(Rc, Math.sqrt(4 / Rc) / DEG) * DEG;      // 追踪得到的爱因斯坦角（rad）
  const thW = Math.sqrt(4 / Rc);
  const rows = [];
  for (const u of [0.25, 0.5, 1, 2]) {
    const beta = u * thE;
    const psiP = lensSolve(st, cam, +beta, thE * 1.0000001, thE * (1 + u + 1.5));
    const psiM = lensSolve(st, cam, -beta, thE * 0.12, thE * 0.9999999);

    if (psiP === psiP && psiM === psiM) {
      const mu = psi => {
        const d = psi * 2e-4, b = lensBeta(st, cam, [psi - d, psi + d]);
        return Math.abs(Math.sin(psi) / Math.sin(beta) * 2 * d / (b[1] - b[0]));

}

/* ===================================================================
 *  5. 潮汐瓦解
 * =================================================================== */
function tdeCalc() {
  const T = FREE.tde, K = Phys.K;
  const rg = K.rg1 * T.M;                       // m
  const Rstar = T.Rs * K.Rsun, rt = Rstar * Math.pow(T.M / T.ms, 1 / 3);
  const rtM = rt / rg, RsM = Rstar / rg;
  const MH = Math.pow(T.Rs * K.Rsun * K.c * K.c / (2 * K.GMsun), 1.5) / Math.sqrt(T.ms);       // 太阳质量（r_t = r_s）
  const dE = RsM / (rtM * rtM);                  // 碎片比能量的展宽 ΔE = G M R*/r_t²（c² 为单位）
  const aMin = 1 / (2 * dE), tfbM = 2 * PI * Math.pow(aMin, 1.5);
  return { rg, rt, rtM, RsM, rtOverRs: rtM / 2, MH, dE, aMin, tfbM, tfbS: tfbM * K.tg1 * T.M, disrupts: rtM > 2 * 1.0, rp: rtM / T.beta };
}
function tdeSim() {
  const T = FREE.tde, c = tdeCalc();
  if (!c.disrupts || c.rp < 3) { T.sim = { ok: false, msg: c.disrupts ? '近心点太靠近视界' : 'r_t < r_s：恒星整体被吞入视界，没有可见的潮汐瓦解' }; return; }
  const a = 0, rp = c.rp, L2 = 2 * rp * rp / (rp - 2), L = Math.sqrt(L2);
  const N = T.N, rows = [];
  for (let k = 0; k < N; k++) {
    const eps = -c.dE + 2 * c.dE * (k + 0.5) / N;           // E = 1 + ε（ε < 0 为束缚）
    rows.push({ eps, E: 1 + eps });
  }
  // 数值积分每个碎片的径向周期（坐标时）
  const Ts = [], bound = rows.filter(r => r.eps < 0);
  for (const r of bound) {
    const o = Phys.orbitAnalyze({ spin: a, E: r.E, L, r0: rp * 1.02, prSign: 1, rtol: 1e-10, atol: 1e-13, maxSteps: 4e5 });
    r.T = o.ok && o.tCoord ? o.tCoord : NaN; r.ok = o.ok;
  }
  // 回落率 dM/dt = (dM/dε)·|dε/dT|，dM/dε 为常数 ⇒ dM/dt ∝ T^(s−1)，s = d ln|ε| / d ln T（由积分得到的 T 与 ε 拟合）
  const pts = bound.filter(r => isFinite(r.T)).sort((x, y) => x.T - y.T);
  const xs = pts.map(r => Math.log(r.T)), ys = pts.map(r => Math.log(Math.abs(r.eps)));
  const t0 = pts.length ? pts[0].T : 1;
  const sel = xs.map((x, i) => i).filter(i => Math.exp(xs[i]) > 1.3 * t0);
  let slope = NaN, sFit = NaN;
  if (sel.length >= 4) {
    const n = sel.length, mx = sel.reduce((q, i) => q + xs[i], 0) / n, my = sel.reduce((q, i) => q + ys[i], 0) / n;
    let sxy = 0, sxx = 0; for (const i of sel) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; }
    sFit = sxy / sxx; slope = sFit - 1;
  }
  T.sim = { ok: true, rows, bound: pts, slope, sFit, L, rp, xs, ys, tmin: t0, tmax: pts.length ? pts[pts.length - 1].T : 0 };
  tdeInitDebris();
}
function tdeInitDebris() {
  const T = FREE.tde, s = T.sim, c = tdeCalc();
  if (!s || !s.ok) { T.deb = null; return; }
  T.deb = s.rows.map(r => {
    const ini = Phys.orbitInit(0, r.E, s.L, s.rp * 1.02, 90, 0, 1);
    if (!ini.ok) return null;
    return { it: new Phys.OrbitIntegrator({ a: 0, E: r.E, L: s.L }, ini.y, { rtol: 1e-8, atol: 1e-11 }), eps: r.eps, fallen: false };
  }).filter(Boolean);

}
function tdeTick(dt) {
  const T = FREE.tde;
  if (!T.deb || !T.run) return;
  T.clock += dt * T.rate;
  for (const d of T.deb) {
    if (d.fallen) continue;
    const it = d.it; let guard = 0;
    while (it.y[3] < T.clock && guard++ < 160) {
      const rate = Math.abs(it.k1[3]); const hmax = (T.clock - it.y[3]) / Math.max(rate, 1e-9);
      if (!it.step(hmax, 1)) break;
      if (!(it.y[0] > 2.02)) { d.fallen = true; break; }
    }
  }
}

/* ---- 热斑 ---- */
function buildHot(p) {
  p.append(el('div', { class: 'note', html: '盘上一个亮斑按<b>开普勒角速度 Ω(r) = 1/(r<sup>3/2</sup> + a)</b> 绕黑洞转。光变曲线是对屏幕上的一张光线网格（<b>与画面同一段着色器积分</b>，GPU trace）求和：F(t) = Σ g⁴·I<sub>spot</sub>·dΩ，峰谷由多普勒集束 g⁴ 与透镜放大（光线密度）共同决定。' }));
  const l = el('label', { style: 'display:flex;gap:4px;align-items:center;margin:2px 0' }); const cb = el('input', { type: 'checkbox' }); l.append(cb, '显示热斑（画面里也会出现）');
  cb.addEventListener('change', () => { FREE.hot.on = cb.checked; FREE.hot.dirty = true; stateVersion++; }); p.append(l);
  addSlider(p, '半径 r_s', { min: 2, max: 30, step: 0.1, get: () => FREE.hot.rs, set: v => { FREE.hot.rs = v; FREE.hot.dirty = true; FREE.hot.due = performance.now() + 200; }, fmt: v => v.toFixed(1) + ' M' });
  addSlider(p, '半宽 σ', { min: 0.3, max: 2.5, step: 0.05, get: () => FREE.hot.sigma, set: v => { FREE.hot.sigma = v; FREE.hot.dirty = true; FREE.hot.due = performance.now() + 200; }, fmt: v => v.toFixed(2) + ' M' });
  addSlider(p, '亮度 ΔT/Tmax', { min: 0.1, max: 2, step: 0.05, get: () => FREE.hot.amp, set: v => { FREE.hot.amp = v; stateVersion++; }, fmt: v => v.toFixed(2) });
  p.append(el('canvas', { id: 'hotPlot', class: 'plot' }));
  p.append(el('div', { id: 'hotRead' }));
}
function hotRender() {
  const h = FREE.hot, c = h.curve; if (!c) return;
  const u = Phys.units(S.preset), a = S.spin;
  const Tk = 2 * PI * (Math.pow(c.rs, 1.5) + a);
  $('hotRead').innerHTML = `<div class="kv" style="margin-top:6px">
    <span>开普勒周期 2π(r<sup>3/2</sup>+a)</span><span>${Tk.toFixed(3)} M = ${fmtTimeS(Tk * u.tg_s)}</span>
    <span>光变曲线测得的周期</span><span><b style="color:var(--acc)">${isFinite(c.period) ? c.period.toFixed(3) : '—'}</b> M（相差 ${isFinite(c.period) ? ((c.period / Tk - 1) * 100).toFixed(2) : '—'}%）</span>
    <span>峰 / 谷 流量比</span><span>${c.mn > 0 ? (c.mx / c.mn).toFixed(1) : '> 10³'}（最大 / 平均 = ${(c.mx / c.mean).toFixed(2)}）</span>
    <span>直接像的 g 范围</span><span>${c.gmin < 9 ? c.gmin.toFixed(3) : '—'} … ${c.gmax.toFixed(3)}（g⁴：${(Math.pow(c.gmin, 4)).toFixed(3)} … ${Math.pow(c.gmax, 4).toFixed(2)}）</span>
    <span>参与求和的光线</span><span>${c.hits} / ${c.nrays}（含次级像）</span>
  </div>
  <div class="note" style="margin-top:3px">对照（规格书 F 组）：a=0：r=6 → 92.344 M，r=10 → 198.692 M；a=0.9，r=10 → 204.347 M。曲线的相位自动对齐到相机方位角 φc = 0。</div>`;
  const cv = $('hotPlot'); if (!cv) return;
  const mxv = c.mx || 1;
  const om = 1 / (Math.pow(c.rs, 1.5) + a), rel = ((om * S.time - S.camAz * DEG) % (2 * PI) + 2 * PI) % (2 * PI);
  plotChart(cv, {
    series: [{ x: Array.from(c.t), y: Array.from(c.f).map(v => v / c.mean), color: '#ffb35c' }],
    xmin: 0, xmax: c.t[c.t.length - 1], ymin: 0, ymax: Math.max(1.2, c.mx / c.mean * 1.1),
    marks: c.peaks.map(x => ({ x, color: 'rgba(255,255,255,.35)' })), cursor: rel / om, yfmt: y => y.toFixed(1), xfmt: x => x.toFixed(0), xlabel: 't (M)  ·  F/⟨F⟩'
  });
}

/* ---- 微引力透镜 ---- */
function buildLens(p) {
  p.append(el('div', { class: 'note', html: '背景恒星从黑洞背后经过：点光源、点质量、薄透镜近似下 A(u) = (u² + 2)/(u·√(u² + 4))，u = 光源到透镜的角距离 / 爱因斯坦角。这里<b>用光线追踪的 Jacobian 直接测放大率</b>：按出射方向找到两个像的屏幕位置 ψ±，μ = (sinψ/sinβ)·dψ/dβ，A = |μ₊| + |μ₋|，并与公式对照。' }));
  addSlider(p, '相机距离 R_c', { min: 2, max: 6, step: 0.05, get: () => Math.log10(FREE.lens.Rc), set: v => { FREE.lens.Rc = Math.pow(10, v); }, fmt: v => sci(Math.pow(10, v), 2) + ' M' });
  const bt = el('button', { text: '重新测量', class: 'on' }); bt.addEventListener('click', () => { lensMeasure(); lensRender(); }); p.append(bt);
  p.append(el('canvas', { id: 'lensPlot', class: 'plot' }));
  p.append(el('div', { id: 'lensRead' }));
}
function lensRender() {
  const L = FREE.lens; if (!L.rows) return;
  const rows = L.rows.map(r => `<tr><td>${r.u}</td><td>${isFinite(r.Af) ? r.Af.toFixed(4) : '—'}</td><td>${isFinite(r.A) ? r.A.toFixed(4) : '—'}</td><td class="${isFinite(r.A) && Math.abs(r.A / r.Af - 1) < 0.03 ? 'pass' : 'failc'}">${isFinite(r.A) ? ((r.A / r.Af - 1) * 100).toFixed(2) + '%' : '—'}</td><td>${isFinite(r.psiP) ? (r.psiP / DEG).toFixed(4) + '° / ' + (r.psiM / DEG).toFixed(4) + '°' : '—'}</td></tr>`).join('');
  $('lensRead').innerHTML = `<div class="kv" style="margin-top:6px"><span>爱因斯坦角 θ_E（追踪）</span><span><b style="color:var(--acc)">${(L.thE / DEG).toFixed(4)}°</b>（弱场 √(4M/R_c) = ${(L.thW / DEG).toFixed(4)}°，差 ${((L.thE / L.thW - 1) * 100).toFixed(2)}%）</span></div>
  <table class="chk" style="margin-top:4px"><thead><tr><th>u</th><th>公式 A(u)</th><th>追踪 A</th><th>偏差</th><th>像位置 ψ₊ / ψ₋</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="note" style="margin-top:3px">R_c 越大越接近弱场点透镜（R_c = 10⁵ M 时偏差 < 0.5%）；R_c 小时强场修正使偏差变大，这是物理上的、不是 bug。</div>`;
  const cv = $('lensPlot'); if (!cv) return;
  const us = [], As = []; for (let i = 0; i <= 120; i++) { const u = 0.1 + i * 0.0325; us.push(u); As.push((u * u + 2) / (u * Math.sqrt(u * u + 4))); }
  plotChart(cv, {
    series: [{ x: us, y: As, color: '#6fd3ff' }, { x: L.rows.map(r => r.u), y: L.rows.map(r => r.A), color: 'transparent' }],
    xmin: 0, xmax: 4, ymin: 1, ymax: 5, yfmt: y => y.toFixed(1), xfmt: x => x.toFixed(1), xlabel: 'u  ·  放大率 A', marks: L.rows.filter(r => isFinite(r.A)).map(r => ({ x: r.u, color: '#ffb35c' }))
  });
  const dpr = window.devicePixelRatio || 1, ctx = cv.getContext('2d'), W = cv.width, H = cv.height, Lm = 40 * dpr, Rm = 8 * dpr, Tm = 8 * dpr, Bm = 20 * dpr;
  for (const r of L.rows) if (isFinite(r.A)) { const x = Lm + (r.u / 4) * (W - Lm - Rm), y = H - Bm - (Math.min(r.A, 5) - 1) / 4 * (H - Tm - Bm); ctx.fillStyle = '#ffb35c'; ctx.beginPath(); ctx.arc(x, y, 4 * dpr, 0, 7); ctx.fill(); }
}

/* ---- 潮汐瓦解 ---- */
function buildTDE(p) {
  p.append(el('div', { class: 'note', html: '恒星被潮汐撕碎：潮汐半径 r<sub>t</sub> = R<sub>*</sub>(M/m<sub>*</sub>)<sup>1/3</sup>。碎片的比能量展宽 ΔE = GMR<sub>*</sub>/r<sub>t</sub>²，被束缚的那一半按开普勒周期回落，回落率 ∝ t<sup>−5/3</sup>。这里的碎片用<b>同一个测地线积分器</b>（a = 0）从近心点出发，回落时间由数值积分得到，斜率由它们拟合。' }));
  const row = el('div', { class: 'row' }, el('label', { text: '黑洞质量', style: 'width:84px' }));
  const sel = el('select'); for (const [v, t] of [[1e6, '10⁶ M☉'], [1e7, '10⁷ M☉'], [1e5, '10⁵ M☉'], [4.297e6, 'Sgr A* 4.3×10⁶ M☉'], [1e8, '10⁸ M☉'], [6.5e9, 'M87* 6.5×10⁹ M☉']]) sel.append(el('option', { value: v, text: t }));
  sel.addEventListener('change', () => { FREE.tde.M = +sel.value; FREE.tde.sim = null; tdeSim(); tdeRender(); }); row.append(sel); p.append(row);
  numField(p, '恒星质量 (M☉)', 1, 0.1, v => { FREE.tde.ms = clamp(v, 0.05, 20); FREE.tde.sim = null; tdeSim(); tdeRender(); });
  numField(p, '恒星半径 (R☉)', 1, 0.1, v => { FREE.tde.Rs = clamp(v, 0.05, 100); FREE.tde.sim = null; tdeSim(); tdeRender(); });
  const acts = el('div', { class: 'row' });
  const go = el('button', { text: '播放碎片流', class: 'on' }); go.addEventListener('click', () => { if (!FREE.tde.sim) tdeSim(); const T = FREE.tde; if (T.sim && T.sim.ok) { T.run = !T.run; if (T.run && T.clock === 0) tdeInitDebris(); } tdeRender(); });
  const view = el('button', { text: '镜头对准碎片流' }); view.addEventListener('click', () => { const c = tdeCalc(); setState({ spin: 0, camR: clamp(c.aMin * 3.5, 30, 3e6), camIncl: 55, autoRotate: false, disk: false }, 'ui'); });
  const rst = el('button', { text: '重置' }); rst.addEventListener('click', () => { FREE.tde.run = false; tdeInitDebris(); tdeRender(); });
  acts.append(go, view, rst); p.append(acts);
  p.append(el('canvas', { id: 'tdePlot', class: 'plot' }));
  p.append(el('div', { id: 'tdeRead' }));
}
function tdeRender() {
  const T = FREE.tde, c = tdeCalc(), s = T.sim, rs = 2;
  const msg = !c.disrupts ? '<b style="color:var(--bad)">r<sub>t</sub> &lt; r<sub>s</sub>：恒星整体被吞入视界，没有可见的潮汐瓦解（M &gt; Hills 质量）。</b>' : '';
  $('tdeRead').innerHTML = `<div class="kv" style="margin-top:6px">
    <span>潮汐半径 r<sub>t</sub></span><span>${fmtNum(c.rt / Phys.K.Rsun, 4)} R☉ = ${fmtLenKm(c.rt / 1000)} = ${fmtNum(c.rtM, 4)} M</span>
    <span>r<sub>t</sub> / r<sub>s</sub></span><span><b style="color:var(--acc)">${fmtNum(c.rtOverRs, 4)}</b>（太阳型恒星 + 10⁶ M☉ → 约 23.6）</span>
    <span>Hills 质量（r<sub>t</sub> = r<sub>s</sub>）</span><span>${sci(c.MH, 3)} M☉</span>
    <span>能量展宽 ΔE</span><span>${sci(c.dE, 3)} c²　最束缚碎片 a = ${fmtNum(c.aMin, 4)} M</span>
    <span>最短回落时间 t<sub>fb</sub> = 2π a<sup>3/2</sup></span><span>${fmtNum(c.tfbM, 4)} M = ${fmtTimeS(c.tfbS)}</span>
    <span>回落率斜率 dM/dt ∝ t<sup>n</sup>（n = d ln|ε|/d ln T − 1，积分得）</span><span><b style="color:var(--acc)">n = ${s && s.ok && isFinite(s.slope) ? s.slope.toFixed(3) : '—'}</b>（理论 −5/3 = −1.667${s && s.ok && isFinite(s.slope) ? '，相差 ' + ((s.slope / (-5 / 3) - 1) * 100).toFixed(1) + '%' : ''}）</span>
    <span>碎片流时钟</span><span>${fmtNum(T.clock, 5)} M = ${fmtTimeS(T.clock * Phys.K.tg1 * T.M)}（t/t<sub>fb</sub> = ${(T.clock / c.tfbM).toFixed(2)}）</span>
  </div>${msg}${s && !s.ok ? '<div class="note">' + s.msg + '</div>' : ''}`;
  const cv = $('tdePlot'); if (!cv) return;
  if (s && s.ok && s.xs.length) {
    const lx = s.xs.map(x => (x - Math.log(s.tmin)) / Math.LN10), ly = s.ys.map(y => (y - s.ys[0]) / Math.LN10);
    const ideal = lx.map(x => -2 / 3 * x);
    plotChart(cv, { series: [{ x: lx, y: ly, color: '#ffb35c' }, { x: lx, y: ideal, color: '#6fd3ff', dash: true, w: 1.2 }], xmin: 0, xmax: Math.max(...lx), ymin: Math.min(...ly, -1.8), ymax: 0.1, xlabel: 'log₁₀(T/T_min)  ·  log₁₀(|ε|/|ε|_max)', yfmt: y => y.toFixed(1), xfmt: x => x.toFixed(1) });
  } else plotChart(cv, { series: [], xmin: 0, xmax: 1, ymin: 0, ymax: 1 });
}

/* ---------- 每帧 ---------- */
let _freeAcc = 0;
function freeTick(dt, now) {
  fallTick(dt);
  tdeTick(dt);
  if (FREE.hot.dirty && FREE.tab === 'hot' && $('freePanel').classList.contains('show') && now >= FREE.hot.due) { hotBuild(); }
  else if (FREE.hot.dirty && FREE.hot.on && now >= FREE.hot.due) { hotBuild(); }
  _freeAcc += dt;
  if ($('freePanel').classList.contains('show') && _freeAcc > 0.12) {
    _freeAcc = 0;
    if (FREE.tab === 'fall') fallRender();
    else if (FREE.tab === 'hot') hotRender();
    else if (FREE.tab === 'tde') tdeRender();
    else if (FREE.tab === 'gw') { gwDrawBinary(now); }
  } else if (FREE.tab === 'gw' && $('freePanel').classList.contains('show')) gwDrawBinary(now);
}
function freeOverlayActive() { return !!(FREE.tde.deb && (FREE.tde.run || FREE.tde.clock > 0) && FREE.tab === 'tde' && $('freePanel').classList.contains('show')); }
function freeOverlay(ctx, cam, W, H) {
  const T = FREE.tde;
  if (T.deb) {
    for (const d of T.deb) {
      const pos = Phys.blToXYZ(0, d.it.y[0], d.it.y[1], d.it.y[2]);
      const q = projectToScreen(pos, cam, W, H, S.fovY);
      if (!q || d.fallen) continue;
      const k = (d.eps + tdeCalc().dE) / (2 * tdeCalc().dE);
      ctx.fillStyle = `rgba(${Math.round(255 - 120 * k)},${Math.round(170 + 40 * k)},${Math.round(90 + 150 * k)},.85)`;
      ctx.beginPath(); ctx.arc(q.x, q.y, 2.1, 0, 7); ctx.fill();
    }
  }
}

/* ---- 99_boot.js ---- */
/* ===================================================================
 *  99_boot.js — 启动
 * =================================================================== */
function boot() {
  resize();
  RN.rw = RN.cw; RN.rh = RN.ch;
  window.addEventListener('resize', () => { resize(); stateVersion++; });
  buildUI(); buildLab(); buildS2();
  if (innerWidth < 1000 || innerHeight < 700) for (const id of ['s2Panel', 'info']) { const p = $(id); if (p) { p.classList.add('collapsed'); const t = p.querySelector('.tg'); if (t) t.textContent = '+'; } }
  if (typeof buildFree === 'function') buildFree();
  uiSync();
  if (!initGL()) {
    traceBackend = 'js';
    const ld = $('loader');
    if (ld) $('loadmsg').textContent = glReason + '：画面无法渲染，但 BH 接口仍可用（JS 后端）。';
    BH.ready = true;
    return;
  }
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); RN.running = false; const ld = document.createElement('div'); ld.id = 'ctxlost'; ld.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000c;z-index:99;color:#ffb35c;font-size:16px'; ld.textContent = 'WebGL 上下文丢失，正在恢复…'; document.body.append(ld); });
  canvas.addEventListener('webglcontextrestored', () => location.reload());
  for (const n of ['rtKerr', 'composite', 'accum', 'meter', 'expo', 'bloomPre', 'bloomDown', 'bloomUp']) startProgram(n);
  RN.running = true;
  requestAnimationFrame(frameLoop);
  const wait = () => { if (RN.ready) { BH.ready = true; setTimeout(() => toast('拖拽旋转 · 滚轮缩放 · 空格暂停 · H 隐藏界面 · 双击复位', 4200), 900); } else setTimeout(wait, 50); };
  wait();
}
boot();

})();
