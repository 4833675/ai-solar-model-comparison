<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>克尔黑洞 · 实时测地线追踪</title>
<style>
:root{
  --bg:#000; --panel:rgba(12,14,22,0.72); --panel2:rgba(20,23,36,0.86); --line:rgba(255,255,255,0.09); --line2:rgba(255,255,255,0.16);
  --txt:#e9ecf4; --dim:#9aa3b8; --faint:#6b7389; --acc:#ffb45e; --acc2:#7fd4ff; --ok:#6fe0a0; --bad:#ff6b6b; --warn:#ffd166;
  --mono: "JetBrains Mono","SF Mono","Cascadia Mono",Consolas,"Menlo",monospace;
  --sans: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Hiragino Sans GB",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font:13px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none}
canvas#gl.drag{cursor:grabbing}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud.hidden>*:not(#hint){opacity:0;pointer-events:none!important}
#hud>*{transition:opacity .25s}
.pe{pointer-events:auto}
button,select,input{font:inherit;color:inherit}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 8px 30px rgba(0,0,0,.35);overflow:hidden}
.panel>h3{margin:0;padding:9px 12px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--dim);display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
.panel>h3 .chev{margin-left:auto;transition:transform .2s;opacity:.6}
.panel.collapsed>h3{border-bottom-color:transparent}
.panel.collapsed>h3 .chev{transform:rotate(-90deg)}
.panel.collapsed>.body{display:none}
.panel>.body{padding:8px 12px 10px}
.col{position:absolute;top:64px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 150px);overflow-y:auto;overflow-x:hidden;padding:2px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.col>.panel{flex-shrink:0}
#left{left:14px;width:272px}
#right{right:14px;width:312px}
.col::-webkit-scrollbar{width:6px}.col::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
/* 顶部 */
#top{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap}
#brand{font-weight:700;letter-spacing:.04em;font-size:13px}
#brand small{font-weight:400;color:var(--dim);margin-left:6px;font-size:11px}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{background:none;border:0;padding:4px 10px;border-radius:7px;color:var(--dim);cursor:pointer;font-size:12px}
.seg button:hover{color:var(--txt)}
.seg button.on{background:rgba(255,180,94,.18);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(255,180,94,.35)}
.tbtn{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--txt);font-size:12px}
.tbtn:hover{background:rgba(255,255,255,.12)}
.tbtn.acc{background:rgba(255,180,94,.16);border-color:rgba(255,180,94,.4);color:var(--acc)}
#badges{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid}
.badge.np{color:#ffb3b3;border-color:rgba(255,107,107,.5);background:rgba(120,20,20,.45)}
.badge.info{color:var(--acc2);border-color:rgba(127,212,255,.4);background:rgba(10,40,60,.5)}
/* 预设 */
.preset{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin:0 0 6px;cursor:pointer;color:var(--txt)}
.preset:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.preset.on{border-color:rgba(255,180,94,.55);background:rgba(255,180,94,.09)}
.preset b{font-weight:600;font-size:12.5px}
.preset span{display:block;color:var(--dim);font-size:11px;font-family:var(--mono)}
/* 信息卡 */
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--dim);white-space:nowrap}
.kv dd{margin:0;text-align:right;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.kv dd .u{color:var(--faint)}
.sep{grid-column:1/-1;height:1px;background:var(--line);margin:4px 0}
.sub{grid-column:1/-1;color:var(--acc);font-size:11px;letter-spacing:.08em;margin-top:2px}
.note{color:var(--faint);font-size:11px;line-height:1.5;margin-top:6px}
.hl{color:var(--acc)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
/* 参数 */
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:0 0 74px;color:var(--dim);font-size:12px}
.row input[type=range]{flex:1;min-width:0}
.row .val{flex:0 0 64px;text-align:right;font-family:var(--mono);font-size:11.5px}
input[type=range]{-webkit-appearance:none;appearance:none;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:rgba(255,255,255,.15);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--acc);margin-top:-5px;box-shadow:0 0 0 3px rgba(255,180,94,.18)}
input[type=range]::-moz-range-track{height:3px;background:rgba(255,255,255,.15);border-radius:2px}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--acc)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.tg{display:flex;align-items:center;gap:7px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;user-select:none;font-size:12px;background:rgba(255,255,255,.03)}
.tg i{width:26px;height:14px;border-radius:7px;background:rgba(255,255,255,.18);position:relative;flex:0 0 26px;transition:background .15s}
.tg i:after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#cfd5e2;transition:left .15s}
.tg.on i{background:rgba(255,180,94,.75)}
.tg.on i:after{left:14px;background:#fff}
/* 底部时间条 */
#bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap}
#playBtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,180,94,.5);background:rgba(255,180,94,.14);color:var(--acc);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
#tDisp{font-family:var(--mono);font-size:12px;min-width:230px}
#tDisp .big{font-size:14px;color:var(--txt)}
#tDisp .u{color:var(--dim)}
#speed{width:170px}
#speedVal{font-family:var(--mono);font-size:11.5px;min-width:96px;color:var(--dim)}
/* 浮动窗口 */
.win{position:absolute;z-index:5;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:none;flex-direction:column;max-height:calc(100vh - 40px)}
.win.open{display:flex}
.win>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:move;user-select:none}
.win>header b{font-size:13.5px}
.win>header .x{margin-left:auto;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;line-height:1}
.win>.wbody{padding:12px 14px;overflow:auto}
.win table{border-collapse:collapse;width:100%;font-size:12px}
.win th,.win td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.win th{color:var(--dim);font-weight:500;font-size:11.5px}
.win td.n{font-family:var(--mono);font-size:11.5px;text-align:right;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--dim);font-size:12px}
.tabs button.on{color:var(--acc);border-color:rgba(255,180,94,.45);background:rgba(255,180,94,.1)}
.fgrid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center;font-size:12px}
.fgrid label{color:var(--dim)}
.fgrid input,.fgrid select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;font-family:var(--mono);font-size:12px;color:var(--txt)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.plist .pi{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12px;border:1px solid transparent}
.plist .pi:hover{background:rgba(255,255,255,.05)}
.plist .pi.sel{border-color:var(--line2);background:rgba(255,255,255,.06)}
.plist .sw{width:10px;height:10px;border-radius:50%;flex:0 0 10px;box-shadow:0 0 8px currentColor}
.plist .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .pr{font-family:var(--mono);font-size:11px;color:var(--dim)}
.plist .del{background:none;border:0;color:var(--faint);cursor:pointer;font-size:14px}
.plist .del:hover{color:var(--bad)}
canvas.plot{width:100%;height:170px;display:block;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px}
.mono{font-family:var(--mono)}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--line2);color:var(--dim)}
#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#000;color:var(--dim);font-size:13px;transition:opacity .5s}
#loading .ring{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,180,94,.15);border-top-color:var(--acc);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1}
.lbl{position:absolute;transform:translate(10px,-50%);font-size:11.5px;color:#ffe2b8;text-shadow:0 0 6px #000,0 0 2px #000;white-space:nowrap;font-family:var(--mono)}
.lbl.c{transform:translate(-50%,12px);color:var(--acc2)}
#hint{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);color:var(--faint);font-size:11px;white-space:nowrap}
#toast{position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:30;padding:7px 14px;border-radius:10px;background:rgba(20,24,36,.92);border:1px solid var(--line2);font-size:12.5px;opacity:0;transition:opacity .3s;pointer-events:none}
.about h4{margin:12px 0 4px;color:var(--acc);font-size:12.5px}
.about p,.about li{color:#c9cfdc;font-size:12.5px;line-height:1.65}
.about ul{margin:4px 0;padding-left:18px}
.about code{font-family:var(--mono);font-size:11.5px;color:var(--acc2)}
@media (max-width:1100px){#left{width:230px}#right{width:260px}#speed{width:110px}#tDisp{min-width:180px}#brand small{display:none}}
@media (max-width:800px){#left,#right{display:none}#hud.showside #left,#hud.showside #right{display:flex}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="hud">
  <div id="top" class="pe">
    <div id="brand">克尔黑洞<small>每个像素一条测地线 · WebGL2</small></div>
    <div class="seg" id="viewSeg">
      <button data-v="physical" class="on" title="物理视图">物理</button>
      <button data-v="grid" title="经纬网格：天空换成出射方向的经纬网">网格</button>
      <button data-v="checker" title="盘面 (r, φ) 棋盘格">棋盘</button>
      <button data-v="gmap" title="盘面红移因子 g 伪彩色">红移 g</button>
      <button data-v="steps" title="每像素积分步数">步数</button>
    </div>
    <button class="tbtn" id="btnLab">轨道实验室</button>
    <button class="tbtn" id="btnCheck">自检</button>
    <button class="tbtn" id="btnAbout">关于 / 近似</button>
    <button class="tbtn" id="btnHide" title="快捷键 H">隐藏界面</button>
  </div>
  <div id="badges"></div>
  <div id="left" class="col pe">
    <div class="panel" id="pPreset"><h3>真实黑洞预设<span class="chev">▾</span></h3><div class="body" id="presetList"></div></div>
    <div class="panel" id="pParts"><h3>轨道实验室 · 粒子<span class="chev">▾</span></h3><div class="body">
      <div class="plist" id="partList"></div>
      <div class="btnrow"><button class="tbtn acc" id="btnLab2">放置粒子…</button><button class="tbtn" id="btnClearParts">清除全部</button></div>
    </div></div>
    <div class="panel collapsed" id="pS2" style="display:none"><h3>银心 S2 恒星（真实尺度）<span class="chev">▾</span></h3><div class="body">
      <div class="row"><label>日期</label><input type="range" id="s2Year" min="1995" max="2045" step="0.001" value="2026"><span class="val" id="s2YearVal"></span></div>
      <div class="btnrow" style="margin-top:2px"><button class="tbtn" id="s2Play">▶ 播放</button><button class="tbtn" id="s2Zoom">缩放到整条轨道</button><button class="tbtn" id="s2Peri">跳到近心点</button></div>
      <dl class="kv" id="s2Info" style="margin-top:8px"></dl>
    </div></div>
    <div class="panel" id="pExtra"><h3>自由发挥 · 实验<span class="chev">▾</span></h3><div class="body">
      <div class="btnrow" style="margin-top:0" id="extraBtns"></div>
    </div></div>
  </div>
  <div id="right" class="col pe">
    <div class="panel" id="pInfo"><h3>实时数据<span class="chev">▾</span></h3><div class="body"><dl class="kv" id="info"></dl></div></div>
    <div class="panel" id="pParams"><h3>参数与开关<span class="chev">▾</span></h3><div class="body">
      <div class="row"><label>自转 a</label><input type="range" id="spin" min="0" max="0.998" step="0.001"><span class="val" id="spinVal"></span></div>
      <div class="row"><label>盘外缘</label><input type="range" id="rOut" min="8" max="60" step="0.5"><span class="val" id="rOutVal"></span></div>
      <div class="row"><label>T<sub>max</sub></label><input type="range" id="tMax" min="3000" max="20000" step="100"><span class="val" id="tMaxVal"></span></div>
      <div class="row"><label>曝光补偿</label><input type="range" id="ev" min="-5" max="5" step="0.1"><span class="val" id="evVal"></span></div>
      <div class="row"><label>视场角</label><input type="range" id="fov" min="5" max="120" step="0.5"><span class="val" id="fovVal"></span></div>
      <div class="row" title="显示映射：曝光后亮度高于拐点的部分按 L^k 压缩（保持颜色），k = 1 为纯线性。不改变任何物理量"><label>高光压缩</label><input type="range" id="hl" min="0.3" max="1" step="0.01"><span class="val" id="hlVal"></span></div>
      <div class="toggles" id="toggles"></div>
      <div class="note" id="paramNote"></div>
    </div></div>
  </div>
  <div id="bottom" class="pe">
    <button id="playBtn" title="播放 / 暂停（空格）">❚❚</button>
    <div id="tDisp"></div>
    <input type="range" id="speed" min="-5" max="5" step="0.01" title="时间速度（对数，左侧为倒放）">
    <span id="speedVal"></span>
    <button class="tbtn" id="btnRev" title="倒放">⇄</button>
  </div>
  <div id="hint">拖拽：转动相机 · 滚轮 / 双指：缩放 · H：隐藏界面 · 空格：暂停</div>
</div>

<div class="win" id="winLab" style="left:calc(50% - 300px);top:90px;width:600px">
  <header><b>轨道实验室</b><span class="pill">BL 坐标 · RK4 · 自变量 τ</span><button class="x" data-close>×</button></header>
  <div class="wbody">
    <div class="tabs" id="labTabs">
      <button data-t="circ" class="on">圆轨道</button><button data-t="pe">偏心 (p, e)</button><button data-t="gen">一般 (E, L, r₀, p<sub>θ</sub>)</button><button data-t="ex">示例</button>
    </div>
    <div id="labForm"></div>
    <div class="btnrow"><button class="tbtn acc" id="labAdd">放置粒子</button>
      <label class="tg" id="tgNewton" style="padding:4px 8px"><i></i>牛顿引力对照</label>
      <span class="note" id="labMsg" style="margin:0;align-self:center"></span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
      <div><div class="note" style="margin:0 0 4px">有效势（选中粒子）</div><canvas class="plot" id="potPlot" width="560" height="340"></canvas></div>
      <div><div class="note" style="margin:0 0 4px">选中粒子</div><dl class="kv" id="labInfo"></dl></div>
    </div>
  </div>
</div>
<div class="win" id="winCheck" style="left:calc(50% - 380px);top:70px;width:760px">
  <header><b>自检面板</b><span class="pill" id="checkSum"></span><button class="tbtn" id="checkRun" style="margin-left:8px">重新运行</button><button class="x" data-close>×</button></header>
  <div class="wbody"><div class="note" style="margin:0 0 8px">“实测”一栏全部由本页当场计算：光线用与画面相同的着色器在 GPU 上积分并读回；粒子用轨道实验室的同一个积分器。</div><table id="checkTable"></table></div>
</div>
<div class="win about" id="winAbout" style="left:calc(50% - 330px);top:70px;width:660px">
  <header><b>关于 · 近似与诚实性说明</b><button class="x" data-close>×</button></header>
  <div class="wbody" id="aboutBody"></div>
</div>
<div class="win" id="winExtra" style="left:calc(50% - 340px);top:80px;width:680px">
  <header><b id="extraTitle">实验</b><button class="x" data-close>×</button></header>
  <div class="wbody" id="extraBody"></div>
</div>
<div id="loading"><div class="ring"></div><div id="loadMsg">正在编译光线追踪着色器……（Windows 上可能需要几秒）</div></div>
<div id="toast"></div>
<script>

/* ===== core.js ===== */
'use strict';
/* ============================================================
 *  物理核心（与 DOM 无关，可单独在 Node 里测试）
 *  单位：G = c = 1，M = 1；长度以 M = GM/c² 计，时间以 GM/c³ 计
 * ============================================================ */
const PHYS = {
  GMsun: 1.32712440018e20, c: 299792458, pc: 3.0856775814913673e16, AU: 1.495978707e11,
  yr: 31557600, uas: 4.848136811e-12, Rsun: 6.957e8,
  rgKmPerMsun: 1.476625, tgSPerMsun: 4.925491e-6
};
const D2R = Math.PI / 180, R2D = 180 / Math.PI;

const PRESETS = {
  sgra:      { key: 'sgra', name: '银河系中心 Sgr A*', short: 'Sgr A*', mass: 4.297e6, distPc: 8277, distNote: '8277 pc', spin: null, incl: 90,
               note: 'GRAVITY 2022；EHT 2022 亮环直径 51.8 ± 2.3 μas', eht: { d: 51.8, err: 2.3 } },
  m87:       { key: 'm87', name: 'M87*', short: 'M87*', mass: 6.5e9, distPc: 16.8e6, distNote: '16.8 Mpc', spin: null, incl: 17,
               note: 'EHT 2019；亮环直径 42 ± 3 μas；喷流与视线夹角约 17°', eht: { d: 42, err: 3 } },
  cygx1:     { key: 'cygx1', name: '天鹅座 X-1', short: 'Cyg X-1', mass: 21.2, distPc: 2220, distNote: '2.22 kpc', spin: 0.998, incl: 80,
               note: '恒星级黑洞，高自转（Miller-Jones 等 2021）' },
  gw150914:  { key: 'gw150914', name: 'GW150914 并合产物', short: 'GW150914', mass: 63.1, distPc: 370e6, distNote: '440 Mpc（光度）/ 370 Mpc（角直径）', spin: 0.69, incl: 80,

  vec2 xy = (2. * t3 - 3. * t2 + 1.) * X0.xy + (t3 - 2. * t2 + t) * V0.xy * h + (-2. * t3 + 3. * t2) * X1.xy + (t3 - t2) * V1.xy * h;
  return vec3(xy, t);
}
#if KERR
/* 3.3 节：H = ½(|p|² − 1) − ½ f Φ²，A = −a（7.2：在自转反向的时空里正向追踪） */
void kerrDeriv(vec3 X, vec3 P, out vec3 dX, out vec3 dP, out float rOut) {
  float A = -uSpin, A2 = A * A;
  float w = dot(X, X) - A2;
  float r2 = 0.5 * (w + sqrt(w * w + 4.0 * A2 * X.z * X.z));
  float r = sqrt(r2);
  float iden = 1.0 / (r2 * r2 + A2 * X.z * X.z);
  float f = 2.0 * r * r2 * iden;
  float q = r2 + A2, iq = 1.0 / q, ir = 1.0 / r;
  vec3 l = vec3((r * X.x + A * X.y) * iq, (r * X.y - A * X.x) * iq, X.z * ir);
  float Phi = 1.0 + dot(l, P);
  dX = P - f * Phi * l;
  vec3 gr = vec3(X.x * r * r2, X.y * r * r2, X.z * r * q) * iden;
  float dfdr = (6.0 * r2 - 8.0 * r2 * r2 * r2 * iden) * iden;
  float dfdz = -4.0 * r * r2 * A2 * X.z * iden * iden;
  vec3 gf = dfdr * gr + vec3(0.0, 0.0, dfdz);
  float N = (r * X.x + A * X.y) * P.x + (r * X.y - A * X.x) * P.y;
  float xp = X.x * P.x + X.y * P.y;
  vec3 gN = gr * xp + vec3(r * P.x - A * P.y, r * P.y + A * P.x, 0.0);
  vec3 glp = gN * iq - 2.0 * r * N * gr * iq * iq + vec3(0.0, 0.0, P.z * ir) - X.z * P.z * gr * ir * ir;
  dP = 0.5 * Phi * Phi * gf + f * Phi * glp;
  rOut = r;
}
void kerrFL(vec3 X, out float f, out vec3 l) {
  float A = -uSpin, A2 = A * A, w = dot(X, X) - A2;
  float r2 = 0.5 * (w + sqrt(w * w + 4.0 * A2 * X.z * X.z)), r = sqrt(r2);
  f = 2.0 * r * r2 / (r2 * r2 + A2 * X.z * X.z);
  float q = r2 + A2;
  l = vec3((r * X.x + A * X.y) / q, (r * X.y - A * X.x) / q, X.z / r);
}
#endif

void main() {
  bool traceMode = uMode == 1;
  vec2 tn;
  if (traceMode) tn = texelFetch(uRayTex, ivec2(gl_FragCoord.xy), 0).xy;
  else {
    vec2 px = gl_FragCoord.xy + uOff;
    tn = vec2((2.0 * px.x / uRes.x - 1.0) * uTanY * uAspect, (2.0 * px.y / uRes.y - 1.0) * uTanY);
  }
  bool hard = traceMode || uHard == 1;
  bool wantGlow = !traceMode && uNP > 0;
  float a = uSpin;
  float n2 = 1.0 + dot(tn, tn), nn = sqrt(n2);
  vec3 d = (uCamF + tn.x * uCamR + tn.y * uCamU) / nn;
  float dop = 1.0;
  if (uBoost.w > 0.0) {             // 光行差：下落观察者的视线 → 静止观察者标架
    vec3 m = uBoost.xyz; float b = uBoost.w, c1 = dot(d, m);
    vec3 pp = d - c1 * m; float pl = length(pp);
    float cs = (c1 - b) / (1.0 - b * c1), sn = sqrt(max(1.0 - cs * cs, 0.0));
    d = cs * m + (pl > 1e-9 ? pp / pl : vec3(0.0)) * sn;
    dop = (1.0 + b * cs) / sqrt(1.0 - b * b);
  }
  float dmin = 1e9;
  bool wantD = traceMode && uNP > 0;

  int fate = F_BUDGET, steps = 0, nCross = 0, nHit = 0;
  vec4 hitA = vec4(0.0), hitB = vec4(0.0);     // 盘命中：(r, φ, α, 0)
  float xi = 0.0;
  vec3 outDir = d;
  vec3 glow = vec3(0.0);
  float trans = 1.0;
  bool diskOn = uDiskOn == 1;

  if (uLensing == 0) {
    /* 引力透镜关闭：直线；盘是平盘，黑洞是半径 r_h 的黑球 */
    vec3 P0 = uCamPos;
    float tS = 1e30, tP = 1e30;
    float bq = dot(P0, d), cq = dot(P0, P0) - uRh * uRh, disc = bq * bq - cq;
    if (disc > 0.0) { float t1 = -bq - sqrt(disc); if (t1 > 0.0) tS = t1; }
    if (abs(d.z) > 1e-9) { float t = -P0.z / d.z; if (t > 0.0) tP = t; }
    xi = -(P0.x * d.y - P0.y * d.x);
    float tEnd = min(tS, 4.0 * uCamRc + 200.0);
    if (wantD) dmin = segDist(P0, P0 + min(tEnd, tP) * d, uPPos[0].xyz);
    if (tP < tS) {
      nCross = 1;
      vec2 xy = P0.xy + tP * d.xy;
      float rr = sqrt(max(dot(xy, xy) - a * a, 0.0));
      if (diskOn && rr >= uRin && rr <= uRout) {
        fate = F_DISK; hitA = vec4(rr, atan(xy.y, xy.x), 1.0, 0.0); nHit = 1;
        if (wantGlow) glow += segGlow(P0, P0 + tP * d);
      }
    }
    if (fate != F_DISK) {
      if (wantGlow) glow += segGlow(P0, P0 + tEnd * d);
      fate = tS < 1e29 ? F_HORIZON : F_ESCAPE;
    }
  } else {
    bool atCam = uCamRc <= uRb;
    vec3 X = uCamPos;
    bool skip = false;
    if (!atCam) {
      /* 7.10：相机在包围球外，先解析求出交点（无相消的写法） */
      float tt = dot(tn, tn);
      vec3 c = (uCamRc / n2) * (-tt * uCamF + tn.x * uCamR + tn.y * uCamU);
      float b = length(c);
      if (b >= uRb) {
        float al = (2.0 / b) * (1.0 + 1.0 / nn);       // 不进入包围球：一阶弱场偏折
        outDir = normalize(d * cos(al) - (c / b) * sin(al));
        xi = -(c.x * d.y - c.y * d.x);
        fate = F_ESCAPE; skip = true;
      } else X = c - sqrt(uRb * uRb - b * b) * d;
    }
    if (!skip) {
#if KERR == 0
      /* ---- 3.2 节：史瓦西快速路径 ---- */
      vec3 V;
      if (atCam) {
        vec3 rh = normalize(X); float s = sqrt(1.0 - 2.0 / length(X));
        V = d + (s - 1.0) * dot(d, rh) * rh;
      } else V = d;
      vec3 Lv = cross(X, V);
      float hh2 = dot(Lv, Lv);
      float rx = length(X);
      float vinf = sqrt(max(dot(V, V) - 2.0 * hh2 / (rx * rx * rx), 1e-12));
      xi = -Lv.z / vinf;
      for (int i = 0; i < MAXS; i++) {
        if (i >= uMaxSteps) break;
        float r2 = dot(X, X), r = sqrt(r2);
        if (r < 2.0) { fate = F_HORIZON; break; }
        if (r > uResc && dot(X, V) > 0.0) { fate = F_ESCAPE; outDir = normalize(V); break; }
        float h = kStep(r, 2.0) / length(V);
        vec3 a1 = -3.0 * hh2 * X / (r2 * r2 * r);
        vec3 X2 = X + 0.5 * h * V, V2 = V + 0.5 * h * a1;
        float q2 = dot(X2, X2); vec3 a2 = -3.0 * hh2 * X2 / (q2 * q2 * sqrt(q2));
        vec3 X3 = X + 0.5 * h * V2, V3 = V + 0.5 * h * a2;
        float q3 = dot(X3, X3); vec3 a3 = -3.0 * hh2 * X3 / (q3 * q3 * sqrt(q3));
        vec3 X4 = X + h * V3, V4 = V + h * a3;
        float q4 = dot(X4, X4); vec3 a4 = -3.0 * hh2 * X4 / (q4 * q4 * sqrt(q4));
        vec3 Xn = X + h * (V + 2.0 * V2 + 2.0 * V3 + V4) / 6.0;
        vec3 Vn = V + h * (a1 + 2.0 * a2 + 2.0 * a3 + a4) / 6.0;
        steps = i + 1;
        if (wantD) dmin = min(dmin, segDist(X, Xn, uPPos[0].xyz));
        bool stop = false;
        if (X.z * Xn.z < 0.0) {
          nCross++;
          vec3 ci = crossInterp(X, Xn, V, Vn, h);
          float rr = length(ci.xy);
          if (diskOn && rr >= uRin && rr <= uRout) {
            float al = hard ? 1.0 : diskAlpha(rr);
            vec4 hh = vec4(rr, atan(ci.y, ci.x), al, 0.0);
            if (nHit == 0) hitA = hh; else hitB = hh;
            nHit++;
            if (wantGlow) glow += trans * segGlow(X, mix(X, Xn, ci.z));
            trans *= 1.0 - al;
            if (hard || trans < 0.02 || nHit >= 2) { fate = F_DISK; stop = true; }
          }
        }
        if (stop) break;
        if (wantGlow) glow += trans * segGlow(X, Xn);
        X = Xn; V = Vn;
      }
#else
      /* ---- 3.3 节：Kerr–Schild 哈密顿形式 ---- */
      vec3 D = d;
      float f0; vec3 l0;
      kerrFL(X, f0, l0);
      if (!atCam) {        // 7.10：交点处没有静止观察者，先把横向分量乘 √(1−f)
        vec3 rr0 = normalize(X); float dp = dot(d, rr0);
        D = normalize(dp * rr0 + sqrt(max(1.0 - f0, 1e-6)) * (d - dp * rr0));
      }
      float s = sqrt(max(1.0 - f0, 1e-6)), cc = dot(l0, D);
      vec3 P = (D + l0 * ((s - 1.0) * cc + f0 * (1.0 + cc) / s)) / s;
      xi = -(X.x * P.y - X.y * P.x);
      vec3 dX, dP; float r;
      kerrDeriv(X, P, dX, dP, r);
      for (int i = 0; i < MAXS; i++) {
        if (i >= uMaxSteps) break;
        if (r < uRh) { fate = F_HORIZON; break; }
        if (r > uResc && dot(X, dX) > 0.0) { fate = F_ESCAPE; outDir = normalize(dX); break; }
        float h = kStep(r, uRh);
        vec3 k2x, k2p, k3x, k3p, k4x, k4p; float rq;
        kerrDeriv(X + 0.5 * h * dX, P + 0.5 * h * dP, k2x, k2p, rq);
        kerrDeriv(X + 0.5 * h * k2x, P + 0.5 * h * k2p, k3x, k3p, rq);
        kerrDeriv(X + h * k3x, P + h * k3p, k4x, k4p, rq);
        vec3 Xn = X + h * (dX + 2.0 * k2x + 2.0 * k3x + k4x) / 6.0;
        vec3 Pn = P + h * (dP + 2.0 * k2p + 2.0 * k3p + k4p) / 6.0;
        vec3 dXn, dPn; float rn;
        kerrDeriv(Xn, Pn, dXn, dPn, rn);
        steps = i + 1;
        if (wantD) dmin = min(dmin, segDist(X, Xn, uPPos[0].xyz));
        bool stop = false;
        if (X.z * Xn.z < 0.0) {
          nCross++;
          vec3 ci = crossInterp(X, Xn, dX, dXn, h);
          float rr = sqrt(max(dot(ci.xy, ci.xy) - a * a, 0.0));   // 7.6：要减 a²
          if (diskOn && rr >= uRin && rr <= uRout) {
            float al = hard ? 1.0 : diskAlpha(rr);
            vec4 hh = vec4(rr, atan(ci.y, ci.x), al, 0.0);
            if (nHit == 0) hitA = hh; else hitB = hh;
            nHit++;
            if (wantGlow) glow += trans * segGlow(X, mix(X, Xn, ci.z));
            trans *= 1.0 - al;
            if (hard || trans < 0.02 || nHit >= 2) { fate = F_DISK; stop = true; }
          }
        }
        if (stop) break;
        if (wantGlow) glow += trans * segGlow(X, Xn);
        X = Xn; P = Pn; dX = dXn; dP = dPn; r = rn;
      }
#endif
    }
  }
  if (traceMode) {
    float phd = hitA.y * 57.29577951;
    if (phd <= -180.0) phd += 360.0;
    o0 = vec4(float(fate), hitA.x, phd, nHit > 0 ? gFactor(hitA.x, xi) : 0.0);
    o1 = vec4(outDir, xi);
    o2 = vec4(float(steps), float(nCross), dmin, 1.0);
    o3 = vec4(0.0);
    return;
  }
  if (!(glow.r < 1e6 && glow.g < 1e6 && glow.b < 1e6)) glow = vec3(0.0);
  o0 = vec4(float(fate), hitA.x, hitA.y, float(nHit));
  o1 = vec4(outDir, xi);
  o2 = vec4(float(steps), float(nCross), hitB.x, hitB.y);
  o3 = vec4(glow, dop);
}`;

/* ---- ② 着色 pass ---- */
const SH_SHADE_FS = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
#define F_HORIZON 0
#define F_DISK 1
#define F_ESCAPE 2
uniform sampler2D uG0, uG1, uG2, uG3;
uniform float uAzOff;            // 当前 φc 与积分时 φc 之差（弧度）
uniform float uSpin, uRin, uRout;
uniform int uView, uDoppler, uStarsOn, uMaxSteps;
uniform float uTmax, uTcam, uDiskNorm;
uniform vec4 uTexCyc;            // (cycle0, s0, cycle1, s1)
uniform float uTexPeriod;
uniform sampler2D uTLut;
uniform float uLutLogSpan;
uniform vec4 uBB[21];
uniform float uBBT[21];
uniform vec4 uHot;               // r, φ, σ, 振幅（0 = 关）
uniform vec4 uTgt;               // 微引力透镜目标星方向 xyz、角半径 w（0 = 关）
uniform float uTgtI;
uniform float uSkyGain;
uniform highp sampler3D uNoise;     // 64³ 随机值纹理（三线性 = 便宜的值噪声）
uniform samplerCube uSkyCube;       // 预先烘焙的银河带（带 mipmap）
uniform sampler2D uStarLut;         // 恒星颜色（由 2.5 节黑体表生成）
uniform float uCubeTexel;
uniform float uWeight;             // 抗锯齿：两个子像素样本各占一半
out vec4 oCol;
const float PI = 3.14159265358979;
float gDop = 1.0;

uvec3 pcg3d(uvec3 v) {
  v = v * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> 16u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}
float hash1(vec3 i) { uvec3 u = pcg3d(uvec3(ivec3(i) + 1048576)); return float(u.x >> 8u) * (1.0 / 16777216.0); }
float vnoise(vec3 p) { return textureLod(uNoise, p * (1.0 / 64.0), 0.0).r; }
float fbm(vec3 p, int oct) {       // 均值 0.5（7.18）
  float s = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 6; i++) {
    if (i >= oct) break;
    s += a * vnoise(p); n += a;
    p = p * 2.03 + vec3(17.1, 31.7, 7.3); a *= 0.5;
  }
  return s / n;
}
/* 2.5 节黑体表：温度之间线性插值（对 logY 插值） */
vec4 bbLookup(float T) {
  if (T <= 1000.0) { vec4 c = uBB[0]; c.w = 1.32 - 10370.0 / max(T, 1.0); return c; }
  if (T >= 40000.0) return uBB[20];
  vec4 res = uBB[20];
  for (int i = 0; i < 20; i++) {
    if (T < uBBT[i + 1]) { float f = (T - uBBT[i]) / (uBBT[i + 1] - uBBT[i]); res = mix(uBB[i], uBB[i + 1], f); break; }
  }
  return res;
}
vec3 bbRad(float T) {   // 3.5 节：RGB / Y(RGB) · 10^logY（不另乘 g⁴）
  vec4 c = bbLookup(T);
  float Y = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
  return c.rgb / max(Y, 1e-6) * exp2(max(c.w, -30.0) * 3.3219281);
}
float diskTnorm(float r) {
  float u = clamp(log(max(r, uRin) / uRin) / uLutLogSpan, 0.0, 1.0);
  return textureLod(uTLut, vec2((u * 1023.0 + 0.5) / 1024.0, 0.5), 0.0).r;
}
float gFactor(float r, float xi) {
  float x = pow(r, -1.5);
  return sqrt(max(1.0 - 3.0 / r + 2.0 * uSpin * x, 1e-6)) / max(1.0 + (uSpin - xi) * x, 1e-4);
}
float diskAlpha(float r) {
  float aOut = 1.0 - smoothstep(uRout * 0.93, uRout, r);
  float aIn = smoothstep(uRin, uRin * 1.02, r);
  return aOut * aIn;
}
/* 7.11：两套相位错开半个周期的纹理，各存活一个周期，三角波权重交替；噪声坐标用 (cosφ, sinφ) */
float diskTexture(float r, float phi) {
  float Om = 1.0 / (pow(r, 1.5) + uSpin);
  float lr = log(r);
  float acc = 0.0;
  for (int j = 0; j < 2; j++) {
    float cyc = j == 0 ? uTexCyc.x : uTexCyc.z;
    float s = j == 0 ? uTexCyc.y : uTexCyc.w;
    float w = 1.0 - abs(2.0 * s / uTexPeriod - 1.0);
    float ph = phi - Om * s;
    vec3 seed = vec3(hash1(vec3(cyc, float(j), 7.0)), hash1(vec3(cyc, float(j), 13.0)), hash1(vec3(cyc, float(j), 29.0))) * 300.0;
    float cp = cos(ph), sp = sin(ph);
    float n = fbm(vec3(cp * 3.2, sp * 3.2, lr * 10.0) + seed, 5);
    float n2 = vnoise(vec3(cp * 1.3, sp * 1.3, lr * 3.0) + seed.zxy);
    acc += w * (0.68 * n + 0.32 * n2);
  }
  float v = clamp(acc, 0.0, 1.0);
  float t = 0.2 + 3.4 * pow(v, 2.2);
  if (uHot.w > 0.0) {
    float d2 = r * r + uHot.x * uHot.x - 2.0 * r * uHot.x * cos(phi - uHot.y);
    t *= 1.0 + uHot.w * exp(-0.5 * d2 / (uHot.z * uHot.z));
  }
  return t;
}
vec3 diskEmission(float r, float phi, float g) {
  float T = uTmax * diskTnorm(r);
  float gc = uDoppler == 1 ? g * uTcam * gDop : 1.0;
  return bbRad(max(gc * T, 1.0)) * uDiskNorm * diskTexture(r, phi);
}
vec3 diagDisk(float r, float phiDeg, float g) {
  if (uView == 2) {          // checker：径向边界在整数 r，角向每 30°；固定在坐标系上
    float par = mod(floor(r) + floor(phiDeg / 30.0), 2.0);
    return par < 0.5 ? vec3(0.96, 0.88, 0.62) : vec3(0.20, 0.10, 0.07);
  }
  if (uView == 3) {          // gmap
    float t = min(1.0, abs(g - 1.0) / 0.5);
    return g >= 1.0 ? mix(vec3(1.0), vec3(0.1, 0.3, 1.0), t) : mix(vec3(1.0), vec3(1.0, 0.15, 0.05), t);
  }
  float k = 0.80 + 0.20 * cos(2.0 * PI * r);   // grid 视图里的盘
  return vec3(0.98, 0.80, 0.50) * k;
}
/* ---------- 程序化天球：恒星（方向空间格子 + 哈希）+ 银河带 ---------- */
vec3 starLayer(vec3 dir, float fp, float N, float prob, float F0, uint layer, float band) {
  vec3 ad = abs(dir); uint face; vec2 uv;
  if (ad.x >= ad.y && ad.x >= ad.z) { face = dir.x > 0.0 ? 0u : 1u; uv = dir.yz / ad.x; }
  else if (ad.y >= ad.z) { face = dir.y > 0.0 ? 2u : 3u; uv = dir.xz / ad.y; }
  else { face = dir.z > 0.0 ? 4u : 5u; uv = dir.xy / ad.z; }
  vec2 gq = (uv * 0.5 + 0.5) * N;
  vec2 cell = floor(gq), f = gq - cell;
  float jac = 1.0 / (1.0 + dot(uv, uv));
  float cellAng = 2.0 / N * jac;
  uvec3 h = pcg3d(uvec3(uint(cell.x) + face * 4099u, uint(cell.y) + layer * 8209u, face * 31u + layer * 977u + 12345u));
  vec3 rnd = vec3(h >> 8u) * (1.0 / 16777216.0);
  float rnd4 = float((h.x ^ h.y ^ h.z) >> 8u) * (1.0 / 16777216.0);
  float p = prob * (1.0 + 2.0 * band);
  float flux = F0 * min(pow(max(rnd4, 1e-4), -1.6), 150.0);
  float sig = max(0.55 * fp, 0.00020);
  vec3 col = vec3(0.0);
  vec3 sc = textureLod(uStarLut, vec2(fract(rnd.y * 37.13 + rnd.z * 11.7), 0.5), 0.0).rgb * 2.0;
  if (rnd.x < p) {
    vec2 c = 0.15 + 0.7 * rnd.yz;
    float dA = length(f - c) * cellAng;
    col = sc * flux / (6.2831853 * sig * sig) * exp(-0.5 * dA * dA / (sig * sig));
  }
  float wRes = smoothstep(0.3, 0.9, fp / cellAng);   // 分辨不出时换成该层的平均亮度（透镜把天空压缩处）
  vec3 mean = vec3(0.92, 0.95, 1.0) * p * F0 * 18.0 / (cellAng * cellAng);
  return mix(col, mean, wRes);
}
vec3 milkyWay(vec3 dir) {
  const vec3 gN = vec3(-0.2934, 0.4108, 0.8632);
  const vec3 gC = vec3(0.8135, 0.5810, 0.0);
  float b = dot(dir, gN);

}

function initCamera(cv) {

    if (!ptrs.has(e.pointerId)) return;
    const p0 = ptrs.get(e.pointerId), dx = e.clientX - p0.x, dy = e.clientY - p0.y;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (APP.fallLock) return;

    } else if (ptrs.size === 2) {

  const up = e => { ptrs.delete(e.pointerId); if (!ptrs.size) { APP.dragging = false; cv.classList.remove('drag'); } pinch0 = 0; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => {
    e.preventDefault(); if (APP.fallLock) return;
    const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
    applyState({ camR: S.camR * Math.exp(dy * 0.0012) });

}

/* ---------------- 主循环 ---------------- */
const PERF = { ema: 16.7, lastAdj: 0, lastDrop: -1e9, ceil: 1, ceilT: 0 };
function adaptScale(dtMs, now) {
  PERF.ema = PERF.ema * 0.92 + dtMs * 0.08;
  if (S.view !== 'physical' || now - PERF.lastAdj < 400) return;
  let s = R.scale;
  if (now > PERF.ceilT) PERF.ceil = 1;
  // 交互（拖拽、改参数、有运动粒子）时才需要每帧积分：让积分 pass 控制在 ~11 ms 以内

  else if (PERF.ema < 17.4 && now - PERF.lastDrop > 4000) s += 0.04;
  s = clamp(s, 0.5, Math.min(1, PERF.ceil));

  if (!R.ok) return;

/* ============================================================
 *  轨道实验室：有质量测试粒子（3.7 节），CPU 双精度
 * ============================================================ */
const PCOLORS = [[1.0, 0.55, 0.25], [0.35, 0.8, 1.0], [0.6, 1.0, 0.45], [1.0, 0.4, 0.75], [1.0, 0.9, 0.35], [0.7, 0.55, 1.0], [0.3, 1.0, 0.85], [1.0, 0.65, 0.6]];
const LAB_ETA = 0.01;
function blToWorld(a, r, th, ph) { const R = Math.sqrt(r * r + a * a), s = Math.sin(th); return [R * s * Math.cos(ph), R * s * Math.sin(ph), r * Math.cos(th)]; }
/* 有效势：给定 (a, L, Q)，R(r) = 0 时的能量（较大的根）；a = 0 时退化为 √((1−2/r)(1+(L²+Q)/r²)) */
function effPot(r, a, L, Q) {
  const D = r * r - 2 * r + a * a, A = (r * r + a * a) * (r * r + a * a) - D * a * a;
  const B = -4 * a * L * r, C = a * a * L * L - D * (r * r + L * L + Q);
  const disc = B * B - 4 * A * C; if (disc < 0) return NaN;
  return (-B + Math.sqrt(disc)) / (2 * A);
}
class Particle {
  constructor(o) {
    this.a = o.a; this.E = o.E; this.L = o.L; this.name = o.name; this.col = o.col; this.kind = o.kind || '';
    this.rh = radii(this.a).horizon;
    const th0 = (o.th0 == null ? 90 : o.th0) * D2R;
    let pr2 = o.circular ? 0 : geoPr2(this.a, this.E, this.L, o.r0, th0, o.pth || 0);
    this.ok = pr2 >= -1e-10 && o.r0 > this.rh;
    pr2 = Math.max(pr2, 0);
    this.s = new Float64Array([o.r0, th0, 0, o.t0, (o.prSign >= 0 ? 1 : -1) * Math.sqrt(pr2), o.pth || 0]);
    this.Q = carterQ(this.a, this.E, this.L, th0, o.pth || 0);
    this.tau = 0; this.alive = this.ok; this.plunged = false; this.tauPlunge = null;
    this.trail = [{ p: blToWorld(this.a, o.r0, th0, 0), t: o.t0 }];
    this.peri = []; this.rMin = o.r0; this.rMax = o.r0;
    this.wk = geoWork(); this.n = new Float64Array(6); this.tmp = new Float64Array(6); this.d = new Float64Array(6);
    // 牛顿对照：同样的初始位置与初始速度（dr/dτ、r·dθ/dτ、L/(r sinθ)），在牛顿引力下积分——束缚时是一个不进动的闭合椭圆
    this.newton = null;
    if (o.newton) {
      const r = o.r0, d0 = new Float64Array(6);
      geoDeriv(this.a, this.E, this.L, this.s, d0);
      const vr = d0[0], vth = r * d0[1], vphi = this.L / (r * Math.sin(th0));
      if (vr * vr + vth * vth + vphi * vphi < 2 / r) {
        const st = Math.sin(th0), ct = Math.cos(th0);
        const er = [st, 0, ct], et = [ct, 0, -st], ep = [0, 1, 0];
        this.newton = { x: [r * st, 0, r * ct], v: [0, 1, 2].map(j => vr * er[j] + vth * et[j] + vphi * ep[j]), t: o.t0, trail: [] };
        this.newton.trail.push({ p: this.newton.x.slice(), t: o.t0 });
      }
    }
  }
  pos() { return blToWorld(this.a, this.s[0], this.s[1], this.s[2]); }
  advance(tT, budget) {
    if (!this.alive) return;
    const a = this.a, E = this.E, L = this.L, s = this.s, n = this.n, d = this.d, wk = this.wk, tmp = this.tmp;
    const rStop = this.rh + 0.01;
    for (let it = 0; it < budget; it++) {
      const rem = tT - s[3];
      if (Math.abs(rem) < 1e-9 * Math.max(1, Math.abs(tT))) break;
      geoDeriv(a, E, L, s, d);
      const dir = rem > 0 ? 1 : -1;
      let h = geoStep(s[0], this.rh, LAB_ETA) * dir;
      if (Math.abs(h * d[3]) > Math.abs(rem)) h = rem / d[3];
      geoRK4(a, E, L, s, h, n, wk);
      if (n[0] < rStop) {
        const x = geoRoot(a, E, L, s, h, q => q[0] - rStop, s[0] - rStop, n[0] - rStop, wk, tmp);
        geoRK4(a, E, L, s, x, n, wk);
        this.tau += x; s.set(n); this.alive = false; this.plunged = true; this.tauPlunge = this.tau;
        this.trail.push({ p: this.pos(), t: s[3] });
        break;
      }
      if (h > 0 && s[4] < 0 && n[4] >= 0) {
        const x = geoRoot(a, E, L, s, h, q => q[4], s[4], n[4], wk, tmp);
        this.peri.push({ phi: tmp[2], t: tmp[3], r: tmp[0] });
      }
      s.set(n); this.tau += h;
      if (s[0] < this.rMin) this.rMin = s[0];
      if (s[0] > this.rMax) this.rMax = s[0];
      // 轨迹点
      const P = this.pos(), T = this.trail;
      if (h > 0) {
        const last = T[T.length - 1].p, dd = Math.hypot(P[0] - last[0], P[1] - last[1], P[2] - last[2]);
        if (dd > Math.max(0.04 * s[0], 0.03)) { T.push({ p: P, t: s[3] }); if (T.length > 5000) T.splice(0, T.length - 5000); }
      }
    }
    if (tT < this.trail[this.trail.length - 1].t) {      // 倒放：去掉“未来”的轨迹点与近心点事件
      while (this.trail.length > 1 && this.trail[this.trail.length - 1].t > s[3]) this.trail.pop();
      while (this.peri.length && this.peri[this.peri.length - 1].t > s[3]) this.peri.pop();
    }
    if (this.newton) this.advanceNewton(tT, budget);
  }
  advanceNewton(tT, budget) {
    const N = this.newton;
    const acc = x => { const r = Math.hypot(x[0], x[1], x[2]), c = -1 / (r * r * r); return [c * x[0], c * x[1], c * x[2]]; };
    for (let it = 0; it < budget; it++) {
      const rem = tT - N.t; if (Math.abs(rem) < 1e-9) break;
      const r = Math.hypot(...N.x); if (r < 0.5) break;
      let h = Math.sign(rem) * Math.min(0.01 * Math.pow(r, 1.5), Math.abs(rem));
      const x = N.x, v = N.v;
      const a1 = acc(x), x2 = x.map((q, j) => q + 0.5 * h * v[j]), v2 = v.map((q, j) => q + 0.5 * h * a1[j]);
      const a2 = acc(x2), x3 = x.map((q, j) => q + 0.5 * h * v2[j]), v3 = v.map((q, j) => q + 0.5 * h * a2[j]);
      const a3 = acc(x3), x4 = x.map((q, j) => q + h * v3[j]), v4 = v.map((q, j) => q + h * a3[j]);
      const a4 = acc(x4);
      N.x = x.map((q, j) => q + h * (v[j] + 2 * v2[j] + 2 * v3[j] + v4[j]) / 6);
      N.v = v.map((q, j) => q + h * (a1[j] + 2 * a2[j] + 2 * a3[j] + a4[j]) / 6);
      N.t += h;
      if (h > 0) { const last = N.trail[N.trail.length - 1].p; if (Math.hypot(N.x[0] - last[0], N.x[1] - last[1], N.x[2] - last[2]) > Math.max(0.04 * r, 0.03)) { N.trail.push({ p: N.x.slice(), t: N.t }); if (N.trail.length > 4000) N.trail.splice(0, N.trail.length - 4000); } }
    }
    if (tT < N.trail[N.trail.length - 1].t) while (N.trail.length > 1 && N.trail[N.trail.length - 1].t > N.t) N.trail.pop();
  }
  precession() {
    const P = this.peri; if (P.length < 2) return null;
    const n = P.length - 1;
    return { last: (P[n].phi - P[n - 1].phi - 2 * Math.PI) * R2D, total: (P[n].phi - P[0].phi - 2 * Math.PI * n) * R2D, n };
  }
}

<li>a = 0：3.2 节的快速路径（u″ + u = 3u² 的笛卡尔形式）；a > 0：3.3 节 Kerr–Schild 笛卡尔坐标下的哈密顿形式，<b>在自转反向的时空里正向追踪</b>（A = −a），光线穿过视界时所有量保持有限。</li>
<li>相机是静止观察者，起步用当地标架（3.2 / 3.3 节公式）。相机在 1000 M 以外时，先解析求出视线与半径 1000 M 的包围球的交点再积分（7.10），没进入包围球的光线按一阶弱场偏折修正出射方向。</li>
<li>步长 h = min(k·r, 0.5·max(r − r<sub>h</sub>, 0.04))，k = 0.08；远场把 k 放大到至多 4 倍（√(r/40)）；另加一条只在高自转贴视界时起作用的限制 3k(r − r<sub>h</sub>) + 0.006，使 a = 0.998 的顺行阴影边界收敛到 −2.11。</li>
<li>穿盘检测用相邻两步 z 变号，交点用三次 Hermite 插值（利用两端的 dx/dλ），r<sub>hit</sub> = √(x² + y² − a²)。</li>
<li><code>BH.trace</code> 把同一个积分着色器渲染到 RGBA32F 纹理再 readPixels 读回（traceBackend = 'gpu'）。</li>
<li>渲染分两遍：积分 pass 把每条光线的结局（落入 / 命中盘的 r、φ / 出射方向、ξ、步数）写进 G-buffer，着色 pass 再算黑体颜色、纹理与星空。时空和盘都是轴对称的，所以只有相机方位角 φ<sub>c</sub> 变化（自动环绕）或只有时间在走时，不必重新积分——把上一次的结果绕 z 轴转同样的角度即可，这是精确的。参数一变就按自适应分辨率（0.5–1×）每帧重积分；停下来以后分条带补算全分辨率，再补一个子像素样本做 2× 抗锯齿。有运动的测试粒子时每帧都重积分（它们是光线追踪的一部分）。</li>
<li>盘温度：Novikov–Thorne / Page–Thorne 相对论剖面（diskModel = 'NT'），颜色按 2.5 节的黑体表，T<sub>obs</sub> = g·T，亮度用 RGB/Y·10<sup>logY</sup>，没有另乘 g⁴。</li>
<li>测试粒子：Boyer–Lindquist 坐标、固有时为自变量的 RK4，双精度，步长 ∝ r<sup>1.5</sup>，靠近视界按 (r − r<sub>h</sub>) 收紧，r &lt; r<sub>h</sub> + 0.01 停止。</li>
</ul>
<h4>必须说明的近似</h4>
<ul>
<li><b>T<sub>max</sub> 是人为选的显示参数</b>（默认 7000 K）。真实超大质量黑洞吸积盘的峰值温度在紫外；银心和 M87 周围的气体甚至不是这种几何薄、光学厚的盘。盘的亮度也按 T<sub>max</sub> 处的亮度归一（方便曝光），绝对亮度没有意义。</li>
<li><b>冻结时间近似</b>：算一帧时假设光线穿过场景期间盘和粒子不动，忽略光行时差。</li>
<li><b>星空是程序化生成的</b>（方向空间格子 + 哈希 + fbm 银河带），不是真实星图。星光没有按相机处的引力蓝移改变颜色。</li>
<li><b>相机是静止观察者</b>，没有模拟相机自身运动带来的光行差（“跳进视界”实验除外，那里显式加入了下落观察者的光行差与多普勒）。渲染时盘的颜色乘了相机处的蓝移因子 1/√(1 − f<sub>cam</sub>)（R<sub>c</sub> = 30 时约 1.035）；<code>BH.trace</code> 返回的 g 不含这个因子（相对无穷远）。</li>
<li>关闭“多普勒与红移”（g ≡ 1，《星际穿越》的做法）或“引力透镜”（光线走直线）时，画面是<b>非物理</b>的，界面上会标注。</li>
<li>粒子本体是光线追踪的一部分（光线每一步检查到粒子的距离并累加高斯光斑，所以会出现透镜拉长的像和爱因斯坦环）。但粒子的位置用 x = √(r² + a²) sinθ cosφ … 放进场景，忽略了 Kerr–Schild 方位角与 Boyer–Lindquist φ 之间只依赖 r 的差（a = 0 时没有这个问题）。<b>轨迹线</b>与 S2 轨道是按平直空间投影画的叠加层（基础做法），只对黑洞正后方阴影内的部分做了遮挡变暗。</li>
<li>盘的内外缘在物理视图中做了约 2% / 7% 的软边（只影响着色；诊断视图与 <code>BH.trace</code> 按硬边处理）。</li>
<li>S2 的天球位置用开普勒根数；进动角由同一个粒子积分器按 a = 0 计算。Sgr A* 的自转轴方向未知，这里让它指北只是约定。</li>
<li>显示映射：自动曝光（取亮度的 99.5% 分位）→ 高光压缩（曝光后亮度高于 0.03 的部分按 L<sup>k</sup> 压缩、保持颜色比例；默认 k = 0.7，参数面板可调到 1 = 纯线性）→ ACES 色调映射 → sRGB。这只是“怎样把几百倍的亮度差放进一块屏幕”的选择：盘的温度、颜色、g 以及左右亮度的先后次序都没有改变，多普勒集束没有被“修掉”；<code>BH.trace</code> 与诊断视图完全不经过它。</li>
</ul>
<h4>坐标约定（3.1 节）</h4>
<p>+Z 为自转轴；φ<sub>c</sub> = 0 时屏幕右方 = +Y。三连自检：网格视图里阴影偏右、左缘更平；红移视图里盘左半边（靠近水平线处）偏蓝；播放时黑洞前方（屏幕下半部）的盘面纹理从左向右流动。</p>
<h4>操作</h4>
<p>拖拽转动相机，滚轮或双指缩放（R<sub>c</sub> ∈ [3, 3×10⁵] M）；空格暂停；H 隐藏界面。验收接口：<code>window.BH</code>（见规格书 6.6 节）。</p>
`;

/* ===== extras.js ===== */
/* ============================================================
 *  第 9 节 自由发挥：五个实验
 *  每个实验都用主场景的同一个积分器 / 同一条光线追踪管线，数字当场计算
 * ============================================================ */
function plotXY(cv, series, o = {}) {
  const g = cv.getContext('2d'), W = cv.width, H = cv.height, L = 58, Rm = 14, T = 14, B = 34;
  g.clearRect(0, 0, W, H);
  let xs = [], ys = [];
  for (const s of series) { xs = xs.concat(s.x.filter(isFinite)); ys = ys.concat(s.y.filter(isFinite)); }
  if (!xs.length) return;
  let [x0, x1] = o.xlim || [Math.min(...xs), Math.max(...xs)], [y0, y1] = o.ylim || [Math.min(...ys), Math.max(...ys)];
  if (y1 - y0 < 1e-12) { y0 -= 1; y1 += 1; }
  if (!o.ylim) { const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad; }
  const X = x => L + (W - L - Rm) * (x - x0) / (x1 - x0), Y = y => H - B - (H - B - T) * (y - y0) / (y1 - y0);
  g.strokeStyle = 'rgba(255,255,255,0.12)'; g.fillStyle = 'rgba(255,255,255,0.55)'; g.font = '17px sans-serif'; g.lineWidth = 1;
  const tick = (a, b, n) => { const st = Math.pow(10, Math.floor(Math.log10((b - a) / n))); const m = [1, 2, 5, 10].find(k => (b - a) / (st * k) <= n) * st; const r = []; for (let v = Math.ceil(a / m) * m; v <= b + 1e-9 * m; v += m) r.push(+v.toPrecision(10)); return r; };
  for (const v of tick(x0, x1, 6)) { g.beginPath(); g.moveTo(X(v), T); g.lineTo(X(v), H - B); g.stroke(); g.fillText(String(+v.toPrecision(4)), X(v) - 12, H - B + 20); }
  for (const v of tick(y0, y1, 5)) { g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(W - Rm, Y(v)); g.stroke(); g.fillText(String(+v.toPrecision(4)), 4, Y(v) + 5); }
  if (o.xlabel) g.fillText(o.xlabel, W - Rm - g.measureText(o.xlabel).width, H - 4);
  if (o.ylabel) g.fillText(o.ylabel, L + 6, T + 16);
  for (const s of series) {
    g.strokeStyle = s.color || '#ffb45e'; g.lineWidth = s.width || 2.2; g.setLineDash(s.dash ? [8, 6] : []);
    g.beginPath(); let st = false;
    for (let i = 0; i < s.x.length; i++) { if (!isFinite(s.y[i])) { st = false; continue; } const px = X(s.x[i]), py = Y(s.y[i]); if (!st) { g.moveTo(px, py); st = true; } else g.lineTo(px, py); }
    g.stroke(); g.setLineDash([]);
  }
  if (o.marks) for (const m of o.marks) { g.fillStyle = m.color || '#fff'; g.beginPath(); g.arc(X(m.x), Y(m.y), 6, 0, 7); g.fill(); }
  if (o.vline != null) { g.strokeStyle = 'rgba(255,255,255,0.6)'; g.beginPath(); g.moveTo(X(o.vline), T); g.lineTo(X(o.vline), H - B); g.stroke(); }
  if (o.legend) { let yy = T + 18; for (const s of series) if (s.name) { g.fillStyle = s.color; g.fillRect(W - Rm - 210, yy - 10, 18, 4); g.fillStyle = 'rgba(255,255,255,0.75)'; g.fillText(s.name, W - Rm - 186, yy - 2); yy += 22; } }
}
const fmtRow = (k, exp, meas, ok, note = '') => `<tr><td>${k}</td><td class="n">${exp}</td><td class="n">${meas}</td><td class="${ok == null ? '' : ok ? 'ok' : 'bad'}">${ok == null ? '' : ok ? '✓' : '✗'}</td><td style="color:var(--faint);font-size:11px">${note}</td></tr>`;
const TBL_HEAD = '<table><tr><th>量</th><th style="text-align:right">公式 / 独立计算</th><th style="text-align:right">本页测得</th><th></th><th>说明</th></tr>';

/* ---------- 1. 光线追踪的粒子：信标的爱因斯坦环 ---------- */
function ringExact(Rc, Ds) {    // 史瓦西轨道方程 dφ/du 的数值积分（独立于光线着色器）：求从相机到信标恰好扫过 π 的那条光线
  const I = (u0, ua) => {
    const W = Math.sqrt(u0 - ua), N = 600; let s = 0;
    for (let i = 0; i <= N; i++) {
      const w = W * i / N, wt = (i === 0 || i === N) ? 1 : (i % 2 ? 4 : 2);
      s += wt * 2 / Math.sqrt(2 * u0 - 6 * u0 * u0 + w * w * (6 * u0 - 1) - 2 * w * w * w * w);
    }
    return s * W / N / 3;
  };
  const uc = 1 / Rc, us = 1 / Ds;
  let lo = Math.max(uc, us) * 1.000001, hi = 1 / 3 - 1e-7;
  for (let k = 0; k < 70; k++) { const m = 0.5 * (lo + hi); if (I(m, uc) + I(m, us) < Math.PI) lo = m; else hi = m; }
  const u0 = 0.5 * (lo + hi), b = 1 / Math.sqrt(u0 * u0 - 2 * u0 * u0 * u0);
  return { theta: Math.asin(b * Math.sqrt(1 - 2 / Rc) / Rc) * R2D, b, rmin: 1 / u0 };
}
function ringMeasure(Rc, Ds) {  // 用画面的同一个积分着色器：沿 tanY = 0 找“光线经过信标”的那一点
  const st = { spin: 0, camR: Rc, camIncl: 90, camAz: 0, disk: false };
  const beacon = [{ pos: [-Ds, 0, 0], sigma: 0.3, col: [1, 1, 1, 1] }];
  const edge = edgeScan(st, 0, 2 * Math.sqrt(27) / Rc + 0.01);
  let lo = edge * 1.002, hi = Math.min(Math.tan(80 * D2R), edge * 40);
  for (let pass = 0; pass < 4; pass++) {
    const N = 128, rays = [];
    for (let i = 0; i < N; i++) rays.push([lo + (hi - lo) * i / (N - 1), 0]);
    const res = trc(st, rays, { particles: beacon, wantDmin: true });
    let k = 0; for (let i = 1; i < N; i++) if (res[i].dmin < res[k].dmin) k = i;
    lo = rays[Math.max(0, k - 2)][0]; hi = rays[Math.min(N - 1, k + 2)][0];
  }
  return Math.atan(0.5 * (lo + hi)) * R2D;
}
const XP_RING = {
  title: '光线追踪的粒子：信标的爱因斯坦环',
  Rc: 30, Ds: 30, res: null,

    return `<div class="note" style="margin-top:0">粒子是光线追踪的一部分：积分循环的每一步都检查光线线段到粒子的距离并累加高斯光斑。把一个信标放在黑洞<b>正后方</b>，画面上就出现以黑洞为中心的爱因斯坦环（主环之内还有更暗的次级环）。</div>

  curve(rs, incl, lensing) {

      fmtRow('啁啾质量 M<sub>c</sub>（由 m₁、m₂ 算）', '(m₁m₂)<sup>3/5</sup>/(m₁+m₂)<sup>1/5</sup>', McCalc.toFixed(2) + ' M☉', null, `GWTC-1 给的是后验中位数 ${Mc}（不等于用中位数代入的结果）`),
      fmtRow('f(τ = 0.1 s)，源参考系', '44.0 Hz', this.fchirp(0.1, Mc).toFixed(1) + ' Hz', Math.abs(this.fchirp(0.1, Mc) / 44.0 - 1) < 0.01, `M<sub>c</sub> = ${Mc} M☉`),
      fmtRow('f(τ = 0.1 s)，地球上', '41.7 Hz', this.fchirp(0.1, McD).toFixed(1) + ' Hz', Math.abs(this.fchirp(0.1, McD) / 41.7 - 1) < 0.01, `(1+z)M<sub>c</sub> = ${McD.toFixed(2)} M☉`),
      fmtRow('f = 35 Hz 时距并合 τ，源 / 地球', '0.185 s / 0.160 s', `${this.tauOf(35, Mc).toFixed(3)} s / ${this.tauOf(35, McD).toFixed(3)} s`, Math.abs(this.tauOf(35, Mc) / 0.185 - 1) < 0.01 && Math.abs(this.tauOf(35, McD) / 0.160 - 1) < 0.01, '旋近公式不能一直用到并合'),
      fmtRow('35 Hz → ISCO 的引力波周数（地球）', '实测约 8 个周期到峰值', ncyc(35, fISCO / (1 + z), McD).toFixed(1), null, `ISCO（总质量 ${Mt.toFixed(1)} M☉）处引力波频率：源 ${fISCO.toFixed(1)} Hz / 地球 ${(fISCO / (1 + z)).toFixed(1)} Hz`),
      fmtRow('铃宕频率（2,2,0 模），地球上', '实测约 250 Hz', (q.f / (1 + z)).toFixed(1) + ' Hz', Math.abs(q.f / (1 + z) / 250 - 1) < 0.1, `源参考系 ${q.f.toFixed(1)} Hz；Mω = ${q.Mw.toFixed(4)}（Berti 等 2006 拟合）；衰减时间 ${(q.tau * 1000 * (1 + z)).toFixed(2)} ms`),
      fmtRow('辐射掉的能量', '(m₁ + m₂ − M<sub>f</sub>)c²', `${(m1 + m2 - Mf).toFixed(1)} M☉c² = ${fmtSig(Erad, 3)} J`, null, ''),
      fmtRow('并合产物视界 / 顺行 ISCO', '', `${fmtSig(rd.horizon * PHYS.rgKmPerMsun * Mf, 4)} km / ${fmtSig(rd.iscoPro * PHYS.rgKmPerMsun * Mf, 4)} km`, null, `a = ${af}：r<sub>h</sub> = ${rd.horizon.toFixed(3)} M，r<sub>isco</sub> = ${rd.iscoPro.toFixed(3)} M`)
    ];
    $('xgOut').innerHTML = TBL_HEAD + rows.join('') + '</table>';
    // 示意波形（地球参考系）：旋近段用啁啾公式，过 ISCO 后平滑过渡到铃宕
    const sr = 4096, fI = fISCO / (1 + z), fR = q.f / (1 + z), tauD = q.tau * (1 + z);
    const t0 = -0.28, tI = -this.tauOf(fI, McD);
    const ts = [], hs = [], fs = [];
    let ph = 0, prevF = this.fchirp(-t0, McD);
    for (let i = 0; ; i++) {
      const t = t0 + i / sr; if (t > 0.04) break;
      let f, A;
      if (t < tI) { f = this.fchirp(-t, McD); A = Math.pow(f / fI, 2 / 3); }
      else if (t < 0) { const x = (t - tI) / (-tI); f = fI + (fR - fI) * x * x * (3 - 2 * x); A = 1 + 0.6 * x; }
      else { f = fR; A = 1.6 * Math.exp(-t / tauD); }
      ph += 2 * Math.PI * 0.5 * (f + prevF) / sr; prevF = f;
      ts.push(t); hs.push(A * Math.cos(ph)); fs.push(f);
    }
    this.wave = { ts, hs, fs, sr, tI };
    plotXY($('xgPlot'), [{ x: ts, y: hs, color: '#7fd4ff', width: 1.4, name: 'h(t)（示意，地球参考系）' }], { xlabel: 't − t_merger (s)', ylabel: '应变（归一）', legend: true, ylim: [-2, 2] });
    this.drawOrbit(0);
  },
  drawOrbit(tt) {
    const cv = $('xgOrb'); if (!cv || !this.wave) return;
    const g = cv.getContext('2d'), W = cv.width, H = cv.height; g.clearRect(0, 0, W, H);
    const W2 = this.wave; const i = clamp(Math.round((tt - W2.ts[0]) * W2.sr), 0, W2.ts.length - 1);
    const f = W2.fs[i], t = W2.ts[i], Mt = this.m1 + this.m2;
    g.fillStyle = 'rgba(255,255,255,0.7)'; g.font = '18px sans-serif';
    if (t < 0) {
      // 开普勒：轨道频率 = f_GW / 2，间距 a = (G M / ω²)^(1/3)
      const om = Math.PI * f * (1 + this.z), aKm = Math.cbrt(PHYS.GMsun * Mt / (om * om)) / 1000;
      const sc = Math.min(1, aKm / 1200) * 90 + 6, ang = Math.PI * 2 * (i / W2.sr) * f * 0.5 + 0;
      const q = this.m2 / (this.m1 + this.m2), cx = W / 2, cy = H / 2;
      const ph = W2.hs.length ? Math.atan2(W2.hs[i], 1) : 0;
      const A1 = Math.PI * 2 * 0.5 * (W2.fs.slice(0, i + 1).reduce((x, y) => x + y, 0) / W2.sr);
      g.fillStyle = '#000'; g.strokeStyle = '#ffb45e'; g.lineWidth = 2;
      for (const [m, s, r] of [[this.m1, 1, q], [this.m2, -1, 1 - q]]) { const x = cx + s * Math.cos(A1) * sc * r * 2, y = cy + s * Math.sin(A1) * sc * r * 0.5; g.beginPath(); g.arc(x, y, 5 + m / 6, 0, 7); g.fill(); g.stroke(); }
      g.fillStyle = 'rgba(255,255,255,0.75)'; g.fillText(`t = ${t.toFixed(3)} s · f_GW = ${f.toFixed(1)} Hz · 间距 ≈ ${aKm.toFixed(0)} km（开普勒，源参考系）`, 16, 26);
    } else {
      g.fillStyle = '#000'; g.strokeStyle = '#7fd4ff'; g.lineWidth = 2; g.beginPath(); g.arc(W / 2, H / 2, 16, 0, 7); g.fill(); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.75)'; g.fillText(`并合后 ${(t * 1000).toFixed(1)} ms：铃宕 ${f.toFixed(0)} Hz`, 16, 26);
    }
  },
  play(pitch) {
    if (!this.wave) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) { toast('此浏览器不支持 WebAudio'); return; }
      this.ac = this.ac || new AC();
      const sr = this.ac.sampleRate, W2 = this.wave, dur = W2.ts.length / W2.sr, n = Math.floor(dur * sr);
      const buf = this.ac.createBuffer(1, n, sr), d = buf.getChannelData(0);
      let ph = 0;
      for (let i = 0; i < n; i++) {
        const k = Math.min(W2.ts.length - 1, Math.floor(i / sr * W2.sr)), f = W2.fs[k] * pitch;
        const t = W2.ts[k], A = t < W2.tI ? Math.pow(W2.fs[k] / W2.fs[W2.fs.length - 1], 2 / 3) * 0.9 : t < 0 ? 0.9 : 0.9 * Math.exp(-t / 0.004);
        ph += 2 * Math.PI * f / sr; d[i] = 0.5 * A * Math.sin(ph) * Math.min(1, i / (0.02 * sr));
      }
      const src = this.ac.createBufferSource(); src.buffer = buf; src.connect(this.ac.destination); src.start();
      this.playT = 0; this.playDur = dur;
    } catch (e) { toast('音频播放失败：' + e.message); }
  },
  update(dt, fx) {
    if (this.playT >= 0 && this.wave) { this.playT += dt; this.drawOrbit(this.wave.ts[0] + this.playT); if (this.playT > this.playDur) this.playT = -1; }
  },
  leave() { }
};

const EXTRAS = {
  cur: null, snap: null,
  list: { ring: XP_RING, hot: XP_HOT, micro: XP_MICRO, fall: XP_FALL, gw: XP_GW },
  init() {
    const names = { ring: '① 粒子的爱因斯坦环', hot: '② 热斑与光变曲线', micro: '③ 微引力透镜', fall: '④ 跳进视界', gw: '⑤ 双黑洞并合 · 引力波' };
    const box = $('extraBtns');
    for (const k of Object.keys(this.list)) { const b = document.createElement('button'); b.className = 'tbtn'; b.textContent = names[k]; b.onclick = () => this.open(k); box.appendChild(b); }
    const n = document.createElement('div'); n.className = 'note'; n.textContent = '每个实验都会临时改动主场景；关闭窗口即恢复进入前的状态。'; box.appendChild(n);
    WIN_HOOKS.winExtra = () => this.exit();
  },
  open(k) {
    if (this.cur) this.exit(true);
    this.snap = getState(); this.cur = k;
    const X = this.list[k];
    $('extraTitle').textContent = X.title; $('extraBody').innerHTML = X.html(); X.bind();
    openWin('winExtra');
    try { X.enter(); } catch (e) { console.error(e); }
  },
  exit(silent) {
    if (!this.cur) return;
    const X = this.list[this.cur];
    try { X.leave(); } catch (e) { }
    const keep = X.keep; X.keep = false;
    this.cur = null;
    if (this.snap) { const s = this.snap; if (keep) { delete s.preset; delete s.spin; } applyState(s); }
    APP.fallLock = false; APP.camMin = 3;
    if (!silent) $('winExtra').classList.remove('open');
  },
  update(dt, fx) { if (this.cur) this.list[this.cur].update(dt, fx); },
  panel() { if (this.cur && this.list[this.cur].panel) this.list[this.cur].panel(); },
  traceExtra() { return this.cur === 'fall' ? XP_FALL.traceExtra() : {}; }
};

startApp();
</script>
