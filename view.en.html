<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>View Work · Solar System Model Comparison</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="viewer">
  <div class="vbar">
    <a class="back" href="index.en.html">← Back</a>
    <h1 id="ttl">—</h1>
    <span class="grp" id="grp">—</span>
    <span id="tags" style="display:flex;gap:6px"></span>
    <span class="sp"></span>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button class="btn" id="reload">Reload</button>
    <a class="btn" id="raw" target="_blank" rel="noopener">Open in new tab</a>
    <a class="btn" id="dl" download>Download source</a>
  </div>
  <div class="stage" id="stage"></div>
</div>

<script src="assets/data.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
  const S=window.SITE, $=S.$;
  const id=new URLSearchParams(location.search).get('w');
  const w=S.byId(id);
  const stage=$('#stage');

  if(!w){
    stage.innerHTML='<div class="gate"><div class="box"><h2>Work not found</h2>'+
      '<p>The link may be incomplete.</p><a class="go" href="index.en.html">Back to home</a></div></div>';
    throw 0;
  }

  const workTitle=S.workText(w,'title');
  const workNote=S.workText(w,'note');
  const workIssue=S.workText(w,'issue');
  const fixDescription=S.workText(w,'fix.what');
  const groupLabel=w.group==='A'?'One-line prompt':'Detailed specification';

  document.title=w.model+' · '+groupLabel;
  $('#ttl').textContent=w.model;
  if(workTitle) $('#ttl').title=workTitle;
  const g=$('#grp'); g.textContent=groupLabel;
  g.className='grp '+(w.group==='A'?'a':'b');
  $('#raw').href=w.file; $('#dl').href=w.file;
  $('#dl').setAttribute('download',w.id+'.html');

  S.detect();
  const risk=S.workRisk(w);
  $('#tags').innerHTML=S.chips(w,risk).replace('<div class="chips">','').replace('</div>','');

  const bars=[];
  if(w.net&&w.net.length) bars.push(['net',
    'This work loads resources at runtime from '+S.esc(w.net.join(', '))+'. It will not display correctly offline or on a restricted network.']);
  if(workIssue) bars.push(['bad','Known issue · '+S.esc(workIssue)+
    ' — this is the work’s own rendering result, verified in a real browser.']);
  if(workNote) bars.push(['note','• '+S.esc(workNote)]);
  if(w.fix&&fixDescription) bars.push(['fix','A display-only Opus 5 fix is available · '+
    '<a href="'+S.esc(w.fix.file)+'" target="_blank" rel="noopener" title="'+S.esc(fixDescription)+'">Open the fixed version →</a>']);
  bars.forEach(([kind,html])=>{
    const bar=document.createElement('div');
    const c=kind==='bad'?'background:rgba(255,107,107,.08);color:#ffb4b4'
      :kind==='net'?'background:rgba(255,201,120,.07);color:var(--gold)'
      :kind==='fix'?'background:rgba(127,216,255,.06);color:var(--B)'
      :'background:rgba(140,160,210,.06);color:var(--dim)';
    bar.style.cssText='padding:10px 18px;font-size:12.5px;border-bottom:1px solid var(--line);'+c;
    bar.innerHTML=(kind==='net'?'⚠ Network required · ':kind==='bad'?'⚠ ':'')+html;
    stage.parentNode.insertBefore(bar,stage);
  });

  let frame=null;
  function load(){
    unload();
    stage.insertAdjacentHTML('beforeend',
      '<div class="gate" id="ld"><div class="box"><div class="spin"></div>'+
      '<p>Loading '+S.esc(w.model)+' ('+S.kb(w.bytes)+')…</p></div></div>');
    frame=document.createElement('iframe');
    frame.setAttribute('title',w.model+' solar system model');
    frame.onload=()=>{const l=$('#ld');if(l)l.remove();};
    frame.src=w.file;
    stage.appendChild(frame);
  }

  function unload(){
    if(frame){try{frame.src='about:blank';}catch(e){}frame.remove();frame=null;}
    const l=$('#ld');if(l)l.remove();
  }

  function gate(msg,sub){
    stage.innerHTML='<div class="gate"><div class="box"><h2>'+msg+'</h2><p>'+sub+'</p>'+
      '<p style="font-size:12px;color:var(--dim2);margin-top:10px">Size '+S.kb(w.bytes)+
      ' · '+(w.tech==='WebGL2'?'Native WebGL2':S.esc(w.tech))+
      ' · '+(w.weight==='heavy'?'Heavy':w.weight==='medium'?'Medium':'Light')+'</p>'+
      '<button class="go" id="goBtn">Run anyway</button></div></div>';
    $('#goBtn').onclick=load;
  }

  if(risk&&risk.lv==='bad'){
    if(!S.CAP.webgl2&&w.tech!=='Canvas2D'){
      gate('This browser cannot run the work',
        'The work requires WebGL 2, which is unavailable in this browser. Try a recent version of Chrome, Edge, Firefox, or Safari.');
    }else if(w.needsFloat&&!S.CAP.float){
      gate('Your device may not run this work correctly',
        'This work requires the EXT_color_buffer_float floating-point framebuffer extension, which the browser does not support. It is likely to show a blank screen.');
    }else{
      gate('Your device may not run this work smoothly',
        'Measured GPU capacity is low, so this work is expected to be very slow.');
    }
  }else if(risk&&risk.lv==='warn'){
    gate('This work may not run smoothly','The current device may drop frames while running it.');
  }else{
    load();
  }

  $('#reload').onclick=load;
  addEventListener('pagehide',unload);
  addEventListener('beforeunload',unload);
})();
</script>
</body>
</html>
