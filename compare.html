<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>并排对照 · 太阳系模型对比</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="viewer">
  <div class="vbar">
    <a class="back" href="index.html#pairs">← 返回</a>
    <h1 id="ttl">—</h1>
    <span style="font-size:12px;color:var(--dim);white-space:nowrap">同一个模型 · 两种需求形式</span>
    <span class="sp"></span>
    <button class="btn" id="mode">单侧运行：关</button>
    <button class="btn" id="reload">重新加载</button>
  </div>
  <div class="split" id="split">
    <div><span class="lbl a">一句话提示</span><div class="gate" id="gA"></div></div>
    <div><span class="lbl b">详细文档</span><div class="gate" id="gB"></div></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
  const S=window.SITE, $=S.$;
  const pid=new URLSearchParams(location.search).get('p');
  const pair=S.pairs().find(p=>p.a.pair===pid);
  const split=$('#split');

  if(!pair){
    split.innerHTML='<div class="gate"><div class="box"><h2>找不到这组对照</h2>'+
      '<a class="go" href="index.html">回到首页</a></div></div>';
    throw 0;
  }
  document.title=pair.a.model+' · 并排对照';
  $('#ttl').textContent=pair.a.model;
  S.detect();

  const cells=[...split.children];
  const st=[{w:pair.a,cell:cells[0],frame:null},{w:pair.b,cell:cells[1],frame:null}];

  function unload(s){
    if(s.frame){ try{s.frame.src='about:blank';}catch(e){} s.frame.remove(); s.frame=null; }
  }
  function load(s){
    if(s.frame) return;
    const g=$('.gate',s.cell); if(g) g.remove();
    const f=document.createElement('iframe');
    f.setAttribute('title',s.w.model+'（'+(s.w.group==='A'?'一句话':'详细文档')+'）');
    f.src=s.w.file; s.frame=f; s.cell.appendChild(f);
  }
  function gate(s){
    unload(s);
    let g=$('.gate',s.cell);
    if(!g){ g=document.createElement('div'); g.className='gate'; s.cell.appendChild(g); }
    const risk=S.workRisk(s.w);
    g.innerHTML='<div class="box"><h2 style="font-size:15px">'+S.esc(s.w.model)+'</h2>'+
      '<p style="font-size:12.5px">'+(s.w.tech==='WebGL2'?'原生 WebGL2':S.esc(s.w.tech))+
      ' · '+S.kb(s.w.bytes)+' · '+s.w.lines+' 行'+
      (risk?' · <span style="color:var(--gold)">'+risk.t+'</span>':'')+'</p>'+
      '<button class="go">运行这一侧</button></div>';
    $('button',g).onclick=()=>load(s);
  }

  // 单侧模式：任一时刻只保留一个 WebGL 上下文，弱机上更稳
  let single=false;
  function apply(){
    if(single){ st.forEach(gate); }
    else { st.forEach(s=>{ const r=S.workRisk(s.w);
      (r&&r.lv==='bad') ? gate(s) : load(s); }); }
  }
  st.forEach(s=>{
    s.cell.addEventListener('mouseenter',()=>{
      if(!single) return;
      st.forEach(o=>{ if(o!==s) unload(o), gate(o); });
      load(s);
    });
  });
  $('#mode').onclick=()=>{ single=!single;
    $('#mode').textContent='单侧运行：'+(single?'开':'关'); apply(); };
  $('#reload').onclick=()=>{ st.forEach(unload); apply(); };

  apply();
  addEventListener('pagehide',()=>st.forEach(unload));
})();
</script>
</body>
</html>
